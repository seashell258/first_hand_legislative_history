<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商港法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

]},{"id":"202110175070000","who":"委員張宏陸等19人","date":"2025-11-28","name":"「商港法第十五條及第六十五條之四條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110175070000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/11/LCEWA01_110411_00040.pdf","proposers":["張宏陸","蔡其昌","吳秉叡"],"ncosign":16,"people":[["張宏陸","民進黨","提案"],["蔡其昌","民進黨","提案"],["吳秉叡","民進黨","提案"],["王美惠","民進黨","連署"],["鍾佳濱","民進黨","連署"],["賴惠員","民進黨","連署"],["陳俊宇","民進黨","連署"],["王義川","民進黨","連署"],["張雅琳","民進黨","連署"],["李坤城","民進黨","連署"],["李柏毅","民進黨","連署"],["黃秀芳","民進黨","連署"],["蘇巧慧","民進黨","連署"],["郭國文","民進黨","連署"],["陳培瑜","民進黨","連署"],["陳亭妃","民進黨","連署"],["林俊憲","民進黨","連署"],["陳冠廷","民進黨","連署"],["黃捷","民進黨","連署"]],"party":[["民進黨",19]],"reason":"本院委員張宏陸、蔡其昌、吳秉叡等19人，鑒於商港安全、航行秩序及國家安全之維護，避免船舶滯留商港，影響船舶作業安全及效率，並有效打擊偽冒識別資料之船舶，爰擬具「商港法第十五條及第六十五條之四條文修正草案」。是否有當？敬請公決。","arts":["第十五條","第六十五條之四"]}],"arts":[{"no":"第八條之一","current":null,"versions":[{"bill":"201110161340500","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十條之一","current":null,"versions":[{"bill":"201110161340500","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（\nInternational Maritime Organization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十一條之一","current":null,"versions":[{"bill":"201110161340500","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十五條","current":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得指定地點令其移泊或疏散他處停泊；未依規定移泊者，得逕行移泊。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","versions":[{"bill":"202110162890000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊或疏散他處停泊；未依規定移泊或疏散他處停泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量漏未將「疏散他處停泊者」納入得逕行移泊之規定，為求文義周延增訂之。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110163090000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110163500000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶長期滯留商港，影響船舶作業安全及調度效率，增訂規定：商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認定持續滯留將妨礙船席調度或港區安全者，得命其於三個月內離港；如未依規定移泊，經逕行完成移泊者，並得於完成移泊後令其於三個月內離港。如船舶無正當理由逾期未離港者，航港局或指定機關得依修正後第六十五條之四第一項規定，沒入該船舶。\n(二)「指定地點令其移泊」文義已涵蓋「疏散他處停泊」，為避免重複，爰刪除「疏散他處停泊」相關文字。\n(三)明確規範：除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，可直接命其於三個月內離港外，其他情形應先指定地點令其移泊。\n二、第二項至第四項未修正。"},{"bill":"202110165310000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)商港區域內停泊之船舶若經認定其持續滯留有妨礙港區安全或調度時，應於三個月內離港。另船舶未依規定移泊而經逕行完成移泊者，增訂移泊後三個月內須離港之規定。如該船舶無正當理由逾期未離港，則依修正條文第六十五條之四規定沒入。\n(二)「指定地點令其移泊」已涵蓋「疏散他處停泊」意涵，故文字爰予刪除。\n二、第二項至第四項未修正。"},{"bill":"202110164190000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，應令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、為打擊偽冒身分船舶，防範陌生船舶威脅港口安全及避免船舶滯留商港，影響船舶作業安全與效率、航行秩序，修正第一項文字，對於船舶滯留商港恐影響船舶作業安全及效率問題，增列商港經營管理組織認定該船舶如有妨礙港區安全或影響船席調度者，應令該船舶於三個月內離港之規定。\n二、另對於逕行移泊者，增訂於完成移泊後命令其於三個月內離港之規定，以維護商港作業安全及效率。\n三、違反本項規定者，依照修正條文六十五條之四第一項規定，如該船舶無正當理由未於所定期限離港者，航港局或指定機關將沒入該船舶。\n四、考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n五、第二項至第四項未修正。"},{"bill":"202110164010000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項，為提升商港作業安全與效率，並解決船舶長期滯留問題，本次修法新增兩項關鍵授權：首先，當船舶持續滯留，經主管機關認定有礙船席調度或港區安全時，可命令該船舶於三個月內離港。其次，對於不服從移泊命令而已遭強制移泊的船舶，亦可在移泊作業完成後，命令其於三個月內離港。若船舶無正當理由，未在前述期限內離港，航港局或指定機關即可依據新增的第六十五條之四第一項規定，逕行沒入該船舶，以確保港區秩序。\n二、其餘未修正。"},{"bill":"202110164920000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110166360000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、關於第一項之修正：\n(一)為避免船舶長期滯留商港，影響作業安全與效率，增訂規定：凡停泊於商港區域之船舶，若經商港經營事業機構、航港局或指定機關認定持續滯留已妨害船席調度或危及港區安全時，得命其於三個月內離港；另如船舶未依規定移泊而由主管機關逕行移泊者，則於完成移泊後仍得命其於三個月內離港。倘若該船在無正當理由下仍未於期限內離港者，將依修正條文第六十五條之四第一項之規定，予以沒入。\n(二)「指定地點令其移泊」本身即包含「疏散至其他地點停泊」之意，為避免文字重複，爰予刪除。\n(三)綜合規範後，除非經商港經營事業機構、航港局或指定機關認定有嚴重妨礙船席調度，或對港區安全構成重大危害者，得命其於三個月內離港外，其餘情形則應指定地點令其移泊，特此敘明。\n二、第二項至第四項則維持原狀，未作修正。"},{"bill":"202110166820000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110166920000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110167070000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為持續滯留有妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊或疏散他處停泊；未依規定移泊或疏散他處停泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、本條為修正條文第六十五條之四（沒入條款）之前置管理措施，為有效防止船舶長期滯留港區或占用泊位，影響商港安全與營運效率，爰修正第一項。\n二、增列「得令其於三個月內離港」之規定，使商港經營事業機構、航港局或指定機關得就滯留或有安全疑慮之船舶，明確設定期限，強化行政執行依據。\n三、為避免船舶以形式性移泊規避管理，明定「完成移泊後仍應於三個月內離港」，確保離港命令貫徹。\n四、增列「疏散他處停泊者」納入可逕行移泊範圍，完善文義並符合實務操作情形。\n五、第二項至第四項未修正，惟配合文字體例作輕微調整，維持既有港區管理權限及費用負擔原則不變。"},{"bill":"202110168530000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110167310000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於二個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於二個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船舶調度或港區安全者，增列得令該船舶於二個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於二個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船舶調度或對港區安全危害重大之情形，得令其於二個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110168100000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、審計部二零二三年中央政府總決算審核報告指出，二零一九年至二零二三年間，我國海底電纜發生外力破壞或推擠受損案件計有三十六件，年平均故障約七件。近年更屢傳出受到中國侵擾，二零二五年一月至二月間於基隆外海的「橫太平洋快速海纜系統」及台澎三號分別遭中國權宜輪拖斷，嚴重影響我國通訊安全，亦造成其他重要基礎建設安全隱患。\n二、為避免船舶滯留商港，影響商港之船舶作業安全及效率，維護國家安全；商港內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全時，增訂得令其於三個月內離港之規定。原條文關於逕行移泊之程序則修正至令其三個月內離港後。\n三、其餘項次未修正。"},{"bill":"202110169630000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110169950000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港或指定地點令其移泊或疏散他處停泊，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項，為避免船舶滯留商港，影響船舶作業安全與效率，增列得令其三個月內離港之規定，另不依規定者將逕行移泊，並於移泊完成後令其三個月內離港。\n二、若船舶無正當理由位於所定期限內離港者，將依規定沒入該船舶。\n三、考量「指定地點令其移泊」，於文義上已涵蓋「疏散他處停泊」，為避免文字規範重複爰予刪除。"},{"bill":"202110170940000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110172210000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊或疏散他處停泊；未依規定移泊或疏散他處停泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量漏未將「疏散他處停泊者」納入得逕行移泊之規定，為求文義周延增訂之。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110172350000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110172640000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"為確保港區作業秩序及船舶調度之順暢，爰於修正第一項，增訂商港經營事業機構、航港局或指定機關，得對長期停泊於商港且影響船席調度或作業安全之船舶，通知限期離港。另對於未依規定移泊而經完成必要移泊之船舶，增列自完成移泊之日起計算限期離港之規定，以利後續管理與調度作業。同時，考量「指定地點令其移泊」之文字已涵蓋「疏散他處停泊」之意，為避免重複，予以刪除。另明確規範，除經商港經營事業機構、航港局或指定機關認有影響船席調度或港區安全之情形，得令其於三個月內離港外，其餘情形應指定地點辦理移泊，以確保港區運作安全與秩序。"},{"bill":"202110172710000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項；第二項至第四項未修正。\n二、為防止船舶長期滯留商港，影響港區作業安全及船席調度效率，爰修正第一項：\n(一)對於停泊於商港區域內之船舶，經商港經營事業機構、航港局或指定機關認定其持續滯留有妨礙船席調度或影響港區安全者，得令其於三個月內離港。另針對未依規定辦理移泊，而由主管機關逕行完成移泊之情形，亦增列可於移泊完成後，命令該船舶於三個月內離港之規定。若該船舶未於規定期限內離港且無正當理由者，航港局或指定機關將依修正條文第六十五條之四第一項規定，予以沒入，以維護港區安全與管理秩序。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。"},{"bill":"202110173850000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"},{"bill":"202110175070000","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港或指定地點令其於指定期限內移泊；未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項。\n二、為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港及增訂移泊期限之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n三、考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n四、第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。"},{"bill":"201110161340500","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\ 准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十五條之一","current":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"201110161340500","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，理由如下：\n(一)近年我國周邊海域因船隻活動造成海底纜線受損事件頻傳。考量海底纜線之型態多元，並非僅指海底電纜，海底輸氣管線係輸送天然氣之重要設備，有強化保護之必要。\n(二)第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。考量因過失毀壞或以其他非法方法危害海底輸氣纜線之功能正常運作，對於國內天然氣穩定供應亦將產生嚴重影響；復以海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉及避免前述情形發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項，內容未修正。\n四、為維護國內整體供氣安全穩定，對侵害第一項所定輸儲設備（包括天然氣進口事業之海底輸氣管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六十五條之四","current":null,"versions":[{"bill":"202110162890000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110163090000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110163500000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未妥善處置船舶而衍生長期棄置問題，於第一項明定：船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包括命其於三個月內離港，或遭逕行移泊後再命其於三個月內離港之情形），如無正當理由逾期未離港者，不問該船舶屬於何人所有，由航港局或指定機關逕予沒入。\n三、鑒於部分外國商船管理不善，常見偽冒船舶登記或船舶證書等識別資料，或因發生海事案件積欠船員薪資而船東不出面處理，形成所謂「三無船舶」（無船籍、無證書、無船舶登記），造成長期滯留我國商港、積欠港埠費用，並影響船席調度與港區安全。爰於第二項前段增訂：針對依第六十條第一項規定遭留置，且經查核其船舶登記等識別資料與實際情形不符之外國商船，應命船舶所有人或其代理人於三個月內補正相關識別資料。又考量國際間船旗國及其認可驗船機構均設有網路聯絡窗口，並可透過電子郵件迅速補發相關證明文件，如船舶無法取得船旗國或驗船機構核發之證書證明其所有權及適航性，即顯示其有極高風險成為惡意破壞我國商港設施之工具。為防止此類高風險船舶長期滯留，影響航行安全及港區秩序，爰於第二項後段規定：對此類船舶不問其所有權歸屬，得予沒入，以符合比例原則，並有效防止再犯及嚇阻類似不法行為。"},{"bill":"202110165310000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問其所有權屬，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問其所有權屬，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為防範不法船舶滯留，維護港區安全與秩序，並使具嚇阻效果，爰增訂本條。\n三、為避免船舶所有人怠於處理導致船舶長期棄置，增訂船舶無正當理由逾期未依規定離港者，不問其所有權屬，由航港局或指定機關沒入之。\n四、針對「三無船舶」（無船籍、無證書、無船舶登記），規定須於三個月內補正相關船舶識別資料，屆期未補正者，不問其所有權屬，由航港局或指定機關沒入之。"},{"bill":"202110164190000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，無論其所有權人為何，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查其船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令其所有人或代理人於三個月內補正所有權證明文件或相關船舶證書；屆期未補正者，該外國商船不論其所有權人為何，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為避免船舶所有人未處置而致長期棄置，爰於第一項規定，經航港局或指定機關依第十五條命其限期離港（包括命其於三個月內離港或遭逕行移泊後再令其於三個月內離港）而無正當理由未離港者，不論船舶所有人為何，相關機關予以沒入。\n三、鑒於部分外國商船因管理不善或偽造登記與證書，致成「三無船舶」（無船籍、無證書、無登記），長期滯留我國商港、欠繳費用並危及港區安全，爰規定：對經航港局或指定機關依第六十條第一項留置，且查明船舶識別資料與實際情形不符者，應命其所有人或代理人在三個月內補正相關識別資料；若無法取得船旗國或認可驗船機構所核發之證明以證明所有權或適航性，且認有危及港區或航行安全之虞，得不問所有權而予以沒入。上述措施應注意比例原則，並以防止再犯及嚇阻類似不法行為為目的。"},{"bill":"202110164010000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為了解決船舶所有人長期棄置船舶於商港所衍生的管理問題，本條明定凡經主管機關依第十五條規定命令限期離港，而無正當理由卻逾期未離港者，航港局或指定機關即可依法予以沒入，且此處分不因船舶所有權歸屬而受影響。\n三、鑒於部分管理不善的外國商船，常利用偽冒的船舶文書與識別資料滯留我國商港（俗稱「三無船舶」），不僅積欠港埠費用，更對船席調度與港區安全構成嚴重威脅。為此，本條建立兩階段處理機制。第一，限期補正：對於依第六十條規定留置，且經查證船舶識別資料與實際不符的外國商船，主管機關應命令其所有人或代理人於三個月內補正相關文件。第二，屆期沒入：考量現今國際間船籍國與驗船機構均可透過網路迅速補發證明文件，若船舶屆期仍無法提出有效的所有權及適航性證明，即可合理推定該船舶對我國港口設施具有高度潛在風險。為免其滯留領海、影響航行安全或伺機破壞，爰授權主管機關予以沒入，不問其所有權歸屬。"},{"bill":"202110164920000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、第一項定明船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。以減少船舶所有人未處置船舶而衍生長期棄置問題。\n三、第二項定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。\n四、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，第二項之作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110166360000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為避免船舶所有人怠於處置而造成長期棄置情形，爰於第一項規範：當商港經營事業機構、航港局或其指定機關依第十五條命該船於一定期限內離港（包括命其於三個月內離港，或於逕行移泊後命其於三個月內離港）而無正當理由未於期限內離港者，無論該船為何人所有，均由航港局或其指定機關辦理沒入。\n三、鑑於部分外國商船因管理疏失而持有偽冒之船舶登記或證書，或捲入海事糾紛致欠付船員薪資，船東不願處理，形成所謂三無船舶，常導致船舶長期滯留商港並累積港埠費用，甚至影響船席調度與港區安全。爰於第二項前段明定：對依第六十條第一項留置且經查發現船舶登記等識別資料與實際情形不符之外國商船，應令其船舶所有人或代理人在三個月內補正相關識別資料。另考量船旗國及驗船機構多已設置網路聯絡窗口，且船舶證書可透過電子通訊迅速補發，倘若船舶無法取得船旗國或驗船機構所發之證明其所有權及適航性之文件，則該船極可能成為危害我國商港之風險工具。為防止其繼續滯留於我國領海並可能伺機破壞港區設施，後段規定對此類船舶不問所有權歸屬予以沒入，上述措施應符比例原則，且有助於阻絕再犯並對類似不法行為形成實質威懾，爰一併說明。"},{"bill":"202110166820000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110166920000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110167070000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於期限內離港者，不問其所有權人為何，得由航港局或行政院指定之機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或行政院指定之機關應命船舶所有人或其代理人於三個月內補正相關文件與正當理由；屆期未補正者，該外國商船不問所有權人為何，得由航港局或行政院指定之機關沒入之。","note":"一、本條新增。\n二、第一項規定：為防止船舶長期滯留商港、占用泊位或妨礙船席調度，明定經航港局或行政院指定機關依第十五條命令限期離港而無正當理由未離港者，得依法沒入，不問其所有權人。此舉可防止船舶棄置與長期佔用港區情形，提升商港營運效能。\n三、第二項規定：針對依第六十條留置之外國商船，如發現其登記、證書或IMO編號等識別資料與實際不符者，航港局或指定機關應令其於三個月內補正。若屆期未補正，視為無合法來源或管理失能船舶（俗稱「三無船舶」），得沒入處置，以防範其滯留港區、積欠港埠費用或危及港口安全。\n四、考量國際間船旗國及驗船機構可即時線上核發相關證書，若船舶於合理期限內仍無法取得文件，顯示其風險極高，可能成為非法活動或破壞我國港區設施之工具，故授權主管機關沒入，以維護國家安全及海域秩序。"},{"bill":"202110168530000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110167310000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於二個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為解決船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於二個月內離港，及遭逕行移泊後令其二個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船舶調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於二個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，若船舶無法取得船旗國及驗船機構所核發之船舶證書，以證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110168100000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶未妥善處置遭長期棄置之問題，第一項針對經商港經營事業機構、航港局或指定機關依本法第十五條之規定令其限期離港，無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入。\n三、部分外國船舶因管理不善，屢傳出有持偽冒船舶登記、船舶證書等資料（即三無船舶），因無法改善缺失，以致船舶長期滯留於我國商港，積欠港埠費用，妨礙船席調度；更甚者，影響商港安全，形成國家安全隱患。爰於第二項增訂，針對航港局或指定機關依本法第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船；應令該外國商船之船舶所有人或其代理人於三個月內補正船舶相關識別資料之規定，為避免非法船舶滯留領海，影響商港安全，明定對此類船舶不問屬於何人所有予以沒入，以嚇阻非法船舶之不法行為。"},{"bill":"202110169630000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110169950000","text":"船舶經商港經營事業機購、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條之一規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人為處置船舶而衍生長期棄置問題，於第一項金對船舶經商港經營事業機構、航港局或指定機關依規定令其限期離港，而無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入。\n三、針對「三無船舶」（無船籍、無證書、無船舶登記）長期滯留我國商港，造成船席調度困難與影響港區安全，增訂令其補正之規定，若逾期不補正者，不問船舶屬於何人，沒入之，俾利維護我商港安全與嚇阻相關船舶再犯。"},{"bill":"202110170940000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110172210000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110172350000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110172640000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定通知限期離港，無正當理由未於期限內離港者，不問其所有權歸屬，由航港局或指定機關辦理沒入。\n依第六十條第一項規定留置之外國商船，經查其船舶登記、船舶證書、國際海事組織船舶識別編號或其他識別資料與實際情形不符者，航港局或指定機關應通知其船舶所有人或代理人於三個月內補正相關文件或資料；屆期未補正者，不問其所有權歸屬，由航港局或指定機關辦理沒入。","note":"一、本條新增。\n二、為處理部分船舶長期滯留商港、未依規移離所造成之管理問題，增訂經商港經營事業機構、航港局或指定機關依第十五條命令限期離港（含命令三個月內離港及完成移泊後之三個月期限），而未於期限內離港且無正當理由者，得由航港局或指定機關依程序辦理後續處置。另針對依第六十條第一項留置且經查船舶登記或識別資料與實際情形不符之外國商船，增訂應於三個月內補正或提供相關證明文件之規定；如未能於期限內補正或提出證明者，得依程序辦理後續處理，以明確港區管理程序，強化船舶留置及後續處理機制，並兼顧制度執行效率與管理妥適性。"},{"bill":"202110172710000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，持有偽冒之船舶登記或證書，或發生海事案件、積欠船員薪資而船東不願處理，形成「三無船舶」（無船籍、無證書、無船舶登記）情形，致使船舶長期滯留商港，積欠港埠費用，並影響船席調度及港區安全。爰於第二項前段明定，針對依第六十條第一項規定留置，且經查其船舶識別資料與實際情形不符之外國商船，應令其船舶所有人或代理人於三個月內補正相關識別資料。\n四、又考量船旗國及認可驗船機構均設有網路聯絡管道，並可迅速補發相關證書；若船舶仍無法取得合法證明文件，即顯示其具高度風險，可能危害我國商港安全。爰於第二項後段明定，對此類船舶不問其所有權歸屬，得予以沒入，以防範不法情事再生，確保商港安全與管理秩序，並符合比例原則。"},{"bill":"202110173850000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"202110175070000","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，航港局或指定機關得處船舶所有人或船長新臺幣三十萬元以上一百五十萬元以下罰鍰。\n前項經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、第二項後段，爰參酌漁港法第十八條第一項第一款、第二款及第二十條立法體例，對依第六十條第一項規定留置之非「三無船舶」的外國商船增訂罰則。\n三、第三項為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第三項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"},{"bill":"201110161340500","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"}],"changed":true,"final":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","finalWhy":"","review":{"note":"照行政院提案通過","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。"}},{"no":"第七十一條之一","current":"以竊取、毀壞或其他非法方法危害裝置容量一百萬瓩以上之水力發電廠、一百二十萬瓩以上之火力發電廠之主要發電設備、燃料輸儲設備、控制室、開關場、資通訊機房，或特高壓以上輸電、變電設備或調度室之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"201110161340500","text":"以竊取、毀壞或其他非法方法危害裝置容量一百萬瓩以上之水力發電廠、一百二十萬瓩以上之火力發電廠之主要發電設備、燃料輸儲設備、控制室、開關場、資通訊機房，或特高壓以上輸電、變電設備、調度室，或海底電力電纜之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海底電力電纜之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、因應近期離岸風力發電發展及國內電力傳輸所需，為避免海底電力電纜受到侵害致影響電力傳輸及供應，爰於第一項新增「海底電力電纜」為保護客體，以強化保護範圍，穩定供電。凡由發電業及輸配電業等電業所設置之海底電力電纜，均屬保護對象，不限於特高壓以上者，併予補充。\n二、第二項及第三項未修正。\n三、考量海底電力電纜對電力傳輸及供應之重要性，如因過失毀壞或以其他非法方法危害其功能之正常運作，對於國內電力穩定供應將產生嚴重影響；又考量海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉並避免前述情形發生，爰參考電信管理法第七十二條第四項規定增訂第四項，明定過失犯之刑罰規範。\n四、第四項移列為第五項，內容未修正。\n五、為維護供電安全穩定，對故意侵害第一項所定電業設備（包括海底電力電纜）之犯罪態樣，就供其犯罪用之工具、船舶等有不問屬何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第七十二條","current":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","versions":[{"bill":"201110161340500","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"201110161340500","text":"自用遊艇，除本章、第一章、第十五條之一第二項、第二十七條第一項、第二十八條、第二十八條之一、第二十八條之二第一項、第二十八條之三第一項、第二十九條第一項、第三十條第一項、第三十二條、第四十條第一項、第四十一條第一項與第二項前段、第八十四條第一項、第八十九條第一項、第八十九條之一、第九十一條、第九十二條第一項與第三項、第九十三條至第九十五條、第九十七條第一項第一款與第三項及第九十九條至第一百零二條規定外，不適用本法規定。\n非自用遊艇，除本章、第一章、第十五條之一第二項、第二十七條第一項、第二十八條、第二十八條之一、第二十八條之二第一項、第二十八條之三第一項、第二十九條第一項、第三十條第一項、第三十二條、第四十條第一項、第四十一條第一項與第二項前段、第五章、第八十四條第一項、第八十九條第一項、第八十九條之一、第九十一條、第九十二條第一項與第三項、第九十三條至第九十五條、第九十七條第一項第一款與第三項及第九十九條至第一百零二條規定外，不適用本法規定。\n自用遊艇及非自用遊艇準用第二十八條之二第二項規定，並應將遊艇證書繳回航政機關。","note":"一、依現行規定，自用或非自用遊艇均適用第一章規定，爰亦適用本次增訂之修正條文第八條之一、第十條之一及第十一條之一，配合修正條文第八十九條之一係規範違反前開規定之罰則，爰增訂第一項自用遊艇及第二項非自用遊艇適用本法規定之範圍。\n二、第三項未修正。"}],"changed":false,"final":"未依第十二條規定繳納商港服務費或應償還損壞商港區域內各項設施修復費，經限期繳納，屆期不繳納者，得勒令停止作業或禁止船舶入、出港。但經提供相當擔保者，不在此限。\n商港區域內各項設施損害事故之證物保全，依運輸事故調查法相關規定辦理。","finalWhy":null,"review":null},{"no":"第八十二條","current":"小船，除本章、第一章、第十五條之一、第二十七條第一項、第二十八條、第二十八條之一第一項與第三項、第二十八條之二第一項、第二十八條之三、第四十條第一項、第四十一條第一項與第二項前段、第八十九條第一項、第九十條、第九十二條第一項與第三項、第九十三條、第九十四條、第九十七條第一項第一款及第九十八條至第一百零二條規定外，不適用本法之規定。\n小船準用第二十八條之二第二項規定，並應將小船執照繳回航政機關。\n載客小船準用第三十四條之一規定。","versions":[{"bill":"201110161340500","text":"小船，除本章、第一章、第十五條之一、第二十七條第一項、第二十八條、第二十八條之一第一項與第三項、第二十八條之二第一項、第二十八條之三、第四十條第一項、第四十一條第一項與第二項前段、第八十九條第一項、第八十九條之一、第九十條、第九十二條第一項與第三項、第九十三條、第九十四條、第九十七條第一項第一款及第九十八條至第一百零二條規定外，不適用本法之規定。\n小船準用第二十八條之二第二項規定，並應將小船執照繳回航政機關。\n載客小船準用第三十四條之一規定。","note":"一、第一項規定小船適用第一章規定，爰適用本次增訂之修正條文第八條之一、第十條之一及第十一條之一，配合修正條文第八十九條之一係規範違反前開規定之罰則，爰增列該條文為小船適用之範圍。\n二、第二項及第三項未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第八十九條之一","current":null,"versions":[{"bill":"201110161340500","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第九十七條之一","current":"以竊取、毀壞或其他非法方法危害與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水必要設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n第一項所定與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水之必要設施、設備，由中央主管機關會商相關機關及自來水事業，衡酌其規模、供水量、所在地區、影響民眾生命、身體、財產安全程度及影響經濟產業程度等因素公告之；其異動時，亦同。","versions":[{"bill":"201110161340500","text":"以竊取、毀壞或其他非法方法危害自來水事業之海底送水管線、與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水必要設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害自來水事業之海底送水管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪所用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所定與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水之必要設施、設備，由中央主管機關會商相關機關及自來水事業，衡酌其規模、供水量、所在地區、影響民眾生命、身體、財產安全程度及影響經濟產業程度等因素公告之；其異動時，亦同。","note":"一、考量自來水為民生必要資源，其設備之運作攸關人民生命、身體及財產之安全，如自來水事業之海底送水管線遭侵害，將對民生社會安定、公共及國家安全造成嚴重影響，為強化對海底送水管線之保護，於第一項增訂自來水事業之海底送水管線為保護客體。\n二、第二項及第三項未修正。\n三、考量海底送水管線對民生供水之重要性，如因過失毀壞或以其他非法方法危害其功能之正常運作，對於國內民生用水穩定供應將產生嚴重影響；又考量海底送水管線布建之相關圖資已規劃納入海洋委員會之國家海洋資料庫及共享平台，從事海域航行或相關工作者應能知悉並避免造成侵害，爰參考電信管理法第七十二條第四項規定，增訂第四項過失犯之刑罰規範。\n四、第四項移列為第五項，內容未修正。\n五、為維護全國自來水系統正常運作及安全，對第一項所定自來水事業設施、設備（包括自來水事業之海底送水管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n六、第五項移列為第七項，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第一百條","current":"本法關於船長或駕駛之規定，於代理船長、駕駛或執行其職務者準用之。\n代理船長、駕駛或執行其職務者，違反前項準用規定者，依第八十九條至第九十四條、第九十八條或第九十九條規定處罰。\n本法關於船舶所有人於第八條、第二十八條之三、第三十條之一、第三十四條之一、第五十二條第三項、第五十九條第二項、第七十條、第七十四條第二項規定，於船舶租用人準用之。\n船舶租用人違反前項準用規定者，依第八十九條、第九十條、第九十一條第一項、第九十七條、第九十八條或第九十九條規定處罰。","versions":[{"bill":"201110161340500","text":"本法關於船長或駕駛之規定，於代理船長、駕駛或執行其職務者準用之。\n代理船長、駕駛或執行其職務者，違反前項準用規定者，依第八十九條至第九十四條、第九十八條或第九十九條規定處罰。\n本法關於船舶所有人於第八條、第八條之一、第十條之一、第十一條之一、第二十八條之三、第三十條之一、第三十四條之一、第五十二條第三項、第五十九條第二項、第七十條、第七十四條第二項規定，於船舶租用人準用之。\n船舶租用人違反前項準用規定者，依第八十九條、第八十九條之一、第九十條、第九十一條第一項、第九十七條、第九十八條或第九十九條規定處罰。","note":"一、為使船舶租用人亦有應遵循修正條文第八條之一、第十條之一及第十一條之一之義務，並適用相應之罰則，爰修正第三項及第四項。\n二、第一項、第二項未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2025-09-30","stage":"一讀","code":"院會-11-4-2","bill":null,"gazref":"114卷078期5371號 4-4頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110162890000","gazref":"114卷079期5372號一冊 4-5頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110163090000","gazref":"114卷079期5372號一冊 6-6頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110163500000","gazref":"114卷079期5372號一冊 9-9頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110165310000","gazref":"114卷080期5373號一冊 17-17頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110164190000","gazref":"114卷080期5373號一冊 19-19頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110164010000","gazref":"114卷080期5373號一冊 20-21頁"},{"date /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照

  const panel = el('div', {class: 'inbench', hidden: ''});
  let shown = null;
  p.arts.forEach(no => {
    const art = D.arts.find(x => x.no === no);
    const btn = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-expanded': 'false', text: no});
    btn.addEventListener('click', () => {

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');

    if (t.s) {

      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;

        const p = b.bill && propById[b.bill];
        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});

        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }

}

const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});

let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤

  const style = '--k:var(' + color + ')';

  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });

    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      btn.addEventListener('click', async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      });
      acts.append(btn);
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
</html>
