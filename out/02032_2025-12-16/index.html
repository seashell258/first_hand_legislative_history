<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>氣象法 2025 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

reason":"本院委員李柏毅等16人，考量氣象法針對因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，未定有罰則，參酌電信管理法第七十二條第四項，增訂相關罰則，以強化氣象設施或設備安全防護；又為有效嚇阻不法行為，並解決供犯罪用之工具、船舶或其他機械設備之保管及處置問題，爰擬具「氣象法第二十一條之一條文修正草案」。是否有當？敬請公決。","arts":["第二十一條之一"]},{"id":"202110175050000","who":"委員張宏陸等19人","date":"2025-11-28","name":"「氣象法第二十一條之一條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110175050000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/11/LCEWA01_110411_00038.pdf","proposers":["張宏陸","蔡其昌"],"ncosign":17,"people":[["張宏陸","民進黨","提案"],["蔡其昌","民進黨","提案"],["王美惠","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳俊宇","民進黨","連署"],["王義川","民進黨","連署"],["賴惠員","民進黨","連署"],["張雅琳","民進黨","連署"],["李坤城","民進黨","連署"],["黃秀芳","民進黨","連署"],["李柏毅","民進黨","連署"],["吳秉叡","民進黨","連署"],["郭國文","民進黨","連署"],["蘇巧慧","民進黨","連署"],["陳培瑜","民進黨","連署"],["林俊憲","民進黨","連署"],["陳亭妃","民進黨","連署"],["陳冠廷","民進黨","連署"],["黃捷","民進黨","連署"]],"party":[["民進黨",19]],"reason":"本院委員張宏陸、蔡其昌等19人，鑒於近年權宜船舶頻繁破壞我國通訊海纜，危害國家安全，為有效嚇阻破壞海纜不法行為、解決犯罪工具設備處理問題，爰擬具「氣象法第二十一條之一條文修正草案」。是否有當？敬請公決。","arts":["第二十一條之一"]}],"arts":[{"no":"第一條","current":"為加強氣象業務，健全測報制度，特制定本法；本法未規定者，依其他法律規定。","versions":[{"bill":"202110173990000","text":"為加強氣象業務，健全測報制度，並配合中華民國一百三十九年溫室氣體淨零排放目標，建立永續發展之氣象資訊基礎，特制定本法；本法未規定者，依其他法律規定。","note":"一、本條修正增列「中華民國一百三十九年溫室氣體淨零排放目標」之文字，旨在回應《氣候變遷因應法》確立之國家長期減碳與氣候治理政策。\n二、氣象觀測資料對於能源調度、極端氣候預警及碳排管理具關鍵支撐作用，明定氣象法應建立永續發展的氣象資訊基礎，以提供減碳與調適政策科學依據。"}],"changed":false,"final":"為加強氣象業務，健全測報制度，特制定本法；本法未規定者，依其他法律規定。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二條","current":"本法所用名詞，定義如下：\n一、氣象業務：指從事氣象、地震、海象等現象之觀測、資料蒐集與研判結果之發布。\n二、氣象：指大氣諸現象。\n三、地震：指地層發生錯動或火山活動所引起地表振動及其相關現象。\n四、海象：指潮汐、波浪及其他存在於大氣與海洋交界面之自然現象。\n五、氣象改造：指運用科學技術從事改變天氣現象之行為。\n六、觀測：指對氣象、地震或海象等現象之觀察及測定。\n七、氣象設施或設備：指用以從事或執行氣象業務所需之設施或設備。\n八、觀測站：指從事氣象、地震或海象等現象之觀測，於適當處所設置之觀測設施。\n九、觀測坪：指設置地面氣象觀測儀器之室外一定場所。\n十、探空儀追蹤器：指於氣象站建築物頂部設置追蹤天線，用以追蹤、接收以氣球為載具之探空儀收集觀測資料之觀測設施或設備。\n十一、氣象雷達天線：指於氣象雷達站建築物頂部設置之特定天線，用以發射並接收雷達電波之觀測設施或設備。\n十二、繞極軌道氣象衛星追蹤天線：指於地面建築物頂部設置之特定天線，用以接收繞極軌道氣象衛星傳送偵照、遙測結果之觀測設施或設備。\n十三、災害性天氣：指可能造成生命或財產損失之颱風、大雨、豪雨、雷電、冰雹、濃霧、龍捲風、強風、低溫、焚風、乾旱等天氣現象。\n十四、預報：指以觀測結果為基礎，發布氣象、地震或海象等現象所為之預測。\n十五、警報：指預測可能發生氣象、地震或海象災害而發布之警告性預報。\n十六、觀測儀器：指氣象業務觀測所使用之設備。\n十七、專用觀測站：指機關、學校、團體或個人，為專供目的事業應用或本身學術研究之需要以從事定時觀測，而於適當處所設置觀測儀器，經中央氣象局認可之設施。","versions":[{"bill":"202110173990000","text":"本法所用名詞，定義如下：\n一、氣象業務：指從事氣象、地震、海象等現象之觀測、資料蒐集與研判結果之發布。\n二、氣象：指大氣諸現象。\n三、地震：指地層發生錯動或火山活動所引起地表振動及其相關現象。\n四、海象：指潮汐、波浪及其他存在於大氣與海洋交界面之自然現象。\n五、氣象改造：指運用科學技術從事改變天氣現象之行為。\n六、觀測：指對氣象、地震或海象等現象之觀察及測定。\n七、氣象設施或設備：指用以從事或執行氣象業務所需之設施或設備。\n八、觀測站：指從事氣象、地震或海象等現象之觀測，於適當處所設置之觀測設施。\n九、觀測坪：指設置地面氣象觀測儀器之室外一定場所。\n十、探空儀追蹤器：指於氣象站建築物頂部設置追蹤天線，用以追蹤、接收以氣球為載具之探空儀收集觀測資料之觀測設施或設備。\n十一、氣象雷達天線：指於氣象雷達站建築物頂部設置之特定天線，用以發射並接收雷達電波之觀測設施或設備。\n十二、繞極軌道氣象衛星追蹤天線：指於地面建築物頂部設置之特定天線，用以接收繞極軌道氣象衛星傳送偵照、遙測結果之觀測設施或設備。\n十三、災害性天氣：指可能造成生命或財產損失之颱風、大雨、豪雨、雷電、冰雹、濃霧、龍捲風、強風、低溫、高溫、焚風、乾旱等天氣現象。\n十四、預報：指以觀測結果為基礎，發布氣象、地震或海象等現象所為之預測。\n十五、警報：指預測可能發生氣象、地震或海象災害而發布之警告性預報。\n十六、觀測儀器：指氣象業務觀測所使用之設備。\n十七、專用觀測站：指機關、學校、團體或個人，為專供目的事業應用或本身學術研究之需要以從事定時觀測，而於適當處所設置觀測儀器，經中央氣象局認可之設施。","note":"氣候變遷導致極端天候日益劇烈，全球氣溫屢屢刷新紀錄，多次引發嚴重災害，對人民健康、工作安全、公共衛生、農漁生產及能源供應均造成衝擊，因此將高溫現象納入災害性天氣的範疇。"}],"changed":false,"final":"本法所用名詞，定義如下：\n一、氣象業務：指從事氣象、地震、海象等現象之觀測、資料蒐集與研判結果之發布。\n二、氣象：指大氣諸現象。\n三、地震：指地層發生錯動或火山活動所引起地表振動及其相關現象。\n四、海象：指潮汐、波浪及其他存在於大氣與海洋交界面之自然現象。\n五、氣象改造：指運用科學技術從事改變天氣現象之行為。\n六、觀測：指對氣象、地震或海象等現象之觀察及測定。\n七、氣象設施或設備：指用以從事或執行氣象業務所需之設施或設備。\n八、觀測站：指從事氣象、地震或海象等現象之觀測，於適當處所設置之觀測設施。\n九、觀測坪：指設置地面氣象觀測儀器之室外一定場所。\n十、探空儀追蹤器：指於氣象站建築物頂部設置追蹤天線，用以追蹤、接收以氣球為載具之探空儀收集觀測資料之觀測設施或設備。\n十一、氣象雷達天線：指於氣象雷達站建築物頂部設置之特定天線，用以發射並接收雷達電波之觀測設施或設備。\n十二、繞極軌道氣象衛星追蹤天線：指於地面建築物頂部設置之特定天線，用以接收繞極軌道氣象衛星傳送偵照、遙測結果之觀測設施或設備。\n十三、災害性天氣：指可能造成生命或財產損失之颱風、大雨、豪雨、雷電、冰雹、濃霧、龍捲風、強風、低溫、焚風、乾旱等天氣現象。\n十四、預報：指以觀測結果為基礎，發布氣象、地震或海象等現象所為之預測。\n十五、警報：指預測可能發生氣象、地震或海象災害而發布之警告性預報。\n十六、觀測儀器：指氣象業務觀測所使用之設備。\n十七、專用觀測站：指機關、學校、團體或個人，為專供目的事業應用或本身學術研究之需要以從事定時觀測，而於適當處所設置觀測儀器，經中央氣象局認可之設施。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第四條之一","current":null,"versions":[{"bill":"202110173990000","text":"中央主管機關應配合國家淨零排放政策，建立大氣環境及氣候監測制度，蒐集、分析並公開大氣中主要溫室氣體濃度、氣候變化趨勢及其與極端氣象事件之關聯，作為國家氣候變遷調適及減碳決策之基礎資料。\n前項資料應與環境部、國家發展委員會、經濟部、教育部及地方政府共享。","note":"一、本條新增。\n二、明定交通部中央氣象署除氣象測報外，應配合國家淨零排放政策，建立大氣環境監測與氣候資料整合機制。\n三、為配合《氣候變遷因應法》第五條所揭示之「減緩與調適並重」及「資源永續利用」原則，本條特別定位於「觀測與資料支援層級」，以作為國家減碳與氣候調適決策之科學基礎。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第四條之二","current":null,"versions":[{"bill":"202110173990000","text":"中央主管機關應促進氣象資料與能源、交通、國土、農業及公共衛生等領域之整合應用，推動各部門依氣象與氣候趨勢調整減碳及調適策略。","note":"一、本條新增。\n二、新增中央主管機關推動跨領域整合應用之職掌，明定氣象資料應支援各部門於淨零轉型及氣候調適之決策。\n三、藉此確立氣象署於國家減碳與氣候調適體系中的支援地位，落實氣象法於永續治理的功能延伸。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第四條之三","current":null,"versions":[{"bill":"202110173990000","text":"中央主管機關應蒐集並分析與兒童及少年高溫曝露相關之氣象資料，建立「兒童及少年氣候風險指標」，提供教育部、衛生福利部及地方政府研擬健康調適及校園防護措施之依據。\n前項資料得以即時預警或公告方式發布。","note":"一、本條新增。\n二、新增兒童及少年氣候風險監測職掌，係因應氣候變遷下兒少族群對高溫曝露之脆弱性。\n三、依國內研究（2016－2022年臺灣學齡兒童WBGT暴露資料），兒童在上午10時至下午2時的高溫曝露最為集中，且WBGT≧34°C之日數與熱相關就醫量顯著增加，顯示校園與兒童健康調適措施的迫切需求。\n四、本條規範交通部應建置兒少氣候風險指標，提供教育及衛生主管機關研擬健康防護策略，並得即時發布預警，符合跨部會分工及氣候健康政策需求。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第二十一條之一","current":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"202110162880000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110163100000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處一年以下有期徒刑、拘役或科新臺幣三百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110163480000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為加強氣象設施及設備之安全防護，參考《電信管理法》第七十二條第四項規定，增訂第四項，明定因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之刑罰規範。\n三、現行第四項移列為第五項，內容未修正。\n四、鑑於近年屢有權宜輪違規破壞我國通訊海纜，影響海嘯及地震預警之即時性，甚至危及國家安全，亟需有效嚇阻。爰參考《土石採取法》第三十六條第三項及《中華民國專屬經濟海域及大陸礁層法》第十八條第三項，增訂第六項，明定對於相關犯罪所使用之工具、船舶或其他機械設備應予沒收及其處置規範。沒收物若具經濟價值，實務通常以拍賣或變價方式執行；惟考量第一項至第三項及第五項所涉犯罪工具（如船舶）往往噸位龐大、難以保管，或屬外籍船舶缺乏船籍資料致拍賣困難，爰授權地方檢察署、高等檢察署及其分署，得依個案性質、保管方式及處所情形，專案報准後，妥速採行下列處置方式之一，可避免大型或外籍船舶等犯罪工具因保管、拍賣不易而造成執行困難，並兼顧公共利益與實務操作需求：\n(一)適於公務使用者，得無償留供原機關或其他機關公用。\n(二)衡酌保管成本與價值，認無拍賣或變價實益者，得予廢棄。\n(三)其他適當方式，如捐作公益或教學使用。"},{"bill":"202110165300000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪所用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、氣象資訊對於國安戰略、民生經濟至關重要。破壞氣象設施、設備對於政府與民間均會產生重大影響。爰於第四項新增毀壞氣象設施、設備之處罰。\n二、配合第四項之修正，新增第六項對為第一項至第三項犯罪用之工具、船舶或其他機械設備為沒收之規定。"},{"bill":"202110164320000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n依前項應沒收船舶之情形者，其犯罪航次之全部收益，不問屬於犯罪行為人與否，沒收之。但於全部或一部不能沒收時，追徵其價額。","note":"一、為因應近年懸掛權宜旗之船舶（權宜輪）頻繁破壞我國通訊海纜，對我國對外及離島通訊造成衝擊，甚至危害國家安全。鑑於氣象設施或設備亦應一併強化保護之必要。本次修法旨在建立有效的嚇阻機制，參考《電信管理法》第七十二條第四項規定，增訂第四項明定過失犯之刑罰規範。\n二、參考《土石採取法》及《中華民國專屬經濟海域及大陸礁層法》相關規定，增訂第六項，明確規範犯罪所用之船舶、工具等設備的沒收與處置程序。考量到此類犯罪所用船舶常因噸位龐大、保管困難，或因外國籍身份致使拍賣不易，新法特別賦予檢察機關在個案上更大的處置彈性。經專案報准後，得不採傳統拍賣方式，改以「無償留供公用」、「廢棄」（若不具經濟效益）或「為其他適當處置」（如捐作公益或教學之用）等方式。\n三、媒體報導，中華電信曾指出，近年海纜遭破壞主要原因除被少數漁撈作業及大型貨商油船停泊下錨損傷外，大部分障礙是被中國盜砂船在馬祖南竿至西莒間海域作業所傷。參酌美國《海洋哺乳動物保護法》（Marine Mammal Protection Act, MMPA），16 U.S.C. § 1376「以任何方式用於非法捕撈海洋哺乳動物，其全部貨物或其貨幣價值應予以扣押和沒收。」增訂第七項，若船舶有「毀損氣象設施或設備」及「船舶被沒收」的情形，其犯罪航次收益，例如非法砂石、非法漁獲，將被視為毀損氣象設施或設備此犯罪航次之收益而沒收之。若犯罪航次收益已經變賣脫手，亦可追徵其價額。"},{"bill":"202110166350000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項規定均未作任何修正。\n二、為提升氣象設施與設備之安全防護，參照《電信管理法》第七十二條第四項之規定，於第四項增列對因過失損壞或以其他非法方式危害氣象設施、設備正常運作之處罰規定。\n三、原第四項調整為第五項，其內容維持不變。\n四、近年權宜輪多次違規破壞我國海底電纜，影響海嘯與地震預警之即時性，甚而危及國家安全。為有效遏阻此類不法，參考《土石採取法》第三十六條第三項及《中華民國專屬經濟海域及大陸礁層法》第十八條第三項之規範，於第六項增訂對相關犯罪所使用之工具、船舶或其他機械設備，明定沒收與處置之規定。若沒收物具經濟價值，通常實務上採拍賣或變價方式處理；惟考量供第一項至第三項及第五項犯罪所用之工具（如船舶）多因噸位龐大或其他因素不易保管，或為非我國籍船舶而缺乏船籍資料致難以拍賣，爰授權地方檢察署、高等檢察署及其分署，得依個案情況就沒收物性質、保管方式及地點等條件，專案報准後以下列方式之一迅速處置：(一)如有助於公務使用，得無償提供原機關或其他機關公用。(二)在衡酌保管費用與沒收物價值後，認無拍賣或變價效益者，得予以廢棄。(三)採行其他適當處置方式，如捐作公益或教學使用等。"},{"bill":"202110166810000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞氣象設施或設備之功能正常運作者，處一年以下有期徒刑、拘役或科新臺幣三百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，爰參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110166890000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110167080000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問其所有權屬，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、本條新增第四項及第六項，並配合條文結構重新排列。\n二、現行條文對於「過失」破壞氣象設施者未設罰則，實務上難以遏止不慎損害情事，爰參酌《電信管理法》第七十二條第四項規定，增訂第四項，明定因過失或其他非法方法危害氣象設施或設備功能者之刑責，以補現行法之漏洞並提升防護強度。\n三、鑒於近年外籍船舶及權宜輪多次破壞我國海纜、雷達、浮標或海氣象監測系統，影響地震與海嘯預警之即時性，甚至造成區域航安風險，為嚴懲惡意破壞行為並落實國家安全防護，增訂第六項，規範犯罪所用之工具、船舶或其他機械設備，不論所有權人為何，均應沒收；並參照《土石採取法》第三十六條第三項與《專屬經濟海域及大陸礁層法》第十八條第三項，授權實務機關得視個案情形採拍賣、變賣、報准留供公用或廢棄等方式處理，以減輕保管負擔並強化執行彈性。"},{"bill":"202110168520000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110167290000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科或併科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其所有權或其他權利，於沒收裁判確定時移轉為國家所有，並得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化我國氣象設施或設備之安全防護，爰參酌電信管理法第七十二條第四項，增訂因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來屢屢發生權宜輪違規破壞我國海纜之情況，因而影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定，並於沒收裁判確定時，移轉沒收物之所有權或其他權利為國家所有。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110168090000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、氣象設施或設備為我國預測天氣狀況之重要基礎設施，其安全維護至關重要。\n二、審計部二零二三年中央政府總決算審核報告指出，二零一九年至二零二三年間，我國海底電纜發生外力破壞或推擠受損案件計有三十六件，年平均故障約七件。近年更屢傳出受到中國侵擾，二零二五年一月至二月間於基隆外海的「橫太平洋快速海纜系統」及台澎三號分別遭中國權宜輪拖斷，嚴重影響我國通訊安全，亦造成其他重要基礎建設安全隱患。\n三、增訂第四項，考量氣象設施或設備對民生之重要性，爰參酌《電信管理法》第七十二條第四項之規定，增訂過失毀壞或以其他方法危害氣象設施或設備之功能正常運作之罰則。\n四、增訂第六項，參酌《中華民國專屬經濟海域及大陸礁層法》第十八條第三項之規定，增訂相關犯罪用之工具、船舶或其他機械設備之沒收與處置規定，以嚇阻破壞氣象設施或設備之不法行為，提升我國民生韌性。\n五、其餘項次未修正。"},{"bill":"202110169930000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n供第一項及第二項犯罪用之船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經判決沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項及第二項之未遂犯罰之。","note":"一、現行條文僅處罰竊取、毀壞或其他非法危害氣象設施之行為，但未明文規範過失犯罰則，爰增訂第四項規定處罰過失犯。\n二、現行條文僅著眼於行為人刑責，卻未明文規範「沒收犯罪工具」，以致破壞行為所涉之船舶、機具仍可能重複使用，影響執法成效。\n三、增訂第五項規定，明定犯罪工具（含船舶、機具等）一律沒收，以期全面提升防護韌性，維護國家安全與社會安定。"},{"bill":"202110171140000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金，並自負民事責任；行為人有二人以上者，連帶負民事責任。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金，並自負民事責任；行為人有二人以上者，連帶負民事責任。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要訂定廠商資格限制條件拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n因下列各款情形之一危害海纜管線之功能正常運作者，不予處罰：\n一、為緊急避難或確保船舶、航空器、海堤或其他重大工程設施安全。\n二、為維護國防安全或因天然災害、戰爭或依法令之行為。\n三、為防止、排除或減輕污染、保護環境或為特殊研究需要，經中央主管機關同意。\n在中華民國領域外犯本條之罪者，亦適用之。","note":"一、參照聯合國海洋法公約第一一三條規定，第一項後段酌予修正，對損害海纜管線進行民事責任追究，以與國際接軌。\n二、第二項至第三項未修正。\n三、增訂第四項，為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則，並對損害海纜管線進行民事責任追究。\n四、第四項移列為第五項，內容未修正。\n五、增訂第六項，鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。\n六、第六項為防止沒收後拍賣的船隻或有很可能借由人頭又被原船東購回，由原船東得標購回，重操舊業，建議有關拍賣或變賣投標之廠商資格應「限制條件」，採取嚴謹審慎限制。\n七、增訂第七項。參考國際海事組織各類公約及海洋污染防治法第十六條立法體例，增訂特殊情況下免責事由。\n八、增訂第八項。參考刑法跨境詐欺、人口販運防制法、資恐防制法等「域外處罰」之立法例，賦予破壞海纜管線罪域外適用的效力。"},{"bill":"202110170680000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑑於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110170930000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110170740000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣一億元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億五千萬元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣一億二千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、鑒於近年我國周遭海域設備遭破壞情形頻繁，嚴重影響我國國家安全，爰加重第二、三項之罰金上限，以生嚇阻效力。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110173140000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、我國海纜主要係遭鄰近國家抽砂船、漁船、商船等各式船隻作業或航行錨泊破壞所致，為新型態灰色侵擾。而海纜受損，須向國際海纜保護聯盟申請外國海纜船隻維修，等待維修時間長，且易受天氣及海象影響，也需耗資修理。惟執法單位對於船舶破壞海纜之行為係為故意或過失，難以舉證，船方得辯稱為過失行為，以迴避刑責。鑒於氣象署氣象設施或設備多有海纜，作為地震及海嘯觀測之用，應強化其安全維護，爰參酌電信管理法第七十二條第四項，增訂因過失毀壞或以其他非法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、為有效嚇阻破壞海纜等不法行為，參酌土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"},{"bill":"202110172200000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項。為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、增訂第六項。鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110172360000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項規定均未作任何修正。\n二、為提升氣象設施與設備之安全防護，參照《電信管理法》第七十二條第四項之規定，於第四項增列對因過失損壞或以其他非法方式危害氣象設施、設備正常運作之處罰規定。\n三、原第四項調整為第五項，其內容維持不變。\n四、近年權宜輪多次違規破壞我國海底電纜，影響海嘯與地震預警之即時性，甚而危及國家安全。為有效遏阻此類不法，參考《土石採取法》第三十六條第三項及《中華民國專屬經濟海域及大陸礁層法》第十八條第三項之規範，於第六項增訂對相關犯罪所使用之工具、船舶或其他機械設備，明定沒收與處置之規定。若沒收物具經濟價值，通常實務上採拍賣或變價方式處理；惟考量供第一項至第三項及第五項犯罪所用之工具（如船舶）多因噸位龐大或其他因素不易保管，或為非我國籍船舶而缺乏船籍資料致難以拍賣，爰授權地方檢察署、高等檢察署及其分署，得依個案情況就沒收物性質、保管方式及地點等條件，專案報准後以下列方式之一迅速處置：(一)如有助於公務使用，得無償提供原機關或其他機關公用。(二)在衡酌保管費用與沒收物價值後，認無拍賣或變價效益者，得予以廢棄。(三)採行其他適當處置方式，如捐作公益或教學使用等。"},{"bill":"202110172630000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀損或以其他方法妨害危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、為完善氣象設施及設備之管理機制，確保觀測與資料傳輸之穩定，參酌電信管理法第七十二條第四項規定，增訂第四項，明確規範因作業疏失或其他情形致氣象設施或設備功能受影響之處理方式，以強化維護與防護機制。\n二、為健全氣象設施及設備相關管理程序，並提升執行效能，增訂第六項，明定於相關案件中涉及之船舶、機具或其他設備之處理方式。爰參照《土石採取法》第三十六條第三項及《中華民國專屬經濟海域及大陸礁層法》第十八條第三項規定，授權有關機關得依個案情形專案報准後妥速辦理。"},{"bill":"202110172700000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、參酌《電信管理法》第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則，以強化氣象設施或設備安全防護。現行第四項移列為第五項，內容未修正。\n三、近年多次發生權宜輪違規破壞我國海纜事件，影響海嘯及地震預警時效，更對國家安全構成威脅。為強化嚇阻與處罰效果，本次修法參考《土石採取法》第三十六條第三項及《中華民國專屬經濟海域及大陸礁層法》第十八條第三項之規定，明定對於犯罪所使用之工具、船舶或其他機械設備，得予沒收及處置。\n四、實務上，對具有經濟價值之沒收物通常採拍賣或變價方式處理。然而，本條所涉之犯罪工具（例如大型作業船舶）多因噸位龐大、保管不易，或因屬外國籍船舶而缺乏船籍資料，致拍賣程序難以進行。為使執行機關能因應不同情形，迅速且妥當地處理沒收物，爰授權地方檢察署、高等檢察署及其分署得依個案性質與保管條件，報准後依下列方式辦理：\n(一)如沒收物具公用價值，得無償留供原機關或其他政府機關使用。\n(二)若衡酌保管成本與沒收物價值後，認定拍賣或變價無實益者，得逕予廢棄。\n(三)其他適當之處理方式，例如捐作公益、教育或教學用途等。"},{"bill":"202110173990000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑑於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110173840000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、銷毀。\n四、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"},{"bill":"202110175050000","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金，並自負民事責任；行為人有二人以上者，連帶負民事責任。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金，並自負民事責任；行為人有二人以上者，連帶負民事責任。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要訂定資格限制條件拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n在中華民國領域外犯本條之罪者，亦適用之。","note":"一、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n二、參考聯合國海洋法公約第一百一十三條規定，爰修正第一項及第四項，對損害海纜管線進行民事責任追究，反映國際社會考量經濟發展與公共利益之平衡，使我國與國際接軌。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署為防止沒收後拍賣的船隻或很有可能藉由人頭又被原船東購回，由原船東得標購回，有關拍賣或變賣投標的資格限制應限制條件，採取嚴謹審慎限制，以杜絕原船東或相關人員購回，再次危害氣象設施或設備功能正常運作之可能性，且得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。\n五、增訂第七項中華民國領域外適用的規定，確保破壞行為無論發生在領海、毗連區、專屬經濟區或公海，只要危害到我國海纜，皆能依法追訴、處罰。填補在領海外無法處罰的漏洞，實現對我國海纜管線的全面法律保護。"},{"bill":"201110161340400","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"}],"changed":true,"final":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以 <script>
const D = JSON.parse(document.getElementById('data').textContent);

  for (const c of kids) if (c != null) e.append(c);

};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],

const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;

}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));

  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }

D.arts.forEach(a => {

/* ---------- 提案版本 ---------- */
const partyLine = p => p.party.map(([n]) => n).join('、');
function people(p, role, label) {   // 一列名單：姓名後面標黨籍
  const list = (p.people || []).filter(x => x[2] === role);
  if (!list.length) return null;
  const box = el('div', {class: 'people'});
  list.forEach(([n, pt]) => box.append(el('span', {class: 'person'}, n, el('small', {text: pt}))));
  const peek = role === '提案' ? list.map(x => x[0]).join('、') : null;   // 只有提案人收合時預覽姓名
  return fold(label + ' ' + list.length + ' 位', box, peek);
}

  const s = el('summary', null, el('b', {text: label}));

function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
const PARTY = D.parties || {};
const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));
  return p;
}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = el('div', {class: 'toast', role: 'status', text: msg});
  document.body.append(t); setTimeout(() => t.remove(), 4500);
}
function copyHere(id) {
  const url = location.href.split('#')[0] + '#' + id;
  const ok = () => toast('已複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言，可以往前往後讀。');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, () => prompt('複製這個連結', url));
  else prompt('複製這個連結', url);
  history.replaceState(null, '', '#' + id);
}
function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {
  box.textContent = '';
  const clip = {}; s.clips.forEach(c => { clip[normName(c.n) + '|' + c.t] = c.u; (clip[normName(c.n)] = clip[normName(c.n)] || c.u); });
  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      const pa = PARTY[normName(t.s)];
      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});
      d.dataset.fp = fp(t.s + '|' + (t.b.find(x => typeof x === 'string') || '').slice(0, 30));
      here.addEventListener('click', () => copyHere(d.id + '-' + d.dataset.fp));
      who.append(here);
      d.append(who);
      if (!chair && !first.has(t.s)) first.set(t.s, d);
    }
    const put = (into, b) => {
      if (typeof b === 'string') into.append(para(b));
      else if (b.fold) {   // 照登的文件（提案條文全文、審查報告、機關書面報告）：收成一行
        const inner = el('div', {class: 'readout'});
        b.b.forEach(x => put(inner, x));
        into.append(fold(b.fold, inner));
        const p = b.bill && propById[b.bill];
        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});
          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));
          into.append(el('div', {class: 'readnote'}, btn));
        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));
    turns.append(d);
  });
  const idx = el('div', {class: 'idx'}, el('span', {text: '跳到發言者（' + first.size + ' 位）'}));
  const chips = el('div', {class: 'chips'});
  first.forEach((node, name) => { const b = el('button', {type: 'button', class: 'chip', text: name}); b.addEventListener('click', () => { turns.scrollTop = node.offsetTop - turns.offsetTop; }); chips.append(b); });
  idx.append(chips);
  box.append(idx, finder(turns), turns);
}

const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });

});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
