<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>電信管理法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"電信管理法","version":"07118:2025-06-17-修正","date":"2025-06-17","action":"修正","title":"電信管理法　2025 年修正","lede":"","summary":"","key":"07118_2025-06-17","props":[{"id":"202110037700000","who":"台灣民眾黨黨團","date":"2024-04-26","name":"「電信管理法第五條及第八條之一條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110037700000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/11/LCEWA01_110111_00154.pdf","proposers":["林國成","黃國昌","黃珊珊","吳春城"],"ncosign":0,"people":[["林國成","民眾黨","提案"],["黃國昌","民眾黨","提案"],["黃珊珊","民眾黨","提案"],["吳春城","民眾黨","提案"]],"party":[["民眾黨",4]],"reason":"本院台灣民眾黨黨團，鑑於國內詐騙橫行，112年詐欺案報案總數高達37,984件，較111年增加近3成，其中電信詐騙集團查獲1,601團共1萬4,445人，電信詐騙案件數更較111年增加7成。為打擊詐騙，行政院推動新世代打擊詐欺策略行動綱領1.5版，但卻仍無法遏止電信詐騙。經查電信詐騙經常透過二類電信取得詐騙門號，惟於原本電信法受政府直接規範採登記制之二類電信，於現今電信管理法下卻毋須登記，所受之監管密度亦大幅降低，甚至將防詐責任推予一類電信業者，與全民呼籲打擊詐騙之民意相悖。綜上，為加強對二類電信之管理，及兼顧通訊市場公平競爭，爰擬具「電信管理法第五條及第八條之一條文修正草案」，規定電信事業皆應向政府登記並接受管理，同時加強電信服務之客戶風險管理機制。是否有當？敬請公決。","arts":["第五條","第八條之一"]},{"id":"202110040030000","who":"委員陳俊宇等19人","date":"2024-05-03","name":"「電信管理法第七十五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110040030000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/12/LCEWA01_110112_00047.pdf","proposers":["陳俊宇","陳秀寳","陳亭妃","李坤城","吳琪銘","黃秀芳","陳瑩","林岱樺","羅美玲"],"ncosign":10,"people":[["陳俊宇","民進黨","提案"],["陳秀寳","民進黨","提案"],["陳亭妃","民進黨","提案"],["李坤城","民進黨","提案"],["吳琪銘","民進黨","提案"],["黃秀芳","民進黨","提案"],["陳瑩","民進黨","提案"],["林岱樺","民進黨","提案"],["羅美玲","民進黨","提案"],["蔡易餘","民進黨","連署"],["鍾佳濱","民進黨","連署"],["張雅琳","民進黨","連署"],["吳沛憶","民進黨","連署"],["陳冠廷","民進黨","連署"],["郭昱晴","民進黨","連署"],["黃捷","民進黨","連署"],["王正旭","民進黨","連署"],["陳培瑜","民進黨","連署"],["何欣純","民進黨","連署"]],"party":[["民進黨",19]],"reason":"本院委員陳俊宇、陳秀寳、陳亭妃、李坤城、吳琪銘、黃秀芳、陳瑩、林岱樺、羅美玲等19人，有鑑於台灣詐欺案件連年增長，雖詐欺犯罪手法及犯罪腳本日新月異，但皆仍需申辦人頭門號聯繫受害者。雖電信業者依法需針對申辦門號者進行身份查核，惟詐騙集團仍易於取得人頭門號進行犯罪之用，顯現電信業者在獲利之餘並未落實相關規定，且罰鍰顯有過輕之虞，對於不肖業者而言嚇阻功能有限。為敦促電信業者成為詐欺防制之協力者，於核發門號時善盡審核與管理之責，爰擬具「電信管理法第七十五條條文修正草案」。是否有當？敬請公決。","arts":["第七十五條"]},{"id":"202110050360000","who":"台灣民眾黨黨團","date":"2024-05-24","name":"「電信管理法第九條及第四十條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110050360000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/15/LCEWA01_110115_00071.pdf","proposers":["黃國昌","黃珊珊","吳春城"],"ncosign":0,"people":[["黃國昌","民眾黨","提案"],["黃珊珊","民眾黨","提案"],["吳春城","民眾黨","提案"]],"party":[["民眾黨",3]],"reason":"本院台灣民眾黨黨團，為透過科技偵查手段有效打擊犯罪，配合通訊保障及監察法增設執法機關調取網路流量紀錄之修正，有必要同步修法課予電信事業及設置公眾電信網路者保存網路流量紀錄之義務，爰擬具「電信管理法第九條及第四十條條文修正草案」。是否有當？敬請公決。","arts":["第九條","第四十條"]},{"id":"202110067660000","who":"委員黃健豪等19人","date":"2024-09-27","name":"「電信管理法第五條、第八條及第七十九條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110067660000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/02/LCEWA01_110202_00010.pdf","proposers":["黃健豪","蘇清泉"],"ncosign":17,"people":[["黃健豪","國民黨","提案"],["蘇清泉","國民黨","提案"],["盧縣一","國民黨","連署"],["鄭正鈐","國民黨","連署"],["許宇甄","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["陳超明","無黨籍","連署"],["謝龍介","國民黨","連署"],["魯明哲","國民黨","連署"],["張嘉郡","國民黨","連署"],["黃仁","國民黨","連署"],["廖先翔","國民黨","連署"],["張智倫","國民黨","連署"],["徐巧芯","國民黨","連署"],["羅智強","國民黨","連署"],["牛煦庭","國民黨","連署"],["高金素梅","無黨籍","連署"],["楊瓊瓔","國民黨","連署"],["陳玉珍","國民黨","連署"]],"party":[["國民黨",17],["無黨籍",2]],"reason":"本院委員黃健豪、蘇清泉等19人，鑑於我國詐騙橫行，各式新型犯罪手法層出不窮，電信業者易遭詐騙集團利用作為取得人頭門號之管道，我國對於電信業者管制似過於寬鬆，導致各種不肖業者甚至與詐騙集團掛勾，販售無須記名之用戶號碼供詐欺之用。為強化我國電信管理之防詐作為，爰擬具「電信管理法第五條、第八條及第七十九條條文修正草案」，以強化電信事業登記管制，增加電信事業納管範圍之彈性及要求電信業者應負KYC之義務等。是否有當？敬請公決。","arts":["第五條","第八條","第七十九條"]},{"id":"202110067950000","who":"委員鍾佳濱等21人","date":"2024-09-27","name":"「電信管理法第五條、第九條及第七十九條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110067950000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/02/LCEWA01_110202_00041.pdf","proposers":["鍾佳濱","林月琴","陳培瑜","郭昱晴","張雅琳","陳素月"],"ncosign":15,"people":[["鍾佳濱","民進黨","提案"],["林月琴","民進黨","提案"],["陳培瑜","民進黨","提案"],["郭昱晴","民進黨","提案"],["張雅琳","民進黨","提案"],["陳素月","民進黨","提案"],["王美惠","民進黨","連署"],["王正旭","民進黨","連署"],["楊曜","民進黨","連署"],["許智傑","民進黨","連署"],["莊瑞雄","民進黨","連署"],["李坤城","民進黨","連署"],["林宜瑾","民進黨","連署"],["羅美玲","民進黨","連署"],["郭國文","民進黨","連署"],["邱議瑩","民進黨","連署"],["黃捷","民進黨","連署"],["陳瑩","民進黨","連署"],["林俊憲","民進黨","連署"],["范雲","民進黨","連署"],["張宏陸","民進黨","連署"]],"party":[["民進黨",21]],"reason":"本院委員鍾佳濱、林月琴、陳培瑜、郭昱晴、張雅琳、陳素月等21人，為有效打擊犯罪，原依電信法許可之第二類電信事業提供電信服務，而未申請核配無線電頻率、電信號碼之業者（如經營虛擬行動網路服務、轉售、使用智慧虛擬碼及物聯網號碼以外之用戶號碼、使用他電信事業提供之無線電頻率等情形）應妥為管理，避免漏洞；另鑒於「詐欺犯罪危害防制條例」已明定相關機制與技術措施（限制瀏覽、移除、流量管理、停止解析、限制接取）等遏止詐騙，顯見要求網際網路接取服務提供者（IASP）執行限制接取，已成為「堵詐」及網路治理重要工具，且「兒童及少年性剝削防制條例」、「性侵害犯罪防治法」等法令亦已明定IASP有配合執法機關執行限制接取之法律義務，惟目前電信管理法對於提供網路接取服務採自願登記制，造成我國現有IASP數量未明，主管機關無法通知所有IASP執行限制接取。爰擬具「電信管理法第五條、第九條及第七十九條條文修正草案」。是否有當？敬請公決。","arts":["第五條","第九條","第七十九條"]}],"arts":[{"no":"第五條","current":"提供電信服務，且有下列行為之一者，應向主管機關辦理電信事業之登記：\n一、與他電信事業進行互連協商或申請裁決。\n二、申請核配第五十六條規定以外之無線電頻率。\n三、申請核配設置公眾電信網路之識別碼或信號點碼。\n四、申請核配用戶號碼。","versions":[{"bill":"202110037700000","text":"提供電信服務，應向主管機關辦理電信事業之登記。\n違反前項規定，未向主管機關辦理電信事業之登記者，由中央主管機關處新臺幣一百萬元以上一千萬元以下罰鍰，並通知限期改正；屆期仍未改正者，得按次處罰並勒令中斷服務。","note":"一、修正本條文。\n二、隨著科技匯流，通訊傳播產業已逐步邁入中高度匯流，過往依機線設備之有無進行分類管制，以因應當前之服務型態，本法降低市場進入門檻，從以往須經主管機關特許或許可始得經營，改採登記制。過去電信法所管之二類電信改為免登記，惟過度鬆綁，卻使詐騙行為趁機而入。\n三、用戶號碼為電信資源，其轉售、使用用戶號碼之行為，尚無明確之法律管制措施用以稽查實際用戶之身分，有心人士每每利用此疏漏，逸脫其不法行為之責，且因其可與獲核配用戶號碼之電信事業提供相同或類似之電信服務，卻可能因未登記而無法管制。\n四、國家通訊傳播委員會為打擊二類電信詐騙，將相關防詐責任交由過去之一類電信負責，惟因欠缺公權力，顧及與二類電信之商業利益，阻詐成效甚微。現行電信管理法規定擬經營電信服務者得依其意願自主決定是否辦理電信事業登記。\n五、依電信法取得許可之第二類電信事業，其提供之電信服務得自主決定是否辦理登記；即便未辦理電信事業登記，仍得繼續經營電信服務，國家通訊傳播委員會認為僅須遵守消費者保護法及個人資料保護法相關規定即可，形成管理缺漏。\n六、綜上，為加強對電信事業之管理與防範電信詐騙，爰修正本條，將經營電信服務者一律改為登記制。同時新增第二項，推定未依規定提供服務者之處罰。"},{"bill":"202110067660000","text":"提供電信服務，且有下列行為之一者，應向主管機關辦理電信事業之登記，未辦理電信事業登記者，視為電信事業：\n一、與他電信事業進行互連協商或申請裁決。\n二、申請核配第五十六條規定以外之無線電頻率。\n三、申請核配設置公眾電信網路之識別碼或信號點碼。\n四、申請核配用戶號碼。\n五、經營虛擬行動網路服務。\n六、轉售、使用智慧虛擬碼及物聯網號碼以外之用戶號碼。\n七、使用他電信事業提供之無線電頻率。\n原依電信法許可之第二類電信事業或利用行動寬頻專用電信網路連接公眾電信網路者，主管機關得指定其為電信事業之登記並準用前項之規定。","note":"一、隨著科技匯流，通訊傳播產業已逐步邁入中高度匯流，過往依機線設備之有無進行分類管制，以因應當前之服務型態，本法降低市場進入門檻，從以往須經主管機關特許或許可始得經營，改採登記制，合先敘明。\n二、新增第一項後段：為有效強化打擊詐騙犯行，新增本條第一項對於尚未辦理電信事業登記進行轉軌者，應視為電信事業，直接納管，亦可利於主管機關於該事業登記時重新檢視相關服務內容及營業概況，避免成為電信防詐漏洞。\n三、新增第一項第五款：虛擬行動網路服務（MVNO）業者已確實使用政府所核發之無線電頻率及用戶號碼等資源，應強化要求向主管機關辦理電信事業之登記，以拉齊管制強度。\n四、新增第一項第六款：用戶號碼為電信資源，其轉售、使用用戶號碼之行為，尚無明確之法律管制措施用以稽查實際用戶之身分，有心人士每每利用此疏漏，逸脫其不法行為之責，且因其可與獲核配用戶號碼之電信事業提供相同或類似之電信服務，應登記並予以管制；又智慧虛擬碼及物聯網號碼無轉售情形，純屬機器使用，並無前述風險應予排除。\n五、新增第一項第七款：使用他電信事業提供之無線電頻率者，因可與獲核配無線電頻率或用戶號碼之電信事業提供相同或類似之電信服務，應登記並於以管制。\n六、新增第二項：授權主管機關可視防制新型犯罪手法之考量下，彈性新增納管電信服務項目，但不限原先第二類電信業者或5G專頻專網業者進行登記為電信業者，以利業務主管機關可逕依電信管理法第九十條進行行政調查裁處，有效打擊犯罪。有關經營語音單純轉售服務、E.164用戶號碼網路電話服務、非E.164用戶號碼網路電話服務、租用國際電路提供不特定用戶國際間之通信服務、語音單純轉售服務、網路電話服務、公司內部網路通信服務、批發轉售服務、公用電話轉售服務、預付式電話卡轉售服務、虛擬行動網路服務之相關定義皆依電信法下第二類電信事業管理規則所規範相同。"},{"bill":"202110067950000","text":"提供電信服務，且有下列行為之一者，應向主管機關辦理電信事業之登記：\n一、與他電信事業進行互連協商或申請裁決。\n二、申請核配第五十六條規定以外之無線電頻率。\n三、申請核配設置公眾電信網路之識別碼或信號點碼。\n四、申請核配用戶號碼。\n五、經營虛擬行動網路服務。\n六、轉售、使用智慧虛擬碼及物聯網號碼以外之用戶號碼。\n七、銷售境外事業所提供之語音及數據等供公眾通信之服務。\n利用公眾電信網路經營網際網路接取服務者或其他提供電信服務之事業，主管機關得指定其為電信事業之登記並準用前項之規定。\n應辦理電信事業登記者，非經登記不得提供電信服務或銷售境外事業所提供之語音及數據等供公眾通信之服務。","note":"一、虛擬行動網路服務業者確實使用政府所核發之無線電頻率及用戶號碼等資源，應向主管機關辦理電信事業登記，爰新增本條第一項第五款。\n二、用戶號碼為電信資源，其轉售、使用用戶號碼之行為，無明確法律管制措施稽查實名認證，犯人利用此漏洞逸脫罪責，且因其可與獲核配用戶號碼之電信事業提供電信服務，應登記並予以管制；另智慧虛擬碼及物聯網號碼無轉售情形，純屬機械使用，無前述風險故排除。爰新增本條第一項第六款。\n三、於國內銷售境外事業所提供之語音及數據等供公眾通信之服務者，應登記並管制。爰新增第一項第七款。\n四、鑒於現行電信管理法對於提供網際網路接取服務（即透過公眾電信網路提供用戶以連線方式接取網際網路服務）採自願登記制，造成我國現有網際網路接取服務提供者數量未明，主管機關無法通知其執行限制接取，並考量主管機關可能因新興電信服務之發展、監理、消費者權益等需要，須將特定服務之業者予以納管，以利檢核相關服務內容及營業概況，避免成為網路犯罪漏洞。爰新增本條第二項。\n五、為防治新型犯罪手法，授權主管機關彈性新增納管電信服務項目，主管機關可逕依電信管理法第九十條進行行政調查裁處，以有效打擊。爰新增本條第三項。"}],"changed":true,"final":"提供電信服務，且有下列行為之一者，應向主管機關辦理電信事業之登記：\n一、與他電信事業進行互連協商或申請裁決。\n二、申請核配第五十六條規定以外之無線電頻率。\n三、申請核配設置公眾電信網路之識別碼或信號點碼。\n四、申請核配用戶號碼。\n提供下列電信服務者，應向主管機關辦理電信事業之登記：\n一、向獲核配用戶號碼之電信事業以批發方式，承租或承購搭配用戶號碼之電信服務，並以自己名義向用戶販售服務。\n二、提供用戶接取網際網路服務。\n前項第二款應登記為電信事業者，主管機關考量電信服務營業額、用戶數及其他因素，得為分級管理。\n本法中華民國一百十四年六月十七日修正之條文施行前，已提供第二項各款服務者，應於施行之日起一年內向主管機關辦理電信事業登記。","finalWhy":"一、用戶號碼為國家核配有限資源，係通訊用途之重要公共財，在行動通訊裝置甚為普及之數位生活中，用戶號碼具當事人部分身分識別之功能，間接供接取多元數位服務以及從事經濟活動。為確保電信服務正常提供、號碼資源合法有序利用，避免淪為詐欺犯罪利用之工具，爰新增第二項第一款規定。\n二、鑒於現行電信管理法對於提供網際網路接取服務（即透過公眾電信網路提供用戶以連線方式接取網際網路服務）採自願登記制，造成我國現有網際網路接取服務提供者數量未明，主管機關無法通知其執行限制接取，並考量主管機關可能因新興電信服務之發展、監理、消費者權益等需要，須將特定服務之業者予以納管，避免成為網路犯罪漏洞，爰新增第二項第二款規定。\n三、第二項第二款所稱用戶，指符合本法第三條第一項第九款定義之用戶。實務上政府機關（構）、學術研究單位、公司行號或營業場所、建築物管理者等，其本身使用網際網路接取服務即屬電信事業之用戶，其再向場所內之民眾、員工等提供網際網路接取服務，具有無契約關係之特徵，並非以提供該服務為營業目的，非屬本法規定電信事業向用戶提供電信服務之範疇，自無須依本法辦理登記。另如網咖等之營業場所，係利用電信事業提供之網際網路接取服務，提供特定場所及電腦資訊設備供消費者遊戲娛樂，與電信事業提供公眾通信之性質未合，亦無須辦理電信事業登記。\n四、考量實務提供用戶接取網際網路服務者之經營規模不一，風險控管能力與對公益影響程度不同，爰增訂第三項，主管機關得考量電信服務營業額、用戶數及其他因素，對於提供用戶接取網際網路服務者於申請或變更電信事業登記、申請或變更核准設置公眾電信網路設置計畫等事項，為不同程度之分級管理。\n五、本條修正施行後，已提供第二項電信服務而未辦理電信事業登記或電信事業原登記服務內容未包含第二項各款服務者，應向主管機關辦理或變更電信事業登記，為避免造成衝擊，允宜設計過渡條款以利其因應，爰增訂第四項，明定過渡期間為本條修正施行之日起一年。","review":{"note":"照委員黃健豪等5人、委員許智傑等3人所提修正動議通過","text":"提供電信服務，且有下列行為之一者，應向主管機關辦理電信事業之登記：\n一、與他電信事業進行互連協商或申請裁決。\n二、申請核配第五十六條規定以外之無線電頻率。\n三、申請核配設置公眾電信網路之識別碼或信號點碼。\n四、申請核配用戶號碼。\n提供下列電信服務者，應向主管機關辦理電信事業之登記：\n一、向獲核配用戶號碼之電信事業以批發方式，承租或承購搭配用戶號碼之電信服務，並以自己名義向用戶販售服務。\n二、提供用戶接取網際網路服務。\n前項第二款應登記為電信事業者，主管機關考量電信服務營業額、用戶數及其他因素，得為分級管理。\n本法中華民國〇年〇月〇日修正之條文施行前，已提供第二項各款服務者，應於施行之日起一年內向主管機關辦理電信事業登記。"}},{"no":"第八條","current":"電信事業提供電信服務時，應符合下列規定：\n一、以明顯公開且易於取得之方式，揭露服務條件、電信網路品質與數據流量管理方式及條件等消費資訊。\n二、電信服務及非電信服務費用之帳目應明顯分立，且不得以非電信服務費用未繳交為由，停止提供電信服務。\n三、對於逾期未繳交電信服務費用之用戶，應定相當期間催告，逾期仍不繳交者，始得停止提供電信服務。\n四、採取適當及必要之措施，保障通信秘密。\n五、確保其從業人員嚴守通信秘密。\n六、提供用戶消費爭議申訴處理管道。\n電信事業無正當理由，不得拒絕電信服務之請求及通信傳遞。\n電信事業因電信網路障礙、阻斷，致電信服務發生錯誤、遲滯、中斷或不能傳遞而造成用戶損害時，其所生損害，除契約另有約定外，電信事業不負賠償責任；其所收之服務費用應予扣減。\n電信事業對下列通信應予優先處理：\n一、於發生天災、事變或其他緊急情況或有發生之虞時，為預防災害、進行救助或維持秩序之通信。\n二、對於陸、海、空各種交通工具之遇險求救及飛航氣象等交通安全之緊急通信。\n三、為維護國家安全或公共利益，有緊急進行必要之其他通信。","versions":[{"bill":"202110067660000","text":"電信事業提供電信服務時，應符合下列規定：\n一、以明顯公開且易於取得之方式，揭露服務條件、電信網路品質與數據流量管理方式及條件等消費資訊。\n二、電信服務及非電信服務費用之帳目應明顯分立，且不得以非電信服務費用未繳交為由，停止提供電信服務。\n三、對於逾期未繳交電信服務費用之用戶，應定相當期間催告，逾期仍不繳交者，始得停止提供電信服務。\n四、採取適當及必要之措施，保障通信秘密。\n五、確保其從業人員嚴守通信秘密。\n六、提供用戶消費爭議申訴處理管道。\n電信事業無正當理由，不得拒絕電信服務之請求及通信傳遞。\n電信事業因電信網路障礙、阻斷，致電信服務發生錯誤、遲滯、中斷或不能傳遞而造成用戶損害時，其所生損害，除契約另有約定外，電信事業不負賠償責任；其所收之服務費用應予扣減。\n電信事業對下列通信應予優先處理：\n一、於發生天災、事變或其他緊急情況或有發生之虞時，為預防災害、進行救助或維持秩序之通信。\n二、對於陸、海、空各種交通工具之遇險求救及飛航氣象等交通安全之緊急通信。\n三、為維護國家安全或公共利益，有緊急進行必要之其他通信。\n電信事業銷售用戶號碼，應核對及登錄用戶資料。","note":"新增第5項規定，明定為補足並強化現行電信管理法授權下，僅有數位部所執掌之電信號碼核配及管理辦法中有規定電信事業分配用戶號碼前應核對及登錄用戶資料之分工問題；為強化防詐作為，將核對及登錄用戶資料納入電信事業一般義務內，以有效降低詐欺犯罪，保障民眾財產安全，明定電信事業銷售用戶號碼之KYC責任。"}],"changed":false,"final":"電信事業提供電信服務時，應符合下列規定：\n一、以明顯公開且易於取得之方式，揭露服務條件、電信網路品質與數據流量管理方式及條件等消費資訊。\n二、電信服務及非電信服務費用之帳目應明顯分立，且不得以非電信服務費用未繳交為由，停止提供電信服務。\n三、對於逾期未繳交電信服務費用之用戶，應定相當期間催告，逾期仍不繳交者，始得停止提供電信服務。\n四、採取適當及必要之措施，保障通信秘密。\n五、確保其從業人員嚴守通信秘密。\n六、提供用戶消費爭議申訴處理管道。\n電信事業無正當理由，不得拒絕電信服務之請求及通信傳遞。\n電信事業因電信網路障礙、阻斷，致電信服務發生錯誤、遲滯、中斷或不能傳遞而造成用戶損害時，其所生損害，除契約另有約定外，電信事業不負賠償責任；其所收之服務費用應予扣減。\n電信事業對下列通信應予優先處理：\n一、於發生天災、事變或其他緊急情況或有發生之虞時，為預防災害、進行救助或維持秩序之通信。\n二、對於陸、海、空各種交通工具之遇險求救及飛航氣象等交通安全之緊急通信。\n三、為維護國家安全或公共利益，有緊急進行必要之其他通信。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第八條之一","current":null,"versions":[{"bill":"202110037700000","text":"電信事業應進行確認客戶身分程序，並留存其確認客戶身分程序所得資料。\n電信事業應針對高風險用戶，加強稽核抽測及強化風險管理，必要時經相關機關通知後依契約停止、中斷服務。\n第一項確認客戶身分程序所得資料，應自業務關係終止時起至少保存五年。但法律另有較長保存期間規定者，從其規定。\n第一項確認客戶身分範圍、留存確認資料之範圍、程序、方式及加強客戶審查之範圍、程序、方式之辦法，由中央主管機關定之。\n違反第一項、第三項規定及第四項所定辦法者，由中央主管機關處電信事業新臺幣一百萬元以上六百萬元以下罰鍰，並通知限期改正；屆期仍未改正者，得按次處罰。","note":"一、本條新增\n二、為加強電信事業防止詐騙之角色，落實相關責任，爰參考國家通訊傳播委員會之「電信事業受理申辦電信服務風險管理機制指引」，增訂本條文。並規定電信業者違反本條時之罰則。\n三、新增第一項，要求業者強化認識客戶風險管理機制。\n四、新增第二項，規定電信事業應優先針對高風險用戶，加強稽核抽測及強化風管措施，必要時經相關機關通知後依契約停、斷話，透過若干機制，強化業者落實KYC以處理電信門號人頭充斥之現象。\n五、新增第三項、第四項，規定業者保留客戶相關資料之義務。並規定相關之細部規定由中央主管機關訂定之。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第九條","current":"電信事業對於用戶或使用電信人使用電信服務所生通信紀錄及帳務紀錄，應確保紀錄正確，保存一定期間及應予保密；用戶查詢其通信紀錄及帳務紀錄時，應予提供。\n前項所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄，並以公眾電信網路性能可予提供者為限。\n前二項通信紀錄與帳務紀錄保存期間、用戶查詢之作業程序、收費方式及其他相關事項之辦法，由主管機關定之。\n電信事業及設置公眾電信網路者有依通訊保障及監察法協助執行通訊監察、調取通信紀錄及通訊使用者資料之義務。","versions":[{"bill":"202110050360000","text":"電信事業對於用戶或使用電信人使用電信服務所生通信紀錄及帳務紀錄，應確保紀錄正確，保存一定期間及應予保密；用戶查詢其通信紀錄及帳務紀錄時，應予提供。\n前項所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄，並以公眾電信網路性能可予提供者為限。\n前二項通信紀錄與帳務紀錄保存期間、用戶查詢之作業程序、收費方式及其他相關事項之辦法，由主管機關定之。\n電信事業及設置公眾電信網路者有依通訊保障及監察法協助執行通訊監察、調取通信紀錄、網路流量紀錄及通訊使用者資料之義務。\n前項所稱之網路流量紀錄，指電信事業或設置公眾電信網路者提供電信服務後，所產生之發送方與接收方之網際網路位址、通訊起迄時間、通訊埠、協定、封包大小及數量、查詢與回應之網域名稱系統及其域名解析器與域名伺服器協力查詢資源等未涉及通訊內容之紀錄，並以公眾電信網路性能可予提供者為限。\n前項網路流量紀錄之保存期間、方式、保存之資料範圍、收費方式及其他相關事項之辦法，由主管機關定之。","note":"一、為因應通訊保障及監察法第十一條之一新增調取網路流量紀錄之規定，及第十四條之一電信事業與設置公眾電信網路者有協助調取網路流量紀錄之規定，爰新增本條第四項之規定。並配合通訊保障及監察法第三條之一第三項關於網路流量紀錄之定義，增訂第五項。\n二、因網路流量紀錄之保存期間、方式、保存之資料範圍、收費方式等問題，涉及公眾電信網路性能、技術可行性、耗費成本之經濟合理性問題，相關細節爰授權主管機關綜合考量後以辦法定之。"},{"bill":"202110067950000","text":"電信事業對於用戶或使用電信人使用電信服務所生通信紀錄及帳務紀錄，應確保紀錄正確，保存一定期間及應予保密；用戶查詢其通信紀錄及帳務紀錄時，應予提供。\n前項所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄，並以公眾電信網路性能可予提供者為限。\n前二項通信紀錄與帳務紀錄保存期間、用戶查詢之作業程序、收費方式及其他相關事項之辦法，由主管機關定之。\n電信事業及設置公眾電信網路者有依通訊保障及監察法協助執行通訊監察、調取通信紀錄及通訊使用者資料之義務。\n電信事業或銷售境外所提供之語音及數據等供公眾通信服務之經營者，銷售用戶號碼應核對及登錄用戶資料。","note":"為補足並強化現行電信管理法，將用戶實名認證納入電信事業一般業務，明定電信事業及經營者銷售用戶號碼之實名認證責任，以有效降低犯罪。爰新增本條第五項。"}],"changed":false,"final":"電信事業對於用戶或使用電信人使用電信服務所生通信紀錄及帳務紀錄，應確保紀錄正確，保存一定期間及應予保密；用戶查詢其通信紀錄及帳務紀錄時，應予提供。\n前項所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄，並以公眾電信網路性能可予提供者為限。\n前二項通信紀錄與帳務紀錄保存期間、用戶查詢之作業程序、收費方式及其他相關事項之辦法，由主管機關定之。\n電信事業及設置公眾電信網路者有依通訊保障及監察法協助執行通訊監察、調取通信紀錄及通訊使用者資料之義務。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第四十條","current":"設置使用電信資源之公眾電信網路提供電信服務時，應符合下列規定：\n一、足以保障其用戶秘密通信之機制。\n二、維持電信服務之適當品質，並以國際標準組織訂定之標準為原則。\n三、其電信設備與其他公眾電信網路，或用戶終端設備間具有明確之責任分界點。\n四、使用之電信設備應符合有關機關之國家安全考量。\n五、具有足以確保資通安全之偵測及防護功能。\n六、具有提供公眾緊急通訊服務及通信優先處理之功能。\n七、依通訊保障及監察法規定具有提供通信紀錄等資料之功能。\n八、其他經主管機關公告事項。\n設置未使用電信資源之公眾電信網路提供電信服務時，應符合下列規定：\n一、足以保障其用戶秘密通信之機制。\n二、維持電信服務之適當品質，並以國際標準組織訂定之標準為原則。\n三、其電信設備與其他公眾電信網路，或用戶終端設備間具有明確之責任分界點。\n四、使用之電信設備應符合有關機關之國家安全考量。\n五、具有足以確保資通安全之防護功能。\n六、依通訊保障及監察法具有提供通信紀錄等資料之功能。\n七、其他經主管機關公告事項。\n網路架構及性能應符合前二項規定或其網路設置計畫。不符合者，設置公眾電信網路者應依主管機關之通知，限期改正或限制使用。","versions":[{"bill":"202110050360000","text":"設置使用電信資源之公眾電信網路提供電信服務時，應符合下列規定：\n一、足以保障其用戶秘密通信之機制。\n二、維持電信服務之適當品質，並以國際標準組織訂定之標準為原則。\n三、其電信設備與其他公眾電信網路，或用戶終端設備間具有明確之責任分界點。\n四、使用之電信設備應符合有關機關之國家安全考量。\n五、具有足以確保資通安全之偵測及防護功能。\n六、具有提供公眾緊急通訊服務及通信優先處理之功能。\n七、依通訊保障及監察法規定具有提供通信紀錄、網路流量紀錄等資料之功能。\n八、其他經主管機關公告事項。\n設置未使用電信資源之公眾電信網路提供電信服務時，應符合下列規定：\n一、足以保障其用戶秘密通信之機制。\n二、維持電信服務之適當品質，並以國際標準組織訂定之標準為原則。\n三、其電信設備與其他公眾電信網路，或用戶終端設備間具有明確之責任分界點。\n四、使用之電信設備應符合有關機關之國家安全考量。\n五、具有足以確保資通安全之防護功能。\n六、依通訊保障及監察法具有提供通信紀錄、網路流量紀錄等資料之功能。\n七、其他經主管機關公告事項。\n網路架構及性能應符合前二項規定或其網路設置計畫。不符合者，設置公眾電信網路者應依主管機關之通知，限期改正或限制使用。","note":"配合本法第九條第四項，修正電信事業及設置公眾電信網路者，有依通訊保障及監察法協助執行通訊監察、調取通信紀錄、網路流量紀錄及通訊使用者資料之義務，爰修正本條第一項第七款及第二項第六款之規定。"}],"changed":false,"final":"設置使用電信資源之公眾電信網路提供電信服務時，應符合下列規定：\n一、足以保障其用戶秘密通信之機制。\n二、維持電信服務之適當品質，並以國際標準組織訂定之標準為原則。\n三、其電信設備與其他公眾電信網路，或用戶終端設備間具有明確之責任分界點。\n四、使用之電信設備應符合有關機關之國家安全考量。\n五、具有足以確保資通安全之偵測及防護功能。\n六、具有提供公眾緊急通訊服務及通信優先處理之功能。\n七、依通訊保障及監察法規定具有提供通信紀錄等資料之功能。\n八、其他經主管機關公告事項。\n設置未使用電信資源之公眾電信網路提供電信服務時，應符合下列規定：\n一、足以保障其用戶秘密通信之機制。\n二、維持電信服務之適當品質，並以國際標準組織訂定之標準為原則。\n三、其電信設備與其他公眾電信網路，或用戶終端設備間具有明確之責任分界點。\n四、使用之電信設備應符合有關機關之國家安全考量。\n五、具有足以確保資通安全之防護功能。\n六、依通訊保障及監察法具有提供通信紀錄等資料之功能。\n七、其他經主管機關公告事項。\n網路架構及性能應符合前二項規定或其網路設置計畫。不符合者，設置公眾電信網路者應依主管機關之通知，限期改正或限制使用。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第七十五條","current":"有下列情形之一者，處新臺幣五十萬元以上五百萬元以下罰鍰，並通知限期改正；屆期仍未改正者，得按次處罰：\n一、違反第十二條第一項規定，未分攤電信普及服務所生虧損及必要之管理費用。\n二、違反第二十六條第一項規定，未經核准讓與或受讓全部或主要部分營業或財產，或未經核准合併，或未經核准投資他電信事業有表決權之股份總數或資本總額達一定比率以上。\n三、違反第二十六條第二項規定，未經核准讓與、受讓營業，或與他電信事業合併。\n四、違反第二十六條第三項規定，未經核准取得股份。\n五、違反主管機關依第三十五條規定所為之命令，未採取措施。\n六、違反第三十七條第一項規定，未經核准營運，或未依核准之營運計畫實施。\n七、違反第三十七條第三項規定，未送核准變更營運計畫。\n前項第一款未共同分攤電信普及服務所生虧損及必要之管理費用者，每逾二日按應繳納金額加徵百分之一滯納金。但以其應繳納金額一倍為限。\n設置公眾電信網路者有下列情形之一者，處新臺幣五十萬元以上五百萬元以下罰鍰，並通知限期改正；屆期未改正者，得按次處罰或廢止審驗合格證明：\n一、違反第三十九條第二項規定，使用未經審驗合格之公眾電信網路，或設置之電信基礎設施有異動未重新申請審驗。\n二、違反主管機關依第三十九條第五項規定所定辦法有關公眾電信網路使用管理或限制之規定。\n三、未依主管機關依第四十條第三項之通知，於期限內改正或繼續使用。\n四、違反第四十二條第二項規定，未於主管機關所定期限內訂定關鍵電信基礎設施防護計畫送主管機關評定，或未依評定之計畫實施。\n五、未依主管機關依第四十二條第三項之通知，於期限內改善其關鍵電信基礎設施防護計畫。\n六、未依主管機關依第四十二條第四項之通知，於期限內改善或改善不完備。","versions":[{"bill":"202110040030000","text":"有下列情形之一者，處新臺幣一百萬元以上一千萬元以下罰鍰，並通知限期改正；屆期仍未改正者，得按次處罰：\n一、違反第十二條第一項規定，未分攤電信普及服務所生虧損及必要之管理費用。\n二、違反第二十六條第一項規定，未經核准讓與或受讓全部或主要部分營業或財產，或未經核准合併，或未經核准投資他電信事業有表決權之股份總數或資本總額達一定比率以上。\n三、違反第二十六條第二項規定，未經核准讓與、受讓營業，或與他電信事業合併。\n四、違反第二十六條第三項規定，未經核准取得股份。\n五、違反主管機關依第三十五條規定所為之命令，未採取措施。\n六、違反第三十七條第一項規定，未經核准營運，或未依核准之營運計畫實施。\n七、違反第三十七條第三項規定，未送核准變更營運計畫。\n前項第一款未共同分攤電信普及服務所生虧損及必要之管理費用者，每逾二日按應繳納金額加徵百分之一滯納金。但以其應繳納金額一倍為限。\n設置公眾電信網路者有下列情形之一者，處新臺幣五十萬元以上五百萬元以下罰鍰，並通知限期改正；屆期未改正者，得按次處罰或廢止審驗合格證明：\n一、違反第三十九條第二項規定，使用未經審驗合格之公眾電信網路，或設置之電信基礎設施有異動未重新申請審驗。\n二、違反主管機關依第三十九條第五項規定所定辦法有關公眾電信網路使用管理或限制之規定。\n三、未依主管機關依第四十條第三項之通知，於期限內改正或繼續使用。\n四、違反第四十二條第二項規定，未於主管機關所定期限內訂定關鍵電信基礎設施防護計畫送主管機關評定，或未依評定之計畫實施。\n五、未依主管機關依第四十二條第三項之通知，於期限內改善其關鍵電信基礎設施防護計畫。\n六、未依主管機關依第四十二條第四項之通知，於期限內改善或改善不完備。","note":"一、詐欺犯罪防制需電信業者積極協力、共同預防，依同法第三十七條第一項規定，設置使用電信資源之公眾電信網路者，應將申辦門號者之身分查核作業與審查納入營運計畫中，上開計畫應經主管機關國家通訊傳播委員會核准。\n二、然詐騙集團仍常透過人頭戶成功申辦門號、再將人頭門號作為續行詐欺犯罪行為之工具，顯見電信業者於前端門號核發之作業流程，應更落實審核與管理之責。\n三、爰修正第七十五條關於罰鍰數額之規定，以敦促業者善盡審核與管理之責，提高電信業者違規之成本，落實用戶身份查核，從源頭管理有效防制詐欺犯罪之遂行。"}],"changed":false,"final":"有下列情形之一者，處新臺幣五十萬元以上五百萬元以下罰鍰，並通知限期改正；屆期仍未改正者，得按次處罰：\n一、違反第十二條第一項規定，未分攤電信普及服務所生虧損及必要之管理費用。\n二、違反第二十六條第一項規定，未經核准讓與或受讓全部或主要部分營業或財產，或未經核准合併，或未經核准投資他電信事業有表決權之股份總數或資本總額達一定比率以上。\n三、違反第二十六條第二項規定，未經核准讓與、受讓營業，或與他電信事業合併。\n四、違反第二十六條第三項規定，未經核准取得股份。\n五、違反主管機關依第三十五條規定所為之命令，未採取措施。\n六、違反第三十七條第一項規定，未經核准營運，或未依核准之營運計畫實施。\n七、違反第三十七條第三項規定，未送核准變更營運計畫。\n前項第一款未共同分攤電信普及服務所生虧損及必要之管理費用者，每逾二日按應繳納金額加徵百分之一滯納金。但以其應繳納金額一倍為限。\n設置公眾電信網路者有下列情形之一者，處新臺幣五十萬元以上五百萬元以下罰鍰，並通知限期改正；屆期未改正者，得按次處罰或廢止審驗合格證明：\n一、違反第三十九條第二項規定，使用未經審驗合格之公眾電信網路，或設置之電信基礎設施有異動未重新申請審驗。\n二、違反主管機關依第三十九條第五項規定所定辦法有關公眾電信網路使用管理或限制之規定。\n三、未依主管機關依第四十條第三項之通知，於期限內改正或繼續使用。\n四、違反第四十二條第二項規定，未於主管機關所定期限內訂定關鍵電信基礎設施防護計畫送主管機關評定，或未依評定之計畫實施。\n五、未依主管機關依第四十二條第三項之通知，於期限內改善其關鍵電信基礎設施防護計畫。\n六、未依主管機關依第四十二條第四項之通知，於期限內改善或改善不完備。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第七十九條","current":"電信事業有下列情形之一者，處新臺幣十萬元以上一百萬元以下罰鍰，並通知限期改正；屆期未改正者，得按次處罰：\n一、違反第六條第五項規定，未辦理股票公開發行。\n二、違反第八條第四項規定，未優先處理緊急或必要通信。\n三、違反第九條第一項前段規定，未保存通信紀錄及帳務紀錄一定期間或未予保密。\n四、違反第九條第一項後段規定，未依用戶查詢提供通信紀錄或帳務紀錄。\n 一項規定，未提供號碼可攜服務或平等接取服務。\n十六、違反第十六條第四項規定，未共同成立或加入集中式資料庫管理機構。\n十七、違反主管機關依第十六條第五項所定辦法有關集中式資料庫管理機構設置、管理或限制之規定。\n十八、違反第十七條第一項規定，未訂定定型化服務契約條款，或於實施前、變更時未經主管機關核准。\n十九、違反第十八條規定，未定期辦理服務品質自我評鑑或未公布評鑑結果。\n二十、違反第十九條規定，未依限送主管機關核准其消費者保護處置方式，或未依限通知使用者。\n二十一、違反第二十條第一項規定，未共同設立電信消費爭議處理機構，或未提報其組織章程，經主管機關核准。\n二十二、違反主管機關依第二十條第四項規定之認定，未委託電信消費爭議處理機構辦理電信消費爭議事項。\n二十三、違反主管機關依第二十條第五項規定之認定，未加入電信消費爭議處理機構。\n二十四、違反主管機關依第二十四條規定之指定，未提供電信普及服務。\n二十五、違反第二十五條第一項規定，未申報或未依主管機關公告之格式、方式申報。\n電信消費爭議處理機構有下列情形之一者，處新臺幣十萬元以上一百萬元以下罰鍰，並通知限期改正；屆期未改正者，得按次處罰：\n一、違反第二十條第三項規定，組織章程變更時，未經核准即實施。\n二、違反主管機關依第二十條第七項所定辦法有關業務執行之監督管理之規定。","finalWhy":"配合新增第五條第二項規定，於第一項第一款定其罰則，其他各款依序調整款次。","review":{"note":"照委員黃健豪等5人、委員許智傑等3人所提修正動議通過","text":"電信事業有下列情形之一者，處新臺幣十萬元以上一百萬元以下罰鍰，並通知限期改正；屆期未改正者，得按次處罰：\n一、違反第五條第二項規定，未向主管機關辦理電信事業之登記。\n二、違反第六條第五項規定，未辦理股票公開發行。\n三、違反第八條第四項規定，未優先處理緊急或必要通信。\n四、違反第九條第一項前段規定，未保存通信紀錄及帳務紀錄一定期間或未予保密。\n五、違反第九條第一項後段規定，未依用戶查詢提供通信紀錄或帳務紀錄。\n六、違反第十條規定，暫停或終止營業前未依限送備查、對外公告或通知用戶。\n七、違反第十一條第一項規定，未即公告或據實通報。\n八、違反主管機關依第十一條第二項所定辦法有關通報之範圍或方式之規定。\n九、違反第十三條第一項規定，無正當理由拒絕互連協商。\n十、違反第十三條第三項規定，未採取適當之保密措施。\n十一、違反第十三條第四項規定，變更前未通知與其互連之電信事業。\n十二、違反第十三條第五項規定，接續或轉接未辦理電信事業登記者提供之語音服務。\n十三、違反第十四條規定，未提供免費緊急通信服務。\n十四、違反第十五條第一項規定，未訂定資通安全維護計畫或未按計畫實施。\n十五、違反第十六條第一項規定，未提供號碼可攜服務或平等接取服務。\n十六、違反第十六條第四項規定，未共同成立或加入集中式資料庫管理機構。\n十七、違反主管機關依第十六條第五項所定辦法有關集中式資料庫管理機構設置、管理或限制之規定。\n十八、違反第十七條第一項規定，未訂定定型化服務契約條款，或於實施前、變更時未經主管機關核准。\n十九、違反第十八條規定，未定期辦理服務品質自我評鑑或未公布評鑑結果。\n二十、違反第十九條規定，未依限送主管機關核准其消費者保護處置方式，或未依限通知使用者。\n二十一、違反第二十條第一項規定，未共同設立電信消費爭議處理機構，或未提報其組織章程，經主管機關核准。\n二十二、違反主管機關依第二十條第四項規定之認定，未委託電信消費爭議處理機構辦理電信消費爭議事項。\n二十三、違反主管機關依第二十條第五項規定之認定，未加入電信消費爭議處理機構。\n二十四、違反主管機關依第二十四條規定之指定，未提供電信普及服務。\n二十五、違反第二十五條第一項規定，未申報或未依主管機關公告之格式、方式申報。\n電信消費爭議處理機構有下列情形之一者，處新臺幣十萬元以上一百萬元以下罰鍰，並通知限期改正；屆期未改正者，得按次處罰：\n一、違反第二十條第三項規定，組織章程變更時，未經核准即實施。\n二、違反主管機關依第二十條第七項所定辦法有關業務執行之監督管理之規定。"}}],"stages":[{"date":"2024-04-26","stage":"一讀","code":"院會-11-1-11","bill":"202110037700000","gazref":"113卷031期5213號 16-17頁"},{"date":"2024-05-03","stage":"一讀","code":"院會-11-1-12","bill":"202110040030000","gazref":"113卷035期5 function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {

    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)

  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };

    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }

}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;

  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {

  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }

  }

}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';

}

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });

      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
