<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>使用牌照稅法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

ppg/bills/202110175870000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/11/LCEWA01_110411_00077.pdf","proposers":["陳俊宇","伍麗華Saidhai‧Tahovecahe"],"ncosign":18,"people":[["陳俊宇","民進黨","提案"],["伍麗華Saidhai‧Tahovecahe","民進黨","提案"],["羅美玲","民進黨","連署"],["王定宇","民進黨","連署"],["陳秀寳","民進黨","連署"],["林俊憲","民進黨","連署"],["賴惠員","民進黨","連署"],["徐富癸","民進黨","連署"],["林月琴","民進黨","連署"],["李昆澤","民進黨","連署"],["李坤城","民進黨","連署"],["王義川","民進黨","連署"],["王美惠","民進黨","連署"],["陳培瑜","民進黨","連署"],["許智傑","民進黨","連署"],["黃捷","民進黨","連署"],["郭國文","民進黨","連署"],["劉建國","民進黨","連署"],["王正旭","民進黨","連署"],["吳琪銘","民進黨","連署"]],"party":[["民進黨",20]],"reason":"本院委員陳俊宇、伍麗華Saidhai Tahovecahe等20人，為推動國家整體節能減碳政策，並鼓勵民眾選擇低污染之交通工具，政府自先前即授權直轄市及縣（市）政府，得對完全以電能為動力之機動車輛免徵使用牌照稅。隨著電動車產業快速發展，相關設施與市場仍需持續完善，且現行免稅優惠對提升民眾購置意願及減輕使用成本具有實質效果，為確保政策推動之延續性，並協助我國達成運具電動化之目標，進而邁向2050淨零排放，爰擬具「使用牌照稅法第五條條文修正草案」。是否有當？敬請公決。","arts":["第五條"]},{"id":"202110178170000","who":"台灣民眾黨黨團","date":"2025-12-12","name":"「使用牌照稅法第五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110178170000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00215.pdf","proposers":["林國成","黃國昌","張啓楷","陳昭姿"],"ncosign":0,"people":[["林國成","民眾黨","提案"],["黃國昌","民眾黨","提案"],["張啓楷","民眾黨","提案"],["陳昭姿","民眾黨","提案"]],"party":[["民眾黨",4]],"reason":"本院台灣民眾黨黨團，有鑑於政府為實踐「2050淨零碳排」願景，近年多以利多政策獎勵國人換購電動車；惟查，據財團法人車輛研究測試中心統計，自2020至2024年底止，國內電動車之普及率僅有1.1%，普及率仍偏低，有延長免稅期限，以鼓勵民眾及相關產業發展之必要。復據相關市場意願調查顯示，在兼顧環保節能、實用性與價格等條件影響下，國內消費者基於里程焦慮、妥善率等因素多數選擇油電混合車（HEV），此由油電混合車2024年佔新車掛牌數25.7%，年增比例達17.33%可稽。綜上，審酌油電混合動力車輛亦非無助於降低私人運具整體碳排量，故基於逐步推動環保、減碳及永續之目的，爰擬具「使用牌照稅法第五條條文修正草案」。是否有當？敬請公決。","arts":["第五條"]},{"id":"202110177500000","who":"委員陳菁徽等23人","date":"2025-12-12","name":"「使用牌照稅法第五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110177500000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00216.pdf","proposers":["陳菁徽","黃健豪"],"ncosign":21,"people":[["陳菁徽","國民黨","提案"],["黃健豪","國民黨","提案"],["黃仁","國民黨","連署"],["牛煦庭","國民黨","連署"],["邱鎮軍","國民黨","連署"],["徐巧芯","國民黨","連署"],["吳宗憲","國民黨","連署"],["張智倫","國民黨","連署"],["盧縣一","國民黨","連署"],["林倩綺","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["葛如鈞","國民黨","連署"],["柯志恩","國民黨","連署"],["顏寬恒","國民黨","連署"],["許宇甄","國民黨","連署"],["葉元之","國民黨","連署"],["黃建賓","國民黨","連署"],["洪孟楷","國民黨","連署"],["林沛祥","國民黨","連署"],["蘇清泉","國民黨","連署"],["謝龍介","國民黨","連署"],["林德福","國民黨","連署"],["游顥","國民黨","連署"]],"party":[["國民黨",23]],"reason":"本院委員陳菁徽、黃健豪等23人，鑑於國家已確立「二○五○淨零排放」與「二○三○運具電動化」之關鍵政策目標，惟相關轉型之成敗，端視民眾消費行為之改變與配合。考量電動運具發展尚未普及且購置成本仍高，為有效引導民眾透過消費選擇支持國家政策，並實質減輕國人購車與持有之經濟負擔，政府應維持長期且穩定之法規獎勵機制。惟現行免徵使用牌照稅優惠將於民國一百十四年底屆期，為避免政策斷層影響減碳進程，爰擬具「使用牌照稅法第五條條文修正草案」，將免稅期限延長至民國一百十九年十二月三十一日。期透過租稅優惠之延續，創造國家達成綠能目標、產業獲得發展動能以及民眾享受低碳生活之三贏局面。是否有當？敬請公決。","arts":["第五條"]},{"id":"202110177720000","who":"委員張嘉郡等18人","date":"2025-12-12","name":"「使用牌照稅法第五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110177720000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00217.pdf","proposers":["張嘉郡","羅廷瑋"],"ncosign":7,"people":[["張嘉郡","國民黨","提案"],["羅廷瑋","國民黨","提案"],["黃仁","國民黨","連署"],["高金素梅","無黨籍","連署"],["張智倫","國民黨","連署"],["陳超明","無黨籍","連署"],["林沛祥","國民黨","連署"],["邱鎮軍","國民黨","連署"],["游顥","國民黨","連署"]],"party":[["國民黨",7],["無黨籍",2]],"reason":"本院委員張嘉郡、羅廷瑋等18人，我國車輛電動化推動速度仍顯緩慢，113年電動車銷量僅占新車市場8.3%，電動機車亦僅達整體機車市場之10.48%，距離國發會所設定119年電動車銷售30%及電動機車35%之目標仍有相當差距。為持續推動綠能運具發展，提升我國電動車產業鏈競爭力，爰擬具「使用牌照稅法第五條條文修正草案」，將電動車輛免徵使用牌照稅之優惠延長至中華民國119年12月31日，以鼓勵國人加速汰換低汙染運具，促進電動車整體普及率提升。是否有當？敬請公決。","arts":["第五條"]}],"arts":[{"no":"第五條","current":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十四年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十四年十二月三十一日止。","versions":[{"bill":"202110096420000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、氣候變遷因應法第四條已確立「國家溫室氣體長期減量目標為中華民國一百三十九年溫室氣體淨零排放」之目標，為促進電動車輛之推廣普及，實有延長免徵期限之必要。爰修正第二項再延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限五年。"},{"bill":"202110108800000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"氣候變遷因應法第四條已確立「國家溫室氣體長期減量目標為中華民國一百三十九年溫室氣體淨零排放」之目標，為促進電動車輛之推廣普及，實有延長免徵期限之必要。爰修正第二項再延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限五年。"},{"bill":"202110105650000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"修正第二項，延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限至119年12月31日。"},{"bill":"202110105330000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百二十年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百二十年十二月三十一日止。","note":"一、依國家發展委員會「2050淨零碳排路徑」規劃，我國預計在2030年達成市售電動汽車、機車占比分別為30%、35%，並於2040年包括新售小客車一同全面電動化。惟目前台灣純電自小客車市占率僅1%，顯離目標甚鉅。\n二、根據112年交通部「自用小客車使用狀況調查報告」，消費者不願意購置純電動車之考量因素依序為：「充電設施不健全」、「車輛單次充電後的續航限制」及「電動車價格太高」。顯見購置、使用成本及相關措施之方便性，對推展電動車之成效至關重要。\n三、電動汽機車持有之稅費成本需有消費者每年繳納，又電動汽機車持有年限動輒五年以上，為創造政策利多避免影響市場推廣，延長適用年限應以六年為宜。\n四、綜上，為避免增加電動車使用者之成本，賡續鼓勵民眾購買電動汽機車及業者投入建設相關設備，應延長免收牌照稅期限六年。"},{"bill":"202110102130000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"修正第二項，延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限至一百十九年十二月三十一日。"},{"bill":"202110103230000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、依據《氣候變遷因應法》第四條，我國已明定溫室氣體長期減量目標，預計於民國139年（2050年）達成淨零排放，為促進電動車輛之推廣及普及，以有效減少運輸部門碳排放，延長電動車免徵使用牌照稅之適用時間，實屬必要。相較於燃油車輛，電動車輛具低汙染、零碳排等環保效益，有助於我國落實綠能發展及環境永續政策；爰修正本條第二項，授權直轄市及縣（市）政府再延長完全以電能為動力之機動車輛免徵使用牌照稅期限五年，以強化政策誘因，促進電動車市場發展。\n二、政府推動電動車輛使用牌照稅免徵政策，迄今已有效減輕車主負擔，提升民眾購買電動車之意願，進而推動國內電動車產業技術創新與發展，為維持政策延續性及提升產業競爭力，實有延長免徵適用期間之必要；爰修正本法第五條，以延長免徵期限，確保電動車政策推動與產業發展之銜接，並強化我國邁向淨零排放目標之政策效益。"},{"bill":"202110111090000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、為達到淨零碳排目標，政府近年來極力推廣車主購買電動汽機車，並予以免使用牌照稅作為優惠，藉此鼓勵車主購買電動汽機車。\n二、此淨零碳排目標原先在100年時原先規範免稅期為3年，後續又視情況修正延長至107年。\n三、復在110年免稅期又延長至114年，惟目前電動車市場佔比約1/3，雖節稅之政策有利於電動汽機車數量成長，但仍有數量持續往上成長之空間。\n四、綜上，為持續推動淨零碳排目標，並鼓勵車主更換或繼續持有電動汽機車，爰酌修本法內容。"},{"bill":"202110116670000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為推動政府綠能科技創新產業願景，鼓勵低污染車輛的使用，並持續支持國內電動車輛產業及永續發展環境，修正第二項相關規定，將直轄市及縣（市）政府對電動車輛免徵使用牌照稅的期限延長五年，至一百十九年十二月三十一日。"},{"bill":"202110124790000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"修正第二項，延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限至119年12月31日。"},{"bill":"202110128440000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。\n前項減免年限屆期前半年，行政院得依電動車登記數量、充電基礎設施覆蓋率及其他低碳運具推展情況，決定是否延長減免年限。","note":"一、為鼓勵民眾轉向低碳運具，針對電動車輛有免徵使用牌照稅等優惠，惟免徵使用牌照稅時程將於民國（下同）114年12月31日屆期，然據經濟部統計113年度1到10月電動汽車銷售約僅占汽車市場8%；電動機車占13%，顯見民眾對於更換低碳運具仍有疑慮，為持續推廣電動車普及，及配合電動車之燃料費徵收時程擬於120年實施，故宜將電動車減免使用牌照稅延長至119年12月31日，以實現潔淨家園願景，達成永續發展目標。\n二、參酌貨物稅條例第12條之3第3項規定，賦予行政院得視推廣電動車之相關因素，如電動車登記數量、充電基礎設施覆蓋率或其他低碳運具推展情況等，於徵詢財政部、交通部或相關部會等意見後，在減免期限屆滿半年前，決定是否延長減免年限。"},{"bill":"202110128410000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"修正第二項，延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限至一百十九年十二月三十一日。"},{"bill":"202110130530000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。\n前項完全以電能為動力之機動車輛，馬達最大馬力超過二百六十二英制馬力（HP）或二百六十五點九公制馬力（PS）者，不予免徵。","note":"一、為有效刺激新能源車市場，促進產業技術創新，並推進國家永續發展與淨零排放目標，修正延長電動車輛免徵牌照稅優惠期限至119年12月31日。\n二、為避免低功率電動車車款與高功率車款在稅負計算上混淆，且為確保各類車輛能夠按其對道路資源需求與潛在載重、安全風險進行合理分級索稅。經參照本法第七條第一項第十一款，設定超過262HP或265.9PS馬力之電動車輛，不予免徵牌照稅，以符公平正義原則。\n三、雖然電動車在節能減碳上具有優勢，但高性能車款在電能消耗、電池需求與路面適應性上則可能對基礎建設和安全管理帶來更大挑戰。以262HP作為分界值，既鼓勵車廠推廣符合日常使用需求的節能型車款，也在一定程度上對高性能車型施以較高的稅負要求，以促使全國整體交通資源朝向更環保、更安全的方向發展。"},{"bill":"202110161420000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為推動政府綠能科技創新產業願景，鼓勵低污染車輛的使用，並持續支持國內電動車輛產業及永續發展環境，修正第二項相關規定，將直轄市及縣（市）政府對電動車輛免徵使用牌照稅的期限延長五年，至一百十九年十二月三十一日。"},{"bill":"201110161350000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"},{"bill":"202110162870000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"},{"bill":"202110163060000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、修正本條文。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限。\n三、爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"},{"bill":"202110163330000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，及實現二○五○淨零排放，又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長至一百十九年十二月三十一日止。"},{"bill":"202110163410000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳、落實國家2050淨零碳排目標，本條規定直轄市及縣市政府得對電動車免徵使用牌照稅，期間至114年12月31日。考量運具電動化政策仍在持續推動，並配合貨物稅條例延長電動車輛免徵貨物稅修正案提出，將本條得免徵使用牌照稅期間延長至119年12月31日，爰為第二項之修正。"},{"bill":"202110163580000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、我國已提出二○五○淨零排放路徑，並將「運具電動化及無碳化」列為關鍵戰略。為推動節能減碳，並鼓勵民眾選用低污染之電動車輛，並依《納稅者權利保護法》第六條第一項之規定，租稅優惠應以達成合理政策目的為限，故《使用牌照稅法》授權地方政府得在一定期限內對電動車輛免徵使用牌照稅。惟該期限將屆滿，基於持續引導民眾轉換至電動車、降低轉型成本，並推動電動車相關產業發展及能源轉型，爰擬具本修正草案，將地方政府得免徵使用牌照稅之期限延長五年至一百十九年十二月三十一日止。"},{"bill":"202110163970000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"},{"bill":"202110165210000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、截至2024年底，國內電動小客車普及率僅1.33%，市售比為9.32%，雖與2025年的1.4%與10%之目標相差不遠，但仍有成長空間。且交通部調查也發現，也僅27.8%機車族有意換購電動機車，所以可看出電動汽機車之滲透與使用率，仍然偏低。故為達節能減碳，鼓勵民眾使用低污染車輛，以利推動，完全以電能為動力之電動汽機車輛與相關產業之發展，宜延長免徵使用牌照稅之期限。\n二、爰提案修正本條第二項第一款及第二款部分文字，延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限至一百十九年十二月三十一日止。\n三、第一項文字未修正。"},{"bill":"202110164080000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十八年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十八年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，延長四年至一百十八年十二月三十一日止。"},{"bill":"202110166390000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、行政院國家發展委員會於111年3月30日宣布臺灣「2050淨零排放路徑」，計劃在119年將市區公車全面電動化，及電動車30%/與電動機車35%的銷售占比，並於124年達到電動車60%/與電動機車70%，最終於129年達到100%電動化的銷售比例。\n二、國際能源署「2025年全球電動車展望」報告指出，電動車113年在全球汽車市占率破20%。然審計部113年度中央總決算報告依交通部資料，104至113年度電動小客車穩定成長，截至113年，電動小客車普及率與市售比分別為1.33%及9.32%，電動機車為5.38%及10.77%，與全球市占率仍有差距，有賴政府賡續提供更多的租稅優惠政策。\n三、考量電動車市占率仍顯不足未突破兩成，為配合淨零排放目標，節能減碳推動全面普及，原免徵的電動車使用牌照稅即將屆期，有再延長租稅優惠政策免徵使用牌照稅至119年12月31日之必要，爰提修正本條第二項。"},{"bill":"202110167600000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、修正第二項，將對完全以電能為動力之電動車輛免徵使用牌照稅之措施再予延長至一百十九年十二月三十一日止。"},{"bill":"202110167270000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為鼓勵消費者落實節能減碳，選擇購置低污染車輛以帶動國內電動車輛相關產業發展，並實現二○五○淨零排放之目標，又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣市政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年至一百十九年十二月三十一日止。"},{"bill":"202110169890000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳並鼓勵民眾使用低污染車輛，帶動我國完全以電能為動力之機動車輛（以下簡稱電動車輛）產業發展，以達成政府一百十九年運具電動化階段性目標及二○五○淨零排放。又依《納稅者權利保護法》第六條第一項規定，租稅優惠應明定實施年限並以合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅之期限，配合貨物稅減免措施延長五年，至一百十九年十二月三十一日止。"},{"bill":"202110170830000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為落實節能減碳、推動交通運具電動化及邁向2050淨零排放之政策目標，政府自實施電動車輛免徵使用牌照稅以來，確實有助於鼓勵民眾購置低污染車輛。惟目前電動車輛（含汽、機車）整體普及率仍偏低，截至113年底，電動小客車市售比僅約8.79%、電動機車約9.90%，距離政府設定之114年市售比目標（電動小客車10%、電動機車20%）仍有差距，且充電設施與維修能量尚待完善。若於今年底（114年）終止減免措施，恐不利市場穩定成長與民眾購車意願，進而影響交通運輸低碳轉型進程及我國能源轉型政策之推動。為持續鼓勵民眾購置電動車輛，促進低碳交通發展，並確保政策推動之延續性與穩定性，爰修正第二項，延長電動車輛免徵使用牌照稅優惠期限至民國一百十九年十二月三十一日止，以兼顧環境永續與產業發展。"},{"bill":"202110170710000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百二十年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百二十年十二月三十一日止。","note":"為節能減碳，鼓勵民眾使用低污染車輛，以利我國電動車輛相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長至一百二十年十二月三十一日止。"},{"bill":"202110173240000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、針對電動車輛免徵牌照稅，有助於促進電動車普及以及減少碳排放，並帶動國內相關產業發展，對社會與環境效益顯著。若於期限屆滿後即行中止，恐導致市場誘因不足，影響產業推進與消費者選擇。\n二、爰提出修正草案，將免徵期限延長五年，至一百十九年十二月三十一日止，以利主管機關後續檢討及推動運具電動化之整體進程。"},{"bill":"202110172900000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、配合電動車輛減免貨物稅措施延長至民國一百十九年十二月三十一日止。"},{"bill":"202110172890000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"修正第二項，延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限至一百十九年十二月三十一日。"},{"bill":"202110173270000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，對完全以電能為動力之機動車輛免徵使用牌照稅：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。\n前項自中華民國一百十五年一月一日起因免徵使用牌照稅，造成直轄市及縣（市）政府減少之稅收，應由中央能源主管機關補足之。","note":"一、第一項未修正。\n二、為避免各地方政府徵收條件不一致，造成民眾因車籍地不同而遭受不同租稅對待，爰修正第二項序文，刪除地方政府「得」免徵使用牌照稅及「並報財政部備查」等文字，以利全國免徵規定一致。另為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府對電動車輛免徵使用牌照稅期限，延長五年至一百十九年十二月三十一日止。\n三、依據財政紀律法第五條及財政收支劃分法第三十八條之一規定，中央對減少之稅收應另指定相對收入為替代財源。爰增訂第三項，因免徵使用牌照稅，造成直轄市及縣（市）政府減少之稅收，應由中央能源主管機關彌補地方政府是項稅收之減少。"},{"bill":"202110170810000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、全球暖化現象自19世紀中的歐洲工業革命以來，全球平均溫度已明顯上升超過1℃，且根據專家評估，若在未來數十年內無法有效且迅速降低溫室氣體的排放，就無法將氣溫上升幅度控制在1.5℃至2℃內。\n二、且全球暖化現象若無法控制，人類將面臨更嚴峻的生態系統、糧食系統變異問題，例如氣溫快速升高，人類將無法再從事室外活動，或是受氣溫影響，糧食產量不穩定、亦或受自然環境變異影響，世界各地缺水問題日趨嚴重，人類生存困難等等問題。\n三、遂為遏止全球暖化、氣候變遷的負面影響，爰修正第二項，延長電能動力車輛免徵使用牌照稅之期限，鼓勵民眾購買綠能交通車，共同為「2050淨零碳排」目標努力。"},{"bill":"202110170860000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"},{"bill":"202110171890000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。\n前項自中華民國一百十五年一月一日起因免徵使用牌照稅造成直轄市及縣（市）政府減少之稅收，應由中央能源主管機關補足之。","note":"一、修正第二項，延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限至119年12月31日。\n二、依財政紀律法第五條及財政收支劃分法第三十八條之一規定，由中央對減少之稅收應另指定相對收入為替代財源。\n三、本次修正延長電動車輛免徵使用牌照稅期限，為中央能源主管機關經濟部之政策建議。依前揭規定，應由該機關指定相對收入來源，彌補地方政府是項稅收之減少。"},{"bill":"202110172170000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、酌調第二項第一款及第二款文字。為實現2050淨零排放目標及達成政府119年運具電動化階段性目標，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛相關產業發展；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"},{"bill":"202110172260000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，對完全以電能為動力之機動車輛免徵使用牌照稅：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。\n前項自中華民國一百十五年一月一日起因免徵使用牌照稅造成直轄市及縣（市）政府減少之稅收，應由中央能源主管機關補足。","note":"一、為避免各地方政府徵收條件不一致，造成民眾因車籍地不同而遭受不同租稅對待，免徵規定應全國一致，爰修正第二項文字，將地方政府可自行決定免徵的「得」字刪除，及「並報財政部備查」等字。\n二、鑒於氣候變遷因應法第四條已確立「國家溫室氣體長期減量目標為中華民國一百三十九年溫室氣體淨零排放」之目標，為促進電動車輛之推廣普及，實有延長免徵期限之必要，爰修正第二項再延長直轄市及縣（市）政府對完全以電能為動力之機動車輛免徵使用牌照稅期限五年以落實節能減碳，鼓勵民眾使用低污染車輛。\n三、另因修正延長電動車輛免徵使用牌照稅期限係依氣候變遷因應法及中央能源主管機關評估辦理，並依財政紀律法第五條及財政收支劃分法第三十八條之一規定，對於延長免稅期間造成直轄市及縣（市）政府稅收之損失，應由該機關指定相對財源補足之，爰增訂第三項，以維直轄市及縣（市）政府之稅收財源。"},{"bill":"202110172650000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"為達成低碳社會之目標，應強化民眾使用低汙染車輛比率，才能更快速達成行政院所提出之運具電話目標，並實現淨令排放。又納稅者權利保護法第六條第一項，租稅優惠應明訂實施年限，原提案修正第二項各款，將直轄市及縣（市）政府德對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"},{"bill":"202110174210000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、行政院國家發展委員會於111年3月30日宣布臺灣「2050淨零排放路徑」，計劃在119年將市區公車全面電動化，電動車30%與電動機車35%的銷售占比，並於124年達到電動車60%與電動機車70%，最終於129年達到100%電動化的銷售比例。\n二、國際能源署「2025年全球電動車展望」報告指出，電動車113年在全球汽車市占率破20%。據審計部113年度中央總決算報告截至113年，電動小客車普及率與市售比分別為1.33%及9.32%，電動機車為5.38%及10.77%，與全球市占率仍有差距，有賴政府賡續提供更多的租稅優惠政策。爰修正第五條第二項將免徵牌照稅之實施日期由原一百十四年十二月三十一日止延長到一百十九年十二月三十一日。"},{"bill":"202110175870000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為持續推動我國交通運具電動化，並確保政策推動之延續性，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅之期限延長五年，至一百十九年十二月三十一日止，以維持政策誘因，持續促進產業穩定成長。"},{"bill":"202110178170000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。\n直轄市及縣（市）政府，於本項規定生效起至中華民國一百十九年十二月三十一日止，得對符合財政部公告基準之油電混合動力車輛減半徵收使用牌照稅，並報財政部備查。","note":"一、有鑑於政府推動淨零排放政策，近年大幅度推動電動車優惠政策，國內電動汽車市場雖有逐漸崛起趨勢；惟據車輛測試中心（ARTC）統計，自2020年至2024年底止，國內電動車之普及率仍僅有1.1%，整體比率偏低。復揆諸電動機車市場，縱經濟部有持續推動燃油機車加速汰換為電動機車之相關補助，換購電動機車之成長幅度仍逐漸趨緩，2024年原核定補助目標為11.7萬輛，實際僅補助6.9萬輛；且據交通部及相關產業之市場調查，2025年國內電動機車市售比僅有6.8%，國人有意願換購電動機車者之比例僅有27.8%，主要困境仍可歸咎係囿於配套（即充電設備）不足、車輛價格高昂或認為政府補助力道不足等因素，以致無法有效刺激市場、提升消費者購買意願。\n二、再進步言之，參考美國於2025年取消對於純電動車相關補助政策，其國內之電動車市場即大幅萎縮，以及近年來歐盟、中國電能車市場因政府補助而穩定增長等現象可悉，目前環保電能車之市場目前仍多仰賴政府政策補助，否則極可能因消費者與市場機制之選擇，難以全面普及，而無法達到減碳需求，故實有修正現行條文第二項之延長電動汽車與電動機車免徵使用牌照稅期間，以期推動相關產業發展與確保維持環保永續之必要。\n三、又查，近年國內油電混合動力車輛，因其妥善率較佳、無里程焦慮、兼具環保優勢且費用較低等因素，市佔率與市場增長數均較純電動車具備優勢，截至2024年止，油電混合動力車輛之整體掛牌數已超過25%；故基於務實推動減碳政策之目的，若有相關獎勵機制，鼓勵消費者換購低汙染油電混合動力車輛，對於降低私人運具之碳排量，亦非未有助益。惟現行貨物稅條例第十二條，雖有將油電混合動力車輛納入貨物稅減半徵收之範疇，然本法就油電混合動力車輛卻未有牌照使用稅減免之鼓勵措施。綜上所述，基於逐步推動減碳永續之目的，爰參考貨物稅法第十二條之規範，修正本條第三項直轄市或縣（市）政府得減免油電混合車輛之牌照使用稅百分之五十，以利逐步落實減碳目標。"},{"bill":"202110177500000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"修正第二項將電動汽、機車之使用牌照稅實施減免措施延長至民國一百十九年十二月三十一日止，以引導民眾透過消費選擇支持國家減碳目標。"},{"bill":"202110177720000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。\n前項自中華民國一百十五年一月一日起因免徵使用牌照稅造成直轄市及縣（市）政府減少之稅收，應由中央能源主管機關補足之。","note":"一、修正第二項，延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限至119年12月31日。\n二、依財政紀律法第五條及財政收支劃分法第三十八條之一規定，由中央對減少之稅收應另指定相對收入為替代財源。\n三、本次修正延長電動車輛免徵使用牌照稅期限，為中央能源主管機關經濟部之政策建議。依前揭規定，應由該機關指定相對收入來源，彌補地方政府是項稅收之減少。"},{"bill":"201110161350200","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"}],"changed":true,"final":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","finalWhy":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。","review":{"note":"保留，送院會處理","text":""}},{"no":"第六條","current":null,"versions":[],"changed":true,"final":"各種交通工具使用牌照稅額，依下列規定課徵：\n一、機動車輛：分小客車、大客車、貨車、機車四類車輛，依本法機動車輛使用牌照稅分類稅額表之規定課徵之（如附表一至六）。\n二、船舶：總噸位在五噸以上者，營業用每艘全年新臺幣一萬六千三百八十元，非營業用每艘全年新臺幣四萬零三百二十元；未滿五噸者，營業用每艘全年新臺幣九千九百元，非營業用每艘全年新臺幣一萬七千五百五十元。\n[附表一：小客車使用牌照稅稅額表]\n[附表二：大客車及貨車使用牌照稅稅額表]\n[附表三：機車使用牌照稅稅額表]\n[附表四：完全以電能為動力之電動小客車使用牌照稅稅額表]\n[附表五：完全以電能為動力之電動機車使用牌照稅稅額表]\n[附表六：完全以電能為動力之電動大客車及貨車使用牌照稅稅額表]","finalWhy":"","review":null}],"stages":[{"date":"2025-03-14","stage":"一讀","code":"院會-11-3-5","bill":"202110096420000","gazref":"114卷026期5319號 3-3頁"},{"date":"2025-04-18","stage":"一讀","code":"院會-11-3-8","bill":"202110108800000","gazref":"114卷037期5330號一冊 26-26頁"},{"date":"2025-04-18","stage":"一讀","code":"院會-11-3-8","bill":"202110105650000","gazref":"114卷037期5330號一冊 45-45頁"},{"date":"2025-04-18","stage":"一讀","code":"院會-11-3-8","bill":"202110105330000","gazref":"114卷037期5330號一冊 46-46頁"},{"date":"2025-04-25","stage":"一讀","code":"院會-11-3-9","bill":"202110102130000","gazref":"114卷039期5332號 3-3頁"},{"date":"2025-04-25","stage":"一讀","code":"院會-11-3-9","bill":"202110103230000","gazref":"114卷039期5332號 8-8頁"},{"date":"2025-04-25","stage":"一讀","code":"院會-11-3-9","bill":"202110111090000","gazref":"114卷039期5332號 13-13頁"},{"date":"2025-05-02","stage":"一讀","code":"院會-11-3-10","bill":"202110116670000","gazref":"114卷042期5335號一冊 5-5頁"},{"date":"2025-05-16","stage":"一讀","code":"院會-11-3-12","bill":"202110124790000","gazref":"114卷048期5341號一冊 3-3頁"},{"date":"2025-05-23","stage":"一讀","code":"院會-11-3-13","bill":"202110128440000","gazref":"114卷050期5343號 7-7頁"},{"date":"2025-05-23","stage":"一讀","code":"院會-11-3-13","bill":"2021101 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
const PARTY = D.parties || {};
const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));
  return p;
}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = el('div', {class: 'toast', role: 'status', text: msg});
  document.body.append(t); setTimeout(() => t.remove(), 4500);
}
function copyHere(id) {
  const url = location.href.split('#')[0] + '#' + id;
  const ok = () => toast('已複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言，可以往前往後讀。');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, () => prompt('複製這個連結', url));
  else prompt('複製這個連結', url);
  history.replaceState(null, '', '#' + id);
}
function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {
  box.textContent = '';

  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      const pa = PARTY[normName(t.s)];
      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});
      d.dataset.fp = fp(t.s + '|' + (t.b.find(x => typeof x === 'string') || '').slice(0, 30));

        const p = b.bill && propById[b.bill];
        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});
          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));
          into.append(el('div', {class: 'readnote'}, btn));
        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));
    turns.append(d);
  });
  const idx = el('div', {class: 'idx'}, el('span', {text: '跳到發言者（' + first.size + ' 位）'}));
  const chips = el('div', {class: 'chips'});
  first.forEach((node, name) => { const b = el('button', {type: 'button', class: 'chip', text: name}); b.addEventListener('click', () => { turns.scrollTop = node.offsetTop - turns.offsetTop; }); chips.append(b); });
  idx.append(chips);
  box.append(idx, finder(turns), turns);
}

  '逕付二讀': {t: '逕付二讀', sub: '跳過委員會審查，直接排進院會二讀', what: '院會決定這個提案不交委員會審查（或從委員會抽出），直接進入二讀。', pts: [
    '通常在一讀報告事項時由黨團提議，院會無異議或表決通過。',
    '逕付二讀的提案多半會交黨團協商，或與已經審查完的相關提案併案處理。',
    '這一天只有主席宣告的幾句話，沒有實質討論。']},
  '二讀': {t: '二讀會', sub: '實質討論、逐條審議，最關鍵的階段', what: '委員會審查完畢，或是經逕付二讀後，將法案送到院會進行全體討論與表決。', pts: [
    '這是法案通過與否最關鍵、辯論最激烈的階段。',
    '進行廣泛討論以及逐條討論、修正。',
    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
Object.assign(READING, {
  '復議': {t: '復議', sub: '要求把已經表決的案子重新討論', what: '議案表決之後，當初投贊成的一方可以提出復議，要求重新討論、重新表決。', pts: [
    '復議被否決之後，同一個案子不能再提復議，決議就此確定。',
    '實務上常見多數方自己提出復議、再自己否決，目的是讓剛通過的條文確定下來。']},
  '重付表決': {t: '重付表決', sub: '對表決結果有異議，再表決一次', what: '出席委員對表決結果有異議時，經 15 人以上連署或附議，可以要求重新表決。', pts: ['以一次為限。']},
  '修正動議': {t: '修正動議', sub: '在院會對條文提出的修改案', what: '委員或黨團在二讀（或三讀）時，對討論中的條文提出另一個版本的文字，交院會表決。', pts: ['需要 10 人以上連署或附議。']},
  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
