的創造潛能。因此，政府應確保青年享有充分的文化權利，並打造有利的環境以鼓勵他們積極參與文化活動。"},{"bill":"202110104620000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。\n行政院應設置青年發展基金，辦理青年發展等相關事項。","note":"一、為保障青年事務預算之充裕，爰訂定第一項，明定各級政府應寬列支持青年事務預算，保障專款專用，合理分配及運用，持續充實青年政策所需預算。\n二、為因應青年政策需求，增加多元預算管道與預算管理及運用之彈性，爰訂定第二項，明定設置青年發展基金，辦理青年發展等相關事項。"},{"bill":"202110108760000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年開展具創造性之文化生活。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於歧視的權利。","note":"青年是社會中打造下一輪文化環境的原動力，文化權亦將驅動青年的創造力。爰明定政府應保障青年文化權，並應建立支持環境與鼓勵參與。"},{"bill":"202110107570000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年建立在地連結，關心地方議題，政府應設立區域性青年支持系統。"},{"bill":"202110107400000","text":"行政院應每四年召開一次「青年國是會議」，廣邀青年代表及各界人士共同研議青年發展政策，確保青年意見納入國家決策體系。","note":"一、為強化青年政策的民主參與與政策回應性，應透過制度化會議機制，提供青年直接參與國家政策討論之平台。\n二、「青年國是會議」應具備以下特性：\n(一)具代表性：與會者應涵蓋多元背景之青年、青年組織、專家學者與公民團體，反映真實多元的青年聲音。\n(二)具實質性：會議應討論具體政策議題，所形成之結論與建議應列入政策擬定參考，並由主管機關提出回應報告。\n(三)具制度性：會議召開應有明確程序與時程，並由行政院主責規劃與執行，確保持續舉行與成果累積。\n三、本條旨在建立青年與政府之長期對話機制，強化政策回應力與青年政治參與能量，形塑開放、共治的施政文化。"},{"bill":"202110109830000","text":"政府應設置青年事務專責機關或單位，負責規劃、推動與輔導青年事務，並優先任用具青年身分者，擔任主管。","note":"青年事務涉及多元且專業的需求，需具備專責機構的整合與推動，以有效回應青年的實際需求。設置青年事務專責機關或單位，有助於集中資源、強化政策執行效率，並確保青年政策具連貫性與實效性。且由青年身分者擔任主管，能更貼近青年觀點，提升政策的適切性與青年代表性。"},{"bill":"202110123900000","text":"政府應採取具體措施促進青年身心健康、預防毒品及藥物濫用，增加心理諮商及休閒之機會。\n政府應積極協調學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注預防毒品與藥物濫用等重要議題，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性以因應當代環境中之多元風險及衝擊。\n二、為因應社會近年青年議題，強調政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110124800000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。\n行政院應設置青年發展基金，辦理青年發展等相關事項。","note":"一、為保障青年事務預算之充裕，爰訂定第一項，明定各級政府應寬列支持青年事務預算，保障專款專用，合理分配及運用，持續充實青年政策所需預算。\n二、為因應青年政策需求，增加多元預算管道與預算管理及運用之彈性，爰訂定第二項，明定設置青年發展基金，辦理青年發展等相關事項。"},{"bill":"202110124830000","text":"政府應積極培育參與公共事務之青年人才，深化公民教育，推動青年賦權，確保青年享有公平參與體制之權利。","note":"為落實《憲法》及《世界人權宣言》第二十一條所保障之公共參與權，並參照青年發展政策綱領「公民力」推動策略，政府應積極培育青年公共參與意識，提供多元參與機會與表達意見之管道，使青年能實質參與政策制定，發揮影響力，促進其社會責任感與公民素養。"},{"bill":"202110126910000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助減輕有扶養義務負擔青年之身心壓力。","note":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，為減輕有扶養義務負擔青年之身心壓力，爰於第二項明定，政府應提供必要之照顧福祉及支援服務。"},{"bill":"202110127050000","text":"政府應採取具體措施促進青年身心健康、預防物質濫用，增加心理健康促進、心理諮商之機會。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、為落實經濟社會文化權利公約第十二條有關人人有權享受可能達到之最高標準之身體與精神健康之規定，並呼應聯合國「促進健康生活與福祉」、「消弭不平等現象」永續發展之目標，及世界衛生組織（WHO）「心理健康是普世人權」之理念，以強化、促進心理健康，行政院已核定「全民心理健康韌性計畫」，全面提升國民心理健康。考量身心健康係生存之根本，爰於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注預防物質濫用等重要議題，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性，以因應當代環境之多元風險及衝擊。\n二、又為因應社會近年青年議題，強化政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110128060000","text":"政府應採取具體措施促進青年身心健康、預防物質濫用，增加心理健康促進、心理諮商之機會。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、為落實經濟社會文化權利公約第十二條有關人人有權享受可能達到之最高標準之身體與精神健康之規定，並呼應聯合國「促進健康生活與福祉」、「消弭不平等現象」永續發展之目標，及世界衛生組織（WHO）「心理健康是普世人權」之理念，以強化、促進心理健康，行政院已核定「全民心理健康韌性計畫」，全面提升國民心理健康。考量身心健康係生存之根本，爰於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注預防物質濫用等重要議題，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性，以因應當代環境之多元風險及衝擊。\n二、又為因應社會近年青年議題，強化政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110128180000","text":"政府應採取具體措施促進青年身心健康，增加心理諮商及休閒之機會。\n政府應積極協調學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、為落實聯合國經濟社會文化權利公約第十二條：「本公約締約國確認人人有權享受可能達到之最高標準之身體與精神健康。……」，並呼應聯合國「促進健康生活與福祉」、「消弭不平等現象」永續發展之目標及世界衛生組織（WHO）「心理健康是普世人權」的理念，以強化、促進心理健康，行政院已核定「全民心理健康韌性計畫」，全面提升國民心理健康。考量身心健康係生存之根本，爰於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性以因應當代環境中之多元風險及衝擊。\n二、又為因應社會近年青年議題，強調政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110128310000","text":"青年有參與公共事務與社會發展之權利。國家應保障其參與管道、建立對話平台、並提供實質決策參與機制。","note":"明確規定青年擁有作為公民參與國家與社會發展之基本權利，不僅保障形式上之「參與權」，更進一步要求政府提供可落實參與之具體制度條件。條文設計三層機制：一、「保障管道」意指國家應確保資訊透明、可近、可用；二、「建立對話平台」則指雙向交流機制，如青年論壇、公聽會等；三、「實質決策參與機制」則強調青年在重大政策、法規及預算上應有具體影響力。該條呼應《青年發展政策綱領》「鼓勵青年公共參與與培力」，並對應聯合國《青年參與政策指引》中強調的meaningful participation概念。"},{"bill":"202110129310000","text":"政府應積極培育參與公共事務之青年人才，深化公民教育，推動青年賦權，確保青年享有公平參與體制之權利。","note":"一、為落實《憲法》、《世界人權宣言》第二十一條平等與直接之公共參與權利。\n二、參照青年發展政策綱領「公民力」之推動策略為「提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識」。"},{"bill":"202110132300000","text":"政府應採取具體措施促進青年身心健康，並以提供心理諮商服務之方式辦理。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、明定政府促進青年身心健康於第一項。並明定政府鼓勵開設各類課程於第二項。\n二、第一項所稱提供心理諮商服務，目前「15－45歲青壯世代心理健康支持方案」，規定前述年齡段者，每年得接受3次心理諮商服務，並全額補助心理諮商費用。本次立法，在法律層次規範中，賦予相關依據，以謀求政策措施往後能穩定推動，並保障青年之心理健康。另前引方案之年齡範圍，本法制定後，不改變原先政策嘉惠之對象，此應屬第二十八條第二項所定，另有對青年之保障，優於本法之規定，而應優先適用，本法制定後，無須依本法第二條第一項所定青年年齡範圍調整，一併敘明。"},{"bill":"202110143380000","text":"政府應採取具體措施，促進青年身心健康及自殺防治、預防物質濫用，增加心理健康促進、心理諮商及諮詢之機會。\n政府應積極鼓勵學校、機構、法人或團體，培育相關人才、開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、為落實經濟社會文化權利公約第十二條有關人人有權享受可能達到之最高標準之身體與精神健康之規定，並呼應聯合國「促進健康生活與福祉」、「消弭不平等現象」永續發展之目標，及世界衛生組織（WHO）「心理健康是普世人權」之理念，以強化、促進心理健康，行政院已核定「全民心理健康韌性計畫」，全面提升國民心理健康。考量身心健康係生存之根本，爰於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注預防物質濫用等重要議題，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性，以因應當代環境之多元風險及衝擊。同時，應以預防為導向，增加心理諮商同時增加諮詢機會，建構完整心理健康支持網絡，不漏接提升心理健康促進、自殺防治、初期識別與轉介服務之可近性，並培育具青年敏感度之心理健康專業人力，回應當代青年心理健康需求之多樣性與急迫性。\n二、又為因應社會近年青年議題，強化政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110155730000","text":"政府應採取具體措施，促進青年身心健康、社會適應及適性發展、預防毒品及藥物濫用，並增加心理諮詢及休閒之機會。\n政府應積極協調學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、鑑於身心健康乃青年發展之根本，本條文第一項明定政府應推展促進青年身心健康及提升生活品質之政策。此政策應包含預防毒品與藥物濫用等重要議題，以保障青年身心均衡發展，促使其與社會正向互動。透過提供充足的心理諮詢及休閒活動機會，旨在提升青年之身心韌性，使其足以因應當代環境中之多元風險與衝擊。\n二、為因應近年社會對青年議題的關注，並強調政府對青年全人發展的重視，本條文第二項特別規範政府應積極協調學校、機構、法人或團體，開設社會情緒、情感及生命教育相關課程。此舉旨在培養青年健全的人格特質，提升其情緒管理能力，並建立對生命價值的正確認識，進而促進其在個人成長與社會參與上的整體發展。"},{"bill":"202110166280000","text":"政府應採取具體措施促進青年身心健康、預防物質濫用，增加心理健康促進、心理諮商之機會。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、為落實經濟社會文化權利公約第十二條有關人人有權享受可能達到之最高標準之身體與精神健康之規定，並呼應聯合國「促進健康生活與福祉」、「消弭不平等現象」永續發展之目標，及世界衛生組織（WHO）「心理健康是普世人權」之理念，以強化、促進心理健康，行政院已核定「全民心理健康韌性計畫」，全面提升國民心理健康。考量身心健康係生存之根本，爰於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注預防物質濫用等重要議題，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性，以因應當代環境之多元風險及衝擊。\n二、又為因應社會近年青年議題，強化政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110169130000","text":"政府應採取具體措施促進青年身心健康、預防物質濫用，增加心理健康促進、心理諮商之機會。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、為落實經濟社會文化權利公約第十二條有關人人有權享受可能達到之最高標準之身體與精神健康之規定，並呼應聯合國「促進健康生活與福祉」、「消弭不平等現象」永續發展之目標，及世界衛生組織（WHO）「心理健康是普世人權」之理念，以強化、促進心理健康，行政院已核定「全民心理健康韌性計畫」，全面提升國民心理健康。考量身心健康係生存之根本，爰於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注預防物質濫用等重要議題，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性，以因應當代環境之多元風險及衝擊。\n二、又為因應社會近年青年議題，強化政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110175160000","text":"為提升青年國際競爭力，政府應鼓勵青年參與國際交流，結合學校與民間資源，獎勵青年拓展國際視野，提升與國際接軌之能力，增進對國際事務之參與機會。","note":"明定政府應提升青年國際競爭力，增進對國際事務之參與機會。"}],"changed":true,"final":"政府應訂定青年生育及家庭政策，積極提供協助措施，保障青年友善育兒環境、強化家庭照顧及生育教養支持系統。","finalWhy":"世界人權宣言第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務；另公民與政治權利國際公約第二十三條第一項規定，家庭為社會之自然基本團體單位，應受社會及國家之保護。爰於本條明定政府應訂定生育及家庭政策，以強化家庭照顧、提供青年懷孕期間及生育教養服務，保障青年享有友善之育兒環境，並建立相關支持系統。","review":{"note":"修正通過","text":"政府應訂定青年生育及家庭政策，積極提供協助措施，保障青年友善育兒環境、強化家庭照顧及生育教養支持系統。"}},{"no":"第十四條","current":null,"versions":[{"bill":"202110017600000","text":"主管機關應置專責人員辦理本法規定相關事宜；其人數應依業務增減而調整之。\n青年發展相關業務應遴用專業人員辦理。","note":"為加強執行有關青年發展業務，爰參照老人福利法第七條之立法例，明定各級主管機關應設專責單位或置專責人員。"},{"bill":"202110040040000","text":"政府應考量國家發展方向，社會需求與政策遠景，每四年擬定青年政策白皮書，載明施政重點及成果。每兩年擬定國家青年發展計畫，作為青年相關政策之施政依據。\n前項青年政策白皮書及國家青年發展計畫之制定，應召集相關部會、學者專家、社會團體、青年政策諮詢會報代表參與，並廣納各界意見，由中央主管機關核定。","note":"一、政府應考量國家發展方向，社會需求及政策遠景，建立我國青年政策之施政依據及指導原則，故制定第一項。\n二、為使相關利害關係人之意見得到充分表達，爰訂定第二項，明定政府應召集相關部會、學者專家、社會團體、青年政策諮詢會報代表共同討論。"},{"bill":"201110120370000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110057110000","text":"各級政府應編列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。\n行政院應設置青年發展基金，辦理青年發展等相關事項。","note":"一、為保障青年事務預算之充裕，爰訂定第一項，明定各級政府應編列支持青年事務預算，保障專款專用，合理分配及運用，持續充實青年政策所需預算。\n二、為因應青年政策需求，增加多元預算管道與預算管理及運用之彈性，爰訂定第二項，明定設置青年發展基金，辦理青年發展等相關事項。"},{"bill":"202110059880000","text":"中央政府為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"有關青年發展業務之推動與規劃，考量各機關之權責範疇不一，爰於本條規定中央政府應設置或指定專責單位。"},{"bill":"202110061560000","text":"政府應訂定全國青年日，以支持青年並提升各界對青年議題之關懷。","note":"藉由訂定相關節日，深化推展青年議題，並提升各界對青年族群之關懷與支持。"},{"bill":"202110061410000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"各級政府應寬列支持青年事務預算，保障青年事務預算之充裕。"},{"bill":"202110068970000","text":"各級政府應設置專責機關或單位，規劃、辦理及輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務工作涉及各級政府及各相關政府部門之業務，需共同合作協調才能完成。為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責機關或單位，負責規劃、推動辦理及輔導青年事務。\n二、為確保第一項之青年專責單位首長具青年身分，爰訂定第二項。"},{"bill":"202110070660000","text":"各級政府應設置專責機關或單位辦理青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務工作涉及跨部會、跨局處之業務，需共同合作協調始能順利推動。為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責機關或單位，負責規劃、推動辦理及輔導青年事務。\n二、為落實青年政策之規劃、辦理及督導，青年專責單位首長應具青年身分，始能制定符合青年需求之政策，爰訂定第二項。"},{"bill":"202110071010000","text":"政府應鼓勵青年積極參與公共事務，提供相關補助，並增設、規劃青年公共空間。","note":"為落實青年參與，爰規定政府應提供青年公共參與之補助及活動所需空間。"},{"bill":"202110072290000","text":"政府應鼓勵青年參與國際合作及交流，強化青年國際事務知能。","note":"一、青年參與國際合作及交流之鼓勵。\n二、政府應促進青年參與國際事務及交流，鼓勵開拓國際視野並落實在地行動，強化青年國際事務知能，培養青年全球化之技能，促進國際合作，爰訂定本條。"},{"bill":"202110072330000","text":"政府應訂定全國青年日，以支持青年並提升各界對青年議題之關懷。","note":"以節日訂定提升社會對青年議題之關懷。"},{"bill":"202110072870000","text":"中央政府為有效整合及推動青年事務之政策及相關事務，應設置青年事務專責部會。","note":"明定中央政府應設置青年事務專責部會。"},{"bill":"202110075700000","text":"政府應鼓勵青年參與國際活動與交流，對青年參與國際事務給予必要之協助，強化青年國際事務知能。","note":"參酌104年核定之青年發展政策綱領中「全球力」內涵，拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力。"},{"bill":"202110076040000","text":"政府應鼓勵青年積極參與公共事務，提供相關補助，並增設、規劃青年公共空間。","note":"為落實青年參與，爰規定政府應提供青年公共參與之補助及活動所需空間。"},{"bill":"202110078370000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年文化與藝術工作者。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於歧視的權利。","note":"一、《文化基本法》保障人民文化權利，擴大文化參與。\n二、青年是社會中打造下一輪文化環境的原動力，文化權亦將驅動青年的創造力。爰明定政府應保障青年文化權，並應建立支持環境與鼓勵參與。"},{"bill":"202110079860000","text":"各級政府應寬列青年事務預算，專款專用，合理分配及運用，持續充實青年發展所需之各項預算。","note":"各級政府應寬列支持青年事務之預算，保障青年事務預算之充裕以規劃各項有利於青年之政策。"},{"bill":"202110080450000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年文化與藝術工作者。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於歧視的權利。","note":"一、《文化基本法》保障人民文化權利，擴大文化參與。\n二、青年是社會中打造下一輪文化環境的原動力，文化權亦將驅動青年的創造力。爰明定政府應保障青年文化權，並應建立支持環境與鼓勵參與。"},{"bill":"202110085510000","text":"政府應鼓勵青年參與國際活動與交流，對青年參與國際事務給予必要之協助，強化青年國際事務知能。","note":"參酌104年核定之青年發展政策綱領中「全球力」內涵，拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力。"},{"bill":"202110100300000","text":"政府應積極培育參與公共事務之青年人才，並提供適當之表達意見管道，深化公民教育，推動青年賦權，確保青年享有公平參與體制之權利。","note":"一、為落實《憲法》、《世界人權宣言》第二十一條平等與直接之公共參與權利。\n二、參照青年發展政策綱領「公民力」之推動策略為「提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識」。"},{"bill":"202110098760000","text":"為有效整合及推動青年事務之政策，中央主管機關應設置青年事務專責單位。","note":"明定中央主管機關應設置青年事務專責單位，以利跨部會整合協調。"},{"bill":"202110098790000","text":"政府應每四年於年度終了發布青年政策白皮書，並書明用於青年之所有資源及發展願景。\n中央主管機關應根據青年政策白皮書，每四年修訂青年發展政策綱領。\n青年政策白皮書及青年發展政策綱領之修訂，應依前條之規定，廣納各界意見，並經青年國是會議討論，由行政院核定後實施。\n前項青年國是會議，每四年由行政院召開。","note":"一、參酌《中小企業發展條例》有關發布白皮書之規定，明定每四年應發布青年政策白皮書；且中央主管機關應以此再修訂青年發展政策綱領。\n二、青年政策白皮書及青年發展綱領應同前條之規定，廣邀各界民間人士參與制定，並由行政院每四年召開國是會議討論之，再經行政院核定後實施。"},{"bill":"202110102250000","text":"政府應鼓勵青年參與國際活動與交流，對青年參與國際事務給予必要之協助，強化青年國際事務知能。","note":"參酌104年核定之青年發展政策綱領中「全球力」內涵，拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力。"},{"bill":"202110103250000","text":"政府應鼓勵青年參與國際活動與交流，對青年參與國際事務給予必要之協助，強化青年國際事務知能。","note":"參酌104年核定之青年發展政策綱領中「全球力」內涵，本法旨在拓寬青年參與國際體驗與學習的途徑，並促使其加深對多元文化的認識，以全面提升其國際競爭力。"},{"bill":"202110104620000","text":"政府應訂定全國青年日，以支持青年並提升各界對青年議題之關懷。","note":"藉由訂定相關節日，深化推展青年議題，並提升各界對青年族群之關懷與支持。"},{"bill":"202110108760000","text":"政府應鼓勵青年參與國際活動與交流，對青年參與國際事務給予必要之協助，強化青年國際事務知能。","note":"明定政府應提升青年國際競爭力，增進其對國際事務之參與機會。"},{"bill":"202110107570000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。","note":"永續韌性為青年未來之基礎，政府應採取具體措施。"},{"bill":"202110107400000","text":"各級政府應寬列青年事務相關預算，確保青年政策得以穩定推動與具體落實。","note":"一、確保政府提供穩定的青年事務財政支持。\n二、各級政府應依據本法及青年政策綱領，於年度預算編列中專項編列青年事務相關經費，作為推動青年教育、就業、居住、健康、參與等措施之財務保障。\n三、同時應推動預算透明化與參與式預算制度，讓青年能參與資源分配過程，提升政策正當性與社會共識。\n四、本條強調青年政策應具備穩定、持續與可預期之資源基礎，避免政策淪為口號，實現長效治理。"},{"bill":"202110109830000","text":"政府應專列青年事務經費，保障專款專用，合理分配與運用，並對偏遠及特殊地區青年事務予以優先補助。","note":"明為保障青年事務與青年權利有充足財源推動與維護，應寬且專列青年事務預算。"},{"bill":"202110123900000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"明定政府應訂定相關政策，發展友善平權環境，消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢。"},{"bill":"202110124800000","text":"政府應訂定全國青年日，以支持青年並提升各界對青年議題之關懷。","note":"藉由訂定青年相關節日，同時深化發展青年議題，提升社會各界對青年族群之關懷與支持。"},{"bill":"202110124830000","text":"各級政府應設置專責機關或單位，規劃、辦理及輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"青年事務涵蓋多個政府層級與部門，須透過協調合作方能有效推動相關政策。為提升推動效率，應明定各級政府設置青年專責單位，負責青年事務之規劃與執行。並進一步規範該單位首長須具青年身分，以確保政策更貼近青年需求與觀點。"},{"bill":"202110126910000","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，並鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展，爰規定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110127050000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110128060000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110128180000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110128310000","text":"青年得依法律組織團體，促進公共參與。國家應扶植青年社群、非營利組織與自治組織之成立與永續運作。","note":"設計旨在奠定青年集體組織權與社群行動之法源基礎，使青年能透過自我組織與網絡協作形式，積極參與社會事務與公共倡議。條文所稱「依法律組織團體」涵蓋社團、學生會、工會、社會企業、青年協會等多元形式；後段則要求國家提供創設、經費、空間、人才等面向之「扶植」，以確保組織之「永續運作」。此條回應《青年發展政策綱領》第十項「支持青年社群與團體發展」，並參考德國《青少年福利法》中對Jugendverbande（青年協會）的制度支持架構，體現政府由下而上培力社會力量之治理模式。相較原草案僅提倡「鼓勵參與」，本條將青年自治具體制度化，使其不僅為權利主體，亦可為社會變革之推動者。"},{"bill":"202110129310000","text":"各級政府應設置專責機關或單位，規劃、辦理及輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務工作涉及各級政府及各相關政府部門之業務，需共同合作協調才能完成。為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責機關或單位，負責規劃、推動辦理及輔導青年事務。\n二、為確保第一項之青年專責單位首長具青年身分，爰訂定第二項。"},{"bill":"202110132300000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"明定政府應發展友善平權之環境，以提供鼓勵並支持青年成長、發展和參與的社會環境。"},{"bill":"202110143380000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110155730000","text":"政府應訂定政策，發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為營造暴力零容忍、包容多元的社會環境，使青年得以安心生活、無懼逐夢，本條文明定政府應制定政策，發展友善平權的社會條件，根本性維護青年人身安全。政府應透過多面向措施，積極禁止暴力、消除歧視、預防犯罪與防制霸凌，全面保障青年免於不法侵害與不公平對待，確保其尊嚴與發展，共構公正和諧社會。"},{"bill":"202110166280000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110169130000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110175160000","text":"為有效整合及推動青年事務之政策，中央主管機關應設置青年事務專責單位，統籌規劃與協調青年政策。相關設置要點由行政院定之。","note":"一、明定中央主管機關應設置青年事務專責單位，以利跨部會整合協調。\n二、鑒於青年事務由各部會分管，為了統籌與有效管理，應明確規定行政院為主管機關，負責整合與協調各部門工作，提升青年政策的執行效率與整體效果。"}],"changed":true,"final":"政府應採取具體措施促進青年身心健康，增加心理健康促進、心理諮商之機會。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","finalWhy":"一、為落實經濟社會文化權利公約第十二條有關人人有權享受可能達到之最高標準之身體與精神健康之規定，並呼應聯合國「促進健康生活與福祉」、「消弭不平等現象」永續發展之目標，及世界衛生組織（WHO）「心理健康是普世人權」之理念，以強化、促進心理健康，行政院已核定「全民心理健康韌性計畫」，全面提升國民心理健康。考量身心健康係生存之根本，爰於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注自殺防治、預防物質濫用等重要議題，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性，以因應當代環境之多元風險及衝擊。\n二、又為因應社會近年青年議題，強化政府對社會情緒教育、生命教育及情感教育之重視，爰為第二項規定。","review":{"note":"照行政院提案通過","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。"}},{"no":"第十五條","current":null,"versions":[{"bill":"202110017600000","text":"各級政府得聘請青年發展有關之機關、團體代表及學者專家備供諮詢。\n各級政府得邀請有關民眾與團體共同參與加強推動青年發展工作。","note":"青年發展政策必須整合各方資源，並傾聽民意，方得以順利推展。因此政府得聘請青年發展事務有關之機關、團體代表及學者專家備供諮詢，使青年發展工作推動更有效。"},{"bill":"202110040040000","text":"政府應協助以青年為主體之非營利組織及社團發展，制定相關獎勵、補助及培力計畫。","note":"為鼓勵青年事務之參與，及促進公民社會蓬勃發展，爰制定本條，要求制定相關獎勵補助辦法，協助青年參與公共事務。"},{"bill":"201110120370000","text":"政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。","note":"為提升青年健康力，爰於本條明定政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。"},{"bill":"202110057110000","text":"為支持青年並促進政府及社會各界共同關懷青年、青年發展及青年事務，應訂定臺灣青年日。","note":"設立青年專屬節日可促進入民對於青年議題之關注、深化推展青年議題。"},{"bill":"202110059880000","text":"各級政府應設置專責機關或單位，辦理與輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責機關或單位。\n二、為確保青年專責單位之首長具青年身分，爰訂定第二項。"},{"bill":"202110061560000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策白皮書，每二年擬訂國家青年發展計畫，作為青年相關政策之施政依據。\n青年政策白皮書及國家青年發展計畫之訂定，應召集相關部會、地方政府、學者專家、社會團體及青年代表之參與，並廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書，每兩年擬訂國家青年發展計畫，爰訂定第一項。\n二、為廣納各界意見，研議青年政策白皮書及國家青年發展計畫，爰訂定第二項，明定政府應召集相關部會、地方政府、學者專家、社會團體及青年代表召開青年國是會議，並經會議討論後由行政院核定。\n三、第三項明定青年國是會議每四年由行政院召開。"},{"bill":"202110061410000","text":"政府應訂定全國青年日，以支持青年並提升各界對青年議題之關注。","note":"明定青年日，以節日訂定實施之方式提升各界對青年議題的關注。"},{"bill":"202110068970000","text":"中央政府為有效整合及推動青年事務之政策及相關事務，應設置青年事務專責部會。","note":"青年輔導委員會於民國102年配合政府組織改造併入教育部，部分業務及人員則依業務屬性併入經濟部及勞動部。如今，教育部青年發展署為中央政府三級機關，無法有效跨部會協調青年政策。青年政策複雜且專業，行政院有必要設置青年事務專責部會，積極推動各項協助青年發展業務。"},{"bill":"202110070660000","text":"各級政府應寬列青年事務經費，專款專用，合理分配及運用資源，並持續充實青年發展所需預算。","note":"為有效推動青年政策，相關青年事務經費應專款專用，並有效運用；且為青年事務之延續性，青年發展預算應由各級政府持續編列。"},{"bill":"202110071010000","text":"政府應支持青年組織人民團體或財團法人，並輔導、支持及補助其運作。","note":"為促進青年對各項事務之參與並集結發聲，爰鼓勵青年自行籌組成立法人或團體。"},{"bill":"202110072290000","text":"政府應積極培育參與公共事務之青年人才，推動青年賦權，確保青年享有公平參與體制之權利。","note":"一、青年關於參與公共事務之人才培育。\n二、為落實青年公共參與權，政府應積極培育與鼓勵青年參與公共事務，並提供公共參與之機會，賦予青年對公共事務之實質影響力，確保青年享有公平參與政策制定及影響政府體制運作之權利，爰訂定本條。"},{"bill":"202110072330000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策白皮書，每兩年擬訂國家青年發展計畫，作為青年相關政策之施政依據。青年政策白皮書與國家青年發展計畫應包含：\n一、青年政策或發展計畫基本方向。\n二、青年政策或發展計畫推動目標。\n三、青年政策或發展計畫各領域主要政策。\n四、過往青年政策或發展計畫之分析評估。\n五、青年政策或發展計畫相關機能之調整。\n六、青年政策或發展計畫財源籌措辦法。\n七、其他與青年政策或發展計畫相關事項。\n青年政策白皮書及國家青年發展計畫之訂定，應召集相關部會、學者專家、社會團體之參與，並廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"政府應廣納意見，以青年政策白皮書與青年發展計畫，建立我國青年相關政策之施政依據及指導原則。"},{"bill":"202110072870000","text":"各級政府為執行青年事務所需之政策或措施，應寬列青年事務經費，保障專款專用，並合理分配及運用資源，確保預算經費符合推行政策所需。對偏遠及特殊地區之青年事務，應優先予以補助。","note":"為保障青年事務與青年權利順利推動與維護，明定各級政府應寬列青年事務預算。"},{"bill":"202110075700000","text":"中央主管機關為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"一、民國五○年代所設立之行政院青年輔導委員會，於一○二年因組織改造併入教育部，現為中央政府三級機關，對於跨部會溝通與協調恐有實務執行之困難。\n二、青年政策複雜、專業、多元且具變化性，行政院應設置青年事務專責部會以為因應。"},{"bill":"202110076040000","text":"政府應支持青年組織人民團體或財團法人，並輔導、支持及補助其運作。","note":"為促進青年對各項事務之參與並集結發聲，爰鼓勵青年自行籌組成立法人或團體。"},{"bill":"202110078370000","text":"政府應鼓勵青年參與國際活動與交流，從事國際交流，強化青年國際事務知能。","note":"參酌104年核定之青年發展政策綱領中「全球力」內涵，拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力。"},{"bill":"202110079860000","text":"行政院應考量國家發展方向、社會需求與政策願景，每四年擬訂公布青年政策白皮書，作為青年相關政策之施政依據，並依執行狀況及國內外情勢發展定期檢討調修。\n中央主管機關應根據青年政策白皮書，每二年擬定青年發展政策計畫，報行政院核定後實施。\n青年政策白皮書及國家青年發展計畫之訂定，應召集相關部會、學者專家、社會團體之參與，並廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"為落實我國青年政策之目標與執行，同時因應國家發展及社會變遷，行政院應廣納意見，每四年擬訂公布青年政策白皮書、每二年擬定青年發展政策計畫，以青年政策白皮書與青年發展計畫，確立我國青年相關政策之施政依據及指導原則，並依執行狀況及國內外情勢發展定期檢討調修。"},{"bill":"202110080450000","text":"政府應鼓勵青年參與國際活動與交流，從事國際交流，強化青年國際事務知能。","note":"參酌104年核定之青年發展政策綱領中「全球力」內涵，拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力。"},{"bill":"202110085510000","text":"中央主管機關為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"一、民國五○年代所設立之行政院青年輔導委員會，於一○二年因組織改造併入教育部，現為中央政府三級機關，對於跨部會溝通與協調恐有實務執行之困難。\n二、青年政策複雜、專業、多元且具變化性，行政院應設置青年事務專責部會以為因應。"},{"bill":"202110100300000","text":"各級政府應設置專責機關或單位，規劃、辦理及輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務工作涉及各級政府及各相關政府部門之業務，需共同合作協調才能完成。為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責機關或單位，負責規劃、推動辦理及輔導青年事務。\n二、為確保第一項之青年專責單位首長具青年身分，爰訂定第二項。"},{"bill":"202110098760000","text":"各級政府應設置專責單位，辦理輔導青年事務，其首長應具青年身分。","note":"明定各級政府應設置青年事務專責單位，且其首長應具青年身分。"},{"bill":"202110098790000","text":"各級政府應寬列青年事務預算，合理分配及專款專用，推動青年發展及辦理青年事務等相關事項。","note":"為支持青年事務推展，且第十條規定各級政府應設置青年專責單位，便應編列公務預算支應，並明定專款專用，避免預算無法實際用於青年。"},{"bill":"202110102250000","text":"中央主管機關為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"一、民國50年代所設立之行政院青年輔導委員會，於102年因組織改造併入教育部，現為中央政府三級機關，對於跨部會溝通與協調恐有實務執行之困難。\n二、青年政策複雜、專業、多元且具變化性，行政院應設置青年事務專責部會以為因應。"},{"bill":"202110103250000","text":"中央主管機關為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"一、民國五○年代成立的行政院青年輔導委員會，於一○二年因組織調整而併入教育部，目前成為中央政府三級機關，這可能在跨部門溝通與協調上造成實際操作上的困難。\n二、鑑於青年政策具有複雜性、專業性、多元性以及不斷變化的特點，行政院應考慮設立專門負責青年事務的部會，以更有效地應對相關挑戰。"},{"bill":"202110104620000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策白皮書，每二年擬訂國家青年發展計畫，作為青年相關政策之施政依據。\n青年政策白皮書及國家青年發展計畫之訂定，應召集相關部會、學者專家、社會團體之參與，並廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書，每兩年擬訂國家青年發展計畫，爰訂定第一項。\n二、為廣納各界意見，研議青年政策白皮書及國家青年發展計畫，爰訂定第二項，明定政府應召集相關部會、學者專家、社會團體召開青年國是會議，並經會議討論後由行政院核定。\n三、第三項明定青年國是會議每四年由行政院召開。"},{"bill":"202110108760000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年建立在地連結，關心地方議題，政府應設立區域性青年支持系統。"},{"bill":"202110107570000","text":"政府應訂定培養青年金融素養政策，培植金融識能及良好財務管理能力，並推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險。","note":"為提升青年整體財金能力，政府應積極輔導金融機構規劃適合青年的金融商品與服務，協助其參與金融活動並妥善管理財務，同時加強金融教育與識能培養。此外，因應近年來社會對金融安全的關注，應進一步強化青年對金融風險的抵抗力，推動防制詐騙教育與相關措施，以降低青年受騙風險，並提供必要協助予受害者。"},{"bill":"202110107400000","text":"政府應於各區域設立青年支持機構，提供就業、創業、社會參與、心理諮商等多元服務，促進青年之發展、交流與合作。","note":"一、促進區域性青年支持，確保資源均衡分配。\n二、為促進青年就業、創業及社會參與，並強化區域間青年之交流與合作，爰設立青年支持機構，提供相關諮詢、培力及資源媒合等服務。期藉由本法案，建立完善青年支持體系，提升青年整體發展機會，促進社會永續發展。"},{"bill":"202110109830000","text":"政府應進行青年事務相關調查、研究與統計，建立青年研究資料庫，並定期公布結果；每四年發布青年政策白皮書，制定青年發展政策綱領及推動計畫。","note":"政府應系統性檢視青年發展現狀及需求變遷，建立專屬資料庫，提供青年相關的全面、精確資訊，使各級政府制定政策時有充分依據，從而增進政策的實效性與針對性，並定期發布青年政策白皮書，制定青年發展政策綱領及推動計畫。"},{"bill":"202110123900000","text":"政府應訂定政策，提供青年健康安全的運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。","note":"明定政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。"},{"bill":"202110124800000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策白皮書，每二年擬訂國家青年發展計畫，作為青年相關政策之施政依據。\n青年政策白皮書及國家青年發展計畫之訂定，應召集相關部會、學者專家、社會團體之參與，並廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、政府應考量國家發展、社會需求與政策遠景，每四年擬定青年政策白皮書，每兩年擬訂國家青年發展計畫，以做為建立我國青年相關政策之施政依據及指導原則。\n二、為廣納各界意見，以務實、完整研議青年政策白皮書及國家青年發展計畫，明定政府應召集相關部會、學者專家、社會團體召開青年國是會議，並經會議討論後由行政院核定。\n三、第三項明定青年國是會議每四年由行政院召開。"},{"bill":"202110124830000","text":"中央政府為有效整合及推動青年事務之政策及相關事務，應設置青年事務專責部會。","note":"現行針對青年事務分散於多個部會，致使青年發展署難以有效統籌與跨部會協調。鑒於青年政策日益複雜且具專業性，社會各界亦有設立專責機關之呼聲，行政院應考量設置青年事務專責部會，以整合資源、強化政策效能，全面支持青年發展。"},{"bill":"202110126910000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年建立在地連結，關心地方議題，政府應設立區域性青年支持系統。"},{"bill":"202110127050000","text":"政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。","note":"為提升青年健康力，爰於本條明定政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。"},{"bill":"202110128060000","text":"政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。","note":"為提升青年健康力，爰於本條明定政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。"},{"bill":"202110128180000","text":"政府應訂定政策，提供和普設青年健康的運動、休閒環境和場地，促進青年參與運動及技能發展，支持青年運動平權之機會。","note":"為提升青年健康力，爰於本條明定政府應訂定政策，提供並普及青年健康之運動和休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。"},{"bill":"202110128310000","text":"國家應就經濟弱勢、身心障礙、少數族群、性別多元及其他處境不利之青年，採取積極扶助措施，確保其平等發展與社會參與機會。","note":"明確揭示國家對弱勢青年的「積極義務」，係本法促進實質平等與社會公正之核心規定。條文所列「經濟弱勢、身心障礙、少數族群、性別多元」等對象，依據《青年發展政策綱領》之多元包容精神設計，並開放「其他處境不利」作為彈性類別，兼顧法規範穩定與未來應變彈性。積極扶助措施涵蓋資源傾斜、特別方案、定向補助、保障名額等，以確保上述青年不因結構性困境而遭受制度性排除。國際方面，該條呼應聯合國《2030永續發展目標》中「不落下任何人」原則（Leave no one behind），並與芬蘭及紐西蘭青年法中所提之「優先協助處境弱勢青年」高度一致。"},{"bill":"202110129310000","text":"中央政府為有效整合及推動青年事務之政策及相關事務，應設置青年事務專責部會。","note":"青年輔導委員會於民國102年配合政府組織改造併入教育部，部分業務及人員則依業務屬性併入經濟部及勞動部。如今，教育部青年發展署為中央政府三級機關，無法有效跨部會協調青年政策。青年政策複雜且專業，行政院有必要設置青年事務專責部會，積極推動各項協助青年發展業務。"},{"bill":"202110132300000","text":"政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。","note":"明定政府應訂定青年運動休閒環境之政策，以讓所有的青年都可以從事運動休閒。"},{"bill":"202110143380000","text":"政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年常態參與運動及技能發展，支持青年運動平權之機會。","note":"為提升青年健康力，爰於本條明定政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會，並推動運動常態化生活型態之建立，發展多元化、平價且具包容性之運動空間與設施，強化偏遠地區與社會不利處境青年參與運動之可及性與可近性，提升全民健康福祉與社會參與。"},{"bill":"202110155730000","text":"政府應訂定政策，提供青年健康安全的運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。","note":"一、為全面提升青年之健康福祉，本條文明確規範政府應訂定政策，旨在提供青年健康安全之運動休閒環境。此舉不僅鼓勵青年積極參與各類運動，以促進其身心發展，亦支持其技能發展，培養多元運動專長，進而提升整體國民健康水平。\n二、本條文同時強調政府應支持青年享有運動平權之機會。此係為確保所有青年，無論其背景、能力或所在地點，均能無障礙地參與運動休閒活動。透過政策引導與資源投入，政府將致力於消除運動參與之障礙，營造一個更具包容性與公平性之運動環境，使每位青年都能在安全、友善的氛圍中享受運動的樂趣與益處。"},{"bill":"202110166280000","text":"政府應推動政策，營造健康之運動休閒環境，鼓勵青年廣泛參與運動，提升技能發展，並保障運動平權。","note":"為提升青年健康力，爰於本條明定政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。"},{"bill":"202110169130000","text":"政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。","note":"為提升青年健康力，爰於本條明定政府應訂定政策，提供青年健康安全之運動休閒環境，促進青年參與運動及技能發展，支持青年運動平權之機會。"},{"bill":"202110175160000","text":"各級政府應設置專責單位，辦理輔導青年事務，其首長以具青年身分為原則。","note":"明定各級政府應設置青年事務專責單位，且其首長以具青年身分為原則。"}],"changed":true,"final":"政府應訂定政策發展友善平權環境，維護青年身心安全。","finalWhy":"為消除不平等觀念，營造暴力零容忍、包容多元性之社會，使青年能安心無懼地生活、逐夢，政府應訂定相關政策，發展友善平權環境，爰為本條規定。","review":{"note":"修正通過","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。\n行政院每四年召開全國青年會義，廣納各界意見，研議全國青年發展事務。"}},{"no":"第十六條","current":null,"versions":[{"bill":"202110017600000","text":"政府應鼓勵民間捐助青年發展，獎勵長期奉獻與熱心推展青年事務之法人、團體及自然人，以增進全民參與青年事務發展風氣。\n前項獎勵辦法由中央主管機關定之。","note":"為鼓勵民間參與青年事務發展，獎勵辦法授權由中央主管機關定之。"},{"bill":"202110040040000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"201110120370000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"一、世界人權宣言第二十七條及經濟社會文化權利國際公約第十五條明定人人享有參加社會之文化生活及欣賞藝術之權利。\n二、文化權涉及青年人格發展及創造力之培養，爰明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。"},{"bill":"202110057110000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策白皮書，作為青年相關政策之施政依據，並依其績效及國內外情勢發展定期檢討修正之。\n中央主管機關應根據青年政策白皮書，每兩年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體與青年代表之參與，廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、為確立我國青年政策之目標、原則與監督施行成果，同時因應國家發展方向、社會變遷與政府政策規劃，政府應每四年擬訂青年政策白皮書，作為青年相關政策之施政依據，爰訂定第一項。\n二、為廣納各界意見，研議青年政策白皮書及青年發展政策綱領，爰訂定第三項，明定政府應召集相關部會、學者專家、社會團體召開青年國是會議，並經會議討論後由行政院核定。"},{"bill":"202110059880000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"為保障青年事務預算之充裕，爰訂定第一項，明定各級政府應寬列支持青年事務預算，保障專款專用，合理分配及運用，持續充實青年政策所需預算。"},{"bill":"202110061560000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項訂定政府應設立青年研究發展機構，針對青年事務現況與其他相關事項進行研究、調查、統計、分析、保存、公開及提供。\n二、為確保青年研究、調查及統計資料之完整及正確性，爰於第二項訂定各有關機關（構）除其他法律另有規定外，負有提供之義務，政府對取得之資料應依法規規定保存及利用。"},{"bill":"202110061410000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策白皮書，作為青年相關政策之施政依據，並依執行狀況及國內外情勢發展定期檢討調修。\n中央主管機關應根據青年政策白皮書，每兩年擬定青年發展政策計畫，報行政院核定後實施。\n青年政策白皮書及國家青年發展計畫之訂定，應召集相關部會、學者專家、社會團體之參與，並廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"為落實我國青年政策之目標與執行，同時因應國家發展及社會變遷，政府應廣納意見，每四年擬訂青年政策白皮書、每兩年擬定青年發展政策計畫，以青年政策白皮書與青年發展計畫，確立我國青年相關政策之施政依據及指導原則。"},{"bill":"202110068970000","text":"各級政府應寬列青年事務經費，保障專款專用，合理分配及運用資源，並持續充實青年發展所需預算。對偏遠及特殊地區之青年事務，應優先予以補助。","note":"為保障上述青年事務與青年權利有充足財源推動與維護，應寬列青年事務預算。"},{"bill":"202110070660000","text":"行政院應考量國家發展方向、社會需求與政策願景，每四年發布青年政策白皮書，作為青年相關政策之研擬依據。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體及青年代表參與，廣納各界意見，研議全國青年事務，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，由行政院召開之。","note":"一、為確立青年政策推行之目標、依循原則與監督施行成果，同時因應國家發展、社會需求與政策願景，行政院及中央主管機關應定期提出青年政策白皮書及青年發展政策綱領。\n二、青年政策白皮書及青年發展政策綱領之訂定應由相關部會、學者專家、社會團體及青年代表共同參與，並廣納各界意見，經青年國是論壇討論後再由行政院核定，以完善青年政策之訂定。\n三、青年國是會議由行政院召開，每四年發布之青年政策白皮書及每兩年擬訂之青年發展政策綱領皆應經青年國是會議討論後再由行政院核定，以確實傾聽青年意見。"},{"bill":"202110071010000","text":"政府應寬列預算推動本法第六條至第十五條所定事項。","note":"為落實本法所定之各項保障，政府應寬列預算辦理。"},{"bill":"202110072290000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"一、青年事務預算之籌編。\n二、為保障青年事務預算之充裕，爰訂定第一項，明定各級政府應寬列支持青年事務預算，保障專款專用，合理分配及運用，持續充實青年政策所需預算。"},{"bill":"202110072330000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"政府應使青年政策建立在證據與研究之基礎上，為確保研究資料之完整及正確性，各有關機關（構）除其他法律另有規定外，負有提供之義務。"},{"bill":"202110072870000","text":"為支持青年並促政府及社會各界共同關懷青年事務，特訂定八月十二日為全國青年日。","note":"參考聯合國明定每年8月12日為國際青年日。"},{"bill":"202110075700000","text":"各級政府應設置專責機關或單位，辦理輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務所涉各級政府與相關機關部門業務甚多，需共同合作、溝通協調方能順利完成。為使各級政府有效推動青年政策與相關工作，於第一項明定各級政府應設置青年專責機關或單位，辦理輔導青年事務。\n二、為明確第一項之青年專責單位首長之青年主體性，爰明定第二項。"},{"bill":"202110076040000","text":"政府應寬列預算推動本法第六條至第十五條所定事項。","note":"為落實本法所定之各項保障，政府應寬列預算辦理。"},{"bill":"202110078370000","text":"中央主管機關為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"一、民國五○年代所設立之行政院青年輔導委員會，於一○二年因組織改造併入教育部，現為中央政府三級機關，對於跨部會溝通與協調恐有實務執行之困難。\n二、青年政策複雜、專業、多元且具變化性，行政院應設置青年事務專責部會以為因應。"},{"bill":"202110079860000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"為促進政府切實了解青年現況，政府推動青年政策應建立在實證研究的基礎之上。為確保研究資料之完整及正確性，各有關機關（構）除其他法律另有規定外，負有提供之義務。相關青年之研究、調查、統計結果，亦應依法保存、公開及提供，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。"},{"bill":"202110080450000","text":"中央主管機關為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"一、民國五○年代所設立之行政院青年輔導委員會，於一○二年因組織改造併入教育部，現為中央政府三級機關，對於跨部會溝通與協調恐有實務執行之困難。\n二、青年政策複雜、專業、多元且具變化性，行政院應設置青年事務專責部會以為因應。"},{"bill":"202110085510000","text":"各級政府應設置專責機關或單位，辦理青年政策事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務所涉各級政府與相關機關部門業務甚多，需共同合作、溝通協調方能順利完成。為使各級政府有效推動青年政策與相關工作，於第一項明定各級政府應設置青年專責機關或單位，辦理青年政策事務。\n二、為明確第一項之青年專責單位首長之青年主體性，爰明定第二項。"},{"bill":"202110100300000","text":"各級政府應寬列青年事務經費，保障專款專用，合理分配及運用資源，並持續充實青年發展所需預算。對偏遠及特殊地區之青年事務，應優先予以補助。","note":"為保障上述青年事務與青年權利有充足財源推動與維護，應寬列青年事務預算。"},{"bill":"202110098760000","text":"各級主管機關應設置青年發展基金，辦理青年發展相關業務。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。","note":"明定各級主管機關應成立青年發展與基金，辦理青年相關業務。"},{"bill":"202110098790000","text":"政府應訂定臺灣青年日，以提升對青年議題之重視。","note":"聯合國於1999年通過第54/120號決議，將國際青年日訂於每年8月12日，爰明定我國應設立臺灣青年日。"},{"bill":"202110102250000","text":"各級政府應設置專責機關或單位，辦理輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務所涉各級政府與相關機關部門業務甚多，需共同合作、溝通協調方能順利完成。為使各級政府有效推動青年政策與相關工作，於第一項明定各級政府應設置青年專責機關或單位，辦理輔導青年事務。\n二、為明確第一項之青年專責單位首長之青年主體性，爰明定第二項。"},{"bill":"202110103250000","text":"各級政府應設置專責機關或單位，辦理輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務涉及各級政府及相關機關的多項工作，必須透過各方合作與有效溝通協調，才能順利推進。為此，第一項明確規定各級政府應設置專門負責青年事務的機構或單位，以落實對青年的輔導與支持。\n二、為了進一步突顯這些青年專責單位首長必須具備青年主體性的要求，第二項因此予以明定。"},{"bill":"202110104620000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項訂定政府應設立青年研究發展機構，針對青年事務現況與其他相關事項進行研究、調查、統計、分析、保存、公開及提供。\n二、為確保青年研究、調查及統計資料之完整及正確性，爰於第二項訂定各有關機關（構）除其他法律另有規定外，負有提供之義務，政府對取得之資料應依法規規定保存及利用。"},{"bill":"202110108760000","text":"為有效整合及推動青年事務之政策，中央主管機關應設置青年事務專責單位。","note":"明定中央主管機關應設置青年事務專責單位，以利跨部會整合協調。"},{"bill":"202110107570000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等及營造霸凌零容忍環境，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110107400000","text":"政府應鼓勵並協助以青年為主體之非營利組織及社團之設立與發展，並提供政策支持、資源補助與培力機制，促進青年公共參與和社會創新。","note":"一、青年非營利組織為青年參與公共事務、推動社會改革與展現公民責任的重要平台，應予以積極支持。\n二、政府應推動下列措施：\n(一)簡化青年組織成立程序，降低行政與法規門檻。\n(二)提供運作經費、場地、培訓、法律諮詢等基礎支持。\n(三)設置青年社團輔導與發展計畫，協助其組織能力提升與永續經營。\n(四)鼓勵其參與政策研議、社會服務與國際交流，拓展影響力。\n三、本條目的在於強化青年公民力量，培養未來領導人才，並促進多元社會參與，形塑健康、具創造力與責任感的公民社會。"},{"bill":"202110109830000","text":"政府應規劃促進青年交流、合作與活動，並提供必要的援助及服務。","note":"青年是地方社會發展的重要動力，政府應積極規劃相關活動，促進青年交流及合作，提供專業諮詢、活動空間、技能培訓等多元服務，及跨區域青年互動與合作，並提供必要的援助及服務。"},{"bill":"202110123900000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年從事文化藝術工作，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。"},{"bill":"202110124800000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、為完善基礎資訊，須藉由研究、調查及統計資料，使青年政策推動應建立在研究科學為基礎之政策及法規上，爰於第一項訂定政府應設立青年研究發展機構，針對青年事務現況與其他相關事項進行研究、調查、統計、分析、保存、公開及提供。\n二、各有關機關（構）除其他法律另有規定外，負有提供之義務，政府對取得之資料應依法規規定保存及利用，以確保青年研究、調查及統計資料之完整及正確性，"},{"bill":"202110124830000","text":"各級政府應寬列青年事務經費，保障專款專用，合理分配及運用資源，並持續充實青年發展所需預算。對偏遠及特殊地區之青年事務，應優先予以補助。","note":"為確保青年政策與權益推動具穩定財源，應明定各級政府寬列青年事務預算，並保障專款專用，合理分配與有效運用。鑒於青年需求多元且政策推動需長期投入，社會亦普遍支持強化青年資源配置，政府應持續充實相關預算，以落實青年權益保障與發展支持。"},{"bill":"202110126910000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵青年推動、參與能源及環境保護等永續議題，共同實現淨零排放目標。","note":"一、為呼應聯合國2030年永續發展議程，期盼至2030年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、為促進世代共榮，達成我國永續發展目標，政府推動社會發展，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。"},{"bill":"202110127050000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"一、世界人權宣言第二十七條及經濟社會文化權利國際公約第十五條明定人人享有參加社會之文化生活及欣賞藝術之權利。\n二、文化權涉及青年人格發展及創造力之培養，爰明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。"},{"bill":"202110128060000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"一、世界人權宣言第二十七條及經濟社會文化權利國際公約第十五條明定人人享有參加社會之文化生活及欣賞藝術之權利。\n二、文化權涉及青年人格發展及創造力之培養，爰明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。"},{"bill":"202110128180000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"一、世界人權宣言第二十七條及經濟社會文化權利國際公約第十五條明定人人享有參加社會之文化生活，及欣賞藝術之權利。\n二、文化權涉及青年人格發展及創造力之培養，爰於本條明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年從事文化藝術工作，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。"},{"bill":"202110128310000","text":"國家應保障青年於數位環境中表達意見之自由，並促進其透過網路媒介參與公共討論，落實言論自由與資訊權。","note":"回應當代青年表達與參與公共事務的主要場域已轉向數位與網路空間之現實，特別保障其在虛擬平台上之言論自由與資訊平等接取權。該條進一步促進青年透過社群媒體、開放資料、線上論壇等方式參與公共討論，落實現代民主多元溝通與治理機制。該精神亦與歐盟《青年參與白皮書》所倡「數位公共空間建構」及我國《青年發展政策綱領》高度一致。"},{"bill":"202110129310000","text":"各級政府應寬列青年事務經費，保障專款專用，合理分配及運用資源，並持續充實青年發展所需預算。對偏遠及特殊地區之青年事務，應優先予以補助。","note":"為保障上述青年事務與青年權利有充足財源推動與維護，應寬列青年事務預算。"},{"bill":"202110132300000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"明定保障青年參與各項文化藝術活動之機會。目前文化部有關青年之獎補助，有「文化部青年創作獎勵作業要點」（18－40歲）、「文化部扶植青年藝術發展補助作業要點」（18－40歲）、「文化部青年村落文化行動計畫獎勵作業要點」（18－45歲）……等，年齡範圍不一而足，且與本法年齡定義未必一致。本法制定後，不改變原先政策嘉惠之對象，此應屬第二十八條第二項所定另有對青年之保障，優於本法之規定，而應優先適用，本法制定後，無須依本法第二條第一項所定青年年齡範圍調整，一併敘明。"},{"bill":"202110143380000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"一、世界人權宣言第二十七條及經濟社會文化權利國際公約第十五條明定人人享有參加社會之文化生活及欣賞藝術之權利。\n二、文化權涉及青年人格發展及創造力之培養，爰明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。"},{"bill":"202110155730000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會。\n政府應支持青年近用、從事或參與文化藝術工作與活動，以開展具多元性及創造性之文化藝術生活。","note":"一、文化權乃青年人格發展與創造力培養之核心要素。本條文第一項旨在明定政府應保障青年享有藝文教育及參與各項文化藝術活動之機會。此舉不僅確保青年在文化領域的學習權益，亦鼓勵其積極融入多元文化場域，從而豐富其個人生命體驗。\n二、為進一步深化在地文化發展，並厚植國家文化軟實力，本條文第二項規範政府應支持青年近用、從事或參與文化藝術工作與活動。透過提供必要的資源與機會，鼓勵青年投身文化藝術產業，期能激發其多元性及創造性潛能，進而共同開展更具活力與深度的文化藝術生活，為臺灣深耕文化底蘊及提升文化力。"},{"bill":"202110166280000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"一、世界人權宣言第二十七條及經濟社會文化權利國際公約第十五條明定人人享有參加社會之文化生活及欣賞藝術之權利。\n二、文化權涉及青年人格發展及創造力之培養，爰明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。"},{"bill":"202110169130000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"一、世界人權宣言第二十七條及經濟社會文化權利國際公約第十五條明定人人享有參加社會之文化生活及欣賞藝術之權利。\n二、文化權涉及青年人格發展及創造力之培養，爰明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。"},{"bill":"202110175160000","text":"各級主管機關應設置青年發展基金，辦理青年發展相關業務。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。","note":"明定各級主管機關應成立青年發展與基金，辦理青年相關業務。"}],"changed":true,"final":"政府應訂定青年運動政策，提供青年健康安全之運動休閒環境，促進並輔導青年規律參與運動及技能發展，落實青年運動平權。","finalWhy":"為提升青年健康力，爰於本條明定政府應訂定政策，提供青年健康安全之運動休閒環境，促進並輔導青年規律參與運動及技能發展，落實青年運動平權。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十七條","current":null,"versions":[{"bill":"202110017600000","text":"青年依本法請領各項津貼或補助者，得檢具直轄市、縣（市）主管機關出具之證明文件，於金融機構開立專戶，並載明金融機構名稱、地址、帳號及戶名，報直轄市、縣（市）主管機關核可後，專供存入各項津貼或補助之用。\n前項專戶內之存款，不得作為扣押、抵銷、供擔保或強制執行之標的。","note":"為避免實務上出現請領權利人之各項給津貼或補助，遭金融行庫扣押或行使抵銷權之情況，以致損害其權利而與本法之立法目的相違背，明定依本法請領津貼或補助者，得於金融機構開立專戶，專供存入本法津貼或補助之用，不得作為其他用途，且不得存入非屬本法所定給付以外之其他款項；專戶內之存款亦不得作為抵銷、扣押、供擔保或強制執行之標的。"},{"bill":"201110120370000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助減輕有扶養義務負擔青年之身心壓力。","note":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，為減輕有扶養義務負擔青年之身心壓力，爰於第二項明定，政府應提供必要之照顧福祉及支援服務。"},{"bill":"202110057110000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。\n前項青年事務研究之結果，應定期公告之。","note":"一、為使青年政策推動愈臻完善，必須針對青年需求進行研究。因此政府應設立青年發展研究機構，針對青年事務收集資料、進行研究，並將數據、成果公布給全國人民、機構使用。\n二、為確保青年研究資料之完整性，爰於第二項明定有關機關（構）除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。其資料使用辦法，依相關法規為之。"},{"bill":"202110059880000","text":"為支持青年並促進政府及社會各界共同關懷青年、青年發展及青年事務，特訂定七月十六日為臺灣青年日。","note":"一、設立青年專屬節日可促進人民對於青年議題之關注、深化推展青年議題。\n二、一九二○年七月十六日，臺灣海外留學生組成的「新民社」發行了《臺灣青年》，強調青年人要奮起，努力發展文化，刊物涵蓋政治、經濟、社會、文化等內容，為臺灣青年知識份子發行刊物進行社會溝通與教育的先驅，對日後的新文化運動亦具深遠影響。為紀念當年臺灣知識份子的貢獻，特將七月十六日訂定為臺灣青年日。"},{"bill":"202110061560000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"藉由設立區域性之青年支持機構，整合跨部會資源，建立青年在地支持系統，促進青年交流和組織合作，協助青年生涯發展及公共參與，逐步落實青年政策，提供青年必要之援助與服務，爰訂定本條。"},{"bill":"202110061410000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"政府推動青年政策應建立在實證研究的基礎之上，為確保研究資料之完整及正確性，各有關機關（構）除其他法律另有規定外，負有提供之義務。"},{"bill":"202110068970000","text":"為支持青年並促進政府及社會各界共同關懷青年、青年發展及青年事務，特訂定八月十二日為全國青年日。","note":"一、設立專屬節日為國家肯認族群重要性手法之一，可促進人民對於青年議題之關注。\n二、聯合國大會於2009年通過第64/134號決議，訂定自2010年起，每年8月12日為國際青年日。"},{"bill":"202110070660000","text":"政府應設立青年發展研究機構，對青年事務現況與其他相關事項，進行研究、調查、統計與分析，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年事務研究、調查、統計及分析所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、為促進政府對青年現況之認知、制定符合青年需求之政策，政府應設立青年發展研究機構，針對青年發展相關事務收集資料進行研究，並將數據、成果公開供民眾檢視。\n二、為確保青年事務研究之落實，爰於第二項明定資料持有機構除另有規定外，不得規避、妨礙或拒絕政府索取相關資料。其資料使用辦法，依相關法規為之。"},{"bill":"202110071010000","text":"政府應訂定全國青年日。","note":"聯合國依1999年「54/120」決議，定有國際青年日。爰比照國際上之作法明定全國青年日。"},{"bill":"202110072290000","text":"政府應訂定全國青年日，以支持青年並提升各界對青年議題之關懷。","note":"一、全國青年日之訂定。\n二、藉由訂定相關節日，深化推展青年議題，並提升各界對青年族群之關懷與支持。"},{"bill":"202110072330000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"政府設立區域性之青年支持機構整合跨部會資源，具體實踐青年政策。"},{"bill":"202110072870000","text":"行政院應考量全國青年事務發展方向，每四年發布青年政策白皮書，作為青年相關政策之施政依據。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體與青年代表之參與，廣納各界意見，研議全國青年事務，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、為確立青年政策目標、原則與成果，並因應社會變遷，明定中央應定期提出青年政策白皮書與青年發展計畫。\n二、另參考芬蘭青年法所規定，以四年為週期，發布經青年、青年工作者、學者專家與政府機關充分參與討論之政策白皮書，並以兩年為週期，擬定青年發展政策綱領。\n三、為確保各方意見表達，應由中央主管機關召開青年國是會議，保障青年參與青年政策之權利，共同提出青年政策白皮書。"},{"bill":"202110075700000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"國家應寬列青年事務預算，並應保障專款專用，俾利青年政策與事務之發展。"},{"bill":"202110076040000","text":"政府應訂定全國青年日。","note":"聯合國依1999年「54/120」決議，定有國際青年日。爰比照國際上之作法明定全國青年日。"},{"bill":"202110078370000","text":"各級政府應設置專責機關或單位，辦理輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務所涉各級政府與相關機關部門業務甚多，需共同合作、溝通協調方能順利完成。為使各級政府有效推動青年政策與相關工作，於第一項明定各級政府應設置青年專責機關或單位，辦理輔導青年事務。\n二、為明確第一項之青年專責單位首長之青年主體性，爰明定第二項。"},{"bill":"202110079860000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為促進青年交流與合作、衡平全國鄉鎮區發展，政府應設立區域性的青年支持機構，整合跨部會、地方政府以及民間單位的資源，建立青年在地支持系統，提供青年必要之援助與服務。"},{"bill":"202110080450000","text":"各級政府應設置專責機關或單位，辦理輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"一、青年事務所涉各級政府與相關機關部門業務甚多，需共同合作、溝通協調方能順利完成。為使各級政府有效推動青年政策與相關工作，於第一項明定各級政府應設置青年專責機關或單位，辦理輔導青年事務。\n二、為明確第一項之青年專責單位首長之青年主體性，爰明定第二項。"},{"bill":"202110085510000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"國家應寬列青年事務預算，並應保障專款專用，俾利青年政策與事務之發展。"},{"bill":"202110100300000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年向下扎根，建立在地連結，關心地方議題，政府應設立區域性青年支持機構。此機構將針對青年培力，參與地方事務，善盡公民責任。"},{"bill":"202110098760000","text":"中央主管機關應每四年召開青年國是會議。","note":"明定中央主管機關應每四年召開青年國是會議。"},{"bill":"202110098790000","text":"政府應設立青年研究發展機構，對青年事務現況及相關事項，進行研究、調查、統計，並依法保存及定期公開結果，提供青年政策制定及規劃、政策評量指標建置、學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之資料，得請求相關機關（構）提供，除法律另有規定外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"明定政府應設立相關研究機構，以精進青年政策，並於符合《政府資訊公開法》等相關規範下公開之。且為利於研究，非有正當理由或違反法令，各相關機關不得規避、妨礙或拒絕提供研究機構相關資料，惟取得資料之方式須依法為之。"},{"bill":"202110102250000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"國家應寬列青年事務預算，並應保障專款專用，俾利青年政策與事務之發展。"},{"bill":"202110103250000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"國家應廣泛編列青年事務所需的預算，並確保這些經費專款專用，以有效促進青年政策及相關工作的發展。"},{"bill":"202110104620000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"藉由設立區域性之青年支持機構，整合跨部會資源，建立青年在地支持系統，促進青年交流和組織合作，協助青年生涯發展及公共參與，逐步落實青年政策，提供青年必要之援助與服務，爰訂定本條。"},{"bill":"202110108760000","text":"各級政府應設置專責單位，辦理輔導青年事務，其首長應具青年身分。","note":"明定各級政府應設置青年事務專責單位，且其首長應具青年身分。"},{"bill":"202110107570000","text":"各級政府應鼓勵青年成立非營利組織及社團活動，促進青年交流與合作，提供青年各項支持與服務，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心和參與推動青年事務，明定政府應協助以青年為主體的非營利組織及社團，並支持辦理以青年為參與客群的非營利組織或社團活動。"},{"bill":"202110107400000","text":"政府應訂定全國青年日，以彰顯青年對社會的貢獻，並提升全社會對青年議題之重視與支持。","note":"一、設立「全國青年日」具有高度象徵意義，透過制度化紀念日，使青年議題獲得持續關注，並凝聚社會對青年的肯定與支持。\n二、可參考聯合國「國際青年日」之精神，於當日舉辦青年論壇、頒獎表揚、公共參與活動等，展現青年多元價值與社會影響力。\n三、本條有助於形塑青年自信與正向形象，強化青年政策之社會共識，並鼓勵青年積極參與公共事務與社會發展。"},{"bill":"202110109830000","text":"政府應協助以青年為主體的社團或非營利組織，並制定相關獎勵、補助及培力計畫。\n前項社團或非營利組織之資格、補助與獎勵等相關規定，由主管機關另以辦法定之。","note":"一、青年社團及非營利組織往往面臨資金不足、經營困難及資源匱乏等挑戰，難以穩定運營。政府透過獎勵、補助及培力計畫，能有效協助青年主體的組織發展，提升其社會影響力，使其更有能力參與公共事務，促進社會進步。\n二、為確保資源用於具有成效的青年組織，進一步提高資源使用效益，有關提出申請者之資格、補助及獎勵等規範，應由主管機關另以辦法定之，以助公平、公正地分配資源。"},{"bill":"202110123900000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助青年有扶養老人或養育子女之負擔者，減輕其身心壓力。","note":"明定政府應協助青年擁有經濟獨立及安定生活，並提高經濟可及性，並考量高齡化、少子女化之社會趨勢，使青年承擔照顧家庭成員之主要責任，為減輕負有扶養老人或養育子女義務之青年負擔，應提供必要之福祉照顧及支援服務，以減輕其身心壓力。"},{"bill":"202110124800000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"藉由設立區域性之青年支持機構，整合跨部會資源，建立青年在地支持系統，促進青年交流和組織合作，協助青年生涯發展及公共參與，逐步落實青年政策，提供青年必要之援助與服務，爰訂定本條。"},{"bill":"202110124830000","text":"為支持青年並促進政府及社會各界共同關懷青年、青年發展及青年事務，特訂定八月十二日為全國青年日。","note":"設立專屬節日是國家重視特定族群的重要象徵，有助提升社會對青年議題的認識與關注。聯合國已將每年8月12日訂為國際青年日，我國亦應比照設置青年節，藉此深化青年政策推動，並凝聚社會對青年的支持與重視。"},{"bill":"202110126910000","text":"政府應訂定培養青年金融素養政策，培植金融識能及良好財務管理能力，並推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險。","note":"為提升青年整體財金能力，政府應積極輔導金融機構規劃適合青年的金融商品與服務，協助其參與金融活動並妥善管理財務，並強化青年對金融風險的抵抗力，推動防制詐騙教育與相關措施，以降低青年受騙風險。"},{"bill":"202110127050000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助減輕有扶養義務負擔青年之身心壓力。","note":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，為減輕有扶養義務負擔青年之身心壓力，爰於第二項明定，政府應提供必要之照顧福祉及支援服務。"},{"bill":"202110128060000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助減輕有扶養義務負擔青年之身心壓力。","note":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，為減輕有扶養義務負擔青年之身心壓力，爰於第二項明定，政府應提供必要之照顧福祉及支援服務。"},{"bill":"202110128180000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助青年，減輕其身心壓力。","note":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，並提高經濟可及性，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，政府應提供必要之福祉照顧及支援服務，以減輕其身心壓力。"},{"bill":"202110128310000","text":"各級政府應建立統一且具前瞻性之青年政策體系，落實下列事項：\n一、設置專責機關或單位：中央由教育部統籌青年政策之規劃、協調、執行與評估；地方政府應設專責單位推動在地青年事務，並配合中央政策辦理地方計畫。\n二、制定政策指引：行政院應定期公布「全國青年發展政策白皮書」，載明青年現況分析、中長期目標、行動方案、資源配置與施政評估，作為全國青年政策依循基準。\n三、建立跨部門協調與合作平台：中央及地方應設青年政策協調會議，邀集相關機關、青年代表及專家學者，整合資源、協調施政、強化橫向治理。\n四、強化青年參與機制：各級政府應設青年諮詢委員會或相當機制，青年代表不得少於三分之一，具實質建議、諮詢與政策回饋之功能。\n五、推動數據與研究支持：中央應建立青年統計資料庫與政策研究機制，定期發布青年發展報告，作為政策評估與資源配置之依據。","note":"將青年政策制度建構、行政機制、協調程序與資料治理全數納入，設計上採自上而下建構一致且具延展性之青年政策體系。\n一、要求中央與地方皆設有專責單位，賦予教育部統籌與協調之權責，同時強化地方政府角色，提升政策落地性。\n二、明定須定期公布政策白皮書，實質化《104年青年發展政策綱領》所倡之目標體系，強調資料、目標與方案三位一體。\n三、建立跨部會協調平台，補足政策過度分工而橫向斷裂之缺陷。\n四、規範青年參與制度化，設諮詢委員會並設定法定代表比例，保障青年實質發聲權。\n五、則建立青年統計與研究系統，使施政具依據，政策迴圈可檢證。本條綜合韓國、芬蘭、德國等立法國家對青年政策制度化發展的成功經驗，"},{"bill":"202110129310000","text":"為支持青年並促進政府及社會各界共同關懷青年、青年發展及青年事務，特訂定八月十二日為青年日。","note":"一、設立專屬節日為國家肯認族群重要性手法之一，可促進人民對於青年議題之關注。\n二、聯合國大會於2009年通過第64/134號決議，訂定自2010年起，每年8月12日為國際青年日。"},{"bill":"202110132300000","text":"政府應訂定政策，支持青年達成經濟獨立，並對有需求者辦理積極自立脫貧，及對青年穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助減輕有扶養義務負擔青年之身心壓力。","note":"一、明定青年社會福利、生活支持於本條，以青年經濟生活穩定及獨立發展，為本法之方針。\n二、第一項所稱積極自立脫貧，係參考社會救助法第十五條之一之立法例，該條立法係為避免得到福利資源之人，最終不能倚賴自己達成經濟獨立，屬重要之社會福利立法政策，亦能達成本法立法目的（第一條），所揭示身心靈各層面之完整探索。本法立法後，青年之自立脫貧，無須僅侷限於原先社會救助法第十五條之一所定，低收入戶、中低收入戶等對象，本條第一項所稱「有需求者」，亦非以（中）低收入戶為限，一併敘明。"},{"bill":"202110143380000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助減輕有扶養義務負擔青年之身心壓力。","note":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，為減輕有扶養義務負擔青年之身心壓力，爰於第二項明定，政府應提供必要之照顧福祉及支援服務。"},{"bill":"202110155730000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助負有扶養長者或養育子女負擔之青年，減輕其身心壓力。","note":"一、第一項旨在確立政府應訂定政策，支持青年達成經濟獨立，並保障其穩定之經濟生活。此係為確保青年世代具備自立更生之能力，得以安心追求個人發展與社會參與，進而為社會注入新活力。\n二、鑑於我國高齡化與少子女化之社會趨勢日益顯著，青年世代往往須承擔家庭中扶養長者或養育子女之主要責任。為減輕此等負擔，本條文第二項明定政府應提供必要之照顧福祉及支援服務，以協助負有扶養長者或養育子女負擔之青年。此舉旨在緩解其身心壓力，使青年在兼顧家庭責任的同時，仍能保持生活品質與個人發展空間。"},{"bill":"202110166280000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助減輕有扶養義務負擔青年之身心壓力。","note":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，為減輕有扶養義務負擔青年之身心壓力，爰於第二項明定，政府應提供必要之照顧福祉及支援服務。"},{"bill":"202110169130000","text":"政府應訂定政策，支持青年達成經濟獨立，並對其穩定之經濟生活給予保障及協助。\n政府應提供必要之照顧福祉及支援服務，以協助減輕有扶養義務負擔青年之身心壓力。","note":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，為減輕有扶養義務負擔青年之身心壓力，爰於第二項明定，政府應提供必要之照顧福祉及支援服務。"},{"bill":"202110175160000","text":"中央主管機關應每四年召開青年國是會議。","note":"明定中央主管機關應每四年召開青年國是會議。"}],"changed":true,"final":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","finalWhy":"一、世界人權宣言第二十七條及經濟社會文化權利國際公約第十五條明定人人享有參加社會之文化生活及欣賞藝術之權利。\n二、文化權涉及青年人格發展及創造力之培養，爰明定政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展多元性與創造性之文化藝術生活，以促進在地文化發展，深耕文化底蘊及文化力。","review":{"note":"照委員吳思瑤等47人、王美惠等17人、郭昱晴等18人、邱若華等18人、王鴻薇等17人提案通過","text":"政府應訂定全國青年日，以支持青年並提升各界對青年議題之關懷。"}},{"no":"第十八條","current":null,"versions":[{"bill":"202110017600000","text":"青年依本法請領各項津貼或補助者，有下列情形之一者，停止之：\n一、受有期徒刑以上刑之判決確定，未宣告緩刑或未准予易科罰金、易服社會勞動，自裁判確定之日起至執行完畢滿三年止。但過失犯罪者，不在此限。\n二、以書面聲明放棄。\n三、喪失中華民國國籍。\n四、移居國外定居。","note":"明定停止發放青年各項津貼或補助之情形。"},{"bill":"201110120370000","text":"政府應訂定政策，培養青年金融素養，培植金融識能及良好財務管理能力，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。\n政府應推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險，並提供受害者多元服務措施。","note":"一、為提升青年整體財金能力，爰於第一項明定政府應積極輔導金融機構為青年規劃適合之金融商品或服務，協助其參與金融活動並妥善財務管理運用；培養金融素養，加強金融教育及金融識能。\n二、為因應近年社會議題，加強青年之金融風險抵抗力，防範金融詐騙，政府應推動防制詐騙教育及措施，以降低青年遭受詐騙風險，並提供受詐騙者必要之協助，爰為第二項規定。"},{"bill":"202110057110000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"本法為青年事務共同性規範，青年各項權利之依據。本法施行後其他相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110059880000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策白皮書，作為青年相關政策之施政依據，並依其績效及國內外情勢發展定期檢討修正之。\n中央主管機關應根據青年政策白皮書，每兩年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體與青年代表之參與，廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、為確立我國青年政策之目標、原則與監督施行成果，同時因應國家發展方向、社會變遷與政府政策規劃，政府應每四年擬訂青年政策白皮書，作為青年相關政策之施政依據，爰訂定第一項。\n二、為廣納各界意見，研議青年政策白皮書及青年發展政策綱領，爰訂定第三項，明定政府應召集相關部會、學者專家、社會團體召開青年國是會議，並經會議討論後由行政院核定。"},{"bill":"202110061560000","text":"政府應協助以青年為主體之非營利組織及社團發展，制定相關獎勵、補助及培力計畫。","note":"明定政府應協助以青年為主體之非營利組織及社團，藉由制定相關獎勵、補助及培力計畫等資源挹注，鼓勵青年實踐結社權利，促進青年交流與發展。"},{"bill":"202110061410000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為促進青年交流與合作、衡平全國鄉鎮區發展，政府應設立區域性的青年支持機構，整合跨部會、地方政府以及民間單位的資源，建立青年在地支持系統，以適當且及時提供青年必要之援助與服務。"},{"bill":"202110068970000","text":"行政院應考量國家青年事務發展方向、社會需求與政策遠景，每四年發布青年政策白皮書，作為青年相關政策之施政依據。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體與青年代表之參與，廣納各界意見，研議全國青年事務，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，應定期提出青年政策白皮書與青年發展計畫。\n二、現行各級政府缺乏訂定青年政策之依據，為凝聚中央各目的事業主管機關於青年事務之意識，以強化其權責事項，爰定明由各部門每二年研議部門權責政策及計畫後，由中央主管機關統合研提青年發展政策綱領，報請行政院核定後實施。\n三、以四年為週期，發布經青年、青年工作者、學者專家與政府機關充分參與討論之政策白皮書，並以二年為週期，擬定青年發展政策綱領。\n四、為確保各方意見表達，應由主管機關召開青年國是會議，保障青年參與青年政策之權利，共同提出青年政策白皮書。"},{"bill":"202110070660000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為支持青年生涯發展、促進青年交流，爰明定政府應設立區域性青年支持機構，以協助青年合作交流，促進青年生涯發展及公共參與。"},{"bill":"202110071010000","text":"行政院政府應每四年制定青年工作白皮書，並每二年制定國家青年發展計畫，作為青年政策制定與青年事務推動之依據。\n第一項之青年工作白皮書與國家青年發展計畫以青年主流化為制定原則。","note":"為確保青年政策與青年事務推動能穩定進行，爰參考芬蘭《青年基本法》第五條，規定政府應制定全國性之青年工作及政策計畫。"},{"bill":"202110072290000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、青年研究發展機構之設立。\n二、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項訂定政府應設立青年研究發展機構，針對青年事務現況與其他相關事項進行研究、調查、統計、分析、保存、公開及提供。\n三、為確保青年研究、調查及統計資料之完整及正確性，爰於第二項訂定各有關機關（構）除其他法律另有規定外，負有提供之義務，政府對取得之資料應依法規規定保存及利用。"},{"bill":"202110072330000","text":"政府應協助以青年為主體之非營利組織及社團發展，制定相關獎勵、補助及培力計畫。","note":"政府應協助以青年為主體之非營利組織及社團，鼓勵青年實踐結社權利，促進青年交流與發展。"},{"bill":"202110072870000","text":"中央各目的事業主管機關應依前條青年發展政策綱領，訂定年度青年政策推動計畫，規劃每年度應辦理之青年事務。\n中央各目的事業主管機關為擬訂前項年度青年政策推動計畫，應相互配合提供相關職掌資料。","note":"為確保各部會之青年政策符合青年政策綱領之精神，明定中央各目的事業主管機關應依循青年發展政策綱領，規劃年度辦理之青年事務，並訂定每年度具體可實行之推動計畫。"},{"bill":"202110075700000","text":"行政院應設置青年發展基金，辦理青年發展相關事項。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、國家為持續協助各世代青年發展，應將發展財源制度性規劃，爰於第一項明定行政院應設置青年發展基金，並於第二項定明基金來源。\n二、第三項授權中央主管機關另定青年發展基金之設置、補助對象、申請及審查程序等，及其他應遵行事項之辦法。"},{"bill":"202110076040000","text":"行政院政府應每四年制定青年工作白皮書，並每二年制定國家青年發展計畫，作為青年政策制定與青年事務推動之依據。\n第一項之青年工作白皮書與國家青年發展計畫以青年主流化為制定原則。","note":"為確保青年政策與青年事務推動能穩定進行，爰參考芬蘭《青年基本法》第五條，規定政府應制定全國性之青年工作及政策計畫。"},{"bill":"202110078370000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"國家應寬列青年事務預算，並應保障專款專用，俾利青年政策與事務之發展。"},{"bill":"202110079860000","text":"政府應協助以青年為主體之非營利組織及社團發展並推動相關青年事務，制定相關獎勵、補助及培力計畫。","note":"政府應協助以青年為主體的非營利組織及社團各項發展及推動相關青年事務，鼓勵青年實踐結社權利，促進青年自我認知發展。"},{"bill":"202110080450000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"國家應寬列青年事務預算，並應保障專款專用，俾利青年政策與事務之發展。"},{"bill":"202110085510000","text":"行政院應設置青年發展基金，辦理青年發展相關事項。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、國家為持續協助各世代青年發展，應將發展財源制度性規劃，爰於第一項明定行政院應設置青年發展基金，並於第二項定明基金來源。\n二、第三項授權中央主管機關另定青年發展基金之設置、補助對象、申請及審查程序等，及其他應遵行事項之辦法。"},{"bill":"202110100300000","text":"政府應協助以青年為主體之非營利組織及社團發展，或支持辦理以青年為參與客群之非營利組織及社團活動，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心與參與推動青年事務，以制定獎勵補助辦法形式協助青年參與公共事務。"},{"bill":"202110098760000","text":"各級政府應鼓勵青年成立非營利組織及社團活動，促進青年交流與合作，提供青年各項支持與服務。","note":"政府應鼓勵青年成立關心社會之非營利組織，促進青年交流合作，辦理各項活動，服務更多青年。"},{"bill":"202110098790000","text":"政府應設立區域性青年支持機構，促進各地區青年交流及合作，建立青年在地支持系統，協助推動青年事務，並提供青年援助。","note":"各地區域之青年發展程度不一且多元，為促進地區青年交流，並支持在地青年發展，且應由政府提供相關協助，爰訂定第十八條。"},{"bill":"202110102250000","text":"行政院應設置青年發展基金，辦理青年發展相關事項。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、國家為持續協助各世代青年發展，應將發展財源制度性規劃，爰於第一項明定行政院應設置青年發展基金，並於第二項定明基金來源。\n二、第三項授權中央主管機關另定青年發展基金之設置、補助對象、申請及審查程序等，及其他應遵行事項之辦法。"},{"bill":"202110103250000","text":"行政院應設置青年發展基金，辦理青年發展相關事項。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、國家為持續協助各世代青年發展，應將發展財源制度性規劃，爰於第一項明定行政院應設置青年發展基金，並於第二項定明基金來源。\n二、第三項授權中央主管機關另定青年發展基金之設置、補助對象、申請及審查程序等，及其他應遵行事項之辦法。"},{"bill":"202110104620000","text":"政府應協助以青年為主體之非營利組織及社團發展，制定相關獎勵、補助及培力計畫。","note":"明定政府應協助以青年為主體之非營利組織及社團，藉由制定相關獎勵、補助及培力計畫等資源挹注，鼓勵青年實踐結社權利，促進青年交流與發展。"},{"bill":"202110108760000","text":"各級政府應設置青年發展基金，辦理青年發展相關業務。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"明定各級政府應成立青年發展與基金，辦理青年相關業務。"},{"bill":"202110107570000","text":"中央主管機關為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"明定中央主管機關應設置青年事務專責單位，以利跨部會整合協調。"},{"bill":"202110107400000","text":"行政院應設立「青年事務協調會報」，召集相關部會、地方政府、學者專家、民間團體及青年代表，統整青年發展政策，並建立政策協調管考機制。","note":"一、青年事務橫跨多個政策領域，須透過中央層級之跨部會協調機制，統合資源、整合策略，提升政策整體效能與回應性。\n二、「青年事務協調會報」應具備以下功能：\n(一)統整各部會青年政策，避免資源重複與政策矛盾。\n(二)建立跨部門合作平台，推動聯合行動計畫與資源共享。\n(三)納入青年代表與專業意見，使政策制定兼具專業性與參與性。\n(四)設置政策執行進度與成效評估機制，確保政策落實與持續改善。\n三、本條制度性設計，強化中央主責與跨部會合作，提升政策一致性、靈活性與永續性。"},{"bill":"202110109830000","text":"本法施行後，各級政府應依本法規定，制定或修訂相關法規，以推動青年事務發展。\n各級政府應於本法施行後每三年檢討主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之。","note":"一、明訂本法為青年事務共同性規範及各項權利依據。故本法施行後，其他相關法規應配合制（訂）定、修正或廢止。\n二、隨著青年需求及社會環境的變遷，現行法規可能存在不符合青年發展需求或本法宗旨的條文，導致政策效果受到限制或無法落實。透過定期檢討法規，各級政府能確保其法規與本法精神一致，並調整政策方向，增強政策的適切性和實施效果。"},{"bill":"202110123900000","text":"政府應訂定培養青年金融素養政策，培植金融識能及良好財務管理能力，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。\n政府應推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險，並提供受害者多元服務措施。","note":"一、第一項明定政府應積極輔導金融機構為青年規劃適合之金融商品或服務，協助其參與金融活動並妥善財務管理運用；培養金融素養，加強金融教育及金融識能。\n二、第二項明定政府應推動防制詐騙教育及措施，以降低青年遭受詐騙風險，並提供受詐騙者必要之協助。"},{"bill":"202110124800000","text":"政府應協助以青年為主體之非營利組織及社團發展，制定相關獎勵、補助及培力計畫。","note":"政府應協助以青年為主體之非營利組織及社團，藉由制定相關獎勵、補助及培力計畫等資源挹注，鼓勵青年實踐結社權利，促進青年交流與發展。"},{"bill":"202110124830000","text":"行政院應考量國家青年事務發展方向、社會需求與政策遠景，每四年發布青年政策白皮書，作為青年相關政策之施政依據。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體與青年代表之參與，廣納各界意見，研議全國青年事務，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"為確保我國青年政策具有明確施政依據與指導原則，政府應定期擬定青年政策白皮書與青年發展計畫，並根據國家發展、社會需求及國際變遷調整策略。每四年應更新青年政策白皮書，每兩年擬定青年發展計畫，並由中央主管機關統合各部門政策。為廣納各界意見，應召開青年國是會議，邀請政府機關、學者專家、社會團體及青年代表參與討論，確保政策符合青年需求，並由行政院核定實施。這樣可確保青年政策有持續的關注與改善，並加強青年參與政策制定過程。"},{"bill":"202110126910000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"為維護青年結社自由，鼓勵公民社會關心和參與推動青年事務，明定政府應協助以青年為主體的非營利組織及社團，並支持辦理以青年為參與客群的非營利組織或社團活動。"},{"bill":"202110127050000","text":"政府應訂定政策，培養青年金融素養，培植金融識能及良好財務管理能力，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。\n政府應推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險，並提供受害者多元服務措施。","note":"一、為提升青年整體財金能力，爰於第一項明定政府應積極輔導金融機構為青年規劃適合之金融商品或服務，協助其參與金融活動並妥善財務管理運用；培養金融素養，加強金融教育及金融識能。\n二、為因應近年社會議題，加強青年之金融風險抵抗力，防範金融詐騙，政府應推動防制詐騙教育及措施，以降低青年遭受詐騙風險，並提供受詐騙者必要之協助，爰為第二項規定。"},{"bill":"202110128060000","text":"政府應訂定政策，推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險，並提供受害者多元服務措施。","note":"因應詐騙猖獗，政府應推動防制詐騙教育及措施，防範金融詐騙及求職詐騙，以降低青年遭受詐騙風險，並提供受詐騙者必要之協助。"},{"bill":"202110128180000","text":"政府應訂定培養青年金融素養政策，培植金融識能及良好財務管理能力，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。","note":"一、為提升青年整體財金能力，爰於第一項明定政府應積極輔導金融機構為青年規劃適合之金融商品或服務，協助其參與金融活動並妥善財務管理運用；培養金融素養，加強金融教育及金融識能。\n二、為因應近年社會議題，加強青年之金融風險抵抗力，防範金融詐騙，爰為第二項規定，政府應推動防制詐騙教育及措施，以降低青年遭受詐騙風險，並提供受詐騙者必要之協助。"},{"bill":"202110128310000","text":"各級政府應依職掌編列青年發展經費，並優先保障其預算穩定性與長期性。中央並應對地方提供必要補助與激勵。","note":"明文保障青年政策推動所需的財政資源，為政策落實的重要保障條款。條文要求各級政府應就所轄事務「依職掌」編列青年發展相關預算，並強調「穩定性與長期性」以回應青年政策所需長時間培力與非一次性支出特性。此外，考量地方財政資源不均，增設中央應對地方提供「補助與激勵」之條文，鼓勵地方積極推動青年政策創新。此規範延續《104年青年發展政策綱領》「強化推動青年政策之支援機制」，參考德國聯邦與地方對青少年政策分層分權補助原則與韓國青年政策基金制度，建立「財政支持作為政策責任延伸」的制度架構。"},{"bill":"202110129310000","text":"行政院應考量國家青年事務發展方向、社會需求與政策遠景，每四年發布青年政策白皮書，作為青年相關政策之施政依據。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體與青年代表之參與，廣納各界意見，研議全國青年事務，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，應定期提出青年政策白皮書與青年發展計畫。\n二、現行各級政府缺乏訂定青年政策之依據，為凝聚中央各目的事業主管機關於青年事務之意識，以強化其權責事項，爰定明由各部門每兩年研議部門權責政策及計畫後，由中央主管機關統合研提青年發展政策綱領，報請行政院核定後實施。\n三、以四年為週期，發布經青年、青年工作者、學者專家與政府機關充分參與討論之政策白皮書，並以兩年為週期，擬定青年發展政策綱領。\n四、為確保各方意見表達，應由主管機關召開青年國是會議，保障青年參與青年政策之權利，共同提出青年政策白皮書。"},{"bill":"202110132300000","text":"政府應訂定政策，培養青年金融素養，培植金融識能、良好財務管理能力及提升識詐知能，納入各級學校教育，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。","note":"一、明定政府推行完整之青年金融素養教育，協助青年培養金融識能、良好財務管理能力，與識詐防詐常識。\n二、各目的事業主管機關應跨部會合作，從資產分配、風險管理投資角度，設計金融理財教育課程及識詐知能，加強義務教育課程內容。"},{"bill":"202110143380000","text":"政府應訂定政策，培養青年金融素養，培植金融識能及良好財務管理能力，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。\n政府應推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險，並提供受害者多元服務措施。","note":"一、為提升青年整體財金能力，爰於第一項明定政府應積極輔導金融機構為青年規劃適合之金融商品或服務，協助其參與金融活動並妥善財務管理運用；培養金融素養，加強金融教育及金融識能。\n二、為因應近年社會議題，加強青年之金融風險抵抗力，防範金融詐騙，政府應推動防制詐騙教育及措施，以降低青年遭受詐騙風險，並提供受詐騙者必要之協助，爰為第二項規定。"},{"bill":"202110155730000","text":"政府應訂定政策，培養青年金融素養，強化金融識能與財務管理能力，並鼓勵、輔導金融機構提供青年相關金融商品或服務。\n政府應推展防制詐騙工作，加強青年防制詐騙知能，降低其受詐騙風險，並提供受害者多元服務措施。","note":"一、為全面提升青年整體財金能力，本條文第一項明定政府應訂定政策，旨在培養青年金融素養，進而增進其金融識能與良好財務管理能力。此外，為協助青年有效參與金融活動並妥善運用資金，政府應鼓勵、輔導金融機構提供青年專屬之金融商品或服務措施。此舉旨在為青年奠定穩健的經濟基礎，使其得以更自信地面對未來。\n二、鑑於近年來金融詐騙案件頻傳，對青年造成實質威脅，本條文第二項規範政府應推展防制詐騙工作，加強青年防制詐騙知能，以期降低其受詐騙風險。同時，為確保受害者能獲得及時支援，政府應提供多元服務措施。此等措施旨在建立健全的防詐機制，並為不幸受害的青年提供必要的協助與保護。"},{"bill":"202110166280000","text":"政府應訂定政策，培養青年金融素養，培植金融識能及良好財務管理能力，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。\n政府應推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險，並提供受害者多元服務措施。","note":"一、為提升青年整體財金能力，爰於第一項明定政府應積極輔導金融機構為青年規劃適合之金融商品或服務，協助其參與金融活動並妥善財務管理運用；培養金融素養，加強金融教育及金融識能。\n二、為因應近年社會議題，加強青年之金融風險抵抗力，防範金融詐騙，政府應推動防制詐騙教育及措施，以降低青年遭受詐騙風險，並提供受詐騙者必要之協助，爰為第二項規定。"},{"bill":"202110169130000","text":"政府應訂定政策，培養青年金融素養，培植金融識能及良好財務管理能力，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。\n政府應推展防制詐騙工作，加強青年防制詐騙知能，降低青年被詐騙風險，並提供受害者多元服務措施。","note":"一、為提升青年整體財金能力，爰於第一項明定政府應積極輔導金融機構為青年規劃適合之金融商品或服務，協助其參與金融活動並妥善財務管理運用；培養金融素養，加強金融教育及金融識能。\n二、為因應近年社會議題，加強青年之金融風險抵抗力，防範金融詐騙，政府應推動防制詐騙教育及措施，以降低青年遭受詐騙風險，並提供受詐騙者必要之協助，爰為第二項規定。"},{"bill":"202110175160000","text":"各級政府應鼓勵青年成立非營利組織及社團活動，促進青年交流與合作，提供青年各項支持與服務。","note":"政府應鼓勵青年成立關心社會之非營利組織，促進青年交流合作，辦理各項活動，服務更多青年。"}],"changed":true,"final":"政府應訂定青年經濟支持政策，協助青年達成經濟獨立，並對其穩定之經濟生活給予保障。\n政府應提供必要之照顧福祉及支援服務，以減輕有扶養義務負擔青年之身心壓力。","finalWhy":"一、鑒於政府應協助青年擁有經濟獨立及安定生活，其不僅為青年經濟自由之基本條件，亦為世界人權宣言及經濟社會文化權利國際公約所揭示之精神，爰為第一項規定。\n二、考量高齡化、少子女化之社會趨勢，青年承擔照顧家庭成員之主要責任，為減輕有扶養義務負擔青年之身心壓力，爰於第二項明定，政府應提供必要之照顧福祉及支援服務。","review":{"note":"不予採納","text":""}},{"no":"第十九條","current":null,"versions":[{"bill":"202110017600000","text":"為促使國民、事業及各級政府共同關懷青年議題應訂定青年日，並放假一日。","note":"明定青年日放假一日。"},{"bill":"201110120370000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。","note":"為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，爰為本條規定。"},{"bill":"202110057110000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110059880000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。\n前項青年事務研究之結果，應定期公告之。","note":"一、為使青年政策推動愈臻完善，必須了解青年需求與進行青年研究。因此政府應設立青年發展研究機構，針對青年事務收集資料、進行研究，並將數據、成果公布給全國人民、機構使用。\n二、為確保青年研究資料之完整性，爰於第二項明定有關機關（構）除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。其資料使用辦法，依相關法規為之。"},{"bill":"202110061560000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長、地方政府首長代表、學者專家及社會團體參與。\n國家制定重大政策、法律及計畫有影響青年發展之虞時，相關部會得於青年事務協調會報提出相關影響分析報告。","note":"一、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立管考機制，有關涉及本法事務之審議、協調等事項，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長、地方政府首長代表、學者專家及社會團體參與。\n二、為保障青年群體之社會利益，國家制定重大政策、法律及計畫有影響青年發展之虞時，相關部會得於青年事務協調會報提出影響分析報告，評估對青年發展之影響。"},{"bill":"202110061410000","text":"政府應協助以青年為主體之非營利組織及社團發展，制定相關獎勵、補助及培力計畫。","note":"政府應協助以青年為主體的非營利組織及社團，鼓勵青年實踐結社權利，促進青年自我認知發展。"},{"bill":"202110068970000","text":"中央各目的事業主管機關應依前條青年發展政策綱領，訂定年度青年政策推動計畫，規劃每年度應辦理之青年事務。\n中央各目的事業主管機關為擬訂前項年度青年政策推動計畫，應相互配合提供相關資料。","note":"為確保各部會之青年政策符合青年政策綱領之精神，明定中央各目的事業主管機關應依循青年發展政策綱領，規劃年度辦理之青年事務，並訂定每年度具體可實行之推動計畫。"},{"bill":"202110070660000","text":"政府應協助以青年為主體之非營利組織及社團發展，或非營利組織及社團推動青年事務，並制定相關獎勵、補助及培力計畫。","note":"為鼓勵各界關心與參與推動青年事務，明定政府應協助以青年為主體之非營利組織及社團發展，並制定獎勵補助辦法形式協助青年參與公共事務。"},{"bill":"202110071010000","text":"行政院應定期召開青年發展會報，由行政院院長召集學者專家、民間相關團體、青年代表、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長組成，協調、推動及督導全國青年發展事務並審議、管考青年工作白皮書國家、青年發展計畫，並檢視青年主流化之推動成果。\n前項會報之幕僚作業，由教育部辦理。","note":"參考芬蘭《青年基本法》第五條及第六條，於本法規定行政院應召開青年發展會報。"},{"bill":"202110072290000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"一、區域性青年支持機構之設立。\n二、藉由設立區域性之青年支持機構，整合跨部會資源，建立青年在地支持系統，促進青年交流和組織合作，協助青年生涯發展及公共參與，逐步落實青年政策，提供青年必要之援助與服務，爰訂定本條。"},{"bill":"202110072330000","text":"行政院為審議、協調及管考本法相關事務，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與。","note":"青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立管考機制，有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與。"},{"bill":"202110072870000","text":"直轄市政府、縣（市）政府每年應依第十七條青年發展政策綱領及前條青年政策推動計畫，訂定青年政策執行計畫，並落實執行。","note":"為能有效執行地方青年事務，直轄市政府、縣（市）政府應依循青年發展政策綱要及青年政策推動計畫，以訂定目標一致且充分發揮資源效益之青年政策執行計畫，並加以執行。"},{"bill":"202110075700000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書，作為青年相關政策之施政依據，並依其績效及國內外情勢發展定期檢討修正之。\n中央主管機關應根據青年政策白皮書，每兩年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體及青年代表共同參與，廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議每四年由行政院召開之。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，應每四年定期提出青年政策白皮書。並於第二項明定應依據青年政策白皮書，每兩年擬定青年發展政策綱領，並報行政院核定後實施。\n二、為確保青年政策白皮書及青年發展政策綱領之訂定能夠廣納各界意見，爰於第三項明定應召集學者專家、社會團體及青年代表等共同參與，召開青年國是會議，並於第四項明定青年國是會議每四年由行政院召開之。"},{"bill":"202110076040000","text":"行政院應定期召開青年發展會報，由行政院院長召集學者專家、民間相關團體、青年代表、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長組成，協調、推動及督導全國青年發展事務並審議、管考青年工作白皮書國家、青年發展計畫，並檢視青年主流化之推動成果。\n前項會報之幕僚作業，由教育部辦理。","note":"參考芬蘭《青年基本法》第五條及第六條，於本法規定行政院應召開青年發展會報。"},{"bill":"202110078370000","text":"行政院應設置青年發展基金，辦理青年發展相關事項。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、國家為持續協助各世代青年發展，應將發展財源制度性規劃，爰於第一項明定行政院應設置青年發展基金，並於第二項定明基金來源。\n二、第三項授權中央主管機關另定青年發展基金之設置、補助對象、申請及審查程序等，及其他應遵行事項之辦法。"},{"bill":"202110079860000","text":"行政院為審議、協調及管考本法相關事務，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長或代表、直轄市及縣（市）政府首長或代表、學者專家及青年事務相關民間團體共同參與。","note":"為有效整合跨部會資源推動青年事務，並賦予政策制定功能、建立管考機制，有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長或代表、直轄市及縣（市）政府首長或代表、學者專家及青年事務相關民間團體共同參與會商討論。"},{"bill":"202110080450000","text":"行政院應設置青年發展基金，辦理青年發展相關事項。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、國家為持續協助各世代青年發展，應將發展財源制度性規劃，爰於第一項明定行政院應設置青年發展基金，並於第二項定明基金來源。\n二、第三項授權中央主管機關另定青年發展基金之設置、補助對象、申請及審查程序等，及其他應遵行事項之辦法。"},{"bill":"202110085510000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書，作為青年相關政策之施政依據，並依其績效及國內外情勢發展定期檢討修正之。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體及青年代表共同參與，廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議每四年由行政院召開之。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，應每四年定期提出青年政策白皮書。並於第二項明定應依據青年政策白皮書，每兩年擬定青年發展政策綱領，並報行政院核定後實施。\n二、為確保青年政策白皮書及青年發展政策綱領之訂定能夠廣納各界意見，爰於第三項明定應召集學者專家、社會團體及青年代表等共同參與，召開青年國是會議，並於第四項明定青年國是會議每四年由行政院召開之。"},{"bill":"202110100300000","text":"政府應設立青年發展研究機構，對青年事務現況與其他相關事項，進行研究、調查、統計與分析，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年事務研究、調查、統計及分析所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、為促進政府對青年現況之認知、制定符合青年需求之政策，政府應設立青年發展研究機構，針對青年發展相關事務收集資料進行研究，並將數據、成果公開供民眾檢視。\n二、為確保青年事務研究之落實，爰於第二項明定資料持有機構除另有規定外，不得規避、妨礙或拒絕政府索取相關資料。其資料使用辦法，依相關法規為之。"},{"bill":"202110098760000","text":"中央主管機關為訂定、協調及管考本法相關政策，應由行政院長召集政務委員、相關機關首長、直轄市及縣（市）政府首長、學者專家及相關民間團體，定期舉行跨部會青年事務協調會報。","note":"為有效整合資源，建立管考機制，明定由中央主管機關定期舉行跨部會青年事務協調會報。"},{"bill":"202110098790000","text":"政府應協助以青年為主體之非營利組織及團體發展，並制定相關獎助、補助及培力計畫。","note":"非營利組織及團體經營不易，若無法自主募款，需仰賴政府補助，為協助青年團體發展，並培力青年人才，爰訂定第十九條。"},{"bill":"202110102250000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書，作為青年相關政策之施政依據，並依其績效及國內外情勢發展定期檢討修正之。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體及青年代表共同參與，廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議每四年由行政院召開之。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，應每四年定期提出青年政策白皮書。並於第二項明定應依據青年政策白皮書，每兩年擬定青年發展政策綱領，並報行政院核定後實施。\n二、為確保青年政策白皮書及青年發展政策綱領之訂定能夠廣納各界意見，爰於第三項明定應召集學者專家、社會團體及青年代表等共同參與，召開青年國是會議，並於第四項明定青年國是會議每四年由行政院召開之。"},{"bill":"202110103250000","text":"政府應綜合考量國家發展方向、社會需求及政策遠景，每四年編製青年政策白皮書，作為推動青年相關政策的施政依據，並依據其執行成效及國內外環境變化，定期進行檢討與修正。\n中央主管機關應依據青年政策白皮書，每二年制定青年發展政策綱領，經行政院核定後實施，以確保青年政策的持續性與時效性。\n青年政策白皮書及青年發展政策綱領之制定，應邀集相關部會、學者專家、社會團體及青年代表共同參與，廣泛蒐集各界意見，並經青年國是會議討論後，由行政院核定。\n青年國是會議應由行政院每四年召開一次，以作為青年政策方向之審議及調整機制，確保政策符合青年需求與社會發展趨勢。","note":"一、為了確立青年政策的長期發展目標與執行原則，並使政策方向符合社會變遷與國際趨勢，政府應每四年定期編製一份青年政策白皮書，作為施政的參考依據；同時，根據該白皮書，每兩年制定青年發展政策綱領，並經行政院核定後實施，以增強政策的執行力和調整的靈活性。\n二、為確保青年政策在擬定和調整過程中能廣泛吸納各界意見，應邀請相關部會、學者專家、社會團體以及青年代表共同參與政策討論，並以青年國是會議作為政策審議與建言的平台。該會議每四年由行政院召開，旨在促進政府與社會各界之間的對話，確保青年政策方向能夠滿足實際需求並與時代發展相契合。"},{"bill":"202110104620000","text":"行政院為審議、協調及管考本法相關事務，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與。","note":"青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立管考機制，有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與。"},{"bill":"202110108760000","text":"各級政府應寬列青年發展經費，保障專款專用，並優先補助經濟弱勢、偏遠地區及身心障礙之青年。","note":"明定各級政府應寬列青年發展經費，保障專款專用，並優先補助經濟弱勢青年。"},{"bill":"202110107570000","text":"各級政府應設置專責單位，辦理輔導青年事務，其首長應具青年身分。","note":"明定各級政府應設置青年事務專責單位，且其首長應具青年身分。"},{"bill":"202110107400000","text":"本法施行後，相關涉及青年事務之法律、法規應依本法精神進行修訂、整合或新訂，以確保法制一致性與政策協調性。","note":"一、本法為青年發展政策之上位規範，實施後應與現行各項青年相關法令進行整合，避免法規間之矛盾與重疊。\n二、主管機關應盤點並檢討現行法規中涉及青年之條文，依本法原則推動法制調整，確保政策目標得以落實。\n三、本條強調政策法制化與體系化的重要性，透過系統性修法，建立一套具一致性、延續性與前瞻性的青年發展法律架構。"},{"bill":"202110109830000","text":"本法自公布日施行，修正時亦同。","note":"明訂本法之施行日。"},{"bill":"202110123900000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。","note":"明定政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，落實青年公共參與權。"},{"bill":"202110124800000","text":"行政院為審議、協調及管考本法相關事務，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與。","note":"青年政策之推動涉及跨多個部會業務，為使青年事務推動之資源有效整合，賦予政策制定功能及績效目標，建立管考機制，有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與。"},{"bill":"202110124830000","text":"中央各目的事業主管機關應依前條青年發展政策綱領，訂定年度青年政策推動計畫，規劃每年度應辦理之青年事務。\n中央各目的事業主管機關為擬訂前項年度青年政策推動計畫，應相互配合提供相關資料。","note":"中央各目的事業主管機關應依青年發展政策綱領，制定每年度的青年政策推動計畫，並規劃當年需辦理的青年事務。各機關需互相協作，提供必要資料，以確保政策推動符合綱領精神。此外，為確保政策執行有效，應制定具體且可實行的年度推動計畫，達成協同推動青年發展的目標。"},{"bill":"202110126910000","text":"中央主管機關為有效整合及推動青年事務之政策及相關事務，應設置或指定青年事務專責單位。","note":"明定中央主管機關應設置青年事務專責單位，以利跨部會整合協調。"},{"bill":"202110127050000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。","note":"為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，爰為本條規定。"},{"bill":"202110128060000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。","note":"為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，爰為本條規定。"},{"bill":"202110128180000","text":"政府應保障並促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，協助青年在政策、立法、預算、社區及各級公共事務中發聲與實踐，內化社會關懷意識，深化民主素養。","note":"為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供各個面向參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，爰為本條規定。"},{"bill":"202110128310000","text":"政府得委託法人、民間團體或機構辦理青年相關服務，並促進與學校、企業、社區間之合作，以建構多元青年支持網絡。","note":"為本法中推動「公共治理多元化」與「青年政策社會化」的制度設計，將傳統以政府為主體的施政模式轉向公私協力與跨域連結。肯認政府得透過「委託」予法人或團體方式推動青年服務，回應實務上青年輔導、創業輔導、諮商教育等多數已由專業團體與NGO長期執行之事實，則進一步強調「合作」與「支持網絡」概念，要求政府積極整合學校、企業、社區等各領域資源，共構支援青年之多元體系。此規劃符合《青年發展政策綱領》「建立協作推動青年發展之夥伴關係」，並與芬蘭、韓國等國推行之「青年行動平台（Youth Service Systems）」一致，使政策系統具備回應多元需求之能力。"},{"bill":"202110129310000","text":"中央各目的事業主管機關應依前條青年發展政策綱領，訂定年度青年政策推動計畫，規劃每年度應辦理之青年事務。\n中央各目的事業主管機關為擬訂前項年度青年政策推動計畫，應相互配合提供相關資料。","note":"為確保各部會之青年政策符合青年政策綱領之精神，明定中央各目的事業主管機關應依循青年發展政策綱領，規劃年度辦理之青年事務，並訂定每年度具體可實行之推動計畫。"},{"bill":"202110132300000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。\n政府應達成十八歲以上國民有選舉、被選舉、罷免之權之目標，並依第二十八條第一項之規定，於本法施行之日起二年內，另以法律定之。","note":"一、明定政府促進青年公共參與於第一項。\n二、十八歲公民權，為各界長久以來之期盼。本次制定雖為基本法，仍不失於可將進步理念，運用本法第二十八條第一項限期檢討機制，促使政府提出改革時間表，本次制定並明定為施行後二年內修正法律，包括公職人員選舉罷免法、總統副總統選舉罷免法等，其落實則仍應在各法律規定。另外此處規定，係日出條款，規範政府修法之目標，被選舉權並非一律均應十八歲以上，得針對各種民選公職，按性質依立法裁量予以修法，爰明定於第二項。"},{"bill":"202110143380000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。","note":"為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，爰為本條規定。"},{"bill":"202110155730000","text":"政府應鼓勵青年投入公共參與，培育參與公共事務之青年人才。\n政府應提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。","note":"一、為落實青年公共參與權，本條文第一項明定政府應積極促進青年公共參與，並培育參與公共事務之青年人才。此旨在鼓勵青年主動關心社會，並為其投入公共領域奠定基礎，以提升青年世代對國家發展的實質影響力。\n二、為深化民主根基，本條文第二項進一步規範政府應提供青年公共事務參與機會。透過此等參與，旨在協助青年內化社會關懷意識，培養其對公共議題的敏感度與責任感，進而深化民主素養。此舉不僅能使青年政策及法律的形成過程更為周全，亦能為社會培育具備公民意識與行動力的未來領袖。"},{"bill":"202110166280000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養，確保青年享有公平參與體制之權利。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，爰為本條規定。"},{"bill":"202110169130000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。","note":"為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，爰為本條規定。"},{"bill":"202110175160000","text":"中央主管機關為訂定、協調及管考本法相關政策，應由行政院長召集政務委員、相關機關首長、直轄市及縣（市）政府首長、學者專家及相關民間團體，定期舉行跨部會青年事務協調會報。","note":"為有效整合資源，建立管考機制，明定由中央主管機關定期舉行跨部會青年事務協調會報。"}],"changed":true,"final":"政府應訂定政策，培養青年金融素養，增進財務知能，並鼓勵、輔導金融機構提供青年相關金融商品或服務措施。","finalWhy":"為提升青年整體財金能力，爰於本條明定政府應積極輔導金融機構為青年規劃適合之金融商品或服務，協助其參與金融活動並妥善財務管理運用；培養金融素養，加強金融教育及財務知能。","review":{"note":"修正通過","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務，上開會報至少每半年召開一次。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表應廣納不同背景青年，以民主機制運作為原則，且不得低於委員總數之二分之一，任一性別比例不得少於三分之一，並含括各族群為原則。\n各級政府應設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。"}},{"no":"第二十條","current":null,"versions":[{"bill":"202110017600000","text":"本法施行後，應依本法之規定，修正、廢止或制（訂）定相關青年政策法令。","note":"本法係青年發展政策法令之總則性規範，乃所有青年發展政策法令之依據，現行有關青年發展法令應依本法之規定，予以修正、廢止或增補之。"},{"bill":"201110120370000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為協助以青年為主體之非營利組織及團體之發展，以及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。"},{"bill":"202110059880000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為使青年獲得在地支持、促進交流和組織合作、活絡青年地方參與，政府應設立區域性之青年支持機構，提供青年必要之援助與服務，爰訂定本條。"},{"bill":"202110061560000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"參考教育基本法第十六條、通訊傳播基本法第十六條、原住民族基本法第三十四條、文化基本法第二十九條及社會福利基本法第三十條等，規定本法施行後其他青年事務相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110061410000","text":"行政院為審議、協調及管考本法相關事務，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與。","note":"為有效整合跨部會資源推動青年事務，並賦予政策制定功能、建立管考機制，有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與研商討論。"},{"bill":"202110068970000","text":"行政院應定期召開中央青年事務會報，由行政院院長召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長組成，協調、推動及督導全國青年事務，並審議青年政策推動計畫。國家制定重大政策、法律及計畫有影響青年之虞時，各相關部會得於青年事務會報提出世代影響分析報告。\n前項會報之幕僚作業，由中央青年事務主管機關辦理。","note":"一、青年事務多元且複雜，並非單一部會所能完全掌握，行政院有責透過定期召開跨部會的青年事務會報，協調及統合各部會青年事務工作，以達涉及青年事務各政策之協調與永續。\n二、建立「世代影響分析」制度。「青年議題主流化」之精神，不只包括正視各項政策對當代青年之影響，更包括「對下一代負責」之精神，以達社會永續發展之目標。基於保障青年世代之利益，國家制定重大政策、法律及計畫時，若有影響青年之虞，須透過世代影響分析報告來瞭解其對未來世代之影響，爰於第一項後段明定。"},{"bill":"202110070660000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集政務委員、相關部會首長或代表、直轄市及縣（市）政府首長或代表、學者專家及青年事務相關民間團體共同參與。","note":"青年政策之推動涉及跨部會業務，為審議、協調及管考青年相關事務，應由行政院長定期召開跨部會青年事務協調會報，並由政務委員、各級政府機關代表、學者專家及青年事務相關之民間團體共同參與，以利青年事務之推動與審議。"},{"bill":"202110071010000","text":"政府應對青年之現況、青年主流化推動成果與其他青年事項，辦理研究、調查及統計，並依法規保存、公開及提供資訊。\n前項研究、調查及統計，主管機關得自行或委任所屬機關（構），或委託其他機關（構）、青年發展相關民間團體辦理。\n為辦理第一項之研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、為順利推動本法所定事項，爰規定政府應對青年發展現況進行研究。\n二、為使第一項所定之研究能順利進行，爰明定有關機關應提供研究所需之必要資料。"},{"bill":"202110072290000","text":"政府應協助以青年為主體之非營利組織及社團發展，制定相關獎勵、補助及培力計畫。","note":"一、青年非營利組織及社團發展之協助。\n二、明定政府應協助以青年為主體之非營利組織及社團，藉由制定相關獎勵、補助及培力計畫等資源挹注，鼓勵青年實踐結社權利，促進青年交流與發展。"},{"bill":"202110072330000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"本法施行後，其他青年事務相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110072870000","text":"行政院應召開中央青年事務會報，由行政院院長召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長組成，協調、推動及督導全國青年事務，並審議青年政策推動計畫。國家制定重大政策、法律及計畫有影響青年之虞時，各相關部會得於青年事務會報提出世代影響分析報告。\n前項會報之幕僚作業，由中央青年事務主管機關辦理。","note":"一、青年事務非單一部會能完全掌握，爰明定行政院有責透過跨部會的青年事務會報，協調及統合各部會青年事務工作。\n二、基於保障青年世代之利益，國家制定重大政策、法律及計畫時，若有影響青年之虞，須透過世代影響分析報告來瞭解其對未來世代之影響，爰明定第一項後段。\n三、中央青年事務會報組成之性別比例應依行政院性別平等政策綱領辦理，學者專家及相關民間團體應佔一定比例。"},{"bill":"202110075700000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。\n前項青年事務研究之結果，應定期公告之。","note":"一、為使青年政策之訂定符合青年實務所需，了解青年需求與進行相關研究實屬必要。爰於第一項明定政府應設立青年研究發展機構，針對青年事務進行調查、研究、統計，並於第三項明定應將相關成果公告，以利民眾了解。\n二、第二項明定有關機關（構）除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。"},{"bill":"202110076040000","text":"政府應對青年之現況、青年主流化推動成果與其他青年事項，辦理研究、調查及統計，並依法規保存、公開及提供資訊。\n前項研究、調查及統計，主管機關得自行或委任所屬機關（構），或委託其他機關（構）、青年發展相關民間團體辦理。\n為辦理第一項之研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、為順利推動本法所定事項，爰規定政府應對青年發展現況進行研究。\n二、為使第一項所定之研究能順利進行，爰明定有關機關應提供研究所需之必要資料。"},{"bill":"202110078370000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書，作為青年相關政策之施政依據，並依其績效及國內外情勢發展定期檢討修正之。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體及青年代表共同參與，廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議每四年由行政院召開之。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，應每四年定期提出青年政策白皮書。並於第二項明定應依據青年政策白皮書，每二年擬定青年發展政策綱領，並報行政院核定後實施。\n二、二、為確保青年政策白皮書及青年發展政策綱領之訂定能夠廣納各界意見，爰於第三項明定應召集學者專家、社會團體及青年代表等共同參與，召開青年國是會議，並於第四項明定青年國是會議每四年由行政院召開之。"},{"bill":"202110079860000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"本法施行後，實為青年事務之共同性規範及青年各項權利之依據。爰參考教育基本法第十六條等法規之立法體例，本法施行後，其他青年事務相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110080450000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書，作為青年相關政策之施政依據，並依其績效及國內外情勢發展定期檢討修正之。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體及青年代表共同參與，廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議每四年由行政院召開之。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，應每四年定期提出青年政策白皮書。並於第二項明定應依據青年政策白皮書，每二年擬定青年發展政策綱領，並報行政院核定後實施。\n二、為確保青年政策白皮書及青年發展政策綱領之訂定能夠廣納各界意見，爰於第三項明定應召集學者專家、社會團體及青年代表等共同參與，召開青年國是會議，並於第四項明定青年國是會議每四年由行政院召開之。"},{"bill":"202110085510000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。\n前項青年事務研究之結果，應定期公告之。","note":"一、為使青年政策之訂定符合青年實務所需，了解青年需求與進行相關研究實屬必要。爰於第一項明定政府應設立青年研究發展機構，針對青年事務進行調查、研究、統計。\n二、第二項明定有關機關（構）除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。\n三、第三項明定應將相關成果公告，以利民眾了解。"},{"bill":"202110100300000","text":"政府應訂定全國青年日，以提升各界對青年議題之關懷。","note":"一、全國青年日之訂定。\n二、藉由訂定相關節日，深化推展青年議題，並提升各界對青年族群之關懷與支持。"},{"bill":"202110098760000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110098790000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會及地方首長參與。","note":"青年政策涉及多項領域，為了解各級政府辦理青年事務之情形，應由行政院長召集部會首長及地方首長，定期召開青年事務協調會報檢討之。"},{"bill":"202110102250000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。\n前項青年事務研究之結果，應定期公告之。","note":"一、為使青年政策之訂定符合青年實務所需，了解青年需求與進行相關研究實屬必要。爰於第一項明定政府應設立青年研究發展機構，針對青年事務進行調查、研究、統計，並於第三項明定應將相關成果公告，以利民眾了解。\n二、第二項明定有關機關（構）除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。"},{"bill":"202110103250000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。\n前項青年事務研究之結果，應定期公告之。","note":"一、為確保青年政策的制定能夠切實回應青年實際需求，有效了解青年需求與進行相關研究極為必要。因此，第一項規定政府應成立專責的青年研究發展機構，負責調查、研究及統計青年事務，並在第三項中要求將研究成果予以公告，方便公眾查詢與了解。\n二、第二項則明確指出，除非另有規定，有關機關（構）不得逃避、阻礙或拒絕研究人員索取研究資料。"},{"bill":"202110104620000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"參考教育基本法第十六條、通訊傳播基本法第十六條、原住民族基本法第三十四條、文化基本法第二十九條及社會福利基本法第三十條等，規定本法施行後其他青年事務相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110108760000","text":"各級政府應鼓勵青年成立非營利組織及社團活動，促進青年交流與合作，提供青年各項支持與服務。","note":"政府應鼓勵青年成立關心社會之非營利組織，促進青年交流合作，辦理各項活動，服務更多青年。"},{"bill":"202110107570000","text":"各級主管機關應設置青年發展基金，辦理青年發展相關業務。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"明定各級主管機關應成立青年發展與基金，辦理青年相關業務。"},{"bill":"202110107400000","text":"本法自公布之日起施行。","note":"為確保本法所規範之各項青年政策得以即時推動與落實，應自公布日起即施行。"},{"bill":"202110123900000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為協助以青年為主體之非營利組織及團體之發展及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。"},{"bill":"202110124800000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"參考教育基本法第十六條、通訊傳播基本法第十六條、原住民族基本法第三十四條、文化基本法第二十九條及社會福利基本法第三十條等，規定本法施行後其他青年事務相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110124830000","text":"行政院應定期召開中央青年事務會報，由行政院院長召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長組成，協調、推動及督導全國青年事務，並審議青年政策推動計畫。國家制定重大政策、法律及計畫有影響青年之虞時，各相關部會得於青年事務會報提出世代影響分析報告。\n前項會報之幕僚作業，由中央青年事務主管機關辦理。","note":"為有效協調及推動全國青年事務，行政院應定期召開跨部會的青年事務會報，整合各部門資源，協調青年政策的執行與督導。會報應包括學者專家、民間團體及政府代表，並在制定重大政策、法律或計畫時，進行世代影響分析，確保政策不僅考慮當代青年需求，也對未來世代負責，以達成社會永續發展的目標。"},{"bill":"202110126910000","text":"各級政府應設置專責機關或單位，規劃、辦理及輔導青年事務。\n前項青年專責機關或單位，其首長應具青年身分。","note":"明定各級政府應設置青年事務專責單位，且其首長應具青年身分。"},{"bill":"202110127050000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為協助以青年為主體之非營利組織及團體之發展，以及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。"},{"bill":"202110128060000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為協助以青年為主體之非營利組織及團體之發展，以及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。"},{"bill":"202110128180000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為協助以青年為主體之非營利組織及團體之發展，以及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。"},{"bill":"202110128310000","text":"中央主管機關應設置獎勵與評鑑制度，表揚對青年發展有具體貢獻之團體或個人，並提升政策實施成效。","note":"設計以制度化方式強化青年政策的正向循環與持續進化，條文兼具激勵機制與治理檢核雙重功能。首先，透過「獎勵制度」，對於在青年教育、創業、社會參與、文化推廣等面向具貢獻者予以肯認與表揚，不僅促進社會能量流入青年事務，也提升青年從事公共參與之榮譽感與認同。其次，透過「評鑑制度」檢討青年政策施行成效，建立政策執行標準、成果公開、滾動修正之回饋機制。該制度與《青年發展政策綱領》「強化政策檢討與回饋」原則一致，並參考韓國、紐西蘭等國對青年發展政策設立年度績效評鑑機制。"},{"bill":"202110129310000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，至少每三個月舉行會議一次，必要時得召開臨時會議，審議、協調、推動及督導本法相關事務及青年政策推動計畫。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n各級政府應建立青年參與之常設機制，青年代表應以廣納不同背景青年組成代表團、相互推選會議代表及民主機制運作為原則，其組成單一性別比不得少於三分之一，且應保障較低年齡層、學生及各類不利處境者參與。\n前三項青年代表不得低於委員總數之二分之一。","note":"一、青年事務多元且複雜，並非單一部會或局處所能完全掌握。行政院有責透過定期召開跨部會的青年事務會報，審議、協調、推動及督導各部會青年事務工作，並明訂至少三個月舉行會議一次、必要時得召開臨時會議；地方政府亦應透過會報協調及督導執行本法情形，以達涉及青年事務各政策之協調與永續。\n二、各級政府應建立青年參與之常設機制，保障一定比例青年代表參與決策，降低青年參政門檻。其中青年代表應以廣納不同背景青年組成代表團，相互推選會議代表及民主機制運作為原則，其組成單一性別比不得少於三分之一，並應保障較低年齡層、學生及各類不利處境者參與。\n三、青年代表皆應達整體會議委員總數二分之一。"},{"bill":"202110132300000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"明定協助支持青年事務之非營利組織。另政府投入獎補助或其他行政資源，考核追蹤是否達成預計成果，應有資訊公開之機制，始符民主時代之要求，此規定於本法第二十六條第三項第六款，一併敘明。"},{"bill":"202110143380000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為協助以青年為主體之非營利組織及團體之發展，以及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。"},{"bill":"202110155730000","text":"政府應協助以青年為主體之非營利組織及團體之發展，並支持辦理以青年為參與對象之活動。\n前項協助與支持應包含制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為促進青年社會參與，本條文第一項及第二項明定政府應協助以青年為主體之非營利組織及團體發展，並支持辦理以青年為參與對象之活動。此等協助與支持應包含制定相關獎勵、補助、空間資源及培力計畫。透過此舉，旨在強化青年組織之能量，擴大青年參與公共事務之機會，進而為社會注入更多活力。\n二、參酌《社會福利基本法》第二十七條之精神，為鼓勵企業及社會團體善盡社會責任，本條文第三項規範政府應鼓勵企業及社會團體共同推動青年政策。此旨在引導私部門資源投入青年發展領域，與政府協力創造一個支持青年永續發展之社會。此等跨部門合作將有助於匯聚更多力量，共同為青年擘劃更廣闊的未來。"},{"bill":"202110166280000","text":"政府應協助以青年為主體之非營利組織及團體之發展，支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為協助以青年為主體之非營利組織及團體之發展，以及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。"},{"bill":"202110169130000","text":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","note":"一、為協助以青年為主體之非營利組織及團體之發展，以及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。"},{"bill":"202110175160000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修正或廢止。"}],"changed":true,"final":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。\n政府應保障年滿十八歲之青年有依法行使選舉、罷免、創制、複決之權，並於本法施行之日起二年內完備相關法制。","finalWhy":"一、為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力，爰為第一項規定。\n二、人民之參政權為憲法保障之基本權利，亦是民主價值最重要的體現。參酌調降選舉權行使年齡為國際趨勢，且完善年滿十八歲青年之權利及義務，有助於青年參與社會的公共事務，並為國家發展貢獻力量。為積極實現十八歲公民權之願景，應於本法施行之日起二年內完備相關法制，爰為第二項規定。","review":{"note":"不予採納","text":""}},{"no":"第二十一條","current":null,"versions":[{"bill":"202110017600000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"201110120370000","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，善盡全球公民責任，並鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展，爰規定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110059880000","text":"政府應協助以青年為主體之非營利組織及社團發展，或支持辦
