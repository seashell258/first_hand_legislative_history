導及執行。\n二、全國性青年發展政策、法規及計畫之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"考量青年事務亦有需因地制宜而歸屬地方政府權限者，爰明定直轄市、縣（市）政府應落實青年事務之事項，俾由直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。"},{"bill":"202110128180000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、中央青年發展政策、法規及方案之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"考量中央與地方權限劃分，青年事務亦有需因地制宜而歸屬地方權限者，爰明定直轄市、縣（市）政府應落實涉及青年事務之事項，俾供直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。"},{"bill":"202110128310000","text":"青年享有平等且多元之學習與教育機會。國家應確保教育資源公平分配，發展多樣化教育模式，促進青年終身學習與創造能力。","note":"確認教育與學習為青年最基礎之發展條件，國家有義務提供機會平等與資源支持。條文以「平等」、「可近」、「多元」三原則架構青年學習權之實質內涵，其中「可近性」特指地理、經濟、數位與文化層面之可及；「多元性」則涵蓋正規教育、職業訓練、非正式教育與數位學習。條文亦導入「終身學習」與「創造力發展」概念，回應青年在快速變遷社會中的適應與創新需求。本文增列本條以彌補法律位階之不足，並參考芬蘭、韓國、紐西蘭等國之相關條文加以融合。"},{"bill":"202110129310000","text":"政府應致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年創新創業環境，建構青年事業永續發展條件。","note":"一、為落實《憲法》、《世界人權宣言》第二十三條與第二十四條、《經濟社會文化權利公約》第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利，第七條亦明定人人有權享受公平與良好之工作條件。\n二、參照青年發展政策綱領「就業力」之推動策略為「加強人才專業培育，營造有利創新創業環境，建構青年事業永續發展條件」。"},{"bill":"202110132300000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、直轄市、縣（市）青年發展相關經費之分配及補助。\n三、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"明定地方政府應落實之青年事務。"},{"bill":"202110143380000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、全國性青年發展政策、法規及計畫之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"考量青年事務亦有需因地制宜而歸屬地方政府權限者，爰明定直轄市、縣（市）政府應落實青年事務之事項，俾由直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。"},{"bill":"202110155730000","text":"直轄市、縣（市）政府應落實下列地方青年發展事務：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之研擬、制（訂）定、宣導及執行。\n二、中央青年發展政策、法規及方案之執行與配合。\n三、直轄市、縣（市）政府青年發展相關經費之編列、分配及監督。\n四、其他地方性青年發展事項之策劃及督導。","note":"鑒於青年事務推動之多元性與在地化需求，並考量中央與地方政府權限劃分之原則，部分青年事務確有因地制宜，由地方政府主管並執行之必要。爰於本條文第一款至第四款，明確界定直轄市、縣（市）政府應主管並執行之地方性青年發展事項，俾利其據以規劃、推動及落實各項在地青年發展措施。此一分工旨在確保中央與地方政府在青年事務推動上之權責清晰，共同協力建構完善之青年發展網絡。"},{"bill":"202110166280000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、全國性青年發展政策、法規及計畫之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"考量青年事務亦有需因地制宜而歸屬地方政府權限者，爰明定直轄市、縣（市）政府應落實青年事務之事項，俾由直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。"},{"bill":"202110169130000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、全國性青年發展政策、法規及計畫之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"考量青年事務亦有需因地制宜而歸屬地方政府權限者，爰明定直轄市、縣（市）政府應落實青年事務之事項，俾由直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。"},{"bill":"202110175160000","text":"中央主管機關應建立青年參與公共政策之機制，確保青年政策公開透明，並鼓勵地方政府提供青年參與之機會。\n前項青年公共參與機制、青年代表遴聘標準與鼓勵辦法，由主管機關定之。青年代表任一性別比例不得低於三分之一。","note":"政府應建立青年參與公共政策之機制，並鼓勵地方政府提供青年參與之機會。"}],"changed":true,"final":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、全國性青年發展政策、法規及計畫之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","finalWhy":"考量青年事務亦有需因地制宜而歸屬地方政府權限者，爰明定直轄市、縣（市）政府應落實青年事務之事項，俾由直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。","review":{"note":"照行政院提案通過","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。"}},{"no":"第六條","current":null,"versions":[{"bill":"202110017600000","text":"中央主管機關每隔二年發布青年發展政策白皮書，並透過網際網路或其他適當方式公開。","note":"明定中央主管機關每隔二年應發布青年發展政策白皮書。"},{"bill":"202110040040000","text":"政府應致力營造良善之青年教育環境，協助青年發展、提升青年技能與創造力。","note":"世界人權宣言第二十六條，明定人人皆有受教育之權、技術與職業教育應廣為設立、高等教育應予人人平等機會等權利主張，爰訂定本條，揭示政府應營造良善之青年教育環境，以協助青年提升技能與創造力。"},{"bill":"201110120370000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年參與機制，保障青年參與之權利。\n政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度。","note":"一、為推動「青年主流化」，政府於制定政策、法規及計畫時，應納入以青年為主體之觀點通盤思考，並考量青年族群作為該等領域之政策、法規及計畫之利害關係人，為使政策、法規及計畫之制定更為周詳，並提升青年賦能與當責及公民參與之主動性，爰於第一項明定政府應建立青年參與政府政策、法規及計畫形成之機制，期使政策、法規、計畫形成過程更為公正及透明，確保青年族群之意見有表達之機會。\n二、為使青年能真正參與政策、法規及計畫之擬訂，提供適切之意見，並避免青年參與機制流於形式，爰於第二項明定青年代表應具有一定之代表性，並對於所參與之領域具有足夠之熟悉度。"},{"bill":"202110057110000","text":"國家應營造良好之學習環境，提供各年齡層青年多元學習管道，以習得各種技能與專長。","note":"一、依據聯合國《經濟社會文化權利國際公約》第十三條，揭示人人有受教育之權。\n二、次依《世界人權宣言》第二十六條，技術與職業教育應廣為設立，亦即應同等重視。是故多元學習管道應廣為提供給青年，爰訂定本條。"},{"bill":"202110059880000","text":"政府應營造良好之學習環境，提供各年齡層青年多元學習管道，以習得各種技能與專長。","note":"一、依據聯合國《經濟社會文化權利國際公約》第十三條，揭示人人有受教育之權。\n二、次依《世界人權宣言》第二十六條，技術與職業教育應廣為設立，亦即應同等重視。是故多元學習管道應廣為提供給青年，爰訂定本條。"},{"bill":"202110061560000","text":"政府應訂定青年居住政策，積極保障青年居住權利，提供青年良好之居住品質。","note":"為落實「世界人權宣言」及「經濟社會文化權利國際公約」第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰訂定本條，揭示政府應訂定青年居住政策，積極保障青年居住權利，提供青年良好之居住品質。"},{"bill":"202110061410000","text":"政府應營造良善之青年教育環境，協助青年發展、提升技能與創造力。","note":"「世界人權宣言」第二十六條規範，人人皆有受教育之權；技職教育應廣為設立，高等教育應予平等機會，鄉鎮區教育資源應要均衡。爰此，政府應營造良善的青年教育環境，以協助青年發展或提升技能，培養創造力。"},{"bill":"202110068970000","text":"政府應致力提供青年多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力。\n政府應積極保障青年學習權及受教育權，提供良善教育環境。","note":"一、為落實《憲法》、《世界人權宣言》第二十六條、《經濟社會文化權利公約》第十三條、《教育基本法》保障之人民受教育權利。\n二、參照青年發展政策綱領「創學力」之推動策略為「提供多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力」。\n三、《教育基本法》第八條明定，國家應保障學生之學習權與受教育權。"},{"bill":"202110070660000","text":"政府應打造良好之學習環境，提供青年多元學習管道，積極保障青年學習權及受教育權。","note":"《世界人權宣言》第二十六條揭示，人人皆有受教育之權利，技職與職業教育應普遍設立；高等教育應平等開放。政府應提供多元學習管道供青年學習，保障青年之學習權及受教育權。"},{"bill":"202110071010000","text":"政府應提供青年之就業輔導、職業訓練、就業準備、就業服務及勞動條件維護，並應積極營造良好之就業環境。","note":"參考韓國《青年基本法》第十七條，將青年之就業、訓練與勞動條件納入本法之保障。"},{"bill":"202110072290000","text":"行政院應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策綱領。\n行政院應依據國家青年發展計畫，每二年擬訂國家青年發展計畫，作為青年相關政策之施政依據。\n第一項青年政策綱領之擬訂應包含以下事項，由青年國是會議討論後，經行政院核定：\n一、青年政策或發展計畫之基本方向與推動目標。\n二、青年政策或發展計畫之各領域主要政策。\n三、過去青年政策或發展計畫之分析評估。\n四、青年政策或發展計畫財源籌措辦法。\n五、青年政策或發展計畫其他相關事項。\n前項青年國是會議，每四年由行政院召開之，成員包括相關部會、地方政府、學者專家、社會團體及青年代表之，並廣納各界意見。","note":"一、青年政策綱領與國家青年發展計畫之擬訂，及青年國是會議之召開。\n二、為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求與政策遠景，每四年擬訂青年政策綱領，爰訂定第一項。\n三、行政院應依據國家青年發展計畫，每二年擬訂國家青年發展計畫，作為青年相關政策之施政依據，爰訂定第二項。\n四、青年政策綱領應為廣納各界意見，爰訂定第三項，明定政府應召集相關部會、地方政府、學者專家、社會團體及青年代表召開青年國是會議，並經會議討論後由行政院核定。\n五、第四項明定青年國是會議每四年由行政院召開。"},{"bill":"202110072330000","text":"政府應訂定青年居住政策，積極保障青年居住權利與居住品質。","note":"政府應訂定青年居住政策，保障青年享有安全、和平及尊嚴之居住權。"},{"bill":"202110072870000","text":"政府應制（訂）定青年居住政策，積極保障青年居住正義及合宜之居住品質，提供青年安居且適育之居住環境。","note":"為落實《憲法》、《世界人權宣言》、《經濟社會文化權利國際公約》、《公民與政治權利國際公約》、《經濟社會文化權利公約》及《住宅法》，明定全體國民有權居住於適宜之住宅且享有尊嚴之居住環境。爰參照青年發展政策綱領所揭示「幸福力」之推動策略，保障青年享有安全、和平及尊嚴之適足居住權。"},{"bill":"202110075700000","text":"政府應積極培育參與公共事務之青年人才，並應提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識，確保青年享有公平參與體制之權利。","note":"一、參照104年核定之青年發展政策綱領中「公民力」內涵，提供青年公共政策參與機會及理性表達意見管道，內化社會關懷意識。\n二、爰明定為促進青年對公共事務之熱忱與參與，政府應培育青年積極參與公共事務，實現青年賦權，並確保青年享有公平參與體制之權利。"},{"bill":"202110076040000","text":"政府應提供青年之就業輔導、職業訓練、就業準備、就業服務及勞動條件維護，並應積極營造良好之就業環境。","note":"參考韓國《青年基本法》第十七條，將青年之就業、訓練與勞動條件納入本法之保障。"},{"bill":"202110078370000","text":"政府應積極培育參與公共事務之青年人才，並應提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識，確保青年享有公平參與體制之權利。","note":"一、參照104年核定之青年發展政策綱領中「公民力」內涵，提供青年公共政策參與機會及理性表達意見管道，內化社會關懷意識。\n二、爰明定為促進青年對公共事務之熱忱與參與，政府應培育青年積極參與公共事務，實現青年賦權，並確保青年享有公平參與體制之權利。"},{"bill":"202110079860000","text":"政府應營造良善之青年教育環境，提供青年多元學習管道、協助青年發展、提升青年工作技能與創造力。","note":"「世界人權宣言」第二十六條規範，人人皆有受教育之權；技職教育應廣為設立，高等教育應予平等機會，鄉鎮市區基層教育資源應予均衡。爰此，政府應營造良善的青年教育及學習環境，以協助青年發展或提升工作技能，培養創造力。"},{"bill":"202110080450000","text":"政府應積極培育參與公共事務之青年人才，並應提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識，確保青年享有公平參與體制之權利。","note":"一、參照104年核定之青年發展政策綱領中「公民力」內涵，提供青年公共政策參與機會及理性表達意見管道，內化社會關懷意識。\n二、爰明定為促進青年對公共事務之熱忱與參與，政府應培育青年積極參與公共事務，實現青年賦權，並確保青年享有公平參與體制之權利。"},{"bill":"202110085510000","text":"政府應積極培育參與公共事務之青年人才，並應提供青年公共政策參與機會，確保青年享有公平參與體制之權利。","note":"政府應培育青年積極參與公共事務，實現青年賦權，並確保青年享有公平參與體制之權利。"},{"bill":"202110100300000","text":"政府應積極保障青年學習權及受教育權，並提供良好學習環境。\n政府應考量青年之自主性及特殊性，提供青年多元學習管道，培養創意創新思維及獨立思考之能力。","note":"一、為落實《憲法》、《世界人權宣言》第二十六條、《經濟社會文化權利公約》第十三條、《教育基本法》保障之人民受教育權利。\n二、參照青年發展政策綱領「創學力」之推動策略為「提供多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力」。\n三、《教育基本法》第八條明定，國家應保障學生之學習權與受教育權。"},{"bill":"202110098760000","text":"各級政府應寬列青年發展經費，保障專款專用，並優先補助經濟弱勢、偏遠地區及身心障礙之青年。","note":"明定各級政府應寬列青年發展經費，保障專款專用，並優先補助經濟弱勢青年。"},{"bill":"202110098790000","text":"政府應致力營造友善青年之教育環境，提供青年多元學習管道，並培養青年技能、創造力、專長。","note":"聯合國《2030青年策略》指導之聯合國青年事務五大優先事項中，包含支援青年獲得更多的教育及健保服務；我國104年發布《青年發展政策綱領》，其推動策略中包含提供多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力，爰參酌二者訂定第六條。"},{"bill":"202110102250000","text":"政府應積極培育參與公共事務之青年人才，並應提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識，確保青年享有公平參與體制之權利。","note":"一、參照104年核定之青年發展政策綱領中「公民力」內涵，提供青年公共政策參與機會及理性表達意見管道，內化社會關懷意識。\n二、爰明定為促進青年對公共事務之熱忱與參與，政府應培育青年積極參與公共事務，實現青年賦權，並確保青年享有公平參與體制之權利。"},{"bill":"202110103250000","text":"政府應積極培育參與公共事務之青年人才，並應提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識，確保青年享有公平參與體制之權利。","note":"一、根據104年核定之青年發展政策綱領中所強調的「公民力」內涵，本法意在為青年創造參與公共政策制定雞會，並設置理性發聲之管道，藉此促進青年培養出社會關懷意識。\n二、為激發青年對公共事務的熱情及積極參與，政府應致力於推動青年參與公共事務，進而實現青年賦權，並確保青年在公平參與體制中享有相應之權利。"},{"bill":"202110104620000","text":"政府應訂定青年居住政策，積極保障青年居住權利，提供青年良好之居住品質。","note":"為落實「世界人權宣言」及「經濟社會文化權利國際公約」第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰訂定本條，揭示政府應訂定青年居住政策，積極保障青年居住權利，提供青年良好之居住品質。"},{"bill":"202110108760000","text":"中央主管機關應建立青年參與公共政策之機制，確保青年政策公開透明，並鼓勵地方政府提供青年參與之機會。","note":"政府應建立青年參與公共政策之機制，並鼓勵地方政府提供青年參與之機會。"},{"bill":"202110107570000","text":"政府應積極培育參與公共事務之青年人才，提供青年參與、實習機會及理性表達意見管道，內化社會關懷意識，確保青年享有公平參與體制之權利。","note":"一、參照104年核定之青年發展政策綱領中「公民力」內涵，提供青年公共政策參與機會及理性表達意見管道，內化社會關懷意識。\n二、爰明定為促進青年對公共事務之熱忱與參與，政府應培育青年積極參與公共事務，實現青年賦權，並確保青年享有公平參與體制之權利。"},{"bill":"202110107400000","text":"政府應建立友善之就業與創業環境，提供職涯發展支持、職業訓練、創業資源及就業媒合服務，以提升青年經濟自主能力與社會參與度。","note":"一、青年進入職場初期，普遍面臨工資偏低、工作不穩定與創業門檻高等問題，需政府提供有系統的協助與保障。\n二、就業方面，應推動職能培訓、產學合作、就業媒合與青年職涯諮詢，協助青年順利銜接職場與提升職場競爭力。\n三、創業方面，應提供創業補助、貸款融資協助、創業育成空間、導師制度與市場開拓機會，協助青年開創自我事業。\n四、本條強調從職前準備到職場支持、從創意孵化到企業經營，全方位強化青年就業與創業的支持體系，促進經濟活力與社會多元發展。"},{"bill":"202110109830000","text":"政府應提供多元學習管道，保障青年學習權，激發青年創造力，並提升其技能及創新能力。","note":"參照教育部「青年發展政策綱領」創學力之推動策略為「提供多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力」，明訂政府應提供多元學習管道，保障青年學習權，激發青年創造力，並提升其技能及創新能力。"},{"bill":"202110123900000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年參與機制，保障青年參與之權利。\n政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度。","note":"一、第一項明定政府應建立青年參與政府相關政策、法規及計畫形成之管道，確保青年族群之意見有表達之機會，並獲得政府重視。\n二、為使青年能真正參與青年相關政策、法規及計畫之擬訂過程，提供適切之意見，並避免青年參與機制流於形式，第二項明定青年代表應具有一定之代表性，並對於所參與之領域具有足夠之熟悉度。"},{"bill":"202110124800000","text":"政府應訂定青年居住政策，積極保障青年居住權利，提供青年良好之居住品質。","note":"為落實聯合國《世界人權宣言》及《經濟、社會及文化權利國際公約》第四號一般性意見「適足的住房之人權源自於相當的生活水準之權利，對享有所有經濟、社會及文化權利是至關重要的」。故政府應訂定青年居住政策，積極保障青年居住權利，提供青年良好之居住品質。"},{"bill":"202110124830000","text":"政府應致力提供青年多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力。\n政府應積極保障青年學習權及受教育權，提供良善教育環境。","note":"為落實《憲法》及國際公約規範保障之受教育權，政府應確保青年平等受教與學習的機會。參照青年發展政策綱領「創學力」策略，應提供多元學習管道，激發潛能，培養創新與獨立思考能力，實現教育機會均等與青年全面發展。"},{"bill":"202110126910000","text":"政府應積極促進青年公共參與，培育參與公共事務之青年人才，並提供青年公共事務參與機會，內化社會關懷意識，深化民主素養。","note":"為落實青年公共參與權，政府應積極培育及鼓勵青年參與公共事務，並提供公共參與之機會，促進青年社會關懷，賦予青年對公共事務之實質影響力。"},{"bill":"202110127050000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年參與機制，保障青年參與之權利。\n政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度。","note":"一、為推動「青年主流化」，政府於制定政策、法規及計畫時，應納入以青年為主體之觀點通盤思考，並考量青年族群作為該等領域之政策、法規及計畫之利害關係人，為使政策、法規及計畫之制定更為周詳，並提升青年賦能與當責及公民參與之主動性，爰於第一項明定政府應建立青年參與政府政策、法規及計畫形成之機制，期使政策、法規、計畫形成過程更為公正及透明，確保青年族群之意見有表達之機會。\n二、為使青年能真正參與政策、法規及計畫之擬訂，提供適切之意見，並避免青年參與機制流於形式，爰於第二項明定青年代表應具有一定之代表性，並對於所參與之領域具有足夠之熟悉度。"},{"bill":"202110128060000","text":"政府應確保青年政策、法規及計畫形成過程中之公正、公開與透明，並建立青年參與之常設機制。\n前項常設機制，應有青年參與之保障。\n中央主管機關應鼓勵地方政府積極建立青年參與之機制。","note":"有鑑於青年族群為青年政策最直接之利害關係人，政府應設置青年參與之常設機制，且制定青年相關政策、法規及計畫時，亦應有一定比例青年代表參與決策會議。"},{"bill":"202110128180000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年參與機制，保障青年參與之權利。\n政府於遴聘青年參與時，應考量其區域平衡、年齡以及族群代表性。","note":"一、為推動「青年主流化」，政府於制定相關政策、法規及計畫時，應納入以青年為主體之觀點通盤思考，並考量青年族群作為該等領域之政策、法規及計畫之利害關係人，為使其制定更為周詳，並提升青年賦能與當責及公民參與之主動性，爰於第一項明定政府應建立青年參與政府相關政策、法規及計畫形成之管道，期使政策、法規、計畫形成過程更為公正及透明，確保青年族群之意見有表達之機會，並獲得政府重視。\n二、為使青年能真正參與青年相關政策、法規及計畫之擬訂過程，提供適切之意見，應考量區域平衡、年齡和族群，已充分收集青年意見。"},{"bill":"202110128310000","text":"青年有平等就業機會與合理勞動條件之權利。國家應推動職涯發展、職業訓練、就業媒合及勞動保障等政策，促進青年穩定就業與經濟自立。","note":"明確將「就業與勞動」作為青年基本權利之一，回應青年世代長期面對就業不穩定、低薪、高工時與職涯斷裂等結構性困境。條文結構首先肯認青年應享有「平等機會」與「合理條件」，再進一步要求國家推動四項具體政策工具：職涯發展（含生涯輔導與職涯教育）；職業訓練（促進技能移轉與產學接軌）；就業媒合（特別關注青年進入職場初期之障礙）；勞動保障（預防職場剝削並納入勞動檢查與救濟機制）。本條對應104年《青年發展政策綱領》「促進青年就業與職涯發展」目標，並吸收韓國、芬蘭等國保障青年勞動市場參與的立法精神。"},{"bill":"202110129310000","text":"政府應致力提供青年多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力。\n政府應積極保障青年學習權及受教育權，提供良善教育環境。","note":"一、為落實《憲法》、《世界人權宣言》第二十六條、《經濟社會文化權利公約》第十三條、《教育基本法》保障之人民受教育權利。\n二、參照青年發展政策綱領「創學力」之推動策略為「提供多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力」。\n三、《教育基本法》第八條明定，國家應保障學生之學習權與受教育權。"},{"bill":"202110132300000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年公共參與機制，保障青年參與之權利。\n政府依本法第二十七條或其他法令，遴聘青年參與時，應考量下列情形，由主管機關制定青年代表資格遴聘及公共參與機制之辦法，並由各級政府遴聘之：\n一、青年之代表性。\n二、對青年事務之熟悉度。\n三、本法所定年齡範圍，於全數代表應平均分布。\n四、任一性別比例，不低於全體青年代表之三分之一。\n五、應有該政策、法規及計畫領域之弱勢青年至少一名。\n六、青年代表得請求各該政府機關召集會議之最低人數。\n七、各該青年公共參與機制之議事程序。\n前項辦法中，有關第二十七條第一項之行政院青年發展事務會報青年代表，應有一定比例，由各級政府自同條第二項或第三項之青年代表中推派。","note":"一、明定青年參與公共事務機制於第一項，其參與機制辦法事宜，於第二項及第三項。另政府鼓勵青年公共參與之成果，得在本法所定青年週加以呈現，規定於本法第二十九條，一併敘明。\n二、本條所規範之青年參與機制，包含三種類型：1.第二十七條第一項及第二項，所定中央、地方之青年事務發展會報，2.同條第三項所定之青年諮詢組織，3.其他各級政府依各該職權，制定之參與機制（有可能有相關法律，例如第九條第二項參與制定勞動檢查之青年代表、第二十四條第三項青年發展基金之管理組織；也可能是各級政府機關，依職權自行訂定）。國發會應按前述區分，以參與機制之辦法，制定青年代表資格之細節，以利各該政府機關遵循，俾合乎本次立法主軸，確立青年主體，健全參與機制。\n三、為健全參與機制，當中，行政院之青年事務發展會報，有審核青年發展行動綱領的重要權責。為強化政院會報之代表性，茲設計須匯聚各級政府既有之青年代表，須由地方政府按比例推派行政院聘請，並應將此內容明定於參與機制之辦法。"},{"bill":"202110143380000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年參與機制，保障青年參與之權利。\n政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度。","note":"一、為推動「青年主流化」，政府於制定政策、法規及計畫時，應納入以青年為主體之觀點通盤思考，並考量青年族群作為該等領域之政策、法規及計畫之利害關係人，為使政策、法規及計畫之制定更為周詳，並提升青年賦能與當責及公民參與之主動性，爰於第一項明定政府應建立青年參與政府政策、法規及計畫形成之機制，期使政策、法規、計畫形成過程更為公正及透明，確保青年族群之意見有表達之機會。\n二、為使青年能真正參與政策、法規及計畫之擬訂，提供適切之意見，並避免青年參與機制流於形式，爰於第二項明定青年代表應具有一定之代表性，並對於所參與之領域具有足夠之熟悉度。"},{"bill":"202110155730000","text":"政府於制定青年發展政策、法規與計畫時，應建立機制保障青年參與權利，並廣詢意見納入相關政策會議討論。\n政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度與專業知能。","note":"一、青年族群乃青年政策最直接之利害關係人，其觀點與需求對於政策之周詳性與妥適性至關重要。爰於本條文第一項明定政府於制定青年相關政策、法規及計畫時，應建立並保障青年之實質參與機制。此舉旨在確保青年政策、法律與計畫之形成過程得以更趨公正與透明，並充分採納利害關係人意見，俾使政策能更貼近青年實際需求。\n二、為避免青年參與機制流於形式，並確保青年所提意見之適切性與專業性，本條文第二項明定政府於遴選青年參與時，應審慎考量其代表性及對相關事務之專業知能。此一規範旨在確保青年代表能真正反映青年群體多元面向之聲音，並能針對所參與之領域提出具建設性之意見，進而提升青年參與機制之實質效益。"},{"bill":"202110166280000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立常態性青年參與機制，保障青年參與之權利。\n前項常態性機制，應有青年參與名額及程序之保障。\n政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度。","note":"一、為推動「青年主流化」，政府於制定政策、法規及計畫時，應納入以青年為主體之觀點通盤思考，並考量青年族群作為該等領域之政策、法規及計畫之利害關係人，為使政策、法規及計畫之制定更為周詳，並提升青年賦能與當責及公民參與之主動性，爰於第一項明定政府應建立青年參與政府政策、法規及計畫形成之常設機制，期使政策、法規、計畫形成過程更為公正及透明，確保青年族群之意見有表達之機會。\n二、為使青年能真正參與政策、法規及計畫之擬訂，提供適切之意見，並避免青年參與機制流於形式，爰於第二項明定青年代表應具有一定之代表性，並對於所參與之領域具有足夠之熟悉度。"},{"bill":"202110169130000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年參與機制，保障青年參與之權利。\n政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度。","note":"一、為推動「青年主流化」，政府於制定政策、法規及計畫時，應納入以青年為主體之觀點通盤思考，並考量青年族群作為該等領域之政策、法規及計畫之利害關係人，為使政策、法規及計畫之制定更為周詳，並提升青年賦能與當責及公民參與之主動性，爰於第一項明定政府應建立青年參與政府政策、法規及計畫形成之機制，期使政策、法規、計畫形成過程更為公正及透明，確保青年族群之意見有表達之機會。\n二、為使青年能真正參與政策、法規及計畫之擬訂，提供適切之意見，並避免青年參與機制流於形式，爰於第二項明定青年代表應具有一定之代表性，並對於所參與之領域具有足夠之熟悉度。"},{"bill":"202110175160000","text":"各級政府應寬列青年發展經費，保障專款專用，並優先補助經濟弱勢、偏遠地區及身心障礙之青年。\n中央主管機關應編列預算，適當獎勵補助地方政府。","note":"明定各級政府應寬列青年發展經費，保障專款專用，並優先補助經濟弱勢青年。"}],"changed":true,"final":"國家於制定政策、法規及計畫時，應鼓勵青年充分參與，建立青年公平參與機制，保障青年參與之權利。\n各級政府於遴聘青年參與時，應考量其代表性、背景多元性及區域平衡，並規劃民主多元參與方式及提供充分支持。","finalWhy":"一、為推動「青年主流化」，國家於制定政策、法規及計畫時，應納入以青年為主體之觀點通盤思考，並考量青年族群作為該等領域之政策、法規及計畫之利害關係人，為使政策、法規及計畫之制定更為周詳，並提升青年賦能與當責及公民參與之主動性，爰於第一項明定國家應建立青年參與政府政策、法規及計畫形成之機制，期使政策、法規、計畫形成過程更為公正及透明，確保青年族群之意見有表達之機會。\n二、為使青年能真正參與政策、法規及計畫之擬訂，提供適切之意見，並避免青年參與機制流於形式，爰於第二項明定青年代表應考量具有一定之代表性(例如，對議題之關注度、對所參與領域具有足夠之熟悉度)、背景多元性(例如，年齡、性別、族群、身心障礙等)及區域平衡，並規劃民主多元參與方式及提供充分支持。","review":{"note":"保留，送院會處理","text":""}},{"no":"第七條","current":null,"versions":[{"bill":"202110017600000","text":"各級政府應寬列青年發展經費，保障專款專用。\n對經濟弱勢、偏遠及特殊地區之青年，應優先予以補助。","note":"明定國家應寬列青年發展經費，保障專款專用。"},{"bill":"202110040040000","text":"政府應訂定青年居住政策，積極保障青年居住正義，提供青年安居且適足之居住環境。","note":"一、經濟社會文化權利國際公約第十一條第一項明定，人人有權享受其本人及家屬所需之適當生活程度，包括適當之衣食住及不斷改善之生活環境。\n二、《住宅法》亦明確規範全體國民有權居住於適宜住宅、享有尊嚴之居住環境。"},{"bill":"201110120370000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵青年推動、參與能源及環境保護等永續議題，共同實現淨零排放目標。","note":"一、為呼應聯合國西元二○三○年永續發展議程，期盼至西元二○三○年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、青年係推動社會進步、國家發展之關鍵動力，為促進世代共榮，達成臺灣永續發展目標，政府推動社會發展，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。"},{"bill":"202110057110000","text":"國家應訂定青年居住政策，積極保障青年適足居住權，提升青年良好之居住品質。","note":"一、為落實聯合國《經濟社會文化權利國際公約》第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰訂定本條。\n二、房屋稅差別稅率、興建社會住宅、青年租屋補貼加碼等青年居住政策都在總統候選人政見被提出討論，凸顯近年青年居住正義的議題需要被重視。"},{"bill":"202110059880000","text":"政府應訂定青年居住政策，積極保障青年適足居住權，提供青年良好之居住品質。","note":"一、為落實聯合國《經濟社會文化權利國際公約》第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰訂定本條。\n二、房屋稅差別稅率、興建社會住宅、青年租屋補貼加碼等青年居住政策都在總統候選人政見被提出討論，凸顯近年青年居住正義的議題需要被重視。"},{"bill":"202110061560000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策。","note":"「世界人權宣言」第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務，爰訂定本條，揭示政府應制定促進青年身心健康、提高生活品質之福利政策，保障青年身心及生活福利。"},{"bill":"202110061410000","text":"政府應訂定青年居住政策，保障青年居住權利及居住品質。","note":"「經濟社會文化權利國際公約」第十一條規範，人人有權享受其本人及家屬所需之適當生活程度，包括適當之衣食住及不斷改善之生活環境。爰此，政府應訂定青年居住政策，積極保障青年居住權利，並提供青年良好的居住品質。"},{"bill":"202110068970000","text":"政府應制（訂）定青年居住政策，積極保障青年居住正義，提供青年適足居住之環境。","note":"一、為落實《憲法》、《世界人權宣言》第十三條、《經濟社會文化權利國際公約》第十一條、《公民與政治權利國際公約》第十二條、《經濟社會文化權利公約》第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權。\n二、住宅法明定全體國民有權居住於適宜之住宅且享有尊嚴之居住環境。"},{"bill":"202110070660000","text":"政府應訂定青年居住政策，積極保障青年居住權利，維護青年居住正義。","note":"按《世界人權宣言》第十三條、《經濟社會文化權利國際公約》第十一條及《經濟社會文化權利公約》第四號一般性意見之意旨，應保障青年之居住權益及青年居住正義。"},{"bill":"202110071010000","text":"政府應提供教育資源，提供良好、可負擔之教育環境，使其能充份發揮其能力。","note":"參考韓國《青年基本法》第十九條，以教育措施支持青年。"},{"bill":"202110072290000","text":"青年享有參與青年政策及法規制（訂）定之權利。\n政府應確保青年政策形成之公正與公開透明，並建立青年參與之常設機制。","note":"一、青年享有參與青年政策及法規制（訂）定之權利。\n二、青年族群作為青年政策最直接之利害關係人，為使政策制定更為周詳，爰訂定本條，揭示政府應制定青年政策之參與程序，保障青年參與權利，使青年政策、法律及計畫形成過程更為公正與透明，並參採利害關係人意見。"},{"bill":"202110072330000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策。","note":"政府應促進青年身心健康、提高生活品質，保障青年身心及生活福利。"},{"bill":"202110072870000","text":"政府應提供青年完善醫療與優質保健服務，建立健康、友善環境以維護青年身心健康，掌握青年基礎健康資訊，並制（訂）定促進青年身心健康及全人發展、提高生活品質之政策。","note":"為落實《憲法》、《世界人權宣言》明定人人皆享有為維持健康、福利所需生活水準及必要之社會服務，爰參照《社會福利政策綱領》、《2025 衛生福利政策白皮書》及青年發展政策綱領所揭示「健康力」之推動策略，保障國民健康權利。"},{"bill":"202110075700000","text":"政府應致力營造青年之良好學習環境，協助青年多元學習，提升青年技能與創造力。","note":"為落實《憲法》、《世界人權宣言》、《教育基本法》等之保障人民受教育權，爰明定政府應為青年營造良好的學習環境，藉以協助青年發展、提升青年技能與創造力。"},{"bill":"202110076040000","text":"政府應提供教育資源，提供良好、可負擔之教育環境，使其能充份發揮其能力。","note":"參考韓國《青年基本法》第十九條，以教育措施支持青年。"},{"bill":"202110078370000","text":"青年享有之權利不因族群、語言、性別、性傾向、年齡、地域、宗教信仰、身心狀況、社會經濟地位及其他條件，而受歧視或不合理之差別待遇。","note":"青年政策及法規應遵行平等原則"},{"bill":"202110079860000","text":"政府應訂定青年居住政策，保障青年居住權利及居住品質，維護青年居住正義。","note":"「經濟社會文化權利國際公約」第十一條規範，人人有權享受其本人及家屬所需之適當生活程度，包括適當之食衣住行及不斷改善之生活環境。爰此，政府應訂定青年居住政策，積極保障青年居住權利，並提供青年良好的居住品質，維護青年居住正義。"},{"bill":"202110080450000","text":"青年享有之權利不因族群、語言、性別、性傾向、年齡、地域、宗教信仰、身心狀況、社會經濟地位及其他條件，而受歧視或不合理之差別待遇。","note":"青年政策及法規應遵行平等原則"},{"bill":"202110085510000","text":"政府應致力發展青年之良好教育學習環境，協助青年多元學習，提升青年技能與創造力。","note":"為落實《憲法》、《世界人權宣言》、《教育基本法》等之保障人民受教育權，爰明定政府應為青年發展優良的教育學習環境，藉以協助青年發展、提升青年技能與創造力。"},{"bill":"202110100300000","text":"青年享有之權利不因族群、語言、性別、性傾向、年齡、地域、宗教信仰、身心狀況、社會經濟地位及其他條件，而受歧視或不合理之差別待遇。","note":"青年政策及法規應遵行平等原則。"},{"bill":"202110098760000","text":"政府應積極培育參與公共事務之青年人才，提供青年參與、實習機會，確保青年享有公平參與體制之權利。","note":"明定政府應培育參與公共事務之青年人才，確保青年享有公平參與體制之權利。"},{"bill":"202110098790000","text":"政府應訂定青年居住政策，積極保障青年居住權，致力營造安居、適居之居住環境。","note":"參酌我國104年發布《青年發展政策綱領》，其推動策略中包含打造青年安居且適育之環境；另因應青年居住議題，高房價成為青年成家立業之困境，故青年政策亦應涵蓋「青年安居」，爰訂定第七條。"},{"bill":"202110102250000","text":"政府應致力營造青年之良好學習環境，協助青年多元學習，提升青年技能與創造力。","note":"為落實《憲法》、《世界人權宣言》、《教育基本法》等之保障人民受教育權，爰明定政府應為青年營造良好的學習環境，藉以協助青年發展、提升青年技能與創造力。"},{"bill":"202110103250000","text":"政府應致力營造青年之良好學習環境，協助青年多元學習，提升青年技能與創造力。","note":"為落實《憲法》、《世界人權宣言》、《教育基本法》等之保障人民受教育權，爰明定政府應為青年營造良好的學習環境，藉以協助青年發展、提升青年技能與創造力。"},{"bill":"202110104620000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策。","note":"「世界人權宣言」第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務，爰訂定本條，揭示政府應制定促進青年身心健康、提高生活品質之福利政策，保障青年身心及生活福利。"},{"bill":"202110108760000","text":"政府應積極培育參與公共事務之青年人才，提供青年參與、實習機會，確保青年享有公平參與體制之權利。","note":"明定政府應培育參與公共事務之青年人才，確保青年享有公平參與體制之權利。"},{"bill":"202110107570000","text":"政府應致力營造青年之良好學習環境，協助其多元學習，以提升青年競爭力與創造力。","note":"為落實《憲法》、《世界人權宣言》、《教育基本法》等之保障人民受教育權，爰明定政府應協助青年享有良好的教育學習環境，提升青年的競爭力。"},{"bill":"202110107400000","text":"政府應制定青年友善居住政策，保障青年享有可負擔、適切且穩定之居住環境，並提供租屋補貼、購屋協助及社會住宅資源。","note":"一、青年在進入職場初期或創業階段，常面臨高房價、高租金與居住不穩等問題，嚴重影響其生活品質與發展機會。\n二、政府應從多面向入手，推動：租屋補貼與租賃媒合平台，協助青年穩定租住；購屋貸款利息補貼與優惠方案，支持青年逐步實現自有住宅目標；增加青年可入住的社會住宅比率，確保基本居住權。\n三、透過上述措施，減輕青年居住負擔，促進其就業穩定、家庭建立與社會參與，達到世代正義與居住人權之保障。"},{"bill":"202110109830000","text":"政府應制訂青年居住政策，保障青年居住正義，並提供適足的居住環境。","note":"青年應獲得基本居住權保障，以免因住房問題影響其生活穩定、發展機會及社會參與。明訂政府有責任制定青年居住政策，積極推動青年居住正義。"},{"bill":"202110123900000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵青年推動、參與能源及環境保護等永續議題，共同實現淨零碳排願景。","note":"一、聯合國西元二○三○年永續發展議程文件，期盼至西元二○三○年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、為促進世代共榮，達成臺灣永續發展目標，政府於推動社會發展時，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。"},{"bill":"202110124800000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策。","note":"聯合國《世界人權宣言》第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務。政府應制定促進青年身心健康、提高生活品質之福利政策，保障青年身心及生活福利。"},{"bill":"202110124830000","text":"政府應制（訂）定青年居住政策，積極保障青年居住正義，提供青年適足居住之環境。","note":"為實現《憲法》與國際公約規範保障之適足居住權，政府應積極推動青年居住政策，確保青年能享有安全、和平且具尊嚴的居住環境。依據《住宅法》及相關國際意見，青年應有適宜住宅與良好居住品質，落實居住正義與基本人權。"},{"bill":"202110126910000","text":"政府應致力營造青年之良好學習環境，協助其多元學習，提升青年競爭力與創造力。","note":"為落實《憲法》、《世界人權宣言》、《教育基本法》等之保障人民受教育權，爰明定政府應協助青年享有良好的教育學習環境，提升青年的競爭力。"},{"bill":"202110127050000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵青年推動、參與能源及環境保護等永續議題，共同實現淨零排放目標。","note":"一、為呼應聯合國西元二○三○年永續發展議程，期盼至西元二○三○年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、青年係推動社會進步、國家發展之關鍵動力，為促進世代共榮，達成臺灣永續發展目標，政府推動社會發展，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。"},{"bill":"202110128060000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。","note":"一、為呼應聯合國二○三○永續發展議程及核心發展目標，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、青年係推動社會進步、國家發展之關鍵動力，為促進世代共榮，達成臺灣永續發展目標，政府推動社會發展，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。"},{"bill":"202110128180000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵青年推動、參與能源及環境保護等永續議題，共同實現淨零碳排願景。","note":"一、為呼應聯合國西元二○三○年永續發展議程文件，期盼至西元二○三○年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、青年係推動社會進步、國家發展之關鍵動力，為促進世代共榮，達成臺灣永續發展目標，政府於推動社會發展時，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。"},{"bill":"202110128310000","text":"政府應致力營造友善青年之教育環境，提供青年多元學習管道，並培養青年技能、創造力、專長。","note":"強調教育政策作為青年發展之基礎工程，明確賦予政府營造「友善青年之教育環境」的積極義務，並強化其於教育制度設計中對多樣性、創造性與實用性的重視。所謂「友善」涵蓋制度可及性、學習空間的包容性與教學內容的適切性，意在排除因階級、地區、身心條件或文化差異所造成的排除現象，建構青年可安心學習、自由探索的發展場域。"},{"bill":"202110129310000","text":"政府應訂定青年居住政策，保障青年居住權益，提供青年適足居住之環境。","note":"一、為落實《憲法》、《世界人權宣言》第十三條、《經濟社會文化權利國際公約》第十一條、《公民與政治權利國際公約》第十二條、《經濟社會文化權利公約》第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權。\n二、住宅法明定全體國民有權居住於適宜之住宅且享有尊嚴之居住環境。"},{"bill":"202110132300000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續，落實世代正義。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進環境資源保護與利用、性別平等、消弭貧窮之國家暨社會永續發展願景。\n促進平等反對歧視之政策與措施，應依第二十八條第一項之規定，另以法律定之。","note":"一、明定保障青年享有環境永續，與促進平等事宜於本條。環境永續與世代正義間之關聯呼應，業已說明如第一條說明三，一併敘明。\n二、有鑑於我國陸續將「消除一切形式種族歧視國際公約」、「公民與政治權利國際公約」、「經濟社會文化權利國際公約」、「消除對婦女一切形式歧視公約」、「兒童權利公約」及「身心障礙者權利公約」國內法化，反對一切歧視、促進平等，為普世價值，行政院更於113年5月2日公告「反歧視法」草案，展開公開徵詢意見作業，然而目前立法進程停擺，並無進展。本次制定雖為基本法，仍不失於可將進步理念，運用本法第二十八條第一項限期檢討法規機制，促使政府提出改革時間表，並另以「反歧視法」制定之。爰明定於第三項。"},{"bill":"202110143380000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵青年推動、參與能源及環境保護等永續議題，共同實現淨零排放目標。","note":"一、為呼應聯合國西元二○三○年永續發展議程，期盼至西元二○三○年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、青年係推動社會進步、國家發展之關鍵動力，為促進世代共榮，達成臺灣永續發展目標，政府推動社會發展，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。"},{"bill":"202110155730000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應以不減損或增進青年發展之機會與福祉，並共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵並支持青年參與能源及環境保護等永續發展議題，共同實現淨零碳排願景。","note":"一、青年世代乃國家發展之關鍵動能與未來希望所繫，為促進世代共榮並達成臺灣永續發展目標，政府於推動各項社會發展措施時，應以保障青年享有不減損或增進其發展之機會與福祉為根本原則。本條文第一項及第二項旨在確立政府對於青年世代之永續發展權利，並引導施政方針朝向性別平等與消弭貧窮之社會願景邁進，以共同建構一個更具包容性與韌性之社會。\n二、為響應全球永續發展潮流及國家環境產業發展方向，並肯定青年在推動永續轉型中之潛力與貢獻，本條文第三項明定政府應積極鼓勵並支持青年參與能源轉型及環境保護等永續發展議題。激發青年之創新與行動力，共同為實現淨零排放願景而努力，進而確保青年世代所處之環境得以永續發展。"},{"bill":"202110166280000","text":"政府應採取具體措施，保障青年在社會與環境永續發展中之機會與權益。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵並支持青年推動及參與能源轉型、環境保護及其他永續發展議題，共同實現國家淨零轉型目標。","note":"一、為呼應聯合國西元二○三○年永續發展議程，期盼至西元二○三○年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、青年係推動社會進步、國家發展之關鍵動力，為促進世代共榮，達成臺灣永續發展目標，政府推動社會發展，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。"},{"bill":"202110169130000","text":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵青年推動、參與能源及環境保護等永續議題，共同實現淨零排放目標。","note":"一、為呼應聯合國西元二○三○年永續發展議程，期盼至西元二○三○年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、青年係推動社會進步、國家發展之關鍵動力，為促進世代共榮，達成臺灣永續發展目標，政府推動社會發展，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。"},{"bill":"202110175160000","text":"政府應積極培育參與公共事務之青年人才，提供青年參與、實習機會，確保青年享有公平參與體制之權利。","note":"明定政府應培育參與公共事務之青年人才，確保青年享有公平參與體制之權利。"}],"changed":true,"final":"政府應採取具體措施，保障青年享有未來社會及環境之永續。\n政府推動社會發展，應建立不減損或增進青年發展之機會及福祉，共同促進性別平等、消弭貧窮之社會願景。\n政府應鼓勵青年推動、參與能源及環境保護等永續議題，共同實現淨零排放目標。","finalWhy":"一、為呼應聯合國西元二○三○年永續發展議程，期盼至西元二○三○年時能夠消除貧窮及饑餓，實現尊嚴、公正、包容之和平社會，守護地球環境與人類共榮發展，以確保當代與後世均享有安居樂業之生活，爰為第一項規定。\n二、青年係推動社會進步、國家發展之關鍵動力，為促進世代共榮，達成臺灣永續發展目標，政府推動社會發展，應使青年享有不減損或增進其發展之機會及福祉，爰為第二項規定。\n三、為鼓勵青年對永續環境之貢獻，及響應國家環境產業發展方向，爰為第三項規定。","review":{"note":"修正通過","text":"政府應訂定青年居住政策，提升青年之居住品質，落實青年居住正義。"}},{"no":"第八條","current":null,"versions":[{"bill":"202110017600000","text":"中央主管機關應提供青年個人儲蓄帳戶機制與適度優惠存款，於此帳戶中儲蓄、投資所獲得之存款利息、股利收入等資本利得應給予租稅減免，並強化青年財金素養，以助其自立生活與遠離貧窮。","note":"一、於個人儲蓄帳戶機制（Individual Savings Account, ISA）中之利息收入、股利等資本利得，可採低稅率課稅或甚至免稅，藉此提高青年投資意願。\n二、政府應給予誘因鼓勵青年儲蓄，不僅可以累積創業資金，透過財金素養提升，作為第一筆投資基金，協助青年朋友遠離貧窮。"},{"bill":"202110040040000","text":"政府應掌握青年基礎健康資訊，保障青年享有良好的醫療保健服務、並制定（訂）促進青年身心健康、提高生活品質之福利政策。","note":"一、世界人權宣言第二十五條明定，人人皆享有維持本人及其家屬之健康、福利所需生活水準。\n二、根據衛生福利部2020年統計，青少年族群自殺死亡率連續20年攀升，維護及提升青少年之身心健康已成為刻不容緩之政策方向。面對來自校園、同儕、課業、家長等多元壓力，國家應提供資源支持。"},{"bill":"201110120370000","text":"政府應採取具體措施，落實保障青年享有之學習及受教育權利，並致力建構多元學習環境，擴展學習場域，協助青年適應世界發展，提升青年韌性、學習力及創造力。","note":"一、世界人權宣言第二十六條明定人人皆有受教育之權利、應廣為設立技術與職業教育、高等教育應平等開放之精神，爰於本條前段明定青年享有之學習及受教育之權利，政府應採取具體措施落實其保障。\n二、鑒於教育應謀求人格及人格尊嚴意識之充分發展，且青年應變世界變化更為多元、迅速，故政府應致力於提供多元學習管道，協助青年生涯規劃，以建構適性發展之學習環境，並拓展其生活網絡；又為因應聯合國永續發展目標，建構韌性社會，亦應使青年具備韌性、學習力及創造力以適應世界發展，爰為本條後段規定。"},{"bill":"202110057110000","text":"國家應訂定促進青年身心健康、提高生活品質之健康及福利政策，確保健康福祉。","note":"一、依據《經濟社會文化權利國際公約》第十六條，人人有權享受可能達到之最高標準之身體與精神健康。\n二、次依該公約第十四號一般性意見，健康是行使其他人權不可或缺的一項基本人權。每個人都有權享有能夠達到的、有益於尊嚴生活的最高標準的健康。包括各種健康的基本要素，如食物和營養、住房、取得安全飲水和得到適當的衛生條件、安全而有益健康的工作條件和有益健康的環境。"},{"bill":"202110059880000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策，確保健康人權。\n政府應建立對青年持續性的心理健康支持政策。","note":"一、依據《經濟社會文化權利國際公約》第十六條，人人有權享受可能達到之最高標準之身體與精神健康。\n二、次依該公約第十四號一般性意見，健康是行使其他人權不可或缺的一項基本人權。每個人都有權享有能夠達到的、有益於尊嚴生活的最高標準的健康。包括各種健康的基本要素，如食物和營養、住房、取得安全飲水和得到適當的衛生條件、安全而有益健康的工作條件和有益健康的環境。\n三、按《精神衛生法》第四條第一項第一款，中央主管機關掌理心理健康促進政策、法規與方案之規劃、訂定及宣導。次依衛生福利部「年輕族群心理健康支持方案」之政策目的，政府已建立短期對青年的心理健康支持政策，應持續辦理。"},{"bill":"202110061560000","text":"政府應支持青年經濟獨立與穩定之經濟生活。","note":"青年為國家穩定發展與變革創新之動力，擁有經濟獨立與安定生活、提高經濟可及性，為青年經濟自由之基本條件，亦為「世界人權宣言」及「經濟社會文化權利國際公約」所揭示之精神，爰訂定本條。"},{"bill":"202110061410000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策。","note":"「世界人權宣言」第二十五條規範，人人有權享受其本人及其家屬所需適當之生活水準。另據衛生福利部2022年統計，青少年自殺率近20年來持續攀升。爰此，政府應促進青年身心健康、提高生活品質，以保障青年身心及生活福利。"},{"bill":"202110068970000","text":"政府應掌握青年基礎健康資訊，並制（訂）定促進青年身心健康及全人發展、提高生活品質之政策。","note":"一、為落實《憲法》、《世界人權宣言》第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務。\n二、依照《經濟社會文化權利公約》第十二條、《社會福利政策綱領》、《2025衛生福利政策白皮書》，保障國民健康權利。\n三、參照青年發展政策綱領「健康力」之推動策略為「掌握青年基礎健康資訊，打造健康安全的運動休閒環境，活絡社群正向互動」。"},{"bill":"202110070660000","text":"政府應訂定促進青年身心健康及提高青年生活品質之福利政策。","note":"一、《世界人權宣言》第二十五條明定人人皆享有為維持本人及其家屬之健康及福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務。\n二、民國一百十二年至一百十三年衛生福利部持續辦理「年輕族群心理健康支持方案」，廣受青年支持且減經青年經濟負擔並提升青年之心理健康，爰明文規定政府應訂定促進青年身心健康之相關政策。"},{"bill":"202110071010000","text":"政府應支持青年之運動發展，提供合宜措施輔導、協助青年於運動領域發揮其潛能。","note":"鑒於青年時期為運動員發展之重要階段，並在此時期就會頻頻參與國際賽事甚至參與國際球團、組織。爰將青年在運動領域之發展納入保障，以幫助青年運動員以及選手。"},{"bill":"202110072290000","text":"政府應致力營造良善之青年教育環境，協助青年發展、提升青年技能與創造力。","note":"一、青年教育環境之營造。\n二、「世界人權宣言」第二十六條明定人人皆有受教育之權、技術與職業教育應廣為設立、高等教育應予人人平等機會等權利主張，爰訂定本條，揭示政府應營造良善之青年教育環境，以協助青年提升技能與創造力。"},{"bill":"202110072330000","text":"政府應支持青年獨立與穩定之經濟生活。","note":"政府應支持青年經濟獨立與穩定，滿足青年經濟自由之基本條件。"},{"bill":"202110072870000","text":"政府應提供青年健康安全的運動休閒環境，促進與保障青年平等參與休閒活動之權利。","note":"參照青年發展政策綱領所揭示「健康力」之推動策略，保障青年平等參與休閒活動之權利。"},{"bill":"202110075700000","text":"政府應致力營造青年之良好數位環境，協助降低數位落差，建立數位平權之社會環境。","note":"為保障青年在數位環境中享有平等的機會與權益，並降低數位落差，建立數位平權之社會，爰為本條之規定。"},{"bill":"202110076040000","text":"政府應支持青年之運動發展，提供合宜措施輔導、協助青年於運動領域發揮其潛能。","note":"鑒於青年時期為運動員發展之重要階段，並在此時期就會頻頻參與國際賽事甚至參與國際球團、組織。爰將青年在運動領域之發展納入保障，以幫助青年運動員以及選手。"},{"bill":"202110078370000","text":"政府應致力營造青年之良好學習環境，協助青年多元學習，提升青年技能與創造力。","note":"為落實《憲法》、《世界人權宣言》、《教育基本法》等之保障人民受教育權，爰明定政府應為青年營造良好的學習環境，藉以協助青年發展、提升青年技能與創造力。"},{"bill":"202110079860000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策。","note":"「世界人權宣言」第二十五條規範，人人有權享受其本人及其家屬所需適當之生活水準，包括食物、衣著、住房、醫療及必要之社會服務。爰此，政府應促進青年身心健康、提高生活品質，以保障青年身心及生活福利。"},{"bill":"202110080450000","text":"政府應致力營造青年之良好學習環境，協助青年多元學習，提升青年技能與創造力。","note":"為落實《憲法》、《世界人權宣言》、《教育基本法》等之保障人民受教育權，爰明定政府應為青年營造良好的學習環境，藉以協助青年發展、提升青年技能與創造力。"},{"bill":"202110085510000","text":"政府應致力營造青年之良好數位環境，協助降低數位落差，建立數位平權之社會環境。","note":"為保障青年在數位環境中享有平等的機會與權益，並降低數位落差，建立數位平權之社會。"},{"bill":"202110100300000","text":"政府應訂定青年居住政策，積極保障青年居住權利與居住品質，維護居住正義。","note":"一、為落實《憲法》、《世界人權宣言》第十三條、《經濟社會文化權利國際公約》第十一條、《公民與政治權利國際公約》第十二條、《經濟社會文化權利公約》第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權。\n二、住宅法明定全體國民有權居住於適宜之住宅且享有尊嚴之居住環境。"},{"bill":"202110098760000","text":"政府應優化青年之教育環境，協助其多元學習，以提升青年競爭力與創造力。","note":"保障人民受教育權，明定政府應協助青年享有良好的教育學習環境，提升青年的競爭力。"},{"bill":"202110098790000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策。","note":"參酌我國104年發布《青年發展政策綱領》，其推動策略中包含長或青年基礎健康資訊，建構青年心理健康服務網絡；另因應青年心理健康問題嚴重，研究顯示近十年之憂鬱症盛行率增加兩成，112年衛生福利部更推動「年輕族群心理健康支持方案」，為持續辦理相關心理支持性政策，爰訂定第八條。"},{"bill":"202110102250000","text":"政府應致力營造青年之良好數位環境，協助降低數位落差，建立數位平權之社會環境。","note":"為保障青年在數位環境中享有平等的機會與權益，並降低數位落差，建立數位平權之社會，爰為本條之規定。"},{"bill":"202110103250000","text":"政府應致力營造青年之良好數位環境，協助降低數位落差，建立數位平權之社會環境。","note":"為保障青年在數位環境中享有平等的機會與權益，同時縮小數位落差、推動數位平權社會的建立，故制定本條規定。"},{"bill":"202110104620000","text":"政府應支持青年經濟獨立與穩定之經濟生活。","note":"青年為國家穩定發展與變革創新之動力，擁有經濟獨立與安定生活、提高經濟可及性，為青年經濟自由之基本條件，亦為「世界人權宣言」及「經濟社會文化權利國際公約」所揭示之精神，爰訂定本條。"},{"bill":"202110108760000","text":"政府應優化青年之教育環境，協助其多元學習，以提升青年競爭力與創造力。","note":"保障人民受教育權，明定政府應協助青年享有良好的教育學習環境，提升青年的競爭力。"},{"bill":"202110107570000","text":"政府應積極促進青年就業與創業輔導，強化專業培訓，提升就業技能，避免職場霸凌與剝削，營造有利青年之職場環境，並營造具支持性之創業環境。","note":"明定政府應積極促進青年就業與創業，營造有利青年之職場環境。"},{"bill":"202110107400000","text":"政府應提供青年完善之健康照護與心理支持服務，並制定促進其身心健康與生活品質之整體福利政策。","note":"一、青年常面臨來自學業、就業、經濟與人際關係等多重壓力，心理健康議題日益受到重視，政府應積極回應。\n二、應建構友善、可近之醫療與心理支持體系，包括：擴充青年醫療服務可及性，提供預防性健康檢查與醫療補助；強化學校、職場與社區之心理諮商與心理衛生資源；推動情緒教育與壓力管理課程，提升青年自我照顧能力。\n三、同時應整合各項青年福利措施，如交通、育樂、生活補貼與社會安全支持，形塑有利於青年穩定生活與健康成長的社會環境。"},{"bill":"202110109830000","text":"政府應掌握青年健康資訊，制定促進青年身心健康及提高生活品質的政策，並提供安全的運動休閒環境。","note":"參照教育部「青年發展政策綱領」健康力之推動策略為「掌握青年基礎健康資訊，打造健康安全的運動休閒環境，活絡社群正向互動」，明訂政府應掌握青年健康資訊，制定促進青年身心健康及提高生活品質的政策，並提供安全的運動休閒環境。"},{"bill":"202110123900000","text":"政府應採取具體措施，落實保障青年享有之學習及受教育權利，並致力建構多元學習環境，擴展學習場域，協助青年適應世界發展，提升青年韌性、學習力及創造力。","note":"明定應保障青年之學習及受教權，並應使青年具備韌性、學習力及創造力以適應世界發展。"},{"bill":"202110124800000","text":"政府應支持青年經濟獨立與穩定之經濟生活。","note":"青年為國家穩定發展與變革創新之動力，擁有經濟獨立與安定生活、提高經濟可及性，為青年經濟自由之基本條件，亦為聯合國《世界人權宣言》及《經濟、社會及文化權利國際公約》所保障之精神，爰訂定本條。"},{"bill":"202110124830000","text":"政府應掌握青年基礎健康資訊，並制（訂）定促進青年身心健康及全人發展、提高生活品質之政策。","note":"為落實《憲法》與《世界人權宣言》第二十五條保障健康與基本生活水準之精神，並依據《經濟社會文化權利公約》及相關政策綱領，政府應制定具體措施，確保國民健康權利。尤其針對青年，應推動涵蓋健康資訊、運動休閒環境與社群互動等策略，提升其身心健康與生活品質，保障其全面福祉。"},{"bill":"202110126910000","text":"政府應積極促進青年就業與創業輔導，強化專業培訓，提升就業技能，避免職場霸凌與剝削，營造有利青年之職場環境，並營造具支持性之創業環境。","note":"為鼓勵與支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，明定政府應積極促進青年就業與創業，營造有利青年之職場環境。"},{"bill":"202110127050000","text":"政府應採取具體措施，落實保障青年享有之學習及受教育權利，並致力建構多元學習環境，擴展學習場域，協助青年適應世界發展，提升青年韌性、學習力及創造力。","note":"一、世界人權宣言第二十六條明定人人皆有受教育之權利、應廣為設立技術與職業教育、高等教育應平等開放之精神，爰於本條前段明定青年享有之學習及受教育之權利，政府應採取具體措施落實其保障。\n二、鑒於教育應謀求人格及人格尊嚴意識之充分發展，且青年應變世界變化更為多元、迅速，故政府應致力於提供多元學習管道，協助青年生涯規劃，以建構適性發展之學習環境，並拓展其生活網絡；又為因應聯合國永續發展目標，建構韌性社會，亦應使青年具備韌性、學習力及創造力以適應世界發展，爰為本條後段規定。"},{"bill":"202110128060000","text":"政府應採取具體措施，落實保障青年享有之學習及受教育權利，並致力建構多元學習環境，擴展學習場域，協助青年適應世界發展，提升青年韌性、學習力及創造力。","note":"一、世界人權宣言第二十六條明定人人皆有受教育之權利、應廣為設立技術與職業教育、高等教育應平等開放之精神，爰於本條前段明定青年享有之學習及受教育之權利，政府應採取具體措施落實其保障。\n二、鑒於教育應謀求人格及人格尊嚴意識之充分發展，且青年應變世界變化更為多元、迅速，故政府應致力於提供多元學習管道，協助青年生涯規劃，以建構適性發展之學習環境，並拓展其生活網絡；又為因應聯合國永續發展目標，建構韌性社會，亦應使青年具備韌性、學習力及創造力以適應世界發展，爰為本條後段規定。"},{"bill":"202110128180000","text":"政府應採取具體措施，落實保障青年享有之公平學習及受教育權利，並致力建構多元學習環境，擴展學習場域，協助青年適應世界發展，提升青年韌性、學習力及創造力。","note":"一、世界人權宣言第二十六條明定人人皆有受教育之權利，應廣為設立技術與職業教育，高等教育應平等開放之精神，爰於本條前段明定青年學習及受教育之權利，政府應採取具體措施落實其保障。\n二、鑒於教育應謀求人格及人格尊嚴意識之充分發展，且青年應變世界變化更為多元、迅速，故政府應致力於提供多元學習管道，協助青年生涯規劃，以建構適性發展之學習環境，並拓展其生活網絡；又為因應聯合國永續發展目標，建構韌性社會，也應使青年具備韌性、學習力及創造力以適應世界發展，爰為本條後段規定。"},{"bill":"202110128310000","text":"青年有獲得安全、可負擔與尊嚴居住環境之權利。國家應提供住宅協助、租屋支援及生活補助，協助青年達成基本生活安定。","note":"針對青年面臨高房價、高租金與生活壓力等現實問題，建立國家政策義務基礎，賦予青年「居住安全權」與「生活安定權」。條文所稱「安全、可負擔、尊嚴」三構面，分別涵蓋物理安全（建築結構與環境）、經濟可及性（收入與支出比例）、及人格尊重（避免違法租賃、不當驅離等情況）。實質措施方面，包括「青年住宅專案」、「租屋補貼」與「基本生活支持」，皆符合104年《青年發展政策綱領》「協助青年穩定生活」之政策軸線，亦呼應韓國《青年基本法》第十三條關於居住與支援空間政策之規定。"},{"bill":"202110129310000","text":"政府應掌握青年基礎健康資訊，並制（訂）定促進青年身心健康及全人發展、提高生活品質之政策。","note":"一、為落實《憲法》、《世界人權宣言》第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務。\n二、依照《經濟社會文化權利公約》第十二條、《社會福利政策綱領》、《2025衛生福利政策白皮書》，保障國民健康權利。\n三、參照青年發展政策綱領「健康力」之推動策略為「掌握青年基礎健康資訊，打造健康安全的運動休閒環境，活絡社群正向互動」。"},{"bill":"202110132300000","text":"政府應採取具體措施，落實保障青年享有之學習及受教育權利，並致力建構多元學習環境，考量文化、族群、地域差異分配資源，重視學生心理健康並研擬具體措施，擴展學習場域，協助青年適性探索、適應世界發展，提升學習力及創造力。","note":"一、明定保障青年學習及受教育權利於本條。納入社會包容學理，保障弱勢青年，為本法第二條第二項明確揭示，在教育階段之青年，文化、族群、地域方面資源分配殊值重視，基此予以納入。\n二、本條所稱之重視學生心理健康，已揭示於本法第1條立法目的，為整體青年政策目標之一。當中就學生階段之部分，例如學生之身心調適假，為現行重要青年政策，雖目前有「高級中等學校學生身心調適假實施注意事項」及「大專校院身心調適假參考指引」等辦理依據，然而實施以來，各校不准假、實務上不鼓勵，科系不同的教授態度不同等情形，時有所聞。本次制定本法，在法律層次規範中，賦予相關依據，敦促各級學校依循。另外，重視學生心理健康，主要針對在校學生，應屬第二十八條第二項所定，另有對青年之保障，優於本法之規定，而應優先適用，本法制定後，無須依本法第二條第一項所定青年年齡範圍調整，一併敘明。\n三、本條所稱之協助青年適性發展，係基於本法整體立法目標，包含身心靈各層面之完整探索，業已揭示如第一條立法目的；又目前「十二年國民基本教育實施計畫」，納入適性揚才為理念，落實中學生性向探索與生涯輔導，引導多元適性升學或就業，為該計畫為目標。可見，就學階段青年適性探索，確為現行政策目標。綜此，須將適性探索，列為本法保障青年受教育權利之政策指導方針。"},{"bill":"202110143380000","text":"政府應採取具體措施，落實保障青年享有之學習及受教育權利，並致力建構多元學習環境，擴展學習場域，協助青年適應世界發展，提升青年韌性、學習力及創造力。","note":"一、世界人權宣言第二十六條明定人人皆有受教育之權利、應廣為設立技術與職業教育、高等教育應平等開放之精神，爰於本條前段明定青年享有之學習及受教育之權利，政府應採取具體措施落實其保障。\n二、鑒於教育應謀求人格及人格尊嚴意識之充分發展，且青年應變世界變化更為多元、迅速，故政府應致力於提供多元學習管道，協助青年生涯規劃，以建構適性發展之學習環境，並拓展其生活網絡；又為因應聯合國永續發展目標，建構韌性社會，亦應使青年具備韌性、學習力及創造力以適應世界發展，爰為本條後段規定。"},{"bill":"202110155730000","text":"政府應採行具體措施，保障青年享有之學習及受教育權利，並致力建構多元且優質學習環境，確保青年就學權益。\n前項措施應擴展學習場域，協助青年適應全球發展趨勢，以提升其韌性、學習力及創造力。","note":"一、為響應《世界人權宣言》第二十六條所揭示之「人人皆有受教育之權、技術與職業教育應廣為設立、高等教育應予平等開放」之精神，本條文明確規範政府應採行具體措施，以保障青年享有之學習及受教育權利。此係為青年發展奠定堅實基礎，確保其得以透過教育提升自我，進而貢獻社會。\n二、為協助青年適應全球發展趨勢並有效因應未來挑戰，政府應致力建構多元學習環境，並擴展學習場域。此項努力旨在提升青年之韌性、學習力及創造力，使其具備面對快速變遷世界所需之關鍵能力。透過營造良善且多元的教育環境，期能培育出具備創新思維與實踐能力之新世代青年，為國家永續發展注入活水。"},{"bill":"202110166280000","text":"政府應採取具體措施，保障青年受教育之權利，並建構多元學習環境，擴展學習機會，以培育青年之技能、韌性、學習力及創造力。","note":"一、世界人權宣言第二十六條明定人人皆有受教育之權利、應廣為設立技術與職業教育、高等教育應平等開放之精神，爰於本條前段明定青年享有之學習及受教育之權利，政府應採取具體措施落實其保障。\n二、鑒於教育應謀求人格及人格尊嚴意識之充分發展，且青年應變世界變化更為多元、迅速，故政府應致力於提供多元學習管道，協助青年生涯規劃，以建構適性發展之學習環境，並拓展其生活網絡；又為因應聯合國永續發展目標，建構韌性社會，亦應使青年具備韌性、學習力及創造力以適應世界發展，爰為本條後段規定。"},{"bill":"202110169130000","text":"政府應採取具體措施，落實保障青年享有之學習及受教育權利，並致力建構多元學習環境，擴展學習場域，協助青年適應世界發展，提升青年韌性、學習力及創造力。","note":"一、世界人權宣言第二十六條明定人人皆有受教育之權利、應廣為設立技術與職業教育、高等教育應平等開放之精神，爰於本條前段明定青年享有之學習及受教育之權利，政府應採取具體措施落實其保障。\n二、鑒於教育應謀求人格及人格尊嚴意識之充分發展，且青年應變世界變化更為多元、迅速，故政府應致力於提供多元學習管道，協助青年生涯規劃，以建構適性發展之學習環境，並拓展其生活網絡；又為因應聯合國永續發展目標，建構韌性社會，亦應使青年具備韌性、學習力及創造力以適應世界發展，爰為本條後段規定。"},{"bill":"202110175160000","text":"政府應優化青年之教育環境，協助其多元學習，以提升青年競爭力與創造力。\n針對依法申請就學貸款之學生，政府應積極提供工讀職缺或其他經濟機會，協助其清償債務，避免青年陷入畢業即負債之經濟困境。相關補助辦法，由主管機關定之。中央主管機關得制定獎勵辦法，補助地方主管機關協助學貸生。","note":"一、保障人民受教育權，明定政府應協助青年享有良好的教育學習環境，提升青年的競爭力。\n二、根據教育部統計，截至114年3月止，高中職以上學生就學貸款者約67萬人，貸款餘額約為1,334億元，平均每人負擔學貸約為20萬元。其中，已畢業開始還貸者約41萬人，平均每人負擔學貸約為17萬元，顯示目前確實存在學貸生畢業即負債的情況。\n三、學貸制度行之有年、立意良善，然近20萬的負擔，根據勞動部調查，113年初出社會新鮮人平均薪資僅3點7萬元，假使每月以1成收入還債，約需4年才能還清債務。鑒於近年房租、外食費與各項生活成本大幅成長，學貸對青年世代來說，雖可負擔，但愈發沉重。截至114年3月底，六個月以內逾期未繳學貸計有5,918人。\n四、鑒於近年來申請就學貸款者眾，平均每五位大專院校學生就有一人申請，因此為避免學貸生陷入畢業即負債，初入社會就陷入經濟不平等之困境，主管機關應有效提供經濟機會，減輕學生負擔，協助學貸生在求學期間就能部分或全額還清貸款。"}],"changed":true,"final":"政府應採取具體措施，落實保障青年享有之公平學習及受教育權利，並致力建構多元學習環境，擴展學習場域，協助青年適性探索、適應世界發展，提升青年韌性、學習力及創造力。","finalWhy":"一、世界人權宣言第二十六條明定人人皆有受教育之權利、應廣為設立技術與職業教育、高等教育應平等開放之精神，爰於本條前段明定青年享有公平學習及受教育之權利，政府應採取具體措施落實其保障。\n二、鑒於教育應謀求人格及人格尊嚴意識之充分發展，且青年應變世界變化更為多元、迅速，故政府應致力於提供多元學習管道，協助青年生涯規劃、適性探索，以建構適性發展之學習環境，並拓展其生活網絡；又為因應聯合國永續發展目標，建構韌性社會，亦應使青年具備韌性、學習力及創造力以適應世界發展，爰為本條後段規定。","review":{"note":"修正通過","text":"政府應採取具體措施促進青年身心健康，增加心理健康促進、心理諮商之機會。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。"}},{"no":"第九條","current":null,"versions":[{"bill":"202110017600000","text":"青年搭乘國內公營水、陸、空大眾運輸工具、參觀文教設施，應予以優待。\n前項文教設施為中央機關（構）、行政法人經營者，平日應予免費。\n第一項優待辦法，由中央目的事業主管機關定之。","note":"社會新鮮人的薪水往往不高，扣除學貸、租屋、交通費、伙食費，幾乎所剩無幾。為改善青年生活，減輕青年經濟負擔，青年搭乘國內公營水、陸、空大眾運輸工具、參觀文教設施，應予以優待。"},{"bill":"202110040040000","text":"政府應保障青年參與各項文化活動，支持青年開展具創造性之文化生活。","note":"一、落實《世界人權宣言》第二十七條，《經濟社會文化權利公約》第十五條明定人人有權自由參加社會之文化生活，欣賞藝術、並共享科學進步及其產生之福利。\n二、落實我國《文化基本法》保障人民參與文化之權利，擴大青年群體之文化參與、促進文化多樣發展。"},{"bill":"201110120370000","text":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","note":"一、經濟社會文化權利國際公約第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利；第七條亦明定人人有權享受公平與良好之工作條件。\n二、青年正值職涯發展之重要階段，中央及地方政府持續執行相關計畫，提升青年就業能力，為進一步強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。"},{"bill":"202110057110000","text":"國家應積極支持青年經濟獨立，對其穩定之經濟生活給予保障及必要之協助。","note":"經濟獨立是許多青年立足社會、自我實現之前提，且與生涯發展、社會生存具密切關聯。因此政府應積極支持青年經濟獨立，制定保障青年有穩定之經濟生活。爰訂定本條。"},{"bill":"202110059880000","text":"政府應積極支持青年經濟獨立，提供青年援助，對其穩定之經濟生活給予保障及必要之協助。","note":"經濟獨立是許多青年立足社會、自我實現之前提，且與生涯發展、社會生存具密切關聯。因此政府應積極支持青年經濟獨立、提供青年援助，並保障青年有穩定之經濟生活。爰訂定本條。"},{"bill":"202110061560000","text":"政府應保障青年參與各項文化活動，支持青年開展具創造性之文化生活。","note":"「世界人權宣言」第二十七條及「經濟社會文化權利國際公約」第十五條明定人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其產生之福利，文化權亦涉及青年人格發展及創造力，爰訂定本條，揭示政府應保障青年參與各項文化活動。"},{"bill":"202110061410000","text":"政府應積極支持青年經濟獨立，對其穩定之經濟生活提供必要之協助。","note":"依「世界人權宣言」及「經濟社會文化權利國際公約」之精神與揭示之原則，政府應支持青年經濟獨立，提供必要之協助，以滿足青年為求經濟自由及生活穩定的基本條件。"},{"bill":"202110068970000","text":"政府應提供青年健康安全的運動休閒環境。","note":"參照青年發展政策綱領「健康力」之推動策略為「掌握青年基礎健康資訊，打造健康安全的運動休閒環境，活絡社群正向互動」。"},{"bill":"202110070660000","text":"政府應積極支持青年經濟獨立，提供青年必要之援助，並保障其穩定之經濟生活。","note":"隨著物價持續上升，維持經濟獨立逐漸成為青年之負擔，經濟獨立係為青年發展階段關鍵因素之一，與身心健康、生涯發展及自我實現有密切關聯。政府支持青年經濟獨立，對於青年權利保障至關重要，是以政府應支持青年經濟獨立並保障其穩定之經濟生活。"},{"bill":"202110071010000","text":"政府應鼓勵青年從事國際交流、參與國際合作。","note":"為促進我國之國際交流與外交，提升青年人才因應全球事務之能力，爰參考韓國《青年基本法》第二十四條明定政府應鼓勵青年投入國際事務。"},{"bill":"202110072290000","text":"政府應致力促進青年就業及創業，提高青年就業品質，改善就業及創業環境，強化青年職涯發展。","note":"一、青年就業及創業之促進。\n二、「經濟社會文化權利國際公約」第四條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利，第七條亦明定人人有權享受公平與良好之工作條件，爰訂定本條，揭示政府應促進青年就業及創業、提高青年就業品質、改善就業及創業環境，並強化青年職涯發展。"},{"bill":"202110072330000","text":"政府應保障青年參與文化活動，支持青年開展具創造性之文化生活。","note":"政府應保障青年文化權，支持青年參加文化生活，欣賞藝術並共享科學進步及其產生之福利。"},{"bill":"202110072870000","text":"政府應積極支持青年經濟獨立，並對其穩定之經濟生活給予保障及協助。","note":"明定政府應保障青年經濟獨立與穩定之經濟生活的權利。"},{"bill":"202110075700000","text":"政府應致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年之就業及創業環境。","note":"一、《憲法》第十五條明定人民之工作權應予保障。\n二、聯合國《世界青年行動綱領》指出，政府和教育體系應協助青年職業或專業的培訓，並建立或強化符合就業條件的培訓機制。\n三、綜上，除就業外，亦應營造有利青年之創業環境。"},{"bill":"202110076040000","text":"政府應鼓勵青年從事國際交流、參與國際合作。","note":"為促進我國之國際交流與外交，提升青年人才因應全球事務之能力，爰參考韓國《青年基本法》第二十四條明定政府應鼓勵青年投入國際事務。"},{"bill":"202110078370000","text":"政府應致力營造青年之良好數位環境，協助降低數位落差，建立數位平權之社會環境。","note":"為保障青年在數位環境中享有平等的機會與權益，並降低數位落差，建立數位平權之社會，爰為本條之規定。"},{"bill":"202110079860000","text":"政府應積極支持青年經濟獨立，提供青年必要之援助，並保障其穩定之經濟生活。","note":"依「世界人權宣言」及「經濟社會文化權利國際公約」之精神與揭示之原則，政府應支持青年經濟獨立，提供必要之協助，改善青年之經濟負擔，以滿足青年為求經濟自由及生活穩定之基本條件。"},{"bill":"202110080450000","text":"政府應致力營造青年之良好數位環境，協助降低數位落差，建立數位平權之社會環境。","note":"為保障青年在數位環境中享有平等的機會與權益，並降低數位落差，建立數位平權之社會，爰為本條之規定。"},{"bill":"202110085510000","text":"政府應致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年之就業及創業環境。","note":"《憲法》第十五條明定人民之工作權應予保障。"},{"bill":"202110100300000","text":"政府應掌握青年基礎健康資訊，並制（訂）定促進青年身心健康及全人發展、提高生活品質之政策。","note":"一、為落實《憲法》、《世界人權宣言》第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務。\n二、依照《經濟社會文化權利公約》第十二條、《社會福利政策綱領》、《2025衛生福利政策白皮書》，保障國民健康權利。\n三、參照青年發展政策綱領「健康力」之推動策略為「掌握青年基礎健康資訊，打造健康安全的運動休閒環境，活絡社群正向互動」。"},{"bill":"202110098760000","text":"政府應促進青年就業與創業輔導，強化專業培訓，提升就業技能，避免職場霸凌與剝削，營造有利青年之職場環境。","note":"明定政府應積極促進青年就業與創業，營造有利青年之職場環境。"},{"bill":"202110098790000","text":"政府應積極協助青年經濟獨立，並提供青年援助。","note":"經濟獨立可為兒童蛻變為青年之重要指標，美國研究顯示青年經濟獨立時間越趨延後，且獨立比例佔比不高，僅33.4%青年完全獨立於父母。為協助青年經濟獨立，更擴大獨立於社會上生存，爰訂定第九條。"},{"bill":"202110102250000","text":"政府應致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年之就業及創業環境。","note":"一、《憲法》第十五條明定人民之工作權應予保障。\n二、聯合國《世界青年行動綱領》指出，政府和教育體系應協助青年職業或專業的培訓，並建立或強化符合就業條件的培訓機制。\n三、綜上，除就業外，亦應營造有利青年之創業環境。"},{"bill":"202110103250000","text":"政府應致力促進青年就業及創業，提高青年就業及創業品質，強化青年人才專業培育，營造有利青年之就業及創業環境。","note":"一、《憲法》第十五條規定，人民的工作權必須受到保障。\n二、依據聯合國《世界青年行動綱領》，政府與教育系統應協助青年獲得職業或專業培訓，並建立或強化符合就業需求的培訓機制。\n三、綜上，除了確保就業之外，還營造有利於青年創業的環境。"},{"bill":"202110104620000","text":"政府應保障青年參與各項文化活動，支持青年開展具創造性之文化生活。","note":"「世界人權宣言」第二十七條及「經濟社會文化權利國際公約」第十五條明定人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其產生之福利，文化權亦涉及青年人格發展及創造力，爰訂定本條，揭示政府應保障青年參與各項文化活動。"},{"bill":"202110108760000","text":"政府應促進青年就業與創業輔導，強化專業培訓，提升就業技能，避免職場霸凌與剝削，營造有利青年之職場環境。","note":"明定政府應積極促進青年就業與創業，營造有利青年之職場環境。"},{"bill":"202110107570000","text":"政府應制定青年居住政策，協助青年成家入住社會住宅之機會，減輕青年租屋、購屋之負擔，建構青年良好之居住品質，並積極保障青年適足居住權。","note":"明定政府應制定青年居住政策，減輕租、購屋之負擔，以利青年居住正義之實現。"},{"bill":"202110107400000","text":"政府應保障青年參與文化活動之權利，積極支持其投入創意、藝術與文化產業，並促進其國際交流與多元合作機會。","note":"一、文化創意是青年展現自我、連結社會與推動創新的重要平台，政府應提供友善發展環境，協助青年培養文化素養與實踐能力。\n二、應從下列面向推動：提供青年參與藝術、設計、影視、音樂等文化領域之資源與補助；建構青年文化空間、展演平台與創作支持機制，鼓勵多元表達與創作實踐；透過獎助計畫、交流機會與國際合作平台，擴大青年參與國際事務，培養全球視野與跨文化理解力。\n三、透過文化參與與國際接軌，青年可強化自我認同與創造力，並促進我國文化多元發展與國際文化影響力。"},{"bill":"202110109830000","text":"政府應提供必要的經濟支持和保障，協助青年穩定生活，並積極支持青年經濟獨立。","note":"對於甫入職場的青年常面臨就業競爭、工資不穩定及生活成本高漲等挑戰，政府應扮演積極角色，提供相應支持，以減輕其經濟負擔，確保其基礎生活需求和經濟穩定。明訂政府應提供必要的經濟支持和保障，協助青年穩定生活，例如推動就業支持計畫、技能培訓、租屋補貼等措施，協助青年達成經濟獨立等，並積極支持青年經濟獨立。"},{"bill":"202110123900000","text":"政府應訂定政策致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","note":"為強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。"},{"bill":"202110124800000","text":"政府應保障青年參與各項文化活動，支持青年開展具創造性之文化生活。","note":"政府應保障青年參與各項文化活動，如聯合國《世界人權宣言》第二十七條及《經濟、社會及文化權利國際公約》第十五條亦明定人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其產生之福利，文化權亦涉及青年人格發展及創造力，因此訂定本條，"},{"bill":"202110124830000","text":"政府應提供青年健康安全的運動休閒環境。","note":"應透過提供健康資訊、營造安全運動休閒空間及促進正向社群互動，全面提升青年健康力與生活品質。"},{"bill":"202110126910000","text":"政府應訂定居住與家庭政策，保障青年居住權益及友善育兒環境、強化家庭照顧及生育教養支持系統。\n青年育有子女者，政府應積極採取提供獎勵、補貼、貸款協助等措施，協助其獲得宜居之家庭生活環境。","note":"明定政府應制定青年居住與家庭政策，以利青年居住正義之實現，保障青年居住權益，並建構友善育兒環境。"},{"bill":"202110127050000","text":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","note":"一、經濟社會文化權利國際公約第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利；第七條亦明定人人有權享受公平與良好之工作條件。\n二、青年正值職涯發展之重要階段，中央及地方政府持續執行相關計畫，提升青年就業能力，為進一步強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。"},{"bill":"202110128060000","text":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","note":"一、經濟社會文化權利國際公約第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利；第七條亦明定人人有權享受公平與良好之工作條件。\n二、青年正值職涯發展之重要階段，中央及地方政府持續執行相關計畫，提升青年就業能力，為進一步強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。"},{"bill":"202110128180000","text":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","note":"一、經濟社會文化權利國際公約第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利；公約第七條亦明定人人有權享受公平與良好之工作條件。\n二、青年正值職涯發展之重要時刻，中央及地方政府持續執行相關計畫，提升青年就業能力，為進一步強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。"},{"bill":"202110128310000","text":"青年有平等參與文化、體育與休閒活動之權利。國家應提供必要資源與場域，鼓勵青年藝文參與、創作展能及身心健康活動。","note":"確認青年享有文化與休閒活動之參與權，將青年生活面向納入法律保障範圍。參與文化與體育活動，對於青年身心發展、創造力培養與社會連結具關鍵意義，亦是衡量社會公平與生活品質之重要指標。條文不僅肯認參與權，更要求國家積極提供「資源」與「場域」，具體落實文化近用與多元性保障，並強調「藝文參與」、「創作展能」、「身心健康活動」等方向，以涵蓋藝術創作、社區營造、體育活動與療癒性空間之需求。該規範對應《青年發展政策綱領》「豐富青年生活與文化」，亦可見於芬蘭《青年法》明示國家應保障年輕人休閒與文化表達權利。"},{"bill":"202110129310000","text":"政府應提供青年健康安全的運動休閒環境。","note":"參照青年發展政策綱領「健康力」之推動策略為「掌握青年基礎健康資訊，打造健康安全的運動休閒環境，活絡社群正向互動」。"},{"bill":"202110132300000","text":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供各領域職場探索及適性職業訓練，以具體措施鼓勵企業聘用青年，提升薪資、工時、勞工身心健康等勞動條件與權益，改善就業環境，營造性別平等、升遷合理、工作及生活兼顧之友善職場。\n勞動檢查機構依勞動檢查法第六條第二項，擬定勞動監督檢查計畫時，應有依本法第六條第二項遴聘之青年代表參與。","note":"一、明定政府應訂定青年就業及職涯發展之政策於第一項。\n二、第一項所稱之提供各領域職場探索，係本法整體立法目標，包含身心靈各層面之完整探索，業已揭示如第1條立法目的；又為銜接前條所定，教育階段之適性探索，爰予納入。又查目前勞動部之「投資青年就業方案第二期」，有農業部鼓勵高中生進行農業職涯探索、大專校院建立職涯輔導窗口，本法制定後，各級政府應從青年個人完整之職場探索角度出發，辦理更為全面之職場探索。\n三、第一項所稱以具體措施鼓勵企業聘用青年，以過去立法舉例，113年8月7日總統公布《中小企業發展條例》修正條文，增僱24歲以下或65歲以上員工，以租稅優惠鼓勵企業。本次立法施行後，政府得參照類似之鼓勵措施，制定具體政策，鼓勵企業聘用青年。另鼓勵企業僱用青年之措施，以本法之青年為對象，並不限任職於何種型態之組織（例如不限於前述舉例之中小企業），一併敘明。\n四、健全青年公共參與機制，業已定於本法第六條。為使勞動檢查進行時，能有青年主體參與，針對青年階段獨特之勞動權益受損或就業類別，能受到妥善勞動檢查，特明定擬定勞動監督檢查計畫時，應有本法所定青年代表參與。爰定於第二項。"},{"bill":"202110143380000","text":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","note":"一、經濟社會文化權利國際公約第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利；第七條亦明定人人有權享受公平與良好之工作條件。\n二、青年正值職涯發展之重要階段，中央及地方政府持續執行相關計畫，提升青年就業能力，為進一步強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。"},{"bill":"202110155730000","text":"政府應訂定政策，致力促進青年就業，並兼顧職業倫理之培養與職涯發展、勞動及技術法規之認識。\n前項政策應包含培養工作核心素養、提供適性職業訓練、提升勞動條件、改善就業環境，並營造工作與生活兼顧之友善職場。","note":"一、本條文之訂定，旨在落實《經濟社會文化權利國際公約》第六條及第七條之精神。該公約明定人人享有工作權利，包含憑個人自由選擇或接受工作謀生之機會，以及享有公平與良好之工作條件。青年正處於職涯發展之關鍵時期，政府有責透過政策引導，確保其得以享有符合國際標準之勞動權益。\n二、為進一步強化並優化青年就業相關事項，本條文明確規範政府應訂定政策，致力於促進青年就業與職涯發展。此政策應涵蓋多面向措施，包括培養工作核心素養、提供適性職業訓練以提升專業技能、提升勞動條件以保障基本權益，以及改善就業環境與營造工作與生活兼顧之友善職場。透過此等全面性策略，期能有效支持青年順利投入職場，並確保其職涯發展之穩定與永續。"},{"bill":"202110166280000","text":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","note":"一、經濟社會文化權利國際公約第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利；第七條亦明定人人有權享受公平與良好之工作條件。\n二、青年正值職涯發展之重要階段，中央及地方政府持續執行相關計畫，提升青年就業能力，為進一步強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。"},{"bill":"202110169130000","text":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","note":"一、經濟社會文化權利國際公約第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利；第七條亦明定人人有權享受公平與良好之工作條件。\n二、青年正值職涯發展之重要階段，中央及地方政府持續執行相關計畫，提升青年就業能力，為進一步強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。"},{"bill":"202110175160000","text":"政府應促進青年就業與創業輔導，強化專業培訓，提升就業技能，避免職場霸凌與剝削，營造有利青年之職場環境。","note":"明定政府應積極促進青年就業與創業，營造有利青年之職場環境。"}],"changed":true,"final":"政府應訂定政策，致力促進青年就業及職涯發展，培養工作核心素養，提供適性職業訓練，提升勞動條件，改善就業環境，營造工作及生活兼顧之友善職場。","finalWhy":"一、經濟社會文化權利國際公約第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利；第七條亦明定人人有權享受公平與良好之工作條件。\n二、青年正值職涯發展之重要階段，中央及地方政府持續執行相關計畫，提升青年就業能力，為進一步強化及優化青年就業事項，支持青年就業並建構友善職場，爰為本條規定。","review":{"note":"修正通過","text":"政府應訂定青年經濟支持政策，協助青年達成經濟獨立，並對其穩定之經濟生活給予保障。\n政府應提供必要之照顧福祉及支援服務，以減輕有扶養義務負擔青年之身心壓力。"}},{"no":"第十條","current":null,"versions":[{"bill":"202110017600000","text":"為減輕青年居住負擔、支持青年專心就業與就學，政府應協助青年獲得適居之住宅，並規劃青年銀髮公共社會住宅政策，引導青年世代關注銀髮議題，解決跨世代居住問題。","note":"明定政府應解決青年居住問題。"},{"bill":"202110040040000","text":"政府應鼓勵青年參與國際合作及交流，強化青年國際事務知能。","note":"促進青年參與國際事務及交流，鼓勵開拓視野、培養全球化之技能，促進國際合作。"},{"bill":"201110120370000","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。","note":"青年具創新精神，富有熱忱及創意，充滿創新及創業能量，鑒於創新、創業更有助於提升國家競爭軟實力，為鼓勵與支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。"},{"bill":"202110057110000","text":"國家應訂定培養青年金融素養政策，以確保我國青年具備足夠金融相關知識以及良好自身財務管理能力。","note":"台灣金融研訓院「2022台灣金融生活調查」，78.1%民眾金融素質屬性低或極低，其中20至29歲青年是最無法抵抗金融風險的群體，容易誤觸金融陷阱、金融詐騙。為避免青年朋友在人生起點就因誤觸金融陷阱而變成終點，提升青年金融素養勢在必行。爰訂定本條。"},{"bill":"202110059880000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年開展具創造性之文化生活。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於受歧視的權利。","note":"一、依聯合國《世界人權宣言》第二十七條，人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其利益。次按《文化基本法》第五條，人民享有參與、欣賞及共享文化之近用權利。青年參與文化事務應積極保障，爰訂定本條第一項。\n二、按《文化基本法》第四條所揭示，人民享有之文化權利，不因族群、語言、性別、性傾向、年齡、地域、宗教信仰、身心狀況、社會經濟地位及其他條件，而受歧視或不合理之差別待遇。爰訂定本條第二項。"},{"bill":"202110061560000","text":"政府應鼓勵青年參與國際合作及交流，強化青年國際事務知能。","note":"政府應促進青年參與國際事務及交流，鼓勵開拓國際視野並落實在地行動，強化青年國際事務知能，培養青年全球化之技能，促進國際合作，爰訂定本條。"},{"bill":"202110061410000","text":"政府應保障青年參與文化活動，支持青年開展具創造性之生活。","note":"「世界人權宣言」第二十七條及「經濟社會文化權利國際公約」第十五條規範，人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其利益。爰此，政府應保障青年文化權，支持青年參與文化活動，開展具創造性的生活。"},{"bill":"202110068970000","text":"政府應積極支持青年經濟獨立，並對其穩定之經濟生活給予保障及協助。","note":"現代社會基本生活成本提高，使經濟獨立與穩定的門檻上升。經濟獨立與穩定為青年發展階段關鍵任務之一，與個人發展、身心健康、婚育教養有密切關聯。支持青年經濟獨立，對於青年權利保障至關重要。故，政府應支持青年經濟獨立與穩定之經濟生活。"},{"bill":"202110070660000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與文化事務，支持青年開展具創造性之文化生活。","note":"《世界人權宣言》第二十七條明定人人有權利自由參加社會之文化生活、享受藝術，並共享科學進步。文化權亦涉及青年人格發展及創造力，有助於青年生涯發展。"},{"bill":"202110071010000","text":"政府應以合宜之居住政策，提供青年可負擔且適足生活之居住環境，以保障青年之居住權。","note":"參考韓國《青年基本法》第二十條，規定政府應保障青年之居住。"},{"bill":"202110072290000","text":"政府應支持青年經濟獨立與穩定之經濟生活。","note":"一、青年獨立與穩定經濟生活之支持。\n二、青年為國家穩定發展與變革創新之動力，擁有經濟獨立與安定生活、提高經濟可及性，為青年經濟自由之基本條件，亦為「世界人權宣言」及「經濟社會文化權利國際公約」所揭示之精神，爰訂定本條。"},{"bill":"202110072330000","text":"政府應鼓勵青年參與國際合作及交流，強化青年國際事務知能。","note":"政府應強化青年國際事務知能，培養青年全球化之技能，促進國際合作。"},{"bill":"202110072870000","text":"政府應保障青年文化權利，擴大青年文化參與，保障青年族群之自我認同，並建立友善平權之文化環境，鼓勵青年積極參與文化事務，支持青年開展具創造性之多元文化生活。","note":"落實《世界人權宣言》、《經濟社會文化權利公約》及《文化基本法》，明定青年有權自由參加社會之文化生活，保障青年參與文化之權利。"},{"bill":"202110075700000","text":"政府應訂定青年居住政策，積極保障青年適足居住權，提供青年良好之居住品質。","note":"一、《憲法》第十條規定，人民有居住及遷徙之自由。《經濟社會文化權利國際公約》第十一條亦指出，人人有權享受所需之適當生活，其中亦包括有權享受適當之住房。\n二、然近年居住成本日漸攀升，與年輕世代之所得差異甚遠，青年之居住正義恐淪為口號。爰訂定本條，明定政府應訂定青年居住政策，保障青年適足居住權，以利青年居住正義之實現。"},{"bill":"202110076040000","text":"政府應以合宜之居住政策，提供青年可負擔且適足生活之居住環境，以保障青年之居住權。","note":"參考韓國《青年基本法》第二十條，規定政府應保障青年之居住。"},{"bill":"202110078370000","text":"政府應提供青年之就業輔導、職業訓練、就業準備等，並應積極營造良好之就業環境。","note":"一、《憲法》第十五條明定人民之工作權應予保障。\n二、聯合國《世界青年行動綱領》指出，政府和教育體系應協助青年職業或專業的培訓，並建立或強化符合就業條件的培訓機制。\n三、綜上，除就業外，亦應營造有利青年之創業環境。"},{"bill":"202110079860000","text":"政府應保障青年參與文化活動，鼓勵青年積極參與文化事務，支持青年開展具創造性之生活。","note":"「世界人權宣言」第二十七條及「經濟社會文化權利國際公約」第十五條規範，人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步。另文化權之保障對於青年人格發展完善及創造力亦具有極大影響，有助於其生涯發展。"},{"bill":"202110080450000","text":"政府應提供青年之就業輔導、職業訓練、就業準備等，並應積極營造良好之就業環境。","note":"一、《憲法》第十五條明定人民之工作權應予保障。\n二、聯合國《世界青年行動綱領》指出，政府和教育體系應協助青年職業或專業的培訓，並建立或強化符合就業條件的培訓機制。\n三、綜上，除就業外，亦應營造有利青年之創業環境。"},{"bill":"202110085510000","text":"政府應訂定青年居住政策，積極保障青年居住權利與品質，維護青年居住正義。","note":"《憲法》第十條規定，人民有居住及遷徙之自由。《經濟社會文化權利國際公約》第十一條亦指出，人人有權享受所需之適當生活，其中亦包括有權享受適當之住房。"},{"bill":"202110100300000","text":"政府應積極支持青年經濟獨立，提供青年必要之援助，並保障其穩定之經濟生活。","note":"依「世界人權宣言」及「經濟社會文化權利國際公約」之精神與揭示之原則，政府應支持青年經濟獨立，提供必要之協助，以滿足青年為求經濟自由及生活穩定的基本條件。"},{"bill":"202110098760000","text":"政府應制定青年居住政策，協助青年成家入住社會住宅之機會，減輕青年租屋、購屋之負擔，建構青年良好之居住品質。","note":"明定政府應制定青年居住政策，減輕租、購屋之負擔。"},{"bill":"202110098790000","text":"政府應保障青年參與社會及文化活動，支持青年發展具創造性之文化生活，並致力營造文化多元及平等之環境。","note":"參酌我國104年發布《青年發展政策綱領》，其推動策略中包含拓展青年理解多元文化，鼓勵各族群發展其文化，促進文化融合；同時參酌《兒童權利公約》之文化休閒權，使其亦有青年之適用，爰訂定第十條。"},{"bill":"202110102250000","text":"政府應訂定青年居住政策，積極保障青年適足居住權，提供青年良好之居住品質。","note":"一、《憲法》第十條規定，人民有居住及遷徙之自由。《經濟社會文化權利國際公約》第十一條亦指出，人人有權享受所需之適當生活，其中亦包括有權享受適當之住房。\n二、然近年居住成本日漸攀升，與年輕世代之所得差異甚遠，青年之居住正義恐淪為口號。爰訂定本條，明定政府應訂定青年居住政策，保障青年適足居住權，以利青年居住正義之實現。"},{"bill":"202110103250000","text":"政府應訂定青年居住政策，積極保障青年適足居住權，提供青年良好之居住品質。","note":"一、《憲法》第十條規定，人民有居住及遷徙之自由。《經濟社會文化權利國際公約》第十一條亦指出，人人有權享受所需之適當生活，其中亦包括有權享受適當之住房。\n二、現行青年購屋貸款雖提供一定程度的利息補貼與貸款優惠，惟房價持續飆漲，且現有的新青安之貸款優惠截至2026年，政府應研議將現行新青安貸款方案研議。房市投資炒作、所得成長停滯等因素，使青年購屋機會受限，影響居住權之實現。"},{"bill":"202110104620000","text":"政府應鼓勵青年參與國際合作及交流，強化青年國際事務知能。","note":"政府應促進青年參與國際事務及交流，鼓勵開拓國際視野並落實在地行動，強化青年國際事務知能，培養青年全球化之技能，促進國際合作，爰訂定本條。"},{"bill":"202110108760000","text":"政府應制定青年居住政策，協助青年成家入住社會住宅之機會，減輕青年租屋、購屋之負擔，建構青年良好之居住品質。","note":"明定政府應制定青年居住政策，減輕租、購屋之負擔，以利青年居住正義之實現。"},{"bill":"202110107570000","text":"政府應促進青年身心健康，支持青年經濟獨立，訂定維持生活品質之福利政策，對其穩定之經濟生活給予必要之協助。\n政府應採取具體措施促進青年身心健康、預防毒品及藥物濫用，增加心理諮商及休閒之機會。","note":"明定政府應訂定促進青年身心健康、協助青年改善經濟及提高生活品質之政策。"},{"bill":"202110107400000","text":"政府應積極培育青年參與公共事務之能力，並保障其在政策與社會議題中發表意見與參與決策之公平與實質權利。","note":"一、青年作為社會未來的主體，應有充分機會參與民主治理，表達其觀點並參與公共政策的形成與執行。\n二、政府應推動以下措施，強化青年公共參與：導入青年公民教育與民主素養課程，提升其政治參與意識與能力；提供參與地方治理、校園民主、社會運動等多元參與管道；落實制度設計，使青年能於議會、政府機關、公共委員會等決策場合中具有代表性席次與實質發言權。\n三、本條強調參與權應具備「公平性」、「可近性」與「實效性」，避免流於形式化，真正實現青年在社會治理中的主體地位。"},{"bill":"202110109830000","text":"政府應保障青年參與各項文化活動，並支持青年發展具有創造性的文化生活。","note":"參照教育部「青年發展政策綱領」全球力之推動策略為「拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力」。國際交流成本並非所有青年皆可負擔，透過政府提供資源，可增加青年國際交流可近性。明訂政府應保障青年參與各項文化活動，並支持青年發展具有創造性的文化生活。"},{"bill":"202110123900000","text":"政府應訂定政策致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。","note":"為鼓勵及支持青年創新及創業，政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。"},{"bill":"202110124800000","text":"政府應鼓勵青年參與國際合作及交流，強化青年國際事務知能。","note":"為培養青年全球化之技能，促進國際合作，政府應促進青年參與國際事務及交流，鼓勵開拓國際視野並落實在地行動，強化青年國際事務知能。"},{"bill":"202110124830000","text":"政府應積極支持青年經濟獨立，並對其穩定之經濟生活給予保障及協助。\n年齡未滿二十六歲之青年，其全年個人綜合所得總額在新臺幣八十萬元以下者，免徵個人綜合所得稅。","note":"青年是國家發展與創新的關鍵力量，而經濟獨立與生活穩定為其實現自我發展的重要基礎，亦體現《世界人權宣言》與《經濟社會文化權利國際公約》對基本生活權利的保障精神。隨著現代生活成本上升，青年面臨更高的經濟壓力，影響其個人發展、健康及婚育等重要人生階段。為協助青年穩定經濟生活，提升其發展機會與生活品質，政府應提供實質支持。基於此精神，針對未滿二十六歲且全年綜合所得未達八十萬元之青年，免徵個人綜合所得稅，以減輕其經濟負擔，協助其邁向經濟自主。"},{"bill":"202110126910000","text":"政府應採取具體措施促進青年身心健康、預防物質濫用，增加心理健康促進、心理諮商之機會。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、為落實經濟社會文化權利公約第十二條有關人人有權享受可能達到之最高標準之身體與精神健康之規定，並呼應世界衛生組織（WHO）「心理健康是普世人權」之理念，於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注預防物質濫用等重要議題。\n二、又為因應社會近年青年議題，強化政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110127050000","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。","note":"青年具創新精神，富有熱忱及創意，充滿創新及創業能量，鑒於創新、創業更有助於提升國家競爭軟實力，為鼓勵與支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。"},{"bill":"202110128060000","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。","note":"青年具創新精神，富有熱忱及創意，充滿創新及創業能量，鑒於創新、創業更有助於提升國家競爭軟實力，為鼓勵與支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。"},{"bill":"202110128180000","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。","note":"青年具創新精神，富有熱忱及創意，充滿創新及創業能量，鑒於創新、創業更有助於提升國家競爭軟實力，為鼓勵及支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。"},{"bill":"202110128310000","text":"青年享有數位平權與科技發展機會。國家應推動數位教育、資訊近用、數位素養與網路安全保障，以縮減數位落差並保護青年網路權益。","note":"回應當代青年在數位社會中之核心地位，首次在我國立法中明文化「數位平權」與「科技發展機會」為青年基本權益。條文所列舉四大政策支柱－－數位教育、資訊近用、數位素養與網路安全保障－－涵蓋數位參與的基礎權能與風險防制，完整建構國家對數位環境中青年的支持義務。特別是網路安全部分，對應現代社會中青少年遭受網路霸凌、性剝削與假訊息干擾的普遍風險。此條呼應《青年發展政策綱領》「提升青年科技與數位素養」，並與歐盟、韓國推動青年數位參與與網路人權之法政策一致。"},{"bill":"202110129310000","text":"政府應積極支持青年經濟獨立，並對其穩定之經濟生活給予保障及協助。","note":"現代社會基本生活成本提高，使經濟獨立與穩定的門檻上升。經濟獨立與穩定為青年發展階段關鍵任務之一，與個人發展、身心健康、婚育教養有密切關聯。支持青年經濟獨立，對於青年權利保障至關重要。故，政府應支持青年經濟獨立與穩定之經濟生活。"},{"bill":"202110132300000","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，以建立創業投資機制、青年創業貸款、稅賦優惠，或其他具體措施，協助青年創業。","note":"一、明定青年創新創業政策於本條。\n二、本條所稱創業投資機制，舉例而言，現行有「行政院國家發展基金創業天使投資方案」，以行政規則之層次規範。本次立法，在法律層次規範中，賦予相關依據。\n三、本條所稱青年創業貸款，舉例而言，目前經濟部以「青年創業及啟動金貸款要點」，為現行政府重要之青年政策之一，適用對象年齡範圍為18歲以上45歲以下之人，係依據中小企業發展條例第十六條，所辦理之專案性融資。該要點係由經濟部依職權制定，而非法律規定有義務辦理該專案貸款。本次立法，在法律層次規範中，賦予相關依據。另依據青創貸款之性質，年齡範圍仍宜承襲該要點規定，仍以18歲以上45歲以下為宜，應屬第二十八條第二項所定，另有對青年之保障，優於本法之規定，而應優先適用，本法制定後，無須依本法第二條第一項所定青年年齡範圍調整，一併敘明。"},{"bill":"202110143380000","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。","note":"青年具創新精神，富有熱忱及創意，充滿創新及創業能量，鑒於創新、創業更有助於提升國家競爭軟實力，為鼓勵與支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。"},{"bill":"202110155730000","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，促進創業精神，創造經濟發展。\n前項環境應包含提供多元創業資源及構築優質中小企業創業生態系。","note":"一、鑒於創新及創業乃提升國家整體競爭實力之關鍵動能，為鼓勵並支持青年投入此領域，政府有責訂定明確政策。本條文之訂定，旨在確立政府應積極推動青年創新創業，以期透過新創活水，為國家經濟發展注入強勁動能。\n二、為有效促進青年創新創業，政府除應訂定相關政策外，更須營造具支持性之創業環境。此環境應涵蓋提供多元創業資源，例如資金、技術輔導、場域支持等，並建立完善之創業生態系，包含育成、加速、鏈結產業與國際等機制。透過全面性的資源整合與生態系建構，旨在強化青年創新創業能力，協助其克服創業初期挑戰，進而提升成功機率，創造更多就業機會與產業價值。"},{"bill":"202110166280000","text":"政府應訂定政策，促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立有利青年之創業生態系。","note":"青年具創新精神，富有熱忱及創意，充滿創新及創業能量，鑒於創新、創業更有助於提升國家競爭軟實力，為鼓勵與支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。"},{"bill":"202110169130000","text":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。","note":"青年具創新精神，富有熱忱及創意，充滿創新及創業能量，鑒於創新、創業更有助於提升國家競爭軟實力，為鼓勵與支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。"},{"bill":"202110175160000","text":"政府應制定青年居住政策，協助青年成家入住社會住宅之機會，減輕青年租屋、購屋之負擔，建構青年良好之居住品質。","note":"明定政府應制定青年居住政策，減輕租、購屋之負擔。"}],"changed":true,"final":"政府應訂定政策，致力促進青年創新及創業，營造具支持性之創業環境，提供創業資源，建立創業生態系。","finalWhy":"青年具創新精神，富有熱忱及創意，充滿創新及創業能量，鑒於創新、創業更有助於提升國家競爭軟實力，為鼓勵與支持青年創新及創業，中央及地方政府應持續訂定相關政策，提升青年創新及創業能力，強化青年創業資源及環境，並建立創業生態系，爰為本條規定。","review":null},{"no":"第十一條","current":null,"versions":[{"bill":"202110017600000","text":"政府應針對青年提供適性之職業訓練，積極輔導青年取得專門職業資格及技術人員證照，健全青年就業服務網絡。\n青年參加前項考試之報名費、學科測試費、術科測試費、報名資格審查費及證照費，應予以減免。","note":"為減輕青年經濟負擔，鼓勵青年參加技術士技能檢定，協助取得技術士證提升其專業技能及就業能力，改善其未來生活，相關考試費用應予減免。"},{"bill":"202110040040000","text":"政府應積極培育青年參與公共事務，推動青年賦權，確保青年享有公平參與體制之權利。","note":"政府應積極培育、鼓勵青年參與公共事務，並提供公共參與之機會，賦予青年對公共事務之實質影響力，確保青年得以參與政策制定過程，接近政府體制運作。"},{"bill":"201110120370000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。"},{"bill":"202110057110000","text":"國家應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年開展具創造性之文化生活。","note":"依聯合國《世界人權宣言》第二十七條，人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其利益。次按《文化基本法》第五條，人民享有參與、欣賞及共享文化之近用權利。青年參與文化事務應積極保障，爰訂定本條。"},{"bill":"202110059880000","text":"政府應鼓勵青年參與國際活動與交流，對青年參與國際事務給予必要之協助，強化青年國際事務知能。","note":"政府應鼓勵青年參與國際事務與交流、拓展國際視野、培養「思考全球化，行動在地化」的能力，並促進臺灣與國際間的合作與交好，爰訂定本條。"},{"bill":"202110061560000","text":"政府應積極培育參與公共事務之青年人才，推動青年賦權，確保青年享有公平參與體制之權利。","note":"為落實青年公共參與權，政府應積極培育與鼓勵青年參與公共事務，並提供公共參與之機會，賦予青年對公共事務之實質影響力，確保青年享有公平參與政策制定及影響政府體制運作之權利，爰訂定本條。"},{"bill":"202110061410000","text":"政府應鼓勵青年參與國際合作及交流，強化青年國際事務知能。","note":"政府應強化青年國際事務知能，培養青年因應全球化趨勢之專業或技能，促進國際合作及交流。"},{"bill":"202110068970000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與文化事務，支持青年開展具創造性之文化生活。","note":"為落實《世界人權宣言》第二十七條、《經濟社會文化權利公約》第十五條明定人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其產生之福利。文化權亦涉及青年人格發展及創造力，我國《文化基本法》保障人民參與文化之權利。"},{"bill":"202110070660000","text":"政府應積極鼓勵青年參與國際體驗學習及理解多元文化，提供青年參與國際事務之必要協助，強化青年國際事務知能。","note":"政府應鼓勵青年參與國際事務，拓展國際視野；並提供必要之協助，以利青年順利參與國際事務。"},{"bill":"202110071010000","text":"政府應維護青年之身心健康，並提供合宜之醫療資源與健康維護及促進措施。","note":"參考芬蘭《青年基本法》第二條提及之「健康生活方式」，明定政府應維護青年之身心健康，以保障其生存與發展。"},{"bill":"202110072290000","text":"政府應訂定青年居住政策，積極保障青年居住權利，提供青年良好之居住品質。","note":"一、青年居住權利之保障。\n二、為落實「世界人權宣言」及「經濟社會文化權利國際公約」第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰訂定本條，揭示政府應訂定青年居住政策，積極保障青年居住權利，提供青年良好之居住品質。"},{"bill":"202110072330000","text":"政府應積極培育參與公共事務之青年人才，確保青年公平參與體制之權利。","note":"政府應落實青年公共參與權，積極培育並提供公共參與機會，賦予青年實質影響力。"},{"bill":"202110072870000","text":"政府應提供青年參與國際體驗學習及理解多元文化之管道，對青年參與國際事務合作及交流給予協助，提升青年國際事務知能。","note":"參照青年發展政策綱領所揭示「全球力」之推動策略，明定政府應提供青年參與國際事務之協助。"},{"bill":"202110075700000","text":"政府應訂定促進青年身心健康、提高生活品質之政策。","note":"一、參酌《憲法》、《世界人權宣言》、《經濟社會文化權利公約》、《2025衛生福利政策白皮書》當中對於健康權之目標與願景。\n二、參照104年核定之青年發展政策綱領中「健康力」，政府應透過了解青年基礎健康資訊，進而訂定促進青年身心健康與提高生活品質之政策。\n三、爰明定政府應訂定促進青年身心健康、提高生活品質之政策。"},{"bill":"202110076040000","text":"政府應維護青年之身心健康，並提供合宜之醫療資源與健康維護及促進措施。","note":"參考芬蘭《青年基本法》第二條提及之「健康生活方式」，明定政府應維護青年之身心健康，以保障其生存與發展。"},{"bill":"202110078370000","text":"政府應訂定青年合宜居住政策，提供青年適足生活之居住環境，保障青年之居住權。","note":"一、《憲法》第十條規定，人民有居住及遷徙之自由。《經濟社會文化權利國際公約》第十一條亦指出，人人有權享受所需之適當生活，其中亦包括有權享受適當之住房。\n二、然近年居住成本日漸攀升，與年輕世代之所得差異甚遠，青年之居住正義恐淪為口號。爰訂定本條，明定政府應訂定青年居住政策，保障青年適足居住權，以利青年居住正義之實現。"},{"bill":"202110079860000","text":"政府應鼓勵青年參與國際合作及多元文化交流，提供參與各項國際交流與競賽之必要協助，強化青年國際事務知能。","note":"政府應鼓勵青年參與國際合作及多元文化交流，提供參與各項國際交流與競賽之必要協助，強化青年國際事務知能。"},{"bill":"202110080450000","text":"政府應訂定青年合宜居住政策，提供青年適足生活之居住環境，保障青年之居住權。","note":"一、《憲法》第十條規定，人民有居住及遷徙之自由。《經濟社會文化權利國際公約》第十一條亦指出，人人有權享受所需之適當生活，其中亦包括有權享受適當之住房。\n二、然近年居住成本日漸攀升，與年輕世代之所得差異甚遠，青年之居住正義恐淪為口號。爰訂定本條，明定政府應訂定青年居住政策，保障青年適足居住權，以利青年居住正義之實現。"},{"bill":"202110085510000","text":"政府應訂定促進青年身心健康、提高生活品質之政策。","note":"參酌《憲法》、《世界人權宣言》、《經濟社會文化權利公約》、《2025衛生福利政策白皮書》當中對於健康權之目標與願景。"},{"bill":"202110100300000","text":"政府應保障青年文化權利，擴大青年文化參與，保障青年族群之自我認同，並建立友善平權之文化環境，鼓勵青年積極參與文化事務，支持青年開展具創造性之文化生活。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於歧視的權利。","note":"一、依聯合國《世界人權宣言》第二十七條，人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其利益。次按《文化基本法》第五條，人民享有參與、欣賞及共享文化之近用權利。青年參與文化事務應積極保障，爰訂定本條第一項。\n二、按《文化基本法》第四條所揭示，人民享有之文化權利，不因族群、語言、性別、性傾向、年齡、地域、宗教信仰、身心狀況、社會經濟地位及其他條件，而受歧視或不合理之差別待遇。爰訂定本條第二項。"},{"bill":"202110098760000","text":"政府應支持青年經濟獨立，訂定維持生活品質之福利政策。","note":"明定政府應積極協助青年改善經濟，提供青年維持生活之福利政策。"},{"bill":"202110098790000","text":"政府應積極培育青年參與公共事務，並提供青年公共參與之機會及管道，確保享有公平及公正之意見表達權利。","note":"聯合國《2030青年策略》指導之聯合國青年事務五大優先事項中，包含保護與促進青年的權利，支持其公民及政治參與；我國104年發布《青年發展政策綱領》，其推動策略中包含提供青年公共政策參與機會，及理性表達意見管道，爰訂定第十一條。"},{"bill":"202110102250000","text":"政府應訂定促進青年身心健康、提高生活品質之政策。","note":"參照104年核定之青年發展政策綱領中「健康力」，政府應透過了解青年基礎健康資訊，進而訂定促進青年身心健康與提高生活品質之政策。"},{"bill":"202110103250000","text":"政府應訂定促進青年身心健康、提高生活品質之政策。","note":"一、參酌《憲法》、《世界人權宣言》、《經濟社會文化權利公約》、《2025衛生福利政策白皮書》當中對於健康權之目標與願景。\n二、參照104年核定之青年發展政策綱領中「健康力」，政府應透過了解青年基礎健康資訊，進而訂定促進青年身心健康與提高生活品質之政策。\n三、政府應透過廣泛收集與分析青年基礎健康資訊，寬列預算制定相關政策。"},{"bill":"202110104620000","text":"政府應積極培育參與公共事務之青年人才，推動青年賦權，確保青年享有公平參與體制之權利。","note":"為落實青年公共參與權，政府應積極培育與鼓勵青年參與公共事務，並提供公共參與之機會，賦予青年對公共事務之實質影響力，確保青年享有公平參與政策制定及影響政府體制運作之權利，爰訂定本條。"},{"bill":"202110108760000","text":"政府應促進青年身心健康，預防有害物質之濫用，並提供心理調適及休閒活動之機會。","note":"明定政府應訂定促進青年身心健康並預防有害物質濫用之政策，並適度提供其心理諮商、心理調適假或休閒活動等機會。"},{"bill":"202110107570000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"青年是社會中打造下一輪文化環境的原動力，文化權亦將驅動青年的創造力。爰明定政府應保障青年文化權，並應建立支持環境與鼓勵參與。"},{"bill":"202110107400000","text":"各級政府應設立推動青年事務之專責單位，統籌規劃與執行青年政策；其負責人應具備青年事務相關經驗與專業能力。","note":"一、為確保青年政策之整體性與連貫性，需設立具有明確責任與權限之專責機構，作為青年事務推動之核心單位。\n二、青年事務涵蓋教育、就業、參與、健康、文化等多面向，若無統一窗口協調，將難以有效整合資源與執行政策。\n三、各級政府應依地方實際需求設立專責單位，並賦予其跨部門整合與對外協調之職能，提升行政效率與回應速度。\n四、單位首長須具備青年相關專業背景，或具實務推動經驗，以確保政策規劃貼近青年需求、執行具實效性。"},{"bill":"202110109830000","text":"政府應促進青年參與國際合作與交流，提升青年國際事務能力，並提供參與多元文化之管道。","note":"參照教育部「青年發展政策綱領」公民力之推動策略為「提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識」。明訂政府應促進青年參與國際合作與交流，提升青年國際事務能力，並提供參與多元文化之管道。"},{"bill":"202110123900000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。"},{"bill":"202110124800000","text":"政府應積極培育參與公共事務之青年人才，推動青年賦權，確保青年享有公平參與體制之權利。","note":"為落實青年公平參與體制，政府應積極培育與鼓勵青年參與公共事務、提供公共參與之機會，使青年得積極參與公共事務，確保青年享有公平參與政策制定及影響政府體制運作之權利。"},{"bill":"202110124830000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與文化事務，支持青年開展具創造性之文化生活。","note":"依據《世界人權宣言》第二十七條與《經濟社會文化權利公約》第十五條，人人皆有權參與文化生活、欣賞藝術及共享科學成果。我國《文化基本法》亦保障人民文化參與權。文化權不僅關乎青年生活品質，更有助其人格發展與創造力培養。故政府應積極推動並保障青年參與多元文化活動的機會，促進其全面發展。"},{"bill":"202110126910000","text":"政府應訂定政策發展友善平權環境，維護青年人身安全，禁止暴力、消除歧視、預防犯罪及防制霸凌。","note":"為消除不平等及營造霸凌零容忍環境，政府應訂定相關政策，發展友善平權環境，爰為本條規定。"},{"bill":"202110127050000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。"},{"bill":"202110128060000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。"},{"bill":"202110128180000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。"},{"bill":"202110128310000","text":"青年享有發展創意、創業及實踐構想之機會。國家應提供創業培訓、資金協助、輔導機制及產業鏈結，促進青年創新生態系統。","note":"專為青年創業與創新行動設立權利基礎與政策義務。條文體現國家對青年創新能力與實踐潛力之高度信賴與支持，亦呼應國際普遍倡導「青年創業生態圈」建設趨勢。具體措施部分，創業培訓與資金協助對應創業初期所需知能與啟動資本，輔導機制與產業鏈結則強化後續支持與資源整合。此條落實《青年發展政策綱領》「強化青年創新創業支持」方向，並參考韓國青年創業法制中之教育、基金與平台機制。相較原草案對創新創業僅籠統提及，此條將實務經驗與國際發展納入條文設計，使政策操作性大幅提升。"},{"bill":"202110129310000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與文化事務，支持青年開展具創造性之文化生活。","note":"為落實《世界人權宣言》第二十七條、《經濟社會文化權利公約》第十五條明定人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其產生之福利。文化權亦涉及青年人格發展及創造力，我國《文化基本法》保障人民參與文化之權利。"},{"bill":"202110132300000","text":"政府應訂定居住政策，保障青年居住權益，以健全資訊、稅賦優惠、租金補貼或其他具體措施，落實居住正義。推行措施有必要者，應依第二十八條第一項之規定，限期檢討法規。","note":"一、青年居住權益應予保障，以落實居住正義，爰定於本條。\n二、緣透過社會住宅政策落實居住正義，係許多民間團體倡議多年之理念，亦與支持青年生活，有重大之關係，先予敘明。\n三、承上，本條所稱健全資訊，包含社會住宅需求資訊及房市資訊，進一步規定於本法第二十六條第三項第五款。所稱稅賦優惠，舉例言之，可利用稅賦優惠，提升現行包租之戶數比例。目前依據住宅法第十九條第一項第六款，政府有承租民間住宅並轉租及代為管理（包租），與媒合承出租雙方及代為管理（代管）之執行方式。依據民間團體整理資料，112年包租戶數有21,810戶，代管戶數有71,644戶，過度往代管傾斜，相較之下代管較包租，更易產生歧視弱勢承租人之問題。基此，應納入提升包租之政策誘因。民間團體主張之具體政策誘因，為以包租方式執行之有住宅出租期間所獲租金收入，免納綜合所得稅，執行本條時，上述主張可供參考。\n四、另外，本條規定政策，可能涉及其他法律（規），適用關係複雜。為求妥善，如須修正各該目的事業主管機關之法律（規），則依本法第二十八條第一項限期檢討機制辦理，一併規定於本條後段。"},{"bill":"202110143380000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。"},{"bill":"202110155730000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，建立有利於地方創生及社會創新支持體系，並提供必要之協助、輔導及服務。","note":"一、為促進青年在地深耕及鼓勵其返鄉發展，本條文明確規範政府應建立青年在地支持系統。此系統旨在連結在地需求，促進青年間之交流與組織合作，進而增進青年生涯發展及公共參與。透過此一機制，期能逐步落實青年政策，使青年得以在熟悉或具潛力之在地環境中，獲得適切的支持與發展機會。\n二、為活絡地方發展並回應當前社會需求，本條文鼓勵青年參與地方創生及社會創新。政府將透過提供必要之協助、輔導與服務，支持青年將其創新能量與在地資源結合，共同為地方注入新活力，解決社會問題。此舉不僅能提升地方韌性，亦能拓展青年多元發展路徑，實現其在地價值。"},{"bill":"202110166280000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。"},{"bill":"202110169130000","text":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","note":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。"},{"bill":"202110175160000","text":"政府應支持青年經濟獨立，訂定維持生活品質之福利政策。","note":"明定政府應積極協助青年改善經濟，提供青年維持生活之福利政策。"}],"changed":true,"final":"政府應建立青年在地支持系統，鼓勵青年參與地方創生及社會創新，獎勵青年返留鄉，並提供必要之協助、輔導及服務。","finalWhy":"為鼓勵青年在地或返鄉發展，藉由建立青年在地支持系統，協助青年連結在地需求，促進青年交流及組織合作，增進青年生涯發展及公共參與，逐步落實青年政策，並提供青年必要之協助、輔導及服務，爰為本條規定。","review":null},{"no":"第十二條","current":null,"versions":[{"bill":"202110017600000","text":"各級主管機關應設青年發展與創業基金，辦理青年相關發展業務及輔導創業。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。","note":"明定各級主管機關應成立青年發展與創業基金，辦理青年相關發展業務及輔導創業。"},{"bill":"202110040040000","text":"中央政府機關為推動青年參與公共政策之形成，應邀集青年代表、專家、學者及公民團體，定期召開青年政策諮詢會報，每年至少召開二次會議，必要時得召開臨時會議，其任務如下：\n一、監督與檢討青年政策及計畫。\n二、提供有關青年政策、法規及計畫興革之意見。\n三、提供有關機關、團體推展青年事務督導及考核之意見。\n四、研訂實施青年政策措施之發展方向。\n五、研訂青年公共參與之具體方向及措施。\n六、其他有關推展青年政策之諮詢事項。\n前項諮詢會報之青年代表，其人數不得少於總人數三分之二。任一性別委員人數不得少於委員總人數三分之一。","note":"一、為使各級政府有效推動青年政策及各項工作，要求政府設立青年政策諮詢會報，由青年代表、專家學者及民間團體共同組成，研議各項青年政策之方向。\n二、青年族群作為最直接之利害關係人，故於本條第二項保障青年代表席次，確保青年公共參與權。為促進性別平等，亦制定性別比例原則。"},{"bill":"201110120370000","text":"政府應訂定居住與家庭政策，保障青年居住權益及友善育兒環境、強化家庭照顧及生育教養支持系統。\n青年育有子女者，政府應積極採取提供獎勵、補貼、貸款協助等措施，協助其獲得宜居之家庭生活環境。","note":"一、為落實世界人權宣言及經濟社會文化權利國際公約第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰於本條明定政府應訂定居住政策，積極保障青年居住權益，提升青年家庭生活品質，以期打造青年安居且適育之環境。另世界人權宣言第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務；公民與政治權利國際公約第二十三條第一項規定，家庭為社會之自然基本團體單位，應受社會及國家之保護。爰於第一項規定政府應訂定強化家庭照顧及生育教養服務等家庭政策，並建立相關支持系統。\n二、鑒於青年育有子女者，更有獲得家庭生活環境之需要，政府應積極採取優先配住社會住宅、租金補貼或首次購屋優惠貸款等措施，爰為第二項規定。"},{"bill":"202110057110000","text":"國家應鼓勵青年參與國際活動與交流，對青年參與國際事務給予必要之協助，強化青年國際事務知能。","note":"政府應鼓勵青年參與國際事務與交流、拓展國際視野、培養「思考全球化，行動在地化」的能力，並促進臺灣與國際間的合作與交好，爰訂定本條。"},{"bill":"202110059880000","text":"政府應積極培育參與公共事務之青年人才，並應提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識，確保青年享有公平參與體制之權利。","note":"為促進青年對公共事務之參與，政府除應培育參與公共事務、經營青年政策之青年，亦應對青年積極賦權，確保青年享有公平參與體制之權利。爰訂定本條。"},{"bill":"202110061560000","text":"各級政府應設置青年專責單位，辦理青年事務。\n前項青年專責單位，其首長應具青年身分。","note":"一、為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責單位。\n二、為確保青年專責單位之首長具青年身分，爰訂定第二項。"},{"bill":"202110061410000","text":"政府應積極培育參與公共事務之青年人才，確保青年公平參與體制之權利。","note":"政府應落實青年公共參與權，積極培育青年人才並提供公共參與公共事務的機會，賦予青年實質的社會影響力。"},{"bill":"202110068970000","text":"政府應提供青年參與國際體驗學習及理解多元文化之管道，對青年參與國際事務合作及交流給予協助，提升青年國際事務知能。","note":"參照青年發展政策綱領「全球力」之推動策略為「拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力」。國際交流成本並非所有青年皆可負擔，透過政府提供資源，可增加青年國際交流可近性。"},{"bill":"202110070660000","text":"政府應積極培育參與公共事務之青年人才，確保青年公平參與體制之權利。","note":"為促進青年對公共事務之參與，並持續培育公共事務之人才，政府應確保青年享有公平參與公共事務之權利。"},{"bill":"202110071010000","text":"政府應輔導青年創新創業並營造良好青創環境。","note":"參考韓國《青年基本法》第十八條，規定應提供青年創新創業支持。"},{"bill":"202110072290000","text":"政府應訂定促進青年身心健康、提高生活品質之福利政策。","note":"一、青年福利政策之訂定。\n二、「世界人權宣言」第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務，爰訂定本條，揭示政府應制定促進青年身心健康、提高生活品質之福利政策，保障青年身心及生活福利。"},{"bill":"202110072330000","text":"各級政府應設置青年專責單位，辦理青年事務。\n前項青年專責單位，其首長應具青年身分。","note":"各級政府應有專責單位有效推動青年政策及各項工作，並確保該單位首長具青年身分。"},{"bill":"202110072870000","text":"政府應積極培育參與公共事務之青年人才，並提供適當之表達意見管道，深化公民教育，推動青年賦權，確保青年享有公平參與體制之權利。","note":"為落實《憲法》、《世界人權宣言》平等與直接之公共參與權利，爰參照青年發展政策綱領所揭示「公民力」之推動策略，明定政府應保障青年享有公平參與體制之權利。"},{"bill":"202110075700000","text":"政府應支持青年經濟獨立，對其穩定之經濟生活給予必要之協助。","note":"一、青年為社會發展的重要力量，其經濟獨立對於個人成長、家庭穩定和社會進步均有重要意義。\n二、參酌韓國《青年基本法》第四章，青年權益促進政策，其中亦提及支持青年經濟獨立。\n三、爰明定本條，政府應積極協助支持青年經濟的獨立，對青年的穩定經濟生活給予必要協助。"},{"bill":"202110076040000","text":"政府應輔導青年創新創業並營造良好青創環境。","note":"參考韓國《青年基本法》第十八條，規定應提供青年創新創業支持。"},{"bill":"202110078370000","text":"政府應訂定維護青年身心健康，並提供合宜之醫療資源及醫療政策。","note":"一、參酌《憲法》、《世界人權宣言》、《經濟社會文化權利公約》、《2025衛生福利政策白皮書》當中對於健康權之目標與願景。\n二、參照104年核定之青年發展政策綱領中「健康力」，政府應透過了解青年基礎健康資訊，進而訂定促進青年身心健康與提高生活品質之政策。\n三、爰明定政府應訂定促進青年身心健康、提高生活品質之政策。"},{"bill":"202110079860000","text":"政府應積極培育參與公共事務之青年人才，確保青年公平參與體制之權利。","note":"政府應落實青年公共參與權，積極培育青年人才並提供參與公共事務的機會，賦予青年實質的社會影響力。"},{"bill":"202110080450000","text":"政府應訂定維護青年身心健康，並提供合宜之醫療資源及醫療政策。","note":"一、參酌《憲法》、《世界人權宣言》、《經濟社會文化權利公約》、《2025衛生福利政策白皮書》當中對於健康權之目標與願景。\n二、參照104年核定之青年發展政策綱領中「健康力」，政府應透過了解青年基礎健康資訊，進而訂定促進青年身心健康與提高生活品質之政策。\n三、爰明定政府應訂定促進青年身心健康、提高生活品質之政策。"},{"bill":"202110085510000","text":"政府應支持青年經濟獨立，對其穩定之經濟生活給予必要之協助。","note":"一、青年為社會發展的重要力量，其經濟獨立對於個人成長、家庭穩定和社會進步均有重要意義。\n二、參酌韓國《青年基本法》第四章，青年權益促進政策，其中亦提及支持青年經濟獨立。\n三、爰明定本條，政府應積極協助支持青年經濟的獨立，對青年的穩定經濟生活給予必要協助。"},{"bill":"202110100300000","text":"政府應鼓勵青年參與國際活動與交流，對青年參與國際事務給予必要之協助，強化青年國際事務知能。","note":"青年發展政策綱領「全球力」之推動策略為「拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力」。為促進我國之國際交流與外交，提升青年人才因應全球事務之能力，爰參考韓國《青年基本法》第二十四條明定政府應鼓勵青年投入國際事務。"},{"bill":"202110098760000","text":"政府應促進青年身心健康，保障青年參與各項文化活動。","note":"保障青年文化權利，擴大文化參與，促進青年身心健康。"},{"bill":"202110098790000","text":"政府應支持青年參與國際合作及交流，並得給予經濟性協助。","note":"聯合國《無限世代》（Generation Unlimited）之政策意涵提及青年為聯合國工作推動者之一，應納入地方、國家和國際層面的決策機制；我國104年發布《青年發展政策綱領》，其推動策略中包含拓展青年國際體驗學習、培育國際化青年人才、提供國際交流整合資訊及機會，為促使我國青年參與國際公共事務，擴大國際間青年合作，政府有責任提供經濟支持，爰訂定第十二條。"},{"bill":"202110102250000","text":"政府應支持青年經濟獨立，對其穩定之經濟生活給予必要之協助。","note":"一、青年為社會發展的重要力量，其經濟獨立對於個人成長、家庭穩定和社會進步均有重要意義。\n二、參酌韓國《青年基本法》第四章，青年權益促進政策，其中亦提及支持青年經濟獨立。\n三、爰明定本條，政府應積極協助支持青年經濟的獨立，對青年的穩定經濟生活給予必要協助。"},{"bill":"202110103250000","text":"政府應支持青年經濟獨立，對其穩定之經濟生活給予必要之協助。","note":"一、青年為社會發展的重要力量，其經濟自主不僅促進個人成長，亦對家庭穩定及社會發展具有深遠影響。\n二、參酌韓國《青年基本法》第四章中關於促進青年權益的政策，該法亦明示支持青年實現經濟獨立。\n三、爰明定本條，政府應積極推動並協助青年實現經濟自主，為其穩定的經濟生活提供必要支持。"},{"bill":"202110104620000","text":"各級政府應設置青年專責單位，辦理青年事務。\n前項青年專責單位，其首長應具青年身分。","note":"一、為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責單位。\n二、為確保青年專責單位之首長具青年身分，爰訂定第二項。"},{"bill":"202110108760000","text":"政府應支持青年經濟獨立，訂定維持生活品質之福利政策。","note":"明定政府應積極協助青年改善經濟，提供青年維持生活之福利政策。"},{"bill":"202110107570000","text":"為提升青年國際競爭力，政府應鼓勵青年參與國際交流，結合學校與民間資源，獎勵青年拓展國際視野，提升與國際接軌之能力，增進對國際事務之參與機會，並給予經濟、外交及其他必要之協助。","note":"明定政府應提升青年國際競爭力，增進對國際事務之參與機會。"},{"bill":"202110107400000","text":"行政院應每四年擬訂一次「青年發展政策綱領」，並每二年發布「青年政策白皮書」，作為青年政策規劃與推動之指導依據。","note":"一、青年政策需具長期性與前瞻性，透過制度化的政策綱領與白皮書機制，確保政策方向穩定、施政具延續性。\n二、「青年發展政策綱領」為國家層級之中長期發展規劃，應廣納各界意見，設定整體願景與核心目標，提供跨部會整合依據。\n三、「青年政策白皮書」則為施政現況與成效之公開報告，應定期檢討政策成果，揭示未來修正方向，提升政策透明度與責任性。\n四、此雙軌制度除強化政策管理，也為青年與社會各界提供監督與參與的依據，促進開放政府與政策共構。"},{"bill":"202110109830000","text":"政府應積極培育青年公共事務參與人才，推動青年賦權，確保青年公平參與體制的權利。","note":"參照教育部「青年發展政策綱領」公民力之推動策略為「提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識」，明訂政府應積極培育青年公共事務參與人才，推動青年賦權，確保青年公平參與體制的權利。"},{"bill":"202110123900000","text":"政府應訂定青年居住與家庭政策，保障青年居住權益及友善育兒環境、強化家庭照顧及生育教養支持系統。\n中央政府應訂定辦法提供獎勵、補貼、貸款協助等措施，協助青年育有子女者獲得宜居之家庭生活環境。","note":"明定政府應訂定青年居住政策，積極保障青年居住權益，提升青年家庭生活品質，並應積極採取優先配住社會住宅、租金補貼或首次購屋優惠貸款等措施，以期打造青年安居且適育之環境。"},{"bill":"202110124800000","text":"各級政府應設置青年專責單位，辦理青年事務。\n前項青年專責單位，其首長應具青年身分。","note":"一、為使各級政府機關能有效推動青年政策及各項工作，明定各級政府應設置青年專責單位。\n二、為確保青年專責單位之首長具青年身分，爰訂定第二項。"},{"bill":"202110124830000","text":"政府應提供青年參與國際體驗學習及理解多元文化之管道，對青年參與國際事務合作及交流給予協助，提升青年國際事務知能。","note":"根據青年發展政策綱領「全球力」之策略，政府應協助青年拓展國際視野，提升其參與國際事務與多元文化理解的機會。然而，國際交流成本高昂，並非所有青年皆可負擔。為提升其國際參與可近性，政府應提供必要資源，鼓勵青年參與國際交流與在地實踐，增進其國際競爭力與合作能力，強化全球化時代所需技能。"},{"bill":"202110126910000","text":"政府應保障青年享有藝文教育、參與各項文化藝術活動之機會，並支持青年近用、從事或參與文化藝術工作與活動，開展具多元性及創造性之文化藝術生活。","note":"文化權涉及青年人格發展及創造力之培養，爰明定政府應保障青年文化權，並應建立支持環境與鼓勵參與。"},{"bill":"202110127050000","text":"政府應訂定居住與家庭政策，保障青年居住權益及友善育兒環境、強化家庭照顧及生育教養支持系統。\n青年育有子女者，政府應積極採取提供獎勵、補貼、貸款協助等措施，協助其獲得宜居之家庭生活環境。","note":"一、為落實世界人權宣言及經濟社會文化權利國際公約第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰於本條明定政府應訂定居住政策，積極保障青年居住權益，提升青年家庭生活品質，以期打造青年安居且適育之環境。另世界人權宣言第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務；公民與政治權利國際公約第二十三條第一項規定，家庭為社會之自然基本團體單位，應受社會及國家之保護。爰於第一項規定政府應訂定強化家庭照顧及生育教養服務等家庭政策，並建立相關支持系統。\n二、鑒於青年育有子女者，更有獲得家庭生活環境之需要，政府應積極採取優先配住社會住宅、租金補貼或首次購屋優惠貸款等措施，爰為第二項規定。"},{"bill":"202110128060000","text":"政府應訂定青年居住與家庭政策，保障青年居住權益及友善育兒環境、強化家庭照顧及生育教養支持系統。\n青年育有子女者，政府應積極採取提供獎勵、補貼、貸款協助等措施，協助其獲得宜居之家庭生活環境。","note":"一、為落實世界人權宣言及經濟社會文化權利國際公約第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰於本條明定政府應訂定居住政策，積極保障青年居住權益，提升青年家庭生活品質，以期打造青年安居且適育之環境。另世界人權宣言第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務；公民與政治權利國際公約第二十三條第一項規定，家庭為社會之自然基本團體單位，應受社會及國家之保護。爰於第一項規定政府應訂定強化家庭照顧及生育教養服務等家庭政策，並建立相關支持系統。\n二、鑒於青年育有子女者，更有獲得家庭生活環境之需要，政府應積極採取優先配住社會住宅、租金補貼或首次購屋優惠貸款等措施，爰為第二項規定。"},{"bill":"202110128180000","text":"政府應訂定青年居住與家庭政策，保障青年居住權益及友善育兒環境、強化家庭照顧及生育教養支持系統。\n青年育有子女者，政府應積極採取提供獎勵、補貼、貸款協助等措施，協助其獲得宜居之家庭生活環境。","note":"一、為落實世界人權宣言及經濟社會文化權利國際公約第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰於本條明定政府應訂定青年居住政策，積極保障青年居住權益，提升青年家庭生活品質，以期打造青年安居且適育之環境。另世界人權宣言第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務；聯合國公民及政治權利國際公約第二十三條第一項規定：「家庭為社會之自然基本團體單位，應受社會及國家之保護。」，爰於第一項規定政府應訂定強化家庭照顧及生育教養服務等家庭政策，並建立相關支持系統。\n二、鑒於青年育有子女者，更有獲得家庭生活環境之需要，政府應積極採取優先配住社會住宅、租金補貼或首次購屋優惠貸款等措施，爰明定第二項規定。"},{"bill":"202110128310000","text":"青年有建立、經營與獲得扶助之家庭生活之權利。國家應提供生育支持、育兒協助、稅賦減免與托育資源，減輕青年家庭負擔。","note":"回應台灣青年面臨晚婚、低育與家庭扶養負擔沉重之社會情境，肯認青年不僅作為家庭成員，亦為家庭生活之主體。條文正面宣示青年有建立與經營家庭的自由與正當性，並要求國家提供具體扶助措施，包括生育津貼、育兒補助、稅賦減免與公共托育資源。該設計體現社會政策中「家庭友善化」趨勢，也為落實《青年發展政策綱領》「協助青年建立與經營家庭生活」提供法源依據。國際方面，可參照芬蘭社會福利制度下針對青年家庭提供之普及性家庭支持服務。"},{"bill":"202110129310000","text":"政府應提供青年參與國際體驗學習及理解多元文化之管道，對青年參與國際事務合作及交流給予協助，提升青年國際事務知能。","note":"參照青年發展政策綱領「全球力」之推動策略為「拓展青年國際體驗學習及理解多元文化管道，提升國際競爭能力」。國際交流成本並非所有青年皆可負擔，透過政府提供資源，可增加青年國際交流可近性。"},{"bill":"202110132300000","text":"政府應訂定家庭政策，保障青年友善育兒環境、強化家庭照顧及生育教養支持系統。青年育有子女者，政府應積極採取提供獎勵、補貼、貸款協助、布建教保服務托育服務等措施，協助其獲得良好之家庭生活環境。","note":"一、明定政府訂定家庭政策，對育有子女青年政策措施於本條。\n二、本條所稱布建教保服務托育服務，包含目前諸如公立幼兒園、準公共幼兒園、非營利幼兒園、公共化托育、準公共托育、私立托育……等政府自行辦理或予以補助之措施，為現行政府重要青年政策之一。其中有關幼兒園，係由教育部依據幼兒教育及照顧法第七條第五項，及幼兒就讀教保服務機構補助辦法等規定辦理；有關托育之部分，係由衛生福利部依據兒童及少年福利及權益保障法第二十三條，及「直轄市、縣（市）政府辦理未滿二歲兒童托育公共化及準公共服務作業要點」等規定辦理。本次立法，在法律層次規範中，賦予相關依據，以緩解青年育有子女者之沉重壓力。"},{"bill":"202110143380000","text":"政府應訂定居住與家庭政策，保障青年居住權益、改善青年友善育兒環境及相關資源之可近性，強化家庭照顧及生育教養系統。\n青年懷孕期間或育有子女者，政府應積極採取提供獎勵、補貼、貸款協助等措施，協助其獲得宜居之家庭生活環境。","note":"一、為落實世界人權宣言及經濟社會文化權利國際公約第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰於本條明定政府應訂定居住政策，積極保障青年居住權益，提升青年家庭生活品質，以期打造青年安居且適育之環境。同時考量青年在育兒階段之多重需求，應強化改善青年托育、育兒與教育資源之整合，並提升資源可近性，擴大支持其兼顧育兒與職涯發展之措施，建構友善之社會支持制度。另世界人權宣言第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務；公民與政治權利國際公約第二十三條第一項規定，家庭為社會之自然基本團體單位，應受社會及國家之保護。爰於第一項規定政府應訂定強化家庭照顧及生育教養服務等家庭政策，並建立相關支持系統。\n二、鑒於青年懷孕或育有子女者，更有獲得家庭生活環境之需要，政府應積極採取優先配住社會住宅、租金補貼或首次購屋優惠貸款等措施，並應對單親處境青年提供加強型支持服務，減輕其家庭照顧負擔，促進其家庭生活穩定與兒童福祉保障，爰為第二項規定。"},{"bill":"202110155730000","text":"政府應訂定青年居住與家庭政策，以保障青年居住權益及營造友善育兒環境。\n前項政策應強化家庭照顧及生育教養支持系統。\n青年育有子女者，政府應積極採取提供獎勵、補貼、貸款協助等措施，協助其獲得宜居之家庭生活環境。","note":"一、為落實《世界人權宣言》及《經濟社會文化權利國際公約》第四號一般性意見所揭示之適足居住權，本條文第一項及第二項明定政府應訂定青年居住與家庭政策。此政策旨在積極保障青年居住權益，並致力營造友善育兒環境，同時強化家庭照顧及生育教養支持系統。期能透過全面性之政策規劃，提升青年家庭生活品質，打造青年宜居之環境。\n二、考量青年育有子女者，對於獲得穩定且適居之家庭生活環境有更迫切之需求，本條文第三項爰明定政府應積極採取提供獎勵、補貼、貸款協助等具體措施。此等措施可包括但不限於優先配租社會住宅、提供租金補貼或首次購屋優惠貸款等，旨在減輕青年家庭之居住負擔，確保其得以享有宜居之家庭生活，進而支持青年育兒，促進人口結構之健全發展。"},{"bill":"202110166280000","text":"政府應訂定居住與家庭政策，保障青年居住權益及友善育兒環境、強化家庭照顧及生育教養支持系統。\n青年育有子女者，政府應積極採取獎勵、補貼、貸款協助等措施，確保其享有安適且宜居之家庭生活環境。","note":"一、為落實世界人權宣言及經濟社會文化權利國際公約第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰於本條明定政府應訂定居住政策，積極保障青年居住權益，提升青年家庭生活品質，以期打造青年安居且適育之環境。另世界人權宣言第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務；公民與政治權利國際公約第二十三條第一項規定，家庭為社會之自然基本團體單位，應受社會及國家之保護。爰於第一項規定政府應訂定強化家庭照顧及生育教養服務等家庭政策，並建立相關支持系統。\n二、鑒於青年育有子女者，更有獲得家庭生活環境之需要，政府應積極採取優先配住社會住宅、租金補貼或首次購屋優惠貸款等措施，爰為第二項規定。"},{"bill":"202110169130000","text":"政府應訂定居住與家庭政策，保障青年居住權益及友善育兒環境、強化家庭照顧及生育教養支持系統。\n青年育有子女者，政府應積極採取提供獎勵、補貼、貸款協助等措施，協助其獲得宜居之家庭生活環境。","note":"一、為落實世界人權宣言及經濟社會文化權利國際公約第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰於本條明定政府應訂定居住政策，積極保障青年居住權益，提升青年家庭生活品質，以期打造青年安居且適育之環境。另世界人權宣言第二十五條明定人人皆享有為維持本人及其家屬之健康、福利所需生活水準，包括食物、衣著、住房、醫療及必要之社會服務；公民與政治權利國際公約第二十三條第一項規定，家庭為社會之自然基本團體單位，應受社會及國家之保護。爰於第一項規定政府應訂定強化家庭照顧及生育教養服務等家庭政策，並建立相關支持系統。\n二、鑒於青年育有子女者，更有獲得家庭生活環境之需要，政府應積極採取優先配住社會住宅、租金補貼或首次購屋優惠貸款等措施，爰為第二項規定。"},{"bill":"202110175160000","text":"政府應促進青年身心健康，保障青年參與各項文化活動。","note":"保障青年文化權利，擴大文化參與，促進青年身心健康。"}],"changed":true,"final":"政府應訂定青年居住政策，提升青年之居住品質，落實青年居住正義。","finalWhy":"為落實世界人權宣言及經濟社會文化權利國際公約第四號一般性意見，保障青年享有安全、和平及尊嚴之適足居住權，爰於本條明定政府應訂定居住政策，積極保障青年居住權益，落實居住正義，以期打造青年之安居環境。","review":null},{"no":"第十三條","current":null,"versions":[{"bill":"202110017600000","text":"為提升青年國際競爭力，政府應致力促進人才、技術、設施及資訊之國際交流與利用，獎勵青年參與國際共同開發與研究，並結合學校與民間團體資源推展軟實力文化交流，協助青年與國際接軌，拓展國際視野，增進對國際事務之瞭解及參與。","note":"明定政府應提升青年國際競爭力。"},{"bill":"202110040040000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"為保障青年事務預算之充裕，爰訂定各級政府應寬列支持青年事務算，保障專款專用，充實青年政策所需預算。"},{"bill":"201110120370000","text":"政府應採取具體措施促進青年身心健康、預防物質濫用，增加心理健康促進、心理諮商之機會。\n政府應積極鼓勵學校、機構、法人或團體，開設社會情緒教育、情感教育及生命教育相關課程。","note":"一、為落實經濟社會文化權利公約第十二條有關人人有權享受可能達到之最高標準之身體與精神健康之規定，並呼應聯合國「促進健康生活與福祉」、「消弭不平等現象」永續發展之目標，及世界衛生組織（WHO）「心理健康是普世人權」之理念，以強化、促進心理健康，行政院已核定「全民心理健康韌性計畫」，全面提升國民心理健康。考量身心健康係生存之根本，爰於第一項明定政府應推展促進青年身心健康及提升生活品質之政策，並關注預防物質濫用等重要議題，保障其身心及生活均衡發展，與社會正向互動，並提升身心韌性，以因應當代環境之多元風險及衝擊。\n二、又為因應社會近年青年議題，強化政府對情緒教育、生命教育及情感教育之重視，爰為第二項規定。"},{"bill":"202110057110000","text":"國家應積極培育參與公共事務之青年人才，提供青年公共政策參與機會及理性表達意見管道，內化社會關懷意識。","note":"為促進青年對公共事務之參與，政府除應培育參與公共事務、經營青年政策之青年，亦應對青年積極賦權，確保青年享有公平參與體制之權利。爰訂定本條。"},{"bill":"202110059880000","text":"第五條至第十二條列舉之內容，政府應保障青年平等享有及參與之機會。","note":"按《憲法》第七條所揭示之平等權，我國青年於本草案第五條至第十二條列舉之內容應有平等享有及參與之機會。"},{"bill":"202110061560000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"為保障青年事務預算之充裕，爰訂定第一項，明定各級政府應寬列支持青年事務預算，保障專款專用，合理分配及運用，持續充實青年政策所需預算。"},{"bill":"202110061410000","text":"各級政府應設置青年專責單位，辦理青年事務。\n前項青年專責單位，其首長應具青年身分。","note":"各級政府應有專責單位有效推動青年政策及各項工作，並確保該單位首長具青年身分。"},{"bill":"202110068970000","text":"政府應積極培育參與公共事務之青年人才，深化公民教育，推動青年賦權，確保青年享有公平參與體制之權利。","note":"一、為落實《憲法》、《世界人權宣言》第二十一條平等與直接之公共參與權利。\n二、參照青年發展政策綱領「公民力」之推動策略為「提供青年公共政策參與機會，及理性表達意見管道，內化社會關懷意識」。"},{"bill":"202110070660000","text":"行政院為有效整合及推動青年事務之政策及相關事務，應設置青年事務專責部會。","note":"青年輔導委員會於民國一百零二年配合政府組織改造，已併入教育部，部分業務及人員則按業務屬性併入經濟部及勞動部。考量青年政策複雜且專業，行政院有必要設置青年事務專責部會，積極推動跨部會青年發展業務。"},{"bill":"202110071010000","text":"政府應保障青年文化參與，支持青年文化與藝術工作者並對青年藝文消費提出鼓勵措施。","note":"為使青年得在文化領域充分發揮其潛能，明定應保障青年之文化及藝術工作者。並以鼓勵措施促進青年之藝文消費。"},{"bill":"202110072290000","text":"政府應保障青年參與各項文化活動，支持青年開展具創造性之文化生活。","note":"一、青年文化生活之支持。\n二、「世界人權宣言」第二十七條及「經濟社會文化權利國際公約」第十五條明定人人有權自由參加社會之文化生活，欣賞藝術，並共享科學進步及其產生之福利，文化權亦涉及青年人格發展及創造力，爰訂定本條，揭示政府應保障青年參與各項文化活動。"},{"bill":"202110072330000","text":"各級政府應寬列青年事務預算，保障專款專用，合理分配及運用，持續充實青年發展所需預算。","note":"各級政府應寬列支持青年事務預算，保障青年事務預算之充裕。"},{"bill":"202110072870000","text":"各級政府應由專責機關或單位規劃、推動辦理及輔導青年事務。","note":"青年事務工作涉及各級政府及各相關政府部門之業務，需共同合作協調才能完成。為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責單位，負責規劃、推動辦理及輔導青年事務。"},{"bill":"202110075700000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年開展具創造性之文化生活。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於歧視的權利。","note":"一、《文化基本法》保障人民文化權利，擴大文化參與。\n二、青年是社會中打造下一輪文化環境的原動力，文化權亦將驅動青年的創造力。爰明定政府應保障青年文化權，並應建立支持環境與鼓勵參與。"},{"bill":"202110076040000","text":"政府應保障青年文化參與，支持青年文化與藝術工作者並對青年藝文消費提出鼓勵措施。","note":"為使青年得在文化領域充分發揮其潛能，明定應保障青年之文化及藝術工作者。並以鼓勵措施促進青年之藝文消費。"},{"bill":"202110078370000","text":"政府應支持青年經濟獨立，保障其穩定之經濟生活，提供必要之援助。","note":"一、青年為社會發展的重要力量，其經濟獨立對於個人成長、家庭穩定和社會進步均有重要意義。\n二、參酌韓國《青年基本法》第四章，青年權益促進政策，其中亦提及支持青年經濟獨立。\n三、爰明定本條，政府應積極協助支持青年經濟的獨立，對青年的穩定經濟生活給予必要協助。"},{"bill":"202110079860000","text":"各級政府應設置青年專責單位，辦理青年事務。\n前項青年專責單位，其首長應具青年身分。","note":"各級政府應設有專責單位有效推動青年政策及各項工作，且其首長應具青年身分，以切實符合青年需求。"},{"bill":"202110080450000","text":"政府應支持青年經濟獨立，保障其穩定之經濟生活，提供必要之援助。","note":"一、青年為社會發展的重要力量，其經濟獨立對於個人成長、家庭穩定和社會進步均有重要意義。\n二、參酌韓國《青年基本法》第四章，青年權益促進政策，其中亦提及支持青年經濟獨立。\n三、爰明定本條，政府應積極協助支持青年經濟的獨立，對青年的穩定經濟生活給予必要協助。"},{"bill":"202110085510000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年開展具創造性之文化生活。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於歧視的權利。","note":"一、《文化基本法》保障人民文化權利，擴大文化參與。\n二、青年是社會中打造下一輪文化環境的原動力，文化權亦將驅動青年的創造力。爰明定政府應保障青年文化權，並應建立支持環境與鼓勵參與。"},{"bill":"202110100300000","text":"政府應支持青年之運動發展，提供合宜措施輔導，協助青年於運動領域發揮其潛能。","note":"鑒於青年時期為運動員發展之關鍵階段，無論訓練、參賽、國際交流、退役後之生涯規劃，皆須政府支持與完善規劃，爰將青年在運動領域之發展納入保障，以協助青年運動員與選手。"},{"bill":"202110098760000","text":"為提升青年國際競爭力，政府應鼓勵青年參與國際交流，結合學校與民間資源，獎勵青年拓展國際視野，提升與國際接軌之能力，增進對國際事務之參與機會。","note":"明定政府應提升青年國際競爭力，增進對國際事務之參與機會。"},{"bill":"202110098790000","text":"各級政府應設置青年專責單位，並應邀集推動青年發展相關學者、專家、民間相關機構、團體代表、目的事業主管機關代表、青年代表，協調、研究、審議、諮詢及推動青年政策。\n前項青年發展相關學者、專家、民間相關機構、團體代表、青年代表不得少於二分之一，單一性別不得少於三分之一。","note":"一、現行有教育部青年發展署推動青年相關政策，惟同時亦有其他部會協助青年政策，如：勞動部關注青年勞動議題、文化部辦理青年文化體驗；另有行政院青年諮詢委員會提供青年政策意見，故現行青年政策有多重單位辦理。此外，地方政府並非皆設有青年局之青年相關單位。為統一權責，爰應由中央設立專責單位；另為促進各地推動青年事務，地方政府亦應設置青年局處。\n二、參酌《兒童及少年福利與權益保障法》第十條，要求各級政府應廣邀各界參與青年政策之制定，且為保障民眾參與及考量性別多元，爰訂有人數及單一性別之標準。"},{"bill":"202110102250000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年開展具創造性之文化生活。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於歧視的權利。","note":"一、《文化基本法》保障人民文化權利，擴大文化參與。\n二、青年是社會中打造下一輪文化環境的原動力，文化權亦將驅動青年的創造力。爰明定政府應保障青年文化權，並應建立支持環境與鼓勵參與。"},{"bill":"202110103250000","text":"政府應保障青年參與各類文化活動，鼓勵青年積極參與及主導文化事務，支持青年開展具創造性之文化生活。\n前項關於文化事務之經營與參與，應致力保障各項文化之平等，以及其免於歧視的權利。","note":"一、《文化基本法》保障人民文化權利，擴大文化參與。\n二、青年是推動未來文化環境轉變的核心力量，而保障文化權利則能激發他們
