理以青年為參與客群之非營利組織及社團活動，並制定相關獎勵、補助及培力計畫。","note":"政府應協助以青年為主體之非營利組織及社團，以及支持辦理以青年為參與客群之非營利組織及社團活動，促進青年實踐結社自由，亦鼓勵非營利組織及社團以青年為對象辦理活動，推動青年賦能。"},{"bill":"202110061560000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110061410000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"參考教育基本法第十六條、原住民族基本法第三十四條、文化基本法第二十九條以及社會福利基本法第三十條等立法體例，本法施行後，其他青年事務相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110068970000","text":"政府應設立青年發展研究機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年事務研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、為促進國家對青年了解、制定更符合青年需求之政策，政府應設立青年發展研究機構，針對青年事務收集資料、進行研究，並將數據、成果公布給全國人民、機構使用。\n二、為確保收集資料完整性，爰於第二項明定資料持有機構除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。其資料使用辦法，依相關法規為之。"},{"bill":"202110070660000","text":"本法施行後，各級政府應依本法之規定，制（訂）、修正或廢止青年事務相關法規。","note":"本法為青年事務共同性規範，青年各項權利之依據。本法施行後其他相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110071010000","text":"為於各區域推動本法所定事項，主管機關得自行或委任所屬機關（構），或委託其他機關（構）、青年發展相關民間團體設立區域青年發展組織。\n辦理前項事務所需經費，主管機關得補助之。","note":"為順利推動區域性青年發展事務，爰明定得於各區域自行或委辦成立青年發展組織。"},{"bill":"202110072290000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"一、本法施行後，青年事務相關法規之制（訂）定、修正或廢止。\n二、參考教育基本法第十六條、通訊傳播基本法第十六條、原住民族基本法第三十四條、文化基本法第二十九條及社會福利基本法第三十條等，規定本法施行後其他青年事務相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110072330000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110072870000","text":"直轄市政府、縣（市）政府應召開地方青年事務會報，由直轄市政府、縣（市）政府首長召集學者專家、相關民間團體、相關機關代表組成，審議青年政策執行計畫及其他地方青年事務重要措施，並督導執行情形。","note":"一、為落實各項青年政策工作，直轄市政府、縣（市）政府應召開地方青年事務會報。\n二、直轄市政府、縣（市）政府由其首長召集學者專家、社會團體與青年代表、相關機關代表組成，召開地方青年事務會報。\n三、地方青年事務會報組成之性別比例應依行政院性別平等政策綱領辦理，學者專家及相關民間團體應佔一定比例。"},{"bill":"202110075700000","text":"政府應設立區域性青年支持性機構，促進青年交流與合作，建立青年在地支持系統、協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年建立在地連結，關心地方議題，政府應設立區域性青年支持機構。"},{"bill":"202110076040000","text":"為於各區域推動本法所定事項，主管機關得自行或委任所屬機關（構），或委託其他機關（構）、青年發展相關民間團體設立區域青年發展組織。\n辦理前項事務所需經費，主管機關得補助之。","note":"為順利推動區域性青年發展事務，爰明定得於各區域自行或委辦成立青年發展組織。"},{"bill":"202110078370000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。\n前項青年事務研究之結果，應定期公告之。","note":"一、為使青年政策之訂定符合青年實務所需，了解青年需求與進行相關研究實屬必要。爰於第一項明定政府應設立青年研究發展機構，針對青年事務進行調查、研究、統計，並於第三項明定應將相關成果公告，以利民眾了解。\n二、第二項明定有關機關（構）除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。"},{"bill":"202110079860000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110080450000","text":"政府應設立青年研究發展機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定外，各該機關（構）不得規避、妨礙或拒絕；政府所取得之資料，其保存、利用等事項，應依相關法規為之。\n前項青年事務研究之結果，應定期公告之。","note":"一、為使青年政策之訂定符合青年實務所需，了解青年需求與進行相關研究實屬必要。爰於第一項明定政府應設立青年研究發展機構，針對青年事務進行調查、研究、統計，並於第三項明定應將相關成果公告，以利民眾了解。\n二、第二項明定有關機關（構）除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。"},{"bill":"202110085510000","text":"政府應設立區域性青年支持性機構，促進青年交流與合作，建立青年在地支持系統、協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年建立在地連結，關心地方議題，政府應設立區域性青年支持機構。"},{"bill":"202110100300000","text":"政院應考量全國青年事務發展方向，每四年發布青年政策白皮書，作為青年相關政策之施政依據。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體與青年代表之參與，廣納各界意見，研議全國青年事務，經青年國是會議討論後，由行政院核定。\n前項青年國是會議，每四年由行政院召開之。","note":"一、為確立青年政策目標、原則與成果，並因應社會變遷，明定中央應定期提出青年政策白皮書與青年發展計畫。\n二、另參考芬蘭青年法所規定，以四年為週期，發布經青年、青年工作者、學者專家與政府機關充分參與討論之政策白皮書，並以兩年為週期，擬定青年發展政策綱領。\n三、為確保各方意見表達，應由中央主管機關召開青年國是會議，保障青年參與青年政策之權利，共同提出青年政策白皮書。"},{"bill":"202110098760000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110098790000","text":"本法施行後，各級政府應依本法之規定，制訂（定）、修正或廢止青年事務相關法規。","note":"本法施行後，將為唯一青年專法，爰應依本法制訂（定）相關子法，並修正或廢止其餘青年事務之法規。"},{"bill":"202110102250000","text":"政府應設立區域性青年支持性機構，促進青年交流與合作，建立青年在地支持系統、協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年建立在地連結，關心地方議題，政府應設立區域性青年支持機構。"},{"bill":"202110103250000","text":"政府應設立區域性青年支持性機構，促進青年交流與合作，建立青年在地支持系統、協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為促進青年與在地社群的聯繫並關注地方議題，政府應設立地區性青年支持機構。"},{"bill":"202110104620000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110108760000","text":"中央主管機關為訂定、協調及管考本法相關政策，應由行政院院長召集政務委員、相關機關首長、直轄市及縣（市）政府首長、學者專家及相關民間團體，定期舉行跨部會青年事務協調會報。","note":"為有效整合資源，建立管考機制，明定由中央主管機關定期舉行跨部會青年事務協調會報。"},{"bill":"202110107570000","text":"中央主管機關應每四年召開青年國是會議。","note":"明定中央主管機關應每四年召開青年國是會議。"},{"bill":"202110123900000","text":"政府應採取具體措施鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"明定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110124800000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110124830000","text":"政府應設立青年發展研究機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年事務研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"為了更好地了解青年需求並制定相應政策，政府應設立專責的青年發展研究機構，專門針對青年事務進行研究、調查和統計，並建立青年研究資料庫，公開資料和研究成果，供政策制定、評估和學術研究使用。政府應依據法規保存和公開這些資料，並確保資料的完整性和準確性。相關機構需協助提供必要資料，除非有法律特殊規定，且不得妨礙研究人員的資料索取。所收集的資料應依照相關法規妥善保存和使用。這樣的制度將有助於基於證據和研究推動青年政策的制定，並確保政策的可行性和有效性。"},{"bill":"202110126910000","text":"各級主管機關應設置青年發展基金，辦理青年發展相關業務。\n前項基金來源如下：\n一、各級主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"明定各級主管機關應成立青年發展與基金，辦理青年相關業務。"},{"bill":"202110127050000","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，善盡全球公民責任，並鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展，爰規定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110128060000","text":"政府應採取具體措施，鼓勵青年參與國際活動與交流，強化青年國際事務知能，並對青年參與國際交流給予必要之協助。","note":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，善盡全球公民責任，並鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展，爰規定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110128180000","text":"政府應採取具體措施鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，善盡全球公民責任，同時鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展。爰於本條規定，政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110128310000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110129310000","text":"政府應設立青年發展研究機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策評量指標建置及學術研究發展之參考。\n政府為辦理青年事務研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"一、為促進國家對青年了解、制定更符合青年需求之政策，政府應設立青年發展研究機構，針對青年事務收集資料、進行研究，並將數據、成果公布給全國人民、機構使用。\n二、為確保收集資料完整性，爰於第二項明定資料持有機構除另有規定外，不得規避、妨礙或拒絕研究人員索取研究資料。其資料使用辦法，依相關法規為之。"},{"bill":"202110132300000","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"明定鼓勵青年參與國際事務。另政府鼓勵青年參與國際交流合作後之成果，得在本法所定青年週加以呈現，規定於本法第二十九條，一併敘明。"},{"bill":"202110143380000","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，善盡全球公民責任，並鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展，爰規定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110155730000","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能。\n政府並應對青年參與國際交流提供經濟、外交、文化及其他必要之協助。","note":"一、為積極推動青年參與國際事務，拓展其國際視野，並提升全球參與及競爭力，本條文第一項明定政府應採行具體措施，鼓勵青年參與國際交流合作。此旨在強化青年之國際事務與跨文化知能，使其得以善盡全球公民責任，並將所學所感落實在地行動，進而培養與國際社會接軌之能力，促進國家朝全球化發展。\n二、為確保青年得以無礙地參與國際交流活動，本條文第二項規範政府應對青年參與國際交流提供經濟、外交、文化素養及其他必要之協助。此等協助旨在降低青年參與國際交流之門檻，使其得以更順暢地拓展國際視野，累積跨文化經驗，為國家培育具備國際移動力與全球思維之人才。"},{"bill":"202110166280000","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，善盡全球公民責任，並鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展，爰規定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110169130000","text":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","note":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，善盡全球公民責任，並鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展，爰規定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。"},{"bill":"202110175160000","text":"本法自公布日施行。","note":"本法之施行日期。"}],"changed":true,"final":"政府應協助以青年為主體之非營利組織及團體之發展，或支持辦理以青年為參與對象之非營利組織及團體之活動，並制定相關獎勵、補助、空間資源及培力計畫。\n政府應鼓勵企業及社會團體善盡社會責任，共同推動青年政策。","finalWhy":"一、為協助以青年為主體之非營利組織及團體之發展，以及支持辦理以青年為參與對象之非營利組織及團體活動，促進青年社會參與，爰為第一項規定。\n二、參酌社會福利基本法第二十七條規定，為鼓勵企業及社會團體善盡社會責任，支持青年相關政策，以創造永續發展之社會，爰為第二項規定。","review":{"note":"照行政院提案通過","text":"本法自公布日施行。"}},{"no":"第二十二條","current":null,"versions":[{"bill":"201110120370000","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，防治數位暴力，並支持青年參與數位社會，提升數位素養，藉由培育數位領域人才促進數位經濟及數位產業發展，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。"},{"bill":"202110059880000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長參與。","note":"青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立管考機制，有關涉及本法事務之審議、協調等事項，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長參與。"},{"bill":"202110061410000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110068970000","text":"政府所設立之青年發展研究機構應每四年對青年身心發展、社會參與、生活及需求現況進行調查、統計及分析，並公布結果。","note":"參酌《兒童及少年福利與權益保障法》第13條「主管機關應每四年對兒童及少年身心發展、社會參與、生活及需求現況進行調查、統計及分析，並公布結果」。根據「青年議題主流化」之精神，青年事務與各部會之政策皆有關，政府所設立之青年事務研究機構應定期進行青年事務現況之調查，並公布結果。"},{"bill":"202110070660000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110071010000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110072290000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110072870000","text":"政府應設立青年事務研究機構，對青年事務現況與其他相關事項，進行研究、調查、統計，並依法規保存、公開及提供資訊，建立青年研究資料庫，提供青年政策制定、政策檢核指標建置及學術研究發展之參考。\n政府為辦理青年事務研究、調查及統計所需之必要資料，得請求有關機關（構）提供，除法律另有規定者外，各該機關（構）不得規避、妨礙或拒絕；所取得之資料，其保存、利用等事項，應依相關法規為之。","note":"為促進國家對青年狀況之理解、制定符合青年需求之政策，政府應設立青年研究發展機構，針對青年事務進行資料蒐集、研究與分析，並將數據成果公開供公眾使用，爰參照文化基本法第二十七條，訂定青年事務研究之相關事項。"},{"bill":"202110075700000","text":"政府應協助以青年為主體之非營利組織及社團發展，或支持辦理以青年為參與客群之非營利組織及社團活動，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心和參與推動青年事務，明定政府應協助以青年為主體的非營利組織及社團，並支持辦理以青年為參與客群的非營利組織或社團活動。"},{"bill":"202110076040000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110078370000","text":"政府應設立區域性青年支持性機構，促進青年交流與合作，建立青年在地支持系統、協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年建立在地連結，關心地方議題，政府應設立區域性青年支持機構。"},{"bill":"202110080450000","text":"政府應設立區域性青年支持性機構，促進青年交流與合作，建立青年在地支持系統、協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年建立在地連結，關心地方議題，政府應設立區域性青年支持機構。"},{"bill":"202110085510000","text":"政府應協助以青年為主體之非營利組織及社團發展，或支持辦理以青年為參與客群之非營利組織及社團活動，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心和參與推動青年事務，明定政府應協助以青年為主體的非營利組織及社團，並支持辦理以青年為參與客群的非營利組織或社團活動。"},{"bill":"202110100300000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110098790000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110102250000","text":"政府應協助以青年為主體之非營利組織及社團發展，或支持辦理以青年為參與客群之非營利組織及社團活動，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心和參與推動青年事務，明定政府應協助以青年為主體的非營利組織及社團，並支持辦理以青年為參與客群的非營利組織或社團活動。"},{"bill":"202110103250000","text":"政府應協助以青年為主體之非營利組織及社團發展，或支持辦理以青年為參與客群之非營利組織及社團活動，並制定相關獎勵、補助及培力計畫。","note":"為保障青年自由結社，同時鼓勵公民社會積極參與青年事務，政府應協助以青年為主體的非營利組織與社團發展，並支持舉辦針對青年的相關活動。"},{"bill":"202110108760000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110107570000","text":"中央主管機關應每四年擬定青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體及青年代表共同參與，經青年國是會議討論後，由行政院核定。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，應每四年定期提出青年政策白皮書。並於第二項明定應依據青年政策白皮書，每兩年擬定青年發展政策綱領，並報行政院核定後實施。\n二、為確保青年政策白皮書及青年發展政策綱領之訂定能夠廣納各界意見，爰於第三項明定應召集學者專家、社會團體及青年代表等共同參與，召開青年國是會議，並於第四項明定青年國是會議每四年由行政院召開之。"},{"bill":"202110123900000","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，並支持青年參與數位社會，提升數位素養，並藉由青年力量發展數位經濟、產業等領域之人才，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。"},{"bill":"202110124830000","text":"政府所設立之青年發展研究機構應每四年對青年身心發展、社會參與、生活及需求現況進行調查、統計及分析，並公布結果。","note":"根據「青年議題主流化」的理念，政府應設立專責的青年發展研究機構，每四年進行青年身心發展、社會參與、生活狀況及需求現況的調查、統計和分析，並公布結果。此舉可確保各部會在制定政策時，充分了解青年事務的現況，進而針對性地設計並推動適合的青年政策，提升政策的針對性與有效性。"},{"bill":"202110126910000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。","note":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算。\n二、為鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向，爰為第二項規定。"},{"bill":"202110127050000","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，防治數位暴力，並支持青年參與數位社會，提升數位素養，藉由培育數位領域人才促進數位經濟及數位產業發展，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。"},{"bill":"202110128060000","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，防治數位暴力，並支持青年參與數位社會，提升數位素養，藉由培育數位領域人才促進數位經濟及數位產業發展，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。"},{"bill":"202110128180000","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，並支持青年參與數位社會，提升數位素養，並藉由青年力量發展數位經濟、產業等領域之人才，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。"},{"bill":"202110129310000","text":"政府所設立之青年發展研究機構應每四年對青年身心發展、社會參與、生活及需求現況進行調查、統計及分析，並公布結果。","note":"參酌《兒童及少年福利與權益保障法》第13條「主管機關應每四年對兒童及少年身心發展、社會參與、生活及需求現況進行調查、統計及分析，並公布結果」。根據「青年議題主流化」之精神，青年事務與各部會之政策皆有關，政府所設立之青年事務研究機構應定期進行青年事務現況之調查，並公布結果。"},{"bill":"202110132300000","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。\n政府應從政策規劃、法規制定修改、產業發展布局、創新教育面向，營造友善青年的數位經濟環境，培養數位資產及智慧財產權素養，以協助青年事業發展與創新生活。","note":"一、明定青年數位平權之社會環境。\n二、青年是國家發展希望及產業所需人才，處於當今數位科技與AI時代，社會變化快速，職場競爭激烈，如何協助青年迎接挑戰，是政府責無旁貸的義務。因此政府應積極在政策、法規、教育、創業與就業輔導與服務等面向，營造支持青年的數位經濟發展的環境，並具備數位資產與智慧財產議題的理解，進而充份發揮數位轉型價值。"},{"bill":"202110143380000","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，防治數位暴力，並支持青年參與數位社會，提升數位素養，藉由培育數位領域人才促進數位經濟及數位產業發展，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。"},{"bill":"202110155730000","text":"政府應創造數位平權環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、鑑於數位社會為全球發展之趨勢，為確保青年於數位環境中享有平等機會與權益，本條文第一項明定政府應建立數位平權之社會環境，並防治數位暴力。同時，為支持青年積極參與數位社會，政府應致力提升青年數位素養，並藉由青年之力量培育數位經濟、產業等領域之人才，以因應未來社會發展需求。\n二、考量利用新興科技或前瞻科技能更有效率地或以創新模式因應社會需求，進而增進社會福祉，本條文第二項規範政府應促進青年享有學習新興科技之機會，並鼓勵青年善用前瞻科技。此舉旨在激發青年之創新潛能，鼓勵其將科技知識轉化為實際應用，共同為社會創造更多福祉。"},{"bill":"202110166280000","text":"政府應建立數位平權之社會環境，防治數位暴力，弭平數位落差，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，並弭平數位落差實現無障礙資訊社會之理想。並防治數位暴力，並支持青年參與數位社會，提升數位素養，藉由培育數位領域人才促進數位經濟及數位產業發展，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。"},{"bill":"202110169130000","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","note":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，防治數位暴力，並支持青年參與數位社會，提升數位素養，藉由培育數位領域人才促進數位經濟及數位產業發展，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。"}],"changed":true,"final":"政府應採取具體措施，鼓勵青年參與國際交流合作，強化青年國際事務與跨文化知能，並對青年參與國際交流給予經濟、外交及其他必要之協助。","finalWhy":"為積極推動青年參加國際事務，拓展青年國際視野，提升國際參與力及競爭力，善盡全球公民責任，並鼓勵青年開拓國際視野並落實在地行動，強化青年國際事務知能，培養與國際交往之能力，朝全球化發展，爰規定政府應對青年參與國際事務採取具體措施，並給予經濟上、外交上及其他必要之協助。","review":{"note":"照行政院提案通過","text":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。"}},{"no":"第二十三條","current":null,"versions":[{"bill":"201110120370000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，有效推動青年政策、法規及計畫。","note":"一、為使各級政府有效推動青年事務相關政策、法規、計畫及各項工作，爰明定各級政府應因應青年事務發展需求，建立青年事務行政體系。\n二、考量青年事務往往分屬或涉及不同機關或單位之權責，為期有效推動青年事務，青年事務行政體系包括青年事務機關或單位，及協調、統合辦理涉及青年事務之其他機關或單位，共同推動青年事務，爰為本條規定。"},{"bill":"202110059880000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"本法為青年事務共同性規範，青年各項權利之依據。本法施行後其他相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110068970000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年向下扎根，建立在地連結，關心地方議題，政府應設立區域性青年支持機構。此機構將針對青年培力，參與地方事務，善盡公民責任。"},{"bill":"202110072870000","text":"政府所設立之青年事務研究機構應每四年對青年身心發展、社會參與、生活及需求現況進行調查、統計及分析，並公布結果。","note":"參考《兒童及少年福利與權益保障法》第13條規定，青年事務與各部會之政策皆有關，爰明定政府所設立之青年事務研究機構應定期進行青年事務現況之調查，並公布結果。"},{"bill":"202110075700000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長參與。","note":"因青年政策、法規及計畫，多涉及跨部會業務，為使政策推動能夠有效整合跨部會資源，並賦予政策制定的效益目標，建立管考機制，爰有關涉及本法事務之協調事項，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長、學者專家、民間團體、直轄市及縣（市）政府首長等共同參與。"},{"bill":"202110078370000","text":"政府應協助以青年為主體之非營利組織及社團發展，或支持辦理以青年為參與客群之非營利組織及社團活動，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心和參與推動青年事務，明定政府應協助以青年為主體的非營利組織及社團，並支持辦理以青年為參與客群的非營利組織或社團活動。"},{"bill":"202110080450000","text":"政府應協助以青年為主體之非營利組織及社團發展，或支持辦理以青年為參與客群之非營利組織及社團活動，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心和參與推動青年事務，明定政府應協助以青年為主體的非營利組織及社團，並支持辦理以青年為參與客群的非營利組織或社團活動。"},{"bill":"202110085510000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長參與。","note":"因青年政策、法規及計畫，多涉及跨部會業務，為使政策推動能夠有效整合跨部會資源，並賦予政策制定的效益目標，建立管考機制，爰有關涉及本法事務之協調事項，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長、學者專家、民間團體、直轄市及縣（市）政府首長等共同參與。"},{"bill":"202110102250000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長參與。","note":"因青年政策、法規及計畫，多涉及跨部會業務，為使政策推動能夠有效整合跨部會資源，並賦予政策制定的效益目標，建立管考機制，爰有關涉及本法事務之協調事項，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長、學者專家、民間團體、直轄市及縣（市）政府首長等共同參與。"},{"bill":"202110103250000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長參與。","note":"因青年政策、法規與計畫常涉及多部門協作，為了能有效整合跨部門資源、達成政策效益目標，並建立完善的管考機制，凡與本法相關之協調事項，應由行政院長定期召開跨部會青年事務協調會議，並邀集各相關部門首長、學者專家、民間團體以及直轄市與縣（市）政府首長等共同參與。"},{"bill":"202110108760000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110107570000","text":"各級政府應寬列青年發展經費，保障專款專用，合理分配及運用，持續充實青年發展所需預算，並優先獎勵或補助經濟或社會不利處境之青年。","note":"國家應寬列青年事務預算，並應保障專款專用，俾利青年政策與事務之發展。"},{"bill":"202110123900000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，有效推動青年政策、法規及計畫。","note":"明定各級政府應因應青年事務發展需求，建立青年事務行政體系。"},{"bill":"202110124830000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為促進青年扎根地方，關心地方議題，政府應設立區域性青年支持機構。該機構將專注於青年培力，鼓勵參與地方事務，並提供跨部會資源整合，建立在地支持系統。透過這些機構，青年可獲得生涯發展、公共參與等方面的支持與服務，進一步推動青年政策的實踐。此舉不僅有助於提升青年的社會責任感，亦促進青年之間的交流與合作。"},{"bill":"202110126910000","text":"中央主管機關應每四年召開青年國是會議。","note":"明定中央主管機關應每四年召開青年國是會議。"},{"bill":"202110127050000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，有效推動青年政策、法規及計畫。","note":"一、為使各級政府有效推動青年事務相關政策、法規、計畫及各項工作，爰明定各級政府應因應青年事務發展需求，建立青年事務行政體系。\n二、考量青年事務往往分屬或涉及不同機關或單位之權責，為期有效推動青年事務，青年事務行政體系包括青年事務機關或單位，及協調、統合辦理涉及青年事務之其他機關或單位，共同推動青年事務，爰為本條規定。"},{"bill":"202110128060000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，有效推動青年政策、法規及計畫。","note":"一、為使各級政府有效推動青年事務相關政策、法規、計畫及各項工作，爰明定各級政府應因應青年事務發展需求，建立青年事務行政體系。\n二、考量青年事務往往分屬或涉及不同機關或單位之權責，為期有效推動青年事務，青年事務行政體系包括青年事務機關或單位，及協調、統合辦理涉及青年事務之其他機關或單位，共同推動青年事務，爰為本條規定。"},{"bill":"202110128180000","text":"各級政府應因應青年事務需求，應設置專責單位，有效推動青年政策、法規及計畫。","note":"一、為使各級政府有效推動青年事務相關政策、法規、計畫及各項工作，爰明定各級政府應因應青年事務發展需求，建立青年事務專責單位。\n二、考量青年事務往往分屬或涉及不同機關或單位之權責，為期有效推動青年事務，青年事務行政體系包括青年事務機關或單位，及協調、統合辦理涉及青年事務之其他機關或單位，共同推動青年事務，爰為本條規定。"},{"bill":"202110129310000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年向下扎根，建立在地連結，關心地方議題，政府應設立區域性青年支持機構。此機構將針對青年培力，參與地方事務，善盡公民責任。"},{"bill":"202110132300000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，有效推動青年政策、法規及計畫。","note":"明定青年事務行政體系。"},{"bill":"202110143380000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，有效推動青年政策、法規及計畫。","note":"一、為使各級政府有效推動青年事務相關政策、法規、計畫及各項工作，爰明定各級政府應因應青年事務發展需求，建立青年事務行政體系。\n二、考量青年事務往往分屬或涉及不同機關或單位之權責，為期有效推動青年事務，青年事務行政體系包括青年事務機關或單位，及協調、統合辦理涉及青年事務之其他機關或單位，共同推動青年事務，爰為本條規定。"},{"bill":"202110155730000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，充實相關人力，辦理人員教育訓練，提升工作品質，有效推動青年政策、法規及計畫。","note":"一、為使各級政府能有效推動青年事務相關政策、法規、計畫及各項工作，明定各級政府應因應青年事務發展需求，建立整合性青年事務行政體系。此體系旨在提升青年事務之行政效能，確保政策執行之連貫性與周延性。\n二、考量青年事務往往分屬或涉及不同機關或單位之權責，為求青年事務之有效推動，所稱「青年事務行政體系」不僅包含青年事務專責機關或單位，亦應涵蓋協調、統合涉及青年事務之其他相關機關或單位。此等跨機關協作機制之建立，旨在確保所有與青年相關之議題均能獲得統籌規劃與執行，共同致力於青年事務之全面發展。"},{"bill":"202110166280000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，有效推動青年政策、法規及計畫。","note":"明定青年事務行政體系。"},{"bill":"202110169130000","text":"各級政府應因應青年事務需求，建立青年事務行政體系，有效推動青年政策、法規及計畫。","note":"一、為使各級政府有效推動青年事務相關政策、法規、計畫及各項工作，爰明定各級政府應因應青年事務發展需求，建立青年事務行政體系。\n二、考量青年事務往往分屬或涉及不同機關或單位之權責，為期有效推動青年事務，青年事務行政體系包括青年事務機關或單位，及協調、統合辦理涉及青年事務之其他機關或單位，共同推動青年事務，爰為本條規定。"}],"changed":true,"final":"政府應建立數位平權之社會環境，防治數位暴力，支持青年積極參與數位社會，提升數位素養、培育數位領域人才。\n政府應促進青年享有學習新興科技機會，並鼓勵青年善用前瞻科技，以創造社會福祉。","finalWhy":"一、數位社會為世界發展之趨勢，為保障青年在數位環境中享有平等之機會及權益，建立數位平權之社會，防治數位暴力，並支持青年參與數位社會，提升數位素養，藉由培育數位領域人才促進數位經濟及數位產業發展，爰為第一項規定。\n二、考量利用新興科技或前瞻科技，能以更有效率或創新模式因應社會需求，增進社會福祉，爰為第二項規定。","review":{"note":"修正通過","text":"各級政府應因應青年事務需求，設置或指定青年事務專責單位，有效推動青年政策、法規及計畫。"}},{"no":"第二十四條","current":null,"versions":[{"bill":"201110120370000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。","note":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供就學、生活、就業、醫療及住宅等獎勵或補助。\n二、為鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向，爰為第二項規定。"},{"bill":"202110059880000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110068970000","text":"政府應協助以青年為主體之非營利組織及社團發展，或非營利組織及社團推動青年事務，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心與參與推動青年事務，以制定獎勵補助辦法形式協助青年參與公共事務。"},{"bill":"202110072870000","text":"政府應設立區域性青年支持機構，促進青年交流與合作，建立青年在地支持系統，協助青年生涯發展及公共參與，提供青年必要之援助與服務。","note":"為鼓勵青年向下扎根，建立在地連結，關心地方議題，爰明定政府應設立區域性青年支持機構。"},{"bill":"202110075700000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110078370000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報。\n前項青年事務協調會報，應由行政院院長擔任召集人，召集相關部會首長、學者專家、相關民間團體、政務委員、地方政府首長代表、直轄市、縣（市）政府首長及青年代表參與，青年代表不得少於三分之一。\n行政院制定重大政策、法律及計畫有影響青年發展之虞時，相關部會應於青年事務協調會報提出相關影響分析報告。","note":"一、因青年政策、法規及計畫，多涉及跨部會業務，為使政策推動能夠有效整合跨部會資源，並賦予政策制定的效益目標，建立管考機制，爰有關涉及本法事務之協調事項，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長、學者專家、民間團體、直轄市及縣（市）政府首長等共同參與。\n二、為保障青年群體之社會利益，國家制定重大政策、法律及計畫有影響青年發展之虞時，相關部會應於青年事務協調會報提出相關議案影響分析報告，評估對青年發展之影響。"},{"bill":"202110080450000","text":"行政院為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報。\n前項青年事務協調會報，應由行政院院長擔任召集人，召集相關部會首長、學者專家、相關民間團體、政務委員、地方政府首長代表、直轄市、縣（市）政府首長及青年代表參與，青年代表不得少於三分之一。\n行政院制定重大政策、法律及計畫有影響青年發展之虞時，相關部會應於青年事務協調會報提出相關影響分析報告。","note":"一、因青年政策、法規及計畫，多涉及跨部會業務，為使政策推動能夠有效整合跨部會資源，並賦予政策制定的效益目標，建立管考機制，爰有關涉及本法事務之協調事項，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長、學者專家、民間團體、直轄市及縣（市）政府首長等共同參與。\n二、為保障青年群體之社會利益，國家制定重大政策、法律及計畫有影響青年發展之虞時，相關部會應於青年事務協調會報提出相關議案影響分析報告，評估對青年發展之影響。"},{"bill":"202110085510000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110102250000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110103250000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110107570000","text":"中央主管機關為審議、協調及管考本法相關事務，應由行政院長定期召開跨部會之青年事務協調會報，召集學者專家、相關民間團體、政務委員、相關機關首長或代表、直轄市及縣（市）政府首長參與。","note":"為有效整合資源，建立管考機制，明定由中央主管機關定期舉行跨部會青年事務協調會報。"},{"bill":"202110123900000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。","note":"明定各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供就學、生活、就業、醫療及住宅等獎勵或補助，並鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向。"},{"bill":"202110124830000","text":"政府應協助以青年為主體之非營利組織及社團發展，或非營利組織及社團推動青年事務，並制定相關獎勵、補助及培力計畫。","note":"為保障青年結社自由並鼓勵青年積極參與公共事務，政府應協助以青年為主體的非營利組織及社團發展。透過制定獎勳、補助和培力計劃等措施，提供資源支持，鼓勵青年實踐結社權利，進一步促進青年之間的交流與合作，並激發其社會參與與發展潛力。此舉有助於加強青年對公共事務的關注及責任感，並推動青年事務的積極發展。"},{"bill":"202110126910000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。","note":"為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，爰為本條規定。"},{"bill":"202110127050000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。","note":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供就學、生活、就業、醫療及住宅等獎勵或補助。\n二、為鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向，爰為第二項規定。"},{"bill":"202110128060000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。","note":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供就學、生活、就業、醫療及住宅等獎勵或補助。\n二、為鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向，爰為第二項規定。"},{"bill":"202110128180000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。\n各級政府每年針對青年發展所編列的預算經費，應每年公布在網際網路平台上。","note":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供就學、生活、就業、醫療及住宅等獎勵或補助。\n二、為鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向，爰為第二項規定。\n三、為接露各級政府每年編列青年發展預算概況，增訂第三項規範各級政府應公布編列青年發展預算於網際網路上，以供各界了解青年預算編列概況。"},{"bill":"202110129310000","text":"政府應協助以青年為主體之非營利組織及社團發展，或非營利組織及社團推動青年事務，並制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民社會關心與參與推動青年事務，以制定獎勵補助辦法形式協助青年參與公共事務。"},{"bill":"202110132300000","text":"各級政府應寬列經費預算，辦理本法所定業務。\n弱勢青年之獎勵、補助、優惠、減免或其他措施，由各級政府以辦法定之。\n政府應設立青年發展基金，辦理本法所定事務，其基金管理會之委員組成，應符合第六條第二項之規定，納入青年代表。","note":"一、明定寬列經費預算於第一項。\n二、為保障經濟、社會、文化、族群、宗教、身心障礙、地域……等具特殊不利處境之弱勢青年，各級政府得制定辦法，提供各種就學、生活、就業、醫療及住宅協助等等措施。爰定於第二項。\n三、舉凡過去保障特定族群之基本法，以設立基金作為財源保障，輒有立法例，例如：原住民族基本法第十八條、客家基本法第十八條、新住民基本法第八條。為彰顯政府對青年族群之重視，特立法授權得設立基金，並為強調健全公共參與機制，其管理組織參考新住民基本法第八條第二項之立法例，規定應合乎本法第六條第二項所定，遴聘青年代表參與法規政策計畫之原則。爰定於第三項。"},{"bill":"202110143380000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。","note":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供就學、生活、就業、醫療及住宅等獎勵或補助。\n二、為鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向，爰為第二項規定。"},{"bill":"202110155730000","text":"各級政府應寬列青年事務預算，確保預算經費符合執行政策所需。\n對於處於經濟或社會不利境地之青年，應優先給予獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。\n行政院得設置青年發展基金，辦理青年發展等青年事務相關事項。\n前項青年發展基金設置辦法，由中央主管機關定之。","note":"一、為確保青年事務之推動具有穩固之財政基礎，本條文第一項及第二項明定各級政府應寬列青年事務預算，合理分配與有效運用，以持續充實青年發展所需經費。尤為重要者，針對處於經濟或社會不利境地之青年，政府應明確優先給予獎勵或補助，並提供相關優惠或減免措施，以落實社會公平正義，確保弱勢青年亦能享有平等發展之機會。\n二、為促進中央與地方政府在青年事務推動上之合作與資源整合，本條文第三項規範各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以有效推動地方青年事務發展。此機制旨在鼓勵地方政府因地制宜，發展符合在地需求之青年服務，並透過中央之財政支持，提升地方執行青年政策之能量。\n三、為因應青年政策之多元需求，並增加預算管理及運用之彈性，保障青年事務執行時之經費充裕，本條文第四項明定行政院應設置青年發展基金，專供辦理各項青年發展相關事項。此基金之設立，旨在提供穩定且具彈性之財源，以支持創新性之青年專案、長期性之青年培育計畫，以及緊急性之青年協助措施，進而提升青年事務推動之效率與效益。"},{"bill":"202110166280000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。","note":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供就學、生活、就業、醫療及住宅等獎勵或補助。\n二、為鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向，爰為第二項規定。"},{"bill":"202110169130000","text":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。","note":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供就學、生活、就業、醫療及住宅等獎勵或補助。\n二、為鼓勵直轄市、縣（市）政府積極配合各中央目的事業主管機關所定之政策方向，爰為第二項規定。"}],"changed":true,"final":"各級政府應因應青年事務需求，設置或指定青年事務專責單位，有效推動青年政策、法規及計畫。","finalWhy":"為使各級政府有效推動青年事務相關政策、法規、計畫及各項工作，並考量青年事務往往分屬或涉及不同機關或單位之權責，為期有效推動青年事務，爰於本條明定各級政府應因應青年事務發展需求，設置或指定青年事務專責單位，建立青年事務行政體系，以協調、統合辦理涉及青年事務之其他機關或單位，共同推動青年事務。","review":null},{"no":"第二十五條","current":null,"versions":[{"bill":"201110120370000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。","note":"為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，爰為本條規定。"},{"bill":"202110068970000","text":"各級政府應於本法施行後二年內依本法規定檢討所主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之。\n前項法規制（訂）定、修正或廢止前，由中央青年事務專責機關會同中央目的事業主管機關，依本法規定解釋、適用之。","note":"本法為青年事務共同性規範，青年各項權利之依據。本法施行後其他相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110072870000","text":"政府應協助以青年為主體之非營利組織及社團發展，或非營利組織及社團推動青年事務，制定相關獎勵、補助及培力計畫。","note":"為維護青年結社自由，鼓勵公民參與推動青年事務，爰明定政府應制定獎勵補助辦法，協助青年參與公共事務。"},{"bill":"202110075700000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110078370000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110080450000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110085510000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110102250000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110103250000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110107570000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110123900000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。","note":"明定政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書。"},{"bill":"202110124830000","text":"各級政府應於本法施行後二年內依本法規定檢討所主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之。\n前項法規制（訂）定、修正或廢止前，由中央青年事務專責機關會同中央目的事業主管機關，依本法規定解釋、適用之。","note":"本法為青年事務的基本規範，確立青年各項權利的法律依據。施行後，相關法規應根據需要進行相應的制定、修訂或廢止，以確保法律體系的一致性與協調性，讓青年權益達到更完善的法律保障。"},{"bill":"202110126910000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。","note":"一、為完善青年政策推動所需之基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供資訊。"},{"bill":"202110127050000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。","note":"為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，爰為本條規定。"},{"bill":"202110128060000","text":"行政院應設置青年發展基金，辦理青年發展相關事務。\n前項基金來源如下：\n一、中央主管機關循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第一項基金之設置、補助對象、申請及審查程序，及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、國家為持續協助各世代青年發展，應發展財源制度性規劃，爰於第一項明定行政院應設置青年發展基金，並於第二項定明基金來源。\n二、第三項授權中央主管機關另定青年發展基金之設置、補助對象、申請及審查程序等，及其他應遵行事項之辦法。"},{"bill":"202110128180000","text":"政府為支持青年並促進政府及社會各界共同關懷青年、青年發展及青年事務，應制定全國青年日。\n前項全國青年日之具體日期，應由政府召開青年會議，廣納青年意見後決定之。","note":"一、設立專屬節日為國家肯認族群重要性手法之一，可促進人民對於青年議題之關注。\n二、青年日主體為全國青年，應由全體青年共同決議之。"},{"bill":"202110129310000","text":"各級政府應於本法施行後二年內依本法規定檢討所主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之。\n前項法規制（訂）定、修正或廢止前，由中央青年事務專責機關會同中央目的事業主管機關，依本法規定解釋、適用之。","note":"本法為青年事務共同性規範，青年各項權利之依據。本法施行後其他相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110132300000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年發展行動綱領，列出預期成果及績效指標，經第二十七條第一項之行政院青年事務發展會報審核通過，報請行政院核定後公開，作為青年相關政策之施政依據，並由各目的事業主管機關執行。\n青年發展行動綱領經行政院核定後，應即送立法院審議。中央主管機關應按立法院審議意見修正，由行政院核定後公開並執行之。\n立法院有關委員會審查青年發展行動綱領時，得舉行公聽會。依據第六條第二項辦法遴聘之青年代表，於公聽會時有陳述意見之機會。","note":"一、本次立法主軸之一，為確立青年主體，健全參與機制，設計二個層次的青年發展行動綱領參與機制。第一層次，行政院應依據所定之辦法，聘請行政院青年事務發展會報青年代表（第六條第二項）；且政院會報之青年代表，須有一定比例，由各地方政府推派（第六條第三項）。惟各級政府會報或諮詢組織之青年代表，數量甚鉅，不無可能遺漏匯聚其意見，故設計第二層次機制彌補之。\n二、承上之第二層次，為行政院會報審核後，須將綱領送至立法院審議。一方面於綱領在立法院有關委員會審查時，規定委員會得舉行公聽會，並規定凡屬第六條第二項遴聘之青年代表，均有陳述意見之機會（可用書面陳述或列席陳述）；另一方面則規定，國發會須依立法院審議意見修正，並再由行政院核定後公布、執行；藉由立法院之審議，使依法遴聘之各級青年代表，有最大之機會參與，並使行動綱領兼具參與式民主與代議民主下之正當性，俾利作為後續各機關實施之堅實依據。\n三、本法參照氣候變遷因應法第九條第一項採行動綱領之法制文字。之所以不用白皮書之用語，蓋白皮書有政府為未來立法作業，進行公眾諮詢之意涵。惟依本次立法設計，綱領為兼具行政部門提供專業資訊研擬、青年代表參與式民主、立法院審議代議民主之權威性政策文件，定案後各部門應予實施，絕非僅是立法諮詢文件，而不宜稱為白皮書，一併敘明。綜上三點，爰定於第一項至第三項。"},{"bill":"202110143380000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。","note":"為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，爰為本條規定。"},{"bill":"202110155730000","text":"政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。\n政府應於本法施行後一年內發布青年政策白皮書，並依其執行成效及國內外情勢發展定期檢討修正之。\n各級政府應配合青年政策白皮書，檢討所主管之政策與行政措施；有不符者，應訂定、修正其相關政策及行政措施，並推動執行。","note":"一、為建立我國青年相關政策之明確施政依據與指導原則，本條文第一項明定政府應考量國家發展方向、社會需求與政策遠景，每四年擬定青年政策白皮書。此白皮書將作為青年事務之核心施政方針，並應依其績效及國內外情勢發展定期檢討修正，以確保政策之時效性與適切性。\n二、為強化法規之可預測性與穩定性，本條文第二項規定本法公布施行後，政府應於一年內發布首部青年政策白皮書。\n三、為確保青年政策白皮書之全國性推動與在地化實踐，本條文第三項明定各級政府應配合青年政策白皮書，檢討所主管之政策與行政措施。對於不符白皮書規範者，應訂定、修正其相關政策及行政措施，並積極推動執行。此舉旨在強化中央與地方之政策協調與落實，確保青年政策之效能得以全面展現。"},{"bill":"202110166280000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。","note":"為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，爰為本條規定。"},{"bill":"202110169130000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。","note":"為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，爰為本條規定。"}],"changed":true,"final":"各級政府應寬列青年發展經費。對經濟或社會不利處境之青年，應優先予以獎勵或補助，並提供相關優惠或減免措施。\n各中央目的事業主管機關得獎勵或補助直轄市、縣（市）政府，以推動青年事務發展。\n中央政府為辦理青年發展相關事項，應設置青年發展基金新臺幣一百億元，並於本法施行後五年內分年編列預算。\n前項基金來源如下：\n一、中央政府循預算程序之撥款。\n二、基金孳息。\n三、人民、事業或團體之捐助。\n四、其他收入。\n第三項基金之收支、保管及運用，及其他應遵行事項之辦法，由行政院定之。\n青年發展基金之收支、保管及運用，應設青年發展基金管理會（以下簡稱管理會），置委員十三人至十五人，其中一人為召集人，由教育部部長兼任。其餘委員由學者專家、青年代表及行政院指派相關業務單位主管代表組織之，其中學者專家及青年代表人數合計應占全體會議人數二分之一以上。\n前項學者專家、青年代表擔任之委員任期二年，期滿得續聘之，其產生程序如下：\n一、由立法院推舉十一名至十五名社會公正人士組成管理會委員審查委員會（以下簡稱審查委員會）。\n二、由行政院提名學者專家及青年代表委員候選人，提交審查委員會經全體委員二分之一以上之同意後，送請行政院院長聘任之。","finalWhy":"一、為保障推動青年事務之預算充裕，爰於第一項明定，各級政府應寬列青年發展經費，持續充實青年發展所需預算，並對經濟或社會不利處境之青年，優先提供獎勵或補助。\n二、為鼓勵直轄市、縣(市)政府積極配合各中央目的事業主管機關所定之政策方向，爰訂定第二項規定，中央目的事業主管得獎勵或補助，以推動青年事務發展。\n三、為因應青年政策需求，增加多元預算管道與預算管理及運用之彈性，爰訂定第三項，明定設置青年發展基金，辦理青年發展等相關事項。\n四、為提升青年發展基金運作之民主監督，並落實青年參政權益，爰訂定第六項，明定主管機關應設置青年發展基金管理會，納入專家學者及青年代表；並引入立法院參與之審查機制，以強化委員產生之公開性、正當性及制度信賴。","review":null},{"no":"第二十六條","current":null,"versions":[{"bill":"201110120370000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供資訊。"},{"bill":"202110068970000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110072870000","text":"各級政府應於本法施行後二年內依本法規定檢討所主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之。\n前項法規制（訂）定、修正或廢止前，由中央青年事務專責機關會同中央目的事業主管機關，依本法規定解釋、適用之。","note":"一、本法為青年事務共同性規範，青年各項權利之依據。\n二、規定本法施行後其他文化相關法規應配合制（訂）定、修正或廢止。"},{"bill":"202110078370000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110080450000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110107570000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110123900000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供青年資訊。","note":"一、第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、第二項明定中央主管機關得建立青年研究資料，依法規蒐集、處理、保存、公開及提供資訊。"},{"bill":"202110124830000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110126910000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表不得低於委員總數之二分之一。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報。\n二、另為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為落實青年參與，爰於第三項規定青年代表不得少於委員總人數之二分之一。\n四、為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第四項規定。"},{"bill":"202110127050000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供資訊。"},{"bill":"202110128060000","text":"政府應配合國家發展方向、社會需求與政策願景，每四年擬定青年政策白皮書，作為青年相關政策之施政依據，並依其績效及國內外情勢發展定期檢討修正之。\n中央主管機關應根據青年政策白皮書，每二年擬訂青年發展政策綱領，報行政院核定後實施。\n青年政策白皮書及青年發展政策綱領之訂定，應召集相關部會、學者專家、社會團體及青年代表共同參與，廣納各界意見，經青年國是會議討論後，由行政院核定。\n前項青年國是會議每四年由行政院召開之。","note":"一、為確立青年政策目標、依循原則與監督實行成果，並因應社會變遷與國際情勢發展，爰於第一項明定政府應每四年定期提出青年政策白皮書。並於第二項明定應依據青年政策白皮書，每二年擬定青年發展政策綱領，並報行政院核定後實施。\n二、為確保青年政策白皮書及青年發展政策綱領之訂定能夠廣納各界意見，爰於第三項明定應召集學者專家、社會團體及青年代表等共同參與，召開青年國是會議，並於第四項明定青年國是會議每四年由行政院召開之。"},{"bill":"202110128180000","text":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。","note":"為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，爰為本條之規定。"},{"bill":"202110129310000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110132300000","text":"主管機關應自行或委由相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，辦理研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。\n中央主管機關應每年於網站公開下列資訊之調查統計、處境分析及對策研擬，並應於青年發展行動綱領審核及審議時，彙總研擬對策：\n一、青年發展行動綱領之預期成果、績效指標及達成情形，績效指標並以成果效益型指標為宜。\n二、求學階段之青年問題。\n三、就業階段之青年問題。\n四、弱勢青年問題。\n五、社會住宅需求資訊、住宅市場資訊及其他相關之青年住宅問題。\n六、各級政府依第二十條第一項獎勵、補助或提供其他行政資源之匯總，與投入各種行政資源達成政策目標之情形。該達成政策目標之情形，宜以成果效益型指標表達。\n七、中央主管機關擬定、行政院青年事務發展會報核定、立法院審議或各方提出其他重要之青年問題。","note":"一、主管機關有義務辦理青年事務之研究、調查、統計及分析。若職權委付其他機關（構）或單位等，無論是由下級機關執行（行政程序法第十五條）、由民間團體或個人辦理（行政程序法第十六條），或由地方政府執行（地方制度法第二條第三款），均不改變法定之管轄，不改變此為國發會之法定義務，並均應由國發會踐行轉移管轄權之法制作業。法制用語上，無論職權委付對象，可以一律使用「委由……辦理」之文字（入出國及移民法第六十五條、文化資產保存法第二十一條第二項參照。）爰定於第一項。\n二、為青年政策研究調查執行之順利，並提供機關間交換資料法源依據，減少後續爭議，參照海洋基本法第十二條立法例，以法律規定之。爰定於第二項。\n三、本次立法主軸之一，在於確立青年主體，打造行政部門提供專業資訊研擬、青年代表參與式民主、立法院審議代議民主之健全參與機制。基此，國發會應扮演協調行政部門，提供專業資訊之角色，無論由國發會自行獲取，或協調其他目的事業主管機關取得，其應定期公開於網站之資訊內容，應以法律明確定之。爰定於第三項。\n四、有關本條第三項第一款青年發展行動綱領之預期成果、績效指標及達成情形，茲為健全參與機制之立法主軸，並為求更為聚焦、具體，爰制定綱領實施之整體性政策評估機制。易言之，青年發展行動綱領制定之初，就應該列入每年定期檢視是否達成之目標與指標，以發揮政策評估之功能。另該款所稱成果效益型指標，參照「行政院所屬各機關中長程個案計畫編審要點」第5點(二)之規定，中長程計畫目標以成果效益型指標表達為宜。\n五、有關本條第三項第二款至第四款所稱求學階段、就業階段、弱勢青年問題，蓋不同種類之青年主體，有其面臨之獨特問題。本次立法除透過第六條第二項青年參與機制之辦法，並細分青年種類外，亦透過國發會每年定期公開之研析資訊，指定求學、就業、弱勢三個種類之青年問題，加以調查研析。\n六、有關本條第三項第五款之青年住宅問題中，所稱社會住宅需求資訊，係我國社會住宅自民國100年推動至今，採個案完工後申請，致政府所得資料，無法全盤性掌握民眾需求，而內政部辦理「社會住宅需求調查」，又以抽樣推估，且非定期辦理。因之，民間團體屢屢倡議，建置完整的社會住宅需求登記平台，以評估社會住宅興辦戶數、供給區位、房型配比、公共設施及其他重要資訊。至於同款所稱住宅市場資訊，住宅法第四十七條有相關規定。民間團體屢屢倡議，住宅市場中之住宅，依其不同物件型態、屋齡之每坪平均數與中位數價格資訊，應予蒐集以健全政府對住宅市場之掌握，作為推動社會住宅政策之根據。\n七、有關第三項第六款之投入行政資源達成政策目標情形，係因本法第二十規定協助支持青年非營利組織，應有相應之追蹤管考機制。另該款所稱成果效益型指標，業經說明如本條說明四，可供參照。\n八、有關第三項第七款所稱中央主管機關擬訂、行政院青年事務發展會報核定、立法院審議，或各方提出其他重要之青年問題，在本法健全公共參與之主軸下，國發會之擬訂，發揮行政部門提供專業資訊之功能；政院會報之核定，有參與式民主之機能；立法院之審議，則有代議民主的制度意涵；此三方提出青年問題，即便不在本項前六款分別規定，亦應納入國發會定期研析並公開之資訊。"},{"bill":"202110143380000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供資訊。"},{"bill":"202110155730000","text":"為規劃、制定青年政策，政府應自行或委任相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項進行研究、調查、統計及分析。\n政府為執行青年研究分析，得依法蒐集、處理、保存、公開及提供青年相關資料，並得建置青年事務研究資料庫與網頁，供各相關單位使用，以作為青年政策制定、政策評量指標建置及學術研究發展之參考。","note":"一、為完善基礎資訊，本條文第一項明定政府應自行或委任相關機關（構）、學校、法人或團體，針對青年事務現況與其他相關事項，進行嚴謹之研究、調查、統計及分析。此舉旨在提供精確之數據與洞察，作為青年政策制訂之重要依據。\n二、青年政策之推動，應奠基於證據與研究，以確保政策與法規之妥適性。為確保青年研究、調查及統計資料之完整與正確性，本條文第二項規範政府為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供青年相關資訊，並應建立青年研究資料庫。"},{"bill":"202110166280000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供資訊。"},{"bill":"202110169130000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供資訊。"}],"changed":true,"final":"中央主管機關應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，報請行政院核定，作為青年相關政策之施政依據，並由各目的事業主管機關執行。\n行政院每四年召開全國青年會議，廣納各界意見，研議全國青年發展事務。","finalWhy":"一、為建立我國青年相關政策之施政依據及指導原則，政府應考量國家發展方向、社會需求及政策願景，每四年擬訂青年政策白皮書，爰為第一項規定。\n二、為定期廣納各界意見，研議全國青年發展事務，爰為第二項規定。","review":null},{"no":"第二十七條","current":null,"versions":[{"bill":"201110120370000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表不得低於委員總數之二分之一。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、另為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為落實青年參與，爰於第三項規定青年代表不得少於委員總人數之二分之一。\n四、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府亦日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第四項規定。"},{"bill":"202110072870000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110123900000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表不得低於委員總數之二分之一。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為落實青年參與，爰於第三項規定青年代表不得少於委員總人數之二分之一。\n四、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程及提供青年理性表達意見之管道，爰為第四項規定。"},{"bill":"202110126910000","text":"本法施行後，各級政府應依本法之規定，制（訂）定、修正或廢止青年事務相關法規。","note":"明定本法施行後其他青年事務相關法規應配合制（訂）定、修訂或廢止。"},{"bill":"202110127050000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表不得低於委員總數之二分之一。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、另為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為落實青年參與，爰於第三項規定青年代表不得少於委員總人數之二分之一。\n四、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府亦日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第四項規定。"},{"bill":"202110128060000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供資訊。"},{"bill":"202110128180000","text":"政府應自行或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析，同時應每年公布相關資訊。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供青年資訊。","note":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析，同時每年應公布相關資訊。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關得建立青年研究資料，依法規蒐集、處理、保存、公開及提供資訊。"},{"bill":"202110132300000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，至少每半年召開會議，審議、協調、推動及督導本法相關事務；並設青年政策專案辦公室，置專職人員，處理有關業務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，至少每半年召開會議，協調及督導本法執行情形。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。\n前三項青年代表不得低於委員總數之二分之一。","note":"本次立法主軸之一，在於確立青年主體，健全參與機制。其具體架構，為中央及地方，均有青年事務發展會報之設置，明定至少每半年須召開會議。進一步言之，如中央各目的事業主管機關，有上級機關統合、協調之必要，仍宜有行政院層級機制，基此，於行政院設青年政策專案辦公室。另外，目前各級地方政府，截至民國114年2月，全國已有21個縣市，設置青年諮詢組織，本次立法亦將諮詢組織法源依據，提升至法律位階。無論是青年事務發展會報，或青年諮詢組織，均應有相當比例之青年代表，乃屬當然，茲明定為二分之一。爰定於第一項至第四項。"},{"bill":"202110143380000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表不得低於委員總數之二分之一。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、另為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為落實青年參與，爰於第三項規定青年代表不得少於委員總人數之二分之一。\n四、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府亦日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第四項規定。"},{"bill":"202110155730000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項會報青年代表比例不得低於委員總數之二分之一；任一性別代表人數不得少於委員總數三分之一。\n行政院與中央各目的事業主管機關為協調、溝通青年政策，得與直轄市、縣（市）政府定期辦理協調會報。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、為有效整合跨部會資源，賦予青年事務政策制定功能及績效目標，並建立完善之管考機制，本條文第一項明定由行政院定期召開跨部會青年事務協調會報。此會報將召集中央目的事業主管機關首長、青年代表及專家學者共同參與，旨在對本法相關事務進行審議、協調、推動及督導，以確保青年政策之高效執行與資源之有效整合。\n二、為落實本法所定事項，並確保青年事務於地方層級得以有效推動，本條文第二項規範直轄市、縣（市）政府應設置青年事務發展會報。此會報由直轄市、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，職掌協調及督導本法於地方之執行情形，以因應在地青年需求，推動符合地方特色之青年發展措施。\n三、為落實青年參與決策之精神，本條文第三項明確規定，前二項會報之青年代表比例，不得低於委員總數之二分之一。此一保障旨在確保青年聲音能充分反映於政策審議與執行過程中，提升青年政策之民意基礎與實質效益。\n四、為更廣泛地蒐集及反映青年意見，並針對青年關注之公共政策提供策進建言，本條文第四項賦予各級政府得設置青年諮詢組織之彈性。此機制將作為政府與青年對話之橋樑，使青年意見能更即時、有效地進入政策討論與形成過程。"},{"bill":"202110166280000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表不得低於委員總數之二分之一，任一性別不得低於三分之一。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、另為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為落實青年參與，爰於第三項規定青年代表不得少於委員總人數之二分之一。\n四、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府亦日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第四項規定。"},{"bill":"202110169130000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表不得低於委員總數之二分之一。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、另為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為落實青年參與，爰於第三項規定青年代表不得少於委員總人數之二分之一。\n四、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府亦日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第四項規定。"}],"changed":true,"final":"政府應自行、委託或鼓勵相關機關（構）、學校、法人或團體對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n政府為建立青年研究分析以作為青年政策制定、政策評量指標建置及學術研究發展之參考，得依法規蒐集、處理、保存、公開及提供資訊。\n政府應每四年公布針對青年現況之統計。","finalWhy":"一、青年政策推動應建立在以證據與研究為基礎之政策及法規上，為完善基礎資訊，須仰賴精確之研究、調查及統計資料，爰於第一項明定政府應自行、委託或鼓勵相關機關（構）、學校、法人或團體針對青年事務現況及其他相關事項，進行研究、調查、統計及分析。\n二、為提供青年政策擬訂、政策評量指標建置及學術研究發展之參考，爰於第二項明定中央主管機關為建立青年研究分析，得依法規蒐集、處理、保存、公開及提供資訊。\n三、政府定期公布針對青年現況之統計，使各界了解我國青年現況，以利發展及推動青年發展事務。","review":null},{"no":"第二十八條","current":null,"versions":[{"bill":"201110120370000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110123900000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110126910000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110127050000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110128060000","text":"行政院為審議、協調、推動及督導本法相關事務，應設置青年事務發展會報，由行政院院長定期召集學者專家、民間團體或機構代表、中央目的事業主管機關首長及青年代表組成，其中青年代表不得低於委員總數之二分之一。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、民間團體或機構代表、相關局處首長及青年代表組成，協調及督導本法執行情形，其中青年代表不得低於委員總數的三分之一。\n各級政府得設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、另為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府亦日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第三項規定。"},{"bill":"202110128180000","text":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表不得低於委員總數之二分之一，單一性別不得少於三分之一，同時應每三個月召開會議，必要時得召開臨時會議。\n各級政府應設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","note":"一、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長定期召開跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、另為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為落實青年參與，爰於第三項規定青年代表不得少於委員總人數之二分之一，單一性別不得少於三分之，每三個月召開一次會議，必要時得召開臨時會議。\n四、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第四項規定。"},{"bill":"202110132300000","text":"本法施行後，各級政府應於本法施行後二年內依本法規定檢討所主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之。\n本法施行後，其他法規有關青年之規定，除對青年保障優於本法者外，優先適用本法規定。","note":"一、本法屬青年政策之基本方針，立法後尚有若干須主管機關或各目的事業主管機關，檢視修正調整法規，茲參照海洋基本法第十六條第一項，各級政府應於本法施行後二年內依本法規定檢討所主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之。爰定於第一項。\n二、本次立法之前，各級政府青年政策並無統一指導原則，因而散見於各種規定。本法旨在建立青年政策基本方針，雖各級政府於本法制定後，應依第一項，以本法之原則，限期檢討法規。惟各該法規若對青年保障優於本法，例如年齡範圍更寬，或協助措施更優惠，前此情形，無須強行更改為本法標準。爰定於第二項。"},{"bill":"202110143380000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110155730000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110166280000","text":"各級政府應於本法施行後二年內依本法規定檢討所主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之。\n前項法規制（訂）定、修正或廢止前，由中央主管機關會同中央目的事業主管機關，依本法規定解釋、適用之。","note":"一、本法屬青年政策之基本方針，立法後仍須主管機關及各目的事業主管機關檢視調整法規之內容，參酌海洋基本法第十六條第一項，各級政府應於本法施行後二年內，依本法規定檢討所主管之法規，有不符本法規定者，應制（訂）定、修正或廢止之，爰為第一項規定。\n二、依第一項規定應訂修或廢止之相關法規，於未完成法定程序前，為使青年事務能符合本法之規定，源於第二項明定中央主管機關會同中央目的事業主管機關，依本法規定解釋、適用之。"},{"bill":"202110169130000","text":"本法自公布日施行。","note":"本法之施行日期。"}],"changed":true,"final":"行政院應設置青年事務發展會報，由行政院院長召集學者專家、中央目的事業主管機關首長及青年代表組成，審議、協調、推動及督導本法相關事務，上開會報至少每半年召開一次。\n直轄市政府、縣（市）政府應設置青年事務發展會報，由直轄市政府、縣（市）政府首長召集學者專家、相關局處首長及青年代表組成，協調及督導本法執行情形。\n前二項青年代表應廣納不同背景青年，以民主機制運作為原則，且不得低於委員總數之二分之一，任一性別比例不得少於三分之一，並含括各族群為原則。\n各級政府應設置青年諮詢組織，蒐集及反映青年意見，並針對青年關注之公共政策，提供策進建言。","finalWhy":"一、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立督導機制，爰於第一項明定有關涉及本法事務之審議、協調等事項，應由行政院院長至少每半年召開一次跨部會之青年事務發展會報，並邀集學者專家、相關部會首長及青年代表共同參與、討論。\n二、為落實本法所定事項，直轄市政府、縣（市）政府亦應召開跨單位之青年事務發展會報進行討論，爰為第二項規定。\n三、為保障青年參與權益，應廣納不同背景青年，以民主機制運作為原則，爰於第三項規定青年代表不得少於委員總人數之二分之一，任一性別比例不得少於三分之一，且青年代表應以包括各族群為原則。\n四、行政院於一百零五年十一月一日成立行政院青年諮詢委員會，地方政府亦日益重視青年事務，並聆聽青年意見，截至一百十四年二月，全國已有二十一個縣市設置青年諮詢組織。為鼓勵青年參與政策制定過程，及提供青年理性表達意見之管道，爰為第四項規定。","review":null},{"no":"第二十九條","current":null,"versions":[{"bill":"202110128060000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110128180000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110132300000","text":"政府應訂定全國青年週，以彰顯青年主體及自我探索精神，促進各級政府辦理青年公共參與、青年參與國際交流合作及其呈現成果，並鼓勵各級政府機關、公民營事業機構之青年人員適度休假。","note":"參照韓國青年基本法之立法例，訂定全國青年週，深化各界對青年之重視，爰定於本條。為使青年週有實質意義，特規定於青年週由各級政府，呈現青年公共參與、國際交流之成果，以促使平時各級政府積極辦理該等事務；並明定事業及各級政府，青年人員宜於青年週期，適度休假。"},{"bill":"202110166280000","text":"本法自公布日施行。","note":"本法之施行日期。"}],"changed":true,"final":"政府應訂定全國青年日，以支持青年並提升各界對青年議題之關懷。","finalWhy":"為彰顯對青年世代之重視及支持，並提升各界對青年族群之關懷，爰於本條明定藉由訂定特定節日，以深化推展青年議題。","review":null},{"no":"第三十條","current":null,"versions":[{"bill":"202110132300000","text":"本法自公布日施行。","note":"明定本法自公布日施行。"}],"changed":true,"final":"本法自公布日施行。","finalWhy":"本法之施行日期。","review":null}],"stages":[{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110017600000","gazref":"113卷014期5196號 9-9頁"},{"date":"2024-05-03","stage":"一讀","code":"院會-11-1-12","bill":"202110040040000","gazref":"113卷035期5217號 5-5頁"},{"date":"2024-05-09","code":"公聽會-2024050338","title":"「青年基本法草案」公聽會","gazref":"113卷041期5223號 225-275頁","stage":"公聽會","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024050338/details?meetingDate=113/05/09","full":[],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/113/41/LCIDC01_1134101.pdf","p1":225,"p2":276}],"clips":[],"props":[],"tr":"tr/1.json","note":null,"mixed":[],"nspeak":26,"nmem":13,"ntable":0,"nfold":3},{"date":"2024-06-28","stage":"一讀","code":"院會-11-1-20","bill":"202110057110000","gazref":"113卷064期5246號 2-2頁"},{"date":"2024-07-05","stage":"一讀","code":"院會-11-1-21","bill":"202110059880000","gazref":"113卷066期5248號 2-2頁"},{"date":"2024-07-12","stage":"一讀","code":"院會-11-1-22","bill":"202110061560000","gazref":"113卷071期5253號一冊 12-12頁"},{"date":"2024-07-12","stage":"一讀","code":"院會-11-1-22","bill":"202110061410000","gazref":"113卷071期5253號一冊 38-38頁"},{"date":"2024-10-11","stage":"一讀","code":"院會-11-2-4","bill":"202110068970000","gazref":"113卷078期5260號 1-1頁"},{"date":"2024-10-18","stage":"一讀","code":"院會-11-2-5","bill":"20 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],

const VERB = ENACT ? '訂定' : '修正';

  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],

  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);

  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
