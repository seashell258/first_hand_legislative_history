<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>青年基本法制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

年為對話主體的政策諮詢與合作機制，促進世代合作與公共治理之進步。爰此，為強化我國青年政策之整體規劃與推動效率，整合跨部會、地方政府與民間力量，並落實「青年主流化」與「世代正義」理念，爰擬具「青年基本法草案」，作為我國青年政策發展之基本依據與施政方針。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條","第二十七條","第二十八條"]},{"id":"202110166280000","who":"委員陳菁徽等16人","date":"2025-10-28","name":"「青年基本法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110166280000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00179.pdf","proposers":["陳菁徽"],"ncosign":15,"people":[["陳菁徽","國民黨","提案"],["顏寬恒","國民黨","連署"],["鄭正鈐","國民黨","連署"],["陳超明","無黨籍","連署"],["葉元之","國民黨","連署"],["黃健豪","國民黨","連署"],["張智倫","國民黨","連署"],["牛煦庭","國民黨","連署"],["涂權吉","國民黨","連署"],["林倩綺","國民黨","連署"],["王育敏","國民黨","連署"],["吳宗憲","國民黨","連署"],["黃建賓","國民黨","連署"],["邱若華","國民黨","連署"],["魯明哲","國民黨","連署"],["呂玉玲","國民黨","連署"]],"party":[["國民黨",15],["無黨籍",1]],"reason":"本院委員陳菁徽等16人，有鑑於行政院於近年推動「青年政策白皮書」及各項跨部會之青年活動方案，惟我國現今仍缺乏上位法源依據，難以確保政策延續性。再者，我國青年政策長期以來分散於各部會與不同法規，缺乏系統性之規劃，青年在教育、就業、創業、住宅、健康及公共參與等面向，權益保障與發展資源時因制度過育鬆散而有所不足。青年世代正面臨少子化、高齡化、全球化及產業轉型等多重挑戰，其社會處境與需求更顯複雜，因此為使國家青年政策更臻明確與制度化，確保青年能在快速變動的社會環境中獲得充分支持與保障，並提升青年參與公共事務的能量，厚植國家長遠發展之基礎，爰擬具「青年基本法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條","第二十七條","第二十八條","第二十九條"]},{"id":"202110169130000","who":"委員林岱樺等18人","date":"2025-11-07","name":"「青年基本法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110169130000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00180.pdf","proposers":["林岱樺"],"ncosign":17,"people":[["林岱樺","民進黨","提案"],["吳思瑤","民進黨","連署"],["鍾佳濱","民進黨","連署"],["蔡易餘","民進黨","連署"],["賴瑞隆","民進黨","連署"],["陳秀寳","民進黨","連署"],["李坤城","民進黨","連署"],["黃秀芳","民進黨","連署"],["莊瑞雄","民進黨","連署"],["王美惠","民進黨","連署"],["陳素月","民進黨","連署"],["陳瑩","民進黨","連署"],["王義川","民進黨","連署"],["徐富癸","民進黨","連署"],["王世堅","民進黨","連署"],["陳培瑜","民進黨","連署"],["陳冠廷","民進黨","連署"],["郭昱晴","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員林岱樺等18人，鑒於「青年主流化」已成為國際趨勢，建議政府應以青年為核心主題，全面考量國家相關政策、法規及計畫，以有效促進青年健全、多元及全面性發展。此外，應提供青年參與公共事務的平台，以助力我國社會的永續發展，爰擬具「青年基本法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條","第二十七條","第二十八條"]},{"id":"202110175160000","who":"委員羅智強等16人","date":"2025-11-28","name":"「青年基本法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110175160000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00181.pdf","proposers":["羅智強","林沛祥","楊瓊瓔","游顥"],"ncosign":12,"people":[["羅智強","國民黨","提案"],["林沛祥","國民黨","提案"],["楊瓊瓔","國民黨","提案"],["游顥","國民黨","提案"],["柯志恩","國民黨","連署"],["邱鎮軍","國民黨","連署"],["林國成","民眾黨","連署"],["陳雪生","國民黨","連署"],["謝龍介","國民黨","連署"],["翁曉玲","國民黨","連署"],["徐巧芯","國民黨","連署"],["萬美玲","國民黨","連署"],["牛煦庭","國民黨","連署"],["洪孟楷","國民黨","連署"],["邱若華","國民黨","連署"],["羅廷瑋","國民黨","連署"]],"party":[["國民黨",15],["民眾黨",1]],"reason":"本院委員羅智強、林沛祥、楊瓊瓔、游顥等16人，鑒於當代青年發展需求，政府應整合資源，推動全面、平權且多元的青年政策制度。而教育為國家與青年根本，為推進青年發展與教育平權，避免青年學子陷入畢業即負債困境，政府應提供具體協助，確保其未來發展，爰擬具「青年基本法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條"]}],"arts":[{"no":"第一條","current":null,"versions":[{"bill":"202110017600000","text":"為培養青年成為國家未來主人翁，增進青年發展與福利，型塑基本素養與宏觀視野，協助其自立助人，特制定本法。","note":"闡明本法立法目的。"},{"bill":"202110040040000","text":"為保護青年權益、促進青年全面發展，提升青年教育權、就業權、健康權、公共參與權權益，特制定本法。","note":"一、明定本法立法精神及目的。\n二、為符合青年主流化之精神、整合各部會之資源，促進青年就業及創業、公共參與、就業及創業、近用醫療資源、參與文化活動、參與國際交流，爰制定本法。"},{"bill":"201110120370000","text":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，增進青年參與及履行健全民主社會公民之責任，促進國家社會永續發展，特制定本法。","note":"一、青年係促進社會進步、經濟繁榮及科技創新之關鍵動力，政府應協助青年實現個人之尊嚴及價值，保障其經營幸福生活，確保社會參與等權利，以促進青年健全、多元及全面性發展，期使青年能與其他世代共同肩負起促進社會和諧、進步之責任。\n二、鑒於青年發展涉及層面廣泛，不同領域相互間密切關聯，為達促進青年多元發展之目標，應有統合性規範，以確立推動青年事務之基本原則、政策方向及施政方針，爰制定本法。"},{"bill":"202110057110000","text":"為鼓勵青年自我實現、保障青年於社會發展之各項權利、擴大青年參與社會決策，並促進青年在政治、經濟、社會、文化等層面之積極參與，特制定本法。","note":"揭櫫本法之立法目的。"},{"bill":"202110059880000","text":"為鼓勵青年自我實現、保障青年於社會發展之各項權利、擴大青年參與社會決策，並促進青年在政治、經濟、社會、文化等層面之積極參與，特制定本法。\n青年事務，除其他基本法有特別規定者外，適用本法之規定。","note":"一、第一項揭櫫本法之立法目的。\n二、我國現有法律中不乏對青年事務規定者，為相對於本法之特別規定，為釐清本法與其他法律之適用關係，爰為第二項規定。"},{"bill":"202110061560000","text":"為保護青年發展權利、擴大青年參與決策、促進青年就業，提升青年於政治、經濟、社會、文化等各領域之生活品質，特制定本法。","note":"一、揭櫫本法立法精神及目的。\n二、考量青年政策龐雜多元，為補充共同性規範，作為各級政府推展青年事務之指引，爰制定本法。"},{"bill":"202110061410000","text":"為鼓勵青年之自我實現、保障青年於社會發展之各項權利，提升青年於政治、經濟、社會、文化等各領域之生活品質與福利，特制定本法。","note":"闡釋本法的立法精神及目的。"},{"bill":"202110068970000","text":"為保障青年發展權利、促進青年參與決策、提升青年生活品質與福利改善，並確立國家青年發展基本原則及施政方針，建立共存共榮之世代關係，特制定本法。\n青年事務，除其他基本法有特別規定者外，適用本法之規定。","note":"一、明定本法之立法目的與宗旨。\n二、青年，在生命歷程中，是從兒童轉銜至成人的關鍵階段。若無法妥善發展，可能推遲或取消後續生命事件，包含勞動、成家、生育、教養等，對於個人、社會、國家都將產生不可逆之影響，為實踐聯合國「世界青年行動綱領」（The World Programme of Action for Youth）揭櫫之政策面向，推動「青年議題主流化」，整合各部會及各級政府之力量及資源，推展青年事務之指引，爰制定本法。"},{"bill":"202110070660000","text":"為保障青年權益、促進青年發展、擴大青年參與公共政策、提升青年生活品質與改善青年社會福利，並明定國家青年發展基本原則及施政方針，特制定本法。\n青年事務，除其他基本法有特別規定者外，適用本法之規定。","note":"一、揭示本法立法目的及宗旨。\n二、聯合國於一九九五年擬定《世界青年行動綱領》（The World Programme of Action for Youth），明定十項與青年有關之重要議題，作為世界各國推動青年政策之參考依據，爰參考綱領內容制定本法。\n三、青年事務除其他基本法有特別規定外，應適用本法之規定，以明確法律適用排序。"},{"bill":"202110071010000","text":"為促進青年發展，並在青年政策與青年相關公共事務上保障青年參與，特制定本法。","note":"為鼓勵青年事務，保障青年發展與參與，提升青年對公共事務影響力以推動台灣之「青年主流化」，爰制定本法。"},{"bill":"202110072290000","text":"為保護及促進青年發展權利、擴大青年參與決策、促進青年就業，提升青年在政治、經濟、社會、文化等各領域之生活品質，特制定本法。","note":"一、揭櫫本法立法精神及目的。\n二、考量青年政策龐雜多元，為補充共同性規範，作為各級政府推展青年事務之指引，爰制定本法。"},{"bill":"202110072330000","text":"為保障青年之發展權利、決策參與、就業促進，提升青年於政治、經濟、社會、文化等各領域之生活品質與福利改善，特制定本法。","note":"闡釋立法精神及目的。"},{"bill":"202110072870000","text":"為提升青年生活品質、保障青年基本權利，促進青年參與公共事務與決策，並確立國家青年發展基本原則及施政方針，建立共存共榮之世代關係，特制定本法。\n青年事務，除其他基本法有特別規定者外，適用本法之規定。","note":"明定本法之立法目的與宗旨。"},{"bill":"202110075700000","text":"為鼓勵青年自我實現、保障青年發展權利，並促進青年在政治、經濟、社會、文化、數位科技等層面之參與，並確立國家青年發展施政方針，特制定本法。","note":"本法之立法目的。"},{"bill":"202110076040000","text":"為促進青年發展，並在青年政策與青年相關公共事務上保障青年參與，特制定本法。","note":"為鼓勵青年事務，保障青年發展與參與，提升青年對公共事務影響力以推動台灣之「青年主流化」，爰制定本法。"},{"bill":"202110078370000","text":"為鼓勵青年自我實現、保障青年發展權利，並促進青年在政治、經濟、社會、文化、數位科技等層面之參與，並確立國家青年發展施政方針，特制定本法。","note":"本法之立法目的。"},{"bill":"202110079860000","text":"為鼓勵青年之自我實現、保障青年於社會發展之各項權利，提升青年於政治、經濟、社會、文化等各領域之生活品質與福利，擴大青年參與公共政策之制定，特制定本法。","note":"本法之立法目的及宗旨。"},{"bill":"202110080450000","text":"為鼓勵青年自我實現、保障青年發展權利，並促進青年在政治、經濟、社會、文化、數位科技等層面之參與，並確立國家青年發展施政方針，特制定本法。","note":"本法之立法目的。"},{"bill":"202110085510000","text":"為鼓勵青年自我實現、保障青年發展權利，並促進青年在政治、經濟、社會、文化、數位科技等層面之參與，並確立國家青年發展施政方針，特制定本法。","note":"本法之立法目的。"},{"bill":"202110100300000","text":"為保障青年發展權利、促進青年參與決策，提升青年於政治、經濟、社會、文化等各領域之生活品質與福利改善，並確立國家青年發展基本原則及施政方針，特制定本法。","note":"明定本法之立法精神與宗旨。"},{"bill":"202110098760000","text":"為鼓勵青年自我實現，促進青年參與政治、經濟、社會、文化等領域之權利，提供青年於教育、就業、職業訓練及公共參與之機會，確立青年發展政策基本方針，特制定本法。","note":"本法之立法目的。"},{"bill":"202110098790000","text":"為保障青年經濟、社會、文化等各層面權利，並促進其身心健全發展，特制定本法。","note":"揭櫫本法之立法目的。"},{"bill":"202110102250000","text":"為鼓勵青年自我實現、保障青年發展權利，並促進青年在政治、經濟、社會、文化、數位科技等層面之參與，並確立國家青年發展施政方針，特制定本法。","note":"本法之立法目的。"},{"bill":"202110103250000","text":"為鼓勵青年自我實現、保障青年發展權利，並促進青年在政治、經濟、社會、文化、社福、醫療、數位科技等層面之參與，並確立國家青年發展施政方針，特制定本法。","note":"本法之立法目的。"},{"bill":"202110104620000","text":"為保護青年發展權利、擴大青年參與決策、促進青年就業，提升青年於政治、經濟、社會、文化等各領域之生活品質，特制定本法。","note":"一、揭櫫本法立法精神及目的。\n二、考量青年政策龐雜多元，為補充共同性規範，作為各級政府推展青年事務之指引，爰制定本法。"},{"bill":"202110108760000","text":"為鼓勵青年自我實現、保障青年發展權利，並促進青年在政治、經濟、社會、文化等層面之參與，並確立國家青年發展施政方針，特制定本法。","note":"本法之立法目的。"},{"bill":"202110107570000","text":"為鼓勵青年自我實現，促進青年於政治、經濟、社會、文化、數位科技等領域之權利與保障，提供青年於教育、就業、職業訓練及公共參與之機會，確立青年發展政策基本方針，維護青年權益及尊嚴，協助青年享有幸福生活，增進青年參與及履行作為健全民主社會公民之責任，促進國家社會永續發展，特制定本法。","note":"本法之立法目的。"},{"bill":"202110107400000","text":"為保障青年發展權利、擴大青年參與決策、促進青年就業與創業，提升青年在政治、經濟、社會、文化等領域之福祉，建立青年發展政策基本方針，特制定本法。","note":"一、本法之立法目的。\n二、因應社會與經濟變遷，青年在就業、創業及決策參與等方面面臨挑戰，需透過法律保障其權益並促進發展。本法旨在確立國家對青年的責任，保障青年各項權利，並提供發展支持。\n三、確立青年發展政策，提供政府施政依據；擴大青年決策參與，促進世代公平；提升就業與創業機會，增強競爭力；改善青年福祉，促進社會永續發展；本法參考國際經驗並結合國情，期望建立完善制度，讓青年成為國家發展的重要力量。"},{"bill":"202110109830000","text":"為保障青年之權利及發展，促進青年參與決策，提升青年生活品質與福利改善，確立國家青年發展的基本原則與施政方針，特制定本法。\n青年事務，其他法律有特別規定者，適用其規定。","note":"一、本法之立法目的，第一項。\n二、我國現行法律不乏青年事務之規定，為釐清本法與其他法律之適用關係，爰青年事務，其他法律有特別規定者，適用其規定，明定第二項規定。"},{"bill":"202110123900000","text":"為推動青年發展，維護青年權益，協助青年自我實現，增進青年公共參與及履行公民之責任，促進國家社會永續發展，特制定本法。","note":"明定本法之立法目的。"},{"bill":"202110124800000","text":"為保護青年發展權利、擴大青年參與決策、促進青年就業，提升青年於政治、經濟、社會、文化等各領域之生活品質，特制定本法。","note":"本法之立法目的。"},{"bill":"202110124830000","text":"為保障青年發展權利、促進青年參與決策、提升青年生活品質與福利改善，並確立國家青年發展基本原則及施政方針，建立共存共榮之世代關係，特制定本法。\n青年事務，除其他基本法有特別規定者外，適用本法之規定。","note":"本法立法目的及宗旨"},{"bill":"202110126910000","text":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，增進青年參與及履行健全民主社會公民之責任，促進國家社會永續發展，特制定本法。","note":"本法之立法目的。"},{"bill":"202110127050000","text":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，增進青年參與及履行健全民主社會公民之責任，促進國家社會永續發展，特制定本法。","note":"一、青年係促進社會進步、經濟繁榮及科技創新之關鍵動力，政府應協助青年實現個人之尊嚴及價值，保障其經營幸福生活，確保社會參與等權利，以促進青年健全、多元及全面性發展，期使青年能與其他世代共同肩負起促進社會和諧、進步之責任。\n二、鑒於青年發展涉及層面廣泛，不同領域相互間密切關聯，為達促進青年多元發展之目標，應有統合性規範，以確立推動青年事務之基本原則、政策方向及施政方針，爰制定本法。"},{"bill":"202110128060000","text":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，增進青年參與及履行健全民主社會公民之責任，促進國家社會永續發展，特制定本法。","note":"一、青年係促進社會進步、經濟繁榮及科技創新之關鍵動力，政府應協助青年實現個人之尊嚴及價值，保障其經營幸福生活，確保社會參與等權利，以促進青年健全、多元及全面性發展，期使青年能與其他世代共同肩負起促進社會和諧、進步之責任。\n二、鑒於青年發展涉及層面廣泛，不同領域相互間密切關聯，為達促進青年多元發展之目標，應有統合性規範，以確立推動青年事務之基本原則、政策方向及施政方針，爰制定本法。"},{"bill":"202110128180000","text":"為保障青年發展權利，促進其參與決策，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，特制定本法，以明定國家青年發展之基本原則及施政方針。\n青年事務，除其他法規有特別規定者外，適用本法之規定。","note":"一、明定本法之立法目的與宗旨。\n二、為實踐聯合國「世界青年行動綱領」（The World Programme of Action for Youth）揭櫫之政策面向，推動「青年議題主流化」，整合各部會及各級政府之力量及資源，推展青年事務之指引，爰制定本法。"},{"bill":"202110128310000","text":"為保障青年之基本權益，促進其全面發展與社會參與，強化國家對青年政策之規劃與執行責任，促進世代正義與永續發展，特制定本法。","note":"本條為立法目的。青年是社會進步、經濟繁榮與科技創新的關鍵動力，政府有責任協助青年實現其人格尊嚴與價值，保障其追求幸福生活及參與社會的權利。同時，青年應與其他世代共同承擔起促進社會和諧與進步的責任。因此，有必要制定統合性的青年基本法，作為各領域推動青年發展與「青年主流化」之依據，明確國家在青年事務上的基本原則與政策方向。立法目的在於強化青年權益保障，提升青年參與公共事務的實質機會，落實世代間的公平正義，並確保國家永續發展。此立法理念與韓國《青年基本法》強調保障青年幸福生活權利並履行公民責任之宗旨相呼應，也符合芬蘭《青年法》所倡導之跨世代團結與永續發展原則。為達上述目的，爰訂定本法。"},{"bill":"202110129310000","text":"為保障青年發展權利、促進青年參與決策、提升青年生活品質與福利改善，並確立國家青年發展基本原則及施政方針，建立共存共榮之世代關係，特制定本法。\n青年事務，除其他基本法有特別規定者外，適用本法之規定。","note":"一、明定本法之立法目的與宗旨。\n二、青年，在生命歷程中，是從兒童轉銜至成人的關鍵階段。若無法妥善發展，可能推遲或取消後續生命事件，對於個人、社會、國家都將產生不可逆之影響，為實踐聯合國「世界青年行動綱領」（The World Programmeof Action for Youth）揭櫫之政策面向，推動「青年議題主流化」，整合各部會及各級政府之力量及資源，推展青年事務之指引，爰制定本法。"},{"bill":"202110132300000","text":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有身心健康、幸福生活，增進並健全青年政治參與權利與公共參與機制，促進國家社會之多元族群文化發展、合理資源分配、居住正義暨永續發展，落實世代正義，特制定本法。","note":"一、明確揭示本次立法目的。過去青年政策散見於各種法規，缺乏指導性整體方針。基此，從個人層次權利利益、機制化之政治與公共參與，到客觀國家社會發展等身心靈全面之探索，均與青年發展相關，爰定於本條。\n二、有關身心健康、政治參與、公共參與、永續發展世代正義，本法均有專條規範（第十三條、第十九條、第六條及第七條），茲於本次立法目的明確揭示。\n三、有關落實世代正義，112年2月15日總統公布氣候變遷因應法修正條文，第1條立法目的於該次修正，納入「落實世代正義」，其提案之說明即為：「……為表達我國呼應《聯合國氣候變遷綱要公約》（下稱UNFCCC）及其協議或相關國際公約決議事項之立場與作為，保障未來世代生存權益，爰於立法目的新增落實世代正義。」為求立法間之一致，並強調環境永續政策（本法第七條）與青年世代正義之間呼應、關聯，爰於本次立法目的納入。"},{"bill":"202110143380000","text":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，促進青年身心健康、營造育兒友善、運動參與之環境，增進青年參與及履行健全民主社會公民之責任，促進國家社會永續發展，特制定本法。","note":"一、青年係促進社會進步、經濟繁榮及科技創新之關鍵動力，政府應協助青年實現個人之尊嚴及價值，保障其經營幸福生活，確保社會參與等權利，以促進青年健全、身心健康、多元及全面性發展，並營造有利於育兒支持、運動參與的社會環境，期使青年能與其他世代共同肩負起促進社會和諧、進步之責任。\n二、鑒於青年發展涉及層面廣泛，不同領域相互間密切關聯，為達促進青年多元發展之目標，應有統合性規範，以確立推動青年事務之基本原則、政策方向及施政方針，爰制定本法。"},{"bill":"202110155730000","text":"為保障青年發展權利、協助青年自我實現、享有幸福生活、增進青年參與及履行作為健全民主社會公民之責任，促進國家社會永續發展，特制定本法。","note":"一、本法立法精神及目的。\n二、考量青年政策多元廣泛，為達促進青年多元發展目標，制定統合性規範，確立推動青年事務之基本原則、政策方向及施政方針，爰制定本法。"},{"bill":"202110166280000","text":"為推動青年發展，維護青年權益，協助青年自我實現，增進青年公共參與，促進國家社會永續發展，特制定本法。","note":"本法之立法目的。"},{"bill":"202110169130000","text":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，增進青年參與及履行健全民主社會公民之責任，促進國家社會永續發展，特制定本法。","note":"一、青年係促進社會進步、經濟繁榮及科技創新之關鍵動力，政府應協助青年實現個人之尊嚴及價值，保障其經營幸福生活，確保社會參與等權利，以促進青年健全、多元及全面性發展，期使青年能與其他世代共同肩負起促進社會和諧、進步之責任。\n二、鑒於青年發展涉及層面廣泛，不同領域相互間密切關聯，為達促進青年多元發展之目標，應有統合性規範，以確立推動青年事務之基本原則、政策方向及施政方針，爰制定本法。"},{"bill":"202110175160000","text":"為確立青年發展政策基本方針，鼓勵青年自我實現，促進青年參與政治、經濟、社會、文化等領域之權利，拓展青年於教育、就業、職業訓練及公共參與之機會，解決青年低薪、青年居住不正義等青年發展困境，特制定本法。","note":"本法之立法目的。"}],"changed":true,"final":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，增進青年參與及履行健全民主社會公民之責任，落實世代正義，促進國家社會永續發展，特制定本法。","finalWhy":"一、青年係促進社會進步、經濟繁榮及科技創新之關鍵動力，政府應協助青年實現個人之尊嚴及價值，保障其經營幸福生活，確保社會參與等權利，包括青年享有未來社會及環境之永續、學習及受教育權利、就業及職涯發展、創新及創業、在地支持系統、居住權益及友善育兒環境、身心健康、友善平權環境、參與運動及技能發展、享有藝文教育、參與各項文化藝術活動之機會、達成經濟獨立、培養金融素養、促進青年公共參與，並鼓勵青年參與國際交流合作、積極參與數位社會、運用新興科技等，以促進青年健全、多元及全面性發展，期使青年能與其他世代共同肩負起促進社會和諧、進步之責任。\n二、鑒於青年發展涉及層面廣泛，不同領域相互間密切關聯，為達促進青年多元發展之目標，應有統合性規範，以確立推動青年事務之基本原則、政策方向及施政方針，爰制定本法。","review":{"note":"修正通過","text":"為推動青年發展，維護青年權益及尊嚴，協助青年自我實現、享有幸福生活，增進青年參與及履行健全民主社會公民之責任，落實世代正義，促進國家社會永續發展，特制定本法。"}},{"no":"第二條","current":null,"versions":[{"bill":"202110017600000","text":"本法所稱青年，指具有中華民國國籍且在國內設有戶籍，年滿十五歲以上三十五歲以下之人。","note":"參照104年4月30日院臺教字第1040018574號函，青年發展政策綱領的對象年齡是15歲至35歲。"},{"bill":"202110040040000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"201110120370000","text":"本法所稱青年，指十八歲以上三十五歲以下之國民；其他法令就青年年齡之範圍另有規定者，從其規定。","note":"一、鑒於行政院一百零四年四月三十日核定「青年發展政策綱領」所稱青年為十五歲至三十五歲，及行政院青年諮詢委員會之青年代表為十八歲以上三十五歲以下之本國籍在學學生或社會青年，並審酌兒童及少年福利與權益保障法已明定兒童及少年指未滿十八歲之人，爰明定本法所稱青年為十八歲至三十五歲。\n二、復考量各部會及直轄市、縣（市）政府於擬訂、執行青年相關政策或計畫時，其適用之年齡範圍或有從十五歲至四十五歲等不同實際需求，為利政策推動，爰於後段明定其他法令就青年年齡之範圍另有規定者，從其規定。另所稱法令，包括法律、法規命令、行政規則、自治條例、自治規則等，併予敘明。"},{"bill":"202110057110000","text":"本法用詞，定義如下：\n一、青年：指我國十八歲以上至三十五歲以下之人。\n二、青年事務：指與青年有關之公共事務。\n三、青年發展：指透過保護青年的權利、擴張、擴大參與決策過程、促進其就業、使其發展能力、增進福祉等，提升青年在政治、經濟、社會、文化等所有領域之生活品質。\n四、青年政策：指中央與地方政府以青年發展為主要目標所施行的政策。","note":"一、本法之用詞定義與範圍。\n二、參採行政院青年諮詢委員會設置要點中，青年代表委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。\n三、考量青年事務部分具普世人權性質，如文化之體驗、國際事務交流等，他國青年亦得參與及享有權利；部分屬我國國民才得以享有之權利或參與之決策，如優惠我國國民之社會福利政策等。我國青年基本法應區分出應優先保障我國青年之處，爰於文字中將青年定義在「我國」青年。\n四、依據《聯合國發展權利宣言》，國家有權利和義務制定發展政策，保障每個人發展均等和公平享有發展所帶來的利益，爰為第三款之規定。"},{"bill":"202110059880000","text":"本法用詞，定義如下：\n一、青年：指我國十八歲以上至三十五歲以下之人。但在其他法令與條例中，對青年之年齡另有規定者，從其規定。\n二、青年事務：指與青年有關之公共事務。\n三、青年發展：指透過保護青年的權利、擴張、擴大參與決策過程、促進其就業、使其發展能力、增進福祉等，提升青年在政治、經濟、社會、文化等所有領域之生活品質。\n四、青年政策：指中央與地方政府以青年發展為主要目標所施行的政策。\n五、青年援助：指為使青年發展而提供給青年的社會性、經濟性之支援。","note":"一、本法之用詞定義與範圍。\n二、參採行政院青年諮詢委員會設置要點中，青年代表委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。另參照韓國法制，考量可能其他法令對於青年之年齡劃分有特殊考量，故於其他法令另有規定者，從其規定。\n三、考量到青年事務部分具普世人權性質，如文化之體驗、國際事務交流等，他國青年亦得參與及享有權利；部分屬我國國民才得以享有之權利或參與之決策，如優惠我國國民之社會福利政策等。我國青年基本法應區分出應優先保障我國青年之處，爰於文字中將青年定義在「我國」青年。\n四、依據《聯合國發展權利宣言》，國家有權利和義務制定發展政策，保障每個人發展均等和公平享有發展所帶來的利益，爰為第三款之規定。"},{"bill":"202110061560000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等各領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、鑑於我國現行法制政策與各國相關法制政策對青年之定義見解分歧，爰參採行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。\n三、依聯合國1986年決議通過之發展權宣言，其核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，爰為第二款規定。"},{"bill":"202110061410000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等領域之生活品質與福利。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法所稱之青年，參採行政院青年諮詢委員會委員年齡的定義。\n二、第二款規定係按1986年12月4日聯合國發展權利宣言，參考其「以人為本、於經濟、社會、文化和政治等領域的發展」之內涵。"},{"bill":"202110068970000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指確保青年充分參與、促進並享受經濟、社會、文化和政治發展，使青年獲得所有人權和基本自由的充分實現。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、鑑於我國現行法制政策與各國相關法制政策對青年之定義見解分歧，爰參採行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。\n三、依聯合國《發展權利公約》，明定「發展權」人權規定「每個人和所有各國人民均有權參與、促進並享受經濟、社會、文化和政治發展，在這種發展中，所有人權和基本自由都能獲得充分實現。」為青年發展之定義。"},{"bill":"202110070660000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指保障青年權益、擴大青年參與公共政策、提升青年經濟、社會、文化與政治等各面向之福利，並使青年充分實現各項權利。\n三、青年事務：指與青年有關之公共事務。","note":"一、明定本法用詞定義與範圍。\n二、第一款參採行政院青年諮詢委員會委員之年齡範圍，以十八歲以上至三十五歲以下之人為本法所指之青年。\n三、第二款為協助青年發展，應於各面向保障青年之權益。包含落實青年參與公共政策、提升青年之生活福利，並落實青年各項權利之實現，爰明定之。"},{"bill":"202110071010000","text":"本法用詞定義如下：\n一、青年：指十五歲以上至三十四歲以下之人。\n二、青年發展：指保障青年權利、促進青年公共參與，協助青年追求自我實現。\n三、青年政策：指以青年為主要對象或攸關於青年發展之政策。\n四、青年法規：指以青年為主要對象或攸關於青年發展之法規。\n五、青年事務：指以青年為主要對象或攸關於青年發展之公共事務。\n六、青年主流化：指在政府資源之分配、政策制定與公共事務之推動，均應充分掌握青年現況，並以青年角度評估、衡量所產生之影響，使免於產生對青年發展不利之結果。","note":"一、為完善青年公共參與，保障各年齡層表意權，爰參照勞動基準法對合法工作年齡之規定，將年齡下限定為十五歲。\n二、參照二零一五年行政院《青年發展政策綱領》與韓國《青年基本法》，將年齡上限定為三十四歲以下。\n三、參考韓國《青年基本法》，對青年政策、法規與青年事務進行定義。\n四、對青年主流化予以定義。"},{"bill":"202110072290000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至三十五歲以下之人；其他法律對青年年齡另有規定者，從其規定。\n二、青年發展：指提升青年在政治、經濟、社會、文化等各領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、鑑於我國現行法制政策與各國相關法制政策對青年之定義見解分歧，爰參採行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。另參採韓國法制，考量可能其他法令對於青年之年齡劃分有特殊考量，故於其他法令另有規定者，從其規定。\n三、依聯合國1986年決議通過之發展權宣言，所謂青年發展，其核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，爰為第二款規定。"},{"bill":"202110072330000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"參採行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。\n第二款規定依聯合國1986年決議通過之發展權宣言，核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」。"},{"bill":"202110072870000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指透過保障青年權利，擴大其決策參與，並促進其就業與能力，以提升其政治、經濟、社會、文化等福祉及生活品質之改善。\n三、青年事務：指與青年有關之公共事務。\n四、青年政策：指各級政府以青年發展為主要目標所施行之政策。","note":"一、本法之用詞定義與範圍。\n二、參酌聯合國兒童權利公約定義18歲以下為兒童，兒童及少年福利與權益保障法定義之兒童及少年為未滿18歲之人，另參酌青年政策綱領、行政院青年諮詢委員會與各地方政府規範青年諮詢代表年齡上限，以18至35歲作為青年之定義。\n三、參酌聯合國《發展權利公約》定義之「發展權」將促進並享受經濟、社會、文化和政治發展等福祉納入青年發展之定義。"},{"bill":"202110075700000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110076040000","text":"本法用詞定義如下：\n一、青年：指十五歲以上至三十四歲以下之人。\n二、青年發展：指保障青年權利、促進青年公共參與，協助青年追求自我實現。\n三、青年政策：指以青年為主要對象或攸關於青年發展之政策。\n四、青年法規：指以青年為主要對象或攸關於青年發展之法規。\n五、青年事務：指以青年為主要對象或攸關於青年發展之公共事務。\n六、青年主流化：指在政府資源之分配、政策制定與公共事務之推動，均應充分掌握青年現況，並以青年角度評估、衡量所產生之影響，使免於產生對青年發展不利之結果。","note":"一、為完善青年公共參與，保障各年齡層表意權，爰參照勞動基準法對合法工作年齡之規定，將年齡下限定為十五歲。\n二、參照二零一五年行政院《青年發展政策綱領》與韓國《青年基本法》，將年齡上限定為三十四歲以下。\n三、參考韓國《青年基本法》，對青年政策、法規與青年事務進行定義。\n四、對青年主流化予以定義。"},{"bill":"202110078370000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110079860000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等領域之生活品質與福利。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法所稱之青年，參採行政院青年諮詢委員會委員之年齡定義，訂為十八歲以上至三十五歲以下。\n二、為保障青年各面向之權益，協助青年發展與落實青年參與公共政策制定之權利，明定青年發展與青年事務之定義與範疇。"},{"bill":"202110080450000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110085510000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"本法之主管機關。"},{"bill":"202110100300000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指確保青年充分參與、促進並享受經濟、社會、文化和政治發展，使青年獲得所有人權和基本自由的充分實現。\n三、青年事務：指與青年有關之公共事務。","note":"一、明定本法之用詞定義。\n二、依行政院青年諮詢委員會設置要點，十八歲以上三十五歲以下之國民為本法之青年。\n三、依聯合國1986年決議通過之發展權宣言，所謂青年發展，其核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，爰為第二款規定。"},{"bill":"202110098760000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110098790000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上三十五歲以下之國民。\n二、青年發展：指提升青年於經濟、社會、文化等各領域之生活品質，並促進其社會參與，增進其福祉。\n三、青年事務：指與青年相關之公共事務。\n四、青年政策：指以青年為主體所實施之政策。\n五、青年援助：指為提升青年生活品質，並促其發展，所提供之經濟性援助。","note":"一、明定本法之用詞定義。\n二、依行政院青年諮詢委員會設置要點，十八歲以上三十五歲以下之國民為本法之青年。\n三、參酌韓國《青年基本法》、芬蘭《青年法》皆有明定青年政策、青年事務等規範，爰訂定相關名詞作為本法之主軸。"},{"bill":"202110102250000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110103250000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110104620000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等各領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、鑑於我國現行法制政策與各國相關法制政策對青年之定義見解分歧，爰參採行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。\n三、依聯合國1986年決議通過之發展權宣言，其核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，爰為第二款規定。"},{"bill":"202110108760000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110107570000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關、權責範圍。"},{"bill":"202110107400000","text":"本法用詞定義如下：\n一、青年：指年滿十八歲至三十五歲之國民。\n二、青年發展：指提升青年於政治、經濟、社會、文化等領域之生活品質，並促進其福利與權益保障。\n三、青年事務：指與青年相關之公共政策與事務，包括但不限於教育、就業、創業、公共參與、社會支持及權益保障等。","note":"一、明定本法之用詞定義。\n二、青年年齡範圍參考國際慣例及我國相關政策設計，設定為十八歲至三十五歲，兼顧青年生涯發展的各階段。\n三、青年發展與青年事務之定義，涵蓋多面向內容，強調青年政策之整合性與多元性，作為後續政策規劃與執行的依據。"},{"bill":"202110109830000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指確保青年充分參與、促進並享受經濟、社會、文化和政治發展，使青年獲得所有人權和基本自由的充分實現。\n三、青年事務：指與青年有關之公共事務。\n四、培力計畫：指為提升青年在政策參與、決策過程中所需的知識、技能與能力，所設立的教育與支持計畫，增強其公共事務參與及影響政策制定的能力。","note":"一、本法之用詞定義與範圍。\n二、參採行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。\n三、明訂青年發展、青年事務及培力計畫之定義，以明確相關法條之規定意旨。\n四、所謂培力計畫，指為提升青年在政策參與、決策過程中所需的知識、技能與能力，所設立的教育與支持計畫，增強其公共事務參與及影響政策制定的能力。例如透過審議民主、問題分析、數位技能等專業訓練與資源支援，協助青年掌握公共事務所需的知識與技能，增強其自主解決問題的能力，並推動社會創新發展。"},{"bill":"202110123900000","text":"本法所稱青年，指十八歲以上三十五歲以下之國民。但其他法令另有規定者，從其規定。","note":"一、明定本法關於青年之定義。\n二、依行政院一百零四年四月三十日院臺教字第一○四○○一八五七四號函核定之「青年發展政策綱領」，青年為十五歲至三十五歲，及行政院青年諮詢委員會之青年代表為十八歲以上三十五歲以下之本國籍在學學生或社會青年，爰明定本法之青年為十八歲至三十五歲。"},{"bill":"202110124800000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等各領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、我國青年之定義與各國相關政策有所差異，依照行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。\n三、依聯合國1986年決議通過《發展權利宣言》，確立發展權成為不可被剝奪的人權內涵。其核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，因此於第二款訂定。"},{"bill":"202110124830000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至四十五歲以下之人。\n二、青年發展：指提升青年於經濟、社會、文化和政治等領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、鑑於我國現行法制政策與各國相關法制政策對青年之定義見解分歧，同時考量醫療科技發展迅速、國人平均餘命日漸增長，爰參採青年創業貸款資格，適用對象為年滿十八歲以上至四十五歲以下之人。"},{"bill":"202110126910000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關、權責範圍。"},{"bill":"202110127050000","text":"本法所稱青年，指十八歲以上三十五歲以下之國民；其他法令就青年年齡之範圍另有規定者，從其規定。","note":"一、鑒於行政院一百零四年四月三十日核定「青年發展政策綱領」所稱青年為十五歲至三十五歲，及行政院青年諮詢委員會之青年代表為十八歲以上三十五歲以下之本國籍在學學生或社會青年，並審酌兒童及少年福利與權益保障法已明定兒童及少年指未滿十八歲之人，爰明定本法所稱青年為十八歲至三十五歲。\n二、復考量各部會及直轄市、縣（市）政府於擬訂、執行青年相關政策或計畫時，其適用之年齡範圍或有從十五歲至四十五歲等不同實際需求，為利政策推動，爰於後段明定其他法令就青年年齡之範圍另有規定者，從其規定。另所稱法令，包括法律、法規命令、行政規則、自治條例、自治規則等，併予敘明。"},{"bill":"202110128060000","text":"本法所稱青年，指十八歲以上四十五歲以下之國民；其他法令就青年年齡之範圍另有規定者，從其規定。","note":"一、目前我國法律已針對不同年齡層做出相關規範：包括，對十二歲以下的兒童及十二至十八歲的少年，制定有《兒童及少年福利與權益保障法》和《兒童及少年未來教育與發展帳戶條例》；對四十五歲以上的中高齡與高齡者，制定有《中高齡者及高齡者就業促進法》和《老人福利法》。因此本法應針對十八歲至四十五歲的青年，制定政策專法。\n二、另參考農業發展條例施行細則第十八條將青年定義為十八歲以上、四十五歲以下，以及青年創業貸款年齡標準亦定為十八至四十五歲，本法第一款特別規定，青年係指年滿十八歲但未滿四十五歲者。"},{"bill":"202110128180000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。\n二、青年發展：指提升青年於政治、經濟、社會、教育、文化等領域之權利與保障。\n三、青年事務：指與青年有關之公共事務。","note":"一、明定本法之用詞定義與範圍。\n二、參採行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。"},{"bill":"202110128310000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上三十五歲以下之國民，其他法令就青年年齡之範圍另有規定者，從其規定。\n二、青年發展：指提升青年於經濟、社會、文化等各領域之生活品質，並促進其社會參與，增進其福祉。\n三、青年事務：指與青年相關之公共事務。\n四、青年政策：指以青年為主體所實施之政策。","note":"本條為適用對象之定義。一方面考量行政院「青年發展政策綱領」將青年界定為十五歲至三十五歲，惟鑑於《兒童及少年福利與權益保障法》已將未滿十八歲者定義為少年兒童，本法乃將青年明確界定為十八歲以上至三十五歲以下之國民，以避免與兒少保護法制重疊。同時尊重各領域實務需求，若其他法令針對青年年齡有特殊規定（例如某些就業、教育或青年福利措施涵蓋十五歲以上或延伸至四十歲等情形），則優先適用該等規定，以維持相關政策彈性。本項所稱「法令」包括法律、命令及地方自治法規等。此規定亦參考韓國《青年基本法》對青年年齡之劃定（19至34歲）並允許其他法規有不同年齡適用之彈性。"},{"bill":"202110129310000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上至三十五歲以下之人。但其他法令另有規定者，得向下延伸至十五歲以上或向上延伸至四十五歲以下之人。\n二、青年發展：指確保青年充分參與、促進並享受經濟、社會、文化和政治發展，使青年獲得所有人權和基本自由的充分實現。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、鑑於我國現行法制政策與各國相關法制政策對青年之定義見解分歧，爰參採行政院青年諮詢委員會委員之年齡定義，以十八歲以上至三十五歲以下之人為本法所稱之青年。但依特定政策目的及性質，其他法令另有規定者，得向下延伸至十五歲以上或向上延伸至四十五歲以下之人。\n三、此外，為保障在臺交流、學習、就業、居留乃至定居與歸化之各國青年，依政策性質受本法保障可能，後再依政策目的及性質以法令區分適用對象，參照兒童及少年權益保障法對兒童及少年定義，將本法所稱青年定義為一定年齡之人，不受國籍或戶籍限制。\n四、依聯合國《發展權利公約》，明定「發展權」人權規定「每個人和所有各國人民均有權參與、促進並享受經濟、社會、文化和政治發展，在這種發展中，所有人權和基本自由都能獲得充分實現。」為青年發展之定義。\n五、青年事務，指與青年有關之公共事務。"},{"bill":"202110132300000","text":"本法所稱之青年，指十六歲以上三十五歲以下之國民。\n本法所稱之弱勢青年，係指經濟、社會、文化、族群、宗教、身心障礙、地域，或其他領域不利處境之青年。","note":"一、經查行政院青年諮詢委員會，青年代表為十八歲以上三十五歲以下之本國國民，本次制定本法，酌予下修為十六歲，以擴大青年參與。爰定於第一項前段。\n二、承上，下修調整之原因，一方面參考勞動基準法第四十四條第二項，16歲已是非童工而可合法僱用之年齡；再者，依據政黨法第十一條第二項，16歲即可加入政黨；又一方面，大多已就讀高級中學，公共參與之必要亦增加。\n三、青年當中之弱勢青年，有特別保障之必要，須於本法加以定義。本法設計三種方式予以協助：青年代表須包括弱勢青年、各級政府制定各種措施辦法，及每年公開弱勢青年問題調查研析。另外，定義之細節，以第六條第二項由國家發展委員會制定參與機制之辦法，一併敘明。爰明定於第二項。\n四、承上，弱勢青年係針對各種領域之不利處境所設定義，參酌社會包容（social inclusion）之學理，對處於不利條件之個人或族群，提高其參與社會之機會、能力與尊嚴，爰參考社會福利基本法第三條、第四條，將經濟、社會、文化、族群、宗教、身心障礙、地域等例示納入，一併說明。"},{"bill":"202110143380000","text":"本法所稱青年，指十八歲以上三十五歲以下之國民；其他法令就青年年齡之範圍另有規定者，從其規定。","note":"一、鑒於行政院一百零四年四月三十日核定「青年發展政策綱領」所稱青年為十五歲至三十五歲，及行政院青年諮詢委員會之青年代表為十八歲以上三十五歲以下之本國籍在學學生或社會青年，並審酌兒童及少年福利與權益保障法已明定兒童及少年指未滿十八歲之人，爰明定本法所稱青年為十八歲至三十五歲。\n二、復考量各部會及直轄市、縣（市）政府於擬訂、執行青年相關政策或計畫時，其適用之年齡範圍或有從十五歲至四十五歲等不同實際需求，為利政策推動，爰於後段明定其他法令就青年年齡之範圍另有規定者，從其規定。另所稱法令，包括法律、法規命令、行政規則、自治條例、自治規則等，併予敘明。"},{"bill":"202110155730000","text":"本法用詞定義如下：\n一、青年：指十八歲以上至四十五歲以下之國民。\n二、青年發展：指提升青年於政治、經濟、社會、文化等各領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、現行我國法制對於特定年齡區間之國民已有明確規範。針對未滿十二歲之兒童及十二歲以上未滿十八歲之少年，設有《兒童及少年福利與權益保障法》及《兒童及少年未來教育與發展帳戶條例》等專屬立法，以保障其權益。而對於四十五歲以上之中高齡及高齡者，亦有《中高齡者及高齡者就業促進法》與《老人福利法》等制度性保障。然而，綜觀我國現行法規，針對十八歲至未滿四十五歲之青年族群，仍獨缺專屬之法律規範，此一法制空白亟需填補。為明確界定青年之範疇，以利後續相關政策及法規之制定與推動，本提案爰參酌現行法規中對青年定義之援例，包括：《農業發展條例施行細則》第十八條：該條文所稱青年，係指十八歲以上、四十五歲以下者。青年創業貸款適用之年齡標準亦明定適用對象為十八歲至四十五歲之國民。考量上述既有之政策定義及實務運用，本提案於第一款明確規定青年之年齡為十八歲以上，未滿四十五歲之人。此定義之確立，旨在為未來青年相關法規之建構提供堅實之基礎，俾利政府資源之有效配置與青年權益之全面保障。\n三、第三款明定青年事務之定義。"},{"bill":"202110166280000","text":"本法所稱青年，指十八歲以上三十五歲以下之國民；其他法令就青年年齡之範圍另有規定者，從其規定。","note":"一、鑒於行政院一百零四年四月三十日核定「青年發展政策綱領」所稱青年為十五歲至三十五歲，並審酌兒童及少年福利與權益保障法已明定兒童及少年指未滿十八歲之人，爰明定本法所稱青年為十八歲至三十五歲。\n二、復考量各部會及直轄市、縣（市）政府於擬訂、執行青年相關政策或計畫時，其適用之年齡範圍或有從十五歲至四十五歲等不同實際需求，為利政策推動，爰於後段明定其他法令就青年年齡之範圍另有規定者，從其規定。另所稱法令，包括法律、法規命令、行政規則、自治條例、自治規則等，併予敘明。"},{"bill":"202110169130000","text":"本法所稱青年，指十八歲以上三十五歲以下之國民；其他法令就青年年齡之範圍另有規定者，從其規定。","note":"一、鑒於行政院一百零四年四月三十日核定「青年發展政策綱領」所稱青年為十五歲至三十五歲，及行政院青年諮詢委員會之青年代表為十八歲以上三十五歲以下之本國籍在學學生或社會青年，並審酌兒童及少年福利與權益保障法已明定兒童及少年指未滿十八歲之人，爰明定本法所稱青年為十八歲至三十五歲。\n二、復考量各部會及直轄市、縣（市）政府於擬訂、執行青年相關政策或計畫時，其適用之年齡範圍或有從十五歲至四十五歲等不同實際需求，為利政策推動，爰於後段明定其他法令就青年年齡之範圍另有規定者，從其規定。另所稱法令，包括法律、法規命令、行政規則、自治條例、自治規則等，併予敘明。"},{"bill":"202110175160000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"}],"changed":true,"final":"本法所稱青年，指十八歲以上三十五歲以下之國民；其他法令就青年年齡之範圍另有規定者，從其規定。","finalWhy":"一、鑒於行政院一百零四年四月三十日核定「青年發展政策綱領」所稱青年為十五歲至三十五歲，及行政院青年諮詢委員會之青年代表為十八歲以上三十五歲以下之本國籍在學學生或社會青年，並審酌兒童及少年福利與權益保障法已明定兒童及少年指未滿十八歲之人，爰明定本法所稱青年為十八歲至三十五歲。\n二、復考量各部會及直轄市、縣(市)政府於擬訂、執行青年相關政策或計畫時，其適用之年齡範圍或有從十五歲至四十五歲等不同實際需求，為利政策推動，爰於後段明定其他法令就青年年齡之範圍另有規定者，從其規定。另所稱法令，包括法律、法規命令、行政規則、自治條例、自治規則等，併予敘明。","review":{"note":"保留，送院會處理","text":""}},{"no":"第三條","current":null,"versions":[{"bill":"202110017600000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n前二項主管機關及各目的事業主管機關權責劃分如下：\n一、主管機關：主管青年權益保障之規劃、推動及監督等事項。\n二、衛生主管機關：主管青年預防保健、心理衛生與醫療之規劃、推動及監督等事項。\n三、教育主管機關：主管青年教育規劃、推動及監督等事項。\n四、勞工主管機關：主管青年就業促進與協助青年取得專門職業資格及技術人員證照之規劃、推動及監督等事項。\n五、住宅主管機關：主管提供青年銀髮公共社會住宅、購租屋協助之規劃及推動事項。\n六、交通主管機關：主管青年搭乘大眾運輸工具之規劃、推動及監督等事項。\n七、金融主管機關：主管本法相關個人儲蓄帳戶、優惠存款、投資與提升財金素養措施之規劃、推動及監督等事項。\n八、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"明定本法主管機關與各目的事業主管機關針對青年發展政策應辦理事項。"},{"bill":"202110040040000","text":"本法用詞定義如下：\n一、青年：本法所稱青年，指十八歲以上至三十五歲以下之人。\n二、青年發展：指提升青年教育權、就業權、健康權、公共參與權等基本權益。\n三、青年事務：指與青年有關之公共事務。","note":"一、本法之用詞定義與範圍。\n二、根據兒童權利公約定義，十八歲以下為兒童。另參酌行政院青年諮詢委員會所規範的青年諮詢代表年齡上限，以十八歲以上三十五歲以下之人為本法所定義之青年。"},{"bill":"201110120370000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。\n主管機關與各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年職涯探索與職業訓練之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、創業資金取得、培訓課程、諮詢輔導與育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅與購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪與暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業與外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞與創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養與財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與與數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"一、第一項明定本法所稱主管機關。\n二、鑒於青年事務涉及各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動青年相關之政策及業務，爰為第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及經濟部於推動就業及創業相關業務時，應特別協助青年取得創業資金、進行職業訓練等，爰為第三項規定。\n四、為利共同推動青年事務，爰於第四項明定主管機關及各目的事業主管機關之權責分工。"},{"bill":"202110057110000","text":"本法所稱主管機關，在中央為青年事務專責機關；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項涉及其他目的事業主管機關業務時應配合辦理。","note":"明定本法主管機關。"},{"bill":"202110059880000","text":"本法所稱主管機關：在中央為青年事務專責單位；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法所涉及主管機關。"},{"bill":"202110061560000","text":"政府應確保青年政策形成之公正與公開透明，並建立青年參與之常設機制，於制（訂）定青年政策、法律與計畫時，應保障青年參與之權利。","note":"青年族群作為青年政策最直接之利害關係人，為使政策制定更為週詳，爰訂定本條，揭示政府應制定青年政策之參與程序，保障青年參與權利，使青年政策、法律及計畫形成過程更為公正與透明，並參採利害關係人意見。"},{"bill":"202110061410000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110068970000","text":"本法所稱主管機關：在中央為青年事務專責部會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法所涉及主管機關。"},{"bill":"202110070660000","text":"本法所稱主管機關：在中央為青年事務專責部會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n中央主管機關為辦理青年發展相關政策，應會商中央各該主管機關辦理之。","note":"一、第一項明定本法之主管機關。\n二、第二項明定中央主管機關為推動青年發展相關之政策，應會商中央各該主管機關研議青年發展政策之訂定、執行、預算等相關行政辦理事項，以順利推動青年發展政策。"},{"bill":"202110071010000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n主管機關應推動成立青年專責機關並輔導直轄市、縣（市）政府設立青年專責機關。","note":"一、為使本法能順利執行，本法之主管機關在現階段定為教育部。\n二、第一項之規定乃參考芬蘭《青年基本法》之主管機關為「教育及文化部」。\n三、本條第二項明定教育部應推動成立青年專責機關，以在未來作為本法之主管機關。"},{"bill":"202110072290000","text":"本法之主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。","note":"本法之主管機關。"},{"bill":"202110072330000","text":"政府應確保青年政策形成之公正與公開透明，並建立青年參與之常設機制，於制（訂）定青年政策、法律與計畫時，保障青年參與之權利。","note":"政府應保障青年參與權利，並須採利害關係人之意見。"},{"bill":"202110072870000","text":"國家應確保青年政策形成之公正與公開透明，並建立青年參與之常設機制。\n國家制（訂）定青年政策及相關法規，應保障青年參與之權利。","note":"為保障青年參政權，制（訂）定青年政策或推動青年事務需重視青年表意權。"},{"bill":"202110075700000","text":"本法所定事項，涉及各中央目的事業主管機關職掌者，各該主管機關應配合辦理。","note":"明定本法所涉之中央目的事業主管機關及權責內容，例如：內政主管機關：住宅政策；經濟主管機關：創業相關事務；勞動主管機關：就業相關事項；教育主管機關、衛生福利主管機關、文化主管機關、數位主管機關等。"},{"bill":"202110076040000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n主管機關應推動成立青年專責機關並輔導直轄市、縣（市）政府設立青年專責機關。","note":"一、為使本法能順利執行，本法之主管機關在現階段定為教育部。\n二、第一項之規定乃參考芬蘭《青年基本法》之主管機關為「教育及文化部」。\n三、本條第二項明定教育部應推動成立青年專責機關，以在未來作為本法之主管機關。"},{"bill":"202110078370000","text":"中央主管機關為辦理本法所定之青年發展相關政策，應會商各該目的事業主管機關，由主管機關配合辦理之。","note":"明定中央主管機關為推動青年發展之相關政策，應會商中央各該目的事業主管機關，研議青年政策之訂定，例如：住宅相關政策及補貼，應與內政部共同商討；青年創業貸款政策，應與經濟主管機關共同商討；就業及輔導政策，應與勞動主管機關共同商討等。"},{"bill":"202110079860000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"本法之主管機關。"},{"bill":"202110080450000","text":"中央主管機關為辦理本法所定之青年發展相關政策，應會商各該目的事業主管機關，由主管機關配合辦理之。","note":"明定中央主管機關為推動青年發展之相關政策，應會商中央各該目的事業主管機關，研議青年政策之訂定，例如：住宅相關政策及補貼，應與內政部共同商討；青年創業貸款政策，應與經濟主管機關共同商討；就業及輔導政策，應與勞動主管機關共同商討等。"},{"bill":"202110085510000","text":"本法所定事項，涉及各中央目的事業主管機關職掌者，各該主管機關必要時應協同辦理。","note":"明定本法所涉之中央目的事業主管機關及權責內容。"},{"bill":"202110100300000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n主管機關應推動成立青年專責機關並輔導直轄市、縣（市）政府設立青年專責機關。","note":"一、為使本法能順利執行，本法之主管機關在現階段定為教育部。\n二、第一項之規定乃參考芬蘭《青年基本法》之主管機關為「教育及文化部」。\n三、本條第二項明定教育部應推動成立青年專責機關，以在未來作為本法之主管機關。"},{"bill":"202110098760000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿四十歲之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等領域之權利與保障。\n三、青年事務：指與青年有關之公共事務。\n四、青年政策：指政府以青年發展為主要目標所施行之政策。","note":"明定本法之用詞定義與範圍。"},{"bill":"202110098790000","text":"本法所稱主管機關：在中央為青年事務專責單位；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定各級主管機關，以明權責。"},{"bill":"202110102250000","text":"本法所定事項，涉及各中央目的事業主管機關職掌者，各該主管機關應配合辦理。","note":"明定本法所涉之中央目的事業主管機關及權責內容，例如：內政主管機關：住宅政策；經濟主管機關：創業相關事務；勞動主管機關：就業相關事項；教育主管機關、衛生福利主管機關、文化主管機關、數位主管機關等。"},{"bill":"202110103250000","text":"本法所定事項，涉及各中央目的事業主管機關職掌者，各該主管機關應配合辦理。","note":"明定本法所涉之中央目的事業主管機關及權責內容，例如：內政主管機關：住宅政策；經濟主管機關：創業相關事務；勞動主管機關：就業相關事項；教育主管機關、衛生福利主管機關、文化主管機關、數位主管機關等。"},{"bill":"202110104620000","text":"政府應確保青年政策形成之公正與公開透明，並建立青年參與之常設機制，於制（訂）定青年政策、法律與計畫時，應保障青年參與之權利。","note":"青年族群作為青年政策最直接之利害關係人，為使政策制定更為周詳，爰訂定本條，揭示政府應制定青年政策之參與程序，保障青年參與權利，使青年政策、法律及計畫形成過程更為公正與透明，並參採利害關係人意見。"},{"bill":"202110108760000","text":"本法所定事項，涉及各中央目的事業主管機關職掌者，由各目的事業主管機關辦理。","note":"明定中央目的事業主管機關應辦理本法所涉之事項。"},{"bill":"202110107570000","text":"本法所定事項，涉及各中央目的事業主管機關職掌者，由各目的事業主管機關辦理。各目的事業主管機關應就其主管事務，積極推展及執行青年相關政策、法規及計畫。","note":"明定本法所涉之中央目的事業主管機關及權責內容，例如：內政主管機關：住宅政策；經濟主管機關：創業相關事務；勞動主管機關：就業相關事項；教育主管機關、衛生福利主管機關、文化主管機關等。"},{"bill":"202110107400000","text":"本法所稱主管機關如下：\n一、在中央為青年事務之專責機關。\n二、在直轄市為直轄市政府。\n三、在縣（市）為縣（市）政府。","note":"一、為統籌規劃與推動全國青年政策，需明確中央及地方各級政府之職責分工。\n二、中央應設立具統籌功能之青年事務專責機關，負責整體政策方向與資源分配；地方政府則依其管轄範圍推動相關青年事務，確保政策落實至地方層級。\n三、本條確立中央與地方協同治理之制度基礎，提升政策執行效能與一致性。"},{"bill":"202110109830000","text":"本法之主管機關，在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明訂本法之主管機關。"},{"bill":"202110123900000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展及執行青年相關政策、法規及計畫。\n第一項及第二項主管機關及各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年取得專門職業資格與技術人員證照之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、協助青年取得創業資金、培訓課程、諮詢輔導及育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅及購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪、暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業、外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞及創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養及財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與及數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"明定本法之主管機關及各目的事業主管機關之權責劃分。"},{"bill":"202110124800000","text":"政府應確保青年政策形成之公正與公開透明，並建立青年參與之常設機制，於制（訂）定青年政策、法律與計畫時，應保障青年參與之權利。","note":"為使政策制定更為完善周詳，政府制定青年政策之參與程序，應保障青年參與權利，使青年政策、法律及計畫形成過程更為公正與透明，並參採利害關係人意見。"},{"bill":"202110124830000","text":"本法所稱主管機關：在中央為青年事務專責部會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法之主管機關。"},{"bill":"202110126910000","text":"本法所定事項，涉及各中央目的事業主管機關職掌者，由各目的事業主管機關辦理。各目的事業主管機關應就其主管事務，積極推展及執行青年相關政策、法規及計畫。","note":"明定本法所涉之中央目的事業主管機關及權責內容，例如：內政主管機關：住宅政策；經濟主管機關：創業相關事務；勞動主管機關：就業相關事項；教育主管機關、衛生福利主管機關、文化主管機關等。"},{"bill":"202110127050000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。\n主管機關與各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年職涯探索與職業訓練之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、創業資金取得、培訓課程、諮詢輔導與育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅與購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪與暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業與外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞與創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養與財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與與數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"一、第一項明定本法所稱主管機關。\n二、鑒於青年事務涉及各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動青年相關之政策及業務，爰為第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及經濟部於推動就業及創業相關業務時，應特別協助青年取得創業資金、進行職業訓練等，爰為第三項規定。\n四、為利共同推動青年事務，爰於第四項明定主管機關及各目的事業主管機關之權責分工。"},{"bill":"202110128060000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。","note":"一、第一項明定本法所稱主管機關。\n二、鑒於青年事務涉及各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動青年相關之政策及業務，爰為第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及經濟部於推動就業及創業相關業務時，應特別協助青年取得創業資金、進行職業訓練等，爰為第三項規定。"},{"bill":"202110128180000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關執掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展及執行青年相關政策法規、計畫及研究。\n第一項及第二項主管機關及各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年取得專門職業資格與技術人員證照、規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、協助青年取得創業資金、培訓課程、諮詢輔導及育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅及購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、內政主管機關：青年人身安全維護、防制詐騙、預防犯罪、暴力防制之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業、外交之規劃、推動及監督等事項。\n八、教育主管機關：青年教育權益、教育資源可近性、適性發展、多元學習環境及教育參與之規劃、推動及監督等事項。\n九、文化主管機關：青年文化參與、欣賞及創作、規劃、推動及監督等事項。\n十、金融主管機關：青年金融商品、服務措施、金融素養及財務管理能力之規劃、推動及監督等事項。\n十一、數位主管機關：青年數位素養、數位參與及數位產業發展之規劃、推動及監督等事項。\n十二、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十三、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"一、第一項明定本法所稱之主管機關。\n二、鑒於青年事務涉及中央各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動與青年相關之政策及業務，爰明定第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及經濟部於推動就業及創業相關業務時，應特別協助青年取得創業資金、進行職業訓練等，爰明定第三項。\n四、為利共同推動青年事務，爰於第四項明定主管機關及各目的事業主管機關之權責分工。"},{"bill":"202110128310000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。主管機關與各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年職涯探索與職業訓練之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、創業資金取得、培訓課程、諮詢輔導與育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅與購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪與暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業與外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞與創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養與財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與與數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"本條說明主管機關及相關權責劃分。第一項明定本法中央及地方之主管機關，係配合現行我國青年事務治理架構，由中央教育部統籌，全國各地方政府執行。各部會均應將青年觀點融入其政策與法規（跨部門合作），積極推動與青年相關之業務。中央主管機關則負責統整協調，確保各部門履行青年發展責任。例如勞動主管機關應著重青年就業權益保障、經濟主管機關推動青年創新創業、內政主管機關強化青年住宅及治安保障、衛生福利主管機關維護青年身心健康等，皆須依本法原則辦理。此種權責劃分方式，旨在確立各級政府共同促進青年發展之體制，亦符合德國「青年政策為全政府共同責任」的架構精神。各目的事業主管機關履行職務時，當特別關注青年需求，使青年政策在各領域落實。"},{"bill":"202110129310000","text":"本法所稱主管機關：在中央為青年事務專責部會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"明定本法所涉及主管機關。"},{"bill":"202110132300000","text":"本法所稱主管機關，在中央為國家發展委員會，在直轄市為直轄市政府，在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。","note":"一、青年政策，若劃定某一政策領域主管機關，諸如教育、產業或勞動機關，難免將產生其他部會被動、推託之效應，不利青年政策之推動。基此，本法考量國家發展委員會掌理社會發展、人力資源、管制考核等事項（該會組織法第二條第四款、第六款及第九款參照），規定由該會擔任主管機關。爰明定於第一項。\n二、其他各政策領域之目的事業主管機關，應辦理各該職掌。爰明定於第二項。"},{"bill":"202110143380000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。\n主管機關與各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年職涯探索與職業訓練之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、創業資金取得、培訓課程、諮詢輔導與育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅與購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪與暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業與外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞與創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養與財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與與數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"一、第一項明定本法所稱主管機關。\n二、鑒於青年事務涉及各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動青年相關之政策及業務，爰為第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及經濟部於推動就業及創業相關業務時，應特別協助青年取得創業資金、進行職業訓練等，爰為第三項規定。\n四、為利共同推動青年事務，爰於第四項明定主管機關及各目的事業主管機關之權責分工。"},{"bill":"202110155730000","text":"本法所稱主管機關：在中央為行政院；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n各目的事業主管機關應就其主管事務，推展及執行青年相關政策、法規及計畫。\n第一項及第二項主管機關及各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、教育主管機關：青年之高等教育、技術職業教育、產學合作輔導、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文等之推動及監督事項。\n三、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年取得專門職業資格與技術人員證照之規劃、推動及監督等事項。\n四、經濟主管機關：青年創新、創業、協助青年取得創業資金、培訓課程、諮詢輔導及育成之規劃、推動及監督等事項。\n五、住宅主管機關：青年居住權益、公共社會住宅及購租屋協助之規劃、推動及監督等事項。\n六、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n七、警政主管機關：青年人身安全維護、詐騙防制、犯罪預防、暴力防治、推動及監督等事項。\n八、運動主管機關：青年運動之發展、教育、競技、產業、外交之規劃、推動及監督等事項。\n九、文化主管機關：青年文化參與、欣賞及創作之規劃、推動及監督等事項。\n十、金融主管機關：青年金融商品、服務措施、金融素養及財務管理能力之規劃、推動及監督等事項。\n十一、數位主管機關：青年數位素養、數位參與及數位產業發展之規劃、推動及監督等事項。\n十二、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十三、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"一、明定本法之主管機關。鑒於青年之發展實為國家永續成長與進步之基石，為充分體現政府對青年事務之高度重視及資源整合之決心，本法爰將主管機關明定為行政院。此一設置旨在提升青年政策於國家整體施政之位階，確保各部會間之橫向協調與資源統合得以有效執行，進而完善青年發展之政策擘劃與推動。\n二、鑒於青年事務涉及中央各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動與青年相關之政策及業務，爰明定第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及教育部於推動就業相關業務時，應特別協助青年技術職業教育、產學合作輔導、職業訓練、青年勞動權益等，爰明定第三項。\n四、為利共同推動青年事務，爰於第四項明定主管機關及各目的事業主管機關之權責分工。"},{"bill":"202110166280000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。\n主管機關與各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年職涯探索與職業訓練之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、創業資金取得、培訓課程、諮詢輔導與育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅與購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪與暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業與外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞與創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養與財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與與數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"一、第一項明定本法所稱主管機關。\n二、鑒於青年事務涉及各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動青年相關之政策及業務，爰為第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及經濟部於推動就業及創業相關業務時，應特別協助青年取得創業資金、進行職業訓練等，爰為第三項規定。\n四、為利共同推動青年事務，爰於第四項明定主管機關及各目的事業主管機關之權責分工。"},{"bill":"202110169130000","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。\n主管機關與各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年職涯探索與職業訓練之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、創業資金取得、培訓課程、諮詢輔導與育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅與購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪與暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業與外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞與創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養與財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與與數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。","note":"一、第一項明定本法所稱主管機關。\n二、鑒於青年事務涉及各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動青年相關之政策及業務，爰為第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及經濟部於推動就業及創業相關業務時，應特別協助青年取得創業資金、進行職業訓練等，爰為第三項規定。\n四、為利共同推動青年事務，爰於第四項明定主管機關及各目的事業主管機關之權責分工。"},{"bill":"202110175160000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，指十八歲以上三十五歲以下之國民。其他法令就青年年齡之範圍另有規定者，從其規定。\n二、青年發展：指提升青年於政治、經濟、社會、文化、居住等領域之權利與保障。\n三、青年事務：指與青年有關之公共事務。\n四、青年政策：指政府以青年發展為主要目標所施行之政策。","note":"明定本法之用詞定義與範圍。"}],"changed":true,"final":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。\n主管機關與各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年職涯探索與職業訓練之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、創業資金取得、培訓課程、諮詢輔導與育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅與購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪與暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業與外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞與創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養與財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與與數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。","finalWhy":"一、第一項明定本法所稱主管機關。\n二、鑒於青年事務涉及各目的事業主管機關之權責，且現行實務上各目的事業主管機關均有推動青年相關之政策及業務，爰為第二項規定。\n三、為使各目的事業主管機關於履行其職務時，特別關注青年議題，例如，勞動部及經濟部於推動就業及創業相關業務時，應特別協助青年取得創業資金、進行職業訓練等，爰為第三項規定。\n四、為利共同推動青年事務，爰於第四項明定主管機關及各目的事業主管機關之權責分工。","review":{"note":"照行政院提案通過","text":"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關職掌者，由各目的事業主管機關辦理。\n各目的事業主管機關應就其主管事務，推展與執行青年相關政策、法規及計畫。\n主管機關與各目的事業主管機關之權責劃分如下：\n一、主管機關：青年權益保障之規劃、推動及監督等事項。\n二、勞動主管機關：青年就業促進、勞動權益、就業環境、協助青年職涯探索與職業訓練之規劃、推動及監督等事項。\n三、經濟主管機關：青年創新、創業、創業資金取得、培訓課程、諮詢輔導與育成之規劃、推動及監督等事項。\n四、住宅主管機關：青年居住權益、公共社會住宅與購租屋協助之規劃、推動及監督等事項。\n五、衛生主管機關：青年心理衛生、健康促進、生育與醫療之規劃、推動及監督等事項。\n六、警政主管機關：青年人身安全維護、防制詐騙、預防犯罪與暴力防治之規劃、推動及監督等事項。\n七、運動主管機關：青年運動之發展、教育、競技、產業與外交之規劃、推動及監督等事項。\n八、文化主管機關：青年文化參與、欣賞與創作之規劃、推動及監督等事項。\n九、金融主管機關：青年金融商品、服務措施、金融素養與財務管理能力之規劃、推動及監督等事項。\n十、數位主管機關：青年數位素養、數位參與與數位產業發展之規劃、推動及監督等事項。\n十一、科技主管機關：青年新興與前瞻科技運用之規劃、推動及監督等事項。\n十二、其他措施由各相關目的事業主管機關依職權規劃辦理。"}},{"no":"第四條","current":null,"versions":[{"bill":"202110017600000","text":"下列事項，由中央主管機關掌理：\n一、全國性青年發展政策、法規與方案之規劃、釐定及宣導事項。\n二、對直轄市、縣（市）政府執行青年發展政策之監督及協調事項。\n三、中央青年發展經費之分配及補助事項。\n四、國際青年發展業務之聯繫、交流及合作事項。\n五、其他全國性青年發展之策劃及督導事項。","note":"規定中央主管機關職掌事項，俾供中央主管機關據以規劃、推動各項青年發展措施。"},{"bill":"202110040040000","text":"本法所定事項，涉及中央各目的事業主管機關職掌者，其權責劃分如下：\n一、勞動主管機關：青年勞動權益、就業環境、職涯輔導之規劃、推動及監督事項。\n二、經濟主管機關：青年創新及創業之規劃、推動及監督事項。\n三、教育主管機關：青年就學環境、學生權益之規劃、推動及監督事項。\n四、內政主管機關：青年居住政策之規劃、推動及監督事項。\n五、衛生福利主管機關：青年健康權及醫療保健服務之研議及推動。\n六、文化主管機關：青年文化生活開創及參與之推動。\n七、外交主管機關：青年國際參與及事務交流事項之推廣。\n八、國家發展事務主管機關：青年公共參與及賦權之規劃、推動及監督事項。\n九、其他相關事項，由相關中央目的事業主管機關依職權辦理。\n中央主管機關為推動青年整體政策、方案、分工及預算，應會商中央目的事業主管機關辦理。","note":"為使政策制定更為周詳，明定本法所定事項之主管機關權責劃分。"},{"bill":"201110120370000","text":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"一、鑒於涉及青年事務相關事項，有須由中央政府通盤考量、統合辦理或具全國一致性規範之必要，爰明定中央政府應落實之事項，俾由中央政府據以統籌、規劃、協調及推動各項青年發展措施。\n二、另因青年發展相關經費，係由中央各目的事業主管機關本於職權編列，例如，青年創業貸款、青年購屋貸款、青年租金補貼等，爰於第三款明定中央政府應就不同事項之青年發展經費進行分配及補助，併予敘明。"},{"bill":"202110057110000","text":"各級政府為確保青年政策、法規及計畫形成之公正與公開透明，應建立青年參與之常設機制。\n各級政府設置前項常設機制，應遴聘（派）青年代表、學者或專家、民意代表、團體代表辦理；其中遴聘青年代表之比例，不得少於三分之一。\n前項之代表，單一性別不得少於三分之一。","note":"一、青年政策之形成應透過常態性機制予以落實及推動。\n二、青年作為青年政策最直接影響者，又因青年已具相當程度推進社會發展之力量，為使政策之制定更為周詳，應保障青年多元意見參與決策之形成，爰訂定本條。\n三、為落實主權在民之民主精神，與保障青年參政權，制定青年政策或推動青年事務需重視青年表意，需有青年代表參與決策會議，以表政府對青年意見之保障。"},{"bill":"202110059880000","text":"政府應確保青年政策、法規及計畫形成之公正與公開透明，並建立青年參與之常設機制。\n前項常設機制，應有青年參與之保障。\n地方政府應積極建立青年參與之機制，並以法規另定之。","note":"一、青年政策之形成應透過常態性機制予以落實及推動。\n二、青年作為青年政策最直接影響者，又因青年已具相當程度推進社會發展之力量，為使政策之制定更為周詳，應保障多元之青年意見參與決策之形成，爰訂定本條。\n三、為落實主權在民之民主精神，與保障青年參政權，制定青年政策或推動青年事務需重視青年表意，且需有一定比例青年代表參與決策會議，以表政府對青年意見之保障。"},{"bill":"202110061560000","text":"政府應致力促進青年就業及創業，提高青年就業品質，改善就業及創業環境，強化青年職涯發展。","note":"「經濟社會文化權利國際公約」第四條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利，第七條亦明定人人有權享受公平與良好之工作條件，爰訂定本條，揭示政府應促進青年就業及創業、提高青年就業品質、改善就業及創業環境，並強化青年職涯發展。"},{"bill":"202110061410000","text":"政府應確保青年政策形成之公正、公開、透明，建立青年參與之常設機制，於制（訂）定青年政策、法律與計畫時，保障青年參與之權利。","note":"明定政府應保障青年參與政策討論的權利，參採利害關係人的意見。"},{"bill":"202110068970000","text":"政府應確保青年政策形成之公正與公開透明，並建立青年參與之常設機制。\n前項常設機制，主管機關應以首長為召集人，邀集青年代表、團體代表、青年發展相關學者或專家、民間相關機構、目的事業主管機關代表，協調、研究、審議、諮詢及推動青年政策，其中青年代表不得少於二分之一，單一性別不得少於三分之一。\n國家制（訂）定涉及青年之政策及法規，應保障青年參與之權利。","note":"一、為落實主權在民之民主精神與保障青年參政權，制（訂）定青年政策或推動青年事務需重視青年表意，且需有一定比例青年代表參與決策會議，降低青年參政門檻。\n二、青年族群作為青年政策最直接之利害關係人，為推動「青年議題主流化」，使政策制定更為周延，國家應設置青年參與之常設機制。國家制定涉及青年之政策及法規時，亦應主動參考利害相關人意見。"},{"bill":"202110070660000","text":"政府應確保青年發展政策形成之公正與公開透明，建立青年參與之常設機制並保障青年參與青年事務之權利。","note":"青年作為青年發展政策及青年事務之直接影響人，應建立青年參與青年發展政策之常設機制，並保障青年參與青年事務之權利，使青年得順利表達意見，利於政府推動青年發展政策。"},{"bill":"202110071010000","text":"青年享有參與青年相關政策及法規制定之權利。\n國家應確保青年相關政策及法規之制定公正並公開透明，及建立青年參與之常設機制。","note":"為保障青年對政策、法規之參與青年事務之表意權，爰參照芬蘭《青年基本法》第五條與韓國《青年基本法》以及《文化基本法》第八條第二項明定政府應保障並建立青年之參與機制。"},{"bill":"202110072290000","text":"行政院為審議、協調及管考本法相關事務，應定期召開跨部會青年事務協調會報。\n前項青年協調會報由行政院院長擔任召集人，召集相關部會首長、地方政府首長代表、學者專家、社會團體及青年代表參與，青年代表不得少於三分之一。\n行政院制定重大政策、法律及計畫有影響青年發展之虞時，相關部會得於青年事務協調會報提出相關影響分析報告。","note":"一、青年事務協調會報之召開。\n二、青年政策之推動涉及跨部會業務，為使青年事務推動有效整合跨部會資源，並賦予政策制定功能及績效目標，建立管考機制，有關涉及本法事務之審議、協調等事項，應由行政院長定期召開跨部會之青年事務協調會報，召集相關部會首長、地方政府首長代表、學者專家、社會團體及青年代表參與。\n三、為保障青年群體之社會利益，國家制定重大政策、法律及計畫有影響青年發展之虞時，相關部會得於青年事務協調會報提出影響分析報告，評估對青年發展之影響。"},{"bill":"202110072330000","text":"政府應致力促進青年就業及創業，提高青年就業、創業品質與環境，強化青年職涯發展。","note":"政府應促進青年就業及創業之品質、環境，並強化青年職涯發展。"},{"bill":"202110072870000","text":"政府應保障青年工作權，致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年創新創業之永續發展環境。","note":"為落實《憲法》、《世界人權宣言》、《經濟社會文化權利公約》，並參照青年發展政策綱領所揭示「就業力」之推動策略。明定政府應保障青年工作權。"},{"bill":"202110075700000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿四十五歲之人。但在其他法令與條例中，對青年之年齡另有規定者，從其規定。\n二、青年發展：指提升青年於政治、經濟、數位科技、社會、文化等各領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、明定本法之用詞定義與範圍。\n二、參酌我國現行相關政策及各國相關法規中對於青年之定義，並考量我國現行法制對於未滿十二歲之兒童及十二歲以上未滿十八歲之少年，有「兒童及少年福利與權益保障法」、「兒童及少年未來教育與發展帳戶條例」等相關立法；而對於四十五歲以上之中高齡及高齡者，亦有「中高齡者及高齡者就業促進法」、「老人福利法」等制度。惟十八歲至四十五歲間之青年，獨缺專屬法規。因此，考量醫療科技日新月異、平均餘命日漸增長，並參酌青年發展政策綱領對象為十五至三十五歲；農業發展條例施行細則第十八條，所稱青年，係指十八歲以上，四十五歲以下者；以及青年創業貸款適用之年齡標準為十八歲至四十五歲。爰於第一款明定青年之年齡為十八歲以上，未滿四十五歲之人。\n三、聯合國1986年決議通過之發展權宣言，該核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，爰為第二款規定，並因應數位科技發展與普及，納入「數位科技」一詞。\n四、第三款明定青年事務之定義。"},{"bill":"202110076040000","text":"青年享有參與青年相關政策及法規制定之權利。\n國家應確保青年相關政策及法規之制定公正並公開透明，及建立青年參與之常設機制。","note":"為保障青年對政策、法規之參與青年事務之表意權，爰參照芬蘭《青年基本法》第五條與韓國《青年基本法》以及《文化基本法》第八條第二項明定政府應保障並建立青年之參與機制。"},{"bill":"202110078370000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿四十五歲之人。但在其他法令與條例中，對青年之年齡另有規定者，從其規定。\n二、青年發展：指提升青年於政治、經濟、數位科技、社會、文化等各領域之生活水準與福祉改善。\n三、青年事務：指與青年有關之公共事務。\n四、青年政策：指各級政府以青年發展為主要目標所施行之政策。","note":"一、明定本法之用詞定義與範圍。\n二、參酌我國現行相關政策及各國相關法規中對於青年之定義，並考量我國現行法制對於未滿十二歲之兒童及十二歲以上未滿十八歲之少年，有「兒童及少年福利與權益保障法」、「兒童及少年未來教育與發展帳戶條例」等相關立法；而對於四十五歲以上之中高齡及高齡者，亦有「中高齡者及高齡者就業促進法」、「老人福利法」等制度。惟十八歲至四十五歲間之青年，獨缺專屬法規。因此，考量醫療科技日新月異、平均餘命日漸增長，並參酌青年發展政策綱領對象為十五至三十五歲；農業發展條例施行細則第十八條，所稱青年，係指十八歲以上，四十五歲以下者；以及青年創業貸款適用之年齡標準為十八歲至四十五歲。爰於第一款明定青年之年齡為十八歲以上，未滿四十五歲之人。\n三、聯合國1986年決議通過之發展權宣言，該核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，爰為第二款規定，並因應數位科技發展與普及，納入「數位科技」一詞。\n四、第三款、第四款明定青年事務與政策之定義。"},{"bill":"202110079860000","text":"政府應確保青年政策形成之公正、公開及透明，建立青年參與之常設機制，於制（訂）定青年政策、法律與計畫時，保障青年參與之權利。","note":"青年作為青年政策之主體與利害關係人，政府應保障青年參與政策討論之權利，並建立其有效參與之常設機制，確保青年政策形成之公正公開透明。"},{"bill":"202110080450000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿四十五歲之人。但在其他法令與條例中，對青年之年齡另有規定者，從其規定。\n二、青年發展：指提升青年於政治、經濟、數位科技、社會、文化等各領域之生活水準與福祉改善。\n三、青年事務：指與青年有關之公共事務。\n四、青年政策：指各級政府以青年發展為主要目標所施行之政策。","note":"一、明定本法之用詞定義與範圍。\n二、參酌我國現行相關政策及各國相關法規中對於青年之定義，並考量我國現行法制對於未滿十二歲之兒童及十二歲以上未滿十八歲之少年，有「兒童及少年福利與權益保障法」、「兒童及少年未來教育與發展帳戶條例」等相關立法；而對於四十五歲以上之中高齡及高齡者，亦有「中高齡者及高齡者就業促進法」、「老人福利法」等制度。惟十八歲至四十五歲間之青年，獨缺專屬法規。因此，考量醫療科技日新月異、平均餘命日漸增長，並參酌青年發展政策綱領對象為十五至三十五歲；農業發展條例施行細則第十八條，所稱青年，係指十八歲以上，四十五歲以下者；以及青年創業貸款適用之年齡標準為十八歲至四十五歲。爰於第一款明定青年之年齡為十八歲以上，未滿四十五歲之人。\n三、聯合國1986年決議通過之發展權宣言，該核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，爰為第二款規定，並因應數位科技發展與普及，納入「數位科技」一詞。\n四、第三款、第四款明定青年事務與政策之定義。"},{"bill":"202110085510000","text":"本法用詞，定義如下：\n一、青年：指十八歲以上未滿三十五歲之人，其它法令有規定者，從其規定。\n二、青年發展：指提升青年於政治、經濟、數位科技、社會、文化等各領域之生活品質與福利。\n三、青年事務：指與青年有關之公共事務。","note":"一、明定本法之用詞定義與範圍。\n二、本法所稱之青年，參採行政院青年諮詢委員會委員之年齡定義，訂為十八歲以上至三十五歲以下。"},{"bill":"202110100300000","text":"政府應確保青年政策形成之公正與公開透明，並建立青年參與之常設機制。\n前項常設機制，主管機關應以首長為召集人，邀集青年代表、團體代表、青年發展相關學者或專家、民間相關機構、目的事業主管機關代表，協調、研究、審議、諮詢及推動青年政策，其中青年代表不得少於二分之一，單一性別不得少於三分之一，且青年代表應涵蓋各族群。\n國家制（訂）定涉及青年之政策及法規，應保障青年參與之權利。","note":"一、本法強調青年為主體，應保障其參與政策制定的權利，並設立相應機制。青年作為政策直接利害關係人，為推動「青年議題主流化」，國家應設置常設參與機制，確保政策制定更為周延，爰參考芬蘭、韓國及《文化基本法》規範，政府應保障並建立青年參與機制，以確保其對政策與法規的表意權。目前行政院青年諮詢委員會提供青年公共參與管道，故將其法制化。\n二、為因應性別主流化，常設機制應有性別比例；為因應族群主流化，且不同族群之青年經驗會有所不同，青年代表應有各族群，以確保政策制定不致偏頗或缺乏族群觀點。"},{"bill":"202110098760000","text":"中央主管機關每二年發布青年發展政策白皮書，並將青年政策、計畫透過網際網路或其他適當方式公開。","note":"明定中央主管機關每二年應發布青年發展政策白皮書，並於網際網路公告之。"},{"bill":"202110098790000","text":"政府應確保青年政策之形成公正及公開透明，並建立青年參與之常設機制，於制（定）訂青年政策、法律及計畫時，應保障青年參與之權利。","note":"本法以青年為主體，應採納青年之意見，故應設立其參與青年政策制定之管道，保障其權利。現行行政院青年諮詢委員會亦為強化青年公共參與及溝通機制，提供形成政策之參與管道，爰將該制度法制化。"},{"bill":"202110102250000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿四十五歲之人。但在其他法令與條例中，對青年之年齡另有規定者，從其規定。\n二、青年發展：指提升青年於政治、經濟、數位科技、社會、文化等各領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、明定本法之用詞定義與範圍。\n二、參酌我國現行相關政策及各國相關法規中對於青年之定義，並考量我國現行法制對於未滿十二歲之兒童及十二歲以上未滿十八歲之少年，有「兒童及少年福利與權益保障法」、「兒童及少年未來教育與發展帳戶條例」等相關立法；而對於四十五歲以上之中高齡及高齡者，亦有「中高齡者及高齡者就業促進法」、「老人福利法」等制度。惟十八歲至四十五歲間之青年，獨缺專屬法規。因此，考量醫療科技日新月異、平均餘命日漸增長，並參酌青年發展政策綱領對象為十五至三十五歲；農業發展條例施行細則第十八條，所稱青年，係指十八歲以上，四十五歲以下者；以及青年創業貸款適用之年齡標準為十八歲至四十五歲。爰於第一款明定青年之年齡為十八歲以上，未滿四十五歲之人。\n三、聯合國1986年決議通過之發展權宣言，該核心定義為「以人為本、注重經濟、社會、文化和政治發展之發展權」，爰為第二款規定，並因應數位科技發展與普及，納入「數位科技」一詞。\n四、第三款明定青年事務之定義。"},{"bill":"202110103250000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿四十五歲之人。但在其他法令與條例中，對青年之年齡另有規定者，從其規定。\n二、青年發展：指提升青年於政治、經濟、數位科技、社會、文化等各領域之生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。","note":"一、明定本法之用詞定義與範圍。\n二、參考國內外現有政策及法規對「青年」的定義，並考量目前法律已對不同年齡層做出明確規範：例如，對未滿十二歲的兒童及十二至十八歲的少年，有《兒童及少年福利與權益保障法》和《兒童及少年未來教育與發展帳戶條例》；而對於四十五歲以上的中高齡與高齡者，則分別有《中高齡者及高齡者就業促進法》和《老人福利法》。唯獨針對十八歲至四十五歲的青年，尚未有專門的法律規定。因此，綜合考量醫療科技迅速發展、平均壽命延長，以及青年發展政策綱領（將目標群體定為十五至三十五歲）、農業發展條例施行細則第十八條中將青年定義為十八歲以上、四十五歲以下，以及青年創業貸款年齡標準亦定為十八至四十五歲，本法第一款特別規定，青年係指年滿十八歲但未滿四十五歲者。\n三、依據聯合國1986年通過的發展權宣言，其核心概念為「以人為本、重視經濟、社會、文化及政治發展的發展權」，爰此，本法第二款據此作出規定，並隨著數位科技的迅速普及，在條文中特別納入「數位科技」一詞。\n四、第三款明確定義與青年事務相關內容。"},{"bill":"202110104620000","text":"政府應致力促進青年就業及創業，提高青年就業品質，改善就業及創業環境，強化青年職涯發展。","note":"「經濟社會文化權利國際公約」第四條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利，第七條亦明定人人有權享受公平與良好之工作條件，爰訂定本條，揭示政府應促進青年就業及創業、提高青年就業品質、改善就業及創業環境，並強化青年職涯發展。"},{"bill":"202110108760000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿四十歲之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等領域之權利與保障。\n三、青年事務：指與青年有關之公共事務。\n四、青年政策：指政府以青年發展為主要目標所施行之政策。","note":"明定本法之用詞定義與範圍。"},{"bill":"202110107570000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿四十歲之人。\n二、青年發展：指提升青年於政治、經濟、社會、文化等各領域之權利與保障及生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。\n四、青年政策：指政府以青年發展為主要目標所施行之政策。","note":"明定本法之用詞定義與範圍。"},{"bill":"202110107400000","text":"政府應確保青年政策之形成過程公開透明，並建立多元參與機制，保障青年於政策、法律及計畫制定中之實質參與權。","note":"一、青年應有平等參與公共事務的權利，其意見與需求應納入政策決策流程，實現參與式民主與世代共治。\n二、政府可透過下列方式強化青年參與：\n(一)設置青年諮詢委員會，使青年能直接參與政策討論與建議提出。\n(二)推動線上及實體公民參與平台，蒐集多元青年意見，提升政策透明度與回應性。\n(三)提供公共參與與政策素養教育，培養青年公共意識與政策參與能力。\n(四)建立法律明文保障，確保青年參與機制不流於形式，而具實質影響力。\n三、藉由制度化青年參與機制，政府可強化與青年的互信，並提升政策品質與社會認同。"},{"bill":"202110109830000","text":"政府制定涉及青年之政策及法規，應保障青年參與之權利，確保青年政策的公正、公開透明，並建立青年參與之常設機制。\n前項常設機制，應規定至少每半年定期召開青年事務協調會報，協調及督導青年事務，並審議青年政策推動計畫。\n第一項常設機制應保障青年代表參與，青年代表不得少於二分之一，單一性別不得少於三分之一。","note":"一、為使青年政策更為周延，政府應設置青年參與之常設機制。\n二、前揭常設機制須重視青年表意權，明訂一定比例青年代表參與決策。且單一性別不得少於三分之一。"},{"bill":"202110123900000","text":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、青年發展相關經費之編列及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"明定中央政府應落實之事項，俾供中央政府據以統籌、規劃、協調及推動各項青年發展措施。"},{"bill":"202110124800000","text":"政府應致力促進青年就業及創業，提高青年就業品質，改善就業及創業環境，強化青年職涯發展。","note":"聯合國《經濟、社會及文化權利國際公約》第四條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利，第七條亦明定人人有權享受公平與良好之工作條件。在內外環境劇烈變動的今日，政府應促進青年就業及創業、提高青年就業品質及就業環境，並強化青年職涯發展。"},{"bill":"202110124830000","text":"政府應確保青年政策形成之公正與公開透明，於制（訂）定青年政策、法規與計畫時，應保障青年參與之權利，並建立青年參與之常設機制。\n前項常設機制，主管機關應以首長為召集人，邀集青年代表、團體代表、青年發展相關學者或專家、民間相關機構、目的事業主管機關代表，協調、研究、審議、諮詢及推動青年政策，其中青年代表不得少於二分之一，單一性別不得少於三分之一。","note":"為落實民主精神與保障青年參政權，應重視青年表意並提高其決策參與比例，降低參政門檻。青年為政策利害關係人，政府應建立青年參與程序，確保政策制定過程公平透明，廣納多方意見，使青年政策更具代表性與實效性。"},{"bill":"202110126910000","text":"本法用詞，定義如下：\n一、青年：本法所稱青年，係指十八歲以上，未滿三十五歲之人；其他法令就青年年齡之範圍另有規定者，從其規定。\n二、青年發展：指提升青年於政治、經濟、社會、文化等各領域之權利與保障及生活品質與福利改善。\n三、青年事務：指與青年有關之公共事務。\n四、青年政策：指政府以青年發展為主要目標所施行之政策。","note":"明定本法之用詞定義與範圍。"},{"bill":"202110127050000","text":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"一、鑒於涉及青年事務相關事項，有須由中央政府通盤考量、統合辦理或具全國一致性規範之必要，爰明定中央政府應落實之事項，俾由中央政府據以統籌、規劃、協調及推動各項青年發展措施。\n二、另因青年發展相關經費，係由中央各目的事業主管機關本於職權編列，例如，青年創業貸款、青年購屋貸款、青年租金補貼等，爰於第三款明定中央政府應就不同事項之青年發展經費進行分配及補助，併予敘明。"},{"bill":"202110128060000","text":"中央政府應落實以下青年事務：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"一、鑒於涉及青年事務相關事項，有須由中央政府通盤考量、統合辦理或具全國一致性規範之必要，爰明定中央政府應落實之事項，俾由中央政府據以統籌、規劃、協調及推動各項青年發展措施。\n二、另因青年發展相關經費，係由中央各目的事業主管機關本於職權編列，例如，青年創業貸款、青年購屋貸款、青年租金補貼等，爰於第三款明定中央政府應就不同事項之青年發展經費進行分配及補助，併予敘明。"},{"bill":"202110128180000","text":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"一、鑒於涉及青年事務相關事項，有須由中央通盤考量、統合辦理或具全國一致性規範之必要，爰明定中央政府應落實之事項，俾供中央政府據以統籌、規劃、協調及推動各項青年發展措施。\n二、另因針對青年發展相關經費，係由中央各目的事業主管機關本職權編列，例如，青年創業貸款、青年購屋貸款、青年租金補貼等，爰於第三款明定中央政府應就不同事項之青年發展經費進行分配及補助，併予敘明。"},{"bill":"202110128310000","text":"各級政府應將青年觀點納入所有政策、計畫與法規之形成與執行過程，落實青年主流化原則，保障青年在決策體系中之實質參與。","note":"本條引入「青年主流化」（Youth Mainstreaming）概念，係對應國際治理趨勢所為之重要制度創設。青年主流化意指政府應於施政全過程中納入青年觀點與利益考量，並非僅限於專責機關之職責範圍。該原則已廣泛應用於歐盟、芬蘭、韓國等國家之青年政策中，為確保青年作為政策受益者與參與者之角色。條文進一步強調「實質參與」以取代「形式參與」，意即青年應擁有影響決策過程的實際權能，不僅止於提供意見。"},{"bill":"202110129310000","text":"各級政府於制定政策、法規及計畫時，應鼓勵青年參與，相關部會或局處並得提出世代影響分析報告。\n本法所定目的事業主管機關制定青年相關政策、法規及計畫時，應納入青年參與。","note":"一、為落實主權在民之民主精神與保障青年參政權，並實現世代正義，各級政府制（訂）定政策、法規及計畫時，應鼓勵青年參與。\n二、建立「世代影響分析」制度。「青年議題主流化」之精神，不只包括正視各項政策對當代青年之影響，更包括「對下一代負責」之精神，以達社會永續發展之目標。基於保障青年世代之利益，國家制定重大政策、法律及計畫時，若有影響青年之虞，須透過世代影響分析報告來瞭解其對未來世代之影響，爰於本條明定。\n三、惟本法所定目的事業主管機關制定相關政策時，應納入青年參與，以確實保障青年權益。"},{"bill":"202110132300000","text":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"明定中央政府應落實之青年事務。青年事務，有須由中央政府通盤考量、統合辦理或具全國一致性規範必要者，規定由中央政府據以統籌、規劃、協調及推動。"},{"bill":"202110143380000","text":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"一、鑒於涉及青年事務相關事項，有須由中央政府通盤考量、統合辦理或具全國一致性規範之必要，爰明定中央政府應落實之事項，俾由中央政府據以統籌、規劃、協調及推動各項青年發展措施。\n二、另因青年發展相關經費，係由中央各目的事業主管機關本於職權編列，例如，青年創業貸款、青年購屋貸款、青年租金補貼等，爰於第三款明定中央政府應就不同事項之青年發展經費進行分配及補助，併予敘明。"},{"bill":"202110155730000","text":"中央政府應落實下列涉及青年發展事務之事項：\n一、全國青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配與補助。\n四、青年事務、青年發展相關統計與政策研究。\n五、促進青年發展事項之國際交流。\n六、其他全國性青年發展事項之策劃及督導。","note":"一、為確保青年事務之整體性與一致性，凡涉及全國性青年發展政策、法規制定及重大計畫推動，確有由中央政府通盤考量、統合規劃之必要。爰於本條文第一款至第六款明定中央政府應主管並落實之核心事項，俾資中央政府據以統籌策劃、協調推動各項青年發展措施，以達成全國性青年發展目標。\n二、考量青年發展相關經費，如青年創業貸款、青年購屋貸款、青年租金補貼等，係由中央各目的事業主管機關依其職權編列。為確保資源之有效運用及政策效益之最大化，本條文第三款爰明確規範中央政府應統籌全國性青年發展相關經費之編列、分配及監督，而非僅限於分配與補助，以強化中央政府在青年發展財政資源運用上之主導與監督職能。此舉旨在使各項青年發展經費得以更具策略性地配置，以支持全國青年發展政策之全面推展。"},{"bill":"202110166280000","text":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"一、鑒於涉及青年事務相關事項，有須由中央政府通盤考量、統合辦理或具全國一致性規範之必要，爰明定中央政府應落實之事項，俾由中央政府據以統籌、規劃、協調及推動各項青年發展措施。\n二、另因青年發展相關經費，係由中央各目的事業主管機關本於職權編列，例如，青年創業貸款、青年購屋貸款、青年租金補貼等，爰於第三款明定中央政府應就不同事項之青年發展經費進行分配及補助，併予敘明。"},{"bill":"202110169130000","text":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","note":"一、鑒於涉及青年事務相關事項，有須由中央政府通盤考量、統合辦理或具全國一致性規範之必要，爰明定中央政府應落實之事項，俾由中央政府據以統籌、規劃、協調及推動各項青年發展措施。\n二、另因青年發展相關經費，係由中央各目的事業主管機關本於職權編列，例如，青年創業貸款、青年購屋貸款、青年租金補貼等，爰於第三款明定中央政府應就不同事項之青年發展經費進行分配及補助，併予敘明。"},{"bill":"202110175160000","text":"中央主管機關每二年發布青年發展政策白皮書，並將青年政策、計畫透過網際網路或其他適當方式公開。","note":"明定中央主管機關每二年應發布青年發展政策白皮書，並於網際網路公告之。"}],"changed":true,"final":"中央政府應落實下列涉及青年事務之事項：\n一、全國性青年發展政策、法規與計畫之規劃、制（訂）定、宣導及執行。\n二、對直轄市、縣（市）政府執行青年發展政策之督導及協調。\n三、中央青年發展相關經費之分配及補助。\n四、其他全國性青年發展事項之策劃及督導。","finalWhy":"一、鑒於涉及青年事務相關事項，有須由中央政府通盤考量、統合辦理或具全國一致性規範之必要，爰明定中央政府應落實之事項，俾由中央政府據以統籌、規劃、協調及推動各項青年發展措施。\n二、另因青年發展相關經費，係由中央各目的事業主管機關本於職權編列，例如，青年創業貸款、青年購屋貸款、青年租金補貼等，爰於第三款明定中央政府應就不同事項之青年發展經費進行分配及補助，併予敘明。","review":{"note":"修正通過","text":"國家於制定政策、法規及計畫時，應鼓勵青年充分參與，建立青年公平參與機制，保障青年參與之權利。\n各級政府於遴聘青年參與時，應考量其代表性、背景多元性及區域平衡，並規劃民主多元參與方式及提供充分支持。"}},{"no":"第五條","current":null,"versions":[{"bill":"202110017600000","text":"下列事項，由直轄市、縣（市）主管機關掌理：\n一、直轄市、縣（市）青年發展政策、自治法規與方案之規劃、釐定、宣導及執行事項。\n二、中央青年發展政策、法規及方案之執行事項。\n三、直轄市、縣（市）青年發展經費之分配及補助事項。\n四、其他直轄市、縣（市）青年發展之策劃及督導事項。","note":"規定直轄市、縣（市）主管關職掌事項，俾供直轄市、縣（市）主管機關據以規劃、推動各項青年發展措施。"},{"bill":"202110040040000","text":"政府應致力促進青年就業及創業，提高青年就業品質，改善就業及創業環境，強化青年職涯發展。","note":"一、青年為社會不可或缺之勞動力來源，保障青年勞動權有助於提升社會穩定；且勞動有助於自我實現及實現獨立，是個人發展重要領域。\n二、《憲法》第十五條明定人民工作權之保障。「經濟社會文化權利國際公約」第六條明定，人人有工作之權利、且應有機會憑本人自由選擇或接受之工作謀生之權利；第七條亦明定，人人有權享受公平與良好之工作條件，爰訂定本條，宣誓應促進青年就業及創業、提高就業品質。"},{"bill":"201110120370000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、全國性青年發展政策、法規及計畫之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"考量青年事務亦有需因地制宜而歸屬地方政府權限者，爰明定直轄市、縣（市）政府應落實青年事務之事項，俾由直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。"},{"bill":"202110057110000","text":"國家應致力促進青年就業及創業，提升青年就業品質，強化青年人才專業培育，建構友善青年之就業及創業環境。","note":"一、按《憲法》第十五條，人民之工作權應予保障。\n二、次依聯合國《世界青年行動綱領》，各國政府應建立或加強使青年適應目前和未來就業條件的職業和技術培訓。協助青年獲得具有升遷機會的起職工作，並且獲得適應勞動力需求變化的能力。爰訂定本條，保障青年之工作權及促進改善其勞動環境。"},{"bill":"202110059880000","text":"政府應致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年之就業及創業環境。","note":"一、按《憲法》第十五條，人民之工作權應予保障。\n二、次依聯合國《世界青年行動綱領》，各國政府應建立或加強使青年適應目前和未來就業條件的職業和技術培訓。協助青年獲得具有升遷機會的起職工作，並且獲得適應勞動力需求變化的能力。爰訂定本條，保障青年之工作權及促進改善其勞動環境。"},{"bill":"202110061560000","text":"政府應致力營造良善之青年教育環境，協助青年發展、提升青年技能與創造力。","note":"「世界人權宣言」第二十六條明定人人皆有受教育之權、技術與職業教育應廣為設立、高等教育應予人人平等機會等權利主張，爰訂定本條，揭示政府應營造良善之青年教育環境，以協助青年提升技能與創造力。"},{"bill":"202110061410000","text":"政府應致力促進青年就業及創業，提高青年就業品質，改善就業及創業環境，強化青年職涯發展。","note":"「經濟社會文化權利國際公約」第六條規範，人人有工作之權利，包括人人應有機會憑本人自由選擇或接受之工作謀生之權利，並將採取適當步驟保障之。爰此，政府應致力促進及改善青年就業及創業環境，並強化青年職涯發展。"},{"bill":"202110068970000","text":"政府應致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年創新創業環境，建構青年事業永續發展條件。","note":"一、為落實《憲法》、《世界人權宣言》第二十三條與第二十四條、《經濟社會文化權利公約》第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利，第七條亦明定人人有權享受公平與良好之工作條件。\n二、參照青年發展政策綱領「就業力」之推動策略為「加強人才專業培育，營造有利創新創業環境，建構青年事業永續發展條件」。"},{"bill":"202110070660000","text":"政府應致力促進青年就業及創業，提升青年就業品質，強化青年人才專業培育，建構有利青年職涯發展之環境。","note":"一、《憲法》第十五條規定，人民之工作權應予以保障。\n二、復按《世界青年行動綱領》揭示，世界各國政府應建構促進青年就業及創業之環境，並提供人才專業培育及提升青年就業品質，以利青年職涯發展。"},{"bill":"202110071010000","text":"青年享有之權利不因族群、語言、性別、性傾向、年齡、地域、宗教信仰、身心狀況、社會經濟地位及其他條件，而受歧視或不合理之差別待遇。","note":"青年政策及法規應遵行平等原則。"},{"bill":"202110072290000","text":"各級政府應設置青年專責單位，辦理青年事務。\n前項青年專責單位，其首長應具青年身分。","note":"一、青年專責單位之設置。\n二、為使各級政府有效推動青年政策及各項工作，明定各級政府應設置青年專責單位。\n三、為確保青年專責單位之首長具青年身分，爰訂定第二項。"},{"bill":"202110072330000","text":"政府應營造合適之青年教育環境，協助青年發展、提升技能與創造力。","note":"政府應保障青年教育環境、發展、技能與創造力之培養。"},{"bill":"202110072870000","text":"政府應積極保障青年學習權及受教育權，並提供良好學習環境。\n政府應考量青年之自主性及特殊性，致力提供青年多元學習管道，激發學習潛能，培養創意創新思維及獨立思考之能力。","note":"為落實《憲法》、《世界人權宣言》、《經濟社會文化權利公約》、《教育基本法》，並參照青年發展政策綱領所揭示「創學力」之推動策略，保障青年受學習及受教育之權利。"},{"bill":"202110075700000","text":"政府應確保青年政策、法規及計畫形成之公正與公開透明，並建立青年參與之常設機制。\n前項常設機制，應有青年參與之保障。\n中央主管機關應鼓勵地方政府積極建立青年參與之機制。","note":"青年族群作為青年政策最直接之利害關係人，為體現「青年議題主流化」之價值，政府應設置青年參與之常設機制，且制定青年相關政策、法規及計畫時，亦應有一定比例青年代表參與決策會議。"},{"bill":"202110076040000","text":"青年享有之權利不因族群、語言、性別、性傾向、年齡、地域、宗教信仰、身心狀況、社會經濟地位及其他條件，而受歧視或不合理之差別待遇。","note":"青年政策及法規應遵行平等原則。"},{"bill":"202110078370000","text":"政府應確保青年政策、法規及計畫形成之公正與公開透明，並建立青年參與之常設機制。\n前項常設機制，應有青年參與之保障。\n中央主管機關應鼓勵地方政府積極建立青年參與之機制。","note":"青年族群作為青年政策最直接之利害關係人，為體現「青年議題主流化」之價值，政府應設置青年參與之常設機制，且制定青年相關政策、法規及計畫時，亦應有一定比例青年代表參與決策會議。"},{"bill":"202110079860000","text":"政府應致力促進青年就業及創業，提高青年就業品質，改善就業及創業環境，強化青年職涯之發展。","note":"按「經濟社會文化權利國際公約」第六條規範，人人有工作之權利，包括人人應有機會憑本人自由選擇或接受之工作謀生之權利，並應採取適當措施保障之；《憲法》第十五條亦規定，人民之工作權應予保障。是故，政府應致力促進及改善青年就業及創業環境，並強化青年職涯之發展。"},{"bill":"202110080450000","text":"政府應確保青年政策、法規及計畫形成之公正與公開透明，並建立青年參與之常設機制。\n前項常設機制，應有青年參與之保障。\n中央主管機關應鼓勵地方政府積極建立青年參與之機制。","note":"青年族群作為青年政策最直接之利害關係人，為體現「青年議題主流化」之價值，政府應設置青年參與之常設機制，且制定青年相關政策、法規及計畫時，亦應有一定比例青年代表參與決策會議。"},{"bill":"202110085510000","text":"政府應確保青年政策、法規及計畫形成過程中之公正、公開與透明，並建立青年參與之常設機制。\n前項常設機制，應有青年參與之保障。中央主管機關應鼓勵地方政府積極建立青年參與之機制。","note":"青年作為青年政策最直接之利害關係人，政府應設置青年參與之常設機制，且制定青年相關政策、法規及計畫時，亦應有一定比例青年代表參與決策會議。"},{"bill":"202110100300000","text":"政府應保障青年工作權，致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年創新創業之永續發展環境。","note":"一、為落實《憲法》、《世界人權宣言》第二十三條與第二十四條、《經濟社會文化權利公約》第六條明定人人有工作之權利，包括人人應有機會憑本人自由選擇或接受工作謀生之權利，第七條亦明定人人有權享受公平與良好之工作條件。\n二、參照青年發展政策綱領「就業力」之推動策略為「加強人才專業培育，營造有利創新創業環境，建構青年事業永續發展條件」。"},{"bill":"202110098760000","text":"中央主管機關應建立青年參與公共政策之機制，確保青年政策公開透明，並鼓勵地方政府提供青年參與之機會。","note":"政府應建立青年參與公共政策之機制，並鼓勵地方政府提供青年參與之機會。"},{"bill":"202110098790000","text":"政府應致力促進青年就業及創業，提升青年就業品質，加強青年人才專業培育，營造有利青年就業及創業環境，並利其職涯發展。","note":"聯合國《2030青年策略》指導之聯合國青年事務五大優先事項中，包含支援青年有更多機會得到體面之（decent）工作及生產就業（productive employment）；我國104年發布《青年發展政策綱領》，其推動策略中包含加強人才專業培育，營造有利創新創業環境，爰參酌二者訂定第五條。"},{"bill":"202110102250000","text":"政府應確保青年政策、法規及計畫形成之公正與公開透明，並建立青年參與之常設機制。\n前項常設機制，應有青年參與之保障。\n中央主管機關應鼓勵地方政府積極建立青年參與之機制。","note":"青年族群作為青年政策最直接之利害關係人，為體現「青年議題主流化」之價值，政府應設置青年參與之常設機制，且制定青年相關政策、法規及計畫時，亦應有一定比例青年代表參與決策會議。"},{"bill":"202110103250000","text":"政府應確保青年政策、法規及計畫形成之公正與公開透明，並建立青年參與之常設機制。\n前項常設機制，應有青年參與之保障。\n中央主管機關應鼓勵地方政府積極建立青年參與之機制。","note":"青年族群作為青年政策最直接之利害關係人，為彰顯「青年議題主流化」的重要性，政府應建立青年持續參與機制，並在制定與青年相關的政策、法規及計畫時，確保一定比例的青年代表能夠參與決策。"},{"bill":"202110104620000","text":"政府應致力營造良善之青年教育環境，協助青年發展、提升青年技能與創造力。","note":"「世界人權宣言」第二十六條明定人人皆有受教育之權、技術與職業教育應廣為設立、高等教育應予人人平等機會等權利主張，爰訂定本條，揭示政府應營造良善之青年教育環境，以協助青年提升技能與創造力。"},{"bill":"202110108760000","text":"中央主管機關應每三年召開青年國是會議，並發布青年發展政策白皮書，將青年政策、計畫透過網際網路或其他適當方式公開。","note":"中央主管機關應每三年召開青年國是會議，應發布青年發展政策白皮書，將青年政策於網際網路公告之。"},{"bill":"202110107570000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年參與機制，保障青年參與之權利。\n政府應確保青年政策、法規及計畫形成之公正與公開透明，並建立青年參與之常設機制。\n中央主管機關應鼓勵地方政府積極建立青年參與之機會。政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度。","note":"青年族群是青年政策最直接的利害關係人，為落實「青年議題主流化」的理念，政府應建立常設機制，確保青年能夠穩定參與公共事務。此外，在制定與青年相關的政策、法規及計畫時，應確保一定比例的青年代表參與決策會議，以充分反映青年需求與意見。"},{"bill":"202110107400000","text":"政府應保障青年平等獲取優質教育資源之權利，並提供多元學習管道，以促進其創造力、批判思維與專業技能之發展。","note":"一、教育是青年發展的基石，政府應提供公平、包容與多元的教育環境，使青年能因應未來社會與職場之挑戰。\n二、應透過資源整合與制度優化，縮小教育機會落差，強化高等教育、技職體系與終身學習機制。\n三、多元學習包括：跨領域學習、實作課程、國際交流與在地文化教育，藉此培養青年創新能力、全球視野與在地關懷精神。\n四、本條強調教育資源分配之公平性與學習形式之多樣性，實現教育正義與人力資本提升。"},{"bill":"202110109830000","text":"政府應促進青年就業及創業，強化青年職涯發展及創新創業環境。","note":"參照教育部「青年發展政策綱領」有關就業力之推動策略為「加強人才專業培育，營造有利創新創業環境，建構青年事業永續發展條件」。明訂政府應促進青年就業及創業，強化青年職涯發展及創新創業環境。"},{"bill":"202110123900000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、中央青年發展政策、法規及方案之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"明定直轄市、縣（市）政府應落實涉及青年事務之事項，俾供直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。"},{"bill":"202110124800000","text":"政府應致力營造良善之青年教育環境，協助青年發展、提升青年技能與創造力。","note":"聯合國《世界人權宣言》第二十六條明定人人皆有受教育之權、技術與職業教育應廣為設立、高等教育應予人人平等機會等權利主張，爰訂定本條，揭示政府應營造良善之青年教育環境，以協助青年提升技能與創造力。"},{"bill":"202110124830000","text":"政府應致力促進青年就業及創業，提高青年就業品質，強化青年人才專業培育，營造有利青年創新創業環境，建構青年事業永續發展條件。","note":"為落實《憲法》與國際公約規範，確保青年享有自由選擇工作的權利及公平良好的工作條件，政府應積極促進青年就業與創業，提升就業品質，並改善整體就業與創業環境。同時，應強化青年職涯發展，協助青年建立永續發展的職涯規劃。參照青年發展政策綱領中「就業力」的推動策略，應強化人才專業培育，營造有利青年創新創業的環境，打造支持青年多元發展的友善條件。"},{"bill":"202110126910000","text":"政府於制定政策、法規及計畫時，應鼓勵青年參與，建立青年參與機制，保障青年參與之權利。\n政府應確保青年政策、法規及計畫形成之公正與公開透明，並建立青年參與之常設機制。\n中央主管機關應鼓勵地方政府積極建立青年參與之機會。政府於遴聘青年參與時，應考量其代表性及對該等事務之熟悉度。","note":"為落實「青年議題主流化」的理念，政府應建立常設機制，確保青年能夠穩定參與公共事務。此外，在制定與青年相關的政策、法規及計畫時，應確保一定比例的青年代表參與決策會議，以充分反映青年需求與意見。"},{"bill":"202110127050000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣導及執行。\n二、全國性青年發展政策、法規及計畫之執行。\n三、直轄市、縣（市）青年發展相關經費之分配及補助。\n四、其他直轄市、縣（市）青年發展事項之策劃及督導。","note":"考量青年事務亦有需因地制宜而歸屬地方政府權限者，爰明定直轄市、縣（市）政府應落實青年事務之事項，俾由直轄市、縣（市）政府據以規劃、執行及推動各項青年發展措施。"},{"bill":"202110128060000","text":"直轄市、縣（市）政府應落實下列涉及青年事務之事項：\n一、直轄市、縣（市）青年發展政策、自治法規與計畫之規劃、制（訂）定、宣
