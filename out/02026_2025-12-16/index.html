訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款之規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，因此海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110173860000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110175080000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為提升海上交通的透明度，且有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，作為事後追查的重要依據，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、按海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，故海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110175190000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌《國際海上人命安全公約》（SOLAS）第五章規則一、四及二十八，爰於第一項規定船舶在航行或錨泊時，應備有航海日誌並詳實記載相關事項；其適用範圍，依修正條文第八條之一第一項第二款所定水域辦理。\n三、依據國際海事組織（IMO）A.916(22)決議，爰於第二項明定航行活動及事故等事項應記載於航海日誌。\n四、參酌《海岸巡防法》第四條第一項第三款規定，海巡人員於執勤時，如有正當理由認為船舶可能違法，得查驗其航海日誌。"},{"bill":"201110161340600","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"}],"changed":true,"final":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","finalWhy":"","review":{"note":"照行政院提案通過","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。"}},{"no":"第十五條","current":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得指定地點令其移泊或疏散他處停泊；未依規定移泊者，得逕行移泊。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","versions":[{"bill":"201110161340600","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"}],"changed":false,"final":"船舶所有人於領得船舶檢查證書及船舶噸位證書後，應於三個月內依船舶登記法規定，向船籍港航政機關為所有權之登記。\n前項船舶檢查證書，得依第三十一條規定，以有效之國際公約證書，及經主管機關委託之驗船機構所發船級證書代之。","finalWhy":null,"review":null},{"no":"第二十一條之一","current":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"201110161340600","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十三條","current":"船舶檢查分特別檢查、定期檢查及臨時檢查。\n船舶檢查之範圍，包括下列各項：\n一、船舶各部結構強度。\n二、船舶推進所需之主輔機或工具。\n三、船舶穩度。\n四、船舶載重線。但依第五十一條所定規則規定，在技術上無勘劃載重線必要者，不在此限。\n五、船舶艙區劃分。但依第三十六條所定規則規定，免艙區劃分者，不在此限。\n六、船舶防火構造。但依第三十五條所定規則規定，免防火構造者，不在此限。\n七、船舶標誌。\n八、船舶設備。\n船舶應依規定檢查合格，並將設備整理完妥，始得航行。\n船舶因分類、噸位、載運貨物型態、適航水域不同，其檢查之項目、內容、豁免及等效、檢查機關、有效期間、申請程序與文件、檢查證書之核發、換（補）發、註銷、撤銷或繳銷、檢查費、證書費之收取及其他應遵行事項之規則，由主管機關定之。","versions":[{"bill":"202110165060000","text":"船舶檢查分特別檢查、定期檢查及臨時檢查。\n船舶檢查之範圍，包括下列各項：\n一、船舶各部結構強度。\n二、船舶推進所需之主輔機或工具。\n三、船舶穩度。\n四、船舶載重線。但依第五十一條所定規則規定，在技術上無勘劃載重線必要者，不在此限。\n五、船舶艙區劃分。但依第三十六條所定規則規定，免艙區劃分者，不在此限。\n六、船舶防火構造。但依第三十五條所定規則規定，免防火構造者，不在此限。\n七、船舶標誌。\n八、船舶設備。\n船舶應依規定檢查合格，船舶所有人及船長並應將設備整理完妥，妥善維護，客船、營業用遊艇及載客小船發航前，船長或駕駛並應依規定點檢船舶，確保其適航性，始得航行。\n船舶於新船建造、船身修改或佈置變更前，船舶建造、改造業者或船舶所有人應將有關之圖說送航政機關或主管機關委託之驗船機構審核，未經核可部分不得施工。\n船舶因分類、噸位、載運貨物型態、適航水域不同，其檢查之項目、內容、豁免及等效、檢查機關、有效期間、申請程序與文件、檢查證書之核發、換（補）發、註銷、撤銷或繳銷、檢查費、證書費之收取及其他應遵行事項之規則，由主管機關定之。","note":"一、船舶航行時除符合相關檢查規定，亦應妥善管理維護，以維持其適航性，進而確保船舶航行及人命安全，爰參考SOLAS第一章規則十一規定，修正第三項；另為加強載客船舶發航前安全管理，將現行客船管理規則第三十六條客船航前安全點檢規範提升為法律位階，並將營業用遊艇及載客小船一併納入需辦理點檢之範圍，課予船長、營業用遊艇駕駛或載客小船駕駛航前安全點檢確保船舶適航性之責任義務，爰併予納入本項修正。\n二、為強化新建船舶及改建船舶管理，爰將現行船舶檢查規則第十四條及第十五條規範修正並提升為法律位階，及於第八十九條之三訂定相關罰則，新增第四項，現行第四項遞移為第五項。船舶圖說應送航政機關或主管機關委託驗船機構審核之權責分工部分，係依船舶檢查規則第五條規定辦理，併予敘明。\n三、其餘項次未修正。"}],"changed":false,"final":"船舶檢查分特別檢查、定期檢查及臨時檢查。\n船舶檢查之範圍，包括下列各項：\n一、船舶各部結構強度。\n二、船舶推進所需之主輔機或工具。\n三、船舶穩度。\n四、船舶載重線。但依第五十一條所定規則規定，在技術上無勘劃載重線必要者，不在此限。\n五、船舶艙區劃分。但依第三十六條所定規則規定，免艙區劃分者，不在此限。\n六、船舶防火構造。但依第三十五條所定規則規定，免防火構造者，不在此限。\n七、船舶標誌。\n八、船舶設備。\n船舶應依規定檢查合格，並將設備整理完妥，始得航行。\n船舶因分類、噸位、載運貨物型態、適航水域不同，其檢查之項目、內容、豁免及等效、檢查機關、有效期間、申請程序與文件、檢查證書之核發、換（補）發、註銷、撤銷或繳銷、檢查費、證書費之收取及其他應遵行事項之規則，由主管機關定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十六條","current":"船舶經特別檢查後，於每屆滿一年之前後三個月內，其所有人應向船舶所在地航政機關申請施行定期檢查。\n船舶經定期檢查合格後，航政機關應於船舶檢查證書上簽署。","versions":[{"bill":"202110165060000","text":"船舶自特別檢查合格之日起，於每屆滿一年之前後三個月內，其所有人應向船舶所在地航政機關申請施行定期檢查，並得提前申請。但提前申請檢查且檢查合格日期早於原應申請檢查時限之首日者，應自該次定期檢查合格日後三個月起，每屆滿一年之前後三個月內申請施行定期檢查。\n船舶經定期檢查合格後，航政機關應於船舶檢查證書上簽署。","note":"一、船舶因其作業特性、季節因素或船級檢驗及塢修期程，常有提前辦理定期檢查之需求，爰參考SOLAS第一章規則十四修正定期檢查時限規定，於不延長船舶定期檢查實現之原則，修正第一項。\n二、第二項未修正。"}],"changed":false,"final":"船舶經特別檢查後，於每屆滿一年之前後三個月內，其所有人應向船舶所在地航政機關申請施行定期檢查。\n船舶經定期檢查合格後，航政機關應於船舶檢查證書上簽署。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十七條","current":"船舶有下列情形之一者，其所有人應向所在地航政機關申請施行船舶臨時檢查：\n一、遭遇海難。\n二、船身、機器或設備有影響船舶航行、人命安全或環境污染之虞。\n三、適航性發生疑義。\n船舶經臨時檢查合格後，航政機關應於船舶檢查證書上註明。","versions":[{"bill":"202110165060000","text":"船舶有下列情形之一者，其所有人應向所在地航政機關申請施行船舶臨時檢查：\n一、遭遇海難。\n二、船身、機器或設備有影響船舶航行、人命安全或環境污染之虞。\n三、適航性發生疑義。\n四、未涉及船身修改之船舶佈置變更。\n船舶經臨時檢查合格後，航政機關應於船舶檢查證書上註明。","note":"一、船舶佈置變更，除移動式設備機具變更外，無論是否涉及船身修改均有檢查確認其適航性之必要，惟涉及船身修改應申請檢查種類已規範於第二十五條第一項第三款，至未涉及船身修改之船舶佈置變更，因其影響適航性程度較低，爰規範應申請檢查種類為臨時檢查，新增本條第一項第四款。\n二、第二項未修正。"}],"changed":false,"final":"船舶有下列情形之一者，其所有人應向所在地航政機關申請施行船舶臨時檢查：\n一、遭遇海難。\n二、船身、機器或設備有影響船舶航行、人命安全或環境污染之虞。\n三、適航性發生疑義。\n船舶經臨時檢查合格後，航政機關應於船舶檢查證書上註明。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十八條","current":"船舶申請定期檢查或特別檢查後，應於三個月內整修完善並完成檢查。未於期限內完成檢查之船舶視為檢查不合格，航政機關得命其停航。\n前項特別檢查不包括新船建造、自國外輸入、船身修改或換裝推進機器之特別檢查。","versions":[{"bill":"202110165060000","text":"船舶申請定期檢查或特別檢查後，應於三個月內整修完善並完成檢查。未於期限內完成檢查之船舶視為檢查不合格，船舶所有人應於檢查不合格日起一個月內重新申請定期檢查或特別檢查。\n前項特別檢查不包括新船建造、自國外輸入、船身修改或換裝推進機器之特別檢查。","note":"一、為明確規範未於期限內完成檢查之船舶，應重新申請檢查之期限，修正第一項。因船舶檢查不合格已不符第二十三條第三項規定之船舶航行要件，且違反該規定航行者可依修正條文第九十二條規定處以罰鍰及禁止航行，已可取代命其停航之措施，爰併予刪除相關規定。\n二、第二項未修正。"}],"changed":false,"final":"船舶申請定期檢查或特別檢查後，應於三個月內整修完善並完成檢查。未於期限內完成檢查之船舶視為檢查不合格，航政機關得命其停航。\n前項特別檢查不包括新船建造、自國外輸入、船身修改或換裝推進機器之特別檢查。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十八條之一","current":"船舶所有人未依規定申請施行定期檢查、特別檢查且逾期滿五年時，由航政機關通知船舶所有人於三個月內辦理；屆期仍未辦理，而無正當理由者，由航政機關公告三個月；公告期滿未提出異議者，得逕行註銷第十一條之船舶文書，並註銷登記或註冊。\n全長未滿二十四公尺，且乘員人數十二人以下自用遊艇之所有人未依規定提送自主檢查表逾期滿五年時，航政機關依前項程序辦理；公告期滿未提出異議者，得逕行註銷遊艇證書，並註銷登記或註冊。\n經航政機關逕行註銷登記或註冊之船舶，如事後發現有存在事實，船舶所有人得檢具相關文件，向航政機關重行申請施行特別檢查及核發相關文書，並回復登記或註冊。","versions":[{"bill":"202110165060000","text":"船舶所有人未依規定申請施行定期檢查、特別檢查且逾期滿五年時，由航政機關通知船舶所有人於三個月內辦理；屆期仍未辦理，而無正當理由者，由航政機關公告三個月；公告期滿未提出異議者，得逕行註銷第十一條之船舶文書，並註銷登記或註冊。\n船齡未滿十二年，全長未滿二十四公尺，且乘客定額十二人以下自用遊艇，其所有人未依第六十六條第一項規定提送自主檢查表逾期滿五年時，航政機關依前項程序辦理；公告期滿未提出異議者，得逕行註銷遊艇證書，並註銷登記或註冊。\n經航政機關逕行註銷登記或註冊之船舶，如事後發現有存在事實，船舶所有人得檢具相關文件，向航政機關重行申請施行特別檢查及核發相關文書，並回復登記或註冊。","note":"一、為有效管理及提升遊艇上乘客安全，以採用分級管理方式，參考英國紅旗遊艇章程西元二○一九年一月版B部分（Red Ensign Group Yacht Code Part B）規定核予遊艇乘客定額，爰修正第二項，另修正條文第六十六條第一項定有遊艇船齡未滿十二年，全長未滿二十四公尺，且乘客定額十二人以下自用遊艇自主檢查相關規定，爰併予修正第二項。\n二、依修正條文第六十五條規定，船齡超過十二年之自用遊艇應依規定申辦定期檢查，而非自主檢查，爰有關該等遊艇於期滿五年註銷船籍之規範適用第一項，併此說明。\n三、其餘項次未修正。"}],"changed":false,"final":"船舶所有人未依規定申請施行定期檢查、特別檢查且逾期滿五年時，由航政機關通知船舶所有人於三個月內辦理；屆期仍未辦理，而無正當理由者，由航政機關公告三個月；公告期滿未提出異議者，得逕行註銷第十一條之船舶文書，並註銷登記或註冊。\n全長未滿二十四公尺，且乘員人數十二人以下自用遊艇之所有人未依規定提送自主檢查表逾期滿五年時，航政機關依前項程序辦理；公告期滿未提出異議者，得逕行註銷遊艇證書，並註銷登記或註冊。\n經航政機關逕行註銷登記或註冊之船舶，如事後發現有存在事實，船舶所有人得檢具相關文件，向航政機關重行申請施行特別檢查及核發相關文書，並回復登記或註冊。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十八條之二","current":"船舶除責令停航外，停航時，船舶所有人應申請航政機關許可；復航前船舶所有人應申請航政機關施行檢查合格後，始得航行。\n船舶停航期間不適用船舶檢查規定，船舶所有人應於申請停航時，將船舶檢查證書繳回航政機關。","versions":[{"bill":"202110165060000","text":"船舶除責令停航外，停航時，船舶所有人應申請航政機關許可，停航期限以一年為限；復航前船舶所有人應申請航政機關施行檢查合格後，始得航行。\n船舶停航期間不適用船舶檢查規定，船舶所有人應於申請停航時，將船舶檢查證書繳回航政機關。\n港口管理機關（構）、海巡機關於收到航政機關通知後，應配合管制下列船舶出港：\n一、停航船舶。\n二、未檢查合格船舶。\n三、經航政機關依本法處禁止航行之船舶。\n本法中華民國○年○月○日修正條文施行日前經航政機關許可停航之船舶，其停航許可自本法中華民國○年○月○日修正條文施行日起一年後失其效力。","note":"一、為強化停航船舶管理，確認停航船舶狀態，以督促船舶所有人妥善管理停航船舶，爰限制船舶停航每次以一年為限，修正第一項。\n二、為強化停航、未檢查合格或遭處禁止航行之船舶航行管控，杜絕該等船舶出港航行，爰規範港口管理機關（構）或海巡機關應配合管制該等船舶出港，新增第三項。\n三、針對本法修正施行前經航政機關許可停航之船舶，限制其許可停航之效期，以督促該等船舶所有人向航政機關再次申請停航許可，新增第四項。\n四、第二項未修正。"}],"changed":false,"final":"船舶除責令停航外，停航時，船舶所有人應申請航政機關許可；復航前船舶所有人應申請航政機關施行檢查合格後，始得航行。\n船舶停航期間不適用船舶檢查規定，船舶所有人應於申請停航時，將船舶檢查證書繳回航政機關。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十八條之三","current":"航政機關對中華民國船舶及非中華民國船舶經特許於中華民國各港口間運送客貨或從事非自用遊艇業務之航行安全事項得施行抽查。\n船舶除緊急救難外，不得載運超過航政機關核定之乘員人數。","versions":[{"bill":"202110165060000","text":"航政機關對下列船舶之航行安全事項得施行抽查，船舶所有人、船長、遊艇駕駛或小船駕駛不得拒絕、規避或妨礙：\n一、中華民國船舶。\n二、經特許於中華民國各港口間運送客貨之非中華民國船舶。\n三、經核准從事營業用遊艇業務之非中華民國船舶。\n四、經特許停泊於國際商港以外其他港灣口岸之非中華民國船舶。\n五、停泊於國際商港之非中華民國遊艇。\n船舶除緊急救難外，不得載運超過航政機關核定之乘員人數。","note":"一、第一項修正理由同修正條文第三條說明欄第八點前段，另將施行抽查對象分款列明，並就實務執行需要，將依本法第八條特許之非中華民國船舶及停泊於國際商港之非中華民國遊艇列為施行抽查對象；另為確保航政機關得順利辦理抽查作業，新增船舶所有人、船長、遊艇駕駛及小船駕駛義務。\n二、第二項未修正。"}],"changed":false,"final":"航政機關對中華民國船舶及非中華民國船舶經特許於中華民國各港口間運送客貨或從事非自用遊艇業務之航行安全事項得施行抽查。\n船舶除緊急救難外，不得載運超過航政機關核定之乘員人數。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第三十七條之一","current":null,"versions":[{"bill":"202110165060000","text":"工業人員定額超過十二人之船舶，應由船舶所有人或船長向航政機關申請檢查合格，取得證書。\n前項船舶之檢查、構造、艙區劃分與穩度、機器與電氣裝備安裝、防火構造、設備、兼載貨物、應急準備、工業人員定額、資格與管理、證書核發、換（補）發、註銷、撤銷或繳銷、檢查費與證書費之收取及其他應遵行事項之規則，由主管機關定之。\n第一項船舶搭載乘客、特種人員及工業人員總人數不得超過其工業人員定額。","note":"一、本條新增。\n二、本國離岸風力發電建置及維運時期需船舶載運工業人員至離岸風力發電場址作業，因船舶搭載超過十二名工業人員如發生事故可能造成大量人員傷亡，故提升該等船舶安全規範，並強化檢查機制，有其必要性，爰新增第一項。\n三、依IMO頒布之MSC.521（106）決議案，搭載超過十二名工業人員船舶之硬體規範有別於貨船及客船；另上開決議案亦規範該等船舶搭載之工業人員應具備相關海上訓練證明文件，爰新增第二項，授權主管機關就該等船舶相關硬體規範及工業人員資格訂定子法。\n四、參照IMO頒布之MSC.521（106）決議案，工業人員定額係包含工業人員、特種人員及乘客之總人數，其中乘客不得超過十二人，爰新增第三項。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第五十二條之一","current":null,"versions":[{"bill":"202110165060000","text":"依第十一條第二項第七款規定應備乘客名冊之客船，客船所有人應要求船長或其指定人員，於乘客登船時，確實核對其身分證明文件，並依航政機關公告之程序，將乘客名冊提報航政機關。但情形特殊經航政機關核准者，不在此限。","note":"一、本條新增。\n二、為逐步建構安全乘船環境，並確保乘客名冊之正確性，以利海事災害防救，爰增訂於乘客登船時核對身分證明文件及依航政機關公告之程序，將乘客名冊提報航政機關之規定。另因港口設施、設備或腹地不足等非可歸責於船舶所有人之特殊情形，或因營運型態特殊，致辦理登船身分核對確有困難，爰新增後段但書規定。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第五十五條之一","current":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"201110161340600","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，理由如下：\n(一)近年我國周邊海域因船隻活動造成海底纜線受損事件頻傳。考量海底纜線之型態多元，並非僅指海底電纜，海底輸氣管線係輸送天然氣之重要設備，有強化保護之必要。\n(二)第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。考量因過失毀壞或以其他非法方法危害海底輸氣纜線之功能正常運作，對於國內天然氣穩定供應亦將產生嚴重影響；復以海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉及避免前述情形發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項，內容未修正。\n四、為維護國內整體供氣安全穩定，對侵害第一項所定輸儲設備（包括天然氣進口事業之海底輸氣管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十七條","current":"貨船應由船舶所有人或船長向航政機關申請檢查合格，取得貨船搭客證書後，始得兼搭載乘客；其乘客定額、乘客房艙、貨船搭客證書核發、換（補）發、註銷、撤銷或繳銷、檢查、收費與管理及其他應遵行事項之規則，由主管機關定之。","versions":[{"bill":"202110165060000","text":"非客船應由船舶所有人或船長向航政機關申請檢查合格，取得非客船搭客證書後，始得兼搭載乘客；其乘客定額、乘客房艙、非客船搭客證書核發、換（補）發、註銷、撤銷或繳銷、檢查、收費與管理及其他應遵行事項之規則，由主管機關定之。\n非客船搭載乘客不得超過核定之乘客定額。","note":"一、參照SOLAS第一章規則二針對船舶搭載十二名以下乘客並非僅限於貨船，爰修正非客船均得載客之規定及搭客證書名稱，修正第一項。\n二、參照現行條文第五十二條第三項，明定非客船搭載乘客不得超過核定之乘客定額，新增第二項。"}],"changed":false,"final":"貨船應由船舶所有人或船長向航政機關申請檢查合格，取得貨船搭客證書後，始得兼搭載乘客；其乘客定額、乘客房艙、貨船搭客證書核發、換（補）發、註銷、撤銷或繳銷、檢查、收費與管理及其他應遵行事項之規則，由主管機關定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第五十九條","current":"遊艇檢查分特別檢查、定期檢查、臨時檢查及自主檢查。\n遊艇符合下列規定者，始得航行：\n一、檢查合格。\n二、全船乘員人數未逾航政機關核定之定額。\n三、依規定將設備整理完妥。","versions":[{"bill":"202110165060000","text":"遊艇檢查分特別檢查、定期檢查、臨時檢查及自主檢查。\n遊艇乘客定額不得超過三十六人。但本法中華民國○年○月○日修正施行前已取得遊艇證書，且無第六十一條第一項第三款或第四款規定應申請施行特別檢查之情形者，不在此限。\n遊艇符合下列規定者，始得航行：\n一、檢查合格。\n二、全船乘客人數未逾航政機關核定之定額。\n三、依規定將設備整理完妥。","note":"一、第一項未修正。\n二、參考英國紅旗遊艇章程西元二○一九年一月版B部分（Red Ensign Group Yacht Code Part B）規定之分級管理方式，規範遊艇乘客定額不得超過三十六人；另為避免衝擊已取得遊艇證書，且無改建、建裝情形之遊艇，新增第二項但書。現行第二項遞移為第三項。\n三、遊艇航行中之乘員種類，除修正條文第三條第十二款各目規定之人員外，均屬「乘客」，為維護遊艇航行安全，爰參照第五十二條第三項及第七十四條第二項第二款，修正現行第二項第二款。\n四、有關遊艇搭載乘員限制部分，另定於修正條文第七十二條第一項及第二項，適用第二十八條之三第二項規定，併予敘明。"}],"changed":false,"final":"遊艇檢查分特別檢查、定期檢查、臨時檢查及自主檢查。\n遊艇符合下列規定者，始得航行：\n一、檢查合格。\n二、全船乘員人數未逾航政機關核定之定額。\n三、依規定將設備整理完妥。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第六十條","current":"船長二十四公尺以上之非自用遊艇，應依第五章規定勘劃載重線；自用遊艇，免勘劃載重線。","versions":[{"bill":"202110165060000","text":"船長二十四公尺以上之營業用遊艇，應依第五章規定勘劃載重線；自用遊艇，免勘劃載重線。","note":"修正理由同修正條文第三條說明欄第八點前段。"}],"changed":false,"final":"船長二十四公尺以上之非自用遊艇，應依第五章規定勘劃載重線；自用遊艇，免勘劃載重線。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第六十一條","current":"遊艇有下列情形之一者，其所有人應申請施行特別檢查：\n一、新船建造完成後。\n二、自國外輸入。\n三、船身經修改或換裝推進機器。\n四、變更使用目的或型式。\n五、特別檢查有效期間屆滿。\n遊艇經特別檢查合格後，航政機關應核發或換發遊艇證書，其有效期間，以五年為限。但全長未滿二十四公尺之自用遊艇，其遊艇證書無期間限制。\n於本法中華民國一百零七年十一月六日修正之條文施行後建造或自國外輸入全長二十四公尺以上之非自用遊艇，應施行建造中特別檢查並經主管機關委託之驗船機構檢驗入級，或應具備建造中檢驗文件與輸入前之船級證書。\n未施行建造中檢查之遊艇，不得變更為其他船舶種類。","versions":[{"bill":"202110165060000","text":"遊艇有下列情形之一者，其所有人應申請施行特別檢查：\n一、新船建造完成後。\n二、自國外輸入。\n三、船身經修改或換裝推進機器。\n四、變更使用目的或型式。\n五、特別檢查有效期間屆滿。\n遊艇經特別檢查合格後，航政機關應核發或換發遊艇證書，其有效期間，以五年為限。但全長未滿二十四公尺且乘客定額十二人以下之自用遊艇，其遊艇證書無期間限制。\n全長二十四公尺以上之營業用遊艇應依下列規定辦理：\n一、新船建造時，應施行建造中特別檢查並經主管機關委託之驗船機構檢驗入級，不適用第一項第一款規定。\n二、自國外輸入時，應具備建造中檢驗文件與輸入前之船級證書。\n全長二十四公尺以上或乘客定額超過十二人之自用遊艇，及前項以外之營業用遊艇，依第一項第一款及第二款申請施行特別檢查時，應具備主管機關認可之驗證機構所核發之船體結構安全證明。\n未施行建造中檢查之遊艇，不得變更為其他船舶種類。","note":"一、為有效管理及提升遊艇上乘客安全，參考英國紅旗遊艇章程西元二○一九年一月版B部分（Red Ensign Group Yacht Code Part B）規定之分級管理方式，以採用乘客十二人及全長二十四公尺為分級之級距，針對原遊艇證書無期間限制之範圍為自用遊艇全長未滿二十四公尺，並限制該類自用遊艇乘客定額為十二人以下，爰修正第二項。\n二、現行就全長二十四公尺以上之非自用遊艇，於新船建造時，應施行建造中特別檢查及經驗船機構檢驗入級，其主要目的係為針對船體結構要求由驗證單位於現場進行檢驗，爰不適用第一項第一款新船建造後特別檢查規定，並將新船建造與自國外輸入分款列明，修正第三項。另「非自用」遊艇修正為「營業用」遊艇之修正理由同修正條文第三條說明欄第八點前段。\n三、為提升全長二十四公尺以上或乘客定額超過十二人之自用遊艇，及全長未滿二十四公尺之營業用遊艇之結構安全，參考現行國內外銷國外遊艇之造船廠實務作法，因多數遊艇會採製造完成後，再開始銷售國內或其他國家市場，故無法於製造前確認船主，亦尚無法確認銷售國所同意之驗證單位，爰船體結構部分，已多採用第三方認證機構出具國際標準組織之ISO 12215標準證明文件，後續再由該遊艇船旗國所認可之驗證機構確認其第三方認證符合規定，爰新增第四項。\n四、現行第四項遞移為第五項，文字未修正。"}],"changed":false,"final":"遊艇有下列情形之一者，其所有人應申請施行特別檢查：\n一、新船建造完成後。\n二、自國外輸入。\n三、船身經修改或換裝推進機器。\n四、變更使用目的或型式。\n五、特別檢查有效期間屆滿。\n遊艇經特別檢查合格後，航政機關應核發或換發遊艇證書，其有效期間，以五年為限。但全長未滿二十四公尺之自用遊艇，其遊艇證書無期間限制。\n於本法中華民國一百零七年十一月六日修正之條文施行後建造或自國外輸入全長二十四公尺以上之非自用遊艇，應施行建造中特別檢查並經主管機關委託之驗船機構檢驗入級，或應具備建造中檢驗文件與輸入前之船級證書。\n未施行建造中檢查之遊艇，不得變更為其他船舶種類。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第六十二條","current":"遊艇所有人依前條第一項第一款至第三款規定，申請施行特別檢查時，應依規定同時申請丈量船舶之容積。","versions":[{"bill":"202110165060000","text":"遊艇所有人依前條第一項第一款至第三款及第三項第一款規定，申請施行特別檢查時，應依規定同時申請丈量船舶之容積。\n遊艇所有人於遊艇登記或註冊後，遇有船身型式、佈置或容量變更，或察覺丈量及噸位計算有錯誤時，應申請重行丈量並換發遊艇證書；其由航政機關發覺者，應由該機關重行丈量並換發遊艇證書。","note":"一、配合修正條文第六十一條第三項第一款施行建造中特別檢查亦應同時申請丈量，爰修正第一項。\n二、船舶噸位係由船舶圍閉空間體積換算而得，惟實務上遊艇進行船身修改以外之改建，如上層建築物或附屬物增改建，亦可能變更其圍閉空間體積，進而使其噸位變更，爰參照現行條文第四十二條規定，新增第二項。"}],"changed":false,"final":"遊艇所有人依前條第一項第一款至第三款規定，申請施行特別檢查時，應依規定同時申請丈量船舶之容積。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第六十五條","current":"下列遊艇之所有人，應自特別檢查合格之日起，每屆滿二年六個月之前後三個月內，向遊艇所在地航政機關申請施行定期檢查：\n一、非自用遊艇。\n二、全長二十四公尺以上之自用遊艇。\n三、全長未滿二十四公尺，且乘員人數超過十二人之自用遊艇。\n遊艇船齡在十二年以上者，應於船齡每屆滿一年前後三個月內，申請實施定期檢查。\n遊艇經定期檢查合格後，航政機關應於遊艇證書上簽署。","versions":[{"bill":"202110165060000","text":"下列遊艇之所有人，應自特別檢查合格之日起，於每屆滿一年之前後三個月內，向遊艇所在地航政機關申請施行定期檢查，必要時得提前申請。但提前申請檢查且檢查合格日期早於原應申請檢查時限之首日者，應自該次定期檢查合格日後三個月起，每屆滿一年之前後三個月內申請施行定期檢查：\n一、營業用遊艇。\n二、全長二十四公尺以上之自用遊艇。\n三、全長未滿二十四公尺，且乘客定額超過十二人之自用遊艇。\n四、遊艇船齡在十二年以上者。\n遊艇經定期檢查合格後，航政機關應於遊艇證書上簽署。","note":"一、為有效管理及提升遊艇上乘客安全，以採用分級管理方式，參考英國紅旗遊艇章程西元二○一九年一月版B部分（Red Ensign Group Yacht Code Part B）管理架構，營業用遊艇及全長二十四公尺以上或乘客定額超過十二人之自用遊艇，其定期檢查時機及週期參照載客小船及客船船舶定期檢查時機及週期規定，於特別檢查後每屆滿一年之前後三個月內實施並參照修正條文第二十六條第一項修正提前定期檢查規定，修正第一項序文，原第二項修正為第一項第四款，現行第三項遞移為第二項。\n二、第一項第一款「非自用」遊艇修正為「營業用」遊艇之修正理由同修正條文第三條說明欄第八點前段。"}],"changed":false,"final":"下列遊艇之所有人，應自特別檢查合格之日起，每屆滿二年六個月之前後三個月內，向遊艇所在地航政機關申請施行定期檢查：\n一、非自用遊艇。\n二、全長二十四公尺以上之自用遊艇。\n三、全長未滿二十四公尺，且乘員人數超過十二人之自用遊艇。\n遊艇船齡在十二年以上者，應於船齡每屆滿一年前後三個月內，申請實施定期檢查。\n遊艇經定期檢查合格後，航政機關應於遊艇證書上簽署。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第六十五條之四","current":null,"versions":[{"bill":"201110161340600","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六十六條","current":"遊艇船齡未滿十二年，全長未滿二十四公尺，且乘員人數十二人以下自用遊艇之所有人，應自遊艇特別檢查合格之日起每屆滿一年之前後三個月內，自主檢查並填報自主檢查表，併遊艇證書送船籍港或註冊地航政機關備查。\n推進動力未滿十二瓩之自用遊艇，其所有人應自第一次特別檢查合格之日起，每屆滿一年之前後三個月內，施行自主檢查並填報自主檢查表送航政機關備查，且不適用特別檢查及定期檢查施行期限規定。\n自用遊艇未依前二項規定辦理者，不得航行。\n遊艇經依第二十七條第一項規定臨時檢查合格後，航政機關應於遊艇證書註明。","versions":[{"bill":"202110165060000","text":"船齡未滿十二年，全長未滿二十四公尺，且乘客定額十二人以下自用遊艇之所有人，應自遊艇特別檢查合格之日起每屆滿一年之前後三個月內，自主檢查並填報自主檢查表，併遊艇證書送船籍港或註冊地航政機關備查。\n自用遊艇未依前項規定辦理者，不得航行。\n遊艇經依第二十七條第一項規定臨時檢查合格後，航政機關應於遊艇證書註明。","note":"一、第一項修正理由同修正條文第五十九條說明欄第三點。另為有效管理及提升遊艇上乘客安全，已採用分級管理方式，針對船齡未滿十二年，全長未滿二十四公尺且乘客定額十二人以下之自用遊艇，屬自用無涉及不特定人，維持現行自主檢查方式辦理，已達航行安全之要求。\n二、為提升推進動力未滿十二瓩之自用遊艇航行安全，船齡屆滿十二年起仍應依規定辦理特別檢查及定期檢查，爰刪除第二項，現行第三項及第四項遞移為第二項及第三項。"}],"changed":false,"final":"遊艇船齡未滿十二年，全長未滿二十四公尺，且乘員人數十二人以下自用遊艇之所有人，應自遊艇特別檢查合格之日起每屆滿一年之前後三個月內，自主檢查並填報自主檢查表，併遊艇證書送船籍港或註冊地航政機關備查。\n推進動力未滿十二瓩之自用遊艇，其所有人應自第一次特別檢查合格之日起，每屆滿一年之前後三個月內，施行自主檢查並填報自主檢查表送航政機關備查，且不適用特別檢查及定期檢查施行期限規定。\n自用遊艇未依前二項規定辦理者，不得航行。\n遊艇經依第二十七條第一項規定臨時檢查合格後，航政機關應於遊艇證書註明。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第七十條","current":"遊艇不得經營客、貨運送、漁業，或供娛樂以外之用途。但得從事非漁業目的之釣魚活動。\n自用或非中華民國遊艇，不得作為非自用遊艇使用。但非中華民國遊艇符合下列條件，並經主管機關核准者，不在此限：\n一、第五條第二項第三款所定公司，承租全長十八公尺以上非中華民國遊艇。\n二、依主管機關所定保險金額，投保責任保險。\n三、檢附行政規費繳納收據及外國政府出具之適航證明文件。\n遊艇活動未涉及入出境者，於出海前填具相關船舶、航行及人員等資訊，向出海港之海岸巡防機關以電子郵件、傳真或現場等方式報備，其相關表格、程序由海岸巡防機關定之。\n遊艇入出國境涉及關務、入出境、檢疫、安全檢查程序及特許之辦法，由主管機關定之。","versions":[{"bill":"202110165060000","text":"遊艇不得經營客、貨運送、漁業，或供娛樂以外之用途。但得從事非漁業目的之釣魚活動。\n自用或非中華民國遊艇，不得作為營業用遊艇使用。但非中華民國遊艇符合下列條件，並經主管機關核准者，不在此限：\n一、第五條第二項第三款所定公司，承租全長十八公尺以上且乘客定額三十六人以下之非中華民國遊艇。\n二、依主管機關所定保險金額，投保責任保險及乘客傷害保險。\n三、檢附下列文件：\n(一)行政規費繳納收據。\n(二)外國政府出具之適航證明文件。\n(三)主管機關認可之驗證機構核發符合第七十一條第二項所定規則規定之適航證明文件，其效期以一年為限。\n(四)其他經主管機關公告之文件。\n四、第一款承租之非中華民國遊艇應符合第十五條之一輸入現成船年限表之規定。\n遊艇活動未涉及入出境者，於出海前填具相關船舶、航行及人員等資訊，向出海港之海岸巡防機關以電子郵件、傳真或現場等方式報備，其相關表格、程序由海岸巡防機關定之。\n遊艇入出國境涉及關務、入出境、檢疫、安全檢查程序及特許之辦法，由主管機關定之。","note":"一、第二項序文「非自用」遊艇修正為「營業用」遊艇之修正理由同修正條文第三條說明欄第八點前段。\n二、承租非中華民國遊艇作為營業用遊艇使用仍須符合修正條文第五十九條第二項乘客定額不得超過三十六人之規定，爰修正第二項第一款。\n三、為提升營業用之非中華民國遊艇上乘客保障，補現行責任保險之不足，新增投保乘客傷害保險規定，修正第二項第二款。\n四、將第二項第三款應檢附文件分目列明，另為確保非中華民國遊艇從事營業用遊艇相關安全規範與本國營業用遊艇一致及因應實務需要，爰予修正。\n五、考量非中華民國遊艇作為營業用遊艇之使用安全，遊艇船齡應符合第十五條之一輸入現成船年限表允許輸入年限之規定，新增第二項第四款。\n六、有關欲從事租賃非中華民國遊艇之公司，除應為第五條第二項第三款規定之公司外，並應依修正條文第七十一條之一規定審查同意後始得經營遊艇活動，併予敘明。\n七、其餘項次未修正。"}],"changed":false,"final":"遊艇不得經營客、貨運送、漁業，或供娛樂以外之用途。但得從事非漁業目的之釣魚活動。\n自用或非中華民國遊艇，不得作為非自用遊艇使用。但非中華民國遊艇符合下列條件，並經主管機關核准者，不在此限：\n一、第五條第二項第三款所定公司，承租全長十八公尺以上非中華民國遊艇。\n二、依主管機關所定保險金額，投保責任保險。\n三、檢附行政規費繳納收據及外國政府出具之適航證明文件。\n遊艇活動未涉及入出境者，於出海前填具相關船舶、航行及人員等資訊，向出海港之海岸巡防機關以電子郵件、傳真或現場等方式報備，其相關表格、程序由海岸巡防機關定之。\n遊艇入出國境涉及關務、入出境、檢疫、安全檢查程序及特許之辦法，由主管機關定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第七十一條","current":"遊艇所有人應依主管機關所定保險金額，投保責任保險，未投保者，不得出港。\n遊艇之檢查、丈量、設備、限載乘員人數、投保金額、適航水域、遊艇證書、註冊、相關規費之收取及其他應遵行事項之規則，由主管機關定之。\n各級商港、漁港、海岸、河川轄管機關，應於轄區適當地點設置遊艇停泊及遊艇拖吊升降區域，並依相關法令規劃建設及管理。","versions":[{"bill":"202110165060000","text":"遊艇所有人應依主管機關所定保險金額，投保責任保險，未依規定投保者，遊艇不得航行。\n遊艇之檢查、丈量、設備、限載乘員人數、乘客定額、責任保險投保金額、適航水域、遊艇證書、登記或註冊、相關規費之收取及其他應遵行事項之規則，由主管機關定之。\n各級商港、漁港、海岸、河川轄管機關，應於轄區適當地點設置遊艇停泊及遊艇拖吊升降區域，並依相關法令規劃建設及管理。","note":"一、第一項酌作文字修正。\n二、配合修正條文第六十一條，新增主管機關就乘客定額規範訂定子法，另為與第七十一條之一規範之傷害保險區隔，並考量總噸位二十以上之遊艇應以登記方式辦理事項，爰修正第二項授權範圍，以臻明確。\n三、第三項未修正。"}],"changed":false,"final":"遊艇所有人應依主管機關所定保險金額，投保責任保險，未投保者，不得出港。\n遊艇之檢查、丈量、設備、限載乘員人數、投保金額、適航水域、遊艇證書、註冊、相關規費之收取及其他應遵行事項之規則，由主管機關定之。\n各級商港、漁港、海岸、河川轄管機關，應於轄區適當地點設置遊艇停泊及遊艇拖吊升降區域，並依相關法令規劃建設及管理。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第七十一條之一","current":"以竊取、毀壞或其他非法方法危害裝置容量一百萬瓩以上之水力發電廠、一百二十萬瓩以上之火力發電廠之主要發電設備、燃料輸儲設備、控制室、開關場、資通訊機房，或特高壓以上輸電、變電設備或調度室之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"202110165060000","text":"從事營業用遊艇業務者，應依法辦妥公司登記及依主管機關所定保險金額，為乘客投保傷害保險，並訂定營業計畫報請航政機關核定後，始得從事營業用遊艇業務；變更時亦同。\n前項傷害保險之受益人，以被保險人本人或其法定繼承人為限，並不受保險法第一百三十五條準用第一百零五條、第一百零七條規定之限制。\n第一項之保險期間屆滿時，從事營業用遊艇業務者應予以續保。\n從事營業用遊艇業務之申請資格、傷害保險投保金額、營業計畫、相關規費之收取及其他應遵行事項之規則，由主管機關定之。","note":"一、本條新增。\n二、為加強營業用遊艇娛樂活動管理、保障乘員人身安全及強化消費者保護機制，爰規範遊艇業者應依法辦妥公司登記，並投保傷害保險及檢具營業計畫報請航政機關核定後，方能從事相關服務。\n三、依保險法第一百三十五條準用第一百零五條及第一百零七條規定，考量本法以法律強制業者須為旅客投保傷害保險之情形，並無道德危險之顧慮，爰排除前開條文之適用，俾保障旅客之利益，新增第二項。\n四、為保障乘客權益，爰參考航業法第十四條第四項規定規範保險期間屆滿時，應予續保，新增第三項。\n五、為符合遊艇載客從事休閒娛樂活動需求及強化營業用遊艇營運管理事項，將從事營業用遊艇業務之申請資格、傷害保險投保金額、營業計畫授權主管機關訂定子法，爰新增第四項。"},{"bill":"201110161340600","text":"以竊取、毀壞或其他非法方法危害裝置容量一百萬瓩以上之水力發電廠、一百二十萬瓩以上之火力發電廠之主要發電設備、燃料輸儲設備、控制室、開關場、資通訊機房，或特高壓以上輸電、變電設備、調度室，或海底電力電纜之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海底電力電纜之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、因應近期離岸風力發電發展及國內電力傳輸所需，為避免海底電力電纜受到侵害致影響電力傳輸及供應，爰於第一項新增「海底電力電纜」為保護客體，以強化保護範圍，穩定供電。凡由發電業及輸配電業等電業所設置之海底電力電纜，均屬保護對象，不限於特高壓以上者，併予補充。\n二、第二項及第三項未修正。\n三、考量海底電力電纜對電力傳輸及供應之重要性，如因過失毀壞或以其他非法方法危害其功能之正常運作，對於國內電力穩定供應將產生嚴重影響；又考量海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉並避免前述情形發生，爰參考電信管理法第七十二條第四項規定增訂第四項，明定過失犯之刑罰規範。\n四、第四項移列為第五項，內容未修正。\n五、為維護供電安全穩定，對故意侵害第一項所定電業設備（包括海底電力電纜）之犯罪態樣，就供其犯罪用之工具、船舶等有不問屬何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"}],"changed":false,"fin ":"第七十六條","current":"小船有前條第一項第一款或第二款情形，應申請丈量；經丈量之小船，因船身修改致船體容量變更者，應重行申請丈量。","versions":[{"bill":"202110165060000","text":"小船有前條第一項第一款或第二款情形，應申請丈量；小船所有人於小船註冊後，遇有船身型式、佈置或容量變更，或察覺丈量及噸位計算有錯誤時，應申請重行丈量並換發小船執照；其由航政機關發覺者，應由該機關重行丈量並換發小船執照。","note":"船舶噸位係由船舶圍閉空間體積換算而得，惟實務上小船進行船身修改以外之改建，如上層建築物或附屬物增改建，亦可能變更其圍閉空間體積，進而使其噸位變更，爰參照第四十二條規定，修正後段規定。"}],"changed":false,"final":"小船有前條第一項第一款或第二款情形，應申請丈量；經丈量之小船，因船身修改致船體容量變更者，應重行申請丈量。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第七十八條","current":"小船自特別檢查合格之日起，其所有人應依下列時限，申請施行定期檢查：\n一、載客動力小船：應於每屆滿一年之前後三個月內。\n二、非載客動力小船：應於每屆滿二年之前後三個月內。\n三、非動力小船：應於每屆滿三年之前後三個月內。\n四、載運引水人、提供研究或訓練使用之小船：每屆滿一年之前後三個月內。\n小船經定期檢查合格後，航政機關應於小船執照簽署。\n小船經依第二十七條第一項規定臨時檢查合格後，航政機關應於小船執照註明。","versions":[{"bill":"202110165060000","text":"小船自特別檢查合格之日起，其所有人應依下列時限，申請施行定期檢查，必要時得提前申請。但提前申請檢查且檢查合格日期早於原應申請檢查時限之首日者，定期檢查時限應以該次定期檢查合格日後三個月起算之：\n一、載客動力小船：應於每屆滿一年之前後三個月內。\n二、非載客動力小船：應於每屆滿二年之前後三個月內。\n三、非動力小船：應於每屆滿三年之前後三個月內。\n四、載運引水人、提供研究或訓練使用之小船：每屆滿一年之前後三個月內。\n小船經定期檢查合格後，航政機關應於小船執照簽署。\n小船經依第二十七條第一項規定臨時檢查合格後，航政機關應於小船執照註明。","note":"一、第一項修正理由同修正條文第二十六條。\n二、其餘項次未修正。"}],"changed":false,"final":"小船自特別檢查合格之日起，其所有人應依下列時限，申請施行定期檢查：\n一、載客動力小船：應於每屆滿一年之前後三個月內。\n二、非載客動力小船：應於每屆滿二年之前後三個月內。\n三、非動力小船：應於每屆滿三年之前後三個月內。\n四、載運引水人、提供研究或訓練使用之小船：每屆滿一年之前後三個月內。\n小船經定期檢查合格後，航政機關應於小船執照簽署。\n小船經依第二十七條第一項規定臨時檢查合格後，航政機關應於小船執照註明。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第八十一條","current":"小船所有人應申請航政機關檢查核定乘客定額及適航水域，並註記於小船執照後，始得載運乘客。\n載客小船船齡超過二十年者，自本法中華民國一百零七年十一月六日修正之條文施行日起一年後之第一次特別檢查起，應具備造船技師簽證有效期限不超過二年之船況評估方案報告。","versions":[{"bill":"202110165060000","text":"小船所有人應申請航政機關檢查核定乘客定額及適航水域，並註記於小船執照後，始得載運乘客。\n小船經特別檢查合格後，航政機關應核發或換發小船執照，其有效期間以十年為限。但載客小船船齡超過二十年者，核發、換發小船執照之有效期間不得超過二年。","note":"一、第一項未修正。\n二、為強化小船執照及小船檢查管理，爰將現行小船檢查丈量規則第六條第四項規範提升為法律位階，另高齡載客小船檢查之現行造船技師簽證船況評估方案報告係依據小船檢查丈量規則檢查項目辦理檢查後出具，考量該檢查已經航政機關檢查合格，實務上造船技師簽證船況評估報告與小船檢查（評估）項目相同，爰參照現行條文第二十五條第二項將高齡載客小船改以縮短特別檢查週期與小船執照之有效期間，加強高齡載客小船安全管理，修正第二項。"}],"changed":false,"final":"小船所有人應申請航政機關檢查核定乘客定額及適航水域，並註記於小船執照後，始得載運乘客。\n載客小船船齡超過二十年者，自本法中 十四條、第九十七條第一項第一款及第九十八條至第一百零二條規定外，不適用本法之規定。\n小船準用第二十八條之二第二項規定，並應將小船執照繳回航政機關。\n載客小船準用第三十四條之一規定。","note":"一、第一項規定小船適用第一章規定，爰適用本次增訂之修正條文第八條之一、第十條之一及第十一條之一，配合修正條文第八十九條之一係規範違反前開規定之罰則，爰增列該條文為小船適用之範圍。\n二、第二項及第三項未修正。"}],"changed":true,"final":"小船，除本章、第一章、第十五條之一、第二十七條第一項、第二十八條、第二十八條之一第一項與第三項、第二十八條之二第一項、第二十八條之三、第四十條第一項、第四十一條第一項與第二項前段、第八十九條第一項、第八十九條之一、第九十條、第九十二條第一項與第三項、第九十三條、第九十四條、第九十七條第一項第一款及第九十八條至第一百零二條規定外，不適用本法之規定。\n小船準用第二十八條之二第二項規定，並應將小船執照繳回航政機關。\n載客小船準用第三十四條之一規定。","finalWhy":"一、第一項規定小船適用第一章規定，爰適用本次增訂之修正條文第八條之一、第十條之一及第十一條之一，配合修正條文第八十九條之一係規範違反前開規定之罰則，爰增列該條文為小船適用之範圍。\n二、第二項及第三項未修正。","review":{"note":"照行政院提案通過","text":"小船，除本章、第一章、第十五條之一、第二十七條第一項、第二十八條、第二十八條之一第一項與第三項、第二十八條之二第一項、第二十八條之三、第四十條第一項、第四十一條第一項與第二項前段、第八十九條第一項、第八十九條之一、第九十條、第九十二條第一項與第三項、第九十三條、第九十四條、第九十七條第一項第一款及第九十八條至第一百零二條規定外，不適用本法之規定。\n小船準用第二十八條之二第二項規定，並應將小船執照繳回航政機關。\n載客小船準用第三十四條之一規定。"}},{"no":"第八十三條之一","current":null,"versions":[{"bill":"202110165060000","text":"本法所稱浮具，指非屬船舶，專供遊憩娛樂，具有浮力可供人員於水面或水中操作騎乘之器具，除非漁業用動力管筏及水上摩托車外，推進動力不得超過十二瓩。\n浮具器具之管理，依本條之規定；本條未規定者，依其他中央法令及地方自治法規辦理。\n浮具有下列情形之一者，無本法之適用：\n一、無動力。\n二、動力未滿三瓩。\n三、最大長度二公尺以下。\n使用浮具不得超過航政機關核定之操作騎乘人數，浮具所有人並應完成下列事項，始得於適用水域使用：\n一、向航政機關辦理登錄並取得證明。\n二、標示明確之器具編號。\n三、設備整理完妥。\n四、操作騎乘人數三人以上者並應經航政機關檢測合格。\n浮具操作騎乘人員皆應著救生衣，除操作騎乘於江河湖泊及其他內陸水道外，人數不得超過五人，適用水域以距岸三浬為限。但適用水域經向航政機關申請許可者，不受上開距岸範圍之限制。\n浮具之檢測、登錄、操作騎乘人數、設備、適用水域及其許可、豁免及等效、申請程序、證明之核發、換（補）發、撤銷、廢止、註銷或繳銷、規費之收取及其他應遵行事項之規則，由主管機關定之。","note":"一、本條新增。\n二、為加強臺灣沿岸水域遊憩使用之動力浮具器具管理，定義浮具，爰新增第一項。\n三、定明浮具管理原則，優先依據本條規定，查日本目前尚未針對類似我國浮具制定相關管理規定，其較接近之種類應為日本船舶職員及小型船船操縱者法中的「迷你艇」，此類迷你艇現無全日本統一的法律規定，並由各地方政府自行制定管理規定，爰於本項明確規範於本條未規定時，回歸直轄市、縣（市）等地方政府及水域管理機關針對浮具訂定之相關管理法規，確保法規適用各地水域條件與安全需求，爰新增第二項。\n四、查日本船舶安全法針對船長未滿三公尺且推進動力未滿一點五瓩之船舶無須進行檢查，另查目前可航行沿岸之橡皮艇長度為二公尺以上，故為有效管理浮具於沿海區域使用，考量無動力、動力未滿三瓩或長度二公尺以下之浮具，對航行安全影響較小，原則由地方政府自治法規進行規範，故明確免除本法適用，爰新增第三項。\n五、為配合加強動力浮具器具管理，規定浮具所有人應完成之基本義務及操作騎乘人數限制，以確保浮具所有者辨識及器具之安全性，爰新增第四項。\n六、為考量浮具器具水域活動騎乘安全，針對穿著救生衣、浮具操作騎乘人數與操作水域進行限制。另考量浮具通訊問題，因浮具於海上通訊基本通訊設備為手機，手機通訊範圍平均為距岸二至三浬，並為利使用者能迅速返回岸際並便於海巡單位進行救援，將適用水域定為距岸三浬以內，並定有例外許可申請方式，如有超過三浬之操作需求，則可循程序向航政機關提出申請，以彈性管理，爰新增第五項。\n七、為明確規範動力浮具之檢測、登錄、操作騎乘人數、設備、適用水域之相關規定，授權由主管機關訂定子法，爰新增第六項。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第八十九條","current":"違反第八條規定者，由航政機關處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上三十萬元以下罰鍰，並得命其立即離港。\n違反第三十條之一第一項規定者，其船舶禁止航行。違規航行者，得由航政機關處承擔安全營運與防止污染管理責任之機構負責人或船舶所有人新臺幣三萬元以上十五萬元以下罰鍰。","versions":[{"bill":"202110165060000","text":"非中華民國船舶違反第八條之一第一項規定，未取得安全許可文件或安全許可文件逾期，於沿近水域或中華民國專屬經濟海域從事施工、維運、探勘或調查者，由航政機關處船舶所有人或船長新臺幣三十萬元以上三百萬元以下罰鍰，並命其立即停止作業及限期改善。屆期未改善者，按次處罰，並得通知目的事業主管機關廢止其作業許可。\n非中華民國船舶從事施工、維運、探勘或調查期間，其依第八條之一第二項所定辦法之規定申請許可應檢附文件失效，由航政機關處船舶所有人或船長新臺幣十萬元以上一百萬元以下罰鍰，並命其立即停止作業及限期改善。屆期未改善者，按次處罰，得廢止其許可，並得通知目的事業主管機關廢止其作業許可。\n非中華民國船舶從事施工、維運、探勘或調查期間，違反依第八條之一第三項公告有關僱用本國籍船員人數比率與培訓規定者，由航政機關處船舶所有人新臺幣十萬元以上一百萬元以下罰鍰，並命其限期改善。屆期未改善者，按次處罰。\n中華民國船舶或非中華民國船舶違反第八條之二第一項規定，未取得主管機關委託之驗船機構核發之船級證書或船級證書失效者，由航政機關處船舶所有人或船長新臺幣十萬元以上一百萬元以下罰鍰，並命其限期改善，屆期未改善者，按次處罰。\n中華民國船舶或非中華民國船舶違反第八條之二第三項規定，到達或離開離岸風力發電場址前，未依規定通報者，由航政機關處船舶所有人新臺幣十萬元以上一百萬元以下罰鍰，並命其限期改善，屆期未改善者，按次處罰。","note":"一、將現行條文第一項移列至第八十九條之二第二項；現行條文第二項移列至第八十九條之一第二項。\n二、配合修正條文第八條之一第一項規定，非中華民國船舶在沿近水域、中華民國鄰接區或中華民國專屬經濟海域作業應取得航政機關核發之安全許可文件，對違反之行為人如船舶所有人或船長訂定罰則，爰新增第一項。\n三、配合修正條文第八條之一第二項及第三項規定，申請許可應檢附文件應保持有效，對違反之行為人如船舶所有人或船長訂定罰則，爰新增第二項。\n四、配合修正條文第八條之一第三項受僱本國籍船員人數比例與培訓等規定，對違反之行為人如船舶所有人訂定罰則，爰新增第三項。\n五、配合修正條文第八條之二第一項規定，船舶於離岸風力發電場址從事施工、維運、探勘或調查等相關作業期間，其主管機關委託之驗船機構核發之船級證書應保持有效，對違反之行為人如船舶所有人或船長訂定罰則，爰新增第四項。\n六、配合修正條文第八條之二第三項船舶入出離岸風力發電場址管制規定，對違反通報義務之行為人如船舶所有人訂定罰則，爰新增第五項。\n七、參照法務部一百零五年二月五日法制字第一○五○二五○二五四○號函，「罰則規定，應先規定罰責較重者，再規定罰責較輕者；罰責輕重相同者，再依違反條次之先、後，排列罰責規定。」"},{"bill":"202110164380000","text":"違反第八條第一項規定者，由航政機關處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上三十萬元以下罰鍰，並得命其立即離港。\n違反第八條第二項規定者，由航政機關或指定機關命其立即離開中華民國領海。船舶不依處分履行義務者，由航政機關處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上三十萬元以下罰鍰，必要時，得強制驅離或沒入其船舶。\n違反第三十條之一第一項規定者，其船舶禁止航行。違規航行者，得由航政機關處承擔安全營運與防止污染管理責任之機構負責人或船舶所有人新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、本條修正第一項，新增第二項，原第二項向後遞移。\n二、為確保我國領海之海域及航行安全，非中華民國船舶違反第八條第二項規定，於我國領海進行非屬無害通過活動者，應立即離開我國領海，免其之滯留影響航行安全。船舶不依處分履行義務者，由航政機關處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上三十萬元以下罰鍰。屢勸不聽或拒絕離開我國領海者，得強制驅離或沒入船舶，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖。"}],"changed":false,"final":"違反第八條規定者，由航政機關處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上三十萬元以下罰鍰，並得命其立即離港。\n違反第三十條之一第一項規定者，其船舶禁止航行。違規航行者，得由航政機關處承擔安全營運與防止污染管理責任之機構負責人或船舶所有人新臺幣三萬元以上十五萬元以下罰鍰。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第八十九條之一","current":"第二項　違反第三十條之一第一項規定者，其船舶禁止航行。違規航行者，得由航政機關處承擔安全營運與防止污染管理責任之機構負責人或船舶所有人新臺幣三萬元以上十五萬元以下罰鍰。","versions":[{"bill":"202110135340000","text":"違反第八條之一第一項前段、第十條之一第一項、第二項，或第十一條之一第一項、第二項之規定者，由航政機關處船舶所有人或船長新臺幣三萬元以上一千萬元以下罰鍰，並禁止錨泊、禁止航行及限期改善；改善完成後，始得放行。\n違反第八條之一第二項規定者，由航政機關處船舶所有人或船長新臺幣六千元以上六萬元以下罰鍰，並禁止航行及限期改善；改善完成後，始得放行。\n第一項涉及危害國家安全或其他違法行為者，海巡機關得主動執法，並通知航政機關協助。必要時，航政機關得命船舶進港並停泊至指定處所，其進港及停泊期間所需費用，由船舶所有人或船長負擔。","note":"一、本條新增。\n二、第一項針對非中華民國船舶，違反違反第八條之一第一項前段、第十條之一第一項、第二項，或第十一條之一第一項、第二項之規定，所作之處罰規定：\n(一)依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺者，其未維持船舶自動識別系統船載臺正常運作，或未發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼、船舶呼號等船舶識別資訊【第八條之一第一項前段】；於沿近水域航行或錨泊時，未具備船名或國際海事組織船舶識別編號等標誌，或雖具備該等標誌但卻毀壞、塗改或隱蔽者【第十條之一】；以及船舶總噸位一百五十以上，未具備航海日誌，或航海日誌漏未記載應記載事項【第十一條之一】，以上違反之行為，增訂罰則。\n(二)、根據我國港務公司之各國際商港錨泊使用管理規定，船舶AIS故障、未開啟或顯示與申報不符且無法查證確認得禁止錨泊，爰此納入本條規範。\n三、第二項係針對非中華民國船舶，因發生不可歸責於船舶所有人或船長之情事（例如海況不佳），導致船舶自動辨識系統船載臺無法正常運作時【修正條文第八條之一第二項】，由於此類情況屬於本法第二十三條第三項之未將設備整理完妥的情況，爰此新增第二項，以上狀況未通報航政機關，且未依航政機關所定期限完成改善者，參酌本法第九十二條第二項之規定，新增第二項。\n四、鑒於目前海巡署是國內唯一具備海域執法能量的機關，而疑似故意破壞我國海纜或其他非法活動常刻意關閉AIS、造假AIS、隱匿船名、國際海事組織船舶識別編號等重要資訊，爰此，新增三項，危害國家安全或其他違法行為者，授予海巡機關得主動執法。另，航政機關得命該船舶進港並停泊至指定處所，而進港及停泊期間費用，由船舶所有人或船長負擔之。"},{"bill":"202110162900000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110163080000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110163490000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合新增第八條之一、第十條之一及第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考量船舶於航行過程中若隱匿航行資訊，將危害航行安全，爰於第二項規定：航政機關得令違規船舶進港並停泊至指定處所，必要時得洽請海巡或其他機關協助通知及押送，並明定進港及停泊期間所生費用由船舶負擔。\n四、為加速處理違反第八條之一、第十條之一或第十一條之一，且有妨礙港區或水域安全之虞之船舶，於第三項明定：依第二項規定進港並停泊後，逾三個月仍未完成改善且仍有危害安全之虞者，不問船舶所有權，航政機關或行政院指定機關得予沒入。另為提升執法效率，特參酌《商港法》第二條第二項第二款，增列行政院得指定機關，並得命違規船舶就近進入鄰近港口停泊，以利及時處置。"},{"bill":"202110165060000","text":"船舶所有人或船長違反第二十三條第三項規定致船舶遭外國管制檢查留置者，由航政機關處船舶所有人或船長新臺幣六萬元以上六十萬元以下罰鍰。\n違反第三十條之一第一項規定者，其船舶禁止航行。違規航行者，由航政機關處承擔安全營運與防止污染管理責任之機構負責人或船舶所有人新臺幣六萬元以上六十萬元以下罰鍰。\n違反第三十條之一第三項所定規則中有關維持有效之安全營運及防止污染管理制度，致影響人員、船舶安全、環境者，由航政機關處承擔其安全營運與防止污染管理責任之機構負責人或船舶所有人新臺幣六萬元以上六十萬元以下罰鍰並命其限期改善，屆期未改善者，得按次處罰；情節重大者，航政機關並得停止其營業之一部或全部或廢止其評鑑合格證書。","note":"一、本條新增。\n二、考量遭外國商船管制檢查留置船舶將使本國籍船舶於國際上之評比下降，增加本國籍船舶於外國受檢機率，影響業者營運效能及競爭力，爰就該等違反修正條文第二十三條第三項義務規定致遭外國商船管制檢查留置之船舶訂定較高罰則，新增第一項。\n三、修正理由同第八十九條說明七，將現行八十九條第二項移列至本條第二項，並酌予修正文字。另考量建立安全營運與防止污染管理制度可積極防範人為失誤，加強船舶航行安全，爰對未取得評鑑合格證書而有航行行為提高罰則。\n四、為確保安全營運及防止污染管理制度維持有效性，爰增訂違反之罰則、要求限期改善及廢止其評鑑合格證書等處罰之依據，新增第三項。"},{"bill":"202110165290000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、於第一項增訂違反第八條之一、第十條之一及第十一條之一之罰則。\n三、第二項規定航政機關得要求隱匿資訊之船舶進港停泊，必要時得洽請海巡等機關協助。進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n四、第三項明定違規船舶若進港逾三個月仍未完成改善而有妨礙港口或水域安全之虞，航政機關或行政院指定機關得沒入該船舶。"},{"bill":"202110164620000","text":"有下列情形之一者，由航政機關依情節輕重處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶進港後逾三個月未依第一項規定完成改善而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合違反新增訂之第八條之一、第十條之一及第十一條之一行政法上義務之行為。\n三、第一項明定違規行為的罰則。考量到船舶航行時隱匿資訊將對航行安全構成重大危害，第二項授權航政機關，得命令違規船舶駛入指定港口停泊，並在必要時，可洽請海巡機關或其他機關協助押送，其間所生費用由違規方負擔。第三項規定，凡依前項規定被命令進港，逾三個月仍未完成改善，且有妨礙港口或水域安全之虞者，航政機關或行政院指定之機關得逕行沒入該船舶，不問其所有權歸屬。"},{"bill":"202110166370000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一及第十一條之一，針對行為人違反行政法上義務之情形，增訂相應罰則，爰訂為第一項規定。\n三、考量船舶在航行過程中若刻意隱匿資訊，將可能危及航行安全，爰於第二項增列規定：航政機關得命該船舶進港並停泊於指定處所；為確保即時且有效處理違規船舶，必要時並得請求海巡機關或其他相關機關協助通知及押送船舶至指定停泊地點。另關於進港及停泊期間所生費用之負擔，於條文後段明確規範。\n四、為加速處理違反修正條文第八條之一、第十條之一及第十一條之一，且有妨害港區或水域安全之虞之船舶，於第三項增訂規定：依第二項命其進港並停泊至指定處所之船舶，如進港後逾三個月，仍未依第一項完成改善，且持續有危及港區或水域安全之虞時，無論船舶所有權屬於何人，均由航政機關或行政院指定之機關予以沒入。另考量相關違規水域可能位於金門、馬祖等地區，為使違規船舶能迅速就近進入鄰近港口停泊並提升執行效能，爰參酌《商港法》第二條第二項第二款，將行政院指定機關納入處理範圍，以增加執法彈性。"},{"bill":"202110166830000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110166910000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110167060000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關、未於限期內完成改善、或未依規定通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備應標示之船名或識別編號。\n四、違反第十條之一第二項規定，未正確標示或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未備置航海日誌，或未詳實記載航行活動及事故情形。\n前項情形，航政機關得令該船舶進港並停泊至指定處所；必要時，得洽請海岸巡防機關或其他機關協助通知、押送及執行。其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n依前項規定進港並停泊至指定處所之船舶，進港後逾三個月仍未完成改善，且有妨礙港口或水域安全之虞者，不問其所有權人為何，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、為配合新增船舶識別與追蹤相關規定（第八條之一、第十條之一、第十一條之一），增訂違反義務之罰則，以確保識別系統正常運作與船舶資訊透明，並維護航行及海域安全。\n三、第一項明定違反船舶自動識別系統、外觀標誌及航海日誌等義務者，依行為輕重處以三萬元至一千萬元罰鍰，並得令其限期改善，屆期未改善者按次處罰，以確保持續遵循。\n四、第二項規範航政機關得命違規船舶進港停泊並負擔相關費用，必要時可請海巡或其他機關協助押送，以防止船舶逃避處理或影響他船安全。\n五、第三項為防止違規船舶長期滯港或占用水域，明定若逾三個月未改善且影響安全者，航政機關或行政院指定機關得予沒入處置，以維護港口秩序與國家海域安全。"},{"bill":"202110168540000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110167300000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110168110000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一及第十一條之一，增訂行為人違反相關規定之罰則，爰為第一項之規定。\n三、考量船舶航行航行隱匿船舶資訊恐造成船舶安全危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行，因此產生之費用由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一及第十一條之一，且有妨礙港區或水域安全之虞之船舶處置，於第三項明定依第二項規定進港並停泊至指定處所之船舶，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬何人所有，由航政機關或行政院指定之機關沒入之。"},{"bill":"202110169640000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110171150000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項罰鍰之裁罰標準，由主管機關定之。\n第一項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、為免「裁量濫用」，參酌食品安全衛生管理法第四十四條第二項裁罰標準規定，增訂第二項，定明裁罰標準，由主管機關定之。\n四、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第三項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n五、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第四項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110170950000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110170730000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又 船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110175080000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項罰鍰之裁罰標準，由主管機關定之。\n第一項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、增訂第一項，配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則。\n三、為免於行政機關做成之裁量與法律授權之目的不符，形成裁量濫用，爰參酌食品安全衛生管理法第四十四條第二項，增訂第二項。\n四、為提升海上交通的透明度，且考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請機關協助通知及執行押送船舶至指定處所。並於後段定明，就進港及停泊期間費用應由何者負擔。\n五、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依前項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"},{"bill":"202110175190000","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月， \n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。"}},{"no":"第八十九條之二","current":"第一項　違反第八條規定者，由航政機關處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上三十萬元以下罰鍰，並得命其立即離港。","versions":[{"bill":"202110165060000","text":"有下列情形之一者，由航政機關依情節輕重處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得命其限期改善，屆期未改善者，按次處罰：\n一、違反第八條之二第三項或第八條之三第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第十條之一第一項規定，未具備標誌。\n三、違反第十條之一第二項規定，未正確標示、毀壞、塗改或隱蔽標誌。\n四、違反第十一條之一規定，未具備航海日誌或航海日誌未詳實記載航行活動及事故。\n前項情形，航政機關得命船舶進港並停泊至指定處所，必要時洽請海巡、國防或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n未繳納第一項罰鍰或前項費用，經催告逾期仍未繳納者，該船舶不問屬於何人所有，航政機關得沒入之，於罰鍰處分或判決確定後，並得辦理拍賣、變賣、銷毀或依廢棄物清理法及相關法規規定清除。\n前項拍賣、變賣所得價款應扣除違反本法規定應行繳納之罰鍰及其他必要費用後，依法提存。\n違反第八條規定者，由航政機關處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上六十萬元以下罰鍰，並得命其立即離港。","note":"一、本條新增。\n二、配合新增條文第八條之二、第八條之三、第十條之一、第十一條之一規定，就行為人違反行政法上義務增訂罰則，新增第一項，並參照海洋污染防治法罰鍰範圍比例及違規程度，對於情節嚴重者訂定較高罰則。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰增訂航政機關得命該船舶進港並停泊至指定處所，以及進港及停泊期間費用之規定，並為及時有效處置違規船舶，參採海洋委員會海巡署建議，必要時洽請海巡、國防或其他機關協助通知及執行押送船舶至指定處所，新增第二項。\n四、為加速違規情節嚴重且未繳納罰鍰之船舶處置，參照道路交通管理處罰條例第八十五條之三第五項沒入處置程序，增訂航政機關得沒入船舶，並得辦理拍賣、變賣、銷毀或依廢棄物清理法及相關法規規定清除之規定，新增第三項。\n五、有關第三項船舶沒入後，經拍賣或變賣之所得價款，參照道路交通管理處罰條例第八十五條之三第三項規定，優先扣除違反本法規定應行繳納之罰鍰及其他必要費用，倘有剩餘將依法提存，新增第四項。\n六、為遏阻非中華民國船舶非法停泊於國際商港以外之港灣口岸，爰酌予提高罰度，修正現行第八十九條第一項，移列至本條第五項。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第八十九條之三","current":null,"versions":[{"bill":"202110165060000","text":"船舶違反第二十三條第四項，未經核可而施工者，由航政機關處船舶建造、改造業者及船舶所有人新臺幣一萬五千元以上十五萬元以下罰鍰，並視其情節得命其停工及限期送審圖說、拆除或回復原狀，未停工或屆期未遵行者，按次處罰。\n船舶違反第二十五條第一項第一款、第三款、第二十七條第一項第四款、第四十二條前段、第六十一條第一項第三款、第六十二條、第七十五條第一項第一款、第三款或第七十六條規定者，由航政機關處船舶所有人新臺幣一萬五千元以上十五萬元以下罰鍰，並得命其禁止航行及限期改善，屆期未改善者，按次處罰；改善完成後，始得放行。\n船舶違反第三十七條之一第一項、第五十二條第一項或第五十七條第一項前段規定者，未具備證書搭載乘客或工業人員，由航政機關處船舶所有人或船長新臺幣一萬五千元以上十五萬元以下罰鍰，並得命其禁止航行及限期改善；改善完成後，始得放行。\n工業人員定額超過十二人之船舶，有下列情形之一者，由航政機關處船舶所有人或船長新臺幣一萬五千元以上十五萬元以下罰鍰，並視其情節得命其禁止航行及限期改善，屆期未改善者，按次處罰；改善完成後，始得放行：\n一、搭載之工業人員，除以乘客身分登輪者外，未符第三十七條之一第二項所定規則之工業人員資格。\n二、違反第三十七條之一第三項規定，搭載乘客、特種人員及工業人員總人數超過其工業人員定額。","note":"一、本條新增。\n二、針對違反修正條文第二十三條第四項違規建造、改建船舶業者及船舶所有人，新增罰則，新增第一項。\n三、為強化船舶建造及改建檢查及丈量之管理，爰將違反第二十五條第一項第一款與第三款、第二十七條第一項第四款、第四十二條前段、第六十一條第一項第三款、第六十二條、第七十五條第一項第一款與第三款及第七十六條規定之罰則移列，並提高為一萬五千元以上十五萬元以下罰鍰，新增第二項。\n四、新增第三項，配合修正條文第三十七條之一第一項，新增違反罰則；另現行第九十二條第二項有關違反第五十二條第一項及修正後第五十七條第一項前段之罰則，移列本項，並考量船舶未具備證書搭載乘客或工業人員，違反該義務規定之危害與船舶載客超載無異，爰予提高未備證書載客之罰鍰。\n五、船舶搭載之工業人員未符合修正條文第三十七條之一第二項所定規則所定工業人員資格或違反第三項規定者，對違反之行為人如船舶所有人或船長增訂罰則，新增第四項。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第九十條","current":"船舶違反第二十八條之三第二項規定者，由航政機關處船舶所有人、船長或小船駕駛新臺幣一萬五千元以上十五萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n違反第五十二條第三項或第七十四條第二項第二款規定者，由航政機關處客船所有人、載客小船所有人、船長或小船駕駛新臺幣一萬五千元以上十五萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n違反第三十四條之一第一項規定，攜帶或託運危險品進入有載運乘客之客船者，處新臺幣二萬元以上十萬元以下罰鍰。","versions":[{"bill":"202110165060000","text":"船舶違反第二十八條之三第二項、第五十二條第三項、第五十七條第二項或第七十四條第二項第二款規定者，由航政機關處船舶所有人、船長或小船駕駛新臺幣一萬五千元以上十五萬元以下罰鍰，並得命其禁止航行及限期改善；改善完成後，始得放行。\n違反第五十二條之一規定，未確實核對乘客身分證明文件或未依航政機關公告之程序提報乘客名冊者，由航政機關處客船所有人新臺幣一萬五千元以上十五萬元以下以下罰鍰。\n違反依第三十四條第二項所定規則有關危險品分類、識別、包裝、標記與標示、運輸文件、裝卸作業之規定者，由航政機關處船舶所有人或船長新臺幣二萬元以上十萬元以下罰鍰。但情節輕微者，經航政機關命其限期改善，已改善完成者，免予處罰。\n違反第三十四條之一第一項規定，攜帶或託運危險品進入有載運乘客之客船者，處新臺幣二萬元以上十萬元以下罰鍰。","note":"一、第五十七條新增第二項規定非客船搭載乘客不得超過航政機關核定之乘客定額，因超載乘客之危害與客船或載客小船超載乘客無異，爰參照客船及載客小船違規超載之規定，新增罰則；另現行條文第二項裁罰對象及罰則與現行條文第一項類似，爰予以合併，並修正為得命船舶禁止航行，就情節輕微、不影響航安等情形，增加裁量彈性，爰修正第一項。\n二、配合修正條文第五十二條之一規定，客船於國內規定之水域應核對乘客身分證明文件，並依航政機關公告之程序提報乘客名冊，對違反之行為人如客船所有人訂定罰則，爰新增第二項。\n三、船舶違反第三十四條第二項所定規則者，現行無相關罰則，尚難收執行成效。為強化船舶所有人及船長對於危險品運送監督管理之責任，確保船舶航行與人命安全，爰就違反第三十四條第二項規定者，新增罰則，新增第三項。\n四、第三項遞移為第四項，內容未修正。"}],"changed":false,"final":"船舶違反第二十八條之三第二項規定者，由航政機關處船舶所有人、船長或小船駕駛新臺幣一萬五千元以上十五萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n違反第五十二條第三項或第七十四條第二項第二款規定者，由航政機關處客船所有人、載客小船所有人、船長或小船駕駛新臺幣一萬五千元以上十五萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n違反第三十四條之一第一項規定，攜帶或託運危險品進入有載運乘客之客船者，處新臺幣二萬元以上十萬元以下罰鍰。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第九十一條","current":"違反第五十九條第二項第二款、第七十條第一項或第二項規定者，由航政機關處遊艇所有人或遊艇駕駛新臺幣一萬五千元以上十五萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n違反第六十六條第一項至第三項規定者，由航政機關處遊艇所有人新臺幣三千元以上三萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。","versions":[{"bill":"202110165060000","text":"違反第五十九條第三項第二款、第七十條第一項、第二項或第七十一條第一項規定者，由航政機關處遊艇所有人或遊艇駕駛新臺幣一萬五千元以上十五萬元以下罰鍰，並得命其禁止航行及限期改善；改善完成後，始得放行。\n營業用遊艇違反第七十條第三項或第七十一條之一第四項所定規則有關營業用遊艇營運管理事項之規定者，由航政機關處從事營業用遊艇業務者新臺幣一萬五千元以上十五萬元以下罰鍰。\n違反第七十一條之一第一項規定，未依法辦妥公司登記、為乘客投保傷害保險或營業計畫之訂定、變更未報請核定，從事營業用遊艇業務，或違反同條第三項規定，保險期間屆期未予續保者，由航政機關處從事營業用遊艇業務者新臺幣一萬五千元以上十五萬元以下罰鍰，並得命其遊艇禁止航行及限期改善；改善完成後，始得放行。\n違反第六十六條第一項或第二項規定者，由航政機關處遊艇所有人新臺幣三千元以上三萬元以下罰鍰，並得命其禁止航行及限期改善；改善完成後，始得放行。","note":"一、為確保遊艇載客從事休閒娛樂活動安全保障及航行安全，對於未依修正條文第七十一條第一項規定投保者，新增罰則，並配合修正條文第五十九條第三項，爰修正第一項，並修正為得命船舶禁止航行，理由同第九十條說明一後段。\n二、營業用遊艇乘客名單須申報海巡部分，涉及後續傷害保險有效性及救援時可有效掌握船上不特定第三人之身份，爰針對違反修正條文第七十條第三項之營業遊艇新增罰則，新增第二項。配合修正條文第七十一條之一第四項規定，對從事營業用遊艇業務者違反營業用遊艇營運管理事項新增罰則，爰於第二項併予新增。另自用遊艇因屬自用性質，無涉及不特定第三人之權益，爰有關第七十條第三項部分原則由自用遊艇所有人自主管理據實向海巡署填報，不另新增罰則，併此說明。\n三、修正條文第七十一條之一第一項及第三項規範之公司登記、為乘客投保傷害保險（包含續保）及營業計畫均為從事營業用遊艇業務之必備，其中營業計畫訂定、變更未經報請航政機關核定而從事相關業務，恐影響營業用遊艇娛樂活動安全、消費者權益等，致生危害乘員人身安全之風險，爰對違反之行為人訂定罰則，新增第三項。\n四、現行第二項遞移為第四項，並配合第六十六條之修正，及同於第九十條說明一後段之理由，修正為得命船舶禁止航行，爰修正本項。"}],"changed":false,"final":"違反第五十九條第二項第二款、第七十條第一項或第二項規定者，由航政機關處遊艇所有人或遊艇駕駛新臺幣一萬五千元以上十五萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n違反第六十六條第一項至第三項規定者，由航政機關處遊艇所有人新臺幣三千元以上三萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第九十二條","current":"違反第十五條第一項、第二十五條、第二十六條第一項、第二十七條第一項、第三十條、第三十九條、第四十二條前段、第五十三條第二項規定者，由航政機關處船舶所有人新臺幣六千元以上六萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n違反第二十三條第三項、第三十七條前段、第四十九條、第五十二條第一項、第五十三條第三項或第五十七條前段規定者，由航政機關處船舶所有人或船長新臺幣六千元以上六萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n船舶所有人、船長、遊艇駕駛或小船駕駛拒絕航政機關依第二十八條之三第一項規定對船舶施行抽查，處新臺幣六千元以上六萬元以下罰鍰；經航政機關抽查有適航性疑義時，並命其禁止航行及限期改善；改善完成後，始得放行。","versions":[{"bill":"202110165060000","text":"違反第十五條第一項、第二十五條第一項第二款、第四款、第五款、第二十六條第一項、第二十七條第一項第一款至第三款、第二十八條第一項後段、第三十條、第三十九條、第五十三條第二項規定者，由航政機關處船舶所有人新臺幣六千元以上六萬元以下罰鍰，並得命其禁止航行及限期改善，屆期未改善者，按次處罰；改善完成後，始得放行。\n違反第二十三條第三項、第二十八條之二第一項後段、第三十七條前段、第四十九條、第五十三條第三項規定者，由航政機關處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣六千元以上六萬元以下罰鍰，並得命其禁止航行及限期改善；改善完成後，始得放行。\n船舶所有人、船長、遊艇駕駛或小船駕駛拒絕、規避或妨礙航政機關依第二十八條之三第一項規定對船舶施行抽查，處新臺幣六千元以上六萬元以下罰鍰；經航政機關抽查有適航性疑義時，並得命其禁止航行及限期改善；改善完成後，始得放行。","note":"一、配合修正條文第二十七條、第二十八條第一項後段修正罰則，並將違反第二十五條第一項第一款、第三款、第四十二條前段罰則移列修正條文第八十九條之三第三項，爰修正第一項；另為督促船舶所有人依本法規定申請登記、檢查、丈量等義務，併予新增按次處罰規定，並修正為得命船舶禁止航行，理由同第九十條說明一後段。\n二、船舶違反第五十二條第一項或第五十七條前段船舶未具備證書搭載乘客規定，與船舶未具備證書搭載超過十二名工業人員之危害無異，爰第二項刪除第五十二條第一項及第五十七條前段之罰則，移列至修正條文第八十九條之三第三項；另新增違反修正條文第二十八條之二第一項後段及修正條文第二十三條第三項未依規定點檢船舶之裁處，並修正為得命船舶禁止航行，理由同第九十條說明一後段。\n三、配合第二十八條之三第一項，修正第三項，並修正為得命船舶禁止航行，理由同第九十條說明一後段。"}],"changed":false,"final":"違反第十五條第一項、第二十五條、第二十六條第一項、第二十七條第一項、第三十條、第三十九條、第四十二條前段、第五十三條第二項規定者，由航政機關處船舶所有人新臺幣六千元以上六萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n違反第二十三條第三項、第三十七條前段、第四十九條、第五十二條第一項、第五十三條第三項或第五十七條前段規定者，由航政機關處船舶所有人或船長新臺幣六千元以上六萬元以下罰鍰，並命其禁止航行及限期改善；改善完成後，始得放行。\n船舶所有人、船長、遊艇駕駛或小船駕駛拒絕航政機關依第二十八條之三第一項規定對船舶施行抽查，處新臺幣六千元以上六萬元以下罰鍰；經航政機關抽查有適航性疑義時，並命其禁止航行及限期改善；改善完成後，始得放行。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第九十五條","current":"違反第六十一條第一項、第六十二條、第六十五條第一項、第二項、第六十七條第一項或第六十八條規定者，由航政機關處遊艇所有人新臺幣六千元以上六萬元以下罰鍰。","versions":[{"bill":"202110165060000","text":"違反第六十一條第一項第一款、第二款、第四款、第五款、第三項、第六十五條第一項、第六十七條第一項或第六十八條規定者，由航政機關處遊艇所有人新臺幣六千元以上六萬元以下罰鍰，並得命其禁止航行及限期改善，屆期未改善者，按次處罰；改善完成後，始得放行。","note":"配合修正條文第六十一條第三項、第六十五條及第八十九條之三第二項，修正本條，另為督促遊艇所有人依本法規定申請登記（註冊）、檢查、丈量等義務，參照修正條文第九十二條第一項，新增禁止航行及按次處罰等規定。"}],"changed":false,"final":"違反第六十一條第一項、第六十二條、第六十五條第一項、第二項、第六十七條第一項或第六十八條規定者，由航政機關處遊艇所有人新臺幣六千元以上六萬元以下罰鍰。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第九十七條","current":"有下列情形之一者，由航政機關處船舶所有人新臺幣三千元以上三萬元以下罰鍰：\n一、違反第十條第一項至第三項或第十四條規定而未申請變更、註冊。\n二、違反第十七條規定，未於領得臨時船舶國籍證書之日起三個月內為船舶所有權登記。\n違反第十八條規定，未於領得臨時船舶國籍證書之日起三個月內申請換發或補發船舶國籍證書，由航政機關處船舶所有人或船長新臺幣三千元以上三萬元以下罰鍰。\n違反第五十九條第二項第一款或第三款規定由航政機關處遊艇所有人或遊艇駕駛新臺幣三千元以上三萬元以下罰鍰。","versions":[{"bill":"202110165060000","text":"有下列情形之一者，由航政機關處船舶所有人新臺幣三千元以上三萬元以下罰鍰：\n一、違反第十條第一項至第三項或第十四條規定而未申請變更、註冊。\n二、違反第十七條規定，未於領得臨時船舶國籍證書之日起三個月內為船舶所有權登記。\n違反第十八條規定，未於領得臨時船舶國籍證書之日起三個月內申請換發或補發船舶國籍證書，由航政機關處船舶所有人或船長新臺幣三千元以上三萬元以下罰鍰。\n違反第五十九條第三項第一款或第三款規定由航政機關處遊艇所有人或遊艇駕駛新臺幣三千元以上三萬元以下罰鍰。","note":"一、配合修正條文第五十九條第三項，修正第三項。\n二、其餘項次未修正。"}],"changed":false,"final":"有下列情形之一者，由航政機關處船舶所有人新臺幣三千元以上三萬元以下罰鍰：\n一、違反第十條第一項至第三項或第十四條規定而未申請變更、註冊。\n二、違反第十七條規定，未於領得臨時船舶國籍證書之日起三個月內為船舶所有權登記。\n違反第十八條規定，未於領得臨時船舶國籍證書之日起三個月內申請換發或補發船舶國籍證書，由航政機關處船舶所有人或船長新臺幣三千元以上三萬元以下罰鍰。\n違反第五十九條第二項第一款或第三款規定由航政機關處遊艇所有人或遊艇駕駛新臺幣三千元以上三萬元以下罰鍰。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第九十七條之一","current":"以竊取、毀壞或其他非法方法危害與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水必要設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n第一項所定與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水之必要設施、設備，由中央主管機關會商相關機關及自來水事業，衡酌其規模、供水量、所在地區、影響民眾生命、身體、財產安全程度及影響經濟產業程度等因素公告之；其異動時，亦同。","versions":[{"bill":"201110161340600","text":"以竊取、毀壞或其他非法方法危害自來水事業之海底送水管線、與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水必要設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害自來水事業之海底送水管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪所用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所定與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水之必要設施、設備，由中央主管機關會商相關機關及自來水事業，衡酌其規模、供水量、所在地區、影響民眾生命、身體、財產安全程度及影響經濟產業程度等因素公告之；其異動時，亦同。","note":"一、考量自來水為民生必要資源，其設備之運作攸關人民生命、身體及財產之安全，如自來水事業之海底送水管線遭侵害，將對民生社會安定、公共及國家安全造成嚴重影響，為強化對海底送水管線之保護，於第一項增訂自來水事業之海底送水管線為保護客體。\n二、第二項及第三項未修正。\n三、考量海底送水管線對民生供水之重要性，如因過失毀壞或以其他非法方法危害其功能之正常運作，對於國內民生用水穩定供應將產生嚴重影響；又考量海底送水管線布建之相關圖資已規劃納入海洋委員會之國家海洋資料庫及共享平台，從事海域航行或相關工作者應能知悉並避免造成侵害，爰參考電信管理法第七十二條第四項規定，增訂第四項過失犯之刑罰規範。\n四、第四項移列為第五項，內容未修正。\n五、為維護全國自來水系統正常運作及安全，對第一項所定自來水事業設施、設備（包括自來水事業之海底送水管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n六、第五項移列為第七項，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第九十八條","current":"有下列情形之一者，由航政機關處小船所有人或小船駕駛新臺幣三千元以上三萬元以下罰鍰：\n一、違反第七十三條第一項後段規定，未經領有航政機關核發之小船執照而航行。\n二、違反第七十四條第二項第一款、第三款或第八十條第二項規定。\n違反第七十五條第一項、第七十六條、第七十七條第一項、第七十八條第一項或第八十一條規定由航政機關處小船所有人新臺幣三千元以上三萬元以下罰鍰。","versions":[{"bill":"202110165060000","text":"有下列情形之一者，由航政機關處小船所有人或小船駕駛新臺幣三千元以上三萬元以下罰鍰：\n一、違反第七十三條第一項後段規定，未經領有航政機關核發之小船執照而航行。\n二、違反第七十四條第二項第一款、第三款或第八十條第二項規定。\n違反第七十五條第一項第二款、第四款、第五款、第七十七條第一項、第七十八條第一項或第八十一條規定由航政機關處小船所有人新臺幣三千元以上三萬元以下罰鍰，並得命其禁止航行及限期改善，屆期未改善者，按次處罰；改善完成後，始得放行。","note":"一、第一項未修正。\n二、配合修正條文第八十九條之三第三項，修正第二項；另為督促小船所有人依本法規定申請註冊、檢查、丈量等義務，參照修正條文第九十二條第一項，併予新增禁止航行及按次處罰等規定。"}],"changed":false,"final":"有下列情形之一者，由航政機關處小船所有人或小船駕駛新臺幣三千元以上三萬元以下罰鍰：\n一、違反第七十三條第一項後段規定，未經領有航政機關核發之小船執照而航行。\n二、違反第七十四條第二項第一款、第三款或第八十條第二項規定。\n違反第七十五條第一項、第七十六條、第七十七條第一項、第七十八條第一項或第八十一條規定由航政機關處小船所有人新臺幣三千元以上三萬元以下罰鍰。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第九十八條之一","current":null,"versions":[{"bill":"202110165060000","text":"違反第八十三條之一第四項規定，使用浮具超過航政機關核定之操作騎乘人數，未依規定完成登錄、標示明確之器具編號、將設備整理完妥或未經航政機關檢測合格者，由航政機關處浮具所有人或使用人新臺幣六百元以上一萬元以下罰鍰，並得沒入浮具。浮具所有人應完成改善後始得使用。\n違反第八十三條之一第五項規定，未著救生衣或未於規定之適用水域使用浮具者，由航政機關處浮具所有人或使用人新臺幣六百元以上六千元以下罰鍰，浮具使用人並應立即返回適用水域。\n違反第八十三條之一第六項所定規則有關浮具檢測、登錄、設備、申請程序或證明之規定者，由航政機關處浮具所有人或使用人新臺幣六百元以上六千元以下罰鍰，浮具所有人並應完成改善後始得使用。","note":"一、本條新增。\n二、配合修正條文第八十三條之一第四項規定，針對操作騎乘浮具，超過航政機關核定之操作騎乘人數，或未依規定履行應完成事項，增訂對浮具所有人或使用人之罰則，並得沒入浮具，以避免危害發生，爰新增第一項。\n三、配合修正條文第八十三條之一第五項規定，針對未著救生衣及未於規定之適用水域使用浮具者增訂罰則，爰新增第二項。\n四、配合修正條文第八十三條之一第六項規定，針對違反應授權子法相關規定者增訂罰則，爰新增第三項。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第九十九條","current":"同一船舶所有人、船長、遊艇駕駛或小船駕駛在一年內，有第九十條至第九十二條、第九十四條、第九十五條、第九十七條或第九十八條所列同一行為，經航政機關處分二次以上者，得併予該船七日以上一個月以下之停航處分。","versions":[{"bill":"202110165060000","text":"同一船舶所有人、船長、遊艇駕駛或小船駕駛在一年內，有第八十九條之三、第九十條至第九十二條、第九十四條、第九十五條、第九十七條或第九十八條所列同一行為，經航政機關處分二次以上者，得併予該船七日以上一個月以下之停航處分。","note":"配合修正條文第九十二條第二項移列違反第五十二條第一項及第五十七條前段罰則至第八十九條之三，爰修正本條。"}],"changed":false <script>

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

function card(title, sub, text, base, o) {

}

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);

  };

    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });

      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
