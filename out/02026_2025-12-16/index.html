<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>船舶法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

目的之船舶。\n三、貨船：指非客船或小船，以載運貨物為目的之船舶。\n四、特種用途船：指從事特定任務之船舶。\n五、遊艇：指專供娛樂，不以從事客、貨運送或漁業為目的，以機械為主動力或輔助動力之船舶。\n六、自用遊艇：指專供船舶所有人自用或無償借予他人從事娛樂活動之遊艇。\n七、非自用遊艇：指整船出租或以其他有償方式提供可得特定之人，從事娛樂活動之遊艇。\n八、小船：指總噸位未滿五十之非動力船舶，或總噸位未滿二十之動力船舶。\n九、載客小船：指主要以運送乘客為目的之小船。\n十、乘員：指船上全部搭載之人員。\n十一、乘客：指下列以外在船上之人員：\n(一)船長、駕駛、引水人及其他受僱用由船長或駕駛指揮服務於船上之人員。\n(二)船長或駕駛有義務救助之遇難人員。\n(三)非法上船之人員。\n(四)在船上執行公權力或公務之人員。\n(五)非以載客營利為目的，經航政機關核准上船之船東代表、船舶維修、檢驗、押貨等人員或離島地區非提供載客用途船舶之附搭人員。\n(六)特種人員。\n十二、特種人員：指在特種用途船上執行與該船舶有關之特種人員，不包括乘客、船員及執行公權力之海岸巡防機關人員。\n十三、豁免：指船舶因特殊情況，主管機關或航政機關於符合安全條件或措施下，得免除適用本法之規定。\n十四、等效：指主管機關或航政機關得准許船舶採用經試驗或其他方法確定性能之材料、裝具、設備或零組件等，其功效應與相關規定要求程度同等有效。","versions":[{"bill":"202110165060000","text":"本法用詞，定義如下：\n一、船舶：指裝載人員或貨物在水面或水中且可移動之水上載具，包含但不限於客船、貨船、漁船、特種用途船、遊艇及小船。\n二、客船：指非小船或遊艇，且乘客定額超過十二人之船舶。\n三、貨船：指非客船或小船，以載運貨物為目的之船舶。\n四、特種用途船：指從事特定任務，且特種人員定額超過十二人之船舶。\n五、漁船：指用於商業採捕水產生物之船舶。但不含娛樂漁業漁船。\n六、遊艇：指專供娛樂，以機械為主動力或輔助動力之船舶。\n七、自用遊艇：指專供遊艇所有人自用或無償借予他人從事娛樂活動之遊艇。\n八、營業用遊艇：指整船出租或以其他有償方式提供他人從事娛樂活動之遊艇。\n九、小船：指總噸位未滿五十之非動力船舶，或總噸位未滿二十之動力船舶。\n十、載客小船：指主要以運送乘客為目的之小船。\n十一、乘員：指船上全部搭載之人員。\n十二、乘客：指下列以外在船上之人員：\n(一)船長、駕駛、引水人及其他受僱用由船長或駕駛指揮服務於船上之人員。\n(二)船長或駕駛有義務救助之遇難人員。\n(三)非法上船之人員。\n(四)在船上執行公權力或公務之人員。\n(五)非以載客營利為目的，經航政機關核准上船之船東代表、船舶維修、檢驗、押貨等人員或離島地區非提供載客用途船舶之附搭人員。\n(六)特種人員。\n(七)第三十七條之一規定之船舶所搭載之工業人員。\n十三、特種人員：指在特種用途船上執行與該船舶有關特定任務之下列人員：\n(一)在船上從事研究、非商業性探險與勘測之科學家、技術人員及探險家。\n(二)從事學習海洋相關職業技能之訓練及實習人員。\n(三)於加工船從事魚類或海洋生物處理人員。\n(四)救難船之救難人員、佈纜船之佈纜人員、地震勘測船之地震探測人員、潛水支援船之潛水人員、佈管船之佈管人員及起重工作船之起重機操作人員。\n(五)其他經航政機關審認與前四目相近類別之人員。\n十四、工業人員：指為至另一艘船舶或離岸設施進行海上工業活動，由船舶運送或居住於船上之人員。\n十五、豁免：指船舶因特殊情況，主管機關或航政機關於符合安全條件或措施下，得免除適用本法之規定。\n十六、等效：指主管機關或航政機關得准許船舶採用經試驗或其他方法確定性能之材料、裝具、設備或零組件等，其功效應與相關規定要求程度同等有效。\n十七、沿近水域：指位於下列水域：\n(一)依中華民國領海及鄰接區法第五條訂定之領海外界線以內之水域。\n(二)依臺灣地區與大陸地區人民關係條例第二十九條第二項規定公告之金門（含東碇、烏坵）、馬祖（含東引、亮島）及南沙地區之限制、禁止水域。","note":"一、船舶種類眾多且可能從事多種用途，例如特種用途船除從事特定任務外亦可兼運送貨物，且實務上並無法以客船、貨船、漁船、特種用途船、遊艇及小船等六類含括所有船舶類型，為避免限縮船舶種類衍生誤解，爰酌修第一款後段文字。\n二、查海上人命安全國際公約（International Convention for the Safety of Life at Sea，下稱SOLAS）第一章規則二規定，客船係指搭載超過十二名乘客之船舶，故船舶搭載超過十二名乘客從事非運送乘客目的，仍屬客船範疇，含括以提供娛樂為目的之豪華郵輪，爰刪除「主要以運送乘客為目的」。為符遊艇載客從事休閒娛樂活動需求，避免搭載超過十二名乘客之遊艇仍受客船規範限制，爰排除遊艇於客船之定義外，修正第二款。\n三、為更明確界定特種用途船範疇，爰參照交通部於九十九年公告採用「二○○八年特種用途船舶安全章程」有關特種用途船定義修正第四款。\n四、查SOLAS第一章規則二，漁船（fishing vessel）係指用以捕魚、鯨、海豹、海象或其他海洋生物資源之船舶。次查聯合國糧食及農業組織（Food and Agriculture Organization of the United Nations，下稱FAO）出版之漁船類型的定義與分類刊物所載之漁船（fishery vessel）除捕魚船（fishing vessel）外，亦包含漁業巡護船、漁業試驗船、漁獲運搬船等。因本法係參照SOLAS規範訂定船舶安全分級管理，與漁業法參照FAO定義規範其目的係為漁業產業管理不同，爰為與漁業法施行細則及漁船船員管理規則規範之「漁船」定義區隔，使本法漁船安全管理與SOLAS有效接軌，爰新增第五款。\n五、另查娛樂漁業管理辦法第二條第一項序文：「本辦法所稱娛樂漁業活動，指娛樂漁業漁船搭載乘客在船上或登島嶼、礁岩從事下列活動」，爰娛樂漁業漁船係搭載乘客從事娛樂漁業活動，其目的與從事捕撈作業之漁船不同，爰併予新增第五款但書。本法所稱「娛樂漁業漁船」係依漁業法第四十一條第五項及第四十三條授權訂定之娛樂漁業管理辦法第四條之定義，併此說明。\n六、遊艇不得經營客貨運送或漁業之規範已明定於第七十條，無於定義中敘明之必要，爰修正現行第五款，並遞移為第六款。\n七、自用遊艇定義之所有人，應以遊艇所有人較為明確，爰修正現行第六款，並遞移為第七款。\n八、為符合遊艇載客從事休閒娛樂活動需求，爰將非自用遊艇修正為營業用遊艇，並放寬該等遊艇可載不特定人，爰修正現行第七款，並遞移為第八款。\n九、為參照國際海事組織（International Maritime Organization，下稱IMO）頒布之MSC.521（106）決議案，新增第三十七條之一，就搭載超過十二名工業人員船舶硬體及所搭載之工業人員資格（包含：海上訓練及身體狀況）另訂管理規則，故搭乘該種船舶之工業人員不再以「乘客」視之，爰新增現行第十一款第七目，並遞移為第十二款。\n十、參照第四款特種用途船定義酌作文字修正，並依交通部於九十九年公告採用「二八年特種用途船舶安全章程」有關特種人員之定義列舉特種人員類型。現行第十二款後段文字，已於現行第十一款乘客規範不含特種人員，且船員及執行公權力之海岸巡防機關人員亦分列現行第十一款第一目及第四目，有別於該款第六目之特種人員，無額外排除之必要，故刪除之，爰修正現行第十二款，並遞移為第十三款。\n十一、本國離岸風力發電建置時須使用大量船舶運送相關人員赴離岸風力發電場址作業，爰依IMO頒布之MSC.521（106）決議案，新增第十四款。又查IMO頒布之MSC.521（106）決議案，離岸工業活動係指勘探、再生能源或碳氫能源領域、水產業、海上開採或類似活動（但不限於上述活動），而在相關之海上設施所進行的建造、保養、操作或維運，故離岸風力發電建置維運係屬海上工業活動，併此說明。\n十二、查西元一九八二年聯合國海洋法公約第八條規定，領海基線向陸一面的水域構成國家內水的一部分。配合修正條文第八條之一、第八條之三、第十條之一及第十一條之一規範非中華民國船舶於沿近水域應遵循之事項，其適用水域範圍包含內水及領海，新增第十七款第一目。\n十三、另針對未訂定領海外界線但實質為我國主權所及之水域部分，參照土石採取法第三十六條規定，新增第十七款第二目。\n十四、第三款未修正；第八款至第十款遞移為第九款至第十一款，第十三款、第十四款遞移為第十五款、第十六款，內容未修正。"}],"changed":false,"final":"本法用詞，定義如下：\n一、船舶：指裝載人員或貨物在水面或水中且可移動之水上載具，包含客船、貨船、漁船、特種用途船、遊艇及小船。\n二、客船：指非小船且乘客定額超過十二人，主要以運送乘客為目的之船舶。\n三、貨船：指非客船或小船，以載運貨物為目的之船舶。\n四、特種用途船：指從事特定任務之船舶。\n五、遊艇：指專供娛樂，不以從事客、貨運送或漁業為目的，以機械為主動力或輔助動力之船舶。\n六、自用遊艇：指專供船舶所有人自用或無償借予他人從事娛樂活動之遊艇。\n七、非自用遊艇：指整船出租或以其他有償方式提供可得特定之人，從事娛樂活動之遊艇。\n八、小船：指總噸位未滿五十之非動力船舶，或總噸位未滿二十之動力船舶。\n九、載客小船：指主要以運送乘客為目的之小船。\n十、乘員：指船上全部搭載之人員。\n十一、乘客：指下列以外在船上之人員：\n(一)船長、駕駛、引水人及其他受僱用由船長或駕駛指揮服務於船上之人員。\n(二)船長或駕駛有義務救助之遇難人員。\n(三)非法上船之人員。\n(四)在船上執行公權力或公務之人員。\n(五)非以載客營利為目的，經航政機關核准上船之船東代表、船舶維修、檢驗、押貨等人員或離島地區非提供載客用途船舶之附搭人員。\n(六)特種人員。\n十二、特種人員：指在特種用途船上執行與該船舶有關之特種人員，不包括乘客、船員及執行公權力之海岸巡防機關人員。\n十三、豁免：指船舶因特殊情況，主管機關或航政機關於符合安全條件或措施下，得免除適用本法之規定。\n十四、等效：指主管機關或航政機關得准許船舶採用經試驗或其他方法確定性能之材料、裝具、設備或零組件等，其功效應與相關規定要求程度同等有效。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第八條","current":"非中華民國船舶，除經中華民國政府特許或為避難者外，不得在中華民國政府公告為國際商港以外之其他港灣口岸停泊。","versions":[{"bill":"202110164380000","text":"非中華民國船舶，除經中華民國政府特許或為避難者外，不得在中華民國政府公告為國際商港以外之其他港灣口岸停泊。\n非中華民國船舶，除經中華民國政府特許或無害通過者外，不得在中華民國領海滯留。\n前項無害通過之認定與管理，準用中華民國領海及鄰接區法第七條及第八條規定。","note":"一、本條新增第二項及第三項。\n二、考慮中華民國主權及於領海，我國得就領海之海域及航行安全進行必要之管理，以及非中華民國船舶得行使無害通過之權，為避免非中華民國船舶之滯留影響航行及國家安全，爰新增本條之規定，以為規範。"}],"changed":false,"final":"非中華民國船舶，除經中華民國政府特許或為避難者外，不得在中華民國政府公告為國際商港以外之其他港灣口岸停泊。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第八條之一","current":null,"versions":[{"bill":"202110135340000","text":"非中華民國船舶依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺者，於我國沿近水域航行或錨泊時，應維持船舶自動識別系統船載臺正常運作，發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼、船舶呼號等船舶識別資訊；但因特殊情形有不公開其航行資訊之必要，經航政機關許可者，不在此限。\n前項船舶因船舶自動識別系統船載臺故障無法維持該設備正常運作者，應通報航政機關，並應依航政機關所定期限完成改善。","note":"一、本條新增。\n二、第一項明定非中華民國船舶於我國沿近水域航行或錨泊時，應維持船舶自動識別系統船載臺正常運作，發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼、船舶呼號等船舶識別資訊，藉此防堵使用假AIS。但有特殊情形，且經航政機關許可則，則不在此限：\n(一)所謂船舶自動識別系統（Automatic Identification System，AIS）是結合衛星定位與數位通訊的導航系統，AIS所發出的訊息包括：MMSI（水上行動業務識別號碼），船名、位置、航向、船速。而船舶裝設AIS系統，可以將AIS資料供應到海事雷達，進而避免海上交通發生碰撞事故，亦可廣播海象資料、危險警示區，供船舶接收，增進航行安全，因此在2000年AIS被海上人命安全國際公約（SOLAS公約）列為航行安全必要的船舶設備。爰此，參照SOLAS第五章規則十九規定，規範非中華民國船舶於我國沿近水域之義務。又查，近年來屢屢發生中國籍船隻利用權宜輪刻意破壞我國海纜等關鍵基礎設施，更透過操控AIS或使用兩套AIS等手段，增加我國執法難度，應參照國際公約，盡速將AIS入法。綜上為第一項前段規定。\n(二)查SOLAS第五章規則十九規定，船舶依相關國際協定、規則或標準不公開船舶航行資訊時，得關閉船舶自動識別系統船載臺。爰參照上開公約，而為本條但書之規定。\n三、又查船舶於海上航行，發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作的情況難免會發生，由於船舶自動識別系統失效將無法監控船舶安全航行，而需借助海岸巡防機關建置之岸際雷達予以監控，爰此於第二項明定船舶於船舶自動識別設備無法正常運作時，應通報航政機關，以利提供相關機關協助監控，確保航行安全。"},{"bill":"202110162900000","text":"除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條　附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110163080000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110163490000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、第一項規範船舶自動識別系統船載臺（Automatic Identification System，AIS）之裝設與正常運作義務。AIS可透過與鄰近船舶或岸臺交換資訊，協助船舶識別、掌握狀態與追蹤位置，避免碰撞事故並提升航行安全，亦利航政、海巡、漁政等機關監控船舶動態、維護海域秩序。但實務上部分船舶因執法任務或航行高風險水域（如受海盜或非法武力威脅）需隱匿航行資訊者，得不受此限制。所稱依本法規定，包含本法授權訂定之相關子法（如《小船檢查丈量規則》第四十一條、《船舶設備規則》第二百四十二條之三、《遊艇管理規則》第二十九條、第三十條附件三等）。非我國籍船舶則參酌《國際海上人命安全公約》（SOLAS）第五章第十九規則，對國際航線總噸位三百以上船舶、非國際航線總噸位五百以上貨船及各類客船，於我國領海及鄰接區內水域及公告禁止水域，課予維持AIS正常運作之義務。\n三、第二項規範當船舶因不可抗力或非可歸責於所有人、船長之事由，致AIS無法正常運作時，應即通報航政機關，並於指定期限完成改善；必要時，得依命按時通報位置，俾利海巡或其他主管機關透過岸際雷達、無線電通報等方式協助監控，確保航行安全。"},{"bill":"202110165060000","text":"經目的事業主管機關許可於沿近水域或專屬經濟海域從事施工、維運、探勘或調查之非中華民國船舶，應向航政機關申請許可並取得船舶安全許可文件，始得作業，航政機關於許可時並得為附款。\n前項申請許可之程序與文件、工作目的、項目與期間、責任保險投保方式、最低投保金額與保險範圍、許可有效期限、許可文件之核發、換發、變更、展期、廢止、撤銷、審查費之收取及其他應遵行事項之辦法，由主管機關定之。\n第一項非中華民國船舶應僱用中華民國籍船員之人數比率與培訓，由主管機關公告之。","note":"一、本條新增。\n二、為明確規範非中華民國船舶在沿近水域或專屬經濟海域從事施工、維運、探勘或調查等作業、國內航行權及安全，應取得船舶安全許可文件。另因船舶申請許可檢附之各類文件效期或船舶適航條件限制，將影響其安全許可之範圍，爰定明第一項航政機關於許可時得為附款。\n三、為確認非中華民國船舶適航性，並確保船舶發生海事衍生沿近水域、中華民國鄰接區、專屬經濟海域或相關人員損害得以獲得充足保障，實務上係對該船具備之船舶相關證書及保險文件進行審查，爰授權由主管機關訂定子法，新增第二項。\n四、航政機關核發許可之有效期限，係參照目的事業主管機關核准作業期限，並視船舶各類證書文件之效期，於安全許可文件中新增附款，要求該類證書文件應於到期前提供新證證書或文件，否則該安全許可文件將自動失效，以確保船舶作業期間其相關證書文件均屬有效，併此說明。\n五、為提升中華民國籍船員於海上從事施工、維運、探勘及調查之專業職能，並增加中華民國籍船員工作機會，新增第三項。"},{"bill":"202110165290000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或政府公告之禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應立即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係用於提升航行安全及強化監控船舶動態，故應於航行或錨泊時維持AIS正常運作。除例外情況如公務船執法或高風險海域，得不公開船舶航行資訊。\n(二)第二款參照海上人命安全國際公約，規範從事國際航線總噸位三百以上之船舶、非從事國際航線總噸位五百以上之貨船及不論大小之客船皆應裝設AIS。\n三、第二項規定係因船舶在航行中可能因不可預期之海況或事故致AIS無法正常運作。為確保航行安全，應立即通報航政機關並限期改善或令該船舶按時回報位置。"},{"bill":"202110164620000","text":"下列船舶除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善或令其按時通報船舶位置。","note":"一、本條新增。\n二、本次修法核心在於強制要求特定船舶必須維持「船舶自動識別系統」（AIS）的正常運作。AIS系統透過交換船舶資訊，能有效提升航行安全、防止碰撞，並強化航政、海巡等機關對船舶動態的監控能力，以維護海域秩序。考量到執法與安全特殊需求，條文也明訂例外情況，例如公務船執法，或船舶航行於海盜高風險區而有安全疑慮時，可不必開啟。此義務適用於兩類船舶：第一，依我國法規，例如小船檢查丈量規則、船舶設備規則、遊艇管理規則，應裝設AIS的本國籍船舶；第二，依據《海上人命安全國際公約》（SOLAS）標準，航行於我國領海及禁止水域內的外國籍船舶。\n三、針對AIS因不可預期海況或事故而故障的情形，第二項規定，當AIS無法正常運作時，船方有義務立即通報航政機關，並依照指示在期限內修復，或改以無線電等方式定時回報船隻位置，以確保相關單位能持續監控，維護航行安全。"},{"bill":"202110166370000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、關於第一項之規定：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）透過與鄰近船舶或岸臺交換資訊，可協助辨識船舶、掌握動態與追蹤位置，確保其持續正常運作，能有效降低碰撞事故風險，並增進航行安全，同時也有助於航政、海巡及漁政等相關機關掌握船舶動態，以維護海域秩序與安全。但考量實務上確有例外情形，例如公務船舶執法任務，或航經高風險水域（如遭遇海盜或非法武力威脅）時，如開啟AIS反而可能危及船舶安全，則不在此限。\n(二)所稱依本法規定，係指依據本法授權所制定之相關子法，如《小船檢查丈量規則》第四十一條、《船舶設備規則》第二百四十二條之三、《遊艇管理規則》第二十九條第一項第二款及第三十條附件三等。\n(三)本款之規範參照《海上人命安全國際公約》（SOLAS）第五章第十九規則，規定從事國際航線且總噸位三百以上之船舶、非國際航線且總噸位五百以上之貨船，以及所有客船，均應裝設AIS。爰此，明定非我國籍船舶航行於依《中華民國領海及鄰接區法》第五條所劃定之領海外界線內水域，及依《臺灣地區與大陸地區人民關係條例》第二十九條第二項公告之禁止水域時，均有維持AIS正常運作之義務。\n三、船舶於海上航行過程中，可能因突發海象或事故，出現非船舶所有人或船長可歸責之狀況，導致AIS無法正常運作。為確保此類船舶仍能受到必要監控，需透過海巡機關架設之岸際雷達，或經由無線電回報位置等方式補強。因此增訂第二項，規範船舶AIS如發生故障未能運作時，應立即通報航政機關，並依其所訂期限完成修復，或於規定時間回報船舶位置，以利主管機關持續掌握與協助監控。"},{"bill":"202110166830000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海以內水域或依臺灣地區與大陸地區人民關係條例第二十九條第二項規定公告之禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於中華民國領海以內水域（包括領海、內水及我國領土內之江、河、湖、泊），以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110166910000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification\nSystem，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safetyof Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110167060000","text":"下列船舶，除公務船舶執行海上執法任務，或於航經高風險海域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並持續發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法及其授權命令規定，應裝設船舶自動識別系統船載臺之中華民國籍船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依《海上人命安全國際公約》規定應裝設船舶自動識別系統船載臺之非中華民國籍船舶。\n船舶自動識別系統船載臺故障未能正常運作時，船舶所有人或船長應即通報航政機關，並於指定期限內完成修復；未能於期限內修復者，應依航政機關之指示定時通報船舶位置。","note":"一、本條新增。\n二、第一項明定我國籍及外籍船舶於我國管轄水域內航行或錨泊時，應維持船舶自動識別系統（Automatic Identification  System，AIS）正常運作，並發送正確識別資訊，以提升航行安全及監控能量。該系統可即時傳輸船舶名稱、國際海事組織識別編號、水上行動業務識別碼及呼號等資訊，供航政、海巡及漁政機關掌握船舶動態，防止碰撞事故，並防範不明船舶滯留或侵擾。\n三、針對公務船舶執法或船舶航經高風險海域可能洩漏敏感資訊之情形，參照國際慣例，允許例外不開啟AIS，以兼顧任務安全與航行保護。\n四、第二項規範船舶在AIS設備故障時之通報與補救義務，明確要求船舶所有人或船長即時通報航政機關，並於期限內修復或依指示定時通報位置，以維持監控機制之完整性。"},{"bill":"202110168540000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110167300000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)所謂「船舶自動識別系統船載臺」（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the\nSafety of Life at Sea，以下簡稱 SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110168110000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、增訂第一項，維持船舶自動識別系統船載臺正常運作，可藉由交換船舶資訊及追蹤位置，避免船舶碰撞事故，提升船舶航行安全。然實務上考量公務船因執行業務所需及航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞時，則不在此限，爰為第一款之規定。另參酌《海上人命安全國際公約》第五章規則十九規定，運行國際航線總噸位三百以上之船舶、非運行國際航線總噸位五百以上之貨船及不論大小之客船，應裝設船舶自動識別系統船載臺；以作為規範非我國船舶之規範依據。復依《中華民國領海及鄰接區法》第五條及《臺灣地區與大陸地區人民關係條例》第二十九條第二項，課予船舶維持船舶自動識別系統船載臺正常運作之義務。\n三、增訂第二項，船舶於海上航行時可能發生無法預測之狀況導致船舶自動識別系統船載臺無法正常運作；爰增訂若船舶自動識別系統船載臺未能正常運行時之例外處置規定。"},{"bill":"202110169640000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110171150000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，除有正當理由外，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時，除有正當理由外，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110170950000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110170730000","text":"下列船舶，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n前項規定，於海上執法之公務船舶，或航行於開啟該設備有危害船舶安全之虞之水域者，不在此限。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、船舶自動識別系統船載臺（AIS）係藉由主動、連續向他船或岸台自動發送船舶之靜態和動態資訊，藉由AIS通信可達到識別船隻、協助追蹤目標、簡化信息交換及提供其他輔助信息以避免碰撞等功能，以強化海上船舶交通安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態之作用。\n三、第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n四、第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n五、實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞，故修訂第二項排除第一項之限制。\n六、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第三項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110172370000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)所謂「船舶自動識別系統船載臺」（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110173860000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其依航政機關之規定定時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"},{"bill":"202110175080000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，除有正當理由外，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺係藉由與鄰近船舶或岸臺交換資訊，以利船舶之識別、掌握船舶狀態及追蹤位置，維持正常運作，可避免船舶發生事故，提升船舶航行安全，並強化有關機關監控船舶狀態，以強化船舶安全管理及維護海域秩序，惟若開啟該設備有危害船舶安全之虞時，則不再此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。"},{"bill":"202110175190000","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統（AIS）可讓船舶與周邊船舶或岸臺交換資訊，以掌握航行狀況、避免碰撞並提升航行安全，同時協助航政、海巡、漁政等機關監控船舶動態，維護海域秩序與安全。惟部分船舶因執行任務具有保密需求，如公務船執法或航經高風險海域（遭海盜或非法武力威脅等），得不公開航行資訊，不受此限。\n(二)第一款所稱「依本法規定」係指依本法授權訂定之子法規範，如小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條及第三十條附件三等。\n(三)第二款參酌《國際海上人命安全公約》（SOLAS）第五章第十九規則，規定國際航線總噸位三百以上船舶、非國際航線五百以上貨船及所有客船均須裝設AIS。爰規定非我國籍船舶進入我國領海及鄰接區法第五條所定水域，或《兩岸人民關係條例》第二十九條第二項公告之禁止水域時，應維持AIS正常運作。\n三、船舶於航行中可能因天候或事故等非可歸責因素導致AIS故障。為確保航行安全，應由海巡機關以岸際雷達或無線電定位等方式協助監控。爰規定船舶AIS故障時，須立即通報航政機關，並於指定期限內修復，或依指示定期回報船位，以利持續監控。"},{"bill":"201110161340600","text":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"}],"changed":true,"final":"下列船舶，除公務船舶於海上執法，或航行水域開啟船舶自動識別系統船載臺有危害船舶安全之虞者外，應於航行或錨泊時，維持該設備正常運作，並發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","finalWhy":"","review":{"note":"不予增訂","text":""}},{"no":"第八條之二","current":null,"versions":[{"bill":"202110165060000","text":"非中華民國船舶及特定船舶類型之中華民國船舶於離岸風力發電場址從事施工、維運、探勘或調查者，應具備主管機關委託之驗船機構核發之船級證書。\n前項特定船舶類型，由航政機關公告之。\n中華民國船舶及非中華民國船舶於到達及離開離岸風力發電場址前，應由船舶所有人或其代理人依航政機關公告之程序，通報航政機關，並維持船舶自動識別系統船載臺正常運作。\n中華民國漁船於離岸風力發電場址通過或從事漁業活動、海岸巡防機關公務船舶入出離岸風力發電場域執行公務時，不適用前項通報規定。","note":"一、本條新增。\n二、從事離岸風力發電工程船舶種類眾多，且船舶裝置之作業設備、載運方式及工程作業型態較一般船舶特殊且複雜，以一般船舶規範難以全面確保其作業安全。另因臺灣海峽海象較一般海域惡劣，為維護船舶航行安全及工作安全，並避免海洋污染，要求於離岸風力發電場址從事施工、維運、探勘或調查等作業船舶應經主管機關委託之驗船機構檢驗入級有其必要性，以確認其船體、機器及設備等符合規定，新增第一項。\n三、非中華民國船舶因其檢查、證書係由該船旗國政府授權之驗船機構辦理，惟各國針對從事離岸風力發電建置之船舶規範多有差異，為確保從事離岸風力發電建置之船舶安全規範一致性，爰該等船舶均應取得主管機關委託之驗船機構核發船級證書。另中華民國船舶依現行船舶法相關子法規定雖已具備航行之適航性。惟針對部分特殊船舶，如浮吊船、自升式平台船、探勘船等，因其特殊構造與設備，尚難以通用性之適航標準確保其於海上作業安全，新增第二項，授權航政機關得公告應取得主管機關委託之驗船機構核發船級證書之特定船舶類型。\n四、為利航政機關掌握入出離岸風力發電場址之船舶及人員，強化整合區域救援能量，爰新增第三項規定，明定入出上開場址船舶通報程序，及維持船舶自動識別系統船載臺正常運作；通報程序之內容包含通報時間、方式、內容及應檢附之文件由航政機關公告。\n五、漁船從事漁業活動係由漁政主管機關規範及監督，且與航政機關海事中心已有相關通報機制，爰免除漁船通報義務並不影響航政機關掌握特定水域船舶人員及整合區域救援能量之職能。另因漁船亦有於離岸風力發電場址通過或從事漁業活動之需要，為避免重複規範增加漁民作業困擾，爰規定無須通報。至於海岸巡防機關與航政機關已具相關聯繫管道，故無通報之必要，新增第四項。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第八條之三","current":null,"versions":[{"bill":"202110165060000","text":"下列船舶應於航行或錨泊時，維持船舶自動識別系統船載臺正常運作，發送正確之船名、國際海事組織船舶識別編號、水上行動業務識別碼、船舶呼號等識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於沿近水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n因船舶自動識別系統船載臺故障無法維持該設備正常運作者，應通報航政機關，並應依航政機關所定期限完成改善。\n船舶因特殊情形有不公開其航行資訊之必要，經航政機關許可者，不適用第一項規定。","note":"一、本條新增。\n二、船舶自動識別系統船載臺係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別身分、掌握狀態及追蹤位置，避免發生船舶碰撞事故，可有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控在沿近水域之船舶動態，維護沿近水域秩序，新增第一項。\n三、第一項第一款所稱依本法規定係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條及第三十條附件三等規定。\n四、第一項第二款參照SOLAS第五章規則十九規定，規範非中華民國船舶於沿近水域之義務。\n五、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達予以監控，爰新增第二項，規範船舶於該設備無法正常運作時應通報航政機關，以利提供相關機關協助監控。\n六、查SOLAS第五章規則十九規定，船舶依相關國際協定、規則或標準不公開船舶航行資訊時，得關閉船舶自動識別系統船載臺。另實務上部分船舶因執行業務之特殊性確有不公開船舶航行資訊之必要，如公務船舶於海上執法，或航行水域開啟該設備有危害船舶安全之虞，爰參照上開公約規定，新增第三項。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十條","current":"船舶應具備下列各款標誌：\n一、船名。\n二、船籍港名或小船註冊地名。\n三、船舶號數。\n四、載重線標誌及吃水尺度。但依第五十一條所定規則及第八十條第一項但書規定，免勘劃載重線或吃水尺度者，不在此限。\n五、法令所規定之其他標誌。\n前項標誌不得毀壞或塗抹。但為戰時避免捕獲者，不在此限。\n船舶標誌事項變更時，應依下列時限辦理變更：\n一、第一項第一款至第三款標誌事項變更時，於辦理登記或註冊之同時辦理。\n二、第一項第四款、第五款標誌事項變更時，自事實發生之日起三個月內變更。\n船舶船名、船籍港名、註冊地名、船舶號數、吃水尺度、載重線標誌、其他標誌設置及其他應遵行事項之規則，由主管機關定之。","versions":[{"bill":"202110165060000","text":"船舶應具備下列各款標誌：\n一、船名。\n二、船籍港名或小船註冊地名。\n三、船舶號數。\n四、載重線標誌及吃水尺度。但依第五十一條所定規則及第八十條第一項但書規定，免勘劃載重線或吃水尺度者，不在此限。\n五、法令所規定之其他標誌。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。但戰時為避免捕獲者，不在此限。\n船舶標誌事項變更時，應依下列時限辦理變更：\n一、第一項第一款至第三款標誌事項變更時，於辦理登記或註冊之同時辦理。\n二、第一項第四款、第五款標誌事項變更時，自事實發生之日起三個月內變更。\n船舶船名、船籍港名、註冊地名、船舶號數、吃水尺度、載重線標誌、其他標誌設置及其他應遵行事項之規則，由主管機關定之。","note":"一、修正第二項規定，配合修正條文第十條之一第二項規範非中華民國船舶應正確標示船名及IMO船舶識別編號，並不得毀壞、塗改或隱蔽，為一致之規定。\n二、船舶應依船舶標誌設置規則規定標示相關標誌，始為正確標示。\n三、其餘項次未修正。"}],"changed":false,"final":"船舶應具備下列各款標誌：\n一、船名。\n二、船籍港名或小船註冊地名。\n三、船舶號數。\n四、載重線標誌及吃水尺度。但依第五十一條所定規則及第八十條第一項但書規定，免勘劃載重線或吃水尺度者，不在此限。\n五、法令所規定之其他標誌。\n前項標誌不得毀壞或塗抹。但為戰時避免捕獲者，不在此限。\n船舶標誌事項變更時，應依下列時限辦理變更：\n一、第一項第一款至第三款標誌事項變更時，於辦理登記或註冊之同時辦理。\n二、第一項第四款、第五款標誌事項變更時，自事實發生之日起三個月內變更。\n船舶船名、船籍港名、註冊地名、船舶號數、吃水尺度、載重線標誌、其他標誌設置及其他應遵行事項之規則，由主管機關定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第十條之一","current":null,"versions":[{"bill":"202110135340000","text":"非中華民國船舶於沿近水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、第一項明定非中華民國船舶於沿近水域航行或錨泊時，船身應具備船名和國際海事組織船舶識別編號：蓋船名是區分不同船舶的基本方式。而國際海事組織（IMO）船舶識別編號則為每艘符合規定的船舶提供了一個永久且唯一的七位數字識別碼。即使船舶更換船旗國、船名或所有權，IMO編號也不會改變，這有助於更精確地識別特定船舶。是以SOLAS第十一之一章規則第三條規定，IMO船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中，船身上標位置標記IMO船舶識別編號，可有效於海上識別船舶身分，有助於海上交通管理、遇險救援和事故調查。綜上，為能在我國沿近水域，有效地從外觀上識別之非中華民國船舶身分，爰參照SOLAS規定及實務執行所需，新增第一項規定。\n三、第二項明定，非中華民國船舶於沿近水域航行或錨泊時，船身之船名和國際海事組織船舶識別編號應正確標示，並不得毀壞、塗改或隱蔽，此乃參照SOLAS第十一之一章規則三之規定。"},{"bill":"202110162900000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（International Maritime\nOrganization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"},{"bill":"202110163080000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（International Maritime\nOrganization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"},{"bill":"202110163490000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為能迅速以船舶外觀辨識是否為非我國籍船舶，參酌《國際海上人命安全公約》（SOLAS）第十一之一章規則三之規定，國際海事組織（International Maritime Organization，IMO）要求船舶識別編號應永久標記於船身及機艙隔艙壁、艙口、液貨泵間或駛上駛下空間隔艙壁等位置，其中在船身上標記IMO船舶識別編號，可有效協助於海上辨識船舶資訊。並參考修正條文第八條之一第一項第二款所定水域範圍，爰訂定第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項明定：非我國籍船舶所標示之前項識別標誌，應確實正確，不得毀損、塗改或隱蔽，以確保船舶資訊辨識完整與安全。"},{"bill":"202110165060000","text":"非中華民國船舶於沿近水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、查SOLAS第十一之一章規則三規定，IMO船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號，可有效於海上識別船舶身分。為有效於船舶外觀識別在沿近水域之非中華民國船舶身分，參照SOLAS規定及實務執行所需，新增第一項。\n三、參照非中華民國船舶應依SOLAS第十一之一章規則三規定，標示第一項規定之標誌，始為正確標示，並不得毀壞、塗改或隱蔽，新增第二項。"},{"bill":"202110165290000","text":"非中華民國船舶於中華民國領海外界線以內水域或政府公告之禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為利於辨識非我國船舶，參照SOLAS規定，要求於船身永久標記國際海事組織（International Maritime Organization，IMO）船舶識別編號，以利海上快速識別。\n三、第二項係參照SOLAS第十一之一章規則三規定之。"},{"bill":"202110164620000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為利於海上迅速透過外觀識別非我國船舶，並與國際規範接軌，本次修法參考《海上人命安全國際公約》（SOLAS）關於船舶識別的規定，增訂本條。第一項明定，航行於我國特定水域之外國船舶，應於船身等處永久標示其船名及國際海事組織（IMO）船舶識別編號。此舉可有效提升海上執法單位對船舶資訊的辨識效率。第二項則規定，前述標誌應隨時保持正確、清晰，不得有毀壞、塗改或隱蔽之情形，以確保船舶身份的透明與可追溯性。"},{"bill":"202110166370000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為能快速透過船舶外觀判斷是否屬於非我國籍船舶，參考《海上人命安全國際公約》（SOLAS）第十一之一章規則三之規範，要求船舶應將國際海事組織（International Maritime Organization，以下簡稱IMO）之識別編號，永久標記於船體與機艙隔艙壁、艙口、液貨船之液貨泵房，或駛上駛下船的相關隔艙壁等位置。其中於船體外觀標示IMO編號，最能在海上即時辨識船舶資訊。綜合上開規範，並配合修正條文第八條之一第一項第二款所訂水域範圍，爰增訂為第一項之規定。\n三、同樣依據SOLAS第十一之一章規則三之精神，於第二項進一步明定：非我國籍船舶應依前開第一項規定標示正確之標誌，且不得有損毀、塗改或遮蔽之情形，以確保標示之真實性與可辨識性。"},{"bill":"202110166830000","text":"非中華民國船舶於中華民國領海以內水域或依臺灣地區與大陸地區人民關係條例第二十九條第二項規定公告之禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（International Maritime Organization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"},{"bill":"202110166910000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（International Maritime Organization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"},{"bill":"202110167060000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應於船身明顯位置標示下列資訊：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應保持清晰、正確，不得毀損、塗改、隱蔽或以其他方式妨礙識別。","note":"一、本條新增。\n二、為強化海上識別機制，確保航政與海巡機關得以即時辨識進入我國水域之外籍船舶，爰參考《海上人命安全國際公約》（SOLAS）第十一之一章第3規則，增訂非我國船舶於我國領海外界線以內水域及公告禁止水域航行或錨泊時，應於船身標示船名與國際海事組織（IMO）識別編號。\n三、依SOLAS第十一之一章第3規定，船舶識別編號應永久標示於船身及相關明顯處，以利海上監測與識別。為防止不法船舶藉由塗改、隱蔽或偽標方式逃避監管，第二項明定標誌應保持清晰、正確，不得毀損或隱蔽，以維航行安全與海域秩序。"},{"bill":"202110168540000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（International Maritime Organization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"},{"bill":"202110167300000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（International Maritime Organization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"},{"bill":"202110168110000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為即時辨識是否為我國船舶，參酌《海上人命安全國際公約》第十一之一章規則三之規定，國際海事組織船舶識別編號應永久標記於指定位置，並參酌本法修正條文第八條之一第一項第二款水域範圍之規定，增訂本條第一項。\n三、參酌《海上人命安全國際公約》第十一之一章規則三之規定，第二項增訂第一項規定之標誌應為正確標示，並不得毀壞、塗改或隱蔽。"},{"bill":"202110169640000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（International Maritime Organization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"},{"bill":"202110171150000","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶， 河湖泊、內陸水道、港區內及其他主管機關公告指定之水域，不在此限。\n八、總噸位一百以上或乘客定額超過一百五十人之客船，於中華民國九十九年十二月十日以後建造或自國外輸入者，應具備主管機關委託之驗船機構核發之船級證書。\n九、前款客船於中華民國九十九年十二月十日前建造或自國外輸入，且船齡超過二十年以上航行外海及沿海者，自本法一百零七年十一月六日修正之條文施行日起一年後之第一次特別檢查起，應具備主管機關委託之驗船機構核發之船級證書；未經主管機關委託之驗船機構建造中檢驗者，申請入級前另應先取得造船技師簽證之圖說及計算書。\n十、前二款以外之客船，其船齡超過二十年者，自本法中華民國一百零七年十一月六日修正之條文施行日起一年後之第一次特別檢查起，應具備造船技師簽證有效期限不超過二年之有效船況評估報告。\n十一、航海、輪機日誌。\n十二、其他經主管機關公告之文書。\n船舶所在地航政機關得隨時查驗前二項船舶文書，經核對不符時，應命船舶所有人於一個月內申請變更登記或註冊，或換發船舶相關證書。\n前項查驗人員依法執行公務時，應出示有關執行職務之證明文件；其未出示者，受查驗者得拒絕之。\n第一項及第二項各款文書有效期間在航程中屆滿時，於到達目的港前仍屬有效。","versions":[{"bill":"202110165060000","text":"遊艇應具備遊艇證書；小船應具備小船執照。\n前項以外之船舶，應具備下列各款文書：\n一、船舶國籍證書或臨時船舶國籍證書。\n二、船舶檢查證書或依有關國際公約應備之證書。載運大量散裝固體、液體、氣體貨物、散裝貨油或危險品者，並應具備第三十三條第一項或第三十四條第一項規定之文書。\n三、船舶噸位證書。\n四、船員最低安全配額證書。\n五、船員名冊。\n六、船舶載重線證書。但依第五十一條所定規則規定，在技術上無勘劃載重線必要者，不在此限。\n七、載有乘客者，其乘客名冊及客船安全證書或非客船搭客證書。但航行於本國江河湖泊、內陸水道、港區內及經其他主管機關公告指定之水域，得免備乘客名冊。\n八、總噸位一百以上或乘客定額超過一百五十人之客船，於中華民國九十九年十二月十日以後建造或自國外輸入者，應具備主管機關委託之驗船機構核發之船級證書。\n九、前款客船於中華民國九十九年十二月十日前建造或自國外輸入，且船齡超過二十年以上航行外海及沿海者，自本法一百零七年十一月六日修正之條文施行日起一年後之第一次特別檢查起，應具備主管機關委託之驗船機構核發之船級證書；未經主管機關委託之驗船機構建造中檢驗者，申請入級前另應先取得造船技師簽證之圖說及計算書。\n十、航海、輪機日誌。\n十一、其他經主管機關公告之文書。\n船舶所在地航政機關得隨時查驗前二項船舶文書，經核對不符時，應命船舶所有人於一個月內申請變更登記或註冊，或換發船舶相關證書。\n前項查驗人員依法執行公務時，應出示有關執行職務之證明文件；其未出示者，受查驗者得拒絕之。\n第一項及第二項各款文書有效期間在航程中屆滿時，於到達目的港前仍屬有效。","note":"一、配合修正條文第五十七條規定，修正搭客證書名稱，並為確保非客船搭載乘客之航行安全，爰比照客船之規定修正第二項第七款，新增非客船應備乘客名冊規定，並酌作文字修正。\n二、考量現行條文第二十五條第二項針對高齡客船特別檢查頻率已有提升，且現行造船技師簽證船況評估報告係依據船舶檢查規則檢查項目辦理檢查後出具，考量該檢查已經航政機關檢查合格，實務上造船技師簽證船況評估報告與特別檢查（評估）項目相同，爰刪除第二項第十款，第十一款及第十二款移列為第十款及第十一款。\n三、其餘項次未修正。"}],"changed":false,"final":"遊艇應具備遊艇證書；小船應具備小船執照。\n前項以外之船舶，應具備下列各款文書：\n一、船舶國籍證書或臨時船舶國籍證書。\n二、船舶檢查證書或依有關國際公約應備之證書。載運大量散裝固體、液體、氣體貨物、散裝貨油或危險品者，並應具備第三十三條第一項或第三十四條第一項規定之文書。\n三、船舶噸位證書。\n四、船員最低安全配額證書。\n五、船員名冊。\n六、船舶載重線證書。但依第五十一條所定規則規定，在技術上無勘劃載重線必要者，不在此限。\n七、載有乘客者，其客船安全證書或貨船搭客證書；客船應備乘客名冊。但客船航行於本國江河湖泊、內陸水道、港區內及其他主管機關公告指定之水域，不在此限。\n八、總噸位一百以上或乘客定額超過一百五十人之客船，於中華民國九十九年十二月十日以後建造或自國外輸入者，應具備主管機關委託之驗船機構核發之船級證書。\n九、前款客船於中華民國九十九年十二月十日前建造或自國外輸入，且船齡超過二十年以上航行外海及沿海者，自本法一百零七年十一月六日修正之條文施行日起一年後之第一次特別檢查起，應具備主管機關委託之驗船機構核發之船級證書；未經主管機關委託之驗船機構建造中檢驗者，申請入級前另應先取得造船技師簽證之圖說及計算書。\n十、前二款以外之客船，其船齡超過二十年者，自本法中華民國一百零七年十一月六日修正之條文施行日起一年後之第一次特別檢查起，應具備造船技師簽證有效期限不超過二年之有效船況評估報告。\n十一、航海、輪機日誌。\n十二、其他經主管機關公告之文書。\n船舶所在地航政機關得隨時查驗前二項船舶文書，經核對不符時，應命船舶所有人於一個月內申請變更登記或註冊，或換發船舶相關證書。\n前項查驗人員依法執行公務時，應出示有關執行職務之證明文件；其未出示者，受查驗者得拒絕之。\n第一項及第二項各款文書有效期間在航程中屆滿時，於到達目的港前仍屬有效。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第十一條之一","current":null,"versions":[{"bill":"202110135340000","text":"總噸位一百五十以上之非中華民國船舶於沿近水域航行或錨泊時，應具備航海日誌，詳實記載航行活動，遇有事故應一併載明。\n前項航行活動及事故應記載下列事項：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、第一項明定，總噸位150以上之非中華民國船舶，於我國沿近水域航行或錨泊時，應具備航海日誌：\n(一)航海日誌是船舶航行活動的官方記錄，一旦發生海上事故（如碰撞、擱淺、污染等），航海日誌可幫助調查人員了解事故發生經過、原因和責任歸屬，是海上事故調查的重要證據。且詳盡航海日誌亦有利於相關主管機關監管，例如依據海岸巡防法第四條第一項第三款：「對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，是以海岸巡防機關可依上開規定查驗船舶航海日誌。\n(二)考量總噸位一百五十以上船舶之較大型船舶的活動範圍、潛在風險以及對環境和航行安全的影響較大，而限於該噸位船舶。\n(三)綜上為有效掌握在沿近水域之非中華民國船舶航行資訊，參照SOLAS第五章規則二十八規定，新增第一項。\n三、第二項明定總噸位150以上之非中華民國船舶之航海日誌，其航行活動及事故應記載事項：此乃依據IMO採納A.916(22)決議案所為之規定。"},{"bill":"202110162900000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110163080000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110163490000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國籍船舶航行資訊，參考《國際海上人命安全公約》（SOLAS）第五章規則一、四及二十八，於第一項規範船舶於航行或錨泊時應備妥航海日誌並詳實記載，並依修正條文第八條之一第一項第二款所定水域範圍，明定本條適用範圍。\n三、參酌國際海事組織（IMO）採納之A.916(22)決議案，於第二項規範航行活動及事故等應記載事項。\n四、依《海岸巡防法》第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權，但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」爰明定海岸巡防機關得依上開規定查驗船舶航海日誌，以強化航行監控及安全管理。"},{"bill":"202110165060000","text":"總噸位一百五十以上之非中華民國船舶於沿近水域航行或錨泊時，應具備航海日誌，詳實記載航行活動，遇有事故應一併載明。\n前項航行活動及事故應記載下列事項：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握在沿近水域之非中華民國船舶航行資訊，參照SOLAS第五章規則一、四及規則二十八規定，新增第一項。\n三、航海日誌內容依據IMO採納A.916(22)決議案，新增第二項。\n四、依據海岸巡防法第四條第一項第三款：「對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」爰海岸巡防機關可依上開規定查驗船舶航海日誌。"},{"bill":"202110165290000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或政府公告之禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、第一項規範係參酌SOLAS規則，為掌握非我國船舶動態，要求其在我國水域航行或錨泊時應備航海日誌並詳實記載。\n三、第二項係參酌IMO採納A.916(22)決議案，訂定航行活動及事故應記載事項之規定。\n四、海巡機關依海岸巡防法第四條規定得查驗船舶航海日誌。"},{"bill":"202110164620000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國籍船舶的航行資訊，本次修法參考《海上人命安全國際公約》（SOLAS）及國際海事組織（IMO）決議案，增訂本條。第一項要求航行或錨泊於我國特定水域的外國船舶，應備置航海日誌並詳實記載航行活動與事故。第二項則進一步明定航海日誌應記載的具體事項，以確保紀錄的完整性。"},{"bill":"202110166370000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為強化對非我國籍船舶航行資訊之掌握，參照《海上人命安全國際公約》（SOLAS）第五章規則一、規則四及規則二十八之規定，於第一項明定船舶在航行或錨泊期間，應備有航海日誌並完整記載相關事項；另依修正條文第八條之一第一項第二款所定水域範圍，確立本條之適用範圍。\n三、另參酌國際海事組織（IMO）所通過之A.916(22)決議，增訂第二項，具體規範航行過程及事故相關事項必須載明於航海日誌中。\n四、依《海岸巡防法》第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權，但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他相關資料。」因此海巡機關得依法查驗船舶之航海日誌，特此說明。"},{"bill":"202110166830000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海以內水域或依臺灣地區與大陸地區人民關係條例第二十九條第二項規定公告之禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110166910000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110167060000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應備置航海日誌，詳實記載航行活動及事故情形。\n前項航行活動及事故應至少記載下列事項：\n一、船舶開航前之狀態及檢查情形。\n二、航行期間與航程相關之詳細資訊。\n三、航行中發生事故或特殊事件之經過與處理情形。\n四、錨泊或停泊期間之操作、管理及與船舶安全、保全有關事項。","note":"一、本條新增。\n二、為強化海上航行之可追溯管理與事故責任釐清，參照《海上人命安全國際公約》（SOLAS）第五章第1條、第4條及第28條規定，增訂非我國籍船舶於中華民國領海外界線以內水域及公告禁止水域航行或錨泊時，應備置航海日誌並詳實記載航行及事故相關事項，以利航政及海巡機關掌握船舶動態與安全狀況。\n三、第二項明定航行活動及事故應記載事項，參照國際海事組織（IMO）A.916(22)決議案所列航海日誌格式與內容，包括開航前狀態、航行過程、事故處理及錨泊安全管理，並允許主管機關依實務需求增列項目。\n四、依《海岸巡防法》第四條第一項第三款規定，海巡人員執行職務時，如有合理懷疑船舶違法得命出示航海紀錄或相關文件，爰明定航海日誌為法定查驗依據，以強化執法效能並維護海域秩序。"},{"bill":"202110168540000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110167300000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款之規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，因此海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"},{"bill":"202110168110000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為掌握非我國船舶航行資訊，守護我國海域安全，參酌《海上人命安全國際公約》第五章規則一、四及規則二十八，增訂船舶航行或錨泊時，應具備航海日誌並詳實記載；另參酌本法修正條文第八條之一第一項第二款水域範圍之規定，增訂本條第一項。\n三、參酌國際海事組織採納A.916(22)決議案，增訂第二項航行活動及事故應記載事項之規定。"},{"bill":"202110169640000","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八
