<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>運動產業發展條例修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

之成立，運動產業發展條例之中央主管機關修正為運動部。"},{"bill":"202110099420000","text":"本條例所稱主管機關：在中央為運動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"配合《中央行政機關組織基準法》第二十九條條文修正，因應運動部之成立，運動產業發展條例之主管機關改隸運動部，爰修正條文。"},{"bill":"202110098830000","text":"本條例所稱主管機關：在中央為運動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應運動部組織法三讀通過，修改本法之主管機關。"},{"bill":"202110105570000","text":"本條例所稱主管機關：在中央為運動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"立法院於114年1月7日三讀通過成立「運動部」以及與其有關的7案組織法案，制定「運動部組織法」、「運動部全民運動署組織法」及「國家運動產業發展中心設置條例」3案，與修正「行政院組織法」、「教育部組織法」、「國家運動訓練中心設置條例」及「國家運動科學中心設置條例」4案。成立「運動部」，故本運動產業管轄機關已非教育部，爰酌修改為運動部。"},{"bill":"202110102160000","text":"本條例所稱主管機關：在中央為運動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"二○二五年一月二十四日公布《運動部組織法》，為促進全民運動，發展運動相關事項，形塑運動文化並落實多元平權，因此設立運動部。運動相關事項主管機關應移轉至運動部。"},{"bill":"202110102290000","text":"本條例所稱主管機關：\n在中央為運動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"配合運動部之成立，運動產業發展條例之中央主管機關修正為運動部。"},{"bill":"202110111140000","text":"本條例所稱主管機關：在中央為運動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"配合114年1月24日運動部組織法公布，將運動產業發展條例之主管機關改為運動部，爰修正條文。"},{"bill":"202110125410000","text":"本條例所稱主管機關：在中央為運動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"配合我國推廣各式運動政策，設立運動部，將本法主管機關由原教育部體育署改為運動部。"},{"bill":"202110129920000","text":"本條例所稱主管機關：在中央為運動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"配合機關改制和管轄權調整，將中央主管機關由「教育部」改為「運動部」。"}],"changed":false,"final":"本條例所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第四條","current":"本條例所稱運動產業，指提供民眾從事運動或運動觀賞所需產品或服務，或可促進運動推展之支援性服務，而具有增進國民身心健康、提升體能及生活品質之下列產業：\n一、職業或業餘運動業。\n二、運動休閒教育服務業。\n三、運動傳播媒體或資訊出版業。\n四、運動表演業。\n五、運動旅遊業。\n六、電子競技業。\n七、運動博弈業。\n八、運動經紀、管理顧問或行政管理業。\n九、運動場館或設施營建業。\n十、運動用品或器材製造、批發及零售業。\n十一、運動用品或器材租賃業。\n十二、運動保健業。\n十三、其他經中央主管機關認定之產業。\n前項各款產業內容及範圍，由中央主管機關會同各該中央目的事業主管機關定之。","versions":[{"bill":"202110077470000","text":"本條例所稱運動產業，指提供民眾從事運動或運動觀賞所需產品或服務，或可促進運動推展之支援性服務，而具有增進國民身心健康、提升體能及生活品質之下列產業：\n一、職業或業餘運動業。\n二、運動休閒教育服務業。\n三、運動傳播媒體或資訊出版業。\n四、運動表演業。\n五、運動旅遊業。\n六、電子競技業。\n七、運動博弈業：僅限於經政府合法核准及監管之體育博彩業務，並應依相關法規符合防範賭博成癮之規定。中央主管機關應訂定「運動博弈業管理辦法」，具體規範合法申請條件、防範賭博成癮措施及其他必要管理事項。\n八、運動經紀、管理顧問或行政管理業：應符合中央主管機關依「運動經紀人管理辦法」所訂定之專業資格及執業標準。中央主管機關應訂定「運動經紀人管理辦法」，規範運動經紀人之資格、執業標準、申請程序及監督管理事項，以保障從業人員之權益並維護產業專業性。\n九、運動場館或設施營建業。\n十、運動用品或器材製造、批發及零售業。\n十一、運動用品或器材租賃業。\n十二、運動保健業。\n十三、其他經中央主管機關認定之產業。\n前項各款產業內容及範圍，由中央主管機關會同各該中央目的事業主管機關定之。","note":"一、針對「運動博弈業」納入運動產業的爭議，主要因其可能與運動產業促進國民身心健康的初衷相衝突。為此，本次修法參考國際經驗，特別是英國在體育博彩的監管做法，將「運動博弈業」嚴格限定為經政府核准的合法體育博彩業務，並規範防範賭博成癮的機制，旨在平衡博弈行業的經濟效益與社會責任，回應社會對運動產業道德風險的關切。\n二、隨著運動產業多元化發展，運動博弈逐漸成為經濟活動的一部分，但其帶來的社會問題日益受到關注，尤其是在某些地區出現賭博成癮及對社會秩序的不良影響。本次修法進一步強化監管，要求所有運動博弈業務須經合法核准，並設立嚴格的監管機制，以有效減少社會風險，並在賭博行業經營與公眾福祉間維持平衡。\n三、運動經紀業因職業運動發展日益普及，但缺乏統一的專業標準和執業規範，導致經紀業務在實務上存在管理不當及運動員權益受損的風險。本次修法新增條文，要求運動經紀、管理顧問及行政管理業須依據中央主管機關制定的「運動經紀人管理辦法」運作，以確保運動經紀人具備法定的專業資格和標準，並提升行業的專業性與信任度，保障運動員的經濟利益和職業權益。\n四、運動產業的多樣化發展涵蓋運動休閒、教育服務、傳播媒體等多領域，但目前各類產業的管理標準相對分散且缺乏明確的執行依據。為此，本次修法授權中央主管機關針對各類運動產業制定具體管理辦法，涵蓋申請資格、營運要求及監督機制，以確保各類產業發展符合運動產業的健康發展目標，並提高整體產業的合規性和健全發展的可行性。"},{"bill":"202110111140000","text":"本條例所稱運動產業，指提供民眾從事運動或運動觀賞所需產品或服務，或可促進運動推展之支援性服務，而具有增進國民身心健康、提升體能及生活品質之下列產業：\n一、職業或業餘運動業。\n二、運動休閒教育服務業。\n三、運動傳播媒體或資訊出版業。\n四、運動表演業。\n五、運動旅遊業。\n六、電子競技業。\n七、經政府核准及監管之運動博弈業。\n八、運動經紀、管理顧問或行政管理業。\n九、運動場館或設施營建業。\n十、運動用品或器材製造、批發及零售業。\n十一、運動用品或器材租賃業。\n十二、運動保健業。\n十三、運動大數據人工智慧分析相關產業。\n十四、其他經中央主管機關認定之產業。\n前項各款產業內容、範圍及相關管理辦法，由中央主管機關會同各該中央目的事業主管機關於運動部成立後一年內定之。","note":"一、運動博弈雖帶來經濟活力，卻潛藏賭博成癮等風險。要求運動博弈業需合法設立並經政府監管，可以兼顧經濟效益及社會責任，減少負面影響，促進政府稅收。政府監管可以有效杜絕非法博奕，保障民眾權益，運動博奕業經核准後合法設立，可以讓政府增加稅收及促進產業發展。\n二、運動大數據人工智慧分析產業運用最新人工智慧技術，整合運動數據分析，提升運動表現、觀賽體驗及產業效益，具有高度市場潛力。因此，獨立為一類別，能促進規範與資源分配，支持專業化發展，吸引投資並拓展國際市場機會。\n三、為了促進各運動相關產業發展及其有所依循的方向，政府除了訂定各產業的內容及範圍外，應訂定相關管理辦法。\n四、為了加速推動運動產業發展，運動部成立後，應盡速與相關事業主管機關研擬各產業相關內容、範圍及管理辦法，故要求運動部在成立後一年內完成。"},{"bill":"202110129920000","text":"本條例所稱運動產業，指提供民眾從事運動或運動觀賞所需產品或服務，或可促進運動推展之支援性服務，而具有增進國民身心健康、提升體能及生活品質之下列產業：\n一、職業或業餘運動業。\n二、運動休閒教育服務業。\n三、運動傳播媒體或資訊出版業。\n四、運動表演業。\n五、運動旅遊業。\n六、電子競技業。\n七、運動博弈業。\n八、運動經紀、運動數據與影像分析、運動顧問或運動管理業。\n九、運動場館或設施營建業。\n十、運動用品或器材製造、批發及零售業。\n十一、運動用品或器材租賃業。\n十二、運動保健業。\n十三、其他經中央主管機關認定之產業。\n前項各款產業內容及範圍，由中央主管機關會同各該中央目的事業主管機關定之。","note":"一、第一項增訂第八款：\n(一)第八款增訂「運動數據與影像分析」：由於整合運動數據和影像分析是未來的重要發展趨勢之一，透過兩者結合，可讓教練在觀看比賽或訓練影像的同時，掌握運動員的各項數據，能更精確掌握運動員的表現，除能有效防止運動傷害、提升運動員表現之外，也能應用於即時的戰術調整。鑒於運動數據與影像分析服務在國際運動賽事與各種運動聯盟均已相當普及，自成一套完善的商業模式，而這正是臺灣體壇一直以來所欠缺的產業鏈拼圖，爰此新增納入運動產業之一。\n(二)現行條文「管理顧問或行政管理業」修正為「、運動顧問或運動管理業」使語意明確：蓋運動顧問主要協助民眾或運動員制定、執行並優化運動計畫，達成健康或運動目標；而運動管理則是針對運動員、團隊、賽事和相關活動的規劃、組織、行銷和管理等多方面的工作，確保運動活動順利進行。運動顧問與運動管理兩者業務內容並不相同，而作以上修正。\n二、第一項第一款至第七款、第九款至第十三款，以及第二項均未修正。"}],"changed":false,"final":"本條例所稱運動產業，指提供民眾從事運動或運動觀賞所需產品或服務，或可促進運動推展之支援性服務，而具有增進國民身心健康、提升體能及生活品質之下列產業：\n一、職業或業餘運動業。\n二、運動休閒教育服務業。\n三、運動傳播媒體或資訊出版業。\n四、運動表演業。\n五、運動旅遊業。\n六、電子競技業。\n七、運動博弈業。\n八、運動經紀、管理顧問或行政管理業。\n九、運動場館或設施營建業。\n十、運動用品或器材製造、批發及零售業。\n十一、運動用品或器材租賃業。\n十二、運動保健業。\n十三、其他經中央主管機關認定之產業。\n前項各款產業內容及範圍，由中央主管機關會同各該中央目的事業主管機關定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第八條","current":"主管機關為推展運動產業發展，對於下列事項，得採取適當之輔導或獎助措施：\n一、建立異業合作模式，提供創新商品或創新服務。\n二、拓展國際市場、建立自有品牌。\n三、辦理運動產業產學合作、創業育成及輔導。\n四、培植運動產業專業人才。\n五、建立產業媒合及交流資訊平台、蒐集產業市場資訊。\n六、運用資訊科技提升運動產業服務品質或提高運動產業競爭力。\n七、提供運動產業貸款利息補貼及信用保證。\n八、提升重大國際賽事之觀賞人口。\n九、民眾從事觀賞性或參與性運動消費支出。\n十、整合地方資源推動運動產業發展。\n十一、運動場館設施之興整建與營運。\n十二、推展運動產業研發、生產、行銷、推廣及授權等產業活動。\n十三、其他促進運動產業發展之事項。\n前項輔導或獎助對象、資格條件、審核基準、申請程序、獎助方式及其他相關事項之辦法，由中央主管機關會商各中央目的事業主管機關定之。","versions":[{"bill":"202110111140000","text":"主管機關為推展運動產業發展，對於下列事項，得採取適當之輔導或獎助措施：\n一、建立異業合作模式，提供創新商品或創新服務。\n二、拓展國際市場、建立自有品牌。\n三、辦理運動產業產學合作、創業育成及輔導。\n四、培植運動產業專業人才。\n五、建立產業媒合及交流資訊平台、蒐集產業市場資訊。\n六、運用資訊科技提升運動產業服務品質或提高運動產業競爭力。\n七、提供運動產業貸款利息補貼及信用保證。\n八、提升重大國際賽事之觀賞人口。\n九、民眾從事觀賞性或參與性運動消費支出。\n十、整合地方資源推動運動產業發展。\n十一、運動場館設施之興整建與營運。\n十二、推展運動產業研發、生產、行銷、推廣及授權等產業活動。\n十三、其他促進運動產業發展之事項。\n前項輔導或獎助對象、資格條件、審核基準、申請程序、獎助方式及其他相關事項之辦法，由中央主管機關會商各中央目的事業主管機關於運動部成立後一年內定之。","note":"為了鼓助運動產業發展，政府應加速訂定輔導或獎助辦法，故要求運動部需於成立後之一年內完成辦法訂定。"},{"bill":"202110129920000","text":"主管機關為推展運動產業發展，對於下列事項，得採取適當之輔導或獎助措施：\n一、建立異業合作模式，提供創新商品或創新服務。\n二、拓展國際市場、建立自有品牌。\n三、辦理運動產業產學合作、創業育成及輔導。\n四、培植運動產業專業人才。\n五、建立產業媒合及交流資訊平台、蒐集產業市場資訊。\n六、運用數位技術或資訊科技等運動科技提升運動產業服務品質或提高運動產業競爭力。\n七、提供運動產業貸款利息補貼及信用保證。\n八、提升重大國際賽事之觀賞人口。\n九、民眾從事觀賞性或參與性運動消費支出。\n十、整合地方資源推動運動產業發展。\n十一、運動場館設施之興整建與營運。\n十二、推展運動產業研發、生產、行銷、推廣及授權等產業活動。\n十三、其他促進運動產業發展之事項。\n前項輔導或獎助對象、資格條件、審核基準、申請程序、獎助方式及其他相關事項之辦法，由中央主管機關會商各中央目的事業主管機關定之。","note":"一、修正第一項：第六款增訂運動科技（Sport Technology），所謂運動科技係指以運動為本體，藉由將IoT、DataTech、雲端、AI、5G等數位技術結合運動器材、感測裝置等，為運動創造新的價值、提升運動體驗。簡言之，運動科技是利用先進技術結合器材、裝置和軟體等，協助職業／業餘／一般運動者達到更好的運動表現，或讓賽事觀賞者藉數位技術獲得更佳的觀賽體驗者，均屬之。\n二、第一項第一款至第五款、第七款至第十三款，以及第二項均未修正。"}],"changed":true,"final":"主管機關為推展運動產業發展，對於下列事項，得採取適當之輔導或獎助措施：\n一、建立異業合作模式，提供創新商品或創新服務。\n二、拓展國際市場、建立自有品牌。\n三、辦理運動產業產學合作、創業育成及輔導。\n四、培植運動產業專業人才。\n五、建立產業媒合及交流資訊平台、蒐集產業市場資訊。\n六、運用數位技術或資訊科技等運動科技提升運動產業服務品質或提高運動產業競爭力。\n七、提供運動產業貸款利息補貼及信用保證。\n八、提升重大國際賽事之觀賞人口。\n九、民眾從事觀賞性或參與性運動消費支出。\n十、整合地方資源推動運動產業發展。\n十一、運動場館設施之興整建與營運。\n十二、推展運動產業研發、生產、行銷、推廣及授權等產業活動。\n十三、其他促進運動產業發展之事項。\n前項輔導或獎助對象、資格條件、審核基準、申請程序、獎助方式及其他相關事項之辦法，由中央主管機關會商各中央目的事業主管機關定之。","finalWhy":"一、修正第一項：第六款增訂運動科技（Sport Technology），所謂運動科技係指以運動為本體，藉由將IoT、DataTech、雲端、AI、5G等數位技術結合運動器材、感測裝置等，為運動創造新的價值、提升運動體驗。簡言之，運動科技是利用先進技術結合器材、裝置和軟體等，協助職業／業餘／一般運動者達到更好的運動表現，或讓賽事觀賞者藉數位技術獲得更佳的觀賽體驗者，均屬之。\n二、第一項第一款至第五款、第七款至第十三款，以及第二項均未修正。","review":{"note":"照委員蔡其昌等17人提案通過","text":"主管機關為推展運動產業發展，對於下列事項，得採取適當之輔導或獎助措施：\n一、建立異業合作模式，提供創新商品或創新服務。\n二、拓展國際市場、建立自有品牌。\n三、辦理運動產業產學合作、創業育成及輔導。\n四、培植運動產業專業人才。\n五、建立產業媒合及交流資訊平台、蒐集產業市場資訊。\n六、運用數位技術或資訊科技等運動科技提升運動產業服務品質或提高運動產業競爭力。\n七、提供運動產業貸款利息補貼及信用保證。\n八、提升重大國際賽事之觀賞人口。\n九、民眾從事觀賞性或參與性運動消費支出。\n十、整合地方資源推動運動產業發展。\n十一、運動場館設施之興整建與營運。\n十二、推展運動產業研發、生產、行銷、推廣及授權等產業活動。\n十三、其他促進運動產業發展之事項。\n前項輔導或獎助對象、資格條件、審核基準、申請程序、獎助方式及其他相關事項之辦法，由中央主管機關會商各中央目的事業主管機關定之。"}},{"no":"第十三條","current":"中央主管機關應會同相關政府機關、金融機構及信用保證機構，建立運動產業發展投資之優惠融資管道及信用保證機制，協助運動事業取得推展運動業務所需資金。","versions":[{"bill":"202110099420000","text":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資、優惠融資管道及信用保證機制，並提供優惠措施引導民間資金投入，以協助各階段經營之運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制與績效指標等相關事項之辦法，由中央主管機關會同相關目的事業主管機關定之。","note":"一、修正第一項、新增第二項、新增第三項。\n二、修正第一項之條文內容。茲因本法現行僅有融資輔導措施，因應鼓勵產業發展之政策目標，參照《文化創意產業發展法》第十九條第一項之規定，增加相關優惠措施。\n三、新增第二項。參照《文化創意產業發展法》第九條，新增國發基金應提撥一定比例投資運動產業。運動產業能於未來成長。\n四、新增第三項。增訂相關投資規範中央主管機關會同目的事業主管機關定之。"},{"bill":"202110098830000","text":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業投資獎勵及輔導措施、優惠融資管道及信用保證機制，引導民間資金投入，以協助運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制與績效指標等相關事項之辦法，由中央主管機關會同各目的事業主管機關定之。","note":"一、為扶植運動產業，使其更容易獲得發展所需資金，爰比照對文化創意產業的投融資雙軌制，於本條新增投資輔導獎勵措施。\n二、新增第二項，參考文化創意產業發展法第九條規範國發基金應提撥一定比例於運動產業。"},{"bill":"202110102160000","text":"中央主管機關應會同或協調相關政府機關（構）、金融機構及信用保證機構，建立運動產業投資、優惠融資管道及信用保證機制，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制與績效指標等相關事項之辦法，由中央主管機關會同相關目的事業主管機關定之。","note":"一、第一項酌為文字修正，參酌《文化創意產業發展法》第十九條第一項之規定，為帶動運動產業發展，中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業投資、優惠融資管道等，促進運動產業發展之鼓勵措施。運動相關產業正值發展初期，中央主管機關應帶動運動產業發展，應提供相關優惠措施引導民間資金投入，為運動產業奠定發展基石。\n二、增列第二項及第三項，參酌《文化創意產業發展法》第九條之規定，政府為帶動文化創意產業發展，國發基金應提撥一定比例投資文化創意產業，並授權由主管機關訂定投資審核、撥款機制與績效指標等相關事項辦法。為發展運動產業發展，亦應參酌對文創產業之扶植措施，以政府資金挹注，進而引入民間資金，活絡運動產業發展環境。"},{"bill":"202110125410000","text":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立並推動運動產業投資獎勵及輔導措施、優惠融資管道及信用保證機制，以引導民間資金投入運動產業，協助運動事業取得推展其業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制與績效指標等相關事項之辦法，由中央主管機關會同各目的事業主管機關定之。","note":"一、第一項條文酌予文字修正，參照《文化創意產業發展法》第十九條第一項之規定，為促進運動產業之發展，中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立投資誘因、優惠融資機制及相關信用保證措施，作為鼓勵民間資本投入之政策工具。考量我國運動相關產業處於發展初期階段，中央主管機關更應扮演積極推動與整合資源之角色，透過建立完善之政策架構與優惠措施，有效引導資金流入，為運動產業永續發展奠定穩固基礎。\n二、本條增列第二項及第三項，係參考《文化創意產業發展法》第九條之立法例，該條明定政府為促進文化創意產業發展，國家發展基金應提撥一定比例資金投入該產業，並授權主管機關訂定投資審核、撥款機制及績效指標等相關辦法。運動產業作為兼具產業性與公共利益之新興領域，為促進其永續發展，爰比照文創產業之扶植架構，導入國家資金作為引導機制，建立投資誘因及資源挹注機制，藉由公部門領頭投入，帶動民間資本參與，進而形塑具活力之運動產業發展環境。"},{"bill":"202110130520000","text":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資、優惠融資管道及信用保證機制，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制及績效指標等相關事項之辦法，由中央主管機關會同相關目的事業主管機關定之。","note":"現行「運動產業發展條例」僅有融資輔導措施，為促進運動產業發展，提升運動產業競爭力，爰提出修法增加「投資」相關法源，協助引進資金投資運動事業，以取得發展運動產業所需資金。"},{"bill":"202110130560000","text":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資、優惠融資管道及信用保證機制，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制及績效指標等相關事項之規則，由中央主管機關會同相關目的事業主管機關定之。","note":"現行運動產業發展條例僅有融資輔導措施，因應運動部成立並為促進運動產業發展，提升運動產業競爭力，有協助引進資金投資運動產業，以利運動事業取得推展運動業務所需資金之必要，爰參考文化創意產業發展法第九條及第十九條第一項規定，修正如下：\n一、參考文創法第十九條第一項規定，修正第一項，增訂中央主管機關應協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資管道，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金，促進運動產業發展。\n二、參考文創法第九條第一項規定，增列第二項，明定國家發展基金應提撥一定比例投資運動產業。\n三、參考文創法第九條第二項規定，增列第三項，明定國家發展基金投資運動產業之審核、撥款機制及績效指標等相關事項之規則，由中央主管機關會同相關目的事業主管機關定之。又所稱目的事業主管機關，為國家發展委員會。"},{"bill":"202110132230000","text":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資、優惠融資管道及信用保證機制，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制及績效指標等相關事項之規則，由中央主管機關會同相關目的事業主管機關定之。","note":"現行運動產業發展條例僅有融資輔導措施，因應運動部成立並為促進運動產業發展，提升運動產業競爭力，有協助引進資金投資運動產業，以利運動事業取得推展運動業務所需資金之必要，爰參考文化創意產業發展法第九條及第十九條第一項規定，修正如下：\n一、參考文創法第十九條第一項規定，修正第一項，增訂中央主管機關應協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資管道，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金，促進運動產業發展。\n二、參考文創法第九條第一項規定，增列第二項，明定國家發展基金應提撥一定比例投資運動產業。\n三、參考文創法第九條第二項規定，增列第三項，明定國家發展基金投資運動產業之審核、撥款機制及績效指標等相關事項之規則，由中央主管機關會同相關目的事業主管機關定之。又所稱目的事業主管機關，為國家發展委員會。"},{"bill":"202110132580000","text":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資、優惠融資管道及信用保證機制，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制及績效指標等相關事項之辦法，由中央主管機關會同相關目的事業主管機關定之。","note":"現行運動產業發展條例僅有融資輔導措施，因應運動部成立並為促進運動產業發展，提升運動產業競爭力，有協助引進資金投資運動產業，以利運動事業取得推展運動業務所需資金之必要，爰參考文化創意產業發展法（以下簡稱文創法）第九條及第十九條第一項規定，修正如下：\n一、參考文創法第十九條第一項規定，修正第一項，增訂中央主管機關應協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資管道，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金，促進運動產業發展。\n二、參考文創法第九條第一項規定，增列第二項，明定國家發展基金應提撥一定比例投資運動產業。\n三、參考文創法第九條第二項規定，增列第三項，明定國家發展基金投資運動產業之審核、撥款機制及績效指標等相關事項之辦法，由中央主管機關會同相關目的事業主管機關定之。又所稱目的事業主管機關，為國家發展委員會。"}],"changed":true,"final":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資、優惠融資管道及信用保證機制，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制及績效指標等相關事項之辦法，由中央主管機關會同相關目的事業主管機關定之。","finalWhy":"原運動產業發展條例僅有融資輔導措施，因應運動部成立並為促進運動產業發展，提升運動產業競爭力，有協助引進資金投資運動產業，以利運動事業取得推展運動業務所需資金之必要，爰參考文化創意產業發展法（以下簡稱文創法）第九條及第十九條第一項規定，修正如下：\n一、參考文創法第十九條第一項規定，修正第一項，增訂中央主管機關應協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資管道，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金，促進運動產業發展。\n二、參考文創法第九條第一項規定，增列第二項，明定國家發展基金應提撥一定比例投資運動產業。\n三、參考文創法第九條第二項規定，增列第三項，明定國家發展基金投資運動產業之審核、撥款機制及績效指標等相關事項之辦法，由中央主管機關會同相關目的事業主管機關定之。又所稱目的事業主管機關，為國家發展委員會。","review":{"note":"照行政院提案通過","text":"中央主管機關應會同或協調相關政府機關、金融機構及信用保證機構，建立運動產業發展投資、優惠融資管道及信用保證機制，並提供優惠措施引導民間資金投入，以協助各經營階段之運動事業取得推展運動業務所需資金。\n國家發展基金應提撥一定比例投資運動產業。\n前項投資之審核、撥款機制及績效指標等相關事項之辦法，由中央主管機關會同相關目的事業主管機關定之。"}},{"no":"第二十四條","current":"體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","versions":[{"bill":"202110068330000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為鼓勵民間企業舉辦運動賽事或活動，增加觀賞型及參與型之運動人口，提升我國民眾運動消費支出，爰增訂運動事業舉辦運動賽事或活動，符合規定者，其門票免徵營業稅。"},{"bill":"202110072730000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為鼓勵運動事業舉辦之運動賽事或活動，增加觀賞型及參與型之運動人口，爰明定運動事業舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入可免徵營業稅。"},{"bill":"202110074580000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、本法於2021年增訂第二十六條之二有關營利事業捐贈職業或業餘運動業及重點運動賽事之營所稅優惠措施，加強企業捐贈運動產業之誘因。惟由企業而非體育團體自行舉辦之體育活動，無法適用本條賦稅優惠。\n三、為鼓勵運動事業舉辦賽事或活動，增加民眾從事觀賞性或參與性運動消費支出。爰於第一項明定運動事業符合本條規定者，其門票收入可免徵營業稅。"},{"bill":"202110075200000","text":"運動相關事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為促進民間運動相關事業舉辦運動賽事或相關活動，提升民眾之運動參與度，爰增訂運動事業舉辦運動賽事或活動，符合規定者，其門票免徵營業稅。"},{"bill":"202110090830000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為鼓勵運動事業及民間企業舉辦運動賽事或活動，提升民眾運動意願及習慣，爰提案修正本條例第二十四條條文，明定運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入可免徵營業稅。"},{"bill":"202110093520000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為鼓勵運動事業及民間企業舉辦運動賽事或活動，以提升民眾運動意願及習慣，爰修訂運動事業及體育團體舉辦之運動賽事與活動，凡符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入可免徵營業稅。"},{"bill":"202110093760000","text":"運動關係事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"為鼓勵民間企業舉辦運動賽事或活動，增加觀賞型及參與型運動之人數，以提升我國民眾在運動方面之消費支出，故增訂運動關係事業舉辦運動賽事或活動，如符合規定者，其門票免徵營業稅。"},{"bill":"202110096430000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為鼓勵符合本法第四條規定之運動產業，投入舉辦運動賽事或活動，以促進民眾從事觀賞性或參與性之運動消費支出，爰於第一項增訂其門票免徵營業稅。"},{"bill":"202110097500000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為鼓勵民間企業舉辦運動賽事或活動，增加觀賞型及參與型之運動人口，提升我國民眾運動消費支出，爰增訂運動事業舉辦運動賽事或活動，符合規定者，其門票免徵營業稅。"},{"bill":"202110105690000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為增進運動事業舉辦運動賽事或活動之意願，擴大民眾運動參與意願及消費，爰修訂運動事業舉辦之運動賽事與活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。"},{"bill":"202110102290000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為鼓勵運動事業及民間企業舉辦運動賽事或活動，提升民眾運動意願習慣，爰修訂運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入可免徵營業稅。"},{"bill":"202110102400000","text":"運動關係事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正本條第一項。\n二、為鼓勵民間企業舉辦運動賽事或活動，增加觀賞型及參與型運動之人數，以提升我國民眾在運動方面之消費支出，故增訂運動關係事業舉辦運動賽事或活動，如符合規定者，其門票免徵營業稅。"},{"bill":"202110109810000","text":"運動事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、現行《運動產業發展條例》第二十四條規定，體育團體舉辦運動賽事或活動其門票收入免徵營業稅，惟民間企業卻因非屬體育團體，未能適用此法，為鼓勵民間企業舉辦運動賽事或活動，將運動事業同樣納入門票免徵營業稅規定。"},{"bill":"202110128020000","text":"運動關係事業及體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","note":"一、修正本條第一項。\n二、為鼓勵民間企業舉辦運動賽事或活動，增加觀賞型及參與型運動之人數，以提升我國民眾在運動方面之消費支出，故增訂運動關係事業舉辦運動賽事或活動，如符合規定者，其門票免徵營業稅。"},{"bill":"202110129920000","text":"體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。\n運動賽事或活動之舉辦應投保公共意外責任。\n前項投保之規模、保險範圍、金額及其相關事項，由中央主管機關會商中央目的事業主管機關定之。","note":"一、第一項、第二項未修正。\n二、新增第三項、第四項：為保障參加運動賽事或體育活動者的安全，新增訂三項，要求運動賽事或活動主辦單位應投保公共意外責任險，萬一發生意外，例如棒球的界外球砸傷人等意外事故，受害者可及時獲得賠償。而第四項增訂應投保之保險範圍及金額，由中央主管機關會商中央目的事業主管機關定之。"}],"changed":false,"final":"體育團體舉辦之運動賽事或活動，符合加值型及非加值型營業稅法第八條第一項第五款規定者，其門票收入免徵營業稅。\n前項運動賽事、活動範圍及認定標準，由中央主管機關會同財政部定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十六條","current":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","versions":[{"bill":"202110068330000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、為鼓勵民間企業參與促進全民健康之相關體育活動，爰增訂營利事業「推行促進全民運動發展之賽事或活動」，亦享有所得稅法之優惠。"},{"bill":"202110072730000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行促進全民運動發展之賽事或活動。\n前項第六款之運動賽事、活動之認定標準，以及前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、新增第一項第六款；為鼓勵民間企業舉辦體育活動，促進國人健康及運動產業之發展，爰新增營利事業推行促進全民運動發展之賽事或活動，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制。\n二、修正第二項。配合第一項新增第六款，爰明定第六款之運動賽事、活動之認定標準由中央主管機關會同財政部定之。"},{"bill":"202110074580000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項第六款，其餘未修正。\n二、為鼓勵民間企業舉辦體育活動，提高民眾運動意願及習慣，促進國人健康及運動產業發展，爰增訂第一項第六款，明訂營利事業推行促進全民運動發展之賽事或活動，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制。"},{"bill":"202110075200000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行及提升全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、為提升民間企業舉辦運動賽事或相關活動，提升民眾之運動參與度，爰增訂營利事業「推行及提升全民運動發展之賽事或活動」，亦享有所得稅法之優惠。"},{"bill":"202110090830000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行及提升全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、為提升民間企業舉辦運動賽事或相關活動，提升民眾之運動參與度，爰增訂營利事業「推行及提升全民運動發展之賽事或活動」，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制。"},{"bill":"202110093520000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行及提升全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、為鼓勵民間企業舉辦體育活動，促進國人健康及我國運動產業發展，爰增訂本法第二十六條第一項第六款，新增推行促進全民運動發展之賽事或活動，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制。"},{"bill":"202110093760000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行與促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"為鼓勵民間企業參與促進全民健康之相關體育活動，故增訂營利事業如有推行與促進全民運動發展之賽事或活動，亦可享有《所得稅法》之優惠待遇。"},{"bill":"202110096430000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、捐贈促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、為鼓勵民間企業積極捐贈促進體育活動，爰增訂營利事業「捐贈促進全民運動發展之賽事或活動」，亦享有所得稅法之優惠。"},{"bill":"202110099420000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、提升及推動全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、新增第一項第六款。\n二、為鼓勵民間企業舉辦體育活動，以提高民眾運動意願及習慣，促進國民健康及運動產業發展。明訂營利事業推動促進全民運動發展之賽事或活動，得依《所得稅法》第三十六條第一款規定以費用列支，且不受金額限制。"},{"bill":"202110098830000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、有助於提升全民運動發展之賽事或活動。\n七、依第七條之三成立之信託基金。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、新增第一項第六款及第七款以鼓勵對運動發展之捐贈。\n二、為鼓勵全民運動發展，爰增列第六款將全民運動納入。\n三、為推動賭博防治，爰增列第七款，納入對防賭基金之捐助。"},{"bill":"202110097500000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、為鼓勵民間企業參與促進全民健康之相關體育活動，爰增訂營利事業「推行促進全民運動發展之賽事或活動」，亦享有所得稅法之優惠。"},{"bill":"202110105570000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行與促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、修正第一項。\n二、為鼓勵運動事業及民間企業舉辦運動賽事或活動，並提升全體民眾運動意願與習慣，爰修訂運動事業及體育團體舉辦之運動賽事或活動，增訂營利事業「推行促進全民運動發展之賽事或活動」，亦享有所得稅法之優惠。"},{"bill":"202110105690000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推廣及推動全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、為鼓勵民間企業參與全民運動業務，推動競技運動全民化，形塑全齡運動文化。明定營利事業推廣及推動全民運動發展之賽事或活動，促進各層級賽事推廣、運動教育及技能發展，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制。"},{"bill":"202110102160000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行及提升全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項第六款，為推動全民運動，提升國民運動率，爰增訂推行及提升全民運動發展之賽事或活動得依《所得稅法》第三十六條第一款之規定以費用列支，不受金額限制；以鼓勵民間營利事業辦理運動賽事或活動，提供國民參與運動之機會。\n二、其餘項次未修正。"},{"bill":"202110102290000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行及提升全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、為提升民間企業舉辦運動賽事或相關活動，提升民眾之運動參與度，爰增訂營利事業推行及提升全民運動發展之賽事或活動，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制。"},{"bill":"202110102400000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行與促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、於本條增訂第一項六款。\n二、為加強鼓勵民間企業參與促進全民健康之相關體育活動之誘因，故增訂營利事業如有推行與促進全民運動發展之賽事或活動，亦可享有所得稅法之優惠待遇。"},{"bill":"202110109810000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、增訂第一項六款。\n二、現行《運動產業發展條例》第二十六條規定，營利事業捐贈體育團體、培養支援運動團隊或運動員、推行事業單位本身員工體育活動等，享有所得稅法之優惠，惟並未包含促進運動發展之賽事或活動，為促進我國運動產業發展及國人健康，特將其納入適用範圍。"},{"bill":"202110111140000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n四、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n五、推廣促進全民運動發展之賽事或活動。\n前項捐贈對象必須符合依法登記及合法資格、明確具公益性宗旨、資金專款專用及透明運用、定期審查及監督等規定及限制，始得認定為合格之捐贈對象。實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、為了明確劃分以公益促進體育發展之外部捐贈與企業內部員工專屬體育活動經費，避免利用捐贈費用列支之無限額扣除機制，來混淆企業內部福利之經費報支，保障各項扣除規定的正當運作，並促進企業健康管理及體育事業之正向發展。爰刪除第二十六條第一項第三款。\n二、限定只有依法登記、具合法資格、明確公益宗旨、確保資金專款專用且透明運用並定期接受審查與監督的團體及個人，才能被認定為合格的捐贈對象，從而防止捐贈濫用營利事業的稅務扣除優惠。"},{"bill":"202110125410000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行並促進全民運動發展相關之競賽或活動。\n七、依第七條之三第一項成立之信託基金。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、本條增訂第一項第六款，係為推動全民運動政策，提升國民規律運動之比率，特明定營利事業舉辦促進全民運動發展之賽事或活動，得依《所得稅法》第三十六條第一款規定，以費用列支，且不受金額限制。藉此稅制優惠措施，鼓勵民間企業積極辦理運動活動，擴大運動參與人口，提升全民健康水準，並促進運動產業整體發展。\n二、其餘各款內容並無修正，仍維持現行規定。"},{"bill":"202110128020000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、推行與促進全民運動發展之賽事或活動。\n前項實施辦法及其他相關事項，由中央主管機關會同財政部定之。","note":"一、於本條增訂第一項第六款。\n二、為加強鼓勵民間企業參與促進全民健康之相關體育活動之誘因，故增訂營利事業如有推行與促進全民運動發展之賽事或活動，亦可享有所得稅法之優惠待遇。"},{"bill":"202110130520000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、辦理經中央主管機關認可促進全民運動發展之賽事。\n前項得以費用列支之捐贈，其實施方式與第六款之認可方式、賽事範圍及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"本條文第一項第一款至第五款涵蓋範圍較屬競技運動、傳統體育項目；故修法新增第六款之全民運動賽事涵蓋俱樂部運動賽事、政府機關或營利事業自辦比賽、社區聯誼賽等賽事種類，透過中央主管機關認可後，得享有稅賦優惠，以推動全民運動。"},{"bill":"202110130560000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、辦理經中央主管機關認可促進全民運動發展之賽事。\n前項得以費用列支之捐贈，其實施方式與第六款之認可方式、賽事範圍及其他相關事項之規則，由中央主管機關會同財政部定之。","note":"一、為鼓勵民間企業參與推動全民運動，爰於第一項增列第六款，明定營利事業捐贈辦理經中央主管機關認可促進全民運動發展賽事，得依所得稅法第三十六條第一款規定以費用列支。\n二、第二項授權中央主管機關會同財政部訂定之事項除第一項得以費用列支捐贈之實施方式外，增列第六款之認可方式及賽事範圍，以資明確，並酌作文字修正。"},{"bill":"202110132230000","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、辦理經中央主管機關認可促進全民運動發展之賽事。\n前項得以費用列支之捐贈，其實施方式與第六款之認可方式、賽事範圍及其他相關事項之規則，由中央主管機關會同財政部定之。","note":"一、為鼓勵民間企業參與推動全民運動，爰於第一項增列第六款，明定營利事業捐贈辦理經中央主管機關認可促進全民運動發展賽事，得依所得稅法第三十六條第一款規定以費用列支。\n二、第二項授權中央主管機關會同財政部訂定之事項除第一項得以費用列支捐贈之實施方式外，增列第六款之認可方式及賽事範圍，以資明確，並酌作文字修正。"}],"changed":true,"final":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、辦理經中央主管機關認可促進全民運動發展之賽事。\n前項得以費用列支之捐贈，其實施方式與第六款之認可方式、賽事範圍及其他相關事項之辦法，由中央主管機關會同財政部定之。","finalWhy":"一、為鼓勵民間企業參與推動全民運動，爰於第一項增列第六款，明定營利事業捐贈辦理經中央主管機關認可促進全民運動發展之賽事，得依所得稅法第三十六條第一款規定以費用列支。\n二、第二項授權中央主管機關會同財政部訂定之事項除第一項得以費用列支捐贈之實施方式外，增列第六款之認可方式及賽事範圍，以資明確，並酌作文字修正。","review":{"note":"照行政院提案通過","text":"營利事業合於下列之捐贈，得依所得稅法第三十六條第一款規定以費用列支，不受金額限制：\n一、捐贈經政府登記有案之體育團體。\n二、培養支援運動團隊或運動員。\n三、推行事業單位本身員工體育活動。\n四、捐贈政府機關及各級學校興設運動場館設施或運動器材用品。\n五、購買於國內所舉辦運動賽事門票，並經由學校或非營利性之團體捐贈學生或弱勢團體。\n六、辦理經中央主管機關認可促進全民運動發展之賽事。\n前項得以費用列支之捐贈，其實施方式與第六款之認可方式、賽事範圍及其他相關事項之辦法，由中央主管機關會同財政部定之。"}},{"no":"第二十六條之二","current":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之一百五十，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之一百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n第二項及第三項得減除營利事業所得額之施行期間，對職業運動業之捐贈自中華民國一百十年十二月七日修正之本條文施行日起十年，對業餘運動業及重點運動賽事主辦單位之捐贈，自中華民國一百十年十二月七日修正之本條文施行日起五年。","versions":[{"bill":"202110095000000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之二百五十，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n第二項及第三項得減除營利事業所得額之施行期間，對職業運動業之捐贈自中華民國一百十年十二月七日修正之本條文施行日起十年，對業餘運動業及重點運動賽事主辦單位之捐贈，自中華民國一百十年十二月七日修正之本條文施行日起五年。","note":"一、修正第二項，為加強營利事業捐贈運動產業之誘因，明定透過第一項專戶所為之捐贈，得在捐贈金額新臺幣一千萬元額度內，按該捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除。又為避免關係人間透過捐贈而進行不當避稅行為，明定受贈對象如與其具有關係人身分者，僅得在限額內，按其捐贈金額百分之一百，自其營利事業所得稅額中減除。\n二、修正第三項，為能利於推動國家重大體育政策，明定營利事業透過第一項專戶對中央主管機關專案核准之重點職業或業餘運動業或經中央主管機關公告之重點運動賽事之主辦單位所為之捐贈，得按該捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度之限制。"},{"bill":"202110097790000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之一百五十，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之一百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n營利事業依前二項規定捐贈時，如捐贈對象為女子職業或業餘運動業、女子重點運動賽事主辦單位，除有第二項但書之情形，於申報所得稅時，得自其當年度營利事業所得額中再減除該捐贈金額之百分之二十五。\n中央主管機關依第一項規定設置專戶接受營利事業依前三項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、第四項女子職業或業餘運動業、女子重點運動賽事之認定、第五項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n第二項至第四項得減除營利事業所得額之施行期間，對職業運動業之捐贈自中華民國一百十年十二月七日修正之本條文施行日起十五年，對業餘運動業及重點運動賽事主辦單位之捐贈，自中華民國一百十年十二月七日修正之本條文施行日起十年。","note":"一、根據現制，營利事業若對中央主管機關認可或核准之重點職業、業餘運動業或重點運動賽事主辦單位進行捐贈，可按該金額之百分之一百五十，自其當年度營利事業所得額中減除。\n二、由於女子運動在資源配置、贊助支持等方面仍相對弱勢，為確保女子運動長期發展、縮短運動賽事中的性別差距，如符合本條第二項或第三項之標準、且為女子職業或業餘運動業、女子重點運動賽事，可自其當年度營利事業所得額中再減除該捐贈金額之百分之二十五，但有第二項但書之情形時不適用本項規定。\n三、延長本條例施行年限。"},{"bill":"202110099420000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之一百五十，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之一百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n第二項及第三項得減除營利事業所得額之施行期間自中華民國一百十年十二月七日修正之本條文施行日起十年。","note":"一、依據現行規定，對職業運動業之捐贈實施至120年12月23日止，對業餘運動與重點運動賽事之捐贈實施至115年12月23日止。未來針對業餘運動業與重點運動賽事恐無法將繼續適用之。\n二、因應運動部成立，負有推動「競技運動全民化，全民運動產業化」之政策目標。爰將捐贈職業運動或業餘運動業與重點運動賽事相關規定同步修正為十年，以利未來民間資源持續投入運動產業發展。"},{"bill":"202110098830000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之二百五十，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n第二項及第三項得減除營利事業所得額之施行期間自中華民國一百十年十二月七日修正之本條文施行日起十年。","note":"一、為促進職業或業餘運動業及重點運動賽事之發展，對本條進行修正。\n二、修正第二項，提高對職業或業餘運動業之捐贈於申報營利事業所得稅時可減除額度比例。\n三、修正第三項，提高對重點運動賽事之捐贈於申報營利事業所得稅時可減除額度比例。\n四、近年國內賽事觀賞風氣蓬勃，應持續鼓勵重點賽事及業餘運動業之發展，爰於第六項將其減除所得稅之優惠期間延長至十年。"},{"bill":"202110097680000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之二百五十，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n第二項及第三項得減除營利事業所得額之施行期間，對職業運動業之捐贈自中華民國一百十年十二月七日修正之本條文施行日起十年。","note":"一、為鼓勵民間資源投入運動產業，強化營利事業捐贈誘因，透過第一項專戶所為之捐贈，得在捐贈金額新臺幣一千萬元額度內，按該捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除。\n二、為利於推動國家重大體育政策，營利事業透過第一項專戶對中央主管機關專案核准之重點職業或業餘運動業或經中央主管機關公告之重點運動賽事之主辦單位所為之捐贈，得按該捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書規定之限制。\n三、因應競技運動全民化、全民運動產業化之政策目標，及第二項及第三項之得減除營利事業所得額調整，爰修正第六項之日期，將對業餘運動業及重點運動賽事主辦單位之捐贈期限比照職業運動，實施期間皆為中華民國一百十年十二月七日修正之本條文施行日起十年。"},{"bill":"202110102160000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之二百五十，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n第二項及第三項得減除營利事業所得額之施行期間，自中華民國一百十年十二月七日修正之本條文施行日起十年。","note":"一、修正第二項，為持續加強營利事業捐贈運動產業之誘因，明定透過第一項規定之專戶所為之捐贈，得在捐贈金額一千萬額度內，按該金額之百分之二百五十，自其當年度營利事業所得額中減除。\n二、修正第三項，為利於推動國家運動政策，明定營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業及經中央主管機關公告之重點運動賽事主辦單位之捐贈，得按捐贈金額百分之二百五十，自其當年度營利事業所得額減除中減除，不受前項新臺幣一千萬元額度之限制。\n三、修正第六項，延長第二項及第三項之減除營利事業所得額之施行期間，以持續帶動運動產業發展，壯大運動產業。\n四、其餘項次未修正。"},{"bill":"202110125410000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之二百五十，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之二百五十，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n第二項及第三項得減除營利事業所得額之施行期間自中華民國一百十年十二月七日修正之本條文施行日起十年。","note":"一、修正第二項，係為持續強化營利事業捐贈運動產業之財稅誘因，明確規定營利事業透過第一項所設專戶進行之捐贈，其金額在新臺幣一千萬元額度內，得按捐贈金額之二百五十百分比，自其當年度營利事業所得額中予以減除，以提升企業對運動產業投入之積極性。\n二、修正第三項，為配合推動國家運動政策發展，進一步規範營利事業對經中央主管機關專案核准之重點職業或業餘運動產業，以及經中央主管機關公告之重點運動賽事主辦單位所為之捐贈，得依捐贈金額二百五十百分比，自其當年度營利事業所得額中減除，並明定不受前項一千萬元額度之限制，以提高民間資金對具政策指標性運動項目之支持力度。\n三、修正第六項，為持續推動運動產業發展，並確保第二項及第三項捐贈減除所得額之稅賦優惠得以延續，爰使職業運動業及業餘運動業同步延長，期能鞏固企業長期投入運動產業之意願，使我國運動產業整體規模與體質持續蓬勃發展。"},{"bill":"202110130520000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之一百七十五，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之一百七十五，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n中華民國○年○月○日修正之第二項及第三項得減除營利事業所得額之施行期間，自修正生效日起至一百二十年十二月二十三日止。","note":"一、對職業運動業或業餘運動業及重點運動賽事主辦單位之捐贈得加成減除之額度提高，從150%至175%。\n二、對業餘運動業及重點運動賽事主辦單位之捐贈得減除營利事業所得額之施行期間從5年延長至10年。"},{"bill":"202110130560000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之一百七十五，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之一百七十五，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n中華民國○年○月○日修正之第二項及第三項得減除營利事業所得額之施行期間，自修正生效日起至一百二十年十二月二十三日止。","note":"一、為協助運動產業發展，參考中小企業發展條例第三十六條之二第二項規定「中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百七十五限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。」修正第二項，就營利事業透過第一項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，自其當年度營利事業所得額中減除之比率，由該金額之百分之一百五十調高為百分之一百七十五，以穩健逐步調整方式，持續提振整體運動產業發展。\n二、第三項所定「得全數按捐贈金額之百分之一百五十」修正調高為「得全數按捐贈金額之百分之一百七十五」，修正理由同說明一。\n三、依現行第六項規定得減除營利事業所得額之施行期間，對職業運動業之捐贈為自一百十年十二月二十二日修正之本條文施行日起十年，即一百十年十二月二十四日起十年；對業餘運動業及重點運動賽事主辦單位為自一百十年十二月二十四日起五年，惟為持續扶持業餘運動業及重點運動賽事之發展，爰修正明定本次修正之第二項及第三項營利事業捐贈費用減除之賦稅優惠統一延長為十年，以增加業餘運動職業化機會，塑造更多臺灣品牌賽事，有利於整體運動產業之發展；又配合第二項、第三項修正得加成減除捐贈金額比率之規定依第三十三條第二項規定係自公布日施行，爰修正明定其施行期間自本次修正之第二項及第三項修正生效日起至一百二十年十二月二十三日止。\n四、第一項、第四項及第五項未修正。"},{"bill":"202110132230000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之一百七十五，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之一百七十五，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n中華民國○年○月○日修正之第二項及第三項得減除營利事業所得額之施行期間，自修正生效日起至一百二十年十二月二十三日止。","note":"一、為協助運動產業發展，參考中小企業發展條例第三十六條之二第二項規定「中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百七十五限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。」修正第二項，就營利事業透過第一項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，自其當年度營利事業所得額中減除之比率，由該金額之百分之一百五十調高為百分之一百七十五，以穩健逐步調整方式，持續提振整體運動產業發展。\n二、第三項所定「得全數按捐贈金額之百分之一百五十」修正調高為「得全數按捐贈金額之百分之一百七十五」，修正理由同說明一。\n三、依現行第六項規定得減除營利事業所得額之施行期間，對職業運動業之捐贈為自一百十年十二月二十二日修正之本條文施行日起十年，即一百十年十二月二十四日起十年；對業餘運動業及重點運動賽事主辦單位為自一百十年十二月二十四日起五年，惟為持續扶持業餘運動業及重點運動賽事之發展，爰修正明定本次修正之第二項及第三項營利事業捐贈費用減除之賦稅優惠統一延長為十年，以增加業餘運動職業化機會，塑造更多臺灣品牌賽事，有利於整體運動產業之發展；又配合第二項、第三項修正得加成減除捐贈金額比率之規定依第三十三條第二項規定係自公布日施行，爰修正明定其施行期間自本次修正之第二項及第三項修正生效日起至一百二十年十二月二十三日止。\n四、第一項、第四項及第五項未修正。"},{"bill":"202110132580000","text":"中央主管機關為促進職業或業餘運動業及重點運動賽事之發展，得設置專戶，辦理營利事業捐贈有關事宜。\n營利事業透過前項專戶對中央主管機關認可之職業或業餘運動業之捐贈，於申報所得稅時，得在捐贈金額新臺幣一千萬元額度內，按該金額之百分之一百七十五，自其當年度營利事業所得額中減除。但營利事業與受贈之職業或業餘運動業間具有關係人身分者，在前開限額內，僅得按其捐贈金額百分之一百，自其當年度營利事業所得額中減除。\n營利事業透過第一項專戶對經中央主管機關專案核准之重點職業或業餘運動業，及經中央主管機關公告之重點運動賽事主辦單位之捐贈，於申報所得稅時，得全數按捐贈金額之百分之一百七十五，自其當年度營利事業所得額中減除，不受前項新臺幣一千萬元額度及但書之限制。\n中央主管機關依第一項規定設置專戶接受營利事業依前二項規定之捐贈，每年累積金額以新臺幣三十億元為限，並得於該總額限度內，針對不同運動種類及受贈對象訂定得收受捐贈金額之上限。\n第一項專戶之設置、資金之收支、保管、運用、分配、查核及監督、第二項職業或業餘運動業之認可、受贈資金之用途、關係人範圍、減除方法、應附之證明文件、第三項重點職業或業餘運動業專案核准之要件及範圍、前項得收受捐贈之種類、受贈對象及金額上限之規定及其他相關事項之辦法，由中央主管機關會同財政部定之。\n中華民國○年○月○日修正之第二項及第三項得減除營利事業所得額之施行期間，自修正生效日起至一百二十年十二月二十三日止。","note":"一、為協助運動產業發展，參考中小企業發展條例第三十六條之二第二項規定「中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百七 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});

  const body = el('div', {class: 'text'});
