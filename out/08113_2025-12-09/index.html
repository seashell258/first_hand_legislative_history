<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天然氣事業法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

別碼及船舶呼號等船舶識別資訊：\n一、依本法規定應裝設船舶自動識別系統船載臺之中華民國船舶。\n二、於中華民國領海外界線以內水域或臺灣地區禁止水域，依海上人命安全國際公約規定應裝設船舶自動識別系統船載臺之非中華民國船舶。\n船舶自動識別系統船載臺故障未能正常運作時，應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置。","note":"一、本條新增。\n二、訂定第一項：\n(一)船舶自動識別系統船載臺（Automatic Identification System，AIS）係藉由與鄰近船舶或岸臺交換船舶資訊，以利識別船舶、掌握狀態及追蹤位置，維持其正常運作，可避免發生船舶碰撞事故，有效提升船舶航行安全，並強化航政機關、海岸巡防機關、漁政機關等有關機關監控船舶動態，以維護海域秩序及安全。惟實務上，部分船舶因執行業務之特殊性，確有不公開其船舶航行資訊之必要，如公務船舶於海上執法，或航行水域（如受海盜或非法武力威脅高風險海域）開啟該設備有危害船舶安全之虞時，則不在此限。\n(二)第一款所稱依本法規定，係指依本法授權訂定之相關子法，例如：小船檢查丈量規則第四十一條、船舶設備規則第二百四十二條之三、遊艇管理規則第二十九條第一項第二款及第三十條附件三等規定。\n(三)第二款參酌海上人命安全國際公約（International Convention for the Safety of Life at Sea，以下簡稱SOLAS）第五章規則十九規定，從事國際航線總噸位三百以上之所有船舶，非從事國際航線總噸位五百以上之貨船，以及不論及大小之客船，應裝設船舶自動識別系統船載臺，爰本款以此為基準，規範非我國船舶，於依中華民國領海及鄰接區法第五條訂定之領海外界線以內水域，以及依臺灣地區與大陸地區人民關係條例第二十九條第二項公告之禁止水域，課予維持船舶自動識別系統船載臺正常運作之義務。\n三、船舶於海上航行可能發生不可預期海況或事故等不可歸責於船舶所有人或船長之情事，導致船舶自動識別系統船載臺無法正常運作，為確保該等無法以船舶自動識別系統船載臺監控之船舶航行安全，需借助海岸巡防機關建置之岸際雷達，或透過無線電信設備回報位置等方式予以監控，爰訂定第二項，規範船舶自動識別系統船載臺故障未能正常運作時應即通報航政機關，並依航政機關所定期限完成改善，或令其按時通報船舶位置，以利相關機關協助監控。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十條之一","current":null,"versions":[{"bill":"201110161340200","text":"非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，船身應具備下列標誌：\n一、船名。\n二、國際海事組織船舶識別編號。但依海上人命安全國際公約規定無須具備者，不在此限。\n前項標誌應為正確標示，並不得毀壞、塗改或隱蔽。","note":"一、本條新增。\n二、為迅速透過船舶外觀識別是否為非我國船舶，參酌SOLAS第十一之一章規則三規定，國際海事組織（\nInternational Maritime Organization，以下簡稱IMO）船舶識別編號應永久標記於船身及機艙隔艙壁上、艙口上、液貨船之液貨泵間或駛上駛下船之駛上駛下空間隔艙壁等位置；其中船身上標記IMO船舶識別編號可有效於海上識別船舶資訊，並參酌修正條文第八條之一第一項第二款水域範圍規定，爰為第一項規定。\n三、參照SOLAS第十一之一章規則三規定，於第二項定明非我國船舶標示第一項規定之標誌，應為正確標示，並不得毀壞、塗改或隱蔽。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十一條之一","current":null,"versions":[{"bill":"201110161340200","text":"總噸位一百五十以上之非中華民國船舶於中華民國領海外界線以內水域或臺灣地區禁止水域航行或錨泊時，應具備航海日誌，詳實記載航行活動；遇有事故者，並應一併載明。\n前項航行活動及事故應記載事項如下：\n一、船舶開航前之船舶狀態。\n二、船舶航行期間與航程有關之詳細資訊。\n三、船舶發生事故或特殊事件之詳細資訊。\n四、船舶錨泊或在港時之操作或行政事務資訊、與船舶安全及保全有關之詳細資訊。","note":"一、本條新增。\n二、為有效掌握非我國船舶航行資訊，參酌SOLAS第五章規則一、四及規則二十八，於第一項規範船舶航行或錨泊時，應具備航海日誌並詳實記載，並參酌修正條文第八條之一第一項第二款水域範圍規定，定明本條適用範圍。\n三、參酌IMO採納A.916(22)決議案，爰為第二項航行活動及事故應記載事項之規定。\n四、依海岸巡防法第四條第一項第三款規定：「海巡機關人員執行職務時，得行使下列職權。但不得逾越必要程度：……三、對航行海域內之船舶或其他運輸工具，有正當理由，認有違法之虞時，得命船舶出示船舶文書、航海紀錄及其他有關航海事項之資料。」，爰海岸巡防機關可依上開規定查驗船舶航海日誌，併予敘明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十五條","current":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得指定地點令其移泊或疏散他處停泊；未依規定移泊者，得逕行移泊。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","versions":[{"bill":"201110161340200","text":"商港區域內停泊之船舶，商港經營事業機構、航港局或指定機關認為妨礙船席調度或港區安全時，得令其於三個月內離港；或指定地點令其移泊，未依規定移泊者，得逕行移泊，並於完成移泊後令其於三個月內離港。\n商港經營事業機構、航港局或指定機關為維護港區秩序、疏導航運、便利作業，得對港區內小船艘數、停泊位置、行駛及作業，予以限制；必要時並得將小船移置他處停放。\n船舶、浮具未經商港經營事業機構、航港局或指定機關同意，不得在港區內行駛或作業。\n第一項、第二項由商港經營事業機構、航港局或指定機關執行移泊、停放所需之費用，由船舶所有人負擔。","note":"一、修正第一項：\n(一)為避免船舶滯留商港，影響船舶作業安全及效率，商港區域內停泊之船舶，經商港經營事業機構、航港局或指定機關認為船舶持續滯留商港有妨礙船席調度或港區安全者，增列得令該船舶於三個月內離港之規定。另對於未依規定移泊，經逕行完成移泊者，增訂於完成移泊後令該船舶於三個月內離港之規定。如該船舶無正當理由未於所定期限離港者，航港局或指定機關將依修正條文第六十五條之四第一項規定沒入該船舶。\n(二)考量「指定地點令其移泊」於文義上已涵蓋「疏散他處停泊」，為避免重複爰予刪除。\n(三)第一項船舶除經商港經營事業機構、航港局或指定機關認有嚴重妨礙船席調度或對港區安全危害重大之情形，得令其於三個月內離港外，應指定地點令其移泊，併予敘明。\n二、第二項至第四項未修正。"}],"changed":false,"final":"公用天然氣事業擴充或變更已有之主要輸儲設備，應將其工程計畫事先報經直轄市、縣（市）主管機關轉請中央主管機關核准。但因災害、損壞或緊急事故發生，必須採取臨時擴充或變更之措施者，不在此限。\n前項但書情形，公用天然氣事業應自災害、損壞或緊急事故發生之日起一個月內，將已採取之措施，報經直轄市、縣（市）主管機關轉請中央主管機關備查。\n中央主管機關於必要時，得將前二項規定之事項，委辦直轄市、縣（市）主管機關核准或備查。","finalWhy":null,"review":null},{"no":"第二十一條之一","current":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"201110161340200","text":"以竊取、毀壞或其他非法方法危害氣象設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害氣象設施或設備之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、為強化氣象設施或設備安全防護，參酌電信管理法第七十二條第四項，增訂第四項因過失毀壞或以其他非法方法危害氣象設施或設備功能正常運作之罰則。\n三、第四項移列為第五項，內容未修正。\n四、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十五條之一","current":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"202110162840000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，理由如下：\n(一)近年我國周邊海域因船隻活動造成海底纜線受損事件頻傳。考量海底纜線之型態多元，並非僅指海底電纜，海底輸氣管線係輸送天然氣之重要設備，有強化保護之必要。\n(二)第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。考量因過失毀壞或以其他非法方法危害海底輸氣纜線之功能正常運作，對於國內天然氣穩定供應亦將產生嚴重影響；復以海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉及避免前述情形發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項，內容未修正。\n四、為維護國內整體供氣安全穩定，對侵害第一項所定輸儲設備（包括天然氣進口事業之海底輸氣管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"},{"bill":"202110163050000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處一年以下有期徒刑、拘役或科新臺幣三百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，理由如下：\n(一)近年我國周邊海域因船隻活動造成海底纜線受損事件頻傳。考量海底纜線之型態多元，並非僅指海底電纜，海底輸氣管線係輸送天然氣之重要設備，有強化保護之必要。\n(二)第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。考量因過失毀壞或以其他非法方法危害海底輸氣纜線之功能正常運作，對於國內天然氣穩定供應亦將產生嚴重影響；復以海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉及避免前述情形發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項，內容未修正。\n四、為維護國內整體供氣安全穩定，對侵害第一項所定輸儲設備（包括天然氣進口事業之海底輸氣管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"},{"bill":"202110163450000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，理由如下：近年我國周邊海域因船隻活動導致海底纜線受損事件頻傳。海底纜線型態多元，不僅包含電纜，亦包括輸送天然氣之海底輸氣管線，其對於能源輸送及供應具有關鍵地位，亟需強化保護。現行第一項已就故意毀壞高壓輸配氣設備（涵蓋海底輸氣管線）規範刑責；惟若因過失毀壞或以其他非法方法危害海底輸氣管線之功能正常運作，對國內天然氣穩定供應亦將造成嚴重影響。且相關海底管線圖資已公開於國家海洋資料庫及共享平台，海域航行或相關作業人員應可預先知悉並避免侵害。爰參考《電信管理法》第七十二條第四項，增訂過失犯之處罰規範。\n三、現行第四項移列為第五項，內容未修正。\n四、為維護國內整體供氣安全，對於侵害第一項所列輸儲設備（含天然氣進口事業之海底輸氣管線）之犯罪態樣，犯罪工具如船舶或其他機械設備，無論所有權歸屬，均應予沒收，並明定其處置方式。爰參考《土石採取法》第三十六條第三項及《中華民國專屬經濟海域及大陸礁層法》第十八條第三項，增訂第六項。其處置方式如下，可避免巨型船舶或外籍船舶因難以保管、拍賣不易等問題，造成執行困難，並兼顧公共利益及實務操作需求：\n(一)沒收物適於公務使用者，得無償留供原機關或其他機關公用。\n(二)衡酌保管成本與價值，認無拍賣或變價實益者，得予廢棄。\n(三)其他適當方式，如捐作公益或教學使用。"},{"bill":"202110163850000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣三百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，原因如下：\n(一)我國頻傳有遭受海底纜線受損情形，因考量海底纜線之型態多元，且天然氣重要設備亦有強化保護之必要，因此，納入「天然氣進口事業之海底輸氣管線」。\n(二)本條第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。為維護國內天然氣穩定供應，考量過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能運作者。另又考量海底管線布建圖資已由海洋委員會國家海洋資料庫及共享平台公開相關資訊，從事海域航行或相關工作者應可知悉及避免事情發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項。\n四、為維護供氣安全，對侵害天然氣輸儲設備（含海底管線）之犯罪工具或船舶，不問所有人一律沒收，並增訂處置方式。參考土石採取法及專屬經濟海域及大陸礁層法相關規定，規範如下：\n(一)有利公務使用者，得無償留供機關使用。\n(二)保管費用高或無拍賣、變價實益者，得予廢棄。\n(三)其他適當處置方式，如捐作公益或教學使用。"},{"bill":"202110165250000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、增訂第四項，為保護海底輸氣管線之安全，維繫我國天然氣輸送，增訂海底毀壞天然氣管線之罰則。\n二、增訂第六項，對為第一項至第三項之罪所用之工具、船舶或其他機械設備為沒收之規定。"},{"bill":"202110164140000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣三千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億五千萬元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣一億元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、鑑於近年我國周邊海域船隻活動造成海底管線損害事件頻發，爰提高故意犯罰金刑之上限，以生嚇阻之效。\n二、增訂第四項，理由如下：\n(一)近年我國周邊海域因船隻活動造成海底纜線受損事件頻傳。考量海底纜線之型態多元，並非僅指海底電纜，海底輸氣管線係輸送天然氣之重要設備，有強化保護之必要。\n(二)第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。考量因過失毀壞或以其他非法方法危害海底輸氣纜線之功能正常運作，對於國內天然氣穩定供應亦將產生嚴重影響；復以海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉及避免前述情形發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項。\n四、為維護國內整體供氣安全穩定，對侵害第一項所定輸儲設備（包括天然氣進口事業之海底輸氣管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"},{"bill":"202110164300000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法行為危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，理由如下：\n(一)近年我國周邊海域因船隻活動造成海底纜線受損事件頻傳。考量海底纜線之型態多元，且與人民生活息息相關，並非僅指海底電纜，海底輸氣管線係輸送天然氣之重要設備，有強化保護之必要。\n(二)第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。考量因過失毀壞或以其他非法方法危害海底輸氣纜線之功能正常運作，對於國內天然氣穩定供應亦將產生嚴重影響；復以海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉及避免前述情形發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項，內容未修正。\n四、為維護國內整體供氣安全穩定，對侵害第一項所定輸儲設備（包括天然氣進口事業之海底輸氣管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"},{"bill":"202110164250000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n依前項應沒收船舶之情形者，其犯罪航次之全部收益，不問屬於犯罪行為人與否，沒收之。但於全部或一部不能沒收時，追徵其價額。","note":"一、為因應近年懸掛權宜旗之船舶（權宜輪）頻繁破壞我國通訊海纜，對我國對外及離島通訊造成衝擊，甚至危害國家安全。海底輸氣管線係輸送天然氣之重要設備，亦應一併強化保護之必要。本次修法旨在建立有效的嚇阻機制，參考《電信管理法》第七十二條第四項規定，增訂第四項明定過失犯之刑罰規範。\n二、參考《土石採取法》及《中華民國專屬經濟海域及大陸礁層法》相關規定，增訂第六項，明確規範犯罪所用之船舶、工具等設備的沒收與處置程序。考量到此類犯罪所用船舶常因噸位龐大、保管困難，或因外國籍身份致使拍賣不易，新法特別賦予檢察機關在個案上更大的處置彈性。經專案報准後，得不採傳統拍賣方式，改以「無償留供公用」、「廢棄」（若不具經濟效益）或「為其他適當處置」（如捐作公益或教學之用）等方式。\n三、媒體報導，中華電信曾指出，近年海纜遭破壞主要原因除被少數漁撈作業及大型貨商油船停泊下錨損傷外，大部分障礙是被中國盜砂船在馬祖南竿至西莒間海域作業所傷。參酌美國《海洋哺乳動物保護法》（Marine Mammal Protection Act, MMPA），16 U.S.C.§ 1376「以任何方式用於非法捕撈海洋哺乳動物，其全部貨物或其貨幣價值應予以扣押和沒收。」增訂第七項，若船舶有「毀損海底輸氣管線」及「船舶被沒收」的情形，其犯罪航次收益，例如非法砂石、非法漁獲，將被視為毀損海底輸氣管線此犯罪航次之收益而沒收之。若犯罪航次收益已經變賣脫手，亦可追徵其價額。"},{"bill":"202110164860000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，理由如下：\n(一)近年我國周邊海域因船隻活動造成海底纜線受損事件頻傳。考量海底纜線之型態多元，並非僅指海底電纜，海底輸氣管線係輸送天然氣之重要設備，有強化保護之必要。\n(二)第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。考量因過失毀壞或以其他非法方法危害海底輸氣纜線之功能正常運作，對於國內天然氣穩定供應亦將產生嚴重影響；復以海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉及避免前述情形發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項，內容未修正。\n四、為維護國內整體供氣安全穩定，對侵害第一項所定輸儲設備（包括天然氣進口事業之海底輸氣管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"},{"bill":"202110164880000","text":"以竊取、毀壞或其他非法方法危害天然氣進口事業之卸收設備、儲氣設備、氣化設備、摻配設備、高壓輸配氣設備或監控調度中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害天然氣進口事業之海底輸氣管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、第一項至第三項未修正。\n二、增訂第四項，理由如下：\n(一)近年我國周邊海域因船隻活動造成海底纜線受損事件頻傳。考量海底纜線之型態多元，並非僅指海底電纜，海底輸氣管線係輸送天然氣之重要設備，有強化保護之必要。\n(二)第一項已明定故意犯型態，所稱高壓輸配氣設備業即涵蓋海底輸氣管線在內。考量因過失毀壞或以其他非法方法危害海底輸氣纜線之功能正常運作，對於國內天然氣穩定供應亦將產生嚴重影響；復以海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉及避免前述情形發生，爰參考電信管理法第七十二條第四項規定，明定過失犯之刑罰規範。\n三、第四項移列為第五項，內容未修正。\n四、為維護國內整體供氣安全穩定，對侵害第一項所定輸儲設備（包括天然氣進口事業之海底輸氣管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"},{"bill":"201110161340200","text":"以竊 n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。"}},{"no":"第六十五條之四","current":null,"versions":[{"bill":"201110161340200","text":"船舶經商港經營事業機構、航港局或指定機關依第十五條第一項規定令其限期離港，無正當理由未於所定期限離港者，不問屬於何人所有，由航港局或指定機關沒入之。\n依第六十條第一項規定留置之外國商船，經查有船舶登記、船舶證書、國際海事組織船舶識別編號或其他船舶識別資料與實際情形不符者，航港局或指定機關應令船舶所有人或其代理人於三個月內補正正當理由、所有權證明文件及相關船舶證書；屆期未補正者，該外國商船不問屬於何人所有，由航港局或指定機關沒入之。","note":"一、本條新增。\n二、為減少船舶所有人未處置船舶而衍生長期棄置問題，於第一項針對船舶經商港經營事業機構、航港局或指定機關依第十五條規定令其限期離港（包含令其於三個月內離港，及遭逕行移泊後令其三個月內離港之情形），無正當理由未於期限內離港者，不問船舶屬於何人所有，由航港局或指定機關予以沒入之規定。\n三、鑒於部分外國商船因管理不善，常有持偽冒船舶登記、船舶證書等識別資料，或發生海事案件，積欠船員薪資，船東不願出面處理之情形，即所謂「三無船舶」（無船籍、無證書、無船舶登記），因無法改善其缺失，以致船舶長期滯留我國商港，積欠港埠費用之情事發生，甚至造成船席調度困難或影響港區安全。爰於第二項前段定明針對航港局或指定機關依第六十條第一項規定留置，且經查有船舶登記等船舶識別資料與實際情形不符之外國商船，應令該外國商船之船舶所有人或其代理人於三個月內補正相關船舶識別資料之規定。另考量國際間船旗國及其認可驗船機構皆設有網路聯絡窗口，且相關船舶證書等證明文件可透過電子郵件迅速補發，因此，如船舶無法取得船旗國及驗船機構所核發之船舶證書證明其所有權及適航性，即可顯示該船舶有極大風險成為惡意破壞我國商港設施之工具，為免其滯留我國領海，影響航行及商港安全，伺機破壞我國商港設施，爰於後段定明對此類船舶不問屬於何人所有予以沒入，上述作法應符合比例原則，並能有效防止相關船舶再犯，亦能嚇阻其他類似船舶之不法意圖，併予說明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第七十一條之一","current":"以竊取、毀壞或其他非法方法危害裝置容量一百萬瓩以上之水力發電廠、一百二十萬瓩以上之火力發電廠之主要發電設備、燃料輸儲設備、控制室、開關場、資通訊機房，或特高壓以上輸電、變電設備或調度室之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","versions":[{"bill":"201110161340200","text":"以竊取、毀壞或其他非法方法危害裝置容量一百萬瓩以上之水力發電廠、一百二十萬瓩以上之火力發電廠之主要發電設備、燃料輸儲設備、控制室、開關場、資通訊機房，或特高壓以上輸電、變電設備、調度室，或海底電力電纜之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海底電力電纜之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。","note":"一、因應近期離岸風力發電發展及國內電力傳輸所需，為避免海底電力電纜受到侵害致影響電力傳輸及供應，爰於第一項新增「海底電力電纜」為保護客體，以強化保護範圍，穩定供電。凡由發電業及輸配電業等電業所設置之海底電力電纜，均屬保護對象，不限於特高壓以上者，併予補充。\n二、第二項及第三項未修正。\n三、考量海底電力電纜對電力傳輸及供應之重要性，如因過失毀壞或以其他非法方法危害其功能之正常運作，對於國內電力穩定供應將產生嚴重影響；又考量海底管線布建之相關圖資已於海洋委員會之國家海洋資料庫及共享平台公開，從事海域航行或相關工作者應可預先知悉並避免前述情形發生，爰參考電信管理法第七十二條第四項規定增訂第四項，明定過失犯之刑罰規範。\n四、第四項移列為第五項，內容未修正。\n五、為維護供電安全穩定，對故意侵害第一項所定電業設備（包括海底電力電纜）之犯罪態樣，就供其犯罪用之工具、船舶等有不問屬何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第七十二條","current":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","versions":[{"bill":"201110161340200","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"201110161340200","text":"自用遊艇，除本章、第一章、第十五條之一第二項、第二十七條第一項、第二十八條、第二十八條之一、第二十八條之二第一項、第二十八條之三第一項、第二十九條第一項、第三十條第一項、第三十二條、第四十條第一項、第四十一條第一項與第二項前段、第八十四條第一項、第八十九條第一項、第八十九條之一、第九十一條、第九十二條第一項與第三項、第九十三條至第九十五條、第九十七條第一項第一款與第三項及第九十九條至第一百零二條規定外，不適用本法規定。\n非自用遊艇，除本章、第一章、第十五條之一第二項、第二十七條第一項、第二十八條、第二十八條之一、第二十八條之二第一項、第二十八條之三第一項、第二十九條第一項、第三十條第一項、第三十二條、第四十條第一項、第四十一條第一項與第二項前段、第五章、第八十四條第一項、第八十九條第一項、第八十九條之一、第九十一條、第九十二條第一項與第三項、第九十三條至第九十五條、第九十七條第一項第一款與第三項及第九十九條至第一百零二條規定外，不適用本法規定。\n自用遊艇及非自用遊艇準用第二十八條之二第二項規定，並應將遊艇證書繳回航政機關。","note":"一、依現行規定，自用或非自用遊艇均適用第一章規定，爰亦適用本次增訂之修正條文第八條之一、第十條之一及第十一條之一，配合修正條文第八十九條之一係規範違反前開規定之罰則，爰增訂第一項自用遊艇及第二項非自用遊艇適用本法規定之範圍。\n二、第三項未修正。"}],"changed":false,"final":"本法自公布日施行。","finalWhy":null,"review":null},{"no":"第八十二條","current":"小船，除本章、第一章、第十五條之一、第二十七條第一項、第二十八條、第二十八條之一第一項與第三項、第二十八條之二第一項、第二十八條之三、第四十條第一項、第四十一條第一項與第二項前段、第八十九條第一項、第九十條、第九十二條第一項與第三項、第九十三條、第九十四條、第九十七條第一項第一款及第九十八條至第一百零二條規定外，不適用本法之規定。\n小船準用第二十八條之二第二項規定，並應將小船執照繳回航政機關。\n載客小船準用第三十四條之一規定。","versions":[{"bill":"201110161340200","text":"小船，除本章、第一章、第十五條之一、第二十七條第一項、第二十八條、第二十八條之一第一項與第三項、第二十八條之二第一項、第二十八條之三、第四十條第一項、第四十一條第一項與第二項前段、第八十九條第一項、第八十九條之一、第九十條、第九十二條第一項與第三項、第九十三條、第九十四條、第九十七條第一項第一款及第九十八條至第一百零二條規定外，不適用本法之規定。\n小船準用第二十八條之二第二項規定，並應將小船執照繳回航政機關。\n載客小船準用第三十四條之一規定。","note":"一、第一項規定小船適用第一章規定，爰適用本次增訂之修正條文第八條之一、第十條之一及第十一條之一，配合修正條文第八十九條之一係規範違反前開規定之罰則，爰增列該條文為小船適用之範圍。\n二、第二項及第三項未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第八十九條之一","current":null,"versions":[{"bill":"201110161340200","text":"有下列情形之一者，由航政機關依情節輕重，處船舶所有人、船長、遊艇駕駛或小船駕駛新臺幣三萬元以上一千萬元以下罰鍰，並得令其限期改善；屆期未改善者，按次處罰：\n一、違反第八條之一第一項規定，未維持船舶自動識別系統船載臺正常運作，或發送不正確之船舶識別資訊。\n二、違反第八條之一第二項規定，未即通報航政機關，或未依航政機關所定期限完成改善，或未按時通報船舶位置。\n三、違反第十條之一第一項規定，船身未具備該項所定標誌。\n四、違反第十條之一第二項規定，未正確標示，或毀壞、塗改、隱蔽標誌。\n五、違反第十一條之一規定，未具備航海日誌，或航海日誌未詳實記載航行活動或事故。\n前項情形，航政機關得令船舶進港並停泊至指定處所，必要時，得洽請海岸巡防機關或其他機關協助通知及執行；其進港及停泊期間所需費用，由船舶所有人、船長、遊艇駕駛或小船駕駛負擔。\n前項進港並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，該船舶不問屬於何人所有，由航政機關或行政院指定之機關沒入之。","note":"一、本條新增。\n二、配合修正條文第八條之一、第十條之一、第十一條之一，就行為人違反行政法上義務增訂罰則，爰為第一項規定。\n三、考慮船舶航行過程隱匿船舶資訊會造成船舶航行安全之危害，爰於第二項增訂航政機關得令該船舶進港並停泊至指定處所，又為及時有效處置違規船舶，必要時，得洽請海岸巡防機關或其他機關協助通知及執行押送船舶至指定處所。另就進港及停泊期間費用應由何者負擔，於後段定明。\n四、為加速航政機關對於違反修正條文第八條之一、第十條之一、第十一條之一，且有妨礙港區或水域安全之虞船舶之處置，於第三項定明依第二項規定進港，並停泊至指定處所之船舶，進港後逾三個月，未依第一項規定完成改善，而有妨礙港口或水域安全之虞者，不問該船舶屬於何人所有，由航政機關或行政院指定之機關沒入之。另考量船舶具前開違規情形之水域，可能位於金門、馬祖等地區水域，為迅速處置該船舶，提升執行效能，將令其就近於鄰近港口進港停泊，爰參酌商港法第二條第二項第二款，納入行政院指定之機關，增加執法之彈性。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第九十七條之一","current":"以竊取、毀壞或其他非法方法危害與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水必要設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n第一項所定與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水之必要設施、設備，由中央主管機關會商相關機關及自來水事業，衡酌其規模、供水量、所在地區、影響民眾生命、身體、財產安全程度及影響經濟產業程度等因素公告之；其異動時，亦同。","versions":[{"bill":"201110161340200","text":"以竊取、毀壞或其他非法方法危害自來水事業之海底送水管線、與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水必要設施或設備之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害自來水事業之海底送水管線之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪所用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所定與公共安全有關之自來水事業取水、貯水、導水、淨水、送水、配水之必要設施、設備，由中央主管機關會商相關機關及自來水事業，衡酌其規模、供水量、所在地區、影響民眾生命、身體、財產安全程度及影響經濟產業程度等因素公告之；其異動時，亦同。","note":"一、考量自來水為民生必要資源，其設備之運作攸關人民生命、身體及財產之安全，如自來水事業之海底送水管線遭侵害，將對民生社會安定、公共及國家安全造成嚴重影響，為強化對海底送水管線之保護，於第一項增訂自來水事業之海底送水管線為保護客體。\n二、第二項及第三項未修正。\n三、考量海底送水管線對民生供水之重要性，如因過失毀壞或以其他非法方法危害其功能之正常運作，對於國內民生用水穩定供應將產生嚴重影響；又考量海底送水管線布建之相關圖資已規劃納入海洋委員會之國家海洋資料庫及共享平台，從事海域航行或相關工作者應能知悉並避免造成侵害，爰參考電信管理法第七十二條第四項規定，增訂第四項過失犯之刑罰規範。\n四、第四項移列為第五項，內容未修正。\n五、為維護全國自來水系統正常運作及安全，對第一項所定自來水事業設施、設備（包括自來水事業之海底送水管線）之犯罪態樣，就供其犯罪用之工具、船舶等有不問何人所有均予沒收及明定處置方式之必要，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n六、第五項移列為第七項，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第一百條","current":"本法關於船長或駕駛之規定，於代理船長、駕駛或執行其職務者準用之。\n代理船長、駕駛或執行其職務者，違反前項準用規定者，依第八十九條至第九十四條、第九十八條或第九十九條規定處罰。\n本法關於船舶所有人於第八條、第二十八條之三、第三十條之一、第三十四條之一、第五十二條第三項、第五十九條第二項、第七十條、第七十四條第二項規定，於船舶租用人準用之。\n船舶租用人違反前項準用規定者，依第八十九條、第九十條、第九十一條第一項、第九十七條、第九十八條或第九十九條規定處罰。","versions":[{"bill":"201110161340200","text":"本法關於船長或駕駛之規定，於代理船長、駕駛或執行其職務者準用之。\n代理船長、駕駛或執行其職務者，違反前項準用規定者，依第八十九條至第九十四條、第九十八條或第九十九條規定處罰。\n本法關於船舶所有人於第八條、第八條之一、第十條之一、第十一條之一、第二十八條之三、第三十條之一、第三十四條之一、第五十二條第三項、第五十九條第二項、第七十條、第七十四條第二項規定，於船舶租用人準用之。\n船舶租用人違反前項準用規定者，依第八十九條、第八十九條之一、第九十條、第九十一條第一項、第九十七條、第九十八條或第九十九條規定處罰。","note":"一、為使船舶租用人亦有應遵循修正條文第八條之一、第十條之一及第十一條之一之義務，並適用相應之罰則，爰修正第三項及第四項。\n二、第一項、第二項未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2025-09-30","stage":"一讀","code":"院會-11-4-2","bill":null,"gazref":"114卷078期5371號 4-4頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110162840000","gazref":"114卷079期5372號一冊 4-4頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110163050000","gazref":"114卷079期5372號一冊 6-6頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110163450000","gazref":"114卷079期5372號一冊 8-8頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110163850000","gazref":"114卷079期5372號一冊 10-10頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110165250000","gazref":"114卷080期5373號一冊 16-16頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110164140000","gazref":"114卷080期5373號一冊 19-19頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110164300000","gazref":"114卷080期5373號一冊 20-20頁"},{"date":"2025-10-17","stage":"一讀" <script>

function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);

  c.append(body);

}
function showArticle() {

function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排

}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照

}
function fold(label, content, peek) {   // 點開才看全文；有 peek 時收合狀態露一行預覽

}
const dlg = el('dialog', {class: 'artdlg', 'aria-labelledby': 'dlgt'});
document.body.append(dlg);
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openArticleDialog(p, no) {   // 獨立視窗看某一條的各版本，可在該提案動到的條文間切換
  dlg.textContent = '';

  const nav = el('div', {class: 'chips'});

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });

function showTip(tag, keys, pin) {

    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });

  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';

}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤

  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});

  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });

}

  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
</html>
