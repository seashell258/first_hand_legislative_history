兩萬五千元提高至三萬五千元。\n(二)另依財政部賦稅署107年05月02日台財稅字第10704567670號令「納稅義務人列報扶養孫子女之教育學費特別扣除額及幼兒學前特別扣除額相關規定」及109年04月29日台財稅字第10804661680號令「補充核釋納稅義務人列報扶養受監護人之教育學費特別扣除額及幼兒學前特別扣除額規定」，現行教育學費特別扣除額之子女範圍，尚包含孫子女及受監護親屬，惟現行所得稅法第十七條，內容僅列「子女」，為避免納稅義務人錯失稅捐優惠，爰依上開函示，修正教育學費特別扣除額之子女範圍。\n二、增訂第一項第二款第三目之9，依據90年6月20日台財稅字第0900452964號函釋，納稅義務人所支付之健康檢查費用，僅在與後續治療具因果關係之前提下，始得依本法第十七條規定申報醫藥費列舉扣除。另鑑於「健康台灣」是賴清德總統提出的國家願景，旨在提升國人平均餘命、降低不健康年數，優化醫療環境及精準健康政策，打造一個全齡健康的永續社會，並訂定於2030年前降低三分之一癌症及慢性病之標準化死亡率之目標。為提升國人定期實施健康檢查意願、促進國人落實預防保健、縮短不健康餘命，以減低後續國家投入全民醫療、健保及長照之負擔，爰於第一項第二款第三目增訂「健康檢查特別扣除額」，並明定健康檢查費用受有保險給付或政府補助，或經財政部認定得申報扣除醫藥及生育費者，不得再行扣除，以遵循租稅公平性。"},{"bill":"202110206330000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國一百十五年一月一日起，納稅義務人之未成年子女，第一名子女每年扣除二十萬元，第二名及以上子女每人每年扣除三十萬元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、鑑於人口結構與發展趨勢攸關國家長期競爭力，少子女化已構成國安問題。政府雖持續研擬相關對策，致力為青年營造「敢婚、願生、樂養」之友善環境，除提供托育服務、就學補助及育兒津貼外，並自一○一年起增訂幼兒學前特別扣除額，以減輕家庭之經濟負擔。\n二、依財政部歷年中央政府賦稅實徵淨額統計分析，綜合所得稅於一一四年之實徵淨額較一○一年大幅增加三千八百三十六億元，成長達一○八%；反觀內政部人口統計資料，一○一年出生人口為二十二點九萬人，至一一四年降至十點八萬人，減少約十二萬人，呈現稅收顯著成長而出生人口近乎減半之趨勢。\n三、為提升國人之生育意願並減輕家庭扶養未成年子女之經濟負擔，現行個人綜合所得稅租稅優惠措施實有檢討與調整之必要，爰建議將適用範圍擴大至所有未成年子女，並提高扣除額度：第一名子女每年扣除新臺幣二十萬元，第二名及以上子女每人每年扣除新臺幣三十萬元；爰修正本條，將「幼兒學前特別扣除額」調整為「未成年子女特別扣除額」，以充裕產業所需勞動力，穩固經濟與社會發展基磐，促進國家永續發展。"},{"bill":"202110208040000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、緩解少子化危機：\n養育子女負擔沉重是國人不願生育的主因之一。增加未成年教育扣除額能直接降低育兒中後期的經濟壓力，與政府「國家跟你一起養」的政策目標相符。擴大未成年特別扣除額，不僅能感同身受家長之辛勞，更是國家對於優質養育環境的承諾。\n二、課稅公平原則：\n為落實國家跟你一起養的政策，對於納稅義務人應比照營利事業之必要成本支出，給予更合理的減免額度。"},{"bill":"202110209930000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.青少年及幼兒特別扣除：自中華民國一百十六年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十六年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除二十四萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、修正條文第一項第二款第三目之六，將現行僅適用六歲以下子女之「幼兒學前特別扣除」調整為「青少年及幼兒特別扣除」，並將適用年齡上限擴大至十八歲以下，使租稅減免得以涵蓋全體未成年子女。考量育兒支出並不止於學前階段，子女進入學齡及青少年後，教育、照顧與生活相關費用仍持續增加，若扣除額僅限幼兒期，易造成政策支持中斷並降低家庭養育的財務可預期性。爰透過擴大適用範圍，強化全成長週期之扶育支持，減輕家長稅負並提升生育友善誘因；另明定自民國一百十六年一月一日起施行，以利各界預作因應。\n二、修正條文第一項第二款第三目之七，鑑於長期照顧身心失能者所衍生之照護人力、輔具醫療與居家服務等支出日益沉重，且在高齡化趨勢下家庭照顧負擔持續攀升，為強化租稅措施對長照家庭之實質支持、降低其財務壓力，爰將長期照顧特別扣除額由現行每人每年十八萬元調增為二十四萬元，以更貼近實際照護成本並回應社會需求。"},{"bill":"202110214070000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險及國民年金保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、配合第十四條明定依公教人員保險法、勞工保險條例、軍人保險條例規定繳付之保險費用，不計入提繳年度薪資收入課稅，爰修正第一項第二款第二目之2保險費列舉扣除額規定，排除勞工保險及軍、公、教保險之保險費。\n二、為減輕照顧家庭負擔，打造友善生養之稅制環境，並彌補現行幼兒學前特別扣除與教育學費特別扣除之空窗，進而降低育兒家庭之稅負，爰修正第一項第二款第三目之6幼兒學前特別扣除規定，改為未成年特別扣除，並擴大其適用年齡至成年止。"},{"bill":"202110214360000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人、配偶、子女及受撫養親屬就讀大專以上院校之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國○年○月○日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、現行有關教育學費特別扣除額之規定，依財政部於2018年5月2日以台財稅字第10704567670號函釋：「納稅義務人孫子女之父母如有死亡、失蹤、長期服刑或受宣告停止親權情形之一不能扶養其子女，而由納稅義務人扶養者，得依規定列報免稅額並得減除該孫子女之教育學費特別扣除額或幼兒學前特別扣除額。」意即除本條所稱「子女」外，得列報被扶養孫子女教育學費特別扣除額或幼兒學前特別扣除額者，亦包含被扶養孫子女之父母有「死亡、失蹤、長期服刑或受宣告停止親權」情形之一者。然，若非屬上開情形，僅係隔代教養家庭或確實有扶養事實者，依上述函釋則不得列報減除，恐已有違量能課稅及平等原則。\n二、為免財政部以解釋函令擴張現行本法所無之規定致有違法之虞，且得否列報孫子女免稅額及相關扣除額，實應繫於其是否有扶養事實，故修正為「子女及受撫養親屬」，以臻明確。\n三、又，我國各大專院校在職進修專班設置林立，係為提供已在職之國人仍得視其需求繼續進修；為鼓勵國人持續進修、精進自我，並藉以提升我國人力資源之競爭力，故參酌立法院法制局之報告建議，增訂本法納稅義務人本人及其配偶納入學費特別扣除額之範圍。\n四、我國少子化日益嚴重，據內政部統計資料顯示，截至民國115年3月底，臺灣人口數已連續27個月呈負成長，3月新生兒出生數僅8,798人；而總人口數則為2,327萬568人，較114年同期減少10萬4,174人。據114年報載，知名人力銀行所作之調查數據顯示，50.4%的人承認因「收入僅能養活自己」而選擇單身，更有高達67.3%坦言因經濟壓力放棄生小孩的念頭，顯見經濟壓力仍為我國面臨少子化重要因素之一。為減輕育兒家庭負擔，故將幼兒學前扣除額擴大，並修正為未成年扣除額，以利降低養育子女中後期的經濟壓力，落實政府「國家跟你一起養」的政策目標。"},{"bill":"202110216710000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險之保險費，每人每年扣除數額以不超過六萬元為限。但依全民健康保險法、公教人員保險法、勞工保險條例、軍人保險條例、國民年金法、就業保險法、勞工職業災害保險及保護法、農民健康保險條例及依農民健康保險條例第四十四條之二規定辦理之農民職業災害保險，應由納稅義務人、配偶或受扶養直系親屬負擔之保險費，不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、現行人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費列舉扣除額，每人每年扣除上限為二萬四千元，已長期未能充分反映人民實際保險費負擔，爰將人身保險之保險費扣除上限提高為每人每年六萬元。\n二、法定社會保險費係人民依法或依法律授權命令所定社會保險制度所生之必要支出，與自願投保之一般人身保險性質不同，爰明定依全民健康保險法、公教人員保險法、勞工保險條例、軍人保險條例、國民年金法、就業保險法、勞工職業災害保險及保護法、農民健康保險條例及依農民健康保險條例第四十四條之二規定辦理之農民職業災害保險，應由納稅義務人、配偶或受扶養直系親屬負擔之保險費，不受金額限制。\n三、前款所稱應由納稅義務人、配偶或受扶養直系親屬負擔之保險費，包含依法由投保單位代扣代繳之應由納稅義務人、配偶或受扶養直系親屬負擔部分，不包括政府、雇主、投保單位或其他依法補助或分擔之部分。\n四、本案未新增特別扣除額，亦未修正第十四條薪資所得計算規定，係於現行列舉扣除額體系內，合理區分自願性人身保險與法定社會保險費之性質，以兼顧租稅公平、制度穩定及行政可行性。"},{"bill":"202110217990000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之六十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者，免稅額增加百分之六十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、鑒於人口結構變遷已影響國家發展，超高齡社會與少子女化問題日益嚴峻。政府雖推動國民年金、托育、就學補助及育兒津貼等措施，惟現行免稅額僅十萬一千元，仍低於各縣市最低生活費標準換算之年度金額，難以充分反映物價上漲及基本生活需求，爰有調升必要。\n二、依財政部統計，綜合所得稅一一四年實徵淨額較一○一年增加三千八百三十六億元，成長達一○八%；另依內政部資料，出生人口數已由二十二萬九千人降至十萬八千人，減少約十二萬人，呈現稅收增加與出生人口減半之趨勢。政府應積極研議相關對策，打造青年敢婚、願生、樂養之友善環境。\n三、我國已邁入超高齡社會，少子女化問題亦持續惡化，形成結構性國安挑戰，年輕世代扶養負擔與經濟壓力日益沉重，有必要擴大敬老扶幼租稅優惠。爰修正本條第一項第一款第一目及第二目，將未成年子女及年滿七十歲受納稅義務人扶養者之免稅額增加百分之六十，以強化基本生活保障及租稅照顧。"},{"bill":"202110218040000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"為因應少子化問題，提高國人生育意願，政府應盡力打造友善生養環境及提供各項協助。為減輕國民養育子女經濟負擔，提供租稅減免為世界各國普遍採取之措施，爰修正本條第一項第一款第二目，將受納稅義務人扶養之未成年子女或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者，免稅額增加百分之五十。"},{"bill":"202110219720000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年子女受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"為因應我國少子女化問題，並減輕育兒家庭之經濟負擔，參照現行年滿七十歲之本人、配偶及受扶養直系尊親屬於免稅額增加百分之五十規定，增修受納稅義務人扶養之未成年子女，免稅額增加百分之五十規定，使其減輕所得稅負擔。"},{"bill":"202110219470000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n9.健康檢查特別扣除：自中華民國○年○月○日起，納稅義務人、配偶或受扶養親屬，於公立醫院、全民健康保險特約醫療院所，或經財政部認定會計紀錄完備正確之醫院進行健康檢查所支付之費用，每人每年得扣除新臺幣一萬五千元。但有下列情形之一者，不予扣除：\n(1)受有保險給付或政府補助。\n(2)該筆費用已依本法規定列報為醫藥及生育費扣除額。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"依據財政部民國90年6月20日台財稅字第0900452964號函釋，健檢費用須與後續治療具因果關係始得列舉扣除。然現今隨預防醫學普及，民眾常需自費進行無痛胃腸鏡或低劑量電腦斷層（LDCT）等高階健檢，開銷多落在新臺幣一萬元至二萬元之間。現行限制導致積極進行預防性檢查之民眾無法享有稅捐減免，顯不切合實際開銷水準，亦降低基層與中產階級之自費健檢意願。「健康台灣」為國家願景，旨在提升國人平均餘命、降低不健康年數，為實質減輕家庭負擔、切合民眾實際開銷，爰於第一項第二款第三目增訂之9「健康檢查特別扣除額」，並將額度定為每人每年新臺幣一萬五千元，以提升國人定期篩檢意願，減低國家未來整體醫療與長照負擔。另為符租稅公平，若費用已領取保險給付、政府補助或已列報醫藥費者，不得重複扣除。"},{"bill":"202110220290000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n9.健康檢查特別扣除：自中華民國一百十六年一月一日起，納稅義務人、配偶或受扶養親屬之健康檢查費用，給付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者，每人每年扣除額以一萬元為限。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"近年，政府逐步擴大公費癌症篩檢服務，然，仍有尚未納入公費癌症篩檢之癌別，年齡或家族史等條件不符公費篩檢資格者，在政府資源配置之權衡下，恐未能完整覆蓋，顯見在政府癌症及慢性病之防治政策下，需提供具體誘因，助提升國人定期健康檢查之意願，落實健康促進及預防醫學。"},{"bill":"202110220360000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國一百十六年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元；若納稅義務人撫養未成年子女達三名以上者，其第三名及以上之子女，每人每年得全額沖抵免稅，或適用最高三十萬元之薪資所得特別加碼寬減。\n7.長期照顧特別扣除：自中華民國一百十六年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除二十四萬元；若納稅義務人申報兩人以上符合上開資格者，其第二人起之特別扣除額得加倍減免。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n9.健康檢查特別扣除：納稅義務人、配偶或受扶養親屬之健康檢查費用，每人每年扣除數額以一萬元為限。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除、之8房屋租金支出特別扣除及之9健康檢查特別扣除之規定：\n一、經減除長期照顧特別扣除額、房屋租金支出特別扣除額及健康檢查特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、修正條文第一項第二款第三目之6，將現行僅適用六歲以下子女之「幼兒學前特別扣除」調整為「未成年特別扣除」，並將適用年齡上限擴大至十八歲以下，使租稅減免得以涵蓋全體未成年子女；並增訂若納稅義務人撫養未成年子女達三名以上者，其第三名及以上之子女，每人每年得全額沖抵免稅，或適用最高三十萬元之薪資所得特別加碼寬減。\n二、修正條文第一項第二款第三目之7，鑑於長期照顧身心失能者所衍生之照護人力、輔具醫療與居家服務等支出日益沉重，且在高齡化趨勢下家庭照顧負擔持續攀升，為強化租稅措施對長照家庭之實質支持、降低其財務壓力，爰將長期照顧特別扣除額由現行每人每年十八萬元調增為二十四萬元，以更貼近實際照護成本並回應社會需求。另針對申報扶養二人以上符合長期照顧資格者，首創特別扣除額加倍減免機制，以實質減輕多重長照家庭之極重度經濟負擔，兩人以上公式為24萬*人數*2。\n三、為符應預防醫學精神、從源頭節省國家健保與長照財政負擔，增訂第十七條第一項第二款第三目之9「健康檢查特別扣除額」，每人每年以1萬元為限。\n四、政府的租稅資源有限，應優先補貼中低收入或三明治世代之健檢負擔。至高所得階層因具備自主負擔能力，爰增訂排富條款，以符合租稅公平原則並避免租稅資源之浪費。"},{"bill":"202110223180000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：自中華民國○年○月○日起，納稅義務人就讀國民教育學校、大專以上院校之受扶養親屬之教育學費每人每年之扣除數額以五萬元為限。但空中大學不得扣除。\n6.青少年及幼兒特別扣除：自中華民國○年○月○日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"為減輕照顧家庭負擔，打造友善生養之稅制環境，並彌補現行幼兒學前特別扣除與教育學費特別扣除之空窗，進而降低育兒家庭之稅負，爰修正第一項第二款第三目之6幼兒學前特別扣除規定，改為未成年特別扣除，並擴大其適用年齡至成年止。"},{"bill":"202110222760000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、於第一項第一款第二目增訂受納稅義務人扶養之未成年子女免稅額增加百分之五十規定。\n二、第二項及第三項未修正。"},{"bill":"202110223610000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、為因應我國少子女化問題，並考量育兒家庭之經濟負擔，參照現行年滿七十歲之本人、配偶及受扶養直系尊親屬免稅額增加百分之五十規定，於第一項第一款第二目增訂受納稅義務人扶養之未成年子女，免稅額增加百分之五十規定，期使所得稅負合理化。另配合精神衛生法第三條於一百十一年十二月十四日修正增訂第二項，調整第一項第二款第三目之4引用條文。\n二、第二項及第三項未修正。"},{"bill":"201110222850000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、為因應我國少子女化問題，並考量育兒家庭之經濟負擔，參照現行年滿七十歲之本人、配偶及受扶養直系尊親屬免稅額增加百分之五十規定，於第一項第一款第二目增訂受納稅義務人扶養之未成年子女，免稅額增加百分之五十規定，期使所得稅負合理化。另配合精神衛生法第三條於一百十一年十二月十四日修正增訂第二項，調整第一項第二款第三目之4引用條文。\n二、第二項及第三項未修正。"},{"bill":"202110225030000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養及身心障礙者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、修正第一項第一款第二目及第一項第二款第三目之4。\n二、為因應我國少子女化問題，並考量育兒家庭及身心障礙者之經濟負擔，參照現行年滿七十歲之本人、配偶及受扶養直系尊親屬免稅額增加百分之五十規定，於第一項第一款第二目增訂受納稅義務人扶養之未成年子女或身心障礙者，免稅額增加百分之五十規定，期使所得稅負合理化。\n三、配合《精神衛生法》第三條於一百十一年十二月十四日修正增訂第二項，調整第一項第二款第三目之4。"},{"bill":"202110222890000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"少子女化趨勢日益嚴峻，為強化租稅制度對育兒家庭之支持，減輕未成年子女養育及照顧成本，並填補現行幼兒學前特別扣除額與教育學費特別扣除額間之制度空窗，爰修正第一項第二款第三目之六規定，將幼兒學前特別扣除額修正為未成年子女特別扣除額，並擴大其適用年齡範圍至成年止，以建構更完善之家庭支持體系及友善生養環境。"},{"bill":"202110223790000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十。納稅義務人申報扶養未滿十八歲之子女，其免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十六年一月一日起，納稅義務人申報扶養六歲以下之子女，第一名子女每年扣除十八萬元，第二名及以上子女每人每年扣除二十五萬元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、少子女化已非單一社會問題，而是牽動國家勞動力供給、總體經濟發展與財政永續之國安危機，賴總統已於近日就職演說中宣示推動「國家人口對策新戰略－家庭支持篇」。現行稅制中，對於年滿七十歲之長者已設有免稅額增加百分之五十之「敬老條款」，然而對於國家亟須投資之下一代，卻缺乏相對應之「育兒條款」。為符合跨世代之租稅公平，爰提案修正第一項第一款，明訂納稅義務人申報扶養未滿十八歲子女者，其免稅額比照長者加成百分之五十，從根源降低育兒家庭之稅負。\n二、尤其，近年台灣科技產業聚落快速發展，以台南市為例，半導體與智慧製造產業帶來大量受薪階級移入，然而，高通膨與城鄉生活成本攀升問題也隨之而來，使中產階級家庭面臨沉重的育兒壓力。現行幼兒學前特別扣除額（第一胎12萬、第二胎以上13.5萬）已不足以反映當前真實的托嬰、早療與學前教育成本，爰提案修正第一項第二款，將額度提高至第一名子女18萬元、第二名及以上子女25萬元，減輕納稅人扶養未成年子女的經濟壓力，更透過累進減免機制，實質鼓勵生育第二胎以上之家庭。\n三、在中央與地方的政策協作上，透過全面發給未成年兒少每月5千元成長津貼，進行實質現金移轉，而本修正案則精準針對負擔國家主要稅基的受薪階級，提供合理的所得稅減除，透過「社會津貼」與「租稅減免」雙管齊下，方能完整建構不分城鄉、無分產業別的友善育兒環境，達成國家資源重分配之最大效益。"},{"bill":"202110226430000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。受納稅義務人扶養之未成年子女，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.兒童及少年特別扣除：自中華民國一百十六年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十七萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、為實質抒解育兒家庭之經濟壓力，於第一項第一款第二目增設受扶養未成年子女免稅額增加百分之五十之獎勵，提供直接租稅抵減支持。\n二、鑑於子女養育開支具備成長各階段長期且持續之特性，第一項第二款第三目之6將原僅限學前之短期政策，適用對象擴增為涵蓋全未成年時期之「兒童及少年特別扣除」，並調升第一名子女每年扣除額至十七萬元，以提高國人生育意願，緩解少子化危機。"},{"bill":"202110226590000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、為因應我國少子女化及減輕育兒家庭經濟負擔，參照現行年滿七十歲本人、配偶及受扶養直系尊親屬免稅額增加百分之五十之規定，於第一項第一款第二目增訂受納稅義務人扶養之未成年子女免稅額增加百分之五十；另配合精神衛生法第三條修正，調整第一項第二款第三目之4引用條文。\n二、第二項及第三項未修正。"},{"bill":"202110228870000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、鑑於我國少子女化趨勢持續，為減輕扶養未成年子女家庭之租稅負擔，並強化對育兒家庭之支持，爰參照現行納稅義務人、配偶及受扶養直系尊親屬年滿七十歲免稅額加成之規定，增訂受納稅義務人扶養之未成年子女免稅額增加百分之五十，以合理反映家庭扶養成本，並落實租稅公平。另配合精神衛生法第三條修正，調整相關引用條文。\n二、第二項及第三項未修正。"},{"bill":"202110230330000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、為因應我國少子女化問題，並考量育兒家庭之經濟負擔，參照現行年滿七十歲之本人、配偶及受扶養直系尊親屬免稅額增加百分之五十規定，於第一項第一款第二目增訂受納稅義務人扶養之未成年子女，免稅額增加百分之五十規定。另配合精神衛生法第三條於一百十一年十二月十四日修正增訂第二項，調整第一項第二款第三目之4引用條文。\n二、第二項及第三項未修正。"},{"bill":"202110230190000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。如符合住宅法第四條第一項規定之婚育家庭成員，其扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、為因應我國少子女化問題，並考量育兒家庭之經濟負擔，參照現行年滿七十歲之本人、配偶及受扶養直系尊親屬免稅額增加百分之五十規定，於第一項第一款第二目增訂受納稅義務人扶養之未成年子女，免稅額增加百分之五十，期使所得稅負合理化，實質減輕育兒家庭負擔。\n二、鑑於居住成本為青年成家育兒之核心障礙，為全方位減輕婚育家庭之居住負擔，爰配合政府人口對策新戰略，於第一項第二款第二目之5增訂符合住宅法第四條第一項規定之婚育家庭成員，將其自用住宅購屋借款利息扣除數額上限由三十萬元；本項加碼仍維持「以一屋為限」及應扣除儲蓄投資特別扣除額等限制，精準投射資源於實質安定居住需求之家庭，兼顧租稅公平。\n三、另配合精神衛生法第三條於一百十一年十二月十四日修正增訂第二項，調整第一項第二款第三目之4引用條文。\n四、第二項及第三項未修正。"},{"bill":"202110229840000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、為因應我國少子女化問題，並考量育兒家庭之經濟負擔，參照現行年滿七十歲之本人、配偶及受扶養直系尊親屬免稅額增加百分之五十規定，於第一項第一款第二目增訂受納稅義務人扶養之未成年子女，免稅額增加百分之五十規定，期使所得稅負合理化。另配合精神衛生法第三條於一百十一年十二月十四日修正增訂第二項，調整第一項第二款第三目之4引用條文。\n二、第二項及第三項未修正。"}],"changed":true,"final":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。其未成年受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險、勞工保險、農民健康保險、國民年金保險及軍、公、教保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第一項第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","finalWhy":"一、為減輕育兒家庭負擔，打造友善生養之稅制環境，以廣泛照顧育兒家庭，爰參考現行年滿七十歲之本人、配偶及受扶養直系尊親屬免稅額增加百分之五十規定，於第一項第一款第二目增訂受納稅義務人扶養之未成年子女，免稅額增加百分之五十規定，期使所得稅負合理化。\n二、公、教、軍、警、公私事業職工及農民，依公教人員保險法、軍人保險條例、勞工保險條例及農民健康保險條例規定，強制納保而應繳付之保險費用；或應參加或已參加相關社會保險者外，符合被保險人資格之未滿六十五歲國民，依國民年金法規定強制納保而應繳付之保險費用，上開保險費用性質均與全民健康保險之保險費等強制性社會保險費相仿，爰參考現行全民健康保險之保險費列舉扣除額不受金額限制之規定，於第一項第二款第二目之 2 但書增訂勞工保險、農民健康保險、國民年金保險及軍、公、教保險等保險費亦不受金額限制。\n三、另配合精神衛生法第三條於一百十一年十二月十四日修正增訂第二項，調整第一項第二款第三目之 4 引用條文。","review":{"note":"保留，送院會處理","text":""}},{"no":"第一百二十六條","current":"本法自公布日施行。但中華民國九十四年十二月二十八日修正公布之第十七條，自九十四年一月一日施行；九十七年一月二日修正公布之第十四條第一項第九類，自九十七年一月一日施行；九十七年十二月二十六日修正公布之第十七條，自九十七年一月一日施行；九十八年五月二十七日修正公布之第五條第二項及九十九年六月十五日修正公布之同 期修正為總統公布日期，以利法規適用及查考。\n三、第三項未修正。"},{"bill":"202110230190000","text":"本法自公布日施行。但中華民國九十四年十二月二十八日修正公布之第十七條，自九十四年一月一日施行；九十七年一月二日修正公布之第十四條第一項第九類，自九十七年一月一日施行；九十七年十二月二十六日修正公布之第十七條，自九十七年一月一日施行；九十八年五月二十七日修正公布之第五條第二項及九十九年六月十五日修正公布之同條第五項，自九十九年度施行；一百年一月十九日修正公布之第四條第一項第一款、第二款及第十七條第一項第一款第四目，自一百零一年一月一日施行；一百零一年八月八日修正公布條文，自一百零二年一月一日施行；一百零四年六月二十四日修正公布條文，自一百零五年一月一日施行；一百零四年十二月二日修正公布條文，自一百零五年一月一日施行；一百零八年七月二十四日修正公布條文，自一百零八年一月一日施行；一百十年四月二十八日修正公布條文，自一百十年七月一日施行；○年○月○日修正之條文，自一百十五年一月一日施行。\n本法中華民國九十年六月十三日修正公布條文、一百零三年一月八日修正公布條文、一百零五年七月二十七日修正公布條文及一百十三年八月七日修正公布條文施行日期，由行政院定之；一百零三年六月四日修正公布條文，除第六十六條之四、第六十六條之六及第七十三條之二自一百零四年一月一日施行外，其餘條文自一百零四年度施行。\n本法中華民國一百零七年二月七日修正公布條文，自一百零七年一月一日施行。但第五條、第六十六條之九、第七十一條、第七十五條、第七十九條、第一百零八條及第一百十條，自一百零七年度施行，第七十三條之二自一百零八年一月一日施行。","note":"一、修正第一項。為使本次少子女化稅制優化措施及早發揮催生效益，明定相關修正條文之施行日期自一百十五年一月一日起施行，以利納稅義務人於一百十六年五月申報所得稅時即可列報減除。\n二、修正第二項。考量法律案經總統公布後之日期，較立法院三讀通過之日期更易於社會大眾查閱且為大眾所周知，爰將原條文中所引用之前次修正「三讀日期」統整變更為「總統公布日期」。\n三、第三項未修正。"},{"bill":"202110229840000","text":"本法自公布日施行。但中華民國九十四年十二月二十八日修正公布之第十七條，自九十四年一月一日施行；九十七年一月二日修正公布之第十四條第一項第九類，自九十七年一月一日施行；九十七年十二月二十六日修正公布之第十七條，自九十七年一月一日施行；九十八年五月二十七日修正公布之第五條第二項及九十九年六月十五日修正公布之同條第五項，自九十九年度施行；一百年一月十九日修正公布之第四條第一項第一款、第二款及第十七條第一項第一款第四目，自一百零一年一月一日施行；一百零一年八月八日修正公布條文，自一百零二年一月一日施行；一百零四年六月二十四日修正公布條文，自一百零五年一月一日施行；一百零四年十二月二日修正公布條文，自一百零五年一月一日施行；一百零八年七月二十四日修正公布條文，自一百零八年一月一日施行；一百十年四月二十八日修正公布條文，自一百十年七月一日施行；○年○月○日修正之條文，自一百十五年一月一日施行。\n本法中華民國九十年六月十三日修正公布條文、一百零三年一月八日修正公布條文、一百零五年七月二十七日修正公布條文及一百十三年八月七日修正公布條文施行日期，由行政院定之；一百零三年六月四日修正公布條文，除第六十六條之四、第六十六條之六及第七十三條之二自一百零四年一月一日施行外，其餘條文自一百零四年度施行。\n本法中華民國一百零七年二月七日修正公布條文，自一百零七年一月一日施行。但第五條、第六十六條之九、第七十一條、第七十五條、第七十九條、第一百零八條及第一百十條，自一百零七年度施行，第七十三條之二自一百零八年一月一日施行。","note":"一、修正第一項，明定本次修正條文之施行日期為一百十五年一月一日。\n二、鑒於法律案經總統公布後，其公布日期為一般民眾所周知，較立法院三讀日期易於查閱，爰將第二項之前次修正條文三讀日期修正為總統公布日期。\n三、第三項未修正。"}],"changed":true,"final":"本法自公布日施行。但中華民國九十四年十二月二十八日修正公布之第十七條，自九十四年一月一日施行；九十七年一月二日修正公布之第十四條第一項第九類，自九十七年一月一日施行；九十七年十二月二十六日修正公布之第十七條，自九十七年一月一日施行；九十八年五月二十七日修正公布之第五條第二項及九十九年六月十五日修正公布之同條第五項，自九十九年度施行；一百年一月十九日修正公布之第四條第一項第一款、第二款及第十七條第一項第一款第四目，自一百零一年一月一日施行；一百零一年八月八日修正 function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;

  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };

function finder(turns) {   // 在這場逐字稿裡找字

    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
