<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>所得稅法 2026 年修正歷程（未成年子女免稅額、社會保險費扣除）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

條條文修正草案」。是否有當？敬請公決。","arts":["第十七條","第一百二十六條"]}],"arts":[{"no":"第十四條","current":"個人之綜合所得總額，以其全年下列各類所得合併計算之：\n第一類：營利所得：公司股東所獲分配之股利、合作社社員所獲分配之盈餘、其他法人出資者所獲分配之盈餘、合夥組織營利事業之合夥人每年度應分配之盈餘、獨資資本主每年自其獨資經營事業所得之盈餘及個人一時貿易之盈餘皆屬之。\n合夥人應分配之盈餘或獨資資本主經營獨資事業所得之盈餘，應按核定之營利事業所得額計算之。\n第二類：執行業務所得：凡執行業務者之業務或演技收入，減除業務所房租或折舊、業務上使用器材設備之折舊及修理費，或收取代價提供顧客使用之藥品、材料等之成本、業務上雇用人員之薪資、執行業務之旅費及其他直接必要費用後之餘額為所得額。\n執行業務者至少應設置日記帳一種，詳細記載其業務收支項目；業務支出，應取得確實憑證。帳簿及憑證最少應保存五年；帳簿、憑證之設置、取得、保管及其他應遵行事項之辦法，由財政部定之。\n執行業務者為執行業務而使用之房屋及器材、設備之折舊，依固定資產耐用年數表之規定。執行業務費用之列支，準用本法有關營利事業所得稅之規定；其帳簿、憑證之查核、收入與費用之認列及其他應遵行事項之辦法，由財政部定之。\n第三類：薪資所得：凡公、教、軍、警、公私事業職工薪資及提供勞務者之所得：\n一、薪資所得之計算，以在職務上或工作上取得之各種薪資收入，減除第十七條第一項第二款第三目之2薪資所得特別扣除額後之餘額為所得額，餘額為負數者，以零計算。但與提供勞務直接相關且由所得人負擔之下列必要費用合計金額超過該扣除額者，得檢附相關證明文件核實自薪資收入中減除該必要費用，以其餘額為所得額：\n(一)職業專用服裝費：職業所必需穿著之特殊服裝或表演專用服裝，其購置、租用、清潔及維護費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n(二)進修訓練費：參加符合規定之機構開設職務上、工作上或依法令要求所需特定技能或專業知識相關課程之訓練費用。每人全年減除金額以其薪資收入總額之百分之三為限。\n(三)職業上工具支出：購置專供職務上或工作上使用書籍、期刊及工具之支出。但其效能非二年內所能耗竭且支出超過一定金額者，應逐年攤提折舊或攤銷費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n二、依前款規定計算之薪資所得，於依第十五條規定計算稅額及依第十七條規定計算綜合所得淨額時，不適用第十七條第一項第二款第三目之2薪資所得特別扣除之規定。\n三、第一款各目費用之適用範圍、認列方式、應檢具之證明文件、第二目符合規定之機構、第三目一定金額及攤提折舊或攤銷費用方法、年限及其他相關事項之辦法，由財政部定之。\n四、第一款薪資收入包括：薪金、俸給、工資、津貼、歲費、獎金、紅利及各種補助費。但為雇主之目的，執行職務而支領之差旅費、日支費及加班費不超過規定標準者，及依第四條規定免稅之項目，不在此限。\n五、依勞工退休金條例規定自願提繳之退休金或年金保險費，合計在每月工資百分之六範圍內，不計入提繳年度薪資收入課稅；年金保險費部分，不適用第十七條有關保險費扣除之規定。\n第四類：利息所得：凡公債、公司債、金融債券、各種短期票券、存款及其他貸出款項利息之所得：\n一、公債包括各級政府發行之債票、庫券、證券及憑券。\n二、有獎儲蓄之中獎獎金，超過儲蓄額部分，視為存款利息所得。\n三、短期票券指期限在一年期以內之國庫券、可轉讓銀行定期存單、公司與公營事業機構發行之本票或匯票及其他經目的事業主管機關核准之短期債務憑證。\n短期票券到期兌償金額超過首次發售價格部分為利息所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：\n一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。\n二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。\n三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。\n五、財產出租，其約定之租金，顯較當地一般租金為低，稽徵機關得參照當地一般租金調整計算租賃收入。\n第六類：自力耕作、漁、牧、林、礦之所得：全年收入減除成本及必要費用後之餘額為所得額。\n第七類：財產交易所得：凡財產及權利因交易而取得之所得：\n一、財產或權利原為出價取得者，以交易時之成交價額，減除原始取得之成本，及因取得、改良及移轉該項資產而支付之一切費用後之餘額為所得額。\n二、財產或權利原為繼承或贈與而取得者，以交易時之成交價額，減除繼承時或受贈與時該項財產或權利之時價及因取得、改良及移轉該項財產或權利而支付之一切費用後之餘額為所得額。\n三、個人購買或取得股份有限公司之記名股票或記名公司債、各級政府發行之債券或銀行經政府核准發行之開發債券，持有滿一年以上者，於出售時，得僅以其交易所得之半數作為當年度所得，其餘半數免稅。\n第八類：競技、競賽及機會中獎之獎金或給與：凡參加各種競技比賽及各種機會中獎之獎金或給與皆屬之：\n一、參加競技、競賽所支付之必要費用，准予減除。\n二、參加機會中獎所支付之成本，准予減除。\n三、政府舉辦之獎券中獎獎金，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第九類：退職所得：凡個人領取之退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金及依勞工退休金條例規定辦理年金保險之保險給付等所得。但個人歷年自薪資收入中自行繳付之儲金或依勞工退休金條例規定提繳之年金保險費，於提繳年度已計入薪資收入課稅部分及其孳息，不在此限：\n一、一次領取者，其所得額之計算方式如下：\n(一)一次領取總額在十五萬元乘以退職服務年資之金額以下者，所得額為零。\n(二)超過十五萬元乘以退職服務年資之金額，未達三十萬元乘以退職服務年資之金額部分，以其半數為所得額。\n(三)超過三十萬元乘以退職服務年資之金額部分，全數為所得額。\n退職服務年資之尾數未滿六個月者，以半年計；滿六個月者，以一年計。\n二、分期領取者，以全年領取總額，減除六十五萬元後之餘額為所得額。\n三、兼領一次退職所得及分期退職所得者，前二款規定可減除之金額，應依其領取一次及分期退職所得之比例分別計算之。\n第十類：其他所得：不屬於上列各類之所得，以其收入額減除成本及必要費用後之餘額為所得額。但告發或檢舉獎金、與證券商或銀行從事結構型商品交易之所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n前項各類所得，如為實物、有價證券或外國貨幣，應以取得時政府規定之價格或認可之兌換率折算之；未經政府規定者，以當地時價計算。\n個人綜合所得總額中，如有自力經營林業之所得、受僱從事遠洋漁業，於每次出海後一次分配之報酬、一次給付之撫卹金或死亡補償，超過第四條第一項第四款規定之部分及因耕地出租人收回耕地，而依平均地權條例第七十七條規定，給予之補償等變動所得，得僅以半數作為當年度所得，其餘半數免稅。\n第一項第九類規定之金額，每遇消費者物價指數較上次調整年度之指數上漲累計達百分之三以上時，按上漲程度調整之。調整金額以千元為單位，未達千元者按百元數四捨五入。其公告方式及所稱消費者物價指數準用第五條第四項之規定。","versions":[{"bill":"202110034220000","text":"個人之綜合所得總額，以其全年下列各類所得合併計算之：\n第一類：營利所得：公司股東所獲分配之股利、合作社社員所獲分配之盈餘、其他法人出資者所獲分配之盈餘、合夥組織營利事業之合夥人每年度應分配之盈餘、獨資資本主每年自其獨資經營事業所得之盈餘及個人一時貿易之盈餘皆屬之。\n合夥人應分配之盈餘或獨資資本主經營獨資事業所得之盈餘，應按核定之營利事業所得額計算之。\n第二類：執行業務所得：凡執行業務者之業務或演技收入，減除業務所房租或折舊、業務上使用器材設備之折舊及修理費，或收取代價提供顧客使用之藥品、材料等之成本、業務上雇用人員之薪資、執行業務之旅費及其他直接必要費用後之餘額為所得額。\n執行業務者至少應設置日記帳一種，詳細記載其業務收支項目；業務支出，應取得確實憑證。帳簿及憑證最少應保存五年；帳簿、憑證之設置、取得、保管及其他應遵行事項之辦法，由財政部定之。\n執行業務者為執行業務而使用之房屋及器材、設備之折舊，依固定資產耐用年數表之規定。執行業務費用之列支，準用本法有關營利事業所得稅之規定；其帳簿、憑證之查核、收入與費用之認列及其他應遵行事項之辦法，由財政部定之。\n第三類：薪資所得：凡公、教、軍、警、公私事業職工薪資及提供勞務者之所得：\n一、薪資所得之計算，以在職務上或工作上取得之各種薪資收入，減除第十七條第一項第二款第三目之2薪資所得特別扣除額後之餘額為所得額，餘額為負數者，以零計算。但與提供勞務直接相關且由所得人負擔之下列必要費用合計金額超過該扣除額者，得檢附相關證明文件核實自薪資收入中減除該必要費用，以其餘額為所得額：\n(一)職業專用服裝費：職業所必需穿著之特殊服裝或表演專用服裝，其購置、租用、清潔及維護費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n(二)進修訓練費：參加符合規定之機構開設職務上、工作上或依法令要求所需特定技能或專業知識相關課程之訓練費用。每人全年減除金額以其薪資收入總額之百分之三為限。\n(三)職業上工具支出：購置專供職務上或工作上使用書籍、期刊及工具之支出。但其效能非二年內所能耗竭且支出超過一定金額者，應逐年攤提折舊或攤銷費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n二、依前款規定計算之薪資所得，於依第十五條規定計算稅額及依第十七條規定計算綜合所得淨額時，不適用第十七條第一項第二款第三目之2薪資所得特別扣除之規定。\n三、第一款各目費用之適用範圍、認列方式、應檢具之證明文件、第二目符合規定之機構、第三目一定金額及攤提折舊或攤銷費用方法、年限及其他相關事項之辦法，由財政部定之。\n四、第一款薪資收入包括：薪金、俸給、工資、津貼、歲費、獎金、紅利及各種補助費。但為雇主之目的，執行職務而支領之差旅費、日支費及加班費不超過規定標準者，及依第四條規定免稅之項目，不在此限。\n五、依勞工退休金條例規定自願提繳之退休金或年金保險費，合計在每月工資百分之六範圍內，不計入提繳年度薪資收入課稅；年金保險費部分，不適用第十七條有關保險費扣除之規定。\n六、依公教人員保險法、勞工保險條例、軍人保險條例規定繳付之保險費用，不計入提繳年度薪資收入課稅。\n第四類：利息所得：凡公債、公司債、金融債券、各種短期票券、存款及其他貸出款項利息之所得：\n一、公債包括各級政府發行之債票、庫券、證券及憑券。\n二、有獎儲蓄之中獎獎金，超過儲蓄額部分，視為存款利息所得。\n三、短期票券指期限在一年期以內之國庫券、可轉讓銀行定期存單、公司與公營事業機構發行之本票或匯票及其他經目的事業主管機關核准之短期債務憑證。\n短期票券到期兌償金額超過首次發售價格部分為利息所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：\n一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。\n二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。\n三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。\n五、財產出租，其約定之租金，顯較當地一般租金為低，稽徵機關得參照當地一般租金調整計算租賃收入。\n第六類：自力耕作、漁、牧、林、礦之所得：全年收入減除成本及必要費用後之餘額為所得額。\n第七類：財產交易所得：凡財產及權利因交易而取得之所得：\n一、財產或權利原為出價取得者，以交易時之成交價額，減除原始取得之成本，及因取得、改良及移轉該項資產而支付之一切費用後之餘額為所得額。\n二、財產或權利原為繼承或贈與而取得者，以交易時之成交價額，減除繼承時或受贈與時該項財產或權利之時價及因取得、改良及移轉該項財產或權利而支付之一切費用後之餘額為所得額。\n三、個人購買或取得股份有限公司之記名股票或記名公司債、各級政府發行之債券或銀行經政府核准發行之開發債券，持有滿一年以上者，於出售時，得僅以其交易所得之半數作為當年度所得，其餘半數免稅。\n第八類：競技、競賽及機會中獎之獎金或給與：凡參加各種競技比賽及各種機會中獎之獎金或給與皆屬之：\n一、參加競技、競賽所支付之必要費用，准予減除。\n二、參加機會中獎所支付之成本，准予減除。\n三、政府舉辦之獎券中獎獎金，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第九類：退職所得：凡個人領取之退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金及依勞工退休金條例規定辦理年金保險之保險給付等所得。但個人歷年自薪資收入中自行繳付之儲金或依勞工退休金條例規定提繳之年金保險費，於提繳年度已計入薪資收入課稅部分及其孳息，不在此限：\n一、一次領取者，其所得額之計算方式如下：\n(一)一次領取總額在十五萬元乘以退職服務年資之金額以下者，所得額為零。\n(二)超過十五萬元乘以退職服務年資之金額，未達三十萬元乘以退職服務年資之金額部分，以其半數為所得額。\n(三)超過三十萬元乘以退職服務年資之金額部分，全數為所得額。\n退職服務年資之尾數未滿六個月者，以半年計；滿六個月者，以一年計。\n二、分期領取者，以全年領取總額，減除六十五萬元後之餘額為所得額。\n三、兼領一次退職所得及分期退職所得者，前二款規定可減除之金額，應依其領取一次及分期退職所得之比例分別計算之。\n第十類：其他所得：不屬於上列各類之所得，以其收入額減除成本及必要費用後之餘額為所得額。但告發或檢舉獎金、與證券商或銀行從事結構型商品交易之所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n前項各類所得，如為實物、有價證券或外國貨幣，應以取得時政府規定之價格或認可之兌換率折算之；未經政府規定者，以當地時價計算。\n個人綜合所得總額中，如有自力經營林業之所得、受僱從事遠洋漁業，於每次出海後一次分配之報酬、一次給付之撫卹金或死亡補償，超過第四條第一項第四款規定之部分及因耕地出租人收回耕地，而依平均地權條例第七十七條規定，給予之補償等變動所得，得僅以半數作為當年度所得，其餘半數免稅。\n第一項第九類規定之金額，每遇消費者物價指數較上次調整年度之指數上漲累計達百分之三以上時，按上漲程度調整之。調整金額以千元為單位，未達千元者按百元數四捨五入。其公告方式及所稱消費者物價指數準用第五條第四項之規定。","note":"一、新增第三類薪資所得第六項，依公教人員保險法、勞工保險條例、軍人保險條例規定繳付之保險費用，不計入提繳年度薪資所得課稅。\n二、繳納勞保、軍保、公保、教保之費用原屬於稅捐之一環，本不應該納入所得課稅。\n三、考量年金制度之職業年金、自購年金之費用均有免稅之措施，屬於最基礎之社會年金，更應免納稅捐，方符合比例原則，及增加民眾購買人身保險之意願。"},{"bill":"202110046460000","text":"個人之綜合所得總額，以其全年下列各類所得合併計算之：\n第一類：營利所得：公司股東所獲分配之股利、合作社社員所獲分配之盈餘、其他法人出資者所獲分配之盈餘、合夥組織營利事業之合夥人每年度應分配之盈餘、獨資資本主每年自其獨資經營事業所得之盈餘及個人一時貿易之盈餘皆屬之。\n合夥人應分配之盈餘或獨資資本主經營獨資事業所得之盈餘，應按核定之營利事業所得額計算之。\n第二類：執行業務所得：凡執行業務者之業務或演技收入，減除業務所房租或折舊、業務上使用器材設備之折舊及修理費，或收取代價提供顧客使用之藥品、材料等之成本、業務上雇用人員之薪資、執行業務之旅費及其他直接必要費用後之餘額為所得額。\n執行業務者至少應設置日記帳一種，詳細記載其業務收支項目；業務支出，應取得確實憑證。帳簿及憑證最少應保存五年；帳簿、憑證之設置、取得、保管及其他應遵行事項之辦法，由財政部定之。\n執行業務者為執行業務而使用之房屋及器材、設備之折舊，依固定資產耐用年數表之規定。執行業務費用之列支，準用本法有關營利事業所得稅之規定；其帳簿、憑證之查核、收入與費用之認列及其他應遵行事項之辦法，由財政部定之。\n第三類：薪資所得：凡公、教、軍、警、公私事業職工薪資及提供勞務者之所得：\n一、薪資所得之計算，以在職務上或工作上取得之各種薪資收入，減除第十七條第一項第二款第三目之2薪資所得特別扣除額後之餘額為所得額，餘額為負數者，以零計算。但與提供勞務直接相關且由所得人負擔之下列必要費用合計金額超過該扣除額者，得檢附相關證明文件核實自薪資收入中減除該必要費用，以其餘額為所得額：\n(一)職業專用服裝費：職業所必需穿著之特殊服裝或表演專用服裝，其購置、租用、清潔及維護費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n(二)進修訓練費：參加符合規定之機構開設職務上、工作上或依法令要求所需特定技能或專業知識相關課程之訓練費用。每人全年減除金額以其薪資收入總額之百分之三為限。\n(三)職業上工具支出：購置專供職務上或工作上使用書籍、期刊及工具之支出。但其效能非二年內所能耗竭且支出超過一定金額者，應逐年攤提折舊或攤銷費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n二、依前款規定計算之薪資所得，於依第十五條規定計算稅額及依第十七條規定計算綜合所得淨額時，不適用第十七條第一項第二款第三目之2薪資所得特別扣除之規定。\n三、第一款各目費用之適用範圍、認列方式、應檢具之證明文件、第二目符合規定之機構、第三目一定金額及攤提折舊或攤銷費用方法、年限及其他相關事項之辦法，由財政部定之。\n四、第一款薪資收入包括：薪金、俸給、工資、津貼、歲費、獎金、紅利及各種補助費。但為雇主之目的，執行職務而支領之差旅費、日支費及加班費不超過規定標準者，及依第四條規定免稅之項目，不在此限。\n五、依勞工退休金條例規定自願提繳之退休金或年金保險費，合計在每月工資百分之六範圍內，不計入提繳年度薪資收入課稅；年金保險費部分，不適用第十七條有關保險費扣除之規定。\n六、依公教人員保險法、勞工保險條例、軍人保險條例規定繳付之保險費用，不計入提繳年度薪資收入課稅。\n第四類：利息所得：凡公債、公司債、金融債券、各種短期票券、存款及其他貸出款項利息之所得：\n一、公債包括各級政府發行之債票、庫券、證券及憑券。\n二、有獎儲蓄之中獎獎金，超過儲蓄額部分，視為存款利息所得。\n三、短期票券指期限在一年期以內之國庫券、可轉讓銀行定期存單、公司與公營事業機構發行之本票或匯票及其他經目的事業主管機關核准之短期債務憑證。\n短期票券到期兌償金額超過首次發售價格部分為利息所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：\n一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。\n二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。\n三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。\n五、財產出租，其約定之租金，顯較當地一般租金為低，稽徵機關得參照當地一般租金調整計算租賃收入。\n第六類：自力耕作、漁、牧、林、礦之所得：全年收入減除成本及必要費用後之餘額為所得額。\n第七類：財產交易所得：凡財產及權利因交易而取得之所得：\n一、財產或權利原為出價取得者，以交易時之成交價額，減除原始取得之成本，及因取得、改良及移轉該項資產而支付之一切費用後之餘額為所得額。\n二、財產或權利原為繼承或贈與而取得者，以交易時之成交價額，減除繼承時或受贈與時該項財產或權利之時價及因取得、改良及移轉該項財產或權利而支付之一切費用後之餘額為所得額。\n三、個人購買或取得股份有限公司之記名股票或記名公司債、各級政府發行之債券或銀行經政府核准發行之開發債券，持有滿一年以上者，於出售時，得僅以其交易所得之半數作為當年度所得，其餘半數免稅。\n第八類：競技、競賽及機會中獎之獎金或給與：凡參加各種競技比賽及各種機會中獎之獎金或給與皆屬之：\n一、參加競技、競賽所支付之必要費用，准予減除。\n二、參加機會中獎所支付之成本，准予減除。\n三、政府舉辦之獎券中獎獎金，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第九類：退職所得：凡個人領取之退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金及依勞工退休金條例規定辦理年金保險之保險給付等所得。但個人歷年自薪資收入中自行繳付之儲金或依勞工退休金條例規定提繳之年金保險費，於提繳年度已計入薪資收入課稅部分及其孳息，不在此限：\n一、一次領取者，其所得額之計算方式如下：\n(一)一次領取總額在十五萬元乘以退職服務年資之金額以下者，所得額為零。\n(二)超過十五萬元乘以退職服務年資之金額，未達三十萬元乘以退職服務年資之金額部分，以其半數為所得額。\n(三)超過三十萬元乘以退職服務年資之金額部分，全數為所得額。\n退職服務年資之尾數未滿六個月者，以半年計；滿六個月者，以一年計。\n二、分期領取者，以全年領取總額，減除六十五萬元後之餘額為所得額。\n三、兼領一次退職所得及分期退職所得者，前二款規定可減除之金額，應依其領取一次及分期退職所得之比例分別計算之。\n第十類：其他所得：不屬於上列各類之所得，以其收入額減除成本及必要費用後之餘額為所得額。但告發或檢舉獎金、與證券商或銀行從事結構型商品交易之所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n前項各類所得，如為實物、有價證券或外國貨幣，應以取得時政府規定之價格或認可之兌換率折算之；未經政府規定者，以當地時價計算。\n個人綜合所得總額中，如有自力經營林業之所得、受僱從事遠洋漁業，於每次出海後一次分配之報酬、一次給付之撫卹金或死亡補償，超過第四條第一項第四款規定之部分及因耕地出租人收回耕地，而依平均地權條例第七十七條規定，給予之補償等變動所得，得僅以半數作為當年度所得，其餘半數免稅。\n第一項第九類規定之金額，每遇消費者物價指數較上次調整年度之指數上漲累計達百分之三以上時，按上漲程度調整之。調整金額以千元為單位，未達千元者按百元數四捨五入。其公告方式及所稱消費者物價指數準用第五條第四項之規定。","note":"一、新增第三類薪資所得第六項，依公教人員保險法、勞工保險條例、軍人保險條例規定繳付之保險費用，不計入提繳年度薪資收入課稅。\n二、繳納勞保、軍保、公保、教保之費用原屬於稅捐之一環，本不應該納入所得課稅。\n三、考量年金制度之職業年金、自購年金之費用均有免稅之措施，屬於最基礎之社會年金，更應免納稅捐，方符合比例原則，同時增加民眾購買人身保險之意願。"},{"bill":"202110214070000","text":"個人之綜合所得總額，以其全年下列各類所得合併計算之：\n第一類：營利所得：公司股東所獲分配之股利、合作社社員所獲分配之盈餘、其他法人出資者所獲分配之盈餘、合夥組織營利事業之合夥人每年度應分配之盈餘、獨資資本主每年自其獨資經營事業所得之盈餘及個人一時貿易之盈餘皆屬之。\n合夥人應分配之盈餘或獨資資本主經營獨資事業所得之盈餘，應按核定之營利事業所得額計算之。\n第二類：執行業務所得：凡執行業務者之業務或演技收入，減除業務所房租或折舊、業務上使用器材設備之折舊及修理費，或收取代價提供顧客使用之藥品、材料等之成本、業務上雇用人員之薪資、執行業務之旅費及其他直接必要費用後之餘額為所得額。\n執行業務者至少應設置日記帳一種，詳細記載其業務收支項目；業務支出，應取得確實憑證。帳簿及憑證最少應保存五年；帳簿、憑證之設置、取得、保管及其他應遵行事項之辦法，由財政部定之。\n執行業務者為執行業務而使用之房屋及器材、設備之折舊，依固定資產耐用年數表之規定。執行業務費用之列支，準用本法有關營利事業所得稅之規定；其帳簿、憑證之查核、收入與費用之認列及其他應遵行事項之辦法，由財政部定之。\n第三類：薪資所得：凡公、教、軍、警、公私事業職工薪資及提供勞務者之所得：\n一、薪資所得之計算，以在職務上或工作上取得之各種薪資收入，減除第十七條第一項第二款第三目之2薪資所得特別扣除額後之餘額為所得額，餘額為負數者，以零計算。但與提供勞務直接相關且由所得人負擔之下列必要費用合計金額超過該扣除額者，得檢附相關證明文件核實自薪資收入中減除該必要費用，以其餘額為所得額：\n(一)職業專用服裝費：職業所必需穿著之特殊服裝或表演專用服裝，其購置、租用、清潔及維護費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n(二)進修訓練費：參加符合規定之機構開設職務上、工作上或依法令要求所需特定技能或專業知識相關課程之訓練費用。每人全年減除金額以其薪資收入總額之百分之三為限。\n(三)職業上工具支出：購置專供職務上或工作上使用書籍、期刊及工具之支出。但其效能非二年內所能耗竭且支出超過一定金額者，應逐年攤提折舊或攤銷費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n二、依前款規定計算之薪資所得，於依第十五條規定計算稅額及依第十七條規定計算綜合所得淨額時，不適用第十七條第一項第二款第三目之2薪資所得特別扣除之規定。\n三、第一款各目費用之適用範圍、認列方式、應檢具之證明文件、第二目符合規定之機構、第三目一定金額及攤提折舊或攤銷費用方法、年限及其他相關事項之辦法，由財政部定之。\n四、第一款薪資收入包括：薪金、俸給、工資、津貼、歲費、獎金、紅利及各種補助費。但為雇主之目的，執行職務而支領之差旅費、日支費及加班費不超過規定標準者，及依第四條規定免稅之項目，不在此限。\n五、依勞工退休金條例規定自願提繳之退休金或年金保險費，合計在每月工資百分之六範圍內，不計入提繳年度薪資收入課稅；年金保險費部分，不適用第十七條有關保險費扣除之規定。\n六、依公教人員保險法、勞工保險條例、軍人保險條例規定繳付之保險費用，不計入提繳年度薪資收入課稅。\n第四類：利息所得：凡公債、公司債、金融債券、各種短期票券、存款及其他貸出款項利息之所得：\n一、公債包括各級政府發行之債票、庫券、證券及憑券。\n二、有獎儲蓄之中獎獎金，超過儲蓄額部分，視為存款利息所得。\n三、短期票券指期限在一年期以內之國庫券、可轉讓銀行定期存單、公司與公營事業機構發行之本票或匯票及其他經目的事業主管機關核准之短期債務憑證。\n短期票券到期兌償金額超過首次發售價格部分為利息所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：\n一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。\n二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。\n三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。\n五、財產出租，其約定之租金，顯較當地一般租金為低，稽徵機關得參照當地一般租金調整計算租賃收入。\n第六類：自力耕作、漁、牧、林、礦之所得：全年收入減除成本及必要費用後之餘額為所得額。\n第七類：財產交易所得：凡財產及權利因交易而取得之所得：\n一、財產或權利原為出價取得者，以交易時之成交價額，減除原始取得之成本，及因取得、改良及移轉該項資產而支付之一切費用後之餘額為所得額。\n二、財產或權利原為繼承或贈與而取得者，以交易時之成交價額，減除繼承時或受贈與時該項財產或權利之時價及因取得、改良及移轉該項財產或權利而支付之一切費用後之餘額為所得額。\n三、個人購買或取得股份有限公司之記名股票或記名公司債、各級政府發行之債券或銀行經政府核准發行之開發債券，持有滿一年以上者，於出售時，得僅以其交易所得之半數作為當年度所得，其餘半數免稅。\n第八類：競技、競賽及機會中獎之獎金或給與：凡參加各種競技比賽及各種機會中獎之獎金或給與皆屬之：\n一、參加競技、競賽所支付之必要費用，准予減除。\n二、參加機會中獎所支付之成本，准予減除。\n三、政府舉辦之獎券中獎獎金，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第九類：退職所得：凡個人領取之退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金及依勞工退休金條例規定辦理年金保險之保險給付等所得。但個人歷年自薪資收入中自行繳付之儲金或依勞工退休金條例規定提繳之年金保險費，於提繳年度已計入薪資收入課稅部分及其孳息，不在此限：\n一、一次領取者，其所得額之計算方式如下：\n(一)一次領取總額在十五萬元乘以退職服務年資之金額以下者，所得額為零。\n(二)超過十五萬元乘以退職服務年資之金額，未達三十萬元乘以退職服務年資之金額部分，以其半數為所得額。\n(三)超過三十萬元乘以退職服務年資之金額部分，全數為所得額。\n退職服務年資之尾數未滿六個月者，以半年計；滿六個月者，以一年計。\n二、分期領取者，以全年領取總額，減除六十五萬元後之餘額為所得額。\n三、兼領一次退職所得及分期退職所得者，前二款規定可減除之金額，應依其領取一次及分期退職所得之比例分別計算之。\n第十類：其他所得：不屬於上列各類之所得，以其收入額減除成本及必要費用後之餘額為所得額。但告發或檢舉獎金、與證券商或銀行從事結構型商品交易之所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n前項各類所得，如為實物、有價證券或外國貨幣，應以取得時政府規定之價格或認可之兌換率折算之；未經政府規定者，以當地時價計算。\n個人綜合所得總額中，如有自力經營林業之所得、受僱從事遠洋漁業，於每次出海後一次分配之報酬、一次給付之撫卹金或死亡補償，超過第四條第一項第四款規定之部分及因耕地出租人收回耕地，而依平均地權條例第七十七條規定，給予之補償等變動所得，得僅以半數作為當年度所得，其餘半數免稅。\n第一項第九類規定之金額，每遇消費者物價指數較上次調整年度之指數上漲累計達百分之三以上時，按上漲程度調整之。調整金額以千元為單位，未達千元者按百元數四捨五入。其公告方式及所稱消費者物價指數準用第五條第四項之規定。","note":"一、依據司法院大法官釋字第七四五號解釋理由書，本於量能課稅原則，所得課稅應以收入減除成本及必要費用後的客觀淨值，而非所得毛額，作為稅基。此項要求，於各類所得之計算均應有其適用。復依司法院大法官釋字第八一一號解釋意旨，我國係區分不同職域依序開辦不同社會保險制度，各職域社會保險依身分職業強制納保。\n二、是以，公、教、軍、警、公私事業職工，依公教人員保險法、勞工保險條例、軍人保險條例規定，強制納保而應繳付之保險費用，因為薪資所得者之成本費用，本諸納稅者權利保護法第七條第一項、第二項及前開司法院大法官解釋所揭量能課稅原則，自應於薪資所得中減除，爰增訂第一項第三類第六款，明定依公教人員保險法、勞工保險條例、軍人保險條例規定繳付之保險費用，不計入提繳年度薪資收入課稅。"}],"changed":false,"final":"個人之綜合所得總額，以其全年下列各類所得合併計算之：\n第一類：營利所得：公司股東所獲分配之股利、合作社社員所獲分配之盈餘、其他法人出資者所獲分配之盈餘、合夥組織營利事業之合夥人每年度應分配之盈餘、獨資資本主每年自其獨資經營事業所得之盈餘及個人一時貿易之盈餘皆屬之。\n合夥人應分配之盈餘或獨資資本主經營獨資事業所得之盈餘，應按核定之營利事業所得額計算之。\n第二類：執行業務所得：凡執行業務者之業務或演技收入，減除業務所房租或折舊、業務上使用器材設備之折舊及修理費，或收取代價提供顧客使用之藥品、材料等之成本、業務上雇用人員之薪資、執行業務之旅費及其他直接必要費用後之餘額為所得額。\n執行業務者至少應設置日記帳一種，詳細記載其業務收支項目；業務支出，應取得確實憑證。帳簿及憑證最少應保存五年；帳簿、憑證之設置、取得、保管及其他應遵行事項之辦法，由財政部定之。\n執行業務者為執行業務而使用之房屋及器材、設備之折舊，依固定資產耐用年數表之規定。執行業務費用之列支，準用本法有關營利事業所得稅之規定；其帳簿、憑證之查核、收入與費用之認列及其他應遵行事項之辦法，由財政部定之。\n第三類：薪資所得：凡公、教、軍、警、公私事業職工薪資及提供勞務者之所得：\n一、薪資所得之計算，以在職務上或工作上取得之各種薪資收入，減除第十七條第一項第二款第三目之2薪資所得特別扣除額後之餘額為所得額，餘額為負數者，以零計算。但與提供勞務直接相關且由所得人負擔之下列必要費用合計金額超過該扣除額者，得檢附相關證明文件核實自薪資收入中減除該必要費用，以其餘額為所得額：\n(一)職業專用服裝費：職業所必需穿著之特殊服裝或表演專用服裝，其購置、租用、清潔及維護費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n(二)進修訓練費：參加符合規定之機構開設職務上、工作上或依法令要求所需特定技能或專業知識相關課程之訓練費用。每人全年減除金額以其薪資收入總額之百分之三為限。\n(三)職業上工具支出：購置專供職務上或工作上使用書籍、期刊及工具之支出。但其效能非二年內所能耗竭且支出超過一定金額者，應逐年攤提折舊或攤銷費用。每人全年減除金額以其從事該職業薪資收入總額之百分之三為限。\n二、依前款規定計算之薪資所得，於依第十五條規定計算稅額及依第十七條規定計算綜合所得淨額時，不適用第十七條第一項第二款第三目之2薪資所得特別扣除之規定。\n三、第一款各目費用之適用範圍、認列方式、應檢具之證明文件、第二目符合規定之機構、第三目一定金額及攤提折舊或攤銷費用方法、年限及其他相關事項之辦法，由財政部定之。\n四、第一款薪資收入包括：薪金、俸給、工資、津貼、歲費、獎金、紅利及各種補助費。但為雇主之目的，執行職務而支領之差旅費、日支費及加班費不超過規定標準者，及依第四條規定免稅之項目，不在此限。\n五、依勞工退休金條例規定自願提繳之退休金或年金保險費，合計在每月工資百分之六範圍內，不計入提繳年度薪資收入課稅；年金保險費部分，不適用第十七條有關保險費扣除之規定。\n第四類：利息所得：凡公債、公司債、金融債券、各種短期票券、存款及其他貸出款項利息之所得：\n一、公債包括各級政府發行之債票、庫券、證券及憑券。\n二、有獎儲蓄之中獎獎金，超過儲蓄額部分，視為存款利息所得。\n三、短期票券指期限在一年期以內之國庫券、可轉讓銀行定期存單、公司與公營事業機構發行之本票或匯票及其他經目的事業主管機關核准之短期債務憑證。\n短期票券到期兌償金額超過首次發售價格部分為利息所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第五類：租賃所得及權利金所得：凡以財產出租之租金所得，財產出典典價經運用之所得或專利權、商標權、著作權、秘密方法及各種特許權利，供他人使用而取得之權利金所得：\n一、財產租賃所得及權利金所得之計算，以全年租賃收入或權利金收入，減除必要損耗及費用後之餘額為所得額。\n二、設定定期之永佃權及地上權取得之各種所得，視為租賃所得。\n三、財產出租，收有押金或任何款項類似押金者，或以財產出典而取得典價者，均應就各該款項按當地銀行業通行之一年期存款利率，計算租賃收入。\n四、將財產借與他人使用，除經查明確係無償且非供營業或執行業務者使用外，應參照當地一般租金情況，計算租賃收入，繳納所得稅。\n五、財產出租，其約定之租金，顯較當地一般租金為低，稽徵機關得參照當地一般租金調整計算租賃收入。\n第六類：自力耕作、漁、牧、林、礦之所得：全年收入減除成本及必要費用後之餘額為所得額。\n第七類：財產交易所得：凡財產及權利因交易而取得之所得：\n一、財產或權利原為出價取得者，以交易時之成交價額，減除原始取得之成本，及因取得、改良及移轉該項資產而支付之一切費用後之餘額為所得額。\n二、財產或權利原為繼承或贈與而取得者，以交易時之成交價額，減除繼承時或受贈與時該項財產或權利之時價及因取得、改良及移轉該項財產或權利而支付之一切費用後之餘額為所得額。\n三、個人購買或取得股份有限公司之記名股票或記名公司債、各級政府發行之債券或銀行經政府核准發行之開發債券，持有滿一年以上者，於出售時，得僅以其交易所得之半數作為當年度所得，其餘半數免稅。\n第八類：競技、競賽及機會中獎之獎金或給與：凡參加各種競技比賽及各種機會中獎之獎金或給與皆屬之：\n一、參加競技、競賽所支付之必要費用，准予減除。\n二、參加機會中獎所支付之成本，准予減除。\n三、政府舉辦之獎券中獎獎金，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n第九類：退職所得：凡個人領取之退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金及依勞工退休金條例規定辦理年金保險之保險給付等所得。但個人歷年自薪資收入中自行繳付之儲金或依勞工退休金條例規定提繳之年金保險費，於提繳年度已計入薪資收入課稅部分及其孳息，不在此限：\n一、一次領取者，其所得額之計算方式如下：\n(一)一次領取總額在十五萬元乘以退職服務年資之金額以下者，所得額為零。\n(二)超過十五萬元乘以退職服務年資之金額，未達三十萬元乘以退職服務年資之金額部分，以其半數為所得額。\n(三)超過三十萬元乘以退職服務年資之金額部分，全數為所得額。\n退職服務年資之尾數未滿六個月者，以半年計；滿六個月者，以一年計。\n二、分期領取者，以全年領取總額，減除六十五萬元後之餘額為所得額。\n三、兼領一次退職所得及分期退職所得者，前二款規定可減除之金額，應依其領取一次及分期退職所得之比例分別計算之。\n第十類：其他所得：不屬於上列各類之所得，以其收入額減除成本及必要費用後之餘額為所得額。但告發或檢舉獎金、與證券商或銀行從事結構型商品交易之所得，除依第八十八條規定扣繳稅款外，不併計綜合所得總額。\n前項各類所得，如為實物、有價證券或外國貨幣，應以取得時政府規定之價格或認可之兌換率折算之；未經政府規定者，以當地時價計算。\n個人綜合所得總額中，如有自力經營林業之所得、受僱從事遠洋漁業，於每次出海後一次分配之報酬、一次給付之撫卹金或死亡補償，超過第四條第一項第四款規定之部分及因耕地出租人收回耕地，而依平均地權條例第七十七條規定，給予之補償等變動所得，得僅以半數作為當年度所得，其餘半數免稅。\n第一項第九類規定之金額，每遇消費者物價指數較上次調整年度之指數上漲累計達百分之三以上時，按上漲程度調整之。調整金額以千元為單位，未達千元者按百元數四捨五入。其公告方式及所稱消費者物價指數準用第五條第四項之規定。","finalWhy":null,"review":{"note":"保留，送院會處理","text":""}},{"no":"第十七條","current":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","versions":[{"bill":"202110034220000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險及國民年金保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n 益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百零八年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十二萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"修正列舉扣除額─保險費之相關規定，配合第十四條修訂，刪除勞工保險及軍、公、教保險之保險費列舉扣除額。"},{"bill":"202110069300000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險費，每人每年扣除數額以不超過二萬四千元為限。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百零八年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十二萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n9.保險費特別扣除：納稅義務人、配偶或受扶養直系親屬之全民健康保險、勞工保險、國民年金保險及軍、公、教保險之保險費。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、社會保險為國家尊重憲法基本國策推動社會安全之重要工作，對於保障國民健康及老年經濟生活具有相當重要性，其特色為強制納保，負有繳費義務，與一般商業保險性質有相當不同。\n二、依世界銀行提出之多層次老年經濟保障模式，第一層年金「強制性社會保險制度」，是傳統公共年金制度，強調社會連帶責任及風險分擔，具世代互助精神。另第二層為「強制性職業退休金制度」，第三層為「自願性商業保險」。\n三、依現行制度，第三層人身保險可列舉扣除，而第二層之勞退、軍公教退撫均已陸續不列入所得，反而第一層之強制性社會保險保費僅能列舉扣除，顯有輕重失衡之虞。\n四、考量近年我國稅制改革著重於減少貧富差距、減輕薪資階層民眾負擔，若相關強制性社會保險保險費改列為特別扣除，符合政府稅改方向，亦符合社會公平正義之期待。\n五、另根據財政部之試算，若將全民健康保險、國民年金保險及軍、公、教、勞工保險之保費改列為特別扣除額時，其對稅收影響約為157億元，約占112年綜合所得稅收入7,551億元之2%，應為可承受範圍。\n六、承上所述，爰將第一項第二款第二目之2保險費之全民健康保險、勞工保險、國民年金保險及軍、公、教保險之保險費改列於第一項第二款第三目之下增列9保險費特別扣除額。"},{"bill":"202110072570000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百零八年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十二萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n9.健康檢查特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬之健康檢查費用，付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫事機構者，每人每年扣除額以九千元為限。但有下列情形之一者，不得扣除：\n(1)受有保險給付或政府補助。\n(2)經財政部認定得申報扣除醫藥及生育費。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除、之8房屋租金支出特別扣除及之9檢康檢查特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、增訂對於個人綜合所得總額認定之減免特別扣除額，自當前八大類特別扣除額當中，新增「健康檢查特別扣除額」。\n二、本草案乃規範，如檢康檢查費用未受保險給付或政府補助，並未經財政部認定得申報扣除醫藥及生育費。則納稅義務人、配偶或受扶養親屬之健康檢查費用，付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫事機構者，享每人每年扣除額以九千元為限。"},{"bill":"202110076960000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百零八年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十二萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n9.健康檢查特別扣除額：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬之健康檢查費用，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限，每人每年扣除額以二萬元為限。但有下列情形之一者，不得扣除：\n(1)受有保險給付或政府輔助。\n(2)經財政部認定得申報扣除醫藥及生育費。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除、之8房屋租金支出特別扣除及之9健康檢查特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、於第一項第二款第三目增訂「健康檢查特別扣除額」，並明定受有保險給付或政府補助，或者經財政部認定得申報扣除醫藥及生育費者，不得再行扣除，避免費用重複扣除，違反租稅公平。\n二、為避免稅基過度流失，以及追求社會實質公平正義，爰修正第三項規定，使健康檢查費用扣除亦有相關排富條款之適用。"},{"bill":"202110098640000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十五年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十八萬元，第二名及以上子女每人每年扣除二十五萬五千元。\n7.長期照顧特別扣除：自中華民國一百零八年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十二萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"為減輕民眾育兒負擔、鼓勵生育，爰修正第一項第二款第三目之6「幼兒學前特別扣除」之扣除額規定，自中華民國一百十五年一月一日起，第一名子女每年扣除除金額自十五萬元提高至十七萬元，第二名及以上子女每人每年扣除金額自二十二萬五千元提高至二十五萬五千元。"},{"bill":"202110172280000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.青少年及幼兒特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百零八年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十二萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"將幼兒學前特別扣除改為青少年及幼兒特別扣除額。受惠人數從80萬人可提升至340萬人。"},{"bill":"202110174090000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十五年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除二十萬元，嗣後每增加一名子女，每人每年扣除額均增加五萬元。\n7.長期照顧特別扣除：自中華民國一百零八年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十二萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"為鼓勵生育並減輕育有幼兒之家戶經濟負擔，爰修正第一項第二款第三目之6調整幼兒學前特別扣除額之計算方式。現行規定僅區分第一名與第二名以上子女，未能充分反映隨子女人數增加而倍增之育兒支出。爰修正為：自中華民國一百十五年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除二十萬元，嗣後每增加一名子女，每人每年扣除額均增加五萬元。"},{"bill":"202110177510000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.青少年及幼兒特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除二十四萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、修正條文第一項第二款第三目之七，為減輕長期照顧身心失能者之家庭經濟負擔，並因應高齡化社會需求，將長期照顧特別扣除額由現行每人每年十二萬元調高至二十四萬元。\n二、修正條文第一項第二款第三目之六，將現行「幼兒學前特別扣除」修正為「青少年及幼兒特別扣除」，適用對象由六歲以下擴大至十八歲以下子女，第一名及第二名以上子女之扣除金額維持不變，減輕家長育兒負擔、鼓勵生育；並定明自民國一百十五年一月一日起施行。"},{"bill":"202110185400000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.青少年及幼兒特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十五年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除二十四萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、修正條文第一項第二款第三目之六，將現行「幼兒學前特別扣除」修正為「青少年及幼兒特別扣除」，適用對象由六歲以下擴大至十八歲以下子女，減輕家長育兒負擔、鼓勵生育；並定明自民國一百十五年一月一日起施行。受惠人數從八十萬人可提升至三百四十萬人。\n二、修正條文第一項第二款第三目之七，為減輕長期照顧身心失能者之家庭經濟負擔，並因應高齡化社會需求，將長期照顧特別扣除額由現行每人每年十八萬元調高至二十四萬元。"},{"bill":"202110189170000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.青少年及幼兒特別扣除：自中華民國一百十六年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"為實際反映家庭整體育兒成本結構，加強對青少年及幼兒之扶育支持，將幼兒學前特別扣除改為青少年及幼兒特別扣除額，亦更能彰顯國家扶育青少年及幼兒之政策決心，同時有效減輕家庭年度稅負，提升整體育兒支持力度。"},{"bill":"202110194750000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十五年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十八萬元，第二名及以上子女每人每年扣除二十五萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、少子化問題已成為國家永續發展的核心挑戰，當國人因經濟壓力而遲疑是否生育，政府是否有具體的支持措施將影響現狀改變。\n二、因此若透過提高幼兒學前特別扣除額，可降低育兒家庭稅負，以雙薪家庭而言，托育費、奶粉、醫療與教育支出等皆為長期且固定之開銷，若針對稅負有更明顯的減免效果，將有效增加家庭可支配所得，也可降低年輕世代對生育的經濟焦慮。\n三、面對人口結構快速老化，需要的是長期、穩定且制度化的育兒支持，透過調整幼兒學前特別扣除額減輕家庭經濟負擔，對當前所面臨的少子化問題有所影響，與政府其他現金補助、托育量能等政策搭配，將可有效減緩。"},{"bill":"202110201450000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n9.健康檢查特別扣除：自中華民國一百十六年一月一日起，納稅義務人、配偶或受扶養親屬之健康檢查費用，付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者，每人每年扣除額以一萬元為限。但有下列情形之一者，不得扣除：\n(1)受有保險給付或政府補助。\n(2)經財政部認定得申報扣除醫藥及生育費。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、近年國人十大死因統計，除事故傷害及蓄意自我傷害，其餘八項為癌症、心臟疾病、肺炎、腦血管疾病、糖尿病、高血壓性疾病、慢性下呼吸道疾病、腎炎、腎病症候群及腎病變，其中，此八大疾病每年死亡人數逾十三萬，顯見癌症及慢性病對於國人健康之嚴峻威脅。爰此，政府多年來持續推動慢性病及癌症防治對策，透過代謝症候群防治計畫、大家醫計畫、癌症篩檢等多項政策之執行，在完善之醫療照護及公衛防治體系下，輔以健保制度支持，逐步強化癌症及慢性病之防治。\n二、為接軌世界衛生組織之永續發展目標及國際標準，在健康台灣之願景下，我國政府亦針對癌症及慢性病之標準化死亡率，訂定於2030年前降低三分之一之目標。在過去多項防治政策之基礎下，近年政府接續強化癌症及慢性病防治對策；癌症方面，持續擴大公費癌症篩檢之對象並新增癌別，發現癌前病變或罹癌個案數均較過去同期增長，以期落實早篩早治之目標。慢性病方面，政府推動三高防治888計畫，目標將八成之三高個案納入照護網、其中八成個案獲得生活習慣諮詢、並確保其中八成個案獲得改善及穩定控制。\n三、政府雖已擴大公費癌症篩檢服務，惟針對尚未納入公費癌症篩檢之癌別，年齡或家族史等條件不符公費篩檢資格者，在政府資源配置之權衡下，恐未能完整覆蓋。慢性病防治方面，將八成三高個案納入照護網，亦仰賴國人透過健康檢查等模式即時發現相關病症。\n四、有鑑於此，顯見在政府癌症及慢性病之防治政策下，提供具體誘因提升國人定期健康檢查之意願，落實健康促進及預防醫學，至關重要。\n五、依民國90年6月20日台財稅字第0900452964號函釋，納稅義務人所支付之健康檢查費用，僅在與後續治療具因果關係之前提下，始得依本法第十七條規定申報醫藥費列舉扣除；倘健康檢查結果顯示健康無虞者，對其健康檢查費用並未訂有特別扣除之規定，恐降低民眾實施健康檢查之意願。\n六、為提升國人定期實施健康檢查意願、促進國人落實預防保健、縮短不健康餘命，以減低後續國家整體醫療、健保及長照之負擔，爰於第一項第二款第三目增訂「健康檢查特別扣除額」，並明定健康檢查費用受有保險給付或政府補助，或經財政部認定得申報扣除醫藥及生育費者，不得再行扣除，以遵循租稅公平性。"},{"bill":"202110201630000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：自中華民國○年○月○日起，納稅義務人就讀國民教育學校、大專以上院校之受扶養親屬之教育學費每人每年之扣除數額以五萬元為限。但空中大學不得扣除。\n6.幼兒學前特別扣除：自中華民國○年○月○日起，納稅義務人六歲以下之受扶養親屬，第一名受扶養親屬每年扣除十五萬元，第二名及以上受扶養親屬每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、現行有關養兒育女之特別扣除額適用對象，僅包含扶養就讀大專院校，及幼兒學前教育之子女的親屬，獨漏扶養就讀「國民教育」學校的親屬，爰提案修法。雖然我國實施公立國中小及公私立高中職免學費，但學童教育選擇多元化，按教育部一一三學年最新統計，全國每七人就有一人選讀私立國中，私立國小學生數，也在過去十年間增加超過三成。\n二、我國家庭型態漸趨多元化，教育學費及幼兒學前特別扣除額的適用對象，不應僅限於子女的親屬，也應納入其他實際扶養者，爰提案修法。\n三、教育學費扣除額三十年未調整，期間物價、學費都已飛升，爰建議參考日本、南韓等鄰國現行規範，修法調整教育學費扣除額上限，由現行二萬五千元調整為五萬元。\n四、接受政府教育補助的學生及家庭，更可能有經濟上的需求，爰提案刪除教育學費特別扣除額中「專校、五專前三年及已接受政府補助者」的排除條款。\n五、上述提案修正條文，自中華民國○年○月○日起生效。"},{"bill":"202110203000000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。十五歲以下受納稅義務人扶養者，免稅額增加百分之五十。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、我國自2016年起生育率跟出生率均破紀錄下降，平均每年減少1萬名新生兒。2020年起進入人口負增長，美國中情局預測，臺灣是世界上人口出生率最低的國家之一，至今僅有0.87人，相較之下日本都還有1.26人。2019年我國仍有2,360萬人口，但到2040年人口減少160萬，只剩下2,200萬人，人口結構將嚴重失衡，青中壯年負擔將持續增加。\n二、少子化的關鍵在於不婚不生，而不婚不生和近年我國房價、物價飛漲有很大關聯。通膨增幅快，房價自2016年以來全國增幅近三成，臺南市更超過四成，中青壯年夫妻若要生兒育女、買房成家，成本快速上升，薪水永遠追不上。如何讓青中壯年能安心成家生養，成為重要課題。\n三、綜上所述，政府應該從根本減輕育兒負擔，鼓勵夫妻願意生養。爰擬具「所得稅法第十七條條文修正草案」，第一項第一款第二目：就納稅義務人扶養15歲以下子女，免稅額提高50%，讓國人生的起，養得起。"},{"bill":"202110204130000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.兒童及少年特別扣除：自中華民國一百十六年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十七萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、修正條文第一項第二款第三目之6，將現行「幼兒學前特別扣除」修正為「兒童及少年特別扣除」，適用對象延伸至十八歲以下子女，並將第一名子女每年扣除額提高至十七萬元；第二名及以上子女每人每年扣除額則維持二十二萬五千元。\n二、我國少子女化趨勢持續加劇，面對育兒成本不斷上升與經濟壓力增加，已影響年輕世代生育意願。子女在成長過程中的教育、托育及生活支出具有長期性與累積性，然現行「幼兒學前特別扣除」僅限六歲以下適用，制度設計偏重短期，且在物價連年上漲情況下，實質減輕負擔效果有限，難以反映家庭實質育兒需求。\n三、為使租稅措施更符合實際情況，本次修正擴大適用年齡至十八歲，並提高扣除額度。藉由減輕家庭稅負、提升經濟彈性，實質增加育兒家庭可支配所得，並與既有政策形成整合效果，以期減低通膨衝擊，厚植國家未來人力資本，並有效提升國人生育意願。"},{"bill":"202110206730000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、子女之養育與教育，攸關家庭健全發展、人口結構平衡及國家長期競爭力。惟我國少子女化情勢持續嚴峻，現行人口統計及人口推估資料均顯示，出生人數及總生育率仍處低檔，人口結構失衡問題未見根本改善。於此情形下，如何減輕家庭養育子女負擔，營造較友善之育兒環境，已屬國家人口及社會政策之重要課題。\n二、現行所得稅法第十七條已設幼兒學前特別扣除額，自一百十三年一月一日起，扶養六歲以下子女者，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元，並已取消排富限制。惟子女教養支出並不因年滿六歲即大幅減少，反而隨其成長，持續發生教育、餐食、課後照顧、才藝學習、交通接送及生活照料等費用，家庭實際負擔並未因子女進入學齡階段而顯著減輕。現行制度僅以六歲以下為適用對象，對育有學齡子女之家庭支持仍有不足。\n三、另查托育及照顧支出仍為多數家庭之沉重負擔。衛生福利部資料顯示，準公共化托育制度下，一般家庭每月仍須自付一定金額；部分托嬰中心公開收費資訊亦顯示，平均每月托育費用常達二萬餘元。足見即使已有部分補助措施，家庭在子女未成年期間所承擔之照顧及養育成本，仍屬可觀。是以，透過所得稅扣除制度，給予育有未成年子女家庭更合理之稅負減輕，具有其政策正當性與實際必要性。\n四、為減輕家庭於子女未成年期間之教養負擔，並彰顯國家與家庭共同承擔養育責任之政策方向，爰修正所得稅法第十七條，將現行幼兒學前特別扣除額修正為未成年特別扣除額，適用對象由六歲以下子女擴大為十八歲以下子女，並維持第一名子女每年扣除十五萬元、第二名及以上子女每人每年扣除二十二萬五千元，以更符合家庭實際養育負擔，並作為支持生養家庭之具體措施。"},{"bill":"202110206760000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女或受扶養親屬，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、國人生育率逐年降低，民國40年平均每育齡婦女總生育人數達7.04人之歷史高峰後逐年下降，民國73年降為2.06人，民國99年更為0.9人，降至1人以下，民國109年為0.99人。當一個國家總生育率低於2.1人之人口替換水準時，長期而言，人口成長將呈遞減，最後導致人口負成長，在大部分已開發國家，少子女化已成為共同的潛在危機。另外，行政院主計總處指出，我國人口於民國109年1月升至2,360.4萬人高峰後開始下滑，民國110年4月已降至2,321.5萬人，僅一年多減少近40萬人。總人口減少，勞動力同期間也由1,196萬人降至1,187.5萬人，與民國110年同期相較，民國111年第1季呈現負成長0.59%。民國99年我國勞動力年齡集中在25至34歲，民國109年提升至35至44歲，預估民國119年將延至45至54歲。國家發展委員會亦推估，我國老年人口於民國118年將達幼年人口之2倍，少子化及高齡化。\n二、有鑑於我國近年少子化問題嚴重，且養育子女過程中的支出花費甚鉅，惟現行租稅優惠尚不足以支撐子女撫養之家庭所需，致影響國人生育意願。為鼓勵國人生育並給予子女家庭支持，爰修正本法第十七條第一項第二款第三目之六，將幼兒學前特別扣除額修正為未成年特別扣除額，並擴大扣除對象至被扶養親屬，且將適用年齡提高至十八歲。"},{"bill":"202110206920000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女之教育學費每人每年之扣除數額以二萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.未成年特別扣除：自中華民國一百十五年一月一日起，納稅義務人十八歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十五年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除二十四萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、修正第一項第二款第三目之六、第一項第二款第三目之七。\n二、將現行「幼兒學前特別扣除」調整為「未成年特別扣除」，適用對象由原限六歲以下子女擴大至十八歲以下未成年子女；第一名及第二名以上子女之扣除金額均維持現行標準，以減輕家庭育兒負擔並提升生育誘因，並明定自民國115年1月1日起施行。\n三、為減輕家庭照顧身心失能者之經濟負擔，並回應高齡化社會之照護需求，爰將長期照顧特別扣除由現行每人每年十八萬元調整為二十四萬元。"},{"bill":"202110206860000","text":"按第十四條及前二條規定計得之個人綜合所得總額，減除下列免稅額及扣除額後之餘額，為個人之綜合所得淨額：\n一、免稅額：納稅義務人按規定減除其本人、配偶及合於下列規定扶養親屬之免稅額；納稅義務人及其配偶年滿七十歲者，免稅額增加百分之五十：\n(一)納稅義務人及其配偶之直系尊親屬，年滿六十歲，或無謀生能力，受納稅義務人扶養者。其年滿七十歲受納稅義務人扶養者，免稅額增加百分之五十。\n(二)納稅義務人之子女未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(三)納稅義務人及其配偶之同胞兄弟、姊妹未成年，或已成年而因在校就學、身心障礙或無謀生能力受納稅義務人扶養者。\n(四)納稅義務人其他親屬或家屬，合於民法第一千一百十四條第四款及第一千一百二十三條第三項之規定，未成年，或已成年而因在校就學、身心障礙或無謀生能力，確係受納稅義務人扶養者。\n二、扣除額：納稅義務人就下列標準扣除額或列舉扣除額擇一減除外，並減除特別扣除額：\n(一)標準扣除額：納稅義務人個人扣除十二萬元；有配偶者加倍扣除之。\n(二)列舉扣除額：\n1.捐贈：納稅義務人、配偶及受扶養親屬對於教育、文化、公益、慈善機構或團體之捐贈總額最高不超過綜合所得總額百分之二十為限。但有關國防、勞軍之捐贈及對政府之捐獻，不受金額之限制。\n2.保險費：納稅義務人、配偶或受扶養直系親屬之人身保險、勞工保險、國民年金保險及軍、公、教保險之保險費，每人每年扣除數額以不超過二萬四千元為限。但全民健康保險之保險費不受金額限制。\n3.醫藥及生育費：納稅義務人、配偶或受扶養親屬之醫藥費及生育費，以付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者為限。但受有保險給付部分，不得扣除。\n4.災害損失：納稅義務人、配偶或受扶養親屬遭受不可抗力之災害損失。但受有保險賠償或救濟金部分，不得扣除。\n5.購屋借款利息：納稅義務人、配偶及受扶養親屬購買自用住宅，向金融機構借款所支付之利息，其每一申報戶每年扣除數額以三十萬元為限。但申報有儲蓄投資特別扣除額者，其申報之儲蓄投資特別扣除金額，應在上項購屋借款利息中減除；納稅義務人依上述規定扣除購屋借款利息者，以一屋為限。\n(三)特別扣除額：\n1.財產交易損失：納稅義務人、配偶及受扶養親屬財產交易損失，其每年度扣除額，以不超過當年度申報之財產交易之所得為限；當年度無財產交易所得可資扣除，或扣除不足者，得以以後三年度之財產交易所得扣除之。財產交易損失之計算，準用第十四條第一項第七類關於計算財產交易增益之規定。\n2.薪資所得特別扣除：納稅義務人、配偶或受扶養親屬之薪資所得，每人每年扣除數額以二十萬元為限。\n3.儲蓄投資特別扣除：納稅義務人、配偶及受扶養親屬於金融機構之存款利息、儲蓄性質信託資金之收益及公司公開發行並上市之記名股票之股利，合計全年扣除數額以二十七萬元為限。但依郵政儲金匯兌法規定免稅之存簿儲金利息及本法規定分離課稅之利息，不包括在內。\n4.身心障礙特別扣除：納稅義務人、配偶或受扶養親屬如為領有身心障礙手冊或身心障礙證明者，及精神衛生法第三條第四款規定之病人，每人每年扣除二十萬元。\n5.教育學費特別扣除：納稅義務人就讀大專以上院校之子女、孫子女及受扶養親屬之教育學費每人每年之扣除數額以三萬五千元為限。但空中大學、專校及五專前三年及已接受政府補助者，不得扣除。\n6.幼兒學前特別扣除：自中華民國一百十三年一月一日起，納稅義務人六歲以下之子女，第一名子女每年扣除十五萬元，第二名及以上子女每人每年扣除二十二萬五千元。\n7.長期照顧特別扣除：自中華民國一百十四年一月一日起，納稅義務人、配偶或受扶養親屬為符合中央衛生福利主管機關公告須長期照顧之身心失能者，每人每年扣除十八萬元。\n8.房屋租金支出特別扣除：自中華民國一百十三年一月一日起，納稅義務人、配偶及受扶養直系親屬在中華民國境內租屋供自住且非供營業或執行業務使用者，其所支付之租金減除接受政府補助部分，每一申報戶每年扣除數額以十八萬元為限。但納稅義務人、配偶或受扶養直系親屬在中華民國境內有房屋者，不得扣除。\n9.健康檢查特別扣除：自中華民國一百十六年一月一日起，納稅義務人、配偶或受扶養親屬之健康檢查費用，付與公立醫院、全民健康保險特約醫療院、所，或經財政部認定其會計紀錄完備正確之醫院者，每人每年扣除額以一萬元為限。但有下列情形之一者，不得扣除：\n(1)受有保險給付或政府補助。\n(2)經財政部認定得申報扣除醫藥及生育費。\n依第七十一條規定應辦理結算申報而未辦理，經稽徵機關核定應納稅額者，均不適用前項第二款第二目列舉扣除額之規定。\n納稅義務人有下列情形之一者，不適用第一項第二款第三目之7長期照顧特別扣除及之8房屋租金支出特別扣除之規定：\n一、經減除長期照顧特別扣除額及房屋租金支出特別扣除額後，納稅義務人或其配偶依第十五條第二項規定計算之稅額適用稅率在百分之二十以上。\n二、納稅義務人依第十五條第五項規定選擇就其申報戶股利及盈餘合計金額按百分之二十八稅率分開計算應納稅額。\n三、納稅義務人依所得基本稅額條例第十二條規定計算之基本所得額超過同條例第十三條規定之扣除金額。","note":"一、修正第一項第二款第三目之五。\n(一)有鑑於教育學費特別扣除額自民國八十四年由新臺幣二萬元調整為二萬五千元後，迄今已逾三十一年未再檢討修正，顯已不符現行教育學費之實際支出水準。為使教育學費特別扣除額符合現今大專以上院校之教育學費，爰調高教育學費特別扣除額，由
