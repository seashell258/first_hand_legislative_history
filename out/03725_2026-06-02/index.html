業者違反第十六條第一項公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、執行成果備查或管理之規定。\n二、販賣業者違反第十九條第一項公告有關包裝減量目標、空間比例、層數、使用材質種類、數量、期限之規定，或違反依同條第二項所定辦法有關執行成果備查或管理之規定。\n三、販賣業者違反第二十條第一項公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關執行成果備查、必要設施設置方式或管理之規定。","note":"一、本條新增。\n二、考量販賣業者多屬小規模事業，爰針對該等業者違反修正條文第十六條、第十九條及第二十條指定物品、包裝或容器重複使用、減量、延長使用之管理規定，另增訂相關處罰規定，以符合責罰相當原則。"},{"bill":"202110204890000","text":"依第二十二條第二項規定自願揭露及標示物品或其包裝、容器資訊之業者，違反依同條第三項所定辦法有關揭露或標示內容、方式之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、配合修正條文第二十二條第二項之自願實施揭露及標示資訊規定，為避免業者揭露不實產品資訊或未依辦法規定之方式計算、評估，以維護消費者權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。"},{"bill":"202110207060000","text":"依第二十二條第二項規定自願揭露及標示物品或其包裝、容器資訊之業者，違反依同條第三項所定辦法有關揭露或標示內容、方式之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、配合修正條文第二十二條第二項之自願實施揭露及標示資訊規定，為避免業者揭露不實產品資訊或未依辦法規定之方式計算、評估，以維護消費者權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。"},{"bill":"202110207600000","text":"有下列情形之一者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品之販賣業者未依第十七條第一項規定提送包裝容器重複使用計畫，或違反同條第三項所定辦法有關核准事項、執行成果備查或管理之規定。\n二、指定物品之販賣業者違反第二十條第一項公告有關包裝減量目標、空間比例、層數、使用材質種類及數量之規定，或違反依同條第三項所定辦法有關執行成果備查或管理之規定。\n三、指定物品之販賣、提供使用業者違反第二十一條第一項公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、執行成果備查或管理之規定。","note":"一、本條新增。\n二、考量販賣或提供使用業者多屬小規模事業，爰針對該等業者違反修正條文第十七條、第二十條及第二十一條指定物品、包裝或容器重複使用、減量、延長使用之管理規定，另增訂相關處罰規定，以符合責罰相當原則。"},{"bill":"201110206460000","text":"依第二十二條第二項規定自願揭露及標示物品或其包裝、容器資訊之業者，違反依同條第三項所定辦法有關揭露或標示內容、方式之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、配合修正條文第二十二條第二項之自願實施揭露及標示資訊規定，為避免業者揭露不實產品資訊或未依辦法規定之方式計算、評估，以維護消費者權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。"},{"bill":"201110206460000","text":"第二十八條第二項至第五項、第三十九條之二第一項第七款、第三十九條之五第二項、第四十二條所定專業技術人員之資格、合格證書取得、廢止、訓練、執行業務、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第三十九條之二第一項第七款、第三十九條之五第二項訂有專業技術人員設置事項，爰納入增訂相關條文，並修正授權事項，以期明確。\n二、為與空氣污染防制法等環境保護法律立法體例一致，爰刪除「會同中央目的事業主管機關」文字。"},{"bill":"202110209820000","text":"依第二十二條第二項規定自願揭露及標示物品或其包裝、容器資訊之業者，違反依同條第三項所定辦法有關揭露或標示內容、方式之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、針對自願實施資訊揭露之業者，增訂揭露不實或不符規定之罰則以維護消費者權益，並適用較低之罰鍰額度以符比例原則。"},{"bill":"202110209800000","text":"依第二十二條第二項規定自願揭露及標示物品或其包裝、容器資訊之業者，違反依同條第三項所定辦法有關揭露或標示內容、方式之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、配合修正條文第二十二條第二項之自願實施揭露及標示資訊規定，為避免業者揭露不實產品資訊或未依辦法規定之方式計算、評估，以維護消費者權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。"},{"bill":"202110209750000","text":"依第二十二條第二項規定自願揭露及標示物品或其包裝、容器資訊之業者，違反依同條第三項所定辦法有關揭露或標示內容、方式之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、配合修正條文第二十二條第二項之自願實施揭露及標示資訊規定，為避免業者揭露不實產品資訊或未依辦法規定之方式計算、評估，以維護消費者權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。"},{"bill":"202110206620000","text":"依第二十二條第二項規定自願揭露及標示物品或其包裝、容器資訊之業者，違反依同條第三項所定辦法有關揭露或標示內容、方式之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、配合修正條文第二十二條第二項之自願實施揭露及標示資訊規定，為避免業者揭露不實產品資訊或未依辦法規定之方式計算、評估，以維護消費者權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。"}],"changed":true,"final":"有下列情形之一者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之販賣業者違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、販賣業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定。\n三、販賣業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","finalWhy":"一、本條新增。\n二、考量販賣業者多屬小規模事業，爰針對該等業者違反修正條文第十六條、第十九條及第二十條指定物品、包裝或容器重複使用、減量、延長使用之管理規定，另增訂相關處罰規定，以符合責罰相當原則。","review":null},{"no":"第四十五條","current":"前條所稱情節重大，係指有下列情形之一者：\n一、違反本法同一規定，一年內經二次限期改善，仍繼續違反本法規定者。\n二、未依規定回收再利用再生資源，嚴重污染環境者。\n三、申請、申報及記錄之文件虛偽不實者。\n四、其他經主管機關認定者。","versions":[{"bill":"202110167180000","text":"第四十一條所稱情節重大，係指有下列情形之一者：\n一、違反本法同一規定，一年內經二次限期改善，仍繼續違反本法規定。\n二、未依規定循環利用再生資源，嚴重污染環境。\n三、申請、申報及記錄之文件虛偽不實。\n四、其他經主管機關認定。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第四十一條，酌作文字修正。"},{"bill":"202110174540000","text":"物品或其包裝、容器之製造、輸入或販賣業者，自願揭露及標示資訊，違反依第二十二條第三項所定辦法有關揭露及標示之內容、方式或管理之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、配合修正條文第二十二條之自願實施揭露及標示資訊規定，為避免業者揭露不實產品資訊或未依辦法規定之方式計算、評估，以維護消費者權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。"},{"bill":"202110204890000","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"},{"bill":"202110207060000","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"},{"bill":"202110207600000","text":"第四十一條所稱情節重大，係指有下列情形之一者：\n一、違反本法同一規定，一年內經二次限期改善，仍繼續違反本法規定。\n二、未依規定循環利用再生資源，嚴重污染環境。\n三、申請、申報及記錄之文件虛偽不實。\n四、其他經主管機關認定。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第四十一條，酌作文字修正。"},{"bill":"201110206460000","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"},{"bill":"202110209820000","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合條次移列，酌作文字修正。"},{"bill":"202110209800000","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"},{"bill":"202110209750000","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"},{"bill":"202110206620000","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"}],"changed":true,"final":"依第二十二條第二項規定自願揭露及標示物品或其包裝、容器資訊之業者，違反依同條第三項所定辦法有關揭露或標示內容、方式之規定，由中央主管機關處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","finalWhy":"一、本條新增。\n二、配合修正條文第二十二條第二項之自願實施揭露及標示資訊規定，為避免業者揭露不實產品資訊或未依辦法規定之方式計算、評估，以維護消費者權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。","review":null},{"no":"第四十六條","current":"依本法應執行之取締、蒐證、移送等事項，由主管機關或目的事業主管機關辦理。\n本法所定之處罰，除目的事業主管機關處罰外，由直轄市或縣（市）主管機關處罰之。","versions":[{"bill":"202110167180000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法處罰之執行機關，除修正條文第四十條至第四十二條已定明處罰機關外，由直轄市或縣（市）主管機關處罰，爰修正現行第二項規定。"},{"bill":"202110174540000","text":"第四十條所稱情節重大，指有下列情形之一者：\n一、違反本法同一規定，一年內經二次限期改善，仍繼續違反本法規定。\n二、未依規定循環利用再生資源，嚴重污染環境。\n三、申請、申報及記錄之文件虛偽不實。\n四、其他經主管機關認定。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"},{"bill":"202110204890000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十七條第一項、第四十條、第四十二條及第四十四條違反產品綠色設計、產品數位資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。"},{"bill":"202110207060000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十七條第一項、第四十條、第四十二條及第四十四條違反產品綠色設計、產品數位資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。"},{"bill":"202110207600000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法處罰之執行機關，除修正條文第四十條至第四十二條已定明處罰機關外，由直轄市或縣（市）主管機關處罰，爰修正現行第二項規定。"},{"bill":"201110206460000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十七條第一項、第四十條、第四十二條及第四十四條違反產品綠色設計、產品數位資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。"},{"bill":"201110206460000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/ 1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"202110209820000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、行政檢查權責已於第八條明定，爰刪除第一項。另除本法另有明定由中央主管機關或目的事業主管機關裁處之情形外，統一由直轄市或縣（市）主管機關處罰。"},{"bill":"202110209800000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十七條第一項、第四十條、第四十二條及第四十四條違反產品綠色設計、產品數位資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。"},{"bill":"202110209750000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十七條第一項、第四十條、第四十二條及第四十四條違反產品綠色設計、產品數位資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。"},{"bill":"202110206620000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十七條第一項、第四十條、第四十二條及第四十四條違反產品綠色設計、產品數位資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。"}],"changed":true,"final":"第四十條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十八條第二項或第二十九條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","finalWhy":"一、條次變更，本條為原第二十七條移列。\n二、配合原第二十六條移列修正條文第四十條，酌作文字修正。","review":null},{"no":"第四十六條之一","current":"第五款及第六款\n有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。","versions":[{"bill":"201110206460000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十七條","current":"依本法應執行之取締、蒐證、移送等事項，由主管機關或目的事業主管機關辦理。\n本法所定之處罰，除目的事業主管機關處罰外，由直轄市或縣（市）主管機關處罰之。","versions":[{"bill":"202110167180000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"202110174540000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第四十條及第四十四條違反產品數位資訊揭露、環保標章之管理規定，由中央主管機關裁處，已定明處罰機關外，由直轄市或縣（市）主管機關處罰，爰修正現行第二項規定。"},{"bill":"202110204890000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"202110207060000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"202110207600000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"201110206460000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"202110209820000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、明定授權中央主管機關訂定裁罰準則之依據。"},{"bill":"202110209800000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"202110209750000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"202110206620000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"}],"changed":true,"final":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","finalWhy":"一、條次變更，本條為原第二十九條移列。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第四十條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十八條第一項、第四十一條、第四十三條及第四十五條違反產品綠色設計、產品資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。","review":null},{"no":"第四十八條","current":null,"versions":[{"bill":"202110167180000","text":"主管機關或目的事業主管機關依本法規定受理各項申請之審查，應收取審查費或證書費等規費。\n前項收費標準，由中央主管機關或中央目的事業主管機關定之。","note":"一、本條新增。\n二、配合本次修法新增之申請項目，第一項新增收取費用規定。\n三、新增第二項授權由中央主管機關或中央目的事業主管機關訂定收費標準。"},{"bill":"202110174540000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"202110204890000","text":"主管機關或目的事業主管機關依本法規定受理各項申請之審查，應收取審查費或證書費等規費。\n前項收費標準，由中央主管機關或中央目的事業主管機關定之。","note":"一、本條新增。\n二、配合本次修法新增之申請項目，第一項增訂收取費用規定。\n三、增訂第二項授權由中央主管機關或中央目的事業主管機關訂定收費標準（如修正條文第二十五條第五項再生資源項目之申請）。"},{"bill":"202110207060000","text":"主管機關或目的事業主管機關依本法規定受理各項申請之審查，應收取審查費或證書費等規費。\n前項收費標準，由中央主管機關或中央目的事業主管機關定之。","note":"一、本條新增。\n二、配合本次修法新增之申請項目，第一項增訂收取費用規定。\n三、增訂第二項授權由中央主管機 ，內容未修正。"},{"bill":"202110207600000","text":"本法除第十五條自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十五條促進產品資源循環之強制管制措施配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。"},{"bill":"201110206460000","text":"本法施行細則，由中央主管機關定之。","note":"條次變更，內容未修正。"},{"bill":"201110206460000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影像，尚未能逕以影像資料直接查知確認違反第二十七條各款行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人者，應以該應歸責之人為處罰對象。\n(二)另考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考道路交通管理處罰條例第三十一條第二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"},{"bill":"202110209820000","text":"本法施行細則，由中央主管機關定之。","note":"條次變更，內容未修正。"},{"bill":"202110209800000","text":"本法施行細則，由中央主管機關定之。","note":"條次變更，內容未修正。"},{"bill":"202110209750000","text":"本法施行細則，由中央主管機關定之。","note":"條次變更，內容未修正。"},{"bill":"202110206620000","text":"本法施行細則，由中央主管機關定之。","note":"條次變更，內容未修正。"}],"changed":true,"final":"有第三十八條、第三十九條、第四十條第二款、第四款、第四十一條第一款至第三款、第五款、第四十二條、第四十四條所定情形之一者，主管機關得於中央主管機關指定之網站，公開違規業者之名稱、地址及違法情形。","finalWhy":"一、本條新增。\n二、為督促業者確實遵守法令，保障消費大眾權益避免遭受損害，及維護社會大眾知之權益，爰定明公開違規業者資訊之機制。","review":null},{"no":"第五十一條","current":"本法施行細則，由中央主管機關定之。","versions":[{"bill":"202110174540000","text":"本法施行細則，由中央主管機關定之。","note":"條次變更，內容未修正。"},{"bill":"202110204890000","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行日期予以二年緩衝期間，其餘條文自公布日施行"},{"bill":"202110207060000","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。"},{"bill":"201110206460000","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。"},{"bill":"201110206460000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110209820000","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則需時間配套準備，給予兩年緩衝期，其餘條文自公布日施行。"},{"bill":"202110209800000","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。"},{"bill":"202110209750000","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行日期予以二年緩衝期間，其餘條文自公布日施行。"},{"bill":"202110206620000","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。"}],"changed":true,"final":"本法施行細則，由中央主管機關定之。","finalWhy":"條次變更，本條為原第三十條移列，內容未修正。","review":null},{"no":"第五十二條","current":"本法自公布後一年施行。","versions":[{"bill":"202110174540000","text":"本法除第十四條自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。"},{"bill":"201110206460000","text":"有下列情形之一者，處新臺幣六千元以上三百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第二十八條第一項規定方式清理事業廢棄物。\n二、違反依第二十九條第二項所定辦法有關提供條件、許可事項、期限或管理之規定。\n三、未依第三十一條第一項第一款、第三十九條第二項、第三十九條之五第一項規定，取得事業廢棄物清理計畫書之核准或變更；違反第三十一條第三項所定辦法有關核准事項或變更之規定。\n四、違反第三十一條第一項第二款或同條第五項申報規定。\n五、未依第三十一條第一項第三款規定裝置即時追蹤系統或維持正常運作。\n六、未依第三十四條規定處理事業廢棄物。\n七、違反依第三十六條第二項所定標準有關貯存、清除或處理方法、設施之規定。\n八、違反依第三十九條第四項、第三十九條之五第二項準用第三十九條第四項所定辦法有關管理方式、檢核、許可事項、記錄、申報或管理之規定。\n九、違反依第三十九條之一第三項、第三十九條之五第三項準用第三十九條之一第三項所定辦法有關再利用產品之記錄與申報項目、頻率、使用證明保存、環境監測計畫書核准事項、採樣與監測結果紀錄或環境監測結果報告備查之規定。\n十、違反依第三十九條之二第二項、第三十九條之五第二項準用第三十九條之二第二項所定辦法有關契約書應記載事項、驗證事項、檢測事項、檢測報告應具備內容、銷售對象、使用用途或方式、設備與人員設置、監視系統及瀏覽伺服規格或其他管理措施之規定。\n十一、違反依第三十九條之三第三項、第三十九條之五第二項準用第三十九條之三第三項所定辦法有關產品品質規範、標示、使用限制、警語、供料履歷、驗證、認證事項或管理之規定。\n十二、違反依第三十九條之四第五項、第三十九條之五第二項準用第三十九條之四第五項所定辦法有關停止收受、再利用運作、銷售、運送、核准事項之規定。","note":"一、配合修正條文第三十九條至第三十九條之五，修正本條處罰規定，並依違反條次順序之違規行為態樣分別臚列於第一款至第十二款，以茲明確，並酌作文字修正。\n二、本條各款已明定處罰構成要件，爰配合修正序文。"}],"changed":true,"final":"本法除第十四條及第三十八條第一項規定自公布後二年施行外，自公布日施行。","finalWhy":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十八條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。","review":null},{"no":"第五十三條","current":"有下列情形之一者，處新臺幣六萬元以上一千萬元以下罰鍰。經限期改善，屆期仍未完成改善者，按次處罰。情節重大者，並得命其停工或停業：\n一、貯存、清除、處理或再利用有害事業廢棄物違反第二十八條第一項、第七項、第三十一條第一項、第五項、第三十四條、第三十九條規定或依第二十九條第二項、第三十九條之一第二項所定管理辦法。\n二、貯存、清除或處理有害事業廢棄物，違反第三十六條第一項規定。\n三、輸入、輸出、過境、轉口廢棄物違反第三十八條第一項至第五項規定。","versions":[{"bill":"201110206460000","text":"有下列情形之一者，處新臺幣六萬元以上一千萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得令其停工或停業：\n一、貯存、清除、處理、再利用有害事業廢棄物或其再利用產品使用、加工再製，有前條各款情形之一。\n二、清除、處理有害事業廢棄物，違反第二十八條第七項規定。\n三、輸入、輸出、過境、轉口事業廢棄物，未依第三十八條第一項規定取得許可，或違反同條第二項有害事業廢棄物輸出規定、同條第三項所定辦法有關許可、許可期限或管理之規定或同條第四項禁止輸入規定；或國際公約列管之一般廢棄物違反第三十八條第五項準用同條第一項至第四項規定。","note":"一、序文酌作文字修正，另配合前條修正，整併第一款及第三款針對有害事業廢棄物之處罰規定，並修正簡化有前條各款之違反行為態樣之一者，納入處罰；另將第一款有關違反第二十八條第七項規定之處罰移列第二款，以明確其處罰態樣。\n二、第三款修正明確其違反態樣。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十五條","current":"有下列情形之一者，處新臺幣六千元以上三百萬元以下罰鍰，並限期令其改善，屆期仍未完成改善者，得按次處罰：\n一、公民營廢棄物清除處理機構違反第十二條規定或依第四十二條所定管理辦法。\n二、指定公告之事業違反第二十八條第二項應置專業技術人員或自行清除處理事業廢棄物違反依第二十八條第二項所定管理辦法。\n三、廢棄物共同清除處理機構，清除處理設施所屬之公營事業或民間機構違反依第二十八條第三項至第五項所定管理辦法。\n四、有害事業廢棄物貯存、清除、處理之操作及檢測違反依第三十七條第二項所定管理辦法。\n五、廢棄物檢驗測定機構違反第四十三條第一項規定。","versions":[{"bill":"201110206460000","text":"有下列情形之一者，處新臺幣六千元以上三百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、公民營廢棄物清除處理機構違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、方法、設備或再利用規定，或同條第二項之分類、貯存規定或違反依第四十二條所定辦法有關自有設施、專業技術人員設置、許可、許可期限或管理之規定。\n二、指定公告之事業未依第二十八條第二項規定置專業技術人員；或自行清除處理事業廢棄物違反依第二十八條第二項所定辦法有關清除機具、處理設施或設備應具備之條件、許可、許可期限或管理之規定。\n三、廢棄物共同清除處理機構，清除處理設施所屬之公營事業或民間機構違反依第二十八條第三項至第五項所定辦法有關許可、許可期限、專業技術人員設置、營運、操作紀錄或管理之規定。\n四、有害事業廢棄物貯存、清除、處理之操作及檢測違反依第三十七條第二項所定辦法有關檢測之項目、方法、頻率或管理之規定。","note":"一、序文酌作文字修正，並明確第一款至第四款違規態樣。\n二、修正條文第五十八條第一項已完整規範檢驗測定機構違反第四十三條規定之處罰，爰刪除第五款規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十八條","current":"廢棄物檢驗測定機構、檢驗檢測人員違反依第四十三條第二項所定管理辦法、廢棄物專業技術人員違反依第四十四條所定管理辦法者，處新臺幣六萬元以上一百萬元以下罰鍰。","versions":[{"bill":"201110206460000","text":"有下列情形之一者，由中央主管機關處新臺幣六萬元以上一百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第四十三條第一項規定取得許可證，逕行辦理檢驗測定。\n二、違反依第四十三條第二項所定辦法有關檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可事項或管理之規定。\n廢棄物專業技術人員違反依第四十四條所定辦法有關資格、合格證書、訓練、執行業務或管理之規定，處新臺幣一萬元以上十萬元以下罰鍰。","note":"一、現行條文列為第一項，並修正如下：\n(一)有關檢驗測定之違反行為處罰規定，配合修正條文第四十三條規定分款列明，以茲明確，並於序文增訂限期改善及按次處罰規定，以與其他環保法律體例相符。\n(二)除本法外，現行其他環保法律針對環境檢驗測定機構違規時之裁罰，考量機構對所屬檢驗人員執行業務具指揮監督之責，如有發生違規情形，機構自應成為歸責主體，爰參考其他環境作用法，刪除裁罰檢驗檢測人員之規定。\n二、有關廢棄物專業技術人員違反第四十四條授權辦法之處罰移列增訂第二項，並參考水污染防治法第四十八條第四項、空氣污染防制法第六十九條第二項規定，針對廢棄物專業技術人員違反行為之罰鍰額度，為一致性規定，以符責罰相當原則。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十八條之一","current":null,"versions":[{"bill":"201110206460000","text":"有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善；屆期仍未完成改善者，按次處罰：\n一、違反直轄市、縣（市）主管機關或執行機關依第七十一條第一項規定所為命令，屆期不為清除、處理、改善環境，或屆期未提出處置計畫書、未補正、經補正後仍不符規定或未依核定期程、內容執行。\n二、無正當理由規避、妨礙或拒絕第七十一條之二第一項規定應配合事項。","note":"一、本條新增。\n二、考量土地等環境資源之不可回復性及有限性，為確保直轄市、縣（市）主管機關或執行機關依第七十一條令清除、處理及環境改善或提出處置計畫書之行為責任、狀態責任人，確實履行其義務，爰參考土壤及地下水污染整治法第三十七條及第三十八條第二項增訂第一款處罰規定。\n三、考量土地所有人、管理人或使用人如有違反修正條文第七十一條之二第一項不配合直轄市、縣（市）主管機關或執行機關代履行、採取應變等相關措施，或妨礙處置計畫書實施情事發生，將影響場址之清理及復原，爰參考土壤及地下水污染整治法第三十八條第一項增訂第二款處罰規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六十一條","current":"本法所稱按日連續處罰，其起算日、暫停日、停止日、改善完成認定查驗及其他應遵行事項，由中央主管機關定之。","versions":[{"bill":"201110206460000","text":"（刪除）","note":"一、本條刪除。\n二、配合修正條文第五十條及第五十一條將原按日連續處罰之規定修正為按次處罰，本法已無按日連續處罰規定，本條規定已無保留必要，爰予刪除。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六十三條","current":"本法所定行政罰，由執行機關處罰之；執行機關應作為而不作為時，得由上級主管機關為之。","versions":[{"bill":"201110206460000","text":"本法所定之處罰，除另有規定外，由執行機關為之；執行機關應作為而不作為時，得由上級主管機關為之。\n主管機關或執行機關得於中央主管機關指定之網站，公開對事業、公民營廢棄物清除處理機構或設施、專業技術人員、檢驗測定機構查核、處分之個別及統計資訊。","note":"一、現行條文列為第一項，定明違反本法之處罰機關，除第五十八條第一項檢測機構違規由中央主管機關處罰外，由執行機關為之。\n二、為落實資訊公開制度，主管機關或執行機關得公開其查核、處分資訊，爰增訂第二項。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六十三條之一","current":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n其違法所得之利益超過法定罰鍰最高額者，得於所得利益之範圍內酌量加重裁處，不受法定罰鍰最高額之限制。\n前項所得利益認定、核算辦法，由中央主管機關定之。","versions":[{"bill":"201110206460000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","note":"一、第一項未修正。\n二、為與其他環保法規規定一致，參考水污染防治法第六十六條之二第一項、空氣污染防制法第八十六條第一項規定，修正第二項，採取追繳不法利得與罰鍰併行之立法體例，以遏止環境不法。\n三、任何人皆不應因違反行政法義務而受有財產上利益，依其類型包括：(一)行為人違反本法義務行為而有所得利益者；(二)為他人利益而實施行為，致使他人　違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之　虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第一項及第二項規定，增訂第三項及第四項規定。\n四、第三項移列為第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第四項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六十四條","current":"依本法處罰鍰案件，涉及刑事責任者，應分別處罰。","versions":[{"bill":"201110206460000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第七十一條","current":"不依規定清除、處理之廢棄物，直轄市、縣（市）主管機關或執行機關得命事業、受託清除處理廢棄物者、仲介非法清除處理廢棄物者、容許或因重大過失致廢棄物遭非法棄置於其土地之土地所有人、管理人或使用人，限期清除處理。屆期不為清除處理時，直轄市、縣（市）主管機關或執行機關得代為清除、處理，並向其求償清理、改善及衍生之必要費用。屆期未清償者，移送強制執行；直轄市、縣（市）主管機關或執行機關得免提供擔保向行政法院聲請假扣押、假處分。\n直轄市、縣（市）主管機關或執行機關依前項規定代為清除、處理廢棄物時，得不經土地所有人、管理人或使用人同意，強制進入公私場所進行有關採樣、檢測、清除或處理等相關措施。\n第一項必要費用之求償權，優於一切債權及抵押權。\n直轄市、縣（市）主管機關或執行機關代為清除、處理第一項廢棄物時，得委託適當公民營廢棄物清除處理機構清除、處理之。","versions":[{"bill":"201110206460000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第七十一條之一","current":"第三項　第一項必要費用之求償權，優於一切債權及抵押權。","versions":[{"bill":"201110206460000","text":"土地遭非法回填、堆置廢棄物之處置義務人有數人者，應就該廢棄物負連帶清除、處理及改善環境責任，並就代履行費用、應變措施必要費用負連帶清償責任。\n處置義務人為公司組織者，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優先於一切債權及抵押權受償，且不受扣押禁止處分效力之拘束；該債權請求權因十年間不行使而消滅。","note":"一、考量土地等環境資源之不可回復性及有限性，參考土壤及地下水污染整治法第三十一條規定，增訂第一項定明數處置義務人就回填、堆置廢棄物之清除、處理及改善環境義務（包括代履行費用、應變措施必要費用），負連帶責任。\n二、參考土壤及地下水污染整治法第四十三條第三項、第四項規定，增訂第二項、第三項定明處置義務人為公司組織時，其負責人、控制公司或股東應負連帶責任，以避免實際應負責之人濫用公司人格而解免責任；並明定土地所有人、管理人、使用人之內部求償機制，及排除容許廢棄物回填、堆置於其管領土地之情形。\n三、現行第七十一條第三項規定移列第四項，考量加速復原環境之需求，定明代履行及應變措施相關費用債權之優先性，縱處置義務人財產已受刑事訴訟法第一百三十三條第六項扣押禁止處分，亦不受扣押效力拘束，行政執行機關仍得就義務人財產拍賣執行，以期受污染場址得儘速清理復原；另為落實司法改革國是會議決議並落實處置義務人責任，延長該債權請求權之時效為十年。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第七十一條之二","current":"第二項、第四項\n直轄市、縣（市）主管機關或執行機關依前項規定代為清除、處理廢棄物時，得不經土地所有人、管理人或使用人同意，強制進入公私場所進行有關採樣、檢測、清除或處理等相關措施。\n直轄市、縣（市）主管機關或執行機關代為清除、處理第一項廢棄物時，得委託適當公民營廢棄物清除處理機構清除、處理之。","versions":[{"bill":"201110206460000","text":"土地所有人、管理人或使用人應配合直轄市、縣（市）主管機關或執行機關代履行、採取應變措施、進行採樣、檢測等相關措施，及處置義務人依處置計畫書執行之行為，不得規避、妨礙或拒絕。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；該廢棄物清除、處理、再利用機構或清除處理設施經原核發許可或同意之機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回填、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，並囑託土地登記主管機關於相關地籍資料註記；於廢棄物經妥善清理後，囑託塗銷註記。","note":"一、現行第七十一條第二項規定移列為第一項，並修正定明土地所有人、管理人或使用人應配合之義務。如有違反，並於修正條文第五十八條之一第二款增列處罰規定。\n二、現行第七十一條第四項規定移列為第二項，參考空氣污染防制法第十四條規定，為使此非常態、非持續性產出之廢棄物得以有效、及時之清理，避免環境危害發生或擴大，爰定明直轄市、縣（市）主管機關或執行機關執行代履行或採取應變措施時，受託之合法廢棄物清除、處理、再利用機構或清除處理設施經原核發機關核准後，其受託清除、處理、再利用之項目及數量，不受原許可或同意、設置文件及環境影響評估相關管制規定之限制。\n三、增訂第三項，定明直轄市、縣（市）主管機關或執行機關得公開土地遭回填、堆置廢棄物之環境資訊，提升資訊透明，以保障善意第三人權益。如回填、堆置廢棄物已造成土地污染，土壤及地下水污染整治法所定主管機關已依法公告有關資訊，土地登記主管機關將另行註記土地污染資訊。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第七十七條","current":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。","versions":[{"bill":"201110206460000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行管理制度及運作方式之重大變革，爰增訂第四項緩衝期規定，定明前開規定自公布後二年施行，俾利相關配套法規訂修及實務運作調整。\n二、第三十九條至第三十九條之五既係自公布後二年施行，其所對應之第五章罰則規定，於上開條文尚未生效前，尚無從作為處罰依據，為避免適用上孳生疑義，爰明定第五章有關第三十九條至第三十九條之五之處罰規定，亦同自公布後二年施行，俾利實務適用。\n三、於修正條文第三十九條至第三十九條之五規定施行前，事業廢棄物之再利用，仍依現行第三十九條及第三十九條之一規定辦理，若非合法之再利用行為，仍有第四十六條刑罰規定之適用；如為合法之再利用行為，僅違反再利用程序等規定，則依第五十二條、第五十三條行政罰規定裁處（最高法院一百十一年度台上字第二○八三號刑事判決參照），併予敘明。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2025-10-31","stage":"一讀","code":"院會-11-4-7","bill":"202110167180000","gazref":"114卷087期5380號 15-15頁"},{"date":"2025-11-21","stage":"一讀","code":"院會-11-4-10","bill":"202110174540000","gazref":"114卷097期5390號 18-18頁"},{"date":"2026-04-08","code":"委員會-11-5-26-5","title":"第11屆第5會期社會福利及衛生環境委員會第5次全體委員會議","gazref":"115卷028期5427號 371-372,374-464頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2026040225/details?meetingDate=115/04/08","full":["https://ivod.ly.gov.tw/Play/Full/1M/17326"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/115/28/LCIDC01_1152801_00005.pdf","p1":371,"p2":464}],"clips":[{"n":"林淑芬","t":"09:07","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168202"},{"n":"林月琴","t":"09:29","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168213"},{"n":"陳菁徽","t":"09:40","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168216"},{"n":"邱慧洳","t":"09:56","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168219"},{"n":"王育敏","t":"10:10","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168229"},{"n":"廖偉翔","t":"10:25","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168237"},{"n":"蘇清泉","t":"10:40","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168240"},{"n":"黃秀芳","t":"10:54","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168310"},{"n":"林淑芬","t":"11:18","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168264"},{"n":"涂權吉","t":"11:55","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168274"},{"n":"洪孟楷","t":"12:08","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168285"},{"n":"鍾佳濱","t":"12:20","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168287"},{"n":"羅美玲","t":"12:26","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168290"},{"n":"盧縣一","t":"12:33","u":"https://ivod.ly.gov.tw/Play/Clip/1M/168296"},{"n":"王正旭 <script>

};

const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;

}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));

  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));

function finder(turns) {   // 在這場逐字稿裡找字

        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
