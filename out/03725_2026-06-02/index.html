期檢討及編寫製作成果報告，並對外公開。","review":null},{"no":"第十二條","current":"中央主管機關應設再生資源回收再利用促進委員會（以下簡稱委員會），負責審議主管機關及目的事業主管機關所擬有關再生資源回收再利用重大政策、措施、有關源頭管理章各條公告指定事項與執行及運作之協調、評估等事宜。\n委員會置主任委員一人，由行政院環境保護署署長擔任；委員任期二年，由相關政府機關、學者專家及環境保護團體代表組成。其中學者專家及環境保護團體代表不得少於委員會人數二分之一。委員會委員、其配偶及直系血親於其任期中及該任期屆滿後三年內，應迴避其任期中所審核之再生資源回收再利用相關產業之執行及運作事宜由。\n委員會之組織規程行政院環境保護署擬定，報請行政院核定後發布之。","versions":[{"bill":"202110167180000","text":"中央主管機關為執行前條各項職權，得設資源循環推動會（以下簡稱推動會），提供諮詢意見。\n推動會置召集人一人，由環境部部長指定環境部次長一人兼任；委員任期二年，由相關政府機關、學者專家及環境保護團體代表組成。其中學者專家及環境保護團體代表不得少於推動會人數三分之一。","note":"一、條次變更。\n二、為賦予資源循環推動會成立依據及明確其功能角色，爰修正第一項規定。\n三、配合推動會之設置，定明其成員組成，另考量推動會任務為諮詢性質，已無審核權責，爰刪除現行第二項後段利益迴避相關規定。\n四、推動會為任務編組，得由中央主管機關依職權定之，無需於作用法明文，爰刪除第三項規定。"},{"bill":"202110174540000","text":"中央主管機關為執行前條各項職權，得設資源循環推動會（以下簡稱推動會），提供諮詢意見。\n推動會置召集人一人，由環境部部長指定環境部次長一人兼任；委員任期二年，由相關政府機關、學者專家及環境保護團體、原住民族代表組成。其中學者專家及環境保護團體、原住民族代表不得少於推動會人數三分之一。","note":"一、條次變更。\n二、為賦予資源循環推動會成立依據及明確其功能角色，爰修正第一項規定。\n三、配合推動會之設置，定明其成員組成，另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。學者專家及環境保護團體、原住民族代表不得少於推動會人數三分之一，此為最低門檻，在實務運作中，已可確保外部委員的觀點被納入。將依性質與需求於實務執行時調升學者專家與環保團體代表參與比例。\n四、推動會為任務編組，得由中央主管機關依職權定之，無需於作用法明文，爰刪除第三項規定。"},{"bill":"202110204890000","text":"中央主管機關為執行前條第一項至第三項職權，得邀集相關政府機關、學者專家及環境保護團體代表組成資源循環推動會，提供諮詢意見。","note":"一、條次變更。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，並配合推動會之設置，爰整併第一項及第二項規定，定明其成員組成。\n三、為賦予推動會實務運作彈性，第二項有關推動會召集人、任期及成員組成之比例，另於推動會設置要點規定，爰予刪除；另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。\n四、推動會為任務編組，無需以組織規程規範，爰刪除第三項規定。"},{"bill":"202110207060000","text":"中央主管機關為執行前條第一項至第三項職權，得邀集相關政府機關、學者專家及環境保護團體代表組成資源循環推動會，提供諮詢意見。","note":"一、條次變更。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，並配合推動會之設置，爰整併第一項及第二項規定，定明其成員組成。\n三、為賦予推動會實務運作彈性，第二項有關推動會召集人、任期及成員組成之比例，另於推動會設置要點規定，爰予刪除；另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。\n四、推動會為任務編組，無需以組織規程規範，爰刪除第三項規定。"},{"bill":"202110207600000","text":"中央主管機關為執行前條各項職權，得設資源循環推動會（以下簡稱推動會），提供諮詢意見。\n推動會置召集人一人，由環境部部長指定環境部次長一人兼任；委員任期二年，由相關政府機關、學者專家及環境保護團體代表組成。其中學者專家及環境保護團體代表不得少於推動會人數三分之一。","note":"一、條次變更。\n二、為賦予資源循環推動會成立依據及明確其功能角色，爰修正第一項規定。\n三、配合推動會之設置，定明其成員組成，另考量推動會任務為諮詢性質，已無審核權責，爰刪除現行第二項後段利益迴避相關規定。\n四、推動會為任務編組，得由中央主管機關依職權定之，無需於作用法明文，爰刪除第三項規定。"},{"bill":"201110206460000","text":"中央主管機關為執行前條第一項至第三項職權，得邀集相關政府機關、學者專家及環境保護團體代表組成資源循環推動會，提供諮詢意見。","note":"一、條次變更。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，並配合推動會之設置，爰整併第一項及第二項規定，定明其成員組成。\n三、為賦予推動會實務運作彈性，第二項有關推動會召集人、任期及成員組成之比例，另於推動會設置要點規定，爰予刪除；另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。\n四、推動會為任務編組，無需以組織規程規範，爰刪除第三項規定。"},{"bill":"202110209820000","text":"中央主管機關為執行前條第一項至第三項職權，得邀集相關政府機關、學者專家及環境保護團體代表組成資源循環推動會，提供諮詢意見。","note":"一、條次變更。\n二、整併並明定「資源循環推提會」之成立依據與組成。其餘召集人、任期、比例及利益迴避等實務運作細節改於設置要點規範，推動會屬任務編組免訂組織規程，爰刪除相關後段規定。"},{"bill":"202110209800000","text":"中央主管機關為執行前條第一項至第三項職權，得邀集相關政府機關、學者專家及環境保護團體代表組成資源循環推動會，提供諮詢意見。","note":"一、條次變更。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，並配合推動會之設置，爰整併第一項及第二項規定，定明其成員組成。\n三、為賦予推動會實務運作彈性，第二項有關推動會召集人、任期及成員組成之比例，另於推動會設置要點規定，爰予刪除；另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。\n四、推動會為任務編組，無需以組織規程規範，爰刪除第三項規定。"},{"bill":"202110209750000","text":"中央主管機關為執行前條第一項至第三項職權，並協調中央主管機關及中央目的事業主管機關間，有關本法重大政策之評估、執行及運作等事宜，得邀集相關政府機關、學者專家、環境保護團體及相關產業代表組成資源循環推動會，提供諮詢意見。\n推動會置召集人一人，由環境部部長指定環境部次長一人兼任；委員任期二年，由相關政府機關、學者專家、環境保護團體及產業代表組成。其中學者專家及環境保護團體等政府機關以外之代表不得少於推動會人數二分之一。","note":"一、條次變更。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，以促進資源循環之推動，爰修正第一項規定。\n三、配合推動會之設置，現行第二項及第三項有關委員會之相關規定，爰予刪除。另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。\n四、增訂第二項，推動會置委員，除召集人、副召集人為當然委員外，由召集人就相關政府機關代表、學者專家、環境保護團體及相關產業代表遴聘之；其中學者專家及環境保護團體等政府機關以外之代表，不得少於全體委員人數之二分之一；另考量資源循環涉及相關產業之技術創新，為使推動會之運作即時掌握我國相關產業之發展狀況，爰納入產業代表。推動會委員任一性別比例不得少於五分之二。"},{"bill":"202110206620000","text":"中央主管機關為執行前條第一項至第三項職權，得邀集相關政府機關、學者專家及環境保護團體代表組成資源循環推動會，提供諮詢意見。","note":"一、條次變更。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，並配合推動會之設置，爰整併第一項及第二項規定，定明其成員組成。\n三、為賦予推動會實務運作彈性，第二項有關推動會召集人、任期及成員組成之比例，另於推動會設置要點規定，爰予刪除；另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。\n四、推動會為任務編組，無需以組織規程規範，爰刪除第三項規定。"}],"changed":true,"final":"中央主管機關為執行前條第一項至第三項職權，應組成資源循環推動會（以下簡稱推動會），負責召集、督導相關部會研議、協商、評估、整合、制定及推動前條資源循環政策、措施。\n推動會置召集人一人，由環境部部長擔任；委員任期二年，由相關政府機關、學者、專家及環境保護團體代表組成，其中政府機關代表應由副首長以上主管擔任，學者、專家及環境保護團體代表不得少於二分之一，環境保護團體代表不得少於推動會整體之四分之一。\n推動會之會議紀錄，應對外公開。但涉及國家機密或營業秘密者，不在此限。","finalWhy":"一、條次變更，本條為原第五條移列。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，考量資源循環政策具跨領域及跨機關協調性，爰修正第一項，定明由中央主管機關組成推動會，負責召集、督導相關部會辦理資源循環政策及措施之研議、協商、整合及推動，以強化政策統籌協調及執行效能，健全我國資源循環治理機制。\n三、因應政府組織改造，行政院環境保護署改制為環境部，第二項爰酌修文字；另考量資源循環政策涉及跨部會協調及政策整合，爰定明政府機關代表應由副首長以上主管擔任，以提升政策協調及決策效能。又為強化民間參與及環境保護觀點之納入，增訂環境保護團體代表不得少於推動會整體委員四分之一之規定。至原條文後段有關利益迴避規定，回歸行政程序法相關規定辦理，爰予刪除。\n四、推動會為任務編組，無需以組織規程規範，爰刪除原條文第三項。\n五、為落實資訊公開及公眾參與，爰增訂第三項。","review":null},{"no":"第十三條","current":"目的事業主管機關應輔導事業回收再利用再生資源。\n中央目的事業主管機關並得視產業發展狀況公告指定產品、營建工程、或事業別及其規模於研發、設計、製造、生產、銷售或工程施工等階段，應遵行經指定之下列事項：\n一、使用易於分解、拆解或回收再利用之材質、規格或設計。\n二、使用一定比例或數量之再生資源。\n三、使用可重複填充之容器。\n四、其他經中央目的事業主管機關會商中央主管機關指定之事項。\n前項公告指定之產品或營建工程、業別、材質、規格、一定比例或數量及其實施方式等，由中央目的事業主管機關會商中央主管機關定之。","versions":[{"bill":"202110167180000","text":"中央主管機關得訂定產品及營建工程綠色設計準則，納入下列項目：\n一、使用單一、易於分解、拆解或循環利用之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央目的事業主管機關得依前項綠色設計準則，檢討所主管之相關法令，並輔導業者遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範我國產品及營建工程綠色設計準則應包含之基本原則項目，並授權由中央主管機關定之，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十七條增訂促進容器重複使用之相關管理機制，爰刪除現行第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物循環利用，增列第五款，導入營建工地源頭分類管理。\n(七)現行第四款移列第六款修正，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十五條及第十六條分別明文，爰刪除第三項。\n五、新增第二項，定明中央目的事業主管機關得配合綠色設計準則規定，檢討相關法令及輔導業者。"},{"bill":"202110174540000","text":"為提升產品及營建工程永續性、資源使用效率及延長使用壽命，中央主管機關得訂定產品及營建工程綠色設計準則；其內容應包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央目的事業主管機關得依前項綠色設計準則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範我國產品及營建工程綠色設計準則應包含之基本原則項目，並授權由中央主管機關定之，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款修正，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n五、新增第二項，定明中央目的事業主管機關得配合綠色設計準則規定，檢討相關法令及輔導事業。"},{"bill":"202110204890000","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。"},{"bill":"202110207060000","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。"},{"bill":"202110207600000","text":"中央主管機關得訂定產品及營建工程綠色設計準則，納入下列項目：\n一、使用單一、易於分解、拆解或循環利用之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央目的事業主管機關得依前項綠色設計準則，檢討所主管之相關法令，並輔導業者遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範我國產品及營建工程綠色設計準則應包含之基本原則項目，並授權由中央主管機關定之，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十七條增訂促進容器重複使用之相關管理機制，爰刪除現行第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物循環利用，增列第五款，導入營建工地源頭分類管理。\n(七)現行第四款移列第六款修正，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十五條及第十六條分別明文，爰刪除第三項。\n五、新增第二項，定明中央目的事業主管機關得配合綠色設計準則規定，檢討相關法令及輔導業者。"},{"bill":"201110206460000","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。"},{"bill":"202110209820000","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、原輔導權責移至第十條。參考歐盟規範二○二四年永續產品生態設計規範（ESPR），明定中央主管機關應規劃產品及營建工程綠色設計原則並訂定準則（包含要求材質單一以利回收再製，以及如電子產品需達能效標準或採標準規格等節約能資源與減少廢棄物之設計）。明定目的事業主管機關應檢討法令並輔導遵行。強制實施規定已移至第十四、十五條，爰刪除原第三項。"},{"bill":"202110209800000","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一有利於回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)增列第三款，為提升產品可維修性及耐用性，導入延長使用之設計。\n(五)增列第四款，為接軌國際禁止或限制使用有害環境物質，明文規範。\n(六)增列第五款，為提升營建廢棄物之循環，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、刪除第三項，配合修正條文第十四條及第十五條已分別明文，產品及營建工程強制實施綠色設計之相關規定，爰予刪除。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。"},{"bill":"202110209750000","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。"},{"bill":"202110206620000","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。"}],"changed":true,"final":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","finalWhy":"一、條次變更，本條為原第十二條移列。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。","review":null},{"no":"第十四條","current":null,"versions":[{"bill":"202110167180000","text":"產品符合前條第一項綠色設計準則，其製造、輸入業者得自願性向中央主管機關申請核定，並依核定事項據以執行。\n前項自願性實施綠色設計產品之申請資格、條件、應備文件、審查、核定事項、廢止、變更、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為鼓勵產品之製造、輸入業者自願性推動綠色設計，爰於第一項規定其產品可申請核定符合綠色設計。\n三、第二項授權中央主管機關訂定自願性實施產品綠色設計之辦法；如未依第一項核定事項辦理，將於授權辦法定明廢止其核定文件。"},{"bill":"202110174540000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於指定期限內向中央主管機關申請核定，並依核定事項據以執行。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，向中央主管機關申請核定，並依核定事項據以執行。\n第一項經指定應使用一定比率或數量再生粒（材）料之產品，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n前三項產品綠色設計核定之申請、應備文件、審查、核定事項、廢止、變更、資料備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，業者應於指定期限申請核定並據以執行。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定其產品得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制性實施產品綠色設計、自願實施產品綠色設計及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依第二項核定事項辦理，將於授權辦法定明廢止其核定文件。\n六、本條屬促進產品資源循環之管制措施，影響後端產品、國內外上下游供應鏈，屬全國一致性規範。"},{"bill":"202110204890000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，說明如下：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生料證明等內容。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。"},{"bill":"202110207060000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，說明如下：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生料證明等內容。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。"},{"bill":"202110207600000","text":"產品符合前條第一項綠色設計準則，其製造、輸入業者得自願性向中央主管機關申請核定，並依核定事項據以執行。\n前項自願性實施綠色設計產品之申請資格、條件、應備文件、審查、核定事項、廢止、變更、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為鼓勵產品之製造、輸入業者自願性推動綠色設計，爰於第一項規定其產品可申請核定符合綠色設計。\n三、第二項授權中央主管機關訂定自願性實施產品綠色設計之辦法；如未依第一項核定事項辦理，將於授權辦法定明廢止其核定文件。"},{"bill":"201110206460000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，說明如下：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生料證明等內容。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。"},{"bill":"202110209820000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，授權中央主管機關得公告特定產品強制實施綠色設計（例如使用單一材質、一定比率再生料、易維修設計等），並提送綠色設計文件（含符合情形評估與再生料證明）核定。未經公告者可自願申請，提報資料舉例：如再生料數量購買證明、國內外第三方驗證文件等。"},{"bill":"202110209800000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生料證明等內容。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。"},{"bill":"202110209750000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，說明如下：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生料證明等內容。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。"},{"bill":"202110206620000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，說明如下：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生料證明等內容。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。"}],"changed":true,"final":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則及發給循環標誌。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則及發給循環標誌。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料，經中央主管機關認可之驗證方式或機構查驗後，報中央主管機關備查。\n第一項、第二項之申請程序、綠色設計準則之性能規範與評估驗證機制、應遵循之原則項目、產品綠色設計文件應記載事項、審查、標誌、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，說明如下：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法定明依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生粒（材）料證明等內容。\n(四)為利辨識符合綠色設計準則之產品，並促進循環產品之採購及消費，爰定明中央主管機關得發給循環標誌。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計之評估驗證、遵循原則、標誌、申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。","review":null},{"no":"第十五條","current":"物品或其包裝、容器經食用或使用後，足以產生下列性質之一之一般廢棄物，致有嚴重污染環境之虞者，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作。\n一、不易清除、處理。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、具回收再利用之價值。\n前項物品或其包裝、容器及其應負回收、清除、處理責任之業者範圍，由中央主管機關公告之。","versions":[{"bill":"202110167180000","text":"經中央主管機關公告一定種類、規模之產品應遵行綠色設計準則指定項目者，其製造、輸入業者應於指定期限向中央主管機關申請核定，並依核定事項據以執行。\n前項公告產品經指定應遵行綠色設計準則之使用一定比率或數量再生粒（材）料，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n前二項符合綠色設計準則指定項目核定之申請、審查、核定事項、廢止、變更、資料備查方式與期限、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，業者應於指定期限申請核定並據以執行。\n三、為瞭解特定產品使用再生粒（材）料之情形，爰於第二項規定業者應提報相關資料送中央主管機關備查；其資料之提供範圍，得包括國內外第三方認驗證文件。\n四、第三項授權中央主管機關訂定強制性實施產品綠色設計及使用再生粒（材）料備查之辦法。\n五、本條屬促進產品資源循環之新興強制管制措施，影響後端產品、國內外上下游供應鏈，需踐行世界貿易組織（WTO）通報程序，屬全國一致性規範。"},{"bill":"202110174540000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"202110204890000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"202110207060000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"202110207600000","text":"經中央主管機關公告一定種類、規模之產品應遵行綠色設計準則指定項目者，其製造、輸入業者應於指定期限向中央主管機關申請核定，並依核定事項據以執行。\n前項公告產品經指定應遵行綠色設計準則之使用一定比率或數量再生粒（材）料，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n前二項符合綠色設計準則指定項目核定之申請、審查、核定事項、廢止、變更、資料備查方式與期限、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，業者應於指定期限申請核定並據以執行。\n三、為瞭解特定產品使用再生粒（材）料之情形，爰於第二項規定業者應提報相關資料送中央主管機關備查；其資料之提供範圍，得包括國內外第三方認驗證文件。\n四、第三項授權中央主管機關訂定強制性實施產品綠色設計及使用再生粒（材）料備查之辦法。\n五、本條屬促進產品資源循環之新興強制管制措施，影響後端產品、國內外上下游供應鏈，需踐行世界貿易組織（WTO）通報程序，屬全國一致性規範。"},{"bill":"201110206460000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"201110206460000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"202110209820000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、為提升營建廢棄物循環，授權中央主管機關得指定公告一定規模之營建工程強制實施綠色設計（如優先推動使用一定比率再生粒料、源頭現場分類等）。目的事業主管機關應配合檢討設計施工技術與作業規範以落實執行。"},{"bill":"202110209800000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"202110209750000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"202110206620000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"}],"changed":true,"final":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","finalWhy":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。","review":null},{"no":"第十六條","current":"依前條第二項公告之應負回收、清除、處理責任之業者（以下簡稱責任業者），應向主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費，作為資源回收管理基金，並應委託金融機構收支保管；其收支保管及運用辦法，由中央主管機關定之。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。\n第一項責任業者辦理登記、申報、繳費方式、流程、期限、扣抵、退費及其他應遵行事項之管理辦法，由中央主管機關會商中央目的事業主管機關定之。\n第一項之費率，由中央主管機關所設之資源回收費率審議委員會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告；資源回收費率審議委員會設置辦法，由中央主管機關定之。","versions":[{"bill":"202110167180000","text":"經中央主管機關公告一定規模以上之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段，遵行綠色設計準則指定項目。\n前項指定項目，由中央主管機關公告之。\n各工程中央目的事業主管機關應依第一項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，進而帶動民間企業施行，爰為第一項規定。\n三、第二項授權中央主管機關公告強制性實施綠色設計之營建工程規模及其項目。後續將依現行實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目。\n四、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第三項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"202110174540000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於指定期限內檢具包裝容器重複使用計畫送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具物品包裝容器重複使用計畫，送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n前二項物品包裝容器重複使用計畫應記載事項、應備文件、審查、核准事項、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等。且製造、輸入、販賣業者應依指定公告之目標及方式提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定物品包裝容器重複使用計畫核准、執行成果備查之相關管理規定。"},{"bill":"202110204890000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"202110207060000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"202110207600000","text":"經中央主管機關公告一定規模以上之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段，遵行綠色設計準則指定項目。\n前項指定項目，由中央主管機關公告之。\n各工程中央目的事業主管機關應依第一項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，進而帶動民間企業施行，爰為第一項規定。\n三、第二項授權中央主管機關公告強制性實施綠色設計之營建工程規模及其項目。後續將依現行實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目。\n四、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第三項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"201110206460000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110209820000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、參考歐盟規章，授權中央主管機關得公告特定物品或其包裝、容器強制重複使用（例如餐盒、飲料容器、清潔劑玻璃瓶等），業者須提出計畫與執行成果備查。未公告者亦得自願實施，並授權訂定相關核准與備查辦法。"},{"bill":"202110209800000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"202110209750000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"202110206620000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。"}],"changed":true,"final":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。","review":null},{"no":"第十六條之一","current":"第一項、第四項及第五項\n依前條第二項公告之應負回收、清除、處理責任之業者（以下簡稱責任業者），應向主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費，作為資源回收管理基金，並應委託金融機構收支保管；其收支保管及運用辦法，由中央主管機關定之。\n第一項責任業者辦理登記、申報、繳費方式、流程、期限、扣抵、退費及其他應遵行事項之管理辦法，由中央主管機關會商中央目的事業主管機關定之。\n第一項之費率，由中央主管機關所設之資源回收費率審議委員會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告；資源回收費率審議委員會設置辦法，由中央主管機關定之。","versions":[{"bill":"201110206460000","text":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。上開責任業者於妥善清理應回收廢棄物後，得檢附相關紀錄及證明文件向中央主管機關申請退費。\n前項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依第一項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項及前條第一項費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告。","note":"一、本條由第十六條第一項、第四項、第五項修正移列。\n二、第一項增訂再生能源發電設備業者繳納回收清除處理費之義務與其費率及計費基礎，並定明再生能源設備責任業者得申請退費之條件。\n三、第二項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n四、第三項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、第四項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十七條","current":"前條第一項之資源回收管理基金，應使用於下列用途：\n一、支付回收清除處理補貼。\n二、補助獎勵回收系統、再生利用。\n三、執行機關代清理費用。\n四、經中央主管機關評選委託之公正稽核認證團體，其執行稽核認證費用。\n五、其他經中央主管機關同意，與一般廢棄物資源回收有關之用途。","versions":[{"bill":"202110167180000","text":"中央主管機關得指定公告物品之包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於指定期限檢具包裝容器重複使用計畫送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n非屬前項公告之物品，其製造、輸入或販賣業者，得自願性檢具包裝容器重複使用計畫，送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n前二項包裝容器重複使用計畫應記載事項、應備文件、期限、審查、核准事項、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少包裝、容器於一次性使用後衍生廢棄物造成資源浪費，爰於第一項授權中央主管機關得指定公告特定物品之包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等。且經指定物品之製造、輸入、販賣業者應依公告之目標及方式提出重複使用計畫報核准，並提送執行成果報備查。\n三、為使自願性實施包裝、容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定包裝容器重複使用計畫、執行成果備查之相關管理規定。"},{"bill":"202110174540000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於指定期限內檢具減量計畫送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、應備文件、審查、核准事項、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標及方式提出減量計畫及提送執行成果。\n三、第二項授權中央主管機關訂定減量計畫核准、執行成果備查之相關管理規定。"},{"bill":"202110204890000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標、方式及期限提出減量計畫及提送執行成果。\n三、第二項授權中央主管機關訂定減量計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"202110207060000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標、方式及期限提出減量計畫及提送執行成果。\n三、第二項授權中央主管機關訂定減量計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"202110207600000","text":"中央主管機關得指定公告物品之包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於指定期限檢具包裝容器重複使用計畫送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n非屬前項公告之物品，其製造、輸入或販賣業者，得自願性檢具包裝容器重複使用計畫，送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n前二項包裝容器重複使用計畫應記載事項、應備文件、期限、審查、核准事項、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少包裝、容器於一次性使用後衍生廢棄物造成資源浪費，爰於第一項授權中央主管機關得指定公告特定物品之包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等。且經指定物品之製造、輸入、販賣業者應依公告之目標及方式提出重複使用計畫報核准，並提送執行成果報備查。\n三、為使自願性實施包裝、容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定包裝容器重複使用計畫、執行成果備查之相關管理規定。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標、方式及期限提出減量計畫及提送執行成果。\n三、第二項授權中央主管機關訂定減量計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"201110206460000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將現行第一款移列第一項，列為信託基金用途。\n二、現行第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。"},{"bill":"202110209820000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、授權中央主管機關得指定特定事業強制實施物品或包裝容器之減量措施（例如量販店與旅宿業減少一次性物品，或機關學校減少免洗餐具及瓶裝水等），業者須提具減量計畫及執行成果備查，並授權訂定相關辦法。"},{"bill":"202110209800000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標、方式及期限提出減量計畫及提送執行成果。\n三、第二項授權中央主管機關訂定減量計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"202110209750000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標、方式及期限提出減量計畫及提送執行成果。\n三、第二項授權中央主管機關訂定減量計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"202110206620000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標、方式及期限提出減量計畫及提送執行成果。\n三、第二項授權中央主管機關訂定減量計畫核准、執行成果備查等相關事項之辦法。"}],"changed":true,"final":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具減量計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標、方式及期限提出減量計畫及提送執行成果。\n三、為使自願實施物品包裝容器減量措施之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定減量計畫核准、執行成果備查等相關事項之辦法。","review":null},{"no":"第十八條","current":"中央主管機關得公告指定公私場所限制或禁止使用經中央主管機關指定公告之物品、包裝或容器。\n前項物品、包裝或容器之材質、規格、限制或禁止使用方式，由中央主管機關會商中央目的事業主管機關定之。","versions":[{"bill":"202110167180000","text":"中央主管機關得指定公告事業及物品或其包裝、容器減量目標、方式，事業應於指定期限檢具減量計畫送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、應備文件、期限、審查、核准事項、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依公告目標及方式提出減量計畫報核准，並提送執行成果報備查。\n三、第二項授權中央主管機關訂定減量計畫、執行成果備查之相關管理規定。"},{"bill":"202110174540000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關得禁止或限制製造、輸入、販賣、使用；其製造、輸入、販賣、使用業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器之業者範圍、材質、規格、原料、禁止或限制之方式、資料備查、管理及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，擬訂加嚴之管制措施及管理規定，報請中央主管機關核定之。\n物品或其包裝、容器不符合第二項公告或前項加嚴管制措施及管理規定，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)為瞭解禁止或限制製造、輸入、販賣、使用之實際執行情形，於序文規範業者應提送產品產銷過程相關資料報備查。\n(二)於各款定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系效率或效益。\n三、第二項授權中央主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n四、新增第三項，除禁用規定外，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，就特定事項擬訂加嚴管制措施及管理規定。\n五、新增第四項，為強化實務作為，定明直轄市、縣（市）主管機關得作成令業者為產品下架等處分。"},{"bill":"202110204890000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關得禁止或限制製造、輸入、販賣、使用；經限制製造、輸入、販賣或使用者，其製造、輸入、販賣或使用業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器禁止、限制之方式與範圍、各款所定情形之認定、資料備查及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，訂定較前項公告更加嚴格之自治法規或管制措施，報請中央主管機關核定。\n物品或其包裝、容器不符合第二項公告、前項自治法規或管制措施，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)為瞭解限制製造、輸入、販賣、使用之實際執行情形，於序文規範業者應提送產品產銷過程相關資料報中央主管機關備查。\n(二)於各款定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系效率或效益。\n三、第二項授權中央主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n四、增訂第三項，除禁用規定外，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，就特定事項擬訂加嚴管制自治法規或管制措施，報請中央主管機關核定。\n五、增訂第四項，為強化實務作為，定明直轄市、縣（市）主管機關得就不符合第二項、第三項規定之物品或其包裝、容器作成令業者為產品下架等處分。以現行實務運作為例，乾電池限制重金屬含量超標下架作業，由核發確認文件之地方主管機關命製造、輸入業者下架回收。"},{"bill":"202110207060000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關得禁止或限制製造、輸入、販賣、使用；經限制製造、輸入、販賣或使用者，其製造、輸入、販賣或使用業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器禁止、限制之方式與範圍、各款所定情形之認定、資料備查及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，訂定較前項公告更加嚴格之自治法規或管制措施，報請中央主管機關核定。\n物品或其包裝、容器不符合第二項公告、前項自治法規或管制措施，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)為瞭解限制製造、輸入、販賣、使用之實際執行情形，於序文規範業者應提送產品產銷過程相關資料報中央主管機關備查。\n(二)於各款定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系效率或效益。\n三、第二項授權中央主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n四、增訂第三項，除禁用規定外，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，就特定事項擬訂加嚴管制自治法規或管制措施，報請中央主管機關核定。\n五、增訂第四項，為強化實務作為，定明直轄市、縣（市）主管機關得就不符合第二項、第三項規定之物品或其包裝、容器作成令業者為產品下架等處分。以現行實務運作為例，乾電池限制重金屬含量超標下架作業，由核發確認文件之地方主管機關命製造、輸入業者下架回收。"},{"bill":"202110207600000","text":"中央主管機關得指定公告事業及物品或其包裝、容器減量目標、方式，事業應於指定期限檢具減量計畫送中央主管機關核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、應備文件、期限、審查、核准事項、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依公告目標及方式提出減量計畫報核准，並提送執行成果報備查。\n三、第二項授權中央主管機關訂定減量計畫、執行成果備查之相關管理規定。"},{"bill":"201110206460000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關得禁止或限制製造、輸入、販賣、使用；經限制製造、輸入、販賣或使用者，其製造、輸入、販賣或使用業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器禁止、限制之方式與範圍、各款所定情形之認定、資料備查及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，訂定較前項公告更加嚴格之自治法規或管制措施，報請中央主管機關核定。\n物品或其包裝、容器不符合第二項公告、前項自治法規或管制措施，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)為瞭解限制製造、輸入、販賣、使用之實際執行情形，於序文規範業者應提送產品產銷過程相關資料報中央主管機關備查。\n(二)於各款定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系效率或效益。\n三、第二項授權中央主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n四、增訂第三項，除禁用規定外，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，就特定事項擬訂加嚴管制自治法規或管制措施，報請中央主管機關核定。\n五、增訂第四項，為強化實務作為，定明直轄市、縣（市）主管機關得就不符合第二項、第三項規定之物品或其包裝、容器作成令業者為產品下架等處分。以現行實務運作為例，乾電池限制重金屬含量超標下架作業，由核發確認文件之地方主管機關命製造、輸入業者下架回收。"},{"bill":"201110206460000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"},{"bill":"202110209820000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關得禁止或限制製造、輸入、販賣、使用；經限制製造、輸入、販賣或使用者，其製造、輸入、販賣或使用業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器禁止、限制之方式與範圍、各款所定情形之認定、資料備查及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，訂定較前項公告更加嚴格之自治法規或管制措施，報請中央主管機關核定。\n物品或其包裝、容器不符合第二項公告、前項自治法規或管制措施，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條，明定物品或其包裝具過度耗能、含有害物質或干擾回收體系（指材質或成分會破壞、妨礙或降低整體回收效率）等情形時，得禁限其製造、輸入、販賣或使用，並要求業者提送資料備查。明定地方得命違規產品下架處置（例如乾電池重金屬超標下架作業）。"},{"bill":"202110209800000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關得禁止或限制製造、輸入、販賣、使用；經限制製造、輸入、販賣或使用者，其製造、輸入、販賣或使用業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器禁止、限制之方式與範圍、各款所定情形之認定、資料備查及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，訂定較前項公告更加嚴格之自治法規或管制措施，報請中央主管機關核定。\n物品或其包裝、容器不符合第二項公告、前項自治法規或管制措施，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)為瞭解限制製造、輸入、販賣、使用之實際執行情形，於序文規範業者應提送產品產銷過程相關資料報中央主管機關備查。\n(二)於各款定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系效率或效益。\n三、第二項授權中央主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n四、增訂第三項，除禁用規定外，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，就特定事項擬訂加嚴管制自治法規或管制措施，報請中央主管機關核定。\n五、增訂第四項，為強化實務作為，定明直轄市、縣（市）主管機關得就不符合第二項、第三項規定之物品或其包裝、容器作成令業者為產品下架等處分。以現行實務運作為例，乾電池限制重金屬含量超標下架作業，由核發確認文件之地方主管機關命製造、輸入業者下架回收。"},{"bill":"202110209750000","text":"物 、輸入、販賣、使用；經限制製造、輸入、販賣或使用者，其製造、輸入、販賣或使用業者應定期提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器禁止、限制之方式與範圍、各款所定情形之認定、資料備查及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，訂定較前項公告更加嚴格之自治法規或管制措施，報請中央主管機關核定。\n物品或其包裝、容器不符合第二項公告、前項自治法規或管制措施，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","finalWhy":"一、條次變更，本條為原第十三條移列。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)為瞭解限制製造、輸入、販賣、使用之實際執行情形，於序文規範業者應定期提送產品產銷過程相關資料報中央主管機關備查。\n(二)於各款定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系效率或效益。\n三、第二項授權中央主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器範圍、資料備查之相關管理規定。\n四、增訂第三項，除禁用規定外，定明直轄市、縣（市）主管機關得考量環境治理條件差異等因素，就特定事項擬訂加嚴自治法規或管制措施，報請中央主管機關核定。\n五、增訂第四項，為強化實務作為，定明直轄市、縣（市）主管機關得就不符合第二項、第三項規定之物品或其包裝、容器，作成令業者為產品下架等處分。以現行實務運作為例，乾電池限制重金屬含量超標下架作業，由核發確認文件之地方主管機關命製造、輸入業者下架回收。","review":null},{"no":"第十九條","current":"中央主管機關得公告指定公私場所限制或禁止使用經中央主管機關指定公告之物品、包裝或容器。\n前項物品、包裝或容器之材質、規格、限制或禁止使用方式，由中央主管機關會商中央目的事業主管機關定之。","versions":[{"bill":"202110167180000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關或中央目的事業主管機關得禁止或限制製造、輸入、販賣、使用：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n指定業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，送主管機關或目的事業主管機關備查。\n前二項物品或其包裝、容器之業者範圍、材質、規格、原料、限制或禁止之方式、資料備查、管理及其他應遵行事項，由中央主管機關或中央目的事業主管機關公告之。\n物品或其包裝、容器不符合前項公告規定，主管機關或目的事業主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。\n直轄市、縣（市）主管機關得視環境治理條件差異，擬訂加嚴之管制措施，報中央主管機關或中央目的事業主管機關核定後公告之。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(二)考量農政機關主管的農膜或漁網，可能含長期不易腐化或有害物質成分（如聚氯乙烯），爰賦予中央目的事業主管機關管理之法源依據，得依實務需求可予以管制。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系的效率或效益。\n三、為瞭解禁止或限制製造、輸入、販賣、使用之實際執行情形，新增第二項規範業者應提送產品產銷過程相關資料報備查。\n四、現行第二項修正移列至第三項，授權中央主管機關或中央目的事業主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n五、新增第四項，定明中央主管機關或中央目的事業主管機關得為產品下架等強制處分。\n六、新增第五項，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，例如人口結構差異、在地產業特性，加嚴相關管制措施。"},{"bill":"202110174540000","text":"中央主管機關得指定公告物品之運輸、陳列或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、販賣業者應於指定期限內檢具減量計畫送中央主管機關核准，依核准事項據以執行，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、應備文件、審查、核准事項、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。\n輸入業者輸入第一項指定物品或與其效能相同或相似之物品，其銷售應符合第一項規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸、陳列及販賣過程，應避免過度包裝，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。且為利中央主管機關瞭解包裝減量之執行情形，課予業者提送執行成果備查之義務。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、新增第二項，授權中央主管機關訂定包裝減量之相關管理規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售。"},{"bill":"202110204890000","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。"},{"bill":"202110207060000","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。"},{"bill":"202110207600000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關或中央目的事業主管機關得禁止或限制製造、輸入、販賣、使用：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n指定業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，送主管機關或目的事業主管機關備查。\n前二項物品或其包裝、容器之業者範圍、材質、規格、原料、限制或禁止之方式、資料備查、管理及其他應遵行事項，由中央主管機關或中央目的事業主管機關公告之。\n物品或其包裝、容器不符合前項公告規定，主管機關或目的事業主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。\n直轄市、縣（市）主管機關得視環境治理條件差異，擬訂加嚴之管制措施，報中央主管機關或中央目的事業主管機關核定後公告之。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(二)考量農政機關主管的農膜或漁網，可能含長期不易腐化或有害物質成分（如聚氯乙烯），爰賦予中央目的事業主管機關管理之法源依據，得依實務需求可予以管制。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系的效率或效益。\n三、為瞭解禁止或限制製造、輸入、販賣、使用之實際執行情形，新增第二項規範業者應提送產品產銷過程相關資料報備查。\n四、現行第二項修正移列至第三項，授權中央主管機關或中央目的事業主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n五、新增第四項，定明中央主管機關或中央目的事業主管機關得為產品下架等強制處分。\n六、新增第五項，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，例如人口結構差異、在地產業特性，加嚴相關管制措施。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。"},{"bill":"202110209820000","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、避免物品過度包裝，授權中央主管機關得公告特定物品（例如禮盒、產品組合或非組合包裝等）實施運輸與販賣包裝減量。增訂業者須提送減量成果報告備查，輸入業者銷售時亦須符合規定，並刪除會商程序文字。"},{"bill":"202110209800000","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。"},{"bill":"202110209750000","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。"},{"bill":"202110206620000","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。"}],"changed":true,"final":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","finalWhy":"一、條次變更，本條為原第十四條移列。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。","review":null},{"no":"第二十條","current":"為減少廢棄物產生，減輕環境負荷，產品之生產及銷售，應避免過度包裝，中央主管機關得會商中央目的事業主管機關公告指定事業自指定期限起，限制其經指定產品之包裝空間比例、層數、使用材質之種類及數量。\n輸入業者輸入前項指定產品或與其效能相同或相似之產品，於販賣時應符合前項規定。","versions":[{"bill":"202110167180000","text":"中央主管機關得指定公告物品之運輸、陳列或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量。\n前項物品或其包裝之製造、輸入或販賣業者，應依減量目標提送執行成果報中央主管機關備查。\n前項業者範圍、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。\n輸入業者輸入第一項指定物品或與其效能相同或相似之物品，於販賣時應符合第一項規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸、陳列及販賣過程，應避免過度包裝，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，爰新增第二項，課予業者提送執行成果備查之義務。\n四、新增第三項，授權中央主管機關訂定包裝減量之相關管理規定。\n五、現行第二項遞移至第四項並酌修文字。"},{"bill":"202110174540000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣業者，應以下列指定方式提送執行成果報中央主管機關備查，並設置必要設施：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項物品延長使用執行成果備查、必要設施設置方式、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用相關事項之管理辦法。\n四、本條屬促進產品資源循環之管制措施，影響後端產品、國內外上下游供應鏈，屬全國一致性規範。"},{"bill":"202110204890000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用之必要設施設置、執行成果備查等相關事項之辦法。"},{"bill":"202110207060000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用之必要設施設置、執行成果備查等相關事項之辦法。"},{"bill":"202110207600000","text":"中央主管機關得指定公告物品之運輸、陳列或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量。\n前項物品或其包裝之製造、輸入或販賣業者，應依減量目標提送執行成果報中央主管機關備查。\n前項業者範圍、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。\n輸入業者輸入第一項指定物品或與其效能相同或相似之物品，於販賣時應符合第一項規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸、陳列及販賣過程，應避免過度包裝，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，爰新增第二項，課予業者提送執行成果備查之義務。\n四、新增第三項，授權中央主管機關訂定包裝減量之相關管理規定。\n五、現行第二項遞移至第四項並酌修文字。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用之必要設施設置、執行成果備查等相關事項之辦法。"},{"bill":"201110206460000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"202110209820000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、授權中央主管機關得公告物品延伸生產者責任，要求業者提供維修、租賃、回購、延長保固或重複填充內容物再製造等服務以延長物品壽命，並設置必要設施（例如蒐集設施）及提報執行成果，同時授權訂定相關管理辦法。"},{"bill":"202110209800000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用之必要設施設置、執行成果備查等相關事項之辦法。"},{"bill":"202110209750000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用之必要設施設置、執行成果備查等相關事項之辦法。"},{"bill":"202110206620000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用之必要設施設置、執行成果備查等相關事項之辦法。"}],"changed":true,"final":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用之必要設施設置、執行成果備查等相關事項之辦法。","review":null},{"no":"第二十一條","current":"物品或其包裝、容器有嚴重污染環境之虞者，中央主管機關得予以公告禁用或限制製造、輸入、販賣、使用。","versions":[{"bill":"202110167180000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入、販賣或提供使用業者應以下列指定方式提送執行成果報中央主管機關備查，並設置必要設施：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項物品延長使用執行成果備查、必要設施設置方式、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環利用，並應提報其執行成果。另所稱提供使用業者，例如租賃業者或提供產品使用服務之業者；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用相關事項之管理辦法。\n四、本條屬促進產品資源循環之新興強制管制措施，影響後端產品、國內外上下游供應鏈，需踐行世界貿易組織（WTO）通報程序，屬全國一致性規範。"},{"bill":"202110174540000","text":"下列產品、服務之製造、輸入、販賣、提供業者，得向中央主管機關申請使用循環標誌，經中央主管機關核准者，應依核准事項使用循環標誌於其產品、包裝或服務場所：\n一、循環產品：使用易於資源循環材質、一定比率再生材料或符合綠色設計準則等促進資源循環特性之產品。\n二、循環服務：提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務。\n前項循環標誌之申請、應備文件、審查、核准事項、標示、使用、變更、查核、抽樣檢驗、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n未經中央主管機關核准使用循環標誌之產品或服務，其產品製造、輸入、販賣或服務提供業者，不得擅自使用、變造或不當使用第一項之循環標誌。","note":"一、本條新增。\n二、為提升循環產品或循環服務之市場普及率及競爭力，並避免漂綠行為發生，以達到資源循環推動目的，爰增訂循環標誌核准使用及審查機制。\n三、第一項定明由循環產品或循環服務之相關業者得申請使用循環標誌；其標示方式得以數位化方式為之。其所指循環產品，例如：符合綠色設計準則產品、回收海洋廢棄物再製手機殼、蚵殼拖鞋等各種產品及二手品等；所指循環服務，例如：協助從事提供包裝、容器租借及清洗、物品維修、交換等有利於提升資源共享及延長物品、包裝、容器使用壽命等。\n四、第二項授權由中央主管機關訂定有關循環標誌管理事項之辦法，以健全管理機制。\n五、第三項定明禁止行為。"},{"bill":"202110204890000","text":"製造、輸入、販賣、提供下列產品、服務之業者，得向中央主管機關申請核准使用循環標誌，並應依核准事項使用循環標誌於其產品、包裝或服務場所：\n一、循環產品：使用易於資源循環材質、一定比率再生材料或符合綠色設計準則等促進資源循環特性之產品。\n二、循環服務：提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務。\n前項循環標誌使用之申請條件、應備文件、審查、核准事項、使用與標示之管理、變更、查核、抽樣檢驗、廢止及其他應遵行事項之辦法，由中央主管機關定之。\n未經中央主管機關核准使用循環標誌之產品或服務，其產品製造、輸入、販賣或服務提供業者，不得擅自使用、變造或不當使用第一項之循環標誌。","note":"一、本條新增。\n二、為提升循環產品或循環服務之市場普及率及競爭力，並避免漂綠行為發生，以達到資源循環推動目的，爰增訂循環標誌核准使用及審查機制。\n三、第一項定明由循環產品或循環服務之相關業者得申請使用循環標誌；其標示方式得以數位化方式為之。第一款所定循環產品，例如：符合綠色設計準則產品、回收海洋廢棄物再製手機殼、蚵殼拖鞋等各種產品及二手品等；第二款所定循環服務，例如：協助從事提供包裝、容器租借及清洗、物品維修、交換等有利於提升資源共享及延長物品、包裝、容器使用壽命等。\n四、第二項授權由中央主管機關訂定有關循環標誌申請使用、標示等管理事項之辦法，以健全管理機制。\n五、第三項定明禁止使用循環標誌之情形。"},{"bill":"202110207060000","text":"製造、輸入、販賣、提供下列產品、服務之業者，得向中央主管機關申請核准使用循環標誌，並應依核准事項使用循環標誌於其產品、包裝或服務場所：\n一、循環產品：使用易於資源循環材質、一定比率再生材料或符合綠色設計準則等促進資源循環特性之產品。\n二、循環服務：提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務。\n前項循環標誌使用之申請條件、應備文件、審查、核准事項、使用與標示之管理、變更、查核、抽樣檢驗、廢止及其他應遵行事項之辦法，由中央主管機關定之。\n未經中央主管機關核准使用循環標誌之產品或服務，其產品製造、輸入、販賣或服務提供業者，不得擅自使用、變造或不當使用第一項之循環標誌。","note":"一、本條新增。\n二、為提升循環產品或循環服務之市場普及率及競爭力，並避免漂綠行為發生，以達到資源循環推動目的，爰增訂循環標誌核准使用及審查機制。\n三、第一項定明由循環產品或循環服務之相關業者得申請使用循環標誌；其標示方式得以數位化方式為之。第一款所定循環產品，例如：符合綠色設計準則產品、回收海洋廢棄物再製手機殼、蚵殼拖鞋等各種產品及二手品等；第二款所定循環服務，例如：協助從事提供包裝、容器租借及清洗、物品維修、交換等有利於提升資源共享及延長物品、包裝、容器使用壽命等。\n四、第二項授權由中央主管機關訂定有關循環標誌申請使用、標示等管理事項之辦法，以健全管理機制。\n五、第三項定明禁止使用循環標誌之情形。"},{"bill":"202110207600000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入、販賣或提供使用業者應以下列指定方式提送執行成果報中央主管機關備查，並設置必要設施：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項物品延長使用執行成果備查、必要設施設置方式、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環利 條","current":"事業經中央主管機關公告指定後，應自指定期限起，遵行經指定之下列事項：\n一、回收再生資源之種類及回收方式。\n二、產品標示使用之材質及再生資源比例。\n三、產品標示分類回收標誌。\n四、其他經中央主管機關會商中央目的事業主管機關指定之事項。\n前項事業之業別、指定期限及其他應遵行事項等，由中央主管機關會商中央目的事業主管機關定之。\n輸入業者輸入與第一項業別生產製造之效能相同或相似之產品，於販賣時應依第一項規定辦理。","versions":[{"bill":"202110167180000","text":"製造、輸入、販賣、提供下列產品或服務之事業，得向中央主管機關申請使用循環標誌，經中央主管機關核准者，應依核准事項使用循環標誌於其產品、包裝或服務場所：\n一、循環產品：使用易於循環利用材質、一定比率再生材料或符合綠色設計準則等促進資源循環特性之產品。\n二、循環服務：提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務。\n前項循環產品及循環服務之申請、應備文件、審查、核准、標示、使用、變更、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n未經中央主管機關核准使用循環標誌之產品或服務，其產品製造、輸入、販賣或服務提供業者不得擅自使用、變造或不當使用第一項之標誌。","note":"一、本條新增。\n二、為提升循環產品或循環服務之市場普及率及競爭力，並避免漂綠行為發生，以達到資源循環推動目的，爰增訂循環標誌核准使用及審查機制。\n三、第一項定明由循環產品或循環服務之相關業者得申請使用循環標誌；其標示方式得以數位化方式為之。其所指循環產品，例如：符合綠色設計準則產品、回收海洋廢棄物再製手機殼、蚵殼拖鞋等各種產品及二手品等；所指循環服務，例如：協助從事提供包裝、容器租借及清洗、物品維修、交換等有利於提升資源共享及延長物品、包裝、容器使用壽命等。\n四、第二項授權由中央主管機關訂定有關循環產品、循環服務及循環標誌管理事項之辦法，以健全管理機制。\n五、第三項定明禁止行為。"},{"bill":"202110174540000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應於指定期限內以指定方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、標誌圖樣、揭露及標示內容與方式、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性評估，其性質與條文修正後僅規範資訊揭露之義務不同，爰刪除第一款。\n(二)第二款移列第一款並酌修文字。\n(三)增訂第二款，規範標示包裝材質及重，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修手冊等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。其他指定事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定產品資訊揭露之相關管理規定。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。\n六、本條屬促進產品資源循環之管制措施，影響後端產品、國內外上下游供應鏈，屬全國一致性規範。"},{"bill":"202110204890000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰刪除第一款。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。"},{"bill":"202110207060000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰刪除第一款。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。"},{"bill":"202110207600000","text":"製造、輸入、販賣、提供下列產品或服務之事業，得向中央主管機關申請使用循環標誌，經中央主管機關核准者，應依核准事項使用循環標誌於其產品、包裝或服務場所：\n一、循環產品：使用易於循環利用材質、一定比率再生材料或符合綠色設計準則等促進資源循環特性之產品。\n二、循環服務：提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務。\n前項循環產品及循環服務之申請、應備文件、審查、核准、標示、使用、變更、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n未經中央主管機關核准使用循環標誌之產品或服務，其產品製造、輸入、販賣或服務提供業者不得擅自使用、變造或不當使用第一項之標誌。","note":"一、本條新增。\n二、為提升循環產品或循環服務之市場普及率及競爭力，並避免漂綠行為發生，以達到資源循環推動目的，爰增訂循環標誌核准使用及審查機制。\n三、第一項定明由循環產品或循環服務之相關業者得申請使用循環標誌；其標示方式得以數位化方式為之。其所指循環產品，例如：符合綠色設計準則產品、回收海洋廢棄物再製手機殼、蚵殼拖鞋等各種產品及二手品等；所指循環服務，例如：協助從事提供包裝、容器租借及清洗、物品維修、交換等有利於提升資源共享及延長物品、包裝、容器使用壽命等。\n四、第二項授權由中央主管機關訂定有關循環產品、循環服務及循環標誌管理事項之辦法，以健全管理機制。\n五、第三項定明禁止行為。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰刪除第一款。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。"},{"bill":"202110209820000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，授權中央主管機關得公告要求業者揭露產品材質、包裝、可維修性及回收方式等資訊，或要求揭露特定有害或需關注物質成分及比率（如參考歐盟電池法揭露多氯三聯苯、石綿纖維等）。\n三、增訂非公告對象得自願揭露資訊，並授權中央主管機關訂定相關管理辦法。"},{"bill":"202110209800000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)刪除第一款，考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰予刪除。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、增訂第二項，使自願實施產品數位化資訊揭露之業者有所依循。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、刪除第三項，考量第一項已納入輸入業者，無需就輸入產品另為規範，爰予刪除。"},{"bill":"202110209750000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰刪除第一款。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。"},{"bill":"202110206620000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰刪除第一款。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。"}],"changed":true,"final":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式，揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、使用具唯一產品識別碼者，應動態更新流向追溯及品質驗證資訊。\n七、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、標誌圖樣、揭露及標示內容與方式、管理及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、條次變更，本條為原第十一條移列。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰刪除第一款。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)增訂第六款，規範使用唯一產品識別碼者，應動態更新產品資訊。\n(八)第四款移列修正為第七款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維(Asbestos fiber)等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。","review":null},{"no":"第二十三條","current":"事業經中央主管機關公告指定後，應自指定期限起，遵行經指定之下列事項：\n一、回收再生資源之種類及回收方式。\n二、產品標示使用之材質及再生資源比例。\n三、產品標示分類回收標誌。\n四、其他經中央主管機關會商中央目的事業主管機關指定之事項。\n前項事業之業別、指定期限及其他應遵行事項等，由中央主管機關會商中央目的事業主管機關定之。\n輸入業者輸入與第一項業別生產製造之效能相同或相似之產品，於販賣時應依第一項規定辦理。","versions":[{"bill":"202110167180000","text":"中央主管機關得指定公告物品及其包裝、容器，其製造、輸入或販賣業者應以數位化方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項公告之物品及其包裝、容器，其製造、輸入或販賣業者，得自願性揭露及標示前項各款資訊。\n前二項物品及其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、標誌圖樣、揭露及標示內容與方式、管理及其他應遵行事項之辦法，由中央主管機關定之。\n製造、輸入、販賣業者不得擅自使用、變造或不當使用第一項第五款之標誌。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環利用之產品，參酌歐盟永續產品生態設計規範（ESPR）有關產品數位護照制度，爰修正第一項課予業者應以數位化方式揭露其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性評估，其性質與條文修正後僅規範資訊揭露之義務不同，爰刪除第一款。\n(二)第二款移列第一款並酌修文字。\n(三)增訂第二款，規範標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修手冊等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環利用。\n(六)第三款移列為第五款並酌修文字。\n(七)第四款移列修正為第七款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。其他指定事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願性實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、現行第二項修正移列第三項，授權中央主管機關訂定產品資訊揭露之相關管理規定。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除現行第三項。\n六、新增第四項禁止規定，以避免漂綠行為發生。\n七、本條屬促進產品資源循環之新興強制管制措施，影響後端產品、國內外上下游供應鏈，需踐行世界貿易組織（WTO）通報程序，屬全國一致性規範。"},{"bill":"202110174540000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權，經中央主管機關審查通過後，應依規定標示於產品、包裝或服務場所。\n前項取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請、應備文件、審查、分類、標示、使用、變更、查核、抽樣檢驗、廢止、資料提報、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由產品、服務符合規格標準之相關業者自願申請，經審查通過後，依規定標示。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之相關管理規定，以健全管理機制。"},{"bill":"202110204890000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請條件、應備文件、審查、分類、標示、使用、管理、變更、查核、抽樣檢驗、廢止、資料提報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由製造、輸入、販賣產品或提供服務業者得自願申請環保標章使用權，經審查通過後，即應標示環保標章。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之申請、使用、管理等相關事項之辦法，以健全管理機制。"},{"bill":"202110207060000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請條件、應備文件、審查、分類、標示、使用、管理、變更、查核、抽樣檢驗、廢止、資料提報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由製造、輸入、販賣產品或提供服務業者得自願申請環保標章使用權，經審查通過後，即應標示環保標章。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之申請、使用、管理等相關事項之辦法，以健全管理機制。"},{"bill":"202110207600000","text":"中央主管機關得指定公告物品及其包裝、容器，其製造、輸入或販賣業者應以數位化方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項公告之物品及其包裝、容器，其製造、輸入或販賣業者，得自願性揭露及標示前項各款資訊。\n前二項物品及其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、標誌圖樣、揭露及標示內容與方式、管理及其他應遵行事項之辦法，由中央主管機關定之。\n製造、輸入、販賣業者不得擅自使用、變造或不當使用第一項第五款之標誌。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環利用之產品，參酌歐盟永續產品生態設計規範（ESPR）有關產品數位護照制度，爰修正第一項課予業者應以數位化方式揭露其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性評估，其性質與條文修正後僅規範資訊揭露之義務不同，爰刪除第一款。\n(二)第二款移列第一款並酌修文字。\n(三)增訂第二款，規範標示包裝材質及重，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修手冊等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環利用。\n(六)第三款移列為第五款並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。其他指定事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願性實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、現行第二項修正移列第三項，授權中央主管機關訂定產品資訊揭露之相關管理規定。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除現行第三項。\n六、新增第四項禁止規定，以避免漂綠行為發生。\n七、本條屬促進產品資源循環之新興強制管制措施，影響後端產品、國內外上下游供應鏈，需踐行世界貿易組織（WTO）通報程序，屬全國一致性規範。"},{"bill":"201110206460000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請條件、應備文件、審查、分類、標示、使用、管理、變更、查核、抽樣檢驗、廢止、資料提報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由製造、輸入、販賣產品或提供服務業者得自願申請環保標章使用權，經審查通過後，即應標示環保標章。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之申請、使用、管理等相關事項之辦法，以健全管理機制。"},{"bill":"202110209820000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請條件、應備文件、審查、分類、標示、使用、管理、變更、查核、抽樣檢驗、廢止、資料提報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、明定業者可自願申請標章，獲准後應依規標示並提報產銷資料供查核。授權中央主管機關抽樣檢驗及訂定標章管理辦法以確保公信力。"},{"bill":"202110209800000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請條件、應備文件、審查、分類、標示、使用、管理、變更、查核、抽樣檢驗、廢止、資料提報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由製造、輸入、販賣產品或提供服務業者得自願申請環保標章使用權，經審查通過後，即應標示環保標章。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之申請、使用、管理等相關事項之辦法，以健全管理機制。"},{"bill":"202110209750000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請條件、應備文件、審查、分類、標示、使用、管理、變更、查核、抽樣檢驗、廢止、資料提報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由製造、輸入、販賣產品或提供服務業者得自願申請環保標章使用權，經審查通過後，即應標示環保標章。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之申請、使用、管理等相關事項之辦法，以健全管理機制。"},{"bill":"202110206620000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項
