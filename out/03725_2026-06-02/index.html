<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>資源循環推動法全文修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","note":"一、條次變更。\n二、序文配合現行法制體例酌作文字修正。\n三、配合本法由原「回收再利用」擴及整體資源循環，爰將第一款及第二款「回收再利用」修正為「循環利用」。"},{"bill":"202110174540000","text":"本法用詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","note":"一、條次變更。\n二、序文酌作文字修正。\n三、配合本法由原「回收再利用」擴及整體資源循環，爰將第一款及第二款「回收再利用」修正為「循環利用」。"},{"bill":"202110204890000","text":"本法用詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","note":"一、條次變更。\n二、序文酌作文字修正。\n三、配合本法由原「回收再利用」擴及整體資源循環，爰將第一款及第二款「回收再利用」修正為「循環利用」。"},{"bill":"202110207060000","text":"本法用詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","note":"一、條次變更。\n二、序文酌作文字修正。\n三、配合本法由原「回收再利用」擴及整體資源循環，爰將第一款及第二款「回收再利用」修正為「循環利用」。"},{"bill":"202110207600000","text":"本法用詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途， ":"本法用詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","note":"一、條次變更。\n二、序文酌作文字修正。\n三、配合本法由原「回收再利用」擴及整體資源循環，爰將第一款及第二款「回收再利用」修正為「循環利用」。"}],"changed":true,"final":"本法用詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","finalWhy":"一、條次變更，本條為原第二條移列。\n二、序文酌作文字修正。\n三、配合本法由原「回收再利用」擴及整體資源循環，爰將第一款及第二款「回收再利用」修正為「循環利用」。","review":null},{"no":"第四條","current":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用，能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益之廢棄物利用方式者，不在此限。","versions":[{"bill":"202110167180000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。"},{"bill":"202110174540000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"},{"bill":"202110204890000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"},{"bill":"202110207060000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"},{"bill":"202110207600000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。"},{"bill":"201110206460000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"},{"bill":"201110206460000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110209820000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、廢棄物管理回歸《廢棄物清理法》規範。\n三、所稱「能源回收」，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、宣示物質使用優先順序，促進各界共同推動資源循環。"},{"bill":"202110209800000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"},{"bill":"202110209750000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"},{"bill":"202110206620000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"}],"changed":true,"final":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","finalWhy":"一、條次變更，本條為原第六條移列。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。","review":null},{"no":"第五條","current":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源回收再利用。\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行回收再利用，或供回收再利用，無法回收再利用者應負責妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提昇產品耐用年限，及落實修繕服務，以抑制該物品、容器成為廢棄物，並且應朝促使該產品利於回收再利用之方向進行產品之研發、設計，及標示材質種類。","versions":[{"bill":"202110167180000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環利用：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行循環利用或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於循環利用之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文、第三款及第四款用語為「資源循環利用」「回收再利用」修正為「循環利用」，並酌作文字修正。\n三、依第四條物質使用優先順序規定，於第三款新增「進行能源回收」，以符實務需求。"},{"bill":"202110174540000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供資源循環；無法資源循環者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文、第三款及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、依前條物質使用優先順序規定，於第三款新增「進行能源回收」，以符實務需求。"},{"bill":"202110204890000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。"},{"bill":"202110207060000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。"},{"bill":"202110207600000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環利用：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行循環利用或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於循環利用之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文、第三款及第四款用語為「資源循環利用」「回收再利用」修正為「循環利用」，並酌作文字修正。\n三、依第四條物質使用優先順序規定，於第三款新增「進行能源回收」，以符實務需求。"},{"bill":"201110206460000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。"},{"bill":"202110209820000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合修法擴及整體資源循環，將相關條文之「回收再利用」修正為「資源循環」或「循環利用」；並依前條物質使用優先順序，新增「進行能源回收」以符實務。"},{"bill":"202110209800000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。"},{"bill":"202110209750000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。"},{"bill":"202110206620000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。"}],"changed":true,"final":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。\n五、從事網路交易平台服務提供者應訂定並執行相關管理機制，促使並引導利用其平台進行交易之事業或個人，落實包裝減量及促進資源循環。","finalWhy":"一、條次變更，本條為原第九條移列。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。\n四、增訂第五款，考量電子商務交易模式日益普及，網路交易平台對商品流通及包裝使用具有一定影響力，爰納入平台業者協力管理責任，以提升源頭減量推動效益，並強化循環經濟之實踐。","review":null},{"no":"第六條","current":"國民有其責任義務依循減少資源之消耗，抑制廢棄物之產生，及促進資源回收再利用之原則，儘可能延長用品之使用期限，配合使用再生製品及分類回收再生資源，藉此抑制製品成為廢棄物，並適當回收循環利用製品及再生資源。","versions":[{"bill":"202110167180000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"202110174540000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"202110204890000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"202110207060000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"202110207600000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"201110206460000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"202110209820000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、配合修法擴及整體資源循環，修正國民應配合事項並酌修文字。"},{"bill":"202110209800000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"202110209750000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"202110206620000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"}],"changed":true,"final":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","finalWhy":"一、條次變更，本條為原第十條移列。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。","review":null},{"no":"第七條","current":"主管機關應指定專責單位或人員，辦理再生資源回收再利用之政策制定、查核、宣導、訓練、輔導、評鑑及研究相關事宜；必要時，並得委託或委辦相關機關或機構辦理。\n目的事業主管機關得視實際需要指定專責單位或人員辦理前項所定相關工作；必要時，並得委託或委辦相關機關或機構辦理。","versions":[{"bill":"202110167180000","text":"主管機關及目的事業主管機關得委任所屬機關（構）、委託或委辦其他機關（構）、法人或團體，辦理本法規定之查核、審查、宣導、訓練、輔導、評鑑、獎勵、補助及研究相關事宜。","note":"一、條次變更。\n二、考量專責單位或人員之指定屬機關內部組織或事務分配，無須於作用法明文，爰刪除現行第一項、第二項前段規定。\n三、因應本法修正擴及整體資源循環面向，有整合公部門及民間資源協助辦理有關事項之必要，爰參考氣候變遷因應法第七條規定，整併及修正第一項、第二項後段規定，明定主管機關及目的事業主管機關得委任（託）、委辦之對象及事務範圍。"},{"bill":"202110167180000","text":"","note":"一、本條刪除。\n二、中央有關機關應推動資源循環及其權責事項規定、目的事業主管機關應辦理事項，已於修正條文第九條、第十條明文，爰予刪除。"},{"bill":"202110174540000","text":"主管機關及目的事業主管機關得委任所屬機關（構）、委託或委辦其他機關（構）、法人或團體，辦理本法規定之查核、審查、宣導、訓練、輔導、評鑑、獎勵、補助及研究相關事宜。","note":"一、條次變更。\n二、考量專責單位或人員之指定屬機關內部組織或事務分配，無須於作用法明文，爰刪除第一項前段、第二項規定。\n三、因應本法修正擴及整體資源循環面向，有整合公部門及民間資源協助辦理有關事項之必要，爰參考氣候變遷因應法第七條規定，整併及修正第一項、第二項後段規定，明定主管機關及目的事業主管機關得委任（託）、委辦之對象及事務範圍。"},{"bill":"202110174540000","text":"","note":"一、本條刪除。\n二、中央有關機關應推動資源循環及其權責事項規定應辦理事項，已於修正條文第九條明文，爰予刪除。"},{"bill":"202110204890000","text":"主管機關及目的事業主管機關得委任所屬機關（構）、委託或委辦其他機關（構）、法人或團體，辦理本法規定之查核、審查、宣導、訓練、輔導、評鑑、獎勵、補助及研究相關事宜。","note":"一、條次變更。\n二、考量專責單位或人員之指定屬機關內部組織或事務分配，無須於作用法明文，爰刪除第一項前段及第二項前段規定。\n三、因應本法修正擴及整體資源循環面向，有整合公部門及民間資源協助辦理有關事項之必要，爰參考氣候變遷因應法第七條規定，整併及修正第一項、第二項後段規定，明定主管機關及目的事業主管機關得委任（託）、委辦之對象及事務範圍。"},{"bill":"202 ，已於修正條文第九條明文，爰予刪除。"},{"bill":"202110209750000","text":"主管機關及目的事業主管機關得委任所屬機關（構）、委託或委辦其他機關（構）、法人或團體，辦理本法規定之查核、審查、宣導、訓練、輔導、評鑑、獎勵、補助及研究相關事宜。","note":"一、條次變更。\n二、考量專責單位或人員之指定屬機關內部組織或事務分配，無須於作用法明文，爰刪除第一項前段及第二項前段規定。\n三、因應本法修正擴及整體資源循環面向，有整合公部門及民間資源協助辦理有關事項之必要，爰參考氣候變遷因應法第七條規定，整併及修正第一項、第二項後段規定，明定主管機關及目的事業主管機關得委任（託）、委辦之對象及事務範圍。"},{"bill":"202110209750000","text":"","note":"一、本條刪除。\n二、中央有關機關應推動資源循環及其權責事項之應辦理事項，已於修正條文第九條明文，爰予刪除。"},{"bill":"202110206620000","text":"主管機關及目的事業主管機關得委任所屬機關（構）、委託或委辦其他機關（構）、法人或團體，辦理本法規定之查核、審查、宣導、訓練、輔導、評鑑、獎勵、補助及研究相關事宜。","note":"一、條次變更。\n二、考量專責單位或人員之指定屬機關內部組織或事務分配，無須於作用法明文，爰刪除第一項前段及第二項前段規定。\n三、因應本法修正擴及整體資源循環面向，有整合公部門及民間資源協助辦理有關事項之必要，爰參考氣候變遷因應法第七條規定，整併及修正第一項、第二項後段規定，明定主管機關及目的事業主管機關得委任（託）、委辦之對象及事務範圍。"},{"bill":"202110206620000","text":"","note":"一、本條刪除。\n二、中央有關機關應推動資源循環及其權責事項之應辦理事項，已於修正條文第九條明文，爰予刪除。"}],"changed":true,"final":"主管機關及目的事業主管機關得委任所屬機關（構）、委託或委辦其他機關（構）、法人或團體，辦理本法規定之查核、審查、宣導、訓練、輔導、評鑑、獎勵、補助及研究相關事宜。","finalWhy":"一、條次變更，本條為原第四條移列。\n二、考量專責單位或人員之指定屬機關內部組織或事務分配，無須於作用法明文，爰刪除第一項前段及第二項前段規定。\n三、因應本法修正擴及整體資源循環面向，有整合公部門及民間資源協助辦理有關事項之必要，爰參考氣候變遷因應法第七條規定，整併及修正第一項、第二項後段規定，定明主管機關及目的事業主管機關得委任（託）、委辦之對象及事務範圍。","review":null},{"no":"第八條","current":"主管機關及目的事業主管機關得自行或委託專業機構派員攜帶證明文件，進入事業或再生資源回收再利用之營運、工作或營業場所，檢查並要求提供有關資料。\n對於前項檢查及要求，相關業者不得規避、妨礙或拒絕。\n主管機關及目的事業主管機關委託專業機構單獨進行第一項檢查前，應將委託事項及依據公告之，並通知受檢場所。","versions":[{"bill":"202110167180000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併現行第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另修正條文第七條已含括行政檢查事務之權限移轉，其權限移轉程序回歸行政程序法規定辦理，爰刪除第一項、第三項委託專業機關檢查及程序規定。\n三、增訂第二項，定明相關機關、法人或團體協助或提供資料之義務。"},{"bill":"202110167180000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"202110174540000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關、法人或團體協助或提供資料之義務。"},{"bill":"202110174540000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"202110204890000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。"},{"bill":"202110204890000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"202110207060000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。"},{"bill":"202110207060000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"202110207600000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併現行第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另修正條文第七條已含括行政檢查事務之權限移轉，其權限移轉程序回歸行政程序法規定辦理，爰刪除第一項、第三項委託專業機關檢查及程序規定。\n三、增訂第二項，定明相關機關、法人或團體協助或提供資料之義務。"},{"bill":"202110207600000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"201110206460000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。"},{"bill":"201110206460000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"202110209820000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、參考氣候變遷因應法第四十條規定，修正行政檢查之對象與範圍。行政檢查委託與通知程序回歸行政程序法辦理，爰刪除相關規定。\n三、增訂第二項明定有關單位協助或提供資料之義務。"},{"bill":"202110209820000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"202110209800000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。"},{"bill":"202110209800000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"202110209750000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。"},{"bill":"202110209750000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"202110206620000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。"},{"bill":"202110206620000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"}],"changed":true,"final":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","finalWhy":"一、條次變更，本條為原第二十一條移列。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。","review":null},{"no":"第九條","current":null,"versions":[{"bill":"202110167180000","text":"中央有關機關應推動資源循環，其權責事項規定如下：\n一、能源、製造及商業部門資源循環事項：由經濟部主辦；各中央目的事業主管機關協辦。\n二、科學園區資源循環事項：由國家科學及技術委員會主辦；各中央目的事業主管機關協辦。\n三、運輸部門資源循環事項：由交通部主辦；各中央目的事業主管機關協辦。\n四、農業部門資源循環事項：由農業部主辦；各中央目的事業主管機關協辦。\n五、建築部門資源循環事項：由內政部主辦；各中央目的事業主管機關協辦。\n六、工程部門資源循環事項：由各工程中央目的事業主管機關主辦；各中央目的事業主管機關協辦。\n七、環境部門資源循環事項：由環境部主辦；各中央目的事業主管機關協辦。\n八、資源循環之綠色金融事項：由金融監督管理委員會及環境部主辦；各中央目的事業主管機關協辦。\n九、資源循環之科技研發及推動事項：由國家科學及技術委員會及環境部主辦；各中央目的事業主管機關協辦。\n十、醫療部門資源循環事項：由衛生福利部主辦；各中央目的事業主管機關協辦。","note":"一、本條新增。\n二、由於資源循環議題具有跨領域、跨部門等特性，參考氣候變遷因應法第八條規定，並參酌行政院民國一百十一年九月核定之「廢棄資源管理及資源化行動方案」，明確規範推動資源循環各中央有關機關之權責事項。\n三、第八款權責事項，除「綠色及轉型金融行動方案」中涉及推動資源循環之綠色金融措施相關事項由金融監督管理委員會主辦外，由環境部主辦。"},{"bill":"202110174540000","text":"中央有關機關應推動資源循環，其權責事項規定如下：\n一、能源、製造及商業部門資源循環事項：由經濟部主辦；各中央目的事業主管機關協辦。\n二、科學園區資源循環事項：由國家科學及技術委員會主辦；各中央目的事業主管機關協辦。\n三、運輸部門資源循環事項：由交通部主辦；各中央目的事業主管機關協辦。\n四、農業部門資源循環事項：由農業部主辦；各中央目的事業主管機關協辦。\n五、建築部門資源循環事項：由內政部主辦；各中央目的事業主管機關協辦。\n六、工程部門資源循環事項：由各工程中央目的事業主管機關主辦；各中央目的事業主管機關協辦。\n七、環境部門資源循環事項：由環境部主辦；各中央目的事業主管機關協辦。\n八、綠色金融資源循環事項：由金融監督管理委員會及環境部主辦；各中央目的事業主管機關協辦。\n九、科技研發及推動資源循環事項：由國家科學及技術委員會及環境部主辦；各中央目的事業主管機關協辦。\n十、醫療部門資源循環事項：由衛生福利部主辦；各中央目的事業主管機關協辦。\n十一、其他資源循環事項：由行政院國家永續發展委員會協調指定之。","note":"一、本條新增。\n二、由於資源循環議題具有跨領域、跨部門等特性，參考氣候變遷因應法第八條規定，並參酌行政院一百十一年九月二十六日核定之「廢棄資源管理及資源化行動方案」，明確規範推動資源循環各中央有關機關之權責事項。\n三、第八款權責事項，除「綠色及轉型金融行動方案」中涉及推動資源循環之綠色金融措施相關事項由金融監督管理委員會主辦外，由環境部主辦。"},{"bill":"202110204890000","text":"中央有關機關應推動資源循環，其權責事項如下：\n一、能源、製造及商業部門資源循環事項：由經濟部主辦；各中央目的事業主管機關協辦。\n二、科學園區資源循環事項：由國家科學及技術委員會主辦；各中央目的事業主管機關協辦。\n三、運輸部門資源循環事項：由交通部主辦；各中央目的事業主管機關協辦。\n四、農業部門資源循環事項：由農業部主辦；各中央目的事業主管機關協辦。\n五、建築部門資源循環事項：由內政部主辦；各中央目的事業主管機關協辦。\n六、工程部門資源循環事項：由各工程中央目的事業主管機關主辦；各中央目的事業主管機關協辦。\n七、環境部門資源循環事項：由環境部主辦；各中央目的事業主管機關協辦。\n八、綠色金融資源循環事項：由金融監督管理委員會及環境部主辦；各中央目的事業主管機關協辦。\n九、科技研發及推動資源循環事項：由國家科學及技術委員會及環境部主辦；各中央目的事業主管機關協辦。\n十、衛生福利部門資源循環事項：由衛生福利部主辦；各中央目的事業主管機關協辦。\n十一、其他資源循環事項：由中央主管機關報請行政院指定之。","note":"一、本條新增。\n二、由於資源循環議題具有跨領域、跨部門等特性，參考氣候變遷因應法第八條第二項規定，並參酌行政院一百十一年九月二十六日核定之「廢棄資源管理及資源化行動方案」，明確規範推動資源循環各中央有關機關之權責事項。\n三、第六款權責事項，各類工程之中央目的事業主管機關，原則依公共工程專業技師簽證規則第五條第二項所定之附表；非屬附表所列工程種類，則由個別工程之中央目的事業主管機關推動。\n四、第八款權責事項，除「綠色及轉型金融行動方案」中涉及推動資源循環之綠色金融措施相關事項由金融監督管理委員會主辦外，由環境部主辦。"},{"bill":"202110207060000","text":"中央有關機關應推動資源循環，其權責事項如下：\n一、能源、製造及商業部門資源循環事項：由經濟部主辦；各中央目的事業主管機關協辦。\n二、科學園區資源循環事項：由國家科學及技術委員會主辦；各中央目的事業主管機關協辦。\n三、運輸部門資源循環事項：由交通部主辦；各中央目的事業主管機關協辦。\n四、農業部門資源循環事項：由農業部主辦；各中央目的事業主管機關協辦。\n五、建築部門資源循環事項：由內政部主辦；各中央目的事業主管機關協辦。\n六、工程部門資源循環事項：由各工程中央目的事業主管機關主辦；各中央目的事業主管機關協辦。\n七、環境部門資源循環事項：由環境部主辦；各中央目的事業主管機關協辦。\n八、綠色金融資源循環事項：由金融監督管理委員會及環境部主辦；各中央目的事業主管機關協辦。\n九、科技研發及推動資源循環事項：由國家科學及技術委員會及環境部主辦；各中央目的事業主管機關協辦。\n十、衛生福利部門資源循環事項：由衛生福利部主辦；各中央目的事業主管機關協辦。\n十一、其他資源循環事項：由中央主管機關報請行政院指定之。","note":"一、本條新增。\n二、由於資源循環議題具有跨領域、跨部門等特性，參考氣候變遷因應法第八條第二項規定，並參酌行政院一百十一年九月二十六日核定之「廢棄資源管理及資源化行動方案」，明確規範推動資源循環各中央有關機關之權責事項。\n三、第六款權責事項，各類工程之中央目的事業主管機關，原則依公共工程專業技師簽證規則第五條第二項所定之附表；非屬附表所列工程種類，則由個別工程之中央目的事業主管機關推動。\n四、第八款權責事項，除「綠色及轉型金融行動方案」中涉及推動資源循環之綠色金融措施相關事項由金融監督管理委員會主辦外，由環境部主辦。"},{"bill":"202110207600000","text":"中央有關機關應推動資源循環，其權責事項規定如下：\n一、能源、製造及商業部門資源循環事項：由經濟部主辦；各中央目的事業主管機關協辦。\n二、科學園區資源循環事項：由國家科學及技術委員會主辦；各中央目的事業主管機關協辦。\n三、運輸部門資源循環事項：由交通部主辦；各中央目的事業主管機關協辦。\n四、農業部門資源循環事項：由農業部主辦；各中央目的事業主管機關協辦。\n五、建築部門資源循環事項：由內政部主辦；各中央目的事業主管機關協辦。\n六、工程部門資源循環事項：由各工程中央目的事業主管機關主辦；各中央目的事業主管機關協辦。\n七、環境部門資源循環事項：由環境部主辦；各中央目的事業主管機關協辦。\n八、資源循環之綠色金融事項：由金融監督管理委員會及環境部主辦；各中央目的事業主管機關協辦。\n九、資源循環之科技研發及推動事項：由國家科學及技術委員 關應推動資源循環，其權責事項如下：\n一、能源、製造及商業部門資源循環事項：由經濟部主辦；各中央目的事業主管機關協辦。\n二、科學園區資源循環事項：由國家科學及技術委員會主辦；各中央目的事業主管機關協辦。\n三、運輸部門資源循環事項：由交通部主辦；各中央目的事業主管機關協辦。\n四、農業部門資源循環事項：由農業部主辦；各中央目的事業主管機關協辦。\n五、建築部門資源循環事項：由內政部主辦；各中央目的事業主管機關協辦。\n六、工程部門資源循環事項：由各工程中央目的事業主管機關主辦；各中央目的事業主管機關協辦。\n七、環境部門資源循環事項：由環境部主辦；各中央目的事業主管機關協辦。\n八、綠色金融資源循環事項：由金融監督管理委員會及環境部主辦；各中央目的事業主管機關協辦。\n九、科技研發及推動資源循環事項：由國家科學及技術委員會及環境部主辦；各中央目的事業主管機關協辦。\n十、衛生福利部門資源循環事項：由衛生福利部主辦；各中央目的事業主管機關協辦。\n十一、其他資源循環事項：由中央主管機關報請行政院指定之。","finalWhy":"一、本條新增。\n二、由於資源循環議題具有跨領域、跨部門等特性，參考氣候變遷因應法第八條第二項規定，並參酌行政院一百十一年九月二十六日核定之「廢棄資源管理及資源化行動方案」，明確規範推動資源循環各中央有關機關之權責事項。\n三、第六款權責事項，各類工程之中央目的事業主管機關，原則依公共工程專業技師簽證規則第五條第二項所定之附表；非屬附表所列工程種類，則由個別工程之中央目的事業主管機關推動。\n四、第八款權責事項，除「綠色及轉型金融行動方案」中涉及推動資源循環之綠色金融措施相關事項由金融監督管理委員會主辦外，由環境部主辦。","review":null},{"no":"第十條","current":null,"versions":[{"bill":"202110167180000","text":"目的事業主管機關應輔導業者導入源頭減量及資源循環利用之規劃推動事宜，並提供政策誘因，培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、提供誘因、人才培育及推廣之責。"},{"bill":"202110174540000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"},{"bill":"202110204890000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"},{"bill":"202110207060000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"},{"bill":"202110207600000","text":"目的事業主管機關應輔導業者導入源頭減量及資源循環利用之規劃推動事宜，並提供政策誘因，培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、提供誘因、人才培育及推廣之責。"},{"bill":"201110206460000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"},{"bill":"202110209820000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、明定目的事業主管機關負有輔導、人才培育與推廣教育之責。"},{"bill":"202110209800000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"},{"bill":"202110209750000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"},{"bill":"202110206620000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"}],"changed":true,"final":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","finalWhy":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。","review":null},{"no":"第十條之一","current":null,"versions":[{"bill":"201110206460000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十一條","current":null,"versions":[{"bill":"202110167180000","text":"中央主管機關應依我國環境狀況、資源循環目標，參酌國際現況與國內情勢變化及第九條分工事項，會商中央目的事業主管機關擬訂國家整體資源循環計畫（以下簡稱資源循環計畫），報請行政院核定後實施，並對外公開，且至少每五年檢討一次。\n中央主管機關及中央目的事業主管機關應依前項資源循環計畫推動資源循環，由中央主管機關綜整各中央目的事業主管機關推動情形，每年編寫資源循環推動成果報告，對外公開。\n直轄市、縣（市）主管機關應依第一項資源循環計畫，擬訂資源循環行動計畫（以下簡稱行動計畫），報中央主管機關核定後實施，並對外公開，且至少每五年檢討一次。\n直轄市、縣（市）主管機關應每年編寫行動計畫成果報告，對外公開。","note":"一、本條新增。\n二、考量資源循環事務之推動，應有整體性指導方針，爰於第一項定明中央主管機關應評估國內外各項有關因素，擬訂國家整體資源循環計畫；並定明應對外公開及定期檢討，以利民眾參與及符合實際需求。\n三、為利國人瞭解資源循環推動成果，爰於第二項定明中央主管機關應彙整各中央目的事業主管機關資源循環推動情形，每年製作成果報告並對外公開。\n四、考量地方政府亦應配合中央政策，因地制宜推動資源循環事務，爰於第三項及第四項定明直轄市、縣（市）主管機關應擬訂行動計畫、定期檢討及編寫製作成果報告，並對外公開。"},{"bill":"202110174540000","text":"中央主管機關應依我國環境狀況、資源循環目標、原住民族地區特殊性，參酌國際現況與國內情勢變化及第九條分工事項，會商中央目的事業主管機關擬訂國家整體資源循環計畫（以下簡稱資源循環計畫），報請行政院核定後實施，並對外公開，且至少每五年檢討一次。\n中央主管機關及中央目的事業主管機關應依前項資源循環計畫推動資源循環，由中央主管機關綜整各中央目的事業主管機關推動情形，每年編寫資源循環推動成果報告，報請行政院核定後，對外公開。\n直轄市、縣（市）主管機關應依第一項資源循環計畫，擬訂資源循環行動計畫（以下簡稱行動計畫），原住民族地區鄉鎮市公所擬訂計畫時，應納入原住民族傳統智慧或部落會議意見，報請中央主管機關核定後實施，並對外公開，且至少每五年檢討一次。\n直轄市、縣（市）主管機關應每年編寫行動計畫成果報告，對外公開。","note":"一、本條新增。\n二、考量資源循環事務之推動，應有整體性指導方針，爰於第一項定明中央主管機關應評估國內外各項有關因素，將「原住民族地區特殊性」納入中央主管機關擬訂國家整體資源循環方案的考量因素，以確保資源循環政策之適地性。擬訂國家整體資源循環計畫；並定明應對外公開及定期檢討，以利民眾參與及符合實際需求。\n三、為利國人瞭解資源循環推動成果，爰於第二項定明中央主管機關應彙整各中央目的事業主管機關資源循環推動情形，每年製作成果報告並對外公開。\n四、考量地方政府亦應配合中央政策推動資源循環事務，爰於第三項及第四項定明直轄市、縣（市）主管機關應擬訂行動計畫、定期檢討及編寫製作成果報告，並對外公開。"},{"bill":"202110204890000","text":"中央主管機關應依我國環境狀況、資源循環目標，參酌國際現況與國內情勢變化及第九條分工事項，會商中央目的事業主管機關擬訂國家整體資源循環計畫（以下簡稱資源循環計畫），報請行政院核定後實施，並對外公開，且至少每五年檢討一次。\n中央主管機關及中央目的事業主管機關應依前項資源循環計畫推動資源循環，由中央主管機關綜整各中央目的事業主管機關推動情形，每年編寫資源循環推動成果報告，報請行政院核定後，對外公開。\n直轄市、縣（市）主管機關應依第一項資源循環計畫，擬訂資源循環行動計畫（以下簡稱行動計畫），報請中央主管機關核定後實施，並對外公開，且至少每五年檢討一次。\n直轄市、縣（市）主管機關應每年編寫行動計畫成果報告，對外公開。","note":"一、本條新增。\n二、考量資源循環事務之推動，應有整體性指導方針，爰於第一項定明中央主管機關應評估國內外各項有關因素，擬訂國家整體資源循環計畫；並定明應對外公開及定期檢討，以利民眾參與及符合實際需求。\n三、為利國人瞭解資源循環推動成果，爰於第二項定明中央主管機關應彙整各中央目的事業主管機關資源循環推動情形，每年製作成果報告並對外公開。\n四、考量地方政府亦應配合中央政策推動資源循環事務，爰於第三項及第四項定明直轄市、縣（市）主管機關應擬訂行動計畫、定期檢討及編寫製作成果報告，並對外公開。"},{"bill":"202110207060000","text":"中央主管機關應依我國環境狀況、資源循環目標，參酌國際現況與國內情勢變化及第九條分工事項，會商中央目的事業主管機關擬訂國家整體資源循環計畫（以下簡稱資源循環計畫），報請行政院核定後實施，並對外公開，且至少每五年檢討一次。\n中央主管機關及中央目的事業主管機關應依前項資源循環計畫推動資源循環，由中央主管機關綜整各中央目的事業主管機關推動情形，每年編寫資源循環推動成果報告，報請行政院核定後，對外公開。\n直轄市、縣（市）主管機關應依第一項資源循環計畫，擬訂資源循環行動計畫（以下簡稱行動計畫），報請中央主管機關核定後實施，並對外公開，且至少每五年檢討一次。\n直轄市、縣（市）主管機關應每年編寫行動計畫成果報告，對外公開。","note":"一、本條新增。\n二、考量資源循環事務之推動，應有整體性指導方針，爰於第一項定明中央主管機關應評估國內外各項有關因素，擬訂國家整體資源循環計畫；並定明應對外公開及定期檢討，以利民眾參與及符合實際需求。\n三、為利國人瞭解資源循環推動成果，爰於第二項定明中央主管機關應彙整各中央目的事業主管機關資源循環推動情形，每年製作成果報告並對外公開。\n四、考量地方政府亦應配合中央政策推動資源循環事務，爰於第三項及第四項定明直轄市、縣（市）主管機關應擬訂行動計畫、定期檢討及編寫製作成果報告，並對外公開。"},{"bill":"2021102076
