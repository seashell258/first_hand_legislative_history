"},{"bill":"202110207060000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於修正條文第四十條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"},{"bill":"202110207600000","text":"製造、輸入、販賣商品或提供服務業者得向中央主管機關申請環保標章使用權，經中央主管機關依環保標章規格標準審查通過後，應依規定標示於商品、包裝或服務場所。\n前項取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請、應備文件、審查、分類、標示、使用、同意事項、變更、查核、抽樣檢驗、廢止、資料提報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項環保標章規格標準，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由商品、服務符合規格標準之相關業者自願性申請，經審查通過後，依規定標示。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之相關管理規定，以健全管理機制。\n六、第四項參考健康食品管理法第三條第二項體例，授權由中央主管機關定之，提升規格標準之法律位階。"},{"bill":"201110206460000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於修正條文第四十條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"},{"bill":"202110209820000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、明定未取得環保標章者之各項禁止使用或變造行為，避免消費者混淆。"},{"bill":"202110209800000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於修正條文第四十條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"},{"bill":"202110209750000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於修正條文第四十條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"},{"bill":"202110206620000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於修正條文第四十條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"}],"changed":true,"final":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","finalWhy":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於修正條文第四十一條增訂罰則，以嚇阻不法，避免消費者混淆誤判。","review":null},{"no":"第二十五條","current":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄及其他應遵行事項之管理辦法，由中央主管機關會商中央目的事業主管機關、再使用用途目的事業主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄及其他應遵行事項之管理辦法，由中央目的事業主管機關會商中央主管機關、再生利用用途目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書格式及內容，分別由中央主管機關或中央目的事業主管機關定之。","versions":[{"bill":"202110167180000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於第四十三條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"},{"bill":"202110174540000","text":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄、管理及其他應遵行事項之辦法，由中央主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄、管理及其他應遵行事項之辦法，由中央目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書格式及內容，分別由中央主管機關或中央目的事業主管機關定之。","note":"一、條次變更。\n二、第二項「會商中央目的事業主管機關、再使用用途目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除，並酌作文字修正。\n三、第四項修正刪除「會商中央主管機關、再生利用用途目的事業主管機關」，理由同說明二。\n四、第一項、第三項、第五項及第六項未修正。"},{"bill":"202110174540000","text":"","note":"一、本條刪除。\n二、為落實本法推動資源循環之立法目的，對於明知為不實之事項而申報不實或於業務上作成之文書為虛偽記載之行為，允宜適用普通刑法偽造文書罪章相關規定，本法無庸特別規範，爰予刪除。"},{"bill":"202110204890000","text":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄、管理及其他應遵行事項之辦法，由中央主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄、管理及其他應遵行事項之辦法，由中央目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書應載明事項，分別由中央主管機關或中央目的事業主管機關公告之。","note":"一、條次變更。\n二、第二項「會商中央目的事業主管機關、再使用用途目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除，並酌作文字修正。\n三、第四項修正刪除「會商中央主管機關、再生利用用途目的事業主管機關」，理由同說明二。\n四、第一項、第三項及第五項未修正。\n五、第六項所定「格式」屬細節性規範，可由主管機關依職權定之；所定「內容」修正為「應載明事項」；另依實務運作修正為「公告之」。"},{"bill":"202110204890000","text":"","note":"一、本條刪除。\n二、為落實本法推動資源循環之立法目的，對於明知為不實之事項而申報不實或於業務上作成之文書為虛偽記載之行為，允宜適用普通刑法偽造文書罪章相關規定，本法無庸特別規範，爰予刪除。"},{"bill":"202110207060000","text":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄、管理及其他應遵行事項之辦法，由中央主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄、管理及其他應遵行事項之辦法，由中央目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書應載明事項，分別由中央主管機關或中央目的事業主管機關公告之。","note":"一、條次變更。\n二、第二項「會商中央目的事業主管機關、再使用用途目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除，並酌作文字修正。\n三、第四項修正刪除「會商中央主管機關、再生利用用途目的事業主管機關」，理由同說明二。\n四、第一項、第三項及第五項未修正。\n五、第六項所定「格式」屬細節性規範，可由主管機關依職權定之；所定「內容」修正為「應載明事項」；另依實務運作修正為「公告之」。"},{"bill":"202110207060000","text":"","note":"一、本條刪除。\n二、為落實本法推動資源循環之立法目的，對於明知為不實之事項而申報不實或於業務上作成之文書為虛偽記載之行為，允宜適用普通刑法偽造文書罪章相關規定，本法無庸特別規範，爰予刪除。"},{"bill":"202110207600000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於第四十三條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"},{"bill":"201110206460000","text":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄、管理及其他應遵行事項之辦法，由中央主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄、管理及其他應遵行事項之辦法，由中央目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書應載明事項，分別由中央主管機關或中央目的事業主管機關公告之。","note":"一、條次變更。\n二、第二項「會商中央目的事業主管機關、再使用用途目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除，並酌作文字修正。\n三、第四項修正刪除「會商中央主管機關、再生利用用途目的事業主管機關」，理由同說明二。\n四、第一項、第三項及第五項未修正。\n五、第六項所定「格式」屬細節性規範，可由主管機關依職權定之；所定「內容」修正為「應載明事項」；另依實務運作修正為「公告之」。"},{"bill":"201110206460000","text":"","note":"一、本條刪除。\n二、為落實本法推動資源循環之立法目的，對於明知為不實之事項而申報不實或於業務上作成之文書為虛偽記載之行為，允宜適用普通刑法偽造文書罪章相關規定，本法無庸特別規範，爰予刪除。"},{"bill":"202110209820000","text":"得再使用之再生資源項目，由中央主管機 用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。\n四、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110204890000","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、考量修正條文第二十五條第二項、第四項已授權訂定「再生資源」再使用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。另配合章次調整，修正第二項引述之章次，並酌修文字。\n三、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110207060000","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、考量修正條文第二十五條第二項、第四項已授權訂定「再生資源」再使用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。另配合章次調整，修正第二項引述之章次，並酌修文字。\n三、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110207600000","text":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄、管理及其他應遵行事項之辦法，由中央主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄及其他應遵行事項之管理辦法，由中央目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書格式及內容，分別由中央主管機關或中央目的事業主管機關定之。","note":"一、條次變更。\n二、第二項「會商中央目的事業主管機關、再使用用途目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除，並酌作文字修正。\n三、第四項修正刪除「會商中央目的事業主管機關、再生利用用途目的事業主管機關」，理由同說明二。\n四、第一項、第三項、第五項及第六項未修正。"},{"bill":"201110206460000","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、考量修正條文第二十五條第二項、第四項已授權訂定「再生資源」再使用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。另配合章次調整，修正第二項引述之章次，並酌修文字。\n三、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110209820000","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、因再生資源標準已授權於前條辦法規範，爰刪除本條「再生資源」文字以避免重複。配合章次變更修正引述，並刪除會商行政程序文字。"},{"bill":"202110209800000","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、考量修正條文第二十五條第二項、第四項已授權訂定「再生資源」再使用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。另配合章次調整，修正第二項引述之章次，並酌修文字。\n三、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110209750000","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、考量修正條文第二十五條第二項、第四項已授權訂定「再生資源」再使用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。另配合章次調整，修正第二項引述之章次，並酌修文字。\n三、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110206620000","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、考量修正條文第二十五條第二項、第四項已授權訂定「再生資源」再使用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。另配合章次調整，修正第二項引述之章次，並酌修文字。\n三、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"}],"changed":true,"final":"再生資源為廢棄物品、包裝或容器者，中央主管機關得指定其製造、輸入、販賣或使用業者，共同成立或加入既有生產者責任組織（以下簡稱生產者責任組織），負擔再生資源之回收、清除及循環利用之財務與實際執行責任。\n中央主管機關得指定前項生產者責任組織應依指定之目標、循環利用方式及必要設施，規劃循環利用計畫，並於公告期限內檢具該計畫送請中央主管機關審查，並依中央主管機關核准之計畫辦理。\n生產者責任組織應依中央主管機關指定之資料傳輸方式定期申報循環利用情形。\n第二項生產者責任組織應遵循之循環利用目標、方式、設施設置，循環利用計畫應有之內容及前項申報方式及頻率，由中央主管機關定之。\n再生資源為事業活動產生之物品、包裝或容器者，則第二項循環利用計畫的審查與核准，以及循環利用計畫執行情形之監督與考核，由中央目的事業主管機關為之。","finalWhy":"一、本條新增。\n二、為強化產品全生命週期之資源循環管理，落實生產者延伸責任，爰參考國際間推動自主回收管理趨勢，增訂生產者責任組織制度，由該組織主動承擔再生資源回收、清除及循環利用任務，中央主管機關適時監督及考核其執行情形。藉由與第三章循環永續管理之綠色設計、源頭減量等生產者責任多元政策工具之搭配運用，達到推動資源循環之目的。\n三、第一項定明中央主管機關得指定相關業者共同成立或加入生產者責任組織，負擔再生資源回收、清除及循環利用之財務與實際執行責任。\n四、為確保生產者責任組織運作效能，爰於第二項明定中央主管機關得指定生產者責任組織應達成之循環利用目標、方式及必要設施，並要求其提出循環利用計畫送請審查。該計畫內容除應載明執行方式及設施規劃外，亦應包含稽核作業方式、財務保證、未達指定目標及異常情形改善措施及資訊申報管理等其他與組織運作、財務及執行相關事項，以作為後續審查、執行及監督管理之依據。\n五、第三項定明生產者責任組織應依指定方式定期申報循環利用情形，以利中央主管機關掌握執行情形，辦理後續查核、監督及政策推動。\n六、第四項授權中央主管機關訂定循環利用目標、方式、設施設置、循環利用計畫內容及申報方式與頻率等相關事項之辦法。\n七、第五項定明事業活動產生之再生資源，其循環利用計畫之審查、核准及執行情形之監督與考核，由中央目的事業主管機關辦理，以強化權責分工及管理效能。","review":null},{"no":"第二十七條","current":"再生資源、再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關會商中央主管機關公告其標準。\n再生資源、再生產品不符合前項標準者，不適用本法第四章輔導獎勵措施之規定。","versions":[{"bill":"202110167180000","text":"再生資源、再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關會商中央主管機關公告其標準。\n再生資源、再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、配合章次調整，修正引述章次並酌修文字。"},{"bill":"202110174540000","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出。\n前項再生資源之輸入或輸出之限制、禁止、申請資格、文件、審查、許可、許可期限、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除，並酌作文字修正。\n三、第二項「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。另明列其授權事項，以資明確。"},{"bill":"202110204890000","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出；經限制輸入或輸出者，應申請直轄市、縣（市）主管機關許可後，始得輸入或輸出。\n前項再生資源輸入或輸出之限制、禁止、申請許可之資格、應備文件、審查、許可事項、許可期限、廢止及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字，並定明經中央主管機關限制輸入或輸出之再生資源，欲為輸入或輸出者，應取得許可後，始得為之。另「會商中央目的事業主管機關」屬行政作業程序，無須明文，爰予刪除。\n三、第二項明列授權訂定辦法之事項，以資明確。另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110207060000","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出；經限制輸入或輸出者，應申請直轄市、縣（市）主管機關許可後，始得輸入或輸出。\n前項再生資源輸入或輸出之限制、禁止、申請許可之資格、應備文件、審查、許可事項、許可期限、廢止及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字，並定明經中央主管機關限制輸入或輸出之再生資源，欲為輸入或輸出者，應取得許可後，始得為之。另「會商中央目的事業主管機關」屬行政作業程序，無須明文，爰予刪除。\n三、第二項明列授權訂定辦法之事項，以資明確。另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110207600000","text":"再生資源、再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關會商中央主管機關公告其標準。\n再生資源、再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、配合章次調整，修正引述章次並酌修文字。"},{"bill":"201110206460000","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出；經限制輸入或輸出者，應申請直轄市、縣（市）主管機關許可後，始得輸入或輸出。\n前項再生資源輸入或輸出之限制、禁止、申請許可之資格、應備文件、審查、許可事項、許可期限、廢止及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字，並定明經中央主管機關限制輸入或輸出之再生資源，欲為輸入或輸出者，應取得許可後，始得為之。另「會商中央目的事業主管機關」屬行政作業程序，無須明文，爰予刪除。\n三、第二項明列授權訂定辦法之事項，以資明確。另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110209820000","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出；經限制輸入或輸出者，應申請直轄市、縣（市）主管機關許可後，始得輸入或輸出。\n前項再生資源輸入或輸出之限制、禁止、申請許可之資格、應備文件、審查、許可事項、許可期限、廢止及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、明定受限制之再生資源須經許可始得輸出入，並刪除相關會商行政程序文字。第二項明列授權訂定辦法之管理事項範圍以資明確。"},{"bill":"202110209800000","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出；經限制輸入或輸出者，應申請直轄市、縣（市）主管機關許可後，始得輸入或輸出。\n前項再生資源輸入或輸出之限制、禁止、申請許可之資格、應備文件、審查、許可事項、許可期限、廢止及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字，並定明經中央主管機關限制輸入或輸出之再生資源，欲為輸入或輸出者，應取得許可後，始得為之。另「會商中央目的事業主管機關」屬行政作業程序，無須明文，爰予刪除。\n三、第二項明列授權訂定辦法之事項，以資明確。另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110209750000","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出；經限制輸入或輸出者，應申請直轄市、縣（市）主管機關許可後，始得輸入或輸出。\n前項再生資源輸入或輸出之限制、禁止、申請許可之資格、應備文件、審查、許可事項、許可期限、廢止及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。 事業或機構、軍事機關、行政法人應優先採購下列產品或服務：\n一、環保標章產品。\n二、依第二十一條核准之循環產品或循環服務。\n三、其他環境保護產品及具綠色意涵之產品或服務。\n前項應優先採購之產品或服務種類及其他有關事項之辦法，由中央主管機關定之。\n中央主管機關應就第一項優先採購辦理績效評核作業，評核作業之評核方法由中央主管機關公告之。\n主管機關及各目的事業主管機關應辦理促進產品回收及延長使用技術、優先採購第一項之產品或服務相關之教育推廣活動。\n政府機關、公立學校、公營事業或機構、軍事機關、行政法人、民間企業或團體優先採購第一項之產品或服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、條次變更。\n二、參考歐盟二○二四年永續產品生態設計規範（ESPR）及綠色公共採購（GPP）標準等國際以公部門帶領私部門採購生態永續產品，作為引導產業發展循環經濟及提升產品耐用性誘因，推動我國公部門綠色採購，優先採購範疇包含環保標章產品、循環產品、循環服務、其他環境保護產品以及具減量、可重複使用、再利用、低污染、省能源、省資源或對環境友善等綠色意涵之產品或服務，爰修正第一項。現行第一項「以一定比例以上再生資源為原料製成之再生產品」與第二項「再生資源或再生產品應含再生資源之一定比例」已納入第三類環境保護產品範疇（如經濟部產業發展署資源再生綠色產品），爰予刪除。\n三、第二項增訂具體授權事項，以符授權明確性；另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、配合第一項推動優先採購，增訂第三項優先採購績效評核作業方法之授權。\n五、配合第一項修正，修正第四項主管機關及各目的事業主管機關應辦理之活動範圍。\n六、為鼓勵公、私部門參與循環採購，增訂第五項公部門、民間企業或團體優先採購第一項產品或服務，中央主管機關得予獎勵、補助。"},{"bill":"202110204890000","text":"政府機關、公立學校、公營事業或機構、軍事機關、行政法人應優先採購下列產品或服務，並由中央主管機關辦理績效評核：\n一、環保標章產品。\n二、依第二十一條核准使用循環標誌之循環產品或循環服務。\n三、其他環境保護產品及具綠色意涵之產品或服務。\n前項應優先採購之產品或服務種類、績效評核作業及其他有關事項之辦法，由中央主管機關定之。\n主管機關及各目的事業主管機關應辦理促進產品回收及延長使用技術、優先採購第一項之產品或服務相關之教育推廣活動。\n民間企業或團體優先採購第一項之產品或服務，績效優良者，中央主管機關得予獎勵。","note":"一、條次變更。\n二、參考歐盟二○二四年永續產品生態設計規範（ESPR）及綠色公共採購（GPP）標準等國際以公部門帶領私部門採購生態永續產品，作為引導產業發展循環經濟及提升產品耐用性誘因，推動我國公部門綠色採購，優先採購範疇包含環保標章產品、循環產品、循環服務、其他環境保護產品以及具減量、可重複使用、再利用、低污染、省能源、省資源或對環境友善等綠色意涵之產品或服務，爰修正第一項，並增訂由中央主管機關辦理績效評核之規定。現行第一項「以一定比例以上再生資源為原料製成之再生產品」與第二項「再生資源或再生產品應含再生資源之一定比例」，已納入第三款之其他環境保護產品範疇（如經濟部產業發展署資源再生綠色產品），爰予刪除。\n三、為配合第一項推動優先採購及規範優先採購績效評核作業方法，於第二項增訂授權中央主管機關訂定辦法之事項，以符授權明確性原則；另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、配合第一項修正，修正第三項主管機關及各目的事業主管機關應辦理之活動範圍。\n五、為鼓勵民間企業或團體參與優先採購，增訂第四項規範民間企業或團體優先採購第一項產品或服務，中央主管機關得予獎勵。"},{"bill":"202110207060000","text":"政府機關、公立學校、公營事業或機構、軍事機關、行政法人應優先採購下列產品或服務，並由中央主管機關辦理績效評核：\n一、環保標章產品。\n二、依第二十一條核准使用循環標誌之循環產品或循環服務。\n三、其他環境保護產品及具綠色意涵之產品或服務。\n前項應優先採購之產品或服務種類、績效評核作業及其他有關事項之辦法，由中央主管機關定之。\n主管機關及各目的事業主管機關應辦理促進產品回收及延長使用技術、優先採購第一項之產品或服務相關之教育推廣活動。\n民間企業或團體優先採購第一項之產品或服務，績效優良者，中央主管機關得予獎勵。","note":"一、條次變更。\n二、參考歐盟二○二四年永續產品生態設計規範（ESPR）及綠色公共採購（GPP）標準等國際以公部門帶領私部門採購生態永續產品，作為引導產業發展循環經濟及提升產品耐用性誘因， 」，已納入第三款之其他環境保護產品範疇（如經濟部產業發展署資源再生綠色產品），爰予刪除。\n三、為配合第一項推動優先採購及規範優先採購績效評核作業方法，於第二項增訂授權中央主管機關訂定辦法之事項，以符授權明確性原則；另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、配合第一項修正，修正第三項主管機關及各目的事業主管機關應辦理之活動範圍。\n五、為鼓勵民間企業或團體參與優先採購，增訂第四項規範民間企業或團體優先採購第一項產品或服務，中央主管機關得予獎勵。"}],"changed":true,"final":"再生資源屬依廢棄物清理法公告之應回收廢棄物者，其回收、貯存及回收清除處理費用之繳納，依廢棄物清理法之規定辦理。","finalWhy":"條次變更，本條為原第二十條移列，並酌作文字修正。","review":null},{"no":"第三十二條","current":"為促進資源回收再利用，政府機關、公立學校、公營事業或機構、軍事機關之採購，應優先採購政府認可之環境保護產品、本國境內產生之再生資源或以一定比例以上再生資源為原料製成之再生產品。\n前項應優先採購之環境保護產品、再生資源或再生產品應含再生資源之一定比例，由中央主管機關會商有關機關定之。\n主管機關及各目的事業主管機關應自行或委託專業機構或事業，辦理再生技術及再生資源、再生產品、環境保護產品相關之教育推廣及銷售促進活動。","versions":[{"bill":"202110167180000","text":"政府機關、公立學校、公營事業或機構、軍事機關應優先採購下列產品或服務：\n一、環境保護產品。\n二、依第二十二條核准之循環產品或循環服務。\n三、其他具綠色意涵之產品或服務。\n前項應優先採購之產品或服務種類及其他應遵行事項之辦法，由中央主管機關定之。\n中央主管機關應就第一項優先採購辦理績效評核作業，評核作業之評核方法由中央主管機關公告之。\n主管機關及各目的事業主管機關應辦理促進產品回收及延長使用技術、優先採購第一項之產品或服務相關之教育推廣活動。\n民間企業或團體優先採購第一項之產品或服務，中央主管機關得予獎勵或補助。","note":"一、條次變更。\n二、參考國際以公部門帶領私部門採購生態永續產品作為引導產業發展循環經濟及提升產品耐用性誘因，推動我國公部門優先採購環境保護產品、循環產品、循環服務及其他具減量、可重複使用、再利用、低污染、省能源、省資源或對環境友善等綠色意涵之產品或服務，爰修正第一項。\n三、第二項增訂具體授權事項，以符授權明確性；另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、配合第一項推動優先採購，增訂第三項優先採購績效評核作業方法之授權。\n五、配合第一項修正，修正第四項主管機關及各目的事業主管機關應辦理之活動範圍。\n六、為鼓勵私部門參與循環採購，增訂第五項民間企業或團體優先採購第一項產品或服務，中央主管機關得予獎勵、補助。"},{"bill":"202110174540000","text":"為促進資源循環，自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務之事業，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬本法第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬本法第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"202110204890000","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"202110207060000","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"202110207600000","text":"政府機關、公立學校、公營事業或機構、軍事機關應優先採購下列產品或服務：\n一、環境保護產品。\n二、依第二十二條核准之循環產品或循環服務。\n三、其他具綠色意涵之產品或服務。\n前項應優先採購之產品或服務種類及其他應遵行事項之辦法，由中央主管機關定之。\n中央主管機關應就第一項優先採購辦理績效評核作業，評核作業之評核方法由中央主管機關公告之。\n主管機關及各目的事業主管機關應辦理促進產品回收及延長使用技術、優先採購第一項之產品或服務相關之教育推廣活動。\n民間企業或團體優先採購第一項之產品或服務，中央主管機關得予獎勵或補助。","note":"一、條次變更。\n二、參考國際以公部門帶領私部門採購生態永續產品作為引導產業發展循環經濟及提升產品耐用性誘因，推動我國公部門優先採購環境保護產品、循環產品、循環服務及其他具減量、可重複使用、再利用、低污染、省能源、省資源或對環境友善等綠色意涵之產品或服務，爰修正第一項。\n三、第二項增訂具體授權事項，以符授權明確性；另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、配合第一項推動優先採購，增訂第三項優先採購績效評核作業方法之授權。\n五、配合第一項修正，修正第四項主管機關及各目的事業主管機關應辦理之活動範圍。\n六、為鼓勵私部門參與循環採購，增訂第五項民間企業或團體優先採購第一項產品或服務，中央主管機關得予獎勵、補助。"},{"bill":"201110206460000","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"202110209820000","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、明定自願提供物品或包裝容器重複、延長使用等有利資源循環服務且績效優良者之獎勵與補助機制，惟已受強制行政管制之對象不適用本條。"},{"bill":"202110209800000","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"202110209750000","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"202110206620000","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"}],"changed":true,"final":"政府機關、公立學校、公營事業或機構、軍事機關、行政法人應優先採購下列產品或服務，並由中央主管機關辦理績效評核：\n一、環保標章產品。\n二、依第二十一條核准使用循環標誌之循環產品或循環服務。\n三、其他環境保護產品及具綠色意涵之產品或服務。\n前項應優先採購之產品或服務種類、績效評核作業及其他有關事項之辦法，由中央主管機關定之。\n主管機關及各目的事業主管機關應辦理促進產品回收及延長使用技術、優先採購第一項之產品或服務相關之教育推廣活動。\n民間企業或團體優先採購第一項之產品或服務，績效優良者，中央主管機關得予獎勵。","finalWhy":"一、條次變更，本條為原第二十二條移列。\n二、參考歐盟二○二四年永續產品生態設計規範（ESPR）及綠色公共採購（GPP）標準等國際以公部門帶領私部門採購生態永續產品，作為引導產業發展循環經濟及提升產品耐用性誘因，推動我國公部門綠色採購，優先採購範疇包含環保標章產品、循環產品、循環服務、其他環境保護產品以及具減量、可重複使用、再利用、低污染、省能源、省資源或對環境友善等綠色意涵之產品或服務，爰修正第一項，並增訂由中央主管機關辦理績效評核之規定。現行第一項「以一定比例以上再生資源為原料製成之再生產品」與第二項「再生資源或再生產品應含再生資源之一定比例」，已納入第三款之其他環境保護產品範疇(如經濟部資源再生綠色產品)，爰予刪除。\n三、為配合第一項推動優先採購及規範優先採購績效評核作業方法，於第二項增訂授權中央主管機關訂定辦法之事項，以符授權明確性原則；另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、配合第一項修正，修正第三項主管機關及各目的事業主管機關應辦理之活動範圍。\n五、為鼓勵民間企業或團體參與優先採購，增訂第四項規範民間企業或團體優先採購第一項產品或服務，中央主管機關得予獎勵。","review":null},{"no":"第三十三條","current":"中央主管機關應依實際再使用、再生利用技術產生之效益，自行或委託、委辦相關機關或機構定期辦理再使用、再生利用技術開發優良及實際再使用、再生利用績優選拔，並給與獎勵；其獎金、獎助及表揚之辦法，由中央主管機關會商有關機關定之。\n從事資源回收再利用之事業，其投資於回收再利用之研究、設施、機具、設備等之費用，應予財稅減免，其財稅投資抵減項目、額度及相關應遵行事項，由中央財稅主管機關會同中央目的事業主管機關、中央主管機關定之。","versions":[{"bill":"202110167180000","text":"中央主管機關對於提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務，具績效優良之業者，得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬本法第十七條第一項公告指定物品之包裝、容器之製造、輸入或販賣業者，或屬本法第二十一條第一項公告指定物品之製造、輸入、販賣或提供使用業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"202110174540000","text":"中央主管機關應鼓勵、輔導原住民族地區之部落、法人、或合作社從事廢棄資源之回收、清除、再生、處理業務，並得就其建置成本、營運費用或其他經中央主管機關公告之事項，給予適當之獎勵或補助。","note":"一、本條新增。\n二、為確保中央主管機關長期支持原住民族地區個人或法人從事資源回收設施業務，同時縮短原鄉於其他城鄉差距，中央主管機關應透過適當獎勵或補助措施支持原住民族地區相關部落、法人或合作社之營運能量。"},{"bill":"202110204890000","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，現行第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第三項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第三項。"},{"bill":"202110207060000","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，現行第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第三項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第三項。"},{"bill":"202110207600000","text":"中央主管機關對於提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務，具績效優良之業者，得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬本法第十七條第一項公告指定物品之包裝、容器之製造、輸入或販賣業者，或屬本法第二十一條第一項公告指定物品之製造、輸入、販賣或提供使用業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"201110206460000","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，現行第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第三項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第三項。"},{"bill":"202110209820000","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、增列對辦理循環永續管理績優者之獎勵或補助。事業對於資源循環之投資減免回歸相關稅法規定辦理。增訂第三項明定相關獎勵與補助辦法之授權依據，並刪除無規範必要之委辦及會商規定。"},{"bill":"202110209800000","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，現行第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第三項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第三項。"},{"bill":"202110209750000","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，現行第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第三項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第三項。"},{"bill":"202110206620000","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，現行第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第三項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第三項。"}],"changed":true,"final":"為促進資源循環，事業自願提供物品或其包裝、容器之源頭減量、重複使用、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","finalWhy":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。","review":null},{"no":"第三十四條","current":"中央主管機關應依實際再使用、再生利用技術產生之效益，自行或委託、委辦相關機關或機構定期辦理再使用、再生利用技術開發優良及實際再使用、再生利用績優選拔，並給與獎勵；其獎金、獎助及表揚之辦法，由中央主管機關會商有關機關定之。\n從事資源回收再利用之事業，其投資於回收再利用之研究、設施、機具、設備等之費用，應予財稅減免，其財稅投資抵減項目、額度及相關應遵行事項，由中央財稅主管機關會同中央目的事業主管機關、中央主管機關定之。","versions":[{"bill":"202110167180000","text":"中央主管機關應依實際再使用、再生利用技術產生之效益，定期辦理再使用、再生利用技術開發優良及實際再使用、再生利用績優選拔，並給予獎勵。\n中央主管機關對於辦理循環永續產品管理之綠色設計、源頭減量及永續消費相關技術開發、人才培訓、實際運用執行與管理績效優良之機關、事業、學校、團體或個人，得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及源頭管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第三十二條第五項、前條及本條第一項、第二項獎勵或補助之資格、條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、配合第七條修正，刪除第一項委任（託）及委辦規定；後段中央主管機關訂定獎勵、補助辦法之授權依據，修正移列至第四項，並刪除「會商有關機關」文字。\n三、新增第二項，對於辦理綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，定明中央主管機關得予獎勵或補助。\n四、現行條文第二項修正移列至第三項，刪除中央財稅主管機關訂定財稅減免規定之授權依據，定明事業對於資源循環之相關投資，得依其他有關規定減免之。\n五、增訂第四項，定明中央主管機關訂定獎勵或補助辦法之授權依據。"},{"bill":"202110174540000","text":"辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良之事業或個人，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第三十一條第五項、前條及本條第一項獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、配合修正條文第七條，刪除第一項委任（託）及委辦規定；後段中央主管機關訂定獎勵、補助辦法之授權依據，修正移列至第三項，並刪除「會商有關機關」文字。\n三、新增第一項，對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，定明中央主管機關得予獎勵或補助。\n四、第二項刪除中央財稅主管機關訂定財稅減免規定之授權依據，定明事業對於資源循環之相關投資，得依其他有關規定減免之。\n五、增訂第三項，定明中央主管機關訂定獎勵或補助辦法之授權依據。"},{"bill":"202110204890000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"202110207060000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"202110207600000","text":"中央主管機關應依實際再使用、再生利用技術產生之效益，定期辦理再使用、再生利用技術開發優良及實際再使用、再生利用績優選拔，並給予獎勵。\n中央主管機關對於辦理循環永續產品管理及永續消費相關技術開發、人才培訓、實際運用執行與管理績效優良之機關、事業、學校、團體或個人，得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及源頭管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第三十二條第五項、前條及本條第一項、第二項獎勵或補助之資格、條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、配合第七條修正，刪除第一項委任（託）及委辦規定；後段中央主管機關訂定獎勵、補助辦法之授權依據，修正移列至第四項，並刪除「會商有關機關」文字。\n三、新增第二項，對於辦理綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，定明中央主管機關得予獎勵或補助。\n四、現行條文第二項修正移列至第三項，刪除中央財稅主管機關訂定財稅減免規定之授權依據，定明事業對於資源循環之相關投資，得依其他有關規定減免之。\n五、增訂第四項，定明中央主管機關訂定獎勵或補助辦法之授權依據。"},{"bill":"201110206460000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"202110209820000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進產業發展，明定中央主管機關得協助投資本法資源循環各項措施（包含綠色設計、源頭減量、永續消費及再生資源運作管理及資源循環推動事項）之事業優先取得融資與信用保證。"},{"bill":"202110209800000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"202110209750000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"202110206620000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"}],"changed":true,"final":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n主管機關得考量偏遠、原住民族地區及離島地區之需要，訂定輔導、補助計畫。\n第一項、第三十二條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","finalWhy":"一、條次變更，本條為原第二十三條移列。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，原條文第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第四項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、增訂第三項，考量偏遠、原住民族地區及離島地區於推動資源循環時，可能因地理條件、基礎設施及資源取得等因素面臨限制，爰定明主管機關得視實際需要，訂定相關輔導或補助計畫。\n六、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第四項。","review":null},{"no":"第三十五條","current":"為促進再生資源回收再利用，引進高級再生資源回收再利用技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區再生資源事業之土地需求，規劃設置環保科技或再生資源回收再利用專用區。\n前項專用區及環保科技或再生資源回收再利用之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用變更者，主管機關應依區域計畫法及非都市土地使用管制規則規定辦理變更。\n前項專用區及用地依法變更編定完成後，屬公有土地者，得辦理撥用或出租予興辦人，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或再生資源回收再利用之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、區域計畫主管機關將土地回復原編定或變更為其他適當之編定。\n工業區規劃開發時，主管機關得依該地區興辦再生資源回收再利用之土地需求，要求工業區開發單位應預留再生資源回收再利用用地。","versions":[{"bill":"202110167180000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"202110174540000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"202110204890000","text":"為促進資源循環，引進技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區資源循環產業之土地需求，規劃設置環保科技或資源循環專用區。\n前項專用區及環保科技或資源循環之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用者，主管機關應依國土計畫法、區域計畫法相關規定辦理。\n前項專用區及用地經都市計畫、國土計畫或區域計畫主管機關同意變更或使用後，屬公有土地者，得辦理撥用或出租予興辦人，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或資源循環之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、國土計畫、區域計畫主管機關，依都市計畫法、國土計畫法、區域計畫法相關規定辦理。\n產業園區規劃開發時，主管機關得依該地區興辦資源循環之土地需求，要求產業園區開發單位應預留資源循環用地。","note":"一、條次變更。\n二、配合本法由原再生資源回收再利用擴及整體資源循環，其用地需求亦同步擴充涵蓋整體資源循環產業，爰修正第一項、第二項、第四項及第五項，將「再生資源回收再利用」、「再生資源事業」文字修正為「資源循環」、「資源循環產業」，並刪除「高級再生資源回收再利用」文字。\n三、配合國土計畫法相關規定，修正第二項至第四項土地變更、使用有關規定。\n四、工業區已更名為產業園區，爰修正第五項工業區文字。"},{"bill":"202110207060000","text":"為促進資源循環，引進技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區資源循環產業之土地需求，規劃設置環保科技或資源循環專用區。\n前項專用區及環保科技或資源循環之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用者，主管機關應依國土計畫法、區域計畫法相關規定辦理。\n前項專用區及用地經都市計畫、國土計畫或區域計畫主管機關同意變更或使用後，屬公有土地者，得辦理撥用或出租予興辦人，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或資源循環之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、國土計畫、區域計畫主管機關，依都市計畫法、國土計畫法、區域計畫法相關規定辦理。\n產業園區規劃開發時，主管機關得依該地區興辦資源循環之土地需求，要求產業園區開發單位應預留資源循環用地。","note":"一、條次變更。\n二、配合本法由原再生資源回收再利用擴及整體資源循環，其用地需求亦同步擴充涵蓋整體資源循環產業，爰修正第一項、第二項、第四項及第五項，將「再生資源回收再利用」、「再生資源事業」文字修正為「資源循環」、「資源循環產業」，並刪除「高級再生資源回收再利用」文字。\n三、配合國土計畫法相關規定，修正第二項至第四項土地變更、使用有關規定。\n四、工業區已更名為產業園區，爰修正第五項工業區文字。"},{"bill":"202110207600000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"201110206460000","text":"為促進資源循環，引進技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區資源循環產業之土地需求，規劃設置環保科技或資源循環專用區。\n前項專用區及環保科技或資源循環之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用者，主管機關應依國土計畫法、區域計畫法相關規定辦理。\n前項專用區及用地經 規定之限制。\n第二項專用區及用地，如不為環保科技或再生資源循環利用之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、區域計畫主管機關，依土地相關法規規定辦理。\n工業區規劃開發時，主管機關得依該地區興辦再生資源循環利用之土地需求，要求工業區開發單位應預留再生資源循環利用用地。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正第一項第二項、第四項、第五項用語為「資源循環利用」。\n三、配合國土計畫法相關規定，修正第二項至第四項土地變更、使用有關規定。"},{"bill":"202110174540000","text":"為促進資源循環，引進技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區資源循環產業之土地需求，規劃設置環保科技或資源循環專用區。\n前項專用區及環保科技或資源循環之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用者，主管機關應依國土計畫法、區域計畫法相關規定辦理。\n前項專用區及用地經都市計畫、國土計畫或區域計畫主管機關同意變更或使用後，屬公有土地者，得辦理撥用或出租予興辦人，或於原住民族地區經中央目的事業主管機關認定有興建急迫性之必要者，得簡化變更程序，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或資源循環之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、國土計畫、區域計畫主管機關，依都市計畫法、國土計畫法、區域計畫法相關規定辦理。\n產業園區規劃開發時，主管機關得依該地區興辦資源循環之土地需求，要求產業園區開發單位應預留資源循環用地。","note":"一、條次變更。\n二、配合本法由原再生資源回收再利用擴及整體資源循環，其用地需求亦同步擴充涵蓋整體資源循環產業，爰修正第一項、第二項、第四項及第五項，將「再生資源回收再利用」、「再生資源事業」文字修正為「資源循環」、「資源循環產業」，並刪除「高級再生資源回收再利用」文字。\n三、配合國土計畫法相關規定，並考量原住民族地區多位於偏遠或保護區，為簡化用地變更程序，有助於加速當地必要之資源循環設施（如再生處理設施）建置，修正第二項至第四項土地變更、使用有關規定。\n四、工業區已更名為產業園區，爰修正第五項工業區文字。"},{"bill":"202110204890000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。"},{"bill":"202110207060000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。"},{"bill":"202110207600000","text":"為促進再生資源循環利用，引進高級再生資源循環利用技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區再生資源事業之土地需求，規劃設置環保科技或再生資源循環利用專用區。\n前項專用區及環保科技或再生資源循環利用之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用者，主管機關應依國土計畫法相關規定辦理。\n前項專用區及用地經都市計畫、國土計畫或區域計畫主管機關同意變更或使用後，屬公有土地者，得辦理撥用或出租予興辦人，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或再生資源循環利用之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、區域計畫主管機關，依土地相關法規規定辦理。\n工業區規劃開發時，主管機關得依該地區興辦再生資源循環利用之土地需求，要求工業區開發單位應預留再生資源循環利用用地。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正第一項第二項、第四項、第五項用語為「資源循環利用」。\n三、配合國土計畫法相關規定，修正第二項至第四項土地變更、使用有關規定。"},{"bill":"201110206460000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。"},{"bill":"202110209820000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為鼓勵創新技術與數位治理，建立創新實驗計畫申請機制，其研究客體包含天然資源、再生資源及廢棄物。明定實驗期間得豁免特定環保法規之適用，並授權中央主管機關訂定相關管理辦法。"},{"bill":"202110209800000","text":"事業得檢具資源循環創新實驗計畫，經中央有關機關同意後，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，經中央有關機關同意後，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為跨領域及跨部門促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。"},{"bill":"202110209750000","text":"事業得檢具資源循環創新實驗計畫，經中央有關機關同意後，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，經中央有關機關同意後，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為跨領域及跨部門促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。"},{"bill":"202110206620000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。"}],"changed":true,"final":"為促進資源循環，引進技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區資源循環產業之土地需求，規劃設置環保科技或資源循環專用區。\n前項專用區及環保科技或資源循環之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用者，主管機關應依國土計畫法、區域計畫法相關規定辦理。\n前項專用區及用地經都市計畫、國土計畫或區域計畫主管機關同意變更或使用後，屬公有土地者，得辦理撥用或出租予興辦人，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或資源循環之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、國土計畫、區域計畫主管機關，依都市計畫法、國土計畫法、區域計畫法相關規定辦理。\n產業園區規劃開發時，主管機關得依該地區興辦資源循環之土地需求，要求產業園區開發單位應預留資源循環用地。","finalWhy":"一、條次變更，本條為原第二十四條移列。\n二、配合本法由原再生資源回收再利用擴及整體資源循環，其用地需求亦同步擴充涵蓋整體資源循環產業，爰修正第一項、第二項、第四項及第五項，將「再生資源回收再利用」、「再生資源事業」文字修正為「資源循環」、「資源循環產業」，並刪除「高級再生資源回收再利用」文字。\n三、配合國土計畫法相關規定，修正第二項至第四項土地變更、使用有關規定。\n四、工業區已更名為產業園區，爰修正第五項工業區文字。","review":null},{"no":"第三十七條","current":null,"versions":[{"bill":"202110167180000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理創新實驗；於計畫結束後，申請人應提送計畫執行成果資料，報中央主管機關備查。\n經核准之創新實驗行為，於實驗期間內得排除中央主管機關核准決定載明特定法律全部或一部之適用。\n前項法律包括下列規定：\n一、本法第二十六條至第三十條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十九條第二項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環保法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請資格及程序、審查、核准內容、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用者，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項、第三項定明於實驗期間得不適用之法律規定。\n四、第四項授權中央主管機關訂定實驗計畫有關事項之辦法。"},{"bill":"202110174540000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准，依核准事項據以執行，並提送執行成果報中央主管機關備查。\n經核准之創新實驗計畫，其核准事項應載明於實驗期間內得排除下列法律全部或一部之適用：\n一、本法第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第二項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環保法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定實驗計畫有關事項之辦法。"},{"bill":"202110204890000","text":"有下列情形之一者，由中央主管機關處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第十四條第一項公告所定期限申請核定產品符合綠色設計準則。\n二、指定產品之製造、輸入業者，違反依第十四條第四項所定辦法有關核定事項、變更、查核、抽樣檢驗或資料備查之規定。\n營建工程之工程主辦機關或起造人違反依第十五條第一項所定公告有關綠色設計準則指定項目之規定者，處新臺幣六萬元以上三十萬元以下罰鍰；其尚未施工者，並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行者，按次處罰；必要時，得令其停工。","note":"一、本條新增。\n二、配合修正條文第十四條及第十五條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、基於鼓勵業者自願符合綠色設計，第一項第一款僅限於處罰違反強制實施綠色設計規定之業者。\n四、考量營建工程於規劃設計階段若違反第十五條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項針對尚未施工者定明通知限期提出改善計畫之情形。另考量營建工程之施作必須依其規劃設計內容進行施工，故對於屆期未依改善計畫執行者，按次處罰；另於必要時，得令其停工。"},{"bill":"202110207060000","text":"有下列情形之一者，由中央主管機關處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第十四條第一項公告所定期限申請核定產品符合綠色設計準則。\n二、指定產品之製造、輸入業者，違反依第十四條第四項所定辦法有關核定事項、變更、查核、抽樣檢驗或資料備查之規定。\n營建工程之工程主辦機關或起造人違反依第十五條第一項所定公告有關綠色設計準則指定項目之規定者，處新臺幣六萬元以上三十萬元以下罰鍰；其尚未施工者，並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行者，按次處罰；必要時，得令其停工。","note":"一、本條新增。\n二、配合修正條文第十四條及第十五條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、基於鼓勵業者自願符合綠色設計，第一項第一款僅限於處罰違反強制實施綠色設計規定之業者。\n四、考量營建工程於規劃設計階段若違反第十五條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項針對尚未施工者定明通知限期提出改善計畫之情形。另考量營建工程之施作必須依其規劃設計內容進行施工，故對於屆期未依改善計畫執行者，按次處罰；另於必要時，得令其停工。"},{"bill":"202110207600000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理創新實驗；於計畫結束後，申請人應提送計畫執行成果資料，報中央主管機關備查。\n經核准之創新實驗行為，於實驗期間內得排除中央主管機關核准決定載明特定法律全部或一部之適用。\n前項法律包括下列規定：\n一、本法第二十六條至第三十條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十九條第二項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環保法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請資格及程序、審查、核准內容、變更、廢止、執行成果備查、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用者，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項、第三項定明於實驗期間得不適用之法律規定。\n四、第四項授權中央主管機關訂定實驗計畫有關事項之辦法。"},{"bill":"201110206460000","text":"有下列情形之一者，由中央主管機關處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第十四條第一項公告所定期限申請核定產品符合綠色設計準則。\n二、指定產品之製造、輸入業者，違反依第十四條第四項所定辦法有關核定事項、變更、查核、抽樣檢驗或資料備查之規定。\n營建工程之工程主辦機關或起造人違反依第十五條第一項所定公告有關綠色設計準則指定項目之規定者，處新臺幣六萬元以上三十萬元以下罰鍰；其尚未施工者，並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行者，按次處罰；必要時，得令其停工。","note":"一、本條新增。\n二、配合修正條文第十四條及第十五條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、基於鼓勵業者自願符合綠色設計，第一項第一款僅限於處罰違反強制實施綠色設計規定之業者。\n四、考量營建工程於規劃設計階段若違反第十五條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項針對尚未施工者定明通知限期提出改善計畫之情形。另考量營建工程之施作必須依其規劃設計內容進行施工，故對於屆期未依改善計畫執行者，按次處罰；另於必要時，得令其停工。"},{"bill":"202110209820000","text":"有下列情形之一者，由中央主管機關處新臺幣六千元以上三十萬元以下罰鍰，並 對於屆期未依改善計畫執行者，按次處罰；另於必要時，得令其停工。"}],"changed":true,"final":"為促進資源循環技術或數位科技治理發展之目的，事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關審查創新實驗計畫時，應審酌其創新性、必要性、可行性、風險控管、環境影響；中央主管機關核准創新實驗計畫得附加實驗期間、範圍、規模、方法、監測、通報、返還獎勵或補助、限期改善或停止實驗、廢止核准及其他附款一併納入核准事項，事業應依核准內容執行。\n中央主管機關應會商中央及地方有關機關後，核准創新實驗計畫於創新實驗期間內，排除下列法律全部或一部之適用。但排除法律適用範圍應以達成實驗目的為必要且相當者為限，且不得排除涉及人體健康、公共安全或其他重大環境風險之強制規定與民事、刑事責任及行政機關依法應採取之緊急處置措施規定：\n一、第二十五條、第二十七條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項第一款、第三十六條、第三十九條第一項、第四十一條第一項。\n中央主管機關於核准創新實驗計畫後，應將事業名稱、創新實驗內容、期間、範圍、排除適用之規定及其他相關資訊揭露於指定網站；創新實驗計畫經展延、變更、撤銷或廢止者，亦應揭露之。\n前四項資源循環創新實驗計畫之申請、審查、核准、管理、變更、展延、執行成果提送與備查、資訊公開、風險控管、監測、通報、返還獎勵或補助、限期改善或停止實驗、撤銷或廢止核准及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、本條新增。\n二、為促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、第二項定明中央主管機關於審查創新實驗計畫時，應就其技術創新程度、實施必要性及可能衍生之環境風險進行整體評估，並得依個案特性附加適當管理措施及監督機制。另考量創新實驗具有高度變動性及不確定性，爰授權主管機關得視實驗執行情形，採取限期改善、停止或廢止等必要處置。\n四、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第三項定明於實驗期間得不適用之法律規定，惟為兼顧環境保護及公共利益，爰併予定明相關排除措施仍應受必要性及比例原則拘束，並不得排除涉及人體健康、公共安全及重大環境風險之管理要求。\n五、第四項定明中央主管機關應公開創新實驗計畫相關資訊，係為提升創新實驗制度之透明度及社會信賴，並利外界瞭解實驗內容及法規調適情形。另考量創新實驗計畫於執行期間，可能因實際需求而有展延、變更或停止等情形，爰併予定明相關異動資訊亦應公開，以利社會監督及後續管理。\n六、第五項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。","review":null},{"no":"第三十八條","current":"依第十五條及第十八條規定有申報或記錄義務者，明知為不實之事項而申報不實或於業務上作成之文書為虛偽記載者，處三年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。","versions":[{"bill":"202110167180000","text":"依本法規定有申請或申報義務，明知為不實之事項而申請、申報不實或於業務上作成之文書為虛偽記載者，處三年以下有期徒刑、拘役或科或併科新臺幣二十萬元以上五百萬元以下罰金。","note":"一、條次變更。\n二、為督促義務人確實履行申請及申報義務，參考空氣污染防制法第五十四條之刑罰規定，酌予調整罰金額度，並新增申請不實之處罰態樣。"},{"bill":"202110174540000","text":"有下列情形之一者，處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；必要時，得令其停工或停業：\n一、未依第十四條第一項規定於指定期限內申請核定產品符合綠色設計。\n二、指定產品之製造、輸入業者，違反依第十四條第四項所定辦法有關核定事項、資料備查或管理之規定。\n營建工程之工程主辦機關或起造人違反第十五條第一項有關綠色設計準則之指定項目規定者，處新臺幣六萬元以上三十萬元以下罰鍰，其未施工者並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行者，按次處罰；必要時，得令其停工。","note":"一、本條新增。\n二、配合修正條文第十四條及第十五條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、基於鼓勵業者自願符合綠色設計，第一項第一款僅限於處罰違反強制實施綠色設計規定之業者。\n四、考量營建工程於規劃設計階段若違反第十五條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項定明通知限期改善之情形。另考量營建工程之施作必須依其規劃設計內容進行施工，故對於違反規定者，對於未施工者並通知限期提出改善計畫，據以執行。"},{"bill":"202110204890000","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明。"},{"bill":"202110207060000","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明"},{"bill":"202110207600000","text":"依本法規定有申請或申報義務，明知為不實之事項而申請、申報不實或於業務上作成之文書為虛偽記載者，處三年以下有期徒刑、拘役或科或併科新臺幣二十萬元以上五百萬元以下罰金。","note":"一、條次變更。\n二、為督促義務人確實履行申請及申報義務，參考空氣污染防制法第五十四條之刑罰規定，酌予調整罰金額度，並新增申請不實之處罰態樣。"},{"bill":"201110206460000","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明。"},{"bill":"202110209820000","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、條次變更。\n二、增訂違反物品或包裝容器禁限用規定之罰則。依業者規模區分不同罰鍰級距。因禁限用違規得處以下架等處置，爰刪除停工、停業等規定。"},{"bill":"202110209800000","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明。"},{"bill":"202110209750000","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明。"},{"bill":"202110206620000","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明。"}],"changed":true,"final":"有下列情形之一者，由中央主管機關處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第十四條第一項公告所定期限申請核定產品符合綠色設計準則。\n二、指定產品之製造、輸入業者，違反依第十四條第四項所定辦法有關核定事項、變更、查核、抽樣檢驗或資料備查之規定。\n營建工程之工程主辦機關或起造人違反依第十五條第一項所定公告有關綠色設計準則指定項目之規定者，處新臺幣六萬元以上三十萬元以下罰鍰；其尚未施工者，並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行者，按次處罰；必要時，得令其停工。","finalWhy":"一、本條新增。\n二、配合修正條文第十四條及第十五條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、基於鼓勵業者自願符合綠色設計，第一項第一款僅限於處罰違反強制實施綠色設計規定之業者。\n四、考量營建工程於規劃設計階段若違反第十五條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項針對尚未施工者定明通知限期提出改善計畫之情形。另考量營建工程之施作必須依其規劃設計內容進行施工，故對於屆期未依改善計畫執行者，按次處罰；另於必要時，得令其停工。","review":null},{"no":"第三十九條","current":"有下列情形之一者，主管機關或目的事業主管機關得處新臺幣三萬元以上十五萬元以下罰鍰。經通知限期補正或改善，屆期仍未補正或完成改善者，按日連續處罰；情節重大者，得處一個月以上一年以下停工或停業處分；必要時，予以歇業處分：\n一、製造業或輸入業違反第十一條第一項指定應遵行事項之一或第二項公告事項者。\n二、違反中央主管機關依第十三條所定之物品、包裝、容器與其材質、規格及限制或禁止使用方式者。\n三、製造業或輸入業違反第十四條規定包裝產品者。\n四、違反依第十五條第二項或第四項所定之管理辦法者。\n五、違反中央主管機關依第十七條第一項所定限制或禁止再生資源輸入或輸出之規定者。\n六、違反第十八條申報規定者。\n七、規避、妨礙或拒絕主管機關或目的事業主管機關依第二十一條所為之檢查或要求者。\n事業不遵行依本法所為停工或停業處分者，當地主管機關得報請中央主管機關轉請目的事業主管機關，予以歇業處分。","versions":[{"bill":"202110167180000","text":"有下列情形之一者，處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；必要時，得令其停工或停業：\n一、未依第十五條第一項規定於指定期限內申請核定產品符合綠色設計。\n二、違反第十五條第三項所定辦法有關核定事項、資料提送備查或管理之規定。\n營建工程之工程主辦機關或起造人違反第十六條第一項、第二項有關綠色設計準則之指定項目規定者，處新臺幣六萬元以上三十萬元以下罰鍰，其未施工者並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行，按次處罰；必要時，得令其停工。","note":"一、本條新增。\n二、配合修正條文第十五條及第十六條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、考量營建工程於規劃設計階段若違反第十六條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項定明通知限期改善之情形。"},{"bill":"202110174540000","text":"有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰；其違反者為販賣、使用業者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反第十八條第二項公告有關禁止、限制方式、資料備查或管理之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴管制措施及管理規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處分。","note":"一、本條新增。\n二、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定。\n三、考量業者規模不同，處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。\n四、違反第十八條第三項同時涉及本法及地方自治條例，則依行政罰法第二十四條意旨從一重裁處。"},{"bill":"202110204890000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十條第三款明文，爰予刪除。\n(三)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(四)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(五)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(六)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"202110207060000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣一萬二千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則。\n(三)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十條第三款明文，爰予刪除。\n(四)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(五)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(六)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(七)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"202110207600000","text":"有下列情形之一者，處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；必要時，得令其停工或停業：\n一、未依第十五條第一項規定於指定期限內申請核定產品符合綠色設計。\n二、違反第十五條第三項所定辦法有關核定事項、資料提送備查或管理之規定。\n營建工程之工程主辦機關或起造人違反第十六條第一項、第二項有關綠色設計準則之指定項目規定者，處新臺幣六萬元以上三十萬元以下罰鍰，其未施工者並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行，按次處罰；必要時，得令其停工。","note":"一、本條新增。\n二、配合修正條文第十五條及第十六條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、考量營建工程於規劃設計階段若違反第十六條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項定明通知限期改善之情形。"},{"bill":"201110206460000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣一萬二千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則。\n(三)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十條第三款明文，爰予刪除。\n(四)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(五)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(六)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(七)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"201110206460000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110209820000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣一萬二千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、配合其他環保法律體例將「按日連續處罰」修正為「按次處罰」，並調整罰鍰下限。\n三、刪除已移列之處罰款次。\n四、歇業處分回歸各目的事業主管法規辦理，予以刪除。"},{"bill":"202110209800000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣一萬二千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十條第三款明文，爰予刪除。\n(三)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(四)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(五)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(六)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"202110209750000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十條第三款明文，爰予刪除。\n(三)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(四)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(五)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(六)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"202110206620000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則。\n(三)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十條第三款明文，爰予刪除。\n(四)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(五)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(六)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(七)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"}],"changed":true,"final":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","finalWhy":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將原第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明。","review":null},{"no":"第三十九條之一","current":"再利用產品有下列情形之一，經中央主管機關指定公告者，由中央目的事業主管機關負責其流向追蹤管理，必要時並實施環境監測：\n一、用於填海或填築土地者。\n二、有不當利用、污染環境或危害人體健康之虞者。\n三、其他經中央主管機關認定需加強管制者。\n前項環境監測之監測項目、採樣頻率、樣品採樣方法、檢測方法與程序及其他應遵行事項之辦法，由中央目的事業主管機關會商中央主管機關、再利用用途目的事業主管機關定之。","versions":[{"bill":"201110206460000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、增訂第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十九條之二","current":null,"versions":[{"bill":"201110206460000","text":"中央主管機關得考量事業廢棄物或再利用產品之用途、成分、特性、數量、棄置風險及其他相關因素，指定產源事業、再利用事業及再利用產品使用者，採取下列全部或一部之管理措施：\n一、簽訂再利用委託或再利用產品銷售契約書及記載中央主管機關指定事項。\n二、進行再利用產品或再利用製程之驗證。\n三、進行再利用產品檢測。\n四、限制再利用產品銷售對象。\n五、限制再利用產品使用用途或方式。\n六、設置中央主管機關指定之設備。\n七、設置專業技術人員。\n八、設置閉路電視錄影監視系統及瀏覽伺服，供主管機關檢視。\n九、其他經中央主管機關指定之管理措施。\n前項產源事業、再利用事業及再利用產品使用者之指定、契約書應記載事項、驗證事項、產品檢測事項、檢測報告應具備之內容、銷售對象、使用用途或方式、設備設置、專業技術人員設置、監視系統及瀏覽伺服規格、其他管理措施之指定及相關應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為強化事業廢棄物再利用及再利用產品使用管理，中央主管機關得視其運作風險，明定不同管理措施，例如再利用產品做為原料、材料等，高質化再利用之運作風險相對較低；如用於填土、燃料等用途，因受社會關注度大、管理密度需求較高，有強化管理之必要，爰為第一項規定：\n(一)第一款在透過簽訂契約方式，使產源事業、再利用事業及再利用產品使用者於實際從事再利用運作或使用產品前，掌握後續再利用行為及再利用產品使用符合相關規定。\n(二)第二款在透過驗證機制提升再利用產品市場接受度及競爭力。\n(三)第三款在透過再利用產品檢測，確認產品符合品質規範。\n(四)第四款要求再利用事業銷售再利用產品之對象應符合資格。\n(五)第五款要求再利用產品使用者應依規定使用再利用產品。\n(六)第六款要求產源事業、再利用事業及再利用產品使用者應設置必要之設備，確保再利用行為及再利用產品使用符合相關規定。\n(七)第七款要求設置專業技術人員，以強化再利用機構自我管理能力。\n(八)第八款要求設置閉路電視錄影監視系統及瀏覽伺服，以利主管機關即時遠端檢視再利用運作情形。\n(九)第九款授權由中央主管機關視需求採取其他管理措施。\n三、第二項授權中央主管機關就第一項所定事項訂定辦法。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十九條之三","current":null,"versions":[{"bill":"201110206460000","text":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業依前條第一項第二款規定，應進行再利用產品或再利用製程之驗證者，其生產之再利用產品應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n第一項再利用產品之指定、再利用產品品質規範、標示、使用限制、警語、供料履歷，及前項驗證機構與認證機關（構）資格、驗證與認證程序、驗證與認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n中央目的事業主管機關應輔導再利用事業進行生產之改善及推廣再利用產品，並得委託或委辦其他機關（構）、法人或團體辦理。","note":"一、本條新增。\n二、第一項定明經指定之再利用產品應符合品質規範及標示義務。\n三、第二項定明經指定之再利用產品或再利用製程應通過驗證。\n四、第三項授權中央主管機關訂定再利用產品品質、標示、驗證、認證等相關事項之辦法。\n五、第四項考量再利用事業生產再利用產品過程及後續產品使用階段，涉及事業廢棄物產源、再利用製程及再利用產品管理等相關事項，各中央目的事業主管機關應掌握其所轄事業特性及運作情形，爰定明應負輔導改善及產品推廣之權責。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十九條之四","current":null,"versions":[{"bill":"201110206460000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項規範主管機關得令再利用事業停止進廠（場）情形：\n(一)第一款係因未於一定期限完成廢棄物再利用作業者，足徵其再利用量能或去化能力出現落差。\n(二)第二款係因再利用設備故障或異常，且於一定期限仍無法完成修復，足認喪失基本再利用條件。\n(三)第三款係因再利用產品貯存超量，顯示去化能力不足。\n(四)第四款係因業者不配合查核作業或拒絕提供資料或說明，無法確認營運情形。\n(五)第五款賦予主管機關依個案實際情形判斷之概括條款。\n三、第二項規範主管機關得令再利用事業停止再利用運作情形：\n(一)第一款在確保再利用事業依規定進行再利用。\n(二)第二款在確保再利用事業依規定進行再利用產品或製程驗證。\n(三)第三款在確保再利用事業依規定進行再利用產品檢測。\n(四)第四款在確保再利用事業設置應有之設備。\n(五)第五款理由同說明二(四)、(五)。\n四、第三項規範主管機關得令再利用事業停止銷售或運送再利用產品出廠（場）情形：\n(一)第一款係考量再利用產品若未符合品質規範及銷售對象規定，有污染環境之虞。\n(二)第二款係考量若提供不實相關文件，產出之再利用產品有損害公眾或使用者權益之虞。\n(三)第三款係考量指定之再利用產品經中央主管機關依修正條文第三十九條之二第一項第五款規定限制使用用途或方式者，再利用事業明知使用者違規使用，仍持續銷售或運送，恐生環境風險，有污染環境之虞。\n(四)第四款理由同說明二(四)、(五)。\n五、第四項規定再利用事業改善完成恢復再利用相關行為之程序。\n六、第五項授權中央主管機關訂定停止、恢復再利用行為等相關事項之辦法。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十九條之五","current":null,"versions":[{"bill":"201110206460000","text":"加工再製中央主管機關指定之再利用產品者（以下簡稱加工再製事業），應依第三十一條第一項至第三項規定，於事業廢棄物清理計畫書載明加工再製流程，送直轄市、縣（市）主管機關或中央主管機關委託之機關審查核准後，始得為之。\n加工再製事業記錄、申報加工再製之再利用產品及產品品質規範、標示事項、驗證、專業技術人員設置與停止加工再製運作、銷售、運送與恢復加工再製相關行為及中央主管機關得對其採取之管理措施，準用第三十九條第三項、第四項、第三十九條之二至前條規定。\n經中央主管機關指定加工再製之再利用產品，其使用者記錄、申報、使用證明保存、檢具環境監測報告書申請核准及環境監測結果報告之備查，準用第三十九條之一規定。","note":"一、本條新增。\n二、為強化管理指定再利用產品之加工再製行為，爰於第一項定明加工再製事業之事業廢棄物清理計畫書須經審核機關審查核准，始得從事加工再製行為。\n三、考量指定再利用產品之加工再製及後續加工再製之再利用產品使用，應有與再利用事業相同之管理規範，爰於第二項、第三項定明準用第三十九條第三項、第四項及第三十九條之一至前條規定，以完善事業廢棄物再利用運作之全程管理。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十條","current":"有下列情形之一者，主管機關或目的事業主管機關得處新臺幣三萬元以上十五萬元以下罰鍰。經通知限期補正或改善，屆期仍未補正或完成改善者，按日連續處罰；情節重大者，得處一個月以上一年以下停工或停業處分；必要時，予以歇業處分：\n一、製造業或輸入業違反第十一條第一項指定應遵行事項之一或第二項公告事項者。\n二、違反中央主管機關依第十三條所定之物品、包裝、容器與其材質、規格及限制或禁止使用方式者。\n三、製造業或輸入業違反第十四條規定包裝產品者。\n四、違反依第十五條第二項或第四項所定之管理辦法者。\n五、違反中央主管機關依第十七條第一項所定限制或禁止再生資源輸入或輸出之規定者。\n六、違反第十八條申報規定者。\n七、規避、妨礙或拒絕主管機關或目的事業主管機關依第二十一條所為之檢查或要求者。\n事業不遵行依本法所為停工或停業處分者，當地主管機關得報請中央主管機關轉請目的事業主管機關，予以歇業處分。","versions":[{"bill":"202110167180000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣六萬元以上三十萬元以下罰鍰；其違反者為販賣、使用業者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十九條第三項、第五項公告有關禁止、限制方式、資料提送備查或管理之規定。\n二、不遵行主管機關或目的事業主管機關依第十九條第四項規定所為之處分。","note":"一、本條新增。\n二、配合修正條文第十九條物品、包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定。\n三、考量業者規模不同，處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。"},{"bill":"202110174540000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止或管理之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定，說明如下：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)第一款違反條次已修正移列至第二十二條，其處罰已於修正條文第四十條第二款明文，爰予刪除。\n(三)第二款違反條次已修正移列至第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(四)第三款違反條次已修正移列至第十九條，其處罰已於修正條文第四十一條第三款、第四十三條第二款明文，爰予刪除。\n(五)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(六)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"202110204890000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。"},{"bill":"202110207060000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。"},{"bill":"202110207600000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣六萬元以上三十萬元以下罰鍰；其違反者為販賣、使用業者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十九條第三項、第五項公告有關禁止、限制方式、資料提送備查或管理之規定。\n二、不遵行主管機關或目的事業主管機關依第十九條第四項規定所為之處分。","note":"一、本條新增。\n二、配合修正條文第十九條物品、包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定。\n三、考量業者規模不同，處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。"},{"bill":"201110206460000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。"},{"bill":"202110209820000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、條次變更。\n二、增訂違反循環標誌、產品資訊揭露及環保標章管理規定之罰則，並調整罰鍰下限。因相關違規未致實質危害，爰刪除停工、停業等規定。"},{"bill":"202110209800000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。"},{"bill":"202110209750000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。"},{"bill":"202110206620000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。"}],"changed":true,"final":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣一萬二千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十八條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十九條申報規定。","finalWhy":"一、條次變更，本條為原第二十六條移列。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則。\n(三)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(四)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十九條明文，爰予刪除。\n(五)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十二條第三款明文，爰予刪除。\n(六)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(七)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。","review":null},{"no":"第四十一條","current":"有下列情形之一者，主管機關或目的事業主管機關得處新臺幣三萬元以上十五萬元以下罰鍰。經通知限期補正或改善，屆期仍未補正或完成改善者，按日連續處罰；情節重大者，得處一個月以上一年以下停工或停業處分；必要時，予以歇業處分：\n一、製造業或輸入業違反第十一條第一項指定應遵行事項之一或第二項公告事項者。\n二、違反中央主管機關依第十三條所定之物品、包裝、容器與其材質、規格及限制或禁止使用方式者。\n三、製造業或輸入業違反第十四條規定包裝產品者。\n四、違反依第十五條第二項或第四項所定之管理辦法者。\n五、違反中央主管機關依第十七條第一項所定限制或禁止再生資源輸入或輸出之規定者。\n六、違反第十八條申報規定者。\n七、規避、妨礙或拒絕主管機關或目的事業主管機關依第二十一條所為之檢查或要求者。\n事業不遵行依本法所為停工或停業處分者，當地主管機關得報請中央主管機關轉請目的事業主管機關，予以歇業處分。","versions":[{"bill":"202110167180000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求。\n二、違反依第二十六條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十八條第二項所定辦法有關限制、禁止或管理之規定。\n四、違反第二十九條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定，說明如下：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)第一款違反條次已修正移列至第二十三條，其處罰已於修正條文第四十二條第一項第二款明文，爰予刪除。\n(三)第二款違反條次已修正移列至第十九條，其處罰已於修正條文第四十條明文，爰予刪除。\n(四)第三款違反條次已修正移列至第二十條，其處罰已於修正條文第四十三條第三款、第四十四條第二款明文，爰予刪除。\n(五)現行第七款遞移至第一款，並配合修正違反條次及酌作文字修正。\n(六)現行第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"202110174540000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、標示、使用、變更、查核、抽樣檢驗或管理之規定。\n二、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項指定期限內標示，或違反同條第三項所定辦法有關揭露標示之內容、方式或管理之規定。\n三、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、變更、查核、抽樣檢驗、資料提報或管理之規定。\n四、違反第二十一條第三項或第二十四條禁止規定。","note":"一、本條新增。\n二、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定。"},{"bill":"202110204890000","text":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之製造、輸入業者，違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、違反依第十七條第一項所定公告有關減量目標、方式、期限之規定，或違反依同條第二項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n三、製造、運輸業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定；輸入業者違反同條第三項規定。\n四、製造、輸入業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、配合修正條文第十六條、第十七條、第十九條及第二十條關於指定物品、包裝或容器重複使用、減量、延長使用之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第三款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反物品或其包裝、容器重複使用規定未致環境污染之實害，爰刪除情節重大規定得停工、停業或歇業規定，並酌作文字修正。\n三、基於鼓勵業者自願配合包裝容器重複使用，第一款僅限於處罰違反強制實施重複使用規定之業者。"},{"bill":"202110207060000","text":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之製造、輸入業者，違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、違反依第十七條第一項所定公告有關減量目標、方式、期限之規定，或違反依同條第二項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n三、製造、運輸業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定；輸入業者違反同條第三項規定。\n四、製造、輸入業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、配合修正條文第十六條、第十七條、第十九條及第二十條關於指定物品、包裝或容器重複使用、減量、延長使用之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第三款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反物品或其包裝、容器重複使用規定未致環境污染之實害，爰刪除情節重大規定得停工、停業或歇業規定，並酌作文字修正。\n三、基於鼓勵業者自願配合包裝容器重複使用，第一款僅限於處罰違反強制實施重複使用規定之業者。"},{"bill":"202110207600000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求。\n二、違反依第二十六條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十八條第二項所定辦法有關限制、禁止或管理之規定。\n四、違反第二十九條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定，說明如下：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)第一款違反條次已修正移列至第二十三條，其處罰已於修正條文第四十二條第一項第二款明文，爰予刪除。\n(三)第二款違反條次已修正移列至第十九條，其處罰已於修正條文第四十條明文，爰予刪除。\n(四)第三款違反條次已修正移列至第二十條，其處罰已於修正條文第四十三條第三款、第四十四條第二款明文，爰予刪除。\n(五)現行第七款遞移至第一款，並配合修正違反條次及酌作文字修正。\n(六)現行第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"201110206460000","text":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之製造、輸入業者，違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、違反依第十七條第一項所定公告有關減量目標、方式、期限之規定，或違反依同條第二項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n三、製造、運輸業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定；輸入業者違反同條第三項規定。\n四、製造、輸入業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、配合修正條文第十六條、第十七條、第十九條及第二十條關於指定物品、包裝或容器重複使用、減量、延長使用之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第三款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反物品或其包裝、容器重複使用規定未致環境污染之實害，爰刪除情節重大規定得停工、停業或歇業規定，並酌作文字修正。\n三、基於鼓勵業者自願配合包裝容器重複使用，第一款僅限於處罰違反強制實施重複使用規定之業者。"},{"bill":"201110206460000","text":"從事廢棄物清除、處理業務者，應向直轄市、縣（市）主管機關或中央主管機關委託之機關申請核發公民營廢棄物清除處理機構許可文件後，始得受託清除、處理廢棄物業務。但有下列情形之一者，不在此限：\n一、執行機關依第五條第二項、第六項、第十二條第一項辦理一般廢棄物之回收、清除、處理、再利用。\n二、依第八條規定緊急清理廢棄物所指定之設施或設備。\n三、依第十四條第二項規定依中央主管機關公告或核准之方式清除、處理一般廢棄物。\n四、依第十八條第一項所定標準回收、貯存、清除、處理廢棄物。\n五、第二十八條第一項第二款、第三款第二目至第五目、第四款之清除機具、處理設施或設備。\n六、目的事業主管機關依第三十三條、第三十四條規定自行或輔導設置之處理設施。\n七、中央主管機關會同中央目的事業主管機關依第三十五條第一項設置之設施。\n八、其他經中央主管機關公告者。\n前項公民營廢棄物清除處理機構許可文件之核發，應副知中央主管機關。","note":"一、第一項第四款配合修正條文第十五條公告應回收廢棄物之範疇，不受限於一般廢棄物，及配合修正條文第十八條第一項規定，酌作文字修正。\n二、第二項未修正。"},{"bill":"202110209820000","text":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之製造、輸入業者，違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、違反依第十七條第一項所定公告有關減量目標、方式、期限之規定，或違反依同條第二項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n三、製造、運輸業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定；輸入業者違反同條第三項規定。\n四、製造、輸入業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、條次變更。\n二、增訂違反強制性物品或包裝容器重複使用、減量、延長使用等規定之罰則，並調整罰鍰下限。因違規未致環境污染實害，爰刪除停工、停業等規定。"},{"bill":"202110209800000","text":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之製造、輸入業者，違反依第十六條 ，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","finalWhy":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將原第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。","review":null},{"no":"第四十二條","current":null,"versions":[{"bill":"202110167180000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、產品製造、輸入、販賣或服務提供業者違反第二十二條第二項所定辦法有關循環標誌之核准事項、標示、使用、變更、管理之規定，或違反第三項禁止規定。\n二、產品之製造、輸入或販賣業者違反依第二十三條第三項所定辦法有關標示揭露之內容、方式或管理之規定，或違反同條第四項禁止規定。\n三、違反依第二十四條第三項所定辦法有關環保標章之標示、使用、同意事項、變更、查核、抽樣檢驗、資料提報或管理之規定。\n四、違反第二十五條環保標章之禁止規定。\n有前項各款情形之一者，中央主管機關得公布違規業者之名稱、地址、產品及違法情形。","note":"一、本條新增。\n二、配合修正條文第二十二條、第二十三條、第二十四條及第二十五條關於產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定。\n三、為嚇阻不肖業者，保障消費大眾權益避免遭受損害，爰於第二項定明中央主管機關得公布業者違規資訊。"},{"bill":"202110174540000","text":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之製造、輸入業者，違反第十六條第一項公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、執行成果備查或管理之規定。\n二、違反第十七條第一項公告有關減量目標、方式、期限之規定，或違反依同條第二項所定辦法有關核准事項、執行成果備查或管理之規定。\n三、製造、輸入業者違反第十九條第一項公告有關包裝減量目標、空間比例、層數、使用材質種類、數量、期限之規定，違反依同條第二項所定辦法有關執行成果備查或管理之規定，或違反同條第三項規定。\n四、製造、輸入業者違反第二十條第一項公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關執行成果備查、必要設施設置方式或管理之規定。","note":"一、本條新增。\n二、配合修正條文第十六條、第十七條、第十九條及第二十條關於指定物品、包裝或容器重複使用、減量、延長使用之管理規定，增訂相關違反行為之處罰規定。\n三、基於鼓勵業者自願配合包裝容器重複使用，第一款僅限於處罰違反強制實施重複使用規定之業者。"},{"bill":"202110204890000","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十六條第三項辦法之處罰規定，俾資周妥。"},{"bill":"202110207060000","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十六條第三項辦法之處罰規定，俾資周妥。"},{"bill":"202110207600000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、產品製造、輸入、販賣或服務提供業者違反第二十二條第二項所定辦法有關循環標誌之核准事項、標示、使用、變更、管理之規定，或違反第三項禁止規定。\n二、產品之製造、輸入或販賣業者違反依第二十三條第三項所定辦法有關標示揭露之內容、方式或管理之規定，或違反同條第四項禁止規定。\n三、違反依第二十四條第三項所定辦法有關環保標章之標示、使用、同意事項、變更、查核、抽樣檢驗、資料提報或管理之規定。\n四、違反第二十五條環保標章之禁止規定。\n有前項各款情形之一者，中央主管機關得公布違規業者之名稱、地址、產品及違法情形。","note":"一、本條新增。\n二、配合修正條文第二十二條、第二十三條、第二十四條及第二十五條關於產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定。\n三、為嚇阻不肖業者，保障消費大眾權益避免遭受損害，爰於第二項定明中央主管機關得公布業者違規資訊。"},{"bill":"201110206460000","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十六條第三項辦法之處罰規定，俾資周妥。"},{"bill":"202110209820000","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、明定違反資源循環創新實驗計畫管理辦法之罰則，以確保計畫確實執行並維護管理秩序。"},{"bill":"202110209800000","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十六條第三項辦法之處罰規定，俾資周妥。"},{"bill":"202110209750000","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十六條第三項辦法之處罰規定，俾資周妥。"},{"bill":"202110206620000","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十六條第三項辦法之處罰規定，俾資周妥。"}],"changed":true,"final":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之製造、輸入業者，違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、違反依第十七條第一項所定公告有關減量目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n三、製造、運輸業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定；輸入業者違反同條第三項規定。\n四、製造、輸入業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","finalWhy":"一、配合修正條文第十六條、第十七條、第十九條及第二十條關於指定物品、包裝或容器重複使用、減量、延長使用之管理規定，增訂相關違反行為之處罰規定，並將現行第二十六條第一項第三款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反物品或其包裝、容器重複使用規定未致環境污染之實害，爰刪除情節重大規定得停工、停業或歇業規定，並酌作文字修正。\n三、基於鼓勵業者自願配合包裝容器重複使用，第一款僅限於處罰違反強制實施重複使用規定之業者。","review":null},{"no":"第四十三條","current":"檢驗測定機構應取得中央主管機關核發許可證，始得辦理本法規定之檢驗。\n前項檢驗測定機構之條件、設施、檢驗測定人員學經歷、許可證之申請、審查、核（換）發、廢止、停業、復業、歇業、查核、評鑑等程序及其他應遵行事項之管理辦法，由中央主管機關定之。","versions":[{"bill":"202110167180000","text":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品之製造、輸入業者，未依第十七條第一項規定提送包裝容器重複使用計畫，或違反同條第三項所定辦法有關核准事項、執行成果備查或管理之規定。\n二、指定之事業，未依第十八條第一項規定提送物品或其包裝、容器減量計畫，或違反依同條第二項所定辦法有關核准事項、執行成果備查或管理之規定。\n三、指定物品之製造、輸入業者違反第二十條第一項公告有關包裝減量目標、空間比例、層數、使用材質種類及數量之規定，違反依同條第三項所定辦法有關執行成果備查或管理之規定，或輸入業者違反同條第四項規定。\n四、指定物品之製造、輸入業者違反第二十一條第一項公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、執行成果備查或管理之規定。","note":"一、本條新增。\n二、配合修正條文第十七條、第十八條、第二十條及第二十一條關於指定物品、包裝或容器重複使用、減量、延長使用之管理規定，增訂相關違反行為之處罰規定。"},{"bill":"202110174540000","text":"違反依第三十七條第三項所定辦法有關核准事項、執行成果備查或管理之規定，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十七條第三項辦法之處罰規定，俾資周妥。"},{"bill":"202110204890000","text":"有下列情形之一者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之販賣業者違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、販賣業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定。\n三、販賣業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、本條新增。\n二、考量販賣業者多屬小規模事業，爰針對該等業者違反修正條文第十六條、第十九條及第二十條指定物品、包裝或容器重複使用、減量、延長使用之管理規定，另增訂相關處罰規定，以符合責罰相當原則。"},{"bill":"202110207060000","text":"有下列情形之一者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之販賣業者違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、販賣業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定。\n三、販賣業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、本條新增。\n二、考量販賣業者多屬小規模事業，爰針對該等業者違反修正條文第十六條、第十九條及第二十條指定物品、包裝或容器重複使用、減量、延長使用之管理規定，另增訂相關處罰規定，以符合責罰相當原則。"},{"bill":"202110207600000","text":"有下列情形之一者，處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品之製造、輸入業者，未依第十七條第一項規定提送包裝容器重複使用計畫，或違反同條第三項所定辦法有關核准事項、執行成果備查或管理之規定。\n二、指定之事業，未依第十八條第一項規定提送物品或其包裝、容器減量計畫，或違反依同條第二項所定辦法有關核准事項、執行成果備查或管理之規定。\n三、指定物品之製造、輸入業者違反第二十條第一項公告有關包裝減量目標、空間比例、層數、使用材質種類及數量之規定，違反依同條第三項所定辦法有關執行成果備查或管理之規定，或輸入業者違反同條第四項規定。\n四、指定物品之製造、輸入業者違反第二十一條第一項公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、執行成果備查或管理之規定。","note":"一、本條新增。\n二、配合修正條文第十七條、第十八條、第二十條及第二十一條關於指定物品、包裝或容器重複使用、減量、延長使用之管理規定，增訂相關違反行為之處罰規定。"},{"bill":"201110206460000","text":"有下列情形之一者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之販賣業者違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、販賣業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定。\n三、販賣業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、本條新增。\n二、考量販賣業者多屬小規模事業，爰針對該等業者違反修正條文第十六條、第十九條及第二十條指定物品、包裝或容器重複使用、減量、延長使用之管理規定，另增訂相關處罰規定，以符合責罰相當原則。"},{"bill":"201110206460000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定或其他必要之情形，爰參考水污染防治法第二十三條第一項規定，於第一項增訂得經中央主管機關核准執行本法相關檢驗測定之規定，並酌作文字修正。\n二、為期明確，並因應實務運作需求，爰參考氣候變遷因應法第四十一條第二項規定，修正第二項之授權事項。"},{"bill":"202110209820000","text":"有下列情形之一者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之販賣業者違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、販賣業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定。\n三、販賣業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、本條新增。\n二、考量販賣業者多屬小規模事業，針對其違反重複使用、減量及延長使用等規定另訂較低之罰鍰級距，以符比例原則。"},{"bill":"202110209800000","text":"有下列情形之一者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之販賣業者違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、販賣業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告
