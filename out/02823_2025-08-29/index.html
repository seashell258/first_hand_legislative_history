資分享機制。\n前項資通安全情資之分析、整合與分享之內容、程序、方法及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、資通安全情資分享之執行，主要係國內外之資通安全資訊交流、資通安全警訊發布等技術性事務，目前實務現況係由資安署辦理，爰修正第一項。\n三、第二項未修正。"},{"bill":"202110105760000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選認適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利、義務及違約責任。\n前項書面契約之格式、內容，中央主管機關應訂定定型化契約範本及其應記載及不得記載事項。","note":"一、為強化公務機關或特定非公務機關委外辦理資通安全設施時，應要求其受託對象符合資通安全管理法的規定。\n二、增訂各機關為落實委外監督管理，應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任。"},{"bill":"202110111210000","text":"資安署應建立資通安全情資分享機制。\n前項資通安全情資之分析、整合與分享之內容、程序、方法及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、資通安全情資分享之執行，主要係國內外之資通安全資訊交流、資通安全警訊發布等技術性事務，目前實務現況係由資安署辦理，爰修正第一項。\n三、第二項未修正。"},{"bill":"202110127080000","text":"資安署應建立資通安全情資分享機制。\n前項資通安全情資之分析、整合與分享之內容、程序、方法及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、資通安全情資分享之執行，主要係國內外之資通安全資訊交流、資通安全警訊發布等技術性事務，目前實務現況係由資安署辦理，爰修正第一項。\n三、第二項未修正。"},{"bill":"202110128370000","text":"資安署應建立資通安全情資分享機制。\n前項資通安全情資之分析、整合與分享之內容、程序、方法及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、資通安全情資分享之執行，主要係國內外之資通安全資訊交流、資通安全警訊發布等技術性事務，目前實務現況係由資安署辦理，爰修正第一項。\n三、第二項未修正。"},{"bill":"202110129110000","text":"資安署應建立資通安全情資分享機制。\n前項資通安全情資之分析、整合與分享之內容、程序、方法及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、資通安全情資分享之執行，主要係國內外之資通安全資訊交流、資通安全警訊發布等技術性事務，目前實務現況係由資安署辦理，爰修正第一項。\n三、第二項未修正。"}],"changed":true,"final":"主管機關應建立資通安全情資分享機制。\n前項資通安全情資之分析、整合與分享之內容、程序、方法及其他相關事項之辦法，由主管機關定之。","finalWhy":"條次變更，內容未修正。","review":{"note":"保留，送院會處理","text":""}},{"no":"第九條之一","current":null,"versions":[{"bill":"202110105760000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，得經該機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n危害國家資通安全產品之產品清單，由主管機關定期公告之。","note":"一、本條新增。\n二、本條所稱危害國家資通安全產品宜清楚定義並予公告以供查詢，俾符政府資訊公開原則；而且現代科技日新月異，新興資通訊產品新增快速，授權主管資通安全機關應定期評估並共同分享情資，以利嚴管。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十條","current":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應考量受託者之專業能力與經驗、委外項目之性質及資通安全需求，選任適當之受託者，並監督其資通安全維護情形。","versions":[{"bill":"202110033990000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、為強化各機關落實委外監督管理明定各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"201110061520000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110067790000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n前項受託者辦理受託業務之相關程序及環境，應具備完善之資通安全管理措施或通過公正第三方驗證。\n受委託業務包括客製化資通系統開發者，受託者應提供該資通系統之安全性檢測證明；該系統屬委託機關之核心資通系統，或委託金額達新臺台幣一千萬元以上者，委託機關應另行委託公正第三方進行安全檢測。\n前二項公正第三方應具備充足資源及認證能力，且與被認證對象不得有利害關係。\n公務機關或特定非公務機關辦理第一項委外業務，應與受託者訂定契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、參考資通安全管理法施行細則中，有關委外辦理資通系統之建置、維運或資通服務之提供之相關規定，要求受託者辦理受託業務之相關程序及環境，應具備完善之資通安全管理措施或通過公正第三方驗證，並將其提升至法律位階，爰增訂第二項、第三項。\n四、參考國防產業發展條例第四條第三項對於公正第三方之定義，爰增訂第四項。\n五、為強化各機關落實委外監督管理明定各機關應與受託者訂定契約，並載明雙方之權利義務及違約責任，爰增訂第五項。"},{"bill":"202110071280000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110071040000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、為強化各機關落實委外監督管理明定各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110073190000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110074020000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應考量受託者之專業能力與經驗、委外項目之性質及資通安全需求，選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110083660000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理明定各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110082760000","text":"公務機關及特定非公務機關委外辦理資通系統之建置、維運或服務提供，應採取資通安全措施，並於契約中明定委外廠商之資通安全管理責任。\n主管機關應提供契約範本，以供各機關在委外契約中訂立安全要求，包含數據保護、系統維護、異常通報機制等。\n委外機關對受託廠商之資通安全措施，主管機關得進行審查，必要時得要求改進或補充資通安全防護措施。","note":"一、條次變更。\n二、為強化公務機關及特定非公務機關委外資通系統建置及維運的安全性，規定其於委外契約中明定委外廠商的資通安全管理義務，並由主管機關提供契約範本供參，確保契約條款符合資通安全需求。\n三、為確保委外廠商的資通安全管理水準，主管機關得視情況對受託廠商進行審查，並要求其改進資通安全措施，以避免潛在風險對國家資通安全構成威脅。"},{"bill":"202110085470000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110094940000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。\n前項書面契約之格式、內容，主管機關應訂定定型化契約範本及其應記載及不得記載事項。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。\n四、為避免契約規範不明所生之資通安全風險，參酌老人福利法第三十八條第二項，明定第二項書面契約之格式、內容，主管機關應訂定定型化契約範本及其應記載及不得記載事項。"},{"bill":"202110097630000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110111210000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110127080000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"},{"bill":"202110128370000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。\n前項書面契約之格式、內容，中央主管機關應訂定定型化契約範本及其應記載及不得記載事項。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。\n四、由於資通系統委外服務所提供之品質及量能，與設施營運之穩定度高度相關。為避免契約規範不明，導致資通安全風險，爰增訂第三項，參酌老人福利法第三十八條第二項規定之體例，明定主管機關應訂定定型化契約範本及其應記載及不得記載事項。"},{"bill":"202110129110000","text":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n公務機關或特定非公務機關辦理前項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。","note":"一、條次變更。\n二、考量現行條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正現行條文，並列為第一項。\n三、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第二項。"}],"changed":true,"final":"公務機關或特定非公務機關，於本法適用範圍內，委外辦理資通系統之建置、維運或資通服務之提供，應選任適當之受託者，要求受託者建立有效之資通安全管理機制，並監督該機制之實施。\n前項受託者辦理受託業務之相關程序及環境，應具備完善之資通安全管理措施或通過公正第三方驗證。\n公務機關或特定非公務機關辦理第一項委外業務，應與受託者簽訂書面契約，載明雙方之權利義務及違約責任。\n公務機關及特定非公務機關，應配合主管機關之規劃辦理資通安全演練作業，並視需要導入第三方協力機制；演練內容及其他相關事項，由主管機關定之。","finalWhy":"一、條次變更。\n二、考量原條文規定公務機關或特定非公務機關選任受託者時，所應考量之「專業能力與經驗、委外項目之性質及資通安全需求」等事項，本即屬其「適當性」之考量範疇，又為強化對受託者之資通安全管理要求，爰修正原條文，並列為第一項。\n三、考量受託者應具備完善資通安全管理措施及環境，爰增訂第二項，將本法施行細則第四條第一項第一款規定提升至本法規定。\n四、為強化各機關落實委外監督管理，各機關應與受託者簽訂書面契約，並載明雙方之權利義務及違約責任，爰增訂第三項。\n五、為求資通安全演練作業之完善，主管機關得視該次演練作業之需要，導入第三方協力機制，爰增訂第四項。","review":{"note":"照行政院提案通過","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。"}},{"no":"第十條之一","current":null,"versions":[{"bill":"202110047780000","text":"公務機關、軍事機關及情報機關不得下載、安裝或使用危害國家資通安全產品；但公務機關因業務需求且無其他替代方案，經該機關資通安全長及第十二條上級或監督機關資通安全長核可，且經主管機關核定，得以專案方式使用。主管機關亦應列冊管理之。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項所稱危害國家資通安全產品，其審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、鑒於本法第二條第五款就公務機關定義，係指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關，據此，第一項明定公務機關、軍事機關及情報機關均不得下載、安裝或使用危害國家資通安全產品。另外，考量危害國家資通安全，有直接及間接造成危害風險；而資安攻擊亦有對核心系統與非核心系統的危害，風險高低不一，不宜硬性全面至禁止之，故有但書規定，公務機關有業務需求且無其他替代方案的情況下，應取得該機關的資安長和資安上級（監督）機關的資安長核可，以及主管機關核定，則可採專案的方式使用。\n三、第二項明定公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n四、第三項明定危害國家資通安全產品的其審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法。又「反滲透法」第二條滲透來源的實質控制者所提供或產生的產品亦屬危害國家資通安全產品，併此敘明。"},{"bill":"202110114430000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n主管機關應建立危害國家資通安全產品專案核可案件之資訊查詢與管理平台，彙整各機關專案使用之產品類別、核可條件及使用機關等資訊，供主管機關掌握與追蹤管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、為維護國家資通安全，禁止公務機關下載、安裝或使用危害國家資通安全產品，並規範其自行或委外營運場所之傳播設備及網際網路接取服務，以確保資訊流通安全。\n三、「危害國家資通安全產品」包含受《反滲透法》滲透來源控制之產品或其他具資安風險產品。第三項授權主管機關會商相關機關訂定審查程序、風險評估、情資分享等辦法，由產業主管、國安、經貿等機關共同審查，確保授權明確與審查專業。。\n四、但書允許因業務需求且無替代方案時，經雙重資通安全長核可及主管機關核定，以專案方式使用並列冊管理。第二項要求主管機關建立資訊查詢與管理平台，追蹤專案使用情形，確保透明與可控。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十條之二","current":null,"versions":[{"bill":"202110047780000","text":"前條第一項公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務亦適用之。","note":"一、本條新增。\n二、由於國內曾發生公共場域傳播設備遭駭客入侵，意圖以竄改網站內容、散播不實訊息等手段，達到認知作戰目的，調查發現是承包政府採購的廠商使用的軟體有問題，為避免公共看板遭駭客入侵，用假訊息造成社會混亂，新增本條規定，明定公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，不得下載、安裝或使用危害國家資通安全產品。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十一條","current":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","versions":[{"bill":"202110016660000","text":"公務機關、特定非公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。\n前項資通安全長應通過資安職能訓練機構之評量或經主管機關核可者。","note":"一、原公務機關設置資通安全長，係為確保有效推動資通安全維護事項，考量資通安全長如由副首長擔任，更能提升資通安全於機關中之重要性，惟關鍵基礎設施提供者、公營事業及政府捐助之財團法人，其資通安全防護亦影響國家安全及社會公共利益，爰參照本法第三條第一項第六款於第一項增訂特定非公務機關應設置資通安全長。\n二、為確保前項資通安全長具資安相關專業知識與技能，爰增訂第二項，以落實資安管理。"},{"bill":"202110033990000","text":"公務機關不得採購及使用危害國家資通安全產品，亦不得採購及使用大陸地區、香港、澳門、境外敵對勢力或其所設立或實質控制之各類組織、機構、團體或人員提供之資通服務、系統及設備；其自行或委外營運，提供公眾活動或使用之場地，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及其上級機關資通安全長核可，函報主管機關核定後，得以專案方式購置，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，亦不得下載、安裝或使用大陸地區、香港、澳門、境外敵對勢力或其所設立或實質控制之各類組織、機構、團體或人員提供之資通服務及資通系統，並應遵守相關法令規範。\n公務機關得向主管機關查詢第一項產品及其廠商。","note":"一、本條新增。\n二、將各機關對危害國家資通安全產品限制使用原則提升至法律位階，以符合法律保留原則。\n三、境外敵對勢力由反滲透法第二條第一項定義之。\n四、實質控制或類似用語之直接或間接控制，不論其文義或於前述法律規定之規範意旨，均在彰顯控制者與被控制者間存有支配、管領或從屬之密切關係；且實質控制亦係根據人事、財務或業務經營等面向為判斷。可參考大法官釋字第793號理由書。"},{"bill":"201110061520000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"},{"bill":"202110067790000","text":"公務機關及特定非公務機關，應規劃並於公正第三方監督之下，辦理資通安全演練作業，並於完成後一個月內，將執行情形及成果報告送交主管機關。\n前項演練之內容，由主管機關另定之。","note":"一、本條新增。\n二、參考資通安全事件通報及應變辦法中有關公務機關辦理資通安全演練作業之相關規定。考量特定非公務機關亦具有資安演練之必要性，為完善法制作業，遂一併納入適用，並提升至法律位階。"},{"bill":"202110071280000","text":"公務機關不得採購、下載、安裝或使用危害國家資通安全產品，亦不得採購、使用陸資廠商或大陸地區、香港、澳門、境外敵對勢力或其所設立或實質控制之各類組織、機構、團體或人員提供之資通服務、系統及設備；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。\n四、本條所定陸資廠商，依行政院公共工程委員會107年12月20日工程企字第1070050131號函，指具下列性質之一或其他法令規定或經主管機關認定者：\n一、大陸地區廠商：指依大陸地區法律設立登記之公司、合夥或獨資之工商行號、法人、機構或團體。\n二、第三地區含有大陸資金成分之廠商：指非依我國且非依大陸地區之法律設立登記之公司或事業，且大陸地區人民、法人、團體或其他機構直接或間接持有該第三地區公司或事業股份總數或資本總額合計逾百分之三十或對該第三地區公司或事業具有控制能力者。\n三、在台設立之大陸資金廠商：指依我國法律設立登記之公司或事業，且大陸地區人民、法人、團體或其他機構直接或間接持有該公司或事業之股份總數或資本總額合計逾三分之一者。"},{"bill":"202110071040000","text":"公務機關不得購置、安裝、下載或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備或網際網路接取服務，亦同。\n公務機關發配供業務使用之資通訊設備，獲配者不得下載、安裝或使用危害國家資通訊安全產品，並應遵守相關法令規範。\n前二項情形於有業務上需求且無其他替代方案時，得經該機關資通安全長及其上級機關資通安全長核可，函報主管機關核定後，得以專案方式辦理，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n第一項及第二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、爰將「各機關對危害國家資通安全產品限制使用原則」相關規定提升至法律位階，以符合法律保留原則。\n三、前二項行政機關經專案方式取得使用之資通安全產品，因有危害國家資通安全之虞，主管機關於核准專案購置時，除列冊管理，亦應明確要求機關落實管理措施。"},{"bill":"202110073190000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"},{"bill":"202110074020000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資並據以分享。"},{"bill":"202110083660000","text":"公務機關不得下載、安裝或採購及使用危害國家安全之資通安全產品，亦不得下載、安裝或採購及使用依國家安全法第二條規定之大陸地區、香港、澳門、境外敵對勢力及其所設立或實質控制之各類組織、機構、團體或其派遣之人提供之資通安全服務及產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家安全之資通安全產品，亦不得下載、安裝或採購及使用依國家安全法第二條規定之大陸地區、香港、澳門、境外敵對勢力及其所設立或實質控制之各類組織、機構、團體或其派遣之人提供之資通安全服務及產品，並應遵守相關法令規範。\n前二項有關危害國家安全之資通安全產品以及依國家安全法第二條規定之大陸地區、香港、澳門、境外敵對勢力及其所設立或實質控制之各類組織、機構、團體或其派遣之人提供之資通安全服務及產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家安全之資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「國家安全之資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"},{"bill":"202110082760000","text":"公務機關及特定非公務機關不得採購、安裝或使用經主管機關認定之危害國家資通安全產品。\n若因特殊業務需求，確需使用前項產品者，應向主管機關提出例外使用申請，並提供安全風險評估報告；主管機關得逐案審查，核准後方可使用。\n主管機關應定期更新危害國家資通安全產品名單，並公告各機關遵循。","note":"一、本條新增。\n二、為防範危害國家資通安全之產品對政府機關及特定非公務機關的影響，規定禁止各機關使用經主管機關認定之危害產品，並規範其例外使用的審查與申請機制，以保障業務需求及資通安全之平衡。\n三、為使各機關及時掌握危害產品之使用限制，主管機關應定期更新危害產品名單，並公告供各機關遵循。"},{"bill":"202110085470000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"},{"bill":"202110094940000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理及遵守下列規定：\n一、應指定特定區域及特定人員使用，且不得傳播影像或聲音，供不特定人士直接收視或收聽。\n二、購置理由消失，或使用年限屆滿應立即銷毀。\n三、其他主管機關指定事項。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，參酌「各機關對危害國家資通安全產品限制使用原則」第四點，爰於第一項及第二項規定。\n三、第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"},{"bill":"202110097630000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"},{"bill":"202110111210000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"},{"bill":"202110127080000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"},{"bill":"202110128370000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之；危害國家資通安全產品之清單，由主管機關定期公告之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品：\n(一)其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。\n(二)又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。\n(三)另為落實政府資訊公開之原則，並使各機關確實遵循不得下載、安裝或使用危害國家資通安全產品等規定，其產品清單應清楚定義並公告，以供檢視及查詢。"},{"bill":"202110129110000","text":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。\n三、本條所定「危害國家資通安全產品」，包含但不限於受反滲透法所稱滲透來源實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。"}],"changed":true,"final":"公務機關不得下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及依第十四條規定收受其實施情形之機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務機關發配供業務使用之資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。但因業務需求且無其他替代方案者，準用前項但書規定辦理。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","finalWhy":"一、本條新增。\n二、現行對各機關有關危害國家資通安全產品之使用，係以行政規則「各機關對危害國家資通安全產品限制使用原則」規範，惟考量該等產品之使用涉及重大公共利益，爰提升以法律及其明確授權之法規命令為依據；另現今資訊流通速度極快，且資訊內容影響公眾生活及公共安全，考量公務機關自行或委外營運場所之傳播設備及網際網路接取服務，與資訊流通密切相關，亦有納管規範之必要，爰訂定本條。前述公務機關如有需要，主管機關應提供必要之支援及協助。\n三、本條所定「危害國家資通安全產品」，包括受國家安全法及反滲透法所稱外國、大陸地區、香港、澳門、境外敵對勢力或其所設立或實質控制之各類組織、機構、團體或其派遣之人等實質控制者所提供之產品；其中第三項規定危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項，授權由主管機關訂定辦法，以符合授權明確性原則。又為妥適評估產品資安風險，前開審查程序規劃由相關主管機關，例如該產品產業之中央目的事業主管機關、國安、經貿等相關主管機關，共同審查產品情資，並據以分享。","review":{"note":"照行政院提案通過","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。"}},{"no":"第十一條之一","current":null,"versions":[{"bill":"202110105760000","text":"公務機關之資通安全專職人員須通過適任性安全查核。\n前項適任性安全查核程序、內容及其他相關事項由資安署訂之；未通過查核者不得辦理涉及國家機密、軍事機密及國防機密之資通安全業務。\n用人機關基於個人資料保護規定，應保密處理，不得移作他用，違反者，視情節予以議處。","note":"一、本條新增。\n二、考量公務機關之資通安全專職人員辦理資通安全業務時，可能觸及國家機密、軍事機密及國防機密，有予以查核其適任性之必要，爰增訂本條法律規定。\n三、授權資安署訂定資通安全專職人員之適任性安全查核程序、內容及相關事項。\n四、受查核者的個人資料，用人機關應注意相關保密措施，於本法第三項特予規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十二條","current":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","versions":[{"bill":"202110033990000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"201110061520000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110067790000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110071280000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110071040000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。\n前項資通安全長應取得資安職能訓練機構之證照或職能訓練合格證書，或經主管機關核可後任用。","note":"一、條次變更。\n二、原條文僅規定由機關首長指派副首長或適當人員兼任資通安全長，其未必具備資安及個資保護相關知識。為確保資通安全長具資安相關知識與技能，爰增列第二項。以利資安管理落實。"},{"bill":"202110073190000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。\n前項公務機關應依責任等級置資通安全專職人員，協助執行機關內資通安全相關事務。","note":"一、條次變更。\n二、為確保本條第一項資安事務推動及具資安相關專業知識與技能，爰增訂第二項資安專職人員，受資通安全長指揮督導，以落實資安管理。"},{"bill":"202110074020000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110083660000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110082760000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110085470000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110094940000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110097630000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110111210000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110127080000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110128370000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"},{"bill":"202110129110000","text":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","note":"條次變更，內容未修正。"}],"changed":true,"final":"公務機關應置資通安全長，由機關首長指派副首長或適當人員兼任，負責推動及監督機關內資通安全相關事務。","finalWhy":"一、條次變更，內容未修正。\n二、為增進資通安全專業知能，公務機關之資通安全長應定期參加主管機關舉辦之資通安全長共識營等相關課程。","review":{"note":"照行政院提案修正通過","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向主管機關提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向主管機關提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。"}},{"no":"第十三條","current":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","versions":[{"bill":"202110033990000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"201110061520000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110067790000","text":"公務機關不得採購、下載、安裝或使用危害國家資通安全產品；其自行或委外營運場所，亦同。但因業務需求且無其他替代方案者，經該機關資通安全長及其上級機關資通安全長核可，函報主管機關核定後，得以專案方式使用，並列冊管理。\n公務人員獲配之公務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，並應遵守相關法令規範。\n前二項有關危害國家資通安全產品之審查程序、風險評估、情資分享、使用限制及其他相關事項之辦法，由主管機關會商有關機關擬訂，報請行政院核定之。","note":"一、本條新增。\n二、將「各機關對危害國家資通安全產品限制使用原則」提升至法律位階，以符合法律保留原則，爰增訂第一項與第二項。\n三、主管機關應清楚對外說明，危害國家安全之資通安全產品定義、種類、範圍及廠商，並供公務機關得以查詢，始得避免造成公務機關、公務人員及各界之疑慮，爰增訂第三項。"},{"bill":"202110071280000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110071040000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"僅條次變更。"},{"bill":"202110073190000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110074020000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110083660000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110082760000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110085470000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110094940000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110097630000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110111210000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110127080000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110128370000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110129110000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"}],"changed":true,"final":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","finalWhy":"條次變更，內容未修正。","review":{"note":"照行政院提案通過","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。"}},{"no":"第十四條","current":"公務機關應每年向上級或監督機關提出資通安全維護計畫實施情形；無上級機關者，其資通安全維護計畫實施情形應送交主管機關。","versions":[{"bill":"202110033990000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應向下列機關提出：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市政府所轄山地原住民區公所、山地原住民區民代表會，向直轄市政府提出；縣（市）政府所轄鄉（鎮、市）公所，鄉（鎮、市）民代表會，向縣（市）政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，爰修正本條，按現行條文規定之運作模式，定明公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象修正定明為直轄市政府及縣（市）政府，爰規定第三款。"},{"bill":"201110061520000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，按現行條文規定之運作模式，修正本條，並定明第一款及第二款公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、直轄市山地原住民區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象，定明為直轄市政府及縣政府，爰規定第三款。"},{"bill":"202110067790000","text":"公務機關應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。","note":"條次變更，內容未修正。"},{"bill":"202110071280000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，按現行條文規定之運作模式，修正本條，並定明第一款及第二款公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、直轄市山地原住民區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象，定明為直轄市政府及縣政府，爰規定第三款。"},{"bill":"202110071040000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形。無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","note":"一、條次變更。\n二、為明確規範公務機關提出資通安全維護計畫之對象，爰修正本條第一項。\n三、為強化地方自治團體資通安全管理，建立地區聯防，爰增訂第三款將地方自治團體之直轄市山地原住民區公所、直轄市山地爰主民區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象修正定明為直轄市政府及縣政府。"},{"bill":"202110073190000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，按現行條文規定之運作模式，修正本條文字，並明訂第一款及第二款公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、直轄市山地原住民區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象，定明為直轄市政府及縣政府，爰新增第三款。"},{"bill":"202110074020000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，按現行條文規定之運作模式，修正本條，並定明第一款及第二款公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、直轄市山地原住民區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象，定明為直轄市政府及縣政府，爰規定第三款。"},{"bill":"202110083660000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各項規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市政府所轄山地原住民區公所、山地原住民區民代表會，向直轄市政府提出；縣（市）政府所轄鄉（鎮、市）公所，鄉（鎮、市）民代表會，向縣（市）政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，爰修正本條，按現行條文規定之運作模式，定明公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象修正定明為直轄市政府及縣（市）政府，爰規定第三款。"},{"bill":"202110082760000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，按現行條文規定之運作模式，修正本條，並定明第一款及第二款公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、直轄市山地原住民區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象，定明為直轄市政府及縣政府，爰規定第三款。"},{"bill":"202110085470000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市 直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，按現行條文規定之運作模式，修正本條，並定明第一款及第二款公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、直轄市山地原住民區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象，定明為直轄市政府及縣政府，爰規定第三款。"},{"bill":"202110129110000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向資安署提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向資安署提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，按現行條文規定之運作模式，修正本條，並定明第一款及第二款公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、直轄市山地原住民區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象，定明為直轄市政府及縣政府，爰規定第三款。"}],"changed":true,"final":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向主管機關提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向主管機關提出。\n三、直轄市山地原住民區公所、直轄市山地原住民區民代表會，向直轄市政府提出；鄉（鎮、市）公所、鄉（鎮、市）民代表會，向縣政府提出。","finalWhy":"照行政院提案修正通過。,","review":{"note":"照行政院提案修正通過","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及主管機關通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。"}},{"no":"第十五條","current":"公務機關應稽核其所屬或監督機關之資通安全維護計畫實施情形。\n受稽核機關之資通安全維護計畫實施有缺失或待改善者，應提出改善報告，送交稽核機關及上級或監督機關。","versions":[{"bill":"202110033990000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。\n第十三條與前條資通安全維護計畫必要事項、實施情形之提出、前項稽核之頻率、內容、方法及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行條文第一項規定，由上級機關或監督機關稽核之。惟無上級機關者，現行僅有內部稽核規定，爰於第一項增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣（市）政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、修正條文第十三條與前條資通安全維護計畫必要事項、實施情形之提出、第一項稽核之頻率、內容、方法及其他相關事項，增訂第二項授權由主管機關以辦法定之。\n四、現行條文第二項規定移列修正條文第十六條第一項，爰予刪除。"},{"bill":"201110061520000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行第二項移列修正條文第十六條第一項規定，爰予刪除。"},{"bill":"202110067790000","text":"公務機關應每年向上級機關或監督機關提出資通安全維護計畫實施情形；無上級機關或監督機關者，其資通安全維護計畫實施情形應依下列各款規定辦理：\n一、總統府、國家安全會議及五院，向數位發展部提出。\n二、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會，向數位發展部提出。\n三、直轄市政府所轄山地原住民區公所、山地原住民區民代表會，向直轄市政府提出；縣（市）政府所轄鄉（鎮、市）公所，鄉（鎮、市）民代表會，向縣（市）政府提出。","note":"一、條次變更。\n二、為明確規範公務機關資通安全維護計畫實施情形提出之管道，爰修正本條，按現行條文規定之運作模式，定明公務機關資通安全維護計畫實施情形提出之對象。\n三、為強化地區聯防，將直轄市山地原住民區公所、區民代表會、鄉（鎮、市）公所以及鄉（鎮、市）民代表會之提出對象修正定明為直轄市政府及縣（市）政府，爰規定第三款。"},{"bill":"202110071280000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行第二項移列修正條文第十六條第一項規定，爰予刪除。"},{"bill":"202110071040000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行條文第一項規定，由上級機關或監督機關稽核之。惟無上級機關者，現行僅有內部稽核規定，爰於第一項增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣（市）政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行條文第二項規定移列修正條文第十六條第一項，爰予刪除。"},{"bill":"202110073190000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行第二項移列修正條文第十六條第一項規定，爰予刪除。"},{"bill":"202110074020000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行第二項移列修正條文第十六條第一項規定，爰予刪除。"},{"bill":"202110083660000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯 ）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行第二項移列修正條文第十六條第一項規定，爰予刪除。"},{"bill":"202110119960000","text":"公務機關應符合其資通安全責任等級之要求，設置專職資通安全人員，辦理資通安全業務及應變處理；資通安全業務績效評核優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得逕予調度各級機關資通安全人員支援之。\n前二項人員調度支援、績效評核、獎勵及職能訓練相關事項之辦法，由主管機關定之。","note":"一、為落實公務機關資安防務措施並強化量能，爰將其意旨修正納入第一項。\n二、增訂第二項，並明定重大資安事件，資安署得調度人員支援之規定，可同時加強訓練人員之應處能力。\n三、現行條文第二項配合修正條文第一項及第二項，新增授權項目，並移列為第三項。"},{"bill":"202110127080000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行第二項移列修正條文第十六條第一項規定，爰予刪除。"},{"bill":"202110128370000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行第二項移列修正條文第十六條第一項規定，爰予刪除。"},{"bill":"202110129110000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行第二項移列修正條文第十六條第一項規定，爰予刪除。"}],"changed":true,"final":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","finalWhy":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依原第一項規定，由上級機關或監督機關稽核之。惟無上級機關或監督機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、原第二項移列修正條文第十六條第一項規定，爰予刪除。","review":{"note":"照行政院提案修正通過","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n主管機關應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，主管機關得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援、績效評核及其他相關事項之辦法，由主管機關定之。"}},{"no":"第十六條","current":"第二項　受稽核機關之資通安全維護計畫實施有缺失或待改善者，應提出改善報告，送交稽核機關及上級或監督機關。","versions":[{"bill":"202110033990000","text":"受稽核機關之資通安全維護計畫實施有缺失或待改善者，應向稽核機關提出改善報告，並連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署，認有必要時，得要求受稽核機關進行說明或調整。","note":"一、第一項由現行條文第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告亦應送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。"},{"bill":"201110061520000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110067790000","text":"公務機關應稽核其所屬、所監督之公務機關、所轄鄉（鎮、市）公所、直轄市山地原住民區公所及鄉（鎮、市）民代表會、直轄市山地原住民區民代表會之資通安全維護計畫實施情形。","note":"一、條次變更。\n二、為落實資通安全聯防政策，公務機關資通安全維護計畫實施情形之稽核，採分層監督管理模式，依現行條文第一項規定，由上級機關或監督機關稽核之。惟無上級機關者，現行僅有內部稽核規定，爰增訂直轄市政府應稽核所轄直轄市山地原住民區公所、直轄市山地原住民區民代表會，以及縣（市）政府應稽核所轄鄉（鎮、市）公所、鄉（鎮、市）民代表會。\n三、現行條文第二項規定移列修正條文第十七條第一項，爰予刪除。"},{"bill":"202110071280000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110071040000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關將其安全維護計畫連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署，認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之內容、方法與頻率、稽查結果與改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行條文第十三條第二項規定移列，為使資安署掌握全國資通安全現況，定明機關之稽核結果及改善報告應送交資安署。\n二、為使稽核機關、資安署對受稽核機關之資安維護與改善情形進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、增訂第三項授權主管機關就必要之相關細節訂定辦法。"},{"bill":"202110073190000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110074020000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110083660000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行條文第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告亦應送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110082760000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110085470000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110094940000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110097630000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110109160000","text":"中央目的事業主管機關應徵詢相關公務機關、民間團體、專家學者意見後，擬訂關鍵基礎設施提供者之指定清單，報請行政院核定，以書面通知之；其指定基準、廢止條件及程序，由中央目的事業主管機關公告之。","note":"一、現行條文第一項移列本條前段，並依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，所列事項自一百十一年八月二十七日起仍由行政院管轄，爰予修正。\n二、另考量關鍵基礎設施提供者之指定基準及程序，影響人民權益重大，有法律保留原則之適用，爰於本條後段增訂關鍵基礎設施提供者之指定基準、廢止條件及程序，授權由中央目的事業主管機關公告之。\n三、現行條文第二項至第六項規定分別移列修正條文第十六條之一及第十七條之一，爰予刪除。"},{"bill":"202110105760000","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定特定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n特定關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n特定關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、考量資安威脅日漸加劇，資安作業需持續維持，為強化特定關鍵基礎設施提供者資安防護量能並能及時應處，爰立法規定符合特定資通安全責任等級之特定關鍵基礎設施提供者，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠的資通環境。\n二、為利資安署掌握全國資通安全現況，爰增訂第六項。"},{"bill":"202110111210000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110119960000","text":"中央目的事業主管機關應徵詢相關公務機關、民間團體、專家學者意見後，擬訂關鍵基礎設施提供者之指定清單，報請行政院核定，以書面通知之；其指定基準、廢止條件及程序，由中央目的事業主管機關公告之。","note":"考量關鍵基礎設施提供者之指定基準及程序，影響人民權益重大，有法律保留原則之適用，爰於本條後段增訂關鍵基礎設施提供者之指定基準、廢止條件及程序，授權由中央目的事業主管機關公告之。"},{"bill":"202110127080000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110128370000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110129110000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依資安署指定之方式送交資安署。\n稽核機關或資安署認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利資安署掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交該署。\n二、為使稽核機關、資安署就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"}],"changed":true,"final":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果依指定之方式送交主管機關。\n稽核機關或主管機關認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","finalWhy":"一、第一項由原第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利主管機關掌握全國資通安全現況，修正定明稽核結果及改善報告由稽核機關送交主管機關。」\n二、為使稽核機關、主管機關就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、修正條文第十三條至第十五條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。","review":{"note":"照行政院提案修正通過","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依指定之方式將稽核結果及改善報告送交主管機關。"}},{"no":"第十六條之一","current":null,"versions":[{"bill":"202110109160000","text":"關鍵基礎設施提供者應置資通安全長，由其代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。\n關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模及性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n關鍵基礎設施提供者之資通安全維護計畫實施有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、本條新增。\n二、關鍵基礎設施提供者之資安防護攸關國安以及大眾之權益，因此第一項條文，明文要求關鍵基礎設施提供者應設置資安長。\n三、修正條文第二項由現行條文第十六條第二項規定移列。符合特定資通安全責任等級之機關，應設置專人專職辦理資通安全業務之要求，宜由現行法規命令提昇至法律位階，爰予修正。\n四、修正條文第三項由現行條文第十六條第三項規定移列，內容未修正。\n五、修正條文第四項由現行條文第十六條第四項規定移列。另考量行政資源有效利用，擇定適當之關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第三項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、修正條文第五項由現行條文第十六條第五項規定移列，並酌作文字修正。\n七、為利資安署掌握全國資通安全現況，爰增訂第六項。"},{"bill":"202110119960000","text":"關鍵基礎設施提供者應置資通安全長，由其代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。\n關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模及性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n關鍵基礎設施提供者之資通安全維護計畫實施有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、本條新增。\n二、明文要求關鍵基礎設施提供者應設置資安長。\n三、修正條文第二項由現行條文第十六條第二項規定移列。\n四、修正條文第三項由現行條文第十六條第三項規定移列。\n五、考量行政資源有效利用，擇定適當之關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第三項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、第五項酌作文字修正。\n七、為利資安署掌握全國資通安全現況，爰增訂第六項。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十七條","current":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，除應通報上級或監督機關外，並應通報主管機關；無上級機關者，應通報主管機關。\n公務機關應向上級或監督機關提出資通安全事件調查、處理及改善報告，並送交主管機關；無上級機關者，應送交主管機關。\n前三項通報及應變機制之必要事項、通報內容、報告之提出及其他相關事項之辦法，由主管機關定之。","versions":[{"bill":"202110033990000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項接獲通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項接獲通報機關知悉重大資通安全事件時，得提供公務機關相關協助，並於適當時機得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響多數人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由接獲通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以利防範、避免損害之擴大。"},{"bill":"201110061520000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110067790000","text":"受稽核機關之資通安全維護計畫實施情形有缺失或待改善者，應向稽核機關提出改善報告，並由稽核機關連同稽核結果送交主管機關。\n稽核機關或主管機關認有必要時，得要求受稽核機關進行說明或調整。\n前三條及第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項之辦法，由主管機關定之。","note":"一、第一項由現行條文第十三條第二項規定移列，除修正定明改善報告之提出對象外，並為利數發部掌握全國資通安全現況，修正定明稽核結果及改善報告亦應送交數發部。\n二、為使稽核機關、數發部就受稽核機關之改善報告得進行監督及指導，爰增訂第二項，俾使其得就缺失或待改善事項妥為處理。\n三、有關修正條文第十四條至第十六條與第一項資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他相關事項，增訂第三項授權由主管機關以辦法定之。"},{"bill":"202110071280000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110071040000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報及應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項接獲通報機關知悉重大資通安全事件時，得提供公務機關相關協助，並於適當時機得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件恐影響多數人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由接獲通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以利防範、避免損害之擴大。"},{"bill":"202110073190000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報及應變機制之必要事項、通報內容、報告之提出、演練作業、調度支援及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；並於適當時機得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為確保各機關間調度權分配及支援計畫推展順利，爰新增第四項文字由數位發展部擬定各機關間調度事項之相關辦法，藉由本法規授權子法通報應變辦法調度，就可以讓有實戰經驗者，協助處理資安事件，解決資安問題，以達資源利用最大化之效。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110074020000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告，並送交主管機關；無上級機關者，應送交主管機關。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110083660000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項接獲通報機關知悉重大資通安全事件時，得提供公務機關相關協助，並於適當時機得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響多數人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由接獲通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以利防範、避免損害之擴大。"},{"bill":"202110082760000","text":"各公務機關及特定非公務機關應建立資通安全事件之通報機制，並配合主管機關定期實施應變演練，以提高應變能力。\n公務機關及特定非公務機關發生資通安全事件時，應立即通報主管機關，並於一定時限內提交事件報告，包含事件原因、影響範圍及處置措施。\n主管機關得視事件之嚴重性，調度其他機關資通安全人員支援應變處理。","note":"一、條次變更。\n二、為提高各公務機關及特定非公務機關對資通安全事件的應變能力，規定應建立資通安全事件的通報機制，並定期實施應變演練，以熟悉應對程序及減少安全事件的影響範圍。\n三、為確保重大資通安全事件能迅速妥善處理，主管機關得於事件發生時調度其他機關的資通安全人員支援應變，以有效控制事件發展並降低風險。"},{"bill":"202110085470000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110094940000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110097630000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110109160000","text":"關鍵基礎設施提供者以外之特定非公務機關應置資通安全長，由其代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。\n關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、鑒於我國身處資安威脅密集地區，且關鍵基礎設施提供者以外之特定非公務機關之資安防護，亦攸關大眾之權益，爰明定關鍵基礎設施提供者以外之特定非公務機關應設置資安長。\n二、修正條文第一項由現行條文第十七條第一項規定移列。符合特定資通安全責任等級之機關，應設置專人專職辦理資通安全業務之要求，宜由現行法規命令提昇至法律位階，爰予修正。\n三、為利資安署掌握全國資通安全現況，爰增訂第五項。"},{"bill":"202110105760000","text":"特定關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、考量資安威脅日漸加劇，為強化特定關鍵基礎設施提供者以外的特定非公務機關資安防護能量並能及時應處，避免其他業務排擠資安業務量能，爰立法增訂特定非公務機關應設置資通安全人員，辦理資通安全業務，以落實事前是中及事後各項資安作業，確保其具有安全可靠的資通環境。\n二、資通安全已經成為公、私機關非常重要的課題，而資通安全人才成為各界爭取的對象，為免特定非公務機關於人才競爭屈居弱勢，爰訂定需要設置資通安全人員，但非以專職為必要，更符實際。"},{"bill":"202110111210000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110119960000","text":"關鍵基礎設施提供者以外之特定非公務機關應置資通安全長，由其代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。\n關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、明定關鍵基礎設施提供者以外之特定非公務機關應設置資安長。\n二、為利資安署掌握全國資通安全現況，爰增訂第五項。"},{"bill":"202110127080000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110128370000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"},{"bill":"202110129110000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及資安署通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十四條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以避免損害之擴大。"}],"changed":true,"final":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十四條規定收受其實施情形之機關及主管機關通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，得提供公務機關相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","finalWhy":"照行政院提案修正通過。,","review":{"note":"照行政院提案修正通過","text":"關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依指定之方式將稽核結果及改善報告送交主管機關。"}},{"no":"第十七條之一","current":null,"versions":[{"bill":"202110109160000","text":"第十六條之一及前條之資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、擇定基準、程序與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由管機關核定。","note":"一、本條新增。\n二、本條由現行條文第十六條第六項及第十七條第四項合併修正移列，並配合第十六條及第十七條之修正，增訂授權項目。"},{"bill":"202110119960000","text":"第十六條之一及前條之資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、擇定基準、程序與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"一、本條新增。\n二、增訂授權項目。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十八條","current":"公務機關所屬人員對於機關之資通安全維護績效優良者，應予獎勵。\n前項獎勵事項之辦法，由主管機關定之。","versions":[{"bill":"202110033990000","text":"公務機關應符合其資通安全責任等級之要求，設置專職資通安全人員，辦理資通安全業務及應變處理；資通安全業務績效評核優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得逕予調度各級機關資通安全人員支援之。\n前二項人員調度支援、績效評核、獎勵及職能訓練相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、三、五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正納入第一項。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項，並明定重大資安事件，資安署得調度人員支援之規定，可同時加強訓練人員之應處能力。\n四、現行條文第二項配合修正條文第一項及第二項，新增授權項目，並移列為第三項。"},{"bill":"201110061520000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110067790000","text":"公務機關為因應資通安全事件，應訂定通報及應變機制。\n公務機關知悉資通安全事件時，應向第十五條規定收受其實施情形之機關及主管機關通報。\n公務機關應向前項受通報機關提出資通安全事件調查、處理及改善報告。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、演練作業及其他相關事項之辦法，由主管機關定之。\n第二項受通報機關知悉重大資通安全事件時，應提供公務機關相關協助，並得於適當時機公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項未修正。\n三、配合修正條文第十五條已定明公務機關資通安全維護計畫實施情形之提出對象，及實務運作現況，爰修正第二項及第三項。\n四、為增進公務機關因應資通安全事件之處理能力，爰於第四項授權項目增訂演練作業，俾利透過實施模擬演練以熟悉應變作為、提升應變技能，並酌作文字修正。\n五、考量重大資通安全事件可能影響多數人民之生命、身體或財產安全，爰比照特定非公務機關之規定，增訂第五項，由受通報機關於知悉後，分別或共同公告必要之內容（例如發生原因、影響程度及目前控制之情形等）及因應措施，並提供相關協助，以利防範、避免損害之擴大。"},{"bill":"202110071280000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110071040000","text":"公務機關應符合其資通安全責任等級之要求，設置專職資通安全人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效評核優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得逕予調度各級機關資通安全人員支援之。\n前二項人員績效評核、獎勵、職能訓練及調度支援相關事項之辦法，由主管機關定之。","note":"一、第一項明文規定公務機關應設置專職資通安全人員。\n二、增訂第二項，得由資安署規畫推動專職人員之職能訓練，並授權資安署得直接調度各級機關人員支援資安事件。\n三、原第二項移列第三項，授權主管機關就資安專職人員績效評核、獎勵、技能訓練及調度支援等相關事項訂定辦法。"},{"bill":"202110073190000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110074020000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110083660000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效評核優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得逕予調度各級機關資通安全人員支援之。\n前二項人員調度支援、績效評核、獎勵、職能訓練及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行條文第二項配合修正條文第一項及第二項，新增授權項目，並移列為第三項。"},{"bill":"202110082760000","text":"公務機關及特定非公務機關應配置專責資通安全人員，負責機關內之資通安全管理、應變及風險防範等工作。\n主管機關得視國家安全需要，對資通安全專職人員進行適任性查核，以確保其符合資通安全之專業標準，必要時得指定人員接受相關專業訓練或取得認證。","note":"一、條次變更。\n二、為確保公務機關及特定非公務機關內部具備資通安全的專業管理能力，規定應配置專職資通安全人員，並賦予其負責資通安全管理、應變及風險防範等工作。\n三、考量資通安全人員之專業性對國家安全之影響，主管機關得視國家安全需求對專職人員進行適任性查核，以確保人員具備相應的專業能力，並進行必要的培訓或認證。"},{"bill":"202110085470000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110094940000","text":"公務機關應符合其資通安全責任等級之要求，置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110097630000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援、員額及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110105760000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。中央目的事業主管機關應設置通報窗口、線上通報平臺或通報專線。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報及應變機制之必要事項、通報內容、報告之提出送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，應提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、鑑於公、私部門（含特定非公務機關）間資通安全事件聯繫之重要性及即時性要求日增，為強化公私協力聯防，中央目的事業主管機關應設置通報窗口線上通報平臺或通報專線，俾利及時應變及合作，爰增訂第二項。\n二、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業。\n三、中央目的事業主管機關知悉該管業務相關之重大安全事件時，有積極提供協助之必要，爰修正\"應\"提供相關協助。"},{"bill":"202110111210000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110127080000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110128370000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"},{"bill":"202110129110000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n資安署應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，資安署得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援及其他相關事項之辦法，由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、附表三、附表五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正為第一項前段規定，現行第一項則酌作文字修正後列為後段規定。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，爰增訂第二項前段規定；另考量透過實戰訓練，得快速累積人員經驗及提升應處能力，爰增訂第二項後段規定，定明遇有重大資安事件時，資安署得調度資通安全人員支援之，俾利落實資通安全聯防政策。前開資通安全人員，係指資通安全專職人員及專責人員。\n四、現行第二項配合修正條文第一項及第二項酌作文字修正，增訂授權項目，並移列為第三項。"}],"changed":true,"final":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理；所屬人員辦理資通安全業務績效優良者，應予獎勵。\n主管機關應妥善規劃推動專職人員之職能訓練，增進其資通安全專業知能；遇有重大資通安全事件，主管機關得調度各級機關資通安全人員支援之。\n前二項人員獎勵、職能訓練、調度支援、績效評核及其他相關事項之辦法，由主管機關定之。","finalWhy":"照行政院提案修正通過。,","review":{"note":"照委員黃健豪、葛如鈞等5人所提修正動議修正通過","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交主管機關。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或主管機關知悉重大資通安全事件時，應提供必要之協助；於適當時機並得公告與事件相關之必要內容及因應措施。"}},{"no":"第十八條之一","current":null,"versions":[{"bill":"202110047780000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合新增第十條之一和第十條之二的規定，關於特定非公務機關，本條明定中央目的事業主管機關可基於維護國家資通安全考量，得限制或禁止其下載、安裝或使用危害國家資通安全的產品。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十九條","current":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定關鍵基礎設施提供者，報請主管機關核定，並以書面通知受核定者。\n關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應稽核所管關鍵基礎設施提供者之資通安全維護計畫實施情形。\n關鍵基礎設施提供者之資通安全維護計畫實施有缺失或待改善者，應提出改善報告，送交中央目的事業主管機關。\n第二項至第五項之資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報請主管機關核定之。","versions":[{"bill":"202110033990000","text":"中央目的事業主管機關應徵詢相關公務機關、民間團體、專家學者意見後，擬訂關鍵基礎設施提供者之指定清單，報請行政院核定，以書面通知之；其指定基準、廢止條件及程序，由中央目的事業主管機關公告之。","note":"一、條次變更。\n二、現行條文第一項移列本條前段，並依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，所列事項自一百十一年八月二十七日起仍由行政院管轄，爰予修正。\n三、另考量關鍵基礎設施提供者之指定基準及程序，影響人民權益重大，有法律保留原則之適用，爰於本條後段增訂關鍵基礎設施提供者之指定基準、廢止條件及程序，授權由中央目的事業主管機關公告之。\n四、現行條文第二項至第六項規定分別移列修正條文第二十條及第二十二條，爰予刪除。"},{"bill":"201110061520000","text":"公務機關於必要時，得對所屬資通安全專職人員之適任性進行查核。\n主管機關得於資通安全人員任用考試榜示後，對錄取人員之適任性進行查核。\n拒絕查核或前二項查核結果經用人機關認定未通過者，不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務。\n前項人員職務得由用人機關基於內部管理及業務運作需要，依法進行調整。\n第一項及第二項查核紀錄，由用人機關依相關規定保密處理，並妥為保管，不得移作他用；違反者，視情節予以議處。\n有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項之辦法，由主管機關會商有關機關定之。","note":"一、本條新增。\n二、考量公務機關之資通安全專職人員辦理資通安全業務時，可能觸及國家機密、軍事機密及國防秘密，有予以查核其適任性之必要，是以將現職人員及考試錄取人員定為得查核之對象範圍，並定明拒絕查核或查核未通過之法律效果。至所定必要時，係指經公務機關綜合業務屬性、人員實際情形予以審認，爰規定第一項至第四項。另第二項「資通安全人員任用考試」，係指考試類科為「資通安全」者。\n三、查核紀錄涉及受查核者之個人資料，用人機關應注意相關保密及保管措施，爰規定第五項。\n四、有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項，授權主管機關訂定辦法，以符合授權明確性原則，爰規定第六項。另受查核人員就查核結果經用人機關認定未通過者，現職資通安全專職人員對於用人機關之決定，認有違法或顯然不當致損害其權利或利益，得依公務人員保障法規定，提起救濟；非現職者得依訴願法規定，提起救濟，併予敘明。"},{"bill":"202110067790000","text":"公務機關應符合其資通安全責任等級之要求，設置資通安全專職人員，辦理資通安全業務及應變處理，並定期舉辦或鼓勵所屬人員參與資通安全之相關專業訓練。\n主管機關應妥善規劃並加強推動專職人員之專業訓練，增進其資通安全專業知能。\n第一項人員辦理資通安全業務績效優良者，應予獎勵，其獎勵辦法由主管機關定之。","note":"一、條次變更。\n二、公務機關依資通安全責任等級分級辦法附表一、三、五之規定，應設置一定人數之專職人員辦理資通安全業務，為強化公務機關之資通安全防護能量，爰將其意旨修正納入第一項。\n三、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之專業能力，爰增訂第二項。\n四、數發部應參考國際資安證照之作法，在資安人員於取得證照後，透過持續訓練或工作之方式，以維持相關證照之有效性。\n五、現行條文第二項配合修正條文第一項及第二項，新增授權項目，並移列為第三項。"},{"bill":"202110071280000","text":"公務機關於必要時，得對所屬資通安全專職人員之適任性進行查核。\n主管機關得於資通安全人員任用考試榜示後，對錄取人員之適任性進行查核。\n拒絕查核或前二項查核結果經用人機關認定未通過者，不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務。\n前項人員職務得由用人機關基於內部管理及業務運作需要，依法進行調整。\n第一項及第二項查核紀錄，由用人機關依相關規定保密處理，並妥為保管，不得移作他用；違反者，視情節予以議處。\n有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項之辦法，由主管機關會商有關機關定之。","note":"一、本條新增。\n二、考量公務機關之資通安全專職人員辦理資通安全業務時，可能觸及國家機密、軍事機密及國防秘密，有予以查核其適任性之必要，是以將現職人員及考試錄取人員定為得查核之對象範圍，並定明拒絕查核或查核未通過之法律效果。至所定必要時，係指經公務機關綜合業務屬性、人員實際情形予以審認，爰規定第一項至第四項。另第二項「資通安全人員任用考試」，係指考試類科為「資通安全」者。\n三、查核紀錄涉及受查核者之個人資料，用人機關應注意相關保密及保管措施，爰規定第五項。\n四、有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項，授權主管機關訂定辦法，以符合授權明確性原則，爰規定第六項。另受查核人員就查核結果經用人機關認定未通過者，現職資通安全專職人員對於用人機關之決定，認有違法或顯然不當致損害其權利或利益，得依公務人員保障法規定，提起救濟；非現職者得依訴願法規定，提起救濟，併予敘明。"},{"bill":"202110071040000","text":"公務機關於必要時，得對所屬資通安全專職人員之適任性進行查核。\n主管機關得於資通安全人員任用考試榜示後，對錄取人員之適任性進行查核。\n拒絕查核或前二項查核結果經用人機關認定未通過者，不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務。\n前項人員職務得由用人機關基於內部管理及業務運作需要，依法進行調整。\n第一項及第二項查核紀錄，由用人機關依相關規定保密處理，並妥為保管，不得移作他用；違反者，視情節予以議處。\n有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項之辦法，由主管機關會商有關機關定之。","note":"一、本條新增。\n二、考量公務機關之資通安全專職人員辦理資通安全業務時，可能觸及國家機密、軍事機密及國防秘密，有予以查核其適任性之必要，又公務人員任用法第四條第二項後段亦明確規定，涉及國家安全或重大利益者，得辦理特殊查核。是以就辦理資通安全之現職人員及考試錄取人員定為得查核之對象範圍，並定明拒絕查核或查核未通過之法律效果，自有其必要性。至所定必要時，係指經公務機關綜合業務屬性、人員實際情形予以審認，爰規定第一項至第四項。另第二項「資通安全人員任用考試」，係指考試類科為「資通安全」者。\n三、查核紀錄涉及受查核者之個人資料，用人機關應注意相關保密及保管措施，爰規定第五項。\n四、有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項，授權主管機關訂定辦法，以符合授權明確性原則，爰規定第六項。"},{"bill":"202110073190000","text":"公務機關於必要時，得對所屬資通安全專職人員之適任性進行查核。\n主管機關得於資通安全人員任用考試榜示後，對錄取人員之適任性進行查核。\n拒絕查核或前二項查核結果經用人機關認定未通過者，不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務。\n前項人員職務得由用人機關基於內部管理及業務運作需要，依法進行調整。\n第一項及第二項查核紀錄，由用人機關依相關規定保密處理，並妥為保管，不得移作他用；違反者，視情節予以議處。\n有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項之辦法，由主管機關會商有關機關定之。","note":"一、本條新增。\n二、考量公務機關之資通安全專職人員辦理資通安全業務時，可能觸及國家機密、軍事機密及國防秘密，有予以查核其適任性之必要，是以將現職人員及考試錄取人員定為得查核之對象範圍，並定明拒絕查核或查核未通過之法律效果。至所定必要時，係指經公務機關綜合業務屬性、人員實際情形予以審認，爰規定第一項至第四項。另第二項「資通安全人員任用考試」，係指考試類科為「資通安全者」。\n三、查核紀錄涉及受查核者之個人資料，用人機關應注意相關保密及保管措施，爰規定第五項。\n四、有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項，授權主管機關訂定辦法，以符合授權明確性原則，爰規定第六項。\n五、另受查核人員就查核結果經用人機關認定未通過者，現職資通安全專職人員對於用人機關之決定，認有違法或顯然不當致損害其權利或利益，得依公務人員保障法規定，提起救濟；非現職者得依訴願法規定，提起救濟，併予敘明。"},{"bill":"202110074020000","text":"公務機關於必要時，得對所屬資通安全專職人員之適任性進行查核。\n主管機關得於資通安全人員任用考試榜示後，對錄取人員之適任性進行查核。\n拒絕查核或前二項查核結果經用人機關認定未通過者，不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務。\n前項人員職務得由用人機關基於內部管理及業務運作需要，依法進行調整。\n第一項及第二項查核紀錄，由用人機關依相關規定保密處理，並妥為保管，不得移作他用；違反者，視情節予以議處。\n有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項之辦法，由主管機關會商有關機關定之。","note":"一、本條新增。\n二、考量公務機關之資通安全專職人員辦理資通安全業務時，可能觸及國家機密、軍事機密及國防秘密，有予以查核其適任性之必要，是以將現職人員及考試錄取人員定為得查核之對象範圍，並定明拒絕查核或查核未通過之法律效果。至所定必要時，係指經公務機關綜合業務屬性、人員實際情形予以審認，爰規定第一項至第四項。另第二項「資通安全人員任用考試」，係指考試類科為「資通安全」者。\n三、查核紀錄涉及受查核者之個人資料，用人機關應注意相
