<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>資通安全管理法 2025 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

（以下簡稱資安署）辦理。","note":"一、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，本法之主管機關，自一百十一年八月二十七日起改由數位發展部管轄，爰配合上開公告修正現行條文，並列為第一項。\n二、因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責，爰增訂第二項，並將各該修正條文有關國家資通安全業務之權責，定明由資安署辦理。"},{"bill":"202110047780000","text":"本法之主管機關為數位發展部。","note":"數位發展部業於民國111年8月27日成立，確保國家資通訊安全乃數位發展部之法定任務之一，配合行政院數位發展部成立，修正本條文文字，本法主管機關為數位發展部。"},{"bill":"201110061520000","text":"本法之主管機關為數位發展部。\n國家資通安全業務，由數位發展部資通安全署（以下簡稱資安署）辦理。","note":"一、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，本法之主管機關，自一百十一年八月二十七日起變更為數位發展部，爰配合上開公告修正現行條文，並列為第一項。\n二、因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責，爰增訂第二項。"},{"bill":"202110067790000","text":"本法之主管機關為數位發展部。","note":"依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，本法之主管機關，自一百十一年八月二十七日起改由數發部管轄，爰配合上開公告修正現行條文。"},{"bill":"202110071280000","text":"本法之主管機關為數位發展部。\n國家資通安全業務，由數位發展部資通安全署（以下簡稱資安署）辦理。","note":"一、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，本法之主管機關，自一百十一年八月二十七日起變更為數位發展部，爰配合上開公告修正現行條文，並列為第一項。\n二、因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責，爰增訂第二項。"},{"bill":"202110071040000","text":"本法之主管機關為數位發展部。\n國家資通安全業務由數位發展部資通安全署（以下簡稱資安署）辦理。","note":"數位發展部自一百十一年八月二十七日正式成立，依該部組織法設置資通安全署，掌理國家資通安全業務，修正本法相關條文，明定本法主管機關為數位發展部，並由資通安全署辦理國家資通安全業務。"},{"bill":"202110073190000","text":"本法之主管機關為數位發展部。\n國家資通安全業務，由數位發展部資通安全署（以下簡稱資安署）辦理。","note":"一、2022年8月數位發展部成立，為全國通訊、資訊、資通安全、網路與傳播等相關事務之主管機關。爰修訂本法主管機關為數位發展部。\n二、增訂第二項，因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責爰修正之。"},{"bill":"202110074020000","text":"本法之主管機關為數位發展部。\n國家資通安全業務，由數位發展部資通安全署（以下簡稱資安署）辦理。","note":"一、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，本法之主管機關，自一百十一年八月二十七日起變更為數位發展部，爰配合上開公告修正現行條文，並列為第一項。\n二、因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責，爰增訂第二項。"},{"bill":"202110083660000","text":"本法之主管機關為數位發展部。\n國家資通安全業務，由數位發展部資通安全署（以下簡稱資安署）辦理。","note":"一、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，本法之主管機關，自一百十一年八月二十七日起改由數位發展部管轄，爰配合上開公告修正現行條文，並列為第一項。\n二、因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責，爰增訂第二項，並將各該修正條文有關國家資通安全業務之權責，定明由資安署辦理。"},{"bill":"202110082760000","text":"本法之主管機關為數位發展部。\n國家資通安全業務由數位發展部資通安全署（以下簡稱資安署）統籌辦理。","note":"一、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，本法之主管機關，自一百十一年八月二十七日起變更為數位發展部，爰配合上開公告修正現行條文，並列為第一項。\n二、因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責，爰增訂第二項。" 告，本法之主管機關，自一百十一年八月二十七日起變更為數位發展部，爰配合上開公告修正現行條文，並列為第一項。\n二、因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責，爰增訂第二項。"}],"changed":true,"final":"本法之主管機關為數位發展部。\n資通安全業務之執行，由數位發展部指定資安專責機關辦理。","finalWhy":"一、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，本法之主管機關，自一百十一年八月二十七日起變更為數位發展部，爰配合上開公告修正原條文，並列為第一項。\n二、因應數位發展部資通安全署成立，掌理國家資通安全業務，為符權責，爰參考專利法第三條規定增訂第二項。","review":{"note":"照行政院提案修正通過","text":"本法之主管機關為數位發展部。\n資通安全業務之執行，由數位發展部指定資安專責機關辦理。"}},{"no":"第三條","current":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，以確保其機密性、完整性及可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全政策或保護措施失效之狀態發生，影響資通系統機能運作，構成資通安全政策之威脅。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指關鍵基礎設施提供者、公營事業及政府捐助之財團法人。\n七、關鍵基礎設施：指實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞，經主管機關定期檢視並公告之領域。\n八、關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部，經中央目的事業主管機關指定，並報主管機關核定者。\n九、政府捐助之財團法人：指其營運及資金運用計畫應依預算法第四十一條第三項規定送立法院，及其年度預算書應依同條第四項規定送立法院審議之財團法人。","versions":[{"bill":"202110033990000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或行政法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院公告之關鍵領域中，該領域服務所依賴之系統或網路之實體或虛擬資產，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部，經依第十九條規定通知者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、因農田水利會已改制納入原行政院農業委員會農田水利署，本法納管之公法人目前僅存行政法人，爰修正第五款。\n四、第六款配合第九款用詞修正為特定財團法人。\n五、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第七款及第八款。\n六、現行條文第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰定明符合財團法人法第二條第二項、第三項或第六十三條第一項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人，爰修正第九款。"},{"bill":"201110061520000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"},{"bill":"202110067790000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指關鍵基礎設施提供者、公營事業及政府捐助之財團法人。\n七、關鍵基礎設施：指經行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、關鍵資通基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項或第六十三條第一項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五項未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八、第九款用詞修正為關鍵資通基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。且增訂經行政院公告關鍵基礎設施後應送立法院備查之程序規定，爰修正第七款。\n五、參考國家關鍵基礎設施安全防護指導綱要當中有關國家關鍵資訊基礎設施（Critical Information Infrastructure，CII）之定義，係指涉及核心業務運作，為支持國家關鍵基礎設施持續營運所需之重要資通訊系統或調度、控制系統（Supervisory Control and DataAcquisition，SCADA），亦屬國家關鍵基礎設施之重要元件（資通訊類資產），應配合對應之國家，關鍵基礎設施統一納管，爰修正第八款。\n六、現行條文第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰定明符合財團法人法第二條第二項或第六十三條第一項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人，爰修正第九款。"},{"bill":"202110071280000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"},{"bill":"202110071040000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或行政法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告關鍵領域之中，該領域服務所依賴之實體或虛擬資產，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指提供關鍵基礎設施所需一部或全部資通訊系統，或維持其運作者，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。\n十、危害國家資通安全產品：指對國家資通安全具有直接或間接造成危害風險，影響政府運作或社會安定之資通系統或資通服務，經主管機關列管之產品或服務。","note":"一、第一款及第二款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、因農田水利會已改制納入原行政院農業委員會農田水利署，本法納管之公法人目前僅存行政法人，爰修正第五款。\n四、第六款配合第九款用詞修正為特定財團法人。\n五、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第七款及第八款。\n六、現行條文第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰定明符合財團法人法第二條第二項、第三項或第六十三條第一項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人，爰修正第九款。\n七、為加強公務機關資安管理，本次修法新增第十一條，原則禁止公務機關採購使用危害國家資通安全之產品或服務，爰增訂第十款規定以授權主管機關訂定子法，說明危害與風險之樣態，或例示列冊管理。"},{"bill":"202110073190000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全政策或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業及特定財團法人。\n七、關鍵基礎設施：指經行政院定期檢視並公告之領域，其領域服務所依賴之公私有、實體或虛擬的資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。\n十、危害國家資通安全產品：指對國家資通安全具有直接或間接造成危害風險，影響政府運作或社會安定之資通系統或資通服務，並經主管機關核定者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。\n六、為加強各機關資安管理，增修第十一條、第二十六條，原則禁止公務機關下載、安裝或使用危害國家資安之產品或服務；特定非公務機關採核定後，列冊管理使用之，爰增訂本條第十款之規定。"},{"bill":"202110074020000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"},{"bill":"202110083660000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或行政法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院公告之關鍵領域中，該領域服務所依賴之系統或網路之實體或虛擬資產，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款及第二款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、因農田水利會已改制納入原行政院農業委員會農田水利署，本法納管之公法人目前僅存行政法人，爰修正第五款。\n四、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n五、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第七款及第八款。\n六、現行條文第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰定明符合財團法人法第二條第二項、第三項或第六十三條第一項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人，爰修正第九款。"},{"bill":"202110082760000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，以確保其機密性、完整性及可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全政策或保護措施失效之狀態發生，影響資通系統機能運作，構成資通安全政策之威脅。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施之維運或提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人。\n十、危害國家資通安全產品：指對國家資通安全具有直接或間接造成危害風險，可能影響政府運作或社會安定之資通系統或資通服務，並經主管機關核定者。","note":"一、第一款至第五款文字未修正。\n二、第六款配合第八款及第九款用詞進行修正，將「關鍵基礎設施提供者」調整為「特定關鍵基礎設施提供者」，「特定財團法人」的表述也作相應修正。\n三、依行政院公告之規定，自一百十一年八月二十七日起，第七款及第八款所列主管機關的權責事項仍由行政院管轄，且為配合現行實務作法，爰予修正。第八款中之「關鍵基礎設施提供者」一詞改為「特定關鍵基礎設施提供者」，此為用詞上之調整，實質內涵並未變更，兩者具有相同性質，且不影響原已指定之關鍵基礎設施提供者的效力，無需重新指定，並同步修正相關條文中對此用詞的表述。\n四、現行第九款制定時財團法人法尚未施行，考量該法已公布施行，爰修正第九款內容，明定符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定之全國性財團法人，為本法所稱「特定財團法人」。"},{"bill":"202110085470000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"},{"bill":"202110094940000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業、特定財團法人或受政府控制之事業、團體或機構。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。\n十、受政府控制之事業、團體或機構：指銓敘部公告之政府暨其所屬營業基金、非營業基金轉投資金額累計占該事業資本額百分之二十以上之轉投資或再轉投資事業、受政府直接或間接控制其人事、財務或業務之轉投資或再轉投資事業、團體或機構。\n十一、危害國家資通安全產品：指對國家資通安全具有直接或間接造成危害風險，影響政府運作或社會安定，並經主管機關定期公告之資通系統或資通服務產品。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人，並將受政府控制之事業、團體或機構納入特定非公務機關，以強化應對資通安全風險，維持社會穩定，守護國家安全。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。\n六、依據公務人員退休資遣撫卹法第七十七條第一項第二款及公務人員退休資遣撫卹法施行細則第一百十二條第五項，銓敘部應依據各主管機關填報之資料彙整後，定期公告「政府捐助（贈）之財團法人或政府暨所屬營業、非營業基金轉投資事業彙整表」，其中包含「政府暨其所屬營業基金、非營業基金轉投資金額累計占該事業資本額20%以上之轉投資或再轉投資事業」及「政府直接（間接）控制其人事、財務或業務之轉投資或再轉投資事業」等表，另公益揭弊者保護法第五條亦已明定受政府控制之事業、團體或機構之定義，爰配合修正第六款，將受政府控制之事業、團體或機構納入特定非公務機關，新增第十款，明定受政府控制之事業、團體或機構，指銓敘部公告之政府暨其所屬營業基金、非營業基金轉投資金額累計占該事業資本額百分之二十以上之轉投資或再轉投資事業、受政府直接或間接控制其人事、財務或業務之轉投資或再轉投資事業、團體或機構。\n七、配合增訂第十一條，要求公務機關除符合但書規定外，不得下載、安裝或使用危害國家資通安全產品，為符合法律明確性，並使受規範者得以遵循，參酌「各機關對危害國家資通安全產品限制使用原則」第二點及第三點，爰新增第十一款，明定「危害國家資通安全產品」，指對國家資通安全具有直接或間接造成危害風險，影響政府運作或社會安定，並經主管機關定期公告之資通系統或資通服務產品。"},{"bill":"202110097630000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"},{"bill":"202110109160000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院公告之關鍵領域中，該領域服務所依賴之系統或網路之實體或虛擬資產，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞，經主管機關定期檢視並公告之領域。\n八、關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部，經中央目的事業主管機關指定，並報主管機關核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、修正第三款及第四款文字，以符實際。\n二、因農田水利會已改制納入原行政院農業委員會農田水利署，本法納管之公法人目前僅存行政法人，爰修正第五款。\n三、配合第九款用詞修正為特定財團法人，修正第六條。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第七款及第八款。\n五、配合財團法人法已制定公布施行，爰定明符合財團法人法第二條第二項、第三項或第六十三條第一項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人，爰修正第九款。"},{"bill":"202110105760000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，以確保其機密性、完整性及可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全政策或保護措施失效之狀態發生，影響資通系統機能運作，構成資通安全政策之威脅。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指關鍵基礎設施提供者、公營事業及政府捐助之財團法人。\n七、關鍵基礎設施：指能源、水資源、通訊傳播、交通、金融、緊急救援與醫院、政府機關、科學園區與工業區等行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部所依賴之資通系統或調度、控制系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、修正第七款，因本修正草案將納管部分非公務機關，加諸其通報等義務並訂有罰則，因此包含哪些相關產業別及相關構成要件或領域，宜於資安法中直接明列。\n二、考量工業自動化時代，維運或提供關鍵基礎設施難單僅依賴資通系統，尚應包含支持關鍵基礎設施得以順利營運操作之「調度及控制系統」，該等系統同屬國家關鍵基礎設施之重要元件，爰同步修正第八款內容。"},{"bill":"202110111210000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際情形。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"},{"bill":"202110119960000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院公告之關鍵領域中，該領域服務所依賴之系統或網路之實體或虛擬資產，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞，經主管機關定期檢視並公告之領域。\n八、關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部，經中央目的事業主管機關指定，並報主管機關核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、修正第三款及第四款文字，以符實際。\n二、第九款用詞修正為特定財團法人。\n三、配合現行實務作法，爰修正第七款及第八款。"},{"bill":"202110127080000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"},{"bill":"202110128370000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人或受政府控制之事業、團體或機構。\n七、關鍵基礎設施：指能源、水資源、通訊傳播、交通、金融、緊急救援與醫院、政府機關、科學園區與工業區等行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人；並將受政府控制之事業、團體或機構納入特定非公務機關，以周全範圍、強化應對資通安全風險。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。\n(一)修正第七款。有鑑於本草案納管部分非公務機關，加諸其通報義務且訂有罰則。爰涵蓋之產業別及相關構成要件，應明定於關鍵基礎設施安全防護範圍。\n(二)修正第八款。考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"},{"bill":"202110129110000","text":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指特定關鍵基礎設施提供者、公營事業或特定財團法人。\n七、關鍵基礎設施：指行政院定期檢視並公告之領域中，該領域服務所依賴之實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞者。\n八、特定關鍵基礎設施提供者：指維運或提供關鍵基礎設施全部或一部所依賴之資通系統，經中央目的事業主管機關指定，送由主管機關報請行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。","note":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第八款、第九款用詞修正為特定關鍵基礎設施提供者、特定財團法人。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。另第八款用詞，考量本法係以維運或提供關鍵基礎設施全部或一部所依賴之「資通系統」者為規範對象，為避免混淆，爰由現行「關鍵基礎設施提供者」修正為「特定關鍵基礎設施提供者」，惟實質內涵並未變更，兩者具有同一性，不影響原經指定為關鍵基礎設施提供者之效力，不生重行指定之問題，並配合修正本法相關條文用詞。\n五、現行第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。"}],"changed":true,"final":"本法用詞，定義如下：\n一、資通系統：指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。\n二、資通服務：指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。\n三、資通安全：指防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀，或其他情形影響其機密性、完整性或可用性。\n四、資通安全事件：指系統、服務或網路狀態經鑑別而顯示可能有違反資通安全或保護措施失效之狀態發生，影響資通系統機能運作。\n五、公務機關：指依法行使公權力之中央、地方機關（構）或公法人。但不包括軍事機關及情報機關。\n六、特定非公務機關：指關鍵基礎設施提供者、公營事業、特定財團法人或受政府控制之事業、團體或機構。\n七、關鍵基礎設施：指實體或虛擬資產、系統或網路，其功能一旦停止運作或效能降低，對國家安全、社會公共利益、國民生活或經濟活動有重大影響之虞，經行政院定期檢視並公告之領域。\n八、關鍵基礎設施提供者：指維運或提供關鍵基礎設施之全部或一部，經中央目的事業主管機關指定，並報行政院核定者。\n九、特定財團法人：指符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定之財團法人，並屬該法第二條第八項所定全國性財團法人者。\n十、受政府控制之事業、團體或機構：指銓敘部依公務人員退休資遣撫卹法第七十七條第一項第二款第三目及第四目公告之事業、團體或機構，具資通安全重要性，經中央目的事業主管機關指定，並經主管機關核定者；其受地方政府控制者，應經地方主管機關同意後，主管機關始得核定。\n十一、危害國家資通安全產品：指經主管機關認定，對國家資通安全具有直接或間接造成危害風險，影響政府運作或社會安定之資通系統、服務或產品。","finalWhy":"一、第一款、第二款及第五款未修正。\n二、第三款及第四款酌作文字修正，以符實際。\n三、第六款配合第九款、第十款用詞修正為特定財團法人或受政府控制之事業、團體或機構。\n四、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第七款及第八款所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰予修正。\n五、原第九款制定公布時，財團法人法尚未完成立法，考量該法已制定公布施行，爰修正第九款，定明符合財團法人法第二條第二項、第三項或第六十三條第一項、第四項規定，且屬該法第二條第八項所定全國性財團法人者，為本法所稱特定財團法人。\n六、新增第十款銓敘部依公務人員退休資遣撫卹法第七十七條第一項第二款第三目及第四目公告之事業、團體或機構，具資通安全重要性者。上開事業、團體或機構，如屬地方政府控制者，為符地方自治及分層負責原則，應經地方主管機關同意後，主管機關始得核定。\n七、新增第十一款危害國家資通安全產品定義，以符法制。","review":{"note":"保留，送院會處理","text":""}},{"no":"第四條","current":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務與審驗機制之發展。\n前項相關事項之推動，由主管機關以國家資通安全發展方案定之。","versions":[{"bill":"202110033990000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院定之。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第二項所列事項，自一百十一年八月二十七日起仍由行政院管轄，並配合實務作法，爰予修正。"},{"bill":"202110047780000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務與審驗機制之發展。\n五、協助民間處理、因應及防範資通安全事件。\n前項相關事項之推動，由主管機關以國家資通安全發展方案定之。","note":"一、增訂第一項第五款，要求政府應提供資源，協助民間處理、因應及防範資通安全事件，蓋根據最新報導，臺灣企業資安事故有增加的趨勢，單以今（2024）年上市櫃公司的狀況來看，一至二月的資安事件重大訊息就有9件，平均每月4.5件；去（2023）年則有23件（遭網路攻擊資安事故17件、其他與資安相關的事件6件），平均每月近1.9件。受害的產業相當廣泛，不僅是科技業、電子零組件，即便是藥局、汽車、自行車、觀光、化學、塑膠、生技都難以倖免。並且駭客攻擊的目標也不限於大企業，中、小企業也逐漸傳出災情，這些中小企業的資安水準存在一定的落差，相較於大企業，駭客反而無需使用更複雜的手法，但中、小企業卻將因此疲於奔命，營運受影響。鑒於我國超過九成屬於中小企業，其經營良窳和整體社會經濟能否穩定發展息息相關，爰此，新增規定要求政府應提供資源，協助民間處理、因應及防範資通安全威脅事件。\n二、第二項未修正。"},{"bill":"201110061520000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110067790000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n五、協助民間處理、因應及防範資通安全事件。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，第一至第三款未修正。\n二、鑒於臺灣企業資安事故有增加的趨勢，且我國超過九成屬於中小企業，其經營良窳和整體社會經濟能否穩定發展息息相關，爰此，增訂第一項第五款規定要求政府應提供資源，協助民間處理、因應及防範資通安全威脅事件。\n三、第四條第二項修正為相關事項之推動，應由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110071280000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110071040000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第二項所列事項，自一百十一年八月二十七日起仍由行政院管轄，並配合實務作法，爰予修正。"},{"bill":"202110073190000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務與審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施之。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110074020000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬定國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110083660000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項文字配合實務做法修正。"},{"bill":"202110082760000","text":"為提升國家資通安全，政府應提供資源，整合民間及產業力量，以提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務與審驗機制之發展。\n五、支援民間企業的資通安全防護。\n六、提升全民資通安全意識。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施，並視情況定期檢討、修正方案內容，以符合最新之資通安全需求。","note":"一、第一項第一款至第四款文字未修正。\n二、新增第一項第五款條文，規定政府應支援民間企業資通安全防護，特別是中小企業，提供技術協助及聯防機制，確保產業界的資通安全能力同步提升，以降低整體資通風險。\n三、新增第一項第六款條文，旨在提升全民的資通安全意識，政府應推動資安教育及宣導，使公眾具備基本的資通安全知識，形成社會整體防護力量，以因應各類網路安全威脅。\n四、前項各款推動事項由主管機關擬定國家資通安全發展方案，報請行政院核定後實施，並視情況定期檢討和修正，以因應最新的資通安全需求。"},{"bill":"202110085470000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110094940000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110097630000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110111210000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110127080000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110128370000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"},{"bill":"202110129110000","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","note":"一、第一項第四款酌作文字修正，其餘各款未修正。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。"}],"changed":true,"final":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n五、協助民間處理、因應及防範重大資通安全事件。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。","finalWhy":"一、第一項第四款酌作文字修正，並考量民間就資通安全事件處理、因應及防範之情形，與國家資通安全之防護息息相關，爰增訂第五款。\n二、第二項配合實務作法，修正為由數位發展部擬訂國家資通安全發展方案，報請行政院核定後實施。","review":{"note":"照行政院提案修正通過","text":"為提升資通安全，政府應提供資源，整合民間及產業力量，提升全民資通安全意識，並推動下列事項：\n一、資通安全專業人才之培育。\n二、資通安全科技之研發、整合、應用、產學合作及國際交流合作。\n三、資通安全產業之發展。\n四、資通安全軟硬體技術規範、相關服務及審驗機制之發展。\n五、協助民間處理、因應及防範重大資通安全事件。\n前項相關事項之推動，由主管機關擬訂國家資通安全發展方案，報請行政院核定後實施。"}},{"no":"第五條","current":null,"versions":[{"bill":"202110033990000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，以強化跨機關資通安全事件應處及協調能力。\n三、另為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，於第四項授權由行政院定之。"},{"bill":"201110061520000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110067790000","text":"為落實國家資通安全政策，各級政府機關應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應定期召開國家資通安全會報，由行政院院長擔任召集人，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並應辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，行政院應定期召開國家資通安全會報，由行政院院長擔任召集人，爰規定第一項及第二項，以強化跨機關資通安全事件應處及協調能力。\n三、另為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，於第四項授權由行政院定之。"},{"bill":"202110071280000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110071040000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，由行政院定之。","note":"一、本條新增。\n二、為因應愈趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，以強化跨機關資通安全事件應處及協調能力。\n三、另為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，於第四項授權由行政院定之。"},{"bill":"202110073190000","text":"為落實國家資通安全政策，中央及地方政府機關間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應定期召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，中央及地方政府機關間應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，強化跨機關資通安全事件應處及協調能力，並由行政院定期召開國家資安會報。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110074020000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110083660000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，以強化跨機關資通安全事件應處及協調能力。\n三、另為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，於第四項授權由行政院定之。"},{"bill":"202110082760000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境，並提升跨機關資通安全協作能力。\n為推動國家資通安全政策之執行、應變機制與重大計畫之諮詢審議，以及協調各政府機關、中央及地方間之資通安全相關事務，主管機關應召開國家資通安全會報，統籌資通安全事務之規劃與執行，並負責各機關之橫向聯繫與協調。會報之幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府機關應予執行，並由主管機關定期追蹤考核，必要時得辦理績效評核，確保各機關有效落實資通安全政策。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由主管機關擬訂，報請行政院核定後實施。","note":"一、本條新增。\n二、為因應全球日益嚴峻的資通安全威脅及突發資通安全事件，強化各政府機關間的協作機制，建立中央與地方的資通安全聯防體系，特訂定第一項及第二項，確保跨機關之資通安全事件處理能力，並提升橫向聯繫與協調之效率。\n三、為確保各機關切實執行國家資通安全會報之決議事項，並有效落實資通安全政策，爰規定第三項，由主管機關負責定期追蹤考核，並得視需求辦理績效評核。\n四、為確保國家資通安全會報之有效運作，授權主管機關擬訂會報的組成、任務、議事程序及其他相關事項之辦法，並報請行政院核定後實施，爰訂定第四項。"},{"bill":"202110085470000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110094940000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應設國家資通安全會報，由行政院院長擔任召集人，召集相關部會首長、專家學者及民間團體代表共同組成，專家學者及民間團體代表不得低於三分之一，至少每三個月開會一次，必要時得召開臨時會議，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，參酌食品安全衛生管理法第二條之一，明定行政院應設國家資通安全會報，由行政院院長擔任召集人，召集相關部會首長、專家學者及民間團體代表共同組成，以強化跨機關資通安全事件應處及協調能力，爰於第一項及第二項規定。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110097630000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應定期召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110111210000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110127080000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110128370000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，由行政院院長召集相關部會首長、專家學者及民間團體代表共同組成，專家學者及民間團體代表不得低於三分之一，至少每三個月開會一次，必要時得召開臨時會議，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰參酌道路交通安全基本法第二十一條、食品安全衛生管理法第二條之一，於第一項及第二項明定行政院應召開國家資通安全會報，由行政院院長召集相關部會首長、專家學者及民間團體代表共同組成，以強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"},{"bill":"202110129110000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","note":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。"}],"changed":true,"final":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應定期召開國家資通安全會報，由行政院院長或副院長擔任召集人，得邀請專家學者及民間團體代表出席，必要時得召開臨時會議，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，由行政院定之。","finalWhy":"一、本條新增。\n二、因應越趨增強之全球資通安全威脅及突發資通安全事件，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，並定明國家資通安全會報召集人，強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項之辦法，於第四項授權由行政院定之。","review":{"note":"照委員黃健豪、葛如鈞等5人所提修正動議通過","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應每年公布國家資通安全情勢報告、資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。"}},{"no":"第五條之一","current":null,"versions":[{"bill":"202110109160000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，由行政院定之。","note":"一、本條新增。\n二、考量全球資通安全威脅及突發資通安全事件逐年增加，且台灣，各政府機關應建立中央地方聯防體系，以完備國家資通安全，爰規定第一項及第二項，以強化跨機關資通安全事件應處及協調能力。\n三、為確保落實國家資通安全會報決議事項，爰規定第三項。\n四、第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，於第四項授權由行政院定之。"},{"bill":"202110119960000","text":"為落實國家資通安全政策，各政府機關、中央及地方間，應致力配合推動執行國家資通安全措施，共同建構國家資通安全環境。\n為辦理國家資通安全政策、應變機制與重大計畫之諮詢審議，協調各政府機關、中央及地方間之資通安全相關事務，行政院應召開國家資通安全會報，其幕僚作業由主管機關辦理。\n前項國家資通安全會報決議事項，相關政府部門應予執行，由主管機關定期追蹤管考，並得辦理績效評核。\n第二項國家資通安全會報之組成、任務、議事程序及其他相關事項，由行政院定之。","note":"本條新增。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六條","current":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及資通安全發展方案，應送立法院備查。","versions":[{"bill":"202110033990000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次遞移。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體。"},{"bill":"201110061520000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110067790000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應每年公布國家資通安全情勢報告、對公務機關及特定非公務機關之資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、對公務機關及特定非公務機關之資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次遞移。\n二、第一項酌作文字修正，並修改為主管機關應每年公布國家資通安全情勢報告、對公務機關及特定非公務機關之資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n三、第二項由現行條文第四條第二項規定移列，並予以調整。"},{"bill":"202110071280000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110071040000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次遞移。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體。"},{"bill":"202110073190000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，並應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌修正文字。\n三、第二項明訂辦理之機關主體，並修正文字。"},{"bill":"202110074020000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及資通國家安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110083660000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次遞移。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體。"},{"bill":"202110082760000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110085470000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110094940000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110097630000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際與學術交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110111210000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110114430000","text":"主管機關得委託其他公務機關辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n數位發展部資通安全署得委託其他公務機關辦理國家資通安全防護、演練、稽核及其他資通安全相關事務。\n前二項受委託之公務機關，不得洩露辦理相關事務過程中所知悉之秘密。\n特定非公務機關之業務涉及數個中央目的事業主管機關之權責，主管機關應協調與業務關聯性最高之中央目的事業主管機關，辦理本法所定中央目的事業主管機關應辦理之事項。","note":"一、本條係規範主管機關及資安署委託其他公務機關辦理資通安全相關事務之權限，並明確受委託機關之保密義務及跨機關協調機制。\n二、考量實務運作需求，第一項規定主管機關得委託其他公務機關辦理資通安全整體防護、國際交流合作及其他資通安全事務，維持現行未委任所屬機關或委託法人團體之做法。\n三、配合第二條第二項關於資安署職掌之規定，第二項增訂資安署得委託其他公務機關辦理國家資通安全防護、演練、稽核等事務，提供明確法源依據。\n四、為確保資通安全事務之保密性，第三項規定受委託公務機關不得洩露辦理過程中知悉之秘密，擴大保密範圍至所有相關秘密，而非僅限關鍵基礎設施提供者之秘密，並排除複委託情事。\n五、特定非公務機關之業務可能涉及數個中央目的事業主管機關之權責，為避免權責不清，第四項增訂主管機關應協調與業務關聯性最高之機關辦理本法相關事項，將施行細則第十二條提升至本法，並酌修文字，強化協調機制之法律位階。"},{"bill":"202110127080000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110128370000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"},{"bill":"202110129110000","text":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應定期公布國家資通安全情勢報告、對公務機關資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項修正定明辦理之主體，並酌作文字修正。"}],"changed":true,"final":"主管機關應規劃並推動國家資通安全政策、資通安全科技發展、國際交流合作及資通安全整體防護等相關事宜，並應每年公布國家資通安全情勢報告、資通安全維護計畫實施情形稽核概況報告及國家資通安全發展方案。\n前項情勢報告、實施情形稽核概況報告及國家資通安全發展方案，應由主管機關送立法院備查。","finalWhy":"照委員修正動議通過。,","review":{"note":"保留，送院會處理","text":""}},{"no":"第七條","current":"主管機關應衡酌公務機關及特定非公務機關業務之重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，訂定資通安全責任等級之分級；其分級基準、等級變更申請、義務內容、專責人員之設置及其他相關事項之辦法，由主管機關定之。\n主管機關得稽核特定非公務機關之資通安全維護計畫實施情形；其稽核之頻率、內容與方法及其他相關事項之辦法，由主管機關定之。\n特定非公務機關受前項之稽核，經發現其資通安全維護計畫實施有缺失或待改善者，應向主管機關提出改善報告，並送中央目的事業主管機關。","versions":[{"bill":"202110033990000","text":"公務機關及特定非公務機關，應按其業務重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，報由資安署核定或備查其資通安全責任等級。\n公務機關及特定非公務機關應符合資通安全責任等級之要求，並自管理、技術、認知及訓練等面向，辦理資通安全防護措施。\n前二項資通安全責任等級之區分基準、核定或備查程序、變更申請、資通安全防護措施辦理項目、內容、專職人員之資格與配置及其他相關事項之辦法，由主管機關定之。","note":"一、現行條文第一項前段規定酌作文字修正，以符實際，並列為修正條文第一項。\n二、公務機關及特定非公務機關辦理資通安全防護措施應符合資通安全責任等級之要求，爰增訂第二項。\n三、現行條文第一項後段規定移列為修正條文第三項，並就其授權範圍及內容酌作修正，以資明確。\n四、現行條文第二項及第三項移列於修正條文第八條，爰予刪除。"},{"bill":"201110061520000","text":"公務機關及特定非公務機關，應按其業務重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，報由資安署核定或備查其資通安全責任等級。\n公務機關及特定非公務機關應符合資通安全責任等級之要求，並自管理、技術、認知及訓練等面向，辦理資通安全防護措施。\n前二項資通安全責任等級之區分基準、核定或備查程序、變更申請、資通安全防護措施辦理項目、內容、專職人員之配置與專業條件及其他相關事項之辦法，由主管機關定之。","note":"一、現行第一項前段規定酌作文字修正，以符實際，並列為修正條文第一項。\n二、公務機關及特定非公務機關辦理資通安全防護措施應符合資通安全責任等級之要求，爰增訂第二項。\n三、現行第一項後段規定移列為修正條文第三項，並就其授權範圍及內容酌作修正，以資明確。\n四、現行第二項及第三項移列修正條文第八條規定，爰予刪除。"},{"bill":"202110067790000","text":"公務機關及特定非公務機關，應按其業務重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，報由主管機關核定其資通安全責任等級。\n公務機關及特定非公務機關應符合資通安全責任等級之要求，並自管理、技術、認知及訓練等面向，辦理資通安全防護措施。\n前二項資通安全責任等級之區分基準、核定程序、變更申請、資通安全防護措施辦理項目、內容、專職人員之資格條件與配置及其他相關事項之辦法，由主管機關定之。","note":"一、現行條文第一項前段規定酌作文字修正，以符實際，並列為修正條文第一項。\n二、公務機關及特定非公務機關辦理資通安全防護措施應符合資通安全責任等級之要求，爰增訂第二項。\n三、現行條文第一項後段規定移列為修正條文第三項，並就其授權範圍及內容酌作修正，並明列專職人員，以資明確。至於專職人員之管理與教育訓練，應視資通安全責任等級分級辦法之規定而定。\n四、本法所指之「專職」人員，係指全職執行資通安全業務者，其人力配置之要求係以「機關」為單位，不僅資安人力不能共用，其他關於資安證照之計算，均應以機關作為單位而分開計算，特此說明。\n五、現行條文第二項及第三項移列於修正條文第八條，爰予刪除。"},{"bill":"202110071280000","text":"公務機關及特定非公務機關，應按其業務重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，報由資安署核定或備查其資通安全責任等級。\n公務機關及特定非公務機關應符合資通安全責任等級之要求，並自管理、技術、認知及訓練等面向，辦理資通安全防護措施。\n前二項資通安全責任等級之區分基準、核定或備查程序、變更申請、資通安全防護措施辦理項目、內容、專職人員之配置與專業條件及其他相關事項之辦法，由主管機關定之。","note":"一、現行第一項前段規定酌作文字修正，以符實際，並列為修正條文第一項。\n二、公務機關及特定非公務機關辦理資通安全防護措施應符合資通安全責任等級之要求，爰增訂第二項。\n三、現行第一項後段規定移列為修正條文第三項，並就其授權範圍及內容酌作修正，以資明確。\n四、現行第二項及第三項移列修正條文第八條規定，爰予刪除。"},{"bill":"202110071040000","text":"主管機關應衡酌公務機關及特定非公務機關，應按其業務之重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，報由資安署核定或備查其資通安全責任等級。\n公務機關及特定非公務機關應符合資通安全責任等級之要求，並自管理、技術、認知及訓練等面向，辦理資通安全防護措施。\n前二項資通安全責任等級之區分基準、核定或備查程序、變更申請、資通安全防護措施辦理項目、內容、專職人員之專業條件與配置及其他相關事項之辦法，由主管機關定之。","note":"一、現行條文第一項前段規定酌作文字修正，以符實際，並列為修正條文第一項。\n二、公務機關及特定非公務機關辦理資通安全防護措施應符合資通安全責任等級之要求，爰增訂第二項。\n三、現行條文第一項後段規定移列為修正條文第三項，並就其授權範圍及內容酌作修正，以資明確。"},{"bill":"202110073190000","text":"公務機關及特定非公務機關，應按其業務重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，報由資安署核定或備查其資通安全責任等級。\n公務機關及特定非公務機關應符合資通安全責任等級之要求，並自管理、技術、認知及訓練等面向，辦理資通安全防護措施。\n前二項資通安全責任等級之區分基準、核定或備查程序、變更申請、資通安全防護措施辦理項目、內容、專職人員之配置與專業條件及其他相關事項之辦法，由主管機關定之。","note":"一、現行第一項前段規定酌作文字修正，以符實際，並列為修正條文第一項。\n二、公務機關及特定非公務機關辦理資通安全防護措施應符合資通安全責任等級之要求，爰增訂第二項。\n三、現行第一項後段規定移列為修正條文第三項，並就其授權範圍及內容酌作修正，以資明確。\n四、現行第二項及第三項移列修正條文第八條規定，爰予刪除。"},{"bill":"202110074020000","text":"公務機關及特定非公務機關，應按其業務重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，報由資安署核定或備查其資通安全 準、核定或備查程序、變更申請、資通安全防護措施辦理項目、內容、專職人員之資格條件與配置及其他相關事項之辦法，由主管機關定之。","finalWhy":"照行政院提案修正通過。,","review":{"note":"照行政院提案修正通過","text":"公務機關及特定非公務機關，應按其業務重要性與機敏性、機關層級、保有或處理之資訊種類、數量、性質、資通系統之規模及性質等條件，報由主管機關核定或備查其資通安全責任等級。\n公務機關及特定非公務機關應符合資通安全責任等級之要求，並自管理、技術、認知及訓練等面向，辦理資通安全防護措施。\n前二項資通安全責任等級之區分基準、核定或備查程序、變更申請、資通安全防護措施辦理項目、內容、專職人員之資格條件與配置及其他相關事項之辦法，由主管機關定之。"}},{"no":"第七條之一","current":null,"versions":[{"bill":"202110109160000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，改善報告應送交上級機關、上級政府、監督機關或中央目的事業主管機關審查後，並送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、本條新增。\n二、第一項由現行條文第七條第二項前段規定移列，並為協助公務機關檢視自身資通安全維護計畫實施情形，以完備公部門之資安防護，增訂資安署得稽核公務機關。\n三、第二項由現行條文第七條第三項規定移列，並配合實務執行需求修正，就現行受稽核機關之改善報告送交及審查流程細緻化規範。\n四、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n五、第四項由現行條文第七條第二項後段規定移列，並酌作修正。\n六、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，宜送交資安會報備查，爰增訂第五項。"},{"bill":"202110119960000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，改善報告應送交上級機關、上級政府、監督機關或中央目的事業主管機關審查後，並送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"本條新增。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第八條","current":"第二項及第三項\n主管機關得稽核特定非公務機關之資通安全維護計畫實施情形；其稽核之頻率、內容與方法及其他相關事項之辦法，由主管機關定之。\n特定非公務機關受前項之稽核，經發現其資通安全維護計畫實施有缺失或待改善者，應向主管機關提出改善報告，並送中央目的事業主管機關。","versions":[{"bill":"202110033990000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，改善報告應送交上級機關、上級政府、監督機關或中央目的事業主管機關審查後，並送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行條文第七條第二項前段規定移列，並為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關。\n二、第二項由現行條文第七條第三項規定移列，並配合實務執行需求修正，就現行受稽核機關之改善報告送交及審查流程細緻化規範。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行條文第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"201110061520000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告，公務機關送交依第十四條規定收受其實施情形之機關、特定非公務機關送交中央目的事業主管機關審查後，由該審查機關送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告之提出及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫，送由主管機關報請行政院核定後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行第七條第二項前段規定移列，酌作文字修正，並為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關。\n二、第二項由現行第七條第三項規定移列，並配合實務執行需求酌作修正。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"202110067790000","text":"主管機關應定期或不定期稽核公務機關及非特定公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告，並送交主管機關審查。\n主管機關收受改善報告後，認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告之提出及其他相關事項之辦法，由主管機關定之。\n第一項稽核由數位發展部資通安全署擬訂年度計畫，送由主管機關報請行政院核定後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項前段由現行條文第七條第二項前段規定移列，為協助特定公務機關及非公務機關檢視自身資通安全維護計畫實施情形，主管機關由得稽核改為應稽核，並增訂公務機關為應稽核對象。\n二、第二項由現行條文第七條第三項規定移列，並配合實務執行需求修正。\n三、為使主管機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行條文第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"202110071280000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告，公務機關送交依第十四條規定收受其實施情形之機關、特定非公務機關送交中央目的事業主管機關審查後，由該審查機關送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告之提出及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫，送由主管機關報請行政院核定後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行第七條第二項前段規定移列，酌作文字修正，並為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關。\n二、第二項由現行第七條第三項規定移列，並配合實務執行需求酌作修正。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"202110071040000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n經前項稽核發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告。\n前項報告之提出，公務機關應依第十四條規定辦理；特定非公務機關應送交目的事業主管機關審查後，再送資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行條文第七條第二項前段移列。為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關之規定。\n二、第二項由現行條文第七條第三項移列，明定現行受稽核機關之改善報告送交及審查流程規範。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項。\n四、第四項由現行條文第七條第二項後段移列，並酌作修正。\n五、授權資安署辦理第一項稽核工作，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"202110073190000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告，公務機關送交依第十四條規定收受其實施情形之機關、特定非公務機關送交中央目的事業主管機關審查後，由該審查機關送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告之提出及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫，送由主管機關報請行政院核定後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行第七條第二項前段規定移列，酌作文字修正，並為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關。\n二、第二項由現行第七條第三項規定移列，並配合實務執行需求酌作修正。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"202110074020000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告，公務機關送交依第十四條規定收受其實施情形之機關、特定非公務機關送交中央目的事業主管機關審查後，由該審查機關送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告之提出及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫送由主管機關報請行政院核定後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行第七條第二項前段規定移列酌作文字修正並為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關。\n二、第二項由現行第七條第三項規定移列，並配合實務執行需求酌作修正。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行爰增訂第五項。"},{"bill":"202110083660000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出應提出改善報告，公務機關送交依第十四條規定收受其實施情形之機關、特定非公務機關應送交中央目的事業主管機關審查後，由該審查機關送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告之提出及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫，送由主管機關報請行政院核定後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行條文第七條第二項前段規定移列，並為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關。\n二、第二項由現行條文第七條第三項規定移列，並配合實務執行需求修正，就現行受稽核機關之改善報告送交及審查流程細緻化規範。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行條文第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"202110082760000","text":"各公務機關及特定非公務機關之資通安全維護計畫，應接受主管機關定期或不定期之稽核，以確保資通安全措施之落實。\n為確保稽核結果有效執行，主管機關得要求受稽核機關依據稽核結果提出改進計畫，並於指定期限內完成改善；必要時，主管機關得進行績效評估，並將稽核及改善情形列入機關考核。\n主管機關辦理前項稽核及考核之執行方式、範圍及其他相關事項，由主管機關定之。","note":"一、第一項由現行第七條第二項移列並修正，將「特定非公務機關」擴及至「公務機關及特定非公務機關」，且增訂主管機關可進行「定期或不定期」的稽核，以強化對各機關資通安全措施的監督，確保各機關依計畫落實資通安全。\n二、第二項由現行第七條第三項移列並修正，增訂主管機關得要求受稽核機關依據稽核結果提出改進計畫，並於指定期限內完成改善。另新增主管機關得視需求進行績效評估，並將稽核與改善情形列入考核，進一步確保稽核結果的有效執行。\n三、第三項由現行第七條第二項後段移列並修正，擴充稽核範圍與執行方式之說明，賦予主管機關針對前述稽核及考核的具體執行方式、範圍及相關事項制定辦法的權限，以確保本條的實務操作性。"},{"bill":"202110085470000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告，公務機關送交依第十四條規定收受其實施情形之機關、特定非公務機關送交中央目的事業主管機關審查後，由該審查機關送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告之提出及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫，送由主管機關報請行政院核定後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行第七條第二項前段規定移列，酌作文字修正，並為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關。\n二、第二項由現行第七條第三項規定移列，並配合實務執行需求酌作修正。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"202110094940000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告，公務機關送交依第十四條規定收受其實施情形之機關、特定非公務機關送交中央目的事業主管機關審查後，由該審查機關送交資安署。\n前項收受改善報告之機關認有必要時，得要求受稽核機關進行說明或調整。\n前三項資通安全維護計畫實施情形之稽核頻率、內容與方法、改善報告之提出及其他相關事項之辦法，由主管機關定之。\n第一項稽核由資安署擬訂年度計畫，送由主管機關報請行政院核定後辦理，年度計畫及年度成果報告應送交國家資通安全會報備查。","note":"一、第一項由現行第七條第二項前段規定移列，酌作文字修正，並為協助公務機關檢視自身資通安全維護計畫實施情形，增訂資安署得稽核公務機關。\n二、第二項由現行第七條第三項規定移列，並配合實務執行需求酌作修正。\n三、為使收受改善報告之機關得對受稽核機關進行監督及指導，爰增訂第三項，俾使其得就缺失或待改善事項妥為處理。\n四、第四項由現行第七條第二項後段規定移列，並酌作修正。\n五、為使第一項稽核辦理有據，並考量事涉公務機關及特定非公務機關，有賴各政府機關間配合推動執行，爰增訂第五項。"},{"bill":"202110097630000","text":"資安署得定期或不定期稽核公務機關及特定非公務機關之資通安全維護計畫實施情形。\n前項稽核後，發現受稽核機關資通安全維護計畫實施情形有缺失或待改善者，受稽核機關應提出改善報告，公務機關送交依第十四條規定收受其實施情形之機關、特定非公務機關送交中央目的事業主管機關審查後，由該審查機關送交資安署。\n前項收受改善報告之機關認有
