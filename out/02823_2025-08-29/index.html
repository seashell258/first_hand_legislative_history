定，認有違法或顯然不當致損害其權利或利益，得依公務人員保障法規定，提起救濟；非現職者得依訴願法規定，提起救濟，併予敘明。"},{"bill":"202110129110000","text":"公務機關於必要時，得對所屬資通安全專職人員之適任性進行查核。\n主管機關得於資通安全人員任用考試榜示後，對錄取人員之適任性進行查核。\n拒絕查核或前二項查核結果經用人機關認定未通過者，不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務。\n前項人員職務得由用人機關基於內部管理及業務運作需要，依法進行調整。\n第一項及第二項查核紀錄，由用人機關依相關規定保密處理，並妥為保管，不得移作他用；違反者，視情節予以議處。\n有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項之辦法，由主管機關會商有關機關定之。","note":"一、本條新增。\n二、考量公務機關之資通安全專職人員辦理資通安全業務時，可能觸及國家機密、軍事機密及國防秘密，有予以查核其適任性之必要，是以將現職人員及考試錄取人員定為得查核之對象範圍，並定明拒絕查核或查核未通過之法律效果。至所定必要時，係指經公務機關綜合業務屬性、人員實際情形予以審認，爰規定第一項至第四項。另第二項「資通安全人員任用考試」，係指考試類科為「資通安全」者。\n三、查核紀錄涉及受查核者之個人資料，用人機關應注意相關保密及保管措施，爰規定第五項。\n四、有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項，授權主管機關訂定辦法，以符合授權明確性原則，爰規定第六項。另受查核人員就查核結果經用人機關認定未通過者，現職資通安全專職人員對於用人機關之決定，認有違法或顯然不當致損害其權利或利益，得依公務人員保障法規定，提起救濟；非現職者得依訴願法規定，提起救濟，併予敘明。"}],"changed":true,"final":"公務機關於必要時，得對所屬資通安全專職人員之適任性進行查核。\n主管機關得於資通安全人員任用考試榜示後，對錄取人員之適任性進行查核。\n拒絕查核或前二項查核結果經用人機關認定未通過者，不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務。\n前項人員職務得由用人機關基於內部管理及業務運作需要，依法進行調整。\n第一項及第二項查核紀錄，由用人機關依相關規定保密處理，並妥為保管，不得移作他用；違反者，視情節予以議處。\n有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項之辦法，由主管機關會商有關機關定之。","finalWhy":"一、本條新增。\n二、考量公務機關之資通安全專職人員辦理資通安全業務時，可能觸及國家機密、軍事機密及國防秘密，有予以查核其適任性之必要，是以將現職人員及考試錄取人員定為得查核之對象範圍，並定明拒絕查核或查核未通過之法律效果。至所定必要時，係指經公務機關綜合業務屬性、人員實際情形予以審認，爰規定第一項至第四項。另第二項「資通安全人員任用考試」，係指考試類科為「資通安全」者。\n三、查核紀錄涉及受查核者之個人資料，用人機關應注意相關保密及保管措施，爰規定第五項。\n四、有關查核權責機關、應受查核人員、查核程序、內容及其他相關事項，授權主管機關訂定辦法，以符合授權明確性原則，爰規定第六項。另受查核人員就查核結果經用人機關認定未通過者，現職資通安全專職人員對於用人機關之決定，認有違法或顯然不當致損害其權利或利益，得依公務人員保障法規定，提起救濟；非現職者得依訴願法規定，提起救濟，併予敘明。","review":{"note":"照行政院提案通過","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。"}},{"no":"第二十條","current":"第二項至第五項\n關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應稽核所管關鍵基礎設施提供者之資通安全維護計畫實施情形。\n關鍵基礎設施提供者之資通安全維護計畫實施有缺失或待改善者，應提出改善報告，送交中央目的事業主管機關。\n第二項至第五項之資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報請主管機關核定之。","versions":[{"bill":"202110033990000","text":"關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模及性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n關鍵基礎設施提供者之資通安全維護計畫實施有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、修正條文第一項由現行條文第十六條第二項規定移列。符合特定資通安全責任等級之機關，應設置專人專職辦理資通安全業務之要求，宜由現行法規命令提昇至法律位階，爰予修正。\n二、修正條文第二項由現行條文第十六條第三項規定移列，內容未修正。\n三、修正條文第三項由現行條文第十六條第四項規定移列。另考量行政資源有效利用，擇定適當之關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第三項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n四、修正條文第四項由現行條文第十六條第五項規定移列，並酌作文字修正。\n五、為利資安署掌握全國資通安全現況，爰增訂第五項。"},{"bill":"201110061520000","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定特定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n特定關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n特定關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第一項。\n三、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠之資通環境，爰修正第二項。\n四、第三項配合修正條文第三條第八款用詞，酌作文字修正。\n五、考量行政資源有效利用，擇定適當之特定關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第四項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、第五項酌作文字修正。\n七、為利資安署掌握全國資通安全現況，爰增訂第六項。\n八、現行第六項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110067790000","text":"遇有重大資通安全事件，主管機關得逕予調度各級機關資通安全人員支援之，其調度支援及相關事項之辦法，由主管機關定之。","note":"一、本條新增。\n二、因資通安全人員之專業知能，與公務機關資通安全防護能量有密切關係，為強化並提升公務機關專職人員之職能，並採取類似一條鞭制度而明定重大資安事件，數發部得調度人員從事實體或線上支援與聯防之規定。\n三、本條之「調度」屬於行政程序法第十九條規定之「行政協助」，得於行政一體權限範圍內向無隸屬關係之其他機關請求協助、調動或支援處理重大資安事件之暫時人力安排，並非屬牽涉組織員額編制之人員調動。此外，數發部另可直接由其專業人員支援重大資安事件，例如數發部管轄之行政法人國家資通安全研究院，故明定之。"},{"bill":"202110071280000","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定特定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n特定關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n特定關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第一項。\n三、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠之資通環境，爰修正第二項。\n四、第三項配合修正條文第三條第八款用詞，酌作文字修正。\n五、考量行政資源有效利用，擇定適當之特定關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第四項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、第五項酌作文字修正。\n七、為利資安署掌握全國資通安全現況，爰增訂第六項。\n八、現行第六項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110071040000","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定特定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n特定關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n特定關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第一項。\n三、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠之資通環境，爰修正第二項。\n四、第三項配合修正條文第三條第八款用詞，酌作文字修正。\n五、考量行政資源有效利用，擇定適當之特定關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第四項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、第五項酌作文字修正。\n七、為利資安署掌握全國資通安全現況，爰增訂第六項。\n八、現行第六項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110073190000","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定特定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n特定關鍵基礎設施提供者符合其所屬資通安全責任等級之要求，設置資通安全專職人員，負責推動機關內資安相關事務，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n特定關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應定期綜合考量所管特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第一項。\n三、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠之資通環境，爰修正第二項。\n四、第三項配合修正條文第三條第八款用詞，酌作文字修正。\n五、考量行政資源有效利用，擇定適當之特定關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第四項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。第五項酌作文字修正。\n六、為利資安署掌握全國資通安全現況，爰增訂第六項。\n七、現行第六項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110074020000","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定特定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n特定關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告，送交中央目的事業主管機關。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第一項。\n三、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠之資通環境，爰修正第二項。\n四、第三項配合修正條文第三條第八款用詞，酌作文字修正。\n五、考量行政資源有效利用，擇定適當之特定關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第四項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、第五項酌作文字修正。\n七、為利資安署掌握全國資通安全現況，爰增訂第六項。\n八、現行第六項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110083660000","text":"中央目的事業主管機關應徵詢相關公務機關、民間團體、專家學者意見後，指定特定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n特定關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n特定關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第一項。\n三、考量資安 正；屆期未改正者，按次處新臺幣十萬元以上一百萬元以下罰鍰：\n一、未依第十六條之一第一項、第二項或第十七條第一項、第二項規定，訂定、修正或實施資通安全維護計畫，或違反第十七條之一所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第十六條之一第三項或第十七條第三項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第十七條之一所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第七條之一第二項、第十六條之一第五項或第十七條第四項規定，提出改善報告送交主管機關、中央目的事業主管機關，或違反第十七條之一所定辦法中有關改善報告提出之規定。\n四、未依第十八條第一項規定，訂定資通安全事件之通報及應變機制，或違反第十八條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第十八條第三項規定，向中央目的事業主管機關或主管機關提出資通安全事件之調查、處理及改善報告，或違反第十八條第四項所定辦法中有關報告提出之規定。\n六、違反第十八條第四項所定辦法中有關通報內容之規定。","note":"配合相關現行條文條次變更或內容修正，爰修正所引條次及內容。"},{"bill":"202110111210000","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定特定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n特定關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n特定關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第一項。\n三、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠之資通環境，爰修正第二項。\n四、第三項配合修正條文第三條第八款用詞，酌作文字修正。\n五、考量行政資源有效利用，擇定適當之特定關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第四項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、第五項酌作文字修正。\n七、為利資安署掌握全國資通安全現況，爰增訂第六項。\n八、現行第六項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110119960000","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣十萬元以上一百萬元以下罰鍰：\n一、未依第十六條之一第一項、第二項或第十七條第一項、第二項規定，訂定、修正或實施資通安全維護計畫，或違反第十七條之一所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第十六條之一第三項或第十七條第三項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第十七條之一所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第七條第三項、第十六條之一第五項或第十七條第四項規定，提出改善報告送交主管機關、中央目的事業主管機關，或違反第十七條之一所定辦法中有關改善報告提出之規定。\n四、未依第十八條第一項規定，訂定資通安全事件之通報及應變機制，或違反第十八條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第十八條第三項規定，向中央目的事業主管機關或主管機關提出資通安全事件之調查、處理及改善報告，或違反第十八條第四項所定辦法中有關報告提出之規定。\n六、違反第十八條第四項所定辦法中有關通報內容之規定。","note":"配合現行條文條次變更及內容修正，酌修文字。"},{"bill":"202110127080000","text":"中央目的事業主管機關應於徵詢相關公務機關、民 特定關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n特定關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列主管機關權責事項，自一百十一年八月二十七日起仍由行政院管轄，並配合現行實務作法，爰修正第一項。\n三、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠之資通環境，爰修正第二項。\n四、第三項配合修正條文第三條第八款用詞，酌作文字修正。\n五、考量行政資源有效利用，擇定適當之特定關鍵基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第四項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、第五項酌作文字修正。\n七、為利資安署掌握全國資通安全現況，爰增訂第六項。\n八、現行第六項移列修正條文第二十二條規定，爰予刪除。"}],"changed":true,"final":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定關鍵基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n關鍵基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n關鍵基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管關鍵基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n關鍵基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依指定之方式將稽核結果及改善報告送交主管機關。","finalWhy":"照行政院提案修正通過。,","review":{"note":"照台灣民眾黨黨團提案修正通過","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣十萬元以上五百萬元以下罰鍰：\n一、未依第二十條第二項或第二十一條第一項規定，訂定、修正或實施資通安全維護計畫，或違反第二十二條所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第二十條第三項或第二十一條第二項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第二十二條所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第八條第二項、第二十條第五項或第二十一條第三項規定，提出改善報告送交中央目的事業主管機關，或違反第二十二條所定辦法中有關改善報告提出之規定。\n四、未依第二十四條第一項規定，訂定資通安全事件之通報及應變機制，或違反第二十四條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第二十四條第三項規定，向中央目的事業主管機關提出或向主管機關送交資通安全事件之調查、處理及改善報告，或違反第二十四條第四項所定辦法中有關報告提出、送交之規定。\n六、違反第二十四條第四項所定辦法中有關通報內容、演練作業之規定。"}},{"no":"第二十一條","current":"關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n前三項之資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報請主管機關核定之。","versions":[{"bill":"202110033990000","text":"關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、修正條文第一項由現行條文第十七條第一項規定移列。符合特定資通安全責任等級之機關，應設置專人專職辦理資通安全業務之要求，宜由現行法規命令提昇至法律位階，爰予修正。\n三、第二項及第三項未修正。\n四、為利資安署掌握全國資通安全現況，爰增訂第四項。\n五、現行條文第四項移列修正條文第二十二條，爰予刪除。"},{"bill":"201110061520000","text":"特定關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者以外之特定非公務機關資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者以外之特定非公務機關，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠的資通環境，爰修正第一項。\n三、第二項及第三項未修正。\n四、為利資安署掌握全國資通安全現況，爰增訂第四項。\n五、現行第四項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110067790000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作。"},{"bill":"202110071280000","text":"特定關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者以外之特定非公務機關資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者以外之特定非公務機關，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠的資通環境，爰修正第一項。\n三、第二項及第三項未修正。\n四、為利資安署掌握全國資通安全現況，爰增訂第四項。\n五、現行第四項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110071040000","text":"關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送資安署。","note":"一、條次變更。\n二、修正條文第一項由現行條文第十七條第一項規定移列。符合特定資通安全責任等級之機關，應設置專人專職辦理資通安全業務之要求，宜由現行法規命令提昇至法律位階，爰予修正。\n三、第二項及第三項未修正。\n四、為利資安署掌握全國資通安全現況，爰增訂第四項。\n五、現行條文第四項移列至修正條文第二十二條，爰予刪除。"},{"bill":"202110073190000","text":"特定關鍵基礎設施提供者以外之特定非公務機關，應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。\n前項之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人力，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、資安事件頻傳，現今資通安全管理法針對特定非公務機關，並未要求設置資安長、資安專責人員，惟特定非公務機關，亦涉及民生、經濟、交通等周邊設施（備）資訊。為確保有效推動資通安全維護事項，應比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰新增、修正本條第一項、第二項規定。\n三、現行條文第二項、第三項文字未修正，並移列至第三項、第四項。\n四、為利資安署掌握全國資通安全現況，爰增訂第五項。\n五、現行第四項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110074020000","text":"特定關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者以外之特定非公務機關資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者以外之特定非公務機關，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠的資通環境，爰修正第一項。\n三、第二項及第三項未修正。\n四、為利資安署掌握全國資通安全現況，爰增訂第四項。\n五、現行第四項移列修正條文第二十二條規定，爰予刪除。"},{"bill":"202110083660000","text":"關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、修正條文第一項由現行條文第十七條第一項規定移列。符合特定資通安全責任等級之機關，應設置專人專職辦理資通安全業務之要求，宜由現行法規命令提昇至法律位階，爰予修正。\n三、第二項及第三項未修正。\n四、為利資安署掌握全國資通安全現況，爰增訂第四項。\n五、現行條文第四項移列修正條文第二十二條，爰予刪除。"},{"bill":"202110082760000","text":"特定關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與 通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依資安署指定之方式將稽核結果及改善報告送交資安署。","note":"一、條次變更。\n二、考量資安威脅日漸加劇，資安作業須持續維持，為強化特定關鍵基礎設施提供者以外之特定非公務機關資安防護量能並能及時應處，避免其他業務排擠資安業務量能造成事件擴散，需要投入相關成本，人力資源是其中重要一環，故符合特定資通安全責任等級之特定關鍵基礎設施提供者以外之特定非公務機關，應設置專人專職辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠的資通環境，爰修正第一項。\n三、第二項及第三項未修正。\n四、為利資安署掌握全國資通安全現況，爰增訂第四項。\n五、現行第四項移列修正條文第二十二條規定，爰予刪除。"}],"changed":true,"final":"關鍵基礎設施提供者以外之特定非公務機關，應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n中央目的事業主管機關得要求所管前項特定非公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依指定之方式將稽核結果及改善報告送交主管機關。","finalWhy":"照行政院提案修正通過。,","review":{"note":"照台灣民眾黨黨團提案通過","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上一千萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。"}},{"no":"第二十二條","current":"第六項\n第二項至第五項之資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報請主管機關核定之。\n第十七條第四項\n前三項之資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、內容與方法、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報請主管機關核定之。","versions":[{"bill":"202110033990000","text":"第二十條及前條之資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、擇定基準、程序與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行條文第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目。"},{"bill":"201110061520000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目及酌作文字修正。"},{"bill":"202110067790000","text":"中央目的事業主管機關應於徵詢相關公務機關、民間團體、專家學者之意見後，指定關鍵資通基礎設施提供者，送由主管機關報請行政院核定，並以書面通知受核定者。\n關鍵資通基礎設施提供者應符合其所屬資通安全責任等級之要求，設置資通安全專職人員，並考量其所保有或處理之資訊種類、數量、性質、資通系統之規模與性質等條件，訂定、修正及實施資通安全維護計畫。\n關鍵資通基礎設施提供者應向中央目的事業主管機關提出資通安全維護計畫實施情形。\n中央目的事業主管機關應綜合考量所管關鍵資通基礎設施提供者業務之重要性與機敏性、資通系統之規模、性質、資通安全事件發生之頻率、程度及其他與資通安全相關之因素，定期稽核其資通安全維護計畫之實施情形。\n關鍵資通基礎設施提供者之資通安全維護計畫實施情形有缺失或待改善者，應向中央目的事業主管機關提出改善報告。\n中央目的事業主管機關應依主管機關指定之方式將稽核結果及改善報告送交主管機關。","note":"一、條次變更。\n二、依行政院一百十一年八月二十四日院臺規字第一一一○一八四三○七號公告，第一項所列事項自一百十一年八月二十七日起仍由行政院管轄，爰修正第一項。\n三、考量資安威脅日益加劇，資安作業須持續維持，為強化關鍵資通基礎設施提供者之資安防護量能，並避免其他業務排擠資安業務量能，造成事件擴散，需要投入相關成本，尤其是人力資源，故符合特定資通安全責任等級之關鍵資通基礎設施提供者，應設置專職人員辦理資通安全業務，以落實事前、事中及事後各項資安作業，確保其具有安全可靠之資通環境，爰修正第二項。\n四、第三項配合修正條文第三條第八款之用詞，酌作文字修正。\n五、為使行政資源有效運用，應擇定適當之關鍵資通基礎設施提供者，稽核其資通安全維護計畫實施情形，爰於第四項增訂中央目的事業主管機關定期辦理稽核時應審酌之因素。\n六、第五項酌作文字修正。\n七、為利數發部掌握全國資通安全現況，爰增訂第六項。"},{"bill":"202110071280000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目及酌作文字修正。"},{"bill":"202110071040000","text":"前二條資通安全維護計畫必要事項、實施情形之提出、稽核之頻率、擇定基準、程序與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行條文第十六條第六項及第十七條第四項合併修正移列，修正文字並配合修正條文第二十條及第二十一條，增訂授權項目。"},{"bill":"202110073190000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目及酌作文字修正。"},{"bill":"202110074020000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目及酌作文字修正。"},{"bill":"202110083660000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行條文第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目及酌作文字修正。"},{"bill":"202110082760000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目及酌作文字修正。"},{"bill":"202110085470000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目及酌作文字修正。"},{"bill":"202110094940000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十條及第二十一條，增訂授權項目及酌作文字修正。"},{"bill":"202110097630000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內 公務機關，提出資通安全維護計畫實施情形。\n中央目的事業主管機關得稽核所管第一項特定非公務機關之資通安全維護計畫實施情形，發現有缺失或待改善者，應限期要求受稽核之特定非公務機關提出改善報告。\n中央目的事業主管機關應依主管機關指定之方式將稽核結果及改善報告送交主管機關。","note":"一、條次變更。\n二、修正條文第一項由現行條文第十七條第一項規定移列。符合特定資通安全責任等級之機關，應設置專人專職辦理資通安全業務之要求，宜由現行法規命令提昇至法律位階，爰予修正，以資明確。至於專職人員之管理與教育訓練，應視資通安全責任等級分級辦法之規定而定。\n三、第二項及第三項未修正。\n四、為利數發部掌握全國資通安全現況，爰增訂第四項。\n五、現行條文第四項移列修正條文第二十四條，爰予刪除。"},{"bill":"202110071280000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110071040000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作。"},{"bill":"202110073190000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報及應變機制之必要事項、通報內容、報告之提出、送交、資安演練與調度支援作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管或資安署知悉重大資通安全事件時，須提供相關協助；於適當時機並公告與事件相關之必要內容及因應措施，並得提供相關協助。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並且為確保各機關間調度權分配及支援計畫推展順利，增訂調度支援作業之辦法，共同聯防處理資安事件、解決資安問題，以達資源利用最大化之效。\n五、本項樣態既屬重大資安事件，中央目的事業主管或資安署知悉時，應主動介入關心、協助特定非公務機關應處，爰修正本項文字。"},{"bill":"202110074020000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110083660000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作。"},{"bill":"202110082760000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110085470000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110094940000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110097630000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110111210000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110127080000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110128370000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"},{"bill":"202110129110000","text":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","note":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。"}],"changed":true,"final":"特定非公務機關應置資通安全長，由特定非公務機關之代表人、管理人、其他有代表權人或其指派之適當人員擔任，負責推動及監督機關內資通安全相關事務。","finalWhy":"一、本條新增。\n二、為確保有效推動資通安全維護事項，比照公務機關規定，特定非公務機關應置資通安全長，由其成立相關推動組織及督導推動相關工作，爰為本條規定。為增進資通安全專業知能，特定非公務機關之資通安全長，應定期參加主管機關舉辦之資通安全長共識營等相關課程。","review":{"note":"照行政院提案通過","text":"本法施行日期，由行政院定之。"}},{"no":"第二十四條","current":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交主管機關。\n前三項通報及應變機制之必要事項、通報內容、報告之提出及其他應遵行事項之辦法，由主管機關定之。\n知悉重大資通安全事件時，主管機關或中央目的事業主管機關於適當時機得公告與事件相關之必要內容及因應措施，並得提供相關協助。","versions":[{"bill":"202110033990000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供特定非公務機關相關協助，並於適當時機得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"201110061520000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110067790000","text":"前二條資通安全維護計畫之必要事項、實施情形之提出、稽核之頻率、內容與方法、結果之交付、改善報告之提出及其他應遵行事項之辦法，由中央目的事業主管機關擬訂，報由主管機關核定。","note":"本條由現行條文第十六條第六項及第十七條第四項合併修正移列，並配合修正條文第二十二條及第二十三條，增訂授權項目及酌作文字修正。"},{"bill":"202110071280000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110071040000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報及應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供特定非公務機關相關協助，並於適當時機得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110073190000","text":"中央目的事業主管機關為調查特定非公務機關發生重大資通安全事件，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以該項特定非公務機關委託辦理資通系統之建置、維運或資通服務提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項，賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰規定第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，於第三項增訂受調查者對中央目的事業主管機關所為調查措施，不得規避、妨礙或拒絕，並於第四項規定中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰規定第五項受委任或委託機關（構）之保密義務。"},{"bill":"202110074020000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施，並得提供相關協助。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110083660000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供特定非公務機關相關協助，並於適當時機得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110082760000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110085470000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110094940000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，應提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。\n五、為強化重大資通安全事件之因應，爰於第五項明定中央目的事業主管機關或資安署知悉重大資通安全事件時，應提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。"},{"bill":"202110097630000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110111210000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，應提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110127080000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"},{"bill":"202110128370000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。\n五、為加強重大資通安全事件之因應，爰於第五項明定中央目的事業主管機關或資安署知悉重大資通安全事件時，應提供相關協助。"},{"bill":"202110129110000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交資安署。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或資安署知悉重大資通安全事件時，得提供相關協助；於適當時機並得公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、配合修正條文第二條第二項規定，將第三項及第五項所定主管機關修正為資安署，並酌作文字修正。\n四、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。"}],"changed":true,"final":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交主管機關。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或主管機關知悉重大資通安全事件時，應提供必要之協助；於適當時機並得公告與事件相關之必要內容及因應措施。","finalWhy":"照委員修正動議修正通過。,","review":null},{"no":"第二十五條","current":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交主管機關。\n前三項通報及應變機制之必要事項、通報內容、報告之提出及其他應遵行事項之辦法，由主管機關定之。\n知悉重大資通安全事件時，主管機關或中央目的事業主管機關於適當時機得公告與事件相關之必要內容及因應措施，並得提供相關協助。","versions":[{"bill":"202110033990000","text":"中央目的事業主管機關為辦理特定非公務機關發生重大資通安全事件之調查，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以第一項特定非公務機關委託辦理資通系統之建置、維運或資通服務之提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰增訂第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，爰於第三項增訂受調查者對主管機關所為調查措施，無正當理由不得規避、妨礙或拒絕，並於第四項增訂中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰增訂第五項受委任或委託機關（構）之保密義務。"},{"bill":"201110061520000","text":"中央目的事業主管機關為調查特定非公務機關發生重大資通安全事件，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以該項特定非公務機關委託辦理資通系統之建置、維運或資通服務提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項，賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰規定第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，於第三項增訂受調查者對中央目的事業主管機關所為調查措施，不得規避、妨礙或拒絕，並於第四項規定中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰規定第五項受委任或委託機關（構）之保密義務。"},{"bill":"202110067790000","text":"特定非公務機關為因應資通安全事件，應訂定通報及應變機制。\n特定非公務機關於知悉資通安全事件時，應向中央目的事業主管機關通報。\n特定非公務機關應向中央目的事業主管機關提出資通安全事件調查、處理及改善報告；如為重大資通安全事件者，並應送交主管機關。\n前三項通報與應變機制之必要事項、通報內容、報告之提出、送交、演練作業及其他應遵行事項之辦法，由主管機關定之。\n中央目的事業主管機關或主管機關知悉重大資通安全事件時，應提供特定非公務機關相關協助，並得於適當時機公告與事件相關之必要內容及因應措施。","note":"一、條次變更。\n二、第一項至第三項未修正。\n三、為增進特定非公務機關因應資通安全事件之處理能力，於第四項之授權項目增訂演練作業，並酌作文字修正。\n四、第五項新增中央目的事業主管機關或主管機關知悉重大資通安全事件時，應提供特定非公務機關相關協助。"},{"bill":"202110071280000","text":"中央目的事業主管機關為調查特定非公務機關發生重大資通安全事件，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以該項特定非公務機關委託辦理資通系統之建置、維運或資通服務提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項，賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰規定第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，於第三項增訂受調查者對中央目的事業主管機關所為調查措施，不得規避、妨礙或拒絕，並於第四項規定中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰規定第五項受委任或委託機關（構）之保密義務。"},{"bill":"202110071040000","text":"中央目的事業主管機關為辦理特定非公務機關發生重大資通安全事件之調查，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以第一項特定非公務機關委託辦理資通系統之建置、維運或資通服務之提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰增訂第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，爰於第三項增訂受調查者對主管機關所為調查措施，無正當理由不得規避、妨礙或拒絕，並於第四項增訂中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰增訂第五項受委任或委託機關（構）之保密義務。"},{"bill":"202110073190000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110074020000","text":"中央目的事業主管機關為調查特定非公務機關發生重大資通安全事件，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關構前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以該項特定非公務機關委託辦理資通系統之建置、維運或資通服務提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰規定第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，於第三項增訂受調查者對中央目的事業主管機關所為調查措施，不得規避、妨礙或拒絕，並於第四項規定中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰規定第五項受委任或委託機關（構）之保密義務。"},{"bill":"202110083660000","text":"中央目的事業主管機關為辦理特定非公務機關發生重大資通安全事件之調查，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以第一項特定非公務機關委託辦理資通系統之建置、維運或資通服務提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰增訂第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，爰於第三項增訂受調查者對主管機關所為調查措施，無正當理由不得規避、妨礙或拒絕，並於第四項增訂中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰增訂第五項受委任或委託機關（構）之保密義務。"},{"bill":"202110082760000","text":"公務機關及特定非公務機關未依本法規定落實資通安全管理措施，經主管機關稽核後仍未改正者，主管機關得依情節輕重予以處分。\n處分方式包括但不限於警告、罰款，及公佈違規單位名稱等；若違規情節重大，主管機關得將其列入考核並追究相關責任人之管理責任。","note":"一、本條新增。\n二、為確保各機關切實遵循本法規範，未按要求落實資通安全管理措施者，主管機關得依情節輕重予以處分，以促進資通安全規範之有效執行。\n三、針對違規情節重大之情形，主管機關得將違規機關列入考核，並追究相關責任人之管理責任，以強化對資通安全管理不善者之懲戒效果，確保全體機關的資通安全管理能力。"},{"bill":"202110085470000","text":"中央目的事 、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以該項特定非公務機關委託辦理資通系統之建置、維運或資通服務提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項，賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰規定第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，於第三項增訂受調查者對中央目的事業主管機關所為調查措施，不得規避、妨礙或拒絕，並於第四項規定中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰規定第五項受委任或委託機關（構）之保密義務。"}],"changed":true,"final":"中央目的事業主管機關為調查特定非公務機關發生之重大資通安全事件，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以該項特定非公務機關委託辦理資通系統之建置、維運或資通服務提供之受託者，且與重大資通安全事件相關者為限。\n當事人或關係人對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。","finalWhy":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項，賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰規定第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，於第三項增訂當事人或關係人對中央目的事業主管機關所為調查措施，不得規避、妨礙或拒絕，並於第四項規定中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰規定第五項受委任或委託機關（構）之保密義務。","review":{"note":"不予採納","text":""}},{"no":"第二十六條","current":null,"versions":[{"bill":"202110033990000","text":"特定非公務機關不得採購及使用危害國家資通安全產品，亦不得採購及使用大陸地區、香港、澳門、境外敵對勢力或其所設立或實質控制之各類組織、機構、團體或人員提供之資通服務、系統及設備；其自行或委外營運，提供公眾活動或使用之場地，亦同。但因業務需求且無其他替代方案者，經機關資通安全長核可，函報主管機關核定後，得以專案方式購置，並列冊管理。\n特定非公務人員獲配之業務用資通訊設備，不得下載、安裝或使用危害國家資通安全產品，亦不得下載、安裝或使用大陸地區、香港、澳門、境外敵對勢力或其所設立或實質控制之各類組織、機構、團體或人員提供之資通服務及資通系統，並應遵守相關法令規範。\n特定非公務機關得向主管機關查詢第一項產品及其廠商。","note":"一、本條新增。\n二、特定非公務機關之業務涉及民生與國家安全，因此比照公務機關使用及採購資通安全產品的規範。\n三、境外敵對勢力由反滲透法第二條第一項定義之。\n四、實質控制或類似用語之直接或間接控制，不論其文義或於前述法律規定之規範意旨，均在彰顯控制者與被控制者間存有支配、管領或從屬之密切關係；且實質控制亦係根據人事、財務或業務經營等面向為判斷。可參考大法官釋字第793號理由書。"},{"bill":"201110061520000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110067790000","text":"中央目的事業主管機關為調查特定非公務機關發生之重大資通安全事件，得依下列程序辦理：\n一、通知當事人或關係人到場陳述意見。\n二、通知當事人及關係人提出獨立第三方機構出具之鑑識或調查報告。\n三、派員、委任或委託其他機關（構）前往當事人及關係人之處所實施必要之檢查。\n前項所定關係人，以該項特定非公務機關委託辦理資通系統之建置、維運或資通服務提供之受託者，且與重大資通安全事件相關者為限。\n受調查者對於中央目的事業主管機關依第一項所為之調查，不得規避、妨礙或拒絕。\n執行調查之人員應出示有關執行職務之證明文件；其未出示者，受調查者得拒絕之。\n第一項第三款受委任或委託之機關（構）對於辦理受任或受託事務所獲悉特定非公務機關之秘密，不得洩漏。\n中央目的事業主管機關為調查特定非公務機關發生之重大資通安全事件，請求主管機關協助時，主管機關應提供其所需求之相關協助。","note":"一、本條新增。\n二、為落實特定非公務機關資通安全之維護，強化中央目的事業主管機關之監督權責，爰規定第一項，賦予中央目的事業主管機關對於重大資通安全事件之調查權。\n三、為符合法律明確性原則，定明應受調查之關係人範圍，爰增訂第二項。\n四、配合第一項規定中央目的事業主管機關對特定非公務機關重大資通安全事件之調查權責，爰於第三項增訂受調查者對主管機關所為調查措施，不得規避、妨礙或拒絕，並於第四項增訂中央目的事業主管機關執行調查時應出示證明文件之程序。\n五、為避免特定非公務機關之秘密，因重大資通安全事件之調查而洩漏，爰增訂第五項受委任或委託機關（構）之保密義務。\n六、增訂第六項關於行政調查方面，課予數發部有提供行政指導或事實行為之協力義務，以協助及因應中央目的事業主管機就重大資通安全事件所面臨之困境。"},{"bill":"202110071280000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110071040000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110073190000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110074020000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110083660000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110082760000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110085470000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110094940000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110097630000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110111210000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110127080000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110128370000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"},{"bill":"202110129110000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。"}],"changed":true,"final":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","finalWhy":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰為本條規定。","review":{"note":"照行政院提案通過","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。"}},{"no":"第二十七條","current":"公務機關所屬人員未遵守本法規定者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。","versions":[{"bill":"202110033990000","text":"公務機關所屬人員未遵守本法規定者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。","note":"條次變更，內容未修正。"},{"bill":"201110061520000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110067790000","text":"特定非公務機關對於所屬人員辦理資通安全業務績效優良者，應予獎勵。","note":"一、本條新增。\n二、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，該等人員於踐行本法要求事項績效優良時，應予獎勵，爰新增本條規定。"},{"bill":"202110071280000","text":"中央目的事業主管機關對特定非公務機關採購、下載、安裝或使用危害國家資通安全產品，或採購及使用陸資廠商或大陸地區、香港、澳門、境外敵對勢力或其所設立或實質控制之各類組織、機構、團體或人員提供之資通服務、系統及設備，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關採購、下載、安裝或使用危害國家資通安全產品，或採購及使用陸資廠商或大陸地區、香港、澳門、境外敵對勢力或其所設立或實質控制之各類組織、機構、團體或人員提供之資通服務、系統及設備，得予以限制或禁止之規定。"},{"bill":"202110071040000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110073190000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項未修正。\n四、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，比照公務機關所屬人員規定，對未依本法規定辦理，情節重大者，定明由特定非公務機關予以懲處，爰增訂第三項。"},{"bill":"202110074020000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110083660000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家安全之資通安全產品，或下載、安裝或採購及使用依國家安全法第二條規定之大陸地區、香港、澳門、境外敵對勢力及其所設立或實質控制之各類組織、機構、團體或其派遣之人提供之資通安全服務及產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家安全之資通安全產品、依國家安全法第二條規定之大陸地區、香港、澳門、境外敵對勢力及其所設立或實質控制之各類組織、機構、團體或其派遣之人提供之資通安全服務及產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110082760000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110085470000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110094940000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理及遵守下列規定：\n一、應指定特定區域及特定人員使用，且不得傳播影像或聲音，供不特定人士直接收視或收聽。\n二、購置理由消失，或使用年限屆滿應立即銷毀。\n三、其他中央目的事業主管機關指定事項。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110097630000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110111210000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所提供公眾視聽或使用之傳播設備及網際網路接取服務，於維護資通安全之必要時，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十一條規定將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之 施情形，或違反第十六條第六項或第十七條第四項所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第七條第三項、第十六條第五項或第十七條第三項規定，提出改善報告送交主管機關、中央目的事業主管機關，或違反第十六條第六項或第十七條第四項所定辦法中有關改善報告提出之規定。\n四、未依第十八條第一項規定，訂定資通安全事件之通報及應變機制，或違反第十八條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第十八條第三項規定，向中央目的事業主管機關或主管機關提出資通安全事件之調查、處理及改善報告，或違反第十八條第四項所定辦法中有關報告提出之規定。\n六、違反第十八條第四項所定辦法中有關通報內容之規定。","versions":[{"bill":"202110033990000","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣十萬元以上一百萬元以下罰鍰：\n一、未依第二十條第一項或第二十一條第一項規定，訂定、修正或實施資通安全維護計畫，或違反第二十二條所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第二十條第二項或第二十一條第二項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第二十二條所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第八條第二項、第二十條第四項或第二十一條第三項規定，提出改善報告送交資安署、中央目的事業主管機關，或違反第二十二條所定辦法中有關改善報告提出之規定。\n四、未依第二十四條第一項規定，訂定資通安全事件之通報及應變機制，或違反第二十四條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第二十四條第三項規定，向中央目的事業主管機關提出或向資安署送交資通安全事件之調查、處理及改善報告，或違反第二十四條第四項所定辦法中有關報告提出、送交之規定。\n六、違反第二十四條第四項所定辦法中有關通報內容、演練作業之規定。\n七、違反第二十六條第一項有關使用採購資通服務、資通系統及資通設備之規定。","note":"一、條次變更。\n二、配合相關現行條條次變更或內容修正，爰修正所引條次及內容。\n三、新增第七項以配合第二十六條之規定。"},{"bill":"201110061520000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項未修正。\n四、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，比照公務機關所屬人員規定，對未依本法規定辦理，情節重大者，定明由特定非公務機關予以懲處，爰增訂第三項。"},{"bill":"202110067790000","text":"中央目的事業主管機關對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止；特定非公務機關自行或委外營運場所，亦同。但因業務需求且無其他替代方案者，經該特定非公務機關資通安全長核可，函報中央目的事業主管機關核定後，得以專案方式使用，並列冊管理。\n前項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施，由中央目的事業主管機關訂定，報主管機關備查。","note":"一、本條新增。\n二、配合修正條文第十三條之規定，將危害國家資通安全產品限制使用之事項提升以法律位階規範，增訂中央目的事業主管機關為維護國家資通安全，對特定非公務機關下載、安裝或使用危害國家資通安全產品，得予以限制或禁止之規定。"},{"bill":"202110071280000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項未修正。\n四、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，比照公務機關所屬人員規定，對未依本法規定辦理，情節重大者，定明由特定非公務機關予以懲處，爰增訂第三項。"},{"bill":"202110071040000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關予以懲處，其由目的事業主管機關或主管機關查明者，應將懲處內容報目的事業主管機關備查。","note":"一、條次變更。\n二、為因應本次修正條文增加對非公務機關資安管理之要求，增訂非公務機關人員未依本法相關規定辦理資通安全業務懲處之規定。"},{"bill":"202110073190000","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣二十萬元以上一百萬元以下罰鍰：\n一、未依第二十條第二項或第二十一條第一項、第二項規定，設置資通安全長及資安專職人員之規定。\n二、未依第二十條第二項或第二十一條第二項規定，訂定、修正或實施資通安全維護計畫，或違反第二十二條所定辦法有關資通安全維護計畫必要事項之規定。\n三、未依第二十條第三項或第二十一條第二項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第二十二條所定辦法中有關資通安全維護計畫實施情形提出之規定。\n四、未依第八條第二項、第二十條第五項或第二十一條第三項規定，提出改善報告送交中央目的事業主管機關或違反第二十二條所定辦法中有關改善報告提出之規定。\n五、未依第二十三條第一項規定，訂定資通安全事件之通報及應變機制，或違反第二十三條第四項所定辦法中有關通報及應變機制必要事項之規定。\n六、未依第二十三條第三項規定，向中央目的事業主管機關提出或向資安署送交資通安全事件之調查、處理及改善報告，或違反第二十三條第四項所定辦法中有關報告提出、送交之規定。\n七、違反第二十三條第四項所定辦法中有關通報內容、資安演練與調度支援作業之規定。","note":"一、條次變更。\n二、依前條修正，爰增列本條第一款，將未依第十六條第二項、第十七條第一項設置資安長、資安專職人員之規定，可依本法令其改正；屆期未改正者得按次處二十萬元以上一百萬元以下之罰鍰。\n三、因應條文修正，各條項次文字依序修正。"},{"bill":"202110074020000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項未修正。\n四、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，比照公務機關所屬人員規定，對未依本法規定辦理，情節重大者，定明由特定非公務機關予以懲處，爰增訂第三項。"},{"bill":"202110083660000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項未修正。\n四、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，比照公務機關所屬人員規定，對未依本法規定辦理，情節重大者，定明由特定非公務機關予以懲處，爰增訂第三項。"},{"bill":"202110082760000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項未修正。\n四、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，比照公務機關所屬人員規定，對未依本法規定辦理，情節重大者，定明由特定非公務機關予以懲處，爰增訂第三項。"},{"bill":"202110085470000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、第二項未修正。\n四、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，比照公務機關所屬人員規定，對未依本法規定辦理，情節重大者，定明由特定非公務機關予以懲處，爰增訂第三項。"},{"bill":"202110094940000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理，情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更。\n二、第一 爰修正所引條次。\n三、新增內文以配合第二十六條之規定。"},{"bill":"201110061520000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"},{"bill":"202110067790000","text":"公務機關所屬人員未依本法規定辦理者，應按其情節輕重，依相關規定予以懲戒或懲處。\n前項懲處事項之辦法，由主管機關定之。\n特定非公務機關所屬人員未依本法規定辦理且情節重大者，由特定非公務機關依規定予以懲處。","note":"一、條次變更，第一項酌作文字修正。\n二、第二項內容未修正。\n三、為促進特定非公務機關所屬人員對於資通安全工作之重視與投入，比照公務機關所屬人員規定，對未依本法規定辦理且情節重大者，定明由特定非公務機關予以懲處，爰增訂第三項。"},{"bill":"202110071280000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"},{"bill":"202110071040000","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣十萬元以上一百萬元以下罰鍰：\n一、未依第二十條第二項或第二十一條第一項規定，訂定、修正或實施資通安全維護計畫，或違反第二十二條所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第二十條第三項或第二十一條第二項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第二十二條所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第八條第二項、第二十條第五項或第二十一條第三項規定，提出改善報告送交資安署、中央目的事業主管機關，或違反第二十二條所定辦法中有關改善報告提出之規定。\n四、未依第二十四條第一項規定，訂定資通安全事件之通報及應變機制，或違反第二十四條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第二十四條第三項規定，向中央目的事業主管機關或資安署提交資通安全事件之調查、處理及改善報告，或違反第二十四條第四項所定辦法中有關報告提出、送交之規定。\n六、違反第二十四條第四項所定辦法中有關通報內容、演練作業之規定。","note":"一、條次變更。\n二、配合相關現行條文條次變更或內容修正，爰修正所引條次及內容。"},{"bill":"202110073190000","text":"特定非公務機關未依第二十三條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條條次變更，修正所引條次。"},{"bill":"202110074020000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"},{"bill":"202110083660000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行條文條次變更爰修正所引條次。"},{"bill":"202110082760000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"},{"bill":"202110085470000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"},{"bill":"202110094940000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上一千萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次，並針對特定非公務機關未依第二十四條第二項規定，通報資通安全事件，提高罰則，以強化資通安全守護。"},{"bill":"202110097630000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"},{"bill":"202110111210000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"},{"bill":"202110127080000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"},{"bill":"202110128370000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上一千萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。\n三、為強化資通安全之應變效率，爰針對特定非公務機關未依第二十四條第二項規定，通報資通安全事件者，提高罰則。"},{"bill":"202110129110000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行第十八條之條次變更，修正所引條次。"}],"changed":true,"final":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上一千萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","finalWhy":"一、條次變更。\n二、配合原第十八條之條次變更，修正所引條次，並針對特定非公務機關未依第二十四條第二項規定，通報資通安全事件，提高罰則，以強化資通安全守護。","review":null},{"no":"第三十條","current":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣十萬元以上一百萬元以下罰鍰：\n一、未依第十六條第二項或第十七條第一項規定，訂定、修正或實施資通安全維護計畫，或違反第十六條第六項或第十七條第四項所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第十六條第三項或第十七條第二項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第十六條第六項或第十七條第四項所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第七條第三項、第十六條第五項或第十七條第三項規定，提出改善報告送交主管機關、中央目的事業主管機關，或違反第十六條第六項或第十七條第四項所定辦法中有關改善報告提出之規定。\n四、未依第十八條第一項規定，訂定資通安全事件之通報及應變機制，或違反第十八條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第十八條第三項規定，向中央目的事業主管機關或主管機關提出資通安全事件之調查、處理及改善報告，或違反第十八條第四項所定辦法中有關報告提出之規定。\n六、違反第十八條第四項所定辦法中有關通報內容之規定。","versions":[{"bill":"202110033990000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"201110061520000","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣十萬元以上一百萬元以下罰鍰：\n一、未依第二十條第二項或第二十一條第一項規定，訂定、修正或實施資通安全維護計畫，或違反第二十二條所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第二十條第三項或第二十一條第二項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第二十二條所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第八條第二項、第二十條第五項或第二十一條第三項規定，提出改善報告送交中央目的事業主管機關，或違反第二十二條所定辦法中有關改善報告提出之規定。\n四、未依第二十四條第一項規定，訂定資通安全事件之通報及應變機制，或違反第二十四條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第二十四條第三項規定，向中央目的事業主管機關提出或向資安署送交資通安全事件之調查、處理及改善報告，或違反第二十四條第四項所定辦法中有關報告提出、送交之規定。\n六、違反第二十四條第四項所定辦法中有關通報內容、演練作業之規定。","note":"一、條次變更。\n二、配合相關現行條文條次變更或內容修正，修正所引條次及內容。"},{"bill":"202110067790000","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣十萬元以上一百萬元以下罰鍰：\n一、未依第二十二條第二項或第二十三條第一項規定，訂定、修正或實施資通安全維護計畫，或違反第二十四條所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第二十二條第三項或第二十三條第二項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第二十四條所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第八條第二項、第二十二條第五項或第二十三條第三項規定，提出改善報告送交主管機關、中央目的事業主管機關，或違反第二十四條所定辦法中有關改善報告提出之規定。\n四、未依第二十五條第一項規定，訂定資通安全事件之通報及應變機制，或違反第二十五條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第二十五條第三項規定，向中央目的事業主管機關提出或向主管機關送交資通安全事件之調查、處理及改善報告，或違反第二十五條第四項所定辦法中有關報告提出、送交之規定。\n六、違反第二十五條第四項所定辦法中有關通報內容、演練作業之規定。","note":"一、條次變更。\n二、配合相關現行條文條次變更或內容修正，爰修正所引條次及內容。"},{"bill":"202110071280000","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆期未改正者，按次處新臺幣十萬元以上一百萬元以下罰鍰：\n一、未依第二十條第二項或第二十一條第一項規定，訂定、修正或實施資通安全維護計畫，或違反第二十二條所定辦法中有關資通安全維護計畫必要事項之規定。\n二、未依第二十條第三項或第二十一條第二項規定，向中央目的事業主管機關提出資通安全維護計畫之實施情形，或違反第二十二條所定辦法中有關資通安全維護計畫實施情形提出之規定。\n三、未依第八條第二項、第二十條第五項或第二十一條第三項規定，提出改善報告送交中央目的事業主管機關，或違反第二十二條所定辦法中有關改善報告提出之規定。\n四、未依第二十四條第一項規定，訂定資通安全事件之通報及應變機制，或違反第二十四條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第二十四條第三項規定，向中央目的事業主管機關提出或向資安署送交資通安全事件之調查、處理及改善報告，或違反第二十四條第四項所定辦法中有關報告提出、送交之規定。\n六、違反第二十四條第四項所定辦法中有關通報內容、演練作業之規定。\n七、違反第二十七條第二項對特定非公務機關限制或禁止使用危害國家資通安全產品之管控措施。","note":"一、條次變更。\n二、配合相關現行條文條次變更或內容修正，修正所引條次及內容。"},{"bill":"202110071040000","text":"特定非公務機關未依第二十四條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行條文條次變更爰修正所引條次。"},{"bill":"202110073190000","text":"違反第二十四條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"本條新增。配合修正條文第二十四條第三項，增訂處罰規定。"},{"bill":"202110074020000","text":"特定非公務機關有下列情形之一者，由中央目的事業主管機關令限期改正；屆 告送交中央目的事業主管機關，或違反第二十二條所定辦法中有關改善報告提出之規定。\n四、未依第二十四條第一項規定，訂定資通安全事件之通報及應變機制，或違反第二十四條第四項所定辦法中有關通報及應變機制必要事項之規定。\n五、未依第二十四條第三項規定，向中央目的事業主管機關提出或向主管機關送交資通安全事件之調查、處理及改善報告，或違反第二十四條第四項所定辦法中有關報告提出、送交之規定。\n六、違反第二十四條第四項所定辦法中有關通報內容、演練作業之規定。","finalWhy":"照台灣民眾黨黨團提案修正通過。,","review":null},{"no":"第三十一條","current":"主管機關得委任或委託其他公務機關、法人或團體，辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n前項被委託之公務機關、法人或團體或被複委託者，不得洩露在執行或辦理相關事務過程中所獲悉關鍵基礎設施提供者之秘密。","versions":[{"bill":"202110033990000","text":"主管機關為辦理資通安全整體防護、國際交流合作及其他資通安全相關事務，得委託所監督行政法人、其他公務機關、法人或團體為之。\n資安署為辦理國家資通安全防護、演練、稽核及其他資通安全相關事務，得委託其他公務機關、法人或團體為之。\n公務機關為辦理第十五條第一項、第二十條第三項之稽核事項，得委任所屬機關或委託其他公務機關、法人或團體為之。\n前三項受委任、委託或複委託之公務機關、法人或團體，不得洩露辦理相關事務過程中所知悉之秘密。","note":"一、條次變更。\n二、第一項酌作文字正。\n三、配合修正條文第二條第二項規定，爰增訂第二項定明資安署得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n四、增訂第三項，定明公務機關為辦理第十五條第一項、第二十條第三項公務機關稽核作業，得委任或委託辦理之依據。\n五、第二項規定移列為修正條文第四項，並考量受委任、委託或複委託者就執行或辦理相關事務過程中所獲悉之秘密，除有正當理由外，均有保密之義務，不限於關鍵基礎設施提供者之秘密，爰刪除「關鍵基礎設施提供者」等字，並酌作文字修正。"},{"bill":"201110061520000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110067790000","text":"特定非公務機關未依第二十五條第二項規定，通報資通安全事件，由中央目的事業主管機關處新臺幣三十萬元以上五百萬元以下罰鍰，並令限期改正；屆期未改正者，按次處罰之。","note":"一、條次變更。\n二、配合現行條文條次變更爰修正所引條次。"},{"bill":"202110071280000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110071040000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110073190000","text":"主管機關得委託其他公務機關辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n資安署得委託其他公務機關辦理國家資通安全防護、演練、稽核及其他資通安全相關事務。\n前二項受委託之公務機關，不得洩露辦理相關事務過程中所知悉之秘密。\n特定非公務機關之業務涉及數個中央目的事業主管機關之權責，主管機關得協調指定其中一個或數個中央目的事業主管機關，單獨或共同辦理本法所定中央目的事業主管機關應辦理之事項。","note":"一、條次變更。\n二、考量現行實務運作，未將權限移轉委任所屬機關或委託法人或團體，爰修正第一項。\n三、配合修正條文第二條第二項規定，增訂第二項，定明資安署得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n四、考量公權力之委託並無複委託情事，及受委託者就執行或辦理相關事務過程中所知悉之秘密，除有正當理由外，應有保密之義務，不以關鍵基礎設施提供者之秘密為限，爰將現行第二項移列為第三項，並酌作文字修正。\n五、考量特定非公務機關之業務性質可能涉及數個中央目的事業主管機關之權責，為避免該等機關就本法所定事項權責不清，須有解決之機制，爰增訂第四項，將本法施行細則第十二條規定提升至本法規定，並酌作修正。"},{"bill":"202110074020000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110083660000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110082760000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110085470000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110094940000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110097630000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110111210000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110127080000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110128370000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"},{"bill":"202110129110000","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。"}],"changed":true,"final":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","finalWhy":"一、本條新增。\n二、配合修正條文第二十五條第三項，增訂違反者之處罰規定。","review":{"note":"照行政院提案通過","text":"違反第二十五條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。"}},{"no":"第三十二條","current":"主管機關得委任或委託其他公務機關、法人或團體，辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n前項被委託之公務機關、法人或團體或被複委託者，不得洩露在執行或辦理相關事務過程中所獲悉關鍵基礎設施提供者之秘密。","versions":[{"bill":"202110033990000","text":"本法所定資通安全事件，涉及個人資料檔案外洩時，公務機關及特定非公務機關應另依個人資料保護法及其相關法令規定辦理。","note":"一、本條新增。\n二、資通安全管理法係要求納管之公務機關及特定非公務機關訂定「資通安全維護」計畫並依計畫實施相關資通安全管理事項、訂定資通安全事件之通報及應變機制、通報資通安全事件等，均係屬資通安全維護義務，與個人資料保護法係要求保有個人資料檔案者應採行適當之安全措施、訂定「個人資料檔案安全維護」計畫或業務終止後個人資料處理方法等，兩者之構成要件不同，並無普通法及特別法之關係，有予以明辨之必要，爰增訂本條。"},{"bill":"201110061520000","text":"主管機關得委託其他公務機關辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n資安署得委託其他公務機關辦理國家資通安全防護、演練、稽核及其他資通安全相關事務。\n前二項受委託之公務機關，不得洩露辦理相關事務過程中所知悉之秘密。\n特定非公務機關之業務涉及數個中央目的事業主管機關之權責，主管機關得協調指定其中一個或數個中央目的事業主管機關，單獨或共同辦理本法所定中央目的事業主管機關應辦理之事項。","note":"一、條次變更。\n二、考量現行實務運作，未將權限移轉委任所屬機關或委託法人或團體，爰修正第一項。\n三、配合修正條文第二條第二項規定，增訂第二項，定明資安署得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n四、考量公權力之委託並無複委託情事，及受委託者就執行或辦理相關事務過程中所知悉之秘密，除有正當理由外，應有保密之義務，不以關鍵基礎設施提供者之秘密為限，爰將現行第二項移列為第三項，並酌作文字修正。\n五、考量特定非公務機關之業務性質可能涉及數個中央目的事業主管機關之權責，為避免該等機關就本法所定事項權責不清，須有解決之機制，爰增訂第四項，將本法施行細則第十二條規定提升至本法規定，並酌作修正。"},{"bill":"202110067790000","text":"違反第二十六條第三項規定，規避、妨礙或拒絕調查者，由中央目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、本條新增。\n二、配合修正條文第二十六條第三項，增訂違反者之處罰規定。"},{"bill":"202110071280000","text":"主管機關得委託其他公務機關辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n資安署得委託其他公務機關辦理國家資通安全防護、演練、稽核及其他資通安全相關事務。\n前二項受委託之公務機關，不得洩露辦理相關事務過程中所知悉之秘密。\n特定非公務機關之業務涉及數個中央目的事業主管機關之權責，主管機關得協調指定其中一個或數個中央目的事業主管機關，單獨或共同辦理本法所定中央目的事業主管機關應辦理之事項。","note":"一、條次變更。\n二、考量現行實務運作，未將權限移轉委任所屬機關或委託法人或團體，爰修正第一項。\n三、配合修正條文第二條第二項規定，增訂第二項，定明資安署得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n四、考量公權力之委託並無複委託情事，及受委託者就執行或辦理相關事務過程中所知悉之秘密，除有正當理由外，應有保密之義務，不以關鍵基礎設施提供者之秘密為限，爰將現行第二項移列為第三項，並酌作文字修正。\n五、考量特定非公務機關之業務性質可能涉及數個中央目的事業主管機關之權責，為避免該等機關就本法所定事項權責不清，須有解決之機制，爰增訂第四項，將本法施行細則第十二條規定提升至本法規定，並酌作修正。"},{"bill":"202110071040000","text":"主管機關為辦理資通安全整體防護、國際交流合作及其他資通安全相關事務，得委託所監督行政法人、其他公務機關、法人或團體為之。\n資安署為辦理國家資通安全防護、演練、稽核及其他資通安全相關事務，得委託其他公務機關、法人或團體為之。\n公務機關為辦理第十五條第一項、第二十條第三項之稽核事項，得委任所屬機關或委託其他公務機關、法人或團體為之。\n前三項受委任、委託或複委託之公務機關、法人或團體，不得洩露辦理相關事務過程中所知悉之秘密。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、配合修正條文第二條第二項規定，爰增訂第二項定明資安署得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n四、增訂第三項，定明公務機關為辦理第十五條第一項、第二十條第三項公務機關稽核作業，得委任或委託辦理之依據。\n五、第二項規定移列為修正條文第四項，並考量受委任、委託或複委託者就執行或辦理相關事務過程中所獲悉之秘密，除有正當理由外，均有保密之義務，不限於關鍵基礎設施提供者之秘密，爰刪除「關鍵基礎設施提供者」等字，並酌作文字修正。"},{"bill":"202110073190000","text":"本法所定資通安全事件，涉及個人資料外洩時，公務機關及特定非公務機關應另依個人資料保護法及其相關法令規定辦理。","note":"一、本條新增。\n二、本法要求納管之公務機關及特定非公務機關訂定「資通安全維護」計畫並依計畫實施相關資通安全管理事項、訂定資通安全事件之通報及應變機制、通報資通安全事件等，均係屬資通安全維護義務，與個人資料保護法要求保有個人資料者應採行適當之安全措施、訂定「個人資料檔案安全維護」計畫或業務終止後個人資料處理方法等，兩者規範目的及事項不同，並無普通法及特別法之關係，有予以明辨之必要，爰增訂本條。"},{"bill":"202110074020000","text":"主管機關得委託其他公務機關辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n資安署得委託其他公務機關辦理國家資通安全防護、演練、稽核及其他資通安全相關事務。\n前二項受委託之公務機關，不得洩露辦理相關事務過程中所知悉之秘密。\n特定非公務機關之業務涉及數個中央目的事業主管機關之權責，主管機關得協調指定其中一個或數個中央目的事業主管機關，單獨或共同辦理本法所定中央目的事業主管機關應辦理之事項。","note":"一、條次變更。\n二、考量現行實務運作，未將權限移轉委任所屬機關或委託法人或團體，爰修正第一項。\n三、配合修正條文第二條第二項規定，增訂第二項定明資安署得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n四、考量公權力之委託並無複委託情事及受委託者就執行或辦理相關事務過程中所知悉之秘密，除有正當理由外，應有保密之義務，不以關鍵基礎設施提供者之秘密為限，爰將現行第二項移列為第三項，並酌作文字修正。\n五、考量特定非公務機關之業務性質可能涉及數個中央目的事業主管機關之權責，為避免該等機關就本法所定事項權責不清，須有解決之機制，爰增訂第四項，將本法施行細則第十二條規定提升至本法規定，並酌作修正。"},{"bill":"202110083660000","text":"主管機關為辦理資通安全整體防護、國際交流合作及其他資通安全相關事務，得委託其他公務機關為之。\n資安署為辦理國家資通安全防護、演練、稽核及其他資通安全相關事務，得委託其他公務機關為之。\n前二項受委託之公務機關，不得洩露辦理相關事務過程中所知悉之秘密。\n特定非公務機關之業務涉及數個中央目的事業主管機關之權責，主管機關得協調指定其中一個或數個中央目的事業主管機關，單獨或共同辦理本法所定中央目的事業主管機關應辦理之事項。","note":"一、條次變更。\n二、第一項酌作文字修正。\n三、配合修正條文第二條第二項規定，爰增訂第二項定明資安署得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n四、考量公權力之委託並無複委託情事，及受委託者就執行或辦理相關事務過程中所知悉之秘密，除有正當理由外，應有保密之義務，不以關鍵基礎設施提供者之秘密為限，爰將現行第二項移列為第三項，並酌作文字修正。\n五、考量特定非公務機關之業務性質可能涉及數個中央目的事業主管機關之權責，為避免該等機關就本法所定事項權責不清，須有解決之機制，爰增訂第四項，將本法施行細則第十二條規定提升至本法規定，並酌作修正。"},{"bill":"202110082760000","text":"主管機關得委託其他公務機關辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n資安署得委託其他公務機關辦理國家資通安全防護、演練、稽核及其他資通安全相關事務。\n前二項受委託之公務機關，不得洩露辦理相關事務過程中所知悉之秘密。\n特定非公務機關之業務涉及數個中央目的事業主管機關之權責，主管機關得協調指定其中一個或數個中央目的事業主管機關，單獨或共同辦理本法所定中央目的事業主管機關應辦理之事項。","note":"一、條次變更。\n二、考量現行實務運作，未將權限移轉委任所屬機關或委託法人或團體，爰修正第一項。\n三、配合修正條文第二條第二項規定，增訂第二項，定明資安署得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n四、考量公權力之委託並無複委託情事，及受委託者就執行或辦理相關事務過程中所知悉之秘密，除有正當理由外，應有保密之義務，不以關鍵基礎設施提供者之秘密為限，爰將現行第二項移列為第三項，並酌作文字修正。\n五、考量特定非公務機關之業務性質可能涉及數個中央目的事業主管機關之權責，為避免該等機關就本法所定事項權責不清，須有解決之機制，爰增訂第四項，將本法施行細則第十二條規定提升至本法規定，並酌作修正。"},{"bill":"202110085470000","text":"主管機關得委託其他公務機關辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n資安署得委託其他公務機關辦理國家資通安全防護、演練、稽核及其他資通安全相關事務。\n前二項受委託之公務機關，不得洩露辦理相關事務 ":"一、條次變更。\n二、考量現行實務運作，並配合修正條文第二條規定，定明主管機關得委託辦理國家資通安全防護、演練、稽核及其他資通安全相關事務之依據。\n三、考量公權力之委託並無複委託情事，及受委託者就執行或辦理相關事務過程中所知悉之秘密，除有正當理由外，應有保密之義務，不以關鍵基礎設施提供者之秘密為限，爰保留原第二項，並酌作文字修正。\n四、考量特定非公務機關之業務性質可能涉及數個中央目的事業主管機關之權責，為避免該等機關就本法所定事項權責不清，須有解決之機制，爰增訂第三項，將本法施行細則第十二條規定提升至本法規定，並酌作修正。","review":null},{"no":"第三十三條","current":"本法施行細則，由主管機關定之。","versions":[{"bill":"202110033990000","text":"本法施行細則，由主管機關定之。","note":"條次變更，內容未修正。"},{"bill":"201110061520000","text":"本法所定資通安全事件，涉及個人資料外洩時，公務機關及特定非公務機關應另依個人資料保護法及其相關法令規定辦理。","note":"一、本條新增。\n二、本法要求納管之公務機關及特定非公務機關訂定「資通安全維護」計畫並依計畫實施相關資通安全管理事項、訂定資通安全事件之通報及應變機制、通報資通安全事件等，均係屬資通安全維護義務，與個人資料保護法要求保有個人資料者應採行適當之安全措施、訂定「個人資料檔案安全維護」計畫或業務終止後個人資料處理方法等，兩者規範目的及事項不同，並無普通法及特別法之關係，有予以明辨之必要，爰增訂本條。"},{"bill":"202110067790000","text":"主管機關得委託其他公務機關、法人或團體，辦理資通安全整體防護、國際交流合作及其他資通安全相關事務。\n前項受委託之公務機關，不得洩露辦理相關事務過程中所知悉之秘密。\n特定非公務機關之業務涉及數個中央目的事業主管機關之權責，主管機關得協調指定其中一個或數個中央目的事業主管機關，單獨或共同辦理本法所定中央目的事業主管機關應辦理之事項。","note":"一、條次變更。\n二、考量實務運作未將權限移轉委任所屬機關或委託法人或團體，爰修正第一項。\n三、第二項考量受委任、委託或複委託者就執行或辦理相關事務過程中所獲悉之秘密，除有正當理由外，均有保密之義務，不限於關鍵基礎設施提供者之秘密，爰刪除「關鍵基礎設施提供者」等字，並酌作文字修正。\n四、考量特定非公務機關之業務性質可能涉及數個中央目的事業主管機關之權責，為避免該等機關就本法所定事項權責不清，爰增訂第三項，將本法施行細則第十二條規定提升至本法規定，並酌作文字修正。"},{"bill":"202110071280000","text":"本法所定資通安全事件，涉及個人資料外洩時，公務機關及特定非公務機關應另依個人資料保護法及其相關法令規定辦理。","note":"一、本條新增。\n二、本法要求納管之公務機關及特定非公務機關訂定「資通安全維護」計畫並依計畫實施相關資通安全管理事項、訂定資通安全事件之通報及應變機制、通報資通安全事件等，均係屬資通安全維護義務，與個人資料保護法要求保有個人資料者應採行適當之安全措施、訂定「個人資料檔案安全維護」計畫或業務終止後個人資料處理方法等，兩者規範目的及事項不同，並無普通法及特別法之關係，有予以明辨之必要，爰增訂本條。"},{"bill":"202110071040000","text":"本法所定資通安全事件，涉及個人資料檔案外洩時，公務機關及特定非公務機關應另依個人資料保護法及其相關法令規定辦理。","note":"一、本條新增。\n二、資通安全管理法係要求納管之公務機關及特定非公務機關訂定「資通安全維護」計畫並依計畫實施相關資通安全管理事項、訂定資通安全事件之通報及應變機制、通報資通安全事件等，均係屬資通安全維護義務，與個人資料保護法係要求保有個人資料檔案者應採行適當之安全措施、訂定「個人資料檔案安全維護」計畫或業務終止後個人資料處理方法等，兩者之構成要件不同，並無普通法及特別法之關係，有予以明辨之必要，爰增訂本條。"},{"bill":"202110073190000","text":"本法施行細則，由主管機關定之。","note":"條次變更。"},{"bill":"202110074020000","text":"本法所定資通安全事件，涉及個人資料外洩時，公務機關及特定非公務機關應另依個人資料保護法及其相關法令規定辦理。","note":"一、本條新增。\n二、本法要求納管之公務機關及特定非公務機關訂定「資通安全維護」計畫並依計畫實施相關資通安全管理事項、訂定資通安全事件 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();

}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }

  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;

    cur = (i + hits.length) % hits.length;

    prev.hidden = next.hidden = !hits.length;

    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
