<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教育部組織法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

明定本署之設立目的及隸屬關係。"},{"bill":"201110072960000","text":"為建構優質運動產業環境，促進運動產業發展，特設國家運動產業發展中心（以下簡稱本中心），並制定本條例。","note":"一、為因應國際運動發展新趨勢，我國運動推展將擴及以全民為本之運動平等參與、以運動員為主體之競技科學發展、跨域智慧科技導入及永續運動產業發展，並強化運動產業之創新及永續等面向，為推行及達成上開政策目標，成立運動部。\n二、承上，運動部成立後，為執行「推動運動產業，促進幸福經濟」之業務，有必要設置國家運動產業發展中心（以下簡稱本中心），藉由行政法人彈性化及自主化之組織特性，導入多元領域思維，予以執行相關業務，以建構優質運動產業環境，促進運動產業發展，爰定明本條例之立法目的。"},{"bill":"201110072960000","text":"為設立國家運動訓練中心（以下簡稱本中心），以推動國家運動訓練事務，培育優秀運動人才，提升國際運動競爭力，特制定本條例。","note":"本條未修正。"}],"changed":false,"final":"行政院為辦理全國教育業務，特設教育部（以下簡稱本部）。","finalWhy":null,"review":{"note":"照行政院提案通過","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。"}},{"no":"第二條","current":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","versions":[{"bill":"202110005960000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、哲學教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"一、本條第二款新增「哲學教育」作為教育部掌理事項。\n二、哲學教育的重點在於培養學生具有獨立思考和批判能力，與公民素養所需促使公民形成和具備現代社會所應有的涵養有所不同。前者在於訓練學生的思辯能力，後者在於強調培養學生具有公德、公益與尊重的素養，亦即培養思辨批判能力並非公民素養的主要目標。"},{"bill":"202110006840000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、哲學教育、交通安全教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"一、本條第二款新增「哲學教育」、「交通安全教育」作為教育部掌理事項。\n二、哲學教育的重點在於培養學生具有獨立思考和批判能力，經由哲學思辨，幫助提升學生獨立思考、表達、想像以及創造的能力。並且透過哲學認識自身在實踐之中，需要主體有意識地運用理論於技巧及活動，尋找其真正的價值目的所在。\n三、近年我國對於交通安全意識逐年提升，為貫徹人本交通之理念，改善交通環境，除針對公共運輸與人行環境的整合規劃，以及改善監理制度，更需透過教育建立正確交通觀念，落實學校交通安全教育、以塑形以人為本、行人優先的交通安全文化。"},{"bill":"202110072930000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"配合體育暨運動發展部之成立，原由教育部體育署辦理之運動教育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策規劃、輔導及行政監督等事項，改由體育暨運動發展部辦理，爰修正第八款。"},{"bill":"202110074050000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導，外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督，人文社會、科技教育政策之規劃、協調與推動，學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督，學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"配合運動部之增設，調整教育部組織法之規定，刪除移出之業務。"},{"bill":"202110074480000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"配合行政院增設運動部，原由教育部體育署（以下簡稱體育署）辦理之運動教育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策規劃、輔導及行政監督等事項，改由運動部辦理；至於學校體育包括十二年國民教育課程綱要及體育教學（包括場館設施等）部分，因為「體育」是具有社會型態的團體組織，為了增進人體完美的發展，而寓教育於身體活動的教育歷程，「體育」是供給人類的全部教育歷程中的一種媒介體。因此，體育就是教育，是教育的一環，則由教育部辦理。綜述，爰修正第八款規定。"},{"bill":"201110072960000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"201110072960000","text":"本署掌理下列事項：\n一、全民運動政策之規劃、推動與執行及相關法規之研擬。\n二、國民規律運動、運動教育與體適能檢測之規劃、推動及執行。\n三、兒童、少年、青年、壯年與高齡者全齡運動之規劃、推動及執行。\n四、海洋、水域與山林運動之規劃、推動及執行。\n五、新興、極限與傳統民俗運動之規劃、推動及執行。\n六、社區運動俱樂部與社團、各層級賽事推廣之規劃、推動及執行。\n七、全國性運動團體推動全民運動之輔導。\n八、多元運動專業人員之培育及輔導。\n九、其他有關全民運動事項。","note":"本署之權限職掌。"},{"bill":"201110072960000","text":"本中心為行政法人；其監督機關為運動部。","note":"本中心組織型態及監督機關。"},{"bill":"201110072960000","text":"本中心為行政法人；其監督機關為運動部。","note":"一、配合運動部之成立，國家運動訓練中心（以下簡稱本中心）之監督機關改為運動部，爰修正第一項，並列為本條文。\n二、現行教育部指定教育部體育署督導本中心，運動部成立後，無委託或指定專責機關督導本中心之必要，爰刪除第二項。"},{"bill":"201110072960000","text":"本中心為行政法人；其監督機關為運動部。","note":"一、配合運動部之成立，國家運動科學中心（以下簡稱本中心）之監督機關改為運動部，爰修正第一項，並列為本條文。\n二、現行教育部指定教育部體育署督導本中心，運動部成立後，無委託或指定專責機關督導本中心之必要，爰刪除第二項。"},{"bill":"201110072960000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"配合行政院增設運動部，原由教育部體育署（以下簡稱體育署）辦理之運動教育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策規劃、輔導及行政監督等事項，改由運動部辦理；至於學校體育包括十二年國民教育課程綱要及體育教學（包括場館設施等）部分，則由本部辦理，爰修正第八款規定。"},{"bill":"202110076230000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃 l":"202110084130000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"配合增設運動發展部，原由教育部體育署辦理之全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策之規劃、輔導及行政監督等事項，改由運動部辦理；至於學校體育包括十二年國民教育課程綱要及體育教學（包括場館設施等）部分，則由教育部辦理，爰修正第八款規定。"},{"bill":"202110083560000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"配合行政院增設運動部，原由教育部體育署（以下簡稱體育署）辦理之運動教育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策規劃、輔導及行政監督等事項，改由運動部辦理；至於學校體育包括十二年國民教育課程綱要及體育教學（包括場館設施等）部分，則由本部辦理，爰修正第八款規定。"}],"changed":true,"final":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","finalWhy":"配合行政院增設運動部，原由教育部體育署（以下簡稱體育署）辦理之運動教育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策規劃、輔導及行政監督等事項，改由運動部辦理；至於學校體育包括十二年國民教育課程綱要及體育教學（包括場館設施等）部分，則由本部辦理，爰修正第八款規定。","review":{"note":"照委員鍾佳濱等7人所提修正動議通過","text":"本部掌理下列事項：\n一、國家運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、年齡、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、獎勵、管理及監督。\n三、適應運動發展、身心障礙競技運動與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之蒐藏、保存、再現、展示及推廣；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之種類、分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進、輔導及監督；相關機關(構)、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。"}},{"no":"第三條","current":"本中心之業務範圍如下：\n一、國家級優秀運動選手之選拔、培訓及輔導參賽。\n二、國家級優秀運動教練之培育及進修。\n三、運動科學支援訓練之執行。\n四、本中心場館之營運及管理。\n五、優秀運動選手之生涯諮商輔導。\n六、與國內外運動訓練相關機構之合作交流。\n七、其他與競技運動推展相關之事項。","versions":[{"bill":"201110072960000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"201110072960000","text":"本署置署長一人，職務列簡任第十三職等，必要時得比照大學校長之資格聘任；副署長一人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等、員額及首長任用資格之特別規定。"},{"bill":"201110072960000","text":"本中心之業務範圍如下：\n一、運動產業之調查、統計及研究發展。\n二、運動產業專業人才之培育與媒合及國際交流。\n三、運動產業營運與投融資之輔導、諮詢及協助。\n四、運動產業資產之規劃、建置、治理及運用。\n五、運動產品或服務之加值運用與市場拓展及商業模式之營運管理。\n六、公有、私有運動場域與學校場地開放及社區運動俱樂部設置之輔導。\n七、競技運動全民化與全民運動產業化之推動及輔導。\n八、運動賽事產業化、傳播、行銷規劃與平臺建立之諮詢及協助。\n九、其他與運動產業相關之業務。","note":"一、本中心之業務範圍。\n二、依運動產業發展條例第四條規定「本條例所稱運動產業，指提供民眾從事運動或運動觀賞所需產品或服務，或可促進運動推展之支援性服務，而具有增進國民身心健康、提升體能及生活品質之下列產業：一、職業或業餘運動業。二、運動休閒教育服務業。三、運動傳播媒體或資訊出版業。四、運動表演業。五、運動旅遊業。六、電子競技業。七、運動博弈業。八、運動經紀、管理顧問或行政管理業。九、運動場館或設施營建業。十、運動用品或器材製造、批發及零售業。十一、運動用品或器材租賃業。十二、運動保健業。十三、其他經中央主管機關認定之產業。」，本中心應配合運動部及其他中央目的事業主管機關政策，協助促進及推動運動產業。\n三、為達成促進及推動運動產業之政策目的，本中心將辦理運動產業之策略研究（例如辦理調查、統計及研究等）、運動產業促進（例如協助培育及媒合運動人才、國際交流、提供運動產業營運事項之協助、輔導民間投資運動產業及協助取得融資貸款之信用保證等）、全齡運動發展（例如將競技運動推廣全民參與、推動全民運動相關產業發展、公有、私有運動場域與學校場地開放及社區運動俱樂部設置之輔導等）、跨域創新（運動產業軟硬體資產之規劃、建置、治理、運用、協助運動產品創新設計開發、促進運動旅遊、推動運動文化加值應用及促進運動傳播及行銷等）及運動賽會輔導（包括輔導運動賽會產業化等），爰於各款明定本中心之業務範圍。"},{"bill":"201110072960000","text":"本中心之業務範圍如下：\n一、國家級優秀運動選手之選拔、培訓及輔導參賽。\n二、國家級優秀運動教練之培育及進修。\n三、醫療照護支援訓練之執行。\n四、本中心場館之營運及管理。\n五、國家級優秀運動選手之課業輔導及生涯諮商輔導。\n六、競技運動相關事項之國際交流。\n七、與國內外運動訓練相關機構之合作交流。\n八、其他與競技運動推展相關之事項。","note":"一、依實務運作，運動科學支援訓練，由國家運動科學中心辦理，本中心辦理醫療照護支援訓練事宜，爰修正第三款，將所定「運動科學」修正為「醫療照護」。\n二、第五款修正如下：\n(一)考量至本中心接受訓練者均為國家級優秀運動選手，為利明確及體例一致，爰將所定優秀運動選手修正為「國家級」優秀運動選手。\n(二)另考量國家級優秀運動選手於本中心訓練期間，其課業輔導為本中心既有之業務，為保障學生選手之受教權，並使本中心辦理該項業務有所依循，爰增列「課業輔導」為本中心業務，以期明確。\n三、為促進競技運動之國際交流，爰增列第六款，明定競技運動相關事項之國際交流為本中心之業務；現行第六款及第七款配合移列為第七款及第八款，內容未修正。"},{"bill":"201110072960000","text":"本中心之業務範圍如下：\n一、辦理國家優秀運動選手培訓、參賽所需之運動科學支援服務、健康管理及運動醫學研究。\n二、辦理國際運動賽事資訊之蒐集、分析及支援。\n三、推動運動科學之研究及國際交流。\n四、進行運動科技之研發、技術移轉及加值應用，提升產業競爭力。\n五、促進國內外運動科學研究機構之合作交流。\n六、協助規劃及培育運動科學專業人才。\n七、運動科學成果推廣全民運用。\n八、其他與運動科學相關之業務。","note":"一、依實務運作，醫療照護支援訓練事宜係由國家運動訓練中心辦理，本中心辦理運動醫學研究，爰修正第一款，將所定「醫療照護」修正為「運動醫學研究」。\n二、修正第三款，明定推動運動科學之研究及國際交流為本中心之業務。\n三、其餘各款未修正。"}],"changed":false,"final":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","finalWhy":null,"review":{"note":"照行政院提案通過","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。"}},{"no":"第四條","current":"本中心之經費來源如下：\n一、政府之核撥及捐（補）助。\n二、國內外公私立機構、團體及個人之捐贈。\n三、營運之收入。\n四、其他收入。\n前項第二款之捐贈，視同捐贈政府。","versions":[{"bill":"201110072960000","text":"本部置主任秘書，職務列簡任第十二職等。","note":"本部幕僚長之職稱及官職等。"},{"bill":"201110072960000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"201110072960000","text":"本中心經費來源如下：\n一、運動發展基金所獲運動彩券發行盈餘或其他政府預算之核撥及捐（補）助。\n二、國內外公私立機構、團體及個人之捐贈。\n三、受託研究及提供服務之收入。\n四、其他收入。\n前項第二款之捐贈，視同對政府之捐贈。","note":"一、第一項明定本中心之經費來源。\n二、第二項明定國內外公私立機構、團體及個人對本中心之捐助，視同對政府之捐贈，俾依所得稅法第十七條及第三十六條規定，於申報所得稅時列舉扣除或列為費用，不受金額限制，以鼓勵民間企業機構、企業團體或個人樂於捐助本中心，挹注及充實本中心預算經費。又所定「公私立機構」包括營利事業及非營利事業，併予敘明。"},{"bill":"201110072960000","text":"本中心之經費來源如下：\n一、政府之核撥及捐（補）助。\n二、國內外公私立機構、團體及個人之捐贈。\n三、營運之收入。\n四、其他收入。\n前項第二款之捐贈，視同對政府之捐贈。","note":"一、第一項未修正。\n二、參考國家運動科學中心設置條例第四條第二項及國家太空中心設置條例第四條第二項等規定之體例，第二項酌作文字修正。"}],"changed":false,"final":"本部置主任秘書，職務列簡任第十二職等。","finalWhy":null,"review":{"note":"照行政院提案通過","text":"本部置主任秘書，職務列簡任第十二職等。"}},{"no":"第五條","current":"本部之次級機關及其業務如下：\n一、國民及學前教育署：規劃、推動高級中等以下學校與學前教育政策及制度，並督導、協調、協助各地方高級中等以下學校與學前教育之發展及執行本部所轄高級中等以下學校教育事項。\n二、體育署：規劃全國體育政策，並督導、執行學校體育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施事項。\n三、青年發展署：規劃全國青年發展政策，推動青年生涯輔導、公共參與、國際與體驗學習及其他青年發展事項。","versions":[{"bill":"202110072930000","text":"本部之次級機關及其業務如下：\n一、國民及學前教育署：規劃、推動高級中等以下學校與學前教育政策及制度，並督導、協調、協助各地方高級中等以下學校與學前教育之發展及執行本部所轄高級中等以下學校教育事項。\n二、青年發展署：規劃全國青年發展政策，推動青年生涯輔導、公共參與、國際與體驗學習及其他青年發展事項。","note":"配合體育暨運動發展部之設立，刪除第二款規定。原第三款規定遞移至第二款，內容未修正。"},{"bill":"202110074050000","text":"本部之次級機關及其業務如下：\n一、國民及學前教育署：規劃、推動高級中等以下學校與學前教育政策及制度，並督導、協調、協助各地方高級中等以下學校與學前教育之發展及執行本部所轄高級中等以下學校教育事項。\n二、青年發展署：規劃全國青年發展政策，推動青年生涯輔導、公共參與、國際與體驗學習及其他青年發展事項。","note":"配合運動部之設立，刪除體育署相關規定。"},{"bill":"202110074480000","text":"本部之次級機關及其業務如下：\n一、國民及學前教育署：規劃、推動高級中等以下學校與學前教育政策及制度，並督導、協調、協助各地方高級中等以下學校與學前教育之發展及執行本部所轄高級中等以下學校教育事項。\n二、青年發展署：規劃全國青年發展政策，推動青年生涯輔導、公共參與、國際與體驗學習及其他青年發展事項。","note":"配合運動部之設立，刪除第二款規定。原第三款規定遞移至第二款，內容未修正。"},{"bill":"201110072960000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"201110072960000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條或第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再重申。"},{"bill":"201110072960000","text":"本中心應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報請監督機關備查。\n本中心就執行之公共事務，在不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報請監督機關備查。","note":"一、為期本中心得以有效運作，並具一定程度之自主性，爰於第一項明定本中心應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報請監督機關備查。\n二、由於本中心仍肩負執行特定公共事務之使命，爰於第二項明定本中心就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，可訂定對外發生效力之規章，並提經董事會通過後，報請監督機關備查。"},{"bill":"201110072960000","text":"本中心應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報請監督機關備查。\n本中心就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報請監督機關備查。","note":"一、本中心於行政法人化之初，即已訂定國家運動訓練中心組織章程，考量該組織章程之性質屬本中心組織架構及業務職掌之重要規章，爰於第一項增列本中心應訂定組織章程，俾資明確。\n二、第二項未修正。"},{"bill":"2011 "202110084130000","text":"本部之次級機關及其業務如下：\n一、國民及學前教育署：規劃、推動高級中等以下學校與學前教育政策及制度，並督導、協調、協助各地方高級中等以下學校與學前教育之發展及執行本部所轄高級中等以下學校教育事項。\n二、青年發展署：規劃全國青年發展政策，推動青年生涯輔導、公共參與、國際與體驗學習及其他青年發展事項。","note":"配合運動發展部之設立，刪除第二款教育部體育署之規定。原第三款規定遞移至第二款，內容未修正。"},{"bill":"202110083560000","text":"本部之次級機關及其業務如下：\n一、國民及學前教育署：規劃、推動高級中等以下學校與學前教育政策及制度，並督導、協調、協助各地方高級中等以下學校與學前教育之發展及執行本部所轄高級中等以下學校教育事項。\n二、青年發展署：規劃全國青年發展政策，推動青年生涯輔導、公共參與、國際與體驗學習及其他青年發展事項。","note":"配合運動部之設立，刪除第二款規定。原第三款規定遞移至第二款，內容未修正。"}],"changed":true,"final":"本部之次級機關及其業務如下：\n一、國民及學前教育署：規劃、推動高級中等以下學校與學前教育政策及制度，並督導、協調、協助各地方高級中等以下學校與學前教育之發展及執行本部所轄高級中等以下學校教育事項。\n二、青年發展署：規劃全國青年發展政策，推動青年生涯輔導、公共參與、國際與體驗學習及其他青年發展事項。","finalWhy":"配合運動部之設立，刪除第二款規定。原第三款規定遞移至第二款，內容未修正。","review":{"note":"照行政院提案通過","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。"}},{"no":"第六條","current":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與運動相關之學者、專家。\n三、民間企業經營、管理專家。\n四、對國家體育運動有重大貢獻之社會人士。\n前項第一款之董事不得逾董事總人數三分之一；第二款之董事不得少於董事總人數二分之一。\n第一項董事，應至少一人具原住民身分；任一性別不得少於總人數三分之一。","versions":[{"bill":"201110072960000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"201110072960000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"201110072960000","text":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與運動產業相關之學者、專家。\n三、民間企業經營、管理專家及對國家體育運動有重大貢獻之社會人士。\n前項第一款之董事，不得逾董事總人數三分之一；第二款之董事，不得少於董事總人數二分之一。\n第一項董事，任一性別不得少於董事總人數三分之一。","note":"一、考量本中心組織規模，董事人數定為十一人至十五人，又為落實本中心任務執行，爰於第一項明定本中心董事資格、遴聘及解聘方式。第一款所定「政府相關機關」，例如經濟部、國家通訊傳播委員會、文化部、交通部、內政部、財政部、國家科學及技術委員會、數位發展部及教育部等；第二款所定「與運動產業相關之學者、專家」，包括運動產業相關領域之民間學會成員等，第三款所定「對國家體育運動有重大貢獻之社會人士」，主要係借重其對於運動產業之經驗分享及實務建議。\n二、第二項明定第一項第一款規定政府機關代表人數之比例限制，以維持其獨立性，並明定第一項第二款規定運動產業相關之學者、專家代表人數之保障比例，以發揮渠等所長。\n三、第三項明定董事之任一性別之保障比例。"},{"bill":"201110072960000","text":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與運動相關之學者、專家。\n三、民間企業經營、管理專家。\n四、對國家體育運動有重大貢獻之社會人士。\n前項第一款之董事不得逾董事總人數三分之一；第二款之董事不得少於董事總人數二分之一。\n第一項董事，應至少一人具原住民身分；任一性別不得少於董事總人數三分之一。","note":"一、第一項及第二項未修正。\n二、為期明確，修正第三項，增列「董事」二字。"},{"bill":"201110072960000","text":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與運動科學相關之學者、專家。\n三、民間企業經營、管理專家及對國家體育運動有重大貢獻之社會人士。\n前項第一款之董事，不得逾董事總人數三分之一；第二款之董事，不得少於董事總人數二分之一。\n第一項董事，任一性別不得少於董事總人數三分之一。","note":"一、第一項及第二項未修正。\n二、為期明確，修正第三項，增列「董事」二字。"}],"changed":false,"final":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。\n前項駐外人員擔任駐外機構教育單位主管職務者，必要時得借調專科以上學校具教授資格者聘任之；每次聘任期間不得超過三年，期滿得再行借調。\n前項借調期間合計不得超過六年。","finalWhy":null,"review":{"note":"照行政院提案通過","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。"}},{"no":"第七條","current":"本中心置監事三人，互推一人為常務監事。\n監事由監督機關就具運動、法律或會計等相關學識經驗者遴選提請行政院院長聘任之；解聘時，亦同。\n第一項監事，任一性別不得少於總人數三分之一。","versions":[{"bill":"201110072960000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"201110072960000","text":"本中心置監事三人，由監督機關就具運動產業、法律或會計等相關學識經驗者遴選，提請行政院院長聘任之；解聘時，亦同。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於監事總人數三分之一。","note":"一、第一項為發揮監督功能，爰明定本中心監事應具運動產業、法律或會計等相關學識經驗者，並規定監事人數及其遴聘、解聘方式。\n二、第二項明定常務監事之選任方式。\n三、第三項明定監事之任一性別之保障比例。"},{"bill":"201110072960000","text":"本中心置監事三人，互推一人為常務監事。\n監事由監督機關就具運動、法律或會計等相關學識經驗者遴選提請行政院院長聘任之；解聘時，亦同。\n第一項監事，任一性別不得少於監事總人數三分之一。","note":"一、第一項及第二項未修正。\n二、為期明確，修正第三項，增列「監事」二字。"},{"bill":"201110072960000","text":"本中心置監事三人，由監督機關就具運動科學、法律或會計等相關學識經驗者遴選，提請行政院院長聘任之；解聘時，亦同。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於監事總人數三分之一。","note":"一、第一項及第二項未修正。\n二、為期明確，修正第三項，增列「監事」二字。"}],"changed":false,"final":"本部資訊及科技教育司之司長職務，必要時，得比照專科以上學校教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","finalWhy":null,"review":{"note":"照行政院提案通過","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。"}},{"no":"第八條","current":"董事、監事任期為四年，期滿得續聘一次。但續聘人數不得超過總人數三分之二，不得少於三分之一。\n代表政府機關之董事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款至第四款及前條第二項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","versions":[{"bill":"201110072960000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"201110072960000","text":"董事、監事任期為四年，期滿得續聘之。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關出任之董事，應依其職務異動改聘；依第六條第一項第二款、第三款及前條第一項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","note":"一、第一項明定董事、監事任期。參考國家運動訓練中心設置條例第八條及國家運動科學中心設置條例第八條董事任期均為四年，爰將董事、監事之任期定為四年，又為應實務運作彈性，明定董事、監事任期屆滿得續聘之。\n二、第二項明定董事為政府機關代表者，依其職務異動改聘；並明定董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"201110072960000","text":"董事、監事任期為四年，期滿得續聘之。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關之董事，應依其職務異動改聘；依第六條第一項第二款至第四款及前條第二項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","note":"一、為配合實務運作並兼顧董事、監事之專業性，爰刪除第一項所定董事、監事僅得續聘一次之規定，並酌作文字修正。\n二、配合第一項有關董事、監事僅得續聘一次之規定業已刪除，爰刪除第二項有關代表政府機關之董事，應依其職務異動改聘，不受續聘次數限制之規定。"},{"bill":"201110072960000","text":"董事、監事任期為四年，期滿得續聘之。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關出任之董事，應依其職務異動改聘；依第六條第一項第二款、第三款及前條第一項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","note":"一、為配合實務運作並兼顧董事、監事之專業性，爰刪除第一項所定董事、監事僅得續聘一次之規定，並酌作文字修正。\n二、配合第一項有關董事、監事僅得續聘一次之規定業已刪除，爰刪除第二項有關代表政府機關之董事，應依其職務異動改聘，不受續聘次數限制之規定。"}],"changed":false,"final":"本部各職稱之官等職等及員額，另以編制表定之。","finalWhy":null,"review":{"note":"照行政院提案通過","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。"}},{"no":"第九條","current":"本法施行日期，由行政院定之。\n本法修正條文，自公布日施行。","versions":[{"bill":"202110072930000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合體育暨運動發展部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110074050000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之制定，修正第二項規定，明定本法本次修正條文由行政院定之。"},{"bill":"202110074480000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國一百零一年二月三日全文修正之條文、中華民國一百十年五月二十六日修正公布之第六條條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"201110072960000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"201110072960000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n董事、監事有前項情形之一或無故連續不出席、不列席董事會會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十四條或第十五條第一項利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項明定不得聘任為董事、監事之情事。\n二、第二項明定董事、監事應予解聘之情事。\n三、第三項明定董事、監事得予解聘之情事。\n四、為保障當事人權益，爰於第四項明定監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n五、第五項明定董事、監事之遴聘、解聘、補聘相關事項之辦法，由監督機關定之。"},{"bill":"201110072960000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n董事、監事有前項情形之一或無故連續不出席、不列席董事會會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十四條或第十五條第一項利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、依消費者債務清理條例第八十四條規定，其他法令關於破產人資格、權利限制之規定，於受法院裁定開始清算程序之債務人均準用，故債務人因法院裁定開始清算程序所受公、私法上資格、權利之限制，與破產人相同，又參酌財團法人法第四十二條第一項第四款、第五十一條第二項第一款之立法例，爰於第一項第三款增列有依消費者債務清理條例經裁定開始清算程序，尚未復權之情事，為本中心董事、監事之消極資格。\n二、身心障礙者權利公約（以下簡稱CRPD）第二十九條，要求締約國應保障身心障礙者享有政治權利及有機會在與其他人平等基礎上享有該等權利。復依一百零三年八月二十日制定公布身心障礙者權利公約施行法，賦予該公約國內法之效力。董事、監事及執行長適任與否，應以是否具備該職務所需專業為考量，又以董事、監事及執行長是否不能執行職務，與其是否為身心障礙者無關，為使本條例更符CRPD精神，爰刪除現行第一項第五款所定不得聘任經公立醫院證明身心障礙致不能執行職務者為董事、監事之規定。\n三、為確保本中心董事會議決議各議案時，監事得以發揮應有之監督功能，爰於第二項增列監事無故不列席董事會議達連續三次者，應予以解聘。\n四、配合修正條文第十四條及第十五條第一項業明定董事、監事之利益迴避有關規範，並明定董事、監事、執行長及其關係人之利益迴避事項，依公職人員利益衝突迴避法（以下簡稱利衝法）之規定辦理，第三項第七款爰配合酌作文字修正。\n五、第四項及第五項未修正。"},{"bill":"201110072960000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110076230000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"配合《運動部組織法》草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110075930000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110074150000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文之施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110076620000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、修正第二項，明定本次修正條文施行日期授權由行政院定之。"},{"bill":"202110076830000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110077840000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"配合《運動發展部組織法》草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110077390000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110077750000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110077920000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110078580000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動發展部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110078750000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110080990000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110081020000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110081360000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"配合體育暨運動發展部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110084130000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動發展部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110083560000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"}],"changed":true,"final":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國一百十四年一月七日修正之條文施行日期由行政院定之外，自公布日施行。","finalWhy":"一、第一項未修正。\n二、配合運動部組織法之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。","review":{"note":"照行政院提案通過","text":"本部各職稱之官等職等及員額，另以編制表定之。"}},{"no":"第十條","current":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任，應由監督機關訂定作業辦法遴聘之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","versions":[{"bill":"201110072960000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"201110072960000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項明定董事長之聘任。\n二、第二項明定董事長之聘任、解聘、補聘之方式及其他相關事項，由監督機關訂定辦法據以執行。\n三、第三項明定董事長職權及其不能執行職務之代理方式。\n四、考量董事長對內綜理本中心事務，對外代表本中心，職責繁重，宜由具適度身心能力者擔任，並避免其淪為酬傭性質，爰於第四項明定董事長之年齡限制。"},{"bill":"201110072960000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、考量實務執行上，董事長聘任後，可能會有解聘、補聘或其他相關事項等情形，為使本法授權監督機關訂定之作業辦法內容及範圍明確，爰修正第二項，就授權之內容及範圍，包括增列解聘、補聘之方式及其他相關事項，俾資明確。\n二、第一項、第三項及第四項未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"照行政院提案通過","text":"本法施行日期，由行政院定之。"}},{"no":"第十一條","current":"董事會之職權如下：\n一、發展目標及計畫之審議。\n二、年度業務計畫之審議。\n三、年度預算及決算報告之審議。\n四、規章之審議。\n五、自有不動產處分或其設定負擔之審議。\n六、本條例所定應經董事會決議事項之審議。\n七、執行長之任免。\n八、經費之籌募。\n九、其他重大事項之審議。","versions":[{"bill":"201110072960000","text":"董事會之職權如下：\n一、發展目標及計畫之審議。\n二、年度業務計畫之審議。\n三、年度預算及決算報告之審議。\n四、規章之審議。\n五、自有不動產處分或其設定負擔之審議。\n六、本條例所定應經董事會決議事項之審議。\n七、執行長任免之同意。\n八、經費之籌募。\n九、其他重大事項之審議。","note":"為確實發揮本中心業務功能，明定董事會職權，包括各重要業務事項審議、執行長任免之同意權行使及其他重大事項之審議，以避免掛一漏萬。"},{"bill":"201110072960000","text":"董事會之職權如下：\n一、發展目標及計畫之審議。\n二、年度業務計畫之審議。\n三、年度預算及決算報告之審議。\n四、規章之審議。\n五、自有不動產處分或其設定負擔之審議。\n六、本條例所定應經董事會決議事項之審議。\n七、執行長任免之同意。\n八、經費之籌募。\n九、其他重大事項之審議。","note":"第七款酌作文字修正；其餘未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十二條","current":"董事會每三個月開會一次；必要時，得召開臨時會議，由董事長召集，並擔任主席。\n董事會會議應有過半數董事之出席，其決議應有出席董事過半數之同意。但前條第一款至第七款之決議，應有董事總人數過半數之同意。","versions":[{"bill":"201110072960000","text":"董事會每三個月開會一次；必要時，得召開臨時會議，由董事長召集，並擔任主席。\n董事會會議應有過半數董事之出席，其決議應有出席董事過半數之同意。但前條第一款至第七款之決議，應有董事總人數過半數之同意。","note":"一、第一項明定董事會開會頻率、方式及由董事長擔任主席。\n二、第二項明定董事會決議方式。"},{"bill":"201110072960000","text":"董事會每三個月開會一次；必要時，得召開臨時會議，由董事長召集，並擔任主席。\n董事會會議應有過半數董事之出席，其決議應有出席董事過半數之同意。但前條第一款至第七款之決議，應有董事總人數過半數之同意。","note":"本條未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十三條","current":"監事之職權如下：\n一、業務、財務狀況之監督。\n二、財務帳冊、文件及財產資料之稽核。\n三、決算報告之審核。\n四、其他重大事項之審核及稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","versions":[{"bill":"201110072960000","text":"監事之職權如下：\n一、年度業務決算之審核。\n二、業務、財務狀況之監督。\n三、財務帳冊、文件及財產資料之稽核。\n四、其他重大事項之審核及稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","note":"一、為確實發揮本中心監事監督功能，第一項明定監事職權，包括各重大事項之審核、監督、稽核及其他重大事項之審核及稽核，以避免掛一漏萬。\n二、第二項明定監事職權行使方式及常務監事應列席董事會會議。"},{"bill":"201110072960000","text":"監事之職權如下：\n一、業務、財務狀況之監督。\n二、財務帳冊、文件及財產資料之稽核。\n三、決算報告之審核。\n四、其他重大事項之審核及稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","note":"本條未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十四條","current":"董事、監事應遵守利益迴避原則，不得假借職務上權力、機會或方法，圖謀本人或關係人之利益；其利益迴避範圍及違反時處置之準則，由監督機關定之。\n董事、監事相互間，不得有或曾有配偶及三親等以內血親、姻親之關係。\n本條例所稱關係人，指配偶或二親等內之親屬。","versions":[{"bill":"201110072960000","text":"董事、監事相互間，不得有配偶及三親等以內血親、姻親之關係。","note":"董事、監事相互間，不得有配偶及三親等以內血親、姻親之關係，以避免形成濫用私人之現象。"},{"bill":"201110072960000","text":"董事、監事相互間，不得有或曾有配偶及三親等以內血親、姻親之關係。","note":"一、依利衝法第二條第一項第七款，「公法人之董事、監察人、首長、執行長與該等職務之人」屬該法所稱之公職人員，爰本中心董事、監事及執行長應適用利衝法有關利益迴避之相關規定。又同法第一條第二項規定，公職人員利益衝突之迴避，除其他法律另有嚴格規定者外，適用該法之規定。因利衝法就利益迴避之規定，較本條例有更嚴格之規定，爰將第一項前段利益迴避之規定，移列修正條文第十五條第一項，與現行第十五條第一項合併修正。\n二、因第一項前段利益迴避之規定移列整併至修正條文第十五條第一項，第一項後段有關違反利益迴避之處置，配合移列修正條文第十五條第三項後段。\n三、查利衝法第三條第一項所定關係人之範圍，較現行第三項有更嚴格之規定，且修正條文第十五條第一項已明定董事、監事、執行長及其關係人之利益迴避事項應適用利衝法之規定，則第三項已無規範之必要，爰予刪除。\n四、第二項未修正，並列為本條文。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十五條","current":"第一項　董事、監事應遵守利益迴避原則，不得假借職務上權力、機會或方法，圖謀本人或關係人之利益；其利益迴避範圍及違反時處置之準則，由監督機關定之。\n第十五條　董事、監事或其關係人，不得與本中心為買賣、租賃、承攬等交易行為。但有正當理由，經董事會特別決議者，不在此限。\n違反前項規定致本中心受有損害者，行為人應對其負損害賠償責任。\n第一項但書情形，本中心應將董事會特別決議內容，於會後二十日內主動公開之，並報監督機關備查。","versions":[{"bill":"201110072960000","text":"董事、監事、執行長及其關係人之利益迴避事項，依公職人員利益衝突迴避法之規定辦理。\n違反前項規定致本中心受有損害者，行為人應對其負損害賠償責任。\n第一項人員違反公職人員利益衝突迴避法之規定者，除依該法規定處罰外，監督機關並得為適當之處置；其處置規定，由監督機關定之。","note":"一、依公職人員利益衝突迴避法第二條第一項第七款規定，該法所稱公職人員，包括公法人之董事、監察人、首長、執行長與該等職務之人，爰於第一項明定董事、監事、執行長及其關係人，應依公職人員利益衝突迴避法之規定辦理。\n二、第二項明定違反第一項規定致本中心受有損害者，行為人應負損害賠償責任，以杜弊端。\n三、第三項明定第一項人員違反公職人員利益衝突迴避法之處置規定，由監督機關定之。"},{"bill":"201110072960000","text":"董事、監事、執行長及其關係人之利益迴避事項，依公職人員利益衝突迴避法之規定辦理。\n違反前項規定致本中心受有損害者，行為人應對其負損害賠償責任。\n第一項人員違反公職人員利益衝突迴避法之規定者，除依該法規定處罰外，監督機關並得為適當之處置；其處置規定，由監督機關定之。","note":"一、本條由現行第十四條第一項及第十五條整併規定。\n二、第一項由現行第十四條第一項前段及第十五條第一項整併修正。有關董事、監事特定交易行為之禁止，已於利衝法第十四條明文規定，且較本條例嚴格；又利衝法第二條第一項第七款業明定「本法所稱公職人員，其範圍如下：……七、公法人之董事、監察人、首長、執行長與該等職務之人。」並於同法第三條第一項明定關係人之範圍，故本中心董事、監事、執行長及其關係人屬利衝法之適用對象，爰修正明定本中心之董事、監事、執行長及其關係人之利益迴避事項應依利衝法規定辦理，並刪除現行第十五條第一項但書規定。\n三、第二項由現行第十五條第二項移列，內容未修正。\n四、第三項由現行第十四條第一項後段修正移列，考量利衝法就公職人員違反利衝法者，已定有罰則規定，本中心董事、監事、執行長及其關係人應適用利衝法之規定，違反利衝法時，自應依利衝法之罰則規定予以處罰；此外，配合本中心之性質，尚有為其他處置（例如予以解聘等）之必要，爰明定違反利衝法時除依該法處罰外，監督機關並得為必要之處置，其相關規定由監督機關訂定之。\n五、配合現行第十五條第一項但書之刪除，現行第十五條第三項已無規定必要，爰予刪除。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十六條","current":"董事、常務監事應親自出席、列席董事會議，不得委託他人代理出席。","versions":[{"bill":"201110072960000","text":"董事、常務監事應親自出席、列席董事會會議，不得委託他人代理出席。","note":"為確保董事對於本中心業務執行及常務監事對本中心監督職能，明定董事、常務監事出席、列席董事會會議之方式。"},{"bill":"201110072960000","text":"董事、常務監事應親自出席、列席董事會會議，不得委託他人代理出席。","note":"酌作文字修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十七條","current":"本中心董事長、董事及監事，均為無給職。","versions":[{"bill":"201110072960000","text":"本中心之董事長得為專任或兼任，專任者之報酬由監督機關核定之；兼任者為無給職。\n本中心之董事、常務監事及監事，均為無給職。","note":"本中心除專任董事長外，其餘董事、常務監事及監事均為無給職。"},{"bill":"201110072960000","text":"本中心董事長、董事、常務監事及監事，均為無給職。","note":"考量常務監事亦為無給職，為利明確，爰予以增列。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十八條","current":"本中心置執行長一人，專任，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第一項、第二項前段、第三項、第四項、第十條第四項、第十四條、第十五條、第十九條第二項、第三項及第二十一條第六款有關董事及董事長之規定，於執行長準用之。","versions":[{"bill":"201110072960000","text":"本中心置執行長一人，專任，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第一項至第四項、第十條第四項、第十四條及第二十二條第六款有關董事及董事長之規定，於執行長準用之。","note":"一、本中心置執行長，人選由董事長推薦，又依第十一條第七款規定，執行長任免之同意須經董事會審議通過。又執行長應依法執行本中心業務及督導所屬人員，爰於第一項明定執行長之遴聘方式及職權。\n二、第二項明定執行長準用董事、董事長之相關規定。又以本中心執行長本為第十五條適用對象，並依第十九條第二項、第三項規定辦理，爰無須規定準用各該條項有關董事之規定，併予敘明。"},{"bill":"201110072960000","text":"本中心置執行長一人，專任，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第一項至第四項、第十條第四項、第十四條及第二十二條第六款有關董事及董事長之規定，於執行長準用之。","note":"一、第一項未修正。\n二、修正第二項：\n(一)考量實務運作之需，執行長亦有列席董事會之必要，爰修正明定第九條之準用範圍。\n(二)因修正條文第十五條第一項，已將執行長納入利衝法之適用對象，爰將第二項所定執行長準用第十五條之規定予以刪除，俾期周延。\n(三)配合修正條文第十九條第二項、第三項已明定本中心執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，且不得進用其配偶及三親等以內血親、姻親，擔任本中心職務，爰配合將現行條文所定「第十九條第二項、第三項」予以刪除。"},{"bill":"201110072960000","text":"本中心置執行長一人，專任，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第一項至第四項、第十條第四項、第十四條及第二十一條第六款有關董事及董事長之規定，於執行長準用之。","note":"一、第一項未修正。\n二、配合修正條文第十九條第二項、第三項規定，已明定執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，且執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務，第二項無明定執行長應準用第十九條第二項、第三項有關董事、監事、董事長規定之必要，爰予以刪除。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十九條","current":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","versions":[{"bill":"201110072960000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事、執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長、執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","note":"一、第一項明定本中心進用人員依本中心人事管理規章辦理，渠等權利義務關係，應以契約約定，釐清本中心及進用人員之法律關係，並符合建制之目的。\n二、第二項明定董事、監事、執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，落實利益迴避原則，避免循私。\n三、鑑於董事長、執行長對於本中心進用人員有決定權，為避免循私，爰於第三項明定董事長、執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。"},{"bill":"201110072960000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事、執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長、執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","note":"一、第一項未修正。\n二、第二項增列明定執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，落實利益迴避原則，避免循私。\n三、除董事長外，執行長對於本中心進用人員亦有相當之決定權，為避免循私，爰於第三項增列明定執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。"},{"bill":"201110072960000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事及執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長及執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","note":"一、第一項未修正。\n二、第二項增列明定執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，落實利益迴避原則，避免循私。\n三、除董事長外，執行長對於本中心進用人員亦有相當之決定權，為避免循私，爰於第三項增列明定執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十九條之一","current":null,"versions":[{"bill":"201110072960000","text":"本中心為應業務需要，得報請監督機關核准，依任務性質遴派專業人員駐境外辦事。","note":"一、本條新增。\n二、為應業務需要，明定本中心得經運動部核准後，派員駐境外辦事，至於派駐境外辦事之期間及方式，悉依任務需要定之，併予敘明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十條","current":null,"versions":[{"bill":"201110072960000","text":"本中心為應業務需要，得報請監督機關核准，依任務性質遴派專業人員駐境外辦事。","note":"為應業務需要，明定本中心經運動部核准後，派員駐境外辦事，至於派駐境外辦事之期間及方式，悉依任務需要定之，併予敘明。"},{"bill":"201110072960000","text":"本中心為應業務需要，得報請監督機關核准，依任務性質遴派專業人員駐境外辦事。","note":"一、本條新增。\n二、為應業務需要，明定本中心得經運動部核准後，派員駐境外辦事。至於派駐境外辦事之期間及方式，悉依任務需要定之，併予敘明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十一條","current":"本中心應擬訂發展目標及計畫，報請監督機關核定。\n本中心應訂定年度業務計畫及其預算，提經董事會通過後，報請監督機關備查。","versions":[{"bill":"201110072960000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度業務計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、依第十一條第一款規定，本中心發展目標及計畫係由董事會審議，爰第一項明定本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定，俾利本中心長遠、穩定之發展。\n二、依第十一條第二款及第三款規定，本中心年度業務計畫、年度預算及決算報告係由董事會審議，本中心應訂定年度業務計畫，因係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦彈性，爰第二項規定該年度業務計畫及其預算經董事會通過後，報請監督機關備查。"},{"bill":"201110072960000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度業務計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、條次變更。\n二、依第十一條第一款規定，發展目標及計畫之審議為董事會之職權，故本中心之發展目標及計畫，於報請監督機關核定前，應提經董事會通過，爰於第一項增列「提經董事會通過後」之規定。\n三、第二項未修正。"},{"bill":"201110072960000","text":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要處分。\n七、本中心違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、本中心遴派專業人員駐境外辦事之核准。\n十、其他依法律所為之監督。","note":"配合修正條文第十九條之一規定，增列第九款明定本中心遴派專業人員駐境外辦事之核准，為監督機關對本中心之監督權限事項，其後款次遞移，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十二條","current":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事之遴選及建議。\n六、董事、監事執行業務違反法令時，得為必要之處分。\n七、本中心違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、其他依法律所為之監督。","versions":[{"bill":"201110072960000","text":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要處分。\n七、本中心違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、本中心遴派專業人員駐境外辦事之核准。\n十、其他依法律所為之監督。","note":"監督機關對本中心之監督權限，包括財務、營運、人事、財產等監督，及於董事、監事於執行業務違反法令時，得為必要之處分。"},{"bill":"201110072960000","text":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要處分。\n七、本中心違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、本中心遴派專業人員駐境外辦事之核准。\n十、其他依法律所為之監督。","note":"一、條次變更。\n二、修正第五款至第七款，參考國家運動科學中心設置條例第二十一條第五款至第七款規定體例，酌作文字修正。\n三、配合修正條文第二十條規定，增列第九款明定本中心遴派專業人員駐境外辦事之核准，為監督機關對本中心之監督權限事項；其後款次遞移，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十三條","current":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本中心之績效評鑑；其學者專家及社會公正人士之人數不得少於二分之一。\n前項績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本中心年度執行成果之考核。\n二、本中心業務績效及目標達成率之評量。\n三、本中心年度自籌款比率達成率。\n四、本中心經費核撥之建議。\n五、其他有關事項。","versions":[{"bill":"201110072960000","text":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本中心之績效評鑑；其學者專家及社會公正人士之人數，不得少於二分之一。\n前項評鑑成員，任一性別不得少於總人數三分之一。\n第一項績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本中心年度執行成果之考核。\n二、本中心業務績效及目標達成率之評量。\n三、本中心年度自籌款比率達成率。\n四、本中心經費核撥之建議。\n五、其他有關事項。","note":"一、第一項明定監督機關應邀集有關機關（例如經濟部、國家科學及技術委員會或行政院公共工程委員會等）代表、學者專家及社會公正人士，辦理本中心績效評鑑，期評鑑結果更具公正性及客觀性。\n二、第二項明定評鑑成員之任一性別之保障比例。\n三、第三項授權監督機關訂定績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法。\n四、本中心公共事務之實施效能及權責是否相符，須有績效評鑑機制作為衡量依據。以本中心之績效評鑑，除評核其營運與效能及目標達成情形，作為監督機關未來核撥經費之參據外，亦透過評鑑機制對於本中心之營運給予指導，以確保其所負責之公共事務能適切實施並具有效能，爰於第四項明定績效評鑑內容，俾資依循。"},{"bill":"201110072960000","text":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本中心之績效評鑑；其學者專家及社會公正人士之人數，不得少於二分之一。\n前項評鑑成員，任一性別不得少於總人數三分之一。\n第一項績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本中心年度執行成果之考核。\n二、本中心業務績效及目標達成率之評量。\n三、本中心年度自籌款比率達成率。\n四、本中心經費核撥之建議。\n五、其他有關事項。","note":"一、條次變更。\n二、第一項酌作標點符號修正。\n三、為明確評鑑成員之性別比例，俾促進性別平權，爰增列第二項，明定評鑑成員之任一性別不得少於總人數三分之一。\n四、第二項移列為第三項，並為使本條授權監督機關訂定之績效評鑑辦法內容及範圍明確，爰增列授權之內容，包括「績效評鑑之成員資格條件、遴聘程序」；另配合第二項之增列，將「前項」修正為「第一項」。\n五、第三項移列為第四項，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十四條","current":"本中心會計年度，應與政府會計年度一致。\n本中心之會計制度，依行政法人會計制度設置相關法規訂定。\n本中心財務報表，應委請會計師進行查核簽證。","versions":[{"bill":"201110072960000","text":"本中心會計年度，應與政府會計年度一致。\n本中心之會計制度，依行政法人會計制度設置相關法規訂定。\n本中心財務報表，應委請會計師進行查核簽證。","note":"一、第一項明定本中心會計年度，應與政府會計年度一致。\n二、第二項明定本中心會計制度，依行政法人會計制度設置相關法規訂定，期各行政法人機構之會計制度達一致性及衡平性之標準。\n三、第三項明定本中心財務報表之查核方式，以確保其財務報表之公正性及專業性。"},{"bill":"201110072960000","text":"本中心會計年度，應與政府會計年度一致。\n本中心之會計制度，依行政法人會計制度設置相關法規訂定。\n本中心財務報表，應委請會計師進行查核簽證。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十五條","current":"本中心於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提交董事會審議，並經全體監事通過後，報請監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","versions":[{"bill":"201110072960000","text":"本中心於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提交董事會審議，並經全體監事通過後，報請監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","note":"一、第一項明定本中心年度執行成果及決算報告書，報請監督機關備查及送審計機關之程序及期限。\n二、顧及審計機關對本中心之審計監督權，並兼顧其自主性，爰於第二項明定本中心決算報告，審計機關得審計，審計結果，得送監督機關等為必要之處理。"},{"bill":"201110072960000","text":"本中心於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提交董事會審議，並經全體監事通過後，報請監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十六條","current":"本中心成立年度之政府核撥經費，得由監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","versions":[{"bill":"201110072960000","text":"本中心成立年度之政府核撥經費，得由監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","note":"考量本中心成立之年度，倘立法通過總預算案未及改以行政法人型態編列時，則預算執行時可能有跨單位預算、跨工作計畫及跨用途別執行之問題，為避免影響相關預算之執行，爰明定不受預算法流用限制。"},{"bill":"201110072960000","text":"本中心成立年度之政府核撥經費，得由監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十七條","current":"本中心設立時，因業務必要使用之公有不動產，由監督機關無償提供使用，設立時在興建中，於興建完成後為本中心業務必要使用之公有不動產者，亦同。因業務必要使用之公有動產，得由監督機關捐贈本中心或無償提供使用，採捐贈者，不適用預算法第二十五條、第二十六條、國有財產法第二十八條及第六十條相關規定。\n本中心設立後，因業務需要得價購公有不動產。土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項無償提供使用及前項之公有財產以外由本中心取得之財產，為自有財產。\n第一項無償提供使用及第三項公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關，不得任意處分。","versions":[{"bill":"201110072960000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制，其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關，不得任意處分。","note":"一、第一項：\n(一)明定本中心因業務必要使用之公有財產之取得方式及考量公有財產包括國有及地方所有之財產，爰規定不受土地法第二十五條規定「直轄市或縣（市）政府對於其所管公有土地，非經該管區內民意機關同意，並經行政院核准，不得處分或設定負擔或為超過十年期間之租賃。」國有財產法第二十八條規定「主管機關或管理機關對於公用財產不得為任何處分或擅為收益。但其收益不違背其事業目的或原定用途者，不在此限。」國有財產法第六十條規定「（第一項）在國外之國有財產，有贈與外國政府或其人民必要者，得層請行政院核准贈與之。（第二項）在國內之國有財產，其贈與行為以動產為限。但現為寺廟、教堂所使用之不動產，合於國人固有信仰，有贈與該寺廟、教堂依法成立之財團法人必要者，得贈與之。（第三項）前項贈與辦法，由行政院定之。」及地方政府公產管理法令相關規定之限制。\n(二)考量本中心為新設行政法人，須循預算程序成立後始正式運作，與原機關（構）改制之行政法人性質不同，無改制過渡期未及編列預算送立法院審議而須法規鬆綁，不受預算法第二十五條、第二十六條相關規定限制之情形，併予敘明。\n二、第二項明定本中心價購公有不動產之規定，並明定土地及地上建築改良物之價款計算基準。\n三、第三項明定以政府機關核撥經費指定用途所購置之財產，為公有財產。\n四、第四項明定自有財產範圍。\n五、第五項明定公有財產由本中心為管理者及收益列為本中心收入者，不受國有財產法第七條第一項規定「國有財產收益及處分，依預算程序為之；其收入應解國庫。」之限制，並由監督機關訂定其管理、使用、收益相關辦法。\n六、第六項明定公有財產用途廢止時，應移交各級政府公產管理機關接管。\n七、第七項明定本中心接受捐贈之公有不動產，於不需使用時之處理方式。"},{"bill":"201110072960000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關，不得任意處分。","note":"一、條次變更。\n二、第一項修正如下：\n(一)依第二項規定，本中心於設立後僅得以價購方式取得公有不動產，惟本中心經費籌措不易，價購公有不動產較為困難，復審酌本中心有持續擴充體育訓練設備及用地之需要，如未能由政府機關採捐贈、出租或無償提供使用公有財產，恐不利於本中心之業務推動，爰修正前段規定，本中心因業務必要使用之公有財產，不論係設立時或設立後，均得以價購或由政府機關採捐贈、出租或無償提供使用等方式為之。\n(二)依行政法人法第三十四條第一項規定「原機關（構）改制為行政法人業務上有必要使用之公有財產，得採捐贈、出租或無償提供使用等方式為之；採捐贈者，不適用預算法第二十五條及第二十六條、國有財產法第二十八條及第六十條相關規定。」按其立法意旨，係為行政法人改制之過渡期間，因業務上有必要使用公有財產，故就預算法、國有財產法作適度之鬆綁。惟本中心已設立多年，並無改制過渡期須鬆綁預算法規定之情形，爰刪除不適用「預算法第二十五條、第二十六條」之規定。\n(三)另因公有財產包括國有及直轄市、縣（市）政府所有之財產，爰於後段增列本中心受捐贈而取得公有財產，不受土地法第二十五條及地方政府公產管理法令相關規定之限制。\n三、配合第一項之修正，修正第二項，刪除前段有關本中心設立後僅得價購取得公有不動產規定，並酌修文字。\n四、配合第一項之修正，本中心因業務必要使用之公有財產，得由政府機關採出租方式為之，爰於第四項增列「出租、」等字，並酌作標點符號修正。\n五、修正第五項，就第一項無償提供使用及第三項公有財產，由本中心登記為管理人，其所生之收益，列為本中心之收入，增列不受地方政府公產管理法令相關規定之限制。\n六、第三項、第六項及第七項未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十八條","current":"政府機關核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n政府機關核撥之經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將其年度預算書，送立法院審議。","versions":[{"bill":"201110072960000","text":"政府機關核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n政府機關核撥之經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將其年度預算書，送立法院審議。\n本中心自主財源及其運用管理相關事項，由本中心訂定收支管理規章，報請監督機關備查。","note":"一、本中心除接受政府機關核撥經費外，亦有自主財源（例如委託研究或企業贊助），為明權責，爰於第一項明定政府機關核撥之經費，應依法定預算程序辦理，並受審計監督。\n二、第二項明定本中心年度預算書應送立法院審議之情形。\n三、第三項明定本中心自主財源及其運用管理相關事項規章之訂定程序。"},{"bill":"201110072960000","text":"政府機關核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n政府機關核撥之經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將其年度預算書，送立法院審議。\n本中心自主財源及其運用管理相關事項，由本中心訂定收支管理規章，報請監督機關備查。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、鑑於本中心仍有自主財源收入，且其使用管理亦須接受監督機關之監督，爰增列第三項，明定本中心應針對自主財源及其運用管理相關事項，訂定收支管理規章，並報請監督機關備查。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十九條","current":"本中心所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞者，應即檢討提出改善措施，報請監督機關核定。","versions":[{"bill":"201110072960000","text":"本中心所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"為避免本中心任意舉債而無力償還，衍生由政府概括承受債務之虞，同時為免未來計算整體政府債務有所爭議，明定其舉借之債務以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施報請監督機關核定。"},{"bill":"201110072960000","text":"本中心所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"一、條次變更。\n二、參考國家運動科學中心設置條例第二十八條規定體例，酌作文字修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十條","current":"本中心之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報請監督機關核定。\n前項應依政府採購法第四條規定辦理之採購，於其他法律另有規定者，從其規定。","versions":[{"bill":"201110072960000","text":"本中心之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條第一項所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報請監督機關核定。\n前項應依政府採購法第四條第一項規定辦理之採購，於其他法律另有規定者，從其規定。","note":"一、第一項明定本中心採購作業原則，除符合我國締結之條約、協定或政府採購法第四條第一項規定，應依各該規定辦理外，其餘不適用政府採購法之規定，使本中心運作更具彈性，並明定本中心採購作業實施規章之訂定程序。\n二、為因應政府採購法以外其他法律對於行政法人辦理採購另為規範之情形，爰明定第二項。"},{"bill":"201110072960000","text":"本中心之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條第一項所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報請監督機關核定。\n前項應依政府採購法第四條第一項規定辦理之採購，於其他法律另有規定者，從其規定。","note":"一、條次變更。\n二、配合一百零八年五月二十二日修正公布政府採購法，已於第四條增列第二項，故第一項及第二項援引政府採購法第四條規定應配合修正為「第四條第一項」。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十一條","current":"本中心之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本中心之董事長、執行長或相關主管至立法院報告營運狀況並備詢。","versions":[{"bill":"201110072960000","text":"本中心之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本中心之董事長、執行長或相關主管至立法院報告營運狀況並備詢。","note":"一、第一項明定本中心之相關資訊，應依政府資訊公開法規定公開之，其年度財務報表、年度業務資訊及年度績效評鑑報告，並應主動公開，其方式可包括刊載於新聞紙或其他出版品；利用電信網路或其他方式供公眾線上查詢及提供公開閱覽、抄錄、影印、錄音、錄影或攝影等。\n二、第二項明定監督機關應提交績效評鑑分析報告，送立法院備查。必要時，立法院得要求本中心之董事長、執行長或相關主管報告及備詢。"},{"bill":"201110072960000","text":"本中心之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本中心之董事長、執行長或相關主管至立法院報告營運狀況並備詢。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十二條","current":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","versions":[{"bill":"201110072960000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其定位為公法人，人民對於本中心行使公權力所為行政處分不服時，明定得依訴願法規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"201110072960000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十三條","current":"本中心因情事變更或績效不彰，致不能達成其設立目的時，由監督機關提請行政院同意後解散之。\n本中心解散時，其人員應終止契約；其賸餘財產繳庫；其相關債務由監督機關概括承受。","versions":[{"bill":"201110072960000","text":"本中心因情事變更或績效不彰，致不能達成其設立目的時，由監督機關提請行政院同意後解散之。\n本中心解散時，其人員應終止契約；其賸餘財產歸屬國庫；其相關權利義務，由監督機關概括承受。","note":"一、第一項明定本中心解散之條件及其程序。\n二、第二項明定本中心解散時，有關人員、賸餘財產及相關權利義務之處理方式。"},{"bill":"201110072960000","text":"本中心因情事變更或績效不彰，致不能達成其設立目的時，由監督機關提請行政院同意後解散之。\n本中心解散時，其人員應終止契約；其賸餘財產歸屬國庫；其相關權利義務，由監督機關概括承受。","note":"一、條次變更。\n二、第一項未修正。\n三、參考國家運動科學中心設置條例第三十二條第二項規定體例，將「繳庫」修正為「歸屬國庫」；「債務」修正為「權利義務」，並酌作文字修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十四條","current":"本條例施行日期，由行政院定之。","versions":[{"bill":"201110072960000","text":"本條例施行日期，由行政院定之。","note":"本條例之施行日期。"},{"bill":"201110072960000","text":"本條例施行日期，由行政院定之。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2024-02-23","stage":"一讀","code":"院會-11-1-2","bill":"202110005960000","gazref":"113卷004期5186號 265-265頁"},{"date":"2024-03-01","stage":"一讀","code":"院會-11-1-3","bill":"202110006840000","gazref":"113卷005期5187號 7-8頁"},{"date":"2024-10-25","stage":"一讀","code":"院會-11-2-6","bill":"202110072930000","gazref":"113卷084期5266號 15-15頁"},{"date":"2024-11-01","stage":"一讀","code":"院會-11-2-7","bill":"202110074050000","gazref":"113卷088期5270號 9-9頁"},{"date":"2024-11-01","stage":"一讀","code":"院會-11-2-7","bill":"202110074480000","gazref":"113卷088期5270號 12-12頁"},{"date":"2024-11-01","stage":"一讀","code":"院會-11-2-7","bill":"201110072960000","gazref":"113卷088期5270號 13-13頁"},{"date":"2024-11-08","stage":"一讀","code":"院會-11-2-8","bill":"202110076230000","gazref":"113卷091期5273號一冊 18-18頁"},{"date":"2024-11-08","stage":"一讀","code":"院會-11-2-8","bill":"202110075680000","gazref":"113卷091期5273號一冊 19-19頁"},{"date":"2024-11-08","stage":"一讀","code":"院會-11-2-8","bill":"202110075930000","gazref":"113卷091期5273號一冊 20-20頁"},{"date":"2024-11-08","stage":"一讀","code":"院會-11-2-8","bill":"202110074150000","gazref":"113卷091期5273號一冊 21-21頁"},{"date":"2024-11-13","code":"聯席會議-11-2-36,22-1","title":"第11屆第2會期司法及法制、教育及文化委員會第1次聯席會議","gazref":"113卷098期5280號 247-474頁","stage":"委員會審查","ppg":"https://ppg.ly.gov <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);
  fillBench($('bench'), a);
}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }
  const bench = el('div', {class: 'bench'});
  panel.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  fillBench(bench, a);
}
D.arts.forEach(a => {
  const btn = el('button', {type: 'button', 'data-no': a.no, class: 'chip' + (a.changed ? ' passed' : ''), text: a.no});
  btn.addEventListener('click', () => { current = a.no; showArticle(); });
  $('artnav').append(btn);
});
showArticle();

/* ---------- 提案版本 ---------- */
const partyLine = p => p.party.map(([n]) => n).join('、');
function people(p, role, label) {   // 一列名單：姓名後面標黨籍
  const list = (p.people || []).filter(x => x[2] === role);
  if (!list.length) return null;
  const box = el('div', {class: 'people'});
  list.forEach(([n, pt]) => box.append(el('span', {class: 'person'}, n, el('small', {text: pt}))));
  const peek = role === '提案' ? list.map(x => x[0]).join('、') : null;   // 只有提案人收合時預覽姓名
  return fold(label + ' ' + list.length + ' 位', box, peek);
}
function fold(label, content, peek) {   // 點開才看全文；有 peek 時收合狀態露一行預覽
  const s = el('summary', null, el('b', {text: label}));
  if (peek) s.append(el('span', {class: 'peek', text: peek}));
  return el('details', {class: 'fold'}, s, content);
}
const dlg = el('dialog', {class: 'artdlg', 'aria-labelledby': 'dlgt'});
document.body.append(dlg);
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openArticleDialog(p, no) {   // 獨立視窗看某一條的各版本，可在該提案動到的條文間切換
  dlg.textContent = '';
  const close = el('button', {type: 'button', class: 'chip', text: '關閉 ✕'});
  close.addEventListener('click', () => dlg.close());
  const nav = el('div', {class: 'chips'});
  p.arts.forEach(n => {
    const art = D.arts.find(x => x.no === n);
    const b = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-pressed': String(n === no), text: n});
    b.addEventListener('click', () => openArticleDialog(p, n));
    nav.append(b);
  });
  const body = el('div', {class: 'dlgbody'});
  const a = D.arts.find(x => x.no === no);
  if (a) {
    const bench = el('div', {class: 'bench'});
    fillBench(bench, a);
    body.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  } else body.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'}));
  dlg.append(el('div', {class: 'dlghead'}, el('div', {class: 'dlgtitle'}, el('h3', {id: 'dlgt', text: shortWho(p) + ' 提案　逐條對照'}), close), nav), body);
  if (!dlg.open) dlg.showModal();
}
function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照
  const c = el('div', {class: 'pdetail'});
  c.append(el('div', {class: 'line', text: p.date + ' 提案　' + partyLine(p)}));
  const a = people(p, '提案', '提案人'), b = people(p, '連署', '連署人');
  if (a) c.append(a);
  if (b) c.append(b);
  if (p.reason) { const r = p.reason.replace(/\n/g, ' '); c.append(fold('修法目的', el('p', {class: 'reason', text: r}))); }
  const chips = el('div', {class: 'sub'}, (ENACT ? '條文' : '修正條文' + (inProps ? '' : '（按鈕若是紅色代表真的修正了）')) + '：');
  const panel = el('div', {class: 'inbench', hidden: ''});
  let shown = null;
  p.arts.forEach(no => {
    const art = D.arts.find(x => x.no === no);
    const btn = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-expanded': 'false', text: no});
    btn.addEventListener('click', () => {
      if (inProps) { openArticleDialog(p, no); return; }
      const closing = shown === no;
      chips.querySelectorAll('button').forEach(x => x.setAttribute('aria-expanded', 'false'));
      panel.textContent = ''; panel.hidden = closing; shown = closing ? null : no;
      if (!closing) { btn.setAttribute('aria-expanded', 'true'); inlineBench(panel, no); }
    });
    chips.append(btn);
  });
  c.append(chips, panel);
  const ref = el('div', {class: 'ref'}, link(p.url, '議事網提案頁'));
  if (p.pdf) ref.append('、', link(p.pdf, '關係文書 PDF'));

}
D.props.forEach(p => {
  const c = el('article', {class: 'prop', id: 'prop-' + p.id});
  c.append(el('h3', {text: shortWho(p)}), propDetail(p, true));
