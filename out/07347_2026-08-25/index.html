關法規之研訂。\n三、兒童、少年與家庭支持之服務資源之規劃、推動與執行及相關法規之研訂。\n四、兒童、少年與家庭托育服務資源政策之規劃、推動與執行及相關法規之研訂。\n五、兒童權利公約之推動、協調及聯繫。\n六、兒童、少年健康促進、保健、防治政策之規劃。\n七、早期療育之規劃、推動及執行。\n八、兒童、少年福利機構業務之監督、輔導及考核。\n九、兒童、少年與家庭支持業務之資通訊應用發展、國際合作及交流。\n十、兒童、少年與家庭支持福利服務事項之監督、輔導及考核。\n十一、其他有關兒童、少年福利與權益、健康促進及家庭支持福利服務事項。","note":"權限與職掌。"},{"bill":"202110222810000","text":"本署掌理下列事項：\n一、兒童、少年福利與權益、家庭福利服務政策之規劃、推動與執行及相關法規之研訂。\n二、兒童、少年保護、安置與照顧政策之規劃、推動與執行及相關法規之研訂。\n三、兒童、少年與家庭支持之服務資源之規劃、推動與執行及相關法規之研訂。\n四、兒童、少年與家庭托育服務資源政策之規劃、推動與執行及相關法規之研訂。\n五、兒童權利公約之推動、協調及聯繫。\n六、兒童、少年健康促進、保健、防治政策之規劃。\n七、兒童少年心理健康促進、心理韌性培力、心理狀況之早期辨識、預防支持、資源轉介及跨機關服務整合之規劃、推動與執行。\n八、早期療育之規劃、推動及執行。\n九、兒童、少年福利機構業務之監督、輔導及考核。\n十、兒童、少年與家庭支持業務之資通訊應用發展、國際合作及交流。\n十一、兒童、少年與家庭支持福利服務事項之監督、輔導及考核。\n十二、其他有關兒童、少年福利與權益、健康促進及家庭支持福利服務事項。","note":"本署職掌。"},{"bill":"201110179390001","text":"本部掌理下列事項：\n一、衛生福利政策、法令、資源之規劃、管理、監督與相關事務之調查研究、管制考核、政策宣導、科技發展及國際合作。\n二、全民健康保險及國民年金業務之監理。\n三、社會救助、社會工作、社會資源運用與社區發展之政策規劃、管理及監督。\n四、家庭暴力、性侵害、性騷擾防治與其他保護服務業務之政策規劃、管理及監督。\n五、醫事人員、醫事機構、醫事團體與全國醫療網、緊急醫療業務之政策規劃、管理及督導。\n六、護理政策、法令之規劃、管理、監督及研究。\n七、原住民族及離島居民醫療、健康照顧（護）、醫護人力培育、疾病防治之政策與法令規劃、管理、監督及研究。\n八、心理健康、精神疾病防治相關政策與物質成癮防治之政策規劃、管理及監督。\n九、中醫藥發展、民俗調理之政策規劃、管理、監督及研究。\n十、口腔健康與醫療照護之政策規劃、管理、監督及研究。\n十一、所屬醫療機構之督導、協調及推動。\n十二、其他有關衛生福利事項。","note":"為應我國邁入超高齡化社會，高齡照顧所面臨之壓力及人力資源挑戰日益嚴峻；又鑒於少子女化情況日益嚴重，我國亟需強化兒童及少年之健康促進及福利保障，有通盤調整衛生福利部（以下簡稱本部）及所屬機關（單位）掌理事項之必要，爰修正本條部分款次內容如下：\n一、第二款全民健康保險業務監理以外之業務移撥中央健康保險署、部分國民年金業務與長期照顧（護）業務移撥修正條文第五條第六款新設之次級機關長期照顧及社會發展署，爰酌修第二款文字。\n二、第三款生育照護業務移撥國民健康署，托育照護業務移撥修正條文第五條第五款新設之次級機關兒少及家庭支持署，爰刪除之。\n三、第四款至第六款，依次遞移為第三款至第五款，內容未修正。\n四、第七款移列為第六款，長期照顧（護）服務及早期療育業務分別移撥長期照顧及社會發展署與兒少及家庭支持署，爰刪除上開業務，另酌修文字。\n五、第八款至第十款依序遞移為第七款至第九款，其中第八款及第九款酌修文字，餘內容未修正。\n六、調整第十一款及第十二款款次順序，分列為第十一款及第十款。第十款酌作文字修正；第十一款配合國家中醫藥研究所擬改制為行政法人，爰刪除「中醫藥研究」文字；另社會福利機構相關業務移撥兒少及家庭支持署與長期照顧及社會發展署，爰刪除「與社會福利機構」文字。\n七、第十三款移列為第十二款，內容未修正。"},{"bill":"201110179390001","text":"本署掌理下列事項：\n一、兒童、少年福利與權益、家庭福利服務政策之規劃、推動與執行及相關法規之研訂。\n二、兒童、少年保護、安置與照顧政策之規劃、推動與執行及相關法規之研訂。\n三、兒童、少年與家庭支持之服務資源之規劃、推動與執行及相關法規之研訂。\n四、兒童、少年與家庭托育服務資源政策之規劃、推動與執行及相關法規之研訂。\n五、兒童權利公約之推動、協調及聯繫。\n六、兒童、少年健康促進、保健、防治政策之規劃。\n七、早期療育之規劃、推動及執行。\n八、兒童、少年福利機構業務之監督、輔導及考核。\n九、兒童、少年與家庭支持業務之資通訊應用發展、國際合作及交流。\n十、兒童、少年與家庭支持福利服務事項之監督、輔導及考核。\n十一、其他有關兒童、少年福利與權益、健康促進及家庭支持福利服務事項。","note":"本署之權限職掌。"},{"bill":"201110179390001","text":"本署掌理下列事項：\n一、長期照顧（護）、老人、身心障礙者、婦女福利服務政策之規劃、推動與執行及相關法規之研訂。\n二、長期照顧（護）、老人、身心障礙者、婦女福利服務資源之規劃、推動與執行及相關法規之研訂。\n三、長期照顧（護）、老人、身心障礙者、婦女之權益保障與社會參與之規劃、推動及執行。\n四、身心障礙者權利公約之推動、協調及聯繫。\n五、社會福利財團法人與長期照顧服務機構法人相關法規之研訂、推動及執行。\n六、社會福利公益信託之設立、變更、撤銷與廢止、監督、輔導、財務查核、相關法規之研訂、推動及執行。\n七、長期照顧（護）、老人、身心障礙服務機構業務之監督、輔導及考核。\n八、國民年金之規劃、推動與執行及相關法規之研訂。\n九、長期照顧（護）、老人、身心障礙者、婦女與國民年金業務之資通訊應用發展、國際合作及交流。\n十、長期照顧（護）、老人、身心障礙者、婦女福利服務事項之監督、輔導及考核。\n十一、其他有關長期照顧（護）、老人、身心障礙者、婦女福利與權益服務及國民年金事項。","note":"本署之權限職掌。"},{"bill":"201110179390001","text":"本署掌理下列事項：\n一、全民健康保險政策之規劃、執行及相關法規之研擬。\n二、全民健康保險承保業務之研擬、規劃及執行。\n三、全民健康保險財務業務之研擬、規劃及執行。\n四、全民健康保險醫療給付業務、醫療費用支付業務及醫務管理業務之研擬、規劃及執行。\n五、全民健康保險藥品特材業務之研擬、規劃及執行。\n六、全民健康保險醫療服務審查業務與醫療品質提升業務之研擬、規劃及執行。\n七、全民健康保險資訊業務之研擬、規劃及執行。\n八、其他有關全民健康保險業務事項。","note":"為提升全民健康保險（以下簡稱健保）制度整體效能，將衛生福利部社會保險司掌理之健保政策規劃、執行及相關法規研擬等業務，整併至衛生福利部中央健康保險署；另為強化政策及執行之一致性，爰將現行第六款整併至第一款並酌修文字；第一款至第五款遞移為第二款至第六款，內容未修正；第七款及第八款未修正。"},{"bill":"201110179390001","text":"本中心為行政法人；其監督機關為衛生福利部。\n衛生福利部得指定專責機關督導本中心業務。","note":"一、第一項定明本中心之組織型態及監督機關。\n二、第二項定明得由衛生福利部指定專責機關督導本中心。"},{"bill":"201110179390001","text":"本院為行政法人；其監督機關為衛生福利部。","note":"定明本院組織型態及監督機關。"}],"changed":true,"final":"本署掌理下列事項：\n一、兒童及少年福利與權益、家庭福利服務政策之規劃、推動與執行及相關法規之研擬。\n二、兒童及少年保護、安置、自立支持與照顧政策之規劃、推動與執行及相關法規之研擬。\n三、兒童及少年與家庭支持服務資源之規劃、推動與執行及相關法規之研擬。\n四、生育及托育服務資源政策之規劃、推動與執行及相關法規之研擬。\n五、兒童權利公約之推動、協調、聯繫及督導影響評估之執行。\n六、兒童及少年遊憩、遊戲及休閒政策之推動與協調。\n七、兒童及少年偏差行為輔導之跨機關政策協調與整合。\n八、兒童及少年權益之發展與促進，暨其參與公共事務相關政策之規劃、推動與執行及相關法規之研擬。\n九、兒童及少年之生命統計、身心健康促進、預防保健、事故傷害防制及醫療照護政策之規劃、推動、執行及協調。\n十、早期療育之規劃、推動及執行。\n十一、兒童及少年福利機構業務之監督、輔導及考核。\n十二、兒童及少年與家庭支持業務之資通訊應用發展、國際合作及交流。\n十三、兒童及少年與家庭支持福利服務事項之跨機關政策協調、整合、監督、輔導及考核。\n十四、兒童及少年網路安全與個人資料權益維護之規劃、執行及跨機關政策協調。\n十五、其他有關兒童及少年福利與權益、健康促進及家庭支持福利服務事項。","finalWhy":"一、本署之權限職掌。\n二、兒少健康為國家發展基石，呼應世界衛生組織所揭示健康之定義為「在生理、心理及社會方面均安適的狀態」，著重兒少身心與社會面向之健康平衡發展，將落實執行兒童死因回溯分析，藉由衛社政協作，建構健康安全防護網，全面保障兒少健康與福祉。\n三、為促進兒少發展與提供兒少適切之處遇及協助，少年事件處理法、學生輔導法、特殊教育法及其授權辦法已分別明訂兒少行為由法定之專業體系及權責機關處理。為強化機關分工合作，爰於第七款明訂跨機關政策協調與整合，以落實兒少輔導工作。","review":null},{"no":"第三條","current":null,"versions":[{"bill":"202110180390000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"201110179390000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"201110179390000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"201110179390000","text":"本中心之業務範圍如下：\n一、發展與建立醫療科技評估方法及指引。\n二、辦理全民健康保險醫療服務與藥物給付項目及支付之醫療科技評估、審查。\n三、辦理醫療科技評估相關研究及提供諮詢服務。\n四、辦理醫療科技評估人才培訓及推廣。\n五、辦理國內外醫療科技評估之交流合作。\n六、辦理健康政策評估及研究之相關諮詢。\n七、其他與醫療科技評估相關之事項。\n前項第二款之審查作業及其他相關事項之辦法，由監督機關定之。","note":"一、本中心之業務範圍。\n二、醫療科技評估可應用於藥品、醫療器材、手術處置、健康政策或健康系統等範疇，以融合多元學科方法學所形成之明確方法，評估醫療科技在其生命週期不同時間點之價值，作為決策者進行決策時之實證依據。為使醫療科技評估之執行方法有所依循，本中心參酌國際相關方法學指引與我國國情及發展現況建立醫療科技評估之系統性文獻回顧、成本效益分析及預算衝擊分析等方法指引，並定期檢討更新，爰定明第一款。\n三、依據全民健康保險醫療服務給付項目及支付標準、全民健康保險藥物給付項目及支付標準相關規定，保險人得先辦理醫療科技評估；而基於本中心為協助辦理醫療服務與藥物醫療科技評估及審查之專責單位，爰定明第二款。\n四、為辦理相關衛生主管機關委託研究以協助政策研議及評估，並提供廠商醫療科技評估相關諮詢服務，以利健保給付建議送審資料之完備性，以及協助我國生技醫療產業之發展，爰定明第三款。\n五、醫療科技評估專業人才需求日增，為培育醫療科技評估專業人才及提升評估量能，爰定明第四款。\n六、第五款之國內外醫療科技評估之交流合作業務，包括如下：\n(一)合作網絡建立，與國際醫療科技評估組織、國內外政府機構、國內外學術機構及行業組織建立合作關係，以促進知識交流和共享。\n(二)參與或發起跨國界之聯合研究項目，探討醫療科技評估之新方法、技術和應用，並共享研究成果。\n(三)辦理或出席國際會議及研討會，以促進醫療科技評估領域之學術交流和專業合作。\n(四)邀請國際專家來訪，以促進經驗與知識之互相學習和分享等。\n七、醫療科技評估可運用於健康政策或健康系統等範疇，爰定明第六款，作為辦理衛生福利部健康政策醫療科技評估、研究相關諮詢之依據。\n八、辦理第一項第二款所定醫療科技評估之審查收入應依監督機關規定辦理，爰於第二項規定審查作業等事項之辦法，由監督機關定之。"},{"bill":"201110179390000","text":"本院之業務範圍如下：\n一、中醫醫療業務之執行、推廣及臨床研究。\n二、中醫診療儀器及軟體之研發。\n三、中醫基礎醫學之研究。\n四、中藥製程、製劑、藥理、檢驗之研究。\n五、藥用植物種植研究及教育之推廣。\n六、中醫藥典籍、文物之典藏、研究及教育推廣。\n七、國內外中醫藥科技研究合作及科技專業人才培訓。\n八、中醫藥研發產品銷售、技術移轉及技術服務。\n九、其他與中醫相關之事項。","note":"一、第一款所定中醫醫療業務及臨床研究，包括中醫臨床醫療技術、診斷基準與療效評估之研究及開發。\n二、第二款所定中醫診療儀器及軟體之研發，係應用現代科學技術方法，對中醫診斷所依據之望、聞、問、切四診資料進行採集、分析與處理之儀器及應用軟體之研究及開發。\n三、第三款所定中醫基礎醫學之研究，係應用現代科學方法及技術，針對中醫傳統醫學理論進行研究及現代醫學轉譯。\n四、第四款所定中藥製程、製劑、藥理、檢驗研究業務，包括中藥製程、研製、劑型、組方、製劑品質基準及療效評估等研究；中藥藥理、毒理、相關安全性與其他藥物化學有關之研究及開發；中藥藥理成分之分離、純化、鑑定；中藥、中草藥鑑定與標準品之研究及檢驗業務。\n五、第五款所定藥用植物種植研究及教育推廣，包括與農業研究機構合作分工推動藥用植物育種、種原永續發展及開發創新利用。\n六、第六款所定中醫藥典籍、文物之典藏、研究及教育推廣，包括中醫藥典籍、文獻、歷史資料、文物之收集、保存、分析研究及數位發展應用。\n七、藉由本院研究資源，連結並促進國內外中醫藥科技研究合作及科技專業人才培訓，爰為第七款規定。\n八、第八款所定中醫藥研發產品技術服務，包括產業升級輔導服務、支援產業發展及法規推動之需求，並涵括運用中醫相關研究或技術服務，例如以本院科技研發產品，提供產品銷售、技術移轉及技術服務輔導等，促進全民享用智慧成果，增進公共利益及產業升級發展。"},{"bill":"202110181520000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110181410000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110180890000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110182740000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110182950000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110184050000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110184650000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110186400000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110186730000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110186260000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110185560000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110185440000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110199460000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110200600000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110216900000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110221610000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"202110222810000","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"201110179390001","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"201110179390001","text":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等及員額。"},{"bill":"201110179390001","text":"本中心之業務範圍如下：\n一、發展與建立醫療科技評估方法及指引。\n二、辦理全民健康保險醫療服務與藥物給付項目及支付之醫療科技評估、審查。\n三、辦理醫療科技評估相關研究及提供諮詢服務。\n四、辦理醫療科技評估人才培訓及推廣。\n五、辦理國內外醫療科技評估之交流合作。\n六、辦理健康政策評估及研究之相關諮詢。\n七、其他與醫療科技評估相關之事項。\n前項第二款之審查作業及其他相關事項之辦法，由監督機關定之。","note":"一、本中心之業務範圍。\n二、醫療科技評估可應用於藥品、醫療器材、手術處置、健康政策或健康系統等範疇，以融合多元學科方法學所形成之明確方法，評估醫療科技在其生命週期不同時間點之價值，作為決策者進行決策時之實證依據。為使醫療科技評估之執行方法有所依循，本中心參酌國際相關方法學指引與我國國情及發展現況建立醫療科技評估之系統性文獻回顧、成本效益分析及預算衝擊分析等方法指引，並定期檢討更新，爰定明第一款。\n三、依據全民健康保險醫療服務給付項目及支付標準、全民健康保險藥物給付項目及支付標準相關規定，保險人得先辦理醫療科技評估；而基於本中心為協助辦理醫療服務與藥物醫療科技評估及審查之專責單位，爰定明第二款。\n四、為辦理相關衛生主管機關委託研究以協助政策研議及評估，並提供廠商醫療科技評估相關諮詢服務，以利健保給付建議送審資料之完備性，以及協助我國生技醫療產業之發展，爰定明第三款。\n五、醫療科技評估專業人才需求日增，為培育醫療科技評估專業人才及提升評估量能，爰定明第四款。\n六、第五款之國內外醫療科技評估之交流合作業務，包括如下：\n(一)合作網絡建立，與國際醫療科技評估組織、國內外政府機構、國內外學術機構及行業組織建立合作關係，以促進知識交流和共享。\n(二)參與或發起跨國界之聯合研究項目，探討醫療科技評估之新方法、技術和應用，並共享研究成果。\n(三)辦理或出席國際會議及研討會，以促進醫療科技評估領域之學術交流和專業合作。\n(四)邀請國際專家來訪，以促進經驗與知識之互相學習和分享等。\n七、醫療科技評估可運用於健康政策或健康系統等範疇，爰定明第六款，作為辦理衛生福利部健康政策醫療科技評估、研究相關諮詢之依據。\n八、辦理第一項第二款所定醫療科技評估之審查收入應依監督機關規定辦理，爰於第二項規定審查作業等事項之辦法，由監督機關定之。"},{"bill":"201110179390001","text":"本院之業務範圍如下：\n一、中醫醫療業務之執行、推廣及臨床研究。\n二、中醫診療儀器及軟體之研發。\n三、中醫基礎醫學之研究。\n四、中藥製程、製劑、藥理、檢驗之研究。\n五、藥用植物種植研究及教育之推廣。\n六、中醫藥典籍、文物之典藏、研究及教育推廣。\n七、國內外中醫藥科技研究合作及科技專業人才培訓。\n八、中醫藥研發產品銷售、技術移轉及技術服務。\n九、其他與中醫相關之事項。","note":"一、第一款所定中醫醫療業務及臨床研究，包括中醫臨床醫療技術、診斷基準與療效評估之研究及開發。\n二、第二款所定中醫診療儀器及軟體之研發，係應用現代科學技術方法，對中醫診斷所依據之望、聞、問、切四診資料進行採集、分析與處理之儀器及應用軟體之研究及開發。\n三、第三款所定中醫基礎醫學之研究，係應用現代科學方法及技術，針對中醫傳統醫學理論進行研究及現代醫學轉譯。\n四、第四款所定中藥製程、製劑、藥理、檢驗研究業務，包括中藥製程、研製、劑型、組方、製劑品質基準及療效評估等研究；中藥藥理、毒理、相關安全性與其他藥物化學有關之研究及開發；中藥藥理成分之分離、純化、鑑定；中藥、中草藥鑑定與標準品之研究及檢驗業務。\n五、第五款所定藥用植物種植研究及教育推廣，包括與農業研究機構合作分工推動藥用植物育種、種原永續發展及開發創新利用。\n六、第六款所定中醫藥典籍、文物之典藏、研究及教育推廣，包括中醫藥典籍、文獻、歷史資料、文物之收集、保存、分析研究及數位發展應用。\n七、藉由本院研究資源，連結並促進國內外中醫藥科技研究合作及科技專業人才培訓，爰為第七款規定。\n八、第八款所定中醫藥研發產品技術服務，包括產業升級輔導服務、支援產業發展及法規推動之需求，並涵括運用中醫相關研究或技術服務，例如以本院科技研發產品，提供產品銷售、技術移轉及技術服務輔導等，促進全民享用智慧成果，增進公共利益及產業升級發展。"}],"changed":true,"final":"本署置署長一人，職務比照簡任第十三職等或列簡任第十三職等；副署長二人，職務列簡任第十二職等。\n前項署長之任用以常務職務者為優先。","finalWhy":"本署首長、副首長之職稱、官職等及員額。","review":null},{"no":"第四條","current":null,"versions":[{"bill":"202110180390000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"201110179390000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"201110179390000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"201110179390000","text":"本中心經費來源如下：\n一、政府預算之核撥及捐（補）助。\n二、受託研究、提供諮詢服務及審查收入。\n三、營運及研發成果收入。\n四、國內外公私立機構、團體及個人捐贈。\n五、其他收入。\n前項第四款之捐贈，視同對政府之捐贈。","note":"一、第一項定明本中心經費來源。\n二、為鼓勵民間企業、團體及個人捐助本中心，以挹注及充實本中心預算經費，爰於第二項定明國內外公私立機構、團體及個人對本中心之捐贈，視同對政府之捐贈，俾捐贈者依所得稅法第十七條及第三十六條規定，於申報所得稅時列舉扣除或列為費用，不受金額限制。"},{"bill":"201110179390000","text":"本院辦理前條第一款業務，得附設疑難病症中醫研究教學醫療機構。\n本院對前項醫療機構應訂定管理及監督規章，提經本院董事會通過後，報監督機關備查。","note":"一、為本院執行第三條第一款所定業務，推動傳統醫藥臨床研究及促進中醫多元醫療服務，爰於第一項定明本院得附設中醫研究教學醫療機構，針對疑難病症之診療進行研發，且以轉診病患為限。\n二、第二項定明本院應對第一項醫療機構訂定管理及監督規章，提經本院董事會通過，並報監督機關備查。\n三、第一項醫療機構除依本條例相關規定受本院管理及監督外，其設立及管理等事項並應符合醫療法及其相關法規之規定，併上敘明。"},{"bill":"202110181520000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110181410000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110180890000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110182740000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110182950000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110184050000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110184650000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110186400000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110186730000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110186260000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110185560000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110185440000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110199460000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110200600000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110216900000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110221610000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"202110222810000","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"201110179390001","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"201110179390001","text":"本署置主任秘書，職務列簡任第十一職等。","note":"本署幕僚長之職稱及官職等。"},{"bill":"201110179390001","text":"本中心經費來源如下：\n一、政府預算之核撥及捐（補）助。\n二、受託研究、提供諮詢服務及審查收入。\n三、營運及研發成果收入。\n四、國內外公私立機構、團體及個人捐贈。\n五、其他收入。\n前項第四款之捐贈，視同對政府之捐贈。","note":"一、第一項定明本中心經費來源。\n二、為鼓勵民間企業、團體及個人捐助本中心，以挹注及充實本中心預算經費，爰於第二項定明國內外公私立機構、團體及個人對本中心之捐贈，視同對政府之捐贈，俾捐贈者依所得稅法第十七條及第三十六條規定，於申報所得稅時列舉扣除或列為費用，不受金額限制。"},{"bill":"201110179390001","text":"本院辦理前條第一款業務，得附設疑難病症中醫研究教學醫療機構。\n本院對前項醫療機構應訂定管理及監督規章，提經本院董事會通過後，報監督機關備查。","note":"一、為本院執行第三條第一款所定業務，推動傳統醫藥臨床研究及促進中醫多元醫療服務，爰於第一項定明本院得附設中醫研究教學醫療機構，針對疑難病症之診療進行研發，且以轉診病患為限。\n二、第二項定明本院應對第一項醫療機構訂定管理及監督規章，提經本院董事會通過，並報監督機關備查。\n三、第一項醫療機構除依本條例相關規定受本院管理及監督外，其設立及管理等事項並應符合醫療法及其相關法規之規定，併上敘明。"}],"changed":true,"final":"本署置主任秘書，職務列簡任第十一職等。","finalWhy":"本署幕僚長之職稱及官職等。","review":null},{"no":"第五條","current":"本部之次級機關及其業務如下：\n一、疾病管制署：規劃與執行傳染病之預防及管制事項。\n二、食品藥物管理署：規劃與執行食品、藥物與化粧品之管理、查核及檢驗事項。\n三、中央健康保險署：規劃及執行全民健康保險事項。\n四、國民健康署：規劃與執行國民健康促進及非傳染病之防治事項。\n五、社會及家庭署：規劃、與執行老人、身心障礙者、婦女、兒童及少年福利及家庭支持事項。\n六、國民年金局：執行國民年金事項。\n國民年金局未設立前，其業務得委託其他政府機關（構）執行。","versions":[{"bill":"202110180390000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"201110179390000","text":"本部之次級機關及其業務如下：\n一、疾病管制署：規劃與執行傳染病之預防及管制事項。\n二、食品藥物管理署：規劃與執行食品、藥物、化粧品之管理、查核及檢驗事項。\n三、中央健康保險署：規劃及執行全民健康保險事項。\n四、國民健康署：規劃與執行生育照護、國民健康促進及非傳染病之防治事項。\n五、兒少及家庭支持署：規劃與執行托育照、護、早期療育、兒童、少年福利與權益保障、家庭支持服務及健康促進事項。\n六、長期照顧及社會發展署：規劃與執行長期照顧（護）、老人、身心障礙者、婦女權益與福利及國民年金事項。","note":"一、配合本部業務調整、刪除第五款社會及家庭署及其業務；增設「兒少及家庭支持署」及「長期照顧及社會發展署」，爰增訂第五款及第六款，並將業務依其權責重新劃分。\n二、考量本部國民年金業務係依國民年金法第四條規定委託勞動部勞工保險局辦理，已確立不成立國民年金局，爰刪除第六款及第二項文字，第一項列為本條規定。"},{"bill":"201110179390000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"201110179390000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"201110179390000","text":"本中心應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報監督機關備查。\n本中心就執行之公共事務，於不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報監督機關備查。","note":"一、為期本中心得以有效運作，並具一定程度之自主性，爰於第一項定明本中心組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報監督機關備查。\n二、本中心肩負執行特定公共事務之使命，爰於第二項定明本中心就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，可訂定對外發生效力之規章，並提經董事會通過後，報監督機關備查。"},{"bill":"201110179390000","text":"本院經費來源如下：\n一、政府預算之核撥及捐（補）助。\n二、國內外公私立機構、團體及個人之捐贈。\n三、受託研究及提供服務之收入。\n四、營運及研發成果收入。\n五、其他收入。\n前項第二款之捐贈，視同對政府之捐贈。","note":"一、第一項定明本院之經費來源。\n二、第二項定明國內外公私立機構、團體及個人對本院之捐贈，視同對政府之捐贈，俾捐贈者依所得稅法第十七條及第三十六條規定，於申報所得稅時列舉扣除或列為費用，不受金額限制，以鼓勵民間企業、團體或個人樂於捐贈本院，挹注及充實本院預算經費。又所定「公私立機構」包括營利事業及非營利事業。"},{"bill":"202110181520000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"本署各職稱之官等職等及員額，另以編制表定之。"},{"bill":"202110181410000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110180890000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"雖《中央政府機關總員額法》第六條已授權各機關訂定編制表，惟若僅於第三條及第四條規定首長、副首長及幕僚長之配置，尚不足以完整呈現機關人員配置與運作情形，爰於本條予以重申。"},{"bill":"202110182740000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110182950000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110184050000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110184650000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110186400000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110186730000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"雖中央政府機關總員額法第六條已授權各機關自行訂定編制表，然考量本法第三條及第四條僅就首長、副首長及幕僚長之職位進行規範，尚難據以評估機關整體員額配置與運作實務。為求機關組織架構之完整性及透明度，爰於本條重申人員配置規定，以資周延。"},{"bill":"202110186260000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110185560000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"本署各職稱之官等職等及員額，另以編制表定之。"},{"bill":"202110185440000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110199460000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110200600000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110216900000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110221610000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110222810000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"雖中央政府機關總員額法第六條已授權各機關自行訂定編制表，然考量本法第三條及第四條僅就首長、副首長及幕僚長之職位進行規範，尚難據以評估機關整體員額配置與運作實務。為求機關組織架構之完整性及透明度，爰於本條重申人員配置規定，以資周延。"},{"bill":"201110179390001","text":"本部之次級機關及其業務如下：\n一、疾病管制署：規劃與執行傳染病之預防及管制事項。\n二、食品藥物管理署：規劃與執行食品、藥物、化粧品之管理、查核及檢驗事項。\n三、中央健康保險署：規劃及執行全民健康保險事項。\n四、國民健康署：規劃與執行生育照護、國民健康促進及非傳染病之防治事項。\n五、兒少及家庭支持署：規劃與執行托育照護、早期療育、兒童、少年福利與權益保障、家庭支持服務及健康促進事項。\n六、長期照顧及社會發展署：規劃與執行長期照顧（護）、老人、身心障礙者、婦女權益與福利及國民年金事項。","note":"一、配合本部業務調整、刪除第五款社會及家庭署及其業務；增設「兒少及家庭支持署」及「長期照顧及社會發展署」，爰增訂第五款及第六款，並將業務依其權責重新劃分。\n二、考量本部國民年金業務係依國民年金法第四條規定委託勞動部勞工保險局辦理，已確立不成立國民年金局，爰刪除第六款及第二項文字，第一項列為本條規定。"},{"bill":"201110179390001","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"201110179390001","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"201110179390001","text":"本中心應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報監督機關備查。\n本中心就執行之公共事務，於不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報監督機關備查。","note":"一、為期本中心得以有效運作，並具一定程度之自主性，爰於第一項定明本中心組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報監督機關備查。\n二、本中心肩負執行特定公共事務之使命，爰於第二項定明本中心就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，可訂定對外發生效力之規章，並提經董事會通過後，報監督機關備查。"},{"bill":"201110179390001","text":"本院經費來源如下：\n一、政府預算之核撥及捐（補）助。\n二、國內外公私立機構、團體及個人之捐贈。\n三、受託研究及提供服務之收入。\n四、營運及研發成果收入。\n五、其他收入。\n前項第二款之捐贈，視同對政府之捐贈。","note":"一、第一項定明本院之經費來源。\n二、第二項定明國內外公私立機構、團體及個人對本院之捐贈，視同對政府之捐贈，俾捐贈者依所得稅法第十七條及第三十六條規定，於申報所得稅時列舉扣除或列為費用，不受金額限制，以鼓勵民間企業、團體或個人樂於捐贈本院，挹注及充實本院預算經費。又所定「公私立機構」包括營利事業及非營利事業。"}],"changed":true,"final":"本署各職稱之官等職等及員額，另以編制表定之。","finalWhy":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。","review":null},{"no":"第六條","current":null,"versions":[{"bill":"202110180390000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"201110179390000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"201110179390000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"201110179390000","text":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選，提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關（構）代表。\n二、公共衛生、醫事專業與醫療科技及健康政策評估相關之學者、專家。\n三、民間企業經營、管理專家或對本中心業務有重大貢獻之社會人士。\n前項第一款之董事，不得少於董事總人數二分之一。\n第一項董事，任一性別不得少於總人數三分之一。","note":"一、第一項定明本中心董事人數、遴聘方式及其資格。第一款所定「政府相關機關（構）」，例如涉高等教育及人才培育之教育部、涉科技發展及學術研究之國家科學及技術委員會等；第二款所定「公共衛生、醫事專業與醫療科技及健康政策評估相關之學者、專家」，係為借重其公共衛生、醫療臨床或政策評估之專業及實務經驗；第三款所定「民間企業經營、管理專家」係為借重其具民間企業經營、管理之成就及經驗，至「對本中心業務有重大貢獻之社會人士」，係指對本中心之業務有重大貢獻，如建立創新醫療科技評估模式、成立醫療科技評估人才培育相關系所、提升本中心在國際之可見度及影響力等，以借重其相關經驗及實務建議。\n二、為維持本中心業務執行不致偏離原設定政策目的，爰於第二項定明代表政府機關（構）出任董事之比例不得低於二分之一。\n三、第三項定明董事之任一性別比例，以落實性別平等。"},{"bill":"201110179390000","text":"本院應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報監督機關備查。\n本院就執行之公共事務，於不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報監督機關備查。","note":"一、為期本院得以有效運作，並具一定程度之自主性，爰於第一項定明本院應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報監督機關備查。\n二、本院肩負執行特定公共事務之使命，爰於第二項定明本院就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報監督機關備查。"},{"bill":"202110181520000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110181410000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110180890000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110182740000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110182950000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110184050000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110184650000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110186400000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110186730000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110186260000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110185560000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110185440000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110199460000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110200600000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110216900000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110221610000","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"202110222810000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"201110179390001","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"201110179390001","text":"本法施行日期，由行政院以命令定之。","note":"本法之施行日期。"},{"bill":"201110179390001","text":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選，提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關（構）代表。\n二、公共衛生、醫事專業與醫療科技及健康政策評估相關之學者、專家。\n三、民間企業經營、管理專家或對本中心業務有重大貢獻之社會人士。\n前項第一款之董事，不得少於董事總人數二分之一。\n第一項董事，任一性別不得少於總人數三分之一。","note":"一、第一項定明本中心董事人數、遴聘方式及其資格。第一款所定「政府相關機關（構）」，例如涉高等教育及人才培育之教育部、涉科技發展及學術研究之國家科學及技術委員會等；第二款所定「公共衛生、醫事專業與醫療科技及健康政策評估相關之學者、專家」，係為借重其公共衛生、醫療臨床或政策評估之專業及實務經驗；第三款所定「民間企業經營、管理專家」係為借重其具民間企業經營、管理之成就及經驗，至「對本中心業務有重大貢獻之社會人士」，係指對本中心之業務有重大貢獻，如建立創新醫療科技評估模式、成立醫療科技評估人才培育相關系所、提升本中心在國際之可見度及影響力等，以借重其相關經驗及實務建議。\n二、為維持本中心業務執行不致偏離原設定政策目的，爰於第二項定明代表政府機關（構）出任董事之比例不得低於二分之一。\n三、第三項定明董事之任一性別比例，以落實性別平等。"},{"bill":"201110179390001","text":"本院應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報監督機關備查。\n本院就執行之公共事務，於不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報監督機關備查。","note":"一、為期本院得以有效運作，並具一定程度之自主性，爰於第一項定明本院應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報監督機關備查。\n二、本院肩負執行特定公共事務之使命，爰於第二項定明本院就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報監督機關備查。"}],"changed":true,"final":"本法施行日期，由行政院以命令定之。","finalWhy":"本法之施行日期。","review":null},{"no":"第七條","current":null,"versions":[{"bill":"201110179390000","text":"本中心置監事三人至五人，由監督機關就下列人員遴選，提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關（構）代表。\n二、公共衛生、醫事專業與醫療科技及健康政策評估相關之學者、專家。\n三、會計、審計、稽核、法律或財務相關之學者、專家。\n監事應互選一人為常務監事。\n第一項第一款之監事，不得少於監事總人數二分之一。\n第一項監事，任一性別不得少於總人數三分之一。","note":"一、第一項定明本中心監事人數、遴聘方式及其資格。\n二、第二項定明常務監事之選任方式。\n三、第三項定明代表政府機關（構）出任監事之比例，理由同第六條說明二。\n四、第四項定明監事之任一性別比例，以落實性別平等。"},{"bill":"201110179390000","text":"本院設董事會，置董事十一人至十五人，由監督機關就下列人員遴選，提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與中醫藥研究相關之學者、專家。\n三、民間企業經營、管理專家或對中醫藥有重大貢獻之社會人士。\n前項第一款之董事，不得逾董事總人數三分之一；第二款之董事，不得少於董事總人數二分之一。\n第一項董事，任一性別不得少於總人數三分之一。","note":"一、第一項考量本院組織規模，董事人數定為十一人至十五人，又為落實本院任務之執行，爰併定明本院董事之資格、遴聘及解聘方式。第一款所定「政府相關機關」，例如衛生福利部、教育部等；第二款所定「中醫藥研究相關之學者、專家」，係指於中醫藥相關研究及臨床治療領域著有績效之學者專家；第三款所定「民間企業經營、管理專家」，主要係借重其具民間企業經營、管理之成就及經驗，協助本院業務推動，至「對中醫藥有重大貢獻之社會人士」，主要係借重其對於中醫藥高度專業之影響力、經驗分享及實務建議。\n二、第二項定明第一項第一款政府機關代表人數之比例限制，以維持其獨立性，並定明第一項第二款中醫藥研究相關之學者、專家擔任董事之比例，以發揮渠等所長。\n三、第三項定明董事之任一性別比例，以落實性別平等。"},{"bill":"201110179390001","text":"本中心置監事三人至五人，由監督機關就下列人員遴選，提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關（構）代表。\n二、公共衛生、醫事專業與醫療科技及健康政策評估相關之學者、專家。\n三、會計、審計、稽核、法律或財務相關之學者、專家。\n監事應互選一人為常務監事。\n第一項第一款之監事，不得少於監事總人數二分之一。\n第一項監事，任一性別不得少於總人數三分之一。","note":"一、第一項定明本中心監事人數、遴聘方式及其資格。\n二、第二項定明常務監事之選任方式。\n三、第三項定明代表政府機關（構）出任監事之比例，理由同第六條說明二。\n四、第四項定明監事之任一性別比例，以落實性別平等。"},{"bill":"201110179390001","text":"本院設董事會，置董事十一人至十五人，由監督機關就下列人員遴選，提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與中醫藥研究相關之學者、專家。\n三、民間企業經營、管理專家或對中醫藥有重大貢獻之社會人士。\n前項第一款之董事，不得逾董事總人數三分之一；第二款之董事，不得少於董事總人數二分之一。\n第一項董事，任一性別不得少於總人數三分之一。","note":"一、第一項考量本院組織規模，董事人數定為十一人至十五人，又為落實本院任務之執行，爰併定明本院董事之資格、遴聘及解聘方式。第一款所定「政府相關機關」，例如衛生福利部、教育部等；第二款所定「中醫藥研究相關之學者、專家」，係指於中醫藥相關研究及臨床治療領域著有績效之學者專家；第三款所定「民間企業經營、管理專家」，主要係借重其具民間企業經營、管理之成就及經驗，協助本院業務推動，至「對中醫藥有重大貢獻之社會人士」，主要係借重其對於中醫藥高度專業之影響力、經驗分享及實務建議。\n二、第二項定明第一項第一款政府機關代表人數之比例限制，以維持其獨立性，並定明第一項第二款中醫藥研究相關之學者、專家擔任董事之比例，以發揮渠等所長。\n三、第三項定明董事之任一性別比例，以落實性別平等。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第八條","current":"本法施行日期、由行政院以命令定之。\n本法修正條文自公布日施行。","versions":[{"bill":"201110179390000","text":"本法施行日期、由行政院以命令定之。\n本法中華民國一百零七年六月十三日修正公布條文，自公布日施行。","note":"一、第一項未修正。\n二、本次修正條文配合組織調整須有準備時間，爰施行日期依第一項規定由行政院定之。為明確適用，修正第二項定明該次修正條文之公布日期。"},{"bill":"201110179390000","text":"董事、監事任期為三年，期滿得續聘一次。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款、第三款及前條第一項第二款、第三款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選，提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期及續聘次數等事宜。\n二、第二項定明董事、監事為政府機關（構）代表者，依其職務異動改聘；董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"201110179390000","text":"本院置監事三人，由監督機關就具中醫研究、法律或會計相關學識經驗者遴選，提請行政院院長聘任之；解聘時，亦同。\n監事應互選一人為常務監事。第一項監事，任一性別不得少於總人數三分之一。","note":"一、為發揮監督功能，爰於第一項定明本院應置具中醫研究、法律或會計等相關學識經驗之監事，並規定其人數、遴聘及解聘之方式。\n二、第二項定明常務監事之選任方式。\n三、第三項定明監事之任一性別比例，以落實性別平等。"},{"bill":"201110179390001","text":"本法施行日期，由行政院以命令定之。\n本法中華民國一百零七年六月十三日修正公布條文，自公布日施行。","note":"一、第一項未修正。\n二、本次修正條文配合組織調整須有準備時間，爰施行日期依第一項規定由行政院定之。為明確適用，修正第二項定明該次修正條文之公布日期。"},{"bill":"201110179390001","text":"董事、監事任期為三年，期滿得續聘一次。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款、第三款及前條第一項第二款、第三款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選，提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期及續聘次數等事宜。\n二、第二項定明董事、監事為政府機關（構）代表者，依其職務異動改聘；董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"201110179390001","text":"本院置監事三人，由監督機關就具中醫研究、法律或會計相關學識經驗者遴選，提請行政院院長聘任之；解聘時，亦同。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於總人數三分之一。","note":"一、為發揮監督功能，爰於第一項定明本院應置具中醫研究、法律或會計等相關學識經驗之監事，並規定其人數、遴聘及解聘之方式。\n二、第二項定明常務監事之選任方式。\n三、第三項定明監事之任一性別比例，以落實性別平等。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第九條","current":null,"versions":[{"bill":"201110179390000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項定明董事長之聘任、解聘方式，並於第二項授權監督機關就董事長之聘任等事項訂定辦法規範。\n二、第三項及第四項定明董事長不能執行職務時之代理方式及年齡限制。"},{"bill":"201110179390000","text":"董事、監事任期為四年，期滿得續聘一次。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關出任之董事，應依其職務異動改聘，不受前項續聘次數之限制；依第七條第一項第二款、第三款及前條第一項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","note":"一、第一項定明董事、監事任期、續聘次數及續聘人數比例。\n二、第二項定明董事為政府機關代表者，依其職務異動改聘，並定明董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"201110179390001","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項定明董事長之聘任、解聘方式，並於第二項授權監督機關就董事長之聘任等事項訂定辦法規範。\n二、第三項及第四項定明董事長不能執行職務時之代理方式及年齡限制。"},{"bill":"201110179390001","text":"董事、監事任期為四年，期滿得續聘一次。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關出任之董事，應依其職務異動改聘，不受前項續聘次數之限制；依第七條第一項第二款、第三款及前條第一項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","note":"一、第一項定明董事、監事任期、續聘次數及續聘人數比例。\n二、第二項定明董事為政府機關代表者，依其職務異動改聘，並定明董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十條","current":null,"versions":[{"bill":"201110179390000","text":"董事會之職權如下：\n一、發展目標及計畫之審議。\n二、年度業務計畫之審議。\n三、年度預算及決算報告之審議。\n四、規章之審議。\n五、自有不動產處分或其設定負擔之審議。\n六、執行長任免之同意。\n七、本條例所定應經董事會決議事項之審議。\n八、其他重大事項之審議。","note":"董事會之職權。"},{"bill":"201110179390000","text":"本院置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。\n董事長對內綜理本院一切事務，對外代表本院；因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項定明董事長之聘任、解聘之方式，並於第二項授權監督機關就董事長之聘任等事項訂定辦法規範。\n二、第三項及第四項定明董事長職權與其不能執行職務時之代理方式及年齡限制。"},{"bill":"201110179390001","text":"董事會之職權如下：\n一、發展目標及計畫之審議。\n二、年度業務計畫之審議。\n三、年度預算及決算報告之審議。\n四、規章之審議。\n五、自有不動產處分或其設定負擔之審議。\n六、執行長任免之同意。\n七、本條例所定應經董事會決議事項之審議。\n八、其他重大事項之審議。","note":"董事會之職權。"},{"bill":"201110179390001","text":"本院置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。\n董事長對內綜理本院一切事務，對外代表本院；因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項定明董事長之聘任、解聘之方式，並於第二項授權監督機關就董事長之聘任等事項訂定辦法規範。\n二、第三項及第四項定明董事長職權與其不能執行職務時之代理方式及年齡限制。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十一條","current":null,"versions":[{"bill":"201110179390000","text":"董事會每三個月開會一次；必要時，得召開臨時會議，由董事長召集，並擔任主席。\n董事會會議應有過半數董事之出席，其決議應有出席董事過半數之同意。但前條第一款至第七款之決議，應有董事總人數過半數之同意。","note":"董事會之開會及決議方式。"},{"bill":"201110179390000","text":"董事會之職權如下：\n一、本院與依第四條第一項規定附設醫療機構發展目標及計畫之審議。\n二、本院及依第四條第一項規定附設醫療機構年度業務計畫之審議。\n三、本院與依第四條第一項規定附設醫療機構年度預算及決算報告之審議。\n四、本院及依第四條第一項規定附設醫療機構規章之審議。\n五、自有不動產處分或其設定負擔之審議。\n六、本院院長及依第四條第一項規定附設醫療機構負責人任免之同意。\n七、經費之籌募。\n八、其他重大事項之審議。","note":"定明董事會職權，包括審議本院與依第四條第一項規定附設醫療機構之發展目標與計畫、年度業務計畫、年度預算與決算報告、規章與其他重大事項、同意本院院長及上開附設醫療機構負責人之任免等。"},{"bill":"201110179390001","text":"董事會每三個月開會一次；必要時，得召開臨時會議，由董事長召集，並擔任主席。\n董事會會議應有過半數董事之出席，其決議應有出席董事過半數之同意。但前條第一款至第七款之決議，應有董事總人數過半數之同意。","note":"董事會之開會及決議方式。"},{"bill":"201110179390001","text":"董事會之職權如下：\n一、本院與依第四條第一項規定附設醫療機構發展目標及計畫之審議。\n二、本院及依第四條第一項規定附設醫療機構年度業務計畫之審議。\n三、本院與依第四條第一項規定附設醫療機構年度預算及決算報告之審議。\n四、本院及依第四條第一項規定附設醫療機構規章之審議。\n五、自有不動產處分或其設定負擔之審議。\n六、本院院長及依第四條第一項規定附設醫療機構負責人任免之同意。\n七、經費之籌募。\n八、其他重大事項之審議。","note":"定明董事會職權，包括審議本院與依第四條第一項規定附設醫療機構之發展目標與計畫、年度業務計畫、年度預算與決算報告、規章與其他重大事項、同意本院院長及上開附設醫療機構負責人之任免等。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十二條","current":null,"versions":[{"bill":"201110179390000","text":"監事之職權如下：\n一、年度業務決算之審核。\n二、業務、財務狀況之監督。\n三、財務帳冊、文件及財產資料之稽核。\n四、其他重大事項之審核或稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","note":"一、第一項定明監事之職權。\n二、第二項定明監事行使職權方式及常務監事應代表全體監事列席董事會會議。"},{"bill":"201110179390000","text":"董事會每三個月開會一次，必要時，得召開臨時會議，由董事長召集，並擔任主席。\n董事會會議應有過半數董事之出席，其決議應有出席董事過半數之同意。但前條第一款至第六款及第八款之決議，應由董事會三分之二以上董事出席，並經董事總人數過半數之同意（以下簡稱特別決議）。","note":"一、第一項定明董事會開會頻率、方式及由董事長擔任主席。\n二、第二項定明董事會決議方式。"},{"bill":"201110179390001","text":"監事之職權如下：\n一、年度業務決算之審核。\n二、業務、財務狀況之監督。\n三、財務帳冊、文件及財產資料之稽核。\n四、其他重大事項之審核或稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","note":"一、第一項定明監事之職權。\n二、第二項定明監事行使職權方式及常務監事應代表全體監事列席董事會會議。"},{"bill":"201110179390001","text":"董事會每三個月開會一次，必要時，得召開臨時會議，由董事長召集，並擔任主席。\n董事會會議應有過半數董事之出席，其決議應有出席董事過半數之同意。但前條第一款至第六款及第八款之決議，應由董事會三分之二以上董事出席，並經董事總人數過半數之同意（以下簡稱特別決議）。","note":"一、第一項定明董事會開會頻率、方式及由董事長擔任主席。\n二、第二項定明董事會決議方式。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十三條","current":null,"versions":[{"bill":"201110179390000","text":"董事、監事相互間，不得有配偶及三親等以內血親、姻親之關係。","note":"定明董事、監事相互間，不得有配偶及三親等以內血親、姻親之關係，以避免形成濫用親人之現象。"},{"bill":"201110179390000","text":"監事之職權如下：\n一、決算報告之審核。\n二、業務、財務狀況之監督。\n三、財務帳冊、文件及財產資料之稽核。\n四、其他重大事項之審核或稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","note":"一、第一項定明監事之職權，包括決算報告之審核；業務、財務狀況之監督；財務帳冊、文件與財產資料之稽核及其他重大事項之審核及稽核。\n二、第二項定明監事職權之行使方式及常務監事應列席董事會會議。"},{"bill":"201110179390001","text":"董事、監事相互間，不得有配偶及三親等以內血親、姻親之關係。","note":"定明董事、監事相互間，不得有配偶及三親等以內血親、姻親之關係，以避免形成濫用親人之現象。"},{"bill":"201110179390001","text":"監事之職權如下：\n一、決算報告之審核。\n二、業務、財務狀況之監督。\n三、財務帳冊、文件及財產資料之稽核。\n四、其他重大事項之審核或稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","note":"一、第一項定明監事之職權，包括決算報告之審核；業務、財務狀況之監督；財務帳冊、文件與財產資料之稽核及其他重大事項之審核及稽核。\n二、第二項定明監事職權之行使方式及常務監事應列席董事會會議。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十四條","current":null,"versions":[{"bill":"201110179390000","text":"董事、監事、執行長及其關係人之利益迴避事項，依公職人員利益衝突迴避法之規定辦理。\n違反前項規定致本中心受有損害者，行為人應對本中心負損害賠償責任。\n第一項人員違反公職人員利益衝突迴避法之規定者，除依該法規定處罰外，監督機關並得為適當之處置；其處置規定，由監督機關定之。","note":"一、第一項及第二項定明董事、監事、執行長及其關係人之利益迴避及損害賠償規範。\n二、第三項定明第一項人員違反公職人員利益衝突迴避法規定，監督機關之處置及授權訂定處置規定。"},{"bill":"201110179390000","text":"董事、監事、院長或與該等職務相當之人及其關係人之利益迴避事項，依公職人員利益衝突迴避法之規定辦理。\n違反前項規定致本院受有損害者，行為人應對其負損害賠償責任。\n第一項人員違反公職人員利益衝突迴避法之規定者，除依該法規定處罰外，監督機關並得為適當之處置；其處置之規定，由監督機關定之。董事、監事及院長相互間，不得有配偶或三親等以內血親、姻親之關係。\n董事、監事及院長之配偶或其三親等以內之血親、姻親，不得擔任本院總務、會計及人事職務。\n董事長及院長不得進用其配偶或三親等以內血親、姻親，擔任本院職務。","note":"一、依公職人員利益衝突迴避法第二條第一項第七款規定，該法所稱公職人員，包括公法人之董事、監察人、首長、執行長與該等職務之人；同法第三條規定前述公職人員之關係人。為落實利益迴避，爰於第一項定明董事、監事、院長或與該等職務相當之人及其關係人之利益迴避事項，應依公職人員利益衝突迴避法之規定辦理。\n二、第二項定明違反第一項規定致本院受有損害者，行為人應負損害賠償責任，以杜弊端。\n三、第三項定明第一項人員違反公職人員利益衝突迴避法者，監督機關並得為適當處置，其處置規定授權監督機關定之。\n四、第四項定明董事、監事及院長相互間，不得有配偶及三親等以內血親、姻親之關係，以避免濫用私人之現象。\n五、第五項定明董事、監事及院長之配偶或其三親等以內血親、姻親，不得擔任本院總務、會計及人事職務，落實利益迴避原則，避免循私。\n六、鑑於董事長及院長對於本院進用人員有決定權，應較董事及監事有更嚴格之規定，爰於第六項定明董事長及院長不得進用其配偶或三親等以內之親屬擔任本院職務。"},{"bill":"201110179390001","text":"董事、監事、執行長及其關係人之利益迴避事項，依公職人員利益衝突迴避法之規定辦理。\n違反前項規定致本中心受有損害者，行為人應對本中心負損害賠償責任。\n第一項人員違反公職人員利益衝突迴避法之規定者，除依該法規定處罰外，監督機關並得為適當之處置；其處置規定，由監督機關定之。","note":"一、第一項及第二項定明董事、監事、執行長及其關係人之利益迴避及損害賠償規範。\n二、第三項定明第一項人員違反公職人員利益衝突迴避法規定，監督機關之處置及授權訂定處置規定。"},{"bill":"201110179390001","text":"董事、監事、院長或與該等職務相當之人及其關係人之利益迴避事項，依公職人員利益衝突迴避法之規定辦理。\n違反前項規定致本院受有損害者，行為人應對其負損害賠償責任。\n第一項人員違反公職人員利益衝突迴避法之規定者，除依該法規定處罰外，監督機關並得為適當之處置；其處置之規定，由監督機關定之。\n董事、監事及院長相互間，不得有配偶或三親等以內血親、姻親之關係。\n董事、監事及院長之配偶或其三親等以內之血親、姻親，不得擔任本院總務、會計及人事職務。\n董事長及院長不得進用其配偶或三親等以內血親、姻親，擔任本院職務。","note":"一、依公職人員利益衝突迴避法第二條第一項第七款規定，該法所稱公職人員，包括公法人之董事、監察人、首長、執行長與該等職務之人；同法第三條規定前述公職人員之關係人。為落實利益迴避，爰於第一項定明董事、監事、院長或與該等職務相當之人及其關係人之利益迴避事項，應依公職人員利益衝突迴避法之規定辦理。\n二、第二項定明違反第一項規定致本院受有損害者，行為人應負損害賠償責任，以杜弊端。\n三、第三項定明第一項人員違反公職人員利益衝突迴避法者，監督機關並得為適當處置，其處置規定授權監督機關定之。\n四、第四項定明董事、監事及院長相互間，不得有配偶及三親等以內血親、姻親之關係，以避免濫用私人之現象。\n五、第五項定明董事、監事及院長之配偶或其三親等以內血親、姻親，不得擔任本院總務、會計及人事職務，落實利益迴避原則，避免循私。\n六、鑑於董事長及院長對於本院進用人員有決定權，應較董事及監事有更嚴格之規定，爰於第六項定明董事長及院長不得進用其配偶或三親等以內之親屬擔任本院職務。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十五條","current":null,"versions":[{"bill":"201110179390000","text":"董事、常務監事應親自出席、列席董事會會議，不得委託他人代理。","note":"定明董事、常務監事出席、列席董事會會議之方式。"},{"bill":"201110179390000","text":"董事、監事、院長或與該等職務相當之人及其關係人，不得與本院為買賣、租賃、承攬或其他交易行為。但有下列情形，經董事會特別決議同意者，不在此限：\n一、依法令規定經由公平競爭方式，以公告程序辦理之採購、標售、標租或招標設定用益物權。\n二、執行國家建設、公共政策或為公益用途申請承租、承購、委託經營、改良利用國有非公用不動產。\n違反前項規定致本院受有損害者，行為人應負損害賠償責任。\n第一項但書情形，本院應將董事會特別決議內容，於會後二十日內報監督機關備查。","note":"一、第一項定明董事、監事、院長或與該等職務相當之人及其關係人，除經董事會特別決議同意外，原則不得與本院進行買賣、租賃及承攬等交易行為，並於第二項規定違反第一項規定致本院受有損害時，行為人應負損害賠償責任，以杜弊端。\n二、第三項定明董事會所為第一項特別決議應限期報監督機關備查，以利監督。"},{"bill":"201110179390001","text":"董事、常務監事應親自出席、列席董事會會議，不得委託他人代理。","note":"定明董事、常務監事出席、列席董事會會議之方式。"},{"bill":"201110179390001","text":"董事、監事、院長或與該等職務相當之人及其關係人，不得與本院為買賣、租賃、承攬或其他交易行為。但有下列情形，經董事會特別決議同意者，不在此限：\n一、依法令規定經由公平競爭方式，以公告程序辦理之採購、標售、標租或招標設定用益物權。\n二、執行國家建設、公共政策或為公益用途申請承租、承購、委託經營、改良利用國有非公用不動產。\n違反前項規定致本院受有損害者，行為人應負損害賠償責任。\n第一項但書情形，本院應將董事會特別決議內容，於會後二十日內報監督機關備查。","note":"一、第一項定明董事、監事、院長或與該等職務相當之人及其關係人，除經董事會特別決議同意外，原則不得與本院進行買賣、租賃及承攬等交易行為，並於第二項規定違反第一項規定致本院受有損害時，行為人應負損害賠償責任，以杜弊端。\n二、第三項定明董事會所為第一項特別決議應限期報監督機關備查，以利監督。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十六條","current":null,"versions":[{"bill":"201110179390000","text":"有下列情事之一者，不得聘任為董事、監事；其已聘任者，應予解聘：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、常務監事無故連續不出席、不列席董事會會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十三條或第十四條第一項利益迴避規定，有確實證據。\n八、其他有不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、為避免影響董事會運作及監事職權之行使，爰於第一項至第三項定明董事、監事之消極聘任資格及其解聘事由。\n二、為保障當事人權益，爰於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項規定董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，授權由監督機關定之。"},{"bill":"201110179390000","text":"董事、常務監事應親自出席、列席董事會會議，不得委託他人代理。","note":"為確保董事對於本院業務執行及常務監事對本院監督職能，定明董事、常務監事出席、列席董事會會議之方式。"},{"bill":"201110179390001","text":"有下列情事之一者，不得聘任為董事、監事；其已聘任者，應予解聘：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、常務監事無故連續不出席、不列席董事會會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十三條或第十四條第一項利益迴避規定，有確實證據。\n八、其他有不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、為避免影響董事會運作及監事職權之行使，爰於第一項至第三項定明董事、監事之消極聘任資格及其解聘事由。\n二、為保障當事人權益，爰於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項規定董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，授權由監督機關定之。"},{"bill":"201110179390001","text":"董事、常務監事應親自出席、列席董事會會議，不得委託他人代理。","note":"為確保董事對於本院業務執行及常務監事對本院監督職能，定明董事、常務監事出席、列席董事會會議之方式。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十七條","current":null,"versions":[{"bill":"201110179390000","text":"本中心之董事長得為專任或兼任。專任者之報酬，由監督機關核定之；兼任者為無給職。\n本中心董事、常務監事及監事，均為無給職。","note":"一、第一項定明董事長專任支領職務報酬，兼任不支領職務報酬。\n二、董事、常務監事及監事均屬兼任，不得支領職務報酬，爰為第二項規定。"},{"bill":"201110179390000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第四十三條安全查核未通過或拒絕接受查核。\n董事、監事有前項各款情形之一或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本院形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本院年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本院利益，有確實證據。\n六、非因職務之需要，動用本院財產，有確實證據。\n七、違反第十四條所定利益迴避規定或第十五條第一項特定交易行為禁止之情事，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本院董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及其解聘事由。\n二、為保障當事人權益，爰於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項之辦法，授權由監督機關定之。"},{"bill":"201110179390001","text":"本中心之董事長得為專任或兼任。專任者之報酬，由監督機關核定之；兼任者為無給職。\n本中心董事、常務監事及監事，均為無給職。","note":"一、第一項定明董事長專任支領職務報酬，兼任不支領職務報酬。\n二、董事、常務監事及監事均屬兼任，不得支領職務報酬，爰為第二項規定。"},{"bill":"201110179390001","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第四十三條安全查核未通過或拒絕接受查核。\n董事、監事有前項各款情形之一或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本院形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本院年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本院利益，有確實證據。\n六、非因職務之需要，動用本院財產，有確實證據。\n七、違反第十四條所定利益迴避規定或第十五條第一項特定交易行為禁止之情事，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本院董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及其解聘事由。\n二、為保障當事人權益，爰於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項之辦法，授權由監督機關定之。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十八條","current":null,"versions":[{"bill":"201110179390000","text":"本中心置執行長一人，專任，負責本中心營運及管理業務之執行，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第四項、第十三條、第十六條第一項至第四項及第二十二條第六款有關董事及董事長之規定，於執行長準用之。","note":"定明執行長之聘任、解聘方式、職權及準用第九條第四項、第十三條、第十六條第一項至第四項及第二十二條第六款有關董事、董事長之規定。"},{"bill":"201110179390000","text":"本院董事長、董事、常務監事及監事，均為無給職。","note":"董事長、董事、常務監事及監事均屬兼職，不得支給職務報酬。"},{"bill":"201110179390001","text":"本中心置執行長一人，專任，負責本中心營運及管理業務之執行，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第四項、第十三條、第十六條第一項至第四項及第二十二條第六款有關董事及董事長之規定，於執行長準用之。","note":"定明執行長之聘任、解聘方式、職權及準用第九條第四項、第十三條、第十六條第一項至第四項及第二十二條第六款有關董事、董事長之規定。"},{"bill":"201110179390001","text":"本院董事長、董事、常務監事及監事，均為無給職。","note":"董事長、董事、常務監事及監事均屬兼職，不得支給職務報酬。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十九條","current":null,"versions":[{"bill":"201110179390000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事及執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長、執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","note":"一、第一項定明本中心進用之人員不具公務人員身分，其權利義務應於契約中明定之。\n二、為遵守利益迴避原則，爰於第二項定明董事、監事及執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n三、另鑑於董事長、執行長對於本中心進用人員有決定權，應較董事及監事有更嚴格之規定，為避免其濫用私人，爰於第三項規定董事長、執行長不得進用其配偶及三親等內親屬擔任本中心職務。"},{"bill":"201110179390000","text":"本院置院長一人，應具中醫臨床及大學學術主管相關經驗，專任，任期四年，期滿得續聘一次，由董事長提請董事會通過後聘任之；解聘時，亦同。\n院長依本院規章、董事會之決議及董事長之授權，負責本院營運與管理業務之執行及督導依第四條第一項規定附設醫療機構，並應列席董事會會議。\n第十條第四項、第十七條及第二十二條第六款有關董事及董事長之規定，於院長準用之。","note":"一、第一項定明院長資格、聘任及解聘方式。\n二、第二項定明本院院長之權責。\n三、第三項定明有關董事長任職年齡限制、董事、監事聘任之消極資格與解聘事由及監督機關對董事、監事監督之規定，於本院院長準用之。"},{"bill":"201110179390001","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事及執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長、執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","note":"一、第一項定明本中心進用之人員不具公務人員身分，其權利義務應於契約中明定之。\n二、為遵守利益迴避原則，爰於第二項定明董事、監事及執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n三、另鑑於董事長、執行長對於本中心進用人員有決定權，應較董事及監事有更嚴格之規定，為避免其濫用私人，爰於第三項規定董事長、執行長不得進用其配偶及三親等內親屬擔任本中心職務。"},{"bill":"201110179390001","text":"本院置院長一人，應具中醫臨床及大學學術主管相關經驗，專任，任期四年，期滿得續聘一次，由董事長提請董事會通過後聘任之；解聘時，亦同。\n院長依本院規章、董事會之決議及董事長之授權，負責本院營運與管理業務之執行及督導依第四條第一項規定附設醫療機構，並應列席董事會會議。\n第十條第四項、第十七條及第二十二條第六款有關董事及董事長之規定，於院長準用之。","note":"一、第一項定明院長資格、聘任及解聘方式。\n二、第二項定明本院院長之權責。\n三、第三項定明有關董事長任職年齡限制、董事、監事聘任之消極資格與解聘事由及監督機關對董事、監事監督之規定，於本院院長準用之。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十條","current":null,"versions":[{"bill":"201110179390000","text":"本中心人員應依涉密程度接受一般或特殊安全查核。\n一般安全查核由監督機關依規定辦理；涉及國家安全或重大利益之特殊安全查核，應由監督機關會同相關機關辦理之。\n對於規劃進用之人員，應先行辦理安全查核；拒絕接受查核或查核未通過者，應不予進用。\n依法應實施安全查核而怠於辦理查核之相關機關人員，情節重大者，應移送監察院依法處理。\n安全查核之適用對象、程序、內容、救濟等相關事項之辦法，由監督機關會商有關機關定之。","note":"一、第一項定明本中心人員應接受一般或特殊安全查核。\n二、第二項定明一般安全查核由監督機關辦理；特殊安全查核因涉及國家安全或重大利益，應由監督機關會同相關機關辦理。\n三、第三項定明未經查核或查核未通過者，不得進用。\n四、第四項定明未依規定辦理查核且情節重大者，應移送監察院依法處理。\n五、第五項定明第一項安全查核相關事項之辦法，授權監督機關會商有關機關訂定。"},{"bill":"201110179390000","text":"本院依第四條第一項規定附設之醫療機構置負責人一人，負責醫療機構之管理，由院長提請本院董事會通過後聘任之；解聘時亦同。\n前項負責人受本院之督導，綜理醫療機構業務，並應列席本院董事會會議。\n第十四條、第十七條及第二十二條第六款有關董事、董事長、監事、院長或與該等職務相當之人之規定，於第一項負責人準用之。","note":"一、第一項定明本院依第四條第一項規定附設醫療機構之負責人聘任及解聘方式。\n二、第二項定明醫療機構負責人之權責。\n三、第三項定明醫療機構負責人準用第十四條、第十七條及第二十二條第六款之規定。"},{"bill":"201110179390001","text":"本中心人員應依涉密程度接受一般或特殊安全查核。\n一般安全查核由監督機關依規定辦理；涉及國家安全或重大利益之特殊安全查核，應由監督機關會同相關機關辦理之。\n對於規劃進用之人員，應先行辦理安全查核；拒絕接受查核或查核未通過者，應不予進用。\n依法應實施安全查核而怠於辦理查核之相關機關人員，情節重大者，應移送監察院依法處理。\n安全查核之適用對象、程序、內容、救濟等相關事項之辦法，由監督機關會商有關機關定之。","note":"一、第一項定明本中心人員應接受一般或特殊安全查核。\n二、第二項定明一般安全查核由監督機關辦理；特殊安全查核因涉及國家安全或重大利益，應由監督機關會同相關機關辦理。\n三、第三項定明未經查核或查核未通過者，不得進用。\n四、第四項定明未依規定辦理查核且情節重大者，應移送監察院依法處理。\n五、第五項定明第一項安全查核相關事項之辦法，授權監督機關會商有關機關訂定。"},{"bill":"201110179390001","text":"本院依第四條第一項規定附設之醫療機構置負責人一人，負責醫療機構之管理，由院長提請本院董事會通過後聘任之；解聘時亦同。\n前項負責人受本院之督導，綜理醫療機構業務，並應列席本院董事會會議。\n第十四條、第十七條及第二十二條第六款有關董事、董事長、監事、院長或與該等職務相當之人之規定，於第一項負責人準用之。","note":"一、第一項定明本院依第四條第一項規定附設醫療機構之負責人聘任及解聘方式。\n二、第二項定明醫療機構負責人之權責。\n三、第三項定明醫療機構負責人準用第十四條、第十七條及第二十二條第六款之規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十一條","current":null,"versions":[{"bill":"201110179390000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項定明第一項人員出國（境）管制相關事項之辦法由監督機關定之。"},{"bill":"201110179390000","text":"本院應擬訂發展目標及計畫，提經董事會通過後，報監督機關核定。\n本院應訂定年度業務計畫及其預算，提經董事會通過後，報監督機關備查。","note":"一、依第十一條第一款規定，本院發展目標及計畫係由董事會審議，爰於第一項定明本院應擬訂發展目標及計畫，提經董事會通過後，報監督機關核定，俾利本院長遠、穩定之發展。\n二、依第十一條第二款及第三款規定，本院年度業務計畫、年度預算及決算報告係由董事會審議，又該年度業務計畫係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦彈性，爰於第二項定明該年度業務計畫及其預算經董事會通過後，報監督機關備查。"},{"bill":"201110179390001","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項定明第一項人員出國（境）管制相關事項之辦法由監督機關定之。"},{"bill":"201110179390001","text":"本院應擬訂發展目標及計畫，提經董事會通過後，報監督機關核定。\n本院應訂定年度業務計畫及其預算，提經董事會通過後，報監督機關備查。","note":"一、依第十一條第一款規定，本院發展目標及計畫係由董事會審議，爰於第一項定明本院應擬訂發展目標及計畫，提經董事會通過後，報監督機關核定，俾利本院長遠、穩定之發展。\n二、依第十一條第二款及第三款規定，本院年度業務計畫、年度預算及決算報告係由董事會審議，又該年度業務計畫係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦彈性，爰於第二項定明該年度業務計畫及其預算經董事會通過後，報監督機關備查。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十二條","current":null,"versions":[{"bill":"201110179390000","text":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要之處分。\n七、本中心有違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或其設定負擔之核可。\n九、其他依法律所為之監督。","note":"本中心接受政府之經費，自應受監督機關之監督，爰定明監督機關之監督權限。"},{"bill":"201110179390000","text":"監督機關對本院之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要之處分。\n七、本院違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、其他依法律所為之監督。","note":"定明監督機關對本院之監督權限，包括財務、營運、人事、財產等監督，及董事、監事於執行業務違反法令時，得為必要之處分。"},{"bill":"201110179390001","text":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要之處分。\n七、本中心有違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或其設定負擔之核可。\n九、其他依法律所為之監督。","note":"本中心接受政府之經費，自應受監督機關之監督，爰定明監督機關之監督權限。"},{"bill":"201110179390001","text":"監督機關對本院之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要之處分。\n七、本院違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、其他依法律所為之監督。","note":"定明監督機關對本院之監督權限，包括財務、營運、人事、財產等監督，及董事、監事於執行業務違反法令時，得為必要之處分。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十三條","current":null,"versions":[{"bill":"201110179390000","text":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本中心之績效評鑑；其中學者專家及社會公正人士之人數，不得少於二分之一。\n前項評鑑成員，任一性別不得少於總人數三分之一。\n第一項績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本中心年度執行成果之考核。\n二、本中心業務績效及目標達成率之評量。\n三、本中心年度自籌款比率達成率。\n四、本中心經費核撥之建議。\n五、其他有關事項。","note":"一、有關監督機關辦理績效評鑑之人員組成、性別比例及績效評鑑之內容，於第一項、第二項及第四項定明。\n二、另因本中心接受政府之經費，爰第三項規定績效評鑑相關事項之辦法，由監督機關定之。"},{"bill":"201110179390000","text":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本院之績效評鑑；其中學者專家及社會公正人士之人數合計，不得少於二分之一。\n前項評鑑成員，任一性別不得少於總人數三分之一。\n第一項績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本院年度執行成果之考核。\n二、本院業務績效及目標達成率之評量。\n三、本院年度自籌款比率達成率。\n四、本院經費核撥之建議。\n五、其他有關事項。","note":"一、第一項定明監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本院績效評鑑，期評鑑結果更具公正性及客觀性。\n二、第二項定明評鑑成員之任一性別比例，以落實性別平等。\n三、第三項授權監督機關訂定績效評鑑之成員資格條件、遴聘程序、辦理績效評鑑之方式、程序及其他相關事項之辦法。\n四、本院公共事務之實施效能及權責是否相符，須有績效評鑑機制作為衡量依據。績效評鑑除評核營運、效能及目標達成情形，作為監督機關未來核撥經費之參據外，亦透過評鑑機制對於本院之運作給予指導，以確保所負責之公共事務能適切實施並具有效能，爰於第四項定明績效評鑑內容，俾資依循。"},{"bill":"201110179390001","text":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本中心之績效評鑑；其中學者專家及社會公正人士之人數，不得少於二分之一。\n前項評鑑成員，任一性別不得少於總人數三分之一。\n第一項績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本中心年度執行成果之考核。\n二、本中心業務績效及目標達成率之評量。\n三、本中心年度自籌款比率達成率。\n四、本中心經費核撥之建議。\n五、其他有關事項。","note":"一、有關監督機關辦理績效評鑑之人員組成、性別比例及績效評鑑之內容，於第一項、第二項及第四項定明。\n二、另因本中心接受政府之經費，爰第三項規定績效評鑑相關事項之辦法，由監督機關定之。"},{"bill":"201110179390001","text":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本院之績效評鑑；其中學者專家及社會公正人士之人數合計，不得少於二分之一。\n前項評鑑成員，任一性別不得少於總人數三分之一。\n第一項績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本院年度執行成果之考核。\n二、本院業務績效及目標達成率之評量。\n三、本院年度自籌款比率達成率。\n四、本院經費核撥之建議。\n五、其他有關事項。","note":"一、第一項定明監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本院績效評鑑，期評鑑結果更具公正性及客觀性。\n二、第二項定明評鑑成員之任一性別比例，以落實性別平等。\n三、第三項授權監督機關訂定績效評鑑之成員資格條件、遴聘程序、辦理績效評鑑之方式、程序及其他相關事項之辦法。\n四、本院公共事務之實施效能及權責是否相符，須有績效評鑑機制作為衡量依據。績效評鑑除評核營運、效能及目標達成情形，作為監督機關未來核撥經費之參據外，亦透過評鑑機制對於本院之運作給予指導，以確保所負責之公共事務能適切實施並具有效能，爰於第四項定明績效評鑑內容，俾資依循。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十四條","current":null,"versions":[{"bill":"201110179390000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報監督機關核定。\n本中心應訂定年度業務計畫及其預算，提經董事會通過後，報監督機關備查。","note":"一、第一項定明本中心應擬訂發展目標及計畫，提經董事會通過後，報監督機關核定，俾利監督。\n二、第二項定明本中心應訂定年度業務計畫，因係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦予彈性，爰規定該年度業務計畫及其預算經董事會通過後，報監督機關備查。"},{"bill":"201110179390000","text":"本院會計年度，應與政府會計年度一致。\n本院之會計制度，依行政法人會計制度設置相關法規訂定。\n本院財務報表，應委請會計師進行查核簽證。","note":"一、第一項定明本院會計年度，應與政府會計年度一致。\n二、第二項定明本院會計制度，依行政法人會計制度設置相關法規訂定。\n三、第三項定明本院財務報表之查核方式，以確保其財務報表之公正性及專業性。"},{"bill":"201110179390001","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報監督機關核定。\n本中心應訂定年度業務計畫及其預算，提經董事會通過後，報監督機關備查。","note":"一、第一項定明本中心應擬訂發展目標及計畫，提經董事會通過後，報監督機關核定，俾利監督。\n二、第二項定明本中心應訂定年度業務計畫，因係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦予彈性，爰規定該年度業務計畫及其預算經董事會通過後，報監督機關備查。"},{"bill":"201110179390001","text":"本院會計年度，應與政府會計年度一致。\n本院之會計制度，依行政法人會計制度設置相關法規訂定。\n本院財務報表，應委請會計師進行查核簽證。","note":"一、第一項定明本院會計年度，應與政府會計年度一致。\n二、第二項定明本院會計制度，依行政法人會計制度設置相關法規訂定。\n三、第三項定明本院財務報表之查核方式，以確保其財務報表之公正性及專業性。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十五條","current":null,"versions":[{"bill":"201110179390000","text":"本中心於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提經董事會審議，並經全體監事通過後，報監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","note":"一、第一項定明本中心年度執行成果及決算報告書，報監督機關備查與送審計機關之程序及期限。\n二、顧及審計機關對本中心之審計監督權，並兼顧本中心之自主性，爰定明第二項。"},{"bill":"201110179390000","text":"本院於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提交董事會審議，並經全體監事通過後，報監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","note":"一、第一項定明本院年度執行成果及決算報告書，報監督機關備查與送審計機關之程序及期限。\n二、顧及審計機關對本院之審計監督權，並兼顧其自主性，爰於第二項定明審計機關得審計本院之決算報告，審計結果，得送監督機關或其他相關機關為必要之處理。"},{"bill":"201110179390001","text":"本中心於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提經董事會審議，並經全體監事通過後，報監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","note":"一、第一項定明本中心年度執行成果及決算報告書，報監督機關備查與送審計機關之程序及期限。\n二、顧及審計機關對本中心之審計監督權，並兼顧本中心之自主性，爰定明第二項。"},{"bill":"201110179390001","text":"本院於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提交董事會審議，並經全體監事通過後，報監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","note":"一、第一項定明本院年度執行成果及決算報告書，報監督機關備查與送審計機關之程序及期限。\n二、顧及審計機關對本院之審計監督權，並兼顧其自主性，爰於第二項定明審計機關得審計本院之決算報告，審計結果，得送監督機關或其他相關機關為必要之處理。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十六條","current":null,"versions":[{"bill":"201110179390000","text":"本中心之會計年度，應與政府會計年度一致。\n本中心之會計制度，依行政法人會計制度設置相關法規訂定。\n本中心財務報表，應委請會計師進行查核簽證。","note":"一、為期各行政法人機構之會計制度達一致性及衡平性之標準，爰於第一項定明本中心會計年度，應與政府會計年度一致。\n二、為期各行政法人機構之會計制度達一致性及衡平性之標準，爰於第二項定明本中心會計制度，依行政法人會計制度設置相關法規訂定。\n三、第三項定明本中心財務報表之查核方式，以確保本中心財務報表之公正性及專業性。"},{"bill":"201110179390000","text":"本院成立年度之政府核撥經費，得由原機關或監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","note":"考量本院成立之年度，如立法通過本條例，惟總預算案未及改以行政法人型態編列時，則預算執行時可能有跨單位預算、跨工作計畫及跨用途別執行之問題，為避免影響相關預算之執行，爰定明不受預算法流用限制。"},{"bill":"201110179390001","text":"本中心之會計年度，應與政府會計年度一致。\n本中心之會計制度，依行政法人會計制度設置相關法規訂定。\n本中心財務報表，應委請會計師進行查核簽證。","note":"一、為期各行政法人機構之會計制度達一致性及衡平性之標準，爰於第一項定明本中心會計年度，應與政府會計年度一致。\n二、為期各行政法人機構之會計制度達一致性及衡平性之標準，爰於第二項定明本中心會計制度，依行政法人會計制度設置相關法規訂定。\n三、第三項定明本中心財務報表之查核方式，以確保本中心財務報表之公正性及專業性。"},{"bill":"201110179390001","text":"本院成立年度之政府核撥經費，得由原機關或監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","note":"考量本院成立之年度，如立法通過本條例，惟總預算案未及改以行政法人型態編列時，則預算執行時可能有跨單位預算、跨工作計畫及跨用途別執行之問題，為避免影響相關預算之執行，爰定明不受預算法流用限制。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十七條","current":null,"versions":[{"bill":"201110179390000","text":"本中心成立年度之政府核撥經費，得由監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","note":"考量本中心成立之年度，總預算案未及改以行政法人型態編列時，預算執行時可能有跨單位預算、跨工作計畫及跨用途別執行之問題，為避免影響相關預算之執行，爰定明不受預算法流用限制。"},{"bill":"201110179390000","text":"本院因業務必要使用之公有財產，得價購或由政府機關（構）以捐贈、出租或無償提供使用方式為之；其為捐贈者，不適用預算法第二十五條、第二十六條、土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令之相關規定。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本院以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本院取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本院登記為管理人，所生之收益，列為本院之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益及其他相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本院接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、第一項定明本院因業務必要使用之公有財產之取得方式，並於預算法、土地法、國有財產法及地方政府公產管理法令適度鬆綁。\n二、第二項定明本院價購公有土地及地上建築改良物之價款計算基準。\n三、第三項定明以政府機關核撥經費指定用途所購置之財產，為公有財產。\n四、第四項定明本院自有財產範圍。\n五、第五項定明第一項及第三項之公有財產由本院為管理人，所生收益列為本院收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制，並授權監督機關訂定其管理、使用、收益及其他相關事項之辦法。\n六、第六項定明公有財產用途廢止時，應移交各級政府公產管理機關接管。\n七、第七項定明本院接受捐贈之公有不動產，於不需使用時之處理方式。"},{"bill":"201110179390001","text":"本中心成立年度之政府核撥經費，得由監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","note":"考量本中心成立之年度，總預算案未及改以行政法人型態編列時，預算執行時可能有跨單位預算、跨工作計畫及跨用途別執行之問題，為避免影響相關預算之執行，爰定明不受預算法流用限制。"},{"bill":"201110179390001","text":"本院因業務必要使用之公有財產，得價購或由政府機關（構）以捐贈、出租或無償提供使用方式為之；其為捐贈者，不適用預算法第二十五條、第二十六條、土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令之相關規定。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本院以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本院取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本院登記為管理人，所生之收益，列為本院之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益及其他相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本院接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、第一項定明本院因業務必要使用之公有財產之取得方式，並於預算法、土地法、國有財產法及地方政府公產管理法令適度鬆綁。\n二、第二項定明本院價購公有土地及地上建築改良物之價款計算基準。\n三、第三項定明以政府機關核撥經費指定用途所購置之財產，為公有財產。\n四、第四項定明本院自有財產範圍。\n五、第五項定明第一項及第三項之公有財產由本院為管理人，所生收益列為本院收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制，並授權監督機關訂定其管理、使用、收益及其他相關事項之辦法。\n六、第六項定明公有財產用途廢止時，應移交各級政府公產管理機關接管。\n七、第七項定明本院接受捐贈之公有不動產，於不需使用時之處理方式。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十八條","current":null,"versions":[{"bill":"201110179390000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不適用預算法第二十五條、第二十六條、土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令之相關規定。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益及其他相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、第一項定明本中心因業務必要使用公有財產時之處理方式，並於預算法、土地法、國有財產法及地方政府公產管理法令適度鬆綁。\n二、第二項定明本中心價購公有不動產價款之計算基準。\n三、依國有財產法第二條第一項規定，國家依據法律規定，或基於權力行使，或由於預算支出，或由於接受捐贈所取得之財產，為國有財產。爰於第三項定明以政府機關核撥經費指定用途所購置之財產，為公有財產。\n四、第四項定明本中心自有財產之範圍。\n五、第五項規定公有財產由本中心為管理人及所生收益列為本中心收入者，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制，並授權監督機關訂定其保管、使用、收益等相關事項之辦法。\n六、為確認公有財產歸屬，第六項定明公有財產用途廢止時，應移交各級政府公產管理機關接管。\n七、為避免公有不動產不當使用，第七項定明本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。"},{"bill":"201110179390000","text":"政府機關核撥本院之經費，應依法定預算程序辦理，並受審計監督。\n前項經費超過本院當年度預算收入來源百分之五十者，應由監督機關將本院年度預算書，送立法院審議。\n本院自主財源及其運用管理相關事項，由本院訂定收支管理規章，報監督機關備查。","note":"一、本院除接受政府機關核撥經費外，亦有自主財源（例如委託研究、營運或研發成果收入等），為明權責，爰於第一項定明政府機關核撥之經費，應依法定預算程序辦理，並受審計監督。\n二、第二項定明本院年度預算書應送立法院審議之情形。\n三、第三項定明本院自主財源及其運用管理相關事項規章之訂定程序。"},{"bill":"201110179390001","text":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不適用預算法第二十五條、第二十六條、土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令之相關規定。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益及其他相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、第一項定明本中心因業務必要使用公有財產時之處理方式，並於預算法、土地法、國有財產法及地方政府公產管理法令適度鬆綁。\n二、第二項定明本中心價購公有不動產價款之計算基準。\n三、依國有財產法第二條第一項規定，國家依據法律規定，或基於權力行使，或由於預算支出，或由於接受捐贈所取得之財產，為國有財產。爰於第三項定明以政府機關核撥經費指定用途所購置之財產，為公有財產。\n四、第四項定明本中心自有財產之範圍。\n五、第五項規定公有財產由本中心為管理人及所生收益列為本中心收入者，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制，並授權監督機關訂定其保管、使用、收益等相關事項之辦法。\n六、為確認公有財產歸屬，第六項定明公有財產用途廢止時，應移交各級政府公產管理機關接管。\n七、為避免公有不動產不當使用，第七項定明本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。"},{"bill":"201110179390001","text":"政府機關核撥本院之經費，應依法定預算程序辦理，並受審計監督。\n前項經費超過本院當年度預算收入來源百分之五十者，應由監督機關將本院年度預算書，送立法院審議。\n本院自主財源及其運用管理相關事項，由本院訂定收支管理規章，報監督機關備查。","note":"一、本院除接受政府機關核撥經費外，亦有自主財源（例如委託研究、營運或研發成果收入等），為明權責，爰於第一項定明政府機關核撥之經費，應依法定預算程序辦理，並受審計監督。\n二、第二項定明本院年度預算書應送立法院審議之情形。\n三、第三項定明本院自主財源及其運用管理相關事項規章之訂定程序。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十九條","current":null,"versions":[{"bill":"201110179390000","text":"政府機關核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n前項經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將本中心年度預算書，送立法院審議。\n本中心自主財源及其運用管理相關事項，由本中心訂定收支管理規章，報監督機關備查。","note":"一、本中心除接受政府機關核撥經費外，亦有自主財源（例如委託研究或個人捐贈），為明權責，爰於第一項定明政府機關核撥本中心經費應依法定預算程序辦理，並受審計監督。\n二、依預算法第四十一條第四項規定，政府捐助基金累計超過百分之五十之財團法人，每年應由各該主管機關將其年度預算書，送立法院審議。行政法人為公法人，自應較私法人受到更高密度之立法監督，爰於第二項定明政府機關核撥之經費超過其當年度預算收入來源百分之五十者，應由監督機關將其年度預算書，送立法院審議。\n三、第三項定明本中心自主財源之管理規範。"},{"bill":"201110179390000","text":"本院所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，有不能自償之虞時，應即檢討提出改善措施，報監督機關核定。","note":"為避免本院隨意舉債而無力償還，衍生由政府概括承受之後遺症，同時為免未來計算整體政府債務有所爭議，爰定明其舉借之債務以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報監督機關核定。"},{"bill":"201110179390001","text":"政府機關核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n前項經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將本中心年度預算書，送立法院審議。\n本中心自主財源及其運用管理相關事項，由本中心訂定收支管理規章，報監督機關備查。","note":"一、本中心除接受政府機關核撥經費外，亦有自主財源（例如委託研究或個人捐贈），為明權責，爰於第一項定明政府機關核撥本中心經費應依法定預算程序辦理，並受審計監督。\n二、依預算法第四十一條第四項規定，政府捐助基金累計超過百分之五十之財團法人，每年應由各該主管機關將其年度預算書，送立法院審議。行政法人為公法人，自應較私法人受到更高密度之立法監督，爰於第二項定明政府機關核撥之經費超過其當年度預算收入來源百分之五十者，應由監督機關將其年度預算書，送立法院審議。\n三、第三項定明本中心自主財源之管理規範。"},{"bill":"201110179390001","text":"本院所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，有不能自償之虞時，應即檢討提出改善措施，報監督機關核定。","note":"為避免本院隨意舉債而無力償還，衍生由政府概括承受之後遺症，同時為免未來計算整體政府債務有所爭議，爰定明其舉借之債務以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報監督機關核定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十條","current":null,"versions":[{"bill":"201110179390000","text":"本中心所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，有不能自償之虞時，應即檢討提出改善措施，報監督機關核定。","note":"本中心係行政法人，為避免本中心隨意舉債而無力償還，衍生由政府概括承受之結果，同時為免未來計算整體政府債務有所爭議，爰規定其舉借之債務以具自償性質者為限。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施報監督機關核定。"},{"bill":"201110179390000","text":"本院之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條第一項所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報監督機關核定。\n前項應依政府採購法第四條第一項規定辦理之採購，於其他法律另有規定者，從其規定。","note":"一、為使本院運作更具彈性，於第一項定明辦理採購除符合我國締結之條約、協定或政府採購法第四條第一項之規定，依各該規定辦理外，不適用政府採購法之規定。\n二、為因應政府採購法以外之其他法律，對於行政法人辦理採購另有規範，爰為第二項規定。"},{"bill":"201110179390001","text":"本中心所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，有不能自償之虞時，應即檢討提出改善措施，報監督機關核定。","note":"本中心係行政法人，為避免本中心隨意舉債而無力償還，衍生由政府概括承受之結果，同時為免未來計算整體政府債務有所爭議，爰規定其舉借之債務以具自償性質者為限。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施報監督機關核定。"},{"bill":"201110179390001","text":"本院之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條第一項所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報監督機關核定。\n前項應依政府採購法第四條第一項規定辦理之採購，於其他法律另有規定者，從其規定。","note":"一、為使本院運作更具彈性，於第一項定明辦理採購除符合我國締結之條約、協定或政府採購法第四條第一項之規定，依各該規定辦理外，不適用政府採購法之規定。\n二、為因應政府採購法以外之其他法律，對於行政法人辦理採購另有規範，爰為第二項規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十一條","current":null,"versions":[{"bill":"201110179390000","text":"本中心之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條第一項所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報監督機關核定。前項應依政府採購法第四條第一項規定辦理之採購，於其他法律另有規定者，從其規定。","note":"一、為使本中心運作更具彈性，其辦理採購規定，僅於符合我國締結之條約、協定或政府採購法第四條第一項之規定，依各該規定辦理外，不適用政府採購法之規定，爰定明第一項。\n二、為因應政府採購法以外之其他法律，對於行政法人辦理採購另為規範，爰定明第二項。"},{"bill":"201110179390000","text":"本院之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本院之董事長、院長或相關主管至立法院報告營運狀況並備詢。","note":"一、第一項定明本院之相關資訊，應依政府資訊公開法規定公開之，其年度財務報表、年度業務資訊及年度績效評鑑報告，並應主動公開，其方式包括刊載於新聞紙或其他出版品；利用電信網路或其他方式供公眾線上查詢及提供公開閱覽、抄錄、影印、錄音、錄影或攝影等。\n二、第二項定明監督機關應提交績效評鑑分析報告，送立法院備查。必要時，立法院得要求監督機關首長、本院之董事長、院長或相關主管報告及備詢。"},{"bill":"201110179390001","text":"本中心之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條第一項所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報監督機關核定。\n前項應依政府採購法第四條第一項規定辦理之採購，於其他法律另有規定者，從其規定。","note":"一、為使本中心運作更具彈性，其辦理採購規定，僅於符合我國締結之條約、協定或政府採購法第四條第一項之規定，依各該規定辦理外，不適用政府採購法之規定，爰定明第一項。\n二、為因應政府採購法以外之其他法律，對於行政法人辦理採購另為規範，爰定明第二項。"},{"bill":"201110179390001","text":"本院之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本院之董事長、院長或相關主管至立法院報告營運狀況並備詢。","note":"一、第一項定明本院之相關資訊，應依政府資訊公開法規定公開之，其年度財務報表、年度業務資訊及年度績效評鑑報告，並應主動公開，其方式包括刊載於新聞紙或其他出版品；利用電信網路或其他方式供公眾線上查詢及提供公開閱覽、抄錄、影印、錄音、錄影或攝影等。\n二、第二項定明監督機關應提交績效評鑑分析報告，送立法院備查。必要時，立法院得要求監督機關首長、本院之董事長、院長或相關主管報告及備詢。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十二條","current":null,"versions":[{"bill":"201110179390000","text":"本中心之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本中心董事長、執行長或相關主管至立法院報告營運狀況並備詢。","note":"一、為建立政府資訊公開制度，便利人民共享及公平利用政府資訊，第一項定明本中心之相關資訊，應依政府資訊公開法辦理。\n二、基於民主正當性，並強化行政法人之國會監督機制，爰於第二項定明監督機關應提交績效評鑑分析報告，送立法院備查。"},{"bill":"201110179390000","text":"本條例施行前衛生福利部國家中醫藥研究所（以下簡稱原機關）現有編制內依公務人員相關任用法律任用人員，於機關改制之日隨同移轉本院繼續任用者（以下簡稱繼續任用人員），仍具公務人員身分；其任用、服務、懲戒、考績、訓練進修、俸給、保險、保障、結社、退休、資遣、撫卹、福利及其他權益事項，均依原適用之公務人員相關法令辦理。但不能依原適用之公務人員相關法令辦理之事項，由行政院會同考試院另定辦法行之。\n前項繼續任用人員中，人事及主計人員之管理，與其他公務人員同。\n前二項人員得依改制前原適用之組織法規，於首長以外之職務範圍內，依規定辦理陞遷及銓敘審定。\n第一項及第二項人員，得隨時依其適用之公務人員退休、資遣法令辦理退休、資遣後，擔任本院職務，不加發七個月俸給總額慰助金，並改依本院人事管理規章進用。","note":"一、第一項至第三項定明本條例施行前原機關現有公務人員權益保障依相關法令辦理。另第一項之其他權益事項，包括原退休人員與公務人員遺族之照護，併予說明。\n二、第四項定明移轉本院繼續任用者得隨時辦理退休、資遣後擔任本院職務，不加發七個月俸給總額慰助金之規定。"},{"bill":"201110179390001","text":"本中心之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本中心董事長、執行長或相關主管至立法院報告營運狀況並備詢。","note":"一、為建立政府資訊公開制度，便利人民共享及公平利用政府資訊，第一項定明本中心之相關資訊，應依政府資訊公開法辦理。\n二、基於民主正當性，並強化行政法人之國會監督機制，爰於第二項定明監督機關應提交績效評鑑分析報告，送立法院備查。"},{"bill":"201110179390001","text":"本條例施行前衛生福利部國家中醫藥研究所（以下簡稱原機關）現有編制內依公務人員相關任用法律任用人員，於機關改制之日隨同移轉本院繼續任用者（以下簡稱繼續任用人員），仍具公務人員身分；其任用、服務、懲戒、考績、訓練進修、俸給、保險、保障、結社、退休、資遣、撫卹、福利及其他權益事項，均依原適用之公務人員相關法令辦理。但不能依原適用之公務人員相關法令辦理之事項，由行政院會同考試院另定辦法行之。\n前項繼續任用人員中，人事及主計人員之管理，與其他公務人員同。\n前二項人員得依改制前原適用之組織法規，於首長以外之職務範圍內，依規定辦理陞遷及銓敘審定。\n第一項及第二項人員，得隨時依其適用之公務人員退休、資遣法令辦理退休、資遣後，擔任本院職務，不加發七個月俸給總額慰助金，並改依本院人事管理規章進用。","note":"一、第一項至第三項定明本條例施行前原機關現有公務人員權益保障依相關法令辦理。另第一項之其他權益事項，包括原退休人員與公務人員遺族之照護，併予說明。\n二、第四項定明移轉本院繼續任用者得隨時辦理退休、資遣後擔任本院職務，不加發七個月俸給總額慰助金之規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十三條","current":null,"versions":[{"bill":"201110179390000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其定位為公法人，爰定明人民對於本中心所為行政處分不服時，得依訴願法規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"201110179390000","text":"原機關公務人員不願隨同移轉本院者，由監督機關協助安置；或於機關改制之日，依其適用之公務人員退休、資遣法令辦理退休、資遣，並一次加發七個月之俸給總額慰助金。但已達屆齡退休之人員，依其提前退休之月數發給之。\n前項人員於退休、資遣生效日起七個月內，再任公務人員退休資遣撫卹法（以下簡稱退撫法）第七十七條第一項各款所列職務之一，且每月支領薪酬總額超過法定基本工資，應由再任機關扣除其退休、資遣月數之俸給總額慰助金後，收繳其餘額，並繳回監督機關。\n前二項所稱俸給總額慰助金，指退休、資遣當月所支本（年功）俸、專業加給及主管職務加給。","note":"參考行政法人法第二十二條規定，定明原機關公務人員不願隨同移轉本院之權益保障。"},{"bill":"201110179390001","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其定位為公法人，爰定明人民對於本中心所為行政處分不服時，得依訴願法規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"201110179390001","text":"原機關公務人員不願隨同移轉本院者，由監督機關協助安置；或於機關改制之日，依其適用之公務人員退休、資遣法令辦理退休、資遣，並一次加發七個月之俸給總額慰助金。但已達屆齡退休之人員，依其提前退休之月數發給之。\n前項人員於退休、資遣生效日起七個月內，再任公務人員退休資遣撫卹法（以下簡稱退撫法）第七十七條第一項各款所列職務之一，且每月支領薪酬總額超過法定基本工資，應由再任機關扣除其退休、資遣月數之俸給總額慰助金後，收繳其餘額，並繳回監督機關。\n前二項所稱俸給總額慰助金，指退休、資遣當月所支本（年功）俸、專業加給及主管職務加給。","note":"參考行政法人法第二十二條規定，定明原機關公務人員不願隨同移轉本院之權益保障。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十四條","current":null,"versions":[{"bill":"201110179390000","text":"本中心因情事變更或績效不彰，致不能達成其設立目的時，由監督機關提請行政院同意後解散之。本中心解散時，其人員應終止契約；其賸餘財產歸屬國庫；其相關債務，由監督機關概括承受。","note":"一、第一項定明本中心解散之事由及程序。\n二、第二項定明本中心解散時相關人員、賸餘財產及債務之處理。"},{"bill":"201110179390000","text":"原機關現有依聘用人員聘用條例聘用之人員（以下簡稱聘用人員），其聘用契約尚未期滿且不願隨同移轉本院者，於機關改制之日辦理離職，除依各機關學校聘僱人員離職給與辦法辦理外，並依其最後在職時月支報酬為計算標準，一次加發七個月之月支報酬。但契約將屆滿人員，依其提前離職之月數發給之。\n前項人員於離職生效日起七個月內，再任退撫法第七十七條第一項各款所列職務之一且每月支領薪酬總額超過法定基本工資，應由再任機關扣除離職月數之月支報酬後，收繳其餘額，並繳回監督機關。\n原機關聘用人員於機關改制之日隨同移轉本院者，應於改制之日辦理離職，並依各機關學校聘僱人員離職給與辦法規定辦理，不加發七個月月支報酬，並改依本院人事管理規章進用。","note":"參考行政法人法第二十三條規定，定明原機關聘用人員之權益保障。"},{"bill":"201110179390001","text":"本中心因情事變更或績效不彰，致不能達成其設立目的時，由監督機關提請行政院同意後解散之。\n本中心解散時，其人員應終止契約；其賸餘財產歸屬國庫；其相關債務，由監督機關概括承受。","note":"一、第一項定明本中心解散之事由及程序。\n二、第二項定明本中心解散時相關人員、賸餘財產及債務之處理。"},{"bill":"201110179390001","text":"原機關現有依聘用人員聘用條例聘用之人員（以下簡稱聘用人員），其聘用契約尚未期滿且不願隨同移轉本院者，於機關改制之日辦理離職，除依各機關學校聘僱人員離職給與辦法辦理外，並依其最後在職時月支報酬為計算標準，一次加發七個月之月支報酬。但契約將屆滿人員，依其提前離職之月數發給之。\n前項人員於離職生效日起七個月內，再任退撫法第七十七條第一項各款所列職務之一且每月支領薪酬總額超過法定基本工資，應由再任機關扣除離職月數之月支報酬後，收繳其餘額，並繳回監督機關。\n原機關聘用人員於機關改制之日隨同移轉本院者，應於改制之日辦理離職，並依各機關學校聘僱人員離職給與辦法規定辦理，不加發七個月月支報酬，並改依本院人事管理規章進用。","note":"參考行政法人法第二十三條規定，定明原機關聘用人員之權益保障。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十五條","current":null,"versions":[{"bill":"201110179390000","text":"本條例施行日期，由行政院定之。","note":"本條例之施行日期。"},{"bill":"201110179390000","text":"原機關現有依工友管理要點進用之技工，不願隨同移轉本院者，由監督機關協助安置；或於機關改制之日依其適用之退休、資遣法令辦理退休、資遣，並一次加發七個月之餉給總額慰助金。但已達屆齡退休之人員，依其提前退休之月數發給之。\n前項人員於退休、資遣生效日起七個月內，再任退撫法第七十七條第一項各款所列職務之一且每月支領薪酬總額超過法定基本工資，應由再任機關扣除其退休、資遣月數之餉給總額慰助金後，收繳其餘額，並繳回監督機關。\n前二項所稱餉給總額慰助金，指退休、資遣當月所支本（年功）餉及專業加給。\n原機關現有之技工於機關改制之日隨同移轉本院者，應於改制之日依其適用之退休、資遣法令辦理退休、資遣，不加發七個月餉給總額慰助金，並改依本院人事管理規章進用。","note":"參考行政法人法第二十五條規定，定明原機關技工之權益保障。"},{"bill":"201110179390001","text":"本條例施行日期，由行政院定之。","note":"本條例之施行日期。"},{"bill":"201110179390001","text":"原機關現有依工友管理要點進用之技工，不願隨同移轉本院者，由監督機關協助安置；或於機關改制之日依其適用之退休、資遣法令辦理退休、資遣，並一次加發七個月之餉給總額慰助金。但已達屆齡退休之人員，依其提前退休之月數發給之。\n前項人員於退休、資遣生效日起七個月內，再任退撫法第七十七條第一項各款所列職務之一且每月支領薪酬總額超過法定基本工資，應由再任機關扣除其退休、資遣月數之餉給總額慰助金後，收繳其餘額，並繳回監督機關。\n前二項所稱餉給總額慰助金，指退休、資遣當月所支本（年功）餉及專業加給。\n原機關現有之技工於機關改制之日隨同移轉本院者，應於改制之日依其適用之退休、資遣法令辦理退休、資遣，不加發七個月餉給總額慰助金，並改依本院人事管理規章進用。","note":"參考行政法人法第二十五條規定，定明原機關技工之權益保障。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十六條","current":null,"versions":[{"bill":"201110179390000","text":"原機關現有之約用人員於機關改制之日隨同移轉本院服務者，於機關改制之日依本院人事管理規章重新簽訂勞動契約，其改制前後休假及退休年資應合併計算；不願隨同移轉且契約尚未期滿者或屬於不定期契約者，於機關改制之日依原適用之相關勞動法令、管理規定或勞動契約辦理退休、資遣。","note":"一、定明原機關依契約進用人員之權益保障。\n二、本條所稱約用人員，係指依行政院及所屬各機關學校約用人員進用及運用要點進用之人員。\n三、原機關約用人員隨同移轉本院服務者重新簽訂勞動契約之權益保護，應依勞動相關法令規定，於本院人事管理規章規範，不得片面變更留用員工之勞動條件。"},{"bill":"201110179390001","text":"原機關現有之約用人員於機關改制之日隨同移轉本院服務者，於機關改制之日依本院人事管理規章重新簽訂勞動契約，其改制前後休假及退休年資應合併計算；不願隨同移轉且契約尚未期滿者或屬於不定期契約者，於機關改制之日依原適用之相關勞動法令、管理規定或勞動契約辦理退休、資遣。","note":"一、定明原機關依契約進用人員之權益保障。\n二、本條所稱約用人員，係指依行政院及所屬各機關學校約用人員進用及運用要點進用之人員。\n三、原機關約用人員隨同移轉本院服務者重新簽訂勞動契約之權益保護，應依勞動相關法令規定，於本院人事管理規章規範，不得片面變更留用員工之勞動條件。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十七條","current":null,"versions":[{"bill":"201110179390000","text":"原機關改制前依勞動基準法提撥之勞工退休準備金，應隨同具有勞動基準法退休金制度工作年資之人員移轉，於本院成立後，移轉至本院勞工退休準備金專戶存儲。","note":"參考國家中山科學研究院設置條例第三十一條第一項規定、勞動基準法第五十六條及勞工退休準備金提撥及管理辦法，定明原機關改制前依勞動基準法提撥勞工退休準備金之處理方式。"},{"bill":"201110179390001","text":"原機關改制前依勞動基準法提撥之勞工退休準備金，應隨同具有勞動基準法退休金制度工作年資之人員移轉，於本院成立後，移轉至本院勞工退休準備金專戶存儲。","note":"參考國家中山科學研究院設置條例第三十一條第一項規定、勞動基準法第五十六條及勞工退休準備金提撥及管理辦法，定明原機關改制前依勞動基準法提撥勞工退休準備金之處理方式。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十八條","current":null,"versions":[{"bill":"201110179390000","text":"原機關改制所需加發之慰助金及資遣費，得由監督機關在原預算範圍內調整支應，不受預算法第六十二條及第六十三條規定之限制。","note":"參考行政法人法第二十六條及國家中山科學研究院設置條例第三十一條第二項規定，定明改制所需加發慰助金及資遣費之處理。"},{"bill":"201110179390001","text":"原機關改制所需加發之慰助金及資遣費，得由監督機關在原預算範圍內調整支應，不受預算法第六十二條及第六十三條規定之限制。","note":"參考行政法人法第二十六條及國家中山科學研究院設置條例第三十一條第二項規定，定明改制所需加發慰助金及資遣費之處理。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十九條","current":null,"versions":[{"bill":"201110179390000","text":"曾配合機關（構）、學校業務調整而精簡、整併、改隸、改制或裁撤，依據相關法令規定辦理退休、資遣或離職，支領加發給與者，不適用本條例有關加發慰助金或月支報酬之規定。","note":"參考行政法人法第二十七條規定，定明符合相關要件者，不適用加發慰助金或月支報酬之規定，以避免產生重複支領加發給與之情形。"},{"bill":"201110179390001","text":"曾配合機關（構）、學校業務調整而精簡、整併、改隸、改制或裁撤，依據相關法令規定辦理退休、資遣或離職，支領加發給與者，不適用本條例有關加發慰助金或月支報酬之規定。","note":"參考行政法人法第二十七條規定，定明符合相關要件者，不適用加發慰助金或月支報酬之規定，以避免產生重複支領加發給與之情形。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十條","current":null,"versions":[{"bill":"201110179390000","text":"原機關休職、停職（含免職未確定）及留職停薪之公務人員，因機關改制隨同移轉本院者，由原機關列冊移交本院繼續執行。留職停薪人員提前申請回職復薪者，應准其回職復薪；依法復職或回職復薪，不願配合移轉者，得準用第三十三條規定，由監督機關協助安置，或辦理退休、資遣，並加發慰助金。","note":"參考行政法人法第二十八條規定，定明原機關休職、停職（含免職未確定）及留職停薪人員之處理。"},{"bill":"201110179390001","text":"原機關休職、停職（含免職未確定）及留職停薪之公務人員，因機關改制隨同移轉本院者，由原機關列冊移交本院繼續執行。留職停薪人員提前申請回職復薪者，應准其回職復薪；依法復職或回職復薪，不願配合移轉者，得準用第三十三條規定，由監督機關協助安置，或辦理退休、資遣，並加發慰助金。","note":"參考行政法人法第二十八條規定，定明原機關休職、停職（含免職未確定）及留職停薪人員之處理。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十一條","current":null,"versions":[{"bill":"201110179390000","text":"原機關依教育人員任用條例規定聘任人員，準用第三十二條、第三十三條、第三十八條至前條規定。","note":"參考行政法人法第二十九條規定，定明原機關依教育人員任用條例規定聘任人員之處理。"},{"bill":"201110179390001","text":"原機關依教育人員任用條例規定聘任人員，準用第三十二條、第三十三條、第三十八條至前條規定。","note":"參考行政法人法第二十九條規定，定明原機關依教育人員任用條例規定聘任人員之處理。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十二條","current":null,"versions":[{"bill":"201110179390000","text":"本院進用之人員，依本院人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。","note":"參考行政法人法第二十條規定，定明本院進用之人員不具公務人員身分，及其權利義務應於契約中明定之。"},{"bill":"201110179390001","text":"本院進用之人員，依本院人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。","note":"參考行政法人法第二十條規定，定明本院進用之人員不具公務人員身分，及其權利義務應於契約中明定之。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十三條","current":null,"versions":[{"bill":"201110179390000","text":"本院人員應依涉密程度接受一般或特殊安全查核。\n一般安全查核由監督機關依規定辦理；涉及國家安全或重大利益之特殊安全查核，應由監督機關會同相關機關辦理之。\n對於規劃進用之人員，應先行辦理安全查核；拒絕接受查核或查核未通過者，應不予進用。\n依法應實施安全查核而怠於辦理查核之相關機關人員，情節重大者，應移送監察院依法處理。\n安全查核之適用對象、程序、內容、救濟等相關事項之辦法，由監督機關會商有關機關定之。","note":"一、第一項定明本院人員應接受一般或特殊安全查核。\n二、第二項定明一般安全查核由監督機關辦理；特殊安全查核因涉及國家安全或重大利益，應由監督機關會同相關機關辦理。\n三、第三項定明未經查核或查核未通過者，不得進用。\n四、第四項定明未依規定辦理查核且情節重大者，應移送監察院依法處理。\n五、第五項定明第一項安全查核之相關事項辦法，授權監督機關會商有關機關訂定。"},{"bill":"201110179390001","text":"本院人員應依涉密程度接受一般或特殊安全查核。\n一般安全查核由監督機關依規定辦理；涉及國家安全或重大利益之特殊安全查核，應由監督機關會同相關機關辦理之。\n對於規劃進用之人員，應先行辦理安全查核；拒絕接受查核或查核未通過者，應不予進用。\n依法應實施安全查核而怠於辦理查核之相關機關人員，情節重大者，應移送監察院依法處理。\n安全查核之適用對象、程序、內容、救濟等相關事項之辦法，由監督機關會商有關機關定之。","note":"一、第一項定明本院人員應接受一般或特殊安全查核。\n二、第二項定明一般安全查核由監督機關辦理；特殊安全查核因涉及國家安全或重大利益，應由監督機關會同相關機關辦理。\n三、第三項定明未經查核或查核未通過者，不得進用。\n四、第四項定明未依規定辦理查核且情節重大者，應移送監察院依法處理。\n五、第五項定明第一項安全查核之相關事項辦法，授權監督機關會商有關機關訂定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十四條","current":null,"versions":[{"bill":"201110179390000","text":"對於本院所為之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"定明對於本院之行政處分不服者之救濟程序。"},{"bill":"201110179390001","text":"對於本院所為之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"定明對於本院之行政處分不服者之救濟程序。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十五條","current":null,"versions":[{"bill":"201110179390000","text":"本院因情事變更或績效不彰，致不能達成設立目的時，由監督機關提請行政院同意後解散之。\n本院解散時，繼續任用人員，由監督機關協助安置之，或依其適用之公務人員、教育人員法令辦理退休、資遣；其餘人員，終止其契約；其賸餘財產歸屬國庫，其相關債務由監督機關概括承受。","note":"一、第一項參考行政法人法第四十條第一項規定，定明本院解散之條件及其程序。\n二、第二項參考行政法人法第四十條第二項之規定，定明本院解散時，有關人員、賸餘財產及相關債務之處理方式。"},{"bill":"201110179390001","text":"本院因情事變更或績效不彰，致不能達成設立目的時，由監督機關提請行政院同意後解散之。\n本院解散時，繼續任用人員，由監督機關協助安置之，或依其適用之公務人員、教育人員法令辦理退休、資遣；其餘人員，終止其契約；其賸餘財產歸屬國庫，其相關債務由監督機關概括承受。","note":"一、第一項參考行政法人法第四十條第一項規定，定明本院解散之條件及其程序。\n二、第二項參考行政法人法第四十條第二項之規定，定明本院解散時，有關人員、賸餘財產及相關債務之處理方式。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十六條","current":null,"versions":[{"bill":"201110179390000","text":"本條例施行日期，由行政院定之。","note":"本條例之施行日期。"},{"bill":"201110179390001","text":"本條例施行日期，由行政院定之。","note":"本條例之施行日期。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2025-12-19","stage":"一讀","code":"院會-11-4-14","bill":"202110180390000","gazref":"115卷001期5400號一冊 27-27頁"},{"date":"2025-12-19","stage":"一讀","code":"院會-11-4-14","bill":"201110179390000","gazref":"115卷001期5400號一冊 29-29頁"},{"date":"2025-12-26","stage":"一讀","code":"院會-11-4-15","bill":"202110181520000","gazref":"115卷004期5403號一冊 8-8頁"},{"date":"2025-12-26","stage":"一讀","code":"院會-11-4-15","bill":"202110181410000","gazref":"115卷004期5403號一冊 10-10頁"},{"date":"2025-12-26","stage":"一讀","code":"院會-11-4-15","bill":"202110180890000","gazref":"115卷004期5403號一冊 11-11頁"},{"date":"20
