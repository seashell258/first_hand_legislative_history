<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公務人員考績法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

改善；應將「反霸凌」條款入法，維護公務員職場友善、建立良好風氣，避免類似憾事再度發生，爰擬具「公務人員考績法第十二條條文修正草案」。是否有當？敬請公決。","arts":["第十二條"]},{"id":"201110124660000","who":"考試院","date":"2025-05-16","name":"「公務人員考績法第十二條條文修正草案」案。","url":"https://ppg.ly.gov.tw/ppg/bills/201110124660000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/12/LCEWA01_110312_00072.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"考試院函請審議「公務人員考績法第十二條條文修正草案」案。","arts":["第十二條"]},{"id":"202110130030000","who":"委員吳沛憶等20人","date":"2025-06-03","name":"「公務人員考績法第十二條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110130030000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/14/LCEWA01_110314_00046.pdf","proposers":["吳沛憶","沈伯洋"],"ncosign":18,"people":[["吳沛憶","民進黨","提案"],["沈伯洋","民進黨","提案"],["林楚茵","民進黨","連署"],["邱議瑩","民進黨","連署"],["陳俊宇","民進黨","連署"],["王正旭","民進黨","連署"],["王定宇","民進黨","連署"],["賴惠員","民進黨","連署"],["黃捷","民進黨","連署"],["吳秉叡","民進黨","連署"],["吳琪銘","民進黨","連署"],["莊瑞雄","民進黨","連署"],["林宜瑾","民進黨","連署"],["王美惠","民進黨","連署"],["陳培瑜","民進黨","連署"],["陳冠廷","民進黨","連署"],["張雅琳","民進黨","連署"],["林月琴","民進黨","連署"],["徐富癸","民進黨","連署"],["林俊憲","民進黨","連署"]],"party":[["民進黨",20]],"reason":"本院委員吳沛憶、沈伯洋等20人，為維護公部門紀律，進行合理之考核獎懲，爰擬具「公務人員考績法第十二條條文修正草案」。是否有當？敬請公決。","arts":["第十二條"]},{"id":"202110130630000","who":"委員范雲等17人","date":"2025-06-03","name":"「公務人員考績法第三條、第十一條及第十二條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110130630000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/14/LCEWA01_110314_00062.pdf","proposers":["范雲","郭昱晴","賴瑞隆"],"ncosign":14,"people":[["范雲","民進黨","提案"],["郭昱晴","民進黨","提案"],["賴瑞隆","民進黨","提案"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["王義川","民進黨","連署"],["徐富癸","民進黨","連署"],["王美惠","民進黨","連署"],["李柏毅","民進黨","連署"],["王世堅","民進黨","連署"],["林月琴","民進黨","連署"],["陳秀寳","民進黨","連署"],["陳亭妃","民進黨","連署"],["王定宇","民進黨","連署"],["蔡易餘","民進黨","連署"],["羅美玲","民進黨","連署"],["林岱樺","民進黨","連署"],["劉建國","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員范雲、郭昱晴、賴瑞隆等17人，有鑑於我國公務人員依法留職停薪（如育嬰留職停薪）而無法取得年終考績或另予考績將致其升等資格受到損害。另，政府應落實公務人員職場霸凌、性侵害、性騷擾等重大違失行為零容忍，完善相關懲處規定。為保障公務人員權益，並防制職場重大不法行為，爰擬具「公務人員考績法第三條、第十一條及第十二條條文修正草案」。是否有當？敬請公決。","arts":["第三條","第十一條","第十二條"]}],"arts":[{"no":"第三條","current":"公務人員考績區分如左：\n一、年終考績：係指各官等人員，於每年年終考核其當年一至十二月任職期間之成績。\n二、另予考績：係指各官等人員，於同一考績年度內，任職不滿一年，而連續任職已達六個月者辦理之考績。\n三、專案考績：係指各官等人員，平時有重大功過時，隨時辦理之考績。","versions":[{"bill":"202110022580000","text":"公務人員考績區分如下：\n一、年終考績：指各官等人員，於每年年終辦理其當年一月至十二月連續任職期間之考績。\n二、另予考績：指各官等人員，於同一考績年度內，任職不滿一年，而任職已達六個月者辦理之考績。\n三、專案考績：指各官等人員，平時有重大功過時，隨時辦理之考績。\n公務人員任職期間符合前項第一款或第二款規定，惟全無工作事實者，不辦理年終考績或另予考績。但經機關選送帶職帶薪進修者，不在此限。","note":"一、第一項修正理由：\n(一)配合立法體例酌作文字修正。\n(二)公務人員考績法自施行以來，「連續任職」歷為受考人得否辦理年終考績之基本要件，為規範明確並避免後續爭議，爰於第一項第一款增列「連續」二字。\n(三)現行條文第二款規定略以，任職不滿一年，而「連續任職」已達六個月人員，辦理另予考績。然現今公務人員於該規定下，因育嬰、入伍、因公傷病請公假、因病等其他原因，依法令規定辦理留職停薪者，僅未符合「連續任職」之要件，即不得辦理另予考績，此乃過於嚴苛，未盡公平。爰刪除「連續」二字，使受考人於考績年度中雖有考績年資中斷情形，惟前後有任職事實且併計達六個月以上者，亦辦理另予考績。\n二、第二項增訂理由：\n(一)為落實考績覈實考評，並參酌銓敘部109年6月18日部法二字第10949464921號令規定：公務人員如因公傷病請公假、因病或安胎請延長病假、因案受免職、停職處分經依法提起救濟而撤銷原處分並復職，或因其他事由而致考核期間全無工作事實者，不辦理年終考績。舉例而言，某甲因公受重傷，自考績年度開始即公傷病請公假，惟因其考核期間均無工作事實，導致該年度考績丙等，與考績覈實考評精神實有未符。\n(二)另參照公務人員訓練進修法第十二條第一項規定：「各機關學校選送或自行申請進修之核定與補助規定如下：一、選送全時進修之公務人員，於核定進修期間，准予帶職帶薪並得給予相關補助……。」及銓敘部58年1月22日58台為甄一字第25317號函法規釋例內容：帶職帶薪進修人員年終考績，由原服務機關長官按考績項目參酌在校學業與操行體育成績、研究報告及原機關所具資料評定。考量機關選送服務成績優良、具有發展潛力之公務人員帶職帶薪全時進修，主要乃提升機關專業知能及競爭力，即使選送人員於考績年度內未能返回機關，但機關可就其研究報告及進修情形等據以評定考績；所以選送人員之考績並非全無考評基礎，仍應視其任職期間，依第一項第一款或第二款規定辦理年終考績或另予考績。且避免影響公務人員參加全時進修精進相關知能之意願，爰增訂但書規定，以期明確。"},{"bill":"202110130630000","text":"公務人員考績區分如左：\n一、年終考績：係指各官等人員，於每年年終考核其當年一至十二月任職期間之成績。\n二、另予考績：係指各官等人員，於同一考績年度內，任職不滿一年，而累計任職已達六個月者辦理之考績。\n三、專案考績：係指各官等人員，平時有重大功過時，隨時辦理之考績。","note":"現行條文將使公務人員因留職停薪等事由致任職雖有累計六個月卻因未達連續六個月時，即無法取得考績，影響其後續升等，爰修正第一項第二款，以保障其權益。"}],"changed":true,"final":"公務人員考績區分如下：\n一、年終考績：指各官等人員，於每年年終辦理其當年一月至十二月連續任職期間之考績。\n二、另予考績：指各官等人員，於同一考績年度內，任職不滿一年，而累計任職已達六個月者辦理之考績。\n三、專案考績：指各官等人員，平時有重大功過時，隨時辦理之考績。\n公務人員任職期間符合前項第一款或第二款規定，惟全無工作事實者，不辦理年終考績或另予考績。但經機關選送帶職帶薪進修者，不在此限。","finalWhy":"一、本條修正第一項，並增訂第二項。\n二、第一項修正理由：\n（一）配合立法體例酌作文字修正。\n（二）本法自施行以來，「連續任職」歷為受考人得否辦理年終考績之基本要件，為期規範明確並避免後續爭議，爰於第一項第一款增列「連續」二字。\n（三）原條文第二款規定略以，任職不滿一年，而「連續任職」已達六個月人員，辦理另予考績。然現今公務人員於該規定下，因養育三足歲以下子女或依法應徵服兵役辦理留職停薪，或有辭職嗣後再任他機關職務等考績年資中斷情事，且其前後任職年資累計達六個月以上，僅未符合「連續任職」之要件，即不得辦理另予考績，過於嚴苛，未盡公平。爰將「連續」修正為「累計」，使受考人於考績年度中雖有考績年資中斷情形，惟前後有任職事實且累計達六個月以上者，亦辦理另予考績。\n三、第二項增訂理由：\n（一）為落實考績覈實考評，並參酌銓敘部一百十二年四月二十日部法二字第一一二五五六三一七二一號令及部法二字第一一二五五六三一七二二號函：公務人員如因公傷病請公假、因病或安胎請延長病假、因案受免職、停職處分經依法提起救濟而撤銷原處分並復職，或因其他事由而致考核期間全無工作事實者，不辦理年終考績。是增訂第二項，明定任職期間符合辦理年終考績或另予考績規定，惟全無工作事實者，不辦理該等考績。反之，公務人員任職期間符合辦理年終考績或另予考績規定，且非全無工作事實者，仍應視其任職期間之表現辦理年終考績或另予考績。\n（二）另參照公務人員訓練進修法第十二條第一項規定：「各機關學校選送或自行申請進修之核定與補助規定如下：一、選送全時進修之公務人員，於核定進修期間，准予帶職帶薪並得給予相關補助……。」復查銓敘部五十八年一月二十二日五八台為甄一字第二五三一七號函略以，帶職帶薪進修人員年終考績，由原服務機關長官按考績項目參酌在校學業與操行體育成績、研究報告及原機關所具資料評定。考量機關選送服務成績優良、具有發展潛力之公務人員帶職帶薪全時進修，乃為提昇機關專業知能及競爭力，即使選送人員於考績年度內未能返回機關，但機關可就其研究報告及進修情形等據以評定考績；以選送人員之考績並非全無考評基礎，仍應視其任職期間，依第一項第一款或第二款規定辦理年終考績或另予考績。且避免影響公務人員參加全時進修精進相關知能之意願，爰增訂但書規定，以期明確。","review":{"note":"照委員王鴻薇等7人所提修正動議通過","text":"公務人員考績區分如下：\n一、年終考績：指各官等人員，於每年年終辦理其當年一月至十二月連續任職期間之考績。\n二、另予考績：指各官等人員，於同一考績年度內，任職不滿一年，而累計任職已達六個月者辦理之考績。\n三、專案考績：指各官等人員，平時有重大功過時，隨時辦理之考績。\n公務人員任職期間符合前項第一款或第二款規定，惟全無工作事實者，不辦理年終考績或另予考績。但經機關選送帶職帶薪進修者，不在此限。"}},{"no":"第十一條","current":"各機關參加考績人員任本職等年終考績，具有左列各款情形之一者，取得同官等高一職等之任用資格：\n一、二年列甲等者。\n二、一年列甲等二年列乙等者。\n前項所稱任本職等年終考績，指當年一至十二月任職期間均任同一職等辦理之年終考績。另予考績及以不同官等職等併資辦理年終考績之年資，均不得予以併計取得高一職等升等任用資格。但以不同官等職等併資辦理年終考績之年資，得予以併計取得該併資之較低官等高一職等升等任用資格。","versions":[{"bill":"202110130630000","text":"各機關參加考績人員任本職等年終考績或另予考績，具有左列各款情形之一者，取得同官等高一職等之任用資格：\n一、年終考績二年列甲等者。\n二、年終考績一年列甲等年二年列乙等者。\n三、年終考績一年列甲等、另予考績二年列甲等者。\n四、年終考績一年列甲等一年列乙等、另予考績二年列乙等者。\n五、年終考績一年列甲等、另予考績四年列乙等者。\n六、年終考績一年列乙等、另予考績二年列甲等二年列乙等者。\n七、年終考績二年列乙等另予考績二年列甲等者。\n八、另予考績四年列甲等者。\n前項所稱任本職等年終考績，指當年一至十二月任職期間均任同一職等辦理之年終考績。以不同官等職等併資辦理年終考績之年資，不得予以併計取得高一職等升等任用資格。但以不同官等職等併資辦理年終考績或另予考績之年資，得予以併計取得該併資之較低官等高一職等升等任用資格。","note":"一、本條延續第三條修正條文，修正第一項與第二項。亦即「年終考績一年列甲等者」相當於「年終考績二年列乙等者」、亦相當於「另予考績二年列甲等者」、亦相當於「另予考績四年列乙等者」。並依此原則計，於相當於年終考績二年列甲等者，且至少取年終考績一年甲等或另予考績二年甲等者，均得取得同官等高一職等之任用資格。\n二、第一項新增規定另予考績得作為同官等高一職等任用資格之年資。\n三、刪除現行條文第二項第二段另予考績規定，以符合前項。\n四、第二項後段新增另予考績規定，以符合前項。"}],"changed":true,"final":"各機關參加考績人員任本職等年終考績，具有下列各款情形之一者，取得同官等高一職等之任用資格：\n一、二年列甲等者。\n二、一年列甲等二年列乙等者。\n前項所稱任本職等年終考績，指當年一月至十二月任職期間均任同一職等辦理之年終考績。因育嬰留職停薪辦理之另予考績，二年列甲等者，視為年終考績一年列甲等；一年列甲等一年列乙等或二年列乙等者，視為年終考績一年列乙等。\n前項以外另予考績及以不同官等職等併資辦理年終考績之年資，均不得予以併計取得高一職等升等任用資格。但以不同官等職等併資辦理年終考績之年資，得予以併計取得該併資之較低官等高一職等升等任用資格。","finalWhy":"一、本條修正第一項及第二項，原條文第二項修正為第二項及第三項。\n二、第一項配合立法體例酌作文字修正。\n三、第二項及第三項修正理由，為營造友善養育子女之職場環境，宜適度放寬依公務人員留職停薪辦法第五條第一項第一款至第三款規定育嬰留職停薪人員，辦理另予考績者，亦得以另予考績取得同官等高一職等之任用資格，爰於第二項增列因育嬰留職停薪辦理之另予考績，按二年列甲等者，視為年終考績一年列甲等，以及一年列甲等一年列乙等或二年列乙等者，視為年終考績一年列乙等之原則辦理，並於第三項明定上開以外之另予考績均不得予以併計取得高一職等升等任用資格，以資明確。","review":{"note":"照委員吳思瑤等6人所提修正動議通過","text":"各機關參加考績人員任本職等年終考績，具有下列各款情形之一者，取得同官等高一職等之任用資格：\n一、二年列甲等者。\n二、一年列甲等二年列乙等者。\n前項所稱任本職等年終考績，指當年一月至十二月任職期間均任同一職等辦理之年終考績。因育嬰留職停薪辦理之另予考績，二年列甲等者，視為年終考績一年列甲等；一年列甲等一年列乙等或二年列乙等者，視為年終考績一年列乙等。\n前項以外另予考績及以不同官等職等併資辦理年終考績之年資，均不得予以併計取得高一職等升等任用資格。但以不同官等職等併資辦理年終考績之年資，得予以併計取得該併資之較低官等高一職等升等任用資格。"}},{"no":"第十二條","current":"各機關辦理公務人員平時考核及專案考績，分別依左列規定：\n一、平時考核：獎勵分嘉獎、記功、記大功；懲處分申誡、記過、記大過。於年終考績時，併計成績增減總分。平時考核獎懲得互相抵銷，無獎懲抵銷而累積達二大過者，年終考績應列丁等。\n二、專案考績，於有重大功過時行之；其獎懲依左列規定：\n(一)一次記二大功者，晉本俸一級，並給與一個月俸給總額之獎金；已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，並給與一個月俸給總額之獎金；已敘至年功俸最高俸級者，給與二個月俸給總額之獎金。但在同一年度內再因一次記二大功辦理專案考績者，不再晉敘俸級，改給二個月俸給總額之一次獎金。\n(二)一次記二大過者，免職。\n前項第二款一次記二大功之標準，應於施行細則中明定之。專案考績不得與平時考核功過相抵銷。\n非有左列情形之一者，不得為一次記二大過處分：\n一、圖謀背叛國家，有確實證據者。\n二、執行國家政策不力，或怠忽職責，或洩漏職務上之機密，致政府遭受重大損害，有確實證據者。\n三、違抗政府重大政令，或嚴重傷害政府信譽，有確實證據者。\n四、涉及貪污案件，其行政責任重大，有確實證據者。\n五、圖謀不法利益或言行不檢，致嚴重損害政府或公務人員聲譽，有確實證據者。\n六、脅迫、公然侮辱或誣告長官，情節重大，有確實證據者。\n七、挑撥離間或破壞紀律，情節重大，有確實證據者。\n八、曠職繼續達四日，或一年累積達十日者。","versions":[{"bill":"202110083700000","text":"各機關辦理公務人員平時考核及專案考績，分別依下列規定：\n一、平時考核：獎勵分嘉獎、記功、記大功；懲處分申誡、記過、記大過。於年終考績時，併計成績增減總分。平時考核獎懲得互相抵銷，無獎懲抵銷而累積達二大過者，年終考績應列丁等。\n二、專案考績，於有重大功過時行之；其獎懲依下列規定：\n(一)一次記二大功者，晉本俸一級，並給與一個月俸給總額之獎金；已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，並給與一個月俸給總額之獎金；已敘至年功俸最高俸級者，給與二個月俸給總額之獎金。但在同一年度內再因一次記二大功辦理專案考績者，不再晉敘俸級，改給二個月俸給總額之一次獎金。\n(二)一次記二大過者，免職。\n前項第二款一次記二大功之標準，應於施行細則中明定之。專案考績不得與平時考核功過相抵銷。\n非有下列情形之一者，不得為一次記二大過處分：\n一、圖謀背叛國家，有確實證據者。\n二、執行國家政策不力，或怠忽職責，或洩漏職務上之機密，致政府遭受重大損害，有確實證據者。\n三、違抗政府重大政令，或嚴重傷害政府信譽，有確實證據者。\n四、涉及貪污案件，其行政責任重大，有確實證據者。\n五、圖謀不法利益或言行不檢，致嚴重損害政府或公務人員聲譽，有確實證據者。\n六、脅迫、公然侮辱或誣告長官，情節重大，有確實證據者。\n七、挑撥離間或破壞紀律，情節重大，有確實證據者。\n八、曠職繼續達四日，或一年累積達十日者。\n九、對他人為性騷擾或跟蹤騷擾，使其遭受身心不法侵害，情節嚴重。\n十、對他人為職場霸凌，使其遭受身心不法侵害，情節嚴重。\n受考人除平時考核獎懲相互抵銷後或無獎懲抵銷而累計達二大過，年終考績應考列丁等者外，須有具體事證，足認在考績年度內屢有下列情形一，一再勸導無效，經綜合考評後已不適任者，始得免職：\n一、因駕駛動力交通工具涉嫌違反中華民國刑法第一百八十五條之三規定經檢察官提起公訴，或因不依指示停車接受檢測稽查或拒絕接受檢測等，違反道路交通管理處罰條例第三十五條第四項規定。\n二、對他人為性騷擾或跟蹤騷擾，使其遭受身心不法侵害，情節嚴重。\n三、對他人為職場霸凌，使其遭受身心不法侵害，情節嚴重。\n四、挑撥離間或誣控濫告，情節嚴重，影響機關和諧重大。\n五、不聽指揮或破壞紀律，情節嚴重，影響機關紀律重大。\n六、怠忽職守、稽延公務或績效不彰，造成嚴重不良後果，影響機關效能重大。\n七、負責業務，處置失當，造成嚴重財物或人員損傷，影響機關運作重大。\n八、洩漏應保守之機關機密或應秘密之事項，情節嚴重，影響機關利益重大。\n九、濫用職權整肅異己，徇私不公，情節嚴重，影響公務人員權益重大。\n十、違反行政中立或其他公務人員有關法令規定，情節嚴重，影響政府信譽重大。\n十一、品德操守惡劣、工作表現或服務態度極差，或有其他嚴重不稱職情事。第一項第一款人員所涉部分違法案件嗣經無罪判決確定者，應予檢討是否撤銷其汰除考績並重為考績。\n考績委員會對於擬依前項規定予以考列汰除案件，應有全體委員三分之二以上之出席，出席委員三分之二以上同意，始得決議。","note":"一、新增第三項第九款及第十款、第四項、第五項。\n二、公務員反霸凌入法不只是友善職場環境，還是正官箴、正風氣，不要讓首長、主管為了升遷、逢迎上意，而霸凌、壓迫下屬來達成自己的目的。亟需將職場霸凌、誣控濫告、洩密、濫用職權等行為入法。\n三、針對一次記二大過處分之情形，增訂第三項第九款及第十款，將性騷擾或跟蹤騷擾、職場霸凌列入。\n四、為強化公務人員紀律、維護公務員職場環境，針對累計達二大過，年終考績應考列丁等者，在考績年度內屢有酒駕、拒絕接受酒測，並被吊銷其駕駛執照、性騷擾或跟蹤騷擾、職場霸凌、誣控濫告、洩密、濫用職權、違反行政中立等相關情形，一再勸導無效，經綜合考評後已不適任者，始得免職。"},{"bill":"201110124660000","text":"各機關辦理公務人員平時考核獎懲，獎勵分嘉獎、記功、記一大功；懲處分申誡、記過、記一大過。於年終考績時，併計成績增減總分。平時考核獎懲得互相抵銷，無獎懲抵銷而累積達二大過者，年終考績應列丁等。\n專案考績，於有重大功過時行之；其結果依下列規定：\n一、一次記二大功者，晉本俸一級，已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，均給與一個月俸給總額之一次獎金；已敘至年功俸最高俸級者，給與二個月俸給總額之一次獎金。但在同一年度內再因一次記二大功辦理專案考績者，不再晉敘俸級，改給二個月俸給總額之一次獎金。\n二、一次記二大過者，免職。\n前項第一款一次記二大功之標準，應於施行細則中明定之。專案考績不得與平時考核獎懲相抵銷。\n公務人員除在同一考績年度內曠職繼續達四日或累計達十日，應予一次記二大過者外，非有具體事證，足認有下列情形之一者，不得為一次記二大過處分：\n一、圖謀背叛國家。\n二、執行國家政策不力，或怠忽職責，或洩漏職務上之機密，致政府遭受重大損害。\n三、違抗政府重大政令，或嚴重傷害政府信譽。\n四、涉及貪污案件，其行政責任重大。\n五、圖謀不法利益或言行不檢，致嚴重損害政府或公務人員聲譽。\n六、因服用酒類或施用毒品等致不能安全駕駛動力交通工具，且發生交通事故致人於死或重傷，或致人死傷而逃逸，違反有關法律規定。\n七、對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實。但經檢察官提起公訴者，應予一次記二大過處分。\n八、對他人為性騷擾或跟蹤騷擾，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n九、對他人為職場霸凌，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n十、脅迫、公然侮辱或誣告長官，情節重大。\n十一、挑撥離間或破壞紀律，情節重大。\n十二、違反有關法令規定，致嚴重損害政府或公務人員聲譽。\n前項第七款人員經不起訴、緩起訴處分或無罪判決確定者，應撤銷其一次記二大過處分。\n公務人員之違失行為，經主管機關或授權之所屬機關認屬一次記二大過者，懲處權行使期間為十五年；屬記一大過者，懲處權行使期間為七年；屬記過或申誡者，懲處權行使期間為五年。\n前項期間，自違失行為終了之日起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自該結果發生時起算。\n各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算。但上開案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。","note":"一、本條修正第一項至第三項，現行條文第一項修正為第一項及第二項，現行條文第二項及第三項遞移為第三項及第四項，並增訂第五項至第八項。\n二、第一項至第三項酌作文字修正，以臻明確及用語一致。\n三、第四項修正理由：\n(一)按各機關對於所屬公務人員具重大違失行為已顯不適任者，依現行各款規定即可辦理一次記二大過予以免職，俾追究其行政責任，本次修正為特別強調政府對於公務人員相關重大違失行為零容忍之政策態度，例如：酒後駕車（以下簡稱酒駕）、施用毒品、性侵害、性騷擾、職場霸凌等，爰增列部分款次。\n(二)考量受考人有「曠職繼續達四日或一年累計達十日」之情事發生，即成就一次記二大過免職之條件，機關尚無裁量空間，是以，為區辨上開條件與其他各款條件之不同，爰將現行條文第三項第八款移列序文以除外方式規定。\n(三)序文配合本法立法體例修正，且將各款之「有確實證據者」文字刪除，於序文增列「有具體事證」等文字，以臻精簡。\n(四)按杜絕酒駕、嚴禁毒品均為政府之重大政令，參酌行政院一百零八年十一月四日院授人培字第一○八○○四七○八六號函修正之「公務人員酒後駕車相關行政責任建議處理原則」附表「公務人員酒後駕車建議懲處基準表」對於酒駕肇事致人於死或重傷，或致人死傷後逃逸之公務人員，其違失情節重大，得由機關審酌是否逕予辦理一次記二大過專案考績免職。公務人員如有酒駕或施用毒品後駕車等情事，因而發生交通事故致人於死或重傷，或致人死傷而逃逸之情形，違反中華民國刑法第一百八十五條之三及第一百八十五條之四等相關規定，考量各界對於應課予該等公務人員適當行政責任一事已有共識，爰增訂第六款規定，將上開情事作為機關辦理一次記二大過專案考績免職條件之一。\n(五)參酌教育人員任用條例第三十一條第一項有關教育人員有性侵害行為經調查屬實或經有罪判決確定者，應予解聘或免職之規定，公務人員如對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實，實已嚴重損及公務人員官箴及尊嚴，亦影響機關聲譽甚鉅，另亦對機關內其他人員構成潛在威脅，為即時處理是類狀況，並保護機關內其他人員，爰增訂第七款規定，使機關得於所屬公務人員有性侵害行為經查證屬實後，即對是類受考人予以一次記二過免職，又性侵害之範圍係依性侵害犯罪防治法第二條第一款有關「性侵害犯罪」規定認定。至機關如未先行予以一次記二大過，惟嗣經檢察官提起公訴者，以其犯罪事證已具相當確定性，機關應予一次記二大過，爰增訂但書規定。\n(六)為彰顯政府營造性別友善環境，杜絕性騷擾及跟蹤騷擾之政策意旨，並考量公務人員應留意其言行舉止，品德亦應端正，爰增訂第八款規定，將公務人員對他人為性騷擾或跟蹤騷擾，使受害人遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡（含括致受害人羞忿自殺）之情形，作為機關辦理一次記二大過專案考績免職條件之一。又性騷擾之範圍係依性騷擾防治法第二條、性別平等工作法第十二條、性別平等教育法第三條規定認定；跟蹤騷擾係依跟蹤騷擾防制法第三條規定認定。\n(七)為回應社會關切議題，並彰顯政府杜絕職場霸凌之政策意旨，爰增訂第九款規定，將公務人員對他人為職場霸凌，使受害人遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡之情形，作為機關辦理一次記二大過專案考績免職條件之一。又所稱職場霸凌，係依公務人員安全及衛生防護辦法之定義予以認定。\n(八)審酌公務人員如違反第一款至第十一款以外有關法令規定，致嚴重損害政府或公務人員聲譽，已非適任，為避免影響社會大眾對公部門之信任及觀感，爰增訂第十二款規定，將之納為一次記二大過專案考績免職條件。\n四、第五項增訂理由，考量受考人涉嫌違反性侵害犯罪防治法第二條第一款規定經檢察官提起公訴，而經機關依第四項第七款規定予以一次記二大過，其嗣後經更為嚴謹之程序，獲不起訴、緩起訴處分或無罪判決確定，惟其曾因違反上開性侵害犯罪防治法規定經檢察官提起公訴之事實仍存在，爰參酌警察人員人事條例第三十條第一項「停職人員經不起訴、緩起訴處分或判決確定，且其行政責任尚未構成法定免職情事者，應准予復職」規定，增訂本項，明定受考人獲不起訴、緩起訴處分或無罪判決確定者，該一次記二大過專案考績應予撤銷，以保障是類受考人工作權益。\n五、第六項及第七項增訂理由：\n(一)為符合司法院釋字第五八三號解釋有關不同懲處種類之懲處權行使期間應有合理區分之意旨，經參酌公務員懲戒法（以下簡稱懲戒法）第二十條規定及相關機關意見，增訂第六項，分層規範公務人員懲處權行使期間。又依現行本法施行細則第十三條第四項及第十四條第三項規定，公務人員平時考核獎懲及一次記二大功（過）專案考績，應由主管機關或授權之所屬機關（以下稱核定機關）核定。是核定機關應先就受考人違法失職個案具體情形判斷其懲處之種類，屬一次記二大過者，懲處權行使期間為十五年，屬記一大過者，懲處權行使期間為七年，屬記過或申誡者，懲處權行使期間則為五年；對於已逾懲處權行使期間者，核定機關即不得再核定發布懲處令。\n(二)有關懲處權行使期間之起算，按懲戒法第二十條第三項規定，係視公務人員應受懲處行為屬作為或不作為而有所區分，又經參酌陸海空軍懲罰法第三十五條第一項規定：「前條期間，自違失行為或違紀行為終了時起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自結果發生時起算。」以及行政罰法第二十七條規定：「（第一項）行政罰之裁處權，因三年期間之經過而消滅。（第二項）前項期間，自違反行政法上義務之行為終了時起算。但行為之結果發生在後者，自該結果發生時起算……。」第七項明定懲處權之行使期間自違失行為終了之日起算，行為屬不作為者，自作為義務消滅時起算，並於但書規定行為之結果發生在後者，自該結果發生時起算，俾利機關實務執行。對於行政懲處案件，機關應查明個案具體事實後，本於權責認定其違失行為終了之日及是否屬但書所定行為結果發生在後者，就特殊情形個案，則應由機關參照相關法律規定，以最有利於受考人之方式辦理。\n(三)現行有關受考人一次記二大過及平時考核懲處之行使期間，係由銓敘部依司法院釋字第五八三號解釋，類推適用懲戒法相關規定，以一百零九年六月十八日部法二字第一○九四九四六七七五號令，釋明一次記二大過處分無行使期間限制，記一大過、記過或申誡處分之行使期間為五年。基於維護受考人權益之考量，有關一次記二大過及平時考核懲處案件，其違失行為（含括應受懲處行為係不作為者）發生在本法施行前，參酌中央法規標準法第十八條及行政罰法第五條等規定意旨，適用從新從優及從新從輕等公法上原則，即懲處權行使期間應以最有利於受考人之規定為準。\n六、第八項增訂理由，為避免公務人員之懲處經救濟機關撤銷後，原處分機關因已逾越懲處權行使期間而無法再為適當之懲處，爰參酌行政罰法第二十七條第四項規定、陸海空軍懲罰法第三十五條第二項、法務部一百零四年三月十二日法律字第一○四○三五○二六四○號函及銓敘部一百零八年九月十日部法二字第一○八四八五二八六七號令，增訂本項，明定各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算，但該等案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。"},{"bill":"202110130030000","text":"各機關辦理公務人員平時考核獎懲及專案考績，分別依下列規定：\n一、平時考核：獎勵分嘉獎、記功、記一大功；懲處分申誡、記過、記一大過。於年終考績時，併計成績增減總分。平時考核獎懲得互相抵銷，無獎懲抵銷而累積達二大過者，年終考績應列丁等。\n二、專案考績，於有重大功過時行之；其結果依下列規定：\n(一)一次記二大功者，晉本俸一級，已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，均給與一個月俸給總額之一次獎金；已敘至年功俸最高俸級者，給與二個月俸給總額之一次獎金。但在同一年度內再因一次記二大功辦理專案考績者，不再晉敘俸級，改給二個月俸給總額之一次獎金。\n(二)一次記二大過者，免職。\n前項第二款第一目一次記二大功之標準，應於施行細則中明定之。專案考績不得與平時考核獎懲相抵銷。\n非有具體事證，足認有下列情形之一者，不得為一次記二大過處分：\n一、圖謀背叛國家。\n二、執行國家政策不力，或怠忽職責，或洩漏職務上之機密，致政府遭受重大損害。\n三、違抗政府重大政令，或嚴重傷害政府信譽。\n四、涉及貪污案件，其行政責任重大。\n五、圖謀不法利益或言行不檢，致嚴重損害政府或公務人員聲譽。\n六、因服用酒類或施用毒品等致不能安全駕駛動力交通工具，且發生交通事故致人於死或重傷，或致人死傷而逃逸，違反有關法律規定。\n七、對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實。但經檢察官提起公訴者，應予一次記二大過處分。\n八、對他人為性騷擾或跟蹤騷擾，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n九、曠職繼續達四日，或一年累積達十日者。\n十、對他人為職場霸凌，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n十一、脅迫、公然侮辱或或誣告長官，情節重大，有確實證據者。\n十二、挑撥離間或破壞紀律，情節重大，有確實證據者。\n十三、違反有關法令規定，致嚴重損害政府、公務人員聲譽。\n前項第七款人員經不起訴、緩起訴處分或無罪判決確定者，應撤銷其一次記二大過處分。\n公務人員之違失行為，經主管機關或授權之所屬機關認屬一次記二大過者，懲處權行使期間為十五年；屬記一大過者，懲處權行使期間為七年；屬記過或申誡者，懲處權行使期間為五年。\n前項期間，自違失行為終了之日起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自該結果發生時起算。\n各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算。但上開案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。","note":"一、酌修第一項之文字。\n二、新增第三項第六款，對公務人員酒駕或毒駕情節嚴重者為懲處。其要件依〈公務人員酒後駕車建議懲處基準表〉定之。\n三、新增第三項第七款、第八款，當公務人員犯有性別事件時之懲處。\n四、新增第三項第十款，對公務人員為職場霸凌之懲處。\n五、新增第三項第十三款，嚴重損害政府或公務人員聲譽時之懲處。\n六、其餘款次依次調整。\n七、於第四項明定因第三項第七款所為之一次記兩大過，其案件經司法程序確定不成立者，得撤銷之。\n八、於第五項依情節輕重對懲處權時效做區分，並於第六項及第七項明定懲處權起算時間點，並於第七項明定原處分被撤銷後須另行處分之懲處權時效如何計算。"},{"bill":"202110130630000","text":"各機關辦理公務人員平時考核獎懲，獎勵分嘉獎、記功、記一大功；懲處分申誡、記過、記一大過。於年終考績時，併計成績增減總分。平時考核獎懲得互相抵銷，無獎懲抵銷而累積達二大過者，年終考績應列丁等。\n專案考績，於有重大功過時行之；其結果依下列規定：\n一、一次記二大功者，晉本俸一級，已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，均給與一個月俸給總額之一次獎金；已敘至年功俸最高俸級者，給與二個月俸給總額之一次獎金。但在同一年度內再因一次記二大功辦理專案考績者，不再晉敘俸級，改給二個月俸給總額之一次獎金。\n二、一次記二大過者，免職。\n前項第一款一次記二大功之標準，應於施行細則中明定之。專案考績不得與平時考核獎懲相抵銷。\n公務人員除在同一考績年度內曠職繼續達四日或累計達十日，應予一次記二大過者外，非有具體事證，足認有下列情形之一者，不得為一次記二大過處分：\n一、圖謀背叛國家。\n二、執行國家政策不力，或怠忽職責，或洩漏職務上之機密，致政府遭受重大損害。\n三、違抗政府重大政令，或嚴重傷害政府信譽。\n四、涉及貪污案件，其行政責任重大。\n五、圖謀不法利益或言行不檢，致嚴重損害政府或公務人員聲譽。\n六、因服用酒類或施用毒品等致不能安全駕駛動力交通工具，且發生交通事故致人於死或重傷，或致人死傷而逃逸，違反有關法律規定。\n七、對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實。但經檢察官提起公訴者，應予一次記二大過處分。\n八、對他人為性騷擾或跟蹤騷擾，情節重大。\n九、對他人為職場霸凌，情節重大。\n十、脅迫、公然侮辱或誣告長官，情節重大。\n十一、挑撥離間或破壞紀律，情節重大。\n十二、違反有關法令規定，致嚴重損害政府或公務人員聲譽。\n前項第七款人員經不起訴、緩起訴處分或無罪判決確定者，應撤銷其一次記二大過處分。\n公務人員之違失行為，經主管機關或授權之所屬機關認屬一次記二大過者，懲處權行使期間為二十年；屬記一大過者，懲處權行使期間為十年；屬記過或申誡者，懲處權行使期間為五年。\n前項期間，自違失行為終了之日起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自該結果發生時起算。\n各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算。但上開案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。","note":"一、本條修正第一項至第三項，現行條文第一項修正為第一項及第二項，現行條文第二項及第三項遞移為第三項及第四項，並增訂第五項至第八項。\n二、第一項至第三項酌作文字修正，以臻明確及用語一致。\n三、第四項修正理由：\n(一)按各機關對於所屬公務人員具重大違失行為已顯不適任者，依現行各款規定即可辦理一次記二大過予以免職，俾追究其行政責任，本次修正為特別強調政府對於公務人員相關重大違失行為零容忍之政策態度，例如：酒後駕車（以下簡稱酒駕）、施用毒品、性侵害、性騷擾、職場霸凌等，爰增列部分款次。\n(二)考量受考人有「曠職繼續達四日或一年累計達十日」之情事發生，即成就一次記二大過免職之條件，機關尚無裁量空間，是以，為區辨上開條件與其他各款條件之不同，爰將現行條文第三項第八款移列序文以除外方式規定。\n(三)序文配合本法立法體例修正，且將各款之「有確實證據者」文字刪除，於序文增列「有具體事證」等文字，以臻精簡。\n(四)按杜絕酒駕、嚴禁毒品均為政府之重大政令，參酌行政院一百零八年十一月四日院授人培字第一○八○○四七○八六號函修正之「公務人員酒後駕車相關行政責任建議處理原則」附表「公務人員酒後駕車建議懲處基準表」對於酒駕肇事致人於死或重傷，或致人死傷後逃逸之公務人員，其違失情節重大，得由機關審酌是否逕予辦理一次記二大過專案考績免職。公務人員如有酒駕或施用毒品後駕車等情事，因而發生交通事故致人於死或重傷，或致人死傷而逃逸之情形，違反中華民國刑法第一百八十五條之三及第一百八十五條之四等相關規定，考量各界對於應課予該等公務人員適當行政責任一事已有共識，爰增訂第六款規定，將上開情事作為機關辦理一次記二大過專案考績免職條件之一。\n(五)參酌教育人員任用條例第三十一條第一項有關教育人員有性侵害行為經調查屬實或經有罪判決確定者，應予解聘或免職之規定，公務人員如對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實，實已嚴重損及公務人員官箴及尊嚴，亦影響機關聲譽甚鉅，另亦對機關內其他人員構成潛在威脅，為即時處理是類狀況，並保護機關內其他人員，爰增訂第七款規定，使機關得於所屬公務人員有性侵害行為經查證屬實後，即對是類受考人予以一次記二過免職，又性侵害之範圍係依性侵害犯罪防治法第二條第一款有關「性侵害犯罪」規定認定。至機關如未先行予以一次記二大過，惟嗣經檢察官提起公訴者，以其犯罪事證已具相當確定性，機關應予一次記二大過，爰增訂但書規定。\n(六)為彰顯政府營造性別友善環境，杜絕性騷擾及跟蹤騷擾之政策意旨，並考量公務人員應留意其言行舉止，品德亦應端正，爰增訂第八款規定，將公務人員對他人為性騷擾或跟蹤騷擾，情節重大，作為機關辦理一次記二大過專案考績免職條件之一。又性騷擾之範圍係依性騷擾防治法第二條、性別平等工作法第十二條、性別平等教育法第三條規定認定；跟蹤騷擾係依跟蹤騷擾防制法第三條規定認定。\n(七)為回應社會關切議題，並彰顯政府杜絕職場霸凌之政策意旨，爰增訂第九款規定，將公務人員對他人為職場霸凌，情節重大，作為機關辦理一次記二大過專案考績免職條件之一。又所稱職場霸凌，係依公務人員安全及衛生防護辦法之定義予以認定。\n(八)審酌公務人員如違反第一款至第十一款以外有關法令規定，致嚴重損害政府或公務人員聲譽，已非適任，為避免影響社會大眾對公部門之信任及觀感，爰增訂第十二款規定，將之納為一次記二大過專案考績免職條件。\n四、第五項增訂理由，考量受考人涉嫌違反性侵害犯罪防治法第二條第一款規定經檢察官提起公訴，而經機關依第四項第七款規定予以一次記二大過，其嗣後經更為嚴謹之程序，獲不起訴、緩起訴處分或無罪判決確定，惟其曾因違反上開性侵害犯罪防治法規定經檢察官提起公訴之事實仍存在，爰參酌警察人員人事條例第三十條第一項「停職人員經不起訴、緩起訴處分或判決確定，且其行政責任尚未構成法定免職情事者，應准予復職」規定，增訂本項，明定受考人獲不起訴、緩起訴處分或無罪判決確定者，該一次記二大過專案考績應予撤銷，以保障是類受考人工作權益。\n五、第六項及第七項增訂理由：\n(一)為符合司法院釋字第五八三號解釋有關不同懲處種類之懲處權行使期間應有合理區分之意旨，經參酌公務員懲戒法（以下簡稱懲戒法）第二十條規定及相關機關意見，增訂第六項，分層規範公務人員懲處權行使期間。又依現行本法施行細則第十三條第四項及第十四條第三項規定，公務人員平時考核獎懲及一次記二大功（過）專案考績，應由主管機關或授權之所屬機關（以下稱核定機關）核定。是核定機關應先就受考人違法失職個案具體情形判斷其懲處之種類，屬一次記二大過者，懲處權行使期間為二十年，屬記一大過者，懲處權行使期間為十年，屬記過或申誡者，懲處權行使期間則為五年；對於已逾懲處權行使期間者，核定機關即不得再核定發布懲處令。\n(二)有關懲處權行使期間之起算，按懲戒法第二十條第三項規定，係視公務人員應受懲處行為屬作為或不作為而有所區分，又經參酌陸海空軍懲罰法第三十五條第一項規定：「前條期間，自違失行為或違紀行為終了時起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自結果發生時起算。」以及行政罰法第二十七條規定：「（第一項）行政罰之裁處權，因三年期間之經過而消滅。（第二項）前項期間，自違反行政法上義務之行為終了時起算。但行為之結果發生在後者，自該結果發生時起算……。」第七項明定懲處權之行使期間自違失行為終了之日起算，行為屬不作為者，自作為義務消滅時起算，並於但書規定行為之結果發生在後者，自該結果發生時起算，俾利機關實務執行。對於行政懲處案件，機關應查明個案具體事實後，本於權責認定其違失行為終了之日及是否屬但書所定行為結果發生在後者，就特殊情形個案，則應由機關參照相關法律規定，以最有利於受考人之方式辦理。\n(三)現行有關受考人一次記二大過及平時考核懲處之行使期間，係由銓敘部依司法院釋字第五八三號解釋，類推適用懲戒法相關規定，以一百零九年六月十八日部法二字第一○九四九四六七七五號令，釋明一次記二大過處分無行使期間限制，記一大過、記過或申誡處分之行使期間為五年。基於維護受考人權益之考量，有關一次記二大過及平時考核懲處案件，其違失行為（含括應受懲處行為係不作為者）發生在本法施行前，參酌中央法規標準法第十八條及行政罰法第五條等規定意旨，適用從新從優及從新從輕等公法上原則，即懲處權行使期間應以最有利於受考人之規定為準。\n六、第八項增訂理由，為避免公務人員之懲處經救濟機關撤銷後，原處分機關因已逾越懲處權行使期間而無法再為適當之懲處，爰參酌行政罰法第二十七條第四項規定、陸海空軍懲罰法第三十五條第二項、法務部一百零四年三月十二日法律字第一○四○三五○二六四○號函及銓敘部一百零八年九月十日部法二字第一○八四八五二八六七號令，增訂本項，明定各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算，但該等案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。"}],"changed":true,"final":"各機關辦理公務人員平時考核獎懲，獎勵分嘉獎、記功、記一大功；懲處分申誡、記過、記一大過。於年終考績時，併計成績增減總分。平時考核獎懲得互相抵銷，無獎懲抵銷而累積達二大過者，年終考績應列丁等。\n專案考績，於有重大功過時行之；其結果依下列規定：\n一、一次記二大功者，晉本俸一級，已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，均給與一個月俸給總額之一次獎金；已敘至年功俸最高俸級者，給與二個月俸給總額之一次獎金。但在同一年度內再因一次記二大功辦理專案考績者，不再晉敘俸級，改給二個月俸給總額之一次獎金。\n二、一次記二大過者，免職。\n前項第一款一次記二大功之標準，應於施行細則中明定之。專案考績不得與平時考核獎懲相抵銷。\n公務人員除在同一考績年度內曠職繼續達四日或累計達十日，應予一次記二大過者外，非有具體事證，足認有下列情形之一者，不得為一次記二大過處分：\n一、圖謀背叛國家。\n二、執行國家政策不力，或怠忽職責，或洩漏職務上之機密，致政府遭受重大損害。\n三、違抗政府重大政令，或嚴重傷害政府信譽。\n四、涉及貪污案件，其行政責任重大。\n五、圖謀不法利益或言行不檢，致嚴重損害政府或公務人員聲譽。\n六、因服用酒類或施用毒品等致不能安全駕駛動力交通工具，且發生交通事故致人於死或重傷，或致人死傷而逃逸，違反有關法律規定。\n七、對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實。但經檢察官提起公訴者，應予一次記二大過處分。\n八、對他人為性騷擾或跟蹤騷擾，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n九、對他人為職場霸凌，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n十、脅迫、公然侮辱或誣告長官，情節重大。\n十一、挑撥離間或破壞紀律，情節重大。\n十二、違反有關法令規定，致嚴重損害政府或公務人員聲譽。\n前項第七款但書人員經無罪判決確定者，應撤銷其一次記二大過處分。\n公務人員之違失行為，經主管機關或授權之所屬機關認屬一次記二大過者，懲處權行使期間為十五年；屬記一大過者，懲處權行使期間為七年；屬記過或申誡者，懲處權行使期間為五年。\n前項期間，自違失行為終了之日起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自該結果發生時起算。\n各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算。但上開案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。","finalWhy":"一、本條修正第一項至第三項，原條文第一項修正為第一項及第二項，原條文第二項及第三項遞移為第三項及第四項，並增訂第五項至第八項。\n二、第一項至第三項酌作文字修正，以臻明確及用語一致。\n三、第四項修正理由：\n（一）按各機關對於所屬公務人員具重大違失行為已顯不適任者，依原各款規定即可辦理一次記二大過予以免職，俾追究其行政責任，本次修正為特別強調政府對於公務人員相關重大違失行為零容忍之政策態度，例如：酒後駕車（以下簡稱酒駕）、施用毒品、性侵害、性騷擾、職場霸凌等，爰增列部分款次。\n（二）考量受考人有「曠職繼續達四日或一年累計達十日」之情事發生，即成就一次記二大過免職之條件，機關尚無裁量空間，是以，為區辨上開條件與其他各款條件之不同，爰將原條文第三項第八款移列序文以除外方式規定。\n（三）序文配合本法立法體例修正，且將各款之「有確實證據者」文字刪除，於序文增列「有具體事證」等文字，以臻精簡。\n（四）按杜絕酒駕、嚴禁毒品均為政府之重大政令，參酌行政院一百零八年十一月四日院授人培字第一○八○○四七○八六號函修正之「公務人員酒後駕車相關行政責任建議處理原則」附表「公務人員酒後駕車建議懲處基準表」對於酒駕肇事致人於死或重傷，或致人死傷後逃逸之公務人員，其違失情節重大，得由機關審酌是否逕予辦理一次記二大過專案考績免職。公務人員如有酒駕或施用毒品後駕車等情事，因而發生交通事故致人於死或重傷，或致人死傷而逃逸之情形，違反中華民國刑法第一百八十五條之三及第一百八十五條之四等相關規定，考量各界對於應課予該等公務人員適當行政責任一事已有共識，爰增訂第六款規定，將上開情事作為機關辦理一次記二大過專案考績免職條件之一。\n（五）參酌教育人員任用條例第三十一條第一項有關教育人員有性侵害行為經調查屬實或經有罪判決確定者，應予解聘或免職之規定，公務人員如對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實，實已嚴重損及公務人員官箴及尊嚴，亦影響機關聲譽甚鉅，另亦對機關內其他人員構成潛在威脅，為即時處理是類狀況，並保護機關內其他人員，爰增訂第七款規定，使機關得於所屬公務人員有性侵害行為經查證屬實後，即對是類受考人予以一次記二大過免職，又性侵害之範圍係依性侵害犯罪防治法第二條第一款有關「性侵害犯罪」規定認定。至機關如未先行予以一次記二大過，惟嗣經檢察官提起公訴者，以其犯罪事證已具相當確定性，機關應予一次記二大過，爰增訂但書規定。\n（六）為彰顯政府營造性別友善環境，杜絕性騷擾及跟蹤騷擾之政策意旨，並考量公務人員應留意其言行舉止，品德亦應端正，爰增訂第八款規定，將公務人員對他人為性騷擾或跟蹤騷擾，使受害人遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡（含括致受害人羞忿自殺）之情形，作為機關辦理一次記二大過專案考績免職條件之一。又性騷擾之範圍係依性騷擾防治法第二條、性別平等工作法第十二條、性別平等教育法第三條規定認定；跟蹤騷擾係依跟蹤騷擾防制法第三條規定認定。\n（七）為回應社會關切議題，並彰顯政府杜絕職場霸凌之政策意旨，爰增訂第九款規定，將公務人員對他人為職場霸凌，使受害人遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡之情形，作為機關辦理一次記二大過專案考績免職條件之一。又所稱職場霸凌，係依公務人員安全及衛生防護辦法之定義予以認定。\n（八）審酌公務人員如違反第一款至第十一款以外有關法令規定，致嚴重損害政府或公務人員聲譽，已非適任，為避免影響社會大眾對公部門之信任及觀感，爰增訂第十二款規定，將之納為一次記二大過專案考績免職條件。\n四、第五項增訂理由，考量受考人涉嫌違反性侵害犯罪防治法第二條第一款規定經檢察官提起公訴，而經機關依第四項第七款但書規定予以一次記二大過，其嗣後經更為嚴謹之程序，獲無罪判決確定，惟其曾因違反上開性侵害犯罪防治法規定經檢察官提起公訴之事實仍存在，爰參酌警察人員人事條例第三十條第一項「停職人員經不起訴、緩起訴處分或判決確定，且其行政責任尚未構成法定免職情事者，應准予復職」規定，增訂本項，明定受考人涉犯性侵害犯罪防治法第二條第一款規定之罪經檢察官提起公訴，嗣獲無罪判決確定者，該一次記二大過專案考績應予撤銷，以保障是類受考人工作權益。\n五、第六項及第七項增訂理由：\n（一）為符合司法院釋字第五八三號解釋有關不同懲處種類之懲處權行使期間應有合理區分之意旨，經參酌公務員懲戒法（以下簡稱懲戒法）第二十條規定及相關機關意見，增訂第六項，分層規範公務人員懲處權行使期間。又依現行本法施行細則第十三條第四項及第十四條第三項規定，公務人員平時考核獎懲及一次記二大功（過）專案考績，應由主管機關或授權之所屬機關（以下稱核定機關）核定。是核定機關應先就受考人違法失職個案具體情形判斷其懲處之種類，屬一次記二大過者，懲處權行使期間為十五年，屬記一大過者，懲處權行使期間為七年，屬記過或申誡者，懲處權行使期間則為五年；對於已逾懲處權行使期間者，核定機關即不得再核定發布懲處令。\n（二）有關懲處權行使期間之起算，按懲戒法第二十條第三項規定，係視公務人員應受懲處行為屬作為或不作為而有所區分，又經參酌陸海空軍懲罰法第三十五條第一項規定：「前條期間，自違失行為或違紀行為終了時起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自結果發生時起算。」以及行政罰法第二十七條規定：「（第一項）行政罰之裁處權，因三年期間之經過而消滅。（第二項）前項期間，自違反行政法上義務之行為終了時起算。但行為之結果發生在後者，自該結果發生時起算……。」第七項明定懲處權之行使期間自違失行為終了之日起算，行為屬不作為者，自作為義務消滅時起算，並於但書規定行為之結果發生在後者，自該結果發生時起算，俾利機關實務執行。對於行政懲處案件，機關應查明個案具體事實後，本於權責認定其違失行為終了之日及是否屬但書所定行為結果發生在後者，就特殊情形個案，則應由機關參照相關法律規定，以最有利於受考人之方式辦理。\n（三）現行有關受考人一次記二大過及平時考核懲處之行使期間，係由銓敘部依司法院釋字第五八三號解釋，類推適用懲戒法相關規定，以一百零九年六月十八日部法二字第一○九四九四六七七五號令，釋明一次記二大過處分無行使期間限制，記一大過、記過或申誡處分之行使期間為五年。基於維護受考人權益之考量，有關一次記二大過及平時考核懲處案件，其違失行為（含括應受懲處行為係不作為者）發生在本法施行前，參酌中央法規標準法第十八條及行政罰法第五條等規定意旨，適用從新從優及從新從輕等公法上原則，即懲處權行使期間應以最有利於受考人之規定為準。\n六、第八項增訂理由，為避免公務人員之懲處經救濟機關撤銷後，原處分機關因已逾越懲處權行使期間而無法再為適當之懲處，爰參酌行政罰法第二十七條第四項規定、陸海空軍懲罰法第三十五條第二項、法務部一百零四年三月十二日法律字第一○四○三五○二六四○號函及銓敘部一百零八年九月十日部法二字第一○八四八五二八六七號令，增訂本項，明定各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算，但該等案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。","review":{"note":"照委員王鴻薇等6人所提修正動議通過","text":"各機關辦理公務人員平時考核獎懲，獎勵分嘉獎、記功、記一大功；懲處分申誡、記過、記一大過。於年終考績時，併計成績增減總分。平時考核獎懲得互相抵銷，無獎懲抵銷而累積達二大過者，年終考績應列丁等。\n專案考績，於有重大功過時行之；其結果依下列規定：\n一、一次記二大功者，晉本俸一級，已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，均給與一個月俸給總額之一次獎金；已敘至年功俸最高俸級者，給與二個月俸給總額之一次獎金。但在同一年度內再因一次記二大功辦理專案考績者，不再晉敘俸級，改給二個月俸給總額之一次獎金。\n二、一次記二大過者，免職。\n前項第一款一次記二大功之標準，應於施行細則中明定之。專案考績不得與平時考核獎懲相抵銷。\n公務人員除在同一考績年度內曠職繼續達四日或累計達十日，應予一次記二大過者外，非有具體事證，足認有下列情形之一者，不得為一次記二大過處分：\n一、圖謀背叛國家。\n二、執行國家政策不力，或怠忽職責，或洩漏職務上之機密，致政府遭受重大損害。\n三、違抗政府重大政令，或嚴重傷害政府信譽。\n四、涉及貪污案件，其行政責任重大。\n五、圖謀不法利益或言行不檢，致嚴重損害政府或公務人員聲譽。\n六、因服用酒類或施用毒品等致不能安全駕駛動力交通工具，且發生交通事故致人於死或重傷，或致人死傷而逃逸，違反有關法律規定。\n七、對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實。但經檢察官提起公訴者，應予一次記二大過處分。\n八、對他人為性騷擾或跟蹤騷擾，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n九、對他人為職場霸凌，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n十、脅迫、公然侮辱或誣告長官，情節重大。\n十一、挑撥離間或破壞紀律，情節重大。\n十二、違反有關法令規定，致嚴重損害政府或公務人員聲譽。\n前項第七款但書人員經無罪判決確定者，應撤銷其一次記二大過處分。\n公務人員之違失行為，經主管機關或授權之所屬機關認屬一次記二大過者，懲處權行使期間為十五年；屬記一大過者，懲處權行使期間為七年；屬記過或申誡者，懲處權行使期間為五年。\n前項期間，自違失行為終了之日起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自該結果發生時起算。\n各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算。但上開案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。"}}],"stages":[{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110022580000","gazref":"113卷018期5200號 14-14頁"},{"date":"2025-01-03","stage":"一讀","code":"院會-11-2-16","bill":"202110083700000","gazref":"114卷010期5303號一冊 6-6頁"},{"date":"2025-05-16","stage":"一讀","code":"院會-11-3-12","bill":"201110124660000","gazref":"114卷048期5341號一冊 9-9頁"},{"date":"2025-06-03","stage":"一讀","code":"院會-11-3-14","bill":"202110130030000","gazref":"114卷053期5346號一冊 5-5頁"},{"date":"2025-06-03","stage":"一讀","code":"院會-11-3-14","bill":"202110130630000","gazref":"114卷053期5346號一冊 7-7頁"},{"date":"2025-08-14","code":"委員會-11-3-36-24","title":"第11屆第3會期司法及法制委員會第24次全體委員會議","gazref":"114卷073期5366號二冊 235-303頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2025080633/details?meetingDate=114/08/13","full":["https://ivod.ly.gov.tw/Play/Full/1M/16869"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/114/73/LCIDC01_1147302_00005.pdf","p1":235,"p2":304}],"clips":[{"n":"黃國昌","t":"09:23","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163474"},{"n":"吳宗憲","t":"09:41","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163483"},{"n":"莊瑞雄","t":"10:04","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163487"},{"n":"林倩綺","t":"10:21","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163491"},{"n":"陳培瑜","t":"10:38","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163493"},{"n":"沈發惠","t":"10:48","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163494"},{"n":"羅智強","t":"11:02","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163498"},{"n":"麥玉珍","t":"11:26","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163501"},{"n":"翁曉玲","t":"11:39","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163505"},{"n":"吳思瑤","t":"11:57","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163509"},{"n":"鍾佳濱","t":"12:12","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163511"},{"n":"陳冠廷","t":"12:24","u":"https://ivod.ly.gov.tw/Play/Clip/1M/163512"}],"props":["202110022580000","202110083700000","201110124660000","202110130030000","202110130630000"],"tr":"tr/1.json","note":null,"mixed":["刑 function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度

}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;

    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {

    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }

}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;

  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {

  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)

}

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');

}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      btn.addEventListener('click', async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      });
      acts.append(btn);
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
