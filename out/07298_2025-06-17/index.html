<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>國家海洋科技營運中心設置條例制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

），並制定本條例。","note":"一、本條例之立法目的。\n二、為提升我國海洋科技能力，厚植海洋科技研究能量，強化我國海域基礎資訊之掌握，有效統籌運用我國海洋調查船，同時充實我國國家船模實驗室多功能水槽及其他有關海洋科技設施之研究能量，特設置本中心。"},{"bill":"202110105640000","text":"為提升臺灣海洋科技，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、揭櫫本條例之立法目的。\n二、為提升臺灣海洋科技，厚植海洋科技研究能量，強化臺灣海域基礎資訊之掌握，特設置國家海洋科技營運中心，爰參酌行政法人法，制定本條例。"},{"bill":"202110100340000","text":"為提升我國海洋科技能力，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的，旨在提升我國海洋科技能力。\n二、設置本中心以強化海洋研究能量、整合海域資訊、統籌海洋調查船運用，並完善相關設施功能。"},{"bill":"202110103320000","text":"為提升我國海洋科技能力，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法意旨。\n二、為強化我國海洋科技實力，充實研究能量，提升海域基礎資訊掌握程度，並有效整合運用海洋調查船資源，同時增進國家船模實驗室多功能水槽及其他海洋科技設施的研究效能，特設置本中心。"},{"bill":"202110111220000","text":"為強化我國海洋科技之整體發展，整合研究資源、提升調查與技術研發能力，並促進國際合作與人才培育，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的。\n二、為提升我國海洋科技為國家發展關鍵領域，亟需強化整體發展動能，爰設置國家海洋科技營運中心，以整合我國既有之海洋研究資源，提升調查作業能量與技術研發水準，並積極推動國際交流合作與人才培育，落實科技創新、資源共享與產學研應用之政策目標。"},{"bill":"202110111060000","text":"為提升我國海洋科技能力及關鍵技術，厚植海洋科技研究能量及海洋研究關鍵設施之營運管理，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的。\n二、為提升臺灣海洋科技能力，強化海域基礎資料之整合掌握，並有效統籌運用國家海洋調查船與相關關鍵設施，充實海洋科技研發量能，帶動海洋研究、技術創新及產業應用，特設國家海洋科技營運中心。"},{"bill":"202110111070000","text":"為提升我國海洋科技能力，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的。\n二、為提升我國海洋科技能力，厚植海洋科技研究能量，強化我國海域基礎資訊之掌握，有效統籌運用我國海洋調查船，同時充實我國國家船模實驗室多功能水槽及其他有關海洋科技設施之研究能量，特設置本中心。"},{"bill":"202110113560000","text":"為提升我國海洋科技能力，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的。\n二、明定本中心設立的目的，聚焦於強化國家海洋科技力量與整合資源應對未來挑戰。"},{"bill":"202110113650000","text":"為提升我國海洋科技能力，厚植海洋科技研究能量，培育我國海洋科技專業人才，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的。\n二、為提升我國海洋科技能力，厚植海洋科技研究能量，強化我國海域基礎資訊之掌握，有效統籌運用我國海洋調查船，同時充實我國國家船模實驗室多功能水槽及其他有關海洋科技設施之研究能量，特設置本中心。"},{"bill":"202110113550000","text":"為提升我國海洋科技能力與研究能量，強化海域基礎資訊掌握，整合海洋調查船及相關設施資源，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的。\n二、為強化我國海洋科技實力，深化海洋科技研究基礎，提升對海域基礎資訊的掌握與整合運用調查船資源之效能，並增進國家船模實驗室多功能水槽及其他相關海洋科技設施之研究能力，特設立本中心。\n三、我國四面環海，海洋資源豐富，然而現行各項海洋調查與科技資源分散於不同機關，缺乏統籌協調機制，致使資源重複投入與調查效率不彰。設立本中心並制定專法，有助於整合各方資源、提升調查效率，並增進海洋基礎資料的完整性與即時性。"},{"bill":"202110114390000","text":"為提升我國海洋科技能力，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的。\n二、為提升我國海洋科技能力，厚植海洋科技研究能量，強化我國海域基礎資訊之掌握，有效統籌運用我國海洋調查船，同時充實我國國家船模實驗室多功能水槽及其他有關海洋科技設施之研究能量，特設置本中心。"},{"bill":"202110123810000","text":"為推動我國海洋科技之長遠發展，整合海洋科技研究設施與人力資源，提升海域調查、技術創新及應用能力，並加強國際交流合作及專業人才之培育與運用，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、本條例之立法目的。\n二、為因應海洋科技為國家發展關鍵領域之趨勢，促進整體科技能量之強化與應用推展，特設國家海洋科技營運中心，統整本國海洋調查設施與研究資源，強化調查能力與技術研發，並推動國際合作、人才培育及產學研整合，實現科技創新與資源共享之政策目標。"},{"bill":"202110127910000","text":"為提升臺灣海洋科技，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","note":"一、揭櫫本條例之立法目的。\n二、為提升臺灣海洋科技，厚植海洋科技研究能量，強化臺灣海域基礎資訊之掌握，特設置國家海洋科技營運中心，爰參酌行政法人法，制定本條例。"}],"changed":true,"final":"為提升我國海洋科技能力，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。","finalWhy":"一、本條例之立法目的。\n二、為提升我國海洋科技能力，厚植海洋科技研究能量，強化我國海域基礎資訊之掌握，有效統籌運用我國海洋調查船，同時充實我國國家船模實驗室多功能水槽及其他有關海洋科技設施之研究能量，特設置本中心。","review":{"note":"照行政院提案通過","text":"為提升我國海洋科技能力，厚植海洋科技研究能量，特設國家海洋科技營運中心（以下簡稱本中心），並制定本條例。"}},{"no":"第二條","current":null,"versions":[{"bill":"201110098870000","text":"本中心為行政法人；其監督機關為海洋委員會。\n海洋委員會得指定專責機關（構）督導本中心業務。","note":"一、第一項定明本中心之組織型態及監督機關。\n二、參酌國家住宅及都市更新中心設置條例第二條第二項，於第二項定明監督機關得指定專責機關（構）督導本中心業務。"},{"bill":"202110104590000","text":"本中心為行政法人；其監督機關為海洋委員會。\n海洋委員會得指定專責機關（構）督導本中心業務。","note":"一、第一項定明本中心之組織型態及監督機關。\n二、參酌國家住宅及都市更新中心設置條例第二條第二項，於第二項定明監督機關得指定專責機關（構）督導本中心業務。"},{"bill":"202110105190000","text":"本中心為行政法人；其監督機關為海洋委員會。\n海洋委員會得指定專責機關（構）督導本中心業務。","note":"一、第一項定明本中心之組織型態及監督機關。\n二、參酌國家住宅及都市更新中心設置條例第二條第二項，於第二項定明監督機關得指定專責機關（構）督導本中心業務。"},{"bill":"202110105440000","text":"本中心為行政法人；其監督機關為海洋委員會。\n海洋委員會得指定專責機關（構）督導本中心業務。","note":"一、第一項定明本中心之組織型態及監督機關。\n二、參酌國家住宅及都市更新中心設置條例第二條第二項，於第二項定明監督機關得指定專責機關（構）督導本中心業務。"},{"bill":"202110105640000","text":"本中心為行政法人；其監督機關為海洋委員會。\n海洋委員會得指定專責機關（構）督導本中心業務。","note":"明定國家海洋科技營運中心組織型態及監督機關。"},{"bill":"202110100340000","text":"本中心為行政法人；其監督機關為海洋委員會。\n海洋委員會得指定專責機關（構）督導本中心業務。","note":"一、明定本中心之組織型態及監督機關。\n二、參照相關條例，規定監督機關可指定專責機關（構）督導本中心業務。"},{"bill 本中心置監事三人至五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關（構）代表。\n二、海洋及船舶研究、法律、會計或財務相關之學者、專家。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於總人數三分之一。","note":"一、第一項定明監事之人數、資格及其遴聘方式。\n二、第二項定明常務監事之選任方式。\n三、第三項定明監事之任一性別之保障比例。"},{"bill":"202110127910000","text":"本中心設監事會，置監事三人至五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關（構）代表。\n二、海洋及船舶研究、法律、會計或財務相關之學者、專家。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於總人數三分之一。","note":"一、第一項明定國家海洋科技營運中心監事之人數、資格及其遴聘方式。\n二、第二項明定常務監事產生方式。\n三、第三項明定監事會任一性別之保障比例。"}],"changed":true,"final":"本中心置監事三人至五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關（構）代表。\n二、海洋及船舶研究、法律、會計或財務相關之學者、專家。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於總人數三分之一。","finalWhy":"一、第一項定明監事之人數、資格及其遴聘方式。\n二、第二項定明常務監事之選任方式。\n三、第三項定明監事之任一性別之保障比例。","review":{"note":"照行政院提案通過","text":"本中心置監事三人至五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關（構）代表。\n二、海洋及船舶研究、法律、會計或財務相關之學者、專家。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於總人數三分之一。"}},{"no":"第八條","current":null,"versions":[{"bill":"201110098870000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110104590000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110105190000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110105440000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110105640000","text":"董事、監事任期為三年，期滿得續聘一次。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者之任期屆滿為止。","note":"一、第一項明定國家海洋科技營運中心董事及監事任期及續聘人數之比例。\n二、第二項明定國家海洋科技營運中心董事、監事為政府機關代表者，依其職務異動改聘；並明定其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110100340000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項規定董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項規定政府機關代表之董事、監事依職務異動改聘，及其他董事、監事任期屆滿前出缺補聘方式與補聘者之任期。"},{"bill":"202110103320000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項明定董事、監事的任期、可續聘次數及續聘人員比例上限。\n二、第二項明定政府機關代表擔任的董事、監事因職務異動須改聘的規定；以及其他董事、監事任期屆滿前出缺時的補聘方式及補聘人員的任期規定。"},{"bill":"202110111220000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110111060000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項明定董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項明定董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110111070000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110113560000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、本條就董事與監事之任期為三年，並得續聘一次，設下任職上限，確保組織活化。\n二、條文區分政府機關代表者與其他遴選人員之續任與改聘方式，提供彈性調整空間。\n三、補聘人選須由監督機關提報，且其任期為原任者剩餘任期，以維持制度連續性。"},{"bill":"202110113650000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110113550000","text":"董事、監事任期為三年，期滿得續聘一次，續聘人數不得超過總人數三分之二，且至少為三分之一。\n政府機關（構）代表依職務異動改聘，不受續聘限制。非政府代表之董事、監事任期未滿出缺時，由監督機關遴選補聘，任期至原屆期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110114390000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110123810000","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","note":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"202110127910000","text":"董事、監事任期為三年，期滿得續聘一次。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者之任期屆滿為止。","note":"一、第一項明定國家海洋科技營運中心董事及監事任期及續聘人數之比例。\n二、第二項明定國家海洋科技營運中心董事、監事為政府機關代表者，依其職務異動改聘；並明定其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"}],"changed":true,"final":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。","finalWhy":"一、第一項定明董事、監事之任期、續聘次數及續聘人數比例。\n二、第二項定明董事、監事為政府機關代表者，依其職務異動改聘；及其他董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。","review":{"note":"照行政院提案通過","text":"董事、監事任期為三年，期滿得續聘一次。續聘人數應達其總人數三分之一以上，並不得逾其總人數三分之二。\n依第六條第一項第一款及前條第一項第一款規定代表政府機關（構）出任之董事、監事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款及前條第一項第二款規定聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿為止。"}},{"no":"第九條","current":null,"versions":[{"bill":"201110098870000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110104590000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110105190000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110105440000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n六、具外國籍者。\n七、曾為大陸地區人民、香港居民、澳門居民者。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110105640000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過或拒絕接受查核。\n董事、監事有前項各款情形之一或無故連續不出席、列席董事會會議、監事會會議達三次者，應予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項明定國家海洋科技營運中心董事、監事消極聘任資格事由及其解聘事由。\n二、為保障當事人權益，爰第四項明定監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項明定國家海洋科技營運中心董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110100340000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項明確規範董事、監事的消極聘任資格及解聘事由，確保聘任過程公平、公正。\n二、為保障當事人之基本權利，第四項規定監督機關在解聘董事、監事前，必須給予當事人陳述意見及申辯的機會，以維護其合理的申訴程序。\n三、第五項規定董事、監事的遴選、解聘及補聘等相關事項的辦法，應由監督機關制定，以確保所有程序符合相關法律規定及透明運作。"},{"bill":"202110103320000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢、品行不端或有妨害國家尊嚴之行為，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項明定董事、監事的消極聘任資格條件及解聘事由；第三項第一款所謂妨害國家尊嚴之行為，係指臺灣地區及大陸地區人民關係條例第九條之三第二項之行為。\n二、為保障當事人權益，第四項明定監督機關在解聘董事、監事前，應給予當事人陳述意見及申辯的機會。\n三、第五項明定董事、監事遴聘相關事項的辦法由監督機關訂定。"},{"bill":"202110111220000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任 ，由監督機關定之。","note":"一、明確排除不得擔任董事與監事之資格，包括法律失格、破產、監護、輔助等情況。\n二、對於不適任者設有強制解聘條款，例如無故缺席或違法失職情節。\n三、列舉具體可解聘情事，如行為不檢、違法行賄、違反利益迴避等，並保障當事人陳述與申訴機會。\n四、授權監督機關訂定遴聘與解聘辦法，使制度更具操作性與明確性。"},{"bill":"202110113650000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110113550000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、未通過安全查核或拒絕查核者。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110114390000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110123810000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。"},{"bill":"202110127910000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過或拒絕接受查核。\n董事、監事有前項各款情形之一或無故連續不出席、列席董事會會議、監事會會議達三次者，應予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項至第三項明定國家海洋科技營運中心董事、監事消極聘任資格事由及其解聘事由。\n二、為保障當事人權益，爰第四項明定監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項明定國家海洋科技營運中心董事、監事之遴聘相關事項辦法，由監督機關定之。"}],"changed":true,"final":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","finalWhy":"一、第一項至第三項定明董事、監事之消極聘任資格及解聘事由。\n二、為保障當事人權益，於第四項定明監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n三、第五項定明董事、監事之遴聘相關事項辦法，由監督機關定之。","review":{"note":"照行政院提案通過","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告，或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n五、第二十條安全查核未通過，或拒絕接受查核。\n董事、監事有前項情形之一，或無故連續不出席、列席董事會會議達三次者，應予解聘。\n董事、監事有下列情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十六條第一項或第十七條利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。"}},{"no":"第十條","current":null,"versions":[{"bill":"201110098870000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任，應由監督機關訂定作業辦法遴聘之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項、第二項定明董事長之遴聘、解聘方式，及授權由監督機關訂定相關辦法。\n二、第三項定明董事長之職權及其不能執行職務之代理方式。\n三、第四項定明董事長之年齡限制。"},{"bill":"202110104590000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任，應由監督機關訂定作業辦法遴聘之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項、第二項定明董事長之遴聘、解聘方式，及授權由監督機關訂定相關辦法。\n二、第三項定明董事長之職權及其不能執行職務之代理方式。\n三、第四項定明董事長之年齡限制。"},{"bill":"202110105190000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任，應由監督機關訂定作業辦法遴聘之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項、第二項定明董事長之遴聘、解聘方式，及授權由監督機關訂定相關辦法。\n二、第三項定明董事長之職權及其不能執行職務之代理方式。\n三、第四項定明董事長之年齡限制。"},{"bill":"202110105440000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任，應由監督機關訂定作業辦法遴聘之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核 管理規章辦理，其權利義務關係，應以契約約定。\n二、為遵守利益迴避原則，避免徇私，爰於第二項定明董監事之配偶或其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n三、鑒於董事長對於本中心進用人員有決定權，理應較董事及監事有更嚴謹之規定，爰於第三項定明其配偶或三親等以內親屬不得擔任本中心職務。\n四、為避免董事、監事及本中心人員利用擔任本中心職務機會違背法令行賄及收賄，爰訂定第四項，並於第五項規定行為人之損害賠償責任。"},{"bill":"202110123810000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事之配偶或其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長不得進用其配偶或三親等以內血親、姻親，擔任本中心職務。\n董事、監事及本中心人員，不得利用擔任本中心職務機會，違背法令行賄及收賄，並損害本中心信譽。\n違反前項規定致本中心受有損害者，行為人應對本中心負損害賠償責任。","note":"一、第一項明定本中心人員之進用程序，應依據人事管理規章辦理，並以契約方式明確規範其權利義務。\n二、第二項為落實利益衝突迴避原則，規定董事及監事之配偶或三親等以內之血親、姻親，不得擔任總務、會計或人事相關職務，以防止人事決策流於偏私。\n三、第三項考量董事長對於人事任用具有最終決定權，爰對其親屬迴避適用範圍加以擴大，明定其配偶及三親等以內之親屬不得擔任本中心任何職務，以強化職務中立與公正。\n四、第四項規範董事、監事及本中心人員不得藉其職務圖利或從事賄賂等違法行為，行為人除依法負刑事責任外，尚應就因此所生損害負民事賠償責任，以保障組織運作之廉潔性。"},{"bill":"202110127910000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。\n董事、監事及本中心人員，不得利用擔任本中心職務機會，違背法令行賄及收賄，並損害本中心信譽。\n違反前項規定致本中心受有損害者，行為人應對其負損害賠償責任。","note":"一、第一項明定國家海洋科技營運中心進用人員依國家海洋科技營運中心人事管理規章辦理，其權利義務關係，應於契約中明定。\n二、為遵守利益迴避原則，避免徇私，爰第二項明定董監事之配偶及其三親等以內血親、姻親，不得擔任國家海洋科技營運中心總務、會計及人事職務。\n三、有鑑於國家海洋科技營運中心董事長對於國家海洋科技營運中心進用人員有決定權，理應較董事及監事有更嚴謹之規定，爰於第三項明定其配偶及三親等以內親屬不得擔任國家海洋科技營運中心之職務。\n四、為避免國家海洋科技營運中心董事、監事及該中心人員利用擔任該中心職務機會違背法令行賄及收賄，爰於第四項明定禁止之，並於第五項規定行為人之損害賠償責任。"}],"changed":true,"final":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事之配偶或其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長不得進用其配偶或三親等以內血親、姻親，擔任本中心職務。\n董事、監事及本中心人員，不得利用擔任本中心職務機會，違背法令行賄及收賄，並損害本中心信譽。\n違反前項規定致本中心受有損害者，行為人應對本中心負損害賠償責任。","finalWhy":"一、第一項定明本中心進用人員依本中心人事管理規章辦理，其權利義務關係，應以契約約定。\n二、為遵守利益迴避原則，避免徇私，爰於第二項定明董監事之配偶或其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n三、鑒於董事長對於本中心進用人員有決定權，理應較董事及監事有更嚴謹之規定，爰於第三項定明其配偶或三親等以內親屬不得擔任本中心職務。\n四、為避免董事、監事及本中心人員利用擔任本中心職務機會違背法令行賄及收賄，爰訂定第四項，並於第五項規定行為人之損害賠償責任。","review":{"note":"照行政院提案通過","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事之配偶或其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長不得進用其配偶或三親等以內血親、姻親，擔任本中心職務。\n董事、監事及本中心人員，不得利用擔任本中心職務機會，違背法令行賄及收賄，並損害本中心信譽。\n違反前項規定致本中心受有損害者，行為人應對本中心負損害賠償責任。"}},{"no":"第二十條","current":null,"versions":[{"bill":"201110098870000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110104590000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110105190000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110105440000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110105640000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他應遵行事項之辦法，由監督機關定之。","note":"一、第一項明定國家海洋科技營運中心人員應經安全查核。\n二、第二項明定安全查核之相關辦法由監督機關定之。"},{"bill":"202110100340000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項規定本中心人員需接受安全查核。\n二、第二項規定安全查核的具體辦法由監督機關制定。"},{"bill":"202110103320000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項明定本中心人員應經安全查核。\n二、第二項明定安全查核之相關辦法，由監督機關制定。"},{"bill":"202110111220000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110111060000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。\n本中心進用具有就業能力之身心障礙者人數，應符合身心障礙者權益保障法第三十八條第一項規定。","note":"一、第一項明定國家海洋科技營運中心人員應經安全查核。\n二、第二項明定安全查核之相關辦法，由監督機關定之。\n三、第三項參考行政法人類推適用《身心障礙者權益保障法》第三十八條第一項定額進用身心障礙者比率。"},{"bill":"202110111070000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110113560000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110113650000","text":"本中心應對所屬人員進行定期或不定期之安全查核。所屬人員拒絕接受查核或查核未通過者，不得辦理國家機密、軍事機密及國防秘密業務，必要時得不予進用。\n本中心對於規劃進用之人員應進行安全查核，拒絕接受查核或查核未通過者，應不予進用。\n第一項及第二項安全查核結果，應通知受查核人，於受查核人有不利之情形時，應許其陳述意見及申辯。\n前二項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經定期或不定期之安全查核，拒絕接受查核或查核未通過者，不得辦理機密或秘密業務，且必要時得不予進用，以維護國家機密安全。\n二、第二項定明本中心規劃進用之人員，應進行安全查核，拒絕接受查核或查核未通過者，應不予進用。\n三、第三項定明，安全查核之結果應通知受查核人，並於受查核人有不利之情形時，予以陳述意見及申辯之權利。\n四、第四項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110113550000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110114390000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員應經安全查核。\n二、第二項定明安全查核之相關辦法，由監督機關定之。"},{"bill":"202110123810000","text":"本中心人員應依涉密程度接受一般或特殊安全查核。\n一般安全查核由主管機關依規定辦理；涉及國家安全或重大利益之特殊安全查核，應由主管機關會同相關機關辦理之。\n對於規劃進用之人員，應先行辦理安全查核；拒絕接受查核或查核未通過者，應不予進用。\n依法應實施安全查核而怠於查核之主管或承辦人員，情節重大者，應移送監察院依法處理。\n安全查核之適用對象、程序、內容、救濟等相關事項之辦法，由主管機關會同監督機關定之。","note":"一、本條第一項明定本中心人員應依其職務涉密程度，接受一般或特殊安全查核，以作為任用及業務分派之必要條件，確保人員適任並維護國家安全整體利益。\n二、第二項明定一般查核由主管機關辦理；特殊查核因涉及國安及重大利益，應由主管機關會同國安、情治等相關機關辦理。\n三、第三項明定未經查核或查核未通過者，不得進用，確保進用人員適格。\n四、第四項增列責任條款，對未依規定辦理查核致生疏失者，情節重大時移送監察院依法處理。\n五、第五項授權主管機關會同監督機關訂定查核辦法，明確規範查核對象、程序、內容及救濟機制。"},{"bill":"202110127910000","text":"本中心人員應經安全查核。\n前項安全查核之適用對象、程序、內容、救濟及其他應遵行事項之辦法，由監督機關定之。","note":"一、第一項明定國家海洋科技營運中心人員應經安全查核。\n二、第二項明定安全查核之相關辦法由監督機關定之。"}],"changed":true,"final":"本中心人員應依涉密程度接受一般或特殊安全查核。\n一般安全查核由監督機關依規定辦理；涉及國家安全或重大利益之特殊安全查核，應由監督機關會同相關機關辦理之。\n對於規劃進用之人員，應先行辦理安全查核；拒絕接受查核或查核未通過者，應不予進用。\n依法應實施安全查核而怠於辦理查核之相關機關人員，情節重大者，應移送監察院依法處理。\n安全查核之適用對象、程序、內容、救濟等相關事項之辦法，由監督機關會商有關機關定之。","finalWhy":"照委員所提修正動議通過。,","review":{"note":"照委員黃國昌等7人所提修正動議通過","text":"本中心人員應依涉密程度接受一般或特殊安全查核。\n一般安全查核由監督機關依規定辦理；涉及國家安全或重大利益之特殊安全查核，應由監督機關會同相關機關辦理之。\n對於規劃進用之人員，應先行辦理安全查核；拒絕接受查核或查核未通過者，應不予進用。\n依法應實施安全查核而怠於辦理查核之相關機關人員，情節重大者，應移送監察院依法處理。\n安全查核之適用對象、程序、內容、救濟等相關事項之辦法，由監督機關會商有關機關定之。"}},{"no":"第二十一條","current":null,"versions":[{"bill":"201110098870000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項定明出國（境）管制之相關辦法由監督機關定之。"},{"bill":"202110104590000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項定明出國（境）管制之相關辦法由監督機關定之。"},{"bill":"202110105190000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項定明出國（境）管制之相關辦法由監督機關定之。"},{"bill":"202110105440000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項定明出國（境）管制之相關辦法由監督機關定之。"},{"bill":"202110105640000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他應遵行事項之辦法，由監督機關定之。","note":"一、第一項明定國家海洋科技營運中心人員出國（境）管制時間及應經監督機關核准。\n二、第二項明定出國（境）管制之相關辦法由監督機關定之。"},{"bill":"202110100340000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項規定本中心人員出國（境）需經監督機關許可，且限制期限為離職後三年內。\n二、第二項規定出國（境）管制的具體辦法由監督機關制定。"},{"bill":"202110103320000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、鑒於本中心可能接觸海洋科技、國防或其他國家機密資訊，為防止機密外洩及確保國家安全，爰於第一項明定本中心人員離職後一定期間內出國（境）應經監督機關許可之規定。\n二、第二項明定出國（境）管制的相關辦法授權由監督機關訂定。"},{"bill":"202110111220000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項定明出國（境）管制之相關辦法由監督機關定之。"},{"bill":"202110111060000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項明定國家海洋科技營運中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項明定出國（境）管制之相關辦法由監督機關定之。"},{"bill":"202110111070000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、第一項定明本中心人員出國（境）管制時間及應經監督機關許可。\n二、第二項定明出國（境）管制之相關辦法由監督機關定之。"},{"bill":"202110113560000","text":"本中心現職及離職後三年內人員應經監督機關許可，始得出國（境）。其他法令另有規定者，從其規定。\n前項所定人員之範圍、涉密基準、申請、許可條件、程序、廢止及其他相關事項之辦法，由監督機關定之。","note":"一、對現職與離職三年內人員設出國（境）管制，避免資料外洩風險。\n二、授權監督機關制定相關程序、基準與申請流程 本中心應訂定年度營運計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、為期本中心長遠、穩定之發展，第一項定明本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定，俾利監督。\n二、第二項定明本中心應訂定年度營運計畫，該計畫係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦予彈性，該年度營運計畫及其預算經董事會通過後，報請監督機關備查。"},{"bill":"202110105440000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度營運計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、為期本中心長遠、穩定之發展，第一項定明本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定，俾利監督。\n二、第二項定明本中心應訂定年度營運計畫，該計畫係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦予彈性，該年度營運計畫及其預算經董事會通過後，報請監督機關備查。"},{"bill":"202110105640000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度營運計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、為謀國家海洋科技營運中心長遠、穩定之發展，第一項明定國家海洋科技營運中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定，俾利監督。\n二、第二項年度營運計畫，係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦予彈性，該年度營運計畫及其預算經董事會通過後，應報請監督機關備查。"},{"bill":"202110100340000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度營運計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、為確保本中心的長遠發展，第一項規定本中心應擬訂發展目標及計畫，經董事會通過後，報請監督機關核定，以便監督。\n二、第二項規定本中心應訂定年度營運計畫，該計畫每年根據監督機關核定的發展目標（計畫）架構訂定，並與第一項計畫有所區別。該年度營運計畫及預算經董事會通過後，報請監督機關備查，以提供必要的彈性。"},{"bill":"202110103320000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度營運計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、為確保本中心能夠長期穩定發展，第一項明定本中心應擬訂發展目標及計畫，經董事會通過後報請監督機關核定，以利監督機關掌握本中心發展方向。\n二、第二項明定本中心應訂定年度營運計畫，並依據已核定的發展目標框架每年制定，與第一項長期計畫不同。為增加營運彈性，年度營運計畫及預算經董事會通過後，僅需報請監督機關備查。"},{"bill":"202110111220000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度營運計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、為期本中心長遠、穩定之發展，第一項定明本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定，俾利監督。\n二、第二項定明本中心應訂定年度營運計畫，該計畫係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦予彈性，該年度營運計畫及其預算經董事會通過後，報請監督機關備查。"},{"bill":"202110111060000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度營運計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、為期國家海洋科技營運中心長遠、穩定之發展，第一項明定本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定，俾利監督。\n二、第二項明定國家海洋科技營運中心應訂定年度營運計畫，該計畫係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦予彈性，該年度營運計畫及其預算經董事會通過後，報請監督機關備查。"},{"bill":"202110111070000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度營運計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、為期本中心長遠、穩定之發展，第一項定明本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定， 訂定收支管理規章管理自主財源，報請監督機關核定。","review":{"note":"照行政院提案通過","text":"政府機關（構）核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n前項經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將本中心年度預算書，送立法院審議。\n本中心自主財源及其運用管理相關事項，由本中心訂定收支管理規章，報請監督機關核定。"}},{"no":"第二十九條","current":null,"versions":[{"bill":"201110098870000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、本中心雖為新設行政法人，惟設立本中心所需主要設備，船模實驗室多功能水槽及海洋基礎調查船係由國家海洋研究院所建置，為使本中心順利運作，爰於第一項定明本中心因業務上有必要使用公有財產時之處理方式，及於土地法、國有財產法、地方政府公產管理法令作適度鬆綁之規定。\n二、第二項定明本中心價購公有不動產，其土地及地上建築改良物之價款計算標準。\n三、第三項定明以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n四、第四項定明自有財產之範圍。\n五、第五項定明第一項無償提供使用及第三項之公有財產，以本中心為管理人，所生之利益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其保管、使用、收益等事項，由監督機關另訂辦法規範。\n六、第六項定明公有財產用途廢止時，應移交各級政府財產管理機關接管。\n七、第七項定明接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。"},{"bill":"202110104590000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、本中心雖為新設行政法人，惟設立本中心所需主要設備，船模實驗室多功能水槽及海洋基礎調查船係由國家海洋研究院所建置，為使本中心順利運作，爰於第一項定明本中心因業務上有必要使用公有財產時之處理方式，及於土地法、國有財產法、地方政府公產管理法令作適度鬆綁之規定。\n二、第二項定明本中心價購公有不動產，其土地及地上建築改良物之價款計算標準。\n三、第三項定明以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n四、第四項定明自有財產之範圍。\n五、第五項定明第一項無償提供使用及第三項之公有財產，以本中心為管理人，所生之利益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其保管、使用、收益等事項，由監督機關另訂辦法規範。\n六、第六項定明公有財產用途廢止時，應移交各級政府財產管理機關接管。\n七、第七項定明接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。 經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制，其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、考量國家海洋科技營運中心雖為新設行政法人，惟設立該中心所需主要設備係由國家海洋研究院爭取中長程個案計畫所建置，為使國家海洋科技營運中心財產得順利完成捐贈程序，爰於第一項明定國家海洋科技營運中心因業務上有必要使用公有財產時之處理方式及土地法、國有財產法、地方政府公產管理法令作適度鬆綁之規定。\n二、第二項明定國家海洋科技營運中心價購公有不動產之規定，並明定土地及地上建築改良物之價款計算標準。\n三、第三項規定以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n四、第四項規定自有財產之範圍。\n五、第五項規定第一項無償提供使用及第三項之公有財產，以國家海洋科技營運中心為管理人，所生之利益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其保管、使用、收益等事項，由監督機關另訂辦法規範之。\n六、第六項規定公有財產用途廢止時，應移交各級政府財產管理機關接管。\n七、第七項規定接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。"},{"bill":"202110100340000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、為確保本中心順利運作，規定在業務上需使用公有財產時，可依需求適度放寬土地法、國有財產法及地方政府公產管理法令相關規定。\n二、規定公有不動產之價購計算標準，包括土地及地上建築物的價格。\n三、規定由政府機關核撥經費指定用途所購置之財產為公有財產。\n四、定義自有財產範圍。\n五、規定無償提供使用的公有財產由本中心管理，其產生的利益列為本中心收入，且不受國有財產法及地方政府公產管理法令限制，具體管理辦法由監督機關訂定。\n六、規定公有財產用途廢止時，應移交各級政府財產管理機關。\n七、規定接受捐贈之公有不動產若不再使用，應歸還原捐贈機關，不得任意處分。"},{"bill":"202110103320000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、第一項明定本中心因業務需要使用公有財產時的處理方式，並對土地法、國有財產法、地方政府公產管理法令做適度鬆綁。\n二、第二項明定本中心價購公有不動產時，土地及地 本中心所需主要設備，船模實驗室多功能水槽及海洋基礎調查船係由國家海洋研究院所建置，為使本中心順利運作，爰於第一項定明本中心因業務上有必要使用公有財產時之處理方式，及於土地法、國有財產法、地方政府公產管理法令作適度鬆綁之規定。\n二、第二項定明本中心價購公有不動產，其土地及地上建築改良物之價款計算標準。\n三、第三項定明以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n四、第四項定明自有財產之範圍。\n五、第五項定明第一項無償提供使用及第三項之公有財產，以本中心為管理人，所生之利益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其保管、使用、收益等事項，由監督機關另訂辦法規範。\n六、第六項定明公有財產用途廢止時，應移交各級政府財產管理機關接管。\n七、第七項定明接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。"},{"bill":"202110127910000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制，其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","note":"一、考量國家海洋科技營運中心雖為新設行政法人，惟設立該中心所需主要設備係由國家海洋研究院爭取中長程個案計畫所建置，為使國家海洋科技營運中心財產得順利完成捐贈程序，爰於第一項明定國家海洋科技營運中心因業務上有必要使用公有財產時之處理方式及土地法、國有財產法、地方政府公產管理法令作適度鬆綁之規定。\n二、第二項明定國家海洋科技營運中心價購公有不動產之規定，並明定土地及地上建築改良物之價款計算標準。\n三、第三項規定以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n四、第四項規定自有財產之範圍。\n五、第五項規定第一項無償提供使用及第三項之公有財產，以國家海洋科技營運中心為管理人，所生之利益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其保管、使用、收益等事項，由監督機關另訂辦法規範之。\n六、第六項規定公有財產用途廢止時，應移交各級政府財產管理機關接管。\n七、第七項規定接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。"}],"changed":true,"final":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","finalWhy":"一、本中心雖為新設行政法人，惟設立本中心所需主要設備，船模實驗室多功能水槽及海洋基礎調查船係由國家海洋研究院所建置，為使本中心順利運作，爰於第一項定明本中心因業務上有必要使用公有財產時之處理方式，及於土地法、國有財產法、地方政府公產管理法令作適度鬆綁之規定。\n二、第二項定明本中心價購公有不動產，其土地及地上建築改良物之價款計算標準。\n三、第三項定明以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n四、第四項定明自有財產之範圍。\n五、第五項定明第一項無償提供使用及第三項之公有財產，以本中心為管理人，所生之利益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其保管、使用、收益等事項，由監督機關另訂辦法規範。\n六、第六項定明公有財產用途廢止時，應移交各級政府財產管理機關接管。\n七、第七項定明接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。","review":{"note":"照行政院提案通過","text":"本中心因業務必要使用之公有財產，得價購或由政府機關（構）採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關（構）核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關（構），不得任意處分。"}},{"no":"第三十條","current":null,"versions":[{"bill":"201110098870000","text":"本中心所舉借之債務，以具自償性質者為限，並先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"本中心係行政法人，為避免隨意舉債而無力償還，衍生由政府概括承受之後遺症，同時為免未來計算整體政府債務有所爭議，爰定明本中心舉借之債務以具自償性質者為限，並應先送監督機關核定；另定明不能自償時之處理方式。"},{"bill":"202110104590000","text":"本中心所舉借之債務，以具自償性質者為限，並先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"本中心係行政法人，為避免隨意舉債而無力償還，衍生由政府概括承受之後遺症，同時為免未來計算整體政府債務有所爭議，爰定明本中心舉借之債務以具自償性質者為限，並應先送監督機關核定；另定明不能自償時之處理方式。"},{"bill":"202110105190000","text":"本中心所舉借之債務，以具自償性質者為限，並先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"本中心係行政法人，為避免隨意舉債而無力償還，衍生由政府概括承受之後遺症，同時為免未來計算整體政府債務有所爭議，爰定明本中心舉借之債務以具自償性質者為限，並應先送監督機關核定；另定明不能自償時之處理方式。"},{"bill":"202110105440000","text":"本中心所舉借之債務，以具自償性質者為限，並先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"本中心係行政法人，為避免隨意舉債而無力償還，衍生由政府概括承受之後遺症，同時為免未來計算整體政府債務有所爭議，爰定明本中心舉借之債務以具自償性質者為限，並應先送監督機關核定；另定明不能自償時之處理方式。"},{"bill":"202110105640000","text":"本中心所舉借之債務，以具自償性質者為限，並先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"國家海洋科技營運中心係行政法人，為避免隨意舉債而無力償還，衍生由政府概括承受之問題，同時為免未來計算整體政府債務有所爭議，爰明定本中心舉借之債務以具自償性質為限，並應先送監督機關核定。"},{"bill":"202110100340000","text":"本中心所舉借之債務，以具自償性質者為限，並先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"為避免本中心隨意舉債而無力償還，並避免政府承擔相關責任，規定本中心舉借之債務必具自償性質，且需先送監督機關核定；若無法自償，應提出處理方案。"},{"bill":"202110103320000","text":"本中心所舉借之債務， 110105640000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"國家海洋科技營運中心係行政法人，其定位為公法人，民眾對於國家海洋科技營運中心行使公權力所為行政處分不服時，明定得依訴願法規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"202110100340000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心為行政法人，屬於公法人。對於本中心行使公權力所作之行政處分不服者，可依訴願法相關規定，向監督機關提起訴願，以確定訴願管轄機關。"},{"bill":"202110103320000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"一、明定人民對本中心行政處分不服時的救濟途徑。\n二、因本中心為行政法人，具公法人性質，爰明定當事人可依訴願法向監督機關提起訴願，既確立訴願管轄機關，也明確行政救濟途徑。"},{"bill":"202110111220000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其性質為公法人，人民對於本中心行使公權力所為行政處分不服時，定明得依訴願法相關規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"202110111060000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"國家海洋科技營運中心係行政法人，其性質為公法人，人民對於國家海洋科技營運中心行使公權力所為行政處分不服時，定明得依訴願法相關規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"202110111070000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其性質為公法人，人民對於本中心行使公權力所為行政處分不服時，定明得依訴願法相關規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"202110113560000","text":"監督機關應每年將本中心之年度營運計畫、預算、決算及績效評鑑報告，提報立法院備查。\n立法院得要求監督機關首長率本中心董事長、執行長或相關主管至立法院報告並備詢。","note":"一、本條明定監督機關應主動將本中心之年度營運計畫、預算、決算及績效評鑑報告，提報立法院備查，強化立法院對行政法人之資訊掌握與政策監督功能，確保公共資源使用透明。\n二、第二項授權立法院就本中心營運進行實質監督，得要求監督機關首長率同董事長、執行長或相關主管赴院報告並備詢，落實行政對立法負責原則，亦可於有爭議或重大變革時適用，提升政策可受公評程度。"},{"bill":"202110113650000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其性質為公法人，人民對於本中心行使公權力所為行政處分不服時，定明得依訴願法相關規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"202110113550000","text":"對本中心所作行政處分不服者，當事人得依訴願法規定向監督機關提起訴願。","note":"本中心係行政法人，其性質為公法人，人民對於本中心行使公權力所為行政處分不服時，定明得依訴願法相關規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"202110114390000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其性質為公法人，人民對於本中心行使公權力所為行政處分不服時，定明得依訴願法相關規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"202110123810000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其性質為公法人，人民對於本中心行使公權力所為行政處分不服時，定明得依訴願法相關規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"202110127910000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"國家海洋科技營運中心係行政法人，其定位為公法人，民眾對於國家海洋科技營運中心行使公權力所為行政處分不服時，明定得依訴願法規定，向監督機關提起訴願，以確定其訴願管 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);
  fillBench($('bench'), a);
}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }
  const bench = el('div', {class: 'bench'});
  panel.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  fillBench(bench, a);
}
D.arts.forEach(a => {
  const btn = el('button', {type: 'button', 'data-no': a.no, class: 'chip' + (a.changed ? ' passed' : ''), text: a.no});
  btn.addEventListener('click', () => { current = a.no; showArticle(); });

});
showArticle();

/* ---------- 提案版本 ---------- */
const partyLine = p => p.party.map(([n]) => n).join('、');
function people(p, role, label) {   // 一列名單：姓名後面標黨籍
  const list = (p.people || []).filter(x => x[2] === role);
  if (!list.length) return null;
  const box = el('div', {class: 'people'});
  list.forEach(([n, pt]) => box.append(el('span', {class: 'person'}, n, el('small', {text: pt}))));
  const peek = role === '提案' ? list.map(x => x[0]).join('、') : null;   // 只有提案人收合時預覽姓名
  return fold(label + ' ' + list.length + ' 位', box, peek);
}
function fold(label, content, peek) {   // 點開才看全文；有 peek 時收合狀態露一行預覽
  const s = el('summary', null, el('b', {text: label}));
  if (peek) s.append(el('span', {class: 'peek', text: peek}));
  return el('details', {class: 'fold'}, s, content);
}
const dlg = el('dialog', {class: 'artdlg', 'aria-labelledby': 'dlgt'});
document.body.append(dlg);
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openArticleDialog(p, no) {   // 獨立視窗看某一條的各版本，可在該提案動到的條文間切換
  dlg.textContent = '';
  const close = el('button', {type: 'button', class: 'chip', text: '關閉 ✕'});
  close.addEventListener('click', () => dlg.close());
  const nav = el('div', {class: 'chips'});
  p.arts.forEach(n => {
    const art = D.arts.find(x => x.no === n);
    const b = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-pressed': String(n === no), text: n});
    b.addEventListener('click', () => openArticleDialog(p, n));
    nav.append(b);
  });
  const body = el('div', {class: 'dlgbody'});
  const a = D.arts.find(x => x.no === no);
  if (a) {
    const bench = el('div', {class: 'bench'});
    fillBench(bench, a);
    body.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  } else body.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'}));
  dlg.append(el('div', {class: 'dlghead'}, el('div', {class: 'dlgtitle'}, el('h3', {id: 'dlgt', text: shortWho(p) + ' 提案　逐條對照'}), close), nav), body);
  if (!dlg.open) dlg.showModal();
}
function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照
  const c = el('div', {class: 'pdetail'});
  c.append(el('div', {class: 'line', text: p.date + ' 提案　' + partyLine(p)}));
  const a = people(p, '提案', '提案人'), b = people(p, '連署', '連署人');
  if (a) c.append(a);
  if (b) c.append(b);
  if (p.reason) { const r = p.reason.replace(/\n/g, ' '); c.append(fold('修法目的', el('p', {class: 'reason', text: r}))); }
  const chips = el('div', {class: 'sub'}, (ENACT ? '條文' : '修正條文' + (inProps ? '' : '（按鈕若是紅色代表真的修正了）')) + '：');
  const panel = el('div', {class: 'inbench', hidden: ''});
  let shown = null;
  p.arts.forEach(no => {
    const art = D.arts.find(x => x.no === no);
    const btn = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-expanded': 'false', text: no});
    btn.addEventListener('click', () => {
      if (inProps) { openArticleDialog(p, no); return; }
      const closing = shown === no;
      chips.querySelectorAll('button').forEach(x => x.setAttribute('aria-expanded', 'false'));
      panel.textContent = ''; panel.hidden = closing; shown = closing ? null : no;
      if (!closing) { btn.setAttribute('aria-expanded', 'true'); inlineBench(panel, no); }
    });
    chips.append(btn);
  });
  c.append(chips, panel);
  const ref = el('div', {class: 'ref'}, link(p.url, '議事網提案頁'));
  if (p.pdf) ref.append('、', link(p.pdf, '關係文書 PDF'));
  c.append(fold('資料出處', ref));
  return c;
}
D.props.forEach(p => {
  const c = el('article', {class: 'prop', id: 'prop-' + p.id});
  c.append(el('h3', {text: shortWho(p)}), propDetail(p, true));

/* ---------- 歷程與逐字稿 ---------- */
const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
function renderTranscript(box, data, s) {
  box.textContent = '';
  const clip = {}; s.clips.forEach(c => { clip[normName(c.n) + '|' + c.t] = c.u; (clip[normName(c.n)] = clip[normName(c.n)] || c.u); });
  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      d.append(who);
      if (!chair && !first.has(t.s)) first.set(t.s, d);
    }
    const put = (into, b) => {
      if (typeof b === 'string') into.append(el('p', {text: b}));
      else if (b.fold) {   // 照登的文件（提案條文全文、審查報告、機關書面報告）：收成一行
        const inner = el('div', {class: 'readout'});
        b.b.forEach(x => put(inner, x));
        into.append(fold(b.fold, inner));
        const p = b.bill && propById[b.bill];
        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});
          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));
          into.append(el('div', {class: 'readnote'}, btn));
        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));
    turns.append(d);
  });
  const idx = el('div', {class: 'idx'}, el('span', {text: '跳到發言者（' + first.size + ' 位）'}));
  const chips = el('div', {class: 'chips'});
  first.forEach((node, name) => { const b = el('button', {type: 'button', class: 'chip', text: name}); b.addEventListener('click', () => { turns.scrollTop = node.offsetTop - turns.offsetTop; }); chips.append(b); });
  idx.append(chips);
  box.append(idx, turns);
}
/* 一讀、二讀、三讀標籤的說明小框：滑鼠停留 1 秒或點一下就浮出 */
const READING = {
  '一讀': {t: '一讀會', sub: '朗讀標題、交付審查', what: '議案送進立法院後，在院會中由主席宣付朗讀議案名稱。', pts: [
    '朗讀標題後，通常會將法案交付給相關的委員會進行詳細的實質審查（例如：教育及文化委員會、司法及法制委員會等）。',
    '如果有立委提案並經 20 人以上連署、表決通過，也可以選擇「逕付二讀」（跳過委員會審查）。',
    '如果有異議，可以退回程序委員會或不予審議。']},
  '逕付二讀': {t: '逕付二讀', sub: '跳過委員會審查，直接排進院會二讀', what: '院會決定這個提案不交委員會審查（或從委員會抽出），直接進入二讀。', pts: [
    '通常在一讀報告事項時由黨團提議，院會無異議或表決通過。',
    '逕付二讀的提案多半會交黨團協商，或與已經審查完的相關提案併案處理。',
    '這一天只有主席宣告的幾句話，沒有實質討論。']},
  '二讀': {t: '二讀會', sub: '實質討論、逐條審議，最關鍵的階段', what: '委員會審查完畢，或是經逕付二讀後，將法案送到院會進行全體討論與表決。', pts: [
    '這是法案通過與否最關鍵、辯論最激烈的階段。',
    '進行廣泛討論以及逐條討論、修正。',
    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      btn.addEventListener('click', async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      });
      acts.append(btn);
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');

    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);

$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
