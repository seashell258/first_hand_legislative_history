署"],["王正旭","民進黨","連署"],["沈伯洋","民進黨","連署"],["林月琴","民進黨","連署"],["吳思瑤","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["范雲","民進黨","連署"],["郭昱晴","民進黨","連署"],["王義川","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳培瑜","民進黨","連署"],["林宜瑾","民進黨","連署"],["陳秀寳","民進黨","連署"],["羅美玲","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員李坤城等16人，有鑑於近來保單強制執行爆量，乃至維持基本生活所需的保單都被強制執行，影響人民的基本生活。為確保保險契約的解約金債權遭執行機關扣押時，保戶仍能維持基本生活保障，並允許符合特定條件的被保險人或受益人介入契約，成為新要保人以延續保單。此外，提供保險業者法律依據以委託他人辦理業務，保障無法獲得承保的特定對象權益，維護市場秩序，並配合洗錢防制法的修正，爰擬具「保險法部分條文修正草案」。是否有當？敬請公決。","arts":["第一百二十三條之一","第一百二十三條之二","第一百二十九條之一","第一百三十條","第一百三十二條之一","第一百四十八條之三","第一百六十七條之一","第一百六十八條之七","第一百七十一條之一"]},{"id":"202110108790000","who":"委員李彥秀等16人","date":"2025-04-25","name":"「保險法增訂第一百二十三條之一條文草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110108790000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/09/LCEWA01_110309_00111.pdf","proposers":["李彥秀","羅廷瑋"],"ncosign":14,"people":[["李彥秀","國民黨","提案"],["羅廷瑋","國民黨","提案"],["黃仁","國民黨","連署"],["謝龍介","國民黨","連署"],["黃建賓","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["陳永康","國民黨","連署"],["牛煦庭","國民黨","連署"],["魯明哲","國民黨","連署"],["張智倫","國民黨","連署"],["王育敏","國民黨","連署"],["盧縣一","國民黨","連署"],["涂權吉","國民黨","連署"],["葛如鈞","國民黨","連署"],["邱若華","國民黨","連署"],["廖先翔","國民黨","連署"]],"party":[["國民黨",16]],"reason":"本院委員李彥秀、羅廷瑋等16人，有鑑於最高法院民事大法庭108年度台抗大字第897號裁定，認執行法院於必要時得終止債務人為要保人之保險契約，並命保險公司償付解約金。此一作法雖保障債權人權益，卻可能因保險契約終止，導致被保險人或受益人喪失保險保障。故為兼顧債權人實現債權與被保險人維持必要保險保障之需求，爰參考外國立法例，增訂介入權制度，允許特定利害關係人於保險契約受強制執行時，介入成為新要保人，以延續契約效力，爰擬具「保險法增訂第一百二十三條之一條文草案」。是否有當？敬請公決。","arts":["第一百二十三條之一"]},{"id":"202110114380000","who":"委員郭國文等18人","date":"2025-05-02","name":"「保險法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110114380000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/10/LCEWA01_110310_00054.pdf","proposers":["郭國文"],"ncosign":17,"people":[["郭國文","民進黨","提案"],["黃秀芳","民進黨","連署"],["李坤城","民進黨","連署"],["王美惠","民進黨","連署"],["陳瑩","民進黨","連署"],["張雅琳","民進黨","連署"],["吳秉叡","民進黨","連署"],["林月琴","民進黨","連署"],["林俊憲","民進黨","連署"],["沈伯洋","民進黨","連署"],["黃捷","民進黨","連署"],["賴瑞隆","民進黨","連署"],["陳素月","民進黨","連署"],["鍾佳濱","民進黨","連署"],["王正旭","民進黨","連署"],["陳秀寳","民進黨","連署"],["陳俊宇","民進黨","連署"],["許智傑","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員郭國文等18人，有鑑於最高法院民事大法庭108年度台抗大字第897號裁定認定人壽保險契約解約金債權可作為強制執行之標的，有別於過去司法實務上多數見解，導致眾多保單遭扣押及強制解約，嚴重影響被保險人及受益人權益，甚至影響其生計，並造成法院業務量暴增，且更衝擊保險制度之存在意義。考量保險制度已為現代社會安全保障不可或缺之一環，為避免保險制度遭受過大衝擊，並平衡債權人、債務人關係，保障其最低生活需求，保單強制執行應有其界限，併採「介入權」之模式，保障受益人權益。另外，為保障保戶權益，要求保險業者建立內部控制制度，並配合洗錢防制法修正相關規定，爰擬具「保險法部分條文修正草案」。是否有當？敬請公決。","arts":["第一百二十三條之一","第一百二十三條之二","第一百二十九條之一","第一百三十條","第一百三十二條之一","第一百四十八條之三","第一百六十七條之一","第一百六十八條之七","第一百七十一條之一"]},{"id":"202110114340000","who":"委員吳秉叡等20人","date":"2025-05-02","name":"「保險法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110114340000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/10/LCEWA01_110310_00056.pdf","proposers":["吳秉叡"],"ncosign":19,"people":[["吳秉叡","民進黨","提案"],["蔡其昌","民進黨","連署"],["沈發惠","民進黨","連署"],["林宜瑾","民進黨","連署"],["賴惠員","民進黨","連署"],["徐富癸","民進黨","連署"],["張宏陸","民進黨","連署"],["張雅琳","民進黨","連署"],["許智傑","民進黨","連署"],["劉建國","民進黨","連署"],["陳秀寳","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["王義川","民進黨","連署"],["范雲","民進黨","連署"],["吳思瑤","民進黨","連署"],["羅美玲","民進黨","連署"],["陳俊宇","民進黨","連署"],["郭國文","民進黨","連署"],["黃捷","民進黨","連署"],["王正旭","民進黨","連署"]],"party":[["民進黨",20]],"reason":"本院委員吳秉叡等20人，鑒於近年民眾保單屢遭法院強制執行，考量人壽保險具有填補被保險人或其遺族生活經濟損失，具安定社會之功能，應給予一定程度最低保障，避免經濟弱勢民眾生存風險持續擴大，爰擬具「保險法部分條文修正草案」。是否有當？敬請公決。","arts":["第一百二十三條之一","第一百二十九條之一","第一百三十條","第一百三十二條之一"]}],"arts":[{"no":"第一百二十三條之一","current":null,"versions":[{"bill":"202110043570000","text":"保險事故發生前，保單價值準備金請求權經法院扣押、要保人受破產宣告、經依消費者債務清理條例裁定開始更生或清算程序時，具名指定之受益人得經要保人及被保險人之書面同意，介入保險契約，取得要保人之地位。\n無具名指定之受益人者，被保險人、要保人或被保險人之父母、配偶及子女有前項之權利。\n依前二項規定介入保險契約者，應向執行法院或法院執行命令所指定之債權人給付相當於解約金或投資型保險帳戶價值之金額，並由執行法院通知保險人，始生介入之效力，再由保險人據以變更要保人為介入權人。\n自第一項事由發生時起，得依第一項及第二項規定介入保險契約但三個月內不行使者，其權利消滅。\n依第一項及第二項規定介入保險契約者，視為對被保險人之生命或身體有保險利益。","note":"一、本條新增。\n二、為兼顧要保人之債權人與受益人之保護，第一項明定具名指定受益人、要保人或被保險人一定範圍內之親屬，得介入人壽保險契約，並限縮有權介入保險契約者之範圍，以具名指定之受益人為原則，未具名指定受益人（包括無具名指定受益人及類名指定受益人）則以被保險人要保人或被保險人之父母、配偶及子女為介入權人。同時，為使受益人之利益不因其他債權人之執行行為而受影響，明訂行使介入權之效果為法定契約承擔，使行使介入權之人成為該保險契約之新要保人。\n三、允許介入權人行使權利，係為兼顧債權人與介入權人之保護，故欲行使介入權以阻止保險契約之終止，應以介入權人提出解約金或投資型保險契約帳戶價值之額度之金額為要件，以替代債權人聲請強制執行保險契約之利益。\n四、介入權之性質為形成權，足以變更保險契約之當事人，不宜長期存在，以免保險契約關係長時間處於不確定的狀態，故明訂自本條第一項所定經法院扣押、要保人受破產宣告、經依消費者債務清理條例裁定開始更生或清算程序等事由發生效力時起三個月內為之。\n五、介入權人與被保險人間若無本法第十六條規定的保險利益時，宜特別規定經要保人及被保險人書面同意介入者，視為對被保險人有保險利益，以免因保險利益而導致其介入權受不當限制。"},{"bill":"201110098880000","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾債務人最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍計算之三個月金額者，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、鑑於最高法院民事大法庭一百零八年度台抗大字第八九七號裁定肯認人壽保險契約之解約金債權得為強制執行之標的，但未及於健康保險契約及傷害保險契約。考量人壽保險之本質為保障被保險人之生命及身體，可填補被保險人身故後其遺族之生活經濟損失及所需費用，又健康保險及傷害保險亦可提供被保險人維持生活經濟安定之保險保障，具安定社會之功能，宜與其他得強制執行之財產為不同考量。為確保國人於人壽保險契約之解約金債權受強制執行下仍得維持一定之保險保障、兼顧債權人實現債權利益，爰於本條明定人壽保險契約解約金債權之強制執行原則，並分別新增第一百二十九條之一及第一百三十二條之一明定要保人為債務人之健康保險及傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。\n三、考量目前執行法院辦理人壽保險契約強制執行作業，係合併通算債務人名下全部壽險契約之解約金債權，併同考量酌留債務人生活所必需數額後始得對人壽保險契約之解約金債權予以強制執行。惟合併通算及查明債務人於各保險公司之保險契約之解約金數額，作業複雜，造成執行機關及保險公司付出相當人力及作業成本，衍生相當社會成本，為使法規政策制定符合成本效益精神，確保強制執行之效益高於社會成本，本次所定人壽保險契約解約金債權之強制執行原則，允宜採簡化便利之認定標準，以各有效契約之解約金債權金額做為豁免扣押或強制執行標的之門檻。另經參酌強制執行法第一百二十二條第三項所定以最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍作為債務人生活所必需數額，又該生活所必需數額之三個月金額於一百十四年約介於新臺幣五萬元至七萬元之間，以該數額作為豁免門檻，應得以豁免相當數量之壽險契約解約金債權扣押或執行案件，有利於執行機關及保險公司減輕作業負擔及降低社會成本，同時得為債務人保留一定數額之人壽保險保障，並兼顧債權人實現債權利益，符合上開民事大法庭裁定理由所揭櫫採取之執行方法所造成之損害，不得與欲達成之執行目的之利益顯失均衡之比例原則精神，爰明定要保人為債務人之人壽保險契約，其各有效契約之解約金債權金額（含投資型人壽保險契約之解約金）未逾債務人最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍計算之三個月金額者，不得作為扣押或強制執行之標的。\n四、另民眾就保險契約解約須支付相關解約費用，故若民眾為規避財產受執行而利用本條規定分散購買多張保險契約，須支付之成本甚高，其從事該行為之可能性不高。\n五、本條所稱當地區之認定方式，得參酌司法院訂定之辦理強制執行事件應行注意事項第六十五點第三款規定、法務部行政執行署一百零七年六月二十一日行執法字第一○七三一○○一三一○號函釋認定。\n六、至於未符合上開豁免標準之其他得作為扣押或強制執行標的之各保險契約解約金債權，則依強制執行法相關規定予以執行。執行時並應依上開最高法院民事大法庭裁定，依強制執行法第一條第二項規定之立法意旨，執行法院執行要保人於壽險契約之權利，應衡酌所採取之執行方法須有助於執行目的之達成；如有多種同樣能達成執行目的之執行方法時，應選擇對債務人損害最少之方法為之；採取之執行方法所造成之損害，不得與欲達成之執行目的之利益顯失均衡，併予敘明。\n七、考量本條已在現行第一百三十五條之四第一項規定年金保險準用之範圍，又年金保險性質類似人壽保險之生存保險，且尚未進入給付期間之年金保險亦具有保單現金價值，宜就得作為扣押或強制執行標的之年金保險契約解約金債權併同規範，爰予維持現行第一百三十五條之四第一項所定年金保險準用本法規定範圍之文字，俾年金保險契約解約金債權之強制執行得準用本條規定。"},{"bill":"202110103350000","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾債務人最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍計算之三個月金額者，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、由於最高法院民事大法庭於民國111年12月9日做出108年度台抗大字第897號裁定，肯認當要保人負債無力清償債務時，人壽保險契約的保險解約金可作為強制執行的客體，執行法院得核發執行命令終止債務人為要保人之人壽保險契約，命第三人保險公司償付解約金，而保險之目的乃為分擔人生意外風險，爰此為確保人壽保險契約之解約金債權受強制執行下，要保人仍得維持基本生活所需，而增訂本條，規定要保人為債務人之人壽保險契約，解約金債權於最低生活費的限度內，不得作扣押或強制執行標的。而由於市面上保險公司眾多，若合併通算債務人名下全部壽險契約之解約債權，將導致作業複雜且付出社會成本龐大，為避免強制執行所付出之社會成本過大，本條所定人壽保險契約解約金債權之最低生活費之計算，以各個有效契約分別計算之。另，參照強制執行法第一百二十二條規定，作為該要保人之最低生活所需之標準。"},{"bill":"202110104550000","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾債務人最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍計算之三個月金額者，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、鑑於最高法院民事大法庭一百零八年度台抗大字第八九七號裁定肯認人壽保險契約之解約金債權得為強制執行之標的，但未及於健康保險契約及傷害保險契約。考量人壽保險之本質為保障被保險人之生命及身體，可填補被保險人身故後其遺族之生活經濟損失及所需費用，又健康保險及傷害保險亦可提供被保險人維持生活經濟安定之保險保障，具安定社會之功能，宜與其他得強制執行之財產為不同考量。為確保國人於人壽保險契約之解約金債權受強制執行下仍得維持一定之保險保障、兼顧債權人實現債權利益，爰於本條明定人壽保險契約解約金債權之強制執行原則，並分別新增第一百二十九條之一及第一百三十二條之一明定要保人為債務人之健康保險及傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。\n三、考量目前執行法院辦理人壽保險契約強制執行作業，係合併通算債務人名下全部壽險契約之解約金債權，併同考量酌留債務人生活所必需數額後始得對人壽保險契約之解約金債權予以強制執行。惟合併通算及查明債務人於各保險公司之保險契約之解約金數額，作業複雜，造成執行機關及保險公司付出相當人力及作業成本，衍生相當社會成本，為使法規政策制定符合成本效益精神，確保強制執行之效益高於社會成本，本次所定人壽保險契約解約金債權之強制執行原則，允宜採簡化便利之認定標準，以各有效契約之解約金債權金額做為豁免扣押或強制執行標的之門檻。另經參酌強制執行法第一百二十二條第三項所定以最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍作為債務人生活所必需數額，又該生活所必需數額之三個月金額於一百十四年約介於新臺幣五萬元至七萬元之間，以該數額作為豁免門檻，應得以豁免相當數量之壽險契約解約金債權扣押或執行案件，有利於執行機關及保險公司減輕作業負擔及降低社會成本，同時得為債務人保留一定數額之人壽保險保障，並兼顧債權人實現債權利益，符合上開民事大法庭裁定理由所揭櫫採取之執行方法所造成之損害，不得與欲達成之執行目的之利益顯失均衡之比例原則精神，爰明定要保人為債務人之人壽保險契約，其各有效契約之解約金債權金額（含投資型人壽保險契約之解約金）未逾債務人最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍計算之三個月金額者，不得作為扣押或強制執行之標的。\n四、另民眾就保險契約解約須支付相關解約費用，故若民眾為規避財產受執行而利用本條規定分散購買多張保險契約，須支付之成本甚高，其從事該行為之可能性不高。\n五、本條所稱當地區之認定方式，得參酌司法院訂定之辦理強制執行事件應行注意事項第六十五點第三款規定、法務部行政執行署一百零七年六月二十一日行執法字第一○七三一○○一三一○號函釋認定。\n六、至於未符合上開豁免標準之其他得作為扣押或強制執行標的之各保險契約解約金債權，則依強制執行法相關規定予以執行。執行時並應依上開最高法院民事大法庭裁定，依強制執行法第一條第二項規定之立法意旨，執行法院執行要保人於壽險契約之權利，應衡酌所採取之執行方法須有助於執行目的之達成；如有多種同樣能達成執行目的之執行方法時，應選擇對債務人損害最少之方法為之；採取之執行方法所造成之損害，不得與欲達成之執行目的之利益顯失均衡，併予敘明。\n七、考量本條已在現行第一百三十五條之四第一項規定年金保險準用之範圍，又年金保險性質類似人壽保險之生存保險，且尚未進入給付期間之年金保險亦具有保單現金價值，宜就得作為扣押或強制執行標的之年金保險契約解約金債權併同規範，爰予維持現行第一百三十五條之四第一項所定年金保險準用本法規定範圍之文字，俾年金保險契約解約金債權之強制執行得準用本條規定。"},{"bill":"202110105410000","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾當年政府公告之最低工資之三個月金額者，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、最高法院民事大法庭一百零八年度台抗大字第八九七號裁定肯認人壽保險契約之解約金債權得為強制執行之標的，但未及於健康保險契約及傷害保險契約。\n然人壽保險之本質目的為保障被保險人之生命及身體外，為家庭經濟穩定支柱之來源之一，而健康保險及傷害保險則同樣提供被保險人生活經濟安定與其家庭之保障，其功能目的與其他得強制執行之保險契約全然不同。故應同時兼顧人壽保險契約之解約金債權受強制執行下，被保險人仍可維持一定之保險保障及債權人實現債權利益。\n三、另目前執行法院辦理人壽保險契約強制執行作業，乃合併通算及查明債務人於各保險公司之保險契約之解約金數額，作業複雜，已造成執行機關及保險公司付出相當人力及作業成本，故亦應讓人壽保險契約解約金債權之強制執行原則，更為簡化便利，以各有效契約之解約金債權金額做為豁免扣押或強制執行標的之門檻。\n並於考量要保人為債務人時，仍需透過工作勞務所得，以償還所負擔之債務及維護家庭之生活經濟，因此應以政府所公告每年度之最低工資金額，作為債務人生活所必需之基本數額，並以此數額之三個月作為豁免門檻。亦即有效契約之解約金債權金額（含投資型人壽保險契約之解約金）未逾政府公告之最低工資之三個月金額者，不得作為扣押或強制執行之標的。\n四、至於未符合上開豁免標準之其他得作為扣押或強制執行標的之各保險契約解約金債權，則依強制執行法相關規定予以執行。執行時並應依上開最高法院民事大法庭裁定，依強制執行法第一條第二項規定之立法意旨，執行法院執行要保人於壽險契約之權利，應衡酌所採取之執行方法須有助於執行目的之達成；如有多種同樣能達成執行目的之執行方法時，應選擇對債務人損害最少之方法為之；採取之執行方法所造成之損害，不得與欲達成之執行目的之利益顯失均衡。\n五、另本條已在現行第一百三十五條之四第一項規定年金保險準用之範圍，又年金保險性質類似人壽保險之生存保險，且尚未進入給付期間之年金保險亦具有保單現金價值，宜就得作為扣押或強制執行標的之年金保險契約解約金債權併同規範，爰予維持現行第一百三十五條之四第一項所定年金保險準用本法規定範圍之文字，俾年金保險契約解約金債權之強制執行得準用本條規定。"},{"bill":"202110100290000","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾債務人最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍計算之三個月金額者，不得作為扣押或強制執行之標的。","note":"一、本條為新增條文。\n二、鑑於最高法院民事大法庭一百零八年度台抗大字第八九七號裁定認定人壽保險契約解約金債權可作為強制執行之標的，但此裁定不適用於健康保險契約與傷害保險契約。考量人壽保險之性質主要是保障被保險人之生命及身體，且可彌補被保險人身故後其遺族的經濟損失與生活費用，另外健康保險與傷害保險亦具維持經濟穩定的功能，因此應與其他可被強制執行的財產進行區別處理。為確保人民在強制執行過程中，仍能保持必要的人壽保險保障，同時兼顧債權人權益，本條規定人壽保險契約解約金債權的強制執行原則，並於第一百二十九條之一及第一百三十二條之一新增規定，明定健康保險與傷害保險契約之解約金債權不得作為強制執行標的。\n三、目前執行法院在辦理人壽保險契約強制執行時，會將債務人名下的所有人壽保險契約解約金債權合併計算，並扣除一定金額後才進行強制執行。由於此種合併計算與確認保險契約解約金額的作業複雜，且需要花費大量的人力與成本，進而造成較高的社會成本。因此，為提高執行效益並降低社會成本，本條規定以每張有效人壽保險契約的解約金債權金額為豁免門檻，當其金額未超過債務人所在地區的最低生活費一點二倍的三個月金額時，不得作為強制執行標的。依據強制執行法第一百二十二條第三項規定，該生活所必需金額可參考衛生福利部或直轄市政府每年公告的金額，於一百十四年，該門檻約介於五萬元至七萬元之間，符合此標準的壽險契約解約金債權將不會進行強制執行。此舉不僅能減輕執行機構與保險公司的負擔，還能保留債務人一定的保險保障，同時確保債權人能夠實現其權益。\n四、另外，由於民眾解約保險契約時需支付相關解約費用，因此為避免民眾透過購買多張保險契約來規避強制執行，這種行為的成本相對較高，實際操作的可能性較低。\n五、本條中提到的當地區的認定方式，得參考司法院訂定的辦理強制執行事件應行注意事項第六十五點第三款的規定，並參照法務部行政執行署一百零七年六月二十一日的函釋。\n六、對於未符合豁免標準的保險契約解約金債權，將依強制執行法相關規定進行強制執行。執行過程中，應依照最高法院民事大法庭的裁定，選擇最不損害債務人的方法來進行執行，且所採取的執行方法應達到執行目的，並符合比例原則。\n七、由於年金保險與人壽保險具有類似性，且未進入給付期的年金保險也有保單現金價值，應該將年金保險契約的解約金債權也納入強制執行的範圍。因此，本條將年金保險契約解約金債權的強制執行規範與人壽保險契約解約金債權同步處理，並維持現行第一百三十五條之四第一項對年金保險的規定。"},{"bill":"202110109370000","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾債務人最近一年臺北市政府所公告每人每月最低生活費一點二倍計算之三個月金額者，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、鑑於最高法院民事大法庭一百零八年度台抗大字第八九七號裁定肯認人壽保險契約之解約金債權得為強制執行之標的，但未及於健康保險契約及傷害保險契約。考量人壽保險之本質為保障被保險人之生命及身體，可填補被保險人身故後其遺族之生活經濟損失及所需費用，又健康保險及傷害保險亦可提供被保險人維持生活經濟安定之保險保障，具安定社會之功能，宜與其他得強制執行之財產為不同考量。為確保國人於人壽保險契約之解約金債權受強制執行下仍得維持一定之保險保障、兼顧債權人實現債權利益，爰於本條明定人壽保險契約解約金債權之強制執行原則，並分別新增第一百二十九條之一及第一百三十二條之一明定要保人為債務人之健康保險及傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。\n三、考量目前執行法院辦理人壽保險契約強制執行作業，係合併通算債務人名下全部壽險契約之解約金債權，併同考量酌留債務人生活所必需數額後始得對人壽保險契約之解約金債權予以強制執行。惟合併通算及查明債務人於各保險公司之保險契約之解約金數額，作業複雜，造成執行機關及保險公司付出相當人力及作業成本，衍生相當社會成本，為使法規政策制定符合成本效益精神，確保強制執行之效益高於社會成本，本次所定人壽保險契約解約金債權之強制執行原則，允宜採簡化便利之認定標準，以各有效契約之解約金債權金額做為豁免扣押或強制執行標的之門檻。\n四、考量要保人為債務人時，仍需透過工作勞務所得，以償還所擔之債務及維護家庭之生活經濟，因此應以最近一年臺北市政府所公告每人每月最低生活費一點二倍計算之三個月金額者，作為債務人生活所必需之基本數額，並以此數額之三個月作為豁免門檻。全國都一致，如此全國的法院就很清楚瞭解法律的標準在哪裡，而非標準不一，衍生不同的爭執。\n五、另民眾就保險契約解約須支付相關解約費用，故若民眾為規避財產受執行而利用本條規定分散購買多張保險契約，須支付之成本甚高，其從事該行為之可能性不高。\n六、本條所稱當地區之認定方式，得參酌司法院訂定之辦理強制執行事件應行注意事項第六十五點第三款規定、法務部行政執行署一百零七年六月二十一日行執法字第一○七三一○○一三一○號函釋認定。\n七、至於未符合上開豁免標準之其他得作為扣押或強制執行標的之各保險契約解約金債權，則依強制執行法相關規定予以執行。執行時並應依上開最高法院民事大法庭裁定，依強制執行法第一條第二項規定之立法意旨，執行法院執行要保人於壽險契約之權利，應衡酌所採取之執行方法須有助於執行目的之達成；如有多種同樣能達成執行目的之執行方法時，應選擇對債務人損害最少之方法為之；採取之執行方法所造成之損害，不得與欲達成之執行目的之利益顯失均衡，併予敘明。"},{"bill":"202110108790000","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人，支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n第一項之預計可獲償付之解約金額度，由保險人依保單及相關法規計算，並於第一項申請人提出申請時提供書面證明。\n本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及第二項後段規定。","note":"一、本條新增。\n二、為賦予符合一定條件之特定人於保險契約經扣押時，可代要保人清償相當於受執行保險契約解約金額度之債務，並成為新要保人，以確保保險契約在受執行時被保險人或受益人得維持其生活經濟所必需之保險保障，使保險契約效力得以延續，爰參酌外國介入權之立法例新增本條。\n三、第一項明定保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，對被保險人有保險利益者（含被保險人）、要保人具名指定之受益人、要保人或被保險人一定範圍內親屬，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人（以下簡稱介入權）。\n四、按本條所定介入權之性質為形成權，且涉及變更保險契約之當事人，為利法律關係儘早確定，爰於第二項定明第一項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n五、考量解約金之數額認定恐生分岐，故應由保險人提供書面記載金額，以明確應支付之金額。\n六、考量於本條本次修正施行前，保險契約之解約金債權經扣押、要保人受破產宣告或經裁定開始清算程序，於修正施行後，保險事故發生前，第一項各款之人得於修正施行之日起三個月內，適用第一項及第二項後段規定。\n七、另考量年金保險性質類似人壽保險之生存保險，爰予維持現行第一百三十五條之四第一項規定年金保險準用之範圍（含本條），即年金保險契約亦得準用本條介入權制度。"},{"bill":"202110114380000","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾債務人及受其扶養親屬生活所必需者，不得作為扣押或強制執行之標的。\n前項生活所必需標準，以最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍計算之六個月金額，並按其人數加總。\n小額終老保險或主管機關公告之政策型保險，每一被保險人合併後之保險金額未逾新臺幣五十萬元者，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、鑑於最高法院民事大法庭108年度台抗大字第897號裁定肯認人壽保險契約之解約金債權得為強制執行之標的，考量人壽保險之本質為保障被保險人之生命及身體，可填補被保險人身故後其遺族之生活經濟損失及所需費用，又健康保險及傷害保險亦可提供被保險人維持生活經濟安定之保險保障，具安定社會之功能，宜與其他得強制執行之財產為不同考量。為確保國人於人壽保險契約之解約金債權受強制執行下仍得維持一定之保險保障、兼顧債權人實現債權利益，爰於本條明定人壽保險契約解約金債權之強制執行原則，並分別新增第一百二十九條之一及第一百三十二條之一明定要保人為債務人之健康保險及傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。\n三、為使法規政策制定符合成本效益精神，確保強制執行之效益高於社會成本，本次所定人壽保險契約解約金債權之強制執行原則，宜採簡化便利之認定標準，以各有效契約之解約金債權金額做為豁免扣押或強制執行標的之門檻，爰參酌強制執行法第一百二十二條之規定，明定要保人為債務人之人壽保險契約，其各有效契約之解約金債權金額（含投資型人壽保險契約之解約金）未逾債務人及受其扶養親屬生活所必需者，不得作為扣押或強制執行之標的，其標準則以最近一年衛生福利部或直轄市政府所公告當地區每人每月最低生活費一點二倍計算之六個月金額，按人數加總。\n四、為保障社會安全，除各項強制性社會保險外，近年政府亦視社會需求推動各項政策型保險，其性質介於商業保險與社會保險之間，具有一定政策性與公益性，此類保險雖非強制，其保障固無須如社會保險給付不得為扣押或強制執行之程度，但仍有予以特別保障、鼓勵之必要，爰於第三項規定小額終老保險或經主管機關公告之政策型保險，每一保險人合併後保險金額未逾50萬元者，不得為扣押或強制執行。"},{"bill":"202110114340000","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾最近一年衛生福利部或直轄市政府所公告每人每月最低生活費一點二倍計算之三個月金額中最高標準者，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、鑒於最高法院民事大法庭一百零八年度台抗大字第八九七號裁定肯認人壽保險契約之解約金債權得為強制執行之標的，但未及於健康保險契約及傷害保險契約。考量人壽保險之本質為保障被保險人之生命及身體，可填補被保險人身故後其遺族之生活經濟損失及所需費用，又健康保險及傷害保險亦可提供被保險人維持生活經濟安定之保險保障，具安定社會之功能，宜與其他得強制執行之財產為不同考量。為確保國人於人壽保險契約之解約金債權受強制執行下仍得維持一定之保險保障、兼顧債權人實現債權利益，爰於本條明定人壽保險契約解約金債權之強制執行原則，並分別新增第一百二十九條之一及第一百三十二條之一明定要保人為債務人之健康保險及傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。\n三、考量目前執行法院辦理人壽保險契約強制執行作業，係合併通算債務人名下全部壽險契約之解約金債權，併同考量酌留債務人生活所必需數額後始得對人壽保險契約之解約金債權予以強制執行。惟合併通算及查明債務人於各保險公司之保險契約之解約金數額，作業複雜，造成執行機關及保險公司付出相當人力及作業成本，衍生相當社會成本，為使法規政策制定符合成本效益精神，確保強制執行之效益高於社會成本，本次所定人壽保險契約解約金債權之強制執行原則，允宜採簡化便利之認定標準，以各有效契約之解約金債權金額做為豁免扣押或強制執行標的之門檻。另經參酌強制執行法第一百二十二條第三項所定以最近一年衛生福利部或直轄市政府所公告每人每月最低生活費一點二倍作為債務人生活所必需數額，又該生活所必需數額之三個月金額於一百十四年約介於新臺幣五萬元至七萬元之間，以該數額作為豁免門檻，應得以豁免相當數量之壽險契約解約金債權扣押或執行案件，有利於執行機關及保險公司減輕作業負擔及降低社會成本，同時得為債務人保留一定數額之人壽保險保障，並兼顧債權人實現債權利益，符合上開民事大法庭裁定理由所揭櫫採取之執行方法所造成之損害，不得與欲達成之執行目的之利益顯失均衡之比例原則精神。另各法院判決中對於生活保障之金額計算認定有其裁量空間，戶籍地、居住地、工作地之不同，債務人皆可主張，若受扶養人亦位於不同區域活動，又增加其複雜度，為簡化法院程序，加快裁判效率，應可採統一規定，建議採最高標準。爰明定要保人為債務人之人壽保險契約，其各有效契約之解約金債權金額（含投資型人壽保險契約之解約金）未逾最近一年衛生福利部或直轄市政府所公告每人每月最低生活費一點二倍計算之三個月金額中最高標準者，不得作為扣押或強制執行之標的。"}],"changed":true,"final":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾最近一年衛生福利部或直轄市政府所公告每人每月最低生活費一點二倍計算之六個月金額中最高標準者，不得作為扣押或強制執行之標的。\n主管機關為推動提升基本保險保障政策，公告之人壽保險契約，其解約金債權不得作為扣押或強制執行之標的。","finalWhy":"","review":{"note":"照委員吳秉叡等7人修正動議通過","text":"要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾最近一年衛生福利部或直轄市政府所公告每人每月最低生活費一點二倍計算之六個月金額中最高標準者，不得作為扣押或強制執行之標的。\n主管機關為推動提升基本保險保障政策，公告之人壽保險契約，其解約金債權不得作為扣押或強制執行之標的。"}},{"no":"第一百二十三條之二","current":null,"versions":[{"bill":"201110098880000","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。","note":"一、本條新增。\n二、為賦予符合一定條件之特定人於保險契約經扣押時，可代為債務人之要保人清償相當於受執行保險契約解約金額度之債務，並成為新要保人，以確保保險契約在受執行時被保險人或受益人得維持其生活經濟所必需之保險保障，使保險契約效力得以延續，爰參酌外國介入權之立法例新增本條。\n三、第一項明定保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，對被保險人有保險利益者（含被保險人）、要保人具名指定之受益人、要保人或被保險人一定範圍內親屬，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人（以下簡稱介入權）。\n四、按本條所定介入權之性質為形成權，且涉及變更保險契約之當事人，為利法律關係儘早確定，爰於第二項定明第一項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n五、考量於本條本次修正施行前，保險契約之解約金債權經扣押、要保人受破產宣告或經裁定開始清算程序，於修正施行後，保險事故發生前，仍有給予其適用三個月之介入權行使期間之必要，以符本條立法目的，爰於第三項定明有第一項所定事由，於修正施行後，保險事故發生前，第一項各款之人得於修正施行之日起三個月內，適用第一項及第二項後段規定。\n六、另考量年金保險性質類似人壽保險之生存保險，爰予維持現行第一百三十五條之四第一項規定年金保險準用之範圍（含本條），即年金保險契約亦得準用本條介入權制度。"},{"bill":"202110103350000","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。","note":"一、本條新增：為賦予符合一定條件之特定人於保險契約經扣押時，可代為債務人之要保人清償相當於受執行保險契約解約金額度之債務，並成為新要保人，以確保保險契約在受執行時被保險人或受益人得維持其生活經濟所必需之保險保障，使保險契約效力得以延續，爰參酌外國介入權之立法例新增本條。\n二、第一項明定保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，對被保險人有保險利益者（含被保險人）、要保人具名指定之受益人、要保人或被保險人一定範圍內親屬，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人（以下簡稱：介入權）。\n三、按本條所定介入權之性質為形成權，且涉及變更保險契約之當事人，為利法律關係儘早確定，爰於第二項定明第一項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n四、考量於本條本次修正施行前，保險契約之解約金債權經扣押、要保人受破產宣告或經裁定開始清算程序，於修正施行後，保險事故發生前，仍有給予其適用三個月之介入權行使期間之必要，以符本條立法目的，爰於第三項定明有第一項所定事由，於修正施行後，保險事故發生前，第一項各款之人得於修正施行之日起三個月內，適用第一項及第二項後段規定。"},{"bill":"202110104550000","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。","note":"一、本條新增。\n二、為賦予符合一定條件之特定人於保險契約經扣押時，可代為債務人之要保人清償相當於受執行保險契約解約金額度之債務，並成為新要保人，以確保保險契約在受執行時被保險人或受益人得維持其生活經濟所必需之保險保障，使保險契約效力得以延續，爰參酌外國介入權之立法例新增本條。\n三、第一項明定保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，對被保險人有保險利益者（含被保險人）、要保人具名指定之受益人、要保人或被保險人一定範圍內親屬，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人（以下簡稱介入權）。\n四、按本條所定介入權之性質為形成權，且涉及變更保險契約之當事人，為利法律關係儘早確定，爰於第二項定明第一項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n五、考量於本條本次修正施行前，保險契約之解約金債權經扣押、要保人受破產宣告或經裁定開始清算程序，於修正施行後，保險事故發生前，仍有給予其適用三個月之介入權行使期間之必要，以符本條立法目的，爰於第三項定明有第一項所定事由，於修正施行後，保險事故發生前，第一項各款之人得於修正施行之日起三個月內，適用第一項及第二項後段規定。\n六、另考量年金保險性質類似人壽保險之生存保險，爰予維持現行第一百三十五條之四第一項規定年金保險準用之範圍（含本條），即年金保險契約亦得準用本條介入權制度。"},{"bill":"202110105410000","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。","note":"一、本條新增。\n二、為賦予符合一定條件之特定人於保險契約經扣押時，可代為債務人之要保人清償相當於受執行保險契約解約金額度之債務，並成為新要保人，以確保保險契約在受執行時被保險人或受益人得維持其生活經濟所必需之保險保障，使保險契約效力得以延續，爰參酌外國介入權之立法例新增本條。\n三、第一項明定保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，對被保險人有保險利益者（含被保險人）、要保人具名指定之受益人、要保人或被保險人一定範圍內親屬，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人（以下簡稱介入權）。\n四、按本條所定介入權之性質為形成權，且涉及變更保險契約之當事人，為利法律關係儘早確定，爰於第二項定明第一項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n五、考量於本條本次修正施行前，保險契約之解約金債權經扣押、要保人受破產宣告或經裁定開始清算程序，於修正施行後，保險事故發生前，第一項各款之人得於修正施行之日起三個月內，適用第一項及第二項後段規定。\n六、另考量年金保險性質類似人壽保險之生存保險，爰予維持現行第一百三十五條之四第一項規定年金保險準用之範圍（含本條），即年金保險契約亦得準用本條介入權制度。"},{"bill":"202110100290000","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。","note":"一、本條為新增條文。\n二、為賦予符合特定條件之人，在保險契約經扣押時，可代為債務人之要保人清償相當於受執行保險契約解約金額度之債務，並成為新要保人，以確保在保險契約受執行時，被保險人或受益人能維持其生活經濟所需之保險保障，確保保險契約效力延續。此舉參酌外國立法例並新增本條規定。\n三、第一項規定保險事故發生前，若要保人為債務人之人壽保險契約解約金債權經扣押，或要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，以下各類人可在取得要保人及被保險人書面同意後，並向執行機關或執行命令所指定之人支付相當於保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n(一)對被保險人有保險利益者（包括被保險人）。\n(二)要保人具名指定之受益人。\n(三)要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n四、按本條所定之介入權屬形成權，涉及變更保險契約之當事人。為利法律關係儘早確定，故第二項規定第一項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之，並於書面通知送達保險人之日起生效。\n五、考量於本條本次修正施行前，若保險契約之解約金債權經扣押，或要保人受破產宣告或經裁定開始清算程序時，為符合法律立法目的，於修正施行後，保險事故發生前，仍給予三個月之介入權行使期間。因此，第三項明定有第一項所定事由者，於修正施行後，保險事故發生前，第一項各款之人得於修正施行之日起三個月內，適用第一項及第二項後段規定。\n六、考量年金保險之性質與人壽保險相似，屬生存保險，故維持現行第一百三十五條之四第一項規定，年金保險契約亦可準用本條之介入權制度。"},{"bill":"202110109370000","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。","note":"一、本條新增。\n二、為確保特定條件下的個人，在保險契約遭扣押時，能代替債務人原要保人清償相當於解約金額的債務，並取得要保人資格，確保被保險人或受益人維持必要的經濟保障，延續保險契約效力，參考國外介入權立法，特增訂本條。\n三、在發生保險事故前，若要保人作為債務人，其人壽保險契約的解約金債權遭扣押，或要保人破產、進入消費者債務清理程序時，具保險利益的被保險人、指定受益人，或特定親屬經要保人及被保險人書面同意，並支付執行機關核定的解約金額度後，可書面通知保險公司變更要保人，此權利稱為「介入權」。\n四、本條所定的介入權屬於形成權，影響保險契約當事人，為確保法律關係迅速確立，第二項規定應在相關事由發生後三個月內通知保險人變更要保人。變更效力自書面通知送達保險人時生效。\n五、在本次修正施行前，若保險契約的解約金債權已遭扣押、要保人破產或進入清算程序，則於修正施行後至保險事故發生前，仍應提供三個月的介入權行使期間，以符合立法目的。因此，第三項規定，若符合第一項所列情形，在修正施行後且保險事故尚未發生前，相關當事人可於修正施行日起三個月內，適用第一項及第二項後段的規定。\n六、另考量年金保險性質類似人壽保險之生存保險，爰予維持現行第一百三十五條之四第一項規定年金保險準用之範圍，即年金保險契約亦得準用本條介入權制度。"},{"bill":"202110114380000","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，下列各款之人或其法定代理人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母、子女或兄弟姊妹。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。","note":"一、本條新增。\n二、依最高法院民事大法庭108年度台抗大字第897號裁定所提示，參酌外國介入權之立法例新增本條，賦予符合一定條件之特定人於保險契約經扣押時，可代為清償相當於受執行保險契約解約金額度之債務，並成為新要保人，以確保保險契約在受執行時被保險人或受益人得維持其生活經濟所必需之保險保障，使保險契約效力得以延續。\n三、第一項明定保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算程序時，符合特定條件之人或其法定代理人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人（以下簡稱介入權）。\n四、按本條所定介入權之性質為形成權，為利法律關係儘早確定，爰於第二項明定第一項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n五、考量於本條本次修正施行前，保險契約之解約金債權經扣押、要保人受破產宣告或經裁定開始清算程序，於修正施行後，保險事故發生前，仍有給予其適用三個月之介入權行使期間之必要，以符本條立法目的，爰於第三項定明有第一項所定事由，於修正施行後，保險事故發生前，第一項各款之人得於修正施行之日起三個月內，適用第一項及第二項後段規定。"}],"changed":true,"final":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算或更生程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母或子女。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n本法中華民國一百十四年六月三日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。","finalWhy":"","review":{"note":"照委員吳秉叡等7人修正動議修正通過","text":"保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算或更生程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：\n一、對被保險人有保險利益者。\n二、要保人具名指定之受益人。\n三、要保人或被保險人之配偶、父母或子女。\n前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。\n本法中華民國○年○月○日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。"}},{"no":"第一百二十九條之一","current":null,"versions":[{"bill":"201110098880000","text":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、考量最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就健康保險契約之解約金債權可否執行做認定。以保險期間超過一年之健康保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對健康保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之健康保險保障，爰明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。"},{"bill":"202110103350000","text":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。\n健康保險為附約者，亦適用前項規定。","note":"一、本條新增。\n二、考量最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就健康保險契約之解約金債權可否執行做認定。以保險期間超過一年之健康保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對健康保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之健康保險保障，爰於第一項明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。\n三、參考簡易人壽保險法第四條（得以附約方式經營健康保險及傷害保險），以及司法院之法院辦理人壽保險契約金錢債權強制執行原則規定壽險契約的附約若為健康保險或傷害保險，則不得終止該附約等相關規定，明定第二項。"},{"bill":"202110104550000","text":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、考量最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就健康保險契約之解約金債權可否執行做認定。以保險期間超過一年之健康保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對健康保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之健康保險保障，爰明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。"},{"bill":"202110105410000","text":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就健康保險契約之解約金債權可否執行做認定。以保險期間超過一年之健康保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對健康保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之健康保險保障，爰明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。"},{"bill":"202110100290000","text":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條為新增條文。\n二、考量最高法院民事大法庭一百零八年度台抗大字第八九七號裁定僅針對人壽保險契約之解約金債權可否執行進行認定，並未涉及健康保險契約之解約金債權執行問題。由於健康保險契約保險期間超過一年，且可能有少量解約金可用以填補債務，為避免執行機關在實務上仍對健康保險契約之解約金債權進行扣押或強制執行，進而造成保戶失去保障其生命、身體健康及生活經濟穩定的健康保險，特此明定要保人為債務人之健康保險契約之解約金債權不得作為扣押或強制執行之標的。"},{"bill":"202110109370000","text":"要保人為債務人之健康保險契約之解約金債權，不應作為扣押或強制執行之標的。","note":"一、本條新增。\n二、最高法院民事大法庭108年度台抗大字第897號裁定，僅針對人壽保險契約的解約金債權是否可執行，未涉及健康保險契約的解約金債權。鑑於部分健康保險契約保險期間超過一年可能產生少量解約金，實務上可能仍遭扣押或強制執行，影響保戶的健康保障與經濟安全。為避免此情況，特別規定債務人作為要保人的健康保險契約解約金債權，不得成為扣押或強制執行的標的。"},{"bill":"202110114380000","text":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、考量保險期間超過一年之健康保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對健康保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之健康保險保障，爰明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。"},{"bill":"202110114340000","text":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、考量最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就健康保險契約之解約金債權可否執行做認定。以保險期間超過一年之健康保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對健康保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之健康保險保障，爰明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。"}],"changed":true,"final":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。","finalWhy":"","review":{"note":"照行政院提案通過","text":"要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。"}},{"no":"第一百三十條","current":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條至第一百二十四條，於健康保險準用之。","versions":[{"bill":"201110098880000","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","note":"考量本次新增修正條文第一百二十九條之一，明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的，修正條文第一百二十三條之一、第一百二十三條之二於健康保險應不予準用，爰將健康保險準用第一百二十二條至第一百二十四條之規定範圍，修正為第一百二十二條、第一百二十三條及第一百二十四條。"},{"bill":"202110103350000","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","note":"考量本次新增修正條文第一百二十九條之一，明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的，修正條文第一百二十三條之一、第一百二十三條之二於健康保險應不予準用，爰將健康保險準用第一百二十二條至第一百二十四條之規定範圍，修正為第一百二十二條、第一百二十三條及第一百二十四條。"},{"bill":"202110104550000","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","note":"考量本次新增修正條文第一百二十九條之一，明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的，修正條文第一百二十三條之一、第一百二十三條之二於健康保險應不予準用，爰將健康保險準用第一百二十二條至第一百二十四條之規定範圍，修正為第一百二十二條、第一百二十三條及第一百二十四條。"},{"bill":"202110105410000","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","note":"本次新增修正條文第一百二十九條之一，明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的，另所新增修正條文第一百二十三條之一、第一百二十三條之二於健康保險應不予準用，爰將健康保險準用第一百二十二條至第一百二十四條之規定範圍，修正為第一百二十二條、第一百二十三條及第一百二十四條。"},{"bill":"202110100290000","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","note":"本次修正新增第一百二十九條之一，規定要保人為債務人之健康保險契約解約金債權不得作為扣押或強制執行之標的。鑑於第一百二十三條之一及第一百二十三條之二不適用於健康保險，修正將健康保險準用範圍調整為僅適用第一百二十二條、第一百二十三條及第一百二十四條。"},{"bill":"202110109370000","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","note":"考量本次新增修正條文第一百二十九條之一，明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的，修正條文第一百二十三條之一、第一百二十三條之二於健康保險應不予準用，爰將健康保險準用第一百二十二條至第一百二十四條之規定範圍，修正為第一百二十二條、第一百二十三條及第一百二十四條。"},{"bill":"202110114380000","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","note":"考量本次新增修正條文第一百二十九條之一，明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的，修正條文第一百二十三條之一、第一百二十三條之二於健康保險應不予準用，爰將健康保險準用第一百二十二條至第一百二十四條之規定範圍，修正為第一百二十二條、第一百二十三條及第一百二十四條。"},{"bill":"202110114340000","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","note":"考量本次新增修正條文第一百二十九條之一，明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的，修正條文第一百二十三條之一、第一百二十三條之二於健康保險應不予準用，爰將健康保險準用第一百二十二條至第一百二十四條之規定範圍，修正為第一百二十二條、第一百二十三條及第一百二十四條。"}],"changed":true,"final":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。","finalWhy":"考量本次新增修正條文第一百二十九條之一，明定要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的，修正條文第一百二十三條之一、第一百二十三條之二於健康保險應不予準用，爰將健康保險準用第一百二十二條至第一百二十四條之規定範圍，修正為第一百二十二條、第一百二十三條及第一百二十四條。","review":{"note":"照行政院提案通過","text":"第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。"}},{"no":"第一百三十一條之一","current":null,"versions":[{"bill":"202110103350000","text":"要保人為債務人之傷害保險契約之解約金債權不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、由於最高法院民事大法庭於民國111年12月9日做出108年度台抗大字第897號裁定，肯認當要保人負債無力清償債務時，人壽保險契約的保險解約金可作為強制執行的客體，而保險期間超過一年之傷害保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對傷害保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之傷害保險保障，爰明定要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第一百三十二條之一","current":null,"versions":[{"bill":"201110098880000","text":"要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、考量最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就傷害保險契約之解約金債權可否執行做認定。以保險期間超過一年之傷害保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對傷害保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之傷害保險保障，爰明定要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。"},{"bill":"202110104550000","text":"要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、考量最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就傷害保險契約之解約金債權可否執行做認定。以保險期間超過一年之傷害保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對傷害保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之傷害保險保障，爰明定要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。"},{"bill":"202110105410000","text":"要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就傷害保險契約之解約金債權可否執行做　認定。以保險期間超過一年之傷害保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對傷害保險契約之解約金債權予以　扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之傷害保險保障，爰明定要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。"},{"bill":"202110100290000","text":"要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條為新增條文。\n二、考慮到最高法院一百零八年度台抗大字第八九七號裁定主要針對人壽保險解約金債權執行問題，並未涉及傷害保險契約。為避免執行機關在實務中對傷害保險解約金進行扣押或強制執行，可能導致保戶失去重要的傷害保險保障，故規定傷害保險契約之解約金債權不得作為扣押或強制執行之標的。"},{"bill":"202110109370000","text":"要保人為債務人之傷害保險契約之解約金債權，不應作為扣押或強制執行之標的。","note":"一、本條新增。\n二、最高法院民事大法庭108年度台抗大字第897號裁定，僅針對人壽保險契約的解約金債權是否可執行進行認定，並未涉及傷害保險契約的解約金債權可否執行。考量部分長期傷害保險契約可能產生少量解約金，實務上仍可能遭扣押或強制執行，進而影響保戶維持生命、健康及經濟穩定的保障。因此，特別規範要保人為債務人的傷害保險契約之解約金債權，不得作為扣押或強制執行的標的。"},{"bill":"202110114380000","text":"要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、考量保險期間超過一年之傷害保險契約，或有少量解約金可填補債權，為避免執行機關對傷害保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之傷害保險保障，爰明定要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。"},{"bill":"202110114340000","text":"要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。","note":"一、本條新增。\n二、考量最高法院民事大法庭一百零八年度台抗大字第八九七號裁定之個案係針對人壽保險契約之解約金債權可否執行，並未就傷害保險契約之解約金債權可否執行做認定。以保險期間超過一年之傷害保險契約，或有少量解約金可填補債權，為避免執行機關實務上仍會對傷害保險契約之解約金債權予以扣押或強制執行，致保戶失卻維繫生命身體健康及維持生活經濟安定之傷害保險保障，爰明定要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。"}],"changed":true,"final":"要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。","finalWhy":"","review":{"note":"照行政院提案通過","text":"要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。"}},{"no":"第一百四十八條之三","current":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。","versions":[{"bill":"202110056880000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"一、第一項、第二項未修正。\n二、新增第三項：保險業所涉之業務量龐雜，作業委託他人處理情況相當普遍，且項目玲瑯滿目，例如雲端服務等資訊系統相關作業、電話行銷或客服等保險契約相關作業，以及通知或表單交寄等文書處理作業，保險業將作業委外者亦應監督該委外單位遵行法令規定，始能保障客戶權益，爰此，參酌銀行法第四十五條之一規定，增訂第三項，明定保險業作業委託他人處理之法律依據，並授權由主管機關針對委外事項範圍、客戶權益保障、風險管理及內部控制原則等訂定辦法。"},{"bill":"202110072900000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序，其辦法由主管機關定之。","note":"鑑於保險業委託他人處理作業，應建立內部制度與流程，以確保作業品質，維護客戶權益，並減少保險業之風險，參照銀行法第四十五條之一之規範，爰增訂第三項規定，明定保險業委託作業之法律依據，並授權主管機關就其委託範圍、客戶權益之保障、風險之控管及內部控制原則等，其辦法由主管機關定之。"},{"bill":"202110076530000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"一、第一項、第二項未修正。\n二、鑑於保險業作業委託他人處理應建立內部作業制度及程序，以確保作業之品質及客戶之權益，並減低對保險業可能造成之風險，爰參酌銀行法第四十五條之一之規定，增訂第三項規定保險業作業委託他人處理之法律授權依據，並授權由主管機關針對委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法。"},{"bill":"202110076580000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"一、第二項未修正。\n二、鑑於保險業作業委託他人處理應建立內部作業制度及程序，以確保作業之品質及客戶之權益，並減低對保險業可能造成之風險，爰參酌銀行法第四十五條之一之規定，增訂第三項規定保險業作業委託他人處理之法律授權依據，並授權由主管機關針對委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法。"},{"bill":"201110098880000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，保險業對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"一、第一項及第二項未修正。\n二、鑑於保險業作業委託他人處理應建立內部作業制度及程序，以確保作業之品質及客戶之權益，並減低對保險業可能造成之風險，爰參酌銀行法第四十五條之一，增訂第三項規定保險業作業委託他人處理之法律授權依據，並授權由主管機關針對委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法。"},{"bill":"202110104550000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，保險業對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"一、第一項及第二項未修正。\n二、鑑於保險業作業委託他人處理應建立內部作業制度及程序，以確保作業之品質及客戶之權益，並減低對保險業可能造成之風險，爰參酌銀行法第四十五條之一，增訂第三項規定保險業作業委託他人處理之法律授權依據，並授權由主管機關針對委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法。"},{"bill":"202110105410000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，保險業對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"一、保險業作業委託他人處理應建立內部作業制度及程序，以確保作業之品質及客戶之權益，並減低對保險業可能造成之風險，參考銀行法第四十五條之一，故增訂第三項規定保險業作業委託他人處理之法律授權依據，並授權由主管機關針對委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法。\n二、第一項及第二項未修正。"},{"bill":"202110100290000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，保險業對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"一、第一項及第二項未修正。\n二、鑑於保險業委託他人處理作業需建立內部制度，保障作業品質與客戶權益，並降低風險，參酌銀行法第四十五條之一，新增規定作業委託的法律授權，並授權主管機關訂定相關辦法，涵蓋委託事項範圍、客戶保障、風險管理及內部控制原則。"},{"bill":"202110109370000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，保險業對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"為確保保險業委託作業的品質、保障客戶權益並降低風險，參考《銀行法》第四十五條之一，增訂法律依據，授權主管機關制定相關辦法，規範委託範圍、客戶保障、風險管理及內部控制原則。"},{"bill":"202110114380000","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，保險業對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","note":"有鑑於保險業作業委託他人處理應建立內部作業制度及程序，以確保作業之品質及客戶之權益，並減低對保險業可能造成之風險，爰參酌銀行法第四十五條之一，增訂第三項規定保險業作業委託他人處理之法律授權依據，並授權由主管機關針對委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法。"}],"changed":true,"final":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，保險業對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。","finalWhy":"","review":{"note":"照行政院提案通過","text":"保險業應建立內部控制及稽核制度；其辦法，由主管機關定之。\n保險業對資產品質之評估、各種準備金之提存、逾期放款、催收款之清理、呆帳之轉銷及保單之招攬核保理賠，應建立內部處理制度及程序；其辦法，由主管機關定之。\n保險業作業委託他人處理者，保險業對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應建立內部作業制度及程序；其辦法，由主管機關定之。"}},{"no":"第一百六十七條之一","current":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","versions":[{"bill":"202110056880000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬國內保險業無法承保之特定對象，須向國外保險業投保，並經保險經紀人向主管機關申請核准者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"一、修正第一項：國外常見知名職業運動員投保天價的運動保險，作為其職涯的保障，究其原因，國外的職業運動市場大，職業運動員保險承保的項目也相對多，而且可以為運動員量身訂做。反觀我國，職業運動員保險屬於小眾市場，研發成本高，又苦無精算數據與理賠經驗，不僅承保家數少、種類少，且保額亦難使職業運動員職涯獲得充分保障。爰此修正第一項，如屬國內保險業無法承保之特定對象，而國外保險業有提供者，可由保險經紀人向主管機關申請核准，於不影響我國國內保險市場秩序情況下，使我國職業運動員亦有與旅外職業運動員取得相同保險的機會。\n二、第二項和第三項未修正。"},{"bill":"202110072900000","text":"未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"依據本條立法目的，在於維護金融市場秩序及保障消費者權益。若遇國內保險業無法承保之特定對象，且國外保險業有提供相關保險服務者，保險經紀人得向主管機關申請核准。此舉不致影響國內保險市場秩序，且能保障民眾尋求保險保障之權益，符合立法初衷。爰修正本條第一項，以確保法律適之合理性與實際需求"},{"bill":"202110076530000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬國內保險業無法承保之特定對象，須向國外保險業投保，並經保險經紀人向主管機關申請核准者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"一、查本條立法目的，乃為維護金融市場秩序，保障消費者權益，惟如屬國內保險業無法承保之特定對象，而國外保險業有提供者，由保險經紀人向主管機關申請核准，尚不影響我國國內保險市場秩序，且可維護民眾尋求保險保障之權益，無違本條立法目的，爰修正第一項。\n二、第二項至第三項未修正。"},{"bill":"202110076580000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬國內保險業無法承保之特定對象，須向國外保險業投保，並經保險經紀人向主管機關申請核准者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"一、查本條立法目的，乃為維護金融市場秩序，保障消費者權益，惟如屬國內保險業無法承保之特定對象，而國外保險業有提供者，由保險經紀人向主管機關申請核准，尚不影響我國國內保險市場秩序，且可維護民眾尋求保險保障之權益，無違本條立法目的，爰修正第一項。\n二、第二項至第三項未修正。"},{"bill":"201110098880000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬配合政府政策需要且經主管機關公告之保險，透過保險經紀人向國外之保險業投保者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"一、查本條立法目的，乃為維護金融市場秩序，保障消費者權益。惟如屬配合政府政策需要（例如為配合政府提供職業運動員保險保障之政策，俾運動員可安心參加比賽，鑑於目前國內保險業銷售之保險商品，無法完全符合運動員保險保障之需求，而有須向國外之保險業投保之情形）且經主管機關公告之保險，而國外之保險業有提供者，得透過保險經紀人向國外之保險業投保，尚不影響我國國內保險市場秩序，無違本條立法目的，爰修正第一項。\n二、第二項及第三項未修正。"},{"bill":"202110104550000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬配合政府政策需要且經主管機關公告之保險，透過保險經紀人向國外之保險業投保者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"一、查本條立法目的，乃為維護金融市場秩序，保障消費者權益。惟如屬配合政府政策需要（例如為配合政府提供職業運動員保險保障之政策，俾運動員可安心參加比賽，鑑於目前國內保險業銷售之保險商品，無法完全符合運動員保險保障之需求，而有須向國外之保險業投保之情形）且經主管機關公告之保險，而國外之保險業有提供者，得透過保險經紀人向國外之保險業投保，尚不影響我國國內保險市場秩序，無違本條立法目的，爰修正第一項。\n二、第二項及第三項未修正。"},{"bill":"202110105410000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬配合政府政策需要且經主管機關公告之保險，透過保險經紀人向國外之保險業投保者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"一、考量若屬配合政府政策需要（例如為配合政府提供職業運動員保險保障之政策，讓運動員可安心參加比賽，然因目前國內保險業銷售之保險商品，尚無法完全符合運動員保險保障之需求，因而產生須向國外之保險業投保之情形）且經主管機關公告之保險，而國外之保險業有提供者，則可得透過保險經紀人向國外之保險業投保，亦尚不會影響我國國內保險市場秩序，爰修正第一項。\n二、第二項及第三項未修正。"},{"bill":"202110100290000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬配合政府政策需要且經主管機關公告之保險，透過保險經紀人向國外之保險業投保者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"一、本條立法目的是維護金融市場秩序及保障消費者權益。若屬配合政府政策需要（如提供職業運動員保險保障），且經主管機關公告，允許透過保險經紀人向國外保險業投保，則不影響國內保險市場秩序，符合立法目的，爰修正第一項。\n二、第二項及第三項未修正。"},{"bill":"202110109370000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬配合政府政策需要且經主管機關公告之保險，透過保險經紀人向國外之保險業投保者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"一、本條立法目的為維護金融市場秩序並保障消費者權益。然而，若因配合政府政策需求，如提供職業運動員保險保障，使其安心參賽，且國內保險商品無法滿足相關需求，經主管機關公告後，得透過保險經紀人向國外保險業投保。\n二、此舉在不影響國內保險市場秩序的前提下，亦符合立法目的。"},{"bill":"202110114380000","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬配合政府政策需要且經主管機關公告之保險，透過保險經紀人向國外之保險業投保者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","note":"本條立法目的係為維護金融市場秩序，保障消費者權益。惟如屬配合政府政策需要（例如為配合政府提供運動員保險保障之政策，讓運動員可安心參加比賽，然而目前國內保險業銷售之保險商品無法完全符合運動員保險保障之需求，而有須向國外之保險業投保之情形）且經主管機關公告之保險，而國外之保險業有提供者，得透過保險經紀人向國外之保險業投保，尚不影響我國國內保險市場秩序，無違本條立法目的，爰修正第一項。"}],"changed":true,"final":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬配合政府政策需要且經主管機關公告之保險，透過保險經紀人向國外之保險業投保者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。","finalWhy":"","review":{"note":"照行政院提案通過","text":"為非本法之保險業或外國保險業代理、經紀或招攬保險業務者，除屬配合政府政策需要且經主管機關公告之保險，透過保險經紀人向國外之保險業投保者外，處三年以下有期徒刑，得併科新臺幣三百萬元以上二千萬元以下罰金；情節重大者，得由主管機關對保險代理人、經紀人、公證人或兼營保險代理人或保險經紀人業務之銀行停止一部或全部業務，或廢止許可，並註銷執業證照。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為人外，對該法人亦科該項之罰金。\n未領有執業證照而經營或執行保險代理人、經紀人、公證人業務者，處新臺幣九十萬元以上九百萬元以下罰鍰。"}},{"no":"第一百六十八條之七","current":"第一百六十八條之二第一項之罪，為洗錢防制法第三條第一項所定之重大犯罪，適用洗錢防制法之相關規定。","versions":[{"bill":"202110056880000","text":"（刪除）","note":"本條刪除：由於洗錢防制法於民國105年12月28日修正，並於106年6月28日施行，當時該法第三條\"重大犯罪\"業已修正為\"特定犯罪\"，本條規定已不符合現行洗錢防制法之規範用語。此外，本法第一百六十八條之二明定最輕本刑分別為三年以上或七年以上，實質上已符合特定犯罪定義。綜上，本條規定已無實益，爰予刪除。"},{"bill":"202110072900000","text":"（刪除）","note":"一、本條刪除。\n二、查洗錢防制法於一百零五年十二月二十八日修正，該法第三條「重大犯罪」已修正為「特定犯罪」，且本法第一百六十八條之二明定最輕本刑分別為三年以上或七年以上，符合該條第一款有關特定犯罪定義，爰予刪除。"},{"bill":"202110076530000","text":"（刪除）","note":"一、本條刪除。\n二、查洗錢防制法於一百零五年十二月二十八日修正，並於一百零六年六月二十八日施行。該法第三條「重大犯罪」業修正為「特定犯罪」，且本法第一百六十八條之二明定最輕本刑分別為三年以上或七年以上，符合該條第一款有關特定犯罪定義，爰予刪除。"},{"bill":"202110076580000","text":"（刪除）","note":"一、本條刪除。\n二、查洗錢防制法於一百零五年十二月二十八日修正，並於一百零六年六月二十八日施行。該法第三條「重大犯罪」業修正為「特定犯罪」，且本法第一百六十八條之二明定最輕本刑分別為三年以上或七年以上，符合該條第一款有關特定犯罪定義，爰予刪除。"},{"bill":"201110098880000","text":"（刪除）","note":"一、本條刪除。\n二、查洗錢防制法一百零五年十二月二十八日修正之第三條業將「重大犯罪」修正為「特定犯罪」，並明定「特定犯罪」指最輕本刑為六月以上有期徒刑之罪，且將原列於該條第一項第十四款之本法第一百六十八條之二第一項之罪刪除；因現行本法第一百六十八條之二明定最輕本刑分別為三年以上或七年以上，符合該法第三條第一款有關特定犯罪定義，本條已無規範必要，爰予刪除。"},{"bill":"202110104550000","text":"（刪除）","note":"一、本條刪除。\n二、查洗錢防制法一百零五年十二月二十八日修正之第三條業將「重大犯罪」修正為「特定犯罪」，並明定「特定犯罪」指最輕本刑為六月以上有期徒刑之罪，且將原列於該條第一項第十四款之本法第一百六十八條之二第一項之罪刪除；因現行本法第一百六十八條之二明定最輕本刑分別為三年以上或七年以上，符合該法第三條第一款有關特定犯罪定義，本條已無規範必要，爰予刪除。"},{"bill":"202110105410000","text":"（刪除）","note":"一、本條刪除。\n二、查洗錢防制法一百零五年十二月二十八日修正之第三條業將「重大犯罪」修正為「特定犯罪」，並明定「特定犯罪」指最輕本刑為六月以上有期徒刑之罪，且將原列於該條第一項第十四款之本法第一百六十八條之二第一項之罪刪除；因現行本法第一百六十八條之二明定最輕本刑分別為三年以上或七年以上，符合該法第三條第一款有關特定犯罪定義，本條已無規範必要，爰予刪除。"},{"bill":"202110100290000","text":"（刪除）","note":"一、本條刪除。\n二、根據洗錢防制法於一百零五年十二月二十八日修正，將「重大犯罪」改為「特定犯罪」，並明確定義「特定犯罪」為最輕本刑為六個月以上有期徒刑的罪行。同時，原本列於該條第一項第十四款的本法第一百六十八條之二第一項罪行已被刪除。由於現行本法第一百六十八條之二已明確規定最輕本刑為三年以上或七年，符合該法第三條第一款的定義，因此本條不再需要規範，故予刪除。"},{"bill":"202110109370000","text":"（刪除）","note":"一、《洗錢防制法》於一百零五年十二月二十八日修正時，將「重大犯罪」改為「特定犯罪」，並定義「特定犯罪」為最輕本刑六個月以上之罪。\n二、此外，刪除原條文第一項第十四款所列的第一百六十八條之二第一項之罪，因該條已規定最輕本刑為三年或七年以上，符合「特定犯罪」的定義，無需另行規範，故予刪除。"},{"bill":"202110114380000","text":"（刪除）","note":"洗錢防制法第三條業已將「重大犯罪」修正為「特定犯罪」，並明定「特定犯罪」指最輕本刑為六月以上有期徒刑之罪，且將原列於該條第一項第十四款之本法第一百六十八條之二第一項之罪刪除；因現行本法第一百六十八條之二明定最輕本刑分別為三年以上或七年以上，符合該法第三條第一款有關特定犯罪定義，本條已無規範必要，爰予刪除。"}],"changed":true,"final":"（刪除）","finalWhy":"","review":{"note":"照行政院提案通過","text":"（刪除）"}},{"no":"第一百七十條之一","current":"保險業辦理再保險業務違反第一百四十七條所定辦法中有關再保險之分出、分入、其他危險分散機制業務之方式或限額之規定者，處新臺幣九十萬元以上九百萬元以下罰鍰。\n專業再保險業違反第一百四十七條之一第二項所定辦法中有關業務範圍或財務管理之規定者，處新臺幣九十萬元以上九百萬元以下罰鍰。","versions":[{"bill":"202110076580000","text":"保險業辦理再保險業務違反第一百四十七條所定辦法中有關再保險之分出、分入、其他危險分散機制業務之方式或限額之規定者，處新臺幣九十萬元以上九百萬元以下罰鍰。\n專業再保險業違反第一百四十七條之一第二項所定辦法中有關業務範圍或財務管理之規定者，處新臺幣九十萬元以上九百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度與程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"一、第一項未修正。\n二、配合第一百四十八條之三修正增列授權由主管機關針對保險業作業委託他人處理之委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法之規定，並參考第四項之罰鍰額度，增訂第三項明定保險業未建立或未執行作業委託他人處理之內部作業制度與程序之罰則。"}],"changed":false,"final":"保險業辦理再保險業務違反第一百四十七條所定辦法中有關再保險之分出、分入、其他危險分散機制業務之方式或限額之規定者，處新臺幣九十萬元以上九百萬元以下罰鍰。\n專業再保險業違反第一百四十七條之一第二項所定辦法中有關業務範圍或財務管理之規定者，處新臺幣九十萬元以上九百萬元以下罰鍰。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第一百七十一條之一","current":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","versions":[{"bill":"202110056880000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度與程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"一、第一項至第五項均未修正。\n二、增訂第六項：配合第一百四十八條之三修正，增列授權由主管機關針對保險業作業委託他人處理之委託事項範圍、客戶權益保障、風險管理及內部控制原則，訂定辦法之規定，並參考第四項之罰鍰額度，增訂第六項，明定保險業未建立或未執行作業委託他人處理之內部作業制度與程序之罰則。"},{"bill":"202110072900000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度與程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"配合第一百四十八條之三修正授權主管機關針對保險業的作業委託事項，制定相關的範圍、客戶權益保障、風險管理和內部控制原則的規定，並參考第四項的罰鍰標準，增訂第六項，以明確規定保險業若未建立或執行作業委託他人處理的內部作業制度和程序，將面臨相應之罰則。"},{"bill":"202110076530000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度與程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"一、第一項至第五項未修正。\n二、配合第一百四十八條之三修正增列授權由主管機關針對保險業作業委託他人處理之委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法之規定，並參考第四項之罰鍰額度，增訂第六項明定保險業未建立或未執行作業委託他人處理之內部作業制度與程序之罰則。"},{"bill":"201110098880000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"一、第一項至第五項未修正。\n二、配合修正條文第一百四十八條之三增訂第三項授權由主管機關針對保險業作業委託他人處理之委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法之規定，並參考第四項之罰鍰額度，增訂第六項明定保險業未建立或未執行作業委託他人處理之內部作業制度或程序之罰則。"},{"bill":"202110104550000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"一、第一項至第五項未修正。\n二、配合修正條文第一百四十八條之三增訂第三項授權由主管機關針對保險業作業委託他人處理之委託事項範圍、客戶權益保障、風險管理及內部控制原則訂定辦法之規定，並參考第四項之罰鍰額度，增訂第六項明定保險業未建立或未執行作業委託他人處理之內部作業制度或程序之罰則。"},{"bill":"202110105410000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"一、配合第一百四十八條之三增訂第三項之規定，增訂第六項明定保險業未建立或未執行作業委託他人處理之內部作業制度或程序之罰則。\n二、第一項至第五項未修正。"},{"bill":"202110100290000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱，或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"一、第一項至第五項未修正。\n二、配合修正條文第一百四十八條之三增訂第三項授權主管機關針對保險業委託他人處理之範圍、客戶權益保障、風險管理及內部控制原則訂定辦法，並參考第四項罰鍰額度，新增第六項規定保險業未建立或執行內部作業制度或程序之罰則。"},{"bill":"202110109370000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度或程序，處新臺幣一百二十萬元以上一千二百萬元以下罰鍰。","note":"一、修正條文第一百四十八條之三增訂第三項，授權主管機關制定保險業委託作業相關辦法，涵蓋委託範圍、客戶權益保障、風險管理及內部控制原則。\n二、參照第四項罰鍰規定，增訂第六項，明定保險業若未建立或執行相關內部作業制度與程序，將適用罰則。"},{"bill":"202110114380000","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","note":"配合修正條文第一百四十八條之三增訂第三項之規定，並參考第四項之罰鍰額度，增訂第六項明定保險業未建立或未執行作業委託他人處理之內部作業制度或程序之罰則。"}],"changed":true,"final":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。","finalWhy":"","review":{"note":"照行政院提案通過","text":"保險業違反第一百四十八條之一第一項或第二項規定者，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第一項規定，未提供說明文件供查閱、或所提供之說明文件未依規定記載，或所提供之說明文件記載不實，處新臺幣六十萬元以上六百萬元以下罰鍰。\n保險業違反第一百四十八條之二第二項規定，未依限向主管機關報告或主動公開說明，或向主管機關報告或公開說明之內容不實，處新臺幣三十萬元以上三百萬元以下罰鍰。\n保險業違反第一百四十八條之三第一項規定，未建立或未執行內部控制或稽核制度，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第二項規定，未建立或未執行內部處理制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。\n保險業違反第一百四十八條之三第三項規定，未建立或未執行內部作業制度或程序，處新臺幣六十萬元以上一千二百萬元以下罰鍰。"}},{"no":"第一百七十四條之二","current":null,"versions":[{"bill":"202110044740000","text":"保險事故發生前，保險契約之保單價值準備金請求權經法院扣押、要保人受破產宣告、經依消費者債務清理條例裁定開始更生或清算程序時，該保險契約之具名指定之受益人得經要保人及被保險人之書面同意，介入保險契約，取得要保人之地位。\n無具名指定之受益人者時，被保險人、要保人之法定繼承人或被保險人之法定繼承人有前項之權利。\n依前二項規定介入保險契約者，應於解約金或投資型保險帳戶價值之額度內，給付執行法院或法院執行命令所指定之債權人，並由執行法院通知保險人，始生介入效力；保險人收受執行法院通知當日應據以變更要保人為該介入權人。\n自第一項事由發生時起，得依第一項及第二項規定介入保險契約但三個月內不行使者，其權利消滅。\n第一項及第二項之介入權人，對被保險人之生命或身體，不適用保險利益。","note":"一、本條新增。\n二、一○八年台抗大字第八九七號裁定統一見解，認債權人得於取得強制執行名義後對債務人之人壽保險予以強制執行。惟要保人基於保險契約之權利受強制執行時，受益人將來因保險事故之發生而得請求保險金之利益，亦將受到影響。為確保受益人未來於保險事故發生時請求保險金之利益不因要保人之債務問題而受影響，允宜比照德國、日本等外國法例，予以保險受益人一定之介入權。\n三、再，保險受益人之介入係為確保自身請求保險金之權利不因債權人對要保人執行其財產而受損；且為避免受益人取得介入地位之時點過晚，致使債權人已將保單解約並取得解約金，爰於第一項明定保險受益人取得介入人地位之時點。\n四、為使有權介入保險契約者之範圍明確化，介入權人以具名指定之受益人為原則。惟考量實務上或有無具名指定受益人之情形，爰於第二項定明無具名指定受益人時，被保險人、要保人之法定繼承人或被保險人之法定繼承人得取得介入保險契約之權利。\n五、惟保險受益人取得介入權而得以阻止保險契約遭終止同時，仍須確保債權人之債權得以清償。為兼顧債權人與介入全人之權益保護，介入權人之介入條件應包含債務之清償，故於第三項前段明定，受益人如欲行使介入權，應以提出解約金或投資型保險契約帳戶價值之額度之金額為要件，用以替代債權人聲請強制執行保險契約之利益，使保險受益人與債權人各自之權利得以受保護。\n六、有鑒於保險契約之要保人變更屬重大變更，保險人宜於取得執行法院之通知後，方得變更；且此變更應立即、迅速，以確保受益人之介入權確實生效，爰於第三項後段明定保險人應於收受執行法院通知後方得變更要保人，且該變更應於收受通知當日辦理完畢。\n七、介入權之性質為形成權，足以變更保險契約之當事人，不宜長期存在，以免保險契約關係長時間處於不確定的狀態，故於第四項明定介入權人應於知悉第一項之介入事由時起，三個月內為之。\n八、介入權人與被保險人間或有無本法第十六條規定的保險利益之情事。為使介入權之規定得以生效，爰於第五項明定第一項及第二項所定之介入權人，不適用第十六條所定之保險利益。"},{"bill":"202110061230000","text":"以債務人為要保人之保險契約有下列情形之一者，其所生之權利，不得作為扣押或強制執行之標的：\n一、財產保險契約。\n二、健康保險契約、保險期間一年以下傷害保險契約及一年期人壽保險契約。\n三、小額終老保險契約。\n四、小額終老保險以外之人壽保險契約，每一被保險人合併後之保險金額未逾新臺幣一百萬元額度內者。\n五、前四款之保險契約保險事故發生後請領之保險給付。\n六、已進入年金給付期間之年金保險契約。\n七、人身保險契約單筆有效保險契約之解約金未逾新臺幣二十萬元額度內者。\n八、前二款之人身保險契約保險事故發生後單筆保險給付金額未逾新臺幣二十萬元額度內者。\n超過前項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。","note":"一、本條新增。\n二、第一項各款保險契約不予執行之理由，分述如下：\n(一)第一款、第二款財產保險契約、健康保險契約及保險期間一年以下傷害保險契約、一年期人壽保險契約，均無解約金；又保險期間超過一年之健康保險契約，縱有少量解約金可填補債權，惟將使保戶喪失醫療保障。\n(二)第三款小額終老保險契約為主管機關推動之政策性保險，提供高齡者身故或失能之基本保險保障。\n(三)依財團法人保險事業發展中心統計，截至一百十三年三月全國個人壽險有效契約之平均保額約新臺幣八十八萬五千元，基於維持被保險人生活經濟所需之基本保險保障，爰於第四款明定給予每一被保險人免於受執行之人壽保險保險金額額度新臺幣一百萬元。\n(四)另考量前四款保險契約不予執行，爰於第五款明定該等契約之保險給付亦不予執行，以求周延。\n(五)依保險法第一百三十五條之四規定，年金保險於年金給付期間，要保人不得終止保險契約，爰為第六款規定。\n(六)依據財政部一百十三年公告之每人全年基本生活費用為新臺幣二十萬二千元，，為酌留債務人及其家屬之最低生活費用，爰於第七款及第八款明定，人身保險契約單筆有效契約之解約金、第六款及第七款人身保險契約保險事故發生後之單筆保險給付金額，於二十萬元額度內不予執行。\n三、第二項明定超過第一項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。"},{"bill":"202110068640000","text":"為兼顧債務人、債權人及其他利害關係人權益，無解約金、解約金甚微、可提供維持生活經濟安定之基本保險保障或酌留最低生活費用，或保險法有明文規定不得終止之保險契約，其所生之權利，不得作為扣押或強制執行之標的。\n免予強制執行之保險契約類型：\n一、財產保險契約。\n二、健康保險契約、保險期間一年以下傷害保險契約、一年期人壽保險契約。\n三、小額終老保險契約。\n四、小額終老保險以外人壽保險契約每一被保險人合併後之保險金額未逾新臺幣二百萬元額度內者。\n五、第一款至第四款保單達申請或執行保險給付。\n六、達申請或給付年金給付期間之年金保險契約。\n七、人身保險契約單筆解約金未逾新臺幣三十萬元額度內者。\n八、保險契約內保險事故發生後之單筆保險給付在未逾新臺幣二十萬元額度內者。","note":"一、本條新增。\n二、現行保險種類繁多，應由主管機考量各類型之保險商品樣態，匡列可受強制執行之範圍，為避免債務人因債務被迫強制解約，而失去自身、家屬生活的最低保障，主管機關應表列禁止做扣押或強制執行標的之保單種類。"},{"bill":"202110069970000","text":"以債務人為要保人之保險契約有下列情形之一者，其所生之權利，不得作為扣押或強制執行之標的：\n一、無解約金之各類保險契約。\n二、健康保險契約。\n三、小額終老保險契約。\n四、小額終老保險以外之人壽保險契約，每一被保險人合併後之保險金額未逾新臺幣一百萬元額度內者。\n五、前四款之保險契約保險事故發生後請領之保險給付。\n六、已進入年金給付期間之年金保險契約。\n七、人身保險契約單筆有效保險契約之解約金未逾新臺幣十萬元額度內者。\n八、前二款之人身保險契約保險事故發生後單筆保險給付金額未逾新臺幣十萬元額度內者。\n超過前項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。","note":"一、本條新增。\n二、第一項各款保險契約不予執行之理由，說明如下：\n1.第一款無解約金之保險如一年以下傷害保險契約、一年期健康保險契約及人壽保險契約，均無解約金無執行之效益。\n2.保險期間超過一年之健康保險契約，或有少量解約金可填補債權，惟將使保戶喪失維繫生命身體健康之醫療保障。\n3.第三款小額終老保險契約為主管機關推動之政策性保險，提供高齡者身故或失能之基本保險保障。\n4.第四款統計截至一百十三年三月全國個人壽險有效契約之平均保額約新臺幣八十八萬五千元，基於維持被保險人生活經濟所需之基本保險保障，爰於第四款明定給予每一被保險人免於受執行之人壽保險保險金額額度新臺幣一百萬元。\n5.考量前四款保險契約不予執行，爰於第五款明定該等契約之保險給付亦不予執行。\n6.依保險法第一百三十五條之四規定，年金保險於年金給付期間，要保人不得終止保險契約，爰為第六款規定。\n7.為酌留債務人及其家屬半年之最低生活費用，爰於第七款及第八款明定，人身保險契約單筆有效契約之解約金、第六款及第七款人身保險契約保險事故發生後之單筆保險給付金額，於十萬元額度內不予執行。\n8.第二項定明超過第一項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。"},{"bill":"202110070950000","text":"以債務人為要保人之保險契約有下列情形之一者，其所生之權利，不得作為扣押或強制執行之標的：\n一、財產保險契約。\n二、健康保險契約、保險期間一年以下傷害保險契約及一年期人壽保險契約。\n三、小額終老保險契約。\n四、小額終老保險以外之人壽保險契約，每一被保險人合併後之保險金額未逾新臺幣一百萬元額度內者。\n五、前四款之保險契約保險事故發生後請領之保險給付。\n六、已進入年金給付期間之年金保險契約。\n七、人身保險契約單筆有效保險契約之解約金未逾新臺幣十萬元額度內者。\n八、前二款之人身保險契約保險事故發生後單筆保險給付金額未逾新臺幣十萬元額度內者。\n超過前項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。","note":"一、本條新增。\n二、第一項各款保險契約不予執行之理由，說明如下：\n(一)第一款、第二款財產保險契約、保險期間一年以下傷害保險契約、一年期健康保險契約及人壽保險契約，均無解約金；保險期間超過一年之健康保險契約，或有少量解約金可填補債權，惟將使保戶喪失維繫生命身體健康之醫療保障。\n(二)第三款小額終老保險契約為主管機關推動之政策性保險，提供高齡者身故或失能之基本保險保障。\n(三)依財團法人保險事業發展中心統計，截至一百十三年三月全國個人壽險有效契約之平均保額約新臺幣八十八萬五千元，基於維持被保險人生活經濟所需之基本保險保障，爰於第四款明定給予每一被保險人免於受執行之人壽保險保險金額額度新臺幣一百萬元。\n(四)考量前四款保險契約不予執行，爰於第五款明定該等契約之保險給付亦不予執行。\n(五)依保險法第一百三十五條之四規定，年金保險於年金給付期間，要保人不得終止保險契約，爰為第六款規定。\n(六)依據財政部公告之一百十三年每人全年基本生活費用為新臺幣二十萬二千元，半年基本生活費用即約當新臺幣十萬元，另參酌六都直轄市政府公告之一百十三年度每年每月最低生活費金額，介於新臺幣八萬四千元至十一萬四千元之間，為酌留債務人及其家屬半年之最低生活費用，爰於第七款及第八款明定，人身保險契約單筆有效契約之解約金、第六款及第七款人身保險契約保險事故發生後之單筆保險給付金額，於十萬元額度內不予執行。\n三、第二項定明超過第一項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。"},{"bill":"202110072900000","text":"以債務人為要保人之保險契約有下列情形之一者，其所生之權利，不得作為扣押或強制執行之標的：\n一、財產保險契約。\n二、健康保險契約、保險期間一年以下傷害保險契約及一年期人壽保險契約。\n三、小額終老保險契約。\n四、小額終老保險以外之人壽保險契約，每一被保險人合併後之保險金額未逾新臺幣一百萬元額度內者。\n五、前四款之保險契約保險事故發生後請領之保險給付。\n六、已進入年金給付期間之年金保險契約。\n七、人身保險契約單筆有效保險契約之解約金未逾新臺幣十萬元額度內者。\n八、前二款之人身保險契約保險事故發生後單筆保險給付金額未逾新臺幣十萬元額度內者。\n超過前項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。","note":"一、本條新增。\n二、保險契約不予執行之依據及理由說明如下：\n(一)對於財產保險契約、一年以下的傷害保險契約、一年期的健康保險契約及人壽保險契約，均不包含解約金；若健康保險契約的保險期間超過一年，則可能會有少量解約金來填補債權，但這將導致保戶喪失其必要的醫療保障，影響生命與健康的維護。\n(二)第三款小額終老保險契約屬於主管機關推動的政策性保險，旨在為高齡者提供基本的身故或失能保障，確保其老年生活的基本保險需求。\n(三)根據財團法人保險事業發展中心的統計，截至一百十三年三月，全國個人壽險有效契約的平均保額約為新臺幣八十八萬五千元。為維持被保險人的生活經濟保障，爰於第四款明定給予每一被保險人享有免於被執行的壽險保險金額度上限為新臺幣一百萬元。\n(四)依保險法第一百三十五條之四規定，年金保險於年金給付期間，要保人不得終止保險契約，爰為第六款規定。\n(五)依據財政部一百十三年公告之每人全年基本生活費用為新臺幣二十萬二千元，半年基本生活費用約為新臺幣十萬元，又參考六都直轄市政府公告之一百十三年度每年每月最低生活費金額，介於新臺幣八萬四千元至十一萬四千元之間，為酌留債務人及其家屬半年之最低生活費用，爰於第七款及第八款明定，人身保險契約單筆有效契約之解約金、第六款及第七款人身保險契約保險事故發生後之單筆保險給付金額，於十萬元額度內不予執行。\n三、第二項明定超過第一項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。"},{"bill":"202110076530000","text":"以債務人為要保人之保險契約有下列情形之一者，其所生之權利，不得作為扣押或強制執行之標的：\n一、健康保險契約。\n二、小額終老保險契約。\n三、小額終老保險以外之人壽保險契約，每一被保險人合併後之保險金額未逾新臺幣一百萬元額度內者。\n四、前三款之保險契約保險事故發生後請領之保險給付。\n五、人身保險契約單筆有效保險契約之解約金未逾新臺幣十萬元額度內者。\n六、人身保險契約於保險事故發生後單筆保險給付金額未逾新臺幣十萬元額度內者。\n超過前項第三款、第五款及第六款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。","note":"一、本條新增。\n二、第一項各款保險契約不予執行之理由，說明如下：\n(一)第一款保險期間超過一年之健康保險契約，或有少量解約金可填補債權，惟將使保戶喪失維繫生命身體健康之醫療保障。另就財產保險契約、保險期間一年以下傷害保險契約、一年期健康保險契約及人壽保險契約，均無解約金，故無強制執行之標的存在，既無扣押之標的，自無排除扣押或強制執行之必要，併予敘明。\n(二)第二款小額終老保險契約為主管機關推動之政策性保險，提供高齡者身故或失能之基本保險保障。\n(三)依財團法人保險事業發展中心統計，截至一百十三年三月全國個人壽險有效契約之平均保額約新臺幣八十八萬五千元，基於維持被保險人生活經濟所需之基本保險保障，爰於第三款明定給予每一被保險人免於受執行之人壽保險保險金額額度新臺幣一百萬元。\n(四)考量前三款保險契約不予執行，爰於第四款明定該等契約之保險給付亦不予執行。另就財產保險契約，鑒於物權法上，抵押物的保險金受抵押權效力所及，得由債權人受償，為通說和實務所採，故財產毀損滅失得受之保險金，仍得為強制執行，併予敘明。\n(五)另依保險法第一百三十五條之四規定，年金保險於年金給付期間，要保人不得終止保險契約，並無執行解約金債權之可能，故不特別立法排除，併予敘明。\n(六)依據財政部一百十三年公告之每人全年基本生活費用為新臺幣二十萬二千元，半年基本生活費用即約當新臺幣十萬元，另參酌六都直轄市政府公告之一百十三年度每年每月最低生活費金額，介於新臺幣八萬四千元至十一萬四千元之間，為酌留債務人及其家屬半年之最低生活費用，爰於第五款明定，人身保險契約單筆有效契約之解約金、第六款人身保險契約保險事故發生後之單筆保險給付金額，於十萬元額度內不予執行。"},{"bill":"202110076580000","text":"以債務人為要保人之保險契約有下列情形之一者，其所生之權利，不得作為扣押或強制執行之標的：\n一、財產保險契約。\n二、健康保險契約、保險期間一年以下傷害保險契約及一年期人壽保險契約。\n三、小額終老保險契約。\n四、小額終老保險以外之人壽保險契約，每一被保險人合併後之保險金額未逾新臺幣一百萬元額度內者。\n五、前四款之保險契約保險事故發生後請領之保險給付。\n六、已進入年金給付期間之年金保險契約。\n七、人身保險契約單筆有效保險契約之解約金未逾新臺幣三十萬元額度內者。\n八、前二款之人身保險契約保險事故發生後單筆保險給付金額未逾新臺幣三十萬元額度內者。\n超過前項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。","note":"一、本條新增。\n二、第一項各款保險契約不予執行之理由，說明如下：(一)第一款、第二款財產保險契約、保險期間一年以下傷害保險契約、一年期健康保險契約及人壽保險契約，均無解約金；保險期間超過一年之健康保險契約，或有少量解約金可填補債權，惟將使保戶喪失維繫生命身體健康之醫療保障。\n(二)第三款小額終老保險契約為主管機關推動之政策性保險，提供高齡者身故或失能之基本保險保障。\n(三)依財團法人保險事業發展中心統計，截至一百十三年三月全國個人壽險有效契約之平均保額約新臺幣八十八萬五千元，基於維持被保險人生活經濟所需之基本保險保障，爰於第四款明定給予每一被保險人免於受執行之人壽保險保險金額額度新臺幣一百萬元。\n(四)考量前四款保險契約不予執行，爰於第五款明定該等契約之保險給付亦不予執行。\n(五)依保險法第一百三十五條之四規定，年金保險於年金給付期間，要保人不得終止保險契約，爰為第六款規定。\n(六)依據財政部一百十三年公告之每人全年基本生活費用為新臺幣二十萬二千元，半年基本生活費用即約當新臺幣十萬元，另參酌六都直轄市政府公告之一百十三年度每年每月最低生活費金額，介於新臺幣八萬四千元至十一萬四千元之間，為酌留債務人及其家屬半年之最低生活費用，爰於第七款及第八款明定，人身保險契約單筆有效契約之解約金、第六款及第七款人身保險契約保險事故發生後之單筆保險給付金額，於十萬元額度內不予執行。\n三、第二項定明超過第一項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。"},{"bill":"202110079140000","text":"以債務人為要保人之保險契約有下列情形之一者，其所生之權利，不得作為扣押或強制執行之標的：\n一、財產保險契約。\n二、健康保險契約、保險期間一年以下傷害保險契約及一年期人壽保險契約。\n三、小額終老保險契約。\n四、小額終老保險以外之人壽保險契約，每一被保險人合併後之保險金額未逾新臺幣一百萬元額度內者。\n五、前四款之保險契約保險事故發生後請領之保險給付。\n六、已進入年金給付期間之年金保險契約。\n七、人身保險契約單筆有效保險契約之解約金未逾新臺幣十萬元額度內者。\n八、前二款之人身保險契約保險事故發生後單筆保險給付金額未逾新臺幣十萬元額度內者。\n超過前項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。","note":"一、本條新增。\n二、第一項各款保險契約不予執行之理由，說明如下：\n(一)第一款、第二款財產保險契約、保險期間一年以下傷害保險契約、一年期健康保險契約及人壽保險契約，均無解約金；保險期間超過一年之健康保險契約，或有少量解約金可填補債權，惟將使保戶喪失維繫生命身體健康之醫療保障。\n(二)第三款小額終老保險契約為主管機關推動之政策性保險，提供高齡者身故或失能之基本保險保障。\n(三)依財團法人保險事業發展中心統計，截至一百十三年三月全國個人壽險有效契約之平均保額約新臺幣八十八萬五千元，基於維持被保險人生活經濟所需之基本保險保障，爰於第四款明定給予每一被保險人免於受執行之人壽保險保險金額額度新臺幣一百萬元。\n(四)考量前四款保險契約不予執行，爰於第五款明定該等契約之保險給付亦不予執行。\n(五)依保險法第一百三十五條之四規定，年金保險於年金給付期間，要保人不得終止保險契約，爰為第六款規定。\n(六)依據財政部一百十三年公告之每人全年基本生活費用為新臺幣二十萬二千元，半年基本生活費用即約當新臺幣十萬元，另參酌六都直轄市政府公告之一百十三年度每年每月最低生活費金額，介於新臺幣八萬四千元至十一萬四千元之間，為酌留債務人及其家屬半年之最低生活費用，爰於第七款及第八款明定，人身保險契約單筆有效契約之解約金、第六款及第七款人身保險契約保險事故發生後之單筆保險給付金額，於十萬元額度內不予執行。\n三、第二項定明超過第一項第四款、第七款及第八款所定額度之保險契約，僅得於超過額度之範圍，依法作為扣押或強制執行之標的。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第一百七十四條之三","current":null,"versions":[{"bill":"202110044740000","text":"滿足以下各款條件之保險契約，該保險金之請求權利，不得作為抵銷、扣押、供擔保或強制執行之標的：\n一、已簽訂之健康保險契約、傷害保險契約、一年定期人壽保險契約或已發生給付之健康保險。\n二、其他保險契約，其保險人有效保單價值準備金或可領取之解約金金額為新臺幣十萬元以下者。","note":"一、本條新增。\n二、有鑒於一○八年台抗大字第八九七號裁定統一見解採債權人得於取得強制執行名義後對債務人之人壽保險予以強制執行，故各執行法院目前均有受理對債務人所有之人壽保險進行解約並強制執行之案件。惟各項保險並不相同，以健康險為例，保險人於被保險人疾病、分娩及其所致失能或死亡時有給付保險金額之責。考量要保人於購買健康保險保單時，其目的係為保障自己未來疾病、分娩時，或因其而導致失能或死亡時，能獲領保險金以維持基本生活權益。\n三、復考量各保險契約之差異，部分要保人與被保險人為同一人之健康險種，或有該保單解約後，因要保人本身年齡、身體狀況等條件之差異而再無法購買相同保險商品、或其購買保險之價格暴增。且往往要保人購買該保單時，未必可預見自身將於購買保險後身陷債務問題而至債權人對其資產強制執行。為確保民眾購買保單時所欲獲得之保障不致受債權人強制執行而有所影響，就特定保險種類之保險金請求權不應作為抵銷、扣押、供擔保或強制執行之標的，爰於第一項第一款明定此類特定保險包含健康保險、傷害保險、一年定期人壽保險與已發生給付之健康保險。\n四、惟實務上有部分遭強制執行之保險，其保單價值準備金餘額甚低，於清償債務尚無顯著實效。然，依一○八年台抗大字第八九七號裁定意指，該類保險仍得作為強制執行之標的，致使此類保險仍遭強制執行，在杯水車薪、難以清償積欠債務同時，被保險人之權益又遭犧牲。為免此類情形發生，並確實保障被保險人之利益，爰於第一項第二款明定保單價值準備金或可領取之解約金金額為新臺幣十萬元以下者，亦不得作為抵銷、扣押、供擔保或強制執行之標的。"},{"bill":"202110061230000","text":"保險事故發生前，保險契約之保單價值準備金經執行法院或法務部行政執行署所屬行政執行分署（以下簡稱行政執行分署）扣押時，該保險契約之具名指定之受益人或被保險人，得經要保人及被保險人之書面同意，介入保險契約，取得要保人之地位，且介入權人對被保險人應具有保險利益。\n前項保險契約未具名指定受益人時，要保人之配偶、父母及子女、被保險人、被保險人之配偶、父母及子女有前項之權利。\n依前二項規定介入保險契約者，應以該契約終止後預計可得獲保險人償付之解約金額度內，向執行法院、行政執行分署或執行命令所指定之債權人支付，並由執行法院或行政執行分署通知保險人，始生介入效力，由保險人據以變更要保人為該介入權人。\n自第一項事由發生時起，介入權人六個月內不行使者，其權利消滅。","note":"一、本條新增。\n二、按介入權制度為賦予受益人、被保險人或要保人、被保險人一定範圍內親屬等特定人，於保險契約受強制執行程序中，可行使介入權代為清償受執行保險契約解約金額度內之債務，並成為新要保人，避免被保險人及受益人之保險保障權益受損。爰新增第一項至第三項規定，以確保保險契約在受執行時，被保險人及受益人得透過行使介入權維持其生活經濟所必需之保險保障，使保險契約效力得以延續。\n三、另為利法律關係儘早確定，爰於第四項明定介入權人六個月內不行使者，其權利消滅。"},{"bill":"202110068640000","text":"保險契約之保單價值準備金經扣押時，具名指定之受益人或被保險人、未具名指定受益人時之被保險人、要保人與被保險人一定範圍內親屬，得經要保人及被保險人書面同意，於向執行法院或法務部行政執行署所屬行政執行分署、執行命令所指定之債權人，在解約金額度內支付，並由執行法院或行政執行分署通知保險人後，介入保險契約，取得要保人之地位。","note":"一、本條新增。\n二、為維護保險契約所涉及具名指定的受益人或被保險人等一定範圍內第三人權益，避免因債務問題而導致原權益受損，增訂介入權制度，使其能夠和債權人協商、賠付相當於解約金的金額，免於保險契約遭到解約的窘境，且兼顧債務人、債權人、受影響第三人之權益。"},{"bill":"202110069970000","text":"保險事故發生前，保險契約之保單價值準備金經執行法院或法務部行政執行署所屬行政執行分署（以下簡稱行政執行分署）扣押時，該保險契約之具名指定之受益人或被保險人，得經要保人及被保險人之書面同意，介入保險契約，取得要保人之地位，且介入權人對被保險人應具有保險利益。\n前項保險契約未具名指定受益人時，要保人之配偶、父母及子女、被保險人、被保險人之配偶、父母及子女有前項之權利。\n依前二項規定介入保險契約者，應以該契約終止後預計可得獲保險人償付之解約金額度內，向執行法院、行政執行分署或執行命令所指定之債權人支付，並由執行法院或行政執行分署通知保險人，始生介入效力，由保險人據以變更要保人為該介入權人。\n自第一項事由發生時起，介入權人三個月內不行使者，其權利消滅。","note":"一、本條新增。\n二、為確保保險契約經扣押或受強制執行時，被保險人及受益人等人得透過行使介入權使契約效力得以延續，以維持其生活經濟所必需之保險保障，並成為要保人，爰定明保險契約之保單價值準備金經扣押時，具名指定之受益人或被保險人、未具名指定受益人時之被保險人、要保人與被保險人一定範圍內親屬，得經要保人及被保險人書面同意，於向執行法院或法務部行政執行署所屬行政執行分署、執行命令所指定之債權人，在解約金額度內支付，並由執行法院或行政執行分署通知保險人後，介入保險契約，取得要保人之地位。"},{"bill":"202110070950000","text":"保險事故發生前，保險契約之保單價值準備金經執行法院或法務部行政執行署所屬行政執行分署（以下簡稱行政執行分署）扣押時，該保險契約之具名指定之受益人或被保險人，得經要保人及被保險人之書面同意，介入保險契約，取得要保人之地位，且介入權人對被保險人應具有保險利益。\n前項保險契約未具名指定受益人時，要保人之配偶、父母及子女、被保險人、被保險人之配偶、父母及子女有前項之權利。\n依前二項規定介入保險契約者，應以該契約終止後預計可得獲保險人償付之解約金額度內，向執行法院、行政執行分署或執行命令所指定之債權人支付，並由執行法院或行政執行分署通知保險人，始生介入效力，由保險人據以變更要保人為該介入權人。","note":"一、本條新增。\n二、按介入權制度為賦予受益人、被保險人或要保人、被保險人一定範圍內親屬等特定人，於保險契約受強制執行程序中，可行使介入權代為清償受執行保險契約解約金額度內之債務，並成為新要保人，避免被保險人及受益人之保險保障權益受損。為確保保險契約在受執行時被保險人及受益人得透過行使介入權維持其生活經濟所必需之保險保障，使保險契約效力得以延續，爰新增本條，於第一項至第三項定明在保險契約之保單價值準備金經扣押時，具名指定之受益人或被保險人、未具名指定受益人時之被保險人、要保人及被保險人一定範圍內親屬，得經要保人及被保險人書面同意，於向執行法院或行政執行分署、執行命令所指定之債權人，在解約金額度內支付，並由執行法院或行政執行分署通知保險人執行命令撤銷後，介入保險契約，取得要保人之地位，惟該介入權人對被保險人仍應具有保險法第十六條之保險利益。上開未具名指定受益人，包括採身分指定或未指定受益人之情形。\n三、為利法律關係儘早確定，爰於第四項明定介入權人三個月內不行使者，其權利消滅。"},{"bill":"202110072900000","text":"保險事故發生前，保險契約之保單價值準備金經執行法院或法務部行政執行署所屬行政執行分署（以下簡稱行政執行分署）扣押時，該保險契約之具名指定之受益人或被保險人，得經要保人及被保險人之書面同意，介入保險契約，取得要保人之地位，且介入權人對被保險人應具有保險利益。\n前項保險契約未具名指定受益人時，要保人之配偶、父母及子女、被保險人、被保險人之配偶、父母及子女有前項之權利。\n依前二項規定介入保險契約者，應以該契約終止後預計可得獲保險人償付之解約金額度內，向執行法院、行政執行分署或執行命令所指定之債權人支付，並由執行法院或行政執行分署通知保險人，始生介入效力，由保險人據以變更要保人為該介入權人。\n自第一項事由發生時起，介入權人六個月內不行使者，其權利消滅。","note":"一、本條新增。\n二、為賦予特定人（如受益人、被保險人或要保人、被保險人的一定範圍內之親屬）在保險契約遭強制執行程序中，行使介入權代為清償保險契約解約金額度內之債務，並取得新要保人之地位，藉此避免被保險人及受益人之保險保障受損，確保其基本生活及經濟所需之保險保障不致中斷，爰增訂本條於第一項至第三項明定於保險契約之保單價值準備金遭扣押時，具名指定之受益人或被保險人，或於未具名指定受益人之情形下，被保險人、要保人及其一定範圍內之親屬，經要保人及被保險人書面同意後，得向執行法院、行政執行分署或執行命令所指定之債權人支付解約金額度內之款項。執行法院或行政執行分署於通知保險人撤銷執行命令後，該介入權人即取得保險契約中要保人之地位，但介入權人對被保險人仍須符合保險法第十六條所規定之保險利益。上述未具名指定受益人之情形，包括採用身分指定或未明確指定受益人之保險契約。\n三、第四項定明介入權人不行使介入權之消滅時效之規定。"},{"bill":"202110076530000","text":"保險事故發生前，保險契約之保單價值準備金經執行法院或法務部行政執行署所屬行政執行分署（以下簡稱行政執行分署）扣押時，該保險契約之具名指定之受益人或被保險人，得經要保人及被保險人之書面同意，介入保險契約，取得要保人之地位，且介入權人對被保險人應具有保險利益。\n前項保險契約未具名指定受益人時，要保人之配偶、父母及子女、被保險人、被保險人之配偶、父母及子女有前項之權利。依前二項規定介入保險契約者，應以該契約終止後預計可得獲保險人償付之解約金額度內，向執行法院、行政執行分署或執行命令所指定之債權人支付，並由執行法院或行政執行分署通知保險人，始生介入效力，由保險人據以變更要保人為該介入權人。\n自第一項事由發生時起，介入權人三個月內不行使者，其權利消滅。","note":"一、本條新增。\n二、按介入權制度為賦予受益人、被保險人或要保人、被保險人一定範圍內親屬等特定人，於保險契約受強制執行程序中，可行使介入權代為清償受執行保險契約解約金額度內之債務，並成為新要保人，避免被保險人及受益人之保險保障權益受損。為確保保險契約在受執行時被保險人及受益人得透過行使介入權維持其生活經濟所必需之保險保障，使保險契約效力得以延續，爰新增本條，於第一項至第三項定明在保險契約之保單價值準備金經扣押時，具名指定之受益人或被保險人、未具名指定受益人時之被保險人、要保人及被保險人一定範圍內親屬，得經要保人及被保險人書面同意，於向執行法院或行政執行分署、執行命令所指定之債權人，在解約金額度內支付，並由執行法院或行政執行分署通知保險人執行命令撤銷後，介入保險契約，取得要保人之地位，惟該介入權人對被保險人仍應具有保險法第十六條之保險利益。上開未具名指定受益人，包括採身分指定或未指定受益人之情形。\n三、為利法律關係儘早確定，爰於第四項明定介入權人三個月內不行使者，其權利消滅。"},{"bill":"202110076580000","text":"保險事故發生 <script>

  $('benchlegend').hidden = true;

[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],

  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }

  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
