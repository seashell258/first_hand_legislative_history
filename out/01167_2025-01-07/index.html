<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>警察人員人事條例 2025 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

語，爰修正文字。"}],"changed":true,"final":"初任警察官之年齡，不得超過下列規定：\n一、警佐四十歲。\n二、警正四十五歲。\n三、警監五十歲。\n升官等任用者，不受前項限制。","finalWhy":"為統一法律用語，爰修正文字。","review":{"note":"照委員鄭天財Sra Kacaw等18人提案通過","text":"初任警察官之年齡，不得超過下列規定：\n一、警佐四十歲。\n二、警正四十五歲。\n三、警監五十歲。\n升官等任用者，不受前項限制。"}},{"no":"第十一條","current":"警察官之任官資格如左：\n一、警察人員考試及格者。\n二、曾任警察官，經依法升官等任用者。\n三、本條例施行前曾任警察官，依法銓敘合格者。\n警察官之任用，除具備前項各款資格之一外，職務等階最高列警正三階以上，應經警察大學或警官學校畢業或訓練合格；職務等階最高列警正四階以下，應經警察大學、警官學校、警察專科學校或警察學校畢業或訓練合格。","versions":[{"bill":"202110049480000","text":"警察官之任官資格如下：\n一、警察人員考試及格者。\n二、曾任警察官，經依法升官等任用者。\n三、本條例施行前曾任警察官，依法銓敘合格者。\n警察官之任用，除具備前項各款資格之一外，職務等階最高列警正三階以上，應經警察大學或警官學校畢業或訓練合格；職務等階最高列警正四階以下，應經警察大學、警官學校、警察專科學校或警察學校畢業或訓練合格。","note":"為統一法律用語，爰修正文字。"}],"changed":true,"final":"警察官之任官資格如下：\n一、警察人員考試及格者。\n二、曾任警察官，經依法升官等任用者。\n三、本條例施行前曾任警察官，依法銓敘合格者。\n警察官之任用，除具備前項各款資格之一外，職務等階最高列警正三階以上，應經警察大學或警官學校畢業或訓練合格；職務等階最高列警正四階以下，應經警察大學、警官學校、警察專科學校或警察學校畢業或訓練合格。","finalWhy":"為統一法律用語，爰修正文字。","review":{"note":"照委員鄭天財Sra Kacaw等18人提案通過","text":"警察官之任官資格如下：\n一、警察人員考試及格者。\n二、曾任警察官，經依法升官等任用者。\n三、本條例施行前曾任警察官，依法銓敘合格者。\n警察官之任用，除具備前項各款資格之一外，職務等階最高列警正三階以上，應經警察大學或警官學校畢業或訓練合格；職務等階最高列警正四階以下，應經警察大學、警官學校、警察專科學校或警察學校畢業或訓練合格。"}},{"no":"第十二條","current":"警察人員考試及格者，取得任官資格如左：\n一、高等考試一級考試或特種考試警察人員考試一等考試及格者，取得警正一階任官資格。\n二、高等考試二級考試或特種考試警察人員考試二等考試及格者，取得警正三階任官資格。\n三、高等考試三級考試或特種考試警察人員考試三等考試及格者，取得警正四階任官資格。\n四、普通考試或特種考試警察人員考試四等考試及格者，取得警佐三階任官資格。\n五、初等考試或特種考試警察人員考試五等考試及格者，取得警佐四階任官資格。\n前項第一款至第三款所列各等級考試及格人員，如無相當官階職務可資任官時，得先以低一官階任官。","versions":[{"bill":"202110049480000","text":"警察人員考試及格者，取得任官資格如下：\n一、高等考試一級考試或特種考試警察人員考試一等考試及格者，取得警正一階任官資格。\n二、高等考試二級考試或特種考試警察人員考試二等考試及格者，取得警正三階任官資格。\n三、高等考試三級考試或特種考試警察人員考試三等考試及格者，取得警正四階任官資格。\n四、普通考試或特種考試警察人員考試四等考試及格者，取得警佐三階任官資格。\n五、初等考試或特種考試警察人員考試五等考試及格者，取得警佐四階任官資格。\n前項第一款至第三款所列各等級考試及格人員，如無相當官階職務可資任官時，得先以低一官階任官。","note":"為統一法律用語，爰修正文字。"}],"changed":true,"final":"警察人員考試及格者，取得任官資格如下：\n一、高等考試一級考試或特種考試警察人員考試一等考試及格者，取得警正一階任官資格。\n二、高等考試二級考試或特種考試警察人員考試二等考試及格者，取得警正三階任官資格。\n三、高等考試三級考試或特種考試警察人員考試三等考試及格者，取得警正四階任官資格。\n四、普通考試或特種考試警察人員考試四等考試及格者，取得警佐三階任官資格。\n五、初等考試或特種考試警察人員考試五等考試及格者，取得警佐四階任官資格。\n前項第一款至第三款所列各等級考試及格人員，如無相當官階職務可資任官時，得先以低一官階任官。","finalWhy":"為統一法律用語，爰修正文字。","review":{"note":"照委員鄭天財Sra Kacaw等18人提案通過","text":"警察人員考試及格者，取得任官資格如下：\n一、高等考試一級考試或特種考試警察人員考試一等考試及格者，取得警正一階任官資格。\n二、高等考試二級考試或特種考試警察人員考試二等考試及格者，取得警正三階任官資格。\n三、高等考試三級考試或特種考試警察人員考試三等考試及格者，取得警正四階任官資格。\n四、普通考試或特種考試警察人員考試四等考試及格者，取得警佐三階任官資格。\n五、初等考試或特種考試警察人員考試五等考試及格者，取得警佐四階任官資格。\n前項第一款至第三款所列各等級考試及格人員，如無相當官階職務可資任官時，得先以低一官階任官。"}},{"no":"第十五條","current":"本條例施行前，經依法銓敘合格現任警察官之官等，依左列規定改任：\n一、簡任改任警監。\n二、薦任改任警正。\n三、委任改任警佐。","versions":[{"bill":"202110049480000","text":"本條例施行前，經依法銓敘合格現任警察官之官等，依下列規定改任：\n一、簡任改任警監。\n二、薦任改任警正。\n三、委任改任警佐。","note":"為統一法律用語，爰修正文字。"}],"changed":true,"final":"本條例施行前，經依法銓敘合格現任警察官之官等，依下列規定改任：\n一、簡任改任警監。\n二、薦任改任警正。\n三、委任改任警佐。","finalWhy":"為統一法律用語，爰修正文字。","review":{"note":"照委員鄭天財Sra Kacaw等18人提案通過","text":"本條例施行前，經依法銓敘合格現任警察官之官等，依下列規定改任：\n一、簡任改任警監。\n二、薦任改任警正。\n三、委任改任警佐。"}},{"no":"第十六條","current":"警察官初任各官等及警監各官階時均應任官，程序如左：\n一、警監、警正由內政部核轉銓敘部銓敘審定合格後，呈請總統任官。\n二、警佐由內政部核轉銓敘部銓敘審定合格後任官，或由直轄市政府核轉銓敘部銓敘審定合格後，報內政部任官。","versions":[{"bill":"202110049480000","text":"警察官初任各官等及警監各官階時均應任官，程序如下：\n一、警監、警正由內政部核轉銓敘部銓敘審定合格後，呈請總統任官。\n二、警佐由內政部核轉銓敘部銓敘審定合格後任官，或由直轄市政府核轉銓敘部銓敘審定合格後，報內政部任官。","note":"為統一法律用語，爰修正文字。"}],"changed":true,"final":"警察官初任各官等及警監各官階時均應任官，程序如下：\n一、警監、警正由內政部核轉銓敘部銓敘審定合格後，呈請總統任官。\n二、警佐由內政部核轉銓敘部銓敘審定合格後任官，或由直轄市政府核轉銓敘部銓敘審定合格後，報內政部任官。","finalWhy":"為統一法律用語，爰修正文字。","review":{"note":"照委員鄭天財Sra Kacaw等18人提案通過","text":"警察官初任各官等及警監各官階時均應任官，程序如下：\n一、警監、警正由內政部核轉銓敘部銓敘審定合格後，呈請總統任官。\n二、警佐由內政部核轉銓敘部銓敘審定合格後任官，或由直轄市政府核轉銓敘部銓敘審定合格後，報內政部任官。"}},{"no":"第二十一條","current":"警察職務之遴任權限，劃分如左：\n一、警監職務，由內政部遴任或報請行政院遴任。\n二、警正、警佐職務，由內政部遴任或交由直轄市政府遴任。","versions":[{"bill":"202110049480000","text":"警察職務之遴任權限，劃分如下：\n一、警監職務，由內政部遴任或報請行政院遴任。\n二、警正、警佐職務，由內政部遴任或交由直轄市政府遴任。","note":"為統一法律用語，爰修正文字。"}],"changed":true,"final":"警察職務之遴任權限，劃分如下：\n一、警監職務，由內政部遴任或報請行政院遴任。\n二、警正、警佐職務，由內政部遴任或交由直轄市政府遴任。","finalWhy":"為統一法律用語，爰修正文字。","review":{"note":"照委員鄭天財Sra Kacaw等18人提案通過","text":"警察職務之遴任權限，劃分如下：\n一、警監職務，由內政部遴任或報請行政院遴任。\n二、警正、警佐職務，由內政部遴任或交由直轄市政府遴任。"}},{"no":"第二十三條","current":"本俸之支給，初任警正或警佐者，其等級起敘規定如左：\n一、高等考試一級考試或特種考試警察人員考試一等考試及格，以警正一階任用，自一階三級起敘，先以警正二階任用者，自二階一級起敘。\n二、高等考試二級考試或特種考試警察人員考試二等考試及格，以警正三階任用，自三階三級起敘，先以警正四階任用者，自四階一級起敘。\n三、高等考試三級考試或特種考試警察人員考試三等考試及格，以警正四階任用，自四階三級起敘，先以警佐一階任用者，自一階一級起敘。\n四、普通考試或特種考試警察人員考試四等考試及格，以警佐三階任用，自三階三級起敘。\n五、初等考試或特種考試警察人員考試五等考試及格，自警佐四階六級起敘。","versions":[{"bill":"202110049480000","text":"本俸之支給，初任警正或警佐者，其等級起敘規定如下：\n一、高等考試一級考試或特種考試警察人員考試一等考試及格，以警正一階任用，自一階三級起敘，先以警正二階任用者，自二階一級起敘。\n二、高等考試二級考試或特種考試警察人員考試二等考試及格，以警正三階任用，自三階三級起敘，先以警正四階任用者，自四階一級起敘。\n三、高等考試三級考試或特種考試警察人員考試三等考試及格，以警正四階任用，自四階三級起敘，先以警佐一階任用者，自一階一級起敘。\n四、普通考試或特種考試警察人員考試四等考試及格，以警佐三階任用，自三階三級起敘。\n五、初等考試或特種考試警察人員考試五等考試及格，自警佐四階六級起敘。","note":"為統一法律用語，爰修正文字。"}],"changed":true,"final":"本俸之支給，初任警正或警佐者，其等級起敘規定如下：\n一、高等考試一級考試或特種考試警察人員考試一等考試及格，以警正一階任用，自一階三級起敘，先以警正二階任用者，自二階一級起敘。\n二、高等考試二級考試或特種考試警察人員考試二等考試及格，以警正三階任用，自三階三級起敘，先以警正四階任用者，自四階一級起敘。\n三、高等考試三級考試或特種考試警察人員考試三等考試及格，以警正四階任用，自四階三級起敘，先以警佐一階任用者，自一階一級起敘。\n四、普通考試或特種考試警察人員考試四等考試及格，以警佐三階任用，自三階三級起敘。\n五、初等考試或特種考試警察人員考試五等考試及格，自警佐四階六級起敘。","finalWhy":"為統一法律用語，爰修正文字。","review":{"note":"照委員鄭天財Sra Kacaw等18人提案通過","text":"本俸之支給，初任警正或警佐者，其等級起敘規定如下：\n一、高等考試一級考試或特種考試警察人員考試一等考試及格，以警正一階任用，自一階三級起敘，先以警正二階任用者，自二階一級起敘。\n二、高等考試二級考試或特種考試警察人員考試二等考試及格，以警正三階任用，自三階三級起敘，先以警正四階任用者，自四階一級起敘。\n三、高等考試三級考試或特種考試警察人員考試三等考試及格，以警正四階任用，自四階三級起敘，先以警佐一階任用者，自一階一級起敘。\n四、普通考試或特種考試警察人員考試四等考試及格，以警佐三階任用，自三階三級起敘。\n五、初等考試或特種考試警察人員考試五等考試及格，自警佐四階六級起敘。"}},{"no":"第三十四條","current":"辦理考績程序如左：\n一、內政部警政署與所屬警察機關、學校、各縣（市）警察局及警察大學警察人員之考績，由內政部或授權之警察機關、學校核定後，送銓敘部銓敘審定。\n二、直轄市政府警察局警監人員之考績，由直轄市政府核定後，送內政部轉銓敘部銓敘審定；其餘人員之考績，由直轄市政府核定後，送銓敘部銓敘審定。","versions":[{"bill":"202110049480000","text":"辦理考績程序如下：\n一、內政部警政署與所屬警察機關、學校、各縣（市）警察局及警察大學警察人員之考績，由內政部或授權之警察機關、學校核定後，送銓敘部銓敘審定。\n二、直轄市政府警察局警監人員之考績，由直轄市政府核定後，送內政部轉銓敘部銓敘審定；其餘人員之考績，由直轄市政府核定後，送銓敘部銓敘審定。","note":"為統一法律用語，爰修正文字。"}],"changed":true,"final":"辦理考績程序如下：\n一、內政部警政署與所屬警察機關、學校、各縣（市）警察局及警察大學警察人員之考績，由內政部或授權之警察機關、學校核定後，送銓敘部銓敘審定。\n二、直轄市政府警察局警監人員之考績，由直轄市政府核定後，送內政部轉銓敘部銓敘審定；其餘人員之考績，由直轄市政府核定後，送銓敘部銓敘審定。","finalWhy":"為統一法律用語，爰修正文字。","review":{"note":"照委員鄭天財Sra Kacaw等18人提案通過","text":"辦理考績程序如下：\n一、內政部警政署與所屬警察機關、學校、各縣（市）警察局及警察大學警察人員之考績，由內政部或授權之警察機關、學校核定後，送銓敘部銓敘審定。\n二、直轄市政府警察局警監人員之考績，由直轄市政府核定後，送內政部轉銓敘部銓敘審定；其餘人員之考績，由直轄市政府核定後，送銓敘部銓敘審定。"}},{"no":"第三十五條","current":"警察人員之退休，除依左列規定外，適用公務人員退休法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","versions":[{"bill":"202110033970000","text":"警察人員之退休，除依左列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防及海巡人員之每月退休所得，其替代率依本條例之規定辦理（如附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十為上限。\n五、本法公布施行前退休生效者，應按本法公布施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、查「公務人員退休法」已於107年11月21日廢止，並新訂「公務人員退休資遣撫卹法」代替，自107年7月1日施行，爰配合修正第一項、第一項第一款及第一項第二款相關條文文字。\n二、警察、消防及海巡人員因公殉職死亡及傷殘人數，在各類公務人員中占比最高；另平日勤業務勞心勞力之結果，平均壽命短於國人，又為因應大陸武力犯台，內政部警政署已擴編所屬保安警察第二總隊，施以軍事訓練，以為戰時保護科技園區及電廠、天然氣廠等關鍵基礎設施，擔任國家第二陸軍之職責；行政院海岸巡防署亦對新增鑑艇加裝戰備，以利戰時擔任國家第二海軍之職責。基上，宜對警察、消防及海巡人員之付出，予以相應之保障。\n三、增列第四款，已退休之警察人員，退休所得替代率之規定及其上限，應比照國軍之規定辦理。\n四、增列第五款，已退休之警察人員，退休待遇之計算標準，應比照現職同等級人員之待遇標準計算，並隨在職同等級人員本（年功）俸之調整而調整。\n五、增列附表三退休警察人員經審定退休年資之退休所得替代率對照表。"},{"bill":"202110038050000","text":"警察人員之退休，除依左列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察人員之每月退休所得，其替代率依本條例之規定辦理（如附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十為上限。\n五、本法公布施行前退休生效者，應按本法公布施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、因「公務人員退休法」已於107年廢止，改適用「公務人員退休資遣撫卹法」之規定，爰將「公務人員退休法」皆修正為「公務人員退休資遣撫卹法」。\n二、鑒於警消及海巡人員工時長，業務繁重，工作危險性亦高於一般公務人員，如近年來頻頻發生警察人員因追緝罪犯而傷殘、殉職；亦有消防人員為救火而葬身火海；海巡人員巡檢非法船隻遭反擊，相關案件層出不窮，其危險、辛勞程度不亞於國軍，然其退休所得替代率卻與一般公務員相同，顯對警消及海巡人員之保障不足。\n三、此外，現行「公務人員退休資遣撫卹法」規定，退休人員所得替代率上限將逐年下調1.5%，直至118年後，其上限將降至62.5%，與現行「陸海空軍軍官士官服役條例」之國軍退休人員所得替代率上限為90%有極大之差距，對警消及海巡人員顯不公平，實有修法調整之必要，爰於增訂第四款，明定警察人員每月退休所得替代率依本條例辦理（如附表三），其服務年資滿十五年者，其替代率以45%開始計算，最高採計40年，其替代率最高比照國軍，以90%為上限。\n四、上述第四款警察人員包含本條例第三十九條之一所列之海巡及消防警察相關之人員。\n五、增訂第五款，明定已退休之警察人員，其退休所得替代率規定及上限，按本條例規定辦理，並應依在職同等級人員本（年功）俸之調整而變動。\n六、增訂附表三，退休警察人員經審定退休年資之退休所得替代率對照表。"},{"bill":"202110039740000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防及海巡人員之每月退休所得，其替代率依本條例之規定辦理（附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十五為上限。\n五、本條例公布施行前退休生效者，應按本條例公布施行時現職同等級人員之待遇標準重新計算月退休所得，並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、「公務人員退休法」已於107年11月21日廢止，並新訂「公務人員退休資遣撫卹法」代替，自107年7月1日施行。配合修正第一項相關文字。\n二、警察工作內容具高度危險性、辛勞性及緊急性，身心長期處於高壓及高衝突環境，經常需要24小時輪服勤務，不固定的上班時間，日夜顛倒，嚴重影響生活作息與身心健康，進而影響警察人員平均餘命及體力可負荷工作之年齡。根據內政府警政署統計，警消平均死亡年齡為75歲，與國人平均壽命近81歲相比，壽命差距6年之多，即使是退休後死亡年齡78歲，兩者壽命也相差約3年。\n三、隨著社會大環境改變治安勤務日趨複雜，再加上兩岸關係趨於緊張，警察人員需肩負保護科技園區及電廠、天然氣廠等關鍵基礎設施，如同國家第二陸軍；海岸巡防署亦對新增鑑艇加裝戰備，以利戰時擔任國家第二海軍之職責。\n四、2017年年金改革過程中，因警察與公教人員相同適用《公務人員退休資遣撫卹法》，所得替代率大幅調降之下，又因多數警察危勞職務降低退休年齡，對退休警察人員衝擊影響甚鉅。\n五、鑒於警消、海巡人員工作之特殊性質，退休所得替代率部分，應比照國軍之規定辦理。故參考「陸海空軍軍官士官服役條例」規定，增訂「警察人員人事條例」第三十五條第一項第四款規定：「警察、消防及海巡人員之每月退休所得，其替代率依本條例之規定辦理，其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十五為上限。」\n六、增列附表三退休警察人員經審定退休年資之退休所得替代率對照表。"},{"bill":"202110040790000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防及海巡人員之每月退休所得，其替代率依本條例之規定辦理（如附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十為上限。\n五、本法公布施行前退休生效者，應按本法公布施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、「公務人員退休法」於107年11月21日已廢止，並新訂「公務人員退休資遣撫卹法」代替，自107年7月1日施行，爰修正第一項、第一項第一款及第一項第二款相關條文文字。\n二、警察、消防及海巡人員因公殉職死亡及傷殘人數，在各類公務人員中占比最高；又為因應區域局勢改變極可能軍事威脅，內政部警政署已擴編所屬保安警察第二總隊，施以軍事訓練，維護基礎重要設施；海巡署又肩負強化制海戰力、平戰轉化之能力，積極強化戰訓。近年公共及工安意外提升，消防減災、防災之任務加重，成為維護民眾生活安全之重要力量。爰此，警察、消防及海巡人員之任務繁重，國家應予以相應保障。\n三、增列第四款，已退休之警察、消防及海巡人員，退休所得替代率之規定及其上限，應比照參考「陸海空軍軍官士官服役條例」規定之規定辦理。\n四、增列第五款，已退休之警、消及海巡人員，退休待遇之計算標準，應比照現職同等級人員之待遇標準計算，並隨在職同等級人員本（年功）俸之調整而調整。\n五、增列附表三退休警察人員經審定退休年資之退休所得替代率對照表。"},{"bill":"202110046550000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察人員之月退休所得替代率照附表三所定替代率計算，其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十五為上限。\n五、本法公布施行前退休生效者，應按本法公布施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、配合「公務人員退休資遣撫卹法」施行，爰修正第一項、第一項第一款及第一項第二款條文文字。\n二、警察人員工作時數長並具高危險性，顯不同一般人員，有其特殊性。依統計資料警察人員之傷亡率遠高於其他公務人員，其平均壽命也低於國民平均，故其每月退休所得退之替代率應比照勤務性質相近之國軍。\n三、增列第四款，有關退休之警察人員，退休所得替代率之規定及其上限，另依附表三之規定。\n四、增列第五款，已退休之警察人員，退休待遇之計算標準，應比照現職同等級人員之待遇標準計算，並隨在職同等級人員本（年功）俸之調整而調整。\n五、增訂附表三─退休警察人員經審定退休年資之退休所得替代率對照表。"},{"bill":"202110047740000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防、海巡、移民、空中勤務及航空測量機關人員之每月退休所得（如附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代增加百分之二，最高採計四十年，並以百分之九十為上限。\n五、本法公布施行前退休生效者，應按本法公布施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、有鑑於近年物價高漲及通膨壓力，消費者物價指數多次超過行政院主計總處所認定之2%警戒線，又，主計總處發布之高齡家庭消費者物價指數，高齡家庭CPI皆超出全體平均值對高齡者生活影響甚鉅，恐使支領定期退撫給付金額之退休公務人員或其遺族，生活困難。\n二、且，警察、消防、海巡、移民、空中勤務及航空測量機關等專業人員業務繁重，工時不固定，工作危險性亦高於一般公務人員，近年來接連有警察、消防、海巡、移民、空中勤務及航空測量機關人員因公而傷殘、殉職，其之危險、辛勞程度不亞於國軍，然其退休所得替代率卻逐年下修，顯對其保障不足。\n三、內政部移民署與警察機關同樣肩負確保國家安全、維護社會安定之任務，其編制內人員之勤業務與警察同質性高，同具司法警察身分，且「警察消防海巡移民空勤人員及協勤民力安全基金設置管理條例」及「消防、海巡、空中勤務、移民及航空測量機關專業人員危險職務加給表」，均將警察、消防、海巡及移民機關人員，併同納入適用對象，因此，實應將警察、消防、海巡及移民人員之退休所得替代率併案辦理。基上，為對警察、消防、海巡及移民人員之給付，給予相應之保障，爰增列第一項第四款，比照國軍相關規定，明定退休警察、消防、海巡及移民人員退休所得替代率之標準及其上限。"},{"bill":"202110049480000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防及海巡人員之每月退休所得，其替代率依本條例之規定辦理（附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十五為上限。\n五、本條例公布施行前退休生效者，應按本條例公布施行時現職同等級人員之待遇標準重新計算月退休所得，並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、「公務人員退休法」已於107年11月21日廢止，並新訂「公務人員退休資遣撫卹法」代替，自107年7月1日施行。配合修正第一項相關文字。\n二、警察工作內容具高度危險性、辛勞性及緊急性，身心長期處於高壓及高衝突環境，經常需要24小時輪服勤務，不固定的上班時間，日夜顛倒，嚴重影響生活作息與身心健康，進而影響警察人員平均餘命及體力可負荷工作之年齡。根據內政部警政署統計，警消平均死亡年齡為75歲，與國人平均壽命近81歲相比，壽命差距6年之多，即使是退休後死亡年齡78歲，兩者壽命也相差約3年。\n三、隨著社會大環境改變治安勤務日趨複雜，再加上兩岸關係趨於緊張，警察人員需肩負保護科技園區及電廠、天然氣廠等關鍵基礎設施，如同國家第二陸軍；海岸巡防署亦對新增鑑艇加裝戰備，以利戰時擔任國家第二海軍之職責。\n四、2017年年金改革過程中，因警察與公教人員相同適用《公務人員退休資遣撫卹法》，所得替代率大幅調降之下，又因多數警察危勞職務降低退休年齡，對退休警察人員衝擊影響甚鉅。\n五、鑒於警消、海巡人員工作之特殊性質，退休所得替代率部分，應比照國軍之規定辦理。故參考「陸海空軍軍官士官服役條例」規定，增訂「警察人員人事條例」第三十五條第一項第四款規定：「警察、消防及海巡人員之每月退休所得，其替代率依本條例之規定辦理，其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十五為上限。」\n六、增列附表三退休警察人員經審定退休年資之退休所得替代率對照表。"},{"bill":"202110050330000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防及海岸巡防機關之警察人員之每月退休所得，其替代率依本條例之規定辦理（附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十為上限。\n五、本條例公布施行前退休生效者，應按本條例公布施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、經查「公務人員退休法」於107年11月21日已廢止，並新訂改適用「公務人員退休資遣撫卹法」，爰修正本條第一項、第一項第一款及第一項第二款相關文字。\n二、警察、消防及海岸巡防機關內之警察人員，任務性質繁重，且所需處理之勤務與肩負之責任，對社會安全之穩定、民眾生命財產之保護及國家周防之維持，長期付出並處於高壓與危險的工作環境中，因此應提高其退休後之保障。\n三、爰提案增訂本條第一項第四款與第五款，將已退休警察、消防及海岸巡防機關之警察人員，退休所得替代率之規定及其上限，參照「陸海空軍軍官士官服役條例」規定之規定辦理。而退休待遇之計算標準，亦比照現職同等級人員之待遇標準計算，並隨在職同等級人員本（年功）俸之調整而調整。\n四、增訂附表三「退休警察人員經審定退休年資之退休所得替代率對照表」。"},{"bill":"202110049400000","text":"警察人員之退休，除依下列規定外，適用公務人員退休法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"原「公務人員退休法」業已於中華民國107年11月21日明令廢止；並為配合「公務人員退休資遣撫卹法」之訂定而修正文字，以符實況。"},{"bill":"202110051850000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防、海巡、移民及空中勤務總隊人員之每月退休所得，其替代率依本條例之規定辦理（如附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十為上限。\n五、本法公布施行前退休生效者，應按本法公布施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、「公務人員退休法」於107年11月21日已廢止，並新訂「公務人員退休資遣撫卹法」代替，自107年7月1日施行，爰修正第一項、第一項第一款及第一項第二款相關條文文字。\n二、警察、消防及海巡人員因公殉職死亡及傷殘人數，在各類公務人員中占比最高；又為因應區域軍事威脅、近年公共及工安意外增量，相關人員任務加重，成為維護民眾生活安全之重要力量。\n三、移民署為警政署入出境管理局整合僑務委員會、內政部戶政司、內政部警政署等業務，執行入出國（境）管理、移民事務及防制人口販運任務之人員，執行調查職務時亦視為司法警察；內政部空中勤務總隊亦為警政署空中警察隊、消防署空中消防隊籌備處、交通部民用航空局航空隊及行政院海岸巡防署空中偵察巡邏隊等四單位所合併整編成立，其五大主要任務為救災、救難、救護、運輸及觀測偵巡。移民署及空中勤務總隊其業務皆為警政署移出，顯見該單位成立之初任務具一定危險及艱辛，現行法規亦有《警察消防海巡移民空勤人員及協勤民力安全基金設置管理條例》以維護其就醫就養權利及激勵士氣，然相關人員編制卻仍屬於公務人員，國家應予以相應保障。\n四、增列第四款，已退休之警察、消防、海巡、移民及空中勤務總隊人員，退休所得替代率之規定及其上限，應比照參考「陸海空軍軍官士官服役條例」規定之規定辦理。\n五、增列第五款，已退休之警察、消防、海巡、移民及空中勤務總隊人員，退休待遇之計算標準，應比照現職同等級人員之待遇標準計算，並隨在職同等級人員本（年功）俸調整而調整。\n六、增列附表三退休警察人員經審定退休年資之退休所得替代率對照表。"},{"bill":"202110053710000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察人員及消防、海巡、移民機關支領危險職務加給人員之每月退休所得，其替代率依本條例之規定辦理（如附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十為上限。\n五、前款人員於本條例修正施行前退休生效者，應按本條例修正施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、查「公務人員退休法」於107年11月21日廢止，並新訂「公務人員退休資遣撫卹法」代替，自同年7月1日施行，爰配合修正第一項相關文字。\n二、警察、消防、海巡及移民機關人員之工作，具經常性二十四小時輪替服勤、危險及勞力等特性，因公死亡及傷殘人數，於各類公務員中占比最高。\n三、內政部移民署與警察機關同樣肩負確保國家安全、維護社會安定之任務，其編制內人員之勤業務與警察同質性高，亦同具司法警察身分，故此，警察、消防、海巡及移民機關等人員，併同納入危險職務加給之適用對象，如「消防、海巡、空中勤務、移民及航空測量機關專業人員危險職務加給表」。\n四、應對警察、消防、海巡及移民機關等人員給予相應保障，將其退休所得替代率比照國軍相關規定。\n五、明定於本條例修正施行前已退休之警察、消防、海巡及移民機關人員，應按本條例修正施行時之現職同等級人員待遇標準重新計算其每月退休所得，嗣後並隨在職同等級人員本（年功）俸之調整而調整其退休所得。\n六、依第一項第四款修正條文，增訂附表三如附件。"},{"bill":"202110054030000","text":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防、海巡及移民人員之每月退休所得，其替代率依本條例之規定辦理（如附表三），其服務年資滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之二，最高採計四十年，並以百分之九十為上限。\n五、本條例公布施行前退休生效者，應按本條例公布施行時現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。","note":"一、查「公務人員退休法」已於107年11月21日廢止，並新訂「公務人員退休資遣撫卹法」代替，自107年7月1日施行，爰配合修正第一項相關文字。\n二、警察、消防、海巡及移民機關人員肩負確保國家安全、維護社會安定之任務，其工作內涵具經常性二十四小時輪替服勤、危險及勞力等特性之勤業務，因公死亡及傷殘人數，在各類公務人員中占比最高，且因平日勤業務勞心勞力，平均壽命短於國人。是以，行政院訂頒之「消防、海巡、空中勤務、移民及航空測量機關專業人員危險職務加給表」，亦將消防、海巡及移民機關人員，併同納入危險職務加給之適用對象。\n三、增列第四款，為對警察、消防、海巡及移民人員之付出，給予相應之保障，實應將警察、消防、海巡及移民人員之退休所得替代率併案辦理，比照國軍相關規定，明定退休警察、消防、海巡及移民人員退休所得替代率之標準及其上限。\n四、增列第五款，明定於本條例修正施行前已退休之警察、消防、海巡及移民人員，應按本條例修正施行時現職同等級人員之待遇標準重新計算其每月退休所得，嗣後並隨在職同等級人員本（年功）俸之調整而調整其退休所得。\n五、增列附表三退休警察人員經審定退休年資之退休所得替代率對照表。"}],"changed":true,"final":"警察人員之退休，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、警正以下擔任具有危險及勞力等特殊性質職務者，其退休年齡，得依照公務人員退休資遣撫卹法之規定酌予降低。\n二、在執行勤務中遭受暴力或意外危害，致身心障礙，不堪勝任職務並依公務人員退休資遣撫卹法命令退休者，其退休金除依規定按因公傷病標準給與外，另加發五至十五個基數。基數內涵均依所任職務最高等階年功俸最高俸級計算。\n三、領有勳章、獎章者，得加發退休金。\n四、警察、消防、海岸巡防、移民及空中勤務總隊人員之每月退休所得，其替代率應依退休人員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十三點二五，其後每增加一年，替代率增給百分之一點七五，最高增至三十六年，為百分之八十；任職滿三十七年至第四十年者，維持百分之八十。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項第四款之規定，於本條例中華民國一百十四年一月七日修正之條文公布施行前退休生效者，亦適用之。該等人員應按現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n因第一項第四款及前項之修正，所生公務人員退休撫卹基金增加之支出，行政院應每年自公務預算辦理撥補。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有第一項第二款情形，現仍支領或兼領月退休金者，其月退休金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款及第三款加發退休金之對象、基數、金額及其他相關事項之標準，由行政院、考試院會同定之。\n第一項第二款及第二項人員依所任職務最高等階年功俸最高俸級計算之退休金高於銓敘審定合格等級計算之退休金者，其差額由主管機關編列預算支給。\n[附表三：退休警察人員經審定退休年資之退休所得替代率彙整表]","finalWhy":"一、有鑑於公務人員退休法已廢止，並另訂公務人員退休資遣撫卹法取代，爰修正第一項相關之文字。\n二、因警察、消防、海岸巡防、移民及空中勤務總隊人員任務性質繁重，長期處於高壓及危險之工作環境，有必要提高其退休所得之保障，爰新增第一項第四款及第二項規定，明定警察、消防、海岸巡防、移民及空中勤務總隊人員之每月退休所得，其替代率應依退休人員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十三點二五，其後每增加一年，替代率增給百分之一點七五，最高增至三十六年，為百分之八十；任職滿三十七年至第四十年者，維持百分之八十。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。另定明本條例中華民國一百十四年一月七日修正之條文公布施行前退休生效者，亦適用之。該等人員應按現職同等級人員之待遇標準重新計算每月退休所得；並隨在職同等級人員本（年功）俸之調整而調整。\n三、明定因第一項第四款及前項之修正，所生公務人員退休撫卹基金增加之支出，行政院應每年自公務預算辦理撥補，爰新增第三項。","review":{"note":"","text":"[條文(含附表三)，保留，送院會處理]"}},{"no":"第三十六條","current":"警察人員之撫卹，除依左列規定外，適用公務人員撫卹法之規定：\n一、在執行勤務中殉職者，其撫卹金基數內涵依其所任職務最高等階年功俸最高俸級計算，並比照戰地殉職人員加發撫卹金。\n二、領有勳章、獎章者，得加發撫卹金。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第一款情形，其遺族現仍支領年撫卹金者，其年撫卹金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款加發撫卹金標準，在不重領原則下，比照退休金加發標準發給。\n第一項第一款及第二項依所任職務最高等階年功俸最高俸級計算之撫卹金高於銓敘審定合格等級計算之撫卹金者，其差額由主管機關編列預算支給。","versions":[{"bill":"202110049480000","text":"警察人員之撫卹，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、在執行勤務中殉職者，其撫卹金基數內涵依其所任職務最高等階年功俸最高俸級計算，並比照戰地殉職人員加發撫卹金。\n二、領有勳章、獎章者，得加發撫卹金。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第一款情形，其遺族現仍支領年撫卹金者，其年撫卹金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款加發撫卹金標準，在不重領原則下，比照退休金加發標準發給。\n第一項第一款及第二項依所任職務最高等階年功俸最高俸級計算之撫卹金高於銓敘審定合格等級計算之撫卹金者，其差額由主管機關編列預算支給。","note":"一、為統一法律用語，爰修正第一項之文字。\n二、配合公務人員退休資遣撫卹法之修正施行，爰修正文字。"},{"bill":"202110049400000","text":"警察人員之撫卹，除依下列規定外，適用公務人員退休資遣撫卹法之規定：\n一、在執行勤務中殉職者，其撫卹金基數內涵依其所任職務最高等階年功俸最高俸級計算，並比照戰地殉職人員加發撫卹金。\n二、領有勳章、獎章者，得加發撫卹金。\n警察人員在本條例中華民國九十三年八月十九日修正之條文施行前，有前項第一款情形，其遺族現仍支領年撫卹金者，其年撫卹金之給與，自修正條文施行之日起準用本條例之規定。\n第一項第二款加發撫卹金標準，在不重領原則下，比照退休金加發標準發給。\n第一項第一款及第二項依所任職務最高等 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);

function finder(turns) {   // 在這場逐字稿裡找字

    prev.hidden = next.hidden = !hits.length;

  '重付表決': {t: '重付表決', sub: '對表決結果有異議，再表決一次', what: '出席委員對表決結果有異議時，經 15 人以上連署或附議，可以要求重新表決。', pts: ['以一次為限。']},
  '修正動議': {t: '修正動議', sub: '在院會對條文提出的修改案', what: '委員或黨團在二讀（或三讀）時，對討論中的條文提出另一個版本的文字，交院會表決。', pts: ['需要 10 人以上連署或附議。']},
  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
