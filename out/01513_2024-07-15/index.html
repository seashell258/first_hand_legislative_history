<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>所得稅法 2024 年修正歷程（扣繳制度）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"所得稅法","version":"01513:2024-07-15-修正","date":"2024-07-15","action":"修正","title":"所得稅法　2024 年 7 月修正（扣繳制度）","lede":"所得稅法的扣繳制度，是由給付所得的一方先扣下稅款繳給國庫，並申報、填發憑單。依原條文，機關、團體、學校給付薪資等所得時，扣繳義務人是「責應扣繳單位主管」，事業是「事業負責人」；這次改為由機關、團體、學校、事業本身擔任，並增列行政法人和信託行為的受託人。未依限填報或填發扣繳憑單、免扣繳憑單、股利憑單的罰鍰，原條文多是按扣繳稅額、給付金額、股利金額或可扣抵稅額的比例計算，這次改為定額上下限，例如第一百十四條改為一千五百元以上二萬元以下；第一百十二條、第一百十四條原本寫明的滯納金計算方式（每逾二日加徵百分之一）刪除，改寫「應加徵滯納金」。這次修正的條文何時施行，由行政院決定。行政院、委員鄭天財Sra Kacaw等 17 人、委員顏寬恒等 20 人各提一案，財政委員會在 2024 年 6 月 26 日審查，九條都照行政院提案通過，並決定院會討論前不須黨團協商。7 月 15 日院會逐條照審查會條文通過，沒有表決。","summary":"薪資、利息等所得的扣繳義務人，從機關團體的主管、事業負責人等個人改為機關、團體、學校、事業本身，並增列行政法人和信託受託人；未依限填報或填發扣繳、免扣繳、股利憑單的罰鍰，從按稅額或金額的比例計算改為定額上下限。","key":"01513_2024-07-15","props":[{"id":"201110043620000","who":"行政院","date":"2024-05-10","name":"「所得稅法部分條文修正草案」案。","url":"https://ppg.ly.gov.tw/ppg/bills/201110043620000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/13/LCEWA01_110113_00114.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"行政院函請審議「所得稅法部分條文修正草案」案。","arts":["第八十八條","第八十九條","第九十二條","第九十四條之一","第一百十一條","第一百十二條","第一百十四條","第一百十四條之三","第一百二十六條"]},{"id":"202110047100000","who":"委員鄭天財Sra Kacaw等17人","date":"2024-05-17","name":"「所得稅法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110047100000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/14/LCEWA01_110114_00052.pdf","proposers":["鄭天財Sra Kacaw"],"ncosign":16,"people":[["鄭天財Sra Kacaw","國民黨","提案"],["張啓楷","民眾黨","連署"],["徐欣瑩","國民黨","連署"],["呂玉玲","國民黨","連署"],["黃建賓","國民黨","連署"],["張智倫","國民黨","連署"],["洪孟楷","國民黨","連署"],["盧縣一","國民黨","連署"],["葉元之","國民黨","連署"],["牛煦庭","國民黨","連署"],["翁曉玲","國民黨","連署"],["丁學忠","國民黨","連署"],["許宇甄","國民黨","連署"],["賴士葆","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["王育敏","國民黨","連署"],["吳宗憲","國民黨","連署"]],"party":[["國民黨",16],["民眾黨",1]],"reason":"本院委員鄭天財Sra Kacaw等17人，有鑑於所得稅法自44年修正公布全文以來，迄今已逾六十年，其間為健全稅制，促進租稅公平，歷經多次修正，最近一次修正公布日期為113年1月3日。基於所得稅稽徵作業需要，本法採行扣繳制度，責成營利事業負責人與機關、團體責應扣繳單位主管等自然人為扣繳義務人，於給付屬扣繳範圍所得時，依規定扣繳率扣取稅款，並於規定期限內向國庫繳交及填報憑單。扣繳義務人如有未依規定扣繳及填報憑單情形，本法相關條文定明處罰規定。為使扣繳義務人義務及責任更符行政法上義務之事責一致原則，並配合扣繳義務人及稽徵機關實務作業需要，精進本法扣繳相關規定，另增列機構、行政法人為扣繳義務人，以資明確，爰擬具「所得稅法部分條文修正草案」。是否有當？敬請公決。","arts":["第八十八條","第八十九條","第九十二條","第九十四條之一","第一百十一條","第一百十二條","第一百十四條","第一百十四條之三","第一百二十六條"]},{"id":"202110052020000","who":"委員顏寬恒等20人","date":"2024-05-31","name":"「所得稅法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110052020000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/16/LCEWA01_110116_00035.pdf","proposers":["顏寬恒","許宇甄"],"ncosign":18,"people":[["顏寬恒","國民黨","提案"],["許宇甄","國民黨","提案"],["陳雪生","國民黨","連署"],["李彥秀","國民黨","連署"],["張嘉郡","國民黨","連署"],["林倩綺","國民黨","連署"],["林思銘","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["黃仁","國民黨","連署"],["葉元之","國民黨","連署"],["葛如鈞","國民黨","連署"],["洪孟楷","國民黨","連署"],["徐巧芯","國民黨","連署"],["謝龍介","國民黨","連署"],["盧縣一","國民黨","連署"],["王鴻薇","國民黨","連署"],["丁學忠","國民黨","連署"],["鄭正鈐","國民黨","連署"],["陳超明","無黨籍","連署"],["游顥","國民黨","連署"]],"party":[["國民黨",19],["無黨籍",1]],"reason":"本院委員顏寬恒、許宇甄等20人，有鑑於稅制健全、完善租稅公平，所得稅法目前採行扣繳制度，包含營利事業負責人、機關、團體及自然人為扣繳義務人，增訂行政法人、信託行為之受託人因管理、處分信託財產之給付屬扣繳範圍所得時，應依規定扣繳稅款，爰擬具「所得稅法部分條文修正草案」。是否有當？敬請公決。","arts":["第八十八條","第八十九條","第九十二條","第九十四條之一","第一百十一條","第一百十二條"]}],"arts":[{"no":"第八十八條","current":"納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款，並依第九十二條規定繳納之：\n一、公司分配予非中華民國境內居住之個人及總機構在中華民國境外之營利事業之股利；合作社、其他法人、合夥組織或獨資組織分配予非中華民國境內居住之社員、出資者、合夥人或獨資資本主之盈餘。\n二、機關、團體、學校、事業、破產財團或執行業務者所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。\n三、第二十五條規定之營利事業，依第九十八條之一之規定，應由營業代理人或給付人扣繳所得稅款之營利事業所得。\n四、第二十六條規定在中華民國境內無分支機構之國外影片事業，其在中華民國境內之營利事業所得額。\n獨資、合夥組織之營利事業依第七十一條第二項或第七十五條第四項規定辦理結算申報或決算、清算申報，有應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之盈餘者，應於該年度結算申報或決算、清算申報法定截止日前，由扣繳義務人依規定之扣繳率扣取稅款，並依第九十二條規定繳納；其後實際分配時，不適用前項第一款之規定。\n前項獨資、合夥組織之營利事業，依法辦理結算、決算或清算申報，或於申報後辦理更正，經稽徵機關核定增加營利事業所得額；或未依法自行辦理申報，經稽徵機關核定營利事業所得額，致增加獨資資本主或合夥組織合夥人之盈餘者，扣繳義務人應於核定通知書送達之次日起算三十日內，就應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之新增盈餘，依規定之扣繳率扣取稅款，並依第九十二條規定繳納。\n前三項各類所得之扣繳率及扣繳辦法，由財政部擬訂，報請行政院核定。","versions":[{"bill":"201110043620000","text":"納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款，並依第九十二條規定繳納之：\n一、公司分配予非中華民國境內居住之個人及總機構在中華民國境外之營利事業之股利；合作社、其他法人、合夥組織或獨資組織分配予非中華民國境內居住之社員、出資者、合夥人或獨資資本主之盈餘。\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。\n三、第二十五條規定之營利事業，依第九十八條之一之規定，應由營業代理人或給付人扣繳所得稅款之營利事業所得。\n四、第二十六條規定在中華民國境內無分支機構之國外影片事業，其在中華民國境內之營利事業所得額。\n獨資、合夥組織之營利事業依第七十一條第二項或第七十五條第四項規定辦理結算申報或決算、清算申報，有應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之盈餘者，應於該年度結算申報或決算、清算申報法定截止日前，由扣繳義務人依規定之扣繳率扣取稅款，並依第九十二條規定繳納；其後實際分配時，不適用前項第一款規定。\n前項獨資、合夥組織之營利事業，依法辦理結算、決算或清算申報，或於申報後辦理更正，經稽徵機關核定增加營利事業所得額；或未依法自行辦理申報，經稽徵機關核定營利事業所得額，致增加獨資資本主或合夥組織合夥人之盈餘者，扣繳義務人應於核定通知書送達之次日起算三十日內，就應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之新增盈餘，依規定之扣繳率扣取稅款，並依第九十二條規定繳納。\n前三項各類所得之扣繳率及扣繳辦法，由財政部擬訂，報請行政院核定。","note":"一、第一項第二款修正如下：\n(一)增訂行政法人（如國家表演藝術中心等）給付該款規定之所得，應由扣繳義務人依規定扣繳稅款。\n(二)衡酌破產財團係破產人之財產總稱，其給付行為由破產管理人為之，爰予定明。另信託行為之受託人因管理或處分信託財產而發生費用致有給付各類所得情形，應責由該受託人負扣繳責任，俾及時扣取稅款，爰予增列。至信託財產發生之收入，受託人依現行第三條之四規定計算或分配受益人之所得，依現行第八十九條之一規定辦理扣繳。\n二、第二項酌作文字修正。\n三、第三項及第四項未修正。"},{"bill":"202110047100000","text":"納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款，並依第九十二條規定繳納之：\n一、公司分配予非中華民國境內居住之個人及總機構在中華民國境外之營利事業之股利；合作社、其他法人、合夥組織或獨資組織分配予非中華民國境內居住之社員、出資者、合夥人或獨資資本主之盈餘。\n二、機關（構）、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。\n三、第二十五條規定之營利事業，依第九十八條之一之規定，應由營業代理人或給付人扣繳所得稅款之營利事業所得。\n四、第二十六條規定在中華民國境內無分支機構之國外影片事業，其在中華民國境內之營利事業所得額。\n獨資、合夥組織之營利事業依第七十一條第二項或第七十五條第四項規定辦理結算申報或決算、清算申報，有應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之盈餘者，應於該年度結算申報或決算、清算申報法定截止日前，由扣繳義務人依規定之扣繳率扣取稅款，並依第九十二條規定繳納；其後實際分配時，不適用前項第一款規定。\n前項獨資、合夥組織之營利事業，依法辦理結算、決算或清算申報，或於申報後辦理更正，經稽徵機關核定增加營利事業所得額；或未依法自行辦理申報，經稽徵機關核定營利事業所得額，致增加獨資資本主或合夥組織合夥人之盈餘者，扣繳義務人應於核定通知書送達之次日起算三十日內，就應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之新增盈餘，依規定之扣繳率扣取稅款，並依第九十二條規定繳納。\n前三項各類所得之扣繳率及扣繳辦法，由財政部擬訂，報請行政院核定。","note":"一、第一項第二款修正如下：\n(一)依中央行政機關組織基準法第三條第三款規定，「機構」為機關依組織法規將其部分權限及職掌劃出，以達成其設立目的之組織。（如客家文化發展中心、原住民族文化發展中心、財政資訊中心等），爰將機關修正為機關（構）。（以下各條修正理由均如上）\n(二)增訂行政法人（如國家表演藝術中心等）給付該款規定之所得，應由扣繳義務人依規定扣繳稅款。\n(三)衡酌破產財團係破產人之財產總稱，其給付行為由破產管理人為之，爰予定明。另信託行為之受託人因管理或處分信託財產而發生費用致有給付各類所得情形，應責由該受託人負扣繳責任，俾及時扣取稅款，爰予增列。至信託財產發生之收入，受託人依現行第三條之四規定計算或分配受益人之所得，依現行第八十九條之一規定辦理扣繳。\n二、第二項酌作文字修正。\n三、第三項及第四項未修正。"},{"bill":"202110052020000","text":"納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款，並依第九十二條規定繳納之：\n一、公司分配予非中華民國境內居住之個人及總機構在中華民國境外之營利事業之股利；合作社、其他法人、合夥組織或獨資組織分配予非中華民國境內居住之社員、出資者、合夥人或獨資資本主之盈餘。\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。\n三、第二十五條規定之營利事業，依第九十八條之一之規定，應由營業代理人或給付人扣繳所得稅款之營利事業所得。\n四、第二十六條規定在中華民國境內無分支機構之國外影片事業，其在中華民國境內之營利事業所得額。\n獨資、合夥組織之營利事業依第七十一條第二項或第七十五條第四項規定辦理結算申報或決算、清算申報，有應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之盈餘者，應於該年度結算申報或決算、清算申報法定截止日前，由扣繳義務人依規定之扣繳率扣取稅款，並依第九十二條規定繳納；其後實際分配時，不適用前項第一款之規定。\n前項獨資、合夥組織之營利事業，依法辦理結算、決算或清算申報，或於申報後辦理更正，經稽徵機關核定增加營利事業所得額；或未依法自行辦理申報，經稽徵機關核定營利事業所得額，致增加獨資資本主或合夥組織合夥人之盈餘者，扣繳義務人應於核定通知書送達之次日起算三十日內，就應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之新增盈餘，依規定之扣繳率扣取稅款，並依第九十二條規定繳納。\n前三項各類所得之扣繳率及扣繳辦法，由財政部擬訂，報請行政院核定。","note":"一、將行政法人納入本條文內，行政法人為執行特定公共事務依行政法人法而設立之公法人，將不適合由行政機關及民間辦理的公共事務，改由行政法人來處理；所謂特定公共事務則必須包括具有專業需求或是需強化成本效益及經營效能、不適合由政府機關推動，也不適合交由民間辦理、公權力行使程度較低等條件；我國目前設置之行政法人計有11個，業務範疇包括文化、科技、運動、住宅及都更、資安及核安領域，隨經濟活動範圍之擴大，使其在所得稅扣繳方面的義務逐漸顯現。\n二、根據破產法第八十二條規定，破產宣告時屬於破產人的一切財產、將來行使的財產請求權以及破產宣告後，破產終結前所取得的所有財產皆稱作破產財團，其管理人執行業務者若涉及支付所得者，亦應代扣代繳所得稅。\n三、信託行為之受託人指在信託法律框架下，接受委託人之財產並管理和處分財產之人，隨信託業務的發展逐漸普及，受託人所涉及的業務範圍也愈加複雜。"}],"changed":true,"final":"納稅義務人有下列各類所得者，應由扣繳義務人於給付時，依規定之扣繳率或扣繳辦法，扣取稅款，並依第九十二條規定繳納之：\n一、公司分配予非中華民國境內居住之個人及總機構在中華民國境外之營利事業之股利；合作社、其他法人、合夥組織或獨資組織分配予非中華民國境內居住之社員、出資者、合夥人或獨資資本主之盈餘。\n二、機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人因管理、處分信託財產所給付之薪資、利息、租金、佣金、權利金、競技、競賽或機會中獎之獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得、執行業務者之報酬，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得。\n三、第二十五條規定之營利事業，依第九十八條之一之規定，應由營業代理人或給付人扣繳所得稅款之營利事業所得。\n四、 取得所得者。\n三、依前條第一項第三款規定之營利事業所得稅扣繳義務人，為營業代理人或給付人；納稅義務人為總機構在中華民國境外之營利事業。\n四、國外影片事業所得稅款扣繳義務人，為營業代理人或給付人；納稅義務人為國外影片事業。\n扣繳義務人未履行扣繳責任，而有行蹤不明或其他情事，致無從追究者，稽徵機關得逕向納稅義務人徵收之。\n機關、團體、學校、事業、破產財團或執行業務者每年所給付依前條規定應扣繳稅款之所得，及第十四條第一項第十類之其他所得，因未達起扣點，或因不屬本法規定之扣繳範圍，而未經扣繳稅款者，應於每年一月底前，將受領人姓名、住址、國民身分證統一編號及全年給付金額等，依規定格式，列單申報主管稽徵機關；並應於二月十日前，將免扣繳憑單填發納稅義務人。每年一月遇連續三日以上國定假日者，免扣繳憑單申報期間延長至二月五日止，免扣繳憑單填發期間延長至二月十五日止。","versions":[{"bill":"201110043620000","text":"前條各類所得稅款，其扣繳義務人及納稅義務人如下：\n一、公司分配予非中華民國境內居住之個人及總機構在中華民國境外之營利事業之股利；合作社分配予非中華民國境內居住之社員之盈餘；其他法人分配予非中華民國境內居住之出資者之盈餘；獨資、合夥組織之營利事業分配或應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之盈餘，其扣繳義務人為公司、合作社、其他法人、獨資組織或合夥組織；納稅義務人為非中華民國境內居住之個人股東、總機構在中華民國境外之營利事業股東、非中華民國境內居住之社員、出資者、合夥組織合夥人或獨資資本主。\n二、薪資、利息、租金、佣金、權利金、執行業務報酬、競技、競賽或機會中獎獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得，其扣繳義務人為機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人；納稅義務人為取得所得者。\n三、依前條第一項第三款規定之營利事業所得稅扣繳義務人，為營業代理人或給付人；納稅義務人為總機構在中華民國境外之營利事業。\n四、國外影片事業所得稅款扣繳義務人，為營業代理人或給付人；納稅義務人為國外影片事業。\n扣繳義務人未履行扣繳責任，而有他遷不明、行蹤不明或其他情事，致無從追究者，稽徵機關得逕向納稅義務人徵收之。\n機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人每年所給付依前條規定應扣繳稅款之所得，及第十四條第一項第十類之其他所得，因未達起扣點，或因不屬本法規定之扣繳範圍，而未經扣繳稅款者，應於每年一月底前，將受領人姓名、住址、國民身分證統一編號及全年給付金額等，依規定格式，列單申報主管稽徵機關，並應於二月十日前，將免扣繳憑單填發納稅義務人；每年一月遇連續三日以上國定假日者，免扣繳憑單申報期間延長至二月五日止，免扣繳憑單填發期間延長至二月十五日止。但機關、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更，或破產管理人處理之破產事務經法院裁定終結或終止時，應隨時填發免扣繳憑單，並於十日內列單申報主管稽徵機關。","note":"一、第一項第一款修正如下：\n(一)按公司、合作社及其他法人分配予股東、社員或出資者之股利或盈餘，所得人如為非中華民國境內居住之個人及總機構在中華民國境外之營利事業，應由扣繳義務人依規定扣繳稅款，考量公司、合作社及其他法人分配之股利或盈餘，係由公司、合作社及其他法人本身給付，為使權責相符，爰將扣繳義務人修正為公司、合作社及其他法人本身。\n(二)獨資或合夥組織因屬所得稅法規定應申報所得稅之主體，故該等組織之盈餘分配，亦修正由該組織本身擔任扣繳義務人。\n二、第一項第二款修正如下：\n(一)為使權責相符，機關、團體、學校、事業給付之所得，修正為由機關、團體、學校、事業本身擔任扣繳義務人。\n(二)增訂行政法人及信託行為之受託人給付之所得，由渠等擔任扣繳義務人，理由同修正條文第八十八條說明一。\n三、配合第一項第一款及第二款之修正，於第二項增訂扣繳義務人未履行扣繳責任，而有他遷不明，致無從追究者，稽徵機關得逕向納稅義務人徵收。\n四、第三項本文配合第一項第二款修正扣繳義務人範圍，酌作修正。另為使稽徵機關能及時掌握課稅資料，增訂但書定明機關、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更，或破產管理人處理之破產事務經法院裁定終結或終止時，應隨時填發免扣繳憑單，並於十日內列單申報主管稽徵機關。"},{"bill":"202110047100000","text":"前條各類所得稅款，其扣繳義務人及納稅義務人如下：\n一、 身。\n(二)獨資或合夥組織因屬所得稅法規定應申報所得稅之主體，故該等組織之盈餘分配，亦修正由該組織本身擔任扣繳義務人。\n二、第一項第二款修正如下：\n(一)為使權責相符，機關、團體、學校、事業給付之所得，修正為由機關、團體、學校、事業本身擔任扣繳義務人。\n(二)增訂行政法人及信託行為之受託人給付之所得，由渠等擔任扣繳義務人，理由同修正條文第八十八條說明一。\n三、配合第一項第一款及第二款之修正，於第二項增訂扣繳義務人未履行扣繳責任，而有他遷不明，致無從追究者，稽徵機關得逕向納稅義務人徵收。\n四、第三項本文配合第一項第二款修正扣繳義務人範圍，酌作修正。另為使稽徵機關能及時掌握課稅資料，增訂但書定明機關、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更，或破產管理人處理之破產事務經法院裁定終結或終止時，應隨時填發免扣繳憑單，並於十日內列單申報主管稽徵機關。","review":{"note":"照行政院提案通過","text":"前條各類所得稅款，其扣繳義務人及納稅義務人如下：\n一、公司分配予非中華民國境內居住之個人及總機構在中華民國境外之營利事業之股利；合作社分配予非中華民國境內居住之社員之盈餘；其他法人分配予非中華民國境內居住之出資者之盈餘；獨資、合夥組織之營利事業分配或應分配予非中華民國境內居住之獨資資本主或合夥組織合夥人之盈餘，其扣繳義務人為公司、合作社、其他法人、獨資組織或合夥組織；納稅義務人為非中華民國境內居住之個人股東、總機構在中華民國境外之營利事業股東、非中華民國境內居住之社員、出資者、合夥組織合夥人或獨資資本主。\n二、薪資、利息、租金、佣金、權利金、執行業務報酬、競技、競賽或機會中獎獎金或給與、退休金、資遣費、退職金、離職金、終身俸、非屬保險給付之養老金、告發或檢舉獎金、結構型商品交易之所得，及給付在中華民國境內無固定營業場所或營業代理人之國外營利事業之所得，其扣繳義務人為機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人；納稅義務人為取得所得者。\n三、依前條第一項第三款規定之營利事業所得稅扣繳義務人，為營業代理人或給付人；納稅義務人為總機構在中華民國境外之營利事業。\n四、國外影片事業所得稅款扣繳義務人，為營業代理人或給付人；納稅義務人為國外影片事業。\n扣繳義務人未履行扣繳責任，而有他遷不明、行蹤不明或其他情事，致無從追究者，稽徵機關得逕向納稅義務人徵收之。\n機關、行政法人、團體、學校、事業、破產財團之破產管理人、執行業務者或信託行為之受託人每年所給付依前條規定應扣繳稅款之所得，及第十四條第一項第十類之其他所得，因未達起扣點，或因不屬本法規定之扣繳範圍，而未經扣繳稅款者，應於每年一月底前，將受領人姓名、住址、國民身分證統一編號及全年給付金額等，依規定格式，列單申報主管稽徵機關，並應於二月十日前，將免扣繳憑單填發納稅義務人；每年一月遇連續三日以上國定假日者，免扣繳憑單申報期間延長至二月五日止，免扣繳憑單填發期間延長至二月十五日止。但機關、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更，或破產管理人處理之破產事務經法院裁定終結或終止時，應隨時填發免扣繳憑單，並於十日內列單申報主管稽徵機關。"}},{"no":"第九十二條","current":"第八十八條各類所得稅款之扣繳義務人，應於每月十日前將上一月內所扣稅款向國庫繳清，並於每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具扣繳憑單，彙報該管稽徵機關查核；並應於二月十日前將扣繳憑單填發納稅義務人。每年一月遇連續三日以上國定假日者，扣繳憑單彙報期間延長至二月五日止，扣繳憑單填發期間延長至二月十五日止。但營利事業有解散、廢止、合併或轉讓，或機關、團體裁撤、變更時，扣繳義務人應隨時就已扣繳稅款數額，填發扣繳憑單，並於十日內向該管稽徵機關辦理申報。\n非中華民國境內居住之個人，或在中華民國境內無固定營業場所之營利事業，有第八十八條規定各類所得時，扣繳義務人應於代扣稅款之日起十日內，將所扣稅款向國庫繳清，並開具扣繳憑單，向該管稽徵機關申報核驗後，發給納稅義務人。\n總機構在中華民國境外而在中華民國境內有固定營業場所之營利事業，其獲配之股利或盈餘，準用前項規定。","versions":[{"bill":"201110043620000","text":"第八十八條各類所得稅款之扣繳義務人，應於每月十日前將上一月內所扣稅款向國庫繳清，並於每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具扣繳憑單，彙報該管稽徵機關查核，並應於二月十日前將扣繳憑單填發納稅義務人；每年一月遇連續三日以上國定假日者，扣繳憑單彙報期間延長至二月五日止，扣繳憑單填發期間延長至二月十五日止。但機關、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更，或破產管理人處理之破產事務經法院裁定終結或終止時，扣繳義務人應隨時就已扣繳稅款數額，填發扣繳憑單，並於十日內向該管稽徵機關辦理申報。\n非中華民國境內居住之個人，或在中華民國境內無固定營業場所之營利事業，有第八十八條規定各類所得時，扣繳義務人應於代扣稅款之日起算十日內，將所扣稅款向國庫繳清，並開具扣繳憑單，向該管稽徵機關申報核驗後，發給納稅義務人。代扣稅款之日起算十日內遇連續三日以上國定假日者，所扣稅款繳納、扣繳憑單申報核驗及發給期間延長五日。\n總機構在中華民國境外而在中華民國境內有固定營業場所之營利事業，其獲配之股利或盈餘，準用前項規定。","note":"一、配合修正條文第八十九條第一項，修正第一項但書機關、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更，或破產管理人處理之破產事務經法院裁定終結或終止時，扣繳義務人應填發及申報扣繳憑單（含給付非居住者股利）之規定。\n二、配合扣繳義務人實務作業需要，參照第一項扣繳憑單彙報及填發期間遇連續三日以上國定假日者延長五日之規定，第二項增訂後段規定，另酌作文字修正。\n三、第三項未修正。"},{"bill":"202110047100000","text":"第八十八條各類所得稅款之扣繳義務人，應於每月十日前將上一月內所扣稅款向國庫繳清，並於每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具扣繳憑單，彙報該管稽徵機關查核，並應於二月十日前將扣繳憑單填發納稅義務人；每年一月遇連續三日以上國定假日者，扣繳憑單彙報期間延長至二月五日止，扣繳憑單填發期間延長至二月十五日止。但機關（構）、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更，或破產管理人處理之破產事務經法院裁定終結或終止時，扣繳義務人應隨時就已扣繳稅款數額，填發扣繳憑單，並於十日內向該管稽徵機關辦理申報。\n非中華民國境內居住之個人，或在中華民國境內無固定營業場所之營利事業，有第八十八條規定各類所得時，扣繳義務人應於代扣稅款之日起算十日內，將所扣稅款向國庫繳清，並開具扣繳憑單，向該管稽徵機關申報核驗後，發給納稅義務人。代扣稅款之日起算十日內遇連續三日以上國定假日者，所扣稅款繳納、扣繳憑單申報核驗及發給期間延長五日。\n總機構在中華民國境外而在中華民國境內有固定營業場所之營利事業，其獲配之股利或盈餘，準用前項規定。","note":"一、配合修正條文第八十九條第一項，修正第一項但書機關、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更，或破產管理人處理之破產事務經法院裁定終結或終止時，扣繳義務人應填發及申報扣繳憑單（含給付非居住者股利）之規定。\n二、配合扣繳義務人實務作業需要，參照第一項扣繳憑單彙報及填發期間遇連續三日以上國定假日者延長五日之規定，第二項增訂後段規定，另酌作文字修正。\n三、第三項未修正。"},{"bill":"202110052020000","text":"第八十八條各類所得稅款之扣繳義務人，應於每月十日前將上一月內所扣稅款向國庫繳清，並於每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具扣繳憑單，彙報該管稽徵機關查核，並應於二月十日前將扣繳憑單填發納稅義務人；每年一月遇連續三日以上國定假日者，扣繳憑單彙報期間延長至二月五日止，扣繳憑單填發期間延長至二月十五日止。但機關、行政法人、團體、學校、事業有解散、廢止、合併、轉讓、裁撤、變更或破產管理人處理之破產事務經法院裁定終結或終止時，扣繳義務人應隨時就已扣繳稅款數額，填發扣繳憑單，並於十日內向該管稽徵機關辦理申報。\n非中華民國境內居住之個人，或在中華民國境內無固定營業場所之營利事業，有第八十八條規定各類所得時，扣繳義務人應於代扣稅款之日起算十日內，將所扣稅款向國庫繳清，並開具扣繳憑單，向該管稽徵機關申報核驗後，發給納稅義務人。代扣稅款之日起算十日內遇連續三日以上國定假日者，所扣稅款繳納、扣繳憑單申報核驗及發給期間延長五日。\n總機構在中華民國境外而在中華民國境內有固定營業場所之營利事業，其獲配之股利或盈餘，準用前項規定。","note":"一、本條部分文字調整，並配合修正將第八十九條第三項但書規定有異動者，新增入法。\n二、配合實務作業需要，若代扣稅款遇連續國定假日時，增訂期間得延長之規定。"}],"changed":true,"final":"第八十八條各類所得稅款之扣繳義務人，應於每月十日前將上一月內所扣稅款向國庫繳清，並於每年一月底前將上一年內扣繳各納稅義務人之稅款數額，開具扣繳憑單，彙報該管稽徵機關查核，並應於二月十日前將扣繳憑單填發納稅義務人；每年一月遇連續三日以上國定假日者，扣繳憑單彙報期間延長至二月五日止，扣繳憑單填發期間延長至二月十五日止。但機關 報或填發者，應按所給付之金額，處該團體或學校之責應扣繳單位主管、事業之負責人、破產財團之破產管理人或執行業務者百分之五之罰鍰。但最高不得超過九萬元，最低不得少於三千元。","versions":[{"bill":"201110043620000","text":"政府機關、行政法人或公立學校違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，應通知其主管機關或監督機關督促其依法辦理。\n前項以外應申報及填發免扣繳憑單者違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，處一千五百元以上二萬元以下罰鍰，並通知限期補報或填發；屆期未補報或填發者，處三千元以上九萬元以下罰鍰。","note":"一、現行條文前段規定移列第一項，並修正如下：\n(一)配合修正條文第八十九條第三項增列行政法人，並考量行政法人依行政法人法第二條第一項規定，為國家及地方自治團體以外，由中央目的事業主管機關為執行特定公共事務，依法律設立之公法人，所執行之公共任務具低度之公權力，仍屬廣義政府組織之一環，其如違反申報及填發免扣繳憑單規定者，應比照政府機關及公立學校為相同處理，爰增訂行政法人違反申報及填發免扣繳憑單規定，由稽徵機關通知其監督機關督促其依法辦理。\n(二)公營事業之租稅待遇與私營事業並無不同，其違反同條項規定之處罰，應與私營事業相同，依第二項規定裁處罰鍰，爰將公營事業納入第二項規範。\n二、現行條文後段規定移為第二項，定明第一項以外應申報及填發免扣繳憑單者違反修正條文第八十九條第三項規定，應處罰鍰。復考量本項為行為罰，其違章情節之輕重，與給付金額之大小無直接必然關聯，又參酌司法院釋字第六四一號解釋意旨，為賦予稽徵機關衡酌具體個案違章情節輕重或可受責難程度，給予不同程度處罰之裁量權，並參考修正條文第一百十四條第二款限期補報或填發之罰度，酌定本項前段未依規定填報憑單者罰鍰之上限、下限金額；另現行後段屆期不補報或填發者，應按給付金額之固定比率計算罰鍰之規定，修正為按原罰鍰上限、下限金額處罰。另配合修正條文第八十九條第一項將扣繳義務人修正為團體、學校、事業本身，爰刪除處罰責應扣繳單位主管、負責人等文字。"},{"bill":"202110047100000","text":"政府機關（構）、行政法人或公立學校違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，應通知其主管機關或監督機關督促其依法辦理。\n前項以外應申報及填發免扣繳憑單者違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，處一千五百元以上二萬元以下罰鍰，並通知限期補報或填發；屆期未補報或填發者，處三千元以上九萬元以下罰鍰。","note":"一、現行條文前段規定移列第一項，並修正如下：\n(一)配合修正條文第八十九條第三項增列行政法人，並考量行政法人依行政法人法第二條第一項規定，為國家及地方自治團體以外，由中央目的事業主管機關為執行特定公共事務，依法律設立之公法人，所執行之公共任務具低度之公權力，仍屬廣義政府組織之一環，其如違反申報及填發免扣繳憑單規定者，應比照政府機關及公立學校為相同處理，爰增訂行政法人違反申報及填發免扣繳憑單規定，由稽徵機關通知其監督機關督促其依法辦理。\n(二)公營事業之租稅待遇與私營事業並無不同，其違反同條項規定之處罰，應與私營事業相同，依第二項規定裁處罰鍰，爰將公營事業納入第二項規範。\n二、現行條文後段規定移為第二項，定明第一項以外應申報及填發免扣繳憑單者違反修正條文第八十九條第三項規定，應處罰鍰。復考量本項為行為罰，其違章情節之輕重，與給付金額之大小無直接必然關聯，又參酌司法院釋字第六四一號解釋意旨，為賦予稽徵機關衡酌具體個案違章情節輕重或可受責難程度，給予不同程度處罰之裁量權，並參考修正條文第一百十四條第二款限期補報或填發之罰度，酌定本項前段未依規定填報憑單者罰鍰之上限、下限金額；另現行後段屆期不補報或填發者，應按給付金額之固定比率計算罰鍰之規定，修正為按原罰鍰上限、下限金額處罰。另配合修正條文第八十九條第一項將扣繳義務人修正為團體、學校、事業本身，爰刪除處罰責應扣繳單位主管、負責人等文字。"},{"bill":"202110052020000","text":"政府機關、行政法人或公立學校違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，應通知其主管機關或監督機關督促其依法辦理。\n前項以外應申報及填發免扣繳憑單者違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，處一千五百元以上二萬元以下罰鍰，並通知限期補報或填發；屆期未補報或填發者，處三千元以上九萬元以下罰鍰。","note":"一、新增行政法人違反規定之處理方式。\n二、第二項規定，明定除第一項以外應申報及填發免扣繳憑單者若違反第八十九條第三項規定者，應處罰鍰。"}],"changed":true,"final":"政府機關、行政法人或公立學校違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，應通知其主管機關或監督機關督促其依法辦理。\n前項以外應申報及填發免扣繳憑單者違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，處一千五百元以上二萬元以下罰鍰，並通知限期補報或填發；屆期未補報或填發者，處三千元以上九萬元以下罰鍰。","finalWhy":"一、原條文前段規定移列第一項，並修正如下：\n(一)配合修正條文第八十九條第三項增列行政法人，並考量行政法人依行政法人法第二條第一項規定，為國家及地方自治團體以外，由中央目的事業主管機關為執行特定公共事務，依法律設立之公法人，所執行之公共任務具低度之公權力，仍屬廣義政府組織之一環，其如違反申報及填發免扣繳憑單規定者，應比照政府機關及公立學校為相同處理，爰增訂行政法人違反申報及填發免扣繳憑單規定，由稽徵機關通知其監督機關督促其依法辦理。\n(二)公營事業之租稅待遇與私營事業並無不同，其違反同條項規定之處罰，應與私營事業相同，依第二項規定裁處罰鍰，爰將公營事業納入第二項規範。\n二、原條文後段規定移為第二項，定明第一項以外應申報及填發免扣繳憑單者違反修正條文第八十九條第三項規定，應處罰鍰。復考量本項為行為罰，其違章情節之輕重，與給付金額之大小無直接必然關聯，又參酌司法院釋字第六四一號解釋意旨，為賦予稽徵機關衡酌具體個案違章情節輕重或可受責難程度，給予不同程度處罰之裁量權，並參考修正條文第一百十四條第二款限期補報或填發之罰度，酌定本項前段未依規定填報憑單者罰鍰之上限、下限金額；另原後段屆期不補報或填發者，應按給付金額之固定比率計算罰鍰之規定，修正為按原罰鍰上限、下限金額處罰。另配合修正條文第八十九條第一項將扣繳義務人修正為團體、學校、事業本身，爰刪除處罰責應扣繳單位主管、負責人等文字。","review":{"note":"照行政院提案通過","text":"政府機關、行政法人或公立學校違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，應通知其主管機關或監督機關督促其依法辦理。\n前項以外應申報及填發免扣繳憑單者違反第八十九條第三項規定，未依限或未據實申報或未依限填發免扣繳憑單者，處一千五百元以上二萬元以下罰鍰，並通知限期補報或填發；屆期未補報或填發者，處三千元以上九萬元以下罰鍰。"}},{"no":"第一百十二條","current":"納稅義務人逾限繳納稅款者，每逾二日按滯納之金額加徵百分之一滯納金；逾三十日仍未繳納者，除由稽徵機關移送強制執行外，其為營利事業者，並得停止其營業至納稅義務人繳納之日止。但因不可抗力或不可歸責於納稅義務人之事由，致不能於法定期間內繳清稅捐，得於其原因消滅後十日內，提出具體證明，向稽徵機關申請延期或分期繳納經核准者，免予加徵滯納金。\n前項應納稅款，應自滯納期限屆滿之次日起，至納稅義務人繳納之日止，依第一百二十三條規定之存款利率，按日加計利息，一併徵收。\n本法所規定之停止營業處分，由稽徵機關執行，並由警察機關協助之。","versions":[{"bill":"201110043620000","text":"納稅義務人逾限繳納稅款者，應加徵滯納金；逾三十日仍未繳納者，其為營利事業者，稽徵機關得停止其營業至納稅義務人繳納之日止。\n前項應納稅款，應自滯納期限屆滿之次日起，至納稅義務人繳納之日止，依第一百二十三條規定之存款利率，按日加計利息，一併徵收。\n本法所規定之停止營業處分，由稽徵機關執行，並由警察機關協助之。","note":"一、鑑於現行有關滯納金加徵標準、繳納期間屆滿三十日後仍未繳清稅款者移送強制執行及申請延期或分期繳納稅捐經核准者免加徵滯納金之規定，稅捐稽徵法第二十條已統一規範，爰刪除第一項相關規定。\n二、第二項及第三項未修正。"},{"bill":"202110047100000","text":"納稅義務人逾限繳納稅款者，應加徵滯納金；逾三十日仍未繳納者，其為營利事業者，稽徵機關得停止其營業至納稅義務人繳納之日止。\n前項應納稅款，應自滯納期限屆滿之次日起，至納稅義務人繳納之日止，依第一百二十三條規定之存款利率，按日加計利息，一併徵收。\n本法所規定之停止營業處分，由稽徵機關執行，並由警察機關協助之。","note":"一、鑑於現行有關滯納金加徵標準、繳納期間屆滿三十日後仍未繳清稅款者移送強制執行及申請延期或分期繳納稅捐經核准者免加徵滯納金之規定，稅捐稽徵法第二十條已統一規範，爰刪除第一項相關規定。\n二、第二項及第三項未修正。"},{"bill":"202110052020000","text":"納稅義務人逾限繳納稅款者，依稅捐稽徵法第二十條規定每逾三日按滯納之金額加徵百分之一滯納金；逾三十日仍未繳納者，除由稽徵機關移送強制執行外，其為營利事業者，稽徵機關得停止其營業至納稅義務人繳納之日止。\n前項應納稅款，應自滯納期限屆滿之次日起，至納稅義務人繳納之日止，依第一百二十三條規定之存款利率，按日加計利息，一併徵收。\n本法所規定之停止營業處分，由稽徵機關執行，並由警察機關協助之。","note":"所得稅逾限仍未繳納者，其滯納處罰方式係根據稅捐稽徵法第二十條規定來處理，惟稅捐稽徵法已於111年1月1日調整滯納金加徵率，故所得稅法亦應隨之調整。"}],"changed":true,"final":"納稅義務人逾限繳納稅款者，應加徵滯納金；逾三十日仍未繳納者，其為營利事業者，稽徵機關得停止其營業至納稅義務人繳納之日止。\n前項應納稅款，應自滯納期限屆滿之次日起，至納稅義務人繳納之日止，依第一百二十三條規定之存款利率，按日加計利息，一併徵收。\n本法所規定之停止營業處分，由稽徵機關執行，並由警察機關協助之。","finalWhy":"一、鑑於現行有關滯納金加徵標準、繳納期間屆滿三十日後仍未繳清稅款者移送強制執行及申請延期或分期繳納稅捐經核准者免加徵滯納金之規定，稅捐稽徵法第二十條已統一規範，爰刪除第一項相關規定。\n二、第二項及第三項未修正。","review":{"note":"照行政院提案通過","text":"納稅義務人逾限繳納稅款者，應加徵滯納金；逾三十日仍未繳納者，其為營利事業者，稽徵機關得停止其營業至納稅義務人繳納之日止。\n前項應納稅款，應自滯納期限屆滿之次日起，至納稅義務人繳納之日止，依第一百二十三條規定之存款利率，按日加計利息，一併徵收。\n本法所規定之停止營業處分，由稽徵機關執行，並由警察機關協助之。"}},{"no":"第一百十四條","current":"扣繳義務人如有下列情事之一者，分別依各該款規定處罰：\n一、扣繳義務人未依第八十八條規定扣繳稅款者，除限期責令補繳應扣未扣或短扣之稅款及補報扣繳憑單外，並按應扣未扣或短扣之稅額處一倍以下之罰鍰；其未於限期內補繳應扣未扣或短扣之稅款，或不按實補報扣繳憑單者，應按應扣未扣或短扣之稅額處三倍以下之罰鍰。\n二、扣繳義務人已依本法扣繳稅款，而未依第九十二條規定之期限按實填報或填發扣繳憑單者，除限期責令補報或填發外，應按扣繳稅額處百分之二十之罰鍰。但最高不得超過二萬元，最低不得少於一千五百元；逾期自動申報或填發者，減半處罰。經稽徵機關限期責令補報或填發扣繳憑單，扣繳義務人未依限按實補報或填發者，應按扣繳稅額處三倍以下之罰鍰。但最高不得超過四萬五千元，最低不得少於三千元。\n三、扣繳義務人逾第九十二條規定期限繳納所扣稅款者，每逾二日加徵百分之一滯納金。","versions":[{"bill":"201110043620000","text":"扣繳義務人有下列情事之一者，分別依各該款規定處罰：\n一、扣繳義務人未依第八十八條規定扣繳稅款者，除限期責令補繳應扣未扣或短扣之稅款及補報扣繳憑單外，並按應扣未扣或短扣之稅額處一倍以下之罰鍰；其未於限期內補繳應扣未扣或短扣之稅款，或不按實補報扣繳憑單者，應按應扣未扣或短扣之稅額處三倍以下之罰鍰。\n二、扣繳義務人已依本法扣繳稅款，而未依第九十二條規定之期限按實填報或填發扣繳憑單者，除限期責令補報或填發外，處一千五百元以上二萬元以下罰鍰。經稽徵機關限期責令補報或填發扣繳憑單，扣繳義務人未依限按實補報或填發者，處三千元以上四萬五千元以下罰鍰。\n三、扣繳義務人逾第九十二條規定期限繳納所扣稅款者，應加徵滯納金。","note":"一、序文酌作文字修正；第一款未修正。\n二、考量第二款為行為罰，其違章情節之輕重，與扣繳稅額之大小無直接必然關聯，又參酌司法院釋字第六四一號解釋意旨，為賦予稽徵機關衡酌具體個案違章情節輕重或可受責難程度，給予不同程度處罰之裁量權，爰將現行按扣繳稅額之固定比率計算罰鍰及自動補報或填發者固定減半處罰規定，修正為按原罰鍰上限、下限金額處罰。至具體減免處罰之裁量基準（如未經檢舉及調查前，自動補報或填發者減免處罰等），將通盤周延定明於稅務違章案件減免處罰標準及稅務違章案件裁罰金額或倍數參考表。\n三、刪除現行第三款滯納金加徵標準規定，理由同修正條文第一百十二條說明一。"},{"bill":"202110047100000","text":"扣繳義務人有下列情事之一者，分別依各該款規定處罰：\n一、扣繳義務人未依第八十八條規定扣繳稅款者，除限期責令補繳應扣未扣或短扣之稅款及補報扣繳憑單外，並按應扣未扣或短扣之稅額處一倍以下之罰鍰；其未於限期內補繳應扣未扣或短扣之稅款，或不按實補報扣繳憑單 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();

function finder(turns) {   // 在這場逐字稿裡找字

    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
