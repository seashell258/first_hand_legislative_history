<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>發展觀光條例 2025 年修正歷程（特定對象住宿場所展延、罰則）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"發展觀光條例","version":"02018:2025-01-07-修正","date":"2025-01-07","action":"修正","title":"發展觀光條例　2025 年 1 月修正（特定對象住宿場所展延、罰則）","lede":"這次修正六條。第七十條之二規定，2015 年 1 月 22 日修正施行前就有營利事實、非以營利為目的且供特定對象住宿的場所，依原條文要在修正施行起十年內申請旅館業登記才能繼續營業；這次再展延五年，到 2030 年 1 月 21 日。罰鍰方面，未領執照或登記證經營觀光旅館、旅館、旅行或觀光遊樂業務，從 10 萬到 50 萬元提高為 10 萬到 200 萬元，未領登記證經營民宿從 6 萬到 30 萬元提高為 10 萬到 100 萬元；無照業者刊登營業訊息，從 3 萬到 30 萬元提高為 10 萬到 150 萬元，並命限期移除；旅行業沒有投保履約保證保險或責任保險，新增 3 萬到 50 萬元罰鍰；檢查不合格、限期未改善的罰鍰上限從 15 萬元提高為 30 萬元。第四條把中央主管機關設的「觀光局」改為「觀光署」。提案共七個，2024 年 11 月 18 日交通委員會審查，第七十條之二舉手表決 6 比 6、主席表示贊成，照委員陳雪生等 29 人的提案通過，第五十三條保留，全案交黨團協商。協商超過一個月沒有共識，2025 年 1 月 7 日院會記名表決：第五十三條照國民黨黨團再修正動議維持現行條文（60 比 49），第七十條之二照國民黨黨團再修正動議通過（58 比 49），其餘條文照委員會審查結果通過，接著三讀。","summary":"非以營利為目的、供特定對象住宿的場所申請旅館業登記的期限，從原條文的十年再展延五年到 2030 年 1 月 21 日；並提高無照經營旅宿、旅行業等多項罰鍰，主管機關名稱改為觀光署。","key":"02018_2025-01-07","props":[{"id":"202110036690000","who":"委員傅崐萁等20人","date":"2024-04-26","name":"「發展觀光條例第二條及第七十條之二條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110036690000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/11/LCEWA01_110111_00099.pdf","proposers":["傅崐萁","蘇清泉"],"ncosign":18,"people":[["傅崐萁","國民黨","提案"],["蘇清泉","國民黨","提案"],["賴士葆","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["邱若華","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["顏寬恒","國民黨","連署"],["李彥秀","國民黨","連署"],["鄭正鈐","國民黨","連署"],["羅智強","國民黨","連署"],["吳宗憲","國民黨","連署"],["羅廷瑋","國民黨","連署"],["牛煦庭","國民黨","連署"],["葉元之","國民黨","連署"],["萬美玲","國民黨","連署"],["涂權吉","國民黨","連署"],["林倩綺","國民黨","連署"],["羅明才","國民黨","連署"],["廖偉翔","國民黨","連署"],["徐欣瑩","國民黨","連署"]],"party":[["國民黨",20]],"reason":"本院委員傅崐萁、蘇清泉等20人，有鑑於民國104年1月「發展觀光條例」修法後，將第二十四條第三項可經營特定對象住宿之場所刪除，雖給予特定對象住宿場所十年緩衝期間向地方主管機關申請旅館業登記，惟修法通過迄今近九年，卻未有任何一家供特定對象住宿之場所經由申請取得合法之旅館業登記，肇因於相關特定場所設立有其歷史背景，其相關土地使用分區管制與建築物允許使用項目等，未有合乎實際之配套措施，縱使幾經申請與努力卻仍無法取得旅館業登記，申請規定法條形同具文，明顯窒礙難行。實際上，該供特地對象住宿之場所已合法經營數十年之久，投入龐大人力、物力，既使窮盡洪荒之力申請亦無法合乎規定登記，二年後勢必將由合法變為非法。然政府推動觀光發展，供特定對象住宿之場所，有其存在之必要，屆時若無法營運，勢必造成政府、人民、業者三輸之局面，爰擬具「發展觀光條例第二條及第七十條之二條文修正草案」，增訂供特定對象住宿之場所，授權主管機關另 "民進黨","連署"],["林俊憲","民進黨","連署"],["郭昱晴","民進黨","連署"],["林岱樺","民進黨","連署"],["陳培瑜","民進黨","連署"],["沈伯洋","民進黨","連署"],["徐富癸","民進黨","連署"],["陳素月","民進黨","連署"],["李柏毅","民進黨","連署"],["何欣純","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員王美惠等16人，因國人出國旅遊日益盛行，截至113年8月，出境人次超過1,138萬，接近武漢疫情前水準，暑假期間更達312萬，超越疫情同期的人數。然而，旅行業者違約或棄置旅客等糾紛頻頻發生，而「發展觀光條例」所規範之業者違規行為，對社會公益與旅客權益造成嚴重損害，但處罰未與其所得利益相稱，違反比例原則，爰擬具「發展觀光條例部分條文修正草案」。是否有當？敬請公決。","arts":["第五十三條","第五十四條","第五十五條","第五十五條之一","第五十七條"]}],"arts":[{"no":"第二條","current":"本條例所用名詞，定義如下：\n一、觀光產業：指有關觀光資源之開發、建設與維護，觀光設施之興建、改善，為觀光旅客旅遊、食宿提供服務與便利及提供舉辦各類型國際會議、展覽相關之旅遊服務產業。\n二、觀光旅客：指觀光旅遊活動之人。\n三、觀光地區：指風景特定區以外，經中央主管機關會商各目的事業主管機關同意後指定供觀光旅客遊覽之風景、名勝、古蹟、博物館、展覽場所及其他可供觀光之地區。\n四、風景特定區：指依規定程序劃定之風景或名勝地區。\n五、自然人文生態景觀區：指具有無法以人力再造之特殊天然景緻、應嚴格保護之自然動、植物生態環境及重要史前遺跡所呈現之特殊自然人文景觀資源，在原住民保留地、山地管制區、野生動物保護區、水產資源保育區、自然保留區、風景特定區及國家公園內之史蹟保存區、特別景觀區、生態保護區等範圍內劃設之地區。\n六、觀光遊樂設施：指在風景特定區或觀光地區提供觀光旅客休閒、遊樂之設施。\n七、觀光旅館業：指經營國際觀光旅館或一般觀光旅館，對旅客提供住宿及相關服務之營利事業。\n八、旅館業：指觀光旅館業以外，以各種方式名義提供不特定人以日或週之住宿、休息並收取費用及其他相關服務之營利事業。\n九、民宿：指利用自用或自有住宅，結合當地人文街區、歷史風貌、自然景觀、生態、環境資源、農林漁牧、工藝製造、藝術文創等生產活動，以在地體驗交流為目的、家庭副業方式經營，提供旅客城鄉家庭式住宿環境與文化生活之住宿處所。\n十、旅行業：指經中央主管機關核准，為旅客設計安排旅程、食宿、領隊人員、導遊人員、代購代售交通客票、代辦出國簽證手續等有關服務而收取報酬之營利事業。\n十一、觀光遊樂業：指經主管機關核准經營觀光遊樂設施之營利事業。\n十二、導遊人員：指執行接待或引導來本國觀光旅客旅遊業務而收取報酬之服務人員。\n十三、領隊人員：指執行引導出國觀光旅客團體旅遊業務而收取報酬之服務人員。\n十四、專業導覽人員：指為保存、維護及解說國內特有自然生態及人文景觀資源，由各目的事業主管機關在自然人文生態景觀區所設置之專業人員。\n十五、外語觀光導覽人員：指為提升我國國際觀光服務品質，以外語輔助解說國內特有自然生態及人文景觀資源，由各目的事業主管機關在自然人文生態景觀區所設置具外語能力之人員。","versions":[{"bill":"202110036690000","text":"本條例所用名詞，定義如下：\n一、觀光產業：指有關觀光資源之開發、建設與維護，觀光設施之興建、改善，為觀光旅客旅遊、食宿提供服務與便利及提供舉辦各類型國際會議、展覽相關之旅遊服務產業。\n二、觀光旅客：指觀光旅遊活動之人。\n三、觀光地區：指風景特定區以外，經中央主管機關會商各目的事業主管機關同意後指定供觀光旅客遊覽之風景、名勝、古蹟、博物館、展覽場所及其他可供觀光之地區。\n四、風景特定區：指依規定程序劃定之風景或名勝地區。\n五、自然人文生態景觀區：指具有無法以人力再造之特殊天然景緻、應嚴格保護之自然動、植物生態環境及重要史前遺跡所呈現之特殊自然人文景觀資源，在原住民保留地、山地管制區、野生動物保護區、水產資源保育區、自然保留區、風景特定區及國家公園內之史蹟保存區、特別景觀區、生態保護區等範圍內劃設之地區。\n六、觀光遊樂設施：指在風景特定區或觀光地區提供觀光旅客休閒、遊樂之設施。\n七、觀光旅館業：指經營國際觀光旅館或一般觀光旅館，對旅客提供住宿及相關服務之營利事業。\n八、旅館業：指觀光旅館業以外，以各種方式名義提供不特定人以日或週之住宿、休息並收取費用及其他相關服務之營利事業。\n九、民宿：指利用自用或自有住宅，結合當地人文街區、歷史風貌、自然景觀、生態、環境資源、農林漁牧、工藝製造、藝術文創等生產活動，以在地體驗交流為目的、家庭副業方式經營，提供旅客城鄉家庭式住宿環境與文化生活之住宿處所。\n十、特定對象住宿：指利用現有建物，結合當地歷史風貌、自然景觀、生態、環境資源、藝術文創等活動，以在地體驗交流及教育研習為目的，提供特定旅客住宿之處所。\n十一、旅行業：指經中央主管機關核准，為旅客設計安排旅程、食宿、領隊人員、導遊人員、代購代售交通客票、代辦出國簽證手續等有關服務而收取報酬之營利事業。\n十二、觀光遊樂業：指經主管機關核准經營觀光遊樂設施之營利事業。\n十三、導遊人員：指執行接待或引導來本國觀光旅客旅遊業務而收取報酬之服務人員。\n十四、領隊人員：指執行引導出國觀光旅客團體旅遊業務而收取報酬之服務人員。\n十五、專業導覽人員：指為保存、維護及解說國內特有自然生態及人文景觀資源，由各目的事業主管機關在自然人文生態景觀區所設置之專業人員。\n十六、外語觀光導覽人員：指為提升我國國際觀光服務品質，以外語輔助解說國內特有自然生態及人文景觀資源，由各目的事業主管機關在自然人文生態景觀區所設置具外語能力之人員。","note":"一、本條文新增第十款。\n二、對於對於現行發展觀光條例之區分，僅有觀光旅館、一般旅館及民宿三種，其種類區分過少，設立標準過於僵化，於設立標準加以分隔，以提升觀光旅宿之多元化。"},{"bill":"202110044950000","text":"本條例所用名詞，定義如下：\n一、觀光產業：指有關觀光資源之開發、建設與維護，觀光設施之興建、改善，為觀光旅客旅遊、食宿提供服務與便利及提供舉辦各類型國際會議、展覽相關之旅遊服務產業。\n二、觀光旅客：指觀光旅遊活動之人。\n三、觀光地區：指風景特定區以外，經中央主管機關會商各目的事業主管機關同意後指定供觀光旅客遊覽之風景、名勝、古蹟、博物館、展覽場所及其他可供觀光之地區。\n四、風景特定區：指依規定程序劃定之風景或名勝地區。\n五、自然人文生態景觀區：指具有無法以人力再造之特殊天然景緻、應嚴格保護之自然動、植物生態環境及重要史前遺跡所呈現之特殊自然人文景觀資源，在原住民保留地、山地管制區、野生動物保護區、水產資源保育區、自然保留區、風景特定區及國家公園內之史蹟保存區、特別景觀區、生態保護區等範圍內劃設之地區。\n六、觀光遊樂設施：指在風景特定區或觀光地區提供觀光旅客休閒、遊樂之設施。\n七、觀光旅館業：指經營國際觀光旅館或一般觀光旅館，對旅客提供住宿及相關服務之營利事業。\n八、旅館業：指觀光旅館業以外，以各種方式名義提供不特定人以日或週之住宿、休息並收取費用及其他相關服務之營利事業。\n九、民宿：指利用自用或自有住宅，結合當地人文街區、歷史風貌、自然景觀、生態、環境資源、農林漁牧、工藝製造、藝術文創等生產活動，以在地體驗交流為目的、家庭副業方式經營，提供旅客城鄉家庭式住宿環境與文化生活之住宿處所。\n十、特定對象住宿：指利用現有建物，結合當地歷史風貌、自然景觀、生態、環境資源、藝術文創等活動，以在地體驗交流及教育研習為目的，提供特定旅客住宿之處所。\n十一、旅行業：指經中央主管機關核准，為旅客設計安排旅程、食宿、領隊人員、導遊人員、代購代售交通客票、代辦出國簽證手續等有關服務而收取報酬之營利事業。\n十二、觀光遊樂業：指經主管機關核准經營觀光遊樂設施之營利事業。\n十三、導遊人員：指執行接待或引導來本國觀光旅客旅遊業務而收取報酬之服務人員。\n十四、領隊人員：指執行引導出國觀光旅客團體旅遊業務而收取報酬之服務人員。\n十五、專業導覽人員：指為保存、維護及解說國內特有自然生態及人文景觀資源，由各目的事業主管機關在自然人文生態景觀區所設置之專業人員。\n十六、外語觀光導覽人員：指為提升我國國際觀光服務品質，以外語輔助解說國內特有自然生態及人文景觀資源，由各目的事業主管機關在自然人文生態景觀區所設置具外語能力之人員。","note":"一、本條文新增第十款。\n二、對於對於現行發展觀光條例之區分，僅有觀光旅館、一般旅館及民宿三種，其種類區分過少，設立標準過於僵化，於設立標準加以分隔，以提升觀光旅宿之多元化。"}],"changed":false,"final":"本條例所用名詞，定義如下：\n一、觀光產業：指有關觀光資源之開發、建設與維護，觀光設施之興建、改善，為觀光旅客旅遊、食宿提供服務與便利及提供舉辦各類型國際會議、展覽相關之旅遊服務產業。\n二、觀光旅客：指觀光旅遊活動之人。\n三、觀光地區：指風景特定區以外，經中央主管機關會商各目的事業主管機關同意後指定供觀光旅客遊覽之風景、名勝、古蹟、博物館、展覽場所及其他可供觀光之地區。\n四、風景特定區：指依規定程序劃定之風景或名勝地區。\n五、自然人文生態景觀區：指具有無法以人力再造之特殊天然景緻、應嚴格保護之自然動、植物生態環境及重要史前遺跡所呈現之特殊自然人文景觀資源，在原住民保留地、山地管制區、野生動物保護區、水產資源保育區、自然保留區、風景特定區及國家公園內之史蹟保存區、特別景觀區、生態保護區等範圍內劃設之地區。\n六、觀光遊樂設施：指在風景特定區或觀光地區提供觀光旅客休閒、遊樂之設施。\n七、觀光旅館業：指經營國際觀光旅館或一般觀光旅館，對旅客提供住宿及相關服務之營利事業。\n八、旅館業：指觀光旅館業以外，以各種方式名義提供不特定人以日或週之住宿、休息並收取費用及其他相關服務之營利事業。\n九、民宿：指利用自用或自有住宅，結合當地人文街區、歷史風貌、自然景觀、生態、環境資源、農林漁牧、工藝製造、藝術文創等生產活動，以在地體驗交流為目的、家庭副業方式經營，提供旅客城鄉家庭式住宿環境與文化生活之住宿處所。\n十、旅行業：指經中央主管機關核准，為旅客設計安排旅程、食宿、領隊人員、導遊人員、代購代售交通客票、代辦出國簽證手續等有關服務而收取報酬之營利事業。\n十一、觀光遊樂業：指經主管機關核准經營觀光遊樂設施之營利事業。\n十二、導遊人員：指執行接待或引導來本國觀光旅客旅遊業務而收取報酬之服務人員。\n十三、領隊人員：指執行引導出國觀光旅客團體旅遊業務而收取報酬之服務人員。\n十四、專業導覽人員：指為保存、維護及解說國內特有自然生態及人文景觀資源，由各目的事業主管機關在自然人文生態景觀區所設置之專業人員。\n十五、外語觀光導覽人員：指為提升我國國際觀光服務品質，以外語輔助解說國內特有自然生態及人文景觀資源，由各目的事業主管機關在自然人文生態景觀區所設置具外語能力之人員。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第四條","current":"中央主管機關為主管全國觀光事務，設觀光局；其組織，另以法律定之。\n直轄市、縣（市）主管機關為主管地方觀光事務，得視實際需要，設立觀光機構。","versions":[{"bill":"202110047210000","text":"中央主管機關為主管全國觀光事務，設觀光署；其組織，另以法律定之。\n直轄市、縣（市）主管機關為主管地方觀光事務，得視實際需要，設立觀光機構。","note":"茲配合行政院組織調整，立法院已於112年5月16日三讀通過《交通部觀光署組織法》，112年9月15日「交通部觀光局」改制為「交通部觀光署」。然本法有關主管全國觀光事務之中央主管機關之規定，尚未有配合相應之調整。爰修正本法第四條條文。"}],"changed":true,"final":"中央主管機關為主管全國觀光事務，設觀光署；其組織，另以法律定之。\n直轄市、縣（市）主管機關為主管地方觀光事務，得視實際需要，設立觀光機構。","finalWhy":"茲配合行政院組織調整，立法院已於112年5月16日三讀通過《交通部觀光署組織法》，112年9月15日「交通部觀光局」改制為「交通部觀光署」。然本條例有關主管全國觀光事務之中央主管機關之規定，尚未有配合相應之調整。爰修正本條例第四條條文。","review":{"note":"照委員許宇甄等20人提案通過","text":"中央主管機關為主管全國觀光事務，設觀光署；其組織，另以法律定之。\n直轄市、縣（市）主管機關為主管地方觀光事務，得視實際需要，設立觀光機構。"}},{"no":"第三十六條","current":"為維護遊客安全，水域遊憩活動管理機關得對水域遊憩活動之種類、範圍、時間及行為限制之，並得視水域環境及資源條件之狀況，公告禁止水域遊憩活動區域；其禁止、限制及應遵守事項之管理辦法，由主管機關會商有關機關定之。\n帶客從事水域遊憩活動具營利性質者，應投保責任保險；提供場地或器材供遊客從事水域遊憩活動而具營利性質者，亦同。\n前項責任保險給付項目及最低保險金額，由主管機關於第一項管理辦法中定之。\n前項保險金額之部分金額，於第二項責任保險之被保險人因意外事故致遊客死亡或傷害，而受下列之人請求時，不論被保險人有無過失，請求權人得依本條例規定向責任保險人請求保險給付：\n一、因意外事故致遊客傷害者，為受害人本人。\n二、因意外事故致遊客死亡者，請求順位如下：\n(一)父母、子女及配偶。\n(二)祖父母。\n(三)孫子女。\n(四)兄弟姊妺。\n第二項之責任保險人依本條例規定所為之保險給付，視為被保險人損害賠償金額之一部分；被保險人受賠償請求時，得扣除之。","versions":[{"bill":"202110046530000","text":"為維護遊客安全，水域遊憩活動管理機關得對水域遊憩活動之種類、範圍、時間及行為限制之，並得視水域環境及資源條件之狀況，公告警示水域遊憩活動區域；其警示、限制及應遵守事項之管理辦法，由主管機關會商有關機關定之。\n帶客從事水域遊憩活動具營利性質者，應投保責任保險；提供場地或器材供遊客從事水域遊憩活動而具營利性質者，亦同。\n前項責任保險給付項目及最低保險金額，由主管機關於第一項管理辦法中定之。\n前項保險金額之部分金額，於第二項責任保險之被保險人因意外事故致遊客死亡或傷害，而受下列之人請求時，不論被保險人有無過失，請求權人得依本條例規定向責任保險人請求保險給付：\n一、因意外事故致遊客傷害者，為受害人本人。\n二、因意外事故致遊客死亡者，請求順位如下：\n(一)父母、子女及配偶。\n(二)祖父母。\n(三)孫子女。\n(四)兄弟姊妺。\n第二項之責任保險人依本條例規定所為之保險給付，視為被保險人損害賠償金額之一部分；被保險人受賠償請求時，得扣除之。","note":"一、水域遊憩活動管理辦法依本修正條文應進行修訂，相關水域主管機關有關公告禁止之辦法內容予以刪除。\n二、以警示取代禁止。列舉包含生態復育、暗流漲退潮危險致命等區域得列為警示區域。"}],"changed":false,"final":"為維護遊客安全，水域遊憩活動管理機關得對水域遊憩活動之種類、範圍、時間及行為限制之，並得視水域環境及資源條件之狀況，公告禁止水域遊憩活動區域；其禁止、限制及應遵守事項之管理辦法，由主管機關會商有關機關定之。\n帶客從事水域遊憩活動具營利性質者，應投保責任保險；提供場地或器材供遊客從事水域遊憩活動而具營利性質者，亦同。\n前項責任保險給付項目及最低保險金額，由主管機關於第一項管理辦法中定之。\n前項保險金額之部分金額，於第二項責任保險之被保險人因意外事故致遊客死亡或傷害，而受下列之人請求時，不論被保險人有無過失，請求權人得依本條例規定向責任保險人請求保險給付：\n一、因意外事故致遊客傷害者，為受害人本人。\n二、因意外事故致遊客死亡者，請求順位如下：\n(一)父母、子女及配偶。\n(二)祖父母。\n(三)孫子女。\n(四)兄弟姊妺。\n第二項之責任保險人依本條例規定所為之保險給付，視為被保險人損害賠償金額之一部分；被保險人受賠償請求時，得扣除之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第五十三條","current":"觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，有玷辱國家榮譽、損害國家利益、妨害善良風俗或詐騙旅客行為者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，處新臺幣十五萬元以上五十萬元以下罰鍰，並定期停止其營業之一部或全部，或廢止其營業執照或登記證。\n經受停止營業一部或全部之處分，仍繼續營業者，處新臺幣五十萬元以上罰鍰，廢止其營業執照或登記證，並得按次處罰之。\n觀光旅館業、旅館業、旅行業、觀光遊樂業之受僱人員有第一項行為者，處新臺幣一萬元以上五萬元以下罰鍰；其情節重大者，處新臺幣五萬元以上三十萬元以下罰鍰。","versions":[{"bill":"202110047210000","text":"觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，有玷辱國家榮譽、損害國家利益者，經法院判決確定者，停止其營業之一部或全部，或廢止其營業執照或登記證。\n前項情形有妨害善良風俗或詐騙旅客行為者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，處新臺幣十五萬元以上五十萬元以下罰鍰，並定期停止其營業之一部或全部，或廢止其營業執照或登記證。\n經受停止營業一部或全部之處分，仍繼續營業者，處新臺幣五十萬元以上罰鍰，廢止其營業執照或登記證，並得按次處罰之。\n觀光旅館業、旅館業、旅行業、觀光遊樂業之受僱人員有第一項行為者，處新臺幣一萬元以上五萬元以下罰鍰；其情節重大者，處新臺幣五萬元以上三十萬元以下罰鍰。","note":"一、現行刑法條文中，刑法分則所羅列的犯罪行為，是以保護國家法益、社會法益與個人法益的順序區分。然現行「發展觀光條例」第五十三條第一項將所侵犯國家法益及社會法益之犯罪行為，編列在同項處罰，有混淆體系之嫌。\n二、就法益而言，法定刑之刑罰種類及其刑度輕重，必須與其所保護之法益具有相當性，是為法益相當原則，亦指法益破壞與刑罰賦予必須相當，亦即犯罪與處刑必須相當。是故，不同法益應有不同刑罰，重所當重，輕所當輕；使罪得其刑，而刑當其罪；不得任意賦予刑種，或任意增減刑度，使得罪重而刑輕，或罪輕而刑重。\n三、爰修正「發展觀光條例」第五十三條第一項，將侵害國家法益者，處以停止其營業之一部或全部，或廢止其營業執照或登記證。但為避免爭議，確定其侵害國家法益之行為，以法院判決為主。\n四、將原侵害社會法益行為的處罰為第二項。其他各項依序遞延。"},{"bill":"202110072830000","text":"觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，有玷辱國家榮譽、損害國家利益、妨害善良風俗或詐騙旅客行為者，處新臺幣三萬元以上三十萬元以下罰鍰；情節重大者，處新臺幣三十萬元以上一百五十萬元以下罰鍰，並定期停止其營業之一部或全部，或廢止其營業執照或登記證。\n經受停止營業一部或全部之處分，仍繼續營業者，處新臺幣二百萬元以上罰鍰，廢止其營業執照或登記證，並得按次處罰之。\n觀光旅館業、旅館業、旅行業、觀光遊樂業之受僱人員有第一項行為者，處新臺幣一萬元以上五萬元以下罰鍰；其情節重大者，處新臺幣五萬元以上三十萬元以下罰鍰。","note":"一、現行條文第一項所列觀光產業行為，對社會公益及旅客權益傷害甚鉅，而目前法定罰鍰上限為新臺幣十五萬元，情節重大者之法定罰鍰上限為新臺幣五十萬元，與違規業者所得之利益並不符合比例原則，爰分別提高法定罰鍰上限為三十萬元及一百五十萬元，以遏阻類似違規行為侵害國家利益、旅客權益。\n二、第二項規定業者經受停止營業一部或全部之處分，仍繼續營業者，與修正條文第五十五條第四項所規定業者未依本條例領取營業執照或登記證而經營者，二者違法行為態樣相似，基於相類似事件，應為相同處理之原則，爰提高法定罰鍰上限為二百萬元。"}],"changed":false,"final":"觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，有玷辱國家榮譽、損害國家利益、妨害善良風俗或詐騙旅客行為者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，處新臺幣十五萬元以上五十萬元以下罰鍰，並定期停止其營業之一部或全部，或廢止其營業執照或登記證。\n經受停止營業一部或全部之處分，仍繼續營業者，處新臺幣五十萬元以上罰鍰，廢止其營業執照或登記證，並得按次處罰之。\n觀光旅館業、旅館業、旅行業、觀光遊樂業之受僱人員有第一項行為者，處新臺幣一萬元以上五萬元以下罰鍰；其情節重大者，處新臺幣五萬元以上三十萬元以下罰鍰。","finalWhy":null,"review":{"note":"保留，送院會處理。","text":""}},{"no":"第五十四條","current":"觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，經主管機關依第三十七條第一項檢查結果有不合規定者，除依相關法令辦理外，並令限期改善，屆期仍未改善者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，並得定期停止其營業之一部或全部；經受停止營業處分仍繼續營業者，廢止其營業執照或登記證。\n經依第三十七條第一項規定檢查結果，有不合規定且危害旅客安全之虞者，在未完全改善前，得暫停其設施或設備一部或全部之使用。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，規避、妨礙或拒絕主管機關依第三十七條第一項規定檢查者，處新臺幣三萬元以上十五萬元以下罰鍰，並得按次連續處罰。","versions":[{"bill":"202110072830000","text":"觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，經主管機關依第三十七條第一項檢查結果有不合規定者，除依相關法令辦理外，並令限期改善，屆期仍未改善者，處新臺幣三萬元以上三十萬元以下罰鍰；情節重大者，並得定期停止其營業之一部或全部；經受停止營業處分仍繼續營業者，廢止其營業執照或登記證。\n經依第三十七條第一項規定檢查結果，有不合規定或有危害旅客安全之虞者，在未完全改善前，得暫停其設施或設備一部或全部之使用或服務之提供。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，規避、妨礙或拒絕主管機關依第三十七條第一項規定檢查者，處新臺幣三萬元以上十五萬元以下罰鍰，並得按次連續處罰。","note":"一、主管機關依本條例第三十七條第一項對業者之經營管理、經營設施實施定期或不定期檢查，旨在加強維護公共場所安全，確實保障消費者安全，違反且經限期仍未改善者，最法定罰鍰上限僅十五萬元，並不足以遏阻業者違規，爰修正第一項提高法定罰鍰上限為三十萬元。\n二、另，現行規定僅對於設施或設備經檢查不合規定且有危害旅客安全之虞者，在達完全改善前，得暫停其設施或設備一部或全部之使用，業已對旅客安全產生嚴重危害，爰修正第二項為經檢查結果，有不合規定或有危害旅客安全之虞者，在未完全改善後，得暫停其設施或設備一部或全部之使用或服務之提供。"}],"changed":true,"final":"觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，經主管機關依第三十七條第一項檢查結果有不合規定者，除依相關法令辦理外，並令限期改善，屆期仍未改善者，處新臺幣三萬元以上三十萬元以下罰鍰；情節重大者，並得定期停止其營業之一部或全部；經受停止營業處分仍繼續營業者，廢止其營業執照或登記證。\n經依第三十七條第一項規定檢查結果，有不合規定或有危害旅客安全之虞者，在未完全改善前，得暫停其設施或設備一部或全部之使用或服務之提供。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，規避、妨礙或拒絕主管機關依第三十七條第一項規定檢查者，處新臺幣三萬元以上十五萬元以下罰鍰，並得按次連續處罰。","finalWhy":"一、主管機關依本條例第三十七條第一項對業者之經營管理、經營設施實施定期或不定期檢查，旨在加強維護公共場所安全，確實保障消費者安全，違反且經限期仍未改善者，法定罰鍰上限僅十五萬元，並不足以遏阻業者違規，爰修正第一項提高法定罰鍰上限為三十萬元。\n二、另，原規定僅對於設施或設備經檢查不合規定且有危害旅客安全之虞者，在達完全改善前，得暫停其設施或設備一部或全部之使用，業已對旅客安全產生嚴重危害，爰修正第二項為經檢查結果，有不合規定或有危害旅客安全之虞者，在未完全改善前，得暫停其設施或設備一部或全部之使用或服務之提供。","review":{"note":"照委員王美惠等16人提案通過","text":"觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，經主管機關依第三十七條第一項檢查結果有不合規定者，除依相關法令辦理外，並令限期改善，屆期仍未改善者，處新臺幣三萬元以上三十萬元以下罰鍰；情節重大者，並得定期停止其營業之一部或全部；經受停止營業處分仍繼續營業者，廢止其營業執照或登記證。\n經依第三十七條第一項規定檢查結果，有不合規定或有危害旅客安全之虞者，在未完全改善前，得暫停其設施或設備一部或全部之使用或服務之提供。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，規避、妨礙或拒絕主管機關依第三十七條第一項規定檢查者，處新臺幣三萬元以上十五萬元以下罰鍰，並得按次連續處罰。"}},{"no":"第五十五條","current":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，得廢止其營業執照：\n一、觀光旅館業違反第二十二條規定，經營核准登記範圍外業務。\n二、旅行業違反第二十七條規定，經營核准登記範圍外業務。\n有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰：\n一、旅行業違反第二十九條第一項規定，未與旅客訂定書面契約。\n二、觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反第四十二條規定，暫停營業或暫停經營未報請備查或停業期間屆滿未申報復業。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反依本條例所發布之命令，視情節輕重，主管機關得令限期改善或處新臺幣一萬元以上五萬元以下罰鍰。\n未依本條例領取營業執照而經營觀光旅館業務、旅行業務或觀光遊樂業務者，處新臺幣十萬元以上五十萬元以下罰鍰，並勒令歇業。\n未依本條例領取登記證而經營旅館業務者，處新臺幣十萬元以上五十萬元以下罰鍰，並勒令歇業。\n未依本條例領取登記證而經營民宿者，處新臺幣六萬元以上三十萬元以下罰鍰，並勒令歇業。\n觀光旅館業、旅館業及民宿經營者，擅自擴大營業客房部分者，其擴大部分，觀光旅館業及旅館業處新臺幣五萬元以上二十五萬元以下罰鍰。民宿經營者處新臺幣三萬元以上十五萬元以下罰鍰。擴大部分並勒令歇業。\n經營觀光旅館業務、旅館業務及民宿者，依前四項規定經勒令歇業仍繼續經營者，得按次處罰，主管機關並得移送相關主管機關，採取停止供水、供電、封閉、強制拆除或其他必要可立即結束經營之措施，且其費用由該違反本條例之經營者負擔。\n違反前五項規定，情節重大者，主管機關應公布其名稱、地址、負責人或經營者姓名及違規事項。","versions":[{"bill":"202110067890000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，得廢止其營業執照：\n一、觀光旅館業違反第二十二條規定，經營核准登記範圍外業務。\n二、旅行業違反第二十七條規定，經營核准登記範圍外業務。\n有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰：\n一、旅行業違反第二十九條第一項規定，未與旅客訂定書面契約。\n二、觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反第四十二條規定，暫停營業或暫停經營未報請備查或停業期間屆滿未申報復業。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反依本條例所發布之命令，視情節輕重，主管機關得令限期改善或處新臺幣一萬元以上五萬元以下罰鍰。\n未依本條例領取營業執照而經營觀光旅館業務、旅行業務或觀光遊樂業務者，處新臺幣三十萬元以上兩百萬元以下罰鍰，並勒令歇業。\n未依本條例領取登記證而經營旅館業務者，處新臺幣十萬元以上五十萬元以下罰鍰，並勒令歇業。\n未依本條例領取登記證而經營民宿者，處新臺幣六萬元以上三十萬元以下罰鍰，並勒令歇業。\n觀光旅館業、旅館業及民宿經營者，擅自擴大營業客房部分者，觀光旅館業及旅館業，處新臺幣五萬元以上二十五萬元以下罰鍰；民宿經營者，處新臺幣三萬元以上十五萬元以下罰鍰。擴大部分並勒令歇業。\n經營觀光旅館業務、旅館業務或民宿，依前四項規定經勒令歇業仍繼續經營者，得按次處罰，主管機關並得移送相關主管機關，採取停止供水、供電、封閉、強制拆除或其他必要可立即結束經營之措施，且其費用由該違反本條例之經營者負擔。\n違反前五項規定，情節重大者，主管機關應公布其名稱、地址、負責人或經營者姓名及違規事項。","note":"一、鑑於非法經營行為對消費者住宿安全及權益有嚴重影響，為有效遏止非法經營者之行為，現行條文第四項、第五項及第六項均係裁處未依本條例領取營業執照或登記證而經營住宿服務者，其情節輕重與客房數有關，因此應依據不同旅宿類別採不同罰則；觀光旅館屬財團經營、規模較大，其非法營業對消費者產生之危害情節更為重大，爰將現行條文第四項裁罰額度上限提高至新臺幣二百萬元。\n二、現行條文第七項擅自擴大營業客房之觀光旅館業、旅館業及民宿經營者，亦對旅客住宿安全及權益有其影響，條文內容「其擴大部分」係屬贅字，爰以刪除，另酌以加入標點。"},{"bill":"202110072830000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，得廢止其營業執照：\n一、觀光旅館業違反第二十二條規定，經營核准登記範圍外業務。\n二、旅行業違反第二十七條規定，經營核准登記範圍外業務。\n有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰：\n一、旅行業違反第二十九條第一項規定，未與旅客訂定書面契約。\n二、觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反第四十二條規定，暫停營業或暫停經營未報請備查或停業期間屆滿未申報復業。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反依本條例所發布之命令，視情節輕重，主管機關得令限期改善或處新臺幣一萬元以上五萬元以下罰鍰。\n未依本條例領取營業執照或登記證而經營觀光旅館業務、旅館業務、旅行業務或觀光遊樂業務、或民宿者，處新臺幣十萬元以上二百萬元以下罰鍰，並勒令歇業。\n觀光旅館業、旅館業及民宿經營者，擅自擴大營業客房部分者，其擴大部分，觀光旅館業及旅館業處新臺幣五萬元以上二十五萬元以下罰鍰。民宿經營者處新臺幣三萬元以上十五萬元以下罰鍰。擴大部分並勒令歇業。\n經營觀光旅館業務、旅館業務及民宿者，依前二項規定經勒令歇業仍繼續經營者，得按次處罰，主管機關並得移送相關主管機關，採取停止供水、供電、封閉、強制拆除或其他必要可立即結束經營之措施，且其費用由該違反本條例之經營者負擔。\n違反前四項規定，情節重大者，主管機關應公布其名稱、地址、負責人或經營者姓名及違規事項。","note":"一、為非法經營行為對消費者住宿安全及權益有嚴重影響，為有效遏止非法經營者之行為，爰將現行條文第四項裁罰額度上限提高至新臺幣二百萬元。另旅館業務者、民宿與觀光旅館相比所提供服務並無相同，爰納入第四項規，刪除原第五項、第六項。\n二、現行條文第七項、第八項，分別移列為修正條文第五項、第六項，並做項次調整。"}],"changed":true,"final":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，得廢止其營業執照：\n一、觀光旅館業違反第二十二條規定，經營核准登記範圍外業務。\n二、旅行業違反第二十七條規定，經營核准登記範圍外業務。\n有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰：\n一、旅行業違反第二十九條第一項規定，未與旅客訂定書面契約。\n二、觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反第四十二條規定，暫停營業或暫停經營未報請備查或停業期間屆滿未申報復業。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反依本條例所發布之命令，視情節輕重，主管機關得令限期改善或處新臺幣一萬元以上五萬元以下罰鍰。\n未依本條例領取營業執照或登記證而經營觀光旅館業務、旅館業務、旅行業務或觀光遊樂業務者，處新臺幣十萬元以上二百萬元以下罰鍰，並勒令歇業。\n未依本條例領取登記證而經營民宿者，處新臺幣十萬元以上一百萬元以下罰鍰，並勒令歇業。\n觀光旅館業、旅館業及民宿經營者，擅自擴大營業客房部分者，其擴大部分，觀光旅館業及旅館業處新臺幣五萬元以上二十五萬元以下罰鍰。民宿經營者處新臺幣三萬元以上十五萬元以下罰鍰。擴大部分並勒令歇業。\n經營觀光旅館業務、旅館業務及民宿者，依前三項規定經勒令歇業仍繼續經營者，得按次處罰，主管機關並得移送相關主管機關，採取停止供水、供電、封閉、強制拆除或其他必要可立即結束經營之措施，且其費用由該違反本條例之經營者負擔。\n違反前五項規定，情節重大者，主管機關應公布其名稱、地址、負責人或經營者姓名及違規事項。","finalWhy":"照委員提案修正通過。","review":{"note":"照委員王美惠等16人提案修正通過","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰；情節重大者，得廢止其營業執照：\n一、觀光旅館業違反第二十二條規定，經營核准登記範圍外業務。\n二、旅行業違反第二十七條規定，經營核准登記範圍外業務。\n有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰：\n一、旅行業違反第二十九條第一項規定，未與旅客訂定書面契約。\n二、觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反第四十二條規定，暫停營業或暫停經營未報請備查或停業期間屆滿未申報復業。\n觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，違反依本條例所發布之命令，視情節輕重，主管機關得令限期改善或處新臺幣一萬元以上五萬元以下罰鍰。\n未依本條例領取營業執照或登記證而經營觀光旅館業務、旅館業務、旅行業務或觀光遊樂業務者，處新臺幣十萬元以上二百萬元以下罰鍰，並勒令歇業。\n未依本條例領取登記證而經營民宿者，處新臺幣十萬元以上一百萬元以下罰鍰，並勒令歇業。\n觀光旅館業、旅館業及民宿經營者，擅自擴大營業客房部分者，其擴大部分，觀光旅館業及旅館業處新臺幣五萬元以上二十五萬元以下罰鍰。民宿經營者處新臺幣三萬元以上十五萬元以下罰鍰。擴大部分並勒令歇業。\n經營觀光旅館業務、旅館業務及民宿者，依前三項規定經勒令歇業仍繼續經營者，得按次處罰，主管機關並得移送相關主管機關，採取停止供水、供電、封閉、強制拆除或其他必要可立即結束經營之措施，且其費用由該違反本條例之經營者負擔。\n違反前五項規定，情節重大者，主管機關應公布其名稱、地址、負責人或經營者姓名及違規事項。"}},{"no":"第五十五條之一","current":"未依本條例規定領取營業執照或登記證而經營觀光旅館業務、旅行業務、觀光遊樂業務、旅館業務或民宿者，以廣告物、出版品、廣播、電視、電子訊號、電腦網路或其他媒體等，散布、播送或刊登營業之訊息者，處新臺幣三萬元以上三十萬元以下罰鍰。","versions":[{"bill":"202110067890000","text":"未依本條例規定領取觀光旅館業、旅行業、觀光遊樂業營業執照或旅館業、民宿登記證，以廣告物、出版品、廣播、電視、電子訊號、電腦網路或其他媒體等，散布、播送或刊登營業之訊息者，按旅宿業規模處新臺幣六萬元以上一百五十萬元以下罰鍰，並命限期移除；屆期不履行者，得按次處罰。","note":"鑑於尚未合法業者之營業訊息恐對消費者旅遊安全及觀光產業經營秩序影響至鉅，修正條文爰加重其罰鍰金額至新臺幣一百五十萬元以資嚇阻，然考量不同種類之旅宿業者，非法營業對社會產生之危害輕重不同，應依照旅宿規模處以相對應之罰款。另為確保除去其非法營業訊息，修正條文並增訂命其限期移除規定；屆期不履行者，得按次處罰，以維護交易市場秩序。"},{"bill":"202110072830000","text":"未依本條例規定領取觀光旅館業、旅行業、觀光遊樂業營業執照或旅館業、民宿登記證，以廣告物、出版品、廣播、電視、電子訊號、電腦網路或其他媒體等，散布、播送或刊登營業之訊息者，處新臺幣十五萬元以上一百五十萬元以下罰鍰，並命限期移除；屆期不履行者，得按次處罰。","note":"鑑於尚未合法業者之營業訊息將對消費者旅遊安全及觀光產業經營秩序產生重大影響，爰提高法定罰鍰至十五萬至一百五十萬元，並增訂命其限期移除，屆期不履行者得按按次處罰。"}],"changed":true,"final":"未依本條例規定領取觀光旅館業、旅行業、觀光遊樂業營業執照或旅館業、民宿登記證，以廣告物、出版品、廣播、電視、電子訊號、電腦網路或其他媒體等，散布、播送或刊登營業之訊息者，處新臺幣十萬元以上一百五十萬元以下罰鍰，並命限期移除；屆期不履行者，得按次處罰。","finalWhy":"","review":{"note":"照委員王美惠等16人提案修正通過","text":"未依本條例規定領取觀光旅館業、旅行業、觀光遊樂業營業執照或旅館業、民宿登記證，以廣告物、出版品、廣播、電視、電子訊號、電腦網路或其他媒體等，散布、播送或刊登營業之訊息者，處新臺幣十萬元以上一百五十萬元以下罰鍰，並命限期移除；屆期不履行者，得按次處罰。"}},{"no":"第五十五條之三","current":null,"versions":[{"bill":"202110067890000","text":"主管機關應於二年內，針對日租套房另立管理辦法。","note":"一、本條新增。\n二、主管機關應建立日租套房相關規範包含：登記流程、衛生、消防安全等查核機制，以保障消費者安全與日租套房業者權益。\n三、考量日租套房經營者多為民間家庭，對罰緩的負擔程度、風險承受度皆與大型財團不同，應訂立專屬之罰則，以確保台灣觀光業市場之公平性。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第五十七條","current":"旅行業未依第三十一條規定辦理履約保證保險或責任保險，中央主管機關得立即停止其辦理旅客之出國及國內旅遊業務，並限於三個月內辦妥投保，逾期未辦妥者，得廢止其旅行業執照。\n違反前項停止辦理旅客之出國及國內旅遊業務之處分者，中央主管機關得廢止其旅行業執照。\n觀光旅館業、旅館業、觀光遊樂業及民宿經營者，未依第三十一條規定辦理責任保險者，處新臺幣三萬元以上五十萬元以下罰鍰，主管機關並應令限期辦妥投保，屆期未辦妥者，得廢止其營業執照或登記證。","versions":[{"bill":"202110072830000","text":"旅行業未依第三十一條規定辦理履約保證保險或責任保險，處新臺幣三萬元以上五十萬元以下罰鍰，中央主管機關得立即停止其辦理旅客之出國及國內旅遊業務，並限於三個月內辦妥投保，逾期未辦妥者，得廢止其旅行業執照。\n違反前項停止辦理旅客之出國及國內旅遊業務之處分者，中央主管機關得廢止其旅行業執照。\n觀光旅館業、旅館業、觀光遊樂業及民宿經營者，未依第三十一條規定辦理責任保險者，處新臺幣三萬元以上五十萬元以下罰鍰，主管機關並應令限期辦妥投保，屆期未辦妥者，得廢止其營業執照或登記證。","note":"為依本條例第三十一條第一項、第二項規定，旅行業者應依規定投保責任保險及投保履約保證保險，但卻未如觀光旅館業等未依規定辦理責任保險者有罰鍰之處罰，爰修正第一項，旅行業未依第三十一條規定辦理履約保證保險或責任保險，處新臺幣三萬元以上五十萬元以下罰鍰。"}],"changed":true,"final":"旅行業未依第三十一條規定辦理履約保證保險或責任保險，處新臺幣三萬元以上五十萬元以下罰鍰，中央主管機關得立即停止其辦理旅客之出國及國內旅遊業務，並限於三個月內辦妥投保，逾期未辦妥者，得廢止其旅行業執照。\n違反前項停止辦理旅客之出國及國內旅遊業務之處分者，中央主管機關得廢止其旅行業執照。\n觀光旅館業、旅館業、觀光遊樂業及民宿經營者，未依第三十一條規定辦理責任保險者，處新臺幣三萬元以上五十萬元以下罰鍰，主管機關並應令限期辦妥投保，屆期未辦妥者，得廢止其營業執照或登記證。","finalWhy":"為依本條例第三十一條第一項、第二項規定，旅行業者應依規定投保責任保險及投保履約保證保險，但卻未如觀光旅館業等未依規定辦理責任保險者有罰鍰之處罰，爰修正第一項，旅行業未依第三十一條規定辦理履約保證保險或責任保險，處新臺幣三萬元以上五十萬元以下罰鍰。","review":{"note":"照委員王美惠等16人提案通過","text":"旅行業未依第三十一條規定辦理履約保證保險或責任保險，處新臺幣三萬元以上五十萬元以下罰鍰，中央主管機關得立即停止其辦理旅客之出國及國內旅遊業務，並限於三個月內辦妥投保，逾期未辦妥者，得廢止其旅行業執照。\n違反前項停止辦理旅客之出國及國內旅遊業務之處分者，中央主管機關得廢止其旅行業執照。\n觀光旅館業、旅館業、觀光遊樂業及民宿經營者，未依第三十一條規定辦理責任保險者，處新臺幣三萬元以上五十萬元以下罰鍰，主管機關並應令限期辦妥投保，屆期未辦妥者，得廢止其營業執照或登記證。"}},{"no":"第六十條","current":"於公告禁止區域從事水域遊憩活動或不遵守水域遊憩活動管理機關對有關水域遊憩活動所為種類、範圍、時間及行為之限制命令者，由其水域遊憩活動管理機關處新臺幣一萬元以上五萬元以下罰鍰，並禁止其活動。\n前項行為具營利性質者，處新臺幣五萬元以上二十萬元以下罰鍰，並禁止其活動。\n具營利性質者未依主管機關所定保險金額，投保責任保險者，處新臺幣三萬元以上十五萬元以下罰鍰，並禁止其活動。","versions":[{"bill":"202110046530000","text":"於公告警示區域從事水域遊憩活動或不遵守水域遊憩活動管理機關對有關水域遊憩活動所為種類、範圍、時間及行為之限制命令者，由其水域遊憩活動管理機關處新臺幣三千元以上一萬元以下罰鍰。","note":"本條例以促進觀光發展為目的，授權管理機關針對公告警示區域施以適度罰鍰達到警示及提醒效益。"}],"changed":false,"final":"於公告禁止區域從事水域遊憩活動或不遵守水域遊憩活動管理機關對有關水域遊憩活動所為種類、範圍、時間及行為之限制命令者，由其水域遊憩活動管理機關處新臺幣一萬元以上五萬元以下罰鍰，並禁止其活動。\n前項行為具營利性質者，處新臺幣五萬元以上二十萬元以下罰鍰，並禁止其活動。\n具營利性質者未依主管機關所定保險金額，投保責任保險者，處新臺幣三萬元以上十五萬元以下罰鍰，並禁止其活動。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第七十條之二","current":"於本條例中華民國一百零四年一月二十二日修正施行前，非以營利為目的且供特定對象住宿之場所而有營利之事實者，應自本條例修正施行之日起十年內，向地方主管機關申請旅館業登記、領取登記證及專用標識，始得繼續營業。","versions":[{"bill":"202110036690000","text":"於本條例中華民國一百零四年一月二十二日修正施行前，非以營利為目的且供特定對象住宿之場所而有營業之事實者，應自本修正條文公布之日起一年內由中央主管機關訂定特定對象住宿管理辦法管理之。","note":"一、依民國104年增訂發展觀光條例第七十條之二，適用對象包括：國軍英雄館、教師會館、勞工育樂中心、林務局招待所、農委會森林遊樂區、青年活動中心、公教會館、警光會館、公私立學學校實習旅館與會館、廟宇香客大樓、醫院、及其他（農場、度假村、私人教育園區）等12類單位團體，均須於114年2月4日前取得旅館執照，始得繼續營業。\n二、上開住宿設施之管理，涉及土地使用分區管制與建築物允許使用項目等，依修法政府機關、學校不可做商業登記，其機關用地、學校用地、文教用地亦不可變更為旅館用地。足證該項修法明顯窒礙難行，同時該等場所服務之特定對象如國軍、教師、勞工、青年學生、香客、登山客、公教人員等，未來前述對象住宿場所將全數關閉，嚴重限縮影響休閒旅遊觀光產業。\n三、綜上，因土地地目變更及取得旅館執照所需其他要件均顯非可能，此所以修法九年後仍無法取得旅館執照的原因，故前述場所明顯無法於期限內取得旅館執照，必須關門。爰考量適用發展觀光條例第七十條之二特定對象住宿經營者及困境，擬修法授權主管機關訂定「特定對象住宿管理辦法」管理之。"},{"bill":"202110044950000","text":"於本條例中華民國一百零四年一月二十二日修正施行前，非以營利為目的且供特定對象住宿之場所而有營業之事實者，應予展延五年至一百十九年一月二十一日，自本修正條文公布之日起一年內由中央主管機關訂定本法於民國一百零四年前原列之特定對象住宿管理辦法統一管理之。","note":"一、依民國104年增訂發展觀光條例第七十條之二，適用對象包括：國軍英雄館、教師會館、勞工育樂中心、林務局招待所、農委會森林遊樂區、青年活動中心、公教會館、警光會館、公私立學學校實習旅館與會館、廟宇香客大樓、醫院、及其他（農場、度假村、私人教育園區）等12類單位團體，均須於114年2月4日前取得旅館執照，始得繼續營業。\n二、上開住宿設施之管理，涉及土地使用分區管制與建築物允許使用項目等，依法政府機關、學校不可做商業登記，其機關用地、學校用地、文教用地亦不可變更為旅館用地。足證該項修法明顯窒礙難行，同時該等場所服務之特定對象如國軍、教師、勞工、青年學生、香客、登山客、公教人員等，未來前述對象住宿場所將全數關閉，嚴重限縮影響休閒旅遊觀光產業。\n三、綜上，因土地地目變更及取得旅館執照所需其他要件均顯非可能，此所以修法九年後仍無法取得旅館執照的原因，故前述場所明顯無法於期限內取得旅館執照，必須關門。爰考量適用發展觀光條例第七十條之二特定對象住宿經營者之困境，擬修法授權主管機關訂定「特定對象住宿管理辦法」管理之。"},{"bill":"202110047210000","text":"於本條例中華民國一百零四年一月二十二日修正施行前，非以營利為目的且供特定對象住宿之場所而有營利之事實者，應自本條例修正施行之日起十五年內，向地方主管機關申請旅館業登記、領取登記證及專用標識，始得繼續營業。","note":"依民國104年增訂發展觀光條例第七十條之二條文之適用對象包括：國軍英雄館、教師會館、勞工育樂中心、林務局招待所、農委會森林遊樂區、青年活動中心、公教會館、警光會館、公私立學校實習旅館與會館、廟宇香客大樓、醫院、及其他（農場、度假村、私人教育園區）等12類單位團體，均須於114年1月22日前取得旅館執照，始得繼續營業。惟因近年全球遭遇新冠疫情，導致各特定對象住宿場所遭遇各種問題，致難以在10年內完成申請旅館登記，如無法即時修訂，將面臨停業，影響從業人員生計甚鉅，故爰擬具展延5年，以利輔導上述單位取得合法證照或轉型，維護員工權益，照顧民生。"},{"bill":"202110053640000","text":"於本條例中華民國一百零四年一月二十二日修正施行前，非以營利為目的且供特定對象住宿之場所而有營利之事實者，應自本條例修正施行之日起十五年內，向地方主管機關申請旅館業登記、領取登記證及專用標識，始得繼續營業。","note":"一、本條條文修正。\n二、依一百零四年增訂發展觀光條例第七十條之二，適用對象包括：國軍英雄館、教師會館、勞工育樂中心、林務局招待所、農業部森林遊樂區、青年活動中心、公教會館、警光會館、公私立學校實習旅館與會館、廟宇香客大樓、及其他（農場、度假村、私人教育園區）等十二類單位團體，均應於一百十四年一月二十二日前取得旅館執照，始得繼續營業。\n三、上開條文之刪除及增訂，係一百零四年立委提案，並經立法院三讀通過及總統一百零四年二月四日公布。\n四、惟期間全球遭新冠疫情肆虐三年，各特定住宿場所（如：救國團）如因申請資格、營運不濟、不符土地管制、都市計畫變更或建管法令，致難於十年內完成申請旅館登記，影響單位包括國軍英雄館、教師會館、香客大樓、救國團青年活動中心及學校實習旅館等，如無法即時修訂，將面臨停業，影響從業人員生計甚鉅，故修正再延長五年，以利輔導上述單位取得合法證照或轉型，維護員工權益與照顧民生。"}],"changed":true,"final":"於本條例中華民國一百零四年一月二十二日修正施行前，非以營利為目的且供特定對象住宿之場所而有營利之事實者，應自本條例修正施行之日起十年，再展延五年至一百十九年一月二十一日，向地方主管機關申請旅館業登記、領取登記證及專用標識，始得繼續營業。","finalWhy":"","review":{"note":"照委員陳雪生等29人提案通過","text":"於本條例中華民國一百零四年一月二十二日修正施行前，非以營利為目的且供特定對象住宿之場所而有營業之事實者，應予展延五年至一百十九年一月二十一日，自本修正條文公布之日起一年內由中央主管機關訂定本法於民國一百零四年前原列之特定對象住宿管理辦法統一管理之。"}}],"stages":[{"date":"2024-04-26","stage":"一讀","code":"院會-11-1-11","bill":"202110036690000","gazref":"113卷031期5213號 11-11頁"},{"date":"2024-05-17","stage":"一讀","code":"院會-11-1-14","bill":"202110044950000","gazref":"113卷044期5226號 4-4頁"},{"date":"2024-05-17","stage":"一讀","code":"院會-11-1-14","bill":"202110046530000","gazref":"113卷044期5226號 4-4頁"},{"date":"2024-05-17","stage":"一讀","code":"院會-11-1-14","bill":"202110047210000","gazref":"113卷044期5226號 6-7頁"},{"date":"2024-06-07","stage":"一讀","code":"院會-11-1-17","bill":"202110053640000","gazref":"113卷054期5236號 2-2頁"},{"date":"2024-09-27","stage":"一讀","code":"院會-11-2-2","bill":"202110067890000","gazref":"113卷076期5258號 5-6頁"},{"date":"2024-10-25","stage":"一讀","code":"院會-11-2-6","bill":"202110072830000","gazref":"113卷084期5266號 16-16頁"},{"date":"2024-11-18","code":"委員會-11-2-23-10","title":"第11屆第2會期交通委員會第10次全體委員會議","gazref":"113卷103期5285號二冊 151-290頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024111530/details?meetingDate=113/11/18","full":["https://ivod.ly.gov.tw/Play/Full/1M/16276"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/Si <script>

  '復議': {t: '復議', sub: '要求把已經表決的案子重新討論', what: '議案表決之後，當初投贊成的一方可以提出復議，要求重新討論、重新表決。', pts: [
    '復議被否決之後，同一個案子不能再提復議，決議就此確定。',
    '實務上常見多數方自己提出復議、再自己否決，目的是讓剛通過的條文確定下來。']},
  '重付表決': {t: '重付表決', sub: '對表決結果有異議，再表決一次', what: '出席委員對表決結果有異議時，經 15 人以上連署或附議，可以要求重新表決。', pts: ['以一次為限。']},
  '修正動議': {t: '修正動議', sub: '在院會對條文提出的修改案', what: '委員或黨團在二讀（或三讀）時，對討論中的條文提出另一個版本的文字，交院會表決。', pts: ['需要 10 人以上連署或附議。']},
  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
