<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鐵路法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

則全體原住民族較全國少7.7歲、男性原住民少8.9歲、女性少6.7歲。考量近年相關年金制度，舉凡「國民年金法第五十三條」、「公務人員退休資遣撫卹法第十七條」、「公立學校教職員退休資遣撫卹條例第十八條」、「農民退休儲金條例第十五條」皆已規定原住民於55歲即可退休請領相關年金或可支領相關儲金等制度，爰參酌上開法律規定及其等立法意旨。為嘉惠原住民族且具體落實憲法增修條文第十條第十二條之規定：「國家應依民族意願，保障原住民族之地位及政治參與，並對其教育文化、交通水利、衛生醫療、經濟土地及社會福利事業予以保障扶助並促其發展……。」及實踐憲法上實質公平原則，爰擬具「鐵路法第二十六條及第三十五條條文修正草案」。是否有當？敬請公決。","arts":["第二十六條","第三十五條"]},{"id":"202110128330000","who":"委員張宏陸等18人","date":"2025-05-23","name":"「鐵路法第六十五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110128330000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/13/LCEWA01_110313_00073.pdf","proposers":["張宏陸"],"ncosign":17,"people":[["張宏陸","民進黨","提案"],["郭國文","民進黨","連署"],["林楚茵","民進黨","連署"],["陳俊宇","民進黨","連署"],["蔡易餘","民進黨","連署"],["陳亭妃","民進黨","連署"],["林宜瑾","民進黨","連署"],["黃捷","民進黨","連署"],["李柏毅","民進黨","連署"],["黃秀芳","民進黨","連署"],["蘇巧慧","民進黨","連署"],["沈伯洋","民進黨","連署"],["王美惠","民進黨","連署"],["林俊憲","民進黨","連署"],["鍾佳濱","民進黨","連署"],["張雅琳","民進黨","連署"],["吳秉叡","民進黨","連署"],["吳琪銘","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員張宏陸等18人，鑒於隨著網路與科技快速發展，不法分子藉由程式工具、大量帳號或不正手段，於各式訂票系統搶購票券再加價轉售牟利，即俗稱之黃牛行為，造成一般民眾無法取得正常票券，嚴重影響社會公平秩序及購票權益。立法院已完成修正《文化創意產業發展法》及《運動產業發展條例》，惟經查現行《鐵路法》第六十五條對於此類行為雖有規範，然其罰鍰額度為每張票面價格之五倍至三十倍，明顯較《文化創意產業發展法》及《運動產業發展條例》中票面金額之十倍至五十倍罰鍰為輕，且缺乏吹哨者與檢舉獎勵相關條文。同時為有效嚇阻黃牛行為，應比照《文化創意產業發展法》第十條之一及《運動產業發展條例》第二十四條之一，爰擬具「鐵路法第六十五條條文修正草案」。是否有當？敬請公決。","arts":["第六十五條"]},{"id":"202110146340000","who":"台灣民眾黨黨團","date":"2025-07-18","name":"「鐵路法第五十六條之四、第六十七條之三及第六十八條之四條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110146340000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/21/LCEWA01_110321_00185.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"本院台灣民眾黨黨團，有鑑於鐵路設施為我國重要關鍵基礎設施，惟鐵路從業人員執勤時受攻擊案件之數量，自111年2件、112年2件、113年7件，近三年來對鐵路從業人員攻擊案件暴增近2.5倍，且僅就114年上半年而言，更已發生5起對鐵路從業人員之攻擊案件；另揆諸臺灣鐵路公司七個月以來已發生十起人為疏失導致之調車事故，亦足徵相關鐵路機關對於內部從業人員之基礎訓練有所不足，上開缺失非但嚴重影響鐵路從業人員執勤時之安全性，更有危害鐵路運輸安全之虞，遂為保障鐵路從業人員之職場安全與鐵路營運時之乘車秩序，爰擬具「鐵路法第五十六條之四、第六十七條之三及第六十八條之四條文修正草案」。是否有當？敬請公決。","arts":["第五十六條之四","第六十七條之三","第六十八條之四"]},{"id":"202110171050000","who":"委員洪孟楷等19人","date":"2025-11-07","name":"「鐵路法第六十八條之四及第七十二條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110171050000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/08/LCEWA01_110408_00052.pdf","proposers":["洪孟楷","黃健豪","蘇清泉"],"ncosign":16,"people":[["洪孟楷","國民黨","提案"],["黃健豪","國民黨","提案"],["蘇清泉","國民黨","提案"],["徐巧芯","國民黨","連署"],["顏寬恒","國民黨","連署"],["鄭正鈐","國民黨","連署"],["邱若華","國民黨","連署"],["林德福","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["丁學忠","國民黨","連署"],["涂權吉","國民黨","連署"],["賴士葆","國民黨","連署"],["陳菁徽","國民黨","連署"],["王育敏","國民黨","連署"],["黃建賓","國民黨","連署"],["翁曉玲","國民黨","連署"],["陳永康","國民黨","連署"],["柯志恩","國民黨","連署"],["李彥秀","國民黨","連署"]],"party":[["國民黨",19]],"reason":"本院委員洪孟楷、黃健豪、蘇清泉等19人，有鑑於鐵路從業人員遭民眾謾罵、騷擾，或施以暴力等不當行為頻繁發生，進而妨礙從業人員執行職務，亦對其身心安全及健康構成嚴重威脅。同時，凸顯第一線員工依法執勤、盡心服務的職場安全環境亟需通盤檢討。為維護旅運品質及公共安全，爰擬具「鐵路法第六十八條之四及第七十二條條文修正草案」，明定任何人不得以強暴、脅迫、恐嚇、公然侮辱或其他非法之方法，妨害鐵路從業人員執行職務；違反者，應課予刑責，且鐵路從業人員得拒絕運送；向旅客解除運送契約後，交通部得委託警察機關或鐵路機構執行之，現行犯者由警察機關排除或制止之；如涉及刑事責任者，應移送司法機關偵辦。是否有當？敬請公決。","arts":["第六十八條之四","第七十二條"]},{"id":"202110171860000","who":"委員廖先翔等25人","date":"2025-11-14","name":"「鐵路法第五十七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110171860000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/09/LCEWA01_110409_00023.pdf","proposers":["廖先翔","林沛祥"],"ncosign":23,"people":[["廖先翔","國民黨","提案"],["林沛祥","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","連署"],["賴士葆","國民黨","連署"],["黃健豪","國民黨","連署"],["陳玉珍","國民黨","連署"],["馬文君","國民黨","連署"],["牛煦庭","國民黨","連署"],["林思銘","國民黨","連署"],["謝龍介","國民黨","連署"],["游顥","國民黨","連署"],["羅智強","國民黨","連署"],["翁曉玲","國民黨","連署"],["陳雪生","國民黨","連署"],["邱若華","國民黨","連署"],["林德福","國民黨","連署"],["林倩綺","國民黨","連署"],["張啓楷","民眾黨","連署"],["劉書彬","民眾黨","連署"],["林國成","民眾黨","連署"],["麥玉珍","民眾黨","連署"],["洪孟楷","國民黨","連署"],["羅廷瑋","國民黨","連署"],["顏寬恒","國民黨","連署"],["高金素梅","無黨籍","連署"]],"party":[["國民黨",20],["民眾黨",4],["無黨籍",1]],"reason":"本院委員廖先翔、林沛祥等25人，有鑑於平溪區為我國重要國際觀光景區，天燈文化活動結合平溪鐵路已成為我國觀光代表意象之一，惟現行《鐵路法》第五十七條，對於鐵路運行安全雖有嚴格規範，然阻礙地方觀光發展、居民通行及救災防治需求，為兼顧鐵路運輸安全、地方觀光文化永續發展，並保障當地居民生活需求及公共安全，爰擬具「鐵路法第五十七條條文修正草案」。是否有當？敬請公決。","arts":["第五十七條"]},{"id":"202110174230000","who":"委員邱鎮軍等23人","date":"2025-11-21","name":"「鐵路法增訂第六十八條之四條文草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110174230000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/10/LCEWA01_110410_00158.pdf","proposers":["邱鎮軍","林沛祥","羅廷瑋"],"ncosign":20,"people":[["邱鎮軍","國民黨","提案"],["林沛祥","國民黨","提案"],["羅廷瑋","國民黨","提案"],["蘇清泉","國民黨","連署"],["鄭正鈐","國民黨","連署"],["陳菁徽","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["賴士葆","國民黨","連署"],["涂權吉","國民黨","連署"],["盧縣一","國民黨","連署"],["牛煦庭","國民黨","連署"],["羅智強","國民黨","連署"],["林倩綺","國民黨","連署"],["陳超明","無黨籍","連署"],["林思銘","國民黨","連署"],["洪孟楷","國民黨","連署"],["邱若華","國民黨","連署"],["馬文君","國民黨","連署"],["謝龍介","國民黨","連署"],["陳昭姿","民眾黨","連署"],["翁曉玲","國民黨","連署"],["高金素梅","無黨籍","連署"],["顏寬恒","國民黨","連署"]],"party":[["國民黨",20],["無黨籍",2],["民眾黨",1]],"reason":"本院委員邱鎮軍、林沛祥等20人，有鑑於近來鐵路從業人員屢屢發生遭民眾暴力攻擊等不當行為，妨礙鐵路運營安全，亦對旅客及從業人員身心安全構成嚴重威脅。然現行相關法律規定不足，形成保護之缺口。為維護旅運品質，防範鐵道運輸暴力事件，保障第一線工作人員安全，爰擬具「鐵路法增訂第六十八條之四條文草案」。是否有當？敬請公決。","arts":["第六十八條之四"]}],"arts":[{"no":"第二十六條","current":"國營鐵路運價率之計算公式，由交通部擬訂，報請行政院送請立法院審定之；變更時亦同。\n國營鐵路之運價，按前項公式計算，由交通部報請行政院核定實施；變更時亦同。\n國營鐵路如環境或情形特殊者，得規定較低運價；在工程時期之臨時營業，得規定臨時運價，均由交通部核定之。","versions":[{"bill":"202110102690000","text":"國營鐵路運價率之計算公式，由交通部擬訂，報請行政院送請立法院審定之；變更時亦同。\n國營鐵路之運價，按前項公式計算，由交通部報請行政院核定實施；變更時亦同。\n國營鐵路如環境或情形特殊者，得規定較低運價；在工程時期之臨時營業，得規定臨時運價，均由交通部核定之。\n旅客為年滿五十五歲之原住民者，應享有優待車票。","note":"一、針對國營鐵路，本條增訂第四項。\n二、查原住民族委員會委託財團法人國家衛生研究院辦理「109年原住民族人口及健康統計年報」（113年1月版）報告資料指出，民國109年原住民族零歲平均餘命，全體為73.7歲、男性69.2歲、女性78.1歲（與108年相比，整體零歲平均餘命增加0.6歲、男性較108年增加0.5歲、女性較108年增加0.6歲）。加以對照，全國109年人口零歲平均餘命，全體為81.3歲、男性為78.1歲，女性為84.8歲，故相較之下，全體原住民族與全國平均壽命之差距，經實際數字計算後四捨五入至小數點第一位，則全體原住民族較全國少7.7歲、男性原住民少8.9歲、女性少6.7歲。\n三、鑑於，近年相關年金制度，舉凡「國民年金法第五十三條」、「公務人員退休資遣撫卹法第十七條」、「公立學校教職員退休資遣撫卹條例第十八條」、「農民退休儲金條例第十五條」皆已規定原住民於55歲即可退休請領相關年金或可支領相關儲金等制度，爰參酌上開法律規定及其等立法意旨。為嘉惠原住民族且具體落實憲法增修條文第十條第十二條之規定：「國家應依民族意願，保障原住民族之地位及政治參與，並對其教育文化、交通水利、衛生醫療、經濟土地及社會福利事業予以保障扶助並促其發展……。」及實踐憲法上實質公平原則，爰增訂第四項之規定。"}],"changed":false,"final":"國營鐵路運價率之計算公式，由交通部擬訂，報請行政院送請立法院審定之；變更時亦同。\n國營鐵路之運價，按前項公式計算，由交通部報請行政院核定實施；變更時亦同。\n國營鐵路如環境或情形特殊者，得規定較低運價；在工程時期之臨時營業，得規定臨時運價，均由交通部核定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第三十五條","current":"地方營及民營鐵路之運價，由交通部核定；增減時亦同。","versions":[{"bill":"202110102690000","text":"地方營及民營鐵路之運價，由交通部核定；增減時亦同。\n旅客為年滿五十五歲之原住民者，應享有優待車票。","note":"一、針對地方營及民營鐵路，本條增訂第二項。\n二、查原住民族委員會委託財團法人國家衛生研究院辦理「109年原住民族人口及健康統計年報」（113年1月版）報告資料指出，民國109年原住民族零歲平均餘命，全體為73.7歲、男性69.2歲、女性78.1歲（與108年相比，整體零歲平均餘命增加0.6歲、男性較108年增加0.5歲、女性較108年增加0.6歲）。加以對照，全國109年人口零歲平均餘命，全體為81.3歲、男性為78.1歲，女性為84.8歲，故相較之下，全體原住民族與全國平均壽命之差距，經實際數字計算後四捨五入至小數點第一位，則全體原住民族較全國少7.7歲、男性原住民少8.9歲、女性少6.7歲。\n三、鑑於，近年相關年金制度，舉凡「國民年金法第五十三條」、「公務人員退休資遣撫卹法第十七條」、「公立學校教職員退休資遣撫卹條例第十八條」、「農民退休儲金條例第十五條」皆已規定原住民於55歲即可退休請領相關年金或可支領相關儲金等制度，爰參酌上開法律規定及其等立法意旨。為嘉惠原住民族且具體落實憲法增修條文第十條第十二條之規定：「國家應依民族意願，保障原住民族之地位及政治參與，並對其教育文化、交通水利、衛生醫療、經濟土地及社會福利事業予以保障扶助並促其發展……。」及實踐憲法上實質性公平原則，爰增訂第二項之規定。"}],"changed":false,"final":"地方營及民營鐵路之運價，由交通部核定；增減時亦同。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第四十條","current":"地方營、民營及專用鐵路機構遇有重大行車事故或嚴重遲延，應立即通報交通部鐵道局，並隨時將經過情形報請查核；其一般行車事故及異常事件，亦應按月彙報。\n前項重大行車事故、一般行車事故、嚴重遲延及異常事件之定義、通報內容、通報方式及其他相關事項之準則，由主管機關定之。\n交通部鐵道局得就鐵路機構按第一項規定所提報告內容，要求鐵路機構負責人或相關主管說明。\n鐵路機構應就行車事故及異常事件訂定應變計畫，其內容應包括現場處置、通報作業、旅客訊息公告、旅客疏散或接駁、人員救護、運轉調度、搶修救援之人力調度、危險物品之排除、鐵道淨空安全與器材備置。\n鐵路機構應按應變計畫定期實施演練，並作檢討及改善。\n交通部鐵道局得就鐵路機構所訂應變計畫之內容及定期與不定期演練情形予以查核，如認為辦理不善，應命其限期改善。\n鐵路機構辦理第一項通報時，並應依運輸事故調查法同時向國家運輸安全調查委員會辦理通報。","versions":[{"bill":"202110013190000","text":"地方營、民營及專用鐵路機構遇有重大行車事故或嚴重遲延，應立即通報交通部鐵道局，隨時將經過情形報請查核，並啟動旅客接駁應變計畫；其一般行車事故及異常事件，亦應按月彙報。\n前項重大行車事故、一般行車事故、嚴重遲延及異常事件之定義、通報內容、通報方式及其他相關事項之準則，由主管機關定之。\n交通部鐵道局得就鐵路機構按第一項規定所提報告內容，要求鐵路機構負責人或相關主管說明。\n鐵路機構應就行車事故及異常事件訂定應變計畫，其內容應包括現場處置、通報作業、旅客訊息公告、旅客疏散或接駁、人員救護、運轉調度、搶修救援之人力調度、危險物品之排除、鐵道淨空安全與器材備置。\n鐵路機構應按應變計畫定期實施演練，並作檢討及改善。\n交通部鐵道局得就鐵路機構所訂應變計畫之內容及定期與不定期演練情形予以查核，如認為辦理不善，應命其限期改善。\n鐵路機構辦理第一項通報時，並應依運輸事故調查法同時向國家運輸安全調查委員會辦理通報。","note":"一、本法現於第四十條第四項規範鐵路機構應就行車事故及異常事件訂定應變計畫，其內容包括旅客疏散或接駁作業。\n二、就實務面觀之，國營臺灣鐵路股份有限公司每逢嚴重遲延時，儘管形式上具有旅客接駁計畫，卻非每次啟動，導致大量旅客僅能自行選擇替代性交通工具，若遇平日通勤尖峰時刻，確帶來相當大困擾。\n三、綜上所述，鐵路機構於遭遇嚴重遲延時，應強制其立即啟動旅客接駁應變計畫，將民眾影響降至最低。"}],"changed":true,"final":"地方營、民營及專用鐵路機構遇有重大行車事故或嚴重遲延，應立即通報交通部鐵道局，隨時將經過情形報請查核，並啟動旅客接駁應變計畫；其一般行車事故及異常事件，亦應按月彙報。\n前項重大行車事故、一般行車事故、嚴重遲延及異常事件之定義、通報內容、通報方式及其他相關事項之準則，由主管機關定之。\n交通部鐵道局得就鐵路機構按第一項規定所提報告內容，要求鐵路機構負責人或相關主管說明。\n鐵路機構應就行車事故及異常事件訂定應變計畫，其內容應包括現場處置、通報作業、旅客訊息公告、旅客疏散或接駁、人員救護、運轉調度、搶修救援之人力調度、危險物品之排除、鐵道淨空安全與器材備置。\n鐵路機構應按應變計畫定期實施演練，並作檢討及改善。\n交通部鐵道局得就鐵路機構所訂應變計畫之內容及定期與不定期演練情形予以查核，如認為辦理不善，應命其限期改善。\n鐵路機構辦理第一項通報時，並應依運輸事故調查法同時向國家運輸安全調查委員會辦理通報。","finalWhy":"一、本法現於第四十條第四項規範鐵路機構應就行車事故及異常事件訂定應變計畫，其內容包括旅客疏散或接駁作業。\n二、就實務面觀之，國營臺灣鐵路股份有限公司每逢嚴重遲延時，儘管形式上具有旅客接駁計畫，卻非每次啟動，導致大量旅客僅能自行選擇替代性交通工具，若遇平日通勤尖峰時刻，確帶來相當大困擾。\n三、綜上所述，鐵路機構於遭遇嚴重遲延時，應強制其立即啟動旅客接駁應變計畫，將民眾影響降至最低。","review":{"note":"照委員陳俊宇等24人提案通過","text":"地方營、民營及專用鐵路機構遇有重大行車事故或嚴重遲延，應立即通報交通部鐵道局，隨時將經過情形報請查核，並啟動旅客接駁應變計畫；其一般行車事故及異常事件，亦應按月彙報。\n前項重大行車事故、一般行車事故、嚴重遲延及異常事件之定義、通報內容、通報方式及其他相關事項之準則，由主管機關定之。\n交通部鐵道局得就鐵路機構按第一項規定所提報告內容，要求鐵路機構負責人或相關主管說明。\n鐵路機構應就行車事故及異常事件訂定應變計畫，其內容應包括現場處置、通報作業、旅客訊息公告、旅客疏散或接駁、人員救護、運轉調度、搶修救援之人力調度、危險物品之排除、鐵道淨空安全與器材備置。\n鐵路機構應按應變計畫定期實施演練，並作檢討及改善。\n交通部鐵道局得就鐵路機構所訂應變計畫之內容及定期與不定期演練情形予以查核，如認為辦理不善，應命其限期改善。\n鐵路機構辦理第一項通報時，並應依運輸事故調查法同時向國家運輸安全調查委員會辦理通報。"}},{"no":"第五十六條之四","current":"鐵路機構應有效訓練及管理從業人員，使其具備鐵路專業、作業安全、維安應變及衛生防疫輔助技能，並確切瞭解及嚴格遵守鐵路法令。於新進機車車輛或涉及安全之行車設備、維安輔助設備、衛生防疫輔助設備或技術投入營運前，亦同。\n鐵路機構應對行車人員之技能、體格及精神狀態，施行派任前檢查、定期檢查及臨時檢查；經檢查不合基準者，不得派任。已派任者，應暫停或調整其職務。\n前項鐵路行車人員之定義、應實施之訓練、技能檢定、體格與精神狀態檢查、實施之方式、項目、週期、合格基準與不合格時之處理及其他應遵行事項之規則，由交通部定之。","versions":[{"bill":"202110146340000","text":"鐵路機構應採取必要措施，確保從業人員執行鐵路業務時之安全；並應有效訓練及管理從業人員，使其具備鐵路專業、作業安全、維安應變及衛生防疫輔助技能，並確切瞭解及嚴格遵守鐵路法令。於新進機車車輛或涉及安全之行車設備、維安輔助設備、衛生防疫輔助設備或技術投入營運前，亦同。\n鐵路機構應對行車人員之技能、體格及精神狀態，施行派任前檢查、定期檢查及臨時檢查；經檢查不合基準者，不得派任。已派任者，應暫停或調整其職務。\n前項鐵路行車人員之定義、應實施之訓練、技能檢定、體格與精神狀態檢查、實施之方式、項目、週期、合格基準與不合格時之處理及其他應遵行事項之規則，由交通部定之。","note":"一、修正本條第一項。\n二、揆諸本法第五十六條之四之立法目的，本即係希望藉由相關培訓，提升鐵路從業人員執勤時安全性，直、間接保障鐵路行車與大眾運輸之安全；惟查，近年來旅、乘客於車站、列車內攻擊鐵路從業人員事件依然頻傳。僅就臺灣鐵路公司而言，相關攻擊案件數，自111年2件、112年2件、113年7件，暴增2.5倍；而114年截至5月為止，更已發生至少5件攻擊事件，顯見相關針對鐵路從業人員之暴力案件已日趨嚴重。\n三、復審酌鐵路從業人員執勤時所從事之業務，除有包括監督列車正常運行、處理緊急突發事故、協助乘客疏散、執行安全規定等，均係為確保站內秩序與列車營運時之行車安全，如僅仰賴從業人員個人訓練，而未促使鐵路機構為更積極之介入，如提供保安等輔助人力或密錄器等輔助設備，提供從業人員周全之保護，對於從業人員之人身安全保障恐未盡周延。綜上所述，爰參考職業安全衛生法之立法例，新增第一項前段，明文化鐵路機構之保護義務。"}],"changed":true,"final":"鐵路機構應採取必要措施，確保從業人員執行鐵路業務時之安全；並應有效訓練及管理從業人員，使其具備鐵路專業、作業安全、維安應變及衛生防疫輔助技能，並確切瞭解及嚴格遵守鐵路法令。於新進機車車輛或涉及安全之行車設備、維安輔助設備、衛生防疫輔助設備或技術投入營運前，亦同。\n鐵路機構應對行車人員之技能、體格及精神狀態，施行派任前檢查、定期檢查及臨時檢查；經檢查不合基準者，不得派任。已派任者，應暫停或調整其職務。\n前二項鐵路從業人員及行車人員之定義、應實施之訓練、技能檢定、體格與精神狀態檢查、實施之方式、項目、週期、合格基準與不合格時之處理及其他應遵行事項之規則，由交通部定之。","finalWhy":"","review":{"note":"照台灣民眾黨黨團提案修正通過","text":"鐵路機構應採取必要措施，確保從業人員執行鐵路業務時之安全；並應有效訓練及管理從業人員，使其具備鐵路專業、作業安全、維安應變及衛生防疫輔助技能，並確切瞭解及嚴格遵守鐵路法令。於新進機車車輛或涉及安全之行車設備、維安輔助設備、衛生防疫輔助設備或技術投入營運前，亦同。\n鐵路機構應對行車人員之技能、體格及精神狀態，施行派任前檢查、定期檢查及臨時檢查；經檢查不合基準者，不得派任。已派任者，應暫停或調整其職務。\n前二項鐵路從業人員及行車人員之定義、應實施之訓練、技能檢定、體格與精神狀態檢查、實施之方式、項目、週期、合格基準與不合格時之處理及其他應遵行事項之規則，由交通部定之。"}},{"no":"第五十六條之五","current":"鐵路機構對於鐵路運轉中發生之事故及異常事件，應蒐集資料及調查研究發生原因，採取適當之預防及改進措施，備供交通部鐵道局查驗。\n鐵路機構應根據前一年度之事故及異常事件檢討結果，於每年第一季結束前，向交通部鐵道局提出當年度安全管理報告；其報告內容應包括下列事項：\n一、鐵路機構營運之安全理念及目標。\n二、安全管理之組織架構及實施方式。\n三、為確保及提升營運安全所採取或擬採取之措施。\n四、事故與異常事件之檢討及預防措施。\n五、其他與營運安全有關之重要事項。\n鐵路機構就其營運列車之行車運轉、列車監控及維修保養之紀錄，應有效保存；其保存之項目、期限及管理事項由主管機關定之。\n鐵路機構及相關人員另應依運輸事故調查法配合國家運輸安全調查委員會辦理調查。","versions":[{"bill":"202110072480000","text":"鐵路機構對於鐵路運轉中發生之事故及異常事件，應蒐集資料及調查研究發生原因，採取適當之預防及改進措施，備供交通部鐵道局查驗。\n鐵路機構應建置營運安全管理系統，並根據前一年度之事故及異常事件檢討結果，於每年第一季結束前，向交通部鐵道局提出當年度安全管理報告；其報告內容應包括下列事項：\n一、鐵路機構營運之安全理念及目標。\n二、安全管理之組織架構及實施方式。\n三、為確保及提升營運安全所採取或擬採取之措施。\n四、事故與異常事件之檢討及預防措施。\n五、其他與營運安全有關之重要事項。\n鐵路機構就其營運列車之行車運轉、列車監控及維修保養之紀錄，應有效保存；其保存之項目、期限及管理事項由主管機關定之。\n鐵路機構及相關人員另應依運輸事故調查法配合國家運輸安全調查委員會辦理調查。\n營運安全管理系統作業規範，由交通部定之。","note":"一、明定鐵路機構應建置營運安全管理系統。\n二、營運安全管理系統範圍、內容、建置細則等作業規範，由交通部另訂之。"}],"changed":true,"final":"鐵路機構對於鐵路運轉中發生之事故及異常事件，應蒐集資料及調查研究發生原因，採取適當之預防及改進措施，備供交通部鐵道局查驗。\n鐵路機構應建置安全管理系統，並根據前一年度之事故及異常事件檢討結果，於每年第一季結束前，向交通部鐵道局提出當年度安全管理報告；其報告內容應包括下列事項：\n一、鐵路機構營運之安全理念及目標。\n二、安全管理之組織架構及實施方式。\n三、為確保及提升營運安全所採取或擬採取之措施。\n四、事故與異常事件之檢討及預防措施。\n五、其他與營運安全有關之重要事項。\n鐵路機構就其營運列車之行車運轉、列車監控及維修保養之紀錄，應有效保存；其保存之項目、期限及管理事項由主管機關定之。\n鐵路機構及相關人員另應依運輸事故調查法配合國家運輸安全調查委員會辦理調查。\n第二項安全管理系統相關事項之規則，由主管機關定之。","finalWhy":"","review":{"note":"照委員李昆澤等25人提案修正通過","text":"鐵路機構對於鐵路運轉中發生之事故及異常事件，應蒐集資料及調查研究發生原因，採取適當之預防及改進措施，備供交通部鐵道局查驗。\n鐵路機構應建置安全管理系統，並根據前一年度之事故及異常事件檢討結果，於每年第一季結束前，向交通部鐵道局提出當年度安全管理報告；其報告內容應包括下列事項：\n一、鐵路機構營運之安全理念及目標。\n二、安全管理之組織架構及實施方式。\n三、為確保及提升營運安全所採取或擬採取之措施。\n四、事故與異常事件之檢討及預防措施。\n五、其他與營運安全有關之重要事項。\n鐵路機構就其營運列車之行車運轉、列車監控及維修保養之紀錄，應有效保存；其保存之項目、期限及管理事項由主管機關定之。\n鐵路機構及相關人員另應依運輸事故調查法配合國家運輸安全調查委員會辦理調查。\n第二項安全管理系統相關事項之規則，由主管機關定之。"}},{"no":"第五十七條","current":"旅客乘車、託運人託運貨物、受貨人領取貨物，應遵守鐵路有關安全法令及站、車人員之指導。\n行人、車輛不得侵入鐵路路線、橋梁、隧道內及站區內非供公眾通行之處所。\n行人必須跨越鐵路路線時，應暫停、看、聽，注意兩方確無來車，始得通過。但鐵路電化區間，除天橋、地下道及平交道外，不得跨越。\n鐵路路線邊坡內及距軌道中心五公尺以內，嚴禁放牧牲畜。","versions":[{"bill":"202110038030000","text":"旅客乘車、託運人託運貨物、受貨人領取貨物，應遵守鐵路有關安全法令及站、車人員之指導。\n行人、車輛不得侵入鐵路路線、橋梁、隧道內及站區內非供公眾通行之處所。\n鐵路路線、橋梁為當地居民通行之必經通路且無公有道路替代者，不受前項限制，由主管機關另訂辦法。\n因鐵路路線設置導致既成道路無法通行，主管機關應滿足跨越鐵路路線之救災通行需求。\n行人必須跨越鐵路路線時，應暫停、看、聽，注意兩方確無來車，始得通過。但鐵路電化區間，除天橋、地下道及平交道外，不得跨越。\n鐵路路線邊坡內及距軌道中心五公尺以內，嚴禁放牧牲畜。","note":"一、增訂第五十七條第三項、第四項，原第三項順移至第五項。\n二、第三項之增訂是為因應鐵路路線、橋梁為為當地居民通行之必經通路且無公有道路替代之情況，解除其第二項「行人、車輛不得侵入鐵路路線、橋梁、隧道內及站區內非供公眾通行之處所。」之限制，但仍需由主管機關另訂辦法規範之。\n三、第四項之增訂是為因應因鐵路路線設置導致既成道路無法通行而影響救災時效之情況，賦予主管機關應滿足跨越鐵路路線之救災通行需求之義務。"},{"bill":"202110171860000","text":"旅客乘車、託運人託運貨物、受貨人領取貨物，應遵守鐵路有關安全法令及站、車人員之指導。\n行人、車輛不得侵入鐵路路線及場、站區內非供公眾通行之處所。但鐵路機構為民眾通行、疏散人潮、發展觀光、緊急救難或其他特殊需求另行公告開放之範圍不在此限。\n行人必須跨越鐵路路線時，應暫停、看、聽，注意兩方確無來車，始得通過。但鐵路電化區間，除天橋、地下道及平交道外，不得跨越。\n鐵路路線邊坡內及距軌道中心五公尺以內，嚴禁放牧牲畜。\n第二項但書規定之另行公告開放範圍，鐵路機構應於公告前檢具開放原因、開放範圍、開放時段及相關配套管理措施，報經交通部同意後始得為之；變更時，亦同。","note":"一、依據鐵路修建養護規則第二條規定，路線亦包含橋梁及隧道，爰刪除第二項橋梁與隧道等文字，改以路線統稱；並為與第六十八條之一第二款未經允許攜帶危險或易燃物進入之範圍統一，爰於該項增列「場」，即鐵路機構之維修基地、維修機廠等範圍，亦不得侵入，以達法規一致性。\n二、鑑於平溪區部分鐵道已成為地方觀光發展慣例，當地居民通行經常需跨越鐵道來往，為使居民可通行、疏散人潮、發展觀光、緊急救難或因應場站空間限制等，有局部開放行人、車輛進入鐵路路線或場、站區內非供公眾通行之處所之特殊需求，另鑑於地方居民、環境可能因觀光或其他需求造成人為損失、意外事故，爰於第二項後段增訂鐵路機構公告開放之特定路段及時段，行人及車輛可進入之但書，並增訂第五項有關鐵路機構報請主管機關同意開放行人、車輛通行之相關規定。"}],"changed":true,"final":"旅客乘車、託運人託運貨物、受貨人領取貨物，應遵守鐵路有關安全法令及站、車人員之指導。\n行人、車輛不得侵入鐵路路線及場、站區內非供公眾通行之處所。但鐵路非電化區間基於民眾通行、疏散人潮、發展觀光或其他特殊需求，經鐵路機構另行公告之範圍，不在此限。\n行人必須跨越鐵路路線時，應暫停、看、聽，注意兩方確無來車，始得通過。但鐵路電化區間，除天橋、地下道及平交道外，不得跨越。\n鐵路路線邊坡內及距軌道中心五公尺以內，嚴禁放牧牲畜。\n鐵路機構依第二項但書規定公告前，應檢具原因、範圍、時段及相關配套管理措施，報經交通部同意後，始得為之；變更時，亦同。","finalWhy":"照委員提案修正通過。,,","review":{"note":"照委員廖先翔等25人提案修正通過","text":"旅客乘車、託運人託運貨物、受貨人領取貨物，應遵守鐵路有關安全法令及站、車人員之指導。\n行人、車輛不得侵入鐵路路線及場、站區內非供公眾通行之處所。但鐵路非電化區間基於民眾通行、疏散人潮、發展觀光或其他特殊需求，經鐵路機構另行公告之範圍，不在此限。\n行人必須跨越鐵路路線時，應暫停、看、聽，注意兩方確無來車，始得通過。但鐵路電化區間，除天橋、地下道及平交道外，不得跨越。\n鐵路路線邊坡內及距軌道中心五公尺以內，嚴禁放牧牲畜。\n鐵路機構依第二項但書規定公告前，應檢具原因、範圍、時段及相關配套管理措施，報經交通部同意後，始得為之；變更時，亦同。"}},{"no":"第六十五條","current":"購買車票加價出售或換取不正利益圖利者，按車票張數，處每張車票價格之五倍至三十倍罰鍰。加價出售車票或取票憑證圖利者，亦同。\n以不正方法將虛偽資料或不正指令輸入電腦或其相關設備而購買車票、取得訂票或取票憑證者，處五年以下有期徒刑或科或併科新臺幣三百萬元以下罰金。","versions":[{"bill":"202110128330000","text":"購買車票加價出售或換取不正利益圖利者，按車票張數，處每張車票價格之十倍至五十倍罰鍰。加價出售車票或取票憑證圖利者，亦同。\n以不正方法將虛偽資料或不正指令輸入電腦或其相關設備而購買車票、取得訂票或取票憑證者，處五年以下有期徒刑或科或併科新臺幣三百萬元以下罰金。\n主管機關為調查或取締前二項違規事實，得洽請警察機關派員協助。\n主管機關對於檢舉查獲第一項、第二項規定之行為，除應對檢舉人身分資料嚴守秘密外，並得酌予獎勵。對於檢舉人身分資料之保密，於訴訟程序，亦同。\n前項主管機關受理檢舉案件之管轄、處理期間、保密、檢舉人獎勵及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為遏止以車票作為不正利益圖利，故其應比照《文化創意產業發展法》第十條之一及《運動產業發展條例》第二十四條之一加重罰鍰。\n二、新增第六十五條第三項明訂警察機關協助義務。基於交通秩序維護與防止不當牟利，主管機關於執行查緝任務時，得洽請警察機關協助派員，提升實地調查與證據蒐集之效率。\n三、參照《文化創意產業發展法》第十條之一及《運動產業發展條例》第二十四條之一規定，增設第四項及第五項有關檢舉獎勵及保密制度相關條文，鼓勵民眾揭發黃牛行為，同時保障檢舉人個資與人身安全，強化公民參與與違規舉發意願。並授權中央主管機關制定執行辦法，以符合法治國原則，確保行政執行之明確性與完整性。"}],"changed":true,"final":"車票加價出售或換取不正利益圖利者，按車票張數，處其運價之十倍至五十倍罰鍰。加價出售取票憑證圖利者，亦同。\n以不正方法將虛偽資料或不正指令輸入電腦或其相關設備而購買車票、取得訂票或取票憑證者，處五年以下有期徒刑或科或併科新臺幣三百萬元以下罰金。","finalWhy":"照委員修正動議通過。,,","review":{"note":"照委員李昆澤、張宏陸等4人所提修正動議通過","text":"車票加價出售或換取不正利益圖利者，按車票張數，處其運價之十倍至五十倍罰鍰。加價出售取票憑證圖利者，亦同。\n以不正方法將虛偽資料或不正指令輸入電腦或其相關設備而購買車票、取得訂票或取票憑證者，處五年以下有期徒刑或科或併科新臺幣三百萬元以下罰金。"}},{"no":"第六十七條之三","current":null,"versions":[{"bill":"202110146340000","text":"民營或國營鐵路機構違反第五十六條之四第一項或第六十四條準用第五十六條之四第一項規定，未採取必要措施，確保從業人員執行鐵路業務時之安全；或未有效訓練及管理從業人員，使其具備鐵路專業、作業安全、維安應變及衛生防疫輔助技能，並確切瞭解及嚴格遵守鐵路法令者，處新臺幣三萬元以上三十萬元以下之罰鍰。\n有前項情形者，應命其限期改善，屆期未改善者，按次連續處罰。","note":"一、本條新增。\n二、有鑑於臺灣鐵路公司於113年12月底至114年6月以來，七個月間業已發生10起人為疏失之調車事故，為求落實相關鐵路機構人員訓練之落實，並配合第五十六條之四修正課予鐵路機構保護從業人員之義務，遂就鐵路機構未落實保護義務部分，參考職業安全衛生法之立法例，明定相關罰則，並得按次處罰，以保障勞工職場權益與旅運安全。"}],"changed":true,"final":"民營或國營鐵路機構違反第五十六條之四第一項或第六十四條準用第五十六條之四第一項規定，未採取必要措施，確保從業人員執行鐵路業務時之安全；或未有效訓練及管理從業人員，使其具備鐵路專業、作業安全、維安應變及衛生防疫輔助技能，並確切瞭解及嚴格遵守鐵路法令者，處新臺幣三萬元以上三十萬元以下之罰鍰。\n有前項情形者，應命其限期改善，屆期未改善者，按次連續處罰。","finalWhy":"","review":{"note":"照台灣民眾黨黨團提案通過","text":"民營或國營鐵路機構違反第五十六條之四第一項或第六十四條準用第五十六條之四第一項規定，未採取必要措施，確保從業人員執行鐵路業務時之安全；或未有效訓練及管理從業人員，使其具備鐵路專業、作業安全、維安應變及衛生防疫輔助技能，並確切瞭解及嚴格遵守鐵路法令者，處新臺幣三萬元以上三十萬元以下之罰鍰。\n有前項情形者，應命其限期改善，屆期未改善者，按次連續處罰。"}},{"no":"第六十八條之四","current":null,"versions":[{"bill":"202110146340000","text":"以強暴、脅迫、恐嚇或其他非法之方法，妨礙鐵路從業人員執行鐵路業務，處三年以下有期徒刑，得併科新臺幣三十萬元以下罰金。\n犯前項之罪，因而致鐵路從業人員於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。","note":"一、本條新增。\n二、按鐵路從業人員執行業務時，多係基於維護乘車秩序與公共運輸安全等公益目的，故於鐵路從業人員執行職務，維護公共利益時，亦應享有相當安全之工作環境；退步言之，以暴力、脅迫、恐嚇或其他非法之方法者，妨礙鐵路從業人員執行職務者，不只涉及對於個人之人身安全，於列車車廂、站內發生之暴力襲擊，都可能引發集體恐慌，破壞運輸秩序，僅以行政罰之方式顯然無法有效嚇阻相關不法行為，故有透過專法規定更具針對性刑罰之必要。此有韓國《鐵道安全法》，對於類似攻擊案件，明定以徒刑之規定可稽。\n三、爰此，以強暴、恐嚇或其他非法方法攻擊鐵路從業人員，妨害其執行業務，不僅是單純對個人的人身侵害，更是對於公共安全與運輸秩序的挑戰；遂參考國際相關立法例與國內醫療法之體例及刑罰比例，就涉嫌以強暴、脅迫、恐嚇或其他非法之方法妨礙鐵路從業人員執行職務者，課予相當刑事處罰，以期提升國內鐵路交通韌性，維護鐵路機構從業者人身安全與公共運輸之秩序。"},{"bill":"202110171050000","text":"以強暴、脅迫、恐嚇或其他非法之方法，妨礙鐵路從業人員執行職務者，處一年以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n犯前項之罪，因而致鐵路從業人員於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處五年以上十年以下有期徒刑。\n有第一項情形者，鐵路從業人員得拒絕運送。","note":"一、本條新增。\n二、鐵路從業人員遭民眾謾罵、騷擾，或施以暴力等不當行為頻繁發生，進而妨礙從業人員執行職務，亦對其身心安全及健康構成嚴重威脅。\n三、鐵路從業人員之職場安全，與乘客安全密切相關。為確保旅運品質並維護公共安全，爰參酌刑法第一百八十五條之一、醫療法第二十四條及第一百零六條（妨害醫療罪），與本法第六十八條之二及六十八條之三之立法例，明定第一項及第二項，以強暴、脅迫、恐嚇或其他非法之方法，妨礙鐵路從業人員執行職務者，處一年以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金。致鐵路從業人員於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處五年以上十年以下有期徒刑。\n四、另參酌醫療法第二十四條、交通部臺灣鐵路管理局旅客運送契約第三點第六款，明定第三項，有第一項情形者，鐵路從業人員得拒絕運送。"},{"bill":"202110174230000","text":"以強暴、脅迫、恐嚇或其他非法之方法，妨礙鐵路從業人員執行職務者，處六個月以上三年以下有期徒刑，得併科新臺幣五十萬元以下罰金。\n犯前項之罪，傷害鐵路人員之身體或健康者，處一年以上五年以下有期徒刑、拘役或一百萬元以下罰金。\n因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處五年以上有期徒刑。\n犯第一項之罪者，鐵路從業人員得拒絕運送。","note":"一、本條新增。\n二、鐵路從業人員之職場安全，與乘客安全密切相關。為確保旅運品質並維護公共安全，爰參酌刑法第二百七十七條傷害罪、第一百三十五條「妨礙公務罪」及第一百八十五條之一「劫持交通工具罪」等條文規定，增定以強暴、脅迫、恐嚇或其他非法之方法，妨礙鐵路從業人員執行職務者，處半年以上三年以下有期徒刑，得併科新臺幣五十萬元以下罰金。傷害鐵路人員之身體或健康者，處一年以上五年以下有期徒刑、拘役或一百萬元以下罰金。致鐵路從業人員於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處五年以上有期徒刑。\n三、另參酌醫療法第二十四條、交通部臺灣鐵路管理局旅客運送契約第三點第六款，明定第四項，有第一項情形者，鐵路從業人員得拒絕運送。"}],"changed":true,"final":"以強暴、脅迫、恐嚇或其他非法之方法，妨害鐵路從業人員執行鐵路業務，處三年以下有期徒刑，得併科新臺幣三十萬元以下罰金。\n犯前項之罪，因而致鐵路從業人員於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n警察機關知有前二項情形者，應派員赴現場排除或制止之。如涉及刑事責任者，應移送司法機關偵辦。\n有第一項情形之虞者，鐵路機構得拒絕運送。","finalWhy":"","review":{"note":"照委員洪孟楷等19人提案修正通過","text":"以強暴、脅迫、恐嚇或其他非法之方法，妨害鐵路從業人員執行鐵路業務，處三年以下有期徒刑，得併科新臺幣三十萬元以下罰金。\n犯前項之罪，因而致鐵路從業人員於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n警察機關知有前二項情形者，應派員赴現場排除或制止之。如涉及刑事責任者，應移送司法機關偵辦。\n有第一項情形之虞者，鐵路機構得拒絕運送。"}},{"no":"第七十二條","current":"第六十八條之一至前條規定之處罰，交通部得委託警察機關或鐵路機構執行之。","versions":[{"bill":"202110171050000","text":"第六十八條之一至前條規定之處罰，交通部得委託警察機關或鐵路機構執行之。現行犯者，由警察機關排除或制止之；如涉及刑事責任者，應移送司法機關偵辦。","note":"為確保警察機關之處理權責，鐵路從業人員依增訂條文第六十八條之四規定，向旅客拒絕運送、解除契約或終止契約後，得委由鐵路警察協助安置、排除或制止；如涉及刑事責任者，則應移送司法機關偵辦。"}],"changed":false,"final":"第六十八條之一至前條規定之處罰，交通部得委託警察機關或鐵路機構執行之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}}],"stages":[{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110013190000","gazref":"113卷010期5192號 11-11頁"},{"date":"2024-05-03","stage":"一讀","code":"院會-11-1-12","bill":"202110038030000","gazref":"113卷035期5217號 2-2頁"},{"date":"2024-07-03","code":"委員會-11-1-23-18","title":"第11屆第1會期交通委員會第18次全體委員會議","gazref":"113卷070期5252號一冊 67-108頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024070225/details?meetingDate=113/07/03","full":["https://ivod.ly.gov.tw/Play/Full/1M/16063"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/70/LCIDC01_1137001_00002.pdf","p1":67,"p2":108}],"clips":[{"n":"李昆澤","t":"10:40","u":"https://ivod.ly.gov.tw/Play/Clip/1M/154476"},{"n":"傅崐萁","t":"10:45","u":"https://ivod.ly.gov.tw/Play/Clip/1M/154477"},{"n":"廖先翔","t":"10:48","u":"https://ivod.ly.gov.tw/Play/Clip/1M/15447 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });

}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;

  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }

  lines.forEach((segs, i) => {

    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));

}

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;

    cur = (i + hits.length) % hits.length;

    prev.hidden = next.hidden = !hits.length;

    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
