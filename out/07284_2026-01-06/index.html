及不得記載事項，並得會商有關主管機關，如交通主管機關、金融主管機關等，以臻周全。並為使外送平臺業者及外送員間權利義務得清楚明確，於第二項明定定型化契約應記載及不得記載事項，應包含之重要權利義務事項，以保障外送員勞動權益。\n二、為確保外送平臺業者與外送員成立之外送服務契約，不逸脫定型化契約應記載及不得記載事項之範圍，於第三項明定違反者無效、未記載於契約者亦構成契約內容。\n三、另為避免外送平臺業者未經外送員同意，片面變更外送服務契約內容或增補第二項外送員重要權利義務事項，爰訂定第四項規定，惟雙方合意內容仍不得違反前開定型化契約應記載及不得記載事項。並於第五項明定業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110170780000","text":"中央主管機關應會同中央目的事業主管機關，對於外送員資格、外送服務期間有關食品安全、交通安全之設備或工具，訂定外送安全衛生服務標準。","note":"數位平台經濟工作型態與傳統外送行業略有不同，觀察實務運作、社群媒體，民間對於外送員之資格、條件、素質及合作商家衛生狀況多有討論，為保障消費者食的安全、外送員人身安全，中央主管機關應會同中央目的事業主管機關對於外送員之資格、條件、應具備之食品安全知識及工具、設備，訂定外送安全服務標準。"},{"bill":"202110173040000","text":"中央主管機關應會同中央目的事業主管機關，對於外送人員資格、外送服務期間有關食品安全、交通安全之設備或工具，訂定外送安全衛生服務標準。","note":"數位平台經濟工作型態與傳統外送行業略有不同，觀察實務運作、社群媒體，民間對於外送人員之資格、條件、素質及合作商家衛生狀況多有討論，為保障消費者食安、外送人員人身安全，中央主管機關應會同中央目的事業主管機關對於外送人員之資格、條件、應具備之食品安全知識及工具、設備，訂定外送安全服務標準。"},{"bill":"202110173260000","text":"外送平台業者應於外送平台介面客戶端明確揭示下列各款事項：\n一、商品價格、服務費或運費之金額。\n二、消費者取消訂單之退費機制。\n三、外送平台業者得取消訂單之事由及退費機制。\n四、商品遲延交付之處理方式。\n五、交付商品之種類或數量與訂單不符及商品損壞之處理方式、收退費用及賠償方案。","note":"明定外送平台業者應明確揭示之事項。"},{"bill":"202110173180000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。\n外送平臺業者使用演算法管理者，須依下列規定為之：\n一、以清晰易懂之文字向其外送員揭露其演算法相關如下的主要參數、規則與指令邏輯：\n(一)任務分配與調度系統：影響訂單指派優先順序之因素及其相對權重。\n(二)薪酬計算系統：決定每筆訂單報酬之完整計算公式，包含動態定價之觸發條件與加成倍率。\n(三)績效評估系統：所有評估外送員之指標、其計算方式，及該指標如何影響外送員之評級、獎勵資格與接單機會。\n二、前款演算法之揭露義務規範細則及程序由中央主管機關定之。\n三、外送平臺業者應成立專責單位或人力協助外送員了解及知悉本項所訂之演算法揭露內容，必要時並應以電子訊息或書面方式等得以長久留存或驗證方式為之。","note":"一、為平衡外送平臺業者與外送員於締約、議價上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項，並得會商有關主管機關，如交通主管機關、金融主管機關等，以臻周全。並為使外送平臺業者及外送員間權利義務得清楚明確，於第二項明定定型化契約應記載及不得記載事項，應包含之重要權利義務事項，以保障外送員勞動權益。\n二、為確保外送平臺業者與外送員成立之外送服務契約，不逸脫定型化契約應記載及不得記載事項之範圍，於第三項明定違反者無效、未記載於契約者亦構成契約內容。\n三、另為避免外送平臺業者未經外送員同意，片面變更外送服務契約內容或增補第二項外送員重要權利義務事項，爰訂定第四項規定，惟雙方合意內容仍不得違反前開定型化契約應記載及不得記載事項。並於第五項明定業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視契約內容，避免爭議產生。\n四、另針對使用演算法管理之外送平臺爰於第六項明訂其演算法關於外送員管理相關之邏輯內容揭露義務，並有義務使用清晰易懂之文字為之，務使外送員能清楚明白其管理邏輯及規則，以利權益之保障及救濟。"},{"bill":"202110173190000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為平衡外送平臺業者與外送員於締約、議價上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項，並得會商有關主管機關，如交通主管機關、金融主管機關等，以臻周全。並為使外送平臺業者及外送員間權利義務得清楚明確，於第二項明定定型化契約應記載及不得記載事項，應包含之重要權利義務事項，以保障外送員勞動權益。\n二、為確保外送平臺業者與外送員成立之外送服務契約，不逸脫定型化契約應記載及不得記載事項之範圍，於第三項明定違反者無效、未記載於契約者亦構成契約內容。\n三、另為避免外送平臺業者未經外送員同意，片面變更外送服務契約內容或增補第二項外送員重要權利義務事項，爰訂定第四項規定，惟雙方合意內容仍不得違反前開定型化契約應記載及不得記載事項。並於第五項明定業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110174530000","text":"外送平台業者應於外送平台介面客戶端明確揭示下列各款事項：\n一、商品重量、體積，及價格、服務費或運費之金額。\n二、消費者取消訂單之退費機制。\n三、外送平台業者得取消訂單之情事及退費機制。\n四、商品遲延交付、交付商品之種類或數量與訂單不符及商品損壞之處理方式、收退費用及補償措施。","note":"明定外送平台業者應明確揭示之事項。"},{"bill":"202110174470000","text":"外送平台業者應於外送服務契約、外送合作契約成立後七日內提供契約之書面或電磁紀錄予外送員、合作商家收執。\n未於契約內約定且涉及合作商家或外送員權利義務之事項，外送平台業者以網際網路、公告、郵件、書面或其他方法表示者，視為契約內容之變更。\n契約非經合作商家或外送員同意，不得變更。","note":"一、有鑒於現行實務運作上，外送平台業者與外送員、合作商家之間涉及權利義務之事項變更常有模糊之處，為維護外送員與合作商家權益，外送平台業者與其成立契約時，應在七日內提供書面契約或電磁紀錄。\n二、現行外送平台業者透過網際網路或其他方式通知、公告有關外送員、合作商家之權利義務變更事項，事實上已涉及契約內容之變更，應得合作商家或外送員同意，故明定第二項及第三項。"},{"bill":"202110174740000","text":"外送員提供外送服務時，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、道路交通管理處罰條例或食品安全衛生相關法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約，或就其他影響外送員權益事項為不利決定時，應以書面或電子文件敘明完整、簡明及可理解之理由，通知外送員，且就其理由之存在負舉證責任。\n外送平臺業者依前項為不利決定者，應依第十七條規定，提供外送員申訴之機會。","note":"本條針對外送員違反重大法規情節之處理程序進行規範。平臺僅得在外送員有重大違法情節時終止契約，並須具體說明理由、負舉證責任及保障申訴權，以防止業者濫用停權或終止機制。另外送員不服申訴結果，得另循司法途徑救濟。"},{"bill":"202110175620000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"本條明定中央主管機關應訂定外送服務定型化契約應記載及不得記載事項，且業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視並確認契約內容，以避免爭議。"},{"bill":"202110175920000","text":"外送平臺業者於提供訂單予外送員時，應明確告知訂單之預估報酬、取送商品地點及其他相關重要資訊。","note":"一、明定外送平臺業者於提供外送員訂單時，應明確告知該筆訂單之重要資訊，如取餐、送餐地點（包括行車里程、步行距離及抵達區域等）、預估可獲得之報酬、預估取餐與送達時間及其他合理提示，以利外送員評估、決定是否接受該筆訂單，提升外送作業之透明度，並保障外送員權益、減少爭議發生。\n二、關於其他相關重要資訊，將另於本法施行細則定之。"},{"bill":"202110176760000","text":"中央主管機關應會同中央目的事業主管機關，對於外送員資格、外送服務期間有關食品安全衛生、交通安全之設備或工具，訂定外送安全衛生服務標準。","note":"為確保消費者食品安全無虞、外送員人身安全等，中央主管機關應會同中央目的事業主管機關針對外送員之資格、條件、應具備之食品安全知識及工具、設備，訂定外送安全服務標準。"},{"bill":"202110176980000","text":"外送平臺業者於提供訂單予外送員時，應明確告知訂單之預估報酬、取送商品地點及其他相關重要資訊。","note":"要求外送平臺業者提供訂單時，應明確揭露預估報酬、取餐地點、送達地點等重要資訊，使外送員得以充分掌握資訊並自主評估是否接受訂單。"},{"bill":"202110177560000","text":"中央主管機關應會同中央目的事業主管機關，對於外送員資格、外送服務期間之食品安全、交通安全有關之設備或工具，訂定外送安全衛生服務標準。","note":"為顧及消費者食品安全、外送員道路交通安全等，中央主管機關應會同中央目的事業主管機關，針對外送員之資格、條件、應具備之食品安全知識及工具、設備等，訂定外送安全服務標準。"},{"bill":"202110177680000","text":"外送平臺業者於提供訂單予外送員時，應明確告知訂單之預估報酬、取送商品地點及其他相關重要資訊。","note":"一、明定外送平臺業者於提供外送員訂單時，應明確告知該筆訂單之重要資訊如取餐、送餐地點包括行車里程、步行距離及抵達區域等、預估可獲得之報酬、預估取餐與送達時間及其他合理提示，以利外送員評估、決定是否接受該筆訂單，提升外送作業之透明度，並保障外送員權益、減少爭議發生。\n二、關於其他相關重要資訊，將另於本法施行細則定之。"},{"bill":"202110178160000","text":"外送平臺業者於提供訂單予外送員時，應明確告知訂單之預估報酬、取送商品地點及其他相關重要資訊。","note":"一、明定外送平臺業者於提供外送員訂單時，應明確告知該筆訂單之重要資訊，如取餐、送餐地點（包括行車里程、步行距離及抵達區域等）、預估可獲得之報酬、預估取餐與送達時間及其他合理提示，以利外送員評估、決定是否接受該筆訂單，提升外送作業之透明度，並保障外送員權益、減少爭議發生。\n二、關於其他相關重要資訊，將另於本法施行細則定之。"},{"bill":"202110181420000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為平衡外送平臺業者與外送員於締約、議價上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項，並得會商有關主管機關，如交通主管機關、金融主管機關等，以臻周全。並為使外送平臺業者及外送員間權利義務得清楚明確，於第二項明定定型化契約應記載及不得記載事項，應包含之重要權利義務事項，以保障外送員勞動權益。\n二、為確保外送平臺業者與外送員成立之外送服務契約，不逸脫定型化契約應記載及不得記載事項之範圍，於第三項明定違反者無效、未記載於契約者亦構成契約內容。\n三、另為避免外送平臺業者未經外送員同意，片面變更外送服務契約內容或增補第二項外送員重要權利義務事項，爰訂定第四項規定，惟雙方合意內容仍不得違反前開定型化契約應記載及不得記載事項。並於第五項明定業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視契約內容，避免爭議產生。"}],"changed":true,"final":"外送平臺業者於提供訂單予外送員時，應明確告知訂單之預估報酬、取送商品地點及其他相關重要資訊。","finalWhy":"一、明定外送平臺業者於提供外送員訂單時，應明確告知該筆訂單之重要資訊，如取餐、送餐地點（包括行車里程、步行距離、抵達區域及樓層等）、預估可獲得之報酬、預估取餐與送達時間及其他合理提示，以利外送員評估、決定是否接受該筆訂單，提升外送作業之透明度，並保障外送員權益、減少爭議發生。\n二、關於其他相關重要資訊，將另於本法施行細則定之。","review":{"note":"不予採納","text":""}},{"no":"第七條","current":null,"versions":[{"bill":"202110017580000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110060450000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法之規定。","note":"按勞動基準法第三條第三項：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110060680000","text":"外送平台業者應建立下列申訴制度：\n一、外送員不服停權處分。\n二、消費者就消費關係所發生之爭議。\n前項第一款申訴之相關準則，由中央主管機關定之，並由外送平台業者以書面或其他適當方式告知外送員；前項第二款申訴之方式，由外送平台業者自行訂定，報經行政院消費者保護處備查後，於外送平台介面公告之。","note":"一、外送平台業者常以外送員收到客訴予以停權，並以保護消費者權益為由，拒絕提供外送員前揭客訴內容，且無救濟管道，對外送員之權益保障實有不足，另為貫徹保障消費者權益之立法目的，爰於第一項明定外送平台業者應建立申訴制度，受理外送員、消費者之申訴。\n二、第二項明定，外送員不服外送平台業者之停權處分，應由中央主管機關訂定申訴之相關準則；消費者申訴之方式則由外送平台業者自行訂定相關準則，報經行政院消費者保護處備查後，於外送平台介面公告之。"},{"bill":"202110060360000","text":"外送平台業者應建立下列申訴制度：\n一、外送員停權、違規及終止契約處分。\n二、報酬之金額、計算方式、給付時間。\n三、消費者就消費關係所發生之爭議。\n前項第一款、第二款申訴之相關準則，由中央主管機關定之，並由外送平台業者以書面或其他適當方式告知外送員；前項第三款申訴之方式，由外送平台業者自行訂定，報經行政院消費者保護處備查後，於外送平台介面公告之。","note":"一、外送平台業者常以外送員收到客訴予以停權，並以保護消費者權益為由，拒絕提供外送員前揭客訴內容，且無救濟管道，對外送員之權益保障實有不足，另為貫徹保障消費者權益之立法目的，爰於第一項明定外送平台業者應建立申訴制度，受理外送員、消費者之申訴。\n二、第二項明定，外送員不服外送平台業者之停權處分及報酬計算方式，應由中央主管機關訂定申訴之相關準則；消費者申訴之方式則由外送平台業者自行訂定相關準則，報經行政院消費者保護處備查後，於外送平台介面公告之。"},{"bill":"202110075210000","text":"外送平台業者應建立下列申訴制度：\n一、外送員不服停權處分。\n二、消費者就消費關係所發生之爭議。\n前項第一款申訴之相關準則，由中央主管機關定之，並由外送平台業者以書面或其他適當方式告知外送員；前項第二款申訴之方式，由外送平台業者自行訂定，報經行政院消費者保護處備查後，於外送平台介面公告之。","note":"一、外送平台業者常以外送員收到客訴予以停權，並以保護消費者權益為由，拒絕提供外送員前揭客訴內容，且無救濟管道，對外送員之權益保障實有不足，另為貫徹保障消費者權益之立法目的，爰於第一項明定外送平台業者應建立申訴制度，受理外送員、消費者之申訴。\n二、第二項明定，外送員不服外送平台業者之停權處分，應由中央主管機關訂定申訴之相關準則；消費者申訴之方式則由外送平台業者自行訂定相關準則，報經行政院消費者保護處備查後，於外送平台介面公告之。"},{"bill":"202110099010000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110167670000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除外送員權益保障外，亦應維護消費者、合作商家及外送平臺業者權益，且為避免因外送員素質良莠不齊，對於產業發展造成影響，爰於第一項明定外送平臺業者得於特定情況下，與外送員終止外送服務契約之權利。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或其他影響權益之不利決定，於第二項明定業者於做出前開決定時，應敘明理由通知外送員，並就所執理由負舉證責任及給予申訴機會。另外送員不服申訴結果，得另循司法途徑救濟。"},{"bill":"202110167840000","text":"外送平台業者應建立下列申訴制度：\n一、外送員不服停權處分。\n二、消費者就消費關係所發生之爭議。\n前項第一款申訴之相關準則，由中央主管機關定之，並由外送平台業者以書面或其他適當方式告知外送員；前項第二款申訴之方式，由外送平台業者自行訂定，報經行政院消費者保護處備查後，於外送平台介面公告之。","note":"一、外送平台業者常以外送員收到客訴予以停權，並以保護消費者權益為由，拒絕提供外送員前揭客訴內容，且無救濟管道，對外送員之權益保障實有不足，另為貫徹保障消費者權益之立法目的，爰於第一項明定外送平台業者應建立申訴制度，受理外送員、消費者之申訴。\n二、第二項明定，外送員不服外送平台業者之停權處分，應由中央主管機關訂定申訴之相關準則；消費者申訴之方式則由外送平台業者自行訂定相關準則，報經行政院消費者保護處備查後，於外送平台介面公告之。"},{"bill":"202110168030000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除外送員權益保障外，亦應維護消費者、合作商家及外送平臺業者權益，且為避免因外送員素質良莠不齊，對於產業發展造成影響，爰於第一項明定外送平臺業者得於特定情況下，與外送員終止外送服務契約之權利。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或其他影響權益之不利決定，於第二項明定業者於做出前開決定時，應敘明理由通知外送員，並就所執理由負舉證責任及給予申訴機會。另外送員不服申訴結果，得另循司法途徑救濟。"},{"bill":"202110168140000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110168230000","text":"外送平台業者應建立下列申訴制度：\n一、外送員不服停權處分。\n二、消費者就消費關係所發生之爭議。\n前項第一款申訴之相關準則，由中央主管機關定之，並由外送平台業者以書面或其他適當方式告知外送員；前項第二款申訴之方式，由外送平台業者自行訂定，報經行政院消費者保護處備查後，於外送平台介面公告之。","note":"一、第一項明定外送平台業者應建立申訴制度，受理外送員、消費者之申訴。\n二、第二項明定外送員不服外送平台業者之停權處分，應由中央主管機關訂定申訴之相關準則；消費者申訴之方式則由外送平台業者自行訂定相關準則，報經行政院消費者保護處備查後，於外送平台介面公告之。"},{"bill":"202110168240000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除外送員權益保障外，亦應維護消費者、合作商家及外送平臺業者權益，且為避免因外送員素質良莠不齊，對於產業發展造成影響，爰於第一項明定外送平臺業者得於特定情況下，與外送員終止外送服務契約之權利。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或其他影響權益之不利決定，於第二項明定業者於做出前開決定時，應敘明理由通知外送員，並就所執理由負舉證責任及給予申訴機會。另外送員不服申訴結果，得另循司法途徑救濟。"},{"bill":"202110169580000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、道路交通管理處罰條例或食品安全衛生管理法等法令，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"本條明定外送平臺業者僅得於外送員違法且情節重大時終止契約，並須說明理由、負舉證責任及提供申訴機會，以防止任意解約，保障外送員程序權益。"},{"bill":"202110170380000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規者，外送平臺業者得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並給予外送員申訴機會。","note":"一、考量外送平臺產業治理除外送員權益保障外，亦應維護消費者、合作商家及外送平臺業者權益，且為避免因外送員素質良莠不齊，對於產業發展造成影響，爰於第一項明定外送平臺業者得於特定情況下，與外送員終止外送服務契約之權利。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或其他影響權益之不利決定，於第二項明定業者於做出前開決定時，應敘明理由通知外送員，並就所執理由負舉證責任及給予申訴機會。另外送員不服申訴結果，得另循司法途徑救濟。"},{"bill":"202110171160000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除外送員權益保障外，亦應維護消費者、合作商家及外送平臺業者權益，且為避免因外送員素質良莠不齊，對於產業發展造成影響，爰於第一項明定外送平臺業者得於特定情況下，與外送員終止外送服務契約之權利。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或其他影響權益之不利決定，於第二項明定業者於做出前開決定時，應敘明理由通知外送員，並就所執理由負舉證責任及給予申訴機會。另外送員不服申訴結果，得另循司法途徑救濟。\n三、避免自動化決策濫權。"},{"bill":"202110170780000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110173040000","text":"外送人員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送人員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。"},{"bill":"202110173260000","text":"外送平台業者應建立下列申訴制度：\n一、外送員不服停權處分。\n二、消費者就消費關係所發生之爭議。\n前項第一款申訴之相關準則，由中央主管機關定之，並由外送平台業者以書面或其他適當方式告知外送員；前項第二款申訴之方式，由外送平台業者自行訂定，報經行政院消費者保護處備查後，於外送平台介面公告之。","note":"一、第一項明定外送平台業者應建立申訴制度，受理外送員、消費者之申訴。\n二、第二項明定外送員不服外送平台業者之停權處分，應由中央主管機關訂定申訴之相關準則；消費者申訴之方式則由外送平台業者自行訂定相關準則，報經行政院消費者保護處備查後，於外送平台介面公告之。"},{"bill":"202110173180000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"一、外送平臺業者常以外送員收到客訴予以停權，並以保護消費者權益為由，拒絕提供外送員前揭客訴內容，且無救濟管道，對外送員之權益保障實有不足，另為貫徹保障消費者權益之立法目的，爰於第一項明定外送平臺業者應建立申訴制度，受理外送員、消費者之申訴。\n二、第二項明定，外送員不服外送平臺業者之停權處分，應由中央主管機關訂定申訴之相關準則；消費者申訴之方式則由外送平臺業者自行訂定相關準則，報經行政院消費者保護處備查後，於外送平臺介面公告之。"},{"bill":"202110173190000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除外送員權益保障外，亦應維護消費者、合作商家及外送平臺業者權益，且為避免因外送員素質良莠不齊，對於產業發展造成影響，爰於第一項明定外送平臺業者得於特定情況下，與外送員終止外送服務契約之權利。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或其他影響權益之不利決定，於第二項明定業者於做出前開決定時，應敘明理由通知外送員，並就所執理由負舉證責任及給予申訴機會。另外送員不服申訴結果，得另循司法途徑救濟。"},{"bill":"202110174530000","text":"外送平台業者應建立下列申訴制度，且申訴制度至少應包括受理單位、救濟管道、處理流程與時限、回覆方式及補償措施等內容，並公開揭示：\n一、外送員不服停權之處分。\n二、消費者就消費關係所發生之爭議。\n前項第一款申訴之相關準則，由中央主管機關定之，並組成申訴處理小組，其成員由具備勞動法令專業，或熟悉外送平台產業實務運作之外部專家學者擔任。\n前項小組應不定期召開會議，其成員應符合下列規定，並與外送平台業者間無利害關係：\n一、人數不得低於三人。\n二、成員至少包括一名由具備勞動法令專業，或熟悉外送平台產業實務運作之外部專家學者擔任。\n三、外送員為原住民族時，申訴處理小組成員應至少有一人為原住民族相關領域專家學者。\n並由外送平台業者以書面或其他適當方式告知外送員；前項第二款申訴之方式，由外送平台業者自行訂定，報經行政院消費者保護處備查後，於外送平台介面公告之。","note":"一、第一項明定外送平台業者應建立申訴制度，受理外送員、消費者之申訴。\n二、第二項明定外送員不服外送平台業者之停權處分，應由中央主管機關訂定申訴之相關準則以及組成申訴處理小組成員及處理方式。"},{"bill":"202110174470000","text":"外送服務契約應記載下列事項：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、申訴制度。\n四、外送服務應具備之設備、程式或工具。\n五、外送服務基本流程。\n六、外送平台客服連絡方式，應至少記載電話、電子郵件。\n七、因不可歸責於外送員之事由，致無法完成外送服務之處理規範。","note":"本條明定有關各項應記載於外送服務契約之內容。"},{"bill":"202110174740000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時，為虛偽之意思表示，致外送員誤信而有受損害之虞。\n二、外送平臺業者違反外送服務契約或本法之規定，致損害外送員權益。\n外送員依前項規定終止外送服務契約者，應自知悉其情形或損害結果之日起三十日內為之。\n外送員依第一項規定終止外送服務契約者，外送平臺業者應予外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"明定外送員可終止契約之事由及程序，保障外送員免於平臺不當對待時之解約權。另要求業者應給予經濟補償，並授權中央主管機關訂定補償標準，以維護外送員經濟安全。"},{"bill":"202110175620000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"本條明定外送平臺業者得於特定情況下，與外送員終止外送服務契約之權利，以維護消費者、合作商家及外送平臺業者權益。另為避免外送平臺業者任意對外送員施以終止外送服務契約或其他影響權益之不利決定，業者應敘明理由通知外送員，並就所執理由負舉證責任及給予申訴機會，若外送員不服申訴結果，得另循司法途徑救濟。"},{"bill":"202110175920000","text":"外送員於提供外送服務期間，有違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規、食品安全衛生法規或外送服務契約，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由負舉證責任，並依第九條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除須保障外送員權益外，亦應維護消費者、合作商家及外送平臺業者權益，爰為避免因外送員有違法或不當行為而致使消費者、合作商家權益受到重大損害或影響，於第一項明定外送平臺業者得於特定情況下與外送員終止外送服務契約。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或停權等影響權益之不利決定，於第二項明定外送平臺業者於做出不利決定時，應敘明理由通知外送員，並就所執理由負舉證責任並給予申訴機會。"},{"bill":"202110176760000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法之規定。","note":"按勞動基準法第三條第三項：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110176980000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規、食品安全衛生法規或外送服務契約，且情節重大者，外送平臺業者得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第九條規定給予外送員申訴機會。","note":"一、為兼顧外送員工作權與產業運作秩序，明定外送平臺業者於特定重大情事下，得終止外送服務契約。\n二、外送平臺業者須敘明理由、負舉證責任並提供申訴機會，以避免任意終止合作造成外送員生計受損。"},{"bill":"202110177560000","text":"報酬之計算包含多種項目者，應按每一項目明列，並載明其金額及計算方式，不得僅列總額。\n計算報酬之項目以數據為基礎計算者，應按實際數據計算，並使外送員得即時查閱。\n第一項明細得以紙本、電子資料傳輸方式或其他外送員可隨時取得及得列印之方式為之，且每月至少寄送或更新乙次。","note":"明定外送平臺業者應載明報酬明細，並明列項目，每月至少一次發給外送員報酬明細表或更新以供查閱。"},{"bill":"202110177680000","text":"外送員於提供外送服務期間，有違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規、食品安全衛生法規或外送服務契約，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由負舉證責任，並依第九條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除須保障外送員權益外，亦應維護消費者、合作商家及外送平臺業者權益，爰為避免因外送員有違法或不當行為而致使消費者、合作商家權益受到重大損害或影響，於第一項明定外送平臺業者得於特定情況下與外送員終止外送服務契約。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或停權等影響權益之不利決定，於第二項明定外送平臺業者於做出不利決定時，應敘明理由通知外送員，並就所執理由負舉證責任並給予申訴機會。"},{"bill":"202110178160000","text":"外送員於提供外送服務期間，有違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規、食品安全衛生法規或外送服務契約，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由負舉證責任，並依第九條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除須保障外送員權益外，亦應維護消費者、合作商家及外送平臺業者權益，爰為避免因外送員有違法或不當行為而致使消費者、合作商家權益受到重大損害或影響，於第一項明定外送平臺業者得於特定情況下與外送員終止外送服務契約。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或停權等影響權益之不利決定，於第二項明定外送平臺業者於做出不利決定時，應敘明理由通知外送員，並就所執理由負舉證責任並給予申訴機會。"},{"bill":"202110181420000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由之存在負舉證責任，並依第十條規定給予外送員申訴機會。","note":"一、考量外送平臺產業治理除外送員權益保障外，亦應維護消費者、合作商家及外送平臺業者權益，且為避免因外送員素質良莠不齊，對於產業發展造成影響，爰於第一項明定外送平臺業者得於特定情況下，與外送員終止外送服務契約之權利。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或其他影響權益之不利決定，於第二項明定業者於做出前開決定時，應敘明理由通知外送員，並就所執理由負舉證責任及給予申訴機會。另外送員不服申訴結果，得另循司法途徑救濟。"}],"changed":true,"final":"外送員於提供外送服務期間，有違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規、食品安全衛生法規或外送服務契約，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由負舉證責任，並依第九條規定給予外送員申訴機會。","finalWhy":"一、考量外送平臺產業治理除須保障外送員權益外，亦應維護消費者、合作商家及外送平臺業者權益，爰為避免因外送員有違法或不當行為而致使消費者、合作商家權益受到重大損害或影響，於第一項明定外送平臺業者得於特定情況下與外送員終止外送服務契約。\n二、另為避免外送平臺業者任意對外送員施以終止外送服務契約或停權等影響權益之不利決定，於第二項明定外送平臺業者於做出不利決定時，應敘明理由通知外送員，並就所執理由負舉證責任並給予申訴機會。","review":{"note":"照委員劉建國等16人提案通過","text":"外送員於提供外送服務期間，有違反個人資料保護法、性騷擾防治法、跟蹤騷擾防制法、刑法、交通法規、食品安全衛生法規或外送服務契約，且情節重大者，外送平臺業者始得終止外送服務契約。\n外送平臺業者依前項規定終止外送服務契約或為其他影響外送員權益之不利決定時，應敘明完整、簡明及可理解之理由通知外送員，且就其理由負舉證責任，並依第九條規定給予外送員申訴機會。"}},{"no":"第八條","current":null,"versions":[{"bill":"202110017580000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110060450000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110060680000","text":"外送平台業者使外送員為外送服務時，應符合下列規定：\n一、上線後始得提供外送服務。\n二、不得違反外送員之意願，使其維持上線狀態。","note":"為尊重外送員提供勞務之自主意願，避免外送員過勞而影響健康，增加交通意外風險，爰規定外送平台應於外送員上線後始得使其為外送服務，且對於已上線之外送員，不得違反其意願，使其維持上線狀態。"},{"bill":"202110060360000","text":"外送平台業者使外送員為外送服務時，應符合下列規定：\n一、上線後始得提供外送服務。\n二、不得違反外送員之意願，使其維持上線狀態。","note":"為尊重外送員提供勞務之自主意願，避免外送員過勞而影響健康，增加交通意外風險，爰規定外送平台應於外送員上線後始得使其為外送服務，且對於已上線之外送員，不得違反其意願，使其維持上線狀態。"},{"bill":"202110075210000","text":"外送平台業者使外送員為外送服務時，應符合下列規定：\n一、上線後始得提供外送服務。\n二、不得違反外送員之意願，使其維持上線狀態。","note":"為尊重外送員提供勞務之自主意願，避免外送員過勞而影響健康，增加交通意外風險，爰規定外送平台應於外送員上線後始得使其為外送服務，且對於已上線之外送員，不得違反其意願，使其維持上線狀態。"},{"bill":"202110099010000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110167670000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰賦予外送員得終止外送服務契約之權利。並為彌補外送員所受損失，爰明定外送爰依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n二、為使外送員合理行使第一項之契約終止權，爰於第二項規定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第十條規定申訴機制之適用範圍。"},{"bill":"202110167840000","text":"外送平台業者使外送員為外送服務時，應符合下列規定：\n一、上線後始得提供外送服務。\n二、不得違反外送員之意願，使其維持上線狀態。","note":"為尊重外送員提供勞務之自主意願，避免外送員過勞而影響健康，增加交通意外風險，爰規定外送平台應於外送員上線後始得使其為外送服務，且對於已上線之外送員，不得違反其意願，使其維持上線狀態。"},{"bill":"202110168030000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n三、其他可歸責於外送平臺業者之事由。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰賦予外送員得終止外送服務契約之權利。並為彌補外送員所受損失，爰明定外送爰依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n二、為使外送員合理行使第一項之契約終止權，爰於第二項規定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第十條規定申訴機制之適用範圍。"},{"bill":"202110168140000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110168230000","text":"外送平台業者使外送員為外送服務時，應符合下列規定：\n一、上線後始得提供外送服務。\n二、不得違反外送員之意願，使其維持上線狀態。","note":"明定外送平台應於外送員上線後始得使其為外送服務，且對於已上線之外送員，不得違反其意願，使其維持上線狀態。"},{"bill":"202110168240000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰賦予外送員得終止外送服務契約之權利。並為彌補外送員所受損失，爰明定外送爰依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n二、為使外送員合理行使第一項之契約終止權，爰於第二項規定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第十條規定申訴機制之適用範圍。"},{"bill":"202110169580000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"本條明定外送員於平臺違反契約或法規時，得終止契約並請求經濟補償，以防止平臺不當行為並保障外送員權益。"},{"bill":"202110170380000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰賦予外送員得終止外送服務契約之權利。並為彌補外送員所受損失，爰明定外送爰依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n二、為使外送員合理行使第一項之契約終止權，爰於第二項規定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第十條規定申訴機制之適用範圍。"},{"bill":"202110171160000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰賦予外送員得終止外送服務契約之權利。並為彌補外送員所受損失，爰明定外送爰依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n二、為使外送員合理行使第一項之契約終止權，爰於第二項規定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第十條規定申訴機制之適用範圍。"},{"bill":"202110170780000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110173040000","text":"外送人員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送人員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送人員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響產業發展，爰於第一項明定外送平台業者得隨時終止與外送人員之外送服務契約。但應於三十日前預告外送人員。\n二、為避免外送平台業者任意終止外送服務契約，對外送人員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送人員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110173260000","text":"外送平台業者使外送員為外送服務時，應符合下列規定：\n一、上線後始得提供外送服務。\n二、不得違反外送員之意願，使其維持上線狀態。","note":"明定外送平台應於外送員上線後始得使其為外送服務，且對於已上線之外送員，不得違反其意願，使其維持上線狀態。"},{"bill":"202110173180000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰賦予外送員得終止外送服務契約之權利。並為彌補外送員所受損失，爰明定外送員依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n二、為使外送員合理行使第一項之契約終止權，爰於第二項規定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第十條規定申訴機制之適用範圍。"},{"bill":"202110173190000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰賦予外送員得終止外送服務契約之權利。並為彌補外送員所受損失，爰明定外送爰依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n二、為使外送員合理行使第一項之契約終止權，爰於第二項規定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第十條規定申訴機制之適用範圍。"},{"bill":"202110174530000","text":"外送平台業者使外送員為外送服務時，應符合下列規定：\n一、上線後始得提供外送服務。\n二、不得違反外送員之意願，使其維持上線狀態。","note":"明定外送平台應於外送員上線後始得使其為外送服務，且對於已上線之外送員，不得違反其意願，使其維持上線狀態。"},{"bill":"202110174470000","text":"外送合作契約應記載下列事項：\n一、外送平台業者收取之各項費用金額或比例。\n二、外送平台業者提供之設備及其維護修繕方式及費用。\n三、外送平台業者之客服聯絡方式，應至少記載電話、電子郵件。\n四、貨款或服務給付時間及給付方式。\n五、爭議款項處理機制。\n六、合作商家負責人變更之處理機制。\n七、同一消費者之同一訂單，經取消或訂單內容毀損，經外送平台業者要求再次給付相同訂單內容之貨款處理機制。","note":"本條明定有關各項應記載於外送合作契約之內容。"},{"bill":"202110174740000","text":"報酬項目為基本費、里程費、等待費、樓層費等費用。\n前項報酬之總額不得低於最低工資法所定每小時最低工資三分之一。\n報酬之標準、計算方法及發放日期，由主管機關會同交通主管機關共同定之。","note":"一、本條旨在建立外送平臺合理支付標準，強化外送員基本經濟保障，促進外送產業健全發展，並落實政府提升非典型勞動者權益之政策目標。\n二、外送員以接單完成配送作為主要收入來源，實務上其每筆訂單之報酬過低、報酬結構過度依賴平臺演算法調整、疊單等問題，已造成外送從業人員收入不穩定，甚至在高工時下仍難以達成合理生活所得。為確保外送員之基本勞動收益，並避免平臺業者藉由降低單筆報酬而引發惡性競爭，有必要明確設定每筆報酬基本報酬之最低標準。\n三、本條規範外送平臺業者支付外送員每筆訂單之報酬，項目包含基本費、里程費、等待費、樓層費等等，報酬總額不得低於《最低工資法》所定每小時最低工資三分之一，係基於外送勞動之特性多以單筆計酬且平均完成一件訂單通常需耗時約二十分鐘，故以最低工資之三分之一作為基本報酬下限，兼具可行性與保障性。此舉亦可防止平臺以不透明演算法壓低每筆報酬，確保外送員在不論接單時段、地區或市場競爭狀況下，仍可獲得符合法定最低標準之收入。"},{"bill":"202110175620000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰於本條明定外送員得終止外送服務契約之權利。"},{"bill":"202110175920000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者違反外送服務契約或本法規定，致有損害外送員權益之虞。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他有關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定致損害外送員權益，爰於第一項賦予外送員得終止外送服務契約之權利。\n二、為使外送員合理行使第一項之契約終止權，於第二項明定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、復為彌補外送員因終止外送服務契約所受損失，於第三項明定外送員依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n四、第四項授權由中央主管機關訂定經濟補償之給付基準、期限、方式及其他相關事項之辦法。\n五、又如係外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第九條申訴制度之適用範圍。"},{"bill":"202110176760000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110176980000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"賦予外送員得依一定理由終止外送服務契約之權利，並要求外送平臺業者於其違反契約或法律致使外送員權益受損時，負擔相應之經濟補償，避免平台違法或失當行為侵害外送員。"},{"bill":"202110177560000","text":"外送平臺業者與外送員間非僱傭關係者，外送平臺業者得於敘明完整、簡明及可理解之理由後，與其終止外送服務契約，但應於二十日前預告外送員。\n外送平臺業者依前項終止外送服務契約，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、屬僱傭關係本應適用勞動基準法等相關規定，惟如非僱傭關係，為避免過度限縮外送平臺業者之經營權限，爰於第一項明定外送平臺業者得敘明理由後終止與外送員之外送服務契約，但應於二十日前預告。\n二、為避免外送平臺業者任意終止外送服務契約，致外送員經濟生活有不利影響，爰明定外送平臺業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110177680000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者違反外送服務契約或本法規定，致有損害外送員權益之虞。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他有關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定致損害外送員權益，爰於第一項賦予外送員得終止外送服務契約之權利。\n二、為使外送員合理行使第一項之契約終止權，於第二項明定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、復為彌補外送員因終止外送服務契約所受損失，於第三項明定外送員依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n四、第四項授權由中央主管機關訂定經濟補償之給付基準、期限、方式及其他相關事項之辦法。\n五、又如係外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第九條申訴制度之適用範圍。"},{"bill":"202110178160000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者違反外送服務契約或本法規定，致有損害外送員權益之虞。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他有關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定致損害外送員權益，爰於第一項賦予外送員得終止外送服務契約之權利。\n二、為使外送員合理行使第一項之契約終止權，於第二項明定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、復為彌補外送員因終止外送服務契約所受損失，於第三項明定外送員依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n四、第四項授權由中央主管機關訂定經濟補償之給付基準、期限、方式及其他相關事項之辦法。\n五、又如係外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第九條申訴制度之適用範圍。"},{"bill":"202110181420000","text":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者有違反外送服務契約或本法規定，致有損害外送員權益。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、為避免外送平臺業者任意違反外送服務契約或本法規定，致有外送員權益受損之情形，爰賦予外送員得終止外送服務契約之權利。並為彌補外送員所受損失，爰明定外送爰依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n二、為使外送員合理行使第一項之契約終止權，爰於第二項規定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第十條規定申訴機制之適用範圍。"}],"changed":true,"final":"外送平臺業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者違反外送服務契約、本法或其他法令規定，致有損害外送員權益之虞。\n外送員依前項規定終止外送服務契約，應自知悉其情形或損害結果之日起，三十日內為之。\n外送員依第一項規定終止外送服務契約，外送平臺業者應發給外送員經濟補償。\n前項經濟補償之給付基準、期限、方式及其他有關事項之辦法，由中央主管機關定之。","finalWhy":"一、為避免外送平臺業者於成立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞，或任意違反外送服務契約、本法或其他法令規定致損害外送員權益之虞，爰於第一項賦予外送員得終止外送服務契約之權利。\n二、為使外送員合理行使第一項之契約終止權，於第二項明定外送員應自知悉外送平臺業者有第一項各款情形或損害結果之日起三十日內為之。\n三、復為彌補外送員因終止外送服務契約所受損失，於第三項明定外送員依本條規定終止外送服務契約者，外送平臺業者應發給經濟補償。\n四、第四項授權由中央主管機關訂定經濟補償之給付基準、期限、方式及其他相關事項之辦法。\n五、又如係外送員依民法或其他規定終止外送服務契約者，不適用本條規定，亦非屬第九條申訴制度之適用範圍。","review":{"note":"照委員劉建國等16人提案通過","text":"外送平臺業者使外送員提供外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。"}},{"no":"第九條","current":null,"versions":[{"bill":"202110017580000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第四項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110060450000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第三項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110060680000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110060360000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110075210000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110099010000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第四項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110167670000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、查目前外送員報酬之計算方式，多由外送平臺業者單方決定，外送員僅得選擇接受與否，難以期待個別外送員與外送平臺業者有協商報酬能力。且各外送平臺業者報酬計算方式不一，難以覆核發給報酬之正確性。\n二、依公路法規規定，公路主管機關核定汽車客貨運基本運價，由運輸業者按核定基本運價，依實際服務計算運費，為保障外送員基本報酬，於第一項明定交通主管機關應依公路法規核定基本運價，包括起程費、續程費，並得加計等待費、樓層費、夜間加成費及春節加成費等項目，並為避免外送平臺業者任意調降報酬，於第二項明定每筆訂單之基本報酬不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定最低工資。\n三、第三項明定外送平臺業者應每月至少一次發給外送員報酬及報酬明細表，並參照勞動基準法規定，於第四項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"},{"bill":"202110167840000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"按勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，仍應適用勞動基準法規定。"},{"bill":"202110168030000","text":"交通主管機關依公路法規核定之運費，其項目應包括起程費、續程費，並得加計等待費、樓層費、夜間加成費及春節加成費。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於前項運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、查目前外送員報酬之計算方式，多由外送平臺業者單方決定，外送員僅得選擇接受與否，難以期待個別外送員與外送平臺業者有協商報酬能力。且各外送平臺業者報酬計算方式不一，難以覆核發給報酬之正確性。\n二、為保障外送員基本報酬，於第一項明定交通主管機關所核定運費應包含項目，並為避免外送平臺業者任意調降報酬，於第二項明定每筆訂單之基本報酬不得低於前項運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定最低工資。\n三、第三項明定外送平臺業者應每月至少一次發給外送員報酬及報酬明細表，並參照勞動基準法規定，於第四項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"},{"bill":"202110168140000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第四項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110168230000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"明定外送員與外送平台業者間為勞雇關係者，仍應適用《勞動基準法》規定。"},{"bill":"202110168240000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、查目前外送員報酬之計算方式，多由外送平臺業者單方決定，外送員僅得選擇接受與否，難以期待個別外送員與外送平臺業者有協商報酬能力。且各外送平臺業者報酬計算方式不一，難以覆核發給報酬之正確性。\n二、依公路法規規定，公路主管機關核定汽車客貨運基本運價，由運輸業者按核定基本運價，依實際服務計算運費，為保障外送員基本報酬，於第一項明定交通主管機關應依公路法規核定基本運價，包括起程費、續程費，並得加計等待費、樓層費、夜間加成費及春節加成費等項目，並為避免外送平臺業者任意調降報酬，於第二項明定每筆訂單之基本報酬不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定最低工資。\n三、第三項明定外送平臺業者應每月至少一次發給外送員報酬及報酬明細表，並參照勞動基準法規定，於第四項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"},{"bill":"202110169580000","text":"交通主管機關應依公路法及相關法規，核定外送服務基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者應全額直接給付報酬，並每月至少發給一次，且應提供載明下列事項之報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"本條為保障外送員合理報酬與資訊透明，明定交通主管機關應核定基本運價，業者報酬不得低於運價與最低工資，並應提供報酬明細與保存紀錄。"},{"bill":"202110170380000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、查目前外送員報酬之計算方式，多由外送平臺業者單方決定，外送員僅得選擇接受與否，難以期待個別外送員與外送平臺業者有協商報酬能力。且各外送平臺業者報酬計算方式不一，難以覆核發給報酬之正確性。\n二、依公路法規規定，公路主管機關核定汽車客貨運基本運價，由運輸業者按核定基本運價，依實際服務計算運費，為保障外送員基本報酬，於第一項明定交通主管機關應依公路法規核定基本運價，包括起程費、續程費，並得加計等待費、樓層費、夜間加成費及春節加成費等項目，並為避免外送平臺業者任意調降報酬，於第二項明定每筆訂單之基本報酬不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定最低工資。\n三、第三項明定外送平臺業者應每月至少一次發給外送員報酬及報酬明細表，並參照勞動基準法規定，於第四項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"},{"bill":"202110171160000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。\n外送平臺業者應揭露報酬計算方式、歷次調整及其依據。","note":"一、查目前外送員報酬之計算方式，多由外送平臺業者單方決定，外送員僅得選擇接受與否，難以期待個別外送員與外送平臺業者有協商報酬能力。且各外送平臺業者報酬計算方式不一，難以覆核發給報酬之正確性。\n二、依公路法規規定，公路主管機關核定汽車客貨運基本運價，由運輸業者按核定基本運價，依實際服務計算運費，為保障外送員基本報酬，於第一項明定交通主管機關應依公路法規核定基本運價，包括起程費、續程費，並得加計等待費、樓層費、夜間加成費及春節加成費等項目，並為避免外送平臺業者任意調降報酬，於第二項明定每筆訂單之基本報酬不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定最低工資。\n三、第三項明定外送平臺業者應每月至少一次發給外送員報酬及報酬明細表，並參照勞動基準法規定，於第四項明定業者應置備報酬清冊及保存年限，以保障外送員權益。\n四、確保報酬透明與協商機制。"},{"bill":"202110170780000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第三項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110173040000","text":"外送人員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送人員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送人員誤信而有受損害之虞。\n二、外送平台業者對外送人員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送人員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送人員經濟補償。\n外送人員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送人員可終止外送服務契約。\n二、為彌補外送人員所受損失，外送人員依前項終止外送服務契約者，外送平台業者應發給外送人員經濟補償。\n三、為使外送人員合理行使第一項之契約終止權，爰於第三項規定，外送人員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110173260000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"明定外送員與外送平台業者間為勞雇關係者，仍應適用《勞動基準法》規定。"},{"bill":"202110173180000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送員自消費者取得之小費，屬外送員與消費者間之個別給付，不得計入前項所定報酬總額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、查目前外送員報酬之計算方式，多由外送平臺業者單方決定，外送員僅得選擇接受與否，難以期待個別外送員與外送平臺業者有協商報酬能力。且各外送平臺業者報酬計算方式不一，難以覆核發給報酬之正確性。\n二、依公路法規規定，公路主管機關核定汽車客貨運基本運價，由運輸業者按核定基本運價，依實際服務計算運費，為保障外送員基本報酬，於第一項明定交通主管機關應依公路法規核定基本運價，包括起程費、續程費，並得加計等待費、樓層費、夜間加成費及春節加成費等項目，並為避免外送平臺業者任意調降報酬，於第二項明定每筆訂單之基本報酬不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定最低工資。\n三、第三項明定外送平臺業者應每月至少一次發給外送員報酬及報酬明細表，並參照勞動基準法規定，於第五項明定業者應置備報酬清冊及保存年限，以保障外送員權益。\n四、增訂第四項明定消費者給予外送員之小費係屬外送員因其個別表現而獲得消費者之額外支付所得，外送平臺業者不得將該小費收入計入其應支付予外送員之報酬中，以免小費成為外送平臺減少支付報酬成本之工具。"},{"bill":"202110173190000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、查目前外送員報酬之計算方式，多由外送平臺業者單方決定，外送員僅得選擇接受與否，難以期待個別外送員與外送平臺業者有協商報酬能力。且各外送平臺業者報酬計算方式不一，難以覆核發給報酬之正確性。\n二、依公路法規規定，公路主管機關核定汽車客貨運基本運價，由運輸業者按核定基本運價，依實際服務計算運費，為保障外送員基本報酬，於第一項明定交通主管機關應依公路法規核定基本運價，包括起程費、續程費，並得加計等待費、樓層費、夜間加成費及春節加成費等項目，並為避免外送平臺業者任意調降報酬，於第二項明定每筆訂單之基本報酬不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定最低工資。\n三、第三項明定外送平臺業者應每月至少一次發給外送員報酬及報酬明細表，並參照勞動基準法規定，於第四項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"},{"bill":"202110174530000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"明定外送員與外送平台業者間為勞雇關係者，仍應適用《勞動基準法》規定。"},{"bill":"202110174470000","text":"以下各款電磁紀錄，外送平台業者至少應保存兩年：\n一、消費者訂購商品之時間及內容。\n二、合作商家接受訂單及提供食品或商品之時間及內容。\n三、外送員提供外送服務之時間、地點及內容。\n四、消費者之付款與退費紀錄。\n五、消費者與客服人員之對話紀錄。\n六、合作商家與平台之客戶服務或爭議之處理紀錄。\n七、外送員與平台之申訴處理紀錄。\n八、貨款之計算方式及給付時間。\n九、其他與前七項有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平台業者不得拒絕。","note":"外送平台業者應就本條各款紀錄保存至少保存二年，以便提供主管機關調閱、執行行政監督及處理消費爭議，並明定有關機關要求調閱時，平台業者不得拒絕。"},{"bill":"202110174740000","text":"外送平臺業者應提供外送員載明下列事項之報酬明細表：\n一、報酬總額。\n二、薪資計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額及報酬明細等事項計入，並應保存五年。","note":"本條明定外送員薪資之計算方式與給付規範，確保報酬透明。另規定業者應提供報酬明細表與保存報酬清冊五年，以利查核與申訴依據，落實薪資保障原則。"},{"bill":"202110175620000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"為保障外送員基本報酬及資訊透明，爰於本條明定交通主管機關應依公路法規核定基本運價，且業者提供之報酬不得低於基本運價及基本工資，並應提供報酬明細及留存報酬清冊。"},{"bill":"202110175920000","text":"外送平臺業者應就下列事項建立申訴制度，提供外送員進行申訴：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示之。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立獨立處理小組，受理外送員之申訴。\n前項獨立處理小組應定期召開會議；其成員應符合下列規定：\n一、人數不得低於三人，其中工會代表至少一人。\n二、前款工會代表以外之小組成員，應由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。\n三、與外送平臺業者間無利害關係。","note":"一、外送員為外送平臺業者提供外送服務過程中，可能因報酬、停權及契約終止等事項與外送平臺業者發生爭議，或與合作商家及消費者發生外送服務爭議，若無有效之申訴管道，易造成外送員權益受損，爰為保障外送員之勞動權益及程序正義，於第一項明定外送平臺業者應建立申訴制度。\n二、第二項明定前開申訴制度應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並確保外送員知悉申訴程序與方式，以利其得針對終止契約、停權或其他不利決定提出申訴。\n三、此外，考量外送服務契約之終止，影響外送員工作權甚鉅，特於第三項明定外送平臺業者針對第七條之外送服務契約終止爭議，應成立獨立處理小組，公平、公正及客觀審查外送員提出之申訴案件，確保外送員能獲得充分陳述及救濟機會。\n四、第四項明定獨立處理小組應定期召開會議處理申訴案件，且小組成員不得低於三人，並應由外送員相關工會代表及具備一定資格之外部專家學者擔任，除維護外送員基本權益，亦有助提升外送平臺產業治理之透明度與公信力。\n五、另外送員如不服申訴處理結果，仍可透過行政調解或循司法途徑解決。"},{"bill":"202110176760000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第三項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110176980000","text":"外送平臺業者應就下列事項建立申訴制度，提供外送員進行申訴：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示之。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n前項處理小組應定期召開會議；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人，其中工會代表至少一人。\n二、前款工會代表以外之小組成員，應由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"要求外送平臺業者設置申訴制度，並針對契約終止爭議成立獨立處理小組，使外送員得以充分陳述意見、獲得公正審查與適當救濟，以保障其工作權與程序正義。"},{"bill":"202110177560000","text":"外送平臺業者有下列情形之一，外送員得終止外送服務契約：\n一、外送平臺業者於訂立外送服務契約時為虛偽意思表示，使外送員誤信而有受損害之虞。\n二、外送平臺業者對外送員有違反外送服務契約或本法規定致有法損害外送員權益之虞。\n三、其他法令另有規定而可歸責於外送平臺業者。\n外送員依前項終止外送服務契約者，外送平臺業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，二十日內為之。","note":"一、明定若係可歸責於外送平臺業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平臺業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第三項規定，外送員應自知悉外送平臺業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110177680000","text":"外送平臺業者應就下列事項建立申訴制度，提供外送員進行申訴：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示之。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立獨立處理小組，受理外送員之申訴。\n前項獨立處理小組應定期召開會議；其成員應符合下列規定：\n一、人數不得低於三人，其中工會代表至少一人。\n二、前款工會代表以外之小組成員，應由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。\n三、與外送平臺業者間無利害關係。","note":"一、外送員為外送平臺業者提供外送服務過程中，可能因報酬、停權及契約終止等事項與外送平臺業者發生爭議，或與合作商家及消費者發生外送服務爭議，若無有效之申訴管道，易造成外送員權益受損，爰為保障外送員之勞動權益及程序正義，於第一項明定外送平臺業者應建立申訴制度。\n二、第二項明定前開申訴制度應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並確保外送員知悉申訴程序與方式，以利其得針對終止契約、停權或其他不利決定提出申訴。\n三、此外，考量外送服務契約之終止影響外送員工作權甚鉅，特於第三項明定外送平臺業者針對第七條之外送服務契約終止爭議，應成立獨立處理小組，公平、公正及客觀審查外送員提出之申訴案件，確保外送員能獲得充分陳述及救濟機會。\n四、第四項明定獨立處理小組應定期召開會議處理申訴案件，且小組成員不得低於三人，並應由外送員相關工會代表及具備一定資格之外部專家學者擔任，除維護外送員基本權益，亦有助提升外送平臺產業治理之透明度與公信力。\n五、另外送員如不服申訴處理結果，仍可透過行政調解或循司法途徑解決。"},{"bill":"202110178160000","text":"外送平臺業者應就下列事項建立申訴制度，提供外送員進行申訴：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示之。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立獨立處理小組，受理外送員之申訴。\n前項獨立處理小組應定期召開會議；其成員應符合下列規定：\n一、人數不得低於三人，其中工會代表至少一人。\n二、前款工會代表以外之小組成員，應由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。\n三、與外送平臺業者間無利害關係。","note":"一、外送員為外送平臺業者提供外送服務過程中，可能因報酬、停權及契約終止等事項與外送平臺業者發生爭議，或與合作商家及消費者發生外送服務爭議，若無有效之申訴管道，易造成外送員權益受損，爰為保障外送員之勞動權益及程序正義，於第一項明定外送平臺業者應建立申訴制度。\n二、第二項明定前開申訴制度應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並確保外送員知悉申訴程序與方式，以利其得針對終止契約、停權或其他不利決定提出申訴。\n三、此外，考量外送服務契約之終止，影響外送員工作權甚鉅，特於第三項明定外送平臺業者針對第七條之外送服務契約終止爭議，應成立獨立處理小組，公平、公正及客觀審查外送員提出之申訴案件，確保外送員能獲得充分陳述及救濟機會。\n四、第四項明定獨立處理小組應定期召開會議處理申訴案件，且小組成員不得低於三人，並應由外送員相關工會代表及具備一定資格之外部專家學者擔任，除維護外送員基本權益，亦有助提升外送平臺產業治理之透明度與公信力。\n五、另外送員如不服申訴處理結果，仍可透過行政調解或循司法途徑解決。"},{"bill":"202110181420000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資。\n外送平臺業者給付外送員報酬，應全額直接給付，且每月至少定期發給一次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、查目前外送員報酬之計算方式，多由外送平臺業者單方決定，外送員僅得選擇接受與否，難以期待個別外送員與外送平臺業者有協商報酬能力。且各外送平臺業者報酬計算方式不一，難以覆核發給報酬之正確性。\n二、依公路法規規定，公路主管機關核定汽車客貨運基本運價，由運輸業者按核定基本運價，依實際服務計算運費，為保障外送員基本報酬，於第一項明定交通主管機關應依公路法規核定基本運價，包括起程費、續程費，並得加計等待費、樓層費、夜間加成費及春節加成費等項目，並為避免外送平臺業者任意調降報酬，於第二項明定每筆訂單之基本報酬不得低於依前項基本運價所訂之運費，且外送服務期間換算之每小時基本報酬，不得低於最低工資法所定最低工資。\n三、第三項明定外送平臺業者應每月至少一次發給外送員報酬及報酬明細表，並參照勞動基準法規定，於第四項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"}],"changed":true,"final":"外送平臺業者應就下列事項建立申訴制度，提供外送員進行申訴：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示之。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立獨立處理小組，受理外送員之申訴。\n前項獨立處理小組應定期召開會議；其成員應符合下列規定：\n一、人數不得低於三人，其中工會代表至少一人。\n二、前款工會代表以外之小組成員，應由具備勞動法令專業，或熟悉外送平臺產業實務運作，且與外送平臺業者間無利害關係之外部專家學者擔任。\n外送平臺業者不得因外送員提出本法之申訴或協助他人申訴，而對其為不利決定。","finalWhy":"一、外送員為外送平臺業者提供外送服務過程中，可能因報酬、停權及契約終止等事項與外送平臺業者發生爭議，或與合作商家及消費者發生外送服務爭議，若無有效之申訴管道，易造成外送員權益受損，爰為保障外送員之勞動權益及程序正義，於第一項明定外送平臺業者應建立申訴制度。\n二、第二項明定前開申訴制度應至少包括受理單位、處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並確保外送員知悉申訴程序與方式，以利其得針對終止契約、停權或其他不利決定等事項提出申訴。\n三、此外，考量外送服務契約之終止，影響外送員工作權甚鉅，特於第三項明定外送平臺業者針對第七條之外送服務契約終止爭議，應成立獨立處理小組，公平、公正及客觀審查外送員提出之申訴案件，確保外送員能獲得充分陳述及救濟機會。\n四、第四項明定獨立處理小組應定期召開會議處理申訴案件，且小組成員不得低於三人，並應由外送員相關工會代表及具備一定資格之外部專家學者擔任，除維護外送員基本權益，亦有助提升外送平臺產業治理之透明度與公信力。另因外送平臺業者為爭議當事人之一，當可列席說明，以利小組成員釐清判斷。\n五、為保障外送員提出本法之申訴或協助他人申訴之權利，爰於第五項明定外送平臺業者不得因此對其為不利決定。\n六、另外送員如不服申訴處理結果，仍可透過行政調解或循司法途徑解決。","review":{"note":"不予採納","text":""}},{"no":"第十條","current":null,"versions":[{"bill":"202110017580000","text":"外送平台業者應確保其程式之資訊安全及系統穩定度，並應遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。","note":"外送平台業者掌握大量重要個資及信用卡資訊，自應確保其程式之資訊安全及個人資料之保護。"},{"bill":"202110060450000","text":"外送平台業者應確保其程式之資訊安全及系統穩定度，應遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。","note":"外送平台業者掌握大量重要個資及信用卡資訊，自應確保其程式之資訊安全及個人資料之保護。"},{"bill":"202110060680000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110060360000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110075210000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110099010000","text":"外送平台業者於政府機關因天然災害宣布全日停止上班時，應停止營業，通知外送員。\n政府機關發布停止上班半日時，外送平台業者停止營業時間如下：\n一、上午半日停止上班：\n(一)如政府機關已發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至該發布時間，自該發布時間起正常對外營業。\n(二)如政府機關未發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至下午一時三十分，自下午一時三十分起正常對外營業。\n二、下午半日停止上班：\n(一)如政府機關已發布下午停止上班時間，以該發布時間為外送平台業者停止對外營業時間。\n(二)如政府機關未發布下午停止上班時間，外送平台業者停止對外營業時間為中午十二時至當日營業終止時間。","note":"參考臺北市外送平台業者管理自治條例第五條，明定於政府機關因天然災害宣布全日或半日停止上班時，外送平台業者應停止營業，爰制定本條規定，確保外送員安全。"},{"bill":"202110167670000","text":"外送平臺業者對外送員，應建立下列事項之申訴制度：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、救濟管道與處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n前項處理小組應定期召開會議；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"一、明定外送平臺業者應對於外送員建立申訴制度。\n二、為保障外送員權益，避免外送平臺業者片面對外送員終止外送服務契約、停權或其他不利對待，爰明定外送平臺業者應建立對於外送員建立申訴制度，並應明確使外送員知悉。\n三、因外送平臺業者與外送員終止外送服務契約影響其工作權甚鉅，爰於第三、四項規定明定外送平臺業者應針對終止外送服務契約事項設立申訴處理小組，受理外送員申訴終止外送服務契約案件。\n四、前開申訴處理小組之組成人員、召開定期會議之期間等，由外送平臺業者依其處理外送服務契約終止申訴案件之需求，於符合第四項規定辦理。\n五、外送員如不服申訴處理結果，可透過行政調解或循司法途徑解決。"},{"bill":"202110167840000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，影響該新型經濟型態產業之發展，爰於第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、為避免外送平台業者任意終止外送服務契約，對外送員之經濟生活有不利影響，爰課予外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110168030000","text":"外送平臺業者對外送員，應建立下列事項之申訴及救濟制度：\n一、報酬金額、計算方式、給付時間。\n二、停權、違規、終止契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴及救濟制度，應至少包括受理單位、救濟管道與處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n外送平臺業者不得因外送員提出申訴或協助他人申訴，而予以終止契約、停權或其他不利對待。\n第三項處理小組成員應定期召開；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"一、本條明定外送平臺業者應對於外送員建立申訴及救濟制度。\n二、為保障外送員權益，避免外送平臺業者片面對外送員終止契約、停權或其他不利對待，爰明定外送平臺業者應建立對於外送員建立申訴及救濟制度，並應明確使外送員知悉。\n三、因外送平臺業者與外送員終止外送服務契約影響其工作權甚鉅，爰於第三、五項規定明定外送平臺業者應針對終止契約事項設立申訴處理小組，受理外送員申訴終止契約案件。"},{"bill":"202110168140000","text":"外送平台業者應確保其程式之資訊安全及系統穩定度，並應遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。","note":"外送平台業者掌握大量重要個資及信用卡資訊，自應確保其程式之資訊安全及個人資料之保護。"},{"bill":"202110168230000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、第二項明定外送平台業者依第一項終止外送服務契約時，應提供外送員補償之義務。\n三、第二項之補償之給付標準、期限及其他相關事項之規定，授權由主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110168240000","text":"外送平台業者就限制、暫停或終止外送員帳戶、拒絕支付全部或部分之外送員工作報酬之事項、消費者就消費關係所發生之爭議，應建立申訴委員會。\n申訴委員會成員應包含工會代表、具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者。\n前項工會代表、具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者不得少於二分之一，單一性別不得少於三分之一。\n委員會之組成、運作方式、申訴救濟程序等，由中央主管機關另定之。\n外送平台業者不得因外送員提出申訴或協助他人申訴，而對其做出任何不利之處分。","note":"一、為保障外送員之工作權益，防止外送平台業者於限制、暫停或終止帳戶、拒絕支付報酬及消費爭議等重大事項上，欠缺透明與救濟機制，爰明定外送平台業者應建立申訴委員會，作為外送員救濟與爭議處理之正式管道，確保外送員得以依法申訴，維護其勞動及報酬權益。\n二、考量外送平台多採取演算法或自動化決策進行派單與績效管理，外送員如遭停權、降薪或帳戶終止，往往難以取得充分資訊自我辯護，致權益受損。為確保申訴程序之公平性與客觀性，第二項明定委員會成員應包含工會代表、具備勞動法令專業或熟悉外送平臺產業實務之外部專家學者，並於第三項進一步要求前揭成員不得少於委員會總人數之二分之一，且單一性別比例不得少於三分之一，以平衡勞資代表性並促進性別平等，確保委員會運作之專業性、公正性與多元性。\n三、為統一制度標準並兼顧各外送平台規模及業務特性之差異，第四項授權中央主管機關訂定委員會之組成、運作方式及申訴救濟程序等相關細節，使外送員在不同平台皆享有一致且可行之申訴權保障。\n四、為防止外送平台業者對行使申訴權或協助他人申訴之外送員施以報復性處分，第五項明定業者不得因外送員提出申訴或協助他人申訴，而對其為停權、解僱、降調、減薪或其他不利之處分，並確立保護「吹哨者」之原則，以維護申訴制度之實效與外送員行使權利之安全。"},{"bill":"202110169580000","text":"外送平臺業者應建立外送員申訴制度，申訴範圍如下：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應包括受理單位、救濟管道、處理流程與時限、回覆方式及補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立申訴處理小組，受理外送員之申訴。\n前項小組應定期召開會議，其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"本條要求外送平臺建立透明且獨立的申訴制度，並設立處理小組處理終止契約爭議，以保障外送員救濟權益。"},{"bill":"202110170380000","text":"外送平臺業者對外送員，應建立下列事項之申訴制度：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、救濟管道與處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n前項處理小組應定期召開會議；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"一、明定外送平臺業者應對於外送員建立申訴制度。\n二、為保障外送員權益，避免外送平臺業者片面對外送員終止外送服務契約、停權或其他不利對待，爰明定外送平臺業者應建立對於外送員建立申訴制度，並應明確使外送員知悉。\n三、因外送平臺業者與外送員終止外送服務契約影響其工作權甚鉅，爰於第三、四項規定明定外送平臺業者應針對終止外送服務契約事項設立申訴處理小組，受理外送員申訴終止外送服務契約案件。\n四、前開申訴處理小組之組成人員、召開定期會議之期間等，由外送平臺業者依其處理外送服務契約終止申訴案件之需求，於符合第四項規定辦理。\n五、外送員如不服申訴處理結果，可透過行政調解或循司法途徑解決。"},{"bill":"202110171160000","text":"外送平臺業者對外送員，應建立下列事項之申訴制度：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n外送平臺為前項第二款之決定，不得僅以自動化管理為之，應建立人工覆核機制。\n第一項申訴制度，應至少包括受理單位、救濟管道與處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n前項處理小組應定期召開會議；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"一、明定外送平臺業者應對於外送員建立申訴制度。\n二、為保障外送員權益，避免外送平臺業者片面對外送員終止外送服務契約、停權或其他不利對待，爰明定外送平臺業者應建立對於外送員建立申訴制度，並應明確使外送員知悉。\n三、因外送平臺業者對外送員為停權或終止外送服務契約之決定影響其工作權甚鉅，爰於第三項至第五項規定明定外送平臺業者不得僅以自動化管理決定，應建立人工覆核機制，且應針對終止外送服務契約事項設立申訴處理小組，受理外送員申訴終止外送服務契約案件。\n四、前開申訴處理小組之組成人員、召開定期會議之期間等，由外送平臺業者依其處理外送服務契約終止申訴案件之需求，於符合第四項規定辦理。\n五、外送員如不服申訴處理結果，可透過行政調解或循司法途徑解決。"},{"bill":"202110170780000","text":"外送平台業者應確保其程式之資訊安全及系統穩定度，並應遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。","note":"外送平台業者掌握大量重要個資及信用卡資訊，自應確保其程式之資訊安全及個人資料之保護。"},{"bill":"202110173040000","text":"外送平台業者應確保其程式之資訊安全及系統穩定度，並應遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送人員權益。","note":"外送平台業者掌握大量重要個資及信用卡資訊，自應確保其程式之資訊安全及個人資料之保護。"},{"bill":"202110173260000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、第二項明定外送平台業者依第一項終止外送服務契約時，應提供外送員補償之義務。\n三、第二項之補償之給付標準、期限及其他相關事項之規定，授權由主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110173180000","text":"外送平臺業者對外送員，應建立下列事項之申訴制度：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、救濟管道與處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者使用演算法管理者，除有第七條情形外，凡涉及暫時或永久停權等對外送員權益有重大影響之自動化決策，外送員有權要求針對外送平臺業者應指派一位具備審查與覆核權限的真人管理者進行重新審查，並在七日內獲得書面回覆。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n前項處理小組應定期召開會議；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"一、明定外送平臺業者應對於外送員建立申訴制度。\n二、為保障外送員權益，避免外送平臺業者片面對外送員終止外送服務契約、停權或其他不利對待，爰明定外送平臺業者應建立對於外送員建立申訴制度，並應明確使外送員知悉。\n三、另為免演算法管理造成的演算法偏差或歧視侵害外送員權益，爰參酌歐盟PWD規範增訂第三項明定除外送員涉有重大違法情節情形以外之涉及暫時或永久停權等對於外送員權益有重大影響之自動化決策必須由外送平臺業者指派具有審核權限之真人管理者進行重新審查之覆核。\n四、因外送平臺業者與外送員終止外送服務契約影響其工作權甚鉅，爰於第四、五項規定明定外送平臺業者應針對終止外送服務契約事項設立申訴處理小組，受理外送員申訴終止外送服務契約案件。\n五、前開申訴處理小組之組成人員、召開定期會議之期間等，由外送平臺業者依其處理外送服務契約終止申訴案件之需求，於符合第五項規定辦理。\n六、外送員如不服申訴處理結果，可透過行政調解或循司法途徑解決。"},{"bill":"202110173190000","text":"外送平臺業者對外送員，應建立下列事項之申訴制度：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、救濟管道與處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n前項處理小組應定期召開會議；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。\n申訴內容涉及外送平臺業者演算法管理，外送平臺業者就該決定理由之存在，應負舉證責任。","note":"一、明定外送平臺業者應對於外送員建立申訴制度。\n二、為保障外送員權益，避免外送平臺業者片面對外送員終止外送服務契約、停權或其他不利對待，爰明定外送平臺業者應建立對於外送員建立申訴制度，並應明確使外送員知悉。\n三、因外送平臺業者與外送員終止外送服務契約影響其工作權甚鉅，爰於第三、四項規定明定外送平臺業者應針對終止外送服務契約事項設立申訴處理小組，受理外送員申訴終止外送服務契約案件。\n四、前開申訴處理小組之組成人員、召開定期會議之期間等，由外送平臺業者依其處理外送服務契約終止申訴案件之需求，於符合第四項規定辦理。\n五、外送員如不服申訴處理結果，可透過行政調解或循司法途徑解決。"},{"bill":"202110174530000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、第一項明定外送平台業者得隨時終止與外送員之外送服務契約。但應於三十日前預告外送員。\n二、第二項明定外送平台業者依第一項終止外送服務契約時，應提供外送員補償之義務。\n三、第二項之補償之給付標準、期限及其他相關事項之規定，授權由主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110174470000","text":"外送平台業者應於外送平台介面客戶端明確揭示下列各款事項：\n一、商品重量、體積及價格。\n二、運費或運費以外應付之金額。\n三、消費者取消訂單之退費機制。\n四、外送平台業者得取消訂單之情事及退費機制。\n五、商品遲延交付、交付商品之種類或數量與訂單不符及商品損壞之處理方式、收退費用及補償措施。","note":"有鑒於消費者係透過網際網路於外送平台購買商品或食品，為保障消費者權益，提供充分完整訂購資訊，以利降低消費糾紛，故明定外送平台業者應明確揭示之事項。"},{"bill":"202110174740000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險；未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項商業保險之投保種類及投保額度，由中央主管機關會同金融主管機關、交通主管機關共同定之。","note":"一、要求平臺於外送員提供服務前，為其投保商業保險，並明訂投保種類與額度由中央主管機關定之，以強化外送員之職業風險保障。另要求平臺提供保險文件予外送員留存，確保資訊透明。\n二、外送平臺業者應提供外送員之商業保險，涉及保險商品規畫等事項，爰於第三項明訂中央主管機關會同金融主管機關、交通主管機關等機關定之。"},{"bill":"202110175620000","text":"外送平臺業者對外送員，應建立下列事項之申訴制度：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、救濟管道與處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n前項處理小組應定期召開會議；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"本條明定外送平臺業者應對於外送員建立申訴制度並公開揭示，且對於終止外送服務契約之爭議應成立處理小組，以受理外送員之申訴。"},{"bill":"202110175920000","text":"外送平臺業者應依下列規定，為已成立外送服務契約之外送員投保團體傷害保險及責任保險；未投保前，不得使外送員提供外送服務：\n一、保險契約期間：\n(一)團體傷害保險：外送服務契約有效期間。\n(二)責任保險：上線期間。\n二、符合中央主管機關公告之保險範圍及最低保險金額。\n三、以書面或電子方式提供保險契約及繳費明細予外送員收執，並保存一年。\n外送員連續逾十四日無提供外送服務紀錄者，外送平臺業者始得暫時停止辦理投保前項保險。","note":"一、考量外送員於提供外送服務期間，因頻繁使用道路面臨交通事故及人身安全等高風險情境，為使外送員於發生交通意外時，其人身及財產損害得透過保險制度適當填補，爰參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險等相關規定，於第一項明定外送平臺業者應為已成立外送服務契約之外送員投保團體傷害保險及責任保險等相關遵循事項。\n二、另為避免發生道德風險及衡平外送平臺業者之義務，於第二項明定外送平臺業者得暫時停止辦理投保之情事。"},{"bill":"202110176760000","text":"外送平台業者應確保其程式之資訊安全及系統穩定度，應遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。","note":"外送平台業者掌握大量重要個資及信用卡資訊，自應確保其程式之資訊安全及個人資料之保護。"},{"bill":"202110176980000","text":"外送平臺業者應依下列規定，為已成立外送服務契約之外送員投保團體傷害保險及責任保險；未投保前，不得使外送員提供外送服務：\n一、保險契約期間：\n(一)團體傷害保險：外送服務契約有效期間。\n(二)責任保險：上線期間。\n二、符合中央主管機關公告之保險範圍及最低保險金額。\n三、以書面或電子方式提供保險契約及繳費明細予外送員收執，並保存一年。\n外送員連續逾十四日無提供外送服務紀錄者，外送平臺業者始得暫時停止辦理投保前項保險。","note":"一、規範外送平臺業者應為外送員投保團體傷害保險及責任保險，並符合保險期間、範圍與最低金額之規定。\n二、平台需提供保險契約與繳費資料予外送員，以確保其保險權益。\n三、明定平台得於特定情況下暫緩受理投保，以避免道德風險。"},{"bill":"202110177560000","text":"外送平臺業者與外送員間非僱傭關係者，外送員應依勞工保險條例及勞工職業災害保險及保護法，透過所屬職業工會或由本人辦理參加勞工保險及勞工職業災害保險。\n外送平臺業者應負擔前項外送員自行負擔之保險費，外送員得檢附繳費證明，向外送平臺業者申請給付，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務者，僅得向其中一業者申請前項給付。","note":"一、考量外送員於提供外送服務期間，暴露於道路交通風險，且外送平臺業者之盈利，主要來自外送員提供之外送服務，若非僱傭關係之情形，對於外送員之保障較為不足，故於第一項明定，外送員應透過職業工會參加勞工保險及勞工職業災害保險。\n二、外送平臺業者應負擔外送員自行負擔之保險費費用，而由外送員檢附繳費證明向外送平臺業者申請。\n三、考量部分外送員可能有同時於二個以上外送平臺提供外送服務之情形，為避免重複申請費用，於第二項明定僅得擇一家外送平臺業者申請支付保險費。至保險費之申請期限等有關事項，另於本法施行細則定之。"},{"bill":"202110177680000","text":"外送平臺業者應依下列規定，為已成立外送服務契約之外送員投保團體傷害保險及責任保險未投保前，不得使外送員提供外送服務：\n一、保險契約期間：\n(一)團體傷害保險：外送服務契約有效期間。\n(二)責任保險：上線期間。\n二、符合中央主管機關公告之保險範圍及最低保險金額。\n三、以書面或電子方式提供保險契約及繳費明細予外送員收執，並保存一年。\n外送員連續逾十四日無提供外送服務紀錄者，外送平臺業者始得暫時停止辦理投保前項保險。","note":"一、考量外送員於提供外送服務期間，因頻繁使用道路面臨交通事故及人身安全等高風險情境，為使外送員於發生交通意外時，其人身及財產損害得透過保險制度適當填補，爰參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險等相關規定，於第一項明定外送平臺業者應為已成立外送服務契約之外送員投保團體傷害保險及責任保險等相關遵循事項。\n二、另為避免發生道德風險及衡平外送平臺業者之義務，於第二項明定外送平臺業者得暫時停止辦理投保之情事。"},{"bill":"202110178160000","text":"外送平臺業者應依下列規定，為已成立外送服務契約之外送員投保團體傷害保險及責任保險；未投保前，不得使外送員提供外送服務：\n一、保險契約期間：\n(一)團體傷害保險：外送服務契約有效期間。\n(二)責任保險：上線期間。\n二、符合中央主管機關公告之保險範圍及最低保險金額。\n三、以書面或電子方式提供保險契約及繳費明細予外送員收執，並保存一年。\n外送員連續逾十四日無提供外送服務紀錄者，外送平臺業者始得暫時停止辦理投保前項保險。","note":"一、考量外送員於提供外送服務期間，因頻繁使用道路面臨交通事故及人身安全等高風險情境，為使外送員於發生交通意外時，其人身及財產損害得透過保險制度適當填補，爰參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險等相關規定，於第一項明定外送平臺業者應為已成立外送服務契約之外送員投保團體傷害保險及責任保險等相關遵循事項。\n二、另為避免發生道德風險及衡平外送平臺業者之義務，於第二項明定外送平臺業者得暫時停止辦理投保之情事。"},{"bill":"202110181420000","text":"外送平臺業者對外送員，應建立下列事項之申訴制度：\n一、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對於外送員不利決定。\n三、外送員與合作商家或消費者就外送服務所發生之爭議。\n前項申訴制度，應至少包括受理單位、救濟管道與處理流程、處理時間、回復方式及申訴成立後之補償措施等內容，並由外送平臺業者公開揭示。\n外送平臺業者應就其依第七條規定與外送員終止外送服務契約之爭議，成立處理小組，受理外送員之申訴。\n前項處理小組應定期召開會議；其成員應符合下列規定，並與外送平臺業者間無利害關係：\n一、人數不得低於三人。\n二、由具備勞動法令專業，或熟悉外送平臺產業實務運作之外部專家學者擔任。","note":"一、明定外送平臺業者應對於外送員建立申訴制度。\n二、為保障外送員權益，避免外送平臺業者片面對外送員終止外送服務契約、停權或其他不利對待，爰明定外送平臺業者應建立對於外送員建立申訴制度，並應明確使外送員知悉。\n三、因外送平臺業者與外送員終止外送服務契約影響其工作權甚鉅，爰於第三、四項規定明定外送平臺業者應針對終止外送服務契約事項設立申訴處理小組，受理外送員申訴終止外送服務契約案件。\n四、前開申訴處理小組之組成人員、召開定期會議之期間等，由外送平臺業者依其處理外送服務契約終止申訴案件之需求，於符合第四項規定辦理。\n五、外送員如不服申訴處理結果，可透過行政調解或循司法途徑解決。"}],"changed":true,"final":"外送平臺業者應依下列規定，為已成立外送服務契約之外送員投保團體傷害保險及責任保險；未投保前，不得使外送員提供外送服務：\n一、保險契約期間：\n(一)團體傷害保險：外送服務契約有效期間。\n(二)責任保險：上線期間。\n二、符合中央主管機關公告之保險範圍及最低保險金額。\n三、以書面或電子方式提供保險契約予外送員收執，並保存一年。\n外送員連續逾三日無提供外送服務紀錄者，外送平臺業者始得暫時停止辦理投保前項保險。","finalWhy":"一、考量外送員於提供外送服務期間，因頻繁使用道路面臨交通事故及人身安全等高風險情境，為使外送員於發生交通意外時，其人身及財產損害得透過保險制度適當填補，爰參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險等相關規定，於第一項明定外送平臺業者應為已成立外送服務契約之外送員投保團體傷害保險及責任保險等相關遵循事項。\n二、另為避免發生道德風險及衡平外送平臺業者之義務，於第二項明定外送平臺業者得暫時停止辦理投保之情事。","review":{"note":"不予採納","text":""}},{"no":"第十一條","current":null,"versions":[{"bill":"202110017580000","text":"外送平台業者應於外送合作契約、外送服務契約成立後七日內，提供書面或電磁紀錄予合作商家、外送員收執。\n契約非經合作商家或外送員同意，不得變更。\n未於契約內約定且涉及合作商家或外送員權利義務之事項，外送平台業者以網際網路、公告、郵件、書面、或其他方法表示者，為契約內容之變更。","note":"一、為維護合作商家、外送員權益，規定於契約成立後七日內，外送平台業者應提供書面或電磁紀錄予合作商家及外送員。\n二、觀察外送產業實際運作，外送平台業者透過網際網路通知或公告有關外送員、合作商家之權利義務變更事項，事實上已涉及契約內容變更，應得合作商家或外送員同意，爰訂定第二項及第三項。"},{"bill":"202110060450000","text":"外送平台業者應於外送合作契約、外送服務契約成立後七日內，提供書面或電磁紀錄予合作商家、外送員收執。\n契約非經合作商家或外送員同意，不得變更。\n未於契約內約定且涉及合作商家或外送員權利義務之事項，外送平台業者以網際網路、公告、郵件、書面、或其他方法表示者，為契約內容之變更。","note":"一、為維護合作商家、外送員權益，規定於契約成立後七日內，外送平台業者應提供書面或電磁紀錄予合作商家及外送員。\n二、觀察外送產業實際運作，外送平台業者透過網際網路通知或公告有關外送員、合作商家之權利義務變更事項，事實上已涉及契約內容變更，應得合作商家或外送員同意，爰訂定第二項及第三項。"},{"bill":"202110060680000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第四項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110060360000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第四項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110075210000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第四項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110099010000","text":"外送平台業者應確保其程式之資訊安全及系統穩定度，應遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。","note":"外送平台業者掌握大量重要個資及信用卡資訊，自應確保其程式之資訊安全及個人資料之保護。"},{"bill":"202110167670000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"一、參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險及財產保險相關規定，於第一項明定外送平臺業者投保義務，並於第二項明定外送平臺業者應公開保險內容及保存資料，以保障外送員權益。\n二、因外送平臺業者應提供外送員之商業保險為外送平臺治理範疇，且涉及保險商品規劃等事項，爰於第三項明定由中央主管機關會商交通主管機關及金融主管機關等機關定之。"},{"bill":"202110167840000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、此類可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第四項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110168030000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"一、參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險及財產保險相關規定，於第一項明定外送平臺業者投保義務，並於第二項明定外送平臺業者應公開保險內容及保存資料，以保障外送員權益。\n二、因外送平臺業者應提供外送員之商業保險為外送平臺治理範疇，且涉及保險商品規劃等事項，爰於第三項明定由中央主管機關定之，並得會商交通主管機關及金融主管機關等機關定之。"},{"bill":"202110168140000","text":"外送平台業者應於外送合作契約、外送服務契約成立後七日內，提供書面或電磁紀錄予合作商家、外送員收執。\n契約非經合作商家或外送員同意，不得變更。\n未於契約內約定且涉及合作商家或外送員權利義務之事項，外送平台業者以網際網路、公告、郵件、書面、或其他方法表示者，為契約內容之變更。","note":"一、為維護合作商家、外送員權益，規定於契約成立後七日內，外送平台業者應提供書面或電磁紀錄予合作商家及外送員。\n二、觀察外送產業實際運作，外送平台業者透過網際網路通知或公告有關外送員、合作商家之權利義務變更事項，事實上已涉及契約內容變更，應得合作商家或外送員同意，爰訂定第二項及第三項。"},{"bill":"202110168230000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，給予外送員補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、明定可歸責於外送平台業者之因，外送員可終止外送服務契約。\n二、為補償外送員因停止外送所受之損失，外送員因前項終止契約者，外送平台業者應發給合理之補償。\n三、為確保外送員合理行使第一項之契約終止權，爰於第三項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內行使之。"},{"bill":"202110168240000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"一、參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險及財產保險相關規定，於第一項明定外送平臺業者投保義務，並於第二項明定外送平臺業者應公開保險內容及保存資料，以保障外送員權益。\n二、因外送平臺業者應提供外送員之商業保險為外送平臺治理範疇，且涉及保險商品規劃等事項，爰於第三項明定由中央主管機關會商交通主管機關及金融主管機關等機關定之。"},{"bill":"202110169580000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險；未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度及相關事項，由中央主管機關會同相關部會定之。","note":"本條明定外送平臺業者投保商業保險義務，並規範資訊揭露及保存，以確保外送員於執行業務時獲得基本保障。"},{"bill":"202110170380000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"一、參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險及財產保險相關規定，於第一項明定外送平臺業者投保義務，並於第二項明定外送平臺業者應公開保險內容及保存資料，以保障外送員權益。\n二、因外送平臺業者應提供外送員之商業保險為外送平臺治理範疇，且涉及保險商品規劃等事項，爰於第三項明定由中央主管機關會商交通主管機關及金融主管機關等機關定之。"},{"bill":"202110171160000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"一、參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險及財產保險相關規定，於第一項明定外送平臺業者投保義務，並於第二項明定外送平臺業者應公開保險內容及保存資料，以保障外送員權益。\n二、因外送平臺業者應提供外送員之商業保險為外送平臺治理範疇，且涉及保險商品規劃等事項，爰於第三項明定由中央主管機關會商交通主管機關及金融主管機關等機關定之。"},{"bill":"202110170780000","text":"外送平台業者應於外送合作契約、外送服務契約成立後七日內，提供書面或電磁紀錄予合作商家、外送員收執。\n契約非經合作商家或外送員同意，不得變更。\n未於契約內約定且涉及合作商家或外送員權利義務之事項，外送平台業者以網際網路、公告、郵件、書面、或其他方法表示者，為契約內容之變更。","note":"一、為維護合作商家、外送員權益，規定於契約成立後七日內，外送平台業者應提供書面或電磁紀錄予合作商家及外送員。\n二、觀察外送產業實際運作，外送平台業者透過網際網路通知或公告有關外送員、合作商家之權利義務變更事項，事實上已涉及契約內容變更，應得合作商家或外送員同意，爰訂定第二項及第三項。"},{"bill":"202110173040000","text":"外送平台業者應於外送合作契約、外送服務契約成立後七日內，提供書面或電磁紀錄予合作商家、外送人員收執。\n契約非經合作商家或外送人員同意，不得變更。\n未於契約內約定且涉及合作商家或外送人員權利義務之事項，外送平台業者以網際網路、公告、郵件、書面或其他方法表示者，為契約內容之變更。","note":"一、為維護合作商家、外送人員權益，規定於契約成立後七日內，外送平台業者應提供書面或電磁紀錄予合作商家及外送人員。\n二、觀察外送產業實際運作，外送平台業者透過網際網路通知或公告有關外送人員、合作商家之權利義務變更事項，事實上已涉及契約內容變更，應得合作商家或外送人員同意，爰訂定第二項及第三項。"},{"bill":"202110173260000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、明定可歸責於外送平台業者之因，外送員可終止外送服務契約。\n二、為補償外送員因停止外送所受之損失，外送員因前項終止契約者，外送平台業者應發給合理之補償。\n三、為確保外送員合理行使第一項之契約終止權，爰於第三項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內行使之。"},{"bill":"202110173180000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"一、參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險及財產保險相關規定，於第一項明定外送平臺業者投保義務，並於第二項明定外送平臺業者應公開保險內容及保存資料，以保障外送員權益。\n二、因外送平臺業者應提供外送員之商業保險為外送平臺治理範疇，且涉及保險商品規劃等事項，爰於第三項明定由中央主管機關會商交通主管機關及金融主管機關等機關定之。"},{"bill":"202110173190000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"一、參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險及財產保險相關規定，於第一項明定外送平臺業者投保義務，並於第二項明定外送平臺業者應公開保險內容及保存資料，以保障外送員權益。\n二、因外送平臺業者應提供外送員之商業保險為外送平臺治理範疇，且涉及保險商品規劃等事項，爰於第三項明定由中央主管機關會商交通主管機關及金融主管機關等機關定之。"},{"bill":"202110174530000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，給予外送員補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、明定可歸責於外送平台業者之因，外送員可終止外送服務契約。\n二、為補償外送員因停止外送所受之損失，外送員因前項終止契約者，外送平台業者應發給合理之補償。\n三、為確保外送員合理行使第一項之契約終止權，爰於第三項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內行使之。"},{"bill":"202110174470000","text":"外送平台業者應建立下列申訴制度：\n一、外送員停權、違規及終止契約處分。\n二、報酬之金額、計算方式及給付時間。\n三、消費者就消費關係所發生之爭議。\n前項第一款、第二款申訴之相關準則，由中央主管機關定之，並由外送平台業者以書面或其他適當方式告知外送員；前項第三款申訴之方式，由外送平台業者自行訂定，報經行政院消費者保護處備查後，於外送平台介面公告之。","note":"一、外送平台業者常因外送員收到消費者投訴而對其作停權處分，卻未提供外送員客訴內容，且無救濟管道，對外送員之保障顯未完善。為保障外送員權益，另為貫徹保障消費者權益之立法目的，爰於第一項明定外送平台業者應建立申訴制度，受理有關外送員與消費者之申訴。\n二、外送員不服外送平台業者之停權處分及報酬計算方式，應由中央主管機關訂定申訴之相關準則；消費者申訴之方式則由外送平台業者自行訂定相關準則，報經行政院消費者保護處備查後，於外送平台介面公告之。"},{"bill":"202110174740000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險者，得檢附繳費證明，向外送平臺業者申請支付自行負擔之保險費；外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務者，僅得向其中一業者申請前項給付。","note":"本條保障外送員得申請平臺負擔其職災保險費用，減輕外送員負擔，並防止平臺拒絕。若外送員於多平臺工作，僅得擇一申請，避免重複補貼。"},{"bill":"202110175620000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"本條明定外送平臺業者應為外送員投保商業保險，並提供保險內容與保存資料予外送員及保存紀錄一年，以保障外送員權益。"},{"bill":"202110175920000","text":"外送平臺業者使外送員提供外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，尊重其提供勞務之意願，爰規定外送平臺業者應於外送員於指定應用程式上線後，始得使其提供外送服務，且不得強制排定外送員上線期間，亦不得違反外送員意願使其維持上線狀態。另明定外送平臺業者並應尊重外送員自由接單之權利，不得因外送員拒絕接單或選擇下線休息而為不利對待。"},{"bill":"202110176760000","text":"外送平台業者應於外送合作契約、外送服務契約成立後七日內，提供書面或電磁紀錄予合作商家、外送員收執。\n契約非經合作商家或外送員同意，不得變更。\n未於契約內約定且涉及合作商家或外送員權利義務之事項，外送平台業者以網際網路、公告、郵件、書面、或其他方法表示者，為契約內容之變更。","note":"一、為維護合作商家、外送員權益，規定於契約成立後七日內，外送平台業者應提供書面或電磁紀錄予合作商家及外送員。\n二、觀察外送產業實際運作，外送平台業者透過網際網路通知或公告有關外送員、合作商家之權利義務變更事項，事實上已涉及契約內容變更，應得合作商家或外送員同意，爰訂定第二項及第三項。"},{"bill":"202110176980000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"保障外送員自主工作權，明定外送平臺業者不得強制排定上線時段、要求維持上線，亦不得因拒單或休息而進行不利對待，以確保外送員離線權、休息權與避免變相強迫勞動。"},{"bill":"202110177560000","text":"外送員於外送服務期間，發生下列職業災害時，外送平臺業者應於知悉後八小時內通報勞動檢查機構：\n一、嚴重傷害或死亡。\n二、道路交通事故導致中度傷害且須住院治療。","note":"參酌職業安全衛生法第三十七條發生職業災害雇主應通報之規定，及「執行職務遭受不法侵害預防指引」相關內容，爰規定若外送員發生嚴重傷害或死亡，或因道路交通事故而中度傷害需住院者，外送平臺業者於知悉後應於八小時內通報勞動檢查機構。"},{"bill":"202110177680000","text":"外送平臺業者使外送員提供外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，尊重其提供勞務之意願，爰規定外送平臺業者應於外送員於指定應用程式上線後，始得使其提供外送服務，且不得強制排定外送員上線期間，亦不得違反外送員意願使其維持上線狀態。另明定外送平臺業者並應尊重外送員自由接單之權利，不得因外送員拒絕接單或選擇下線休息而為不利對待。"},{"bill":"202110178160000","text":"外送平臺業者使外送員提供外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，尊重其提供勞務之意願，爰規定外送平臺業者應於外送員於指定應用程式上線後，始得使其提供外送服務，且不得強制排定外送員上線期間，亦不得違反外送員意願使其維持上線狀態。另明定外送平臺業者並應尊重外送員自由接單之權利，不得因外送員拒絕接單或選擇下線休息而為不利對待。"},{"bill":"202110181420000","text":"外送平臺業者與外送員成立外送服務契約時，應為外送員投保商業保險。外送平臺業者未投保前，不得使外送員提供外送服務。\n外送平臺業者應將前項投保商業保險之保險契約及繳費明細，提供書面或電子資料予外送員收執，並保存一年。\n第一項保險之投保種類及投保額度等事項，由中央主管機關定之。","note":"一、參考勞動部「外送作業安全衛生指引」所定外送平臺業者應提供外送員人身保險及財產保險相關規定，於第一項明定外送平臺業者投保義務，並於第二項明定外送平臺業者應公開保險內容及保存資料，以保障外送員權益。\n二、因外送平臺業者應提供外送員之商業保險為外送平臺治理範疇，且涉及保險商品規劃等事項，爰於第三項明定由中央主管機關會商交通主管機關及金融主管機關等機關定之。"}],"changed":true,"final":"外送平臺業者使外送員提供外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","finalWhy":"為保障外送員離線權，尊重其提供勞務之意願，爰規定外送平臺業者應於外送員於指定應用程式上線後，始得使其提供外送服務，且不得強制排定外送員上線期間，亦不得違反外送員意願使其維持上線狀態。另明定外送平臺業者並應尊重外送員自由接單之權利，不得因外送員拒絕接單或選擇下線休息而為不利對待。","review":{"note":"修正通過","text":"外送平臺業者應依下列規定，為已成立外送服務契約之外送員投保團體傷害保險及責任保險；未投保前，不得使外送員提供外送服務：\n一、保險契約期間：\n(一)團體傷害保險：外送服務契約有效期間。\n(二)責任保險：上線期間。\n二、符合中央主管機關公告之保險範圍及最低保險金額。\n三、以書面或電子方式提供保險契約予外送員收執，並保存一年。\n外送員連續逾三日無提供外送服務紀錄者，外送平臺業者始得暫時停止辦理投保前項保險。"}},{"no":"第十二條","current":null,"versions":[{"bill":"202110017580000","text":"外送合作契約應記載下列事項：\n一、外送平台業者收取之各項費用金額或比例。\n二、外送平台業者提供之設備及其維護修繕方式及費用。\n三、外送平台業者之客服聯絡方式，應至少記載電話、電子郵件。\n四、貨款或服務給付時間及給付方式。\n五、爭議款項處理機制。\n六、合作商家負責人變更之處理機制。\n七、同一消費者之同一訂單，經取消或訂單內容毀損，經外送平台業者要求再次給付相同訂單內容之貨款處理機制。\n前條及前項規定，於外送平台業者對於合作商家之平台業務招攬行為，準用之。","note":"一、本條規定外送合作契約應記載事項。\n二、此種業務招攬行為實質上為債權契約、雙務契約，惟觀察外送實務運作，此種契約多以外送平台業者之員工以口頭或通訊軟體聯繫，通常無法明確了解雙方權利義務及何時開始執行行銷、廣告或擴大訂餐範圍之執行成效，爰明定準用前條及本條第一項規定。"},{"bill":"202110060450000","text":"外送合作契約應記載下列事項：\n一、外送平台業者收取之各項費用金額或比例。\n二、外送平台業者提供之設備及其維護修繕方式及費用。\n三、外送平台業者之客服聯絡方式，應至少記載電話、電子郵件。\n四、貨款或服務給付時間及給付方式。\n五、爭議款項處理機制。\n六、合作商家負責人變更之處理機制。\n七、同一消費者之同一訂單，經取消或訂單內容毀損，經外送平台業者要求再次給付相同訂單內容之貨款處理機制。\n前條及前項規定，於外送平台業者對於合作商家之平台業務招攬行為，準用之。","note":"本條規定外送合作契約應記載事項。"},{"bill":"202110060680000","text":"外送員於提供外送服務時，發生道路交通事故致人於死或重傷，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"依審計部109年度中央政府總決算審核報告，當年度道路交通事故有61.09%之肇事主因屬登錄為外送車輛所致，同年度亦有30,683輛外送車輛、29,378位外送員共計有50,224次重大違規，顯見實有必要就外送員引發之交通安全風險加以立法規範，爰明定外送員於提供外送服務時，發生交通事故致人於死或重傷，且經鑑定為肇事原因或肇事主因者，應於三個月內完成參加四十八小時道路交通安全講習，始得提供外送服務，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110060360000","text":"外送員於提供外送服務時，發生道路交通事故致人於死或重傷，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"依審計部109年度中央政府總決算審核報告，當年度道路交通事故有61.09%之肇事主因屬登錄為外送車輛所致，同年度亦有30,683輛外送車輛、29,378位外送員共計有50,224次重大違規，顯見實有必要就外送員引發之交通安全風險加以立法規範，爰明定外送員於提供外送服務時，發生交通事故致人於死或重傷，且經鑑定為肇事原因或肇事主因者，應於三個月內完成參加四十八小時道路交通安全講習，始得提供外送服務，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110075210000","text":"外送員於提供外送服務時，發生道路交通事故致人於死或重傷，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"依審計部109年度中央政府總決算審核報告，當年度道路交通事故有61.09%之肇事主因屬登錄為外送車輛所致，同年度亦有30,683輛外送車輛、29,378位外送員共計有50,224次重大違規，顯見實有必要就外送員引發之交通安全風險加以立法規範，爰明定外送員於提供外送服務時，發生交通事故致人於死或重傷，且經鑑定為肇事原因或肇事主因者，應於三個月內完成參加四十八小時道路交通安全講習，始得提供外送服務，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110099010000","text":"外送平台業者應於外送合作契約、外送服務契約成立後七日內，提供書面或電磁紀錄予合作商家、外送員收執。\n契約非經合作商家或外送員同意，不得變更。\n未於契約內約定且涉及合作商家或外送員權利義務之事項，外送平台業者以網際網路、公告、郵件、書面、或其他方法表示者，為契約內容之變更。","note":"一、為維護合作商家、外送員權益，規定於契約成立後七日內，外送平台業者應提供書面或電磁紀錄予合作商家及外送員。\n二、觀察外送產業實際運作，外送平台業者透過網際網路通知或公告有關外送員、合作商家之權利義務變更事項，事實上已涉及契約內容變更，應得合作商家或外送員同意，爰訂定第二項及第三項。"},{"bill":"202110167670000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，並避免外送員過勞影響健康及增加交通事故風險、尊重其提供勞務之意願，爰規定外送員於指定應用程式上線後，外送平臺業者始得使其提供外送服務，且不得強制排定外送員上線期間或違反外送員意願使其維持上線狀態。"},{"bill":"202110167840000","text":"外送員於提供外送服務時，發生道路交通事故致人於死或重傷，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"本條明定外送員於提供外送服務時，發生交通事故致人於死或重傷，且經鑑定為肇事原因或肇事主因者，應於三個月內完成參加四十八小時道路交通安全講習，始得提供外送服務，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110168030000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，並避免外送員過勞影響健康及增加交通事故風險、尊重其提供勞務之意願，爰規定外送員於指定應用程式上線後，外送平臺業者始得使其提供外送服務，且不得強制排定外送員上線期間或違反外送員意願使其維持上線狀態。"},{"bill":"202110168140000","text":"外送合作契約應記載下列事項：\n一、外送平台業者收取之各項費用金額或比例。\n二、外送平台業者提供之設備及其維護修繕方式及費用。\n三、外送平台業者之客服聯絡方式，應至少記載電話、電子郵件。\n四、貨款或服務給付時間及給付方式。\n五、爭議款項處理機制。\n六、合作商家負責人變更之處理機制。\n七、同一消費者之同一訂單，經取消或訂單內容毀損，經外送平台業者要求再次給付相同訂單內容之貨款處理機制。\n前條及前項規定，於外送平台業者對於合作商家之平台業務招攬行為，準用之。","note":"一、本條規定外送合作契約應記載事項。\n二、此種業務招攬行為實質上為債權契約、雙務契約，惟觀察外送實務運作，此種契約多以外送平台業者之員工以口頭或通訊軟體聯繫，通常無法明確了解雙方權利義務及何時開始執行行銷、廣告或擴大訂餐範圍之執行成效，爰明定準用前條及本條第一項規定。"},{"bill":"202110168230000","text":"外送員於提供外送服務時，發生道路交通重大事故，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成七十二小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"明定外送員於提供外送服務時，發生道路交通重大事故，且經鑑定為肇事原因或肇事主因者，應於三個月內完成參加七十二小時道路交通安全講習，始得提供外送服務，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110168240000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，並避免外送員過勞影響健康及增加交通事故風險、尊重其提供勞務之意願，爰規定外送員於指定應用程式上線後，外送平臺業者始得使其提供外送服務，且不得強制排定外送員上線期間或違反外送員意願使其維持上線狀態。"},{"bill":"202110169580000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線時間，或違反其意願要求持續上線。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息者，不得予以不利對待。","note":"本條保障外送員自主上線與休息權，避免業者強迫接單或長時工作，以防過勞與提升行車安全。"},{"bill":"202110170380000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，並避免外送員過勞影響健康及增加交通事故風險、尊重其提供勞務之意願，爰規定外送員於指定應用程式上線後，外送平臺業者始得使其提供外送服務，且不得強制排定外送員上線期間或違反外送員意願使其維持上線狀態。"},{"bill":"202110171160000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。\n三、外送員有權自主決定上線與下線時間；於天災或危險氣候期間得拒絕出勤，不得受不利處分。","note":"一、為保障外送員離線權，並避免外送員過勞影響健康及增加交通事故風險、尊重其提供勞務之意願，爰規定外送員於指定應用程式上線後，外送平臺業者始得使其提供外送服務，且不得強制排定外送員上線期間或違反外送員意願使其維持上線狀態。\n二、落實工作自主與職安保障。"},{"bill":"202110170780000","text":"外送合作契約應記載下列事項：\n一、外送平台業者收取之各項費用金額或比例。\n二、外送平台業者提供之設備及其維護修繕方式及費用。\n三、外送平台業者之客服聯絡方式，應至少記載電話、電子郵件。\n四、貨款或服務給付時間及給付方式。\n五、爭議款項處理機制。\n六、合作商家負責人變更之處理機制。\n七、同一消費者之同一訂單，經取消或訂單內容毀損，經外送平台業者要求再次給付相同訂單內容之貨款處理機制。\n前條及前項規定，於外送平台業者對於合作商家之平台業務招攬行為，準用之。","note":"一、本條規定外送合作契約應記載事項。\n二、此種業務招攬行為實質上為債權契約、雙務契約，惟觀察外送實務運作，此種契約多以外送平台業者之員工以口頭或通訊軟體聯繫，通常無法明確了解雙方權利義務及何時開始執行行銷、廣告或擴大訂餐範圍之執行成效，爰明定準用前條及本條第一項規定。"},{"bill":"202110173040000","text":"外送合作契約應記載下列事項：\n一、外送平台業者收取之各項費用金額或比例。\n二、外送平台業者提供之設備及其維護修繕方式及費用。\n三、外送平台業者之客服聯絡方式，應至少記載電話、電子郵件。\n四、貨款或服務給付時間及給付方式。\n五、爭議款項處理機制。\n六、合作商家負責人變更之處理機制。\n七、同一消費者之同一訂單，經取消或訂單內容毀損，經外送平台業者要求再次給付相同訂單內容之貨款處理機制。\n前條及前項規定，於外送平台業者對於合作商家之平台業務招攬行為，準用之。","note":"一、本條規定外送合作契約應記載事項。\n二、此種業務招攬行為實質上為債權契約、雙務契約，惟觀察外送實務運作，此種契約多為外送平台業者以口頭或通訊軟體聯繫，通常無法明確了解雙方權利義務及何時開始執行行銷、廣告或擴大訂餐範圍之執行成效，爰明定準用前條及本條第一項規定。"},{"bill":"202110173260000","text":"外送員於提供外送服務時，發生道路交通事故致人於死或重傷，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"明定外送員於提供外送服務時，發生道路交通重大事故，且經鑑定為肇事原因或肇事主因者，應於三個月內完成參加七十二小時道路交通安全講習，始得提供外送服務，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110173180000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，並避免外送員過勞影響健康及增加交通事故風險、尊重其提供勞務之意願，爰規定外送員於指定應用程式上線後，外送平臺業者始得使其提供外送服務，且不得強制排定外送員上線期間或違反外送員意願使其維持上線狀態。"},{"bill":"202110173190000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。\n三、外送平臺業者發派外送服務予外送員時，其運送之單項商品重量與體積，以及單筆訂單之總重量及總體積，應符合道路交通安全規則關於機車附載物品之規定。","note":"一、為保障外送員離線權，並避免外送員過勞影響健康及增加交通事故風險、尊重其提供勞務之意願，爰規定外送員於指定應用程式上線後，外送平臺業者始得使其提供外送服務，且不得強制排定外送員上線期間或違反外送員意願使其維持上線狀態。\n二、外送員在執行外送服務時，受天候、交通、身體狀況等多重因素影響，需保有自主判斷是否接單或下線之權利。惟現行外送平臺業者之演算法管理，可能使外送員因拒絕接單或休息而遭降權、減少派單或停權，故明確禁止外送平臺業者因外送員拒絕接單或下線休息而為不利對待，以保障外送員之工作安全與自主。\n三、現行《道路交通安全規則》對機車附載物品已有重量與體積相關規範，惟外送平臺業者派單未必完全與法規一致，且外送員常難以於派單時得知訂單商品之重量或體積，形成先接單才知道超載的風險，藉由立法明確要求外送平臺業者於派單時即應確保運送商品符合道路交通安全相關法規，不得派送超過法定限制之商品，建立派單安全基準，以避免外送員被迫於違規或不安全情況下執行外送服務，提升外送服務安全性。"},{"bill":"202110174530000","text":"外送員於提供外送服務時，發生道路交通重大事故，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成七十二小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"明定外送員於提供外送服務時，發生道路交通重大事故，且經鑑定為肇事原因或肇事主因者，應於三個月內完成參加七十二小時道路交通安全講習，始得提供外送服務，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110174470000","text":"外送平台業者使外送員為外送服務時，應符合下列規定：\n一、上線後始得提供外送服務。\n二、不得違反外送員之意願，使其維持上線狀態。","note":"有鑒於外送員與一般提供勞務之態樣仍有所差異，為尊重外送員提供勞務之意願，亦為避免外送員過勞，增加交通意外風險，爰規定外送平台應於外送員上線後始得使其為外送服務，且對於已上線之外送員，不得違反其意願，使其維持上線之狀態。"},{"bill":"202110174740000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年對提供外送服務之外送員，應要求其至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等事項，由中央主管機關、交通主管機關及衛生福利主管機關共同定之；其總時數不得低於四小時。","note":"要求平臺對外送員提供交通、職業及食品安全訓練，並明定最低訓練時數。由勞動、交通及衛福三主管機關共同定訂實施細則，並要求總時數不得低於四小時。"},{"bill":"202110175620000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"本條明定外送員享有離線權，以避免外送員過勞影響健康及增加交通事故風險，並尊重其提供勞務之意願，且外送平臺業者對於外送員行使離線權，不得有不利對待。"},{"bill":"202110175920000","text":"外送員依勞工職業災害保險及保護法第七條或第十條規定，由其所屬職業工會或由本人辦理參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請支付其自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺提供外送服務，僅得擇一申請。","note":"一、考量外送員於提供外送服務期間，暴露於道路交通風險，且外送平臺業者之盈利，主要來自外送員提供之外送服務。故為加強外送員提供外送服務期間之職業災害保險保障，爰於第一項明定，外送員依勞工職業災害保險及保護法第七條或第十條規定，透過職業工會或簡便方式參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請自行負擔之保險費，外送平臺業者不得拒絕。\n二、考量部分外送員可能有同時於二個以上外送平臺提供外送服務之情形，為避免重複申請費用，於第二項明定僅得擇一家外送平臺業者申請支付保險費。至保險費之申請期限等有關事項，將另於本法施行細則定之。"},{"bill":"202110176760000","text":"外送合作契約應記載下列事項：\n一、外送平台業者收取之各項費用金額或比例。\n二、外送平台業者提供之設備及其維護修繕方式及費用。\n三、外送平台業者之客服聯絡方式，應至少記載電話、電子郵件。\n四、貨款或服務給付時間及給付方式。\n五、爭議款項處理機制。\n六、合作商家負責人變更之處理機制。\n七、同一消費者之同一訂單，經取消或訂單內容毀損，經外送平台業者要求再次給付相同訂單內容之貨款處理機制。\n前條及前項規定，於外送平台業者對於合作商家之平台業務招攬行為，準用之。","note":"本條規定外送合作契約應記載事項。"},{"bill":"202110176980000","text":"外送員依勞工職業災害保險及保護法第七條或第十條規定，由其所屬職業工會或由本人辦理參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"外送員得申請其自行負擔之職業災害保險保費，外送平臺業者不得拒絕，以確保外送員享有職災保障。"},{"bill":"202110177560000","text":"外送員於提供外送服務時，發生道路交通事故致人於死或重傷，或有重大影響交通安全之行為，道路主管機關應通知外送平臺暫停外送員之外送服務。\n外送平臺應提供運送安全講習，外送員應於三個月內完成四十八小時運送安全講習，未於期限內完成者，外送平臺業者不得指派其提供外送服務。","note":"為促使外送員重視交通安全，明定外送員如於提供外送服務時，有發生致人於死或重傷之行為，抑或有違反交通主管機關認定為影響交通安全之重大行為時，外送平臺業者應依交通主管機關通知要求於指定期限內，安排該外送員參加運送安全講習；未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110177680000","text":"外送員依勞工職業災害保險及保護法第七條或第十條規定，由其所屬職業工會或由本人辦理參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請支付其自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺提供外送服務，僅得擇一申請。","note":"一、考量外送員於提供外送服務期間，暴露於道路交通風險，且外送平臺業者之盈利，主要來自外送員提供之外送服務。故為加強外送員提供外送服務期間之職業災害保險保障爰於第一項明定，外送員依勞工職業災害保險及保護法第七條或第十條規定，透過職業工會或簡便方式參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請自行負擔之保險費，外送平臺業者不得拒絕。\n二、考量部分外送員可能有同時於二個以上外送平臺提供外送服務之情形，為避免重複申請費用，於第二項明定僅得擇一家外送平臺業者申請支付保險費。至保險費之申請期限等有關事項，將另於本法施行細則定之。"},{"bill":"202110178160000","text":"外送員依勞工職業災害保險及保護法第七條或第十條規定，由其所屬職業工會或由本人辦理參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請支付其自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺提供外送服務，僅得擇一申請。","note":"一、考量外送員於提供外送服務期間，暴露於道路交通風險，且外送平臺業者之盈利，主要來自外送員提供之外送服務。故為加強外送員提供外送服務期間之職業災害保險保障，爰於第一項明定，外送員依勞工職業災害保險及保護法第七條或第十條規定，透過職業工會或簡便方式參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請自行負擔之保險費，外送平臺業者不得
