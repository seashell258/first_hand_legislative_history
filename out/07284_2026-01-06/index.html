拒絕。\n二、考量部分外送員可能有同時於二個以上外送平臺提供外送服務之情形，為避免重複申請費用，於第二項明定僅得擇一家外送平臺業者申請支付保險費。至保險費之申請期限等有關事項，將另於本法施行細則定之。"},{"bill":"202110181420000","text":"外送平臺業者使外送員從事外送服務時，應符合下列規定：\n一、外送平臺業者不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、外送平臺業者對於外送員拒絕接單或選擇下線休息，不得有不利對待。","note":"為保障外送員離線權，並避免外送員過勞影響健康及增加交通事故風險、尊重其提供勞務之意願，爰規定外送員於指定應用程式上線後，外送平臺業者始得使其提供外送服務，且不得強制排定外送員上線期間或違反外送員意願使其維持上線狀態。"}],"changed":true,"final":"外送員依勞工職業災害保險及保護法第七條或第十條規定，由其所屬職業工會或由本人辦理參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請支付其自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺提供外送服務，僅得擇一申請。","finalWhy":"一、考量外送員於提供外送服務期間，暴露於道路交通風險，且外送平臺業者之盈利，主要來自外送員提供之外送服務。故為加強外送員提供外送服務期間之職業災害保險保障，爰於第一項明定，外送員依勞工職業災害保險及保護法第七條或第十條規定，透過職業工會或簡便方式參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請自行負擔之保險費，外送平臺業者不得拒絕。\n二、考量部分外送員可能有同時於二個以上外送平臺提供外送服務之情形，為避免重複申請費用，於第二項明定僅得擇一家外送平臺業者申請支付保險費。至保險費之申請期限等有關事項，將另於本法施行細則定之。","review":{"note":"照委員劉建國等16人提案通過","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、收取服務及運送費用金額或比例、貨款結算與支付方式、食品安全與衛生管理、爭議處理機制、契約期間與終止條件及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。"}},{"no":"第十三條","current":null,"versions":[{"bill":"202110017580000","text":"外送服務契約應記載下列事項：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、外送服務應具備之設備、程式或工具。\n四、外送服務基本流程。\n五、因不可歸責於外送員之事由，致無法完成外送服務之處理機制。\n六、前條第一項第三款。","note":"一、本條規定外送服務契約應記載事項。\n二、外送員進行外送服務時，常有消費者地址錯誤、無法聯繫或商品項目過多、包裝過大無法載運、或發生交通事故致無法完成外送服務之情事。又觀察媒體報導，曾有多起消費者地址錯誤且外送員無法與消費者取得聯繫，經外送員以外送平台業者內部規定程序取消訂單後，致外送員遭消費者提告侵占之情形，宜明定處理機制以便釐清權責為妥。"},{"bill":"202110060450000","text":"外送服務契約應記載下列事項：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、外送服務應具備之設備、程式或工具。\n四、外送服務基本流程。\n五、因不可歸責於外送員之事由，致無法完成外送服務之處理機制。\n六、前條第一項第三款。","note":"本條規定外送服務契約應記載事項。"},{"bill":"202110060680000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務系外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定：「為保障建教生權益，建教合作機構應履行下列義務：六、準用勞工保險條例之規定，為建教生辦理參加勞工保險。」應準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110060360000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定：「為保障建教生權益，建教合作機構應履行下列義務：六、準用勞工保險條例之規定，為建教生辦理參加勞工保險。」應準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110075210000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務系外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定：「為保障建教生權益，建教合作機構應履行下列義務：六、準用勞工保險條例之規定，為建教生辦理參加勞工保險。」應準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110099010000","text":"外送合作契約應記載下列事項：\n一、外送平台業者收取之各項費用金額或比例。\n二、外送平台業者提供之設備及其維護修繕方式及費用。\n三、外送平台業者之客服聯絡方式，應至少記載電話、電子郵件。\n四、貨款或服務給付時間及給付方式。\n五、爭議款項處理機制。\n六、合作商家負責人變更之處理機制。\n七、同一消費者之同一訂單，經取消或訂單內容毀損，經外送平台業者要求再次給付相同訂單內容之貨款處理機制。\n前條及前項規定，於外送平台業者對於合作商家之平台業務招攬行為，準用之。","note":"一、本條規定外送合作契約應記載事項。\n二、此種業務招攬行為實質上為債權契約、雙務契約，惟觀察外送實務運作，此種契約多以外送平台業者之員工以口頭或通訊軟體聯繫，通常無法明確了解雙方權利義務及何時開始執行行銷、廣告或擴大訂餐範圍之執行成效，爰明定準用前條及本條第一項規定。"},{"bill":"202110167670000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。","note":"為便於合作商家經營管理及保障外送員工作安全，明定政府機關因天然災害宣布停止上班時，外送平臺業者應停止營業，並通知合作商家及外送員。"},{"bill":"202110167840000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務系外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定：「為保障建教生權益，建教合作機構應履行下列義務：六、準用勞工保險條例之規定，為建教生辦理參加勞工保險。」應準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110168030000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。","note":"為便於合作商家經營管理及保障外送員工作安全，明定政府機關因天然災害宣布停止上班時，外送平臺業者應停止營業，並通知合作商家及外送員。"},{"bill":"202110168140000","text":"外送服務契約應記載下列事項：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、外送服務應具備之設備、程式或工具。\n四、外送服務基本流程。\n五、因不可歸責於外送員之事由，致無法完成外送服務之處理機制。\n六、前條第一項第三款。","note":"一、本條規定外送服務契約應記載事項。\n二、外送員進行外送服務時，常有消費者地址錯誤、無法聯繫或商品項目過多、包裝過大無法載運、或發生交通事故致無法完成外送服務之情事。又觀察媒體報導，曾有多起消費者地址錯誤且外送員無法與消費者取得聯繫，經外送員以外送平台業者內部規定程序取消訂單後，致外送員遭消費者提告侵占之情形，宜明定處理機制以便釐清權責為妥。"},{"bill":"202110168230000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務系外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌《勞動基準法》及《高級中等學校建教合作實施及建教生權益保障法》相關規定，明定應準用《勞工保險條例》及《勞工職業災害保險及保護法》規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110168240000","text":"天然災害發生時，經外送員工作所在地、居住地區、正常外送必經地區之轄區首長發布停止上班，或確實因災害導致出勤有困難者，外送平台業者不得要求外送員出勤。\n於前項情形外送平台業者不得扣發報酬，亦不得限制、暫停或終止外送員帳戶。","note":"參考各地方之外送平台業者管理自治條例相關規範，明定於政府機關因天然災害宣布停止上班時，外送平台業者應停止營業，爰制定本條規定，確保外送員安全。"},{"bill":"202110169580000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。","note":"本條規定外送平臺於天然災害停班時須同步停止營業並通知相關人員，以維護外送員安全並利於商家管理。"},{"bill":"202110170380000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。","note":"為便於合作商家經營管理及保障外送員工作安全，明定政府機關因天然災害宣布停止上班時，外送平臺業者應停止營業，並通知合作商家及外送員。"},{"bill":"202110171160000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。","note":"為便於合作商家經營管理及保障外送員工作安全，明定政府機關因天然災害宣布停止上班時，外送平臺業者應停止營業，並通知合作商家及外送員。"},{"bill":"202110170780000","text":"外送服務契約應記載下列事項：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、外送服務應具備之設備、程式或工具。\n四、外送服務基本流程。\n五、因不可歸責於外送員之事由，致無法完成外送服務之處理機制。\n六、前條第一項第三款。","note":"一、本條規定外送服務契約應記載事項。\n二、外送員進行外送服務時，常有消費者地址錯誤、無法聯繫或商品項目過多、包裝過大無法載運、或發生交通事故致無法完成外送服務之情事。又觀察媒體報導，曾有多起消費者地址錯誤且外送員無法與消費者取得聯繫，經外送員以外送平台業者內部規定程序取消訂單後，致外送員遭消費者提告侵占之情形，宜明定處理機制以便釐清權責為妥。"},{"bill":"202110173040000","text":"外送服務契約應記載下列事項：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、外送服務應具備之設備、程式或工具。\n四、外送服務基本流程。\n五、因不可歸責於外送人員之事由，致無法完成外送服務之處理機制。\n六、前條第一項第三款。","note":"一、本條規定外送服務契約應記載事項。\n二、外送人員進行外送服務時，常有消費者地址錯誤、無法聯繫或商品項目過多、包裝過大無法載運、或發生交通事故致無法完成外送服務之情事。亦曾有多起消費者地址錯誤且外送人員無法與消費者取得聯繫，經外送人員以外送平台業者內部規定程序取消訂單後，致外送人員遭消費者提告侵占之情形，宜明定處理機制以便釐清權責為妥。"},{"bill":"202110173260000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務系外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌《勞動基準法》及《高級中等學校建教合作實施及建教生權益保障法》相關規定，明定應準用《勞工保險條例》及《勞工職業災害保險及保護法》規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110173180000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。\n前項情形，若僅部分地區發布豪大雨或其他災害警戒卻未宣布停止上班而嚴重影響外送安全時，外送平臺業者應依災害影響範圍，暫停該地區之外送服務，並即時通知受影響之合作商家及外送員。","note":"一、為便於合作商家經營管理及保障外送員工作安全，明定政府機關因天然災害宣布停止上班時，外送平臺業者應停止營業，並通知合作商家及外送員。\n二、另為因應極端氣候造成之特殊情況，如颱風雖未登陸，卻因共拌效應導致局部地區發生嚴重之暴風雨情況而有嚴重影響機車外送之安全時，爰增訂第二項明定外送平臺於特殊氣候情況時應針對該局部地區停止營業，以保障安全。"},{"bill":"202110173190000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。\n外送平臺業者於因天然災害致使外送員繼續外送服務有發生危險之虞時，應即採取足以保障外送員安全之必要措施。","note":"一、為便於合作商家經營管理及保障外送員工作安全，明定政府機關因天然災害宣布停止上班時，外送平臺業者應停止營業，並通知合作商家及外送員。\n二、基於外送員外送服務長時間處於交通狀態及其受氣候影響之高風險特性，外送平臺業者於天然災害發生惟政府機關未宣布停止上班時，應審酌外送服務行經區域危險性，採取足以保障外送員安全之必要措施。"},{"bill":"202110174530000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。\n外送平台業者應於外送服務契約成立時，或外送員請求時，以書面或電子方式，主動告知外送員依規定得申請保險金之權利與程序。","note":"外送員提供之勞務系外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌《勞動基準法》及《高級中等學校建教合作實施及建教生權益保障法》相關規定，明定應準用《勞工保險條例》及《勞工職業災害保險及保護法》規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110174470000","text":"外送員與外送平台業者間為僱傭關係者，應適用勞動基準法規定。","note":"基於勞動基準法第三條第三項本文：「本法適用於一切勞雇關係。」爰於本條明定外送員與外送平台業者間為勞雇關係者，應適用勞動基準法規定。"},{"bill":"202110174740000","text":"外送員於提供外送服務時，若違反交通主管機關認定之重大影響交通安全之行為，外送平臺業者應暫停其提供外送服務。\n外送平臺業者應依前項通知，於改善期內完成對該外送員之運送安全講習；於完成講習前，外送平臺業者不得使其提供外送服務。\n安全講習應於三個月內完成，且總時數不得低於四十八小時；未於期限內完成者，任一外送平臺業者應停止指派其提供外送服務。","note":"為促使外送員積極注意交通安全，規範外送員發生重大交通違規時，平臺應暫停其服務並要求參與安全講習。講習須於三個月內完成且達48小時，未完成者不得再執行外送，以提升交通安全責任。"},{"bill":"202110175620000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。","note":"為便於合作商家經營管理及保障外送員工作安全，明定政府機關因天然災害宣布停止上班時，外送平臺業者應停止營業，並主動通知合作商家及外送員。"},{"bill":"202110175920000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載及不得記載事項，報請行政院核定後公告之。","note":"明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約應記載及不得記載事項，並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110176760000","text":"外送服務契約應記載下列事項：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、外送服務應具備之設備、程式或工具。\n四、外送服務基本流程。\n五、因不可歸責於外送員之事由，致無法完成外送服務之處理機制。\n六、前條第一項第三款。","note":"本條規定外送服務契約應記載事項。"},{"bill":"202110176980000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載及不得記載事項，報請行政院核定後公告之。","note":"授權目的事業主管機關就外送平臺與消費者間之權利義務擬訂定型化契約應記載及不得記載事項，使服務契約更為公平透明。"},{"bill":"202110177560000","text":"外送平臺業者對新加入之外送員，應提供至少四小時之職業安全、交通安全及食品衛生安全教育訓練課程。\n已完成前項教育訓練課程之從業外送員，每年應接受至少二小時之教育訓練課程。","note":"參酌臺北市外送平臺業者管理自治條例第八條，提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員及預防災變所需之認知，外送平臺業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育訓練課程。"},{"bill":"202110177680000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載及不得記載事項，報請行政院核定後公告之。","note":"明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約應記載及不得記載事項並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110178160000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載及不得記載事項，報請行政院核定後公告之。","note":"明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約應記載及不得記載事項，並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110181420000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。","note":"為便於合作商家經營管理及保障外送員工作安全，明定政府機關因天然災害宣布停止上班時，外送平臺業者應停止營業，並通知合作商家及外送員。"}],"changed":true,"final":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載及不得記載事項，報請行政院核定後公告之。","finalWhy":"明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約應記載及不得記載事項，並報請行政院核定後公告之，供外送平臺業者遵循。","review":{"note":"照委員劉建國等16人提案通過","text":"外送平臺業者於政府機關因天然災害宣布停止上班之地區，應停止營業，並通知合作商家及外送員。"}},{"no":"第十四條","current":null,"versions":[{"bill":"202110017580000","text":"外送平台業者應發給外送員報酬明細表，每月至少一次。\n報酬之計算包含多種項目者，應按每一項目明列，於報酬明細表以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式，不得僅列總額。\n計算報酬之項目係以事實為基礎計算者，應依該正確事實計算，並使外送員得即時查閱。\n外送平台業者提供合作商家貨款明細表，準用本條規定。","note":"一、第一項明訂外送平台業者應每月至少一次發給外送員報酬明細表。\n二、現行主要外送平台報酬計算方式不一，且難以核對，為維護外送員、合作商家權益，於第二項規定報酬計算包含多種項目，例如：里程費、接單費、額外獎勵（金）、按時段加碼或其他名稱等。除應以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式。\n三、報酬明細表記載設例如下：某單之接單費：40元；里程數2公里計30元；按時段或臨時公告加發20元，合計80元。倘以總單數為條件發放額外獎金另發500元，亦應將總單數及金額明列於報酬明細表或於網頁、指定使用應用程式或其他方式按件分項明列，不得僅列總額。\n四、第三項所謂以事實為基礎者，以距離為基礎計算報酬為例，應依外送員實際移動距離計算；以接單數為獎勵門檻，自應將接單數明示；以接單率為條件者，應將其計算方式及實際接單數、拒絕接單數明示。\n五、按外送平台業者為促進消費者消費，對合作商家業務招攬，經常以提供折扣吸引消費者，致合作商家貨款遭受影響，參考現行外送產業實務運作，要求比照報酬明細表，應依每一訂單、每一項目、折扣金額予以詳列；實務運作曾有外送平台業者以公告方式對合作商家要求「接單率」，未達一定比例每單得扣除部分貨款，參考前點說明，應一併明示，於第四項規定外送平台業者提供合作商家貨款明細表準用本條規定。"},{"bill":"202110060450000","text":"外送平台業者應發給外送員報酬明細表，每月至少一次。\n報酬之計算包含多種項目者，應按每一項目明列，於報酬明細表以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式，不得僅列總額。\n前項報酬費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n計算報酬之項目係以事實為基礎計算者，應依該正確事實計算，並使外送員得即時查閱。\n外送平台業者提供合作商家貨款明細表，準用本條規定。","note":"一、第一項明訂外送平台業者應每月至少一次發給外送員報酬明細表。\n二、現行主要外送平台報酬計算方式不一，且難以核對，為維護外送員、合作商家權益，於第二項規定報酬計算包含多種項目，例如：里程費、接單費、額外獎勵（金）、按時段加碼或其他名稱等。除應以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式。\n三、報酬明細表記載設例如下：某單之接單費：40元；里程數2公里計30元；按時段或臨時公告加發20元，合計80元。倘以總單數為條件發放額外獎金另發500元，亦應將總單數及金額明列於報酬明細表或於網頁、指定使用應用程式或其他方式按件分項明列，不得僅列總額。\n四、第三項明訂報酬費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n五、第四項所謂以事實為基礎者，以距離為基礎計算報酬為例，應依外送員實際移動距離計算；以接單數為獎勵門檻，自應將接單數明示；以接單率為條件者，應將其計算方式及實際接單數、拒絕接單數明示。\n六、按外送平台業者為促進消費者消費，對合作商家業務招攬，經常以提供折扣吸引消費者，致合作商家貨款遭受影響，參考現行外送產業實務運作，要求比照報酬明細表，應依每一訂單、每一項目、折扣金額予以詳列；實務運作曾有外送平台業者以公告方式對合作商家要求「接單率」，未達一定比例每單得扣除部分貨款，參考前點說明，應一併明示，於第五項規定外送平台業者提供合作商家貨款明細表準用本條規定。"},{"bill":"202110060680000","text":"外送平台業者於政府機關因天然災害宣布全日停止上班時，應停止營業，並通知外送員。\n政府機關發布停止上班半日時，外送平台業者停止營業時間如下：\n一、上午半日停止上班：\n(一)如政府機關已發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至該發布時間，自該發布時間起正常對外營業。\n(二)如政府機關未發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至下午一時三十分，自下午一時三十分起正常對外營業。\n二、下午半日停止上班：\n(一)如政府機關已發布下午停止上班時間，以該發布時間為外送平台業者停止對外營業時間。\n(二)如政府機關未發布下午停止上班時間，外送平台業者停止對外營業時間為中午十二時至當日營業終止時間。","note":"參考臺北市外送平台業者管理自治條例第五條，明定於政府機關因天然災害宣布全日或半日停止上班時，外送平台業者應停止營業，爰制定本條規定，確保外送員安全。"},{"bill":"202110060360000","text":"外送平台業者於政府機關因天然災害宣布全日停止上班時，應停止營業，並通知外送員。\n政府機關發布停止上班半日時，外送平台業者停止營業時間如下：\n一、上午半日停止上班：\n(一)如政府機關已發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至該發布時間，自該發布時間起正常對外營業。\n(二)如政府機關未發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至下午一時三十分，自下午一時三十分起正常對外營業。\n二、下午半日停止上班：\n(一)如政府機關已發布下午停止上班時間，以該發布時間為外送平台業者停止對外營業時間。\n(二)如政府機關未發布下午停止上班時間，外送平台業者停止對外營業時間為中午十二時至當日營業終止時間。","note":"參考臺北市外送平台業者管理自治條例第五條，明定於政府機關因天然災害宣布全日或半日停止上班時，外送平台業者應停止營業，爰制定本條規定，確保外送員安全。"},{"bill":"202110075210000","text":"外送平台業者於政府機關因天然災害宣布全日停止上班時，應停止營業，並通知外送員。\n政府機關發布停止上班半日時，外送平台業者停止營業時間如下：\n一、上午半日停止上班：\n(一)如政府機關已發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至該發布時間，自該發布時間起正常對外營業。\n(二)如政府機關未發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至下午一時三十分，自下午一時三十分起正常對外營業。\n二、下午半日停止上班：\n(一)如政府機關已發布下午停止上班時間，以該發布時間為外送平台業者停止對外營業時間。\n(二)如政府機關未發布下午停止上班時間，外送平台業者停止對外營業時間為中午十二時至當日營業終止時間。","note":"參考臺北市外送平台業者管理自治條例第五條，明定於政府機關因天然災害宣布全日或半日停止上班時，外送平台業者應停止營業，爰制定本條規定，確保外送員安全。"},{"bill":"202110099010000","text":"外送服務契約應記載下列事項：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、外送服務應具備之設備、程式或工具。\n四、外送服務基本流程。\n五、因不可歸責於外送員之事由，致無法完成外送服務之處理機制。\n六、前條第一項第三款。","note":"一、本條規定外送服務契約應記載事項。\n二、外送員進行外送服務時，常有消費者地址錯誤、無法聯繫或商品項目過多、包裝過大無法載運、或發生交通事故致無法完成外送服務之情事。又觀察媒體報導，曾有多起消費者地址錯誤且外送員無法與消費者取得聯繫，經外送員以外送平台業者內部規定程序取消訂單後，致外送員遭消費者提告侵占之情形，宜明定處理機制以便釐清權責為妥。"},{"bill":"202110167670000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"一、外送平臺業者之盈利主要來自外送員提供之勞務，又外送員於提供外送服務期間往往承擔較高的道路風險及人身安全疑慮，外送平臺業者應適度負擔外送員辦理職業災害保險保障之費用，爰如外送員外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費。\n二、另考量外送員可能同時與二個以上之外送平臺業者合作，爰於第二項明定僅得擇一家申請保險費補貼。"},{"bill":"202110167840000","text":"外送平台業者於政府機關因天然災害宣布停止上班之期間及區域，應停止從事外送服務，並通知外送員。但有正當理由，認無顯著或可預見風險者，不在此限。","note":"參考臺中市外送平台業者管理自治條例第五條，明定於政府機關因天然災害宣布停止上班之期間及區域，應停止從事外送服務，並通知外送員。爰制定本條規定，確保外送員安全。"},{"bill":"202110168030000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺提供外送服務，得擇一申請。","note":"外送平臺業者之盈利主要來自外送員提供之勞務，又外送員於提供外送服務期間往往承擔較高的道路風險及人身安全疑慮，有給予適度社會保險保障之必要性。"},{"bill":"202110168140000","text":"外送平台業者應發給外送員報酬明細表，每月至少一次。\n報酬之計算包含多種項目者，應按每一項目明列，於報酬明細表以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式，不得僅列總額。\n計算報酬之項目係以事實為基礎計算者，應依該正確事實計算，並使外送員得即時查閱。\n外送平台業者提供合作商家貨款明細表，準用本條規定。","note":"一、第一項明定外送平台業者應每月至少一次發給外送員報酬明細表。\n二、現行主要外送平台報酬計算方式不一，且難以核對，為維護外送員、合作商家權益，於第二項規定報酬計算包含多種項目，例如：里程費、接單費、額外獎勵（金）、按時段加碼或其他名稱等。除應以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式。\n三、報酬明細表記載設例如下：某單之接單費：40元；里程數2公里計30元；按時段或臨時公告加發20元，合計80元。倘以總單數為條件發放額外獎金另發500元，亦應將總單數及金額明列於報酬明細表或於網頁、指定使用應用程式或其他方式按件分項明列，不得僅列總額。\n四、第三項所謂以事實為基礎者，以距離為基礎計算報酬為例，應依外送員實際移動距離計算；以接單數為獎勵門檻，自應將接單數明示；以接單率為條件者，應將其計算方式及實際接單數、拒絕接單數明示。\n五、按外送平台業者為促進消費者消費，對合作商家業務招攬，經常以提供折扣吸引消費者，致合作商家貨款遭受影響，參考現行外送產業實務運作，要求比照報酬明細表，應依每一訂單、每一項目、折扣金額予以詳列；實務運作曾有外送平台業者以公告方式對合作商家要求「接單率」，未達一定比例每單得扣除部分貨款，參考前點說明，應一併明示，於第四項規定外送平台業者提供合作商家貨款明細表準用本條規定。"},{"bill":"202110168230000","text":"外送平台業者於政府機關因天然災害宣布全日停止上班時，應停止營業，並通知外送員。\n政府機關發布停止上班半日時，外送平台業者停止營業時間如下：\n一、上午半日停止上班：\n(一)如政府機關已發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至該發布時間，自該發布時間起正常對外營業。\n(二)如政府機關未發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至下午一時三十分，自下午一時三十分起正常對外營業。\n二、下午半日停止上班：\n(一)如政府機關已發布下午停止上班時間，以該發布時間為外送平台業者停止對外營業時間。\n(二)如政府機關未發布下午停止上班時間，外送平台業者停止對外營業時間為中午十二時至當日營業終止時間。","note":"明定於政府機關因天然災害宣布全日或半日停止上班時，外送平台業者應停止營業，爰制定本條規定，確保外送員安全。"},{"bill":"202110168240000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"一、外送平臺業者之盈利主要來自外送員提供之勞務，又外送員於提供外送服務期間往往承擔較高的道路風險及人身安全疑慮，外送平臺業者應適度負擔外送員辦理職業災害保險保障之費用，爰如外送員外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費。\n二、另考量外送員可能同時與二個以上之外送平臺業者合作，爰於第二項明定僅得擇一家申請保險費補貼。"},{"bill":"202110169580000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險者，得檢附繳費證明，向外送平臺業者申請支付其自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務者，僅得擇一申請。","note":"本條明定外送員得向外送平臺申請補貼自行負擔之職災保險費，並限制多重合作者僅得擇一申請，以防重複補貼。"},{"bill":"202110170380000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"一、外送平臺業者之盈利主要來自外送員提供之勞務，又外送員於提供外送服務期間往往承擔較高的道路風險及人身安全疑慮，外送平臺業者應適度負擔外送員辦理職業災害保險保障之費用，爰如外送員外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費。\n二、另考量外送員可能同時與二個以上之外送平臺業者合作，爰於第二項明定僅得擇一家申請保險費補貼。"},{"bill":"202110171160000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"一、外送平臺業者之盈利主要來自外送員提供之勞務，又外送員於提供外送服務期間往往承擔較高的道路風險及人身安全疑慮，外送平臺業者應適度負擔外送員辦理職業災害保險保障之費用，爰如外送員外送員依災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費。\n二、另考量外送員可能同時與二個以上之外送平臺業者合作，爰於第二項明定僅得擇一家申請保險費補貼。"},{"bill":"202110170780000","text":"外送平台業者應發給外送員報酬明細表，每月至少一次。\n報酬之計算包含多種項目者，應按每一項目明列，於報酬明細表以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式，不得僅列總額。\n計算報酬之項目係以事實為基礎計算者，應依該正確事實計算，並使外送員得即時查閱。\n外送平台業者提供合作商家貨款明細表，準用本條規定。","note":"一、第一項明訂外送平台業者應每月至少一次發給外送員報酬明細表。\n二、現行主要外送平台報酬計算方式不一，且難以核對，為維護外送員、合作商家權益，於第二項規定報酬計算包含多種項目，例如：里程費、接單費、額外獎勵（金）、按時段加碼或其他名稱等。除應以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式。\n三、報酬明細表記載設例如下：某單之接單費：40元；里程數2公里計30元；按時段或臨時公告加發20元，合計80元。倘以總單數為條件發放額外獎金另發500元，亦應將總單數及金額明列於報酬明細表或於網頁、指定使用應用程式或其他方式按件分項明列，不得僅列總額。\n四、第三項所謂以事實為基礎者，以距離為基礎計算報酬為例，應依外送員實際移動距離計算；以接單數為獎勵門檻，自應將接單數明示；以接單率為條件者，應將其計算方式及實際接單數、拒絕接單數明示。\n五、按外送平台業者為促進消費者消費，對合作商家業務招攬，經常以提供折扣吸引消費者，致合作商家貨款遭受影響，參考現行外送產業實務運作，要求比照報酬明細表，應依每一訂單、每一項目、折扣金額予以詳列；實務運作曾有外送平台業者以公告方式對合作商家要求「接單率」，未達一定比例每單得扣除部分貨款，參考前點說明，應一併明示，於第四項規定外送平台業者提供合作商家貨款明細表準用本條規定。"},{"bill":"202110173040000","text":"外送平台業者應發給外送人員報酬明細表，每月至少一次。\n報酬之計算包含多種項目者，應按每一項目明列，於報酬明細表以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式，不得僅列總額。\n計算報酬之項目係以事實為基礎計算者，應依該正確事實計算，並使外送員得即時查閱。\n外送平台業者提供合作商家貨款明細表，準用本條規定。","note":"一、第一項明訂外送平台業者應每月至少一次發給外送人員報酬明細表。\n二、現行主要外送平台報酬計算方式不一，且難以核對，為維護外送人員、合作商家權益，於第二項規定報酬計算包含多種項目，例如：里程費、接單費、額外獎勵（金）、按時段加碼或其他名稱等。除應以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式。\n三、報酬明細表記載設例如下：某單之接單費：40元；里程數2公里計30元；按時段或臨時公告加發20元，合計80元。倘以總單數為條件發放額外獎金另發500元，亦應將總單數及金額明列於報酬明細表或於網頁、指定使用應用程式或其他方式按件分項明列，不得僅列總額。\n四、第三項所謂以事實為基礎者，以距離為基礎計算報酬為例，應依外送人員實際移動距離計算；以接單數為獎勵門檻，自應將接單數明示；以接單率為條件者，應將其計算方式及實際接單數、拒絕接單數明示。\n五、按外送平台業者為促進消費者消費，對合作商家業務招攬，經常以提供折扣吸引消費者，致合作商家貨款遭受影響，參考現行外送產業實務運作，要求比照報酬明細表，應依每一訂單、每一項目、折扣金額予以詳列；實務運作曾有外送平台業者以公告方式對合作商家要求「接單率」，未達一定比例每單得扣除部分貨款，參考前點說明，應一併明示，於第四項規定外送平台業者提供合作商家貨款明細表準用本條規定。"},{"bill":"202110173260000","text":"外送平台業者於政府機關因天然災害宣布停止上班之期間及區域，應停止從事外送服務，並通知外送員。但有正當理由，認無顯著或可預見風險者，不在此限。","note":"明定於政府機關因天然災害宣布全日或半日停止上班時，外送平台業者應停止營業，爰制定本條規定，確保外送員人身安全。"},{"bill":"202110173180000","text":"外送平臺業者應確認外送員已完成勞工職業災害保險之投保程序後，始得開放其登入系統或派發訂單。\n外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"一、為確保外送員相關職災保護之權益，增訂第一項規定要求外送平臺業者確定外送員職災保險保障生效後始得派單之義務。\n二、外送平臺業者之盈利主要來自外送員提供之勞務，又外送員於提供外送服務期間往往承擔較高的道路風險及人身安全疑慮，外送平臺業者應適度負擔外送員辦理職業災害保險保障之費用，爰如外送員外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費。\n三、另考量外送員可能同時與二個以上之外送平臺業者合作，爰於第二項明定僅得擇一家申請保險費補貼。"},{"bill":"202110173190000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"一、外送平臺業者之盈利主要來自外送員提供之勞務，又外送員於提供外送服務期間往往承擔較高的道路風險及人身安全疑慮，外送平臺業者應適度負擔外送員辦理職業災害保險保障之費用，爰如外送員外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費。\n二、另考量外送員可能同時與二個以上之外送平臺業者合作，爰於第二項明定僅得擇一家申請保險費補貼。"},{"bill":"202110174530000","text":"外送平台業者於政府機關因天然災害宣布全日停止上班時，應停止營業，並通知外送員。\n政府機關發布停止上班半日時，外送平台業者停止營業時間如下：\n一、上午半日停止上班：\n(一)如政府機關已發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至該發布時間，自該發布時間起正常對外營業。\n(二)如政府機關未發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至下午一時三十分，自下午一時三十分起正常對外營業。\n二、下午半日停止上班：\n(一)如政府機關已發布下午停止上班時間，以該發布時間為外送平台業者停止對外營業時間。\n(二)如政府機關未發布下午停止上班時間，外送平台業者停止對外營業時間為中午十二時至當日營業終止時間。","note":"明定於政府機關因天然災害宣布全日或半日停止上班時，外送平台業者應停止營業，爰制定本條規定，確保外送員安全。"},{"bill":"202110174470000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者得敘明理由後，並於三十日前預告外送員，與其終止外送服務契約。\n外送平台業者依前項終止外送服務契約者，應發給外送員經濟補償。\n前項經濟補償之給付標準、期限及其他相關事項之規定，由中央主管機關定之。","note":"一、為避免過度限縮外送平台業者之經營權限，爰於第一項明定外送平台業者得敘明理由後隨時終止與外送員之外送服務契約，但應於三十日前預告。\n二、為避免外送平台業者任意終止外送服務契約，致外送員經濟生活有不利影響，爰明定外送平台業者依第一項終止外送服務契約時，應提供外送員經濟補償之義務。\n三、第二項之經濟補償，其給付標準、期限及其他相關事項之規定，授權主管機關定之，俾利權衡該新經濟型態發展與勞動保障。"},{"bill":"202110174740000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於知悉或可得而知該情事之時起，八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"一、本條旨在強化外送平臺之職安責任，提升事故應變效率，保障外送員生命與健康安全。\n二、為避免重大事故發生後通報延遲，使主管機關無法即時掌握情況並介入處理，有必要明確規範外送平臺業者之通報義務。\n三、本條規定業者於知悉或可得而知外送員發生死亡或需住院之重大災害時，應於八小時內通報當地勞動檢查機構，並進行事故調查與分析，以確保災害資訊完整、責任釐清明確。"},{"bill":"202110175620000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"本條明定外送員參加勞工職業災害保險者，得擇定任一其所提供外送服務之平臺業者，檢附繳費證明向其申請支付自行負擔之保險費，且該外送平臺不得拒絕。"},{"bill":"202110175920000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、收取服務及運送費用金額或比例、貨款結算與支付方式、食品安全與衛生管理、爭議處理機制、契約期間與終止條件及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、有鑑於外送平臺業者於契約關係中多居於優勢地位，契約內容由業者單方擬定，合作商家難以議價或協商，易造成權利義務失衡，甚至產生不公平條款，爰為維護合作商家權益，並確保契約內容之公平、合理與透明，於第一項授權經濟主管機關應擬訂外送合作契約範本，供外送平臺業者遵循。\n二、於第二項明定契約範本應包括之事項，使外送平臺業者與合作商家之權利義務具體明確，防止爭議發生，並健全外送平臺產業發展。\n三、於第三項明定外送平臺業者應於外送合作契約成立後七日內提供書面或電子契約予合作商家，讓合作商家得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110176760000","text":"外送平台業者應發給外送員報酬明細表，每月至少一次。\n報酬之計算包含多種項目者，應按每一項目明列，於報酬明細表以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式，不得僅列總額。\n前項報酬費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n計算報酬之項目係以事實為基礎計算者，應依該正確事實計算，並使外送員得即時查閱。\n外送平台業者提供合作商家貨款明細表，準用本條規定。","note":"一、第一項明定外送平台業者應每月至少一次發給外送員報酬明細表。\n二、現行主要外送平台報酬計算方式不一，且難以核對，為維護外送員、合作商家權益，於第二項規定報酬計算包含多種項目，例如：里程費、接單費、額外獎勵（金）、按時段加碼或其他名稱等。除應以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式。\n三、報酬明細表記載設例如下：某單之接單費：40元；里程數2公里計30元；按時段或臨時公告加發20元，合計80元。倘以總單數為條件發放額外獎金另發500元，亦應將總單數及金額明列於報酬明細表或於網頁、指定使用應用程式或其他方式按件分項明列，不得僅列總額。\n四、第三項明定報酬費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n五、第四項所謂以事實為基礎者，以距離為基礎計算報酬為例，應依外送員實際移動距離計算；以接單數為獎勵門檻，自應將接單數明示；以接單率為條件者，應將其計算方式及實際接單數、拒絕接單數明示。\n六、按外送平台業者為促進消費者消費，對合作商家業務招攬，經常以提供折扣吸引消費者，致合作商家貨款遭受影響，參考現行外送產業實務運作，要求比照報酬明細表，應依每一訂單、每一項目、折扣金額予以詳列；實務運作曾有外送平台業者以公告方式對合作商家要求「接單率」，未達一定比例每單得扣除部分貨款，參考前點說明，應一併明示，於第五項規定外送平台業者提供合作商家貨款明細表準用本條規定。"},{"bill":"202110176980000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、收取服務及運送費用金額或比例、貨款結算與支付方式、食品安全與衛生管理、爭議處理機制、契約期間與終止條件及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、授權目的事業主管機關就外送平臺業者與合作商家間主要權利義務關係擬訂契約範本，以提升合作商家議價地位。\n二、要求外送平臺業者於七日內提供契約予合作商家留存。"},{"bill":"202110177560000","text":"違反第五條第一項、第七條、第十條第二項、第十三條規定者，經通知限期改善，屆期未改善者，處新臺幣二萬元以上三十萬元以下罰鍰。\n違反第八條、第九條第二項規定者，處新臺幣三十萬元以上一百萬元以下罰鍰，並限期令其給付，屆期未給付者，應按次處罰。","note":"一、參酌勞動基準法第七十九條規定，如未按時提供契約規定、報酬未明列項目、拒絕負擔外送員保險費者或外送業者未提供相關教育訓練者，經通知限期改善，屆期未改善時之罰則。\n二、參酌勞工退休金條例第四十五條之一規定，因可歸責於外送業者而終止服務契約，卻未給付相當於資遣費之經濟補償者，處罰之規定。"},{"bill":"202110177680000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、收取服務及運送費用金額或比例、貨款結算與支付方式、食品安全與衛生管理、爭議處理機制、契約期間與終止條件及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、有鑑於外送平臺業者於契約關係中多居於優勢地位，契約內容由業者單方擬定，合作商家難以議價或協商，易造成權利義務失衡，甚至產生不公平條款，爰為維護合作商家權益，並確保契約內容之公平、合理與透明，於第一項授權經濟主管機關應擬訂外送合作契約範本，供外送平臺業者遵循。\n二、於第二項明定契約範本應包括之事項，使外送平臺業者與合作商家之權利義務具體明確，防止爭議發生，並健全外送平臺產業發展。\n三、於第三項明定外送平臺業者應於外送合作契約成立後七日內提供書面或電子契約予合作商家，讓合作商家得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110178160000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、收取服務及運送費用金額或比例、貨款結算與支付方式、食品安全與衛生管理、爭議處理機制、契約期間與終止條件及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、有鑑於外送平臺業者於契約關係中多居於優勢地位，契約內容由業者單方擬定，合作商家難以議價或協商，易造成權利義務失衡，甚至產生不公平條款，爰為維護合作商家權益，並確保契約內容之公平、合理與透明，於第一項授權經濟主管機關應擬訂外送合作契約範本，供外送平臺業者遵循。\n二、於第二項明定契約範本應包括之事項，使外送平臺業者與合作商家之權利義務具體明確，防止爭議發生，並健全外送平臺產業發展。\n三、於第三項明定外送平臺業者應於外送合作契約成立後七日內提供書面或電子契約予合作商家，讓合作商家得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110181420000","text":"外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺業者提供外送服務，僅得擇一申請。","note":"一、外送平臺業者之盈利主要來自外送員提供之勞務，又外送員於提供外送服務期間往往承擔較高的道路風險及人身安全疑慮，外送平臺業者應適度負擔外送員辦理職業災害保險保障之費用，爰如外送員外送員依勞工職業災害保險及保護法第十條規定，或經由其所屬職業工會辦理參加勞工職業災害保險，得檢附繳費證明向外送平臺業者申請支付自行負擔之保險費。\n二、另考量外送員可能同時與二個以上之外送平臺業者合作，爰於第二項明定僅得擇一家申請保險費補貼。"}],"changed":true,"final":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、收取服務及運送費用金額或比例、貨款結算與支付方式、食品安全與衛生管理、爭議處理機制、契約期間與終止條件及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","finalWhy":"一、有鑑於外送平臺業者於契約關係中多居於優勢地位，契約內容由業者單方擬定，合作商家難以議價或協商，易造成權利義務失衡，甚至產生不公平條款，爰為維護合作商家權益，並確保契約內容之公平、合理與透明，於第一項授權經濟主管機關應擬訂外送合作契約範本，供外送平臺業者遵循。\n二、於第二項明定契約範本應包括之事項，使外送平臺業者與合作商家之權利義務具體明確，防止爭議發生，並健全外送平臺產業發展。\n三、於第三項明定外送平臺業者應於外送合作契約成立後七日內提供書面或電子契約予合作商家，讓合作商家得隨時檢視契約內容，避免爭議產生。","review":{"note":"照委員劉建國等16人提案通過","text":"外送員依勞工職業災害保險及保護法第七條或第十條規定，由其所屬職業工會或由本人辦理參加勞工職業災害保險者，得檢附繳費證明向外送平臺業者申請支付其自行負擔之保險費，外送平臺業者不得拒絕。\n外送員同時於二個以上外送平臺提供外送服務，僅得擇一申請。"}},{"no":"第十五條","current":null,"versions":[{"bill":"202110017580000","text":"外送平台業者對外送員應建立下列事項之申訴或客戶服務制度：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、其他對於外送員不利益之處分。\n四、販賣或兌換服裝、工具、設備者，其退、換貨及保固。\n前項第一款至第三款，以外送平台業者提出具體明確事實，始得對外送員停權、終止契約或其他不利益處分。","note":"規定外送平台業者應對於外送員建立之申訴及客戶服務制度。"},{"bill":"202110060450000","text":"外送平台業者對外送員應建立下列事項之申訴或客戶服務制度：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、其他對於外送員不利益之處分。\n四、販賣或兌換服裝、工具、設備者，其退、換貨及保固。\n前項第一款至第三款，以外送平台業者提出具體明確事實，始得對外送員停權、終止契約或其他不利益處分。","note":"規定外送平台業者應對於外送員建立之申訴及客戶服務制度。"},{"bill":"202110060680000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰課予外送平台業者通報勞動部職業安全衛生署所屬之勞動檢查機構之義務。"},{"bill":"202110060360000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰課予外送平台業者通報勞動部職業安全衛生署所屬之勞動檢查機構之義務。"},{"bill":"202110075210000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰課予外送平台業者通報勞動部職業安全衛生署所屬之勞動檢查機構之義務。"},{"bill":"202110099010000","text":"外送平台業者應發給外送員報酬明細表，每月至少一次。\n報酬之計算包含多種項目者，應按每一項目明列，於報酬明細表以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式，不得僅列總額。\n計算報酬之項目係以事實為基礎計算者，應依該正確事實計算，使外送員得即時查閱。\n外送平台業者提供合作商家貨款明細表，準用本條規定。","note":"一、第一項明訂外送平台業者應每月至少一次發給外送員報酬明細表。\n二、現行主要外送平台報酬計算方式不一，且難以核對，為維護外送員、合作商家權益，於第二項規定報酬計算包含多種項目，例如：里程費、接單費、額外獎勵（金）、按時段加碼或其他名稱等。除應以書面或於網頁、指定使用應用程式或其他方式明示其金額及計算方式。\n三、報酬明細表記載設例如下：某單之接單費：40元；里程數2公里計30元；按時段或臨時公告加發20元，合計80元。倘以總單數為條件發放額外獎金另發500元，亦應將總單數及金額明列於報酬明細表或於網頁、指定使用應用程式或其他方式按件分項明列，不得僅列總額。\n四、第三項所謂以事實為基礎者，以距離為基礎計算報酬為例，應依外送員實際移動距離計算；以接單數為獎勵門檻，自應將接單數明示；以接單率為條件者，應將其計算方式及實際接單數、拒絕接單數明示。\n五、按外送平台業者為促進消費者消費，對合作商家業務招攬，經常以提供折扣吸引消費者，致合作商家貨款遭受影響，參考現行外送產業實務運作，要求比照報酬明細表，應依每一訂單、每一項目、折扣金額予以詳列；實務運作曾有外送平台業者以公告方式對合作商家要求「接單率」，未達一定比例每單得扣除部分貨款，參考前點說明，應一併明示，於第四項規定外送平台業者提供合作商家貨款明細表準用本條規定。"},{"bill":"202110167670000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"基於外送平臺業者掌握大量消費者、合作商家、外送員資料及信用卡、帳戶相關資訊，爰規定外送平臺業者應確保資訊安全及系統穩定，並依個人資料保護法相關規定辦理。"},{"bill":"202110167840000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰課予外送平台業者通報勞動部職業安全衛生署所屬之勞動檢查機構之義務。"},{"bill":"202110168030000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並應遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"基於外送平臺業者掌握大量消費者、合作商家、外送員資料及信用卡、帳戶相關資訊，爰規定外送平臺業者應確保資訊安全及系統穩定，並依個人資料保護法相關規定辦理。"},{"bill":"202110168140000","text":"外送平台業者對外送員應建立下列事項之申訴或客戶服務制度：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、其他對於外送員不利益之處分。\n四、販賣或兌換服裝、工具、設備者，其退、換貨及保固。\n前項第一款至第三款，以外送平台業者提出具體明確事實，始得對外送員停權、終止契約或其他不利益處分。","note":"規定外送平台業者應對於外送員建立之申訴及客戶服務制度。"},{"bill":"202110168230000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"明定外送平台職災通報機制，使勞動檢查機構能迅速掌握職災訊息，以防止類似災害之發生，爰要求外送平台業者通報勞動部職業安全衛生署所屬之勞動檢查機構之義務。"},{"bill":"202110168240000","text":"外送平台業者應對外送員揭示其透過電子方式監控、監督或評估外送員工作之自動化監控系統之事實與使用情形，以及經由該自動化監控系統對於外送員之資料所為之蒐集、處理或利用的具體內容。\n外送平台業者不得透過應用程式蒐集與外送員工作無關聯且非履行外送服務契約所絕對必要的個人資料，包括非外送服務期間之私人對話資料、外送員之位置或非公開活動資料、外送員的健康與心理或情緒狀態資料，以及外送員未同意提供或執行外送平台工作時的任何資料等。","note":"一、外送平台業者於運作過程中，常以演算法及自動化監控系統進行訂單派發、績效評估與報酬計算等工作管理，形成外送員提供勞務之主要運作依據。惟相關監控或評估機制運作方式、資料使用內容及決策邏輯多未充分揭示，致外送員難以理解自身工作表現之評價基準或決策依據，可能影響其工作權益。爰參考歐盟《平台工作指令》第9條規定，於第一項明定外送平台業者應對外送員揭示其透過電子方式監控、監督或評估外送員工作之自動化監控系統之事實與使用情形，並說明其蒐集、處理或利用外送員資料之具體內容，以確保外送員得合理知悉平台系統運作及資料使用之範圍，增進演算法之透明性與公平性。\n二、外送平台業者為確保外送服務之運作，確有蒐集外送員特定個人資料之必要，例如位置資訊或作業紀錄，惟為兼顧個資保護及隱私權保障，應限制蒐集範圍於履行外送服務契約所絕對必要之程度。爰參考歐盟《平台工作指令》第7條規定，於第二項明定外送平台業者不得透過應用程式蒐集與外送員工作無關聯且非履行外送服務契約所絕對必要之個人資料，並列舉不得蒐集之情形，如非外送服務期間之私人對話、位置或非公開活動資料、健康與心理或情緒狀態資料等，以防止過度蒐集及保障外送員個資安全。"},{"bill":"202110169580000","text":"外送平臺業者應確保程式之資訊安全與系統穩定，並遵循個人資料保護法相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"本條要求外送平臺業者強化資訊安全與個資保護，並授權主管機關得要求訂定安全維護計畫，以確保各方權益。"},{"bill":"202110170380000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"基於外送平臺業者掌握大量消費者、合作商家、外送員資料及信用卡、帳戶相關資訊，爰規定外送平臺業者應確保資訊安全及系統穩定，並依個人資料保護法相關規定辦理。"},{"bill":"202110171160000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。\n外送平臺業者應揭露派單、評價及停權之自動化管理原則，並不得蒐集與外送服務無關之個人資料。","note":"一、基於外送平臺業者掌握大量消費者、合作商家、外送員資料及信用卡、帳戶相關資訊，爰規定外送平臺業者應確保資訊安全及系統穩定，並依個人資料保護法相關規定辦理。\n二、因應數位治理趨勢，確保演算法透明與隱私保障。"},{"bill":"202110170780000","text":"外送平台業者對外送員應建立下列事項之申訴或客戶服務制度：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、其他對於外送員不利益之處分。\n四、販賣或兌換服裝、工具、設備者，其退、換貨及保固。\n前項第一款至第三款，以外送平台業者提出具體明確事實，始得對外送員停權、終止契約或其他不利益處分。","note":"規定外送平台業者應對於外送員建立之申訴及客戶服務制度。"},{"bill":"202110173040000","text":"外送平台業者對外送人員應建立下列事項之申訴或客戶服務制度：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、其他對於外送人員不利益之處分。\n四、販賣或兌換服裝、工具、設備者，其退、換貨及保固。\n前項第一款至第三款，以外送平台業者提出具體明確事實，始得對外送人員停權、終止契約或其他不利益處分。","note":"規定外送平台業者應對於外送人員建立申訴及客戶服務制度。"},{"bill":"202110173260000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"明定外送平台職災通報機制，使勞動檢查機構能迅速掌握職災訊息，以防止類似災害之發生，爰要求外送平台業者通報勞動部職業安全衛生署所屬之勞動檢查機構之義務。"},{"bill":"202110173180000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"基於外送平臺業者掌握大量消費者、合作商家、外送員資料及信用卡、帳戶相關資訊，爰規定外送平臺業者應確保資訊安全及系統穩定，並依個人資料保護法相關規定辦理。"},{"bill":"202110173190000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。\n外送平臺業者應對外送員揭示其演算法管理，包括透過電子方式監控、監督或評估外送員工作之自動化監控系統之事實與使用情形，以及經由該自動化監控系統對於外送員之資料所為之蒐集、處理或利用的具體內容。","note":"一、基於外送平臺業者掌握大量消費者、合作商家、外送員資料及信用卡、帳戶相關資訊，爰規定外送平臺業者應確保資訊安全及系統穩定，並依個人資料保護法相關規定辦理。\n二、外送平臺業者於運作過程中，常以演算法及自動化監控系統進行訂單派發、績效評估與報酬計算等工作管理，形成外送員提供勞務之主要運作依據。惟相關監控或評估機制運作方式、資料使用內容及決策邏輯多未充分揭示，致外送員難以理解自身工作表現之評價基準或決策依據，可能影響其工作權益。為保障處於自動監控系統或自動決策系統下的外送員權益，爰參考歐盟《平台工作指令》第9條規定，於第三項明定外送平臺業者應對外送員揭示其透過電子方式監控、監督或評估外送員工作之自動化監控系統之事實與使用情形，並說明其蒐集、處理或利用外送員資料之具體內容，以確保外送員得合理知悉平臺系統運作及資料使用之範圍，增進演算法之透明性與公平性。"},{"bill":"202110174530000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"明定外送平台職災通報機制，使勞動檢查機構能迅速掌握職災訊息，以防止類似災害之發生，爰要求外送平台業者通報勞動部職業安全衛生署所屬之勞動檢查機構之義務。"},{"bill":"202110174470000","text":"外送員與外送平台業者間非為僱傭關係者，外送平台業者有下列情形之一者，外送員得終止外送服務契約：\n一、外送平台業者於訂立外送服務契約時為虛偽之意思表示，使外送員誤信而有受損害之虞。\n二、外送平台業者對外送員有違反外送服務契約或勞工法令之停權處分或其他損害行為。\n三、其他法令另有規定。\n外送員依前項終止外送服務契約者，外送平台業者應依前條之規定，發給外送員經濟補償。\n外送員依第一項各款之規定終止契約者，應自知悉其情形之日起，三十日內為之。","note":"一、明定可歸責於外送平台業者之原因，外送員可終止外送服務契約。\n二、為彌補外送員所受損失，外送員依前項終止外送服務契約者，外送平台業者應發給外送員經濟補償。\n三、為使外送員合理行使第一項之契約終止權，爰於第三項規定，外送員應自知悉外送平台業者有第一項各款情形之日起三十日內為之。"},{"bill":"202110174740000","text":"外送平臺業者於政府機關因天然災害宣布停止上班時，應停止營業，並通知合作商家及外送員。\n前項停止營業之範圍，應參照政府公布之停止範圍，並不得跨區營業。","note":"明定政府宣布天然災害停止上班時，平臺應同步停止營業，並通知外送員及商家，以保障人員安全並防止違法派單或跨區送件。"},{"bill":"202110175620000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"基於外送平臺業者掌握大量消費者、合作商家、外送員資料及相關金融資訊，爰規定外送平臺業者應確保資訊安全及系統穩定，並依個人資料保護法相關規定辦理。"},{"bill":"202110175920000","text":"外送平臺業者於政府機關因天然災害宣布停止上班之地區，應停止營業，並通知合作商家及外送員。","note":"有鑑於外送員多以機車、自行車等交通工具提供外送服務，如外送平臺業者於發生天然災害（指颱風、洪水、地震及其他經目的事業主管機關認定屬天然災害者）期間持續營業，可能使外送員面臨交通安全或人身安全之風險。爰明定當政府機關宣布停止上班時，外送平臺業者應同步停止該區域之營業，並應通知合作商家及外送員，以確保外送員安全。"},{"bill":"202110176760000","text":"外送平台業者對外送員應建立下列事項之申訴或客戶服務制度：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、其他對於外送員不利益之處分。\n四、販賣或兌換服裝、工具、設備者，其退、換貨及保固。\n前項第一款至第三款，以外送平台業者提出具體明確事實，始得對外送員停權、終止契約或其他不利益處分。","note":"規定外送平台業者應對於外送員建立之申訴及客戶服務制度。"},{"bill":"202110176980000","text":"外送平臺業者於政府機關因天然災害宣布停止上班之地區，應停止營業，並通知合作商家及外送員。","note":"當政府因天然災害宣布停止上班時，外送平臺業者應停止營業並通知外送員與合作商家，以確保外送員人身安全。"},{"bill":"202110177560000","text":"違反第十一條至第十二條規定者，處新臺幣三萬元以上三十萬元以下罰鍰。","note":"參酌職業安全衛生法第四十三條規定，發生職業災害而未通報或未暫停外送員之服務者，處罰之規定。"},{"bill":"202110177680000","text":"外送平臺業者於政府機關因天然災害宣布停止上班之地區，應停止營業，並通知合作商家及外送員。","note":"有鑑於外送員多以機車、自行車等交通工具提供外送服務，如外送平臺業者於發生天然災害指颱風、洪水、地震及其他經目的事業主管機關認定屬天然災害者期間持續營業，可能使外送員面臨交通安全或人身安全之風險。爰明定當政府機關宣布停止上班時，外送平臺業者應同步停止該區域之營業，並應通知合作商家及外送員，以確保外送員安全。"},{"bill":"202110178160000","text":"外送平臺業者於政府機關因天然災害宣布停止上班之地區，應停止營業，並通知合作商家及外送員。","note":"有鑑於外送員多以機車、自行車等交通工具提供外送服務，如外送平臺業者於發生天然災害（指颱風、洪水、地震及其他經目的事業主管機關認定屬天然災害者）期間持續營業，可能使外送員面臨交通安全或人身安全之風險。爰明定當政府機關宣布停止上班時，外送平臺業者應同步停止該區域之營業，並應通知合作商家及外送員，以確保外送員安全。"},{"bill":"202110181420000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"基於外送平臺業者掌握大量消費者、合作商家、外送員資料及信用卡、帳戶相關資訊，爰規定外送平臺業者應確保資訊安全及系統穩定，並依個人資料保護法相關規定辦理。"}],"changed":true,"final":"外送平臺業者於政府機關因天然災害宣布停止上班之地區，應停止營業，並通知合作商家及外送員。","finalWhy":"一、有鑑於外送員多以機車、自行車等交通工具提供外送服務，如外送平臺業者於發生天然災害（指颱風、洪水、地震及其他經目的事業主管機關認定屬天然災害者）期間持續營業，可能使外送員面臨交通安全或人身安全之風險。爰明定當政府機關宣布停止上班時，外送平臺業者應同步停止該區域之營業，並應通知合作商家及外送員，以確保外送員安全。\n二、另基於外送員提供外送服務，係長時間行駛於道路，受天候狀況影響工作安全之程度較高，外送平臺業者於天然災害發生但政府機關未宣布停止上班之區域，仍宜衡酌使外送員提供外送服務之風險，特別在地方政府宣布停止上班區域之其他鄰近區域，應評估承接訂單是否會途經停止上班區域之風險，以保障外送員工作安全。","review":{"note":"照委員劉建國等16人提案通過","text":"外送平臺業者應遵循個人資料保護法之相關規定，確保其程式之資訊安全及系統穩定度，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定，要求外送平臺業者訂定個人資料檔案安全維護計畫。"}},{"no":"第十六條","current":null,"versions":[{"bill":"202110017580000","text":"下列各款紀錄，外送平台業者應至少保存二年，並提供有關機關調閱，不得拒絕：\n一、消費者訂購食品、商品或服務之時間及內容物。\n二、食品、商品或服務之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平台業者得取消訂單之事由及退費機制。\n五、食品、商品或服務給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平台業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平台業者應向消費者明確揭示並應建立客戶服務機制。","note":"本條針對與消費者權益有關紀錄要求外送平台業者應就本條各款紀錄保存，提供主管機關調閱、執行行政監督及處理消費爭議，爰訂定本條各款紀錄應至少保存二年。"},{"bill":"202110060450000","text":"下列各款紀錄，外送平台業者應至少保存三年，提供有關機關調閱，不得拒絕：\n一、消費者訂購食品、商品或服務之時間及內容物。\n二、食品、商品或服務之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平台業者得取消訂單之事由及退費機制。\n五、食品、商品或服務給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平台業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平台業者應向消費者明確揭示並應建立客戶服務機制。","note":"本條明訂與消費者權益有關紀錄要求外送平台業者應就本條各款紀錄保存，提供主管機關調閱、執行行政監督及處理消費爭議，爰訂定本條各款紀錄應至少保存三年。"},{"bill":"202110060680000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前述教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參考臺北市外送平台業者管理自治條例第八條，為提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員工作及預防災變所需之認知，外送平台業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育課程，爰制定本條規定。"},{"bill":"202110060360000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前項教育訓練課程之從業外送員，每年應至少應提供二小時之實體或線上之教育訓練課程。","note":"參考臺北市外送平台業者管理自治條例第八條，為提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員工作及預防災變所需之認知，外送平台業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育課程，爰制定本條規定。"},{"bill":"202110075210000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前述教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參考臺北市外送平台業者管理自治條例第八條，為提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員工作及預防災變所需之認知，外送平台業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育課程，爰制定本條規定。"},{"bill":"202110099010000","text":"外送平台業者對外送員應建立下列事項之申訴或客戶服務制度：\n一、報酬之金額、計算方式、給付時間。\n二、停權、違規及終止契約事由。\n三、其他對於外送員不利益之處分。\n四、販賣或兌換服裝、工具、設備者，其退、換貨及保固。\n前項第一款至第三款，以外送平台業者提出具體明確事實，始得對外送員停權、終止契約或其他不利益處分。","note":"規定外送平台業者應對於外送員建立之申訴及客戶服務制度。"},{"bill":"202110167670000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與消費者之間之紀錄，包含訂購商品資訊、退費機制、補償及契約等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110167840000","text":"外送平台業者對新加入之外送員，應於其提供外送服務前，施以職業安全、食品衛生安全及交通安全教育訓練課程各一小時以上；對已完成前述教育訓練課程之從業外送員，每年應至少提供一次在職教育訓練。","note":"參考臺中市外送平台業者管理自治條例第八條，為保障外送員對該職業之認知，平台應提供職業安全、交通安全及食品衛生安全教育課程，並每年進行教育訓練。"},{"bill":"202110168030000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"第一項明定外送平臺業者與消費者之間之紀錄，包含訂購商品資訊、退費機制、補償及契約等有關事項，應至少保存二年，並於第三項明定機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110168140000","text":"下列各款紀錄，外送平台業者應至少保存二年，並提供有關機關調閱，不得拒絕：\n一、消費者訂購食品、商品或服務之時間及內容物。\n二、食品、商品或服務之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平台業者得取消訂單之事由及退費機制。\n五、食品、商品或服務給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平台業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平台業者應向消費者明確揭示並應建立客戶服務機制。","note":"本條針對與消費者權益有關紀錄要求外送平台業者應就本條各款紀錄保存，提供主管機關調閱、執行行政監督及處理消費爭議，爰訂定本條各款紀錄應至少保存二年。"},{"bill":"202110168230000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前述教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"明定外送平台業者，應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育課程，以提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員工作及預防災變所需之認知。"},{"bill":"202110168240000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與消費者之間之紀錄，包含訂購商品資訊、退費機制、補償及契約等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110169580000","text":"外送平臺業者應保存下列紀錄，期限不得少於二年：\n一、消費者訂購商品之時間及內容物。\n二、商品價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、內容不符、有瑕疵或損壞之處理方式、費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客服與投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"本條規定外送平臺應保存與交易及消費爭議相關紀錄至少二年，並揭示關鍵資訊；主管機關得調閱以確保消費者權益。"},{"bill":"202110170380000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，除有妨害營業秘密等正當理由外，外送平臺業者不得拒絕。","note":"明定外送平臺業者與消費者之間之紀錄，包含訂購商品資訊、退費機制、補償及契約等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110171160000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與消費者之間之紀錄，包含訂購商品資訊、退費機制、補償及契約等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110170780000","text":"下列各款紀錄，外送平台業者應至少保存二年，並提供有關機關調閱，不得拒絕：\n一、消費者訂購食品、商品或服務之時間及內容物。\n二、食品、商品或服務之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平台業者得取消訂單之事由及退費機制。\n五、食品、商品或服務給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平台業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平台業者應向消費者明確揭示並應建立客戶服務機制。","note":"本條針對與消費者權益有關紀錄要求外送平台業者應就本條各款紀錄保存，提供主管機關調閱、執行行政監督及處理消費爭議，爰訂定本條各款紀錄應至少保存二年。"},{"bill":"202110173040000","text":"下列各款紀錄，外送平台業者應至少保存二年，並提供有關機關調閱，不得拒絕：\n一、消費者訂購食品、商品或服務之時間及內容物。\n二、食品、商品或服務之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平台業者得取消訂單之事由及退費機制。\n五、食品、商品或服務給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平台業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平台業者應向消費者明確揭示並應建立客戶服務機制。","note":"本條針對與消費者權益有關紀錄要求外送平台業者應就本條各款紀錄保存，提供主管機關調閱、執行行政監督及處理消費爭議，爰訂定本條各款紀錄應至少保存二年。"},{"bill":"202110173260000","text":"外送平台業者對新加入之外送員，應於其提供外送服務前，施以職業安全、食品衛生安全及交通安全教育訓練課程各一小時以上；對已完成前述教育訓練課程之從業外送員，每年應至少提供一次在職教育訓練。","note":"明定外送平台業者，應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育課程，以提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員工作及預防災變所需之認知。"},{"bill":"202110173180000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與消費者之間之紀錄，包含訂購商品資訊、退費機制、補償及契約等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110173190000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與消費者之間之紀錄，包含訂購商品資訊、退費機制、補償及契約等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110174530000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前述教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。\n如外送地區為原住民族地區，而外送員為原住民時，外送平台業者於訂定教育訓練課程時，應考量原住民族之文化、語言及地區差異性，提供多元化、符合原住民族需求之教育訓練或教材。","note":"明定外送平台業者，應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育課程，以提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員工作及預防災變所需之認知。"},{"bill":"202110174470000","text":"外送員因提供外送服務，違反個人資料保護法、性騷擾防治法、跟蹤騷擾防治法、刑法、交通法規或食品安全衛生法規，且情節重大者，外送平台業者得終止外送服務契約。\n外送平台業者依前項終止外送服務契約或為其他影響外送員權益之不利處分，應敘明完整理由通知外送員，且就其理由負舉證責任，並給予外送員申訴機制。","note":"一、本法之訂定除保障外送員之權益外，應併同考量外送平台業者與消費者之權益，爰明定外送平台業者得於特定情事下終止外送服務契約。\n二、另就因第一項而終止外送服務契約或其他影響外送員權益之不利處分，亦明定外送平台有敘明完整理由通知外送員，且就其理由負舉證責任之義務，並給予外送員申訴機制。"},{"bill":"202110174740000","text":"外送平臺業者使外送員從事外送服務時，除依外送服務契約外，應遵守下列規定：\n一、不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。\n二、對於外送員拒絕接單或選擇下線，不得有不利對待。","note":"保障外送員自主接單與上線自由，禁止平臺強制排班或懲罰拒單行為，同時避免外送員過勞影響健康及增加交通事故風險，爰要求外送員於上線後，外送平臺始得使其提供外送服務，且不得強制排定外送員上線期間，或違反外送員意願使其維持上線狀態。"},{"bill":"202110175620000","text":"外送平臺業者應對外送員及中央主管機關揭示其透過演算法監測、控制或評估外送員工作之資料及行為之事實、目的及運用情形。\n外送平臺業者以演算法處理外送員之勞動權益及報酬，應基於公平性原則，不得產生歧視或不平等待遇。\n中央主管機關得要求外送平臺業者說明及驗證前項演算法，外送平臺業者不得拒絕。\n前三項演算法之應揭示內容、決策過程及說明與驗證方式，由中央主管機關會同數位發展主管機關定之。","note":"一、為確保演算法透明度，爰參考歐盟「平台工作指令（Parliament adopts Platform Work Directive）」第九條，明定外送平臺業者應向外送員及中央主管機關告知演算法蒐集之資料、使用目的及後續處理情形。\n二、為確保演算法對於外送員之勞動權益及報酬能提供公平保障，如訂單分配、停權及報酬等事項，爰參考歐盟「平台工作指令」第十條，明定第二項規定。\n三、第三項明定中央主管機關對於第二項演算法有產生歧視性結果之疑慮時，得要求外送平臺業者進行說明及驗證，不得拒絕。\n四、第四項明定，由中央主管機關會同數位發展主管機關，訂定前三項演算法之應揭示內容、決策過程及說明與驗證方式。"},{"bill":"202110175920000","text":"外送平臺業者應遵循個人資料保護法之相關規定，確保其程式之資訊安全及系統穩定度，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定，要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"一、有鑑於外送平臺業者掌握大量消費者、合作商家及外送員之個人資料及交易支付資訊，於第一項明定外送平臺業者應依「個人資料保護法」相關規定妥善處理與保管，防範資料外洩與濫用，並確保其使用程式之資訊安全與系統穩定。\n二、為強化個資保護機制，於第二項明定交通主管機關得依「個人資料保護法」相關規定，要求外送平臺業者訂定個人資料檔案安全維護計畫，以確保資料處理及保存安全，降低資安事件發生之可能性。"},{"bill":"202110176760000","text":"下列各款紀錄，外送平台業者應至少保存二年，提供有關機關調閱，不得拒絕：\n一、消費者訂購食品、商品或服務之時間及內容物。\n二、食品、商品或服務之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平台業者得取消訂單之事由及退費機制。\n五、食品、商品或服務給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平台業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平台業者應向消費者明確揭示並應建立客戶服務機制。","note":"本條明訂與消費者權益有關紀錄要求外送平台業者應就本條各款紀錄保存，提供主管機關調閱、執行行政監督及處理消費爭議，爰訂定本條各款紀錄應至少保存二年。"},{"bill":"202110176980000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定度，並遵循個人資料保護法之相關規定，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"要求外送平臺業者遵守個資法，確保系統資訊安全與穩定，並授權交通主管機關得要求平台訂定個資檔案安全維護計畫，以防止資料外洩與系統異常。"},{"bill":"202110177560000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"授權中央主管機關訂定本法施行細則。"},{"bill":"202110177680000","text":"外送平臺業者應遵循個人資料保護法之相關規定，確保其程式之資訊安全及系統穩定度，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"一、有鑑於外送平臺業者掌握大量消費者、合作商家及外送員之個人資料及交易支付資訊，於第一項明定外送平臺業者應依「個人資料保護法」相關規定妥善處理與保管，防範資料外洩與濫用，並確保其使用程式之資訊安全與系統穩定。\n二、為強化個資保護機制，於第二項明定交通主管機關得依「個人資料保護法」相關規定，要求外送平臺業者訂定個人資料檔案安全維護計畫，以確保資料處理及保存安全，降低資安事件發生之可能性。"},{"bill":"202110178160000","text":"外送平臺業者應遵循個人資料保護法之相關規定，確保其程式之資訊安全及系統穩定度，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定，要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"一、有鑑於外送平臺業者掌握大量消費者、合作商家及外送員之個人資料及交易支付資訊，於第一項明定外送平臺業者應依「個人資料保護法」相關規定妥善處理與保管，防範資料外洩與濫用，並確保其使用程式之資訊安全與系統穩定\n二、為強化個資保護機制，於第二項明定交通主管機關得依「個人資料保護法」相關規定，要求外送平臺業者訂定個人資料檔案安全維護計畫，以確保資料處理及保存安全，降低資安事件發生之可能性。"},{"bill":"202110181420000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與消費者之間之紀錄，包含訂購商品資訊、退費機制、補償及契約等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"}],"changed":true,"final":"外送平臺業者應遵循個人資料保護法之相關規定，確保其程式之資訊安全及系統穩定度，以保障消費者、合作商家及外送員權益。\n交通主管機關得依個人資料保護法規定，要求外送平臺業者訂定個人資料檔案安全維護計畫。","finalWhy":"一、有鑑於外送平臺業者掌握大量消費者、合作商家及外送員之個人資料及交易支付資訊，於第一項明定外送平臺業者應依「個人資料保護法」相關規定妥善處理與保管，防範資料外洩與濫用，並確保其使用程式之資訊安全與系統穩定。\n二、為強化個資保護機制，於第二項明定交通主管機關得依「個人資料保護法」相關規定，要求外送平臺業者訂定個人資料檔案安全維護計畫，以確保資料處理及保存安全，降低資安事件發生之可能性。","review":{"note":"照委員劉建國等16人提案通過","text":"外送平臺業者應保存下列各款與消費者有關之紀錄，至少二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費情形。\n四、外送平臺業者取消訂單之事由及退費情形。\n五、商品有給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞時，外送平臺業者之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務及投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。"}},{"no":"第十七條","current":null,"versions":[{"bill":"202110017580000","text":"下列各款紀錄，外送平台業者應至少保存二年，並提供有關機關及合作商家調閱，不得拒絕：\n一、外送合作契約。\n二、平台業務招攬行為及其執行記錄。\n三、合作商家接受訂單及提供食品、商品或服務之時間及內容。\n四、與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。","note":"一、本條對於外送平台業者與合作商家之間之紀錄規定保存義務，包含外送合作契約、平台業務招攬行為及其執行記錄。\n二、因涉及消費者權益，與前條規定相同應至少保存二年。"},{"bill":"202110060450000","text":"下列各款紀錄，外送平台業者應至少保存三年，提供有關機關及合作商家調閱，不得拒絕：\n一、外送合作契約。\n二、平台業務招攬行為及其執行記錄。\n三、合作商家接受訂單及提供食品、商品或服務之時間及內容。\n四、與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。","note":"一、本條對於外送平台業者與合作商家之間之紀錄規定保存義務，包含外送合作契約、平台業務招攬行為及其執行記錄。\n二、因涉及消費者權益，與前條規定相同應至少保存三年。"},{"bill":"202110060680000","text":"外送平台業者有違反第四條至第六條及第十三條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有違反第七條、第十二條、第十五條及第十六條之規定者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第四條至第六條之規定，未提供書面契約或電磁紀錄予外送員收執；未保存消費者訂購商品、廠商接受訂單及外送員提供外送服務之相關電磁紀錄；未於外送平台介面明確揭示商品價格、服務費或運費之金額、取消訂單之退費機制；以及違反第十三條規定，未依法為外送員辦理勞工保險及勞工職業災害保險，經通知限期改善，屆期未改善時之處罰。\n二、明定違反第七條、第十二條、第十五條及第十六條之規定，未建立申訴制度；未依規定將外送員停權；未履行通報義務；未為外送員實施職業安全、交通安全及食品衛生安全等教育訓練時之處罰。\n三、明定外送平台業者於拒絕、規避或妨礙本法所定中央主管機關監督時之處罰。"},{"bill":"202110060360000","text":"外送平台業者有違反第四條至第六條及第十三條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有違反第七條、第十二條、第十五條及第十六條之規定者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有拒絕、規避或防礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第四條至第六條之規定，未提供書面契約或電磁紀錄予外送員收執；未保存消費者訂購商品、廠商接受訂單及外送員提供外送服務之相關電磁紀錄；未於外送平台介面明確揭示商品價格、服務費或運費之金額、取消訂單之退費機制；以及違反第十三條規定，未依法為外送員辦理勞工保險及勞工職業災害保險，經通知限期改善，屆期未改善時之處罰。\n二、明定違反第七條、第十二條、第十五條及第十六條之規定，未建立申訴制度；未依規定將外送員停權；未履行通報義務；未為外送員實施職業安全、交通安全及食品衛生安全等教育訓練時之處罰。\n三、明定外送平台業者於拒絕、規避或妨礙本法所定中央主管機關監督時之處罰。"},{"bill":"202110075210000","text":"外送員與外送平台業者成立提供外送服務之契約後，外送平台業者應以自己之費用，以外送員為被保險人與受益人，投保附表規定之人身保險及財產保險。\n外送平台業者應將前項人身保險契約之副本交予外送員收執，並於外送員提供外送服務契約有效期間內，維持保險契約之效力。\n外送平台業者應公開已投保第一項保險之外送員人數及保障內容，並保存保險資料及繳費證明一年。保險資料有異動時應即時更新。\n外送平台業者未履行第一項及第二項所定義務前，不得使外送員提供外送服務。","note":"參考臺南市外送平台業者管理自治條例第五條，為保障外送員的權益，平台業者應幫外送員提供團體傷害保險、強制汽車責任保險、機車第三人責任保險。"},{"bill":"202110099010000","text":"下列各款紀錄，外送平台業者應至少保存二年，提供有關機關調閱，不得拒絕：\n一、消費者訂購食品、商品或服務之時間及內容物。\n二、食品、商品或服務之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平台業者得取消訂單之事由及退費機制。\n五、食品、商品或服務給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平台業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平台業者應向消費者明確揭示應建立客戶服務機制。","note":"本條針對與消費者權益有關紀錄要求外送平台業者應就本條各款紀錄保存，提供主管機關調閱、執行行政監督及處理消費爭議，爰訂定本條各款紀錄應至少保存二年。"},{"bill":"202110167670000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與合作商家之間之紀錄，包含外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110167840000","text":"外送平台業者與外送員成立提供外送服務契約後，外送平台業者應以自己之費用，以外送員為被保險人，依下列各款規定投保傷害保險：\n一、意外傷害致失能或死亡之保險，最低保險金額新臺幣三百萬元。\n二、意外傷害之醫療保險，實支實付型之最低保險金額新臺幣三萬元，日額支付型之最低保險金額每日新臺幣一千元。\n外送平台業者應將前項保險契約之保險證或保險手冊交予外送員收執，並於外送員提供外送服務契約有效期間內，維持保險契約之效力。\n外送平台業者應公開已投保第一項保險之外送員人數及保障內容，並保存保險資料及繳費證明至保險期間屆滿後六個月以上。保險資料有異動時應於七日內更新。\n外送平台業者未履行第一項及第二項所定義務前，不得使外送員提供外送服務。","note":"參考臺中市外送平台業者管理自治條例第四條，保障外送員勞務時權益，平台業者應幫外送員提供傷害保險，並公開、保存相關資料。"},{"bill":"202110168030000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"第一項明定外送平臺業者與合作商家之間之紀錄，包含外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，並於第二項明定機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110168140000","text":"下列各款紀錄，外送平台業者應至少保存二年，並提供有關機關及合作商家調閱，不得拒絕：\n一、外送合作契約。\n二、平台業務招攬行為及其執行記錄。\n三、合作商家接受訂單及提供食品、商品或服務之時間及內容。\n四、與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。","note":"一、本條對於外送平台業者與合作商家之間之紀錄規定保存義務，包含外送合作契約、平台業務招攬行為及其執行記錄。\n二、因涉及消費者權益，與前條規定相同應至少保存二年。"},{"bill":"202110168230000","text":"外送平台業者有違反第四條至第六條及第十三條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有違反第七條、第十二條、第十五條及第十六條之規定者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第四條至第六條之規定，未提供書面契約或電磁紀錄予外送員收執；未保存消費者訂購商品、廠商接受訂單及外送員提供外送服務之相關電磁紀錄；未於外送平台介面明確揭示商品價格、服務費或運費之金額、取消訂單之退費機制；以及違反第十三條規定，未依法為外送員辦理勞工保險及勞工職業災害保險，經通知限期改善，屆期未改善時之處罰。\n二、明定違反第七條、第十二條、第十五條及第十六條之規定，未建立申訴制度；未依規定將外送員停權；未履行通報義務；未為外送員實施職業安全、交通安全及食品衛生安全等教育訓練時之處罰。\n三、明定外送平台業者於拒絕、規避或妨礙本法所定中央主管機關監督時之處罰。"},{"bill":"202110168240000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與合作商家之間之紀錄，包含外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110169580000","text":"外送平臺業者應保存下列與合作商家相關之紀錄，期限不得少於二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間與內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"本條要求外送平臺保存與合作商家交易及爭議相關紀錄至少二年，主管機關得調閱，以確保商家權益與營運透明。"},{"bill":"202110170380000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，除有妨害營業秘密等正當理由外，外送平臺業者不得拒絕。","note":"明定外送平臺業者與合作商家之間之紀錄，包含外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110171160000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與合作商家之間之紀錄，包含外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110170780000","text":"下列各款紀錄，外送平台業者應至少保存二年，並提供有關機關及合作商家調閱，不得拒絕：\n一、外送合作契約。\n二、平台業務招攬行為及其執行記錄。\n三、合作商家接受訂單及提供食品、商品或服務之時間及內容。\n四、與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。","note":"一、本條對於外送平台業者與合作商家之間之紀錄規定保存義務，包含外送合作契約、平台業務招攬行為及其執行記錄。\n二、因涉及消費者權益，與前條規定相同應至少保存二年。"},{"bill":"202110173040000","text":"下列各款紀錄，外送平台業者應至少保存二年，並提供有關機關及合作商家調閱，不得拒絕：\n一、外送合作契約。\n二、平台業務招攬行為及其執行記錄。\n三、合作商家接受訂單及提供食品、商品或服務之時間及內容。\n四、與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。","note":"一、本條對於外送平台業者與合作商家間之紀錄規定保存義務，包含外送合作契約、平台業務招攬行為及其執行記錄。\n二、因涉及消費者權益，與前條規定相同應至少保存二年。"},{"bill":"202110173260000","text":"外送平台業者與外送員成立提供外送服務契約後，外送平台業者應以自己之費用，以外送員為被保險人，依下列各款規定投保傷害保險：\n一、意外傷害致失能或死亡之保險，最低保險金額新臺幣三百萬元。\n二、意外傷害之醫療保險，實支實付型之最低保險金額新臺幣三萬元，日額支付型之最低保險金額每日新臺幣一千元。\n外送平台業者應將前項保險契約之保險證或保險手冊交予外送員收執，並於外送員提供外送服務契約有效期間內，維持保險契約之效力。\n外送平台業者應公開已投保第一項保險之外送員人數及保障內容，並保存保險資料及繳費證明至保險期間屆滿後六個月以上。保險資料有異動時應於七日內更新。\n外送平台業者未履行第一項及第二項所定義務前，不得使外送員提供外送服務。","note":"參酌臺北市外送平台業者管理自治條例第四條之規定，保障外送員勞動權益，平台業者應幫外送員投保傷害保險，並有公開及保存相關資料之義務。"},{"bill":"202110173180000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與合作商家之間之紀錄，包含外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110173190000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與合作商家之間之紀錄，包含外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110174530000","text":"外送平台業者有違反第四條至第六條及第十三條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有違反第七條、第十二條、第十五條及第十六條之規定者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第四條至第六條之規定，未提供書面契約或電磁紀錄予外送員收執；未保存消費者訂購商品、廠商接受訂單及外送員提供外送服務之相關電磁紀錄；未於外送平台介面明確揭示商品價格、服務費或運費之金額、取消訂單之退費機制；以及違反第十三條規定，未依法為外送員辦理勞工保險及勞工職業災害保險，經通知限期改善，屆期未改善時之處罰。\n二、明定違反第七條、第十二條、第十五條及第十六條之規定，未建立申訴制度；未依規定將外送員停權；未履行通報義務；未為外送員實施職業安全、交通安全及食品衛生安全等教育訓練時之處罰。\n三、明定外送平台業者於拒絕、規避或妨礙本法所定中央主管機關監督時之處罰。"},{"bill":"202110174470000","text":"外送員於提供外送服務時，發生道路交通事故致人於死或重傷，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"為確保外送員提供外送服務時能安全駕駛，故明定要求外送員提供外送服務時，如發生道路交通事故致人於死或重傷，且經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務，以利維護外送員與國人之道路交通安全。"},{"bill":"202110174740000","text":"外送平臺業者對外送員及合作商家應建立申訴制度，處理下列事項：\n一、運費、報酬金額、計算方式及給付時間。\n二、停權、終止外送服務契約或其他對外送員、商家不利之決定。\n三、外送員、合作商家與消費者就外送服務及商品給付所發生之爭議。\n前項申訴制度，應至少包括受理單位、救濟管道與處理流程、限期處理時間、回復方式，及申訴成立後之補償措施，並由外送平臺業者公開揭示。\n外送平臺業者應就第一項各款事由，成立處理小組，受理外送員及合作商家之申訴；其申訴準則由中央主管機關定之。","note":"要求平臺應個別建立外送員與合作商家之申訴制度，明確規範申訴範圍、處理流程及補償措施。並授權中央主管機關訂定申訴準則，確保公平救濟。"},{"bill":"202110175620000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務、投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"本條明定外送平臺業者與消費者之間之紀錄應至少保存二年，且機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110175920000","text":"外送平臺業者應定期向中央主管機關提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。","note":"為利中央主管機關掌握外送平臺外送員之勞動情形作為擬定相關政策之評估依據，明定外送平臺業者應定期提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。"},{"bill":"202110176760000","text":"下列各款紀錄，外送平台業者應至少保存二年，提供有關機關及合作商家調閱，不得拒絕：\n一、外送合作契約。\n二、平台業務招攬行為及其執行記錄。\n三、合作商家接受訂單及提供食品、商品或服務之時間及內容。\n四、與合作商家間之客戶服務或爭議之處理紀錄。","note":"一、本條對於外送平台業者與合作商家之間之紀錄規定保存義務，包含外送合作契約、平台業務招攬行為及其執行記錄。\n二、因涉及消費者權益，與前條規定相同應至少保存二年。"},{"bill":"202110176980000","text":"外送平臺業者應定期向中央主管機關提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。","note":"外送平臺業者應定期向中央主管機關提供外送員人數、外送服務時間、上線時段等資訊，以利主管機關掌握外送員實際勞動狀況並制定相關政策。"},{"bill":"202110177560000","text":"本法自公布後六個月施行。","note":"明定本法施行日期。"},{"bill":"202110177680000","text":"外送平臺業者應定期向中央主管機關提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。","note":"為利中央主管機關掌握外送平臺外送員之勞動情形作為擬定相關政策之評估依據，明定外送平臺業者應定期提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。"},{"bill":"202110178160000","text":"外送平臺業者應定期向中央主管機關提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。","note":"為利中央主管機關掌握外送平臺外送員之勞動情形作為擬定相關政策之評估依據，明定外送平臺業者應定期提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。"},{"bill":"202110181420000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"明定外送平臺業者與合作商家之間之紀錄，包含外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，另機關得要求調閱，外送平臺業者不得拒絕。"}],"changed":true,"final":"外送平臺業者應定期向中央主管機關提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。","finalWhy":"為利中央主管機關掌握外送平臺外送員之勞動情形作為擬定相關政策之評估依據，明定外送平臺業者應定期提供外送員人數、外送服務期間、上線期間及報酬等相關資訊。","review":{"note":"照委員劉建國等16人提案通過","text":"外送平臺業者應保存下列各款與合作商家有關之紀錄，至少二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。"}},{"no":"第十八條","current":null,"versions":[{"bill":"202110017580000","text":"下列各款紀錄，外送平台業者應至少保存五年，並提供有關機關及外送員調閱，不得拒絕：\n一、外送服務契約。\n二、外送服務期間。\n三、第十五條第一項第一款至第三款。","note":"參考勞動基準法第二十三條、勞工退休金條例第三十一條規定，與報酬有關之契約、公告、外送服務期間之有關紀錄均應保存至少五年，保障外送員權益，予以明定。"},{"bill":"202110060450000","text":"下列各款紀錄，外送平台業者應至少保存五年，提供有關機關及外送員調閱，不得拒絕：\n一、外送服務契約。\n二、外送服務期間。\n三、第十五條第一項第一款至第三款。","note":"參考勞動基準法第二十三條、勞工退休金條例第三十一條規定，與報酬有關之契約、公告、外送服務期間之有關紀錄均應保存至少五年，保障外送員權益，予以明定。"},{"bill":"202110060680000","text":"外送平台業者有違反第八條、第十四條之規定者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"明定外送平台業者違反須於外送員排班後始得派單、不得違反外送員意願使其維持上線狀態；於政府機關因天然災害宣布全日停止上班時，應停止營業時之處罰。"},{"bill":"202110060360000","text":"外送平台業者有違反第八條、第十四條之規定者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"明定外送平台業者違反須於外送員排班後始得派單、不得違反外送員意願使其維持上線狀態；於政府機關因天然災害宣布全日停止上班時，應停止營業時之處罰。"},{"bill":"202110075210000","text":"外送平台業者有違反第四條至第六條及第十三條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有違反第七條、第十二條、第十五條及第十六條之規定者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、外送平台業者違反第四條至第六條之規定，未提供書面契約或電磁紀錄予外送員收執；未保存消費者訂購商品、廠商接受訂單及外送員提供外送服務之相關電磁紀錄；未於外送平台介面明確揭示商品價格、服務費或運費之金額、取消訂單之退費機制；以及違反第十三條規定，未依法為外送員辦理勞工保險及勞工職業災害保險，經通知限期改善，屆期未改善時之處罰。\n二、違反第七條、第十二條、第十五條及第十六條之規定，未建立申訴制度；未依規定將外送員停權；未履行通報義務；未為外送員實施職業安全、交通安全及食品衛生安全等教育訓練時之處罰。\n三、外送平台業者於拒絕、規避或妨礙本法所定中央主管機關監督時之處罰。"},{"bill":"202110099010000","text":"下列各款紀錄，外送平台業者應至少保存二年，提供有關機關及合作商家調閱，不得拒絕：\n一、外送合作契約。\n二、平台業務招攬行為及其執行記錄。\n三、合作商家接受訂單及提供食品、商品或服務之時間及內容。\n四、與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。","note":"一、本條對於外送平台業者與合作商家之間之紀錄規定保存義務，包含外送合作契約、平台業務招攬行為及其執行記錄。\n二、因涉及消費者權益，與前條規定相同應至少保存二年。"},{"bill":"202110167670000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、停權、依第七條規定終止外送服務契約及以演算法或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，明定與外送員有關之契約、外送服務期間、外送員上線期間、報酬給付、停權及依本法第七條規定終止外送服務契約、以演算法或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄，外送平臺業者均應保存至少五年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110167840000","text":"外送平台業者有違反第四條至第六條及第十三條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有違反第七條、第十二條、第十五條及第十六條之規定者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、外送平台業者違反第四條至第六條之規定，未提供書面契約或電磁紀錄予外送員收執；未保存消費者訂購商品、廠商接受訂單及外送員提供外送服務之相關電磁紀錄；未於外送平台介面明確揭示商品價格、服務費或運費之金額、取消訂單之退費機制；以及違反第十三條規定，未依法為外送員辦理勞工保險及勞工職業災害保險，經通知限期改善，屆期未改善時之處罰。\n二、違反第七條、第十二條、第十五條及第十六條之規定，未建立申訴制度；未依規定將外送員停權；未履行通報義務；未為外送員實施職業安全、交通安全及食品衛生安全等教育訓練時之處罰。\n三、外送平台業者於拒絕、規避或妨礙本法所定中央主管機關監督時之處罰。"},{"bill":"202110168030000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、第十條第一項各款之申訴事項。\n六、依第七條規定終止外送服務契約及以演算法或其他方式對外送員為不利之決定。\n七、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，明定與外送員有關之契約、外送服務期間、外送員上線期間、報酬給付、第十條第一項第一款至第三款、依本法第七條規定終止外送服務契約、以演算法或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄，外送平臺業者均應保存至少五年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110168140000","text":"下列各款紀錄，外送平台業者應至少保存五年，並提供有關機關及外送員調閱，不得拒絕：\n一、外送服務契約。\n二、外送服務期間。\n三、第十五條第一項第一款至第三款。","note":"參考勞動基準法第二十三條、勞工退休金條例第三十一條規定，與報酬有關之契約、公告、外送服務期間之有關紀錄均應保存至少五年，保障外送員權益，予以明定。"},{"bill":"202110168230000","text":"外送平台業者有違反第八條、第十四條之規定者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"明定外送平台業者違反須於外送員排班後始得派單、不得違反外送員意願使其維持上線狀態；於政府機關因天然災害宣布全日停止上班時，應停止營業時之處罰。"},{"bill":"202110168240000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、停權、依第七條規定終止外送服務契約及以演算法或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，明定與外送員有關之契約、外送服務期間、外送員上線期間、報酬給付、停權及依本法第七條規定終止外送服務契約、以演算法或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄，外送平臺業者均應保存至少五年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110169580000","text":"外送平臺業者應保存下列與外送員相關之紀錄，期限不得少於五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、停權、依第七條規定終止契約及以演算法或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止相關紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"本條要求外送平臺保存外送員契約、報酬與終止相關紀錄五年，以利主管機關查核並保障外送員權益。"},{"bill":"202110170380000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、停權、依第七條規定終止外送服務契約及以演算法或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，除有妨害營業秘密等正當理由外，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，明定與外送員有關之契約、外送服務期間、外送員上線期間、報酬給付、停權及依本法第七條規定終止外送服務契約、以演算法或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄，外送平臺業者均應保存至少五年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110171160000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、對外送員停權或其他不利之決定。\n六、依第七條規定終止外送服務契約。\n七、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，明定與外送員有關之契約、外送服務期間、外送員上線期間、報酬給付、停權及依本法第七條規定終止外送服務契約、以演算法或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄，外送平臺業者均應保存至少五年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110170780000","text":"下列各款紀錄，外送平台業者應至少保存五年，並提供有關機關及外送員調閱，不得拒絕：\n一、外送服務契約。\n二、外送服務期間。\n三、第十五條第一項第一款至第三款。","note":"參考勞動基準法第二十三條、勞工退休金條例第三十一條規定，與報酬有關之契約、公告、外送服務期間之有關紀錄均應保存至少五年，保障外送員權益，予以明定。"},{"bill":"202110173040000","text":"下列各款紀錄，外送平台業者應至少保存五年，並提供有關機關及外送人員調閱，不得拒絕：\n一、外送服務契約。\n二、外送服務期間。\n三、第十五條第一項第一款至第三款。","note":"參考勞動基準法第二十三條、勞工退休金條例第三十一條規定，與報酬有關之契約、公告、外送服務期間之有關紀錄均應保存至少五年，保障外送人員權益，予以明定。"},{"bill":"202110173260000","text":"外送平台業者有違反第四條至第六條及第十三條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有違反第七條、第十二條、第十五條及第十六條之規定者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第四條至第六條之規定，未提供書面契約或電磁紀錄予外送員收執；未保存消費者訂購商品、廠商接受訂單及外送員提供外送服務之相關電磁紀錄；未於外送平台介面明確揭示商品價格、服務費或運費之金額、取消訂單之退費機制；以及違反第十三條規定，未依法為外送員辦理勞工保險及勞工職業災害保險，經通知限期改善，屆期未改善時之處罰。\n二、明定違反第七條、第十二條、第十五條及第十六條之規定，未建立申訴制度；未依規定將外送員停權；未履行通報義務；未為外送員實施職業安全、交通安全及食品衛生安全等教育訓練時之處罰。\n三、明定外送平台業者於拒絕、規避或妨礙本法所定中央主管機關監督時之處罰。"},{"bill":"202110173180000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、停權、依第七條規定終止外送服務契約及以演算法或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，明定與外送員有關之契約、外送服務期間、外送員上線期間、報酬給付、停權及依本法第七條規定終止外送服務契約、以演算法或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄，外送平臺業者均應保存至少五年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110173190000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、停權、依第七條規定終止外送服務契約及以演算法管理或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，明定與外送員有關之契約、外送服務期間、外送員上線期間、報酬給付、停權及依本法第七條規定終止外送服務契約、以演算法管理或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄，外送平臺業者均應保存至少五年，另機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110174530000","text":"外送平台業者有違反第八條、第十四條之規定者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"明定外送平台業者違反須於外送員排班後始得派單、不得違反外送員意願使其維持上線狀態；於政府機關因天然災害宣布全日停止上班時，應停止營業時之處罰。"},{"bill":"202110174470000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌《勞動基準法》第八章技術生之規範，以及《高級中等學校建教合作實施及建教生權益保障法》第二十一條第一項第六款規定，準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110174740000","text":"外送平臺業者應確保其程式之資訊安全及系統穩定，並依個人資料保護法之規定，保障消費者、合作商家及外送員之權益。\n數位發展主管機關得依個人資料保護法規定，要求外送平臺業者訂定個人資料檔案安全維護計畫。","note":"規範平臺應維護資訊安全與個資保護，確保外送員、商家與消費者帳戶、信用卡、個資等資料不外洩。授權數位發展主管機關得要求平臺訂定資安維護計畫。"},{"bill":"202110175620000","text":"下列各款紀錄，外送平臺業者應至少保存二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"本條明定外送平臺業者與合作商家之間之紀錄應至少保存二年，且機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110175920000","text":"外送平臺業者應保存下列各款與消費者有關之紀錄，至少二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費情形。\n四、外送平臺業者取消訂單之事由及退費情形。\n五、商品有給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞時，外送平臺業者之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務及投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、為確保消費交易透明，並考量外送平臺業者與消費者發生消費爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與消費者有關之紀錄至少二年，該紀錄應包括訂購商品資訊、訂單取消、退費情形、補償措施、契約條款及申訴紀錄等內容。\n二、於第二項明定有關機關得要求調閱前開有關消費者紀錄，外送平臺業者不得拒絕。"},{"bill":"202110176760000","text":"下列各款紀錄，外送平台業者應至少保存五年，提供有關機關及外送員調閱，不得拒絕：\n一、外送服務契約。\n二、外送服務期間。\n三、第十五條第一項第一款至第三款。","note":"參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，與報酬有關之契約、公告、外送服務期間之相關紀錄均應保存至少五年，保障外送員權益，予以明定。"},{"bill":"202110176980000","text":"外送平臺業者應保存下列各款與消費者有關之紀錄，至少二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者取消訂單之事由及退費機制。\n五、商品給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞時外送平臺業者之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務及投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示並應建立客戶服務機制。\n有關機關得要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"外送平臺業者應保存其與消費者之相關紀錄，包括訂購商品資訊、退費機制、補償及契約等有關事項，至少二年，並於必要時提供主管機關調閱，以利稽查與爭議處理。"},{"bill":"202110177680000","text":"外送平臺業者應保存下列各款與消費者有關之紀錄，至少二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費情形。\n四、外送平臺業者取消訂單之事由退費情形。\n五、商品有給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞時，外送平臺業者之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務及投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、為確保消費交易透明，並考量外送平臺業者與消費者發生消費爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與消費者有關之紀錄至少二年，該紀錄應包括訂購商品資訊、訂單取消、退費情形、補償措施、契約條款及申訴紀錄等內容。\n二、於第二項明定有關機關得要求調閱前開有關消費者紀錄，外送平臺業者不得拒絕。"},{"bill":"202110178160000","text":"外送平臺業者應保存下列各款與消費者有關之紀錄，至少二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費情形。\n四、外送平臺業者取消訂單之事由及退費情形。\n五、商品有給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞時，外送平臺業者之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務及投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、為確保消費交易透明，並考量外送平臺業者與消費者發生消費爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與消費者有關之紀錄至少二年，該紀錄應包括訂購商品資訊、訂單取消、退費情形、補償措施、契約條款及申訴紀錄等內容。\n二、於第二項明定有關機關得要求調閱前開有關消費者紀錄，外送平臺業者不得拒絕。"},{"bill":"202110181420000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、停權、依第七條規定終止外送服務契約及以演算法或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，明定與外送員有關之契約、外送服務期間、外送員上線期間、報酬給付、停權及依本法第七條規定終止外送服務契約、以演算法或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄，外送平臺業者均應保存至少五年，另機關得要求調閱，外送平臺業者不得拒絕。"}],"changed":true,"final":"外送平臺業者應保存下列各款與消費者有關之紀錄，至少二年：\n一、消費者訂購商品之時間及內容物。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費情形。\n四、外送平臺業者取消訂單之事由及退費情形。\n五、商品有給付遲延、給付之種類或數量與訂單不符、有瑕疵或損壞時，外送平臺業者之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務及投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","finalWhy":"一、為確保消費交易透明，並考量外送平臺業者與消費者發生消費爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與消費者有關之紀錄至少二年，該紀錄應包括訂購商品資訊、訂單取消、退費情形、補償措施、契約條款及投訴紀錄等內容。\n二、於第二項明定有關機關得要求調閱前開有關消費者紀錄，外送平臺業者不得拒絕。","review":{"note":"照委員劉建國等16人提案通過","text":"外送平臺業者應保存下列各款與外送員有關之紀錄，至少二年：\n一、外送服務契約。\n二、外送服務期間。\n三、上線期間。\n四、停權、依第七條規定終止外送服務契約，及以演算法或其他方式對外送員為不利之決定。\n五、其他外送服務契約終止情事。\n六、第二十二條規定之外送員教育訓練紀錄。\n七、其他與前六款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。"}},{"no":"第十九條","current":null,"versions":[{"bill":"202110017580000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定，準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110060450000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定，準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110060680000","text":"外送平台業者有違反第十條、第十一條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者有違反第十四條之規定，且外送員於執行外送服務過程中死亡者，處新臺幣二十萬元以上一百萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，外送平台業者應敘明理由，並於三十日前預告外送員，始得終止與外送員之外送服務契約規定，以及第十二條，因可歸責之事由，終止外送服務契約時應提供外送員經濟補償時之處罰。\n二、明定外送平台業者違反第十四條之規定，且外送員因執行外送服務過程中死亡時之處罰。"},{"bill":"202110060360000","text":"外送平台業者有違反第十條、第十一條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者有違反第十四條之規定，且外送員於執行外送服務過程中死亡者，處新臺幣二十萬元以上一百萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，外送平台業者應敘明理由，並於三十日前預告外送員，始得終止與外送員之外送服務契約規定，以及第十二條，因可歸責之事由，終止外送服務契約時應提供外送員經濟補償時之處罰。\n二、明定外送平台業者違反第十四條之規定，且外送員因執行外送服務過程中死亡時之處罰。"},{"bill":"202110075210000","text":"外送平台業者有違反第八條、第十四條之規定者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"外送平台業者違反須於外送員排班後始得派單、不得違反外送員意願使其維持上線狀態；於政府機關因天然災害宣布全日停止上班時，應停止營業時之處罰。"},{"bill":"202110099010000","text":"下列各款紀錄，外送平台業者應至少保存五年，提供有關機關及外送員調閱，不得拒絕：\n一、外送服務契約。\n二、外送服務期間。\n三、第十六條第一項第一款至第三款。","note":"參考勞動基準法第二十三條、勞工退休金條例第三十一條規定，與報酬有關之契約、公告、外送服務期間之有關紀錄均應保存至少五年，保障外送員權益，予以明定。"},{"bill":"202110167670000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰參照勞動部外送作業安全衛生指引規定，課予外送平臺業者通報勞動檢查機構之義務。"},{"bill":"202110167840000","text":"外送平台業者有違反第八條、第十四條之規定者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"外送平台業者違反須於外送員排班後始得派單、不得違反外送員意願使其維持上線狀態；於政府機關因天然災害宣布全日停止上班時，應停止營業時之處罰。"},{"bill":"202110168030000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在三人以上。\n三、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能迅速掌握外送員遭受之害災業職業災害之訊息，以防止類似災害之發生，爰參照勞動部外送作業安全衛生指引規定，課予外送平臺業者通報勞動檢查機構之義務。"},{"bill":"202110168140000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定，準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110168230000","text":"外送平台業者有違反第十條、第十一條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者有違反第十四條之規定，且外送員於執行外送服務過程中死亡者，處新臺幣二十萬元以上一百萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，外送平台業者應敘明理由，並於三十日前預告外送員，始得終止與外送員之外送服務契約規定，以及第十二條，因可歸責之事由，終止外送服務契約時應提供外送員經濟補償時之處罰。\n二、明定外送平台業者違反第十四條之規定，且外送員因執行外送服務過程中死亡時之處罰。"},{"bill":"202110168240000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰參照勞動部外送作業安全衛生指引規定，課予外送平臺業者通報勞動檢查機構之義務。"},{"bill":"202110169580000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後進行事故調查、分析及紀錄：\n一、發生死亡災害。\n二、發生災害者一人以上且需住院治療。","note":"本條規定外送平臺於外送員發生重大職災時須即時通報並調查紀錄，以利主管機關掌握情況、防止再次發生。"},{"bill":"202110170380000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能即時掌握外送員發生職業災害之資訊，並防止類似事件再度發生，參照勞動部「外送作業安全衛生指引」之規定，明定外送平臺業者負有通報勞動檢查機構之義務。"},{"bill":"202110171160000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰參照勞動部外送作業安全衛生指引規定，課予外送平臺業者通報勞動檢查機構之義務。"},{"bill":"202110170780000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定，準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110173040000","text":"外送人員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送人員辦理參加勞工保險及勞工職業災害保險。","note":"外送人員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送人員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定，準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送人員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110173260000","text":"外送平台業者有違反第八條、第十四條之規定者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"明定外送平台業者違反須於外送員排班後始得派單、不得違反外送員意願使其維持上線狀態；於政府機關因天然災害宣布全日停止上班時，應停止營業時之處罰。"},{"bill":"202110173180000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰參照勞動部外送作業安全衛生指引規定，課予外送平臺業者通報勞動檢查機構之義務。"},{"bill":"202110173190000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰參照勞動部外送作業安全衛生指引規定，課予外送平臺業者通報勞動檢查機構之義務。"},{"bill":"202110174530000","text":"外送平台業者有違反第十條、第十一條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者有違反第十四條之規定，且外送員於執行外送服務過程中死亡者，處新臺幣二十萬元以上一百萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，外送平台業者應敘明理由，並於三十日前預告外送員，始得終止與外送員之外送服務契約規定，以及第十二條，因可歸責之事由，終止外送服務契約時應提供外送員經濟補償時之處罰。\n二、明定外送平台業者違反第十四條之規定，且外送員因執行外送服務過程中死亡時之處罰。"},{"bill":"202110174470000","text":"外送平台業者於政府機關因天然災害宣布全日停止上班時，應停止營業，並通知外送員。\n政府機關發布停止上班半日時，外送平台業者停止營業時間如下：\n一、上午半日停止上班：\n(一)如政府機關已發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至該發布時間，自該發布時間起正常對外營業。\n(二)如政府機關未發布下午開始上班時間，外送平台業者停止營業時間為當日營業開始時間至下午一時三十分，自下午一時三十分起正常對外營業。\n二、下午半日停止上班：\n(一)如政府機關已發布下午停止上班時間，以該發布時間為外送平台業者停止對外營業時間。\n(二)如政府機關未發布下午停止上班時間，外送平台業者停止對外營業時間為中午十二時至當日營業終止時間。","note":"為確保外送員交通與人身安全，爰參考臺北市外送平台業者管理自治條例第五條，明定於政府機關因天然災害宣布全日或半日停止上班時，外送平台業者應停止營業。"},{"bill":"202110174740000","text":"外送平臺業者應保存下列與消費者交易有關之紀錄，保存時間不得低於二年：\n一、消費者訂購商品之時間及品名。\n二、商品之價格、服務費或運費。\n三、消費者取消訂單之退費機制。\n四、外送平臺業者得取消訂單之事由及退費機制。\n五、商品給付遲延、給付種類或數量與訂單不符、有瑕疵或損壞之處理方式、收退費用及補償措施。\n六、消費者與外送平臺業者間之契約。\n七、客戶服務及投訴處理紀錄。\n八、其他與前七款有關之紀錄。\n前項第一款至第六款，外送平臺業者應對消費者明確揭示，並建立客戶服務機制。\n有關機關得依職權要求調閱第一項各款紀錄，外送平臺業者不得拒絕。","note":"要求平臺保存消費者交易紀錄至少二年，並揭示退費與補償機制，以強化消費爭議處理及主管機關監督。"},{"bill":"202110175620000","text":"下列各款紀錄，外送平臺業者應至少保存五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第九條第四項所定之外送員報酬清冊。\n五、停權、依第七條規定終止外送服務契約及以演算法或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止情事。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"為保障外送員權益，爰於本條明定外送平臺業者與外送員相關之紀錄均應保存至少五年，且機關得要求調閱，外送平臺業者不得拒絕。"},{"bill":"202110175920000","text":"外送平臺業者應保存下列各款與合作商家有關之紀錄，至少二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、為強化外送平臺營運透明度，並考量外送平臺業者與合作商家發生權益爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與合作商家有關之紀錄至少二年，該紀錄應包括外送合作契約內容、平臺業務招攬行為及執行紀錄、客戶服務或爭議之處理紀錄等。\n二、於第二項明定有關機關得要求調閱前開有關合作商家紀錄，外送平臺業者不得拒絕。"},{"bill":"202110176760000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，並保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定，準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110176980000","text":"外送平臺業者應保存下列各款與合作商家有關之紀錄，至少二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"外送平臺業者應保存其與合作商家之相關紀錄，包括外送合作契約、平臺業務招攬行為及其執行紀錄等有關事項，應至少保存二年，並於必要時提供主管機關調閱，以利稽查與爭議處理。"},{"bill":"202110177680000","text":"外送平臺業者應保存下列各款與合作商家有關之紀錄，至少二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、為強化外送平臺營運透明度，並考量外送平臺業者與合作商家發生權益爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與合作商家有關之紀錄至少二年，該紀錄應包括外送合作契約內容、平臺業務招攬行為及執行紀錄、客戶服務或爭議之處理紀錄等。\n二、於第二項明定有關機關得要求調閱前開有關合作商家紀錄，外送平臺業者不得拒絕。"},{"bill":"202110178160000","text":"外送平臺業者應保存下列各款與合作商家有關之紀錄，至少二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、為強化外送平臺營運透明度，並考量外送平臺業者與合作商家發生權益爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與合作商家有關之紀錄至少二年，該紀錄應包括外送合作契約內容、平臺業務招攬行為及執行紀錄、客戶服務或爭議之處理紀錄等。\n二、於第二項明定有關機關得要求調閱前開有關合作商家紀錄，外送平臺業者不得拒絕。"},{"bill":"202110181420000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰參照勞動部外送作業安全衛生指引規定，課予外送平臺業者通報勞動檢查機構之義務。"}],"changed":true,"final":"外送平臺業者應保存下列各款與合作商家有關之紀錄，至少二年：\n一、外送合作契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、其與合作商家間之客戶服務或爭議之處理紀錄。\n五、貨款之計算方式及給付時間。\n六、其他與前五款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","finalWhy":"一、為強化外送平臺營運透明度，並考量外送平臺業者與合作商家發生權益爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與合作商家有關之紀錄至少二年，該紀錄應包括外送合作契約內容、平臺業務招攬行為及執行紀錄、客戶服務或爭議之處理紀錄等。\n二、於第二項明定有關機關得要求調閱前開有關合作商家紀錄，外送平臺業者不得拒絕。","review":null},{"no":"第二十條","current":null,"versions":[{"bill":"202110017580000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，防止類似災害之發生，課予外送平台業者通報勞動部職業安全署所以之勞動檢查機構之義務。"},{"bill":"202110060450000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，防止類似災害之發生，課予外送平台業者通報勞動部職業安全署所以之勞動檢查機構之義務。"},{"bill":"202110060680000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110060360000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110075210000","text":"外送平台業者有違反第十條、第十一條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者有違反第十四條之規定，且外送員於執行外送服務過程中死亡者，處新臺幣二十萬元以上一百萬元以下罰鍰。","note":"一、外送平台業者違反第十一條，外送平台業者應敘明理由，並於三十日前預告外送員，始得終止與外送員之外送服務契約規定，以及第十二條，因可歸責之事由，終止外送服務契約時應提供外送員經濟補償時之處罰。\n二、外送平台業者違反第十四條之規定，且外送員因執行外送服務過程中死亡時之處罰。"},{"bill":"202110099010000","text":"外送員與外送平台業者間非為僱傭關係者，應準用勞工保險條例及勞工職業災害保險及保護法，由外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。","note":"外送員提供之勞務係外送平台業者獲取利潤之主要來源，為使外送平台業者履行社會責任，保障外送員權益，爰參酌勞動基準法第八章技術生之規範，以及高級中等學校建教合作實施及建教生權益保障法第二十一條第一項第六款規定，準用勞工保險條例及勞工職業災害保險及保護法規定，使外送平台業者為外送員辦理參加勞工保險及勞工職業災害保險。"},{"bill":"202110167670000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為提升新加入外送員交通安全等從事外送工作之有關知能，爰明定外送平臺業者應安排其接受相關教育訓練。\n二、另為使教育訓練課程符合相關法規，授權由中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練內容及有關事項。"},{"bill":"202110167840000","text":"外送平台業者有違反第十條、第十一條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者有違反第十四條之規定，且外送員於執行外送服務過程中死亡者，處新臺幣二十萬元以上一百萬元以下罰鍰。","note":"一、外送平台業者違反第十一條，外送平台業者應敘明理由，並於三十日前預告外送員，始得終止與外送員之外送服務契約規定，以及第十二條，因可歸責之事由，終止外送服務契約時應提供外送員經濟補償時之處罰。\n二、外送平台業者違反第十四條之規定，且外送員因執行外送服務過程中死亡時之處罰。"},{"bill":"202110168030000","text":"外送平臺業者對新加入之外送員，應施以下列教育訓練：\n一、一小時以上職業安全訓練。\n二、一小時以上交通安全訓練。\n三、一小時以上食品衛生安全訓練。\n四、其他經主管機關公告或必要之訓練。\n外送平臺業者對已完成前項教育訓練之從業外送員，每年應要求外送員至少完成一定時數之教育訓練，並應包含至少一小時之交通安全課程。\n外送員已在其他平臺業者接受前二項之教育訓練，得免實施之。\n外送平臺業者不得向外送員收取第一項及第二項教育訓練費用，或以提供教育訓練為由與外送員為最低服務期限之約定。\n第一項及第二項教育訓練課程之內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、參考六都公布之外送平臺業者管理自治條例，為提升新加入外送員職業安全、交通安全、食品衛生安全等從事外送工作之有關知能，爰明定外送平臺業者應安排其接受相關教育訓練。\n二、另為使教育訓練課程符合相關法規，授權由中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練內容及有關事項。"},{"bill":"202110168140000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，防止類似災害之發生，課予外送平台業者通報勞動部職業安全署所以之勞動檢查機構之義務。"},{"bill":"202110168230000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110168240000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為提升新加入外送員交通安全等從事外送工作之有關知能，爰明定外送平臺業者應安排其接受相關教育訓練。\n二、另為使教育訓練課程符合相關法規，授權由中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練內容及有關事項。"},{"bill":"202110169580000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員完成一定時數之持續教育訓練。\n前二項教育訓練之時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"本條要求外送平臺提供新進與在職外送員安全與衛生教育訓練，並授權相關主管機關訂定訓練規範。"},{"bill":"202110170380000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為確保外送員具備執行外送任務所需之交通安全、職業安全及食品衛生等基本知能，規定外送平臺業者應對新加入之外送員提供一定時數之教育訓練，並要求現有外送員每年持續完成進修課程，以維持作業安全與服務品質。\n二、為使前開教育訓練內容、時數及實施方式符合專業標準並具一致性，授權由中央主管機關、交通主管機關及衛生福利主管機關依職掌分別訂定相關規範事項。"},{"bill":"202110171160000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、要求平臺業者提供交通安全、食品衛生、安全防護等教育訓練，並於外送員違反交通安全規範時強制實施安全講習，提升產業安全水準。\n二、另為使教育訓練課程符合相關法規，授權由中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練內容及有關事項。"},{"bill":"202110170780000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，防止類似災害之發生，課予外送平台業者通報勞動部職業安全署所以之勞動檢查機構之義務。"},{"bill":"202110173040000","text":"外送人員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全署所屬勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，防止類似災害之發生，課予外送平台業者通報勞動部職業安全署所屬勞動檢查機構之義務。"},{"bill":"202110173260000","text":"外送平台業者有違反第十條、第十一條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者有違反第十四條之規定，且外送員於執行外送服務過程中死亡者，處新臺幣二十萬元以上一百萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，外送平台業者應敘明理由，並於三十日前預告外送員，始得終止與外送員之外送服務契約規定，以及第十二條，因可歸責之事由，終止外送服務契約時應提供外送員經濟補償時之處罰。\n二、明定外送平台業者違反第十四條之規定，且外送員因執行外送服務過程中死亡時之處罰。"},{"bill":"202110173180000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為提升新加入外送員交通安全等從事外送工作之有關知能，爰明定外送平臺業者應安排其接受相關教育訓練。\n二、另為使教育訓練課程符合相關法規，授權由中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練內容及有關事項。"},{"bill":"202110173190000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為提升新加入外送員交通安全等從事外送工作之有關知能，爰明定外送平臺業者應安排其接受相關教育訓練。\n二、另為使教育訓練課程符合相關法規，授權由中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練內容及有關事項。"},{"bill":"202110174530000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110174470000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害相關訊息，防止類似災害之發生，故明定外送平台業者通報勞動部職業安全署所屬之勞動檢查機構之義務。"},{"bill":"202110174740000","text":"外送平臺業者應保存下列與合作商家交易及合作有關之紀錄，保存時間不得低於二年：\n一、外送合作商家契約。\n二、平臺業務招攬行為及其執行紀錄。\n三、合作商家接受訂單及提供商品之時間及內容。\n四、合作商家之客戶服務或爭議處理紀錄。\n五、貨款計算方式及給付時間。\n六、其他與前五款相關之紀錄。\n有關機關得依職權要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"規定平臺應保存與合作商家交易、給付、爭議處理等紀錄至少二年，以作為查核依據並確保合作關係透明。"},{"bill":"202110175620000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，以防止類似災害之發生，爰於本條明定外送平臺業者通報勞動檢查機構之義務。"},{"bill":"202110175920000","text":"外送平臺業者應保存下列各款與外送員有關之紀錄，至少二年：\n一、外送服務契約。\n二、外送服務期間。\n三、上線期間。\n四、停權、依第七條規定終止外送服務契約，及以演算法或其他方式對外送員為不利之決定。\n五、其他外送服務契約終止情事。\n六、第二十二條規定之外送員教育訓練紀錄。\n七、其他與前六款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、考量外送平臺業者與外送員發生權益爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與外送員有關之紀錄至少二年，該紀錄包括外送服務契約內容、外送員提供外送服務、上線期間、停權紀錄、依第七條終止契約之情形，以及以演算法或其他方式對外送員為不利之決定等。\n二、於第二項明定有關機關得要求調閱前開有關外送員紀錄，外送平臺業者不得拒絕。"},{"bill":"202110176760000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全衛生署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。\n三、不可抗力因素所導致之傷病情狀。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，防止類似災害之發生，課予外送平台業者通報勞動部職業安全衛生署所屬之勞動檢查機構之義務。"},{"bill":"202110176980000","text":"外送平臺業者應保存下列各款與外送員有關之紀錄，至少五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、第五條第五項所定之外送員報酬清冊。\n五、停權、依第七條規定終止外送服務契約，及以演算法或其他方式對外送員為不利之決定。\n六、其他外送服務契約終止情事。\n七、第二十二條規定之外送員教育訓練紀錄。\n八、其他與前七款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、外送平臺業者應保存其與外送員之相關紀錄，包括外送服務契約、外送服務期間、外送員上線期間、報酬給付、停權及依本法第七條規定終止外送服務契約、以演算法或其他方式對外送員為不利之決定，或其他外送服務契約終止情事等有關紀錄。\n二、為保障外送員權益，參照勞動基準法第二十三條、勞工退休金條例第三十一條規定，相關紀錄應保存至少五年，並於必要時提供主管機關調閱，以利稽查與爭議處理。"},{"bill":"202110177680000","text":"外送平臺業者應保存下列各款與外送員有關之紀錄，至少五年：\n一、外送服務契約。\n二、外送服務期間。\n三、上線期間。\n四、停權、依第七條規定終止外送服務契約及以演算法或其他方式對外送員為不利之決定。\n五、其他外送服務契約終止情事。\n六、第二十二條規定之外送員教育訓練紀錄。\n七、其他與前六款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、考量外送平臺業者與外送員發生權益爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，爰參考勞動基準法第三十條第五項及前開報酬清冊應保存五年之規定，於第一項明定外送平臺業者應保存與外送員有關之紀錄至少五年，該紀錄包括外送服務契約內容、外送員提供外送服務、上線期間、停權紀錄、依第七條終止契約之情形，以及以演算法或其他方式對外送員為不利之決定等。\n二、於第二項明定有關機關得要求調閱前開有關外送員紀錄，外送平臺業者不得拒絕。"},{"bill":"202110178160000","text":"外送平臺業者應保存下列各款與外送員有關之紀錄，至少二年：\n一、外送服務契約。\n二、外送服務期間。\n三、上線期間。\n四、停權、依第七條規定終止外送服務契約，及以演算法或其他方式對外送員為不利之決定。\n五、其他外送服務契約終止情事。\n六、第二十二條規定之外送員教育訓練紀錄。\n七、其他與前六款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"一、考量外送平臺業者與外送員發生權益爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與外送員有關之紀錄至少二年，該紀錄包括外送服務契約內容、外送員提供外送服務、上線期間、停權紀錄、依第七條終止契約之情形，以及以演算法或其他方式對外送員為不利之決定等。\n二、於第二項明定有關機關得要求調閱前開有關外送員紀錄，外送平臺業者不得拒絕。"},{"bill":"202110181420000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為提升新加入外送員交通安全等從事外送工作之有關知能，爰明定外送平臺業者應安排其接受相關教育訓練。\n二、另為使教育訓練課程符合相關法規，授權由中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練內容及有關事項。"}],"changed":true,"final":"外送平臺業者應保存下列各款與外送員有關之紀錄，至少二年：\n一、外送服務契約。\n二、外送服務期間。\n三、上線期間。\n四、停權、依第七條規定終止外送服務契約，及以演算法或其他方式對外送員為不利之決定。\n五、其他外送服務契約終止情事。\n六、第二十二條規定之外送員教育訓練紀錄。\n七、其他與前六款有關之紀錄。\n有關機關得要求調閱前項各款紀錄，外送平臺業者不得拒絕。","finalWhy":"一、考量外送平臺業者與外送員發生權益爭議時，應由外送平臺業者提供具體佐證，俾利釐清責任歸屬以確保雙方權益，於第一項明定外送平臺業者應保存與
