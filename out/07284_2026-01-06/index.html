<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>外送員權益保障及外送平臺管理法制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

,"arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條","第二十七條","第二十八條"]},{"id":"202110176760000","who":"委員林思銘等17人","date":"2025-12-05","name":"「外送平台管理暨從業人員權益保障法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110176760000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/16/LCEWA01_110416_00176.pdf","proposers":["林思銘"],"ncosign":16,"people":[["林思銘","國民黨","提案"],["許宇甄","國民黨","連署"],["林德福","國民黨","連署"],["謝龍介","國民黨","連署"],["林倩綺","國民黨","連署"],["邱鎮軍","國民黨","連署"],["邱若華","國民黨","連署"],["黃仁","國民黨","連署"],["陳雪生","國民黨","連署"],["葛如鈞","國民黨","連署"],["陳菁徽","國民黨","連署"],["葉元之","國民黨","連署"],["翁曉玲","國民黨","連署"],["丁學忠","國民黨","連署"],["黃建賓","國民黨","連署"],["羅明才","國民黨","連署"],["蘇清泉","國民黨","連署"]],"party":[["國民黨",17]],"reason":"本院委員林思銘等17人，鑑於近年來我國外送平台及相關產業快速發展，成為重要生活方式及產業，平台業者、平台勞務提供者（下稱外送員）和勞務需求者之間衍生之勞動問題愈趨複雜，且非現行勞動法令所能有效規範，至今，外送員已到十五萬人，法案卻原地踏步，外送員的工作處境更劣勢，致有工時零碎化、勞雇關係不明確等狀況，不論外送平台業者和外送員間的法律關係為何，勞動者的權益應優先獲得保障，為強化外送平台業者之管理，保障外送員、消費者及合作商家之權益，爰擬具「外送平台管理暨從業人員權益保障法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條"]},{"id":"202110176980000","who":"委員吳沛憶等18人","date":"2025-12-05","name":"「外送員權益保障及外送平臺管理法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110176980000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/16/LCEWA01_110416_00173.pdf","proposers":["吳沛憶","蔡易餘","賴惠員"],"ncosign":15,"people":[["吳沛憶","民進黨","提案"],["蔡易餘","民進黨","提案"],["賴惠員","民進黨","提案"],["林宜瑾","民進黨","連署"],["郭昱晴","民進黨","連署"],["黃秀芳","民進黨","連署"],["陳亭妃","民進黨","連署"],["范雲","民進黨","連署"],["張宏陸","民進黨","連署"],["陳秀寳","民進黨","連署"],["李坤城","民進黨","連署"],["張雅琳","民進黨","連署"],["吳思瑤","民進黨","連署"],["林月琴","民進黨","連署"],["林俊憲","民進黨","連署"],["王義川","民進黨","連署"],["沈發惠","民進黨","連署"],["賴瑞隆","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員吳沛憶、蔡易餘、賴惠員等18人，為保障外送員權益、提升外送服務安全、強化外送 已成為全球共同關注的議題，目前全臺約有十五萬名外送從業人員，其權益保障攸關重大，政府應積極介入並建立完善制度，透過契約內容定型化、提供基本薪酬保障、終止與申訴機制之明確化，及將職災與保險納入法制等措施，以平衡外送員與平臺間的權利義務，確保外送員的基本勞動保障得以落實。爰參考勞動部預告制定之草案並予以修訂，爰擬具「外送員權益保障及外送平臺管理法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條","第二十七條","第二十八條"]},{"id":"202110178160000","who":"委員張雅琳等17人","date":"2025-12-12","name":"「外送員權益保障及外送平臺管理法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110178160000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/16/LCEWA01_110416_00175.pdf","proposers":["張雅琳"],"ncosign":16,"people":[["張雅琳","民進黨","提案"],["陳亭妃","民進黨","連署"],["賴惠員","民進黨","連署"],["沈伯洋","民進黨","連署"],["王美惠","民進黨","連署"],["吳思瑤","民進黨","連署"],["陳俊宇","民進黨","連署"],["陳秀寳","民進黨","連署"],["徐富癸","民進黨","連署"],["范雲","民進黨","連署"],["蘇巧慧","民進黨","連署"],["郭國文","民進黨","連署"],["黃捷","民進黨","連署"],["王正旭","民進黨","連署"],["林月琴","民進黨","連署"],["李柏毅","民進黨","連署"],["羅美玲","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員張雅琳等17人，我國外送平臺產業近年迅速發展，已成為民眾生活中不可或缺的服務。然而，外送平臺業者在資訊與技術上居於優勢地位，主導派單、報酬計算、合作商家抽成、消費者運費等關鍵事項，導致外送員、合作商家與消費者皆處於弱勢地位，衍生報酬不透明、工作權不穩定、契約不對等、爭議無申訴管道等問題。此種權利義務嚴重失衡的情況，已影響產業正常與健全發展。為保障外送員基本報酬、工作權、申訴權、投保權益及職業安全，並確保消費者與合作商家之合理權益，同時促進外送平臺產業透明治理與正常競爭，有必要訂定專法，明確規範外送服務契約、派單資訊揭露、最低報酬標準、保險制度、申訴與救濟程序、教育訓練、交通安全要求及相關罰則等事項。特擬定草案，建立平衡外送員、消費者、合作商家與外送平臺業者權利義務之制度基礎，強化外送員權益保障，提升公共安全與交易透明度，並促進外送平臺產業之健全發展，爰擬具「外送員權益保障及外送平臺管理法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條","第二十七條","第二十八條"]},{"id":"202110181420000","who":"委員蔡易餘等17人","date":"2025-12-26","name":"「外送員權益保障及外送平臺管理法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110181420000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/16/LCEWA01_110416_00174.pdf","proposers":["蔡易餘","王美惠","賴惠員","王世堅","伍麗華Saidhai‧Tahovecahe","陳素月","徐富癸"],"ncosign":10,"people":[["蔡易餘","民進黨","提案"],["王美惠","民進黨","提案"],["賴惠員","民進黨","提案"],["王世堅","民進黨","提案"],["伍麗華Saidhai‧Tahovecahe","民進黨","提案"],["陳素月","民進黨","提案"],["徐富癸","民進黨","提案"],["林宜瑾","民進黨","連署"],["陳俊宇","民進黨","連署"],["張雅琳","民進黨","連署"],["吳沛憶","民進黨","連署"],["郭昱晴","民進黨","連署"],["郭國文","民進黨","連署"],["何欣純","民進黨","連署"],["李坤城","民進黨","連署"],["陳冠廷","民進黨","連署"],["許智傑","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員蔡易餘、王美惠、賴惠員、王世堅、伍麗華Saidhai Tahovecahe、陳素月、徐富癸等17人，隨著數位經濟與共享經濟的興起，外送服務已成為現代生活不可或缺的一環。外送平台透過數位媒合技術，使餐飲、零售等產業能即時將商品送達消費者，帶動新型態就業型態。然而，目前我國外送人員之勞動關係定位不明，多數平台以「承攬」或「合作」名義與外送人員簽約，使其無法適用勞動相關法規，對於外送人員保障不足，爰擬具「外送員權益保障及外送平臺管理法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條"]}],"arts":[{"no":"第一條","current":null,"versions":[{"bill":"202110017580000","text":"為加強外送平台業者之管理，保障外送員權益，特制定本法。本法未規定者，依其他法律規定。","note":"立法目的。"},{"bill":"202110060450000","text":"為加強外送平台業者之管理，保障外送員權益，特制定本法。本法未規定者，依其他法律規定。","note":"一、本條之立法目的。\n二、為加強外送平台業者之管理，保障外送員權益，特制定本法。"},{"bill":"202110060680000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，依其他有關法律之規定。","note":"立法目的。"},{"bill":"202110060360000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，依其他有關法律之規定。","note":"於新型態外送平台共享經濟下，消費者得使用電子商務技術進行網際網路交易購買商品，外送員得於行動電話或類此設備之應用程式中選擇願接受之外送服務，以提供消費者所購買商品之外送服務。於此外送服務之運送過程，常見職業安全、食品安全、交通安全及消費糾紛等問題，外送平台業者為該經濟類型之主要媒合及報酬給付者，並因此獲得利益，為保障外送員之權益，爰於第一條揭示本法之立法目的。"},{"bill":"202110075210000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，依其他有關法律之規定。","note":"立法目的。"},{"bill":"202110099010000","text":"為加強外送平台業者之管理，保障外送員權益，特制定本法。本法未規定者，依其他法律規定。","note":"立法目的。"},{"bill":"202110167670000","text":"為保障外送員權益及管理外送平臺業者，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、立法目的。\n二、外送員與外送平臺業者具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反交通安全規定須完成之道路交通安全講習等事項，應依本法規定辦理，其餘權益保障事項應依勞動基準法及相關法律規定辦理；未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理。"},{"bill":"202110167840000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，依其他有關法律之規定。","note":"立法目的。"},{"bill":"202110168030000","text":"為保障外送員權益及管理外送平臺業者，促進國民消費生活安全，提升貨品供應品質，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律之規定。","note":"立法目的。"},{"bill":"202110168140000","text":"為加強外送平台業者之管理，保障外送員權益，特制定本法。本法未規定者，依其他法律規定。","note":"本法之立法目的。"},{"bill":"202110168230000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，依其他有關法律之規定。","note":"本法立法目的。"},{"bill":"202110168240000","text":"為保障外送員權益及管理外送平臺業者，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、立法目的。\n二、外送員與外送平臺業者具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反交通安全規定須完成之道路交通安全講習等事項，應依本法規定辦理，其餘權益保障事項應依勞動基準法及相關法律規定辦理；未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理。"},{"bill":"202110169580000","text":"為保障外送員之工作權益，並健全外送平臺業者之管理與責任，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他相關法律。惟外送平臺業者與外送員間具有僱傭關係者，除第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障、管理及處罰等事項，依勞動基準法及其他相關法令辦理。","note":"本條為立法目的條款，說明本法旨在保障外送員權益並規範平臺業者責任。同時區分是否具僱傭關係，以確保勞動者權益及法令適用明確。"},{"bill":"202110170380000","text":"為保障外送員權益及管理外送平臺業者，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、立法目的。\n二、本條明定外送員與外送平臺業者間之法律適用區分。\n三、如雙方具有僱傭關係，其外送服務契約交付、商業保險投保、職業災害通報、外送員教育訓練，以及違反交通安全規定後須完成之道路交通安全講習等事項，應依本法規定辦理，以確保制度一致與安全管理責任之落實。至於其餘勞動條件、權益保障及處罰事項，則依《勞動基準法》及其他相關法律規定辦理。\n四、若外送員與外送平臺業者不具僱傭關係，則其權益保障事項依本法規定處理；惟本法未規定而其他法律另有規定者，仍依該法律規定辦理，以確保法律適用之完整與層次。"},{"bill":"202110171160000","text":"為維護及保障外送員勞動權益及管理外送平臺業者，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、立法目的。\n二、本法外送員屬介於僱傭與承攬之間之準僱傭關係，參照司法院釋字第740號意旨及勞動部指導原則建立保障架構。\n三、外送員與外送平臺業者具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反交通安全規定須完成之道路交通安全講習等事項，應依本法規定辦理，其餘權益保障事項應依勞動基準法及相關法律規定辦理；未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理。"},{"bill":"202110170780000","text":"為加強外送平台業者之管理，保障外送員權益，特制定本法。本法未規定者，依其他法律規定。","note":"立法目的。"},{"bill":"202110173040000","text":"為加強外送平台業者之管理，保障外送人員權益，特制定本法。本法未規定者，依其他法律規定。","note":"立法目的。"},{"bill":"202110173260000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，依其他有關法律之規定。","note":"本法立法目的。"},{"bill":"202110173180000","text":"為保障外送員權益及管理外送平臺業者，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。\n外送平臺具有演算法功能而對於外送員有控制、指揮功能者，推定兩者間具雇傭關係。","note":"一、立法目的。\n二、外送員與外送平臺業者具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反交通安全規定須完成之道路交通安全講習等事項，應依本法規定辦理，其餘權益保障事項應依勞動基準法及相關法律規定辦理；未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理。\n三、演算法管理是一種利用自動化或半自動化決策系統、機器學習及其他數據驅動技術來執行傳統管理職能的工作模式。在美食外送平臺的情境中，演算法取代了人類管理者，執行以下核心任務：\n(一)任務分配與調度：系統根據即時數據（如外送員位置、餐廳備餐時間、交通狀況）決定將訂單派發給哪位外送員，以追求最高效率。\n(二)薪酬設定：演算法基於多種變數（如距離、預估時間、需求高峰時段的「動態計價」）動態計算每筆訂單的報酬。\n(三)績效評估：系統持續追蹤並量化外送員的各項表現指標，例如顧客評分、訂單接受率、取消率及配送準時率。\n(四)紀律處分與解僱：演算法可根據預設規則，對績效不彰或違反平臺政策的外送員自動執行警告、暫時停權，甚至是永久「停用帳號」（deactivation）等處分。\n四、此管理模式的核心特徵在於其不透明性。外送員往往難以理解其收入為何波動、為何未被指派訂單，或是在收到負面評價與帳號被停用時，無法獲得具體且可驗證的解釋。這種資訊不對稱性，使得演算法的決策過程充滿了不確定性，且可能存在錯誤或歧視，但受影響的勞動者卻缺乏有效的申訴或救濟管道。是以透過演算法管理的外送平臺與外送員間之關係將更加失衡，加以外送員目前投入門檻極低，且不如計程車駕駛具有執業登記證及牌照總量管制等法制之基本保障，故為衡平外送平臺業者與外送員兩者間之實質及法律上地位，確保外送員權益，爰參酌歐盟歐盟於2024年正式通過的《平臺工作指令》（Platform Work Directive, PWD）之規定，將使用演算法管理之外送平臺與外送員關係推定為雇傭關係，以承擔較重之照顧責任，外送平臺若要推翻此推定，必須負起舉證責任，證明該勞動者是真正獨立的自營作業者，目的在於將演算法的控制力與勞動者的法律地位直接掛鉤，迫使平臺正視其管理行為的法律後果。"},{"bill":"202110173190000","text":"為保障外送員權益及管理外送平臺業者，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、立法目的。\n二、外送員與外送平臺業者具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反交通安全規定須完成之道路交通安全講習等事項，應依本法規定辦理，其餘權益保障事項應依勞動基準法及相關法律規定辦理；未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理。"},{"bill":"202110174530000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，依其他有關法律之規定。","note":"本法立法目的。"},{"bill":"202110174470000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，適用其他法律之規定。","note":"本法之立法目的。"},{"bill":"202110174740000","text":"為規範外送平臺業者與外送從業人員、合作商家及消費者之權利義務關係，並保障外送員及合作商家之權益，特制定本法。\n外送員、合作商家、消費者之權益保障及外送平臺業者之管理，依本法之規定；本法未規定者，適用其他法律之規定。外送平臺業者與外送員間另訂雇傭契約者，除適用第四條第五項、第十條、第十二條至第十四條及第二十二條之規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定辦理。","note":"一、立法目的\n二、本條明定本法係為規範外送平臺業者與外送員、合作商家及消費者間之權利義務關係，並確保外送員與合作商家權益，填補現行法律對數位外送產業之管理不足。另明確規定適用層級與與勞動基準法之關聯，避免法律適用爭議。"},{"bill":"202110175620000","text":"為保障外送員權益及管理外送平臺業者，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第二十條至第二十三條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、立法目的。\n二、外送員與外送平臺業者具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反交通安全規定須完成之道路交通安全講習等事項，應依本法規定辦理，其餘權益保障事項應依勞動基準法及相關法律規定辦理；未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理。"},{"bill":"202110175920000","text":"為保障外送員權益、管理外送平臺業者、維護消費者及合作商家權益，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第四條第五項、第十條及第二十一條至第二十五條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、本法之立法目的。\n二、為因應外送平臺產業之發展，衡平外送員、消費者、合作商家與外送平臺業者間之各方權利義務關係，以保障外送員、消費者及合作商家權益，並兼顧外送平臺產業健全發展，特制定本法。\n三、外送平臺業者與外送員間未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理；具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反重大交通安全規定須完成之道路交通安全講習及相應處罰等事項，應依本法規定辦理外，其餘權益保障事項應依勞動基準法、職業安全衛生法及其他相關法律規定辦理。"},{"bill":"202110176760000","text":"為管理外送平台業者，保障外送員權益，特制定本法；本法未規定者，依其他有關法律之規定。","note":"一、立法目的。\n二、為加強外送平台業者之管理，保障外送員權益，特制定本法。"},{"bill":"202110176980000","text":"為保障外送員權益、提升外送服務安全、強化外送平臺管理，並維護消費者及合作商家權益，促進產業健全發展，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第四條第五項、第十條及第二十一條至第二十三條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"明定本法立法目的。"},{"bill":"202110177560000","text":"為管理外送平臺業者與外送從業員之權利義務關係，特制定本法。本法未規定者，依其他有關法律之規定。","note":"一、本法之立法目的。\n二、為因應外送平臺產業之發展，衡平外送員與外送平臺業者間權利義務關係，並兼顧外送平臺產業健全發展，特制定本法。\n三、外送平臺業者與外送員如非屬僱傭關係，權益保障事項依本法規定，本法未規定而其他法律另有規定者，依其他法律規定辦理；而屬僱傭關係者，除提供外送服務契約、職業災害通報、外送員教育訓練及違反重大交通安全規定須完成之道路交通安全講習及相應處罰等事項，應依本法規定辦理外，其餘權益保障事項應依勞動基準法、職業安全衛生法及其他相關法律規定辦理。"},{"bill":"202110177680000","text":"為保障外送員權益、管理外送平臺業者、維護消費者及合作商家權益，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第四條第五項、第十條及第二十一條至第二十五條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、本法之立法目的。\n二、為因應外送平臺產業之發展，衡平外送員、消費者、合作商家與外送平臺業者間之各方權利義務關係以保障外送員、消費者及合作商家權益，並兼顧外送平臺產業健全發展，特制定本法。\n三、外送平臺業者與外送員間未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理；具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反重大交通安全規定須完成之道路交通安全講習及相應處罰等事項，應依本法規定辦理外，其餘權益保障事項應依勞動基準法、職業安全衛生法及其他相關法律規定辦理。"},{"bill":"202110178160000","text":"為保障外送員權益、管理外送平臺業者、維護消費者及合作商家權益，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第四條第五項、第十條及第二十一條至第二十五條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、本法之立法目的。\n二、為因應外送平臺產業之發展，衡平外送員、消費者、合作商家與外送平臺業者間之各方權利義務關係，以保障外送員、消費者及合作商家權益，並兼顧外送平臺產業健全發展，特制定本法。\n三、外送平臺業者與外送員間未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理；具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反重大交通安全規定須完成之道路交通安全講習及相應處罰等事項，應依本法規定辦理外，其餘權益保障事項應依勞動基準法、職業安全衛生法及其他相關法律規定辦理。"},{"bill":"202110181420000","text":"為保障外送員權益及管理外送平臺業者，特制定本法。\n外送員權益保障及外送平臺業者管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第六條第五項、第十一條及第十九條至第二十二條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","note":"一、立法目的。\n二、外送員與外送平臺業者具有僱傭關係者，除提供外送服務契約收執、投保商業保險、職業災害通報、外送員教育訓練及違反交通安全規定須完成之道路交通安全講習等事項，應依本法規定辦理，其餘權益保障事項應依勞動基準法及相關法律規定辦理；未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理。"}],"changed":true,"final":"為保障外送員、消費者、合作商家之權益及管理外送平臺業者，以衡平各方權利義務關係，特制定本法。\n前項所定權益保障及管理，依本法之規定；本法未規定者，適用其他法律之規定。但外送平臺業者與外送員間具有僱傭關係者，除適用第四條第五項、第十條及第二十一條至第二十五條規定外，其權益保障及處罰等事項，依勞動基準法及其他相關法律規定處理。","finalWhy":"一、本法之立法目的。\n二、為因應外送平臺產業之發展，衡平外送員、消費者、合作商家與外送平臺業者間之各方權利義務關係，以保障外送員、消費者及合作商家權益，並兼顧外送平臺產業健全發展，特制定本法。\n三、外送平臺業者與外送員間未具僱傭關係者，其權益保障事項依本法規定處理，本法未規定而其他法律另有規定者，依其他法律規定辦理；具有僱傭關係者，除提供外送服務契約收執、投保團體傷害保險及責任保險、職業災害通報、外送員教育訓練及違反重大交通安全規定須完成之道路交通安全講習及相應處罰等事項，應依本法規定辦理外，其餘權益保障事項應依勞動基準法、職業安全衛生法及其他相關法律規定辦理。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第二條","current":null,"versions":[{"bill":"202110017580000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但本法所定事項涉及各中央目的事業主管機關權責者，由各該目的事業主管機關辦理。","note":"定明各層級主管機關。"},{"bill":"202110060450000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但本法所定事項涉及各中央目的事業主管機關權責者，由各該目的事業主管機關辦理。","note":"本法之主管機關。"},{"bill":"202110060680000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但本法所定事項涉及各中央目的事業主管機關職責者，由各該目的事業主管機關辦理。","note":"列明本法各層級之主管機關。"},{"bill":"202110060360000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但本法所定事項涉及各中央目的事業主管機關職責者，由各該目的事業主管機關辦理。","note":"列明本法各層級之主管機關，以明權責。"},{"bill":"202110075210000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但本法所定事項涉及各中央目的事業主管機關職責者，由各該目的事業主管機關辦理。","note":"列明本法各層級之主管機關。"},{"bill":"202110099010000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但本法所定事項涉及各中央目的事業主管機關權責者，由各該目的事業主管機關辦理。","note":"定明各層級主管機關。"},{"bill":"202110167670000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關執掌者，由目的事業主管機關辦理。\n前二項主管機關及各目的事業主管機關權責劃分如下：\n一、主管機關：外送服務契約、停權、報酬、申訴制度、職業安全、保險、外送員相關紀錄保存、外送員職業安全教育訓練等有關外送員勞動權益保障之規劃、推動及監督。\n二、交通主管機關：基本運價核定、消費者保護、個人資料保護、道路交通安全、消費者相關紀錄保存、外送員交通安全教育訓練等有關外送平臺管理之規劃、推動及監督。\n三、經濟主管機關：外送合作契約、外送平臺業者收取費用及爭議處理、合作商家相關紀錄保存等有關合作商家權益保障事項之規劃、推動及監督。\n四、衛生福利主管機關：外送食品衛生安全、外送員食品衛生安全教育訓練等事項之規劃、推動及監督。\n五、金融主管機關：外送平臺之電子支付交易安全、外送員投保商業保險商品等事項之核定及監督。\n六、數位發展主管機關：外送平臺之第三方服務交易安全事項之監督。\n七、其他外送員權益保障及外送平臺管理事項：由各相關目的事業主管機關依職權規劃辦理。","note":"一、明定各層級主管機關。\n二、本法所定事項涉及各目的事業主管機關執掌者，由各機關依權責辦理，於第三項明定各機關之權責劃分。"},{"bill":"202110167840000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但本法所定事項涉及各中央目的事業主管機關職責者，由各該目的事業主管機關辦理。","note":"列明本法各層級之主管機關。"},{"bill":"202110168030000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，涉及各目的事業主管機關執掌者，由目的事業主管機關辦理。\n前二項主管機關及各目的事業主管機關權責劃分如下：\n一、主管機關：外送服務契約、停權、報酬、申訴及救濟、職業安全、保險、外送員相關紀錄保存、外送員職業安全教育訓練等有關外送員勞動權益保障之規劃、推動及監督。\n二、交通主管機關：基本運價核定、消費者保護、個人資料保護、道路交通安全、消費者相關紀錄保存、外送員交通安全教育訓練等有關外送平臺管理之規劃、推動及監督。\n三、經濟主管機關：外送合作契約、外送平臺業者收取費用及爭議處理、合作商家相關紀錄保存等有關合作商家權益保障事項之規劃、推動及監督。\n四、衛生福利主管機關：外送食品衛生安全、外送員食品衛生安全教育訓練等事項之規劃、推動及監督。\n五、金融主管機關：外送平臺之電子支付交易安全、外送員投保商業保險商品等事項之核定及監督。\n六、數位發展主管機關：外送平臺之第三方服務交易安全事項之監督。\n七、其他外送員權益保障及外送平臺管理事項：由各相關目的事業主管機關依職權規劃辦理。","note":"一、明定各層級主管機關。\n二、本法所定事項涉及各目的事業主管機關執掌者，由各機關依權責辦理，於第三項明定各機關之權責劃分。"},{"bill":"202110168140000","text":"本法之主管機關：在中央為勞動部；在直轄市為直轄 執掌業務時，由各該機關辦理。\n前二項主管機關及各目的事業主管機關權責劃分如下：\n一、主管機關：主管外送服務契約、停權、報酬、申訴制度、職業安全衛生、保險、保存外送員相關紀錄、外送員職業安全衛生教育訓練等有關外送員勞動權益保障之事項。\n二、交通主管機關：主管基本運價核定、消費者保護、個人資料保護、道路交通安全、保存消費者相關紀錄、外送員交通安全教育訓練等有關外送平臺管理之事項。\n三、經濟主管機關：主管外送合作契約、外送平臺業者收取費用及爭議處理、保存合作商家相關紀錄等有關合作商家權益保障之事項。\n四、衛生福利主管機關：主管外送食品衛生安全、外送員食品衛生安全教育訓練等事項。\n五、金融主管機關：主管外送平臺提供之金融支付工具交易安全、外送員投保團體傷害保險及責任保險商品等事項。\n六、數位發展主管機關：主管外送平臺提供之第三方支付服務交易安全事項。\n七、其他外送員權益保障及外送平臺管理事項：由各相關目的事業主管機關依職權規劃辦理。"}},{"no":"第三條","current":null,"versions":[{"bill":"202110017580000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買食品、商品或服務，並提供外送員就消費者購買之食品、商品或服務進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指與外送平台業者簽訂契約提供外送服務之人。\n四、外送服務：指外送員使用外送平台業者指定程式或方式同意開始運送消費者購買之食品、商品或提供服務。\n五、合作商家：指與外送平台業者簽訂契約，使用外送平台指定之應用程式或行動裝置於外送平台提供食品、商品或服務之食品業者或商業經營者。\n六、報酬：指外送員提供外送服務所得之對價。\n七、運費：指消費者透過外送平台訂購食品、商品或服務，除食品、商品或服務之價格外，另行支付之運費或服務費。\n八、貨款：指合作商家提供食品、商品或服務，外送平台業者應給與之費用。\n九、外送服務契約：指外送平台業者與外送員間有關報酬計算方式、食品、商品或服務提供方式、報酬給付時間及其他相關權利義務之約定。\n十、外送合作契約：指外送平台業者與合作商家間，有關食品、商品或服務、貨款給付時間及其他相關權利義務之約定。\n十一、外送服務期間：指外送員於外送平台業者指定程式或裝置上線起至下線止之期間。\n十二、停權：指對於外送員、合作商家暫時停止上線、接收訂單之處置。\n十三、平台業務招攬行為：指外送平台業者要求合作商家以推出折扣、付費行銷、廣告、擴大消費者可訂餐範圍或其他增加曝光率、營收、客源之業務招攬行為。","note":"明定本法相關之用詞定義。"},{"bill":"202110060450000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買食品、商品或服務，並提供外送員就消費者購買之食品、商品或服務進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指與外送平台業者簽訂契約提供外送服務之人。\n四、外送服務：指外送員使用外送平台業者指定程式或方式同意開始運送消費者購買之食品、商品或提供服務。\n五、合作商家：指與外送平台業者簽訂契約，使用外送平台指定之應用程式或行動裝置於外送平台提供食品、商品或服務之食品業者或商業經營者。\n六、報酬：指外送員提供外送服務所得之對價。\n七、運費：指消費者透過外送平台訂購食品、商品或服務，除食品、商品或服務之價格外，另行支付之運費或服務費。\n八、貨款：指合作商家提供食品、商品或服務，外送平台業者應給與之費用。\n九、外送服務契約：指外送平台業者與外送員間有關報酬計算方式、食品、商品或服務提供方式、報酬給付時間及其他相關權利義務之約定。\n十、外送合作契約：指外送平台業者與合作商家間，有關食品、商品或服務、貨款給付時間及其他相關權利義務之約定。\n十一、外送服務期間：指外送員於外送平台業者指定程式或裝置上線起至下線之時止之期間。\n十二、停權：指對於外送員、合作商家暫時停止上線、接收訂單之處置。\n十三、平台業務招攬行為：指外送平台業者要求合作商家以推出折扣、付費行銷、廣告、擴大消費者可訂餐範圍或其他增加曝光率、營收、客源之業務招攬行為。","note":"本法相關之用詞定義。"},{"bill":"202110060680000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買商品，並提供外送員選擇是否就消費者購買之商品進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指透過外送平台應用程式，前往消費者指定之廠商領取商品，再外送至消費者指定地點，並交予消費者而從事外送服務之人員。\n四、外送服務契約：指外送員提供外送服務，外送平台業者給付報酬，以及就雙方權利義務有關之約定。\n五、接單費：指外送員因履行外送服務契約而獲得之報酬；包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n六、停權處分：外送平台業者停止指派外送員提供外送服務，或其他之不利處分。\n七、外送服務期間：指外送員於外送平台應用程式上線起，至下線之時止之期間。","note":"本法相關用詞之定義。"},{"bill":"202110060360000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易媒合，提供消費者購買商品，且由外送員選擇接受消費者訂單並就消費者購買之商品進行送達服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指透過外送平台接受消費者訂單，前往指定之標的廠商領取商品，並送達指定地點完成交付之外送服務從業人員。\n四、外送服務契約：指外送員提供外送服務，外送平台業者給付報酬，以及就雙方權利義務有關之約定。\n五、接單費：指外送員因履行外送服務契約而獲得之報酬；包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n六、停權處分：外送平台業者停止指派外送員提供外送服務，或其他之不利處分。\n七、外送服務期間：指外送員於外送平台應用程式上線起，至下線之時止之期間。","note":"本法相關用詞之定義。"},{"bill":"202110075210000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買商品，並提供外送員選擇是否就消費者購買之商品進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指透過外送平台應用程式，前往消費者指定之廠商領取商品，再外送至消費者指定地點，並交予消費者而從事外送服務之人員。\n四、外送服務契約：指外送員提供外送服務，外送平台業者給付報酬，以及就雙方權利義務有關之約定。\n五、接單費：指外送員因履行外送服務契約而獲得之報酬；包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n六、停權處分：外送平台業者停止指派外送員提供外送服務，或其他之不利處分。\n七、外送服務期間：指外送員於外送平台應用程式上線起，至下線之時止之期間。","note":"本法相關用詞之定義。"},{"bill":"202110099010000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買食品、商品或服務，並提供外送員就消費者購買之食品、商品或服務進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指與外送平台業者簽訂契約提供外送服務之人。\n四、外送服務：指外送員使用外送平台業者指定程式或方式同意開始運送消費者購買之食品、商品或提供服務。\n五、合作商家：指與外送平台業者簽訂契約，使用外送平台指定之應用程式或行動裝置於外送平台提供食品、商品或服務之食品業者或商業經營者。\n六、報酬：指外送員提供外送服務所得之對價。\n七、運費：指消費者透過外送平台訂購食品、商品或服務，除食品、商品或服務之價格外，另行支付之運費或服務費。\n八、貨款：指合作商家提供食品、商品或服務，外送平台業者應給與之費用。\n九、外送服務契約：指外送平台業者與外送員間有關報酬計算方式、食品、商品或服務提供方式、報酬給付時間及其他相關權利義務之約定。\n十、外送合作契約：指外送平台業者與合作商家間，有關食品、商品或服務、貨款給付時間及其他相關權利義務之約定。\n十一、外送服務期間：指外送員於外送平台業者指定程式或裝置上線起至下線止之期間。\n十二、停權：指對於外送員、合作商家暫時停止上線、接收訂單之處置。\n十三、平台業務招攬行為：指外送平台業者要求合作商家以推出折扣、付費行銷、廣告、擴大消費者可訂餐範圍或其他增加曝光率、營收、客源之業務招攬行為。","note":"明定本法相關之用詞定義。"},{"bill":"202110167670000","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供消費者購買商品，並將訂單發派予外送員選擇承接及進行外送服務之業者。\n三、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺指定之應用程式或裝置，提供商品予消費者購買之業者。\n四、外送合作契約：指外送平臺業者與合作商家間，有關商品提供、貨款給付及其他相關權利義務之契約。\n五、運費：指平臺貨運業者向消費者及合作商家收取之運送商品費用。\n六、貨款：指合作商家透過外送平臺業者提供商品予消費者，外送平臺業者應給予合作商家之款項。\n七、外送服務契約：指外送平臺業者與外送員間有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項之契約。\n八、停權：指外送平臺業者暫時停止發派訂單予外送員提供外送服務等處置；外送平臺業者暫時停止合作商家接收消費者訂單之處置。\n九、報酬：指外送員依外送服務契約提供外送服務期間所獲得之勞務對價，包括基本報酬、各項獎金等。\n十、外送服務：指外送員使用外送平臺業者指定之應用程式，接受由外送平臺業者發派之訂單，前往合作商家領取商品並交付消費者或運送至指定地點。\n十一、外送服務期間：指自外送員接受外送平臺業者發派之每筆訂單時起，至完成該訂單時止之期間。\n十二、外送員上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。","note":"明定本法相關用詞定義。"},{"bill":"202110167840000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買商品，並提供外送員選擇是否就消費者購買之商品進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指透過外送平台應用程式，前往消費者指定之廠商領取商品，再外送至消費者指定地點，並交予消費者而從事外送服務之人員。\n四、外送服務契約：指外送員提供外送服務，外送平台業者給付報酬，以及就雙方權利義務有關之約定。\n五、接單費：指外送員因履行外送服務契約而獲得之報酬；包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n六、停權處分：外送平台業者停止指派外送員提供外送服務，或其他之不利處分。\n七、外送服務期間：指外送員於外送平台應用程式上線起，至下線之時止之期間。","note":"本法相關用詞之定義。"},{"bill":"202110168030000","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供消費者購買商品，並將訂單發派予外送員選擇承接及進行外送服務之業者。\n三、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺指定之應用程式或行動裝置，提供商品予消費者購買之業者。\n四、外送合作契約：指外送平臺業者與合作商家間，有關商品提供、貨款給付及其他相關權利義務之契約。\n五、運費：指外送平臺業者向消費者及合作商家收取之運送商品費用。\n六、貨款：指合作商家透過外送平臺業者提供商品予消費者，外送平臺業者應給予合作商家之款項。\n七、外送服務契約：指外送平臺業者與外送員間有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項之契約。\n八、停權：指外送平臺業者暫時停止發派訂單予外送員提供外送服務等處置；外送平臺業者暫時停止合作商家接收消費者訂單之處置。\n九、報酬：指外送員依外送服務契約提供外送服務期間所獲得之勞務對價，包括基本報酬、各項獎金等。\n十、外送服務：指外送員使用外送平臺業者指定之應用程式，接受由外送平臺業者發派之訂單，前往合作商店家領取商品並交付消費者或運送至指定地點。\n十一、外送服務期間：指自外送員接受外送平臺業者發派之每筆訂單時起，至完成該訂單時止之期間。\n十二、外送員上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。","note":"明定本法相關用詞定義。"},{"bill":"202110168140000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買食品、商品或服務，並提供外送員就消費者購買之食品、商品或服務進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指與外送平台業者簽訂契約提供外送服務之人。\n四、外送服務：指外送員使用外送平台業者指定程式或方式同意開始運送消費者購買之食品、商品或提供服務。\n五、合作商家：指與外送平台業者簽訂契約，使用外送平台指定之應用程式或行動裝置於外送平台提供食品、商品或服務之食品業者或商業經營者。\n六、報酬：指外送員提供外送服務所得之對價。\n七、運費：指消費者透過外送平台訂購食品、商品或服務，除食品、商品或服務之價格外，另行支付之運費或服務費。\n八、貨款：指合作商家提供食品、商品或服務，外送平台業者 台業者與合作商家間，有關食品、商品或服務、貨款給付時間及其他相關權利義務之約定。\n十一、外送服務期間：指外送員於外送平台業者指定程式或裝置上線起至下線止之期間。\n十二、停權：指對於外送員、合作商家暫時停止上線、接收訂單之處置。\n十三、平台業務招攬行為：指外送平台業者要求合作商家以推出折扣、付費行銷、廣告、擴大消費者可訂餐範圍或其他增加曝光率、營收、客源之業務招攬行為。","note":"明定本法相關之用詞定義。"},{"bill":"202110173040000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買食品、商品或服務，並提供外送人員就消費者購買之食品、商品或服務進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送人員：指與外送平台業者簽訂契約提供外送服務之人。\n四、外送服務：指外送人員使用外送平台業者指定程式或方式同意開始運送消費者購買之食品、商品或提供服務。\n五、合作商家：指與外送平台業者簽訂契約，使用外送平台指定之應用程式或行動裝置於外送平台提供食品、商品或服務之食品業者或商業經營者。\n六、報酬：指外送人員提供外送服務所得之對價。\n七、運費：指消費者透過外送平台訂購食品、商品或服務，除食品、商品或服務之價格外，另行支付之運費或服務費。\n八、貨款：指合作商家提供食品、商品或服務，外送平台業者應給與之費用。\n九、外送服務契約：指外送平台業者與外送人員間有關報酬計算方式、食品、商品或服務提供方式、報酬給付時間及其他相關權利義務之約定。\n十、外送合作契約：指外送平台業者與合作商家間，有關食品、商品或服務、貨款給付時間及其他相關權利義務之約定。\n十一、外送服務期間：指外送人員於外送平台業者指定程式或裝置上線起至下線止之期間。\n十二、停權：指對於外送人員、合作商家暫時停止上線、接收訂單之處置。\n十三、平台業務招攬行為：指外送平台業者要求合作商家以推出折扣、付費行銷、廣告、擴大消費者可訂餐範圍或其他增加曝光率、營收、客源之業務招攬行為。","note":"明定本法相關之用詞定義。"},{"bill":"202110173260000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買商品，並提供外送員選擇是否就消費者購買之商品進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指透過外送平台應用程式，前往消費者指定之廠商領取商品，再外送至消費者指定地點，並交予消費者而從事外送服務之人員。\n四、外送服務契約：指外送員提供外送服務，外送平台業者給付報酬，以及就雙方權利義務有關之約定。\n五、接單費：指外送員因履行外送服務契約而獲得之報酬；包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n六、停權處分：外送平台業者停止指派外送員提供外送服務，或其他之不利處分。\n七、外送服務期間：指外送員於外送平台應用程式上線起，至下線之時止之期間。","note":"本法用詞之定義。"},{"bill":"202110173180000","text":"本法用詞定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供消費者購買商品，並將訂單發派予外送員選擇承接及進行外送服務之業者。\n三、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺指定之應用程式或裝置，提供商品予消費者購買之業者。\n四、外送合作契約：指外送平臺業者與合作商家間，有關商品提供、貨款給付及其他相關權利義務之契約。\n五、運費：指平臺貨運業者向消費者及合作商家收取之運送商品費用。\n六、貨款：指合作商家透過外送平臺業者提供商品予消費者，外送平臺業者應給予合作商家之款項。\n七、外送服務契約：指外送平臺業者與外送員間有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項之契約。\n八、停權：指外送平臺業者暫時停止發派訂單予外送員提供外送服務等處置；外送平臺業者暫時停止合作商家接收消費者訂單之處置。\n九、報酬：指外送員依外送服務契約提供外送服務期間所獲得之勞務對價，包括基本報酬、各項獎金等。\n十、外送服務：指外送員使用外送平臺業者指定之應用程式，接受由外送平臺業者發派之訂單，前往合作商家領取商品並交付消費者或運送至指定地點。\n十一、外送服務期間：指自外送員接受外送平臺業者發派之每筆訂單時起，至完成該訂單時止之期間。\n十二、外送員上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。\n十三、演算法：指以電子方式透過機器學習、數據驅動技術而形成可以用於自動監控、監督或評估工作者表現及用於做出對工作或服務條件產生重大影響的自動決策技術系統。\n十四、演算法管理：指外送平臺利用演算法取代傳統人力管理之自動化效率管理及決策模式。","note":"一、本法相關用詞之定義。\n二、關於演算法係參酌歐盟平臺工作指引PWD之規範內容新增演算法及演算法管理之定義。其中演算法主要包含兩大系統：\n(一)自動化監控系統（Automated Monitoring Systems）：指任何透過電子方式，用於監控、監督或評估平臺工作者工作表現的技術系統。\n(二)自動化決策系統（Automated Decision-Making Systems）：指用於做出或支持對工作條件產生重大影響（如任務分配、薪酬、帳戶停權等）的決策的技術系統。"},{"bill":"202110173190000","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供消費者購買商品，並將訂單發派予外送員選擇承接及進行外送服務之業者。\n三、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺指定之應用程式或裝置，提供商品予消費者購買之業者。\n四、外送合作契約：指外送平臺業者與合作商家間，有關商品提供、貨款給付及其他相關權利義務之契約。\n五、運費：指平臺貨運業者向消費者及合作商家收取之運送商品費用。\n六、貨款：指合作商家透過外送平臺業者提供商品予消費者，外送平臺業者應給予合作商家之款項。\n七、外送服務契約：指外送平臺業者與外送員間有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項之契約。\n八、停權：指外送平臺業者暫時停止發派訂單予外送員提供外送服務等處置；外送平臺業者暫時停止合作商家接收消費者訂單之處置。\n九、報酬：指外送員依外送服務契約提供外送服務期間所獲得之勞務對價，包括基本報酬、各項獎金等。\n十、外送服務：指外送員使用外送平臺業者指定之應用程式，接受由外送平臺業者發派之訂單，前往合作商家領取商品並交付消費者或運送至指定地點。\n十一、外送服務期間：指自外送員接受外送平臺業者發派之每筆訂單時起，至完成該訂單時止之期間。\n十二、外送員上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。\n十三、演算法管理：指全部或部分以自動化方式，用於分派或組織工作、監督或評估外送員之工作表現，或蒐集、分析與外送員相關之個人資料，並對外送員之工作條件、報酬、任務分配或契約持續產生實質影響之系統。","note":"明定本法相關用詞定義。"},{"bill":"202110174530000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易，提供消費者購買商品，並提供外送員選擇是否就消費者購買之商品進行外送服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指透過外送平台應用程式，前往消費者指定之廠商領取商品，再外送至消費者指定地點，並交予消費者而從事外送服務之人員。\n四、外送服務契約：指外送員提供外送服務，外送平台業者給付報酬，以及就雙方權利義務有關之約定。\n五、接單費：指外送員因履行外送服務契約而獲得之報酬；包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n六、停權處分：外送平台業者停止指派外送員提供外送服務，或其他之不利處分。\n七、外送服務期間：指外送員於外送平台應用程式上線起，至下線之時止之期間。","note":"本法之用詞之定義。"},{"bill":"202110174470000","text":"本法用詞，定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易媒合，提供消費者購買食品或商品，且由外送員選擇接受消費者訂單並就消費者購買之食品或商品進行送達服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指透過外送平台媒合前往消費者指定之標的廠商領取食品或商品，並送達指定地點完成交付之外送服務從業人員。\n四、合作商家：指與外送平台業者簽訂契約，使用外送平台指定之應用程式或行動裝置於外送平台提供食品或商品之食品業者或商業經營者。\n五、外送服務契約：指外送員提供外送服務，外送平台業者給付報酬，以及就雙方權利義務有關之約定。\n六、外送合作契約：指外送平台業者與合作商家間，有關食品、商品或服務、貨款給付時間及其他相關權利義務之約定。\n七、報酬：指外送員因履行外送服務契約而獲得之對價，包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n八、運費：指消費者透過外送平台訂購食品或商品，除食品或商品價格外，另行支付之運費或服務費。\n九、貨款：指合作商家提供食品或商品，外送平台業者應給與之費用。\n十、停權：外送平台業者停止指派外送員提供外送服務，或其他之不利處分。\n十一、外送服務期間：指外送員於外送平台業者指定程式或裝置上線起至下線止之期間。","note":"明定本法之用詞定義。"},{"bill":"202110174740000","text":"本法用詞，定義如下：\n一、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供消費者購買商品，並將訂單發派予外送員選擇承接及進行外送服務之業者。\n二、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n三、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺業者指定之網站、應用程式或裝置，提供商品或服務予消費者之業者。\n四、外送合作契約：指外送平臺業者與合作商家間，有關商品提供、貨款給付及其他相關權利義務之契約。\n五、運費：指平臺業者向消費者及合作商家收取之運送商品費用。\n六、貨款：指合作商家透過外送平臺業者提供商品予消費者，外送平臺業者應給予合作商家之款項。\n七、外送服務契約：指外送平臺業者與外送員間有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項之契約。\n八、外送消費契約：指消費者外送平臺於外送平臺消費下單，並委託外送平臺業者提供外送服務之契約。\n九、外送合作商家契約：指外送平臺業者與外送合作商家間有關外送商品提供、運費、貨款之計算及給付、申訴制度及其他相關權利義務事項之契約。\n十、停權：指外送平臺業者暫時停止發派訂單予外送員提供外送服務等處置；外送平臺業者暫時停止合作商家接收消費者訂單之處置。\n十一、報酬：指外送員依外送服務契約提供外送服務期間所獲得之勞務對價。包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n十二、外送服務：指外送員使用外送平臺業者指定之應用程式，接受由外送平臺業者發派之訂單，前往合作商家領取商品並交付消費者或運送至指定地點。\n十三、外送服務期間：指自外送員接受外送平臺業者發派之每筆訂單時起，至完成該訂單服務要求為止之期間。\n十四、外送員上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。","note":"一、明定本法中各用詞定義。\n二、本條為定義條款，釐清本法用詞，明確界定「外送平臺業者」、「外送員」、「合作商家」、「外送服務契約」、「外送消費契約」、「外送合作商家契約」等專業名詞，俾利後續條文準確適用，並建立薪資、貨款、運費之計算、契約規範與紀錄保存之共通基礎。"},{"bill":"202110175620000","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供消費者購買商品，並將訂單發派予外送員選擇承接及進行外送服務之業者。\n三、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺指定之應用程式或裝置，提供商品予消費者購買之業者。\n四、外送合作契約：指外送平臺業者與合作商家間，有關商品提供、貨款給付及其他相關權利義務之契約。\n五、運費：指平臺貨運業者向消費者及合作商家收取之運送商品費用。\n六、貨款：指合作商家透過外送平臺業者提供商品予消費者，外送平臺業者應給予合作商家之款項。\n七、外送服務契約：指外送平臺業者與外送員間有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項之契約。\n八、停權：指外送平臺業者暫時停止發派訂單予外送員提供外送服務等處置；外送平臺業者暫時停止合作商家接收消費者訂單之處置。\n九、報酬：指外送員依外送服務契約提供外送服務期間所獲得之勞務對價，包括基本報酬、各項獎金等。\n十、外送服務：指外送員使用外送平臺業者指定之應用程式，接受由外送平臺業者發派之訂單，前往合作商家領取商品並交付消費者或運送至指定地點。\n十一、外送服務期間：指自外送員接受外送平臺業者發派之每筆訂單時起，至完成該訂單時止之期間。\n十二、外送員上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。\n十三、演算法：外送平臺以程式或人工智慧對平臺使用者數據進行監測、控制、評估及決策之自動化模型。","note":"明定本法相關用詞定義。"},{"bill":"202110175920000","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供合作商家販賣商品或消費者購買商品，並將訂單提供外送員承接之業者。\n三、外送服務契約：指外送平臺業者與外送員間，就有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項所成立之契約。\n四、報酬：指外送員依外送服務契約提供外送服務所獲得之勞務對價，包括基本報酬、各項獎金等。\n五、停權：指外送平臺業者對外送員暫時停止提供訂單；外送平臺業者對合作商家暫時停止接收消費者訂單之行為。\n六、外送服務：指外送員透過外送平臺業者指定之應用程式或裝置，接受其所提供之訂單，前往合作商家領取商品並將之交付消費者或運送至消費者指定地點之行為。\n七、外送服務期間：指自外送員接受外送平臺業者提供之每筆訂單時起，至完成該筆訂單時止之期間。\n八、上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。\n九、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺業者指定之應用程式或裝置，提供商品予消費者購買之業者。\n十、外送合作契約：指外送平臺業者與合作商家間，就有關商品提供、貨款給付及其他相關權利義務事項所成立之契約。\n十一、運費：指平臺貨運業者提供運送商品服務向消費者及合作商家所收取之費用。\n十二、貨款：指合作商家透過外送平臺業者提供商品予消費者後，外送平臺業者應給付合作商家之款項。","note":"一、定義本法各用詞，以明確本法之適用。\n二、有關外送員、外送平臺業者之定義，係參考現行各直轄市政府所訂外送平臺業者管理自治條例之立法例及外送平臺產業之運作實務，於第一款及第二款明定。\n三、有關外送服務契約之定義，係參考實務上外送平臺業者與外送員間簽訂之勞務契約內容，於第三款明定有關權利義務事項。\n四、有關報酬之定義，因實務上外送平臺業者提供外送員之整體報酬，除每筆訂單報酬外，尚包含各項獎金，爰為使外送員每筆訂單得有基本報酬之保障，於第四款明定報酬包括基本報酬及各項獎金等，以做明確區分。\n五、有關停權之定義，係參考實務上外送平臺業者為維護其服務品質、消費者體驗，對於外送員違反外送服務契約條款或合作商家違反外送合作契約條款者，採取之不利措施，爰於第五款明定。\n六、有關外送服務、外送服務期間及上線期間等定義，因涉及外送員基本報酬保障之計算及保險期間，爰於第六款至第八款分別明定之。\n七、有關合作商家、外送合作契約及貨款等定義，經參考實務上外送平臺業者與合作商家間之合作方式，爰於第九款、第十款及第十二款明定之。\n八、有關運費之定義，係參考交通部預告修正「汽車運輸業管理規則」第一百零八條之一及「汽車運輸業客貨運運價準則」第八條之一、第八條之二草案，於第十一款明定之。"},{"bill":"202110176760000","text":"本法用詞定義如下：\n一、外送平台：指使用電子商務技術進行網際網路交易媒合，提供消費者購買商品，且由外送員選擇接受消費者訂單並就消費者購買之商品進行送達服務之平台。\n二、外送平台業者：指設置前款平台而營業之廠商。\n三、外送員：指透過外送平台應用程式，前往消費者指定之廠商領取商品，再外送至消費者指定地點，並交予消費者而從事外送服務之人員。\n四、外送服務契約：指外送員使用外送平台業者指定程式或方式同意開始運送消費者購買之食品、商品或提供服務。\n五、接單費：指外送員因履行外送服務契約而獲得之報酬；包括按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之給與均屬之。\n六、停權處分：外送平台業者停止指派外送員提供外送服務，或其他之不利處分。\n七、外送服務期間：指外送員於外送平台應用程式上線起，至下線之時止之期間。","note":"本法相關之用詞定義。"},{"bill":"202110176980000","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供合作商家販賣商品或消費者購買商品，並將訂單提供外送員承接之業者。\n三、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺指定之應用程式或裝置，提供商品予消費者購買之業者。\n四、外送合作契約：指外送平臺業者與合作商家間，就有關商品提供、貨款給付及其他相關權利義務事項所成立之契約。\n五、運費：指平臺貨運業者向消費者及合作商家收取之運送商品費用。\n六、貨款：指合作商家透過外送平臺業者提供商品予消費者，外送平臺業者應給予合作商家之費用。\n七、外送服務契約：指外送平臺業者與外送員間，就有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項所成立之契約。\n八、停權：指外送平臺業者對外送員暫時停止提供訂單；外送平臺業者對合作商家暫時停止接收消費者訂單之行為。\n九、報酬：指外送員依外送服務契約提供外送服務期間所獲得之勞務對價，包括基本報酬、各項獎金等。\n十、外送服務：指外送員透過外送平臺業者指定之應用程式，接受其所提供之訂單，前往合作商家領取商品並交付消費者或運送至指定地點之行為。\n十一、外送服務期間：指自外送員接受外送平臺業者提供之每筆訂單時起，至完成該訂單時止之期間。\n十二、上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。","note":"定義本法之用詞。"},{"bill":"202110177560000","text":"本法用詞定義如下：\n一、外送平臺：指使用電子商務技術進行網際網路交易，提供消費者外送服務之平臺。\n二、外送平臺業者：指設置前款平臺而營業之廠商。\n三、外送員：指與外送平臺業者簽訂契約提供外送服務之人。\n四、外送服務：指外送員使用外送平臺業者指定程式或方式，同意開始運送消費者購買之食品、商品或提供服務。\n五、報酬：指外送員提供外送服務所得之對價。\n六、運費：指消費者透過外送平臺所提供之外送服務，除食品、商品或服務之價格外，另行支付之運費或服務費。\n七、外送服務契約：指外送平臺業者與外送員間有關報酬計算方式、食品、商品或服務提供方式、報酬給付時間及其他相關權利義務之約定。\n八、外送服務期間：指外送員於外送平臺業者指定程式或裝置上線起至下線止之期間。\n九、停權：指外送平臺業者對外送員暫時停止提供訂單之行為。","note":"本法用詞之定義。"},{"bill":"202110177680000","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供合作商家販賣商品或消費者購買商品，並將訂單提供外送員承接之業者。\n三、外送服務契約：指外送平臺業者與外送員間，就有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項所成立之契約。\n四、報酬：指外送員依外送服務契約提供外送服務所獲得之勞務對價，包括基本報酬、各項獎金等。\n五、停權：指外送平臺業者對外送員暫時停止提供訂單；外送平臺業者對合作商家暫時停止接收消費者訂單之行為。\n六、外送服務：指外送員透過外送平臺業者指定之應用程式或裝置，接受其所提供之訂單，前往合作商家領取商品並將之交付消費者或運送至消費者指定地點之行為。\n七、外送服務期間：指自外送員接受外送平臺業者提供之每筆訂單時起，至完成該筆訂單時止之期間。\n八、上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。\n九、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺業者指定之應用程式或裝置，提供商品予消費者購買之業者。\n十、外送合作契約：指外送平臺業者與合作商家間，就有關商品提供、貨款給付及其他相關權利義務事項所成立之契約。\n十一、運費：指平臺貨運業者提供運送商品服務向消費者及合作商家所收取之費用。\n十二、貨款：指合作商家透過外送平臺業者提供商品予消費者後，外送平臺業者應給付合作商家之款項。","note":"一、定義本法各用詞，以明確本法之適用。\n二、有關外送員、外送平臺業者之定義，係參考現行各直轄市政府所訂外送平臺業者管理自治條例之立法例及外送平臺產業之運作實務，於第一款及第二款明定。\n三、有關外送服務契約之定義，係參考實務上外送平臺業者與外送員間簽訂之勞務契約內容，於第三款明定有關權利義務事項。\n四、有關報酬之定義，因實務上外送平臺業者提供外送員之整體報酬，除每筆訂單報酬外，尚包含各項獎金，爰為使外送員每筆訂單得有基本報酬之保障，於第四款明定報酬包括基本報酬及各項獎金等，以做明確區分。\n五、有關停權之定義，係參考實務上外送平臺業者為維護其服務品質、消費者體驗，對於外送員違反外送服務契約條款或合作商家違反外送合作契約條款者，採取之不利措施爰於第五款明定。\n六、有關外送服務、外送服務期間及上線期間等定義，因涉及外送員基本報酬保障之計算及保險期間，爰於第六款至第八款分別明定之。\n七、有關合作商家、外送合作契約及貨款等定義，經參考實務上外送平臺業者與合作商家間之合作方式，爰於第九款、第十款及第十二款明定之。\n八、有關運費之定義，係參考交通部預告修正「汽車運輸業管理規則」第一百零八條之一及「汽車運輸業客貨運運價準則」第八條之一、第八條之二草案，於第十一款明定之。"},{"bill":"202110178160000","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際 、申訴制度及其他相關權利義務事項所成立之契約。\n四、報酬：指外送員依外送服務契約提供外送服務所獲得之勞務對價，包括基本報酬、各項獎金等。\n五、停權：指外送平臺業者對外送員暫時停止提供訂單；外送平臺業者對合作商家暫時停止接收消費者訂單之行為。\n六、外送服務：指外送員透過外送平臺業者指定之應用程式或裝置，接受其所提供之訂單，前往合作商家領取商品並將之交付消費者或運送至消費者指定地點之行為。\n七、外送服務期間：指自外送員接受外送平臺業者提供之每筆訂單時起，至完成該筆訂單時止之期間。\n八、上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。\n九、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺業者指定之應用程式或裝置，提供商品予消費者購買之業者。\n十、外送合作契約：指外送平臺業者與合作商家間，就有關商品提供、貨款給付及其他相關權利義務事項所成立之契約。\n十一、運費：指平臺貨運業者提供運送商品服務向消費者及合作商家所收取之費用。\n十二、貨款：指合作商家透過外送平臺業者提供商品予消費者後，外送平臺業者應給付合作商家之款項。\n十三、每筆訂單：指僅包含一個取件地點以及一個送達地點之訂單。","finalWhy":"一、定義本法各用詞，以明確本法之適用。\n二、有關外送員、外送平臺業者之定義，係參考現行各直轄市政府所訂外送平臺業者管理自治條例之立法例及外送平臺產業之運作實務，於第一款及第二款明定。\n三、有關外送服務契約之定義，係參考實務上外送平臺業者與外送員間簽訂之勞務契約內容，於第三款明定有關權利義務事項。\n四、有關報酬之定義，因實務上外送平臺業者提供外送員之整體報酬，除每筆訂單報酬外，尚包含各項獎金，爰為使外送員每筆訂單得有基本報酬之保障，於第四款明定報酬包括基本報酬及各項獎金等，以做明確區分。\n五、有關停權之定義，係參考實務上外送平臺業者為維護其服務品質、消費者體驗，對於外送員違反外送服務契約條款或合作商家違反外送合作契約條款者，採取之不利措施，爰於第五款明定。\n六、有關外送服務、外送服務期間及上線期間等定義，因涉及外送員基本報酬保障之計算及保險期間，爰於第六款至第八款分別明定之。\n七、有關合作商家、外送合作契約及貨款等定義，經參考實務上外送平臺業者與合作商家間之合作方式，爰於第九款、第十款及第十二款明定之。\n八、有關運費之定義，係參考交通部預告修正「汽車運輸業管理規則」第一百零八條之一及「汽車運輸業客貨運運價準則」第八條之一、第八條之二草案，於第十一款明定之。\n九、有關每筆訂單之定義，因實務上外送平臺業者均有採取夾單、疊單或其他不同方式提供外送員訂單，為明確第五條所定基本報酬之計算，爰於第十三款明定之。","review":{"note":"修正通過","text":"本法用詞，定義如下：\n一、外送員：指與外送平臺業者成立外送服務契約之從業人員。\n二、外送平臺業者：指經營使用電子商務技術進行網際網路交易之平臺，提供合作商家販賣商品或消費者購買商品，並將訂單提供外送員承接之業者。\n三、外送服務契約：指外送平臺業者與外送員間，就有關外送服務提供、報酬計算及給付、停權規範、申訴制度及其他相關權利義務事項所成立之契約。\n四、報酬：指外送員依外送服務契約提供外送服務所獲得之勞務對價，包括基本報酬、各項獎金等。\n五、停權：指外送平臺業者對外送員暫時停止提供訂單；外送平臺業者對合作商家暫時停止接收消費者訂單之行為。\n六、外送服務：指外送員透過外送平臺業者指定之應用程式或裝置，接受其所提供之訂單，前往合作商家領取商品並將之交付消費者或運送至消費者指定地點之行為。\n七、外送服務期間：指自外送員接受外送平臺業者提供之每筆訂單時起，至完成該筆訂單時止之期間。\n八、上線期間：指外送員於外送平臺業者指定之應用程式或裝置上線時起，至下線時止之期間。\n九、合作商家：指與外送平臺業者成立外送合作契約，使用外送平臺業者指定之應用程式或裝置，提供商品予消費者購買之業者。\n十、外送合作契約：指外送平臺業者與合作商家間，就有關商品提供、貨款給付及其他相關權利義務事項所成立之契約。\n十一、運費：指平臺貨運業者提供運送商品服務向消費者及合作商家所收取之費用。\n十二、貨款：指合作商家透過外送平臺業者提供商品予消費者後，外送平臺業者應給付合作商家之款項。\n十三、每筆訂單：指僅包含一個取件地點以及一個送達地點之訂單。"}},{"no":"第四條","current":null,"versions":[{"bill":"202110017580000","text":"中央主管機關應定期邀集外送平台業者、消費者保護官、消費者保護團體、學者專家、合作商家或餐飲業者及有關工會就本法有關之法規及執行情形檢討、協調及改進之。","note":"本法係因新經濟型態所訂，為確實了解產業狀況並掌握實務動態，自應定期檢討、協調及改進，以符合需求。"},{"bill":"202110060450000","text":"中央主管機關應定期邀集外送平台業者、消費者保護官、消費者保護團體、專家學者、合作商家或餐飲業者及相關工會就本法之法規及執行情形檢討、協調及改進之。","note":"因應數位平台的新型態經濟模式，為確實了解產業狀況並掌握實務動態，自應定期檢討、協調及改進，以符合需求，特制定本條。"},{"bill":"202110060680000","text":"外送平台業者與外送員成立外送服務契約後，應於七日內提供契約之書面或電磁紀錄予外送員收執。\n接單費之標準、計算方法及發放日期，由外送平台業同業公會暨相關之工會共同擬訂，報請主管機關核定，非經核准，不得調整。\n前項接單費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n為保障外送員權益，中央主管機關應會同目的事業主管機關，就接單費以外之排班、請假、獎懲、終止契約及其他重要權利義務，擬訂外送服務契約範本，報請行政院核定後公告之。","note":"一、為維護外送員權益，外送平台業者與外送員成立契約時，應提供外送員書面契約或電磁紀錄。\n二、因應現行接單費之組成與服務條款多由外送平台業者單方決定，外送員僅得選擇接受與否，實難以期待外送員在社會經濟地位上具有與外送平台業者協商之能力，爰參照汽車運輸業之客、貨運運價訂定方法，於第二項明定接單費之標準、計算方法及發放日期應由外送平台業同業公會暨相關之工會共同擬訂，報請主管機關核定，非經核准，不得調整。\n三、第三項明定接單費之組成內涵，為維持外送員之基本保障，其中基本費不得低於基本工資之三分之一。\n四、為保障外送員權益，第四項課予中央主管機關為應會同目的事業主管機關，就接單費、排班、請假、獎懲、終止契約及其他重要權利義務，擬訂外送服務契約範本，俾利相關參與者遵循。"},{"bill":"202110060360000","text":"外送平台業者與外送員成立外送服務契約後，應於七日內提供契約之書面或電磁紀錄予外送員收執。\n接單費之標準、計算方法及發放日期，由外送平台業同業公會暨相關之工會共同擬訂，報請主管機關核定，非經核准，不得調整。\n前項接單費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n為保障外送員權益，中央主管機關應會同目的事業主管機關，就接單費以外之排班、請假、獎懲、終止契約及其他重要權利義務，擬訂外送服務契約範本，報請行政院核定後公告之。","note":"一、為維護外送員權益，外送平台業者與外送員成立契約時，應提供外送員書面契約或電磁紀錄。\n二、因應現行接單費之組成與服務條款多由外送平台業者單方決定，外送員僅得選擇接受與否，實難以期待外送員在社會經濟地位上具有與外送平台業者協商之能力，爰參照汽車運輸業之客、貨運運價訂定方法，於第二項明定接單費之標準、計算方法及發放日期應由外送平台業同業公會暨相關之工會共同擬訂，報請主管機關核定，非經核准，不得調整。\n三、第三項明定接單費之組成內涵，為維持外送員之基本保障，其中基本費不得低於基本工資之三分之一。\n四、為保障外送員權益，第四項課予中央主管機關為應會同目的事業主管機關，就接單費、排班、請假、獎懲、終止契約及其他重要權利義務，擬訂外送服務契約範本，俾利相關參與者遵循。"},{"bill":"202110075210000","text":"外送平台業者與外送員成立外送服務契約後，應於七日內提供契約之書面或電磁紀錄予外送員收執。\n接單費之標準、計算方法及發放日期，由外送平台業同業公會暨相關之工會共同擬訂，報請主管機關核定，非經核准，不得調整。\n前項接單費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n為保障外送員權益，中央主管機關應會同目的事業主管機關，就接單費以外之排班、請假、獎懲、終止契約及其他重要權利義務，擬訂外送服務契約範本，報請行政院核定後公告之。","note":"一、為維護外送員權益，外送平台業者與外送員成立契約時，應提供外送員書面契約或電磁紀錄。\n二、因應現行接單費之組成與服務條款多由外送平台業者單方決定，外送員僅得選擇接受與否，實難以期待外送員在社會經濟地位上具有與外送平台業者協商之能力，爰參照汽車運輸業之客、貨運運價訂定方法，於第二項明定接單費之標準、計算方法及發放日期應由外送平台業同業公會暨相關之工會共同擬訂，報請主管機關核定，非經核准，不得調整。\n三、第三項明定接單費之組成內涵，為維持外送員之基本保障，其中基本 請假、獎懲、契約終止及其他重大權利義務事項，擬訂「外送服務契約範本」，以作為各外送平台訂定契約之依據，俾利相關參與者遵循並確保制度一致性。"},{"bill":"202110168240000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。","note":"為保障消費者權益，明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約範本並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110169580000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。","note":"為保障消費者權益，明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約範本並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110170380000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。","note":"為保障消費者權益，明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約範本並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110171160000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。","note":"為保障消費者權益，明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約範本並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110170780000","text":"中央主管機關應定期邀集外送平台業者、消費者保護官、消費者保護團體、學者專家、合作商家或餐飲業者及有關工會就本法有關之法規及執行情形檢討、協調及改進之。","note":"本法係因新經濟型態所訂，為確實了解產業狀況並掌握實務動態，自應定期檢討、協調及改進，以符合需求。"},{"bill":"202110173040000","text":"中央主管機關應定期邀集外送平台業者、消費者保護官、消費者保護團體、學者專家、合作商家或餐飲業者及有關工會就本法有關之法規及執行情形檢討、協調及改進之。","note":"本法係因應新經濟型態所訂，為確實了解產業狀況並掌握實務動態，應定期檢討、協調及改進，以符合實務需求。"},{"bill":"202110173260000","text":"外送平台業者與外送員成立外送服務契約後，應於七日內提供契約之書面或電磁紀錄予外送員收執。\n接單費之標準、計算方法及發放日期，由外送平台業同業公會暨相關之工會共同擬訂，報請主管機關核定，非經核准，不得調整。\n前項接單費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n為保障外送員權益，中央主管機關應會同目的事業主管機關，就接單費以外之排班、請假、獎懲、終止契約及其他重要權利義務，擬訂外送服務契約範本，報請行政院核定後公告之。","note":"一、第一項明定外送平台業者與外送員成立契約時，應提供外送員書面契約或電磁紀錄。使外送員得以明確瞭解其權利義務內容，確保契約關係之透明與可稽核性。\n二、第二項明定接單費之標準、計算方法及發放日期，應由外送平台業同業公會及相關工會共同擬訂，報請中央主管機關核定後實施，非經核准，不得擅自調整。\n三、第三項明定接單費之組成內涵，確保外送員基本收入及生活保障，其中基本費不得低於基本工資之三分之一，維護外送勞動市場之公平。\n四、第四項明定中央主管機關應會同目的事業主管機關，就接單費、排班、請假、獎懲、契約終止及其他重大權利義務事項，擬訂「外送服務契約範本」，以作為各外送平台訂定契約之依據，俾利相關參與者遵循並確保制度一致性。"},{"bill":"202110173180000","text":"外送平臺業者應於平臺介面上，清楚揭示下列事項，確保消費者交易資訊透明：\n一、商品價格、服務費及運費等金額明細。\n二、消費者下單時，應明確顯示取餐地點與配送地點之距離或預估配送里程，供消費者參考。\n三、消費者取消訂單時之退費條件與處理程序。\n四、外送平臺業者得取消訂單之情形及其退費機制。\n五、商品若有遲延交付、品項或數量與訂單不符、或發生損壞時之處理流程、收退費標準及補償方式。\n交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。","note":"一、為保障消費者權益，明定外送平臺業者應確保消費交易程序及資訊之透明以利消費者能清楚知悉相關交易重要資訊及糾紛處理程序與管道。\n二、另為加強保障消費者權益，爰明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約範本並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110173190000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。","note":"為保障消費者權益，明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約範本並報請行政院核定後公告之，供外送平臺業者遵循。"},{"bill":"202110174530000","text":"外送平台業者與外送員成立外送服務契約後，應於七日內提供契約之書面或電磁紀錄予外送員收執。\n接單費之標準、計算方法及發放日期，由外送平台業同業公會暨相關之工會共同擬訂，報請主管機關核定，非經核准，不得調整。中央主管機關核定接單費率前應審酌相關法規、地理區域、地區偏遠程度、外送距離、路況難易度及相關營運成本，核定差別化之外送服務基本運價。\n前項接單費應至少包含基本費、里程費、等待費、樓層費等費用；其中基本費不得低於基本工資之三分之一。\n為保障外送員權益，中央主管機關應會同目的事業主管機關，就接單費以外之排班、請假、獎懲、終止契約及其他重要權利義務，擬訂外送服務契約範本，報請中央主管機關核定後公告之。","note":"一、第一項明定外送平台業者與外送員成立契約時，應提供外送員書面契約或電磁紀錄。使外送員得以明確瞭解其權利義務內容，確保契約關係之透明與可稽核性。\n二、第二項明定接單費之標準、計算方法及發放日期，應由外送平台業同業公會及相關工會共同擬訂，報請中央主管機關核定後實施，非經核准，不得擅自調整。\n三、第三項明定接單費之組成內涵，確保外送員基本收入及生活保障，其中基本費不得低於基本工資之三分之一，維護外送勞動市場之公平。\n四、第四項明定中央主管機關應會同目的事業主管機關，就接單費、排班、請假、獎懲、契約終止及其他重大權利義務事項，擬訂「外送服務契約範本」，以作為各外送平台訂定契約之依據，俾利相關參與者遵循並確保制度一致性。"},{"bill":"202110174470000","text":"中央主管機關應會同中央目的事業主管機關，對於外送平台業者與外送員、合作商家、消費者間重要權利義務事項，擬定契約範本，報請行政院核定後公告之。","note":"外送平台業者對於外送員、合作商家及消費者，通常以定型化契約約定雙方權利義務，考量外送平台業者常具有契約優勢與容易造成資訊不對等，為保障外送員、合作商家及消費者權益，爰規定中央主管機關應會同中央目的事業主管機關就重要權利義務事項擬定契約範本並公告。"},{"bill":"202110174740000","text":"中央主管機關應就外送平臺業者與外送員間成立之外送服務契約之重要權利義務事項，訂定定型化契約應記載及不得記載事項，並予公告。\n前項定型化契約應記載及不得記載事項，應包括下列事項：\n一、停權規定。\n二、終止契約規定。\n三、申訴處理機制。\n四、報酬明細及計薪方式。\n五、教育訓練。\n六、商業保險。\n七、外送服務基本流程。\n八、提供專人服務聯絡方式。\n九、其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立之外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，其違反部分無效；該公告之應記載事項，縱未記載於契約中，仍視為契約之一部分。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意，並報主管機關備查；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後三日內，提供書面或電子契約予外送員收執，契約有變更或增補時，亦同。","note":"本條規範外送平臺業者與外送員之契約應採定型化契約，並由中央主管機關公告應記載及不得記載事項，以防止平臺利用契約條款不當限制外送員權益。另規定契約變更需經外送員同意並報主管機關備查，強化資訊透明與勞動保障。"},{"bill":"202110175620000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。","note":"為保障消費者權益及建立外送平臺業者與消費者間權利義務關係，爰明定交通主管機關應依消費者保護法第十八條規定擬訂定型化契約範本，並報請行政院核定後公告之。"},{"bill":"202110175920000","text":"中央主管機關應就外送平臺業者與外送員成立外送服務契約之重要權利義務事項，擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括報酬計算與給付方式、停權、終止外送服務契約、申訴制度、保險、外送服務基本流程、專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意，且不得以不利對待方式，使外送員同意變更或增補之。未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為衡平外送平臺業者與外送員於締約上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項。\n二、為明確外送平臺業者及外送員間權利義務，於第二項明定定型化契約應記載及不得記載事項應包括之重要權利義務事項，以保障外送員勞動權益。\n三、復為確保外送平臺業者與外送員成立之外送服務契約確實遵守定型化契約應記載及不得記載事項之規定，於第三項明定，契約內容有違反前述規定之條款無效，且未記載於契約之事項，仍構成契約內容。\n四、另為避免外送平臺業者未經外送員同意，即片面變更外送服務契約內容或增補第二項有關外送員重要權利義務事項，爰於第四項明定外送平臺業者不得以限制外送員上線或接單之權利、減少提供訂單數量、停權或終止契約等直接或間接之不利對待方式，使外送員同意變更或增補外送服務契約之內容；且如外送平臺業者片面通知變更者，亦不生效力。\n五、為使外送員得隨時查閱外送服務契約內容，清楚知悉其與外送平臺業者間之權利義務事項，於第五項明定業者應於外送服務契約成立後七日內提供書面或電子契約予外送員收執。"},{"bill":"202110176760000","text":"中央主管機關應定期邀集外送平台業者、消費者保護官、消費者保護團體、專家學者、合作商家或餐飲業者及相關工會就本法之法規及執行情形檢討、協調及改進之。","note":"因應數位平台的新型態經濟模式，為確實了解產業狀況並掌握實務動態，自應定期檢討、協調及改進，以符合需求，特制定本條。"},{"bill":"202110176980000","text":"中央主管機關應就外送平臺業者與外送員成立外送服務契約之重要權利義務事項，擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括報酬計算與給付方式、停權、終止外送服務契約、申訴制度、保險、外送服務基本流程、提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意，且不得以不利對待方式，使外送員同意變更或增補之。未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、授權中央主管機關訂定外送服務定型化契約之應記載與不得記載事項，以確保外送員與平臺間契約內容公平、合理。\n二、明確規範違反定型化契約之法律效果，以及外送平臺業者應於七日內提供契約予外送員留存，以維護其知情與契約審閱權。"},{"bill":"202110177560000","text":"中央主管機關應定期邀集外送平臺業者、學者專家及有關工會或團體，就本法有關之法規及執行情形檢討、協調及改進之。","note":"因本法係為處理此種以平臺為主體之經濟型態，此種介於僱傭與承攬間「指揮監督關係」之強弱難以區分，對於平臺業者及外送員之權利義務亦非一蹴可幾，故為求掌握實務動態，自應定期檢討、協調及改進，以符合需求。"},{"bill":"202110177680000","text":"中央主管機關應就外送平臺業者與外送員成立外送服務契約之重要權利義務事項，擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括報酬計算與給付方式、停權、終止外送服務契約、申訴制度、保險、外送服務基本流程、專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效。該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意，且不得以不利對待方式，使外送員同意變更或增補之。未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為衡平外送平臺業者與外送員於締約上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項。\n二、為明確外送平臺業者及外送員間權利義務，於第二項明定定型化契約應記載及不得記載事項應包括之重要權利義務事項，以保障外送員勞動權益。\n三、復為確保外送平臺業者與外送員成立之外送服務契約確實遵守定型化契約應記載及不得記載事項之規定，於第三項明定，契約內容有違反前述規定之條款無效，且未記載於契約之事項，仍構成契約內容。\n四、另為避免外送平臺業者未經外送員同意，即片面變更外送服務契約內容或增補第二項有關外送員重要權利義務事項，爰於第四項明定外送平臺業者不得以限制外送員上線或接單之權利、減少提供訂單數量、停權或終止契約等直接或間接之不利對待方式，使外送員同意變更或增補外送服務契約之內容；且如外送平臺業者片面通知變更者，亦不生效力。\n五、為使外送員得隨時查閱外送服務契約內容，清楚知悉其與外送平臺業者間之權利義務事項，於第五項明定業者應於外送服務契約成立後七日內提供書面電子契約予外送員收執。"},{"bill":"202110178160000","text":"中央主管機關應就外送平臺業者與外送員成立外送服務契約之重要權利義務事項，擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括報酬計算與給付方式、停權、終止外送服務契約、申訴制度、保險、外送服務基本流程、專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意，且不得以不利對待方式，使外送員同意變更或增補之。未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為衡平外送平臺業者與外送員於締約上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項。\n二、為明確外送平臺業者及外送員間權利義務，於第二項明定定型化契約應記載及不得記載事項應包括之重要權利義務事項，以保障外送員勞動權益。\n三、復為確保外送平臺業者與外送員成立之外送服務契約確實遵守定型化契約應記載及不得記載事項之規定，於第三項明定，契約內容有違反前述規定之條款無效，且未記載於契約之事項，仍構成契約內容。\n四、另為避免外送平臺業者未經外送員同意，即片面變更外送服務契約內容或增補第二項有關外送員重要權利義務事項，爰於第四項明定外送平臺業者不得以限制外送員上線或接單之權利、減少提供訂單數量、停權或終止契約等直接或間接之不利對待方式，使外送員同意變更或增補外送服務契約之內容；且如外送平臺業者片面通知變更者，亦不生效力。\n五、為使外送員得隨時查閱外送服務契約內容，清楚知悉其與外送平臺業者間之權利義務事項，於第五項明定業者應於外送服務契約成立後七日內提供書面或電子契約予外送員收執。"},{"bill":"202110181420000","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。","note":"為保障消費者權益，明定交通主管機關應依消費者保護法第十七條規定擬訂定型化契約範本並報請行政院核定後公告之，供外送平臺業者遵循。"}],"changed":true,"final":"中央主管機關應就外送平臺業者與外送員成立外送服務契約之重要權利義務事項，擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括報酬計算與給付方式、停權、終止外送服務契約、申訴制度、保險、外送服務基本流程、專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意，且不得以不利對待方式，使外送員同意變更或增補之。未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","finalWhy":"一、為衡平外送平臺業者與外送員於締約上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項。\n二、為明確外送平臺業者及外送員間權利義務，於第二項明定定型化契約應記載及不得記載事項應包括之重要權利義務事項，以保障外送員勞動權益。\n三、復為確保外送平臺業者與外送員成立之外送服務契約確實遵守定型化契約應記載及不得記載事項之規定，於第三項明定，契約內容有違反前述規定之條款無效，且未記載於契約之事項，仍構成契約內容。\n四、另為避免外送平臺業者未經外送員同意，即片面變更外送服務契約內容或增補第二項有關外送員重要權利義務事項，爰於第四項明定外送平臺業者不得以限制外送員上線或接單之權利、減少提供訂單數量、停權或終止契約等直接或間接之不利對待方式，使外送員同意變更或增補外送服務契約之內容；且如外送平臺業者片面通知變更者，亦不生效力。\n五、為使外送員得隨時查閱外送服務契約內容，清楚知悉其與外送平臺業者間之權利義務事項，於第五項明定業者應於外送服務契約成立後七日內提供書面或電子契約予外送員收執。","review":{"note":"照委員劉建國等16人提案通過","text":"交通主管機關對於外送平臺業者與消費者間重要權利義務事項，應依消費者保護法擬訂其定型化契約應記載及不得記載事項，報請行政院核定後公告之。"}},{"no":"第五條","current":null,"versions":[{"bill":"202110017580000","text":"中央主管機關應會同中央目的事業主管機關，對於外送平台業者與外送員、合作商家、消費者間重要權利義務事項，擬定契約範本，報請行政院核定後公告之。","note":"觀察外送產業實際情形，外送平台業者對於外送員、合作商家及消費者，通常以定型化契約約定雙方權利義務，考量數位經濟型態下，外送平台業者具有絕對優勢（包含但不限於資訊、訂價等），為保障外送員、合作商家及消費者權益，並兼顧食品衛生安全、交通安全，規定中央主管機關應會同中央目的事業主管機關就重要權利義務事項擬定契約範本。"},{"bill":"202110060450000","text":"中央主管機關應會同中央目的事業主管機關，對於外送平台業者與外送員、合作商家、消費者間重要權利義務事項，擬定契約範本，報請行政院核定後公告之。","note":"外送平台業者對於外送員、合作商家及消費者，通常以定型化契約約定雙方權利義務，考量數位經濟型態下，外送平台業者具有絕對優勢，為保障外送員、合作商家及消費者權益，並兼顧食品安全衛生、交通安全等事項，規定中央主管機關應會同中央目的事業主管機關就重要權利義務事項擬定契約範本。"},{"bill":"202110060680000","text":"以下各款電磁紀錄，外送平台業者至少應保存一年，供有關機關調閱：\n一、消費者訂購商品之時間及內容。\n二、廠商接受訂單之時間及內容。\n三、外送員提供外送服務之時間、地點及內容。\n四、消費者之付款紀錄。\n五、消費者與客服人員之對話紀錄。","note":"一、參考臺北市外送平台業者管理自治條例第十條，明定外送平台業者就本條各款電磁紀錄負保存義務，以備供有關機關調閱，俾利行政監督。\n二、另參考臺北市政府外送平台業者輔導要點第十點，課予外送平台業者留存客服人員與消費者之投訴相關對話紀錄，以保障消費者權益。"},{"bill":"202110060360000","text":"以下各款電磁紀錄，外送平台業者至少應保存一年，供有關機關調閱：\n一、消費者訂購商品之時間及內容。\n二、廠商接受訂單之時間及內容。\n三、外送員提供外送服務之時間、地點及內容。\n四、消費者之付款紀錄。\n五、消費者與客服人員之對話紀錄。","note":"一、參考臺北市外送平台業者管理自治條例第十條，明定外送平台業者就本條各款電磁紀錄負保存義務，以備供有關機關調閱，俾利行政監督。\n二、另參考臺北市政府外送平台業者輔導要點第十點，課予外送平台業者留存客服人員與消費者之投訴相關對話紀錄，以保障消費者權益。"},{"bill":"202110075210000","text":"以下各款電磁紀錄，外送平台業者至少應保存一年，供有關機關調閱：\n一、消費者訂購商品之時間及內容。\n二、廠商接受訂單之時間及內容。\n三、外送員提供外送服務之時間、地點及內容。\n四、消費者之付款紀錄。\n五、消費者與客服人員之對話紀錄。","note":"一、參考臺北市外送平台業者管理自治條例第十條，明定外送平台業者就本條各款電磁紀錄負保存義務，以備供有關機關調閱，俾利行政監督。\n二、另參考臺北市政府外送平台業者輔導要點第十點，課予外送平台業者留存客服人員與消費者之投訴相關對話紀錄，以保障消費者權益。"},{"bill":"202110099010000","text":"中央主管機關應會同中央目的事業主管機關，對於外送平台業者與外送員、合作商家、消費者間重要權利義務事項，擬定契約範本，報請行政院核定後公告之。","note":"觀察外送產業實際情形，外送平台業者對於外送員、合作商家及消費者，通常以定型化契約約定雙方權利義務，考量數位經濟型態下，外送平台業者具有絕對優勢（包含但不限於資訊、訂價等），為保障外送員、合作商家及消費者權益，兼顧食品衛生安全、交通安全，規定中央主管機關應會同中央目的事業主管機關就重要權利義務事項擬定契約範本。"},{"bill":"202110167670000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、查外送平臺業者對於合作商家，常以定型化契約約定雙方權利義務。\n二、為平衡外送平臺產業及合作商家於締約、議價上之地位，授權經濟主管機關擬訂契約範本，供外送平臺業者遵循，並得會商有關主管機關，如交通主管機關、衛生主管機關、數位主管機關及金融主管機關等有關機關，以臻周全。\n三、另於第三項明定外送平臺業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110167840000","text":"以下各款電磁紀錄，外送平台業者至少應保存一年，供有關機關調閱：\n一、消費者訂購商品之時間及內容。\n二、廠商接受訂單之時間及內容。\n三、外送員提供外送服務之時間、地點及內容。\n四、消費者之付款紀錄。","note":"參考臺中市外送平台業者管理自治條例第十二條，明定外送平台業者就本條各款電磁紀錄負保存義務，以備供有關機關調閱，俾利行政監督。"},{"bill":"202110168030000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、查外送平臺業者對於合作商家，常以定型化契約約定雙方權利義務。\n二、為平衡外送平臺產業及合作商家於締約、議價上之地位，授權經濟主管機關擬訂契約範本，供外送平臺業者遵循，並得會商有關主管機關，如交通主管機關、衛生主管機關、數位主管機關及金融主管機關等有關機關，以臻周全。\n三、另於第三項明定業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110168140000","text":"中央主管機關應會同中央目的事業主管機關，對於外送平台業者與外送員、合作商家、消費者間重要權利義務事項，擬定契約範本，報請行政院核定後公告之。","note":"觀察外送產業實際情形，外送平台業者對於外送員、合作商家及消費者，通常以定型化契約約定雙方權利義務，考量數位經濟型態下，外送平台業者具有絕對優勢（包含但不限於資訊、訂價等），為保障外送員、合作商家及消費者權益，並兼顧食品衛生安全、交通安全，規定中央主管機關應會同中央目的事業主管機關就重要權利義務事項擬定契約範本。"},{"bill":"202110168230000","text":"以下各款電磁紀錄，外送平台業者至少應保存一年，供有關機關調閱：\n一、消費者訂購商品之時間及內容。\n二、廠商接受訂單之時間及內容。\n三、外送員提供外送服務之時間、地點及內容。\n四、消費者之付款紀錄。\n五、消費者與客服人員之對話紀錄。","note":"明定外送平台業者就本條各款電磁紀錄負保存義務，以備供有關機關調閱，保障消費者權益，俾利行政監督。"},{"bill":"202110168240000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、查外送平臺業者對於合作商家，常以定型化契約約定雙方權利義務。\n二、為平衡外送平臺產業及合作商家於締約、議價上之地位，授權經濟主管機關擬訂契約範本，供外送平臺業者遵循，並得會商有關主管機關，如交通主管機關、衛生主管機關、數位主管機關及金融主管機關等有關機關，以臻周全。\n三、另於第三項明定外送平臺業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110169580000","text":"經濟主管機關應擬訂外送平臺業者與合作商家外送合作契約之範本，並公告之。\n前項契約範本，應包括商品與價格、運費收取、貨款給付、爭議處理機制、食品安全及其他合作商家權益相關事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"為平衡外送平臺與合作商家議約地位，授權經濟主管機關訂定契約範本，明定契約主要內容，並要求業者於七日內提供書面或電子契約，確保資訊透明與權益保障。"},{"bill":"202110170380000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、查外送平臺業者對於合作商家，常以定型化契約約定雙方權利義務。\n二、為平衡外送平臺產業及合作商家於締約、議價上之地位，授權經濟主管機關擬訂契約範本，供外送平臺業者遵循，並得會商有關主管機關，如交通主管機關、衛生主管機關、數位主管機關及金融主管機關等有關機關，以臻周全。\n三、另於第三項明定外送平臺業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110171160000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、查外送平臺業者對於合作商家，常以定型化契約約定雙方權利義務。\n二、為平衡外送平臺產業及合作商家於締約、議價上之地位，授權經濟主管機關擬訂契約範本，供外送平臺業者遵循，並得會商有關主管機關，如交通主管機關、衛生主管機關、數位主管機關及金融主管機關等有關機關，以臻周全。\n三、另於第三項明定外送平臺業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110170780000","text":"中央主管機關應會同中央目的事業主管機關，對於外送平台業者與外送員、合作商家、消費者間重要權利義務事項，擬定契約範本，報請行政院核定後公告之。","note":"觀察外送產業實際情形，外送平台業者對於外送員、合作商家及消費者，通常以定型化契約約定雙方權利義務，考量數位經濟型態下，外送平台業者具有絕對優勢（包含但不限於資訊、訂價等），為保障外送員、合作商家及消費者權益，並兼顧食品衛生安全、交通安全，規定中央主管機關應會同中央目的事業主管機關就重要權利義務事項擬定契約範本。"},{"bill":"202110173040000","text":"中央主管機關應會同中央目的事業主管機關，對於外送平台業者與外送人員、合作商家、消費者間重要權利義務事項，擬定契約範本，報請行政院核定後公告之。","note":"觀察外送產業實際情形，外送平台業者對於外送人員、合作商家及消費者，通常以定型化契約約定權利義務，目前實務上，外送平台業者具有絕對優勢（包含但不限於資訊、訂價等），為保障外送人員、合作商家及消費者權益，並兼顧食品衛生安全、交通安全，規定中央主管機關應會同中央目的事業主管機關就重要權利義務事項擬定契約範本。"},{"bill":"202110173260000","text":"以下各款電磁紀錄，外送平台業者至少應保存一年，供有關機關調閱：\n一、消費者訂購商品之時間及內容。\n二、廠商接受訂單之時間及內容。\n三、外送員提供外送服務之時間、地點及內容。\n四、消費者之付款紀錄。","note":"明定外送平台業者就本條各款電磁紀錄負保存義務，以備供有關機關調閱，保障消費者權益，俾利行政監督。"},{"bill":"202110173180000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、查外送平臺業者對於合作商家，常以定型化契約約定雙方權利義務。\n二、為平衡外送平臺產業及合作商家於締約、議價上之地位，授權經濟主管機關擬訂契約範本，供外送平臺業者遵循，並得會商有關主管機關，如交通主管機關、衛生主管機關、數位主管機關及金融主管機關等有關機關，以臻周全。\n三、另於第三項明定外送平臺業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110173190000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、查外送平臺業者對於合作商家，常以定型化契約約定雙方權利義務。\n二、為平衡外送平臺產業及合作商家於締約、議價上之地位，授權經濟主管機關擬訂契約範本，供外送平臺業者遵循，並得會商有關主管機關，如交通主管機關、衛生主管機關、數位主管機關及金融主管機關等有關機關，以臻周全。\n三、另於第三項明定外送平臺業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110174530000","text":"以下各款電磁紀錄，外送平台業者至少應保存三年，供有關機關調閱：\n一、消費者訂購商品之時間及內容。\n二、廠商接受訂單之時間及內容。\n三、外送員提供外送服務之時間、地點及內容。\n四、消費者之付款紀錄。\n五、消費者與客服人員之對話紀錄。\n六、外送員報酬清冊。\n七、終止契約或其他方式對外送員為不利之決定。","note":"明定外送平台業者就本條各款電磁紀錄負保存義務，以備供有關機關調閱，保障消費者權益，俾利行政監督。且由於部分偏遠地區外送員可能因地理位置或資訊傳遞較慢，一旦面臨契約爭議、報酬不透明或停權等不利決定時，需蒐集證據和提起申訴的時間較長。因此，應適度增加平台對其重要紀錄（如契約、報酬清冊、不利決定紀錄）之保存期限，以確保外送員有更充裕之追溯與救濟時間。"},{"bill":"202110174470000","text":"中央主管機關應會同中央目的事業主管機關，對於外送員資格、外送服務期間有關食品安全、交通安全之設備或工具，訂定外送安全衛生服務標準。","note":"有鑒於外送平台之外送員其工作型態與傳統商家自行招聘之外送行業略有不同，為保障消費者食品安全與外送員人身安全，中央主管機關應會同中央目的事業主管機關對於外送員之資格條件、應具備之食品安全知識及外送交通工具、設備等，訂定外送安全服務標準。"},{"bill":"202110174740000","text":"經濟主管機關應就外送平臺業者與合作商家及消費者間成立契約之重要權利義務事項，擬訂契約範本，並予公告。\n外送平臺業者與消費者間之外送消費契約之範本，應依消費者保護法之規定訂定為定型化契約，並報請行政院公告。\n第一項外送平臺業者與合作商家之外送合作商家契約範本，應包括下列事項：\n一、商品提供及價格。\n二、運費收取方式及標準。\n三、貨款給付及方式。\n四、爭議處理機制。\n五、食品安全事項。\n六、其他有關合作商家權益之事項。\n外送平臺業者應於契約成立後七日內，提供書面或電子契約予所合作商家收執。","note":"本條授權經濟主管機關擬訂外送平臺與合作商家及消費者之契約範本，以維護商業合作與消費交易公平。並要求平臺業者於契約成立後提供書面或電子契約，確保商家知悉權利義務，預防平臺壟斷或不合理抽成費用爭議。"},{"bill":"202110175620000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"本條明定經濟主管機關應擬定契約範本，供外送平臺業者與合作商家參考，另外送平臺業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視並確認契約內容，以避免爭議。"},{"bill":"202110175920000","text":"交通主管機關應依公路法規核定基本運價，外送平臺業者應提供運價成本相關資料供交通主管機關審訂。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所計算之運費，且每筆訂單外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資之一點二五倍。\n外送平臺業者給付外送員報酬，應全額直接給付。但法令另有規定或雙方另有約定者，不在此限。\n外送平臺業者給付外送員報酬，每月至少定期發給二次，並應提供載明下列事項之報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、有鑑於消費者之運費計算方式，係由外送平臺業者單方決定，消費者無從得知該筆訂單之運費如何被決定，例如訂購相同合作商家商品所需運費卻不相同。爰為將外送平臺使機車運送商品之運費透明化，於第一項明定運費透明化之處理機制，由交通主管機關為依公路法規核定基本運價。\n二、復因外送員之報酬計算方式，亦為外送平臺業者單方決定，外送員僅得被動選擇是否接受，且外送平臺業者並未清楚揭露報酬結構及計算方式，使外送員難以核對外送平臺業者發給報酬數額之正確性，且外送員長期反映外送平臺提供消費者及合作商家之商品運送服務，係由外送員提供勞務並負擔運送成本，故消費者與合作商家享受運送服務所負擔之運費，其性質應等同於外送員報酬，爰於第二項明定每筆訂單之基本報酬，不得低於依第一項基本運價所計算之運費，使每筆訂單基本報酬與交通部核定之運費連動；同時考量前開運費係採運送距離為主要計價方式，惟外送員完成訂單可能因運送至消費者指定地點須步行、尋找而耗費大量時間或是交通壅塞時間耗時，因此，再輔以外送服務時間及合理加計提供外送服務負擔之成本與等待訂單之時間成本，明定每筆訂單換算之每小時基本報酬亦不得低於最低工資法所定每小時最低工資之一點二五倍，以提供外送員基本報酬雙重保障。\n三、參考勞動基準法第二十二條第二項規定，於第三項明定外送平臺業者應全額給付報酬。\n四、參考勞動基準法第二十三條規定，於第四項明定每月至少二次發給外送員報酬及報酬明細表，其中報酬計算方式應包含每筆訂單之外送服務期間，使外送員得據以檢視報酬金額是否符合第二項有關基本報酬之規定；於第五項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"},{"bill":"202110176760000","text":"中央主管機關應會同中央目的事業主管機關，對於外送平台業者與外送員、合作商家、消費者間重要權利義務事項，擬定契約範本，報請行政院核定後公告之。","note":"外送平台業者對於外送員、合作商家及消費者，通常以定型化契約約定雙方權利義務，考量數位經濟型態下，外送平台業者具絕對優勢，為保障外送員、合作商家及消費者權益，並兼顧食品安全衛生、交通安全等事項，規定中央主管機關應會同中央目的事業主管機關就重要權利義務事項擬定契約範本。"},{"bill":"202110176980000","text":"交通主管機關應依公路法規核定基本運價。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所計算之運費，且每筆訂單外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資之一點二五倍。\n外送平臺業者給付外送員報酬，應全額直接給付。但法令另有規定或雙方有約定者，不在此限。\n外送平臺業者給付外送員報酬，每月至少定期發給二次，並應提供載明下列事項之外送員報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、為保障外送員基本收入，規範每筆訂單基本報酬不得低於：\n(一)交通主管機關依公路法規核定之基本運價所計算之運費。\n(二)換算每小時之基本報酬不得低於最低工資法所定每小時最低工資之一點二五倍。\n二、要求定期發給報酬與明細。\n三、外送平臺業者需置備報酬清冊至少五年。"},{"bill":"202110177560000","text":"外送平臺業者應於與外送員成立外送服務契約後七日內，以書面或電子資料傳輸方式提供契約予外送員收執。\n前項契約書之內容，中央主管機關應訂定定型化契約範本與其應記載及不得記載之事項。","note":"一、為避免外送員未明瞭外送服務契約之詳細條款，外送平臺業者應於契約成立後七日內，以書面或電子資料型式提供契約內容予外送員。\n二、定型化契約範本至少應記載下列事項：\n(一)報酬之金額、計算方式、給付時間。\n(二)停權、違規及終止契約事由。\n(三)外送服務應具備之設備、程式或工具。\n(四)外送服務基本流程。\n(五)因不可歸責於外送員之事由，致無法完成外送服務之處理機制。"},{"bill":"202110177680000","text":"交通主管機關應依公路法規核定基本運價，外送平臺業者應提供運價成本相關資料供交通主管機關審訂。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所計算之運費，且每筆訂單外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資之一點五倍。\n外送平臺業者給付外送員報酬，應全額直接給付。但法令另有規定或雙方另有約定者，不在此限。\n外送平臺業者給付外送員報酬每月至少定期發給二次，並應提供載明下列事項之報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、有鑑於消費者之運費計算方式，係由外送平臺業者單方決定，消費者無從得知該筆訂單之運費如何被決定，例如訂購相同合作商家商品所需運費卻不相同。爰為將外送平臺使機車運送商品之運費透明化，於第一項明定運費透明化之處理機制，由交通主管機關為依公路法規核定基本運價。\n二、復因外送員之報酬計算方式，亦為外送平臺業者單方決定，外送員僅得被動選擇是否接受且外送平臺業者並未清楚揭露報酬結構及計算方式，使外送員難以核對外送平臺業者發給報酬數額之正確性，且外送員長期反映外送平臺提供消費者及合作商家之商品運送服務，係由外送員提供勞務並負擔運送成本，故消費者與合作商家享受運送服務所負擔之運費，其性質應等同於外送員報酬，爰於第二項明定每筆訂單之基本報酬，不得低於依第一項基本運價所計算之運費，使每筆訂單基本報酬與交通部核定之運費連動；同時考量前開運費係採運送距離為主要計價方式，惟外送員完成訂單可能因運送至消費者指定地點須步行、尋找而耗費大量時間或是交通壅塞時間耗時，因此，再輔以外送服務時間及合理加計提供外送服務負擔之成本與等待訂單之時間成本，明定每筆訂單換算之每小時基本報酬亦不得低於最低工資法所定每小時最低工資之一點五倍，以提供外送員基本報酬雙重保障。另參考國內知名外送平臺發布「外送合作夥伴收入與自由彈性報告」，其外送合作夥伴送單期間平均時薪為270元，亦約為每小時最低工資一點五倍。\n三、參考勞動基準法第二十二條第二項規定，於第三項明定外送平臺業者應全額給付報酬。\n四、參考勞動基準法第二十三條規定，於第四項明定每月至少二次發給外送員報酬及報酬明細表，其中報酬計算方式應包含每筆訂單之外送服務期間，使外送員得據以檢視報酬金額是否符合第二項有關基本報酬之規定；於第五項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"},{"bill":"202110178160000","text":"交通主管機關應依公路法規核定基本運價，外送平臺業者應提供運價成本相關資料供交通主管機關審訂。\n外送平臺業者給付外送員每筆訂單之基本報酬，不得低於依前項基本運價所計算之運費，且每筆訂單外送服務期間換算之每小時基本報酬，不得低於最低工資法所定每小時最低工資之一點二五倍。\n外送平臺業者給付外送員報酬，應全額直接給付。但法令另有規定或雙方另有約定者，不在此限。\n外送平臺業者給付外送員報酬，每月至少定期發給二次，並應提供載明下列事項之報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","note":"一、有鑑於消費者之運費計算方式，係由外送平臺業者單方決定，消費者無從得知該筆訂單之運費如何被決定，例如訂購相同合作商家商品所需運費卻不相同。爰為將外送平臺使機車運送商品之運費透明化，於第一項明定運費透明化之處理機制，由交通主管機關為依公路法規核定基本運價。\n二、復因外送員之報酬計算方式，亦為外送平臺業者單方決定，外送員僅得被動選擇是否接受，且外送平臺業者並未清楚揭露報酬結構及計算方式，使外送員難以核對外送平臺業者發給報酬數額之正確性，且外送員長期反映外送平臺提供消費者及合作商家之商品運送服務，係由外送員提供勞務並負擔運送成本，故消費者與合作商家享受運送服務所負擔之運費，其性質應等同於外送員報酬，爰於第二項明定每筆訂單之基本報酬，不得低於依第一項基本運價所計算之運費，使每筆訂單基本報酬與交通部核定之運費連動；同時考量前開運費係採運送距離為主要計價方式，惟外送員完成訂單可能因運送至消費者指定地點須步行、尋找而耗費大量時間或是交通壅塞時間耗時，因此，再輔以外送服務時間及合理加計提供外送服務負擔之成本與等待訂單之時間成本，明定每筆訂單換算之每小時基本報酬亦不得低於最低工資法所定每小時最低工資之一點二五倍，以提供外送員基本報酬雙重保障。\n三、參考勞動基準法第二十二條第二項規定，於第三項明定外送平臺業者應全額給付報酬。\n四、參考勞動基準法第二十三條規定，於第四項明定每月至少二次發給外送員報酬及報酬明細表，其中報酬計算方式應包含每筆訂單之外送服務期間，使外送員得據以檢視報酬金額是否符合第二項有關基本報酬之規定；於第五項明定業者應置備報酬清冊及保存年限，以保障外送員權益。"},{"bill":"202110181420000","text":"經濟主管機關對於外送平臺業者與合作商家成立外送合作契約之重要權利義務事項，應擬訂契約範本，並公告之。\n前項契約範本，應包括商品提供及價格、運費收取、貨款給付、爭議處理機制、食品安全及其他有關合作商家權益之事項。\n外送平臺業者應於外送合作契約成立後七日內，提供書面或電子契約予合作商家收執。","note":"一、查外送平臺業者對於合作商家，常以定型化契約約定雙方權利義務。\n二、為平衡外送平臺產業及合作商家於締約、議價上之地位，授權經濟主管機關擬訂契約範本，供外送平臺業者遵循，並得會商有關主管機關，如交通主管機關、衛生主管機關、數位主管機關及金融主管機關等有關機關，以臻周全。\n三、另於第三項明定外送平臺業者應於契約成立後七日內提供書面或電子契約予合作商家，使其得隨時檢視契約內容，避免爭議產生。"}],"changed":true,"final":"外送平臺業者給付外送員每筆訂單之基本報酬，不得低於該筆訂單外送服務期間依比例換算最低工資法所定每小時最低工資之一點二五倍，且不得低於新臺幣四十五元之保障金額。\n前項每筆訂單基本報酬之保障金額，由中央主管機關依前一年度保障金額乘以每年最低工資法所定每小時最低工資之調升比率，公告調整。\n外送平臺業者給付外送員報酬，應全額直接給付。但法令另有規定或雙方另有約定者，不在此限。\n外送平臺業者給付外送員報酬，每月至少定期發給二次，並應提供載明下列事項之報酬明細表：\n一、報酬總額。\n二、每筆訂單報酬之計算方式及金額。\n三、依法令或雙方約定得扣除之項目及其金額。\n四、實際發給之金額。\n外送平臺業者應置備外送員報酬清冊，將給付報酬總額、報酬明細等事項記入；報酬清冊應保存五年。","finalWhy":"一、第一項明定外送員每筆訂單之基本報酬計算方式，說明如下：\n(一)為使外送員對外送平臺業者發給報酬數額，具有可預測性及可驗證計算，經考量外送員完成訂單之外送服務期間，合理加計提供外送服務負擔之油耗、維修相關成本與等待訂單之時間成本，於第一項前段明定每筆訂單外送服務期間依比例換算，不得低於最低工資法所定每小時最低工資之一點二五倍。又外送平臺業者依第六條規定提供外送員每筆訂單之預估報酬等重要資訊，僅作為外送員評估是否承接訂單之參考，第一項所定基本報酬，仍應依外送員完成每筆訂單之實際外送服務期間計算。至外送服務期間計算有關事項，將另於外送服務定型化契約應記載及不得記載事項定之。\n(二)同時，為使外送員每筆訂單有合理之樓地板保障，經衡酌外送平臺業者使外送員提供外送服務之實務情形，爰於第一項後段明定每筆訂單保障金額為四十五元，以合理保障短時間訂單之基本報酬。\n二、為使每筆訂單基本報酬之保障金額得隨每小時最低工資調升併同調整，於第二項明定之。\n三、參考勞動基準法第二十二條第二項規定，於第三項明定外送平臺業者應全額給付報酬。\n四、參考勞動基準法第二十三條規定，於第四項明定每月至少二次發給外送員報酬及報酬明細表，其中報酬計算方式應包含每筆訂單之外送服務期間，使外送員得據以檢視報酬金額是否符合第一項有關基本報酬之規定；於第五項明定業者應置備報酬清冊及保存年限，以保障外送員權益。","review":null},{"no":"第六條","current":null,"versions":[{"bill":"202110017580000","text":"中央主管機關應會同中央目的事業主管機關，對於外送員資格、外送服務期間有關食品安全、交通安全之設備或工具，訂定外送安全衛生服務標準。","note":"數位平台經濟工作型態與傳統外送行業略有不同，觀察實務運作、社群媒體，民間對於外送員之資格、條件、素質及合作商家衛生狀況多有討論，為保障消費者食的安全、外送員人身安全，中央主管機關應會同中央目的事業主管機關對於外送員之資格、條件、應具備之食品安全知識及工具、設備，訂定外送安全服務標準。"},{"bill":"202110060450000","text":"中央主管機關應會同中央目的事業主管機關，對於外送員資格、外送服務期間有關食品安全衛生、交通安全之設備或工具，訂定外送安全衛生服務標準。","note":"為確保消費者食品安全無虞、外送員人身安全等，中央主管機關應會同中央目的事業主管機關針對外送員之資格、條件、應具備之食品安全知識及工具、設備，訂定外送安全服務標準。"},{"bill":"202110060680000","text":"外送平台業者應於外送平台介面客戶端明確揭示下列各款事項：\n一、商品重量、體積，及價格、服務費或運費之金額。\n二、消費者取消訂單之退費機制。\n三、外送平台業者得取消訂單之情事及退費機制。\n四、商品遲延交付、交付商品之種類或數量與訂單不符及商品損壞之處理方式、收退費用及補償措施。","note":"參考臺北市外送平台業者管理自治條例第十一條，外送平台業者應提供消費者充分、正確之資訊，俾維護消費者權益，爰明定外送平台業者應明確揭示之事項。"},{"bill":"202110060360000","text":"外送平台業者應於外送平台介面客戶端明確揭示下列各款事項：\n一、商品重量、體積，及價格、服務費或運費之金額。\n二、消費者取消訂單之退費機制。\n三、外送平台業者得取消訂單之情事及退費機制。\n四、商品遲延交付、交付商品之種類或數量與訂單不符及商品損壞之處理方式、收退費用及補償措施。","note":"參考臺北市外送平台業者管理自治條例第十一條，外送平台業者應提供消費者充分、正確之資訊，俾維護消費者權益，爰明定外送平台業者應明確揭示之事項。"},{"bill":"202110075210000","text":"外送平台業者應於外送平台介面客戶端明確揭示下列各款事項：\n一、商品重量、體積，及價格、服務費或運費之金額。\n二、消費者取消訂單之退費機制。\n三、外送平台業者得取消訂單之情事及退費機制。\n四、商品遲延交付、交付商品之種類或數量與訂單不符及商品損壞之處理方式、收退費用及補償措施。","note":"參考臺北市外送平台業者管理自治條例第十一條，外送平台業者應提供消費者充分、正確之資訊，俾維護消費者權益，爰明定外送平台業者應明確揭示之事項。"},{"bill":"202110099010000","text":"中央主管機關應會同中央目的事業主管機關，對於外送員資格、外送服務期間有關食品安全、交通安全之設備或工具，訂定外送安全衛生服務標準。","note":"數位平台經濟工作型態與傳統外送行業略有不同，觀察實務運作、社群媒體，民間對於外送員之資格、條件、素質及合作商家衛生狀況多有討論，為保障消費者食的安全、外送員人身安全，中央主管機關應會同中央目的事業主管機關對於外送員之資格、條件、應具備之食品安全知識及工具、設備，訂定外送安全服務標準。"},{"bill":"202110167670000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為平衡外送平臺業者與外送員於締約、議價上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項，並得會商有關主管機關，如交通主管機關、金融主管機關等，以臻周全。並為使外送平臺業者及外送員間權利義務得清楚明確，於第二項明定定型化契約應記載及不得記載事項，應包含之重要權利義務事項，以保障外送員勞動權益。\n二、為確保外送平臺業者與外送員成立之外送服務契約，不逸脫定型化契約應記載及不得記載事項之範圍，於第三項明定違反者無效、未記載於契約者亦構成契約內容。\n三、另為避免外送平臺業者未經外送員同意，片面變更外送服務契約內容或增補第二項外送員重要權利義務事項，爰訂定第四項規定，惟雙方合意內容仍不得違反前開定型化契約應記載及不得記載事項。並於第五項明定業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110167840000","text":"外送平台業者應於外送平台介面客戶端明確揭示下列各款事項：\n一、商品價格、服務費或運費之金額。\n二、消費者取消訂單之退費機制。\n三、外送平台業者得取消訂單之事由及退費機制。\n四、商品遲延交付之處理方式。\n五、交付商品之種類或數量與訂單不符及商品損壞之處理方式、收退費用及賠償方案。","note":"參考臺中市外送平台業者管理自治條例第十條，外送平台業者應提供消費者充分、正確之資訊，俾維護消費者權益，爰明定外送平台業者應明確揭示之事項。"},{"bill":"202110168030000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為平衡外送平臺業者與外送員於締約、議價上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項，並得會商有關主管機關，如交通主管機關、金融主管機關等，以臻周全。並為使外送平臺業者及外送員間權利義務得清楚明確，於第二項明定定型化契約應記載及不得記載事項，應包含之重要權利義務事項，以保障外送員勞動權益。\n二、為確保外送平臺業者與外送員成立之外送服務契約，不逸脫定型化契約應記載及不得記載事項之範圍，於第三項明定違反者無效、未記載於契約者亦構成契約內容。\n三、另為避免外送平臺業者未經外送員同意，片面變更外送服務契約內容或增補第二項外送員重要權利義務事項，爰訂定第四項規定，惟雙方合意內容仍不得違反前開定型化契約應記載及不得記載事項。並於第五項明定業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110168140000","text":"中央主管機關應會同中央目的事業主管機關，對於外送員資格、外送服務期間有關食品安全、交通安全之設備或工具，訂定外送安全衛生服務標準。","note":"數位平台經濟工作型態與傳統外送行業略有不同，觀察實務運作、社群媒體，民間對於外送員之資格、條件、素質及合作商家衛生狀況多有討論，為保障消費者食的安全、外送員人身安全，中央主管機關應會同中央目的事業主管機關對於外送員之資格、條件、應具備之食品安全知識及工具、設備，訂定外送安全服務標準。"},{"bill":"202110168230000","text":"外送平台業者應於外送平台介面客戶端明確揭示下列各款事項：\n一、商品重量、體積，及價格、服務費或運費之金額。\n二、消費者取消訂單之退費機制。\n三、外送平台業者得取消訂單之情事及退費機制。\n四、商品遲延交付、交付商品之種類或數量與訂單不符及商品損壞之處理方式、收退費用及補償措施。","note":"明定外送平台業者應明確揭示之事項。"},{"bill":"202110168240000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更第一項所訂契約內容及外送員權利義務事項，應取得工會同意後，始得公告之。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為平衡外送平臺業者與外送員於締約、議價上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項，並得會商有關主管機關，如交通主管機關、金融主管機關等，以臻周全。並為使外送平臺業者及外送員間權利義務得清楚明確，於第二項明定定型化契約應記載及不得記載事項，應包含之重要權利義務事項，以保障外送員勞動權益。\n二、為確保外送平臺業者與外送員成立之外送服務契約，不逸脫定型化契約應記載及不得記載事項之範圍，於第三項明定違反者無效、未記載於契約者亦構成契約內容。\n三、另為避免外送平臺業者未經工會同意，片面變更外送服務契約內容或與外送員有關之權利義務事項，爰訂定第四項規定，外送員與外送平台業者間契除依契約之法理應由外送員本人同意，增應取得工會同意後，始得公告之為保障。並於第五項明定業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110169580000","text":"中央主管機關應依外送服務實務需要，擬訂外送平臺業者及外送員成立外送服務契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、契約終止、報酬給付、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"本條為保障外送員勞動權益與契約公平，授權中央主管機關訂定定型化契約應記載及不得記載事項，明定違反條款無效、未記載仍構成契約內容，並禁止業者片面修改契約，確保資訊透明與雙方權益平衡。"},{"bill":"202110170380000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為平衡外送平臺業者與外送員於締約、議價上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載及不得記載事項，並得會商有關主管機關，如交通主管機關、金融主管機關等，以臻周全。並為使外送平臺業者及外送員間權利義務得清楚明確，於第二項明定定型化契約應記載及不得記載事項，應包含之重要權利義務事項，以保障外送員勞動權益。\n二、為確保外送平臺業者與外送員成立之外送服務契約，不逸脫定型化契約應記載及不得記載事項之範圍，於第三項明定違反者無效、未記載於契約者亦構成契約內容。\n三、另為避免外送平臺業者未經外送員同意，片面變更外送服務契約內容或增補第二項外送員重要權利義務事項，爰訂定第四項規定，惟雙方合意內容仍不得違反前開定型化契約應記載及不得記載事項。並於第五項明定業者應於契約成立後七日內提供書面或電子契約予外送員，使其得隨時檢視契約內容，避免爭議產生。"},{"bill":"202110171160000","text":"中央主管機關對於外送平臺業者及外送員成立外送服務契約之重要權利義務事項，應擬訂定型化契約應記載及不得記載事項，並公告之。\n前項定型化契約應記載及不得記載事項，應包括適用自動化管理之範圍、停權、終止外送服務契約、報酬、申訴制度、商業保險、外送服務基本流程及提供專人服務聯絡方式及其他有關外送員勞動權益之事項。\n外送平臺業者與外送員成立外送服務契約，違反第一項公告之定型化契約應記載及不得記載事項者，無效；該公告之應記載事項，雖未記載於契約，仍構成契約之內容。\n外送平臺業者變更或增補外送服務契約之重要權利義務事項，應清楚說明變更之內容，並經外送員同意；未經外送員同意，即以網際網路、公告、郵件、書面或其他方式對外發布或通知者，不生效力。\n外送平臺業者應於外送服務契約成立後七日內，提供書面或電子契約予外送員收執。","note":"一、為平衡外送平臺業者與外送員於締約、議價上之地位，於第一項授權中央主管機關應訂定外送服務定型化契約應記載
