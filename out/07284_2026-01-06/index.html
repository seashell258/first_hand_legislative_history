外送員有關之紀錄至少二年，該紀錄包括外送服務契約內容、外送員提供外送服務期間、上線期間、停權紀錄、依第七條終止契約之情形，以及以演算法或其他方式對外送員為不利之決定等。\n二、於第二項明定有關機關得要求調閱前開有關外送員紀錄，外送平臺業者不得拒絕。","review":{"note":"修正通過","text":"外送平臺業者對新加入之外送員，應提供一定時數之職業安全衛生、交通安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容、師資等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。"}},{"no":"第二十一條","current":null,"versions":[{"bill":"202110017580000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前項教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參考台北市外送平台業者管理自治條例第八條，提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員及預防災變所需之認知，外送平台業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育訓練課程。"},{"bill":"202110060450000","text":"外送平台業者對新進外送員，應提供至少四小時實體之職業安全、交通安全及食品安全衛生教育訓練課程；對已完成前項教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參考台北市外送平台業者管理自治條例第八條，提升新進外送員安全駕駛觀念、食品安全衛生知能，以及加強外送員及預防災變所需之認知，外送平台業者應安排新進外送員接受職業安全、交通安全及食品安全衛生教育訓練課程。"},{"bill":"202110075210000","text":"本法自公布日施行。","note":"本法施行日期。"},{"bill":"202110099010000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平台業者應於八小時內通報勞動部職業安全署所屬之勞動檢查機構：\n一、死亡。\n二、道路交通事故。","note":"為使勞動檢查機構能迅速掌握職業災害訊息，防止類似災害之發生，課予外送平台業者通報勞動部職業安全署所以之勞動檢查機構之義務。"},{"bill":"202110167670000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為使外送員積極注意交通安全，明定外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為，外送平臺業者應依交通主管機關通知期限內，實施外送員運送安全講習，未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110167840000","text":"本法自公布日施行。","note":"本法施行日期。"},{"bill":"202110168030000","text":"外送員於提供外送服務時，發生道路交通事故致人於死或重傷，且經鑑定同為肇事原因或為肇事主因者，或因違反交通有關法令規定，應接受道路交通安全講習者，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"一、依審計部109年度中央政府總決算審核報告，當年度道路交通事故有61.09%之肇事主因屬登錄為外送車輛所致，同年度亦有30,683輛外送車輛、29,378位外送員共計有50,224次重大違規，顯見實有必要就外送員引發之交通安全風險加以立法規範。\n二、為使外送員積極注意交通安全，於本條明定外送員依交通有關法令規定應接受道路交通安全講習者，於完成講習前，外送平臺業者不得使其提供外送服務。"},{"bill":"202110168140000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前項教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參考臺北市外送平台業者管理自治條例第八條，提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員及預防災變所需之認知，外送平台業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育訓練課程。"},{"bill":"202110168240000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為使外送員積極注意交通安全，明定外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為，外送平臺業者應依交通主管機關通知期限內，實施外送員運送安全講習，未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110169580000","text":"外送員於提供外送服務時，若有交通主管機關認定之重大影響交通安全行為，外送平臺業者應於通知改善期限內完成外送員運送安全講習，於講習完成前，外送平臺業者不得使其提供外送服務。","note":"本條要求外送平臺督促違規外送員於期限內完成安全講習，以強化交通安全意識並防止再犯。"},{"bill":"202110170380000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為強化外送員之交通安全意識，規範外送員執行外送任務期間，若經交通主管機關認定足以嚴重影響交通安全之違規行為時，外送平臺業者應依主管機關指定之改善期限，辦理外送員運送安全講習，並於外送員完成講習後，方得再行提供外送服務，以確保公共交通安全與產業自律責任之落實。"},{"bill":"202110171160000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為使外送員積極注意交通安全，明定外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為，外送平臺業者應依交通主管機關通知期限內，實施外送員運送安全講習，未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110170780000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前項教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參考臺北市外送平台業者管理自治條例第八條，提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員及預防災變所需之認知，外送平台業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育訓練課程。"},{"bill":"202110173040000","text":"外送平台業者對新加入之外送人員，應提供至少六小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前項教育訓練課程之從業外送人員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參考臺北市外送平台業者管理自治條例第八條，提升新加入外送人員安全駕駛觀念、食品衛生安全知能，以及預防災變所需之知識，外送平台業者應安排新加入外送人員接受職業安全、交通安全及食品衛生安全教育訓練課程。"},{"bill":"202110173260000","text":"本法自公布日施行。","note":"明定本法施行日"},{"bill":"202110173180000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為使外送員積極注意交通安全，明定外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為，外送平臺業者應依交通主管機關通知期限內，實施外送員運送安全講習，未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110173190000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為使外送員積極注意交通安全，明定外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為，外送平臺業者應依交通主管機關通知期限內，實施外送員運送安全講習，未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110174470000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前項教育訓練課程之從業外送員，每年應至少應提供二小時之實體或線上之教育訓練課程。","note":"參考臺北市外送平台業者管理自治條例第八條，提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員及預防災變所需之認知，外送平台業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育訓練課程。"},{"bill":"202110174740000","text":"外送平臺業者應保存下列與外送員服務有關之紀錄，保存期間不得低於五年：\n一、外送服務契約。\n二、外送服務期間。\n三、外送員上線期間。\n四、外送員報酬、獎金與其他費用清冊。\n五、停權、依第六條規定終止外送服務契約或其他對外送員不利之決定。\n六、其他外送服務契約終止情事。\n主管機關得依職權要求調閱前項各款紀錄，外送平臺業者不得拒絕。","note":"要求平臺保存與外送員相關契約、報酬與服務紀錄五年，供主管機關調閱查核，以防止薪資爭議及非法終止契約事件。"},{"bill":"202110175620000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"為提升新加入外送員交通安全等從事外送工作之有關知能，爰於本條明定外送平臺業者應安排其接受相關教育訓練，並每年提供一定時數之教育訓練。"},{"bill":"202110175920000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能即時掌握職業災害發生情形並防止再度發生，參考勞動部「外送作業安全衛生指引」規定，明定外送平臺業者應向勞動檢查機構通報外送員發生職業災害之情形，並應於職業災害發生後，實施事故調查、分析及作成紀錄。"},{"bill":"202110176760000","text":"外送平台業者對新進外送員，應提供至少四小時實體之職業安全、交通安全及食品安全衛生教育訓練課程；對已完成前項教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參照臺北市外送平台業者管理自治條例第八條，提升新進外送員安全駕駛觀念、食品安全衛生知能，以及加強外送員及預防災變所需之認知，外送平台業者應安排新進外送員接受職業安全、交通安全及食品安全衛生教育訓練課程。"},{"bill":"202110176980000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"規範外送平臺業者職災通報義務，使勞檢機關能即時掌握事故發生情況，並採行預防措施以避免再度發生。"},{"bill":"202110177680000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能即時掌握職業災害發生情形並防止再度發生，參考勞動部外送作業安全衛生指引」規定，明定外送平臺業者應向勞動檢查機構通報外送員發生職業災害之情形，並應於職業災害發生後，實施事故調查、分析及作成紀錄。"},{"bill":"202110178160000","text":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","note":"為使勞動檢查機構能即時掌握職業災害發生情形並防止再度發生，參考勞動部「外送作業安全衛生指引」規定，明定外送平臺業者應向勞動檢查機構通報外送員發生職業災害之情形，並應於職業災害發生後，實施事故調查、分析及作成紀錄。"},{"bill":"202110181420000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為使外送員積極注意交通安全，明定外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為，外送平臺業者應依交通主管機關通知期限內，實施外送員運送安全講習，未完成者，外送平臺業者不得使其提供外送服務。"}],"changed":true,"final":"外送員於外送服務期間，發生下列職業災害之一者，外送平臺業者應於八小時內通報當地勞動檢查機構，並於事後實施事故調查、分析及作成紀錄：\n一、發生死亡災害。\n二、發生災害之罹災人數在一人以上，且需住院治療。","finalWhy":"為使勞動檢查機構能即時掌握職業災害發生情形並防止再度發生，參考職業安全衛生法第三十七條第一項、第二項規定及勞動部「外送作業安全衛生指引」規定，明定外送平臺業者應向勞動檢查機構通報外送員發生職業災害之情形，並應於職業災害發生後，實施事故調查、分析及作成紀錄。","review":{"note":"照委員劉建國等16人提案通過","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。"}},{"no":"第二十二條","current":null,"versions":[{"bill":"202110017580000","text":"外送員提供外送服務時，發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"為確保外送員於提供外送服務時能安全駕駛，爰訂定本條，要求外送員提供外送服務時，如發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110060450000","text":"外送員提供外送服務時，發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"為確保外送員於提供外送服務時能安全駕駛，爰訂定本條。"},{"bill":"202110099010000","text":"外送平台業者對新加入之外送員，應提供至少四小時實體之職業安全、交通安全及食品衛生安全教育訓練課程；對已完成前項教育訓練課程之從業外送員，每年應至少提供二小時之實體或線上之教育訓練課程。","note":"參考台北市外送平台業者管理自治條例第八條，提升新加入外送員安全駕駛觀念、食品衛生安全知能，以及加強外送員及預防災變所需之認知，外送平台業者應安排新加入外送員接受職業安全、交通安全及食品衛生安全教育訓練課程。"},{"bill":"202110167670000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第二十條第一項或第二項規定。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定本法各條文處罰之裁處機關及罰則。"},{"bill":"202110168030000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第二十條第一項、第二項或第四項。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，應按次處罰。","note":"明定本法各條文處罰之裁處機關及罰則。"},{"bill":"202110168140000","text":"外送員提供外送服務時，發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"為確保外送員於提供外送服務時能安全駕駛，爰訂定本條，要求外送員提供外送服務時，如發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110168240000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第二十條第一項或第二項規定。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定本法各條文處罰之裁處機關及罰則。"},{"bill":"202110169580000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關或目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第二十條第一項或第二項規定。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"本條明定各項違反行為之裁罰機關、罰鍰區間及公布義務，以確保外送平臺落實本法規範並具警示效果。"},{"bill":"202110170380000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第二十條第一項或第二項規定。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定本法各條文處罰之裁處機關及罰則。"},{"bill":"202110171160000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第二十條第一項或第二項規定。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定本法各條文處罰之裁處機關及罰則。"},{"bill":"202110170780000","text":"外送員提供外送服務時，發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"為確保外送員於提供外送服務時能安全駕駛，爰訂定本條，要求外送員提供外送服務時，如發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110173040000","text":"外送人員提供外送服務時，發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"為確保外送人員於提供外送服務時能安全駕駛，爰訂定本條，要求外送人員提供外送服務時，如發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110173180000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第五項、第十條、第二十條第一項或第二項規定。\n二、違反第六條第五項、第六項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定本法各條文處罰之裁處機關及罰則。"},{"bill":"202110173190000","text":"外送平臺業者違反第十二條、第十三條第一項及第二項規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第十五條第三項、第二十條第一項或第二項規定。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定本法各條文處罰之裁處機關及罰則。"},{"bill":"202110174470000","text":"外送平台業者有違反第第六條、第九條、第十條及第十八條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有違反第十一條、第十六條、第十七條、第二十條及第二十一條之規定者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者有拒絕、規避或防礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者未提供書面契約或電磁紀錄予外送員及合作廠商收執；未保存消費者訂購商品、廠商接受訂單及外送員提供外送服務之相關電磁紀錄；未於外送平台介面明確揭示商品價格、服務費或運費之金額、取消訂單之退費機制；以及違反第十八條規定，未依法為外送員辦理勞工保險及勞工職業災害保險，經通知限期改善，屆期未改善時之罰則。\n二、明定未建立申訴制度、未依規定將外送員停權、未履行通報義務；未為外送員實施職業安全、交通安全及食品衛生安全等教育訓練時之罰則。\n三、明定外送平台業者於拒絕、規避或妨礙本法所定中央主管機關監督時之處罰。"},{"bill":"202110174740000","text":"外送平臺業者違反第十六條、第十七條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第十四條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第七條第三項、第八條、第九條第一項、第十七條、第十二條第一項或第二項規定。\n二、違反第四條第五項、第十條第二項、第十一條第一項、第二十一條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第四項、第十九條第一項、第二十條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十條第一項或第十五條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"本條為罰則條款，明定各項違反行為之處罰對象、主管機關與罰鍰範圍，並規定公開違法業者資訊，以加強嚇阻與透明監理。"},{"bill":"202110175620000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"本條明定外送員於提供外送服務時，若違反交通主管機關認定有重大影響交通安全之行為，外送平臺業者應於期限內實施外送員運送安全講習，未完成者，不得使其提供外送服務。"},{"bill":"202110175920000","text":"外送平臺業者對新加入之外送員，應提供一定時數之職業安全衛生、交通安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為提升新進外送員及從業外送員之職業安全衛生、交通安全、食品衛生安全及外送服務工作相關知能，於第一項及第二項明定外送平臺業者應安排其接受一定時數之相關教育訓練，以確保外送員提供外送服務之安全與品質。\n二、復為確保訓練內容符合法令要求，於第三項授權中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練課程時數、內容等有關事項。"},{"bill":"202110176760000","text":"外送員提供外送服務時，發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"為確保外送員於提供外送服務時能安全駕駛，爰訂定本條。"},{"bill":"202110176980000","text":"外送平臺業者對新加入之外送員，應提供一定時數之交通安全、職業安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容及實施方式等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"要求外送平臺業者應安排外送員接受必要之教育訓練，並授權主管機關訂定訓練時數與內容，以提升外送員交通安全、作業安全及食安等知能。"},{"bill":"202110177680000","text":"外送平臺業者對新加入之外送員，應提供一定時數之職業安全衛生、交通安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為提升新進外送員及從業外送員之職業安全衛生、交通安全、食品衛生安全及外送服務工作相關知能，於第一項及第二項明定外送平臺業者應安排其接受一定時數之相關教育訓練，以確保外送員提供外送服務之安全與品質。\n二、復為確保訓練內容符合法令要求，於第三項授權中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練課程時數、內容等有關事項。"},{"bill":"202110178160000","text":"外送平臺業者對新加入之外送員，應提供一定時數之職業安全衛生、交通安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","note":"一、為提升新進外送員及從業外送員之職業安全衛生、交通安全、食品衛生安全及外送服務工作相關知能，於第一項及第二項明定外送平臺業者應安排其接受一定時數之相關教育訓練，以確保外送員提供外送服務之安全與品質。\n二、復為確保訓練內容符合法令要求，於第三項授權中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練課程時數、內容等有關事項。"},{"bill":"202110181420000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第二十條第一項或第二項規定。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十八條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第十九條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定本法各條文處罰之裁處機關及罰則。"}],"changed":true,"final":"外送平臺業者對新加入之外送員，應提供一定時數之職業安全衛生、交通安全、食品衛生安全及其他必要之教育訓練。\n外送平臺業者每年應要求提供外送服務之外送員至少完成一定時數之教育訓練。\n前二項教育訓練之一定時數、內容、師資等有關事項，由中央主管機關、交通主管機關及衛生福利主管機關分別定之。","finalWhy":"一、為提升外送員職業安全衛生、交通安全及食品衛生安全及外送服務工作相關知能，於第一項明定，外送平臺業者對於新加入之外送員，應提供包含職業安全衛生、交通安全及食品衛生安全等各項教育訓練；並於第二項明定，外送平臺業者對於已從事外送工作之外送員，亦應要求其每年接受第一項所定各項目之教育訓練。\n二、另為確保訓練內容符合法令要求，於第三項授權中央主管機關、交通主管機關及衛生福利主管機關分別訂定訓練課程時數、內容、師資等有關事項。","review":{"note":"修正通過","text":"外送平臺業者違反第十一條、第十五條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十三條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定，由主管機關處新臺幣三萬元以上三十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，由主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第四條第五項、第十二條第一項、第十四條第三項、第十八條第一項、第十九條第一項或第二十條第一項規定，經通知限期改善，屆期未改善。\n二、違反第二十二條第一項、第二項有關交通安全及食品衛生安全教育訓練之規定，經通知限期改善，屆期未改善。\n三、違反第五條第一項、第三項至第五項、第八條第三項、第九條或第十條規定。\n外送平臺業者違反第二十二條第一項、第二項有關職業安全衛生教育訓練之規定，依職業安全衛生法相關規定處罰。\n(照委員劉建國等16人提案通過)\n第二十五條　外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。"}},{"no":"第二十三條","current":null,"versions":[{"bill":"202110017580000","text":"外送平台業者違反第八條、第九條、第十九條、第二十二條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。","note":"明定外送平台業者違反第八條及第九條預告外送員，與其終止外送服務契約，未給予外送員經濟補償；違反第十九條外送平台業者應為外送員辦理參加勞工保險及勞工職業災害保險；以及違反第二十二條外送平台業者應停止指派外送員外送服務之處罰。"},{"bill":"202110060450000","text":"外送平台業者違反第八條、第九條、第十九條、第二十二條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。","note":"明定外送平台業者違反第八條及第九條預告外送員，與其終止外送服務契約，未給予外送員經濟補償；違反第十九條外送平台業者應為外送員辦理參加勞工保險及勞工職業災害保險；以及違反第二十二條外送平台業者應停止指派外送員外送服務之處罰。"},{"bill":"202110099010000","text":"外送員提供外送服務時，發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。","note":"為確保外送員於提供外送服務時能安全駕駛，爰訂定本條，要求外送員提供外送服務時，如發生道路交通事故致人於死或重傷，經鑑定同為肇事原因或為肇事主因者，應於三個月內完成四十八小時道路交通安全講習，未於期限內完成者，外送平台業者應停止指派其提供外送服務。"},{"bill":"202110167670000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"},{"bill":"202110168030000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"},{"bill":"202110168140000","text":"外送平台業者違反第八條、第九條、第十九條、第二十二條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。","note":"明定外送平台業者違反第八條及第九條預告外送員，與其終止外送服務契約，未給予外送員經濟補償；違反第十九條外送平台業者應為外送員辦理參加勞工保險及勞工職業災害保險；以及違反第二十二條外送平台業者應停止指派外送員外送服務之處罰。"},{"bill":"202110168240000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"},{"bill":"202110169580000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"},{"bill":"202110170380000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"},{"bill":"202110171160000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。\n受外送平臺業者委託辦理外送服務之第三人，應負同等外送員權益保障義務。","note":"平臺業者委託第三人經營外送業務時，該第三人同樣負擔相等之外送員保障責任，防止以轉包或代理關係規避法律責任。"},{"bill":"202110170780000","text":"外送平台業者違反第八條、第九條、第十九條、第二十二條之規定，處新臺幣五萬元以上五十萬元以下罰鍰。","note":"明定外送平台業者違反第八條及第九條預告外送員，與其終止外送服務契約，未給予外送員經濟補償；違反第十九條外送平台業者應為外送員辦理參加勞工保險及勞工職業災害保險；以及違反第二十二條外送平台業者應停止指派外送員外送服務之處罰。"},{"bill":"202110173040000","text":"外送平台業者違反第八條、第九條、第十九條、第二十二條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。","note":"明定外送平台業者違反第八條及第九條預告外送人員，與其終止外送服務契約，未給予外送人員經濟補償；違反第十九條外送平台業者應為外送人員辦理參加勞工保險及勞工職業災害保險；以及違反第二十二條外送平台業者應停止指派外送人員外送服務之處罰。"},{"bill":"202110173180000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"},{"bill":"202110173190000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"},{"bill":"202110174470000","text":"外送平台業者有違反第十二條、第十九條之規定者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"本法明定外送平台業者須於外送員排班後始得派單，亦不得違反外送員意願使其維持上線狀態；政府機關因天然災害宣布全日停止上班時，應停止營業時，爰訂定違反此二條之罰則，以利強化對平台業者之約束力。"},{"bill":"202110174740000","text":"外送平臺業者將外送服務業務委託予第三人辦理，並由該第三人與外送員成立外送服務契約者，該第三人應適用本法第四條、第六條至第八條、第十條至第十七條、第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"規定平臺若將業務委託第三人執行，該第三人應比照適用本法相關義務，避免平臺以外包方式規避法律責任。"},{"bill":"202110175620000","text":"外送平臺業者違反第十二條、第十三條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第十六條第二項規定者，由中央主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十二條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙中央主管機關監督及檢查演算法者，處新臺幣十五萬元以上七十五萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第八條第三項、第九條第二項至第四項、第十條、第二十一條第一項或第二項規定。\n二、違反第六條第五項、第十一條第二項、第十四條第一項、第十九條第一項規定，經通知限期改善，屆期未改善。\n外送平臺業者違反第五條第三項、第十六條第一項、第十七條第一項、第十八條第一項規定者，經通知限期改善，屆期未改善，由目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰。\n外送平臺業者違反第十一條第一項或第二十條規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"本條明定本法各條文處罰之裁處機關及罰則。"},{"bill":"202110175920000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為促使外送員重視交通安全，明定外送員如於提供外送服務時，有違反交通主管機關認定為影響交通安全之重大行為，外送平臺業者應依交通主管機關通知要求於指定期限內，安排該外送員參加運送安全講習；未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110176760000","text":"外送平台業者違反第八條、第九條、第十九條、第二十二條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。","note":"明定外送平台業者違反第八條及第九條預告外送員，與其終止外送服務契約，未給予外送員經濟補償；違反第十九條外送平台業者應為外送員辦理參加勞工保險及勞工職業災害保險；以及違反第二十二條外送平台業者應停止指派外送員外送服務之處罰。"},{"bill":"202110176980000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為提升外送員交通安全，要求外送平臺業者對於有重大交通違規行為之外送員，通知其於期限內完成運送安全講習，否則不得繼續提供服務。"},{"bill":"202110177680000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為促使外送員重視交通安全，明定外送員如於提供外送服務時，有違反交通主管機關認定為影響交通安全之重大行為，外送平臺業者應依交通主管機關通知要求於指定期限內，安排該外送員參加運送安全講習；未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110178160000","text":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","note":"為促使外送員重視交通安全，明定外送員如於提供外送服務時，有違反交通主管機關認定為影響交通安全之重大行為，外送平臺業者應依交通主管機關通知要求於指定期限內，安排該外送員參加運送安全講習；未完成者，外送平臺業者不得使其提供外送服務。"},{"bill":"202110181420000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十八條至第二十一條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"}],"changed":true,"final":"外送員於提供外送服務時，因違反交通主管機關認定有重大影響交通安全之行為時，外送平臺業者應依通知改善期內完成實施外送員運送安全講習，於完成講習前，外送平臺業者不得使其提供外送服務。","finalWhy":"為促使外送員重視交通安全，明定外送員如於提供外送服務時，有違反交通主管機關認定為影響交通安全之重大行為，外送平臺業者應依交通主管機關通知要求於指定期限內，安排該外送員參加運送安全講習；未完成者，外送平臺業者不得使其提供外送服務。","review":{"note":"照委員劉建國等16人提案通過","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第四條至第十二條、第十五條至第十七條、第二十條至第二十三條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。"}},{"no":"第二十四條","current":null,"versions":[{"bill":"202110017580000","text":"外送平台業者違反第十一條、第十六條至第十八條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者違反第十四條、第十五條、第二十條及第二十一條之規定，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，未提供書面契約或電磁紀錄予外送員、合作商家收執；未保存及提供第十六條至第十八條各款紀錄予有關機關、合作商家、外送員之處罰。\n二、明定外送平台業者違反第十四條、第十五條、第二十條及第二十一條規定之處罰。\n三、明定外送平台業者拒絕、規避或妨礙中央主管機關監督之處罰。"},{"bill":"202110060450000","text":"外送平台業者違反第十一條、第十六條至第十八條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者違反第十四條、第十五條、第二十條及第二十一條之規定，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，未提供書面契約或電磁紀錄予外送員、合作商家收執；未保存及提供第十六條至第十八條各款紀錄予有關機關、合作商家、外送員之處罰。\n二、明定外送平台業者違反第十四條、第十五條、第二十條及第二十一條規定之處罰。\n三、明定外送平台業者拒絕、規避或妨礙中央主管機關監督之處罰。"},{"bill":"202110099010000","text":"外送平台業者違反第八條、第九條、第二十條、第二十三條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者違反第十條規定，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"一、明定外送平台業者違反第八條及第九條預告外送員，與其終止外送服務契約，未給予外送員經濟補償；違反第二十條外送平台業者應為外送員辦理參加勞工保險及勞工職業災害保險；以及違反第二十三條外送平台業者應停止指派外送員外送服務之處罰。\n二、政府機關因天然災害宣布全日停止上班時，外送平台業者應停止營業，明定外送平台業者違反之處罰。"},{"bill":"202110167670000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"明定本法施行細則之訂定機關，又外送員權益保障及外送平臺管理業務乃跨部會協調合作工作，應辦理事項涉及中央各目的事業主管機關職掌，故中央主管機關訂定本法施行細則時，應會商中央各目的事業主管機關。"},{"bill":"202110168030000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"明定本法施行細則之訂定機關，又外送員權益保障及外送平臺管理業務乃跨部會協調合作工作，應辦理事項涉及中央各目的事業主管機關職掌，故中央主管機關訂定本法施行細則時，應會商中央各目的事業主管機關。"},{"bill":"202110168140000","text":"外送平台業者違反第十一條、第十六條至第十八條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者違反第十四條、第十五條、第二十條及第二十一條之規定，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，未提供書面契約或電磁紀錄予外送員、合作商家收執；未保存及提供第十六條至第十八條各款紀錄予有關機關、合作商家、外送員之處罰。\n二、明定外送平台業者違反第十四條、第十五條、第二十條及第二十一條規定之處罰。\n三、明定外送平台業者拒絕、規避或妨礙中央主管機關監督之處罰。"},{"bill":"202110168240000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"明定本法施行細則之訂定機關，又外送員權益保障及外送平臺管理業務乃跨部會協調合作工作，應辦理事項涉及中央各目的事業主管機關職掌，故中央主管機關訂定本法施行細則時，應會商中央各目的事業主管機關。"},{"bill":"202110169580000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"明定本法施行細則之訂定機關，又外送員權益保障及外送平臺管理業務乃跨部會協調合作工作，應辦理事項涉及中央各目的事業主管機關職掌，故中央主管機關訂定本法施行細則時，應會商中央各目的事業主管機關。"},{"bill":"202110170380000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"明定本法施行細則之訂定機關，又外送員權益保障及外送平臺管理業務乃跨部會協調合作工作，應辦理事項涉及中央各目的事業主管機關職掌，故中央主管機關訂定本法施行細則時，應會商中央各目的事業主管機關。"},{"bill":"202110171160000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"明定本法施行細則之訂定機關，又外送員權益保障及外送平臺管理業務乃跨部會協調合作工作，應辦理事項涉及中央各目的事業主管機關職掌，故中央主管機關訂定本法施行細則時，應會商中央各目的事業主管機關。"},{"bill":"202110170780000","text":"外送平台業者違反第十一條、第十六條至第十八條之規定，經通知限期改善，屆期未改善者，處新臺幣五萬元以上五十萬元以下罰鍰。\n外送平台業者違反第十四條、第十五條、第二十條及第二十一條之規定，處新臺幣十萬元以上一百萬元以下罰鍰。\n外送平台業者拒絕、規避或妨礙中央主管機關監督者，處新臺幣二十萬元以上二百萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，未提供書面契約或電磁紀錄予外送員、合作商家收執；未保存及提供第十六條至第十八條各款紀錄予有關機關、合作商家、外送員之處罰。\n二、明定外送平台業者違反第十四條、第十五條、第二十條及第二十一條規定之處罰。\n三、明定外送平台業者拒絕、規避或妨礙中央主管機關監督之處罰。"},{"bill":"202110173040000","text":"外送平台業者違反第十一條、第十六條至第十八條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者違反第十四條、第十五條、第二十條及第二十一條之規定，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，未提供書面契約或電磁紀錄予外送人員、合作商家收執；未保存及提供第十六條至第十八條各款紀錄予有關機關、合作商家、外送人員之處罰。\n二、明定外送平台業者違反第十四條、第十五條、第二十條及第二十一條規定之處罰。\n三、明定外送平台業者拒絕、規避或妨礙中央主管機關監督之處罰。"},{"bill":"202110173190000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"明定本法施行細則之訂定機關，又外送員權益保障及外送平臺管理業務乃跨部會協調合作工作，應辦理事項涉及中央各目的事業主管機關職掌，故中央主管機關訂定本法施行細則時，應會商中央各目的事業主管機關。"},{"bill":"202110174470000","text":"外送平台業者有違反第十四條、第十五條之規定，處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平台業者有違反第十九條之規定，且外送員於執行外送服務過程中死亡者，處新臺幣二十萬元以上一百萬元以下罰鍰。","note":"一、外送平台業者應依第十四條相關之規定，應敘明理由並於三十日前預告外送員，始得終止與外送員之外送服務契約；第十五條則為因可歸責之事由，終止外送服務契約時應提供外送員經濟補償，爰明定違反此二條之罰則。\n二、明定外送平台業者違反第十九條之規定，且外送員因執行外送服務過程中死亡時之處罰。"},{"bill":"202110174740000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"授權中央主管機關會商相關部會訂定施行細則，以利制度執行與細節補充。"},{"bill":"202110175620000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第六條至第十四條、第十九條至第二十二條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"本條明定承接外送平臺業者所委託外送業務之第三人，亦應適用之外送員權益保障相關規範。"},{"bill":"202110175920000","text":"外送平臺業者違反第十一條、第十五條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十三條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定，由主管機關處新臺幣三萬元以上三十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，由主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第四條第五項、第十二條第一項、第十四條第三項、第十八條第一項、第十九條第一項或第二十條第一項規定，經通知限期改善，屆期未改善。\n二、違反第二十二條第一項、第二項有關交通安全或食品衛生安全教育訓練之規定，經通知限期改善，屆期未改善。\n三、違反第五條第二項至第五項、第八條第三項、第九條或第十條規定。\n外送平臺業者違反第二十二條第一項、第二項有關職業安全衛生教育訓練之規定，依職業安全衛生法相關規定處罰。","note":"一、明定本法各條文處罰之裁處機關及罰則。關於主管機關之處罰權責，將另於本法施行細則明定中央主管機關及地方主管機關之分工。\n二、第一項明定外送平臺業者違反第十一條外送員離線休息保障、第十五條天然災害停止營業之處罰。\n三、第二項明定外送平臺業者違反第二十三條，於外送員有違反交通主管機關重大影響交通安全行為，未完成講習前，即使其提供外送服務之處罰。\n四、參考職業安全衛生法第三十七條規定，於第三項明定外送平臺業者違反第二十一條職業災害通報、實施事故調查、分析及作成紀錄規定之處罰。\n五、第四項明定外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄之處罰。\n六、第五項規定，說明如下：\n(一)第一款明定外送平臺業者違反第四條第五項提供外送服務契約、第十二條第一項職業災害保險保費負擔、第十四條第三項提供外送合作契約、第十八條第一項、第十九條第一項及第二十條第一項有關消費者、合作商家及外送員紀錄保存等規定之處罰。\n(二)第二款明定外送平臺業者違反第二十二條第一項、第二項有關交通安全及食品衛生安全教育訓練規定之處罰。\n(三)第三款明定外送平臺業者違反第五條第二項至第五項外送員基本報酬保障、報酬給付及明細表提供及置備報酬清冊、第八條第三項未依規定發給外送員經濟補償、第九條建立申訴制度、第十條未依規定投保團體傷害保險及責任保險之處罰。\n七、另查本法第二十二條職業安全衛生教育訓練，已於職業安全衛生法第三十二條第一項訂有相同規範，並於同法第四十五條第一款訂定處罰規定，爰於本條第六項明定外送平臺業者違反規定者，依職業安全衛生法第四十五條第一款規定處罰。"},{"bill":"202110176760000","text":"外送平台業者違反第十一條、第十六條至第十八條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者違反第十四條、第十五條、第二十條及第二十一條之規定，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第十一條，未提供書面契約或電磁紀錄予外送員、合作商家收執；未保存及提供第十六條至第十八條各款紀錄予有關機關、合作商家、外送員之處罰。\n二、明定外送平台業者違反第十四條、第十五條、第二十條及第二十一條規定之處罰。\n三、明定外送平台業者拒絕、規避或妨礙中央主管機關監督之處罰。"},{"bill":"202110176980000","text":"外送平臺業者違反第十一條、第十五條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十三條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定者，由主管機關處新臺幣三萬元以上三十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，由主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第四條第五項、第十二條第一項、第十四條第三項、第十八條第一項、第十九條第一項或第二十條第一項規定，經通知限期改善，屆期未改善。\n二、違反第二十二條第一項、第二項有關交通安全或食品衛生安全教育訓練之規定，經通知限期改善，屆期未改善。\n三、違反第五條第二項至第五項、第八條第三項、第九條或第十條規定。\n外送平臺業者違反第二十二條第一項、第二項有關職業安全衛生教育訓練之規定，依職業安全衛生法相關規定處罰。\n外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"規範外送平臺業者違反本法相關規定之行政處罰，以確保本法具有實質執行效果。"},{"bill":"202110177680000","text":"外送平臺業者違反第十一條、第十五條規定者，由直轄市、縣市主管機關處新臺幣二十萬元以上一百萬元以下罰鍰。\n外送平臺業者違反第二十三條規定者，由交通主管機關處新臺幣二十萬元以上一百萬元以下罰鍰。\n外送平臺業者違反第二十一條規定，由主管機關處新臺幣五萬元以上五十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣五萬元以上二十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，由主管機關或目的事業主管機關處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第四條第五項、第十二條第一項、第十四條第三項、第十八條第一項、第十九條第一項或第二十條第一項規定，經通知限期改善，屆期未改善。\n二、違反第二十二條第一項、第二項有關交通安全或食品衛生安全教育訓練之規定，經通知限期改善，屆期未改善。\n三、違反第五條第二項至第五項、第八條第三項、第九條或第十條規定。\n外送平臺業者違反第二十二條第一項、第二項有關職業安全衛生教育訓練之規定依職業安全衛生法相關規定處罰。","note":"一、明定本法各條文處罰之裁處機關及罰則。關於主管機關之處罰權責，將另於本法施行細則明定中央主管機關及地方主管機關之分工。\n二、第一項明定外送平臺業者違反第十一條外送員離線休息保障、第十五條天然災害停止營業之處罰。\n三、第二項明定外送平臺業者違反第二十三條，於外送員有違反交通主管機關重大影響交通安全行為，未完成講習前，即使其提供外送服務之處罰。\n四、參考職業安全衛生法第三十七條規定，於第三項明定外送平臺業者違反第二十一條職業災害通報、實施事故調查、分析及作成紀錄規定之處罰。\n五、第四項明定外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄之處罰。\n六、第五項規定說明如下：\n(一)第一款明定外送平臺業者違反第四條第五項提供外送服務契約、第十二條第一項職業災害保險保費負擔、第十四條第三項提供外送合作契約、第十八條第一項、第十九條第一項及第二十條第一項有關消費者、合作商家及外送員紀錄保存等規定之處罰。\n(二)第二款明定外送平臺業者違反第二十二條第一項、第二項有關交通安全及食品衛生安全教育訓練規定之處罰。\n(三)第三款明定外送平臺業者違反第五條第二項至第五項外送員基本報酬保障、報酬給付及明細表提供及置備報酬清冊、第八條第三項未依規定發給外送員經濟補償、第九條建立申訴制度、第十條未依規定投保團體傷害保險及責任保險之處罰。\n七、另查本法第二十二條職業安全衛生教育訓練，已於職業安全衛生法第三十二條第一項訂有相同規範，並於同法第四十五條第一款訂定處罰規定，爰於本條第六項明定外送平臺業者違反規定者，依職業安全衛生法第四十五條第一款規定處罰。"},{"bill":"202110178160000","text":"外送平臺業者違反第十一條、第十五條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十三條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定，由主管機關處新臺幣三萬元以上三十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，由主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第四條第五項、第十二條第一項、第十四條第三項、第十八條第一項、第十九條第一項或第二十條第一項規定，經通知限期改善，屆期未改善。\n二、違反第二十二條第一項、第二項有關交通安全或食品衛生安全教育訓練之規定，經通知限期改善，屆期未改善。\n三、違反第五條第二項至第五項、第八條第三項、第九條或第十條規定。\n外送平臺業者違反第二十二條第一項、第二項有關職業安全衛生教育訓練之規定，依職業安全衛生法相關規定處罰。","note":"一、明定本法各條文處罰之裁處機關及罰則。關於主管機關之處罰權責，將另於本法施行細則明定中央主管機關及地方主管機關之分工。\n二、第一項明定外送平臺業者違反第十一條外送員離線休息保障、第十五條天然災害停止營業之處罰。\n三、第二項明定外送平臺業者違反第二十三條，於外送員有違反交通主管機關重大影響交通安全行為，未完成講習前，即使其提供外送服務之處罰。\n四、參考職業安全衛生法第三十七條規定，於第三項明定外送平臺業者違反第二十一條職業災害通報、實施事故調查、分析及作成紀錄規定之處罰。\n五、第四項明定外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄之處罰。\n六、第五項規定，說明如下：\n(一)第一款明定外送平臺業者違反第四條第五項提供外送服務契約、第十二條第一項職業災害保險保費負擔、第十四條第三項提供外送合作契約、第十八條第一項、第十九條第一項及第二十條第一項有關消費者、合作商家及外送員紀錄保存等規定之處罰。\n(二)第二款明定外送平臺業者違反第二十二條第一項、第二項有關交通安全及食品衛生安全教育訓練規定之處罰。\n(三)第三款明定外送平臺業者違反第五條第二項至第五項外送員基本報酬保障、報酬給付及明細表提供及置備報酬清冊、第八條第三項未依規定發給外送員經濟補償、第九條建立申訴制度、第十條未依規定投保團體傷害保險及責任保險之處罰。\n七、另查本法第二十二條職業安全衛生教育訓練，已於職業安全衛生法第三十二條第一項訂有相同規範，並於同法第四十五條第一款訂定處罰規定，爰於本條第六項明定外送平臺業者違反規定者，依職業安全衛生法第四十五條第一款規定處罰。"},{"bill":"202110181420000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"明定本法施行細則之訂定機關，又外送員權益保障及外送平臺管理業務乃跨部會協調合作工作，應辦理事項涉及中央各目的事業主管機關職掌，故中央主管機關訂定本法施行細則時，應會商中央各目的事業主管機關。"}],"changed":true,"final":"外送平臺業者違反第十一條、第十五條規定者，由直轄市、縣（市）主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十三條規定者，由交通主管機關處新臺幣十萬元以上五十萬元以下罰鍰。\n外送平臺業者違反第二十一條規定，由主管機關處新臺幣三萬元以上三十萬元以下罰鍰。\n外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄者，處新臺幣三萬元以上十五萬元以下罰鍰。\n外送平臺業者有下列情形之一者，由主管機關或目的事業主管機關處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第四條第五項、第十二條第一項、第十四條第三項、第十八條第一項、第十九條第一項或第二十條第一項規定，經通知限期改善，屆期未改善。\n二、違反第二十二條第一項、第二項有關交通安全及食品衛生安全教育訓練之規定，經通知限期改善，屆期未改善。\n三、違反第五條第一項、第三項至第五項、第八條第三項、第九條或第十條規定。\n外送平臺業者違反第二十二條第一項、第二項有關職業安全衛生教育訓練之規定，依職業安全衛生法相關規定處罰。","finalWhy":"一、明定本法各條文處罰之裁處機關及罰則。關於主管機關之處罰權責，將另於本法施行細則明定中央主管機關及地方主管機關之分工。\n二、第一項明定外送平臺業者違反第十一條外送員離線休息保障、第十五條天然災害停止營業之處罰。\n三、第二項明定外送平臺業者違反第二十三條，於外送員有違反交通主管機關重大影響交通安全行為，未完成講習前，即使其提供外送服務之處罰。\n四、參考職業安全衛生法第三十七條規定，於第三項明定外送平臺業者違反第二十一條職業災害通報、實施事故調查、分析及作成紀錄規定之處罰。\n五、第四項明定外送平臺業者拒絕、規避或妨礙主管機關、目的事業主管機關監督、檢查及調閱紀錄之處罰。\n六、第五項規定，說明如下：\n(一)第一款明定外送平臺業者違反第四條第五項提供外送服務契約、第十二條第一項職業災害保險保費負擔、第十四條第三項提供外送合作契約、第十八條第一項、第十九條第一項及第二十條第一項有關消費者、合作商家及外送員紀錄保存等規定之處罰。\n(二)第二款明定外送平臺業者違反第二十二條第一項、第二項有關交通安全及食品衛生安全教育訓練規定之處罰。\n(三)第三款明定外送平臺業者違反第五條第一項、第三項至第五項外送員基本報酬保障、報酬給付、明細表提供及置備報酬清冊、第八條第三項發給外送員經濟補償、第九條建立申訴制度及不得對申訴人為不利決定、第十條投保團體傷害保險及責任保險之處罰。\n七、另查本法第二十二條職業安全衛生教育訓練，已於職業安全衛生法第三十二條第一項訂有相同規範，並於同法第四十五條第一款訂定處罰規定，爰於第六項明定外送平臺業者違反規定者，依職業安全衛生法第四十五條第一款規定處罰。","review":{"note":"照委員劉建國等16人提案通過","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。"}},{"no":"第二十五條","current":null,"versions":[{"bill":"202110017580000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110060450000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110099010000","text":"外送平台業者違反第十二條、第十七條至第十九條之規定，經通知限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者違反第十五條、第十六條、第二十一條及第二十二條之規定，處新臺幣二萬元以上十萬元以下罰鍰。\n外送平台業者拒絕、規避或妨礙中央主管機關監督者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、明定外送平台業者違反第十二條，未提供書面契約或電磁紀錄予外送員、合作商家收執；未保存及提供第十七條至第十九條各款紀錄予有關機關、合作商家、外送員之處罰。\n二、明定外送平台業者違反第十五條、第十六條、第二十一條及第二十二條規定之處罰。\n三、明定外送平台業者拒絕、規避或妨礙中央主管機關監督之處罰。"},{"bill":"202110167670000","text":"本法自公布後六個月施行。","note":"施行日期。"},{"bill":"202110168030000","text":"本法自公布後六個月施行。","note":"施行日期。"},{"bill":"202110168140000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110168240000","text":"本法自公布後六個月施行。","note":"施行日期。"},{"bill":"202110169580000","text":"本法自公布後六個月施行。","note":"施行日期。"},{"bill":"202110170380000","text":"本法施行日期由行政院定之。","note":"施行日期。"},{"bill":"202110171160000","text":"本法自公布後六個月施行。","note":"施行日期。"},{"bill":"202110170780000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110173040000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110173190000","text":"本法自公布後六個月施行。","note":"施行日期。"},{"bill":"202110174470000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110174740000","text":"本法自公布後六個月施行。","note":"明定施行日期為公布後六個月，以預留平臺業者調整及主管機關法規配套期程。"},{"bill":"202110175620000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"本條明定本法施行細則之訂定機關。"},{"bill":"202110175920000","text":"外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定影響名譽之行政罰，以達制裁違法外送平臺業者之效，並使社會大眾獲得處罰資訊之權利。"},{"bill":"202110176760000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110176980000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第四條至第十二條、第十五條至第十七條、第二十條至第二十三條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"承接外送平臺委託業務之第三方亦須遵守本法相關規定，以確保外送員保障不因外包模式而受影響。"},{"bill":"202110177680000","text":"外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定影響名譽之行政罰，以達制裁違法外送平臺業者之效，並使社會大眾獲得處罰資訊之權利。"},{"bill":"202110178160000","text":"外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","note":"明定影響名譽之行政罰，以達制裁違法外送平臺業者之效，並使社會大眾獲得處罰資訊之權利。"},{"bill":"202110181420000","text":"本法自公布後六個月施行。","note":"施行日期。"}],"changed":true,"final":"外送平臺業者違反本法經處以罰鍰者，主管機關或目的事業主管機關應公布其名稱、負責人姓名、處分日期、違反條文及罰鍰金額，並限期令其改善，屆期未改善者，按次處罰。","finalWhy":"明定影響名譽之行政罰，以達制裁違法外送平臺業者之效，並使社會大眾獲得處罰資訊之權利。","review":{"note":"照委員劉建國等16人提案通過","text":"本法自公布後六個月施行。"}},{"no":"第二十六條","current":null,"versions":[{"bill":"202110099010000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110175620000","text":"本法自公布後六個月施行。","note":"施行日期。"},{"bill":"202110175920000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第四條至第十二條、第十五條至第十七條、第二十條至第二十三條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定凡承接外送平臺業者委託辦理外送業務之第三方業者，亦應遵守本法有關外送員權益保障相關規範，避免外送平臺業者藉此方式規避本法適用，確保外送員權益之維護。"},{"bill":"202110176980000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"授權中央主管機關訂定本法施行細則。"},{"bill":"202110177680000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第四條至第十二條、第十五條至第十七條、第二十條至第二十三條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定凡承接外送平臺業者委託辦理外送業務之第三方業者，亦應遵守本法有關外送員權益保障相關規範，避免外送平臺業者藉此方式規避本法適用，確保外送員權益之維護。"},{"bill":"202110178160000","text":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第四條至第十二條、第十五條至第十七條、第二十條至第二十三條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","note":"明定凡承接外送平臺業者委託辦理外送業務之第三方業者，亦應遵守本法有關外送員權益保障相關規範，避免外送平臺業者藉此方式規避本法適用，確保外送員權益之維護。"}],"changed":true,"final":"外送平臺業者將外送服務業務委託予第三人，並由其與外送員成立外送服務契約者，該第三人適用第四條至第十二條、第十五條至第十七條、第二十條至第二十三條及其罰則規定。\n前項第三人與外送員間具有僱傭關係者，依第一條第二項但書規定辦理。","finalWhy":"一、為避免外送平臺業者藉由委託第三方業者辦理外送服務業務之方式規避本法適用，於第一項明定受委託之第三方業者亦應遵守本法有關外送員權益保障相關規範，以確保外送員權益。\n二、於第二項明定受委託辦理外送服務業務之第三方業者與外送員間具僱傭關係者，依第一條第二項但書規定辦理。","review":null},{"no":"第二十七條","current":null,"versions":[{"bill":"202110175920000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"授權中央主管機關訂定本法施行細則。"},{"bill":"202110176980000","text":"本法自公布後六個月施行。","note":"施行日期。"},{"bill":"202110177680000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"授權中央主管機關訂定本法施行細則。"},{"bill":"202110178160000","text":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","note":"授權中央主管機關訂定本法施行細則。"}],"changed":true,"final":"本法施行細則，由中央主管機關會商各中央目的事業主管機關定之。","finalWhy":"授權中央主管機關訂定本法施行細則。","review":null},{"no":"第二十八條","current":null,"versions":[{"bill":"202110175920000","text":"本法自公布後六個月施行。","note":"明定本法施行日期。"},{"bill":"202110177680000","text":"本法自公布後六個月施行。","note":"明定本法施行日期。"},{"bill":"202110178160000","text":"本法自公布後六個月施行。","note":"明定本法施行日期。"}],"changed":true,"final":"本法自公布後六個月施行。","finalWhy":"明定本法施行日期。","review":null}],"stages":[{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110017580000","gazref":"113卷014期5196號 3-3頁"},{"date":"2024-07-05","stage":"一讀","code":"院會-11-1-21","bill":"202110060450000","gazref":"113卷066期5248號 4-4頁"},{"date":"2024-07-05","stage":"一讀","code":"院會-11-1-21","bill":"202110060680000","gazref":"113卷066期5248號 4-4頁"},{"date":"2024-07-05","stage":"一讀","code":"院會-11-1-21","bill":"202110060360000","gazref":"113卷066期5248號 4-4頁"},{"date":"2024-11-08","stage":"一讀","code":"院會-11-2-8","bill":"202110075210000","gazref":"113卷091期5273號一冊 23-23頁"},{"date":"2025-03-21","stage":"一讀","code":"院會-11-3-6","bill":"202110099010000","gazref":"114卷028期5321號 34-35頁"},{"date":"2025-10-22","code":"委員會-11-4-26-6","title":"第11屆第4會期社會福利及衛生環境委員會第6次全體委員會議","gazref":"114卷088期5381號一冊 111-111,114-205頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2025101762/details?meetingDate=114/10/22","full":["https://ivod.ly.gov.tw/Play/Full/1M/16970"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/SittingComm <script>

function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));

}

function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排

}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照

function people(p, role, label) {   // 一列名單：姓名後面標黨籍

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });

    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
