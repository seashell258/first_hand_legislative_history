<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貨物稅條例修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

,"arts":["第十二條之三"]},{"id":"202110163900000","who":"台灣民眾黨黨團","date":"2025-10-14","name":"「貨物稅條例第十二條之三、第十二條之五及第十二條之六條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110163900000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00191.pdf","proposers":["黃珊珊","黃國昌","張啓楷","陳昭姿"],"ncosign":0,"people":[["黃珊珊","民眾黨","提案"],["黃國昌","民眾黨","提案"],["張啓楷","民眾黨","提案"],["陳昭姿","民眾黨","提案"]],"party":[["民眾黨",4]],"reason":"本院台灣民眾黨黨團，鑑於近年國內時常發生因高齡、疾病或操作不慎等因素，導致車輛暴衝或駕駛分心而釀成嚴重交通事故之事件，社會大眾對行車安全風險深感憂慮。為強化防患於未然之交通安全措施，應積極導入包括緊急煞車輔助系統（AEB）及油門誤踩抑制裝置等主動式安全科技，以降低人為錯誤造成的事故風險。我國自一百十二年起已全面強制新型大客車配備緊急煞車輔助系統，此外日本、美國均已訂定時程，逐步要求市售新車標配該系統，以確保用路人安全。惟配備先進主動安全系統恐提高新車價格，宜提供誘因鼓勵民眾優先選購該類車輛；同時，為鼓勵加速將老舊大客車汰換為新型環保、且配有安全系統之大客車，維繫國人生命安全及觀光品質；以及延續電動車輛之免徵貨物稅優惠至2030年，爰擬具「貨物稅條例第十二條之三、第十二條之五及第十二條之六條文修正草案」。是否有當？敬請公決。","arts":["第十二條之三","第十二條之五","第十二條之六"]},{"id":"202110165200000","who":"委員林思銘等22人","date":"2025-10-17","name":"「貨物稅條例第十二條之三條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110165200000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00192.pdf","proposers":["林思銘","林沛祥","謝龍介","羅廷瑋","蘇清泉","牛煦庭","廖偉翔"],"ncosign":15,"people":[["林思銘","國民黨","提案"],["林沛祥","國民黨","提案"],["謝龍介","國民黨","提案"],["羅廷瑋","國民黨","提案"],["蘇清泉","國民黨","提案"],["牛煦庭","國民黨","提案"],["廖偉翔","國民黨","提案"],["葉元之","國民黨","連署"],["林德福","國民黨","連署"],["黃珊珊","民眾黨","連署"],["賴士葆","國民黨","連署"],["葛如鈞","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["馬文君","國民黨","連署"],["洪孟楷","國民黨","連署"],["萬美玲","國民黨","連署"],["林倩綺","國民黨","連署"],["王鴻薇","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["陳永康","國民黨","連署"],["顏寬恒","國民黨","連署"],["邱鎮軍","國民黨","連署"]],"party":[["國民黨",21],["民眾黨",1]],"reason":"本院委員林思銘、林沛祥、謝龍介、羅廷瑋、蘇清泉、牛煦庭、廖偉翔等22人，鑑於審計部的報告指出，電動車普及進展有限，截至2024年底，市售電動小客車占比仍未突破兩成，恐影響長期電動化推動成效。此外，交通部也訂下於2030年，能達成電動計程車普及率50%、電動小貨車普及率5%與電動大貨車600輛等目標。因此為持續鼓勵國人購買電動車輛，推動車輛運具電動化及無碳化，並支持國內電動車輛相關產業發展，爰擬具「貨物稅條例第十二條之三條文修正草案」，延長電動車輛減免貨物稅優惠期限。是否有當？敬請公決。","arts":["第十二條之三"]},{"id":"202110165280000","who":"委員吳沛憶等16人","date":"2025-10-17","name":"「貨物稅條例第十二條之三條文修正草案 文修正草案」，延長電動車輛減免徵貨物稅實施期限5年至119年12月31日止；另刪除有關授權行政院得視實際推展情況決定是否延長減免年限之規定。是否有當？敬請公決。","arts":["第十二條之三"]},{"id":"202110173070000","who":"委員林月琴等19人","date":"2025-11-21","name":"「貨物稅條例第十二條之三條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110173070000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00208.pdf","proposers":["林月琴"],"ncosign":18,"people":[["林月琴","民進黨","提案"],["蔡易餘","民進黨","連署"],["張雅琳","民進黨","連署"],["莊瑞雄","民進黨","連署"],["陳亭妃","民進黨","連署"],["黃秀芳","民進黨","連署"],["王義川","民進黨","連署"],["吳沛憶","民進黨","連署"],["張宏陸","民進黨","連署"],["蘇巧慧","民進黨","連署"],["鍾佳濱","民進黨","連署"],["沈伯洋","民進黨","連署"],["黃捷","民進黨","連署"],["陳素月","民進黨","連署"],["陳俊宇","民進黨","連署"],["陳瑩","民進黨","連署"],["林淑芬","民進黨","連署"],["劉建國","民進黨","連署"],["林宜瑾","民進黨","連署"]],"party":[["民進黨",19]],"reason":"本院委員林月琴等19人，鑑於貨物稅條例（以下簡稱本條例）於三十五年八月十六日制定公布，其間歷經多次修正，最近一次修正公布日期為一百十四年九月五日。為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，現行本條例第十二條之三第二項規定，自一百零六年一月二十八日起至一百十年十二月三十一日止（行政院一百十年十一月十五日院臺財字第一一○○一九二一五三號令延長至一百十四年十二月三十一日止），購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。該措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰擬具「貨物稅條例第十二條之三條文修正草案」，第二項定明購買完全以電能為動力之電動車輛並完成登記者，減免徵貨物稅實施期限延長至一百十九年十二月三十一日止；並考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，該措施與一百十四年九月五日修正公布本條例第十二條之五新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項有關授權行政院得決定是否延長減免年限之規定。是否有當？敬請公決。","arts":["第十二條之三"]},{"id":"202110175880000","who":"委員陳俊宇等20人","date":"2025-11-28","name":"「貨物稅條例第十二條之三條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110175880000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00209.pdf","proposers":["陳俊宇","伍麗華Saidhai‧Tahovecahe"],"ncosign":18,"people":[["陳俊宇","民進黨","提案"],["伍麗華Saidhai‧Tahovecahe","民進黨","提案"],["林月琴","民進黨","連署"],["陳秀寳","民進黨","連署"],["李昆澤","民進黨","連署"],["許智傑","民進黨","連署"],["王美惠","民進黨","連署"],["林俊憲","民進黨","連署"],["李坤城","民進黨","連署"],["黃捷","民進黨","連署"],["賴惠員","民進黨","連署"],["王定宇","民進黨","連署"],["郭國文","民進黨","連署"],["王義川","民進黨 連署"],["萬美玲","國民黨","連署"],["翁曉玲","國民黨","連署"],["邱鎮軍","國民黨","連署"],["牛煦庭","國民黨","連署"],["林思銘","國民黨","連署"],["羅智強","國民黨","連署"],["林倩綺","國民黨","連署"],["顏寬恒","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["張嘉郡","國民黨","連署"],["葛如鈞","國民黨","連署"]],"party":[["國民黨",17]],"reason":"本院委員徐巧芯、羅廷瑋、廖偉翔等17人，鑑於政府透過貨物稅減免措施鼓勵民眾選購純電動車，以推動運具電動化、達成淨零排放目標且有一定成效，為持續促進節能減碳並配合減排政策，爰擬具「貨物稅條例第十二條之三條文修正草案」，延長電動車輛減免貨物稅優惠期限。是否有當？敬請公決。","arts":["第十二條之三"]},{"id":"202110177490000","who":"委員陳菁徽等23人","date":"2025-12-12","name":"「貨物稅條例第十二條之三條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110177490000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00212.pdf","proposers":["陳菁徽"],"ncosign":7,"people":[["陳菁徽","國民黨","提案"],["蘇清泉","國民黨","連署"],["張智倫","國民黨","連署"],["顏寬恒","國民黨","連署"],["謝龍介","國民黨","連署"],["黃仁","國民黨","連署"],["邱鎮軍","國民黨","連署"],["盧縣一","國民黨","連署"]],"party":[["國民黨",8]],"reason":"本院委員陳菁徽等23人，鑑於「二○五○淨零排放」已是國家既定方針，其中「二○三○運具電動化」更是關鍵里程碑。惟電動車輛雖為綠色運輸趨勢，目前購置成本與售價仍普遍高於燃油車，形成民眾入手之主要門檻。為有效縮短油電價格差距，落實政府引導民眾優先選擇低碳運具之政策美意，實有必要維持長期且穩定之租稅獎勵。考量現行電動車免徵貨物稅優惠將於民國一百十四年底屆期，為避免優惠中斷導致市場價格波動，影響民眾購車意願，爰擬具「貨物稅條例第十二條之三條文修正草案」。將免稅期限延長至民國一百十九年十二月三十一日，藉由減輕購車初期負擔，提升電動運具普及率，以具體行動達成國家永續交通願景。是否有當？敬請公決。","arts":["第十二條之三"]},{"id":"202110177550000","who":"委員李彥秀等17人","date":"2025-12-12","name":"「貨物稅條例第十二條之三條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110177550000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00213.pdf","proposers":["李彥秀"],"ncosign":16,"people":[["李彥秀","國民黨","提案"],["陳超明","無黨籍","連署"],["林德福","國民黨","連署"],["顏寬恒","國民黨","連署"],["廖先翔","國民黨","連署"],["邱鎮軍","國民黨","連署"],["盧縣一","國民黨","連署"],["徐欣瑩","國民黨","連署"],["張智倫","國民黨","連署"],["丁學忠","國民黨","連署"],["游顥","國民黨","連署"],["王育敏","國民黨","連署"],["葛如鈞","國民黨","連署"],["魯明哲","國民黨","連署"],["牛煦庭","國民黨","連署"],["羅明才","國民黨","連署"],["林倩綺","國民黨","連署"]],"party":[["國民黨",16],["無黨籍",1]],"reason":"本院委員李彥秀等17人，鑒於實現「2050年淨零排放」之政策目標，交通部致力推動運具電動化及無碳化，並訂定電動小客車的新售比，需分別於2030年和2040年達到30%及100%的目標，據審計部的中央政府總決算審核報告指出，截至113年底止，電動小客車的市售比僅有9.32%，顯見政策推動進度緩慢，恐難於2040年達成新售小客全面電動化之目標，因此為鼓勵國人持續購買電動車輛，爰擬具「貨物稅條例第十二條之三條文修正草案」，以延長電動車輛免徵貨物稅之租稅優惠。是否有當？敬請公決。","arts":["第十二條之三"]}],"arts":[{"no":"第五條","current":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十四年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十四年十二月三十一日止。","versions":[{"bill":"201110161350000","text":"使用牌照稅，按交通工具種類分別課徵，除機動車輛應就其種類按汽缸總排氣量或其他動力劃分等級、船舶應按其噸位，分別依第六條規定計徵外，其他交通工具之徵收率，由直轄市及縣（市）政府擬訂，提經同級民意機關通過，並報財政部備查。\n直轄市及縣（市）政府於下列期間，得對完全以電能為動力之機動車輛免徵使用牌照稅，並報財政部備查：\n一、電動汽車：自中華民國一百零一年一月六日起至一百十九年十二月三十一日止。\n二、電動機車：自中華民國一百零七年一月一日起至一百十九年十二月三十一日止。","note":"一、第一項未修正。\n二、為節能減碳，鼓勵民眾使用低污染車輛，以利我國完全以電能為動力之機動車輛（以下簡稱電動車輛）相關產業發展，達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放；又依納稅者權利保護法第六條第一項規定，租稅優惠應明定實施年限並以達成合理政策目的為限，爰修正第二項各款，將直轄市及縣（市）政府得對電動車輛免徵使用牌照稅期限，配合電動車輛減免貨物稅措施延長五年，至一百十九年十二月三十一日止。"}],"changed":false,"final":"（刪除）","finalWhy":null,"review":null},{"no":"第十二條之三","current":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","versions":[{"bill":"202110097860000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"一、修正第二項。\n二、為達成「國家溫室氣體長期減量目標為中華民國一百三十九年溫室氣體淨零排放」，並為促進電動車輛之推廣普及，爰修正第二項再延長直轄市及縣（市）政府得對完全以電能為動力之機動車輛免徵使用牌照稅期限五年。"},{"bill":"202110105300000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"修正第二項，購買完全以電能為動力之電動車輛並完成登記者，延長免徵該等車輛應徵之貨物稅期限至民國119年12月31日。"},{"bill":"202110103240000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百二十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"鑑於行政院依貨物稅條例第十二條之三第三項規定延長電動車輛減免徵貨物稅措施實施年限至114年12月31日止。然為賡續鼓勵民眾購買電動車輛，帶動電動車及相關產業發展，促進節能減碳，達成2050淨零排放目標，在119年達到電動車30%／電動機車35%的新車銷售占比，並於124年達到電動車60%／電動機車70%，最終於129年達到100%電動化的銷售比例。爰擬具「貨物稅條例第十二條之三條文修正草案」，將減徵期間延長至一百二十四年十二月三十一日止。"},{"bill":"202110124780000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"修正第二項，購買完全以電能為動力之電動車輛並完成登記者，延長免徵貨物稅期限至民國119年12月31日。"},{"bill":"201110161350000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110162740000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百二十年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"一、修正第二項。\n二、將現行電動車輛免徵貨物稅期限延長至120年12月31日止，以維持政策連續性，促進電動車普及，並協助達成國家運具電動化及淨零排放目標。"},{"bill":"202110162860000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110163070000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110163320000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現二○五○淨零排放，鼓勵民眾可購買低污染車輛，並帶動國內電動車輛相關產業發展，比照一百十四年九月五日修正公布本條例第十二條之五新購小型汽機車減徵貨物稅措施，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、考量電動車貨物稅減免政策目的已明確，而第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，爰刪除第三項規定。"},{"bill":"202110163400000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項不修正。\n二、為實現2050淨零排放之國家目標，運具電動化及無碳化為關鍵戰略之一，透過租稅及其他優惠鼓勵民眾購買電動車，除了可以減少碳排放量，更帶動汽車產業鏈轉型與發展。完稅價格140萬元以下電動小客車免徵貨物稅措施將於114年12月31日截止，考量該國際環保趨勢不變，且國內電動車占比仍低，電動車產業鏈仍在起步階段，有繼續推動之必要，爰修正第二項，將免徵貨物稅期間延長至119年12月31日。\n三、刪除第三項，租稅優惠規定以回歸法律規定為宜。"},{"bill":"202110163960000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。"},{"bill":"202110163900000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"為鼓勵消費者購買綠能電動車輛，帶動電動車及相關產業發展，及達節能減碳政策目標，爰修正本條，對於購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵貨物稅之年限延長至一百十九年十二月三十一日。"},{"bill":"202110165200000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"一、審計部的報告指出，電動車普及進展有限，截至2024年底，市售電動小客車占比仍未突破兩成，恐影響長期電動化推動成效。此外，交通部也訂下於2030年，能達成電動計程車普及率50%、電動小貨車普及率5%與電動大貨車600輛等目標。因此為持續鼓勵國人購買電動車輛，推動車輛運具電動化及無碳化，並支持國內電動車輛相關產業發展，宜延長電動車輛減免貨物稅優惠期限。\n二、爰提案修正本條第二項部分文字，購買完全以電能為動力之電動車輛並完成登記者，延長免徵貨物稅期限至一百十九年十二月三十一日止。\n三、第一項及第三項文字未修正。"},{"bill":"202110165280000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、我國已提出二○五○淨零排放路徑，並將「運具電動化及無碳化」列為關鍵戰略。為推動節能減碳並鼓勵民眾選用低污染之電動車輛，自一百零六年一月二十八日起，購買完全以電能為動力之電動車輛並完成登記者，免徵該車輛之貨物稅。此租稅優惠有助於推廣電動車、降低碳排放。考量該租稅優惠將於一百一十四年十二月三十一日屆期，且經濟部評估國內購買及使用電動車輛占比仍低，故修正本條，延長免徵貨物稅期限至一百一十九年十二月三十一日，持續提供誘因增加消費者選擇低汙染車輛之意願，並帶動國內電動車輛相關產業發展。\n三、依《納稅者權利保護法》第六條規定，租稅優惠應明定實施年限並以達成合理之政策目的為限，不得過度。爰刪除本條例第三項授權行政院得決定是否延長減免年限之規定，並與一百一十四年九月五日修正公布之同條例十二條之五新購小型汽機車減徵貨物稅實施期限一致，有利主管機關通盤考量我國車輛產業發展方向及運具電動化之政策目標。"},{"bill":"202110164070000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110166420000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、行政院國家發展委員會於111年3月30日宣布臺灣「2050淨零排放路徑」，計劃在119年達到電動車30%，並於124年達到電動車60%，最終於129年達到100%電動化的銷售比例。\n二、國際能源署「2025年全球電動車展望」報告指出，電動車113年在全球汽車市占率破20%。據審計部113年度中央政府總決算審核報告，電動小客車普及率與市售比分別為1.33%及9.32%，與全球市占率仍有差距，有賴政府賡續提供更多的租稅優惠政策。\n三、為賡續鼓勵民眾購買低污染電動車輛，配合政府淨零排放目標，原本條曾對完全以電能為動力的電動車輛，在一定汽缸排氣量及馬力限條件下免徵貨物稅，惟期限已屆，在配合實現淨零排放能夠達到30%銷售比例目標，應延續租稅優惠免徵五年，爰提修正本條第二項及刪除第三項。"},{"bill":"202110167590000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百二十年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"一、第一項未修正。\n二、修正第二項，為延續租稅優惠效益，並配合減能減碳之政策，爰修正第二項，修正為「自中華民國一百零六年一月二十八日起至一百二十年十二月三十一日止」，以穩定法制預期，實現政府之環保目標，提升社會福祉與產業競爭力。"},{"bill":"202110167040000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項不修正。\n二、為實現2050年淨零排放目標，運具電動化及無碳化為國家關鍵戰略之一。政府自106年起推動完稅價格140萬元以下電動小客車免徵貨物稅措施，以租稅誘因鼓勵民眾購買低污染車輛，減少碳排放並促進電動車產業發展。惟該措施將於114年12月31日屆期，考量國際淨零趨勢不變、國內電動車占比仍低且產業鏈仍在起步階段，爰修正第二項，將免徵貨物稅期限延長至119年12月31日止，以持續推動運具電動化及綠色轉型。\n三、考量租稅優惠應有明確時限並回歸法律規定，以利主管機關通盤檢討車輛產業發展與電動化政策，爰刪除第三項。"},{"bill":"202110167260000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110167160000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110169880000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵應徵之貨物稅；其中電動小客車免徵金額，以完稅價格新臺幣一百四十萬元計算之稅額為上限，超過部分不予免徵。本措施推動後，有助於提升電動車普及率，減少碳排放，對社會經濟及生活環境均具正面效益。為持續推動政府一百十九年運具電動化階段性目標，並實現二○五○淨零排放，爰修正第二項，將購買完全以電能為動力之電動車輛減免徵收貨物稅之期限延長至一百十九年十二月三十一日止。\n三、考量租稅優惠應明定年限並以合理政策目標為限，避免過度依賴，第二項減免年限與一百十四年九月五日修正公布之第十二條之五第一項及第四項小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤檢視我國車輛產業未來發展及運具電動化政策，爰刪除第三項規定。"},{"bill":"202110170690000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"修正第二項，購買完全以電能為動力之電動車輛並完成登記者，延長免徵貨物稅期限至民國119年12月31日。"},{"bill":"202110170720000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百二十年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，本條所定免稅措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百二十年十二月三十一日止。\n二、考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110173230000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、審計部歷年報告指出，電動車稅賦優惠措施能有效提升民眾採用意願，並有助於減碳目標之推進。現行《貨物稅條例》第十二條之三第二項，自一百零六年一月二十八日施行以來，確已帶動電動車普及，降低碳排放，對社會經濟及環境品質產生正面影響。惟租稅優惠宜設定明確期限，以利主管機關定期檢討成效。\n二、爰提出修正草案，將該減免措施期限延長至一百十九年十二月三十一日，並使其與第十二條之五小型汽機車減徵貨物稅措施同時落日。\n三、刪除第三項授權行政院自行延長之規定，以避免制度過度依賴，並確保未來政策檢討具體化、透明化。"},{"bill":"202110172880000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"修正第二項，購買完全以電能為動力之電動車輛並完成登記者，延長免徵貨物稅期限至民國119年12月31日。"},{"bill":"202110170800000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"一、氣候變遷、全球暖化是世界的重要議題，若是地球整體溫度繼續升高，將可能造成人類無法在室外工作，糧食生產受氣溫影響，導致產量不穩，從而重創人類的生存需求，甚至極端氣候將顯著降低電力系統的壽命，並隨自然環境變異，更加劇世界各地缺水問題。\n二、遂為遏止全球暖化的負面影響，世界各國協力推動「淨零碳排」的目標，以控制全球升溫現象，藉由各國政府、企業及個人的共同努力，發展再生能源、保護自然生態、鼓勵綠能交通等方式，減緩氣候變遷，維護人類生存空間。\n三、綜上所述，為達成「淨零碳排」目標，爰修正第二項，延長購買電動車免徵貨物稅之期限，鼓勵民眾購買綠能交通車，共同為「2050淨零碳排」之目標努力。"},{"bill":"202110172160000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、第二項酌調文字。為達成2050淨零排放及運具電動化階段性目標，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至119年12月31日止。\n三、刪除第三項文字。考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與114年9月5日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，以利主管機關通盤考量我國車輛產業發展方向及運具電動化政策目標。"},{"bill":"202110172680000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、基於「租稅優惠應有明確期限、定期檢討」之制度精神，本次修法將租稅優惠的期限由立法機關以法律直接明定，強化法律保留原則，並以利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110173070000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為實現政府綠能科技創新產業願景，鼓勵民眾購買低污染車輛，自一百零六年一月二十八日起至一百十四年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅，但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。本措施實施後，有助提升電動車輛普及率，有效減少碳排放量，對整體社會經濟及生活環境具正面效益。為達成政府一百十九年運具電動化階段性目標及實現二○五○淨零排放，有賡續誘導消費者選擇低污染車輛，以帶動國內電動車輛相關產業發展之必要，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。\n三、考量租稅優惠應明定實施年限並以達成合理政策目的為限，不宜過度，第二項減免年限與一百十四年九月五日修正公布第十二條之五第一項及第四項新購小型汽機車減徵貨物稅措施同時屆期，有利主管機關通盤考量我國車輛產業未來發展方向及運具電動化政策目標，爰刪除第三項規定。"},{"bill":"202110175880000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、第一項未修正。\n二、為延續政府推動運具電動化與減碳政策，現行電動車貨物稅減免措施已有效提升電動車普及率，並改善環境品質，惟為達成運具電動化及淨零排放之目標，仍需維持政策誘因，故修正第二項，將電動車貨物稅減免期限延長至一百十九年十二月三十一日。\n三、為符合租稅優惠應明定實施年限之原則，並利於整體產業與政策檢討，爰刪除第三項文字。"},{"bill":"202110176480000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、修正第二項，延長電動車輛減免徵貨物稅之實施期限5年，至民國119年12月31日止。\n二、刪除第三項授權行政院得視實際推展情況決定是否延長減免年限之規定。"},{"bill":"202110177080000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"一、修正本條第二項部分文字，延長免徵貨物稅期限至一百十九年十二月三十一日止。\n二、第一項及第三項文字未修正。"},{"bill":"202110177490000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"一、修正第二項將電動汽、機車之貨物稅及使用牌照稅實施減免措施延長至民國一百十九年十二月三十一日止。\n二、鑒於本條第二項之減免年限，與民國一百十四年九月五日修正公布之第十二條之五所定「新購小型汽、機車減徵貨物稅措施」之適用期間，同於民國一百十九年屆期。為利主管機關就我國汽車產業之整體發展方向及運具全面電動化政策目標進行通盤檢討與規劃，爰刪除第三項之規定，使相關租稅措施得以整合研議，提升政策一致性與執行效益。"},{"bill":"202110177550000","text":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","note":"行政院於111年3月30日宣布「臺灣2050淨零排放路徑」，其中，交通部負責「運具電動化及無碳化」相關政策規劃，訂定電動小客車的新售比，需分別於2030年和2040年達到30%及100%的目標，據審計部的中央政府總決算審核報告指出，截至113年底止，電動小客車的市售比僅有9.32%，考量目前小客車電動化進度緩慢，而免徵貨物稅又為鼓勵民眾購買電動車輛之最有效誘因，為有效達成2050淨零目標，爰修正第二項，延長購買完全以電能為動力之電動車輛減免徵貨物稅實施期限至一百十九年十二月三十一日止。"}],"changed":true,"final":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十九年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。","finalWhy":"","review":{"note":"保留，送院會處理","text":""}},{"no":"第十二條之五","current":"自中華民國一百十四年八月二十九日修正之本條文施行之日起至一百十九年十二月三十一日止，購買汽缸排氣量在二千立方公分以下小客車並完成新領牌照登記者，該小客車應徵之貨物稅每輛減徵新臺幣五萬元。但應徵稅額未達新臺幣五萬者，減徵稅額以應徵稅額為限。\n自中華民國一百十年一月八日起至一百十九年十二月三十一日止，報廢或出口登記滿一年且出廠十年以上之小客車、小貨車、小客貨兩用車，於報廢或出口前、後六個月內購買上開車輛新車且完成新領牌照登記者，該等新車應徵之貨物稅每輛減徵新臺幣五萬元；購買之新車符合前項規定者，應加計該項規定減徵稅額。但應徵稅額未達減徵金額之合計數者，減徵稅額以應徵稅額為限。\n配偶或二親等以內親屬購買新小客車、小貨車、小客貨兩用車且完成新領牌照登記者，適用前項規定。\n自中華民國一百十四年八月二十九日修正之本條文施行之日起至一百十九年十二月三十一日止，購買汽缸排氣量在一百五十五立方公分以下機車並完成新領牌照登記者，該機車應徵之貨物稅每輛減徵新臺幣二千元。但應徵稅額未達新臺幣二千元者，減徵稅額以應徵稅額為限。\n自中華民國一百十年一月八日起至一百十九年十二月三十一日止，報廢或出口出廠四年以上汽缸排氣量一百五十立方公分以下機車（以下簡稱中古機車），於報廢或出口前、後六個月內購買新機車且完成新領牌照登記者，該新機車應徵之貨物稅每輛定額減徵新臺幣四千元；購買之新機車符合前項規定者，應加計該項規定減徵稅額。但應徵稅額未達減徵金額之合計數者，減徵稅額以應徵稅額為限。\n依前項規定報廢或出口中古機車之車籍登記與購買新機車之新領牌照登記，不以同一人為限。\n本條減徵貨物稅案件之申請期限、申請程序、應檢附證明文件及其他相關事項之辦法，由財政部會同經濟部定之。","versions":[{"bill":"202110163900000","text":"自中華民國○年○月○日修正之本條文施行之日起至一百十九年十二月三十一日止，購買符合下列規定之車輛並完成新領牌照登記者，該車輛應徵之貨物稅每輛減徵新臺幣五萬元。但應徵稅額未達新臺幣五萬元者，減徵稅額以應徵稅額為限。\n一、配備符合財政部公告基準之緊急煞車輔助系統或油門誤踩抑制裝置之汽缸排氣量在二千零一立方公分以上小客車。\n二、配備符合財政部公告基準之緊急煞車輔助系統或油門誤踩抑制裝置之小貨車、小客貨兩用車。\n自中華民國一百十四年八月二十九日修正之本條文施行之日起至一百十九年十二月三十一日止，購買汽缸排氣量在二千立方公分以下小客車並完成新領牌照登記者，該小客車應徵之貨物稅每輛減徵新臺幣五萬元。但應徵稅額未達新臺幣五萬元者，減徵稅額以應徵稅額為限。\n自中華民國一百十年一月八日起至一百十九年十二月三十一日止，報廢或出口登記滿一年且出廠十年以上之小客車、小貨車、小客貨兩用車，於報廢或出口前、後六個月內購買上開車輛新車且完成新領牌照登記者，該等新車應徵之貨物稅每輛減徵新臺幣五萬元；購買之新車符合第一項或前項規定者，應加計該項規定減徵稅額。但應徵稅額未達減徵金額之合計數者，減徵稅額以應徵稅額為限。\n配偶或二親等以內親屬購買新小客車、小貨車、小客貨兩用車且完成新領牌照登記者，適用前項規定。\n自中華民國一百十四年八月二十九日修正之本條文施行之日起至一百十九年十二月三十一日止，購買汽缸排氣量在一百五十五立方公分以下機車並完成新領牌照登記者，該機車應徵之貨物稅每輛減徵新臺幣二千元。但應徵稅額未達新臺幣二千元者，減徵稅額以應徵稅額為限。\n自中華民國一百十年一月八日起至一百十九年十二月三十一日止，報廢或出口出廠四年以上汽缸排氣量一百五十立方公分以下機車（以下簡稱中古機車），於報廢或出口前、後六個月內購買新機車且完成新領牌照登記者，該新機車應徵之貨物稅每輛定額減徵新臺幣四千元；購買之新機車符合前項規定者，應加計該項規定減徵稅額。但應徵稅額未達減徵金額之合計數者，減徵稅額以應徵稅額為限。\n依前項規定報廢或出口中古機車之車籍登記與購買新機車之新領牌照登記，不以同一人為限。\n本條減徵貨物稅案件之申請期限、申請程序、應檢附證明文件及其他相關事項之辦法，由財政部會同經濟部定之。","note":"一、近年國內因高齡、疾病，及其他操作不慎之人為意外因素導致車輛暴衝或一時分心發生重大交通事故案件頻傳，為遏阻此類事件不斷發生，允宜運用緊急煞車輔助系統或油門誤踩抑制裝置等主動安全系統預為防範。\n二、我國已自112年起全面強制要求各型式大客車新車應裝設緊急煞車輔助系統。此外，日本、美國政府均設定期程分階段要求進口與國內生產之新車應強制配備緊急煞車輔助系統，我國政府亦已宣示研議比照，除保護駕駛及乘客外，亦可保護其他用路人。\n三、考量配備該類安全系統恐增加購買成本，為鼓勵消費者優先購買該類車輛，宜提供適度稅賦優惠，爰修正本條條文。"}],"changed":false,"final":"自中華民國一百十四年八月二十九日修正之本條文施行之日起至一百十九年十二月三十一日止，購買汽缸排氣量在二千立方公分以下小客車並完成新領牌照登記者，該小客車應徵之貨物稅每輛減徵新臺幣五萬元。但應徵稅額未達新臺幣五萬元者，減徵稅額以應徵稅額為限。\n自中華民國一百十年一月八日起至一百十九年十二月三十一日止，報廢或出口登記滿一年且出廠十年以上之小客車、小貨車、小客貨兩用車，於報廢或出口前、後六個月內購買上開車輛新車且完成新領牌照登記者，該等新車應徵之貨物稅每輛減徵新臺幣五萬元；購買之新車符合前項規定者，應加計該項規定減徵稅額。但應徵稅額未達減徵金額之合計數者，減徵稅額以應徵稅額為限。\n配偶或二親等以內親屬購買新小客車、小貨車、小客貨兩用車且完成新領牌照登記者，適用前項規定。\n自中華民國一百十四年八月二十九日修正之本條文施行之日起至一百十九年十二月三十一日止，購買汽缸排氣量在一百五十立方公分以下機車並完成新領牌照 function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;

    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }

    else { push(1, b[j]); j++; }

  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {

    else if (s[0] === 1) ins += s[1];

function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;

  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {

  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }

}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }

}

/* ---------- 提案版本 ---------- */
const partyLine = p => p.party.map(([n]) => n).join('、');
function people(p, role, label) {   // 一列名單：姓名後面標黨籍
  const list = (p.people || []).filter(x => x[2] === role);
  if (!list.length) return null;
  const box = el('div', {class: 'people'});
  list.forEach(([n, pt]) => box.append(el('span', {class: 'person'}, n, el('small', {text: pt}))));
  const peek = role === '提案' ? list.map(x => x[0]).join('、') : null;   // 只有提案人收合時預覽姓名
  return fold(label + ' ' + list.length + ' 位', box, peek);
}
function fold(label, content, peek) {   // 點開才看全文；有 peek 時收合狀態露一行預覽
  const s = el('summary', null, el('b', {text: label}));
  if (peek) s.append(el('span', {class: 'peek', text: peek}));
  return el('details', {class: 'fold'}, s, content);
}
const dlg = el('dialog', {class: 'artdlg', 'aria-labelledby': 'dlgt'});
document.body.append(dlg);
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openArticleDialog(p, no) {   // 獨立視窗看某一條的各版本，可在該提案動到的條文間切換
  dlg.textContent = '';
  const close = el('button', {type: 'button', class: 'chip', text: '關閉 ✕'});
  close.addEventListener('click', () => dlg.close());
  const nav = el('div', {class: 'chips'});
  p.arts.forEach(n => {
    const art = D.arts.find(x => x.no === n);
    const b = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-pressed': String(n === no), text: n});
    b.addEventListener('click', () => openArticleDialog(p, n));
    nav.append(b);
  });
  const body = el('div', {class: 'dlgbody'});
  const a = D.arts.find(x => x.no === no);
  if (a) {
    const bench = el('div', {class: 'bench'});
    fillBench(bench, a);
    body.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  } else body.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'}));
  dlg.append(el('div', {class: 'dlghead'}, el('div', {class: 'dlgtitle'}, el('h3', {id: 'dlgt', text: shortWho(p) + ' 提案　逐條對照'}), close), nav), body);
  if (!dlg.open) dlg.showModal();
}
function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照
  const c = el('div', {class: 'pdetail'});
  c.append(el('div', {class: 'line', text: p.date + ' 提案　' + partyLine(p)}));
  const a = people(p, '提案', '提案人'), b = people(p, '連署', '連署人');
  if (a) c.append(a);
  if (b) c.append(b);
  if (p.reason) { const r = p.reason.replace(/\n/g, ' '); c.append(fold('修法目的', el('p', {class: 'reason', text: r}))); }
  const chips = el('div', {class: 'sub'}, (ENACT ? '條文' : '修正條文' + (inProps ? '' : '（按鈕若是紅色代表真的修正了）')) + '：');
  const panel = el('div', {class: 'inbench', hidden: ''});
  let shown = null;
  p.arts.forEach(no => {
    const art = D.arts.find(x => x.no === no);
    const btn = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-expanded': 'false', text: no});
    btn.addEventListener('click', () => {
      if (inProps) { openArticleDialog(p, no); return; }
      const closing = shown === no;
      chips.querySelectorAll('button').forEach(x => x.setAttribute('aria-expanded', 'false'));
      panel.textContent = ''; panel.hidden = closing; shown = closing ? null : no;
      if (!closing) { btn.setAttribute('aria-expanded', 'true'); inlineBench(panel, no); }
    });
    chips.append(btn);
  });
  c.append(chips, panel);
  const ref = el('div', {class: 'ref'}, link(p.url, '議事網提案頁'));
  if (p.pdf) ref.append('、', link(p.pdf, '關係文書 PDF'));
  c.append(fold('資料出處', ref));
  return c;
}
D.props.forEach(p => {
  const c = el('article', {class: 'prop', id: 'prop-' + p.id});
  c.append(el('h3', {text: shortWho(p)}), propDetail(p, true));

/* ---------- 歷程與逐字稿 ---------- */
const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
function renderTranscript(box, data, s) {
  box.textContent = '';
  const clip = {}; s.clips.forEach(c => { clip[normName(c.n) + '|' + c.t] = c.u; (clip[normName(c.n)] = clip[normName(c.n)] || c.u); });
  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      d.append(who);
      if (!chair && !first.has(t.s)) first.set(t.s, d);
    }
    const put = (into, b) => {
      if (typeof b === 'string') into.append(el('p', {text: b}));
      else if (b.fold) {   // 照登的文件（提案條文全文、審查報告、機關書面報告）：收成一行
        const inner = el('div', {class: 'readout'});
        b.b.forEach(x => put(inner, x));
        into.append(fold(b.fold, inner));
        const p = b.bill && propById[b.bill];
        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});
          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));
          into.append(el('div', {class: 'readnote'}, btn));
        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));
    turns.append(d);
  });
  const idx = el('div', {class: 'idx'}, el('span', {text: '跳到發言者（' + first.size + ' 位）'}));
  const chips = el('div', {class: 'chips'});
  first.forEach((node, name) => { const b = el('button', {type: 'button', class: 'chip', text: name}); b.addEventListener('click', () => { turns.scrollTop = node.offsetTop - turns.offsetTop; }); chips.append(b); });
  idx.append(chips);
  box.append(idx, turns);
}
/* 一讀、二讀、三讀標籤的說明小框：滑鼠停留 1 秒或點一下就浮出 */
const READING = {
  '一讀': {t: '一讀會', sub: '朗讀標題、交付審查', what: '議案送進立法院後，在院會中由主席宣付朗讀議案名稱。', pts: [
    '朗讀標題後，通常會將法案交付給相關的委員會進行詳細的實質審查（例如：教育及文化委員會、司法及法制委員會等）。',
    '如果有立委提案並經 20 人以上連署、表決通過，也可以選擇「逕付二讀」（跳過委員會審查）。',
    '如果有異議，可以退回程序委員會或不予審議。']},
  '逕付二讀': {t: '逕付二讀', sub: '跳過委員會審查，直接排進院會二讀', what: '院會決定這個提案不交委員會審查（或從委員會抽出），直接進入二讀。', pts: [
    '通常在一讀報告事項時由黨團提議，院會無異議或表決通過。',
    '逕付二讀的提案多半會交黨團協商，或與已經審查完的相關提案併案處理。',
    '這一天只有主席宣告的幾句話，沒有實質討論。']},
  '二讀': {t: '二讀會', sub: '實質討論、逐條審議，最關鍵的階段', what: '委員會審查完畢，或是經逕付二讀後，將法案送到院會進行全體討論與表決。', pts: [
    '這是法案通過與否最關鍵、辯論最激烈的階段。',
    '進行廣泛討論以及逐條討論、修正。',
    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      btn.addEventListener('click', async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      });
      acts.append(btn);
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));

  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
