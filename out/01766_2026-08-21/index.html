<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>學校衛生法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

羅美玲","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["王定宇","民進黨","連署"],["沈伯洋","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳素月","民進黨","連署"],["王義川","民進黨","連署"],["沈發惠","民進黨","連署"],["邱議瑩","民進黨","連署"],["陳秀寳","民進黨","連署"],["林淑芬","民進黨","連署"],["陳冠廷","民進黨","連署"],["賴瑞隆","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員張雅琳、徐富癸、蔡易餘等17人，為強化學校廁所及相關衛生設施之實用性與友善性，並落實以學生為本之教育環境，增訂學校應建立使用者參與機制，蒐集學生意見，以強化設施設計與實際需求之連結，爰擬具「學校衛生法第二十一條條文修正草案」。是否有當？敬請公決。","arts":["第二十一條"]},{"id":"202110221460000","who":"委員徐巧芯等16人","date":"2026-06-26","name":"「學校衛生法第六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110221460000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/05/15/LCEWA01_110515_00110.pdf","proposers":["徐巧芯","廖偉翔","林沛祥","許宇甄"],"ncosign":12,"people":[["徐巧芯","國民黨","提案"],["廖偉翔","國民黨","提案"],["林沛祥","國民黨","提案"],["許宇甄","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","連署"],["黃仁","國民黨","連署"],["黃健豪","國民黨","連署"],["王鴻薇","國民黨","連署"],["黃建賓","國民黨","連署"],["傅崐萁","國民黨","連署"],["高金素梅","無黨籍","連署"],["林思銘","國民黨","連署"],["牛煦庭","國民黨","連署"],["羅智強","國民黨","連署"],["邱若華","國民黨","連署"],["謝龍介","國民黨","連署"]],"party":[["國民黨",15],["無黨籍",1]],"reason":"本院委員徐巧芯、廖偉翔、林沛祥、許宇甄等16人，有鑑於校園提供多元生理用品及推動月經健康教育，已屬學生健康促進及營造校園友善環境之重要事項，惟現行相關措施多依賴行政指引推動，尚缺乏明確法律依據，致各級學校執行標準不一。為健全制度基礎，明定中央主管機關應協助學校提供有月經生理需求之學生必要支持，並由學校辦理月經健康教育及相關宣導事項，以強化學生健康教育及性別友善環境之建構，爰擬具「學校衛生法第六條條文修正草案」。是否有當？敬請公決。","arts":["第六條"]}],"arts":[{"no":"第五條","current":"各級主管機關應遴聘學者、專家、團體及相關機關代表組成學校衛生委員會，其任務如下：\n一、提供學校衛生政策及法規興革之諮詢指導意見。\n二、提供學校衛生之計畫、方案、措施及評鑑事項之諮詢指導意見。\n三、提供學校衛生教育與活動之規劃及研發事項之諮詢指導意見。\n四、提供學校健康保健服務之規劃及研發事項之諮詢指導意見。\n五、提供學校環境衛生管理之規劃及研發事項之諮詢指導意見。\n六、協調相關機關、團體推展學校衛生事項。\n七、其他推展學校衛生之諮詢事項。","versions":[{"bill":"202110079420000","text":"各級主管機關應遴聘具醫藥、公衛、營養等專業之學者、專家、團體及相關機關代表組成學校衛生委員會，其任務如下：\n一、提供學校衛生及營養政策及法規興革之諮詢指導意見。\n二、提供學校衛生及營養之計畫、方案、措施及評鑑事項之諮詢指導意見。\n三、提供學校衛生及營養教育與活動之規劃及研發事項之諮詢指導意見。\n四、提供學校健康保健服務之規劃及研發事項之諮詢指導意見。\n五、提供學校營養服務之規劃及研發事項之諮詢指導意見。\n六、提供學校環境衛生管理之規劃及研發事項之諮詢指導意見。\n七、協調相關機關、團體推展學校衛生及營養事項。\n八、其他推展學校衛生及營養之諮詢事項。","note":"一、鑒於全球性之新冠肺炎疫情爆發，對學生之身心健康影響甚鉅；另據國健署2013年-2016年及2017年-2020年兩期「國民營養健康狀況變遷調查」結果發現，7－18歲之兒童及青少年過重加上肥胖之盛行率高達26.7－30.6%，及7－15歲糖尿病前期及血脂異常盛行率偏高，然本條文卻未規定須遴選具公衛、醫藥、營養等專業之學者、專家、團體、相關機關代表為防疫及飲食營養之議題提供諮詢指導意見，顯見現行學校衛生委員會之成員及任務已未能符合當前學校衛生安全與學生飲食營養均衡之需求，實有修正之必要，為確保學生能健康成長，爰於本條文第一項明定：「各級主管機關應遴聘具醫藥、公衛、營養等專業之學者、專家、團體相關機關代表組成學校衛生委員會」，並於第一款至第三款及第七款、第八款增訂除提供學校衛生相關諮詢指導意見外，亦須提供營養相關諮詢指導意見。\n二、增訂第五款須提供學校營養服務之規劃及研發事項之諮詢指導意見。\n三、其餘款次順移。"},{"bill":"202110142320000","text":"各級主管機關應遴聘具醫藥、公衛、營養、心理健康等專業之學者、專家、團體及相關機關代表組成學校衛生委員會，其任務如下：\n一、提供學校衛生政策及法規興革之諮詢指導意見。\n二、提供學校衛生之計畫、方案、措施及評鑑事項之諮詢指導意見。\n三、提供學校衛生教育與活動之規劃及研發事項之諮詢指導意見。\n四、提供學校健康保健服務之規劃及研發事項之諮詢指導意見。\n五、提供學校營養服務之規劃及研發事項之諮詢指導意見。\n六、提供學校各項心理健康服務之規劃及研發事項之諮詢指導意見。\n七、提供學校環境衛生管理之規劃及研發事項之諮詢指導意見。\n八、協調相關機關、團體推展學校衛生事項。\n九、其他推展學校衛生之諮詢事項。","note":"一、COVID-19疫情突顯學生身心健康的重要性，根據國民健康署2013至2020年營養調查，7至18歲學生過重與肥胖盛行率達26.7%至30.6%，另7至15歲學生糖尿病前期與血脂異常比例偏高。2023年「青少年健康行為調查」亦指出，學生憂鬱感、孤獨感與壓力調適困難比例上升，顯示心理健康已成學校健康促進之核心課題。惟現行《學校衛生法》第五條未明定衛生委員會須納入醫學、公共衛生、營養與心理健康等專業人員，亦未將心理與營養政策諮詢列為法定職責，致實務運作缺乏必要專業支撐，亟需修正。\n二、為強化學校衛生委員會之功能與專業性，爰修正本條第一項，增列各級主管機關應遴聘具醫藥、公衛、營養及心理健康專業背景之委員，並於相關款次增訂其職責包括提供學生營養與心理健康政策之建議與諮詢，以健全學校健康治理機制。\n三、另增訂第五款與第六款，明定委員會應提供營養服務之規劃與研究發展相關專業意見，推動系統化健康促進措施，其餘款次則配合調整。"}],"changed":true,"final":"各級主管機關應遴聘具醫藥、公衛、營養、心理健康等專業之學者、專家、團體及相關機關代表組成學校衛生委員會，其任務如下：\n一、提供學校衛生政策及法規興革之諮詢指導意見。\n二、提供學校衛生之計畫、方案、措施及評鑑事項之諮詢指導意見。\n三、提供學校衛生教育與活動之規劃及研發事項之諮詢指導意見。\n四、提供學校健康保健服務之規劃及研發事項之諮詢指導意見。\n五、提供學校環境衛生管理之規劃及研發事項之諮詢指導意見。\n六、協調相關機關、團體推展學校衛生事項。\n七、其他推展學校衛生之諮詢事項。","finalWhy":"修正通過。,","review":{"note":"修正通過","text":"各級主管機關應遴聘具醫藥、公衛、營養、心理健康等專業之學者、專家、團體及相關機關代表組成學校衛生委員會，其任務如下：\n一、提供學校衛生政策及法規興革之諮詢指導意見。\n二、提供學校衛生之計畫、方案、措施及評鑑事項之諮詢指導意見。\n三、提供學校衛生教育與活動之規劃及研發事項之諮詢指導意見。\n四、提供學校健康保健服務之規劃及研發事項之諮詢指導意見。\n五、提供學校環境衛生管理之規劃及研發事項之諮詢指導意見。\n六、協調相關機關、團體推展學校衛生事項。\n七、其他推展學校衛生之諮詢事項。"}},{"no":"第六條","current":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。","versions":[{"bill":"202110024000000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應協助學校備置適當生理用品，免費提供有需求之學生取用。\n學校應針對生理用品協助措施、月經及相關健康知識進行宣導教育。","note":"一、月經貧窮已成為國際落實婦女保障與性別平權之重要議題。女性一生平均約花費十萬台幣購買生理用品，對弱勢家庭亦是沉重負擔。\n二、教育部決議自112年8月起於各級學校、設置定點提供多元生理用品，以消弭月經貧窮。為推動該措施擁有法源依據並常態化，提案入法。\n三、爰於本條文新增第三項，增訂備置生理用品之法源依據，俾課予各級主管機關協助學校備置適當生理用品，免費提供有需求之學生取用。\n四、本條文新增第四項，以推動月經知識等教育。"},{"bill":"202110021960000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應補助學校備置學生免費生理期用品、或設置自動販賣機、供學生以低於市價之價格取得月經生理用品。\n學校應針對月經相關知識進行宣導教育，其教材應包含生理知識、心理調適、月經貧窮成因，以促進性別平等。","note":"一、為使有月經之女性、跨性別男性、非二元性別者學生的健康權得到保障，特新增第三項，免費提供有需求之學生取用生理用品。\n二、依據行政院所頒布《性別平等政策綱領》及消除對婦女一切形式歧視公約（CEDAW）之精神，爰擬具修正本條，以減緩有月經學生之財務壓力、保障其健康權。\n三、本條文新增第四項，推進月經知識等教育，促進性別平等。"},{"bill":"202110032990000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應補助大專校院以下學校，備置衛生棉、衛生棉條、月經量杯等多元生理用品，供有急迫需要者索取使用；並無償提供予經濟弱勢之學生。\n前項生理用品應由專人管理，定期清點汰換，確保數量充足、無污損逾期。","note":"一、本條增訂第三項、第四項，其餘未修正。\n二、為落實CEDAW（消除對婦女一切形式歧視公約），響應聯合國永續發展目標，應推動性別平等與健康公平之公共衛生政策，減緩女性因生理期而衍生額外之財務負擔，終結月經貧窮、破除月經污名。\n三、參考內政部統計，台灣女性平均一生會花費約10萬元購買生理用品。此一金額對於經濟弱勢之家庭及女性仍是不小的負擔。倘女性因無法負擔經期期間所需生理用品之費用，又無取得生理用品資源管道，只能減少更換生理用品次數，或以避免外出的方式因應，不但影響教育、工作等日常生活，更嚴重將導致疾病及危害心理健康。\n四、又教育部自112年8月1日起實施友善提供多元生理用品計畫。針對各級學校不利處境學生發放多元生理用品，並尊重學生使用生理用品種類、材質之不同，規劃適性友善的發放方式。同時，亦於各級學校及教育部所屬場館設置定點，以供急需取用。\n五、增訂第三項。\n(一)為確保學校備置適當生理用品之落實，應增訂實施之法源依據。參考英國、蘇格蘭、紐西蘭等國家免費提供有需求學生生理用品之作法，可做為我國政府因應月經貧窮及性別不平等問題之政策目標。\n(二)爰明定大專校院以下學校，應備置多元生理用品，供有急迫需要者及經濟弱勢學生無償索取使用。各級主管機關亦應補助學校備置經費。\n六、增訂第四項。學校備置之生理用品應由專人管理，以確保其數量充足、品質無虞。"},{"bill":"202110033040000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應補助學校備置多元生理用品，免費提供有需求之學生取用。\n學校應針對多元生理用品及相關健康知識進行宣導教育。","note":"一、依據醫療機構統計，女性一生平均購買生理用品的費用約為十萬元，對弱勢者造成經濟負擔。\n二、教育部決議自112年8月起於各級學校、設置定點提供多元生理用品。爰於本條文新增第三項及第四項，增訂備置生理用品之法源依據，俾課予各級主管機關協助學校備置適當生理用品，免費提供有需求之學生取用。\n三、多元生理用品使用方式各有差異，學校應該針對多元生理用品的使用方式以及相關的健康教育知識進行宣導教育，爰於本條文新增第四項。"},{"bill":"202110044910000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n學校應定點備置生理用品物資，免費提供學生使用。其數量依每學期學校女性學生人數計算最下限額。","note":"一、參照內政部104年之統計數據，每位台灣女性平均一生約花費新臺幣近10萬元購買生理用品，已造成女性不小之經濟負擔。惟生理用品乃女性基本生活之自然需求，不應令其額外負擔經濟壓力。\n二、民間團體曾針對2千餘人做生理期經驗之問卷調查，結果發現，同意和非常同意「曾經因為想要節省生理用品使用而減少更換」者，竟高達44.5%。\n三、綜上所述，為減少學生因生理期所生之額外經濟負擔，並兼顧其身心健康，爰增訂第三項，學校應定點備置適當之生理用品物資，提供學生免費使用。又為避免學校怠於備置、汰換或更新生理用品，明定備置之生理用品數量，應依每學期學校女性學生人數計算最下限額，以符合「消除對婦女一切形式歧視公約」（CEDAW）之內涵，減輕女性經濟負擔，落實性別平等與健康公平之公共衛生政策。"},{"bill":"202110070830000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n學校應備置多元生理用品，免費提供學生使用，並安排女性生理期相關健康知識之宣導。","note":"一、月經貧窮問題不僅是健康問題、社會問題，更是人權議題。國際上許多國家都已就此議題擬定全國性的重要解決措施。為消除月經貧窮，並落實性別平等教育，教育部自112年8月起實施友善提供多元生理用品計畫，在全國各級學校提供免費生理用品，並訂定「校園及部屬場館提供多元生理用品指引」。\n二、為落實CEDAW（消除對婦女一切形式歧視公約），響應聯合國永續發展目標，應推動性別平等與健康公平之公共衛生政策，減緩女性因生理期而衍生額外之財務負擔，並參考其他國家作法：2020年蘇格蘭通過《生理用品免費供應法》，成為全世界第一個全境免費提供生理用品的國家；紐西蘭，自2021年6月起，在各級學校為學生免費提供生理用品；日本，也於2021年3月公布，對無力購買生理用品、陷入月經貧窮的女性提供免費生理用品。\n三、增訂第三項，學校應備置多元生理用品，免費提供學生使用，並安排女性生理期相關健康知識之宣導。"},{"bill":"202110071790000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n學校應於定點放置免費之多元生理用品，以供急需使用，並應定期增補之；針對不利處境之學生，應以票券等其他無償取得之方式，供其使用生理用品。","note":"對於尚無經濟能力購買生理用品之學生，為減輕其負擔，避免陷於月經貧窮之困境，爰於各級學校定點放置免費之多元生理用品，包含各類款式、形式，如：護墊、衛生棉、衛生棉條等，供不特定學生急需使用。另針對不利處境之學生，如：中低收入戶或經學校判定有特殊需求者，應以兌換券、學生證等其他無償取得之方式，供其免費使用生理用品，爰新增第三項。"},{"bill":"202110108270000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應補助大專校院以下學校，備置學生免費生理期用品，供有急迫需要者索取使用；並無償提供予經濟弱勢之學生。\n前項生理用品應由專人管理，定期清點汰換，確保數量充足、無汙損逾期。\n學校應推動月經相關知識之宣導教育，其教材應包含生理知識、心理調適、月經貧窮成因，以落實性別平等。","note":"一、依據行政院所頒布《性別平等政策綱領》及消除對婦女一切形式歧視公約（CEDAW）之精神，爰擬具修正本條，以免費提供有需求學生生理用品方式，以消弭「月經貧窮」所造成之性別平等及社會問題。\n二、教育部於112年8月1日實施「友善提供多元生理用品計畫」根據民間團體公布政策落實情況調查報告，其中顯示校園中取得生理用品不太方便的原因有取得生理用品可近性低、放置生理用品定點少、衛生和設備相關問題、無定期補充用品負責人和數量不足、缺乏宣傳與不清楚政策執行方式、對於月經之避諱和不敢開口，以及單一性別學校之困境。\n三、除此之外，報告亦提及「月經教育」是長期推動月經友善校園的關鍵，然而目前校園中仍缺乏全面、完整的月經教育。教育部與各級學校應積極推動完整且全方位的月經教育，讓學生與教職員在學校環境中瞭解完整且正確的月經與身體相關知識，進而能以同理和尊重的態度面對彼此的差異，消除與月經相關的負面刻板印象。"},{"bill":"202110128460000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應協助各級學校備置多元生理用品，免費提供有需求之學生取用，並應定期檢查其衛生狀況同時增補之；針對不利處境之學生，應以多管道形式提供協助。\n學校應針對生理用品協助措施及相關健康知識進行宣導教育。\n前項健康知識應包含生理常識、月經知識、心理調適、月經貧窮、衛生習慣、汙名破除等項目。","note":"一、近年國內外多項調查研究與報導（例如：民間團體「全球小紅帽協會」之調查等）顯示，部分學生（尤其來自經濟不利、偏鄉或特殊境遇家庭者）確實面臨難以負擔或取得足夠生理用品之困境。此現象不僅影響其生理健康（如因不常更換導致感染風險），更可能因缺乏用品、擔心外漏、或遭受異樣眼光而產生焦慮、自卑感，甚至導致缺課、不願參與體育活動等狀況，實質侵害其平等受教之權利與身心健康。國際上，蘇格蘭於2021年立法（An Act of the Scottish Parliament to secure the provision throughout Scotland of free period products.），要求各級學校及公共場所免費提供生理用品。顯示提供免費生理用品、消除月經貧窮已成為國際人權與性別平等之重要指標。\n二、免費提供生理用品，特別是在校園內應急供應，能有效緩解學生因突發狀況或經濟困難無法即時取得用品的窘境，保障其安心就學。爰於本條增訂第三項。至於所謂「多元生理用品」，應至少包含衛生棉、棉條等不同選項。另針對不利處境之學生，所謂以多管道形式提供協助，包括但不限於電子票券、紙本票券、實物及現金（禮物卡）等方式。\n三、社會長期以來對月經的避諱與污名，導致相關知識傳遞不足，甚至充滿迷思。許多學生對自身或他人的生理現象缺乏理解，產生不必要的羞恥感或歧視行為。爰增訂第四項及第五項，要求學校應針對生理用品協助措施及相關健康知識進行宣導教育，其教育內容並應包含生理常識、月經知識、心理調適、月經貧窮、衛生習慣、汙名破除等項目。旨在提升全體學生對月經的正確認識，理解其為正常生理現象，學習互相尊重與同理，並了解相關社會議題，深化性別平等教育與健康促進。"},{"bill":"202110156700000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應補助學校備置多元生理用品，免費提供有需求之學生取用，並應定期檢查其衛生狀況同時增補之；針對不利處境之學生，應以多管道形式提供協助。\n學校並應針對所有性別之學生進行月經相關知識宣導教育，其應包含生理常識、生理用品協助措施、心理調適、月經貧窮、衛生習慣、破除月經污名等項目。","note":"一、依照《消除對婦女一切形式歧視公約》（CEDAW）之精神，為減緩經歷月經學生之財務壓力，維護其健康權，爰增訂第三項，使月經者（Menstruator）-包含有月經之女性、跨性別男性、非二元性別者學生－能取得各式多元生理用品，包含衛生棉、衛生棉條、月經量杯等。\n二、社會長期以來對月經避而不談，甚至貼上污名標籤（Menstrual stigma），將之視為不潔、羞恥之事，許多經期中之生理女性更不被允許參與社會中諸多宗教儀式、文化習俗乃至日常活動。爰增訂第四項，使學校有其必要針對月經議題，對任何性別之學生進行宣導教育，其旨在提升全體學生對月經之正確認識並相互理解及尊重，同時得以了解關於月經之社會議題，更深化對性別平權之認知。"},{"bill":"202110166250000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、心理與衛生諮詢及支援健康教學之場所。","note":"一、修正第二項。\n二、現行條文僅規範健康中心作為生理健康檢查、急救與衛生諮詢之場所，未明文納入心理健康功能。修正增列為「心理與衛生諮詢」，使健康中心兼具心理支持角色，確保學生在校園中能獲得初步心理輔導與資源轉介。"},{"bill":"202110199020000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應協助各級學校備置生理用品，免費提供有需求之學生取用；針對不利處境之學生，應以多元方式提供協助。\n前項生理用品應確保其衛生狀況，並定期增補之。\n學校應善用數位科技對學生進行月經相關知識之宣導教育，其內容應包含生理常識、生理用品協助措施、心理調適、月經貧窮、衛生習慣、破除月經污名等項目。","note":"一、參據內政部之統計數據，每位臺灣女性平均一生約花費新臺幣十萬元購買生理用品。惟依勞動部所公布的「兩性薪資差距」，2021年女性平均薪資為男性的84.2%，兩性間每月薪資差距高達11,341元，在現有薪資結構不平等狀況下，女性又必須額外購買生理用品，著實增加女性財務負擔。\n二、世界各國為落實性別平等、健康平權及友善校園之政策目標，並且消除月經貧窮對學生受教權及人格尊嚴之不利影響，目前已有蘇格蘭、紐西蘭、澳洲維多利亞州、加拿大安大略省以及美國部分州以法律明定於校內廁所提供免費生理用品，作為學生基本支持措施。\n三、聯合國人口基金（UNFPA）宣言表示：「月經並不是一個女孩或婦女的議題，而是人權議題。」消弭月經貧窮與月經所造成之不平等問題已是普世價值，我國應加速法制化作業，明定各級主管機關應協助各級學校備置生理用品，免費提供有需求之學生取用，並且善用數位科技對學生進行月經相關知識之宣導教育，以落實人權保障，促進健康平權，並營造更友善之校園環境。"},{"bill":"202110206480000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n中央主管機關應按年度編列預算，協助學校以適當方式備置多元生理用品，供有經期生理需求之學生免費取用；學校並應辦理月經健康教育相關宣導。\n前項多元生理用品之提供方式、管理、衛生維護及其他相關事項之辦法，由中央主管機關定之。","note":"一、增訂第三項。現行學校衛生法第六條雖已規定學校應推動學校衛生工作及設置健康中心，惟對於有經期生理需求學生之生理用品取得及月經健康支持，尚無明文規範。為減少月經貧窮對學生健康、尊嚴及受教權之影響，並將現行行政措施提升至法律位階，爰增訂本項。\n二、所稱「以適當方式備置多元生理用品」，係指學校得依學生需求、校園環境及實際管理條件，採定點放置、保健中心領取或其他適當方式辦理，並應注意學生隱私、便利取得及去標籤化原則。\n三、為明確區分主管機關與學校之權責分工，爰規定由主管機關編列預算暨協助提供之責任，並由學校負責辦理月經健康教育相關宣導；其宣導內容包括月經生理知識、心理調適、衛生習慣及去除與月經相關負面刻板印象等，以符合實務運作。\n四、增訂第四項。鑑於多元生理用品之提供方式、管理、衛生維護及校內執行細節，仍有賴中央主管機關訂定一致規範，爰增訂授權條款，以利制度穩定推動。"},{"bill":"202110208830000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應協助各級學校備置多元生理用品，免費提供有需求之學生取用，並應定期檢查其衛生狀況同時增補之；針對不利處境之學生，應以多管道形式提供協助。\n學校應針對生理用品協助措施及相關健康知識進行宣導教育。\n前項健康知識應包含生理常識、月經知識、心理調適、月經貧窮、衛生習慣、污名破除等項目。","note":"一、近年國內外多項調查研究與報導（例如：民間團體「全球小紅帽協會」之調查等）顯示，部分學生（尤其來自經濟不利、偏鄉或特殊境遇家庭者）確實面臨難以負擔或取得足夠生理用品之困境。此現象不僅影響其生理健康（如因不常更換導致感染風險），更可能因缺乏用品、擔心外漏、或遭受異樣眼光而產生焦慮、自卑感，甚至導致缺課、不願參與體育活動等狀況，實質侵害其平等受教之權利與身心健康。國際上，蘇格蘭於2021年立法（An Act of the Scottish Parliament to secure the provision throughout Scotland of free period products.），要求各級學校及公共場所免費提供生理用品。顯示提供免費生理用品、消除月經貧窮已成為國際人權與性別平等之重要指標。\n二、免費提供生理用品，特別是在校園內應急供應，能有效緩解學生因突發狀況或經濟困難無法即時取得用品的窘境，保障其安心就學。爰於本條增訂第三項。至於所謂「多元生理用品」，應至少包含衛生棉、棉條等不同選項。另針對不利處境之學生，所謂以多管道形式提供協助，包括但不限於電子票券、紙本票券、實物及現金（禮物卡）等方式。\n三、社會長期以來對月經的避諱與污名，導致相關知識傳遞不足，甚至充滿迷思。許多學生對自身或他人的生理現象缺乏理解，產生不必要的羞恥感或歧視行為。爰增訂第四項及第五項，要求學校應針對生理用品協助措施及相關健康知識進行宣導教育，其教育內容並應包含生理常識、月經知識、心理調適、月經貧窮、衛生習慣、汙名破除等項目。旨在提升全體學生對月經的正確認識，理解其為正常生理現象，學習互相尊重與同理，並了解相關社會議題，深化性別平等教育與健康促進。"},{"bill":"202110209090000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應補助學校備置生理期用品，由學校免費提供予有急迫需要者並提供或協助經濟不利學生購買、取得所需之生理期用品。\n依前項備置之生理期用品，學校應建立自主管理機制，落實自行檢查管理，並依需求備置不同款式。\n學校應進行月經教育，內容應包含性別平等、生理知識、心理調適、月經貧窮。","note":"一、根據立法院法制局之研究，「月經貧窮」，係指經濟弱勢女性，因為無法取得充足且適當的生理用品，導致生理疾病及影響心理健康，且不利就學及就業，並將長期影響生活，陷入弱勢的惡性循環。而「月經不平等」，則為女性因月經此一與男性先天不同的生理現象，而於身體與財務上受到不同於男性的影響，部分甚至因為月經而加重其社會弱勢狀況。有調查顯示，部分女性為了節省花費，而拉長經期生理用品的使用時間，不僅增加生理期的不適感，也提高婦女疾病及造成其他身心健康負面影響之風險。例如，韓國全民健康保險資料庫統計報告（2005－2015年）曾指出，貧窮女性陰道感染率較富有女性高出1.6倍。為於校園內消彌月經不平等，促進月經平權，爰於本條新增第三項至第五項。\n二、新增第三項。定明本法之各級主管機關應補助學校備置生理期用品。並由學校：\n(一)提供實物予有急迫需要者。\n(二)提供實物，或以現金給付、補助或其他形式協助經濟不利學生購置、取得生理期用品。\n三、新增第四項。定明為維持生理期用品之清潔與品質，學校應建立自主管理機制，落實自行檢查管理，並於備置多元款式之生理期用品。\n四、新增第五項。定明學校應推動月經教育。"},{"bill":"202110211820000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應補助學校於校園內適當場所，常態備置多元生理用品，供有需求之學生及教職人員免費、便利且具尊嚴地取用，並應定期維護衛生狀況與及時增補；針對不利處境之學生，應提供主動且多管道之協助。\n前項用品之種類及設置地點，學校應諮詢學生意見，以確保符合實際需求並尊重多元差異。\n學校應針對所有性別之學生推動月經教育，內容應包含生理知識、多元生理用品認識與選擇、心理調適、月經貧窮成因及破除月經污名等項目，以建立包容、平權之校園文化。","note":"一、依據《消除對婦女一切形式歧視公約》（CEDAW），國家應採取一切適當措施，以消除在保健方面對婦女的歧視。爰增訂第三項，要求主管機關補助學校備置多元生理用品，以消除校園內因生理差異產生之實質不平等。\n二、參考蘇格蘭《生理用品免費供應法》（Period Products（Free Provision）（Scotland）Act 2021），免費生理用品之提供應以便利及尊嚴為原則，避免因領取程序繁瑣或標籤化導致學生退縮。\n三、生理用品之種類（如衛生棉、衛生棉條、月經量杯等）及備置地點，將直接影響學生使用意願與便利性。爰於第四項明定學校應評估學生需求並尊重多元差異，以確保政策落實符合學生實際生活情境。\n四、月經污名化（Menstrual Stigma）源於社會對生理現象之偏見與封閉。爰增訂第五項，明定學校應針對全體學生推動月經教育，以提升校園對多元生理現象之尊重與相互理解。"},{"bill":"202110221460000","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n中央主管機關應編列年度預算，協助學校採適當方式備置多元生理用品，提供有經期生理需求之學生免費取用；學校應同步辦理月經健康教育及相關宣導。\n前項多元生理用品之提供、管理、衛生維護及其他相關事項之辦法，由中央主管機關定之。","note":"學生經期生理用品為基本健康需求，惟現行校園提供不一且多依行政措施辦理，致資源不均，為促進性別平等與教育公平，有法制化之必要。並明定中央主管機關應編列預算協助學校提供多元生理用品及月經健康教育，並授權訂定管理辦法，以確保制度一致與執行品質。"}],"changed":true,"final":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應協助學校備置生理用品，並推動月經教育。","finalWhy":"修正通過。,","review":{"note":"修正通過","text":"學校應指定單位或專責人員，負責規劃、設計、推動學校衛生工作。\n學校應有健康中心之設施，作為健康檢查與管理、緊急傷病處理、衛生諮詢及支援健康教學之場所。\n各級主管機關應協助學校備置生理用品，並推動月經教育。"}},{"no":"第七條","current":"高級中等以下學校班級數未達四十班者，應置護理人員一人；四十班以上者，至少應置護理人員二人。\n專科以上學校得比照前項規定置護理人員。\n學校醫事人員應就依法登記合格者進用之。","versions":[{"bill":"202110006630000","text":"高級中等以下學校班級數未達四十班者，應置護理人員一人；四十班以上者，至少應置護理人員二人；其附設幼兒園者，該班級數之計算應併計校內附設幼兒園班級數。\n專科以上學校得比照前項規定置護理人員。\n學校醫事人員應就依法登記合格者進用之。","note":"一、新增第一項後段：要求高級中等以下學校附設幼兒園者，其護理人員配置員額之班級數計算，應將幼兒園班級數納入，以維持護理人員合理數量。\n二、第二項和第三項未修正。"}],"changed":false,"final":"高級中等以下學校班級數未達四十班者，應置護理人員一人；四十班以上者，至少應置護理人員二人。\n專科以上學校得比照前項規定置護理人員。\n學校醫事人員應就依法登記合格者進用之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第八條","current":"學校應建立學生健康管理制度，定期辦理學生健康檢查；必要時，得辦理學生及教職員工臨時健康檢查或特定疾病檢查。\n前項學生健康檢查之對象、項目、方法及其他相關事項之實施辦法，由中央主管機關會同中央衛生主管機關定之。","versions":[{"bill":"202110166250000","text":"學校應建立學生健康管理制度，定期辦理學生健康檢查及心理健康評估；必要時，得辦理學生及教職員工臨時健康檢查或特定疾病檢查。\n前項學生健康檢查及心理健康評估之對象、項目、方法及其他相關事項之實施辦法，由中央主管機關會同中央衛生主管機關定之。","note":"一、修正第一項、第二項。\n二、現行條文僅規範「健康檢查」，範疇限於生理層面。修正後增列「心理健康評估」，使心理健康檢測常態化，並與健康檢查同樣納入學生健康管理制度，強化校園早期辨識與追蹤之功能。"}],"changed":false,"final":"學校應建立學生健康管理制度，定期辦理學生健康檢查；必要時，得辦理學生及教職員工臨時健康檢查或特定疾病檢查。\n前項學生健康檢查之對象、項目、方法及其他相關事項之實施辦法，由中央主管機關會同中央衛生主管機關定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第十條","current":"學校應依學生健康檢查結果，施予健康指導，並辦理體格缺點矯治或轉介治療。","versions":[{"bill":"202110166250000","text":"學校應依學生健康檢查及心理健康評估結果，施予健康與心理指導，並辦理體格缺點與心理健康問題矯治或轉介治療。","note":"現行條文僅限於健康檢查結果之體格缺點矯治，對心理困境缺乏制度性回應。修正後明定學校應依心理健康評估結果，施予心理指導，並建立轉介治療機制，確保學生獲得完整支持。"}],"changed":false,"final":"學校應依學生健康檢查結果，施予健康指導，並辦理體格缺點矯治或轉介治療。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第十一條","current":"學校對罹患視力不良、齲齒、寄生蟲病、肝炎、脊椎彎曲、運動傷害、肥胖及營養不良等學生常見體格缺點或疾病，應加強預防及矯治工作。","versions":[{"bill":"202110120050000","text":"學校對罹患視力不良、聽力不良、齲齒、寄生蟲病、肝炎、脊椎彎曲、運動傷害、肥胖及營養不良等學生常見體格缺點或疾病，應加強預防及矯治工作。","note":"增列「聽力不良」為學生常見體格缺點或疾病的範圍之中，以示學校未來需加強對學生聽力不良的預防及矯治工作。"},{"bill":"202110204060000","text":"學校對罹患視力不良、聽力不良、齲齒、寄生蟲病、肝炎、脊椎彎曲、運動傷害、肥胖及營養不良等學生常見體格缺點或疾病，應加強預防及矯治工作。","note":"一、增列「聽力不良」為學生常見體格缺點或疾病之一。\n二、配合實務需求，明確學校就聽力保健教育、預防宣導、及早發現與後續協助之法源依據。"}],"changed":true,"final":"學校對罹患視力不良、聽力不良、齲齒、寄生蟲病、肝炎、脊椎彎曲、運動傷害、肥胖及營養不良等學生常見體格缺點或疾病，應加強預防及矯治工作。","finalWhy":"一、增列「聽力不良」為學生常見體格缺點或疾病之一。\n二、配合實務需求，明確學校就聽力保健教育、預防宣導、及早發現與後續協助之法源依據。","review":{"note":"照委員羅智強等17人及台灣民眾黨黨團提案通過","text":"學校對罹患視力不良、聽力不良、齲齒、寄生蟲病、肝炎、脊椎彎曲、運動傷害、肥胖及營養不良等學生常見體格缺點或疾病，應加強預防及矯治工作。"}},{"no":"第十六條","current":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括健康飲食教育，以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n學校應鼓勵學生參與學校餐飲準備過程。","versions":[{"bill":"202110128320000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括健康飲食教育，以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n第一項健康課程應包含學生心理健康教育，以建立學生更全面的健康意識，了解自身與他人的心理需求。\n學校應鼓勵學生參與學校餐飲準備過程。","note":"一、鑒於近年青少年心理健康問題日益嚴重，根據調查顯示，超過半數國中生承受未來壓力，且感受壓力者出現情緒困擾及身心症狀的比例遠高於未感壓者，另有超過三成青少年出現網路沉迷問題，與之相關之情緒困擾與多重身心症狀風險亦顯著提升。然現行《學校衛生法》第十六條所定健康課程內容，僅及於健康飲食教育，未明文涵蓋心理健康教育，無法有效因應當前青少年面臨之實際心理壓力與挑戰。\n二、參考加拿大安大略省自二零二三學年度起實施心理健康課程，針對七至十年級學生提供壓力應對、心理疾病識別、去除污名及求助知能等教育內容，顯見心理健康教育已為國際趨勢。爰此，建議《學校衛生法》第十六條增訂第四項，明定「健康相關課程應包括心理健康教育」，以強化學生健康素養，協助其建立正向情緒調適能力，促進其身心健康發展與生活品質提升。"},{"bill":"202110128460000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括下列主題：\n一、健康飲食教育：以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。學校並應鼓勵學生參與學校餐飲準備過程。\n二、心理健康促進與基本知能教育：以學習情緒照護、自我身心關照、壓力管理調適，促進學生心理健康意識。\n三、規律身體活動與運動習慣培養教育：以彰顯對於學生的體能發展、體重管理、心血管健康、骨骼發育乃至於情緒穩定和認知功能之顯著益處。\n四、成癮物質防治教育：促進學生對菸、酒、非法藥物及新興成癮物質之認識並進行濫用防治教育。","note":"一、現行第四項條文移列至第三項第一款。並酌作文字調整。\n二、新增第三項第二款有關心理健康教育之內容。國人對精神疾患或精神官能症多半處於無知，或是對其有污名化的印象。另外，在受教育階段，學生多半因為課業過度的被要求，而忽略情感與心理狀況自我覺察的學習。同時，因數位時代的快速變化，學生可能因網路社群沉迷問題而產生情緒困擾。青少年是自我概念發展、學習壓力管理跟情緒調適的關鍵期，將心理健康教育放入課程，將有助成長與融入社會過程中的壓力調適與收放，、心理不適時學會求助，以及學會對他人的同理。在相關課程應加入自我身心關照與關懷助人的正確方式，同時宣導在義務教育端心輔資源多加使用。認識情緒、尊重同理他人非常重要。同時也要讓學子們理解到，學會求助不是脆弱的表現，反而勇於面對真實的自己。另外，也要將對他人有這樣求助情形時產生的歧視去標籤化。\n三、新增第三項第三款有關規律身體活動與運動習慣培養教育之內容。規律的身體活動是兒童與青少年健康成長的基石。它有助於強化心肺功能、促進骨骼肌肉發展、維持健康體重、降低罹患肥胖、心血管疾病、第二型糖尿病等慢性疾病的風險。並在維持情緒穩定和認知功能都有顯著益處。在發育階段建立身體活動習慣，對一生的生理健康都有深遠影響。在學期間培養對運動的興趣與習慣，更有可能將此習慣延續至成年，形成一種可持續的健康生活方式。\n四、新增第三項第四款有關成癮物質防制教育之內容，菸（含電子煙）、酒、非法藥物等成癮物質對發育中的大腦和身體危害極大。它們可能導致器官損傷、精神障礙、意外事故，甚至死亡。青少年時期是大腦發展關鍵期，尤其容易受到物質的負面影響，甚至更容易形成依賴。美國國家藥物濫用研究所（NIDA）其網站和出版物中有大量資料指出，青少年時期使用藥物（包括菸、酒、大麻、非法藥物等）會對大腦發展產生負面影響，特別是影響與學習、記憶、動機、決策和衝動控制相關的腦區。因此，有效的預防教育能減少因物質濫用衍生的醫療負擔、潛在犯罪問題、生產力損失等龐大的社會成本。"},{"bill":"202110127810000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括健康飲食教育，以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n第一項健康相關課程應包括心理健康教育，以促進學生健康意識，幫助學習如何應對壓力。\n學校應鼓勵學生參與學校餐飲準備過程。","note":"一、鑒於我國青少年因受課業壓力及網路社群影響，以致憂鬱、焦慮、自戕及校園犯罪等行為皆有增加趨勢。為促進其身心健康，協助應對壓力，建議參考加拿大安大略省2023年開始實施心理健康課程之範例，將心理健康教育納入健康相關課程之中，爰增訂第十六條第四項條文。\n二、原第四項遞移至第五項。"},{"bill":"202110128710000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括健康飲食教育，以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n第一項健康相關課程應包括心理健康教育，以建立學生心理健康之認知、自我身心健康之覺察能力，並促進學生身心健康發展。\n學校應鼓勵學生參與學校餐飲準備過程。","note":"一、修正第四項，增訂「第一項健康相關課程應包括心理健康教育，以建立學生心理健康之認知、自我身心健康之覺察能力，並促進學生身心健康發展。」\n二、本次修法鑑於學生族群面臨課業、網路社群等壓力日益繁重，於本法明文之健康相關課程納入心理健康教育課程，以落實校園心理健康教育，俾增進並保障學生之心理健康。\n三、增訂後原第四項遞移至第五項。"},{"bill":"202110142320000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括健康飲食教育，以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n第一項健康相關課程應包括心理健康教育，旨在提升學生對心理健康之認識、自我身心健康之覺察，進一步強化對健康身體形象的認識，減緩飲食失序，並促進其心理韌性及整體身心發展。\n學校應鼓勵學生參與學校餐飲準備過程。","note":"一、為強化學生心理健康教育，修正第四項，增訂「第一項健康相關課程應包括心理健康教育，旨在提升學生對心理健康之認識、自我身心健康之覺察，進一步強化對健康身體形象的認識，減緩飲食失序，並促進其心理韌性及整體身心發展。」\n二、鑒於學生面臨來自課業、網路社群等多方面壓力，修法將心理健康教育納入健康相關課程中，藉此落實校園心理健康教育，並保障學生的心理健康。根據2023年青少年健康行為調查，約有15.3%的青少年表示對身體形象感到不滿，並且有逐年增加的趨勢；此外，學校中也日益增長的飲食失序問題，如過度節食或暴食症狀，已顯示出需要加強相關教育與介入的迫切性。\n三、增訂後，原第四項條文將遞移至第五項。"},{"bill":"202110156700000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生理發育及心理成長之特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括下列主題：\n一、健康飲食教育：建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。學校並應鼓勵學生參與學校餐飲準備過程。\n二、心理健康教育：培養辨識與表達情緒之能力、養成自我身心關照習慣、學習壓力管理與調適方法、促進心理健康意識、增進同理心與人際互動技巧。學校並應使學生熟悉使用校內外及社會之心理支持與求助資源。","note":"一、鑑於近年學生之心理健康議題受社會大眾矚目，於學校增開心理健康相關課程有其必要性。\n二、修正第二項，增訂課程需要顧及學生之心理成長之特性及需要，其餘部分酌做文字修正。\n三、為回應近年青少年心理健康議題之重要性，並落實學校健康教育之全人關懷，增訂第二項心理健康教育之具體範疇，包括情緒辨識與表達、自我身心關照、壓力管理、心理健康意識、人際互動與同理心等核心能力，以促進學生正向心理發展。同時，鑑於學生在面臨心理困擾時能及時獲得協助之必要，增訂學校應使學生熟悉校內外及社會可運用之心理支持與求助資源，藉以強化其求助知能及危機應對能力，降低心理困擾持續或惡化之風險。"},{"bill":"202110193530000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括健康飲食教育，以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n第一項健康相關課程應包括心理健康教育，以培養學生對心理健康之自我認知與覺察能力，並促進其身心健全發展。\n學校應鼓勵學生參與學校餐飲準備過程。","note":"一、有鑑於我國青少年身心健康正面臨系統性危險因子急速擴張的風險，包含數位時代衝擊、家庭與校園支持系統式微，為提升學生對心理健康的認知與自我意識，故明定健康相關課程應納入心理健康教育。\n二、新增第四項，其餘未修正。"},{"bill":"202110199110000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括健康飲食教育，以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n第一項健康相關課程應包括心理健康教育，以培養學生正向積極之心態，健全身心發展，培養社會情緒能力，並促進心理健康。\n學校應鼓勵學生參與學校餐飲準備過程。","note":"近年青少年心理健康問題呈上升趨勢，爰增訂第四項，為強化學生之心理健康，健全人格發展，明定將心理健康教育正式納入健康相關課程。"},{"bill":"202110204070000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括健康飲食教育，以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n第一項健康相關課程應包括心理健康教育，以增進學生心理健康認識，培養情緒調適、壓力因應及適時求助之能力為目的。\n學校應鼓勵學生參與學校餐飲準備過程。","note":"一、本條已明定健康相關課程應包括健康飲食教育，惟對心理健康教育尚無明文規定。鑑於學生身心健康發展，除生理健康外，亦包括心理健康認識、情緒調適、壓力因應及適時求助之能力，爰增訂第四項，明定第一項健康相關課程應包括心理健康教育。\n二、增訂第四項，現行第四項移列為第五項，內容未修正。"},{"bill":"202110208830000","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括下列教育目的：\n一、健康飲食教育：以建立正確之飲食習慣、養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。學校並應鼓勵學生參與學校餐飲準備過程。\n二、心理健康促進與基本知能教育：以學習情緒照護、自我身心關照、壓力管理調適、網路社群媒體人際關係應對，促進學生心理健康意識。\n三、規律身體活動與運動習慣培養教育：以彰顯對於學生的體能發展、體重管理、心血管健康、骨骼發育乃至於情緒穩定和認知功能之顯著益處。\n四、成癮物質防治教育：促進學生對菸、酒、非法藥物及新興成癮物質之認識並進行濫用防治教育。","note":"一、現行第四項條文移列至第三項第一款。並酌作文字調整。\n二、新增第三項第二款有關心理健康教育之內容。國人對精神疾患或精神官能症多半處於無知，或是對其有污名化的印象。另外，在受教育階段，學生多半因為課業過度的被要求，而忽略情感與心理狀況自我覺察的學習。同時，因數位時代的快速變化，學生可能因網路社群沉迷問題而產生情緒困擾。青少年是自我概念發展、學習壓力管理跟情緒調適的關鍵期，將心理健康教育放入課程，將有助成長與融入社會過程中的壓力調適與收放，、心理不適時學會求助，以及學會對他人的同理。在相關課程應加入自我身心關照與關懷助人的正確方式，宣導在義務教育端心輔資源多加使用，並了解社群媒體發達的現在，如何調適網際網路人際關係之應對及健康心理調適。認識情緒、尊重同理他人非常重要。同時也要讓學子們理解到，學會求助不是脆弱的表現，反而勇於面對真實的自己。另外，也要將對他人有這樣求助情形時產生的歧視去標籤化。\n三、新增第三項第三款有關規律身體活動與運動習慣培養教育之內容。規律的身體活動是兒童與青少年健康成長的基石。它有助於強化心肺功能、促進骨骼肌肉發展、維持健康體重、降低罹患肥胖、心血管疾病、第二型糖尿病等慢性疾病的風險。並在維持情緒穩定和認知功能都有顯著益處。在發育階段建立身體活動習慣，對一生的生理健康都有深遠影響。在學期間培養對運動的興趣與習慣，更有可能將此習慣延續至成年，形成一種可持續的健康生活方式。\n四、新增第三項第四款有關成癮物質防制教育之內容，菸（含電子煙）、酒、非法藥物等成癮物質對發育中的大腦和身體危害極大。它們可能導致器官損傷、精神障礙、意外事故，甚至死亡。青少年時期是大腦發展關鍵期，尤其容易受到物質的負面影響，甚至更容易形成依賴。美國國家藥物濫用研究所（NIDA）其網站和出版物中有大量資料指出，青少年時期使用藥物（包括菸、酒、大麻、非法藥物等）會對大腦發展產生負面影響，特別是影響與學習、記憶、動機、決策和衝動控制相關的腦區。因此，有效的預防教育能減少因物質濫用衍生的醫療負擔、潛在犯罪問題、生產力損失等龐大的社會成本。"}],"changed":true,"final":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括下列項目：\n一、健康飲食教育：建立學生正確之飲食習慣，鼓勵參與學校餐飲準備過程，養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n二、心理健康教育：建立學生心理健康之認知、自我覺察能力，以促進學生心理健康。","finalWhy":"修正通過。,","review":{"note":"修正通過","text":"高級中等以下學校應開設健康相關課程，專科以上學校得視需要開設健康相關之課程。\n健康相關課程、教材及教法，應適合學生生長發育特性及需要，兼顧認知、情意與技能。\n第一項健康相關課程應包括下列項目：\n一、健康飲食教育：建立學生正確之飲食習慣，鼓勵參與學校餐飲準備過程，養成對生命及自然之尊重，並增進環境保護意識、加深對食材來源之了解、理解國家及地區之飲食文化為目的。\n二、心理健康教育：建立學生心理健康之認知、自我覺察能力，以促進學生心理健康。"}},{"no":"第十七條","current":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生課程進修。","versions":[{"bill":"202110128460000","text":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。","note":"一、據中央社新聞報導，超過半數（54.3%）國中生感受來自未來的壓力，出現情緒困擾的比例是不感受壓力同儕的兩倍以上，並伴隨身心症狀，16.4%學生每週至少一次情緒低落，嚴重影響學習成效與生活品質。然而，現行本法僅規範學校應開設健康相關課程，並未對授課教師之專業培訓予以具體要求，導致師資在心理健康教育領域的知能不足，難以有效識別與因應學生之心理需求。\n二、增訂教師需參與在職進修，以掌握最新衛生與心理健康教學方法，提升課程品質之相關規定，並授權主管機關或學校視需求推薦教師參加相關專業課程，形成系統化、常態化的師資培訓機制。"},{"bill":"202110127820000","text":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。","note":"一、參考德國圖林根邦自2018年起實施「心靈至關重要專案」，為教師提供心理健康知識、教材和專業培訓課程，幫助教師在日常教學中加強關注及維護學生的心理健康。\n二、為協助教師能於第一時間察覺學生心理健康問題，並適時給予輔導及幫助，爰建議主管機關或學校應視實際需求，薦送教師參與心理健康相關課程。"},{"bill":"202110128710000","text":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。","note":"一、修正第二項，增訂「主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。」\n二、本次修法增訂「心理健康」課程之進修薦送，以確保校園健康課程教師之進修薦送包括心理健康課程，完善校園教師心理健康教育、輔導之知識與能力。"},{"bill":"202110156700000","text":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。","note":"一、校園心理健康促進之需求迫切。然而，現行本法僅要求學校開設健康相關課程，對於授課教師在心理健康教育專業能力之培訓並無具體規範，致使師資在辨識與因應學生心理困擾上，成效有限。\n二、為提升心理健康教育之品質與實效，爰增訂規定授課教師應定期參與在職進修，以掌握最新之衛生與心理健康教學理念與方法；並授權主管機關或學校視需求推薦教師參加相關專業課程，建立系統化、常態化之師資培訓機制，藉以強化第一線教師之專業支持能力，確保學生能及時獲得適切之心理關懷與協助。"},{"bill":"202110193530000","text":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。","note":"本條第二項新增主管機關或學校得視實際需要薦送教師參加心理健康課程進修，以利提升教師針對心理健康認知與覺察能力。"},{"bill":"202110199110000","text":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。","note":"為強化教師對心理健康之認識，完善教師心理健康教育、輔導之知識與能力，修正本條第二項，主管機關或學校得視實際需要，薦送教師參加心理健康課程。"},{"bill":"202110204070000","text":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生或心理健康相關課程進修。","note":"本條第二項僅規定主管機關或學校得視實際需要，薦送教師參加衛生課程進修。為使教師得透過在職進修增進對學生心理健康議題之理解、辨識及教學支持能力，爰修正第二項，將薦送進修範圍增列心理健康相關課程進修。"}],"changed":true,"final":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。","finalWhy":"照相關委員提案通過。,","review":{"note":"照委員魯明哲等、委員林宜瑾等、委員柯志恩等、委員陳菁徽等、委員伍麗華Saidhai‧ Tahovecahe等、委員羅智強等、委員羅廷瑋等提案通過","text":"健康相關課程教師，應參與專業在職進修，以改進教學方法，提升健康相關教學效果。\n主管機關或學校得視實際需要，薦送教師參加衛生、心理健康課程進修。"}},{"no":"第十九條","current":"學校應加強辦理健康促進及建立健康生活行為等活動。","versions":[{"bill":"202110105070000","text":"學校應加強辦理健康促進及建立健康生活行為等活動。\n學校對影響學生健康之物品或行為，得適時管理或限制其使用。","note":"一、第一項未修正。\n二、新增第二項。透過增訂校園行動載具等可能影響學生身心健康物品之管理規範，以強化對學生手機成癮等行動載具管理問題之輔導作為。"},{"bill":"202110108260000","text":"學校應加強辦理健康促進及建立健康生活行為等活動。\n學校得輔導管理影響學生健康之物品及行為。","note":"青少年手機成癮已是全球話題，青少年花在社群媒體和通訊軟體時間過長，對其心理健康、身體、睡眠品質都有負面影響，進而影響教學成效。愈來愈多國家頒布校園手機禁令或限制，而行動載具之管制或限制，宜配合時間管理和正確使用觀念之輔導，故我國各級學校對行動載具等影響學生健康及教學之物品或行為，宜為適度之輔導與管理，增訂第二項規定。"},{"bill":"202110206490000","text":"學校應加強辦理健康促進及建立健康生活行為等活動。\n學校對影響學生健康之物品或行為，應予輔導、管理，並應依學生年齡、學習階段及校園實際需要，訂定適當管理規範。","note":"一、第一項未修正。現行規定已明定學校應加強辦理健康促進及建立健康生活行為等活動，仍有維持必要。\n二、增訂第二項。鑑於影響學生健康之物品或行為日益多元，學校實務上對相關事項確有輔導及管理之需要，惟現行法尚欠缺更明確依據，爰增訂本項，明定學校應予輔導、管理，並應依學生年齡、學習階段及校園實際需要，訂定適當管理規範，以兼顧學生健康促進、校園管理及實務運作彈性。\n三、本項所稱影響學生健康之物品或行為，包含行動載具之使用及其他足以影響學生睡眠、專注力、心理健康或健康生活行為之情形，俾使學校得依具體個案及校園實際需要妥為處理。"}],"changed":true,"final":"學校應加強辦理健康促進及建立健康生活行為等活動。\n學校對影響學生健康之物品或行為，依學生年齡、學習階段及校園實際需要，得適時輔導、管理或限制其使用，並訂定適當管理規範。","finalWhy":"修正通過。,","review":{"note":"修正通過","text":"學校應加強辦理健康促進及建立健康生活行為等活動。\n學校對影響學生健康之物品或行為，依學生年齡、學習階段及校園實際需要，得適時輔導、管理或限制其使用，並訂定適當管理規範。"}},{"no":"第二十一條","current":"學校之籌設應考慮校址之地質、水土保持、交通、空氣與水污染、噪音及其他環境影響因素。\n學校校舍建築、飲用水、廁所、洗手台、垃圾、污水處理、噪音、通風、採光、照明、粉板、課桌椅、消防及無障礙校園設施、哺育母乳環境設施等，應符合相關法令規定標準。","versions":[{"bill":"202110070330000","text":"學校之籌設應考慮校址之地質、水土保持、交通、空氣與水污染、噪音及其他環境影響因素。\n學校校舍建築、廚房、飲用水、廁所、洗手台、垃圾、污水處理、噪音、通風、採光、照明、粉板、課桌椅、消防及無障礙校園設施、哺育母乳環境設施等，應符合相關法令規定標準。","note":"一、第一項未修正。\n二、第二項酌調文字。於校園內應符合相關法令規定標準之項目增加廚房，確保孩童的飲食健康。"},{"bill":"202110166730000","text":"學校之籌設應考慮校址之地質、水土保持、交通、空氣與水污染、噪音及其他環境影響因素。\n學校校舍建築、飲用水、廁所、洗手台、垃圾、污水處理、噪音、室內空氣品質、通風、採光、照明、粉板、課桌椅、消防及無障礙校園設施、哺育母乳環境設施等，應符合相關法令規定標準。","note":"一、第一項未修正。\n二、參酌日本及韓國已訂定專法，針對學校室內空氣品質訂定標準，並進行管制，以保障學生健康與學校成效，維護我國兒少呼吸權，並落實聯合國《兒童權利公約》保障其健康權和發展權，爰於第二項將室內空氣品質明文納入學校衛生法的校園環境設施要求。"},{"bill":"202110216920000","text":"學校之籌設應考慮校址之地質、水土保持、交通、空氣與水污染、噪音及其他環境影響因素。\n學校校舍建築、飲用水、廁所、洗手台、垃圾、污水處理、噪音、通風、採光、照明、粉板、課桌椅、消防及無障礙校園設施、哺育母乳環境設施等，應符合相關法令規定標準。\n學校之廁所及相關衛生設施設計、改善及管理，除應符合相關法令規定外，並應蒐集學生意見，以提升設施之實用性及友善性。","note":"一、現行條文主要著重於學校廁所及相關衛生設施之硬體設置標準，惟實務上，廁所係學生高頻率使用之日常生活空間，其使用經驗直接影響學生之身心健康、隱私感受及校園生活品質。\n二、目前學校於廁所設計、改善及管理過程中，普遍欠缺系統性之學生意見蒐集機制，致設施設計與實際使用需求間存有落差。例如廁所數量與動線規劃未符使用需求、清潔維護與管理方式未能貼近學生使用習慣，以及性別友善與隱私空間不足，或未能兼顧高齡及特殊需求學生之使用便利性等情形。\n三、為落實以學生為本之教育環境，並提升校園衛生設施之實用性及友善性，爰增訂學校應建立使用者參與機制，蒐集學生意見之規定，以強化設施設計與實際需求之連結。"}],"changed":false,"final":"學校之籌設應考慮校址之地質、水土保持、交通、空氣與水污染、噪音及其他環境影響因素。\n學校校舍建築、飲用水、廁所、洗手台、垃圾、污水處理、噪音、通風、採光、照明、粉板、課桌椅、消防及無障礙校園設施、哺育母乳環境設施等，應符合相關法令規定標準。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十四條","current":"高級中等以下學校，應全面禁菸；並不得供售菸、酒、檳榔及其他有害身心健康之物質。","versions":[{"bill":"202110062030000","text":"高級中等以下學校，應全面禁菸及電子煙和新型態菸品；並不得供售菸、酒、檳榔、尼古丁產製品及其他有害身心健康之物質。","note":"有鑑於現行條文僅規範菸品，然對於使用電子加熱器、霧化器或電子煙品及新型態菸品未有規範，然電子煙與新型態菸品對青少年身心健康危害更大，應以法律規範禁止販售與吸食，維護青少年身心健康。"},{"bill":"202110142320000","text":"高級中等以下學校，應全面禁菸、電子菸等類菸品；並不得供售菸、酒、檳榔、尼古丁產製品及其他有害身心健康之物質。","note":"一、現行法規雖已針對傳統紙菸進行規範，惟對電子菸、加熱菸、霧化器等新型態菸品之製造、販售與使用，仍未設明確限制。\n二、此類產品對青少年具高度成癮性與健康風險，除影響呼吸系統與神經發展外，實務上亦發現電子菸載具易被混用或摻入毒品、類大麻等管制物質，增加青少年接觸非法藥物之風險。\n三、為防範菸害與毒品問題交錯擴散，並健全青少年健康保護與法制防線，實有必要明文禁止電子煙及新型態菸品之販售與使用。"}],"changed":true,"final":"高級中等以下學校，應全面禁菸、電子煙及新型態菸品；並不得供售菸品、類菸品、酒、檳榔、尼古丁產製品及其他有害身心健康之物質。","finalWhy":"修正通過。,","review":{"note":"修正通過","text":"高級中等以下學校，應全面禁菸、電子煙及新型態菸品；並不得供售菸品、類菸品、酒、檳榔、尼古丁產製品及其他有害身心健康之物質。"}},{"no":"第二十五條","current":"學校應訂定計畫，每學期定期實施建築設備安全及環境衛生檢查；並應隨時維護教學與運動遊戲器材設備，開學前應澈底檢修。","versions":[{"bill":"202110012090000","text":"學校應訂定計畫，每學期定期實施建築設備安全及環境衛生檢查；教學與運動遊戲器材設備應考慮通用設計之精神，符合不同年齡、性別、能力或身心障礙學生之安全、健康及使用便利，並應隨時維護，開學前應澈底檢修。","note":"一、酌調本項文字。\n二、為確保身心障礙者權利公約第三十條第五項（d）款之規定能於校園遊具中落實，以保障身障學童之遊戲權，避免身障學童應失去同樂機會而產生相對剝奪感，以致身心無法順利發展，故要求各校於設計或設置教學與運動遊戲器材設備，能針對不同年齡、性別也得以做出適當的調整，使孩童有快樂、友善的成長環境。"}],"changed":false,"final":"學校應訂定計畫，每學期定期實施建築設備安全及環境衛生檢查；並應隨時維護教學與運動遊戲器材設備，開學前應澈底檢修。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}}],"stages":[{"date":"2024-03-01","stage":"一讀","code":"院會-11-1-3","bill":"202110006630000","gazref":"113卷005期5187號 8-8頁"},{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110012090000","gazref":"113卷010期5192號 4-4頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110024000000","gazref":"113卷018期5200號 16-16頁"},{"d <script>

const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],

[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));

}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;

function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });

  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');

const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));

}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {

function copyHere(id) {

function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {
  box.textContent = '';
  const clip = {}; s.clips.forEach(c => { clip[normName(c.n) + '|' + c.t] = c.u; (clip[normName(c.n)] = clip[normName(c.n)] || c.u); });
  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      const pa = PARTY[normName(t.s)];
      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});
      d.dataset.fp = fp(t.s + '|' + (t.b.find(x => typeof x === 'string') || '').slice(0, 30));
      here.addEventListener('click', () => copyHere(d.id + '-' + d.dataset.fp));
      who.append(here);
      d.append(who);
      if (!chair && !first.has(t.s)) first.set(t.s, d);
    }
    const put = (into, b) => {
      if (typeof b === 'string') into.append(para(b));
      else if (b.fold) {   // 照登的文件（提案條文全文、審查報告、機關書面報告）：收成一行
        const inner = el('div', {class: 'readout'});

      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));
    turns.append(d);
  });
  const idx = el('div', {class: 'idx'}, el('span', {text: '跳到發言者（' + first.size + ' 位）'}));
  const chips = el('div', {class: 'chips'});

  idx.append(chips);

}

const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});

let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}

      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
