原處分機關、該管警察機關或軍事機關送達，並由執行送達人作成送達證書。\n復審文書不能依前二項規定送達者，得將文書寄存於送達地之鄉（鎮、市）公所、區公所或村（里）辦公處，並作送達通知書二份，一份黏貼於應受送達人住居所、事務所或營業所門首，一份置於應受送達人之信箱或其他適當之處所，以為送達。由郵務人員為送達人者，得將文書寄存於附近之郵務機構。\n前項寄存送達，自寄存之日起，經十日發生效力。","note":"一、參酌公務人員保障法第七十六條第一項，於第一項定明復審文書之送達，權保會應註明復審人等相關事項後，交由郵政機構送達。\n二、參酌公務人員保障法第七十六條第二項，於第二項定明不能為郵務送達者，權保會得派員或囑託其他機關送達之。\n三、參酌行政訴訟法第七十三條第一項及第二項，於第三項定明寄存送達復審文書之要件及方式。\n四、參酌行政訴訟法第七十三條第三項，於第四項定明寄存送達之生效日。"},{"bill":"202110044700000","text":"復審文書之送達，除前條規定外，依行政程序法相關規定辦理。","note":"復審文書除第三十五條規定外，應依行政程序法相關規定辦理送達。"}],"changed":true,"final":"復審文書之送達，除前條規定外，依行政程序法相關規定辦理。","finalWhy":"復審文書除第三十五條規定外，應依行政程序法相關規定辦理送達。","review":{"note":"照行政院提案通過","text":"本法施行細則，由國防部定之。"}},{"no":"第三十七條","current":null,"versions":[{"bill":"201110006770000","text":"復審就書面審查決定之。\n權保會於必要時，得通知復審人或有關人員到達指定處所陳述意見並接受詢問。\n復審人請求陳述意見而有正當理由者，應予到達指定處所陳述意見之機會。","note":"一、參酌公務人員保障法第五十條第一項，於第一項定明復審以書面審查為原則。\n二、參酌公務人員保障法第五十條第二項，於第二項定明權保會得通知復審人或相關人員到場陳述意見並接受詢問。\n三、為強化對軍人權益之保障，爰參酌公務人員保障法第五十條第三項，於第三項定明復審人如請求到場陳述意見且理由正當者，應給予陳述之機會。"},{"bill":"202110033240000","text":"復審就書面審查決定之。\n權保會於必要時，得通知復審人或有關人員到達指定處所陳述意見並接受詢問。\n復審人請求陳述意見而有正當理由者，應予到達指定處所陳述意見之機會。","note":"一、參酌公務人員保障法第五十條第一項，於第一項定明復審以書面審查為原則。\n二、參酌公務人員保障法第五十條第二項，於第二項定明權保會得通知復審人或相關人員到場陳述意見並接受詢問。\n三、為強化對軍人權益之保障，爰參酌公務人員保障法第五十條第三項，於第三項定明復審人如請求到場陳述意見且理由正當者，應給予陳述之機會。"},{"bill":"202110036610000","text":"復審文書之送達，除前條規定外，依行政程序法相關規定辦理。","note":"復審文書除第三十六條規定外，應依行政程序法相關規定辦理送達。"},{"bill":"202110044700000","text":"復審就書面審查決定之。\n權保會於必要時，得通知復審人或有關人員到達指定處所陳述意見並接受詢問。\n復審人請求陳述意見而有正當理由者，應予到達指定處所陳述意見之機會。","note":"一、參酌公務人員保障法第五十條第一項，於第一項定明復審以書面審查為原則。\n二、參酌公務人員保障法第五十條第二項，於第二項定明權保會得通知復審人或相關人員到場陳述意見並接受詢問。\n三、為強化對軍人權益之保障，爰參酌公務人員保障法第五十條第三項，於第三項定明復審人如請求到場陳述意見且理由正當者，應給予陳述之機會。"}],"changed":true,"final":"復審就書面審查決定之。\n權保會於必要時，得通知復審人或有關人員到達指定處所陳述意見並接受詢問。\n復審人請求陳述意見而有正當理由者，應予到達指定處所陳述意見之機會。\n復審人或有關人員，如有不通曉國語者，由通譯傳譯之；其為聽覺或語言障礙者，除由通譯傳譯之外，並得依其選擇以文字詢問，或請其以文字陳述。","finalWhy":"一、參酌公務人員保障法第五十條第一項，於第一項定明復審以書面審查為原則。\n二、參酌公務人員保障法第五十條第二項，於第二項定明權保會得通知復審人或相關人員到場陳述意見並接受詢問。\n三、為強化對軍人權益之保障，爰參酌公務人員保障法第五十條第三項，於第三項定明復審人如請求到場陳述意見且理由正當者，應給予陳述之機會。\n四、參酌家事事件法第十九條及刑事訴訟法第九十九條，於第四項定明復審人或有關人員如有不通曉國語、為聽覺或語言障礙者，權保會得使用通譯，並得使用文字詢問或陳述。","review":{"note":"照行政院提案通過","text":"本法施行日期，由行政院定之。"}},{"no":"第三十八條","current":null,"versions":[{"bill":"201110006770000","text":"權保會於必要時，得依職權或復審人之申請，通知復審人或其代表人、復審代理人、輔佐人及原處分機關派員於指定期日到達指定處所言詞辯論。","note":"為使復審人有與原處分機關辯論之機會，俾使權保會迅速釐清事實，爰參酌公務人員保障法第五十二條，定明必要時得舉行言詞辯論。"},{"bill":"202110033240000","text":"權保會於必要時，得依職權或復審人之申請，通知復審人或其代表人、復審代理人、輔佐人及原處分機關派員於指定期日到達指定處所言詞辯論。","note":"為使復審人有與原處分機關辯論之機會，俾使權保會迅速釐清事實，爰參酌公務人員保障法第五十二條，定明必要時得舉行言詞辯論。"},{"bill":"202110036610000","text":"復審就書面審查決定之。\n權保會於必要時，得通知復審人或有關人員到達指定處所陳述意見並接受詢問。\n復審人請求陳述意見而有正當理由者，應予到達指定處所陳述意見之機會。","note":"一、參酌公務人員保障法第五十條第一項，於第一項定明復審以書面審查為原則。\n二、參酌公務人員保障法第五十條第二項，於第二項定明權保會得通知復審人或相關人員到場陳述意見並接受詢問。\n三、為強化對軍人權益之保障，爰參酌公務人員保障法第五十條第三項，於第三項定明復審人如請求到場陳述意見且理由正當者，應給予陳述之機會。"},{"bill":"202110044700000","text":"權保會於必要時，得依職權或復審人之申請，通知復審人或其代表人、復審代理人、輔佐人及原處分機關派員於指定期日到達指定處所言詞辯論。","note":"為使復審人有與原處分機關辯論之機會，俾使權保會迅速釐清事實，爰參酌公務人員保障法第五十二條，定明必要時得舉行言詞辯論。"}],"changed":true,"final":"權保會於必要時，得依職權或復審人之申請，通知復審人或其代表人、復審代理人、輔佐人及原處分機關派員於指定期日到達指定處所言詞辯論。","finalWhy":"為使復審人有與原處分機關辯論之機會，俾使權保會迅速釐清事實，爰參酌公務人員保障法第五十二條，定明必要時得舉行言詞辯論。","review":{"note":"照行政院提案通過","text":"調查人員應依本法或相關法令實施調查，不得以違背法令或其他不正方法取得證據。\n以違背法令或其他不正方法實施調查所取得之證據，不得作為認定違紀行為之基礎。但以違背法令或其他不正方法取得證據之情節輕微，排除該證據之使用明顯有違國防、軍事或公共利益者，不在此限。"}},{"no":"第三十九條","current":null,"versions":[{"bill":"201110006770000","text":"言詞辯論由資深之專任權保委員主持，程序如下：\n一、書記官陳述事件要旨。\n二、復審人或復審代理人就事件為事實上及法律上之陳述。\n三、原處分機關就事件為事實上及法律上之陳述。\n四、有關機關或人員之陳述。\n五、復審人、復審代理人或原處分機關對他方之陳述或答辯，為再答辯。\n六、權保會對復審人、復審代理人及原處分機關或有關人員提出詢問。\n七、復審人之最後陳述。\n前項言詞辯論未完備者，得再為辯論。","note":"一、參酌公務人員保障法第五十四條第一項，於第一項定明言詞辯論進行程序，並由資深之專任權保委員主持之，俾使相關人員得充分陳述意見。又為符程序正義，給予復審人有最後陳述之機會。\n二、參酌公務人員保障法第五十四條第二項，於第二項定明言詞辯論未完備者，得再為辯論。"},{"bill":"202110033240000","text":"言詞辯論由資深之專任權保委員主持，程序如下：\n一、書記官陳述事件要旨。\n二、復審人或復審代理人就事件為事實上及法律上之陳述。\n三、原處分機關就事件為事實上及法律上之陳述。\n四、有關機關或人員之陳述。\n五、復審人、復審代理人或原處分機關對他方之陳述或答辯，為再答辯。\n六、權保會對復審人、復審代理人及原處分機關或有關人員提出詢問。\n七、復審人之最後陳述。\n前項言詞辯論未完備者，得再為辯論。","note":"一、參酌公務人員保障法第五十四條第一項，於第一項定明言詞辯論進行程序，並由資深之專任權保委員主持之，俾使相關人員得充分陳述意見。又為符程序正義，給予復審人有最後陳述之機會。\n二、參酌公務人員保障法第五十四條第二項，於第二項定明言詞辯論未完備者，得再為辯論。"},{"bill":"202110036610000","text":"權保會於必要時，得依職權或復審人之申請，通知復審人或其代表人、復審代理人、輔佐人及原處分機關派員於指定期日到達指定處所言詞辯論。","note":"為使復審人有與原處分機關辯論之機會，俾使權保會迅速釐清事實，爰參酌公務人員保障法第五十二條，定明必要時得舉行言詞辯論。"},{"bill":"202110044700000","text":"言詞辯論由資深之專任權保委員主持，程序如下：\n一、書記官陳述事件要旨。\n二、復審人或復審代理人就事件為事實上及法律上之陳述。\n三、原處分機關就事件為事實上及法律上之陳述。\n四、有關機關或人員之陳述。\n五、復審人、復審代理人或原處分機關對他方之陳述或答辯，為再答辯。\n六、權保會對復審人、復審代理人及原處分機關或有關人員提出詢問。\n七、復審人之最後陳述。\n前項言詞辯論未完備者，得再為辯論。","note":"一、參酌公務人員保障法第五十四條第一項，於第一項定明言詞辯論進行程序，並由資深之專任權保委員主持之，俾使相關人員得充分陳述意見。又為符程序正義，給予復審人有最後陳述之機會。\n二、參酌公務人員保障法第五十四條第二項，於第二項定明言詞辯論未完備者，得再為辯論。"}],"changed":true,"final":"言詞辯論由資深之專任權保委員主持，程序如下：\n一、書記官陳述事件要旨。\n二、復審人或復審代理人就事件為事實上及法律上之陳述。\n三、原處分機關就事件為事實上及法律上之陳述。\n四、有關機關或人員之陳述。\n五、復審人、復審代理人或原處分機關對他方之陳述或答辯，為再答辯。\n六、權保會對復審人、復審代理人及原處分機關或有關人員提出詢問。\n七、復審人之最後陳述。\n前項言詞辯論未完備者，得再為辯論。","finalWhy":"一、參酌公務人員保障法第五十四條第一項，於第一項定明言詞辯論進行程序，並由資深之專任權保委員主持之，俾使相關人員得充分陳述意見。又為符程序正義，給予復審人有最後陳述之機會。\n二、參酌公務人員保障法第五十四條第二項，於第二項定明言詞辯論未完備者，得再為辯論。","review":{"note":"照行政院提案通過","text":"軍人無正當理由不得規避或拒絕調查。\n軍人因他人涉有違紀行為接受調查時，不得有偽造、變造、湮滅或隱匿與調查該違紀行為有關之證據資料，或於詢問時為虛偽或不實陳述等妨害調查之行為。"}},{"no":"第四十條","current":null,"versions":[{"bill":"201110006770000","text":"權保會審議復審事件，應指定書記官製作審議紀錄附卷。權保委員於審議中所持與決議不同之意見，經其請求者，應列入紀錄。\n前項紀錄得以錄音或錄影輔助之；復審審議經言詞辯論者，應另行製作筆錄，編為前項紀錄之附件，並準用民事訴訟法第二百十二條至第二百十九條之規定。","note":"參酌訴願法第五十四條，定明權保會製作審議紀錄及言詞辯論筆錄之方式。"},{"bill":"202110033240000","text":"權保會審議復審事件，應指定書記官製作審議紀錄附卷。權保委員於審議中所持與決議不同之意見，經其請求者，應列入紀錄。\n前項紀錄得以錄音或錄影輔助之；復審審議經言詞辯論者，應另行製作筆錄，編為前項紀錄之附件，並準用民事訴訟法第二百十二條至第二百十九條之規定。","note":"參酌訴願法第五十四條，定明權保會製作審議紀錄及言詞辯論筆錄之方式。"},{"bill":"202110036610000","text":"言詞辯論由資深之專任權保委員主持，程序如下：\n一、書記官陳述事件要旨。\n二、復審人或復審代理人就事件為事實上及法律上之陳述。\n三、原處分機關就事件為事實上及法律上之陳述。\n四、有關機關或人員之陳述。\n五、復審人、復審代理人或原處分機關對他方之陳述或答辯，為再答辯。\n六、權保會對復審人、復審代理人及原處分機關或有關人員提出詢問。\n七、復審人之最後陳述。\n前項言詞辯論未完備者，得再為辯論。","note":"一、參酌公務人員保障法第五十四條第一項，於第一項定明言詞辯論進行程序，並由資深之專任權保委員主持之，俾使相關人員得充分陳述意見。又為符程序正義，給予復審人有最後陳述之機會。\n二、參酌公務人員保障法第五十四條第二項，於第二項定明言詞辯論未完備者，得再為辯論。"},{"bill":"202110044700000","text":"權保會審議復審事件，應指定書記官製作審議紀錄附卷。權保委員於審議中所持與決議不同之意見，經其請求者，應列入紀錄。\n前項紀錄得以錄音或錄影輔助之；復審審議經言詞辯論者，應另行製作筆錄，編為前項紀錄之附件，並準用民事訴訟法第二百十二條至第二百十九條之規定。","note":"參酌訴願法第五十四條，定明權保會製作審議紀錄及言詞辯論筆錄之方式。"}],"changed":true,"final":"權保會審議復審事件，應指定書記官製作審議紀錄附卷。權保委員於審議中所持與決議不同之意見，經其請求者，應列入紀錄。\n前項紀錄得以錄音或錄影輔助之；復審審議經言詞辯論者，應另行製作筆錄，編為前項紀錄之附件，並準用民事訴訟法第二百十二條至第二百十九條之規定。","finalWhy":"參酌訴願法第五十四條，定明權保會製作審議紀錄及言詞辯論筆錄之方式。","review":{"note":"照行政院提案通過","text":"國防部及其所屬服役機關之軍人涉有違紀行為，且有下列情形之一者，得由國防部自行或指定所屬服役機關實施專案調查，並作成專案調查報告：\n一、服役機關處所內人員死亡或重大傷害。\n二、演習或訓練事故。\n三、將官違紀行為。\n四、其他有專案調查必要。\n前項第一款情形之傷者，或傷亡者之配偶、二親等內親屬及以永久共同生活為目的同居一家之人，得於發生後六個月內，向國防部申請前項專案調查。"}},{"no":"第四十一條","current":null,"versions":[{"bill":"201110006770000","text":"復審人得提出證據書類、證物或其他證據方法。權保會限定於一定期間內提出者，應於該期間內提出。","note":"參酌公務人員保障法第五十五條，定明復審人得提出有利於己之證據或證據方法供權保會審酌，惟為免延誤復審之決定，權保會得酌定期間令其提出。"},{"bill":"202110033240000","text":"復審人得提出證據書類、證物或其他證據方法。權保會限定於一定期間內提出者，應於該期間內提出。","note":"參酌公務人員保障法第五十五條，定明復審人得提出有利於己之證據或證據方法供權保會審酌，惟為免延誤復審之決定，權保會得酌定期間令其提出。"},{"bill":"202110036610000","text":"權保會審議復審事件，應指定書記官製作審議紀錄附卷。權保委員於審議中所持與決議不同之意見，經其請求者，應列入紀錄。\n前項紀錄得以錄音或錄影輔助之；復審審議經言詞辯論者，應另行製作筆錄，編為前項紀錄之附件，並準用民事訴訟法第二百十二條至第二百十九條之規定。","note":"參酌訴願法第五十四條，定明權保會製作審議紀錄及言詞辯論筆錄之方式。"},{"bill":"202110044700000","text":"復審人得提出證據書類、證物或其他證據方法。權保會限定於一定期間內提出者，應於該期間內提出。","note":"參酌公務人員保障法第五十五條，定明復審人得提出有利於己之證據或證據方法供權保會審酌，惟為免延誤復審之決定，權保會得酌定期間令其提出。"}],"changed":true,"final":"復審人得提出證據書類、證物或其他證據方法。權保會限定於一定期間內提出者，應於該期間內提出。","finalWhy":"參酌公務人員保障法第五十五條，定明復審人得提出有利於己之證據或證據方法供權保會審酌，惟為免延誤復審之決定，權保會得酌定期間令其提出。","review":{"note":"照行政院提案通過","text":"軍人涉有違紀行為，且有下列情形之一者，權責長官得不實施調查或終止調查：\n一、同一違紀行為已受懲戒或懲罰。經調查而未受懲罰者，亦同。\n二、違紀行為後，據以懲罰之法令經廢止或停止適用。\n三、懲罰權已逾第三十四條規定之行使期間。\n四、涉有違紀行為之人死亡。\n五、匿名舉發，或未具體指出行為人或事實。\n六、舉發事實不明，且舉發人經合法通知，無正當理由拒絕到場陳述其舉發事實。\n七、舉發事實顯不構成違紀行為。"}},{"no":"第四十二條","current":null,"versions":[{"bill":"201110006770000","text":"權保會得依職權或依復審人之申請，命文書或其他物件之持有人提出該物件，並得留置之。\n公務員或機關掌管之文書或其他物件，權保會得調閱之。\n前項情形，除有妨害國家機密或法律另有規定外，該公務員或機關不得拒絕。","note":"一、參酌公務人員保障法第五十六條第一項及第二項，於第一項及第二項賦予權保會取得文書或其他物件之權限。\n二、參酌公務人員保障法第五十六條第三項，於第三項定明第二項調閱之文書及其他物件，除涉及妨害國家機密、軍事機密、國防秘密、一般公務機密，或依刑事偵查等法律規定有保密必要時，公務員或機關不得拒絕之。"},{"bill":"202110033240000","text":"權保會得依職權或依復審人之申請，命文書或其他物件之持有人提出該物件，並得留置之。\n公務員或機關掌管之文書或其他物件，權保會得調閱之。\n前項情形，除有妨害國家機密或法律另有規定外，該公務員或機關不得拒絕。","note":"一、參酌公務人員保障法第五十六條第一項及第二項，於第一項及第二項賦予權保會取得文書或其他物件之權限。\n二、參酌公務人員保障法第五十六條第三項，於第三項定明第二項調閱之文書及其他物件，除涉及妨害國家機密、軍事機密、國防秘密、一般公務機密，或依刑事偵查等法律規定有保密必要時，公務員或機關不得拒絕之。"},{"bill":"202110036610000","text":"復審人得提出證據書類、證物或其他證據方法。權保會限定於一定期間內提出者，應於該期間內提出。","note":"參酌公務人員保障法第五十五條，定明復審人得提出有利於己之證據或證據方法供權保會審酌，惟為免延誤復審之決定，權保會得酌定期間令其提出。"},{"bill":"202110044700000","text":"權保會得依職權或依復審人之申請，命文書或其他物件之持有人提出該物件，並得留置之。\n公務員或機關掌管之文書或其他物件，權保會得調閱之。\n前項情形，除有妨害國家機密或法律另有規定外，該公務員或機關不得拒絕。","note":"一、參酌公務人員保障法第五十六條第一項及第二項，於第一項及第二項賦予權保會取得文書或其他物件之權限。\n二、參酌公務人員保障法第五十六條第三項，於第三項定明第二項調閱之文書及其他物件，除涉及妨害國家機密、軍事機密、國防秘密、一般公務機密，或依刑事偵查等法律規定有保密必要時，公務員或機關不得拒絕之。"}],"changed":true,"final":"權保會得依職權或依復審人之申請，命文書或其他物件之持有人提出該物件，並得留置之。\n公務員或機關掌管之文書或其他物件，權保會得調閱之。\n前項情形，除有妨害國家機密或法律另有規定外，該公務員或機關不得拒絕。","finalWhy":"一、參酌公務人員保障法第五十六條第一項及第二項，於第一項及第二項賦予權保會取得文書或其他物件之權限。\n二、參酌公務人員保障法第五十六條第三項，於第三項定明第二項調閱之文書及其他物件，除涉及妨害國家機密、軍事機密、國防秘密、一般公務機密，或依刑事偵查等法律規定有保密必要時，公務員或機關不得拒絕之。","review":null},{"no":"第四十三條","current":null,"versions":[{"bill":"201110006770000","text":"權保會得依職權或囑託有關機關（構）、學校、法人、團體或具專門知識經驗者，就必要之物件、證據，實施檢驗、勘驗或鑑定。鑑定人由權保會指定之。\n權保會依前項規定實施勘驗時，應將日、時、處所通知復審人及有關人員到場。\n第一項所需費用，由權保會負擔；權保會得依鑑定人之請求預行酌給之。\n權保會依第一項檢驗、勘驗或鑑定之結果，非經賦予復審人表示意見之機會，不得採為對其不利之復審決定之基礎。\n權保會認無實施檢驗、勘驗或鑑定之必要，而復審人願自行負擔費用，請求依第一項規定實施檢驗、勘驗或鑑定時，權保會非有正當理由不得拒絕。\n依前項規定檢驗、勘驗或鑑定所得結果，據為有利於復審人之決定或裁判時，復審人得於復審或行政訴訟確定後三十日內，請求權保會償還必要之費用。","note":"一、參酌公務人員保障法第五十七條第一項，於第一項前段定明權保會對復審事件之相關證據，必要時得施以檢驗、勘驗或委請鑑定。另參酌訴願法第六十九條第三項，於第一項後段定明鑑定人由權保會指定。\n二、參酌訴願法第七十四條第二項，於第二項定明實施勘驗時應通知之人員及事項。\n三、參酌公務人員保障法第五十七條第二項，於第三項定明第一項費用負擔之機關。\n四、參酌公務人員保障法第五十七條第三項，於第四項定明第一項檢驗、勘驗或鑑定之結果，應賦予復審人表示意見之機會，始得採為對其不利復審決定之基礎。\n五、參酌公務人員保障法第五十七條第四項，於第五項定明復審人請求自費實施檢驗、勘驗或鑑定時，權保會無正當理由不得拒絕。\n六、參酌公務人員保障法第五十七條第五項，於第六項定明復審人得請求權保會償還其自費實施檢驗、勘驗或鑑定之事由及償還範圍。"},{"bill":"202110033240000","text":"權保會得依職權或囑託有關機關（構）、學校、法人、團體或具專門知識經驗者，就必要之物件、證據，實施檢驗、勘驗或鑑定。鑑定人由權保會指定之。\n權保會依前項規定實施勘驗時，應將日、時、處所通知復審人及有關人員到場。\n第一項所需費用，由權保會負擔；權保會得依鑑定人之請求預行酌給之。\n權保會依第一項檢驗、勘驗或鑑定之結果，非經賦予復審人表示意見之機會，不得採為對其不利之復審決定之基礎。\n權保會認無實施檢驗、勘驗或鑑定之必要，而復審人願自行負擔費用，請求依第一項規定實施檢驗、勘驗或鑑定時，權保會非有正當理由不得拒絕。\n依前項規定檢驗、勘驗或鑑定所得結果，據為有利於復審人之決定或裁判時，復審人得於復審或行政訴訟確定後三十日內，請求權保會償還必要之費用。","note":"一、參酌公務人員保障法第五十七條第一項，於第一項前段定明權保會對復審事件之相關證據，必要時得施以檢驗、勘驗或委請鑑定。另參酌訴願法第六十九條第三項，於第一項後段定明鑑定人由權保會指定。\n二、參酌訴願法第七十四條第二項，於第二項定明實施勘驗時應通知之人員及事項。\n三、參酌公務人員保障法第五十七條第二項，於第三項定明第一項費用負擔之機關。\n四、參酌公務人員保障法第五十七條第三項，於第四項定明第一項檢驗、勘驗或鑑定之結果，應賦予復審人表示意見之機會，始得採為對其不利復審決定之基礎。\n五、參酌公務人員保障法第五十七條第四項，於第五項定明復審人請求自費實施檢驗、勘驗或鑑定時，權保會無正當理由不得拒絕。\n六、參酌公務人員保障法第五十七條第五項，於第六項定明復審人得請求權保會償還其自費實施檢驗、勘驗或鑑定之事由及償還範圍。"},{"bill":"202110036610000","text":"權保會得依職權或依復審人之申請，命文書或其他物件之持有人提出該物件，並得留置之。\n公務員或機關掌管之文書或其他物件，權保會得調閱之。\n前項情形，除有妨害國家機密或法律另有規定外，該公務員或機關不得拒絕。","note":"一、參酌公務人員保障法第五十六條第一項及第二項，於第一項及第二項賦予權保會取得文書或其他物件之權限。\n二、參酌公務人員保障法第五十六條第三項，於第三項定明第二項調閱之文書及其他物件，除涉及妨害國家機密、軍事機密、國防秘密、一般公務機密，或依刑事偵查等法律規定有保密必要時，公務員或機關不得拒絕之。"},{"bill":"202110044700000","text":"權保會得依職權或囑託有關機關（構）、學校、法人、團體或具專門知識經驗者，就必要之物件、證據，實施檢驗、勘驗或鑑定。鑑定人由權保會指定之。\n權保會依前項規定實施勘驗時，應將日、時、處所通知復審人及有關人員到場。\n第一項所需費用，由權保會負擔；權保會得依鑑定人之請求預行酌給之。\n權保會依第一項檢驗、勘驗或鑑定之結果，非經賦予復審人表示意見之機會，不得採為對其不利之復審決定之基礎。\n權保會認無實施檢驗、勘驗或鑑定之必要，而復審人願自行負擔費用，請求依第一項規定實施檢驗、勘驗或鑑定時，權保會非有正當理由不得拒絕。\n依前項規定檢驗、勘驗或鑑定所得結果，據為有利於復審人之決定或裁判時，復審人得於復審或行政訴訟確定後三十日內，請求權保會償還必要之費用。","note":"一、參酌公務人員保障法第五十七條第一項，於第一項前段定明權保會對復審事件之相關證據，必要時得施以檢驗、勘驗或委請鑑定。另參酌訴願法第六十九條第三項，於第一項後段定明鑑定人由權保會指定。\n二、參酌訴願法第七十四條第二項，於第二項定明實施勘驗時應通知之人員及事項。\n三、參酌公務人員保障法第五十七條第二項，於第三項定明第一項費用負擔之機關。\n四、參酌公務人員保障法第五十七條第三項，於第四項定明第一項檢驗、勘驗或鑑定之結果，應賦予復審人表示意見之機會，始得採為對其不利復審決定之基礎。\n五、參酌公務人員保障法第五十七條第四項，於第五項定明復審人請求自費實施檢驗、勘驗或鑑定時，權保會無正當理由不得拒絕。\n六、參酌公務人員保障法第五十七條第五項，於第六項定明復審人得請求權保會償還其自費實施檢驗、勘驗或鑑定之事由及償還範圍。"}],"changed":true,"final":"權保會得依職權或囑託有關機關（構）、學校、法人、團體或具專門知識經驗者，就必要之物件、證據，實施檢驗、勘驗或鑑定。鑑定人由權保會指定之。\n權保會依前項規定實施勘驗時，應將日、時、處所通知復審人及有關人員到場。\n第一項所需費用，由權保會負擔；權保會得依鑑定人之請求預行酌給之。\n權保會依第一項檢驗、勘驗或鑑定之結果，非經賦予復審人表示意見之機會，不得採為對其不利之復審決定之基礎。\n權保會認無實施檢驗、勘驗或鑑定之必要，而復審人願自行負擔費用，請求依第一項規定實施檢驗、勘驗或鑑定時，權保會非有正當理由不得拒絕。\n依前項規定檢驗、勘驗或鑑定所得結果，據為有利於復審人之決定或裁判時，復審人得於復審或行政訴訟確定後三十日內，請求權保會償還必要之費用。","finalWhy":"一、參酌公務人員保障法第五十七條第一項，於第一項前段定明權保會對復審事件之相關證據，必要時得施以檢驗、勘驗或委請鑑定。另參酌訴願法第六十九條第三項，於第一項後段定明鑑定人由權保會指定。\n二、參酌訴願法第七十四條第二項，於第二項定明實施勘驗時應通知之人員及事項。\n三、參酌公務人員保障法第五十七條第二項，於第三項定明第一項費用負擔之機關。\n四、參酌公務人員保障法第五十七條第三項，於第四項定明第一項檢驗、勘驗或鑑定之結果，應賦予復審人表示意見之機會，始得採為對其不利復審決定之基礎。\n五、參酌公務人員保障法第五十七條第四項，於第五項定明復審人請求自費實施檢驗、勘驗或鑑定時，權保會無正當理由不得拒絕。\n六、參酌公務人員保障法第五十七條第五項，於第六項定明復審人得請求權保會償還其自費實施檢驗、勘驗或鑑定之事由及償還範圍。","review":{"note":"照行政院提案通過","text":"法律專業人員於非戰時受檢察官指揮，處理下列事務：\n一、實施服役機關處所內之搜索、扣押、勘驗或執行拘提。\n二、詢問告訴人、告發人、犯罪嫌疑人、證人或鑑定人。\n三、襄助檢察官執行法院組織法第六十條所定之職權。\n法律專業人員處理前項第一款及第二款事務時，視為刑事訴訟法第二百三十條第一項之司法警察官。"}},{"no":"第四十四條","current":null,"versions":[{"bill":"201110006770000","text":"鑑定人依前條所為之鑑定，應具鑑定書陳述意見。必要時，權保會得請其到達指定處所說明。\n鑑定人有數人時，得共同陳述意見。但意見不同者，權保會應使其分別陳述意見。\n鑑定所需資料在原處分機關或權保會者，權保會應告知鑑定人准其利用。但其利用之範圍及方法得限制之。\n鑑定人因行鑑定得請求權保會調查證據。","note":"一、參酌公務人員保障法第五十八條第一項，於第一項定明鑑定人應提出鑑定之經過及其結果之書面報告，權保會必要時並得請其以言詞說明。\n二、參酌公務人員保障法第五十八條第二項，於第二項定明鑑定人有數人時，應共同為鑑定，其意見有不同者，權保會應請其分別陳述意見，以供審酌。\n三、參酌公務人員保障法第五十八條第三項，於第三項定明鑑定所需資料，應告知鑑定人許其利用，但為免有礙國家機密及公益，權保會得限制其利用之範圍及方法。\n四、參酌訴願法第七十一條第二項，於第四項定明鑑定人得請求調查證據。"},{"bill":"202110033240000","text":"鑑定人依前條所為之鑑定，應具鑑定書陳述意見。必要時，權保會得請其到達指定處所說明。\n鑑定人有數人時，得共同陳述意見。但意見不同者，權保會應使其分別陳述意見。\n鑑定所需資料在原處分機關或權保會者，權保會應告知鑑定人准其利用。但其利用之範圍及方法得限制之。\n鑑定人因行鑑定得請求權保會調查證據。","note":"一、參酌公務人員保障法第五十八條第一項，於第一項定明鑑定人應提出鑑定之經過及其結果之書面報告，權保會必要時並得請其以言詞說明。\n二、參酌公務人員保障法第五十八條第二項，於第二項定明鑑定人有數人時，應共同為鑑定，其意見有不同者，權保會應請其分別陳述意見，以供審酌。\n三、參酌公務人員保障法第五十八條第三項，於第三項定明鑑定所需資料，應告知鑑定人許其利用，但為免有礙國家機密及公益，權保會得限制其利用之範圍及方法。\n四、參酌訴願法第七十一條第二項，於第四項定明鑑定人得請求調查證據。"},{"bill":"202110036610000","text":"權保會得依職權或囑託有關機關（構）、學校、法人、團體或具專門知識經驗者，就必要之物件、證據，實施檢驗、勘驗或鑑定。鑑定人由權保會指定之。\n權保會依前項規定實施勘驗時，應將日、時、處所通知復審人及有關人員到場。\n第一項所需費用，由權保會負擔；權保會得依鑑定人之請求預行酌給之。\n權保會依第一項檢驗、勘驗或鑑定之結果，非經賦予復審人表示意見之機會，不得採為對其不利之復審決定之基礎。\n權保會認無實施檢驗、勘驗或鑑定之必要，而復審人願自行負擔費用，請求依第一項規定實施檢驗、勘驗或鑑定時，權保會非有正當理由不得拒絕。\n依前項規定檢驗、勘驗或鑑定所得結果，據為有利於復審人之決定或裁判時，復審人得於復審或行政訴訟確定後三十日內，請求權保會償還必要之費用。","note":"一、參酌公務人員保障法第五十七條第一項，於第一項前段定明權保會對復審事件之相關證據，必要時得施以檢驗、勘驗或委請鑑定。另參酌訴願法第六十九條第三項，於第一項後段定明鑑定人由權保會指定。\n二、參酌訴願法第七十四條第二項，於第二項定明實施勘驗時應通知之人員及事項。\n三、參酌公務人員保障法第五十七條第二項，於第三項定明第一項費用負擔之機關。\n四、參酌公務人員保障法第五十七條第三項，於第四項定明第一項檢驗、勘驗或鑑定之結果，應賦予復審人表示意見之機會，始得採為對其不利復審決定之基礎。\n五、參酌公務人員保障法第五十七條第四項，於第五項定明復審人請求自費實施檢驗、勘驗或鑑定時，權保會無正當理由不得拒絕。\n六、參酌公務人員保障法第五十七條第五項，於第六項定明復審人得請求權保會償還其自費實施檢驗、勘驗或鑑定之事由及償還範圍。"},{"bill":"202110044700000","text":"鑑定人依前條所為之鑑定，應具鑑定書陳述意見。必要時，權保會得請其到達指定處所說明。\n鑑定人有數人時，得共同陳述意見。但意見不同者，權保會應使其分別陳述意見。\n鑑定所需資料在原處分機關或權保會者，權保會應告知鑑定人准其利用。但其利用之範圍及方法得限制之。\n鑑定人因行鑑定得請求權保會調查證據。","note":"一、參酌公務人員保障法第五十八條第一項，於第一項定明鑑定人應提出鑑定之經過及其結果之書面報告，權保會必要時並得請其以言詞說明。\n二、參酌公務人員保障法第五十八條第二項，於第二項定明鑑定人有數人時，應共同為鑑定，其意見有不同者，權保會應請其分別陳述意見，以供審酌。\n三、參酌公務人員保障法第五十八條第三項，於第三項定明鑑定所需資料，應告知鑑定人許其利用，但為免有礙國家機密及公益，權保會得限制其利用之範圍及方法。\n四、參酌訴願法第七十一條第二項，於第四項定明鑑定人得請求調查證據。"}],"changed":true,"final":"鑑定人依前條所為之鑑定，應具鑑定書陳述意見。必要時，權保會得請其到達指定處所說明。\n鑑定人有數人時，得共同陳述意見。但意見不同者，權保會應使其分別陳述意見。\n鑑定所需資料在原處分機關或權保會者，權保會應告知鑑定人准其利用。但其利用之範圍及方法得限制之。\n鑑定人因行鑑定得請求權保會調查證據。","finalWhy":"一、參酌公務人員保障法第五十八條第一項，於第一項定明鑑定人應提出鑑定之經過及其結果之書面報告，權保會必要時並得請其以言詞說明。\n二、參酌公務人員保障法第五十八條第二項，於第二項定明鑑定人有數人時，應共同為鑑定，其意見有不同者，權保會應請其分別陳述意見，以供審酌。\n三、參酌公務人員保障法第五十八條第三項，於第三項定明鑑定所需資料，應告知鑑定人許其利用，但為免有礙國家機密及公益，權保會得限制其利用之範圍及方法。\n四、參酌訴願法第七十一條第二項，於第四項定明鑑定人得請求調查證據。","review":{"note":"照行政院提案通過","text":"法律專業人員依本節規定偵查之案件終結前，認有將偵查所得證據資料，移送權責長官辦理懲罰之必要時，應報請檢察官同意後行之。"}},{"no":"第四十五條","current":null,"versions":[{"bill":"201110006770000","text":"復審人對權保會於復審程序進行中所為之程序上處理不服者，應併同復審決定提起行政訴訟。","note":"復審人不服權保會於復審程序之處理時（例如迴避與否之決定等），原得聲明異議，以供權保會審酌，為恐聲明異議影響復審程序之進行，爰參酌公務人員保障法第六十條及訴願法第七十六條，定明應於提起行政訴訟時併同提出。"},{"bill":"202110033240000","text":"復審人對權保會於復審程序進行中所為之程序上處理不服者，應併同復審決定提起行政訴訟。","note":"復審人不服權保會於復審程序之處理時（例如迴避與否之決定等），原得聲明異議，以供權保會審酌，為恐聲明異議影響復審程序之進行，爰參酌公務人員保障法第六十條及訴願法第七十六條，定明應於提起行政訴訟時併同提出。"},{"bill":"202110036610000","text":"鑑定人依前條所為之鑑定，應具鑑定書陳述意見。必要時，權保會得請其到達指定處所說明。\n鑑定人有數人時，得共同陳述意見。但意見不同者，權保會應使其分別陳述意見。\n鑑定所需資料在原處分機關或權保會者，權保會應告知鑑定人准其利用。但其利用之範圍及方法得限制之。\n鑑定人因行鑑定得請求權保會調查證據。","note":"一、參酌公務人員保障法第五十八條第一項，於第一項定明鑑定人應提出鑑定之經過及其結果之書面報告，權保會必要時並得請其以言詞說明。\n二、參酌公務人員保障法第五十八條第二項，於第二項定明鑑定人有數人時，應共同為鑑定，其意見有不同者，權保會應請其分別陳述意見，以供審酌。\n三、參酌公務人員保障法第五十八條第三項，於第三項定明鑑定所需資料，應告知鑑定人許其利用，但為免有礙國家機密及公益，權保會得限制其利用之範圍及方法。\n四、參酌訴願法第七十一條第二項，於第四項定明鑑定人得請求調查證據。"},{"bill":"202110044700000","text":"復審人對權保會於復審程序進行中所為之程序上處理不服者，應併同復審決定提起行政訴訟。","note":"復審人不服權保會於復審程序之處理時（例如迴避與否之決定等），原得聲明異議，以供權保會審酌，為恐聲明異議影響復審程序之進行，爰參酌公務人員保障法第六十條及訴願法第七十六條，定明應於提起行政訴訟時併同提出。"}],"changed":true,"final":"復審人對權保會於復審程序進行中所為之程序上處理不服者，應併同復審決定提起行政訴訟。","finalWhy":"復審人不服權保會於復審程序之處理時（例如迴避與否之決定等），原得聲明異議，以供權保會審酌，為恐聲明異議影響復審程序之進行，爰參酌公務人員保障法第六十條及訴願法第七十六條，定明應於提起行政訴訟時併同提出。","review":{"note":"照行政院提案通過","text":"法律專業人員依本節規定處理偵查案件事務之注意事項及其他相關事項之辦法，由國防部定之。"}},{"no":"第四十六條","current":null,"versions":[{"bill":"201110006770000","text":"復審事件有下列各款情形之一者，應為不受理決定：\n一、復審書不合法定程式不能補正或經通知限期補正屆期未補正。\n二、提起復審逾法定期間。\n三、復審人無復審能力而未由法定代理人代為復審行為，經通知限期補正屆期未補正。\n四、復審人不適格。\n五、原行政處分已不存在、已執行而無回復原狀可能且提起復審無實益，或行政處分因其他事由而消滅。\n六、依第十三條第二項提起之復審，應作為之權責機關已為行政處分。\n七、對已決定或已撤回之復審事件重行提起復審。\n八、對不屬復審救濟範圍內之事項，提起復審。\n九、提起復審不備其他法定要件。\n復審人對前項第六款之行政處分不服者，應另提起復審。\n第一項第八款情形，如屬應提起申訴而誤提復審者，權保會應移送申訴管轄機關依申訴程序處理，並通知該誤提復審之人，不得逕為不受理決定。","note":"一、參酌公務人員保障法第六十一條第一項，於第一項定明權保會應為不受理決定之情形：\n(一)第一款指復審書未依第十六條規定載明應記載之事項且無從補正，或未於第二十三條所定通知期間內補正，致復審之提起不合法之情形。\n(二)第二款指復審人未於第十五條第一項或第二項但書所定之法定期間內提起復審等情形。\n(三)第三款指復審之提起違反第二十四條規定，且經通知仍未為補正等情形。\n(四)第四款指復審人對於與自身權益無關之事項提起復審，因欠缺復審權能，故應認復審之提起不合法。\n(五)第五款指原行政處分經撤銷而不存在，以及復審人對「已執行而無回復原狀可能且提起復審無實益」或「因其他事由而消滅」之行政處分提起復審，因其復審已無意義，爰定明權保會亦應為不受理之決定。\n(六)第六款指權保會未就第十三條第二項所定課予義務復審作成決定前，應作為之權責機關如已為行政處分者，權保會應為不受理決定。\n(七)第七款指復審人對於已決定之事件或已依第二十一條規定撤回復審之事件，仍再行提起復審之情形。\n(八)第八款指對非屬第十三條所定復審事件提起復審之情形。\n(九)參酌行政訴訟法第一百零七條第一項第十款有關起訴不備其他要件者，行政法院應以裁定駁回原告之訴之規定，於第九款定明提起復審不備其他法定要件者，權保會應為不受理之決定。\n二、本法之復審為相當於訴願之救濟程序，查最高行政法院一百零一年度二月份庭長法官聯席會議決議雖認以，自程序之保障及訴訟經濟之觀點，所謂「應作為之機關已為行政處分」，係指有利於訴願人之處分而言，至全部或部分拒絕當事人申請之處分，應不包括在內，故於訴願決定作成前，應作為之處分機關已作成之行政處分非全部有利於訴願人時，無須要求訴願人對於該處分重為訴願，訴願機關應續行訴願程序，對嗣後所為之行政處分併為實體審查。惟依第十三條第二項規定提起之復審，應作為之權責機關已為行政處分，復審人如仍對該行政處分不服，因復審之標的及理由與原所提復審均已不相同，倘由同一程序續行審議可能造成處理程序過於複雜，宜以另一復審程序處理較為妥適，且由復審人另提起復審，對其權益實質保障並無影響，為利復審實務運作，爰於第二項定明復審人對第一項第六款之行政處分不服者，應另提起復審救濟之。又為保障復審人權益，使其知悉得就新作成之行政處分另行提起復審，權保會應於不受理決定之理由中教示得另提起復審之意旨，併予敘明。\n三、第一項第八款所定情形，如屬應提申訴而誤提復審者，權保會應移送申訴管轄機關改依申訴程序處理，並通知誤提復審之人，爰參酌公務人員保障法第六十一條第三項，於第三項定明不得逕為不受理決定，以維護其權益。"},{"bill":"202110033240000","text":"復審事件有下列各款情形之一者，應為不受理決定：\n一、復審書不合法定程式不能補正或經通知限期補正屆期未補正。\n二、提起復審逾法定期間。\n三、復審人無復審能力而未由法定代理人代為復審行為，經通知限期補正屆期未補正。\n四、復審人不適格。\n五、原行政處分已不存在、已執行而無回復原狀可能且提起復審無實益，或行政處分因其他事由而消滅。\n六、依第十三條第二項提起之復審，應作為之權責機關已為行政處分。\n七、對已決定或已撤回之復審事件重行提起復審。\n八、對不屬復審救濟範圍內之事項，提起復審。\n九、提起復審不備其他法定要件。\n復審人對前項第六款之行政處分不服者，應另提起復審。\n第一項第八款情形，如屬應提起申訴而誤提復審者，權保會應移送申訴管轄機關依申訴程序處理，並通知該誤提復審之人，不得逕為不受理決定。","note":"一、參酌公務人員保障法第六十一條第一項，於第一項定明權保會應為不受理決定之情形：\n(一)第一款指復審書未依第十六條規定載明應記載之事項且無從補正，或未於第二十三條所定通知期間內補正，致復審之提起不合法之情形。\n(二)第二款指復審人未於第十五條第一項或第二項但書所定之法定期間內提起復審等情形。\n(三)第三款指復審之提起違反第二十四條規定，且經通知仍未為補正等情形。\n(四)第四款指復審人對於與自身權益無關之事項提起復審，因欠缺復審權能，故應認復審之提起不合法。\n(五)第五款指原行政處分經撤銷而不存在，以及復審人對「已執行而無回復原狀可能且提起復審無實益」或「因其他事由而消滅」之行政處分提起復審，因其復審已無意義，爰定明權保會亦應為不受理之決定。\n(六)第六款指權保會未就第十三條第二項所定課予義務復審作成決定前，應作為之權責機關如已為行政處分者，權保會應為不受理決定。\n(七)第七款指復審人對於已決定之事件或已依第二十一條規定撤回復審之事件，仍再行提起復審之情形。\n(八)第八款指對非屬第十三條所定復審事件提起復審之情形。\n(九)參酌行政訴訟法第一百零七條第一項第十款有關起訴不備其他要件者，行政法院應以裁定駁回原告之訴之規定，於第九款定明提起復審不備其他法定要件者，權保會應為不受理之決定。\n二、本法之復審為相當於訴願之救濟程序，查最高行政法院一百零一年度二月份庭長法官聯席會議決議雖認以，自程序之保障及訴訟經濟之觀點，所謂「應作為之機關已為行政處分」，係指有利於訴願人之處分而言，至全部或部分拒絕當事人申請之處分，應不包括在內，故於訴願決定作成前，應作為之處分機關已作成之行政處分非全部有利於訴願人時，無須要求訴願人對於該處分重為訴願，訴願機關應續行訴願程序，對嗣後所為之行政處分併為實體審查。惟依第十三條第二項規定提起之復審，應作為之權責機關已為行政處分，復審人如仍對該行政處分不服，因復審之標的及理由與原所提復審均已不相同，倘由同一程序續行審議可能造成處理程序過於複雜，宜以另一復審程序處理較為妥適，且由復審人另提起復審，對其權益實質保障並無影響，為利復審實務運作，爰於第二項定明復審人對第一項第六款之行政處分不服者，應另提起復審救濟之。又為保障復審人權益，使其知悉得就新作成之行政處分另行提起復審，權保會應於不受理決定之理由中教示得另提起復審之意旨，併予敘明。\n三、第一項第八款所定情形，如屬應提申訴而誤提復審者，權保會應移送申訴管轄機關改依申訴程序處理，並通知誤提復審之人，爰參酌公務人員保障法第六十一條第三項，於第三項定明不得逕為不受理決定，以維護其權益。"},{"bill":"202110036610000","text":"復審人對權保會於復審程序進行中所為之程序上處理不服者，應併同復審決定提起行政訴訟。","note":"復審人不服權保會於復審程序之處理時（例如迴避與否之決定等），原得聲明異議，以供權保會審酌，為恐聲明異議影響復審程序之進行，爰參酌公務人員保障法第六十條及訴願法第七十六條，定明應於提起行政訴訟時併同提出。"},{"bill":"202110044700000","text":"復審事件有下列各款情形之一者，應為不受理決定：\n一、復審書不合法定程式不能補正或經通知限期補正屆期未補正。\n二、提起復審逾法定期間。\n三、復審人無復審能力而未由法定代理人代為復審行為，經通知限期補正屆期未補正。\n四、復審人不適格。\n五、原行政處分已不存在、已執行而無回復原狀可能且提起復審無實益，或行政處分因其他事由
