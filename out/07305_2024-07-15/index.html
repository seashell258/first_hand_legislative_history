<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>軍人權益事件處理法制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

責機關（以下簡稱權責機關）間關於身分、公法上財產請求、獎懲、考績及其他行政處分或管理措施之爭議，除法律另有規定外，適用本法之規定。","note":"一、本法旨在保障軍人權益，並妥慎處理國家與軍人間之公法爭議，如軍人身分、財產（例如待遇、退除給與、撫卹及軍人保險）、獎勵、懲罰、考績及其他行政處分或管理措施等事件之救濟。軍人不服其所屬機關（構）、部隊、學校、行政法人或人事權責機關對其所為上述行政處分或管理措施，於本法施行後，應依本法或改依本法所定復審、申訴、再申訴及行政訴訟程序規定提出救濟。另因應未來法律對於軍人兼具公職律師或醫師等專門職業技術人員身分或特定行政處分為特別救濟規定之可能，爰定明軍人權益之救濟，除其他法律有特別規定外，適用本法之規定。\n二、本法之復審、申訴及再申訴之規範性質與公務人員保障法相似，亦為訴願法第一條第一項但書所定之特別規定，故各機關訴願審議委員會於本法施行後，應不再受理涉及軍人提起之公法爭議事件；如有收受，應逕行移送管轄之地方軍事法院官兵權益保障會或申訴管轄機關。\n三、另本條所定「所屬機關（構）、部隊、學校、行政法人」係指軍人隸屬之編制或實際執行勤務（例如借調其他機關或機構）之機關（單位）。又審酌軍人所屬機關（構）、部隊、學校、行政法人，未必有權核（審）定並作成對軍人任免、待遇支給、獎懲、考績、退除給與等行政處分或實施管理措施（例如教育部所屬軍訓教官之任免及退除給與係由國防部或所屬軍事機關審定），爰將有權作成行政處分或管理措施之機關統稱為「人事權責機關」，並與軍人所屬機關（構）、部隊、學校、行政法人共同簡稱為「權責機關」，併予敘明。"},{"bill":"202110033240000","text":"軍人與其所屬機關（構）、部隊、學校、行政法人或人事權責機關（以下簡稱權責機關）間關於身分、公法上財產請求、獎懲、考績及其他行政處分或管理措施之爭議，除法律另有規定外，適用本法之規定。","note":"一、本法旨在保障軍人權益，並妥慎處理國家與軍人間之公法爭議，如軍人身分、財產（例如待遇、退除給與、撫卹及軍人保險）、獎勵、懲罰、考績及其他行政處分或管理措施等事件之救濟。軍人不服其所屬機關（構）、部隊、學校、行政法人或人事權責機關對其所為上述行政處分或管理措施，於本法施行後，應依本法或改依本法所定復審、申訴、再申訴及行政訴訟程序規定提出救濟。另因應未來法律對於軍人兼具公職律師或醫師等專門職業技術人員身分或特定行政處分為特別救濟規定之可能，爰定明軍人權益之救濟，除其他法律有特別規定外，適用本法之規定。\n二、本法之復審、申訴及再申訴之規範性質與公務人員保障法相似，亦為訴願法第一條第一項但書所定之特別規定，故各機關訴願審議委員會於本法施行後，應不再受理涉及軍人提起之公法爭議事件；如有收受，應逕行移送管轄之地方軍事法院官兵權益保障會或申訴管轄機關。\n三、另本條所定「所屬機關（構）、部隊、學校、行政法人」係指軍人隸屬之編制或實際執行勤務（例如借調其他機關或機構）之機關（單位）。又審酌軍人所屬機關（構）、部隊、學校、行政法人，未必有權核（審）定並作成對軍人任免、待遇支給、獎懲、考績、退除給與等行政處分或實施管理措施（例如教育部所屬軍訓教官之任免及退除給與係由國防部或所屬軍事機關審定），爰將有權作成行政處分或管理措施之機關統稱為「人事權責機關」，並與軍人所屬機關（構）、部隊、學校、行政法人共同簡稱為「權責機關」，併予敘明。"},{"bill":"202110036610000","text":"軍人與其所屬機關（構）、部隊、學校、行政法人或人事權責機關（以下簡稱權責機關）間關於身分、公法上財產請求、獎懲、考績及其他行政處分或管理措施之爭議，除法律另有規定外，適用本法之規定。","note":"一、本法旨在保障軍人權益，並妥慎處理國家與軍人間之公法爭議，如軍人身分、財產（例如待遇、退除給與、撫卹及軍人保險）、獎勵、懲罰、考績及其他行政處分或管理措施等事件之救濟。軍人不服其所屬機關（構）、部隊、學校、行政法人或人事權責機關對其所為上述行政處分或管理措施，於本法施行後，應依本法或改依本法所定復審、申訴、再申訴及行政訴訟程序規定提出救濟。另因應未來法律對於軍人兼具公職律師或醫師等專門職業技術人員身分或特定行政處分為特別救濟規定之可能，爰定明軍人權益之救濟，除其他法律有特別規定外，適用本法之規定。\n二、本法之復審、申訴及再申訴之規範性質與公務人員保障法相似，亦為訴願法第一條第一項但書所定之特別規定，故各機關訴願審議委員會於本法施行後，應不再受理涉及軍人提起之公法爭議事件；如有收受，應逕行移送管轄之地方軍事法院官兵權益保障會或申訴管轄機關。\n三、另本條所定「所屬機關（構）、部隊、學校、行政法人」係指軍人隸屬之編制或實際 項定明軍人之權益救濟事項，應循本法「復審」或「申訴、再申訴」及「行政訴訟」程序救濟之。\n二、第二項定明受理軍人申訴事件、復審與再申訴事件及第一審行政訴訟事件之機關（單位）及辦理依據。有關軍人申訴事件之管轄機關（單位），考量軍人申訴事件類型繁多，作成行政處分或管理措施之基層部隊（單位），未必有權限或能力處理相關權益爭議事件（如下級機關依上級機關因應疫情修正之請假規則，對所隸屬之軍人實施休假管制），致難以於本法中逐一規範何種類型之申訴事件應由何機關（單位）處理，爰於第二項定明申訴事件得由各級主官（管）、業務承辦單位或監察部門等申訴管轄機關處理，並於第五十九條第三項授權國防部及其他軍文併用機關（例如總統府、國家安全會議、國家安全局、教育部、海洋委員會及國家中山科學研究院），就軍人申訴事件之管轄及權責劃分等事項，訂定辦法規範。"},{"bill":"202110033240000","text":"軍人權益之救濟，依本法所定復審、申訴、再申訴及行政訴訟程序行之。\n軍人提起之申訴事件，由各級主官（管）、業務承辦單位或監察部門（以下簡稱申訴管轄機關）依本法處理；復審及再申訴事件，由地方軍事法院官兵權益保障會（以下簡稱權保會）依本法審議決定；第一審行政訴訟事件，由高等軍事法院勤務法庭（以下簡稱勤務法庭）依本法及行政訴訟法審理。","note":"一、第一項定明軍人之權益救濟事項，應循本法「復審」或「申訴、再申訴」及「行政訴訟」程序救濟之。\n二、第二項定明受理軍人申訴事件、復審與再申訴事件及第一審行政訴訟事件之機關（單位）及辦理依據。有關軍人申訴事件之管轄機關（單位），考量軍人申訴事件類型繁多，作成行政處分或管理措施之基層部隊（單位），未必有權限或能力處理相關權益爭議事件（如下級機關依上級機關因應疫情修正之請假規則，對所隸屬之軍人實施休假管制），致難以於本法中逐一規範何種類型之申訴事件應由何機關（單位）處理，爰於第二項定明申訴事件得由各級主官（管）、業務承辦單位或監察部門等申訴管轄機關處理，並於第五十九條第三項授權國防部及其他軍文併用機關（例如總統府、國家安全會議、國家安全局、教育部、海洋委員會及國家中山科學研究院），就軍人申訴事件之管轄及權責劃分等事項，訂定辦法規範。"},{"bill":"202110036610000","text":"軍人權益之救濟，依本法所定復審、申訴、再申訴及行政訴訟程序行之。\n軍人提起之申訴事件，由各級主官（管）、業務承辦單位或監察部門（以下簡稱申訴管轄機關）依本法處理；復審及再申訴事件，由地方軍事法院官兵權益保障會（以下簡稱權保會）依本法審議決定；第一審行政訴訟事件，由高等軍事法院勤務法庭（以下簡稱勤務法庭）依本法及行政訴訟法審理。","note":"一、第一項定明軍人之權益救濟事項，應循本法「復審」或「申訴、再申訴」及「行政訴訟」程序救濟之。\n二、第二項定明受理軍人申訴事件、復審與再申訴事件及第一審行政訴訟事件之機關（單位）及辦理依據。有關軍人申訴事件之管轄機關（單位），考量軍人申訴事件類型繁多，作成行政處分或管理措施之基層部隊（單位），未必有權限或能力處理相關權益爭議事件（如下級機關依上級機關因應疫情修正之請假規則，對所隸屬之軍人實施休假管制），致難以於本法中逐一規範何種類型之申訴事件應由何機關（單位）處理，爰於第二項定明申訴事件得由各級主官（管）、業務承辦單位或監察部門等申訴管轄機關處理，並於第五十九條第三項授權國防部及其他軍文併用機關（例如總統府、國家安全會議、國家安全局、教育部、海洋委員會及國家中山科學研究院），就軍人申訴事件之管轄及權責劃分等事項，訂定辦法規範。"},{"bill":"202110044700000","text":"軍人權益之救濟，依本法所定復審、申訴、再申訴及行政訴訟程序行之。\n軍人提起之申訴事件，由各級主官（管）、業務承辦單位或監察部門（以下簡稱申訴管轄機關）依本法處理；復審及再申訴事件，由地方軍事法院官兵權益保障會（以下簡稱權保會）依本法審議決定；第一審行政訴訟事件，由高等軍事法院勤務法庭（以下簡稱勤務法庭）依本法及行政訴訟法審理。","note":"一、第一項定明軍人之權益救濟事項，應循本法「復審」或「申訴、再申訴」及「行政訴訟」程序救濟之。\n二、第二項定明受理軍人申訴事件、復審與再申訴事件及第一審行政訴訟事件之機關（單位）及辦理依據。有關軍人申訴事件之管轄機關（單位），考量軍人申訴事件類型繁多，作成行政處分或管理措施之基層部隊（單位），未必有權限或能力處理相關權益爭議事件（如下級機關依上級機關因應疫情修正之請假規則，對所隸屬之軍人實施休假管制），致難以於本法中逐一規範何種類型之申訴事件應由何機關（單位）處理，爰於第二項定明申訴事件得由各級主官（管）、業務承辦 變更或處分。","note":"提起救濟之目的在求取較有利之行政處分或管理措施，如救濟結果反更不利，自失其意義，爰參酌公務人員保障法第五條，定明不利益變更禁止原則。"},{"bill":"202110036610000","text":"原行政處分或原管理措施之執行，不因依本法所進行之各項程序而停止。\n原行政處分或原管理措施合法性顯有疑義者，或其立即執行將發生難以回復之損害，且非為維護重大公共利益所必要者，權保會、申訴管轄機關、原處分機關或原措施機關於受處分或措施之人向勤務法庭提起行政訴訟前，得依職權或依申請，就原行政處分或原管理措施之全部或一部，停止執行。","note":"一、參酌公務人員保障法第八十九條第一項，於第一項定明原行政處分或原管理措施之執行，不因依本法所定程序提起救濟而停止執行。\n二、為避免原行政處分或原管理措施之立即執行將發生難以回復之損害，爰參酌公務人員保障法第八十九條第二項，於第二項定明停止執行之要件及程序；另立即執行將發生難以回復之損害，包括有急迫情事在內。又鑒於受處分或措施之人依本法向勤務法庭提起行政訴訟後，應依行政訴訟法聲請停止執行、假處分或定暫時狀態處分以為暫時權利保護，爰權保會、申訴管轄機關、原處分機關或原措施機關於當事人提起行政訴訟前，得依職權或依申請停止執行。至提起行政訴訟後，原處分機關或原措施機關仍得依職權停止執行，併予敘明。"},{"bill":"202110044700000","text":"申訴管轄機關、權保會及勤務法庭對於依本法提起申訴、再申訴、復審或行政訴訟之人表示不服之範圍內，不得為更不利益之變更或處分。","note":"提起救濟之目的在求取較有利之行政處分或管理措施，如救濟結果反更不利，自失其意義，爰參酌公務人員保障法第五條，定明不利益變更禁止原則。"}],"changed":true,"final":"申訴管轄機關、權保會及勤務法庭對於依本法提起申訴、再申訴、復審或行政訴訟之人表示不服之範圍內，不得為更不利益之變更或處分。","finalWhy":"提起救濟之目的在求取較有利之行政處分或管理措施，如救濟結果反更不利，自失其意義，爰參酌公務人員保障法第五條，定明不利益變更禁止原則。","review":{"note":"照行政院提案通過","text":"違紀行為時因精神障礙或其他心智缺陷，致不能辨識其行為違法或欠缺依其辨識而行為之能力者，不受懲罰。\n行為時因前項之原因，致其辨識行為違法或依其辨識而行為之能力，顯著減低者，得從輕懲罰。\n前二項規定，於因故意或過失自行招致者，不適用之。"}},{"no":"第六條","current":null,"versions":[{"bill":"201110006770000","text":"原行政處分或原管理措施之執行，不因依本法所進行之各項程序而停止。\n原行政處分或原管理措施合法性顯有疑義者，或其立即執行將發生難以回復之損害，且非為維護重大公共利益所必要者，權保會、申訴管轄機關、原處分機關或原措施機關於受處分或措施之人向勤務法庭提起行政訴訟前，得依職權或依申請，就原行政處分或原管理措施之全部或一部，停止執行。","note":"一、參酌公務人員保障法第八十九條第一項，於第一項定明原行政處分或原管理措施之執行，不因依本法所定程序提起救濟而停止執行。\n二、為避免原行政處分或原管理措施之立即執行將發生難以回復之損害，爰參酌公務人員保障法第八十九條第二項，於第二項定明停止執行之要件及程序；另立即執行將發生難以回復之損害，包括有急迫情事在內。又鑒於受處分或措施之人依本法向勤務法庭提起行政訴訟後，應依行政訴訟法聲請停止執行、假處分或定暫時狀態處分以為暫時權利保護，爰權保會、申訴管轄機關、原處分機關或原措施機關於當事人提起行政訴訟前，得依職權或依申請停止執行。至提起行政訴訟後，原處分機關或原措施機關仍得依職權停止執行，併予敘明。"},{"bill":"202110033240000","text":"原行政處分或原管理措施之執行，不因依本法所進行之各項程序而停止。\n原行政處分或原管理措施合法性顯有疑義者，或其立即執行將發生難以回復之損害，且非為維護重大公共利益所必要者，權保會、申訴管轄機關、原處分機關或原措施機關於受處分或措施之人向勤務法庭提起行政訴訟前，得依職權或依申請，就原行政處分或原管理措施之全部或一部，停止執行。","note":"一、參酌公務人員保障法第八十九條第一項，於第一項定明原行政處分或原管理措施之執行，不因依本法所定程序提起救濟而停止執行。\n二、為避免原行政處分或原管理措施之立即執行將發生難以回復之損害，爰參酌公務人員保障法第八十九條第二項，於第二項定明停止執行之要件及程序；另立即執行將發生難以回復之損害，包括有急迫情事在內。又鑒於受處分或措施之人依本法向勤務法庭提起行政訴訟後，應依行政訴訟法聲請停止執行、假處分或定暫時狀態處分以為暫時權利保護，爰權保會、申訴管轄機關、原處分機關或原措施機關於當事人提起行政訴訟前，得依職權或依申請停止執行。至提起行政訴訟後，原處分機關或原措施機關仍得依職權停止執行，併予敘明。"},{"bill":"202110036610000","text":"申訴管轄機關、權保會及勤務法庭對於依本法提起申訴、再申訴、復審或行政訴訟之人表示不服之範圍內，不得為更不利益之變更或處分。","note":"提起救濟之目的在求取較有利之行政處分或管理措施，如救濟結果反更不利，自失其意義，爰參酌公務人員保障法第五條，定明不利益變更禁止原則。"},{"bill":"202110044700000","text":"原行政處分或原管理措施之執行，不因依本法所進行之各項程序而停止。\n原行政處分或原管理措施合法性顯有疑義者，或其立即執行將發生難以回復之損害，且非為維護重大公共利益所必要者，權保會、申訴管轄機關、原處分機關或原措施機關於受處分或措施之人向勤務法庭提起行政訴訟前，得依職權或依申請，就原行政處分或原管理措施之全部或一部，停止執行。","note":"一、參酌公務人員保障法第八十九條第一項，於第一項定明原行政處分或原管理措施之執行，不因依本法所定程序提起救濟而停止執行。\n二、為避免原行政處分或原管理措施之立即執行將發生難以回復之損害，爰參酌公務人員保障法第八十九條第二項，於第二項定明停止執行之要件及程序；另立即執行將發生難以回復之損害，包括有急迫情事在內。又鑒於受處分或措施之人依本法向勤務法庭提起行政訴訟後，應依行政訴訟法聲請停止執行、假處分或定暫時狀態處分以為暫時權利保護，爰權保會、申訴管轄機關、原處分機關或原措施機關於當事人提起行政訴訟前，得依職權或依申請停止執行。至提起行政訴訟後，原處分機關或原措施機關仍得依職權停止執行，併予敘明。"}],"changed":true,"final":"原行政處分或原管理措施之執行，不因依本法所進行之各項程序而停止。\n原行政處分或原管理措施合法性顯有疑義者，或其立即執行將發生難以回復之損害，且非為維護重大公共利益所必要者，權保會、申訴管轄機關、原處分機關或原措施機關於受處分或措施之人向勤務法庭提起行政訴訟前，得依職權或依申請，就原行政處分或原管理措施之全部或一部，停止執行。","finalWhy":"一、參酌公務人員保障法第八十九條第一項，於第一項定明原行政處分或原管理措施之執行，不因依本法所定程序提起救濟而停止執行。\n二、為避免原行政處分或原管理措施之立即執行將發生難以回復之損害，爰參酌公務人員保障法第八十九條第二項，於第二項定明停止執行之要件及程序；另立即執行將發生難以回復之損害，包括有急迫情事在內。又鑒於受處分或措施之人依本法向勤務法庭提起行政訴訟後，應依行政訴訟法聲請停止執行、假處分或定暫時狀態處分以為暫時權利保護，爰權保會、申訴管轄機關、原處分機關或原措施機關於當事人提起行政訴訟前，得依職權或依申請停止執行。至提起行政訴訟後，原處分機關或原措施機關仍得依職權停止執行，併予敘明。","review":{"note":"修正通過","text":"軍人對權責長官職務範圍內下達之命令有服從之義務，如認為該命令違法，應向權責長官表示意見；該管長官如認其命令並未違法，而以書面下達時，軍人即應服從；其因此所生之責任，由該長官負之。\n前項命令違反刑事法律者，除依法屬正當行使武力之情形外，軍人無服從義務。明知該命令違反刑事法律且非依法屬正當行使武力之情形而仍執行者，應受懲罰。"}},{"no":"第七條","current":null,"versions":[{"bill":"201110006770000","text":"前條第二項停止執行之原因消滅，或有其他情事變更之情形，權保會、申訴管轄機關、原處分機關或原措施機關得依職權或依申請撤銷停止執行。","note":"為期爭議及權益救濟事件能迅速審結，爰參酌公務人員保障法第九十條，定明權保會及有關機關得依職權或依申請撤銷停止執行之事由。"},{"bill":"202110033240000","text":"前條第二項停止執行之原因消滅，或有其他情事變更之情形，權保會、申訴管轄機關、原處分機關或原措施機關得依職權或依申請撤銷停止執行。","note":"為期爭議及權益救濟事件能迅速審結，爰參酌公務人員保障法第九十條，定明權保會及有關機關得依職權或依申請撤銷停止執行之事由。"},{"bill":"202110036610000","text":"第五條第二項停止執行之原因消滅，或有其他情事變更之情形，權保會、申訴管轄機關、原處分機關或原措施機關得依職權或依申請撤銷停止執行。","note":"為期爭議及權益救濟事件能迅速審結，爰參酌公務人員保障法第九十條，定明權保會及有關機關得依職權或依申請撤銷停止執行之事由。"},{"bill":"202110044700000","text":"前條第二項停止執行之原因消滅，或有其他情事變更之情形，權保會、申訴管轄機關、原處分機關或原措施機關得依職權或依申請撤銷停止執行。","note":"為期爭議及權益救濟事件能迅速審結，爰參酌公務人員保障法第九十條，定明權保會及有關機關得依職權或依申請撤銷停止執行之事由。"}],"changed":true,"final":"前條第二項停止執行之原因消滅，或有其他情事變更之情形，權保會、申訴管轄機關、原處分機關或原措施機關得依職權或依申請撤銷停止執行。","finalWhy":"為期爭議及權益救濟事件能迅速審結，爰參酌公務人員保障法第九十條，定明權保會及有關機關得依職權或依申請撤銷停止執行之事由。","review":{"note":"照行政院提案通過","text":"權責長官於懲罰程序終結前，應將同一違紀行為人經調查屬實之數違紀行為，予以合一評價。"}},{"no":"第八條","current":null,"versions":[{"bill":"201110006770000","text":"地方軍事法院置專任及兼任官兵權益保障委員（以下簡稱權保委員）若干人，組成權保會或其分會，分組審議復審及再申訴事件。\n專任權保委員，由地方軍事法院之國防法務官任之。\n兼任權保委員，由地方軍事法院遴聘社會公正人士或學者專家任之，任期三年，連選得連任一次。\n前項兼任權保委員之資格、遴聘、解聘及其他相關事項之辦法，由國防部定之。","note":"一、第一項定明地方軍事法院應置專任及兼任權保委員若干人，並組成權保會或其分會，專責並分組審議復審及再申訴事件。\n二、專任權保委員應兼具備國防軍事及法律專業資格，爰於第二項定明由國防法務官任之。\n三、為兼顧軍事、法律及相關領域專業，並強化權保會之客觀、中立性，爰於第三項定明由社會公正人士或學者專家擔任兼任權保委員及其任期規定。\n四、第四項授權國防部訂定兼任權保委員之資格、遴聘及解聘等事項之辦法。"},{"bill":"202110033240000","text":"地方軍事法院置專任及兼任官兵權益保障委員（以下簡稱權保委員）若干人，組成權保會或其分會，分組審議復審及再申訴事件。\n專任權保委員，由地方軍事法院之國防法務官任之。\n兼任權保委員，應排除曾為志願役退役人員，由地方軍事法院遴聘社會公正人士或學者專家任之，任期三年，連選得連任一次。\n前項兼任權保委員之資格、遴聘、解聘及其他相關事項之辦法，由國防部定之。","note":"一、第一項定明地方軍事法院應置專任及兼任權保委員若干人，並組成權保會或其分會，專責並分組審議復審及再申訴事件。\n二、專任權保委員應兼具備國防軍事及法律專業資格，爰於第二項定明由國防法務官任之。\n三、為兼顧軍事、法律及相關領域專業，並強化權保會之客觀、中立性，爰於第三項定明由不曾為志願役退役之社會公正人士或學者專家擔任兼任權保委員及其任期規定。\n四、第四項授權國防部訂定兼任權保委員之資格、遴聘及解聘等事項之辦法。"},{"bill":"202110036610000","text":"依本法提起復審、申訴或再申訴之人，若為語言障礙或語言不通者，應由通譯傳譯之；必要時，並得以文字訊問或命以文字陳述。","note":"考量到我國部分義務役男，長年旅居海外，不諳本國常用語言，若有權益救濟需求而提起復審、申訴、再申訴或行政訴訟時，恐因語言不通導致其權益受損，故參酌刑事訴訟法第九十九條，提供其必要通譯服務，確保其權益。"},{"bill":"202110044700000","text":"地方軍事法院置專任及兼任官兵權益保障委員（以下簡稱權保委員）若干人，組成權保會或其分會，分組審議復審及再申訴事件。\n專任權保委員，由地方軍事法院之國防法務官任之。\n兼任權保委員，由地方軍事法院遴聘社會公正人士或學者專家任之，任期三年，連選得連任一次。\n前項兼任權保委員之資格、遴聘、解聘及其他相關事項之辦法，由國防部定之。","note":"一、第一項定明地方軍事法院應置專任及兼任權保委員若干人，並組成權保會或其分會，專責並分組審議復審及再申訴事件。\n二、專任權保委員應兼具備國防軍事及法律專業資格，爰於第二項定明由國防法務官任之。\n三、為兼顧軍事、法律及相關領域專業，並強化權保會之客觀、中立性，爰於第三項定明由社會公正人士或學者專家擔任兼任權保委員及其任期規定。\n四、第四項授權國防部訂定兼任權保委員之資格、遴聘及解聘等事項之辦法。"}],"changed":true,"final":"地方軍事法院置專任及兼任官兵權益保障委員（以下簡稱權保委員）若干人，組成權保會或其分會，分組審議復審及再申訴事件。\n專任權保委員，由地方軍事法院之國防法務官任之。\n兼任權保委員，由地方軍事法院遴聘社會公正人士或學者專家任之，任期三年，連選得連任一次。\n前項兼任權保委員之資格、遴聘、解聘及其他相關事項之辦法，由國防部定之。","finalWhy":"一、第一項定明地方軍事法院應置專任及兼任權保委員若干人，並組成權保會或其分會，專責並分組審議復審及再申訴事件。\n二、專任權保委員應兼具備國防軍事及法律專業資格，爰於第二項定明由國防法務官任之。\n三、為兼顧軍事、法律及相關領域專業，並強化權保會之客觀、中立性，爰於第三項定明由社會公正人士或學者專家擔任兼任權保委員及其任期規定。\n四、第四項授權國防部訂定兼任權保委員之資格、遴聘及解聘等事項之辦法。","review":{"note":"照行政院提案通過","text":"辦理懲罰事件，應視違紀行為情節之輕重，並審酌下列事項：\n一、行為之動機、目的。\n二、行為時所受之刺激。\n三、行為之手段。\n四、行為人之生活狀況。\n五、行為人之品行及智識程度。\n六、行為對領導統御或軍事紀律所生之影響。\n七、行為人與被害人之關係。\n八、行為人違反義務之程度。\n九、行為所生之危險或損害。\n十、行為後之態度。\n依本法規定從重或從輕懲罰者，應合於比例原則。"}},{"no":"第九條","current":null,"versions":[{"bill":"201110006770000","text":"復審及再申訴事件，由原處分機關或原措施機關所在地之權保會管轄。\n權保會受理前項事件，認為全部或一部無管轄權者，應依職權移送有管轄權之權保會，並通知復審人或再申訴人。\n一人分別提起數宗復審或再申訴事件，或相牽連之數宗復審或再申訴事件，權保會得依職權移送最先受理或關係最切地之權保會合併審議，並得合併決定。\n數權保會於管轄權有爭議時，由高等軍事法院指定之。","note":"一、第一項定明復審及再申訴事件之管轄權保會。\n二、第二項定明權保會認為受理之救濟事件無管轄權時，應移送有管轄權之權保會，並通知復審人或再申訴人。\n三、為提高審議效率，減少復審人、再申訴人或權責機關因救濟事件所需時間及勞費支出，於第三項定明權保會合併審議決定之程序。至「關係最切地」之認定，可從復審人或再申訴人之編制、編配單位所在地或爭議事件發生地、結果地等，擇一由與本案最具有關聯性且最有利事件進行審議之權保會合併審議決定。\n四、數權保會間遇有管轄爭議，且無法透過協調決定時，應有處理之規範，爰於第四項定明由高等軍事法院指定管轄權保會。"},{"bill":"202110033240000","text":"復審及再申訴事件，由原處分機關或原措施機關所在地之權保會管轄。\n權保會受理前項事件，認為全部或一部無管轄權者，應依職權移送有管轄權之權保會，並通知復審人或再申訴人。\n一人分別提起數宗復審或再申訴事件，或相牽連之數宗復審或再申訴事件，權保會得依職權移送最先受理或關係最切地之權保會合併審議，並得合併決定。\n數權保會於管轄權有爭議時，由高等軍事法院指定之。","note":"一、第一項定明復審及再申訴事件之管轄權保會。\n二、第二項定明權保會認為受理之救濟事件無管轄權時，應移送有管轄權之權保會，並通知復審人或再申訴人。\n三、為提高審議效率，減少復審人、再申訴人或權責機關因救濟事件所需時間及勞費支出，於第三項定明權保會合併審議決定之程序。至「關係最切地」之認定，可從復審人或再申訴人之編制、編配單位所在地或爭議事件發生地、結果地等，擇一由與本案最具有關聯性且最有利事件進行審議之權保會合併審議決定。\n四、數權保會間遇有管轄爭議，且無法透過協調決定時，應有處理之規範，爰於第四項定明由高等軍事法院指定管轄權保會。"},{"bill":"202110036610000","text":"地方軍事法院置專任及兼任官兵權益保障委員（以下簡稱權保委員）若干人，組成權保會或其分會，分組審議復審及再申訴事件。\n專任權保委員，由地方軍事法院之國防法務官任之。\n兼任權保委員，由地方軍事法院遴聘社會公正人士或學者專家任之，任期三年，連選得連任一次。\n前項兼任權保委員之資格、遴聘、解聘及其他相關事項之辦法，由國防部定之。","note":"一、第一項定明地方軍事法院應置專任及兼任權保委員若干人，並組成權保會或其分會，專責並分組審議復審及再申訴事件。\n二、專任權保委員應兼具備國防軍事及法律專業資格，爰於第二項定明由國防法務官任之。\n三、為兼顧軍事、法律及相關領域專業，並強化權保會之客觀、中立性，爰於第三項定明由社會公正人士或學者專家擔任兼任權保委員及其任期規定。\n四、第四項授權國防部訂定兼任權保委員之資格、遴聘及解聘等事項之辦法。"},{"bill":"202110044700000","text":"復審及再申訴事件，由原處分機關或原措施機關所在地之權保會管轄。\n權保會受理前項事件，認為全部或一部無管轄權者，應依職權移送有管轄權之權保會，並通知復審人或再申訴人。\n一人分別提起數宗復審或再申訴事件，或相牽連之數宗復審或再申訴事件，權保會得依職權移送最先受理或關係最切地之權保會合併審議，並得合併決定。\n數權保會於管轄權有爭議時，由高等軍事法院指定之。","note":"一、第一項定明復審及再申訴事件之管轄權保會。\n二、第二項定明權保會認為受理之救濟事件無管轄權時，應移送有管轄權之權保會，並通知復審人或再申訴人。\n三、為提高審議效率，減少復審人、再申訴人或權責機關因救濟事件所需時間及勞費支出，於第三項定明權保會合併審議決定之程序。至「關係最切地」之認定，可從復審人或再申訴人之編制、編配單位所在地或爭議事件發生地、結果地等，擇一由與本案最具有關聯性且最有利事件進行審議之權保會合併審議決定。\n四、數權保會間遇有管轄爭議，且無法透過協調決定時，應有處理之規範，爰於第四項定明由高等軍事法院指定管轄權保會。"}],"changed":true,"final":"復審及再申訴事件，由原處分機關或原措施機關所在地之權保會管轄。\n權保會受理前項事件，認為全部或一部無管轄權者，應依職權移送有管轄權之權保會，並通知復審人或再申訴人。\n一人分別提起數宗復審或再申訴事件，或相牽連之數宗復審或再申訴事件，權保會得依職權移送最先受理或關係最切地之權保會合併審議，並得合併決定。\n數權保會於管轄權有爭議時，由高等軍事法院指定之。","finalWhy":"一、第一項定明復審及再申訴事件之管轄權保會。\n二、第二項定明權保會認為受理之救濟事件無管轄權時，應移送有管轄權之權保會，並通知復審人或再申訴人。\n三、為提高審議效率，減少復審人、再申訴人或權責機關因救濟事件所需時間及勞費支出，於第三項定明權保會合併審議決定之程序。至「關係最切地」之認定，可從復審人或再申訴人之編制、編配單位所在地或爭議事件發生地、結果地等，擇一由與本案最具有關聯性且最有利事件進行審議之權保會合併審議決定。\n四、數權保會間遇有管轄爭議，且無法透過協調決定時，應有處理之規範，爰於第四項定明由高等軍事法院指定管轄權保會。","review":{"note":"照行政院提案通過","text":"懲罰處分送達後，三個月內故意再為違紀行為者，得從重懲罰。"}},{"no":"第十條","current":null,"versions":[{"bill":"201110006770000","text":"權保會審議復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人合議決定之；委員任一性別比例，不得少於五分之二。\n前項決定，應由權保委員全數出席，出席委員過半數之同意行之。\n權保會審議復審及再申訴事件之規則，由國防部定之。","note":"一、第一項定明復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人共五人合議決定，以提高公信力。又為落實性別平等，定明權保委員之性別比例。\n二、參酌訴願法第五十三條，於第二項定明權保會合議決定之方式。\n三、第三項授權國防部就權保會審議復審及再申訴事件，訂定審議規則。"},{"bill":"202110033240000","text":"權保會審議復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人合議決定之；委員任一性別比例，不得少於五分之二。\n前項決定，應由權保委員全數出席，出席委員過半數之同意行之。\n權保會審議復審及再申訴事件之規則，由國防部定之。","note":"一、第一項定明復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人共五人合議決定，以提高公信力。又為落實性別平等，定明權保委員之性別比例。\n二、參酌訴願法第五十三條，於第二項定明權保會合議決定之方式。\n三、第三項授權國防部就權保會審議復審及再申訴事件，訂定審議規則。"},{"bill":"202110036610000","text":"復審及再申訴事件，由原處分機關或原措施機關所在地之權保會管轄。\n權保會受理前項事件，認為全部或一部無管轄權者，應依職權移送有管轄權之權保會，並通知復審人或再申訴人。\n一人分別提起數宗復審或再申訴事件，或相牽連之數宗復審或再申訴事件，權保會得依職權移送最先受理或關係最切地之權保會合併審議，並得合併決定。\n數權保會於管轄權有爭議時，由高等軍事法院指定之。","note":"一、第一項定明復審及再申訴事件之管轄權保會。\n二、第二項定明權保會認為受理之救濟事件無管轄權時，應移送有管轄權之權保會，並通知復審人或再申訴人。\n三、為提高審議效率，減少復審人、再申訴人或權責機關因救濟事件所需時間及勞費支出，於第三項定明權保會合併審議決定之程序。至「關係最切地」之認定，可從復審人或再申訴人之編制、編配單位所在地或爭議事件發生地、結果地等，擇一由與本案最具有關聯性且最有利事件進行審議之權保會合併審議決定。\n四、數權保會間遇有管轄爭議，且無法透過協調決定時，應有處理之規範，爰於第四項定明由高等軍事法院指定管轄權保會。"},{"bill":"202110044700000","text":"權保會審議復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人審議決定之；委員任一性別比例，不得少於五分之二。\n前項決定，應由權保委員全數出席，出席委員過半數之同意行之。\n權保會審議復審及再申訴事件之規則，由國防部定之。","note":"一、第一項定明復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人共五人審議決定，以提高公信力。又為落實性別平等，定明權保委員之性別比例。\n二、參酌訴願法第五十三條，於第二項定明權保會合議決定之方式。\n三、第三項授權國防部就權保會審議復審及再申訴事件，訂定審議規則。"}],"changed":true,"final":"權保會審議復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人合議決定之；委員任一性別比例，不得少於五分之二。\n前項決定，應由權保委員全數出席，出席委員過半數之同意行之。\n權保會審議復審及再申訴事件之規則，由國防部定之。","finalWhy":"一、第一項定明復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人共五人合議決定，以提高公信力。又為落實性別平等，定明權保委員之性別比例。\n二、參酌訴願法第五十三條，於第二項定明權保會合議決定之方式。\n三、第三項授權國防部就權保會審議復審及再申訴事件，訂定審議規則。","review":null},{"no":"第十一條","current":null,"versions":[{"bill":"201110006770000","text":"權保委員或書記官於復審或再申訴所涉爭議事件，有下列情形之一者，應自行迴避：\n一、與提起復審或再申訴之人有配偶、四親等內血親、三親等內姻親、家長、家屬或曾有此關係。\n二、曾參與該事件之行政調查、行政處分、管理措施或申訴程序。\n三、現為或曾為該事件當事人之代理人、輔佐人。\n四、於該事件，曾為證人、鑑定人。\n五、與該事件有法律上利害關係。\n權保委員或書記官有前項所定情形之一，應自行迴避而不迴避，或有具體事實，足認其執行職務有偏頗之虞者，復審人或再申訴人得備具書狀敘明理由，向權保會申請迴避。\n前項申請，應舉其原因及事實，並應為適當之釋明；被申請迴避之人，對於該申請得提出意見書。\n權保委員被申請迴避者，於權保會就該申請事件為准許或駁回之決定前，應停止審議程序。但有急迫情形，仍應為必要處理。\n前項決定，被申請迴避之權保委員不得參與。\n權保委員或書記官有第一項所定情形之一不自行迴避，而未經復審人或再申訴人申請迴避者，應由該權保會依職權命其迴避。","note":"一、參酌公務人員保障法第七條第一項，於第一項定明權保委員及辦理復審或再申訴事件行政事務之書記官應自行迴避之事由。\n二、參酌公務人員保障法第七條第五項，於第二項定明復審人或再申訴人得申請迴避之事由及程序。\n三、參酌行政程序法第三十三條第二項，於第三項定明申請迴避應釋明原因及事實，被申請迴避之權保委員及書記官亦得提出意見書。\n四、參酌行政程序法第三十三條第四項及民事訴訟法第三十七條第一項本文，於第四項定明迴避申請決定前，權保會之審議程序以停止為原則。又書記官因僅辦理審議事件之行政事務，未涉及審議事件之實質內容，故權保會審議程序不因書記官被申請迴避而停止，併予敘明。\n五、參酌民事訴訟法第三十五條第一項、第二項及公務員懲戒法第三十條第一項，於第五項定明被申請迴避之權保委員不得參與迴避申請之決定。\n六、參酌行政程序法第三十三條第五項，於第六項定明權保會得依職權命權保委員或書記官迴避之事由。\n七、鑒於權保會審議復審及再申訴事件，與一般公務員處理行政事務之性質不同，且迴避與否之決定，並非最終實體決定，復審人或再申訴人如不服迴避之決定，應於提起行政訴訟時一併聲明不服，爰未參酌行政程序法第三十三條第三項另定申請迴避人得再向上級機關提請覆決之規定，併予敘明。"},{"bill":"202110033240000","text":"權保委員或書記官於復審或再申訴所涉爭議事件，有下列情形之一者，應自行迴避：\n一、與提起復審或再申訴之人有配偶、四親等內血親、三親等內姻親、家長、家屬或曾有此關係。\n二、曾參與該事件之行政調查、行政處分、管理措施或申訴程序。\n三、現為或曾為該事件當事人之代理人、輔佐人。\n四、於該事件，曾為證人、鑑定人。\n五、與該事件有法律上利害關係。\n權保委員或書記官有前項所定情形之一，應自行迴避而不迴避，或有具體事實，足認其執行職務有偏頗之虞者，復審人或再申訴人得備具書狀敘明理由，向權保會申請迴避。\n前項申請，應舉其原因及事實，並應為適當之釋明；被申請迴避之人，對於該申請得提出意見書。\n權保委員被申請迴避者，於權保會就該申請事件為准許或駁回之決定前，應停止審議程序。但有急迫情形，仍應為必要處理。\n前項決定，被申請迴避之權保委員不得參與。\n權保委員或書記官有第一項所定情形之一不自行迴避，而未經復審人或再申訴人申請迴避者，應由該權保會依職權命其迴避。","note":"一、參酌公務人員保障法第七條第一項，於第一項定明權保委員及辦理復審或再申訴事件行政事務之書記官應自行迴避之事由。\n二、參酌公務人員保障法第七條第五項，於第二項定明復審人或再申訴人得申請迴避之事由及程序。\n三、參酌行政程序法第三十三條第二項，於第三項定明申請迴避應釋明原因及事實，被申請迴避之權保委員及書記官亦得提出意見書。\n四、參酌行政程序法第三十三條第四項及民事訴訟法第三十七條第一項本文，於第四項定明迴避申請決定前，權保會之審議程序以停止為原則。又書記官因僅辦理審議事件之行政事務，未涉及審議事件之實質內容，故權保會審議程序不因書記官被申請迴避而停止，併予敘明。\n五、參酌民事訴訟法第三十五條第一項、第二項及公務員懲戒法第三十條第一項，於第五項定明被申請迴避之權保委員不得參與迴避申請之決定。\n六、參酌行政程序法第三十三條第五項，於第六項定明權保會得依職權命權保委員或書記官迴避之事由。\n七、鑒於權保會審議復審及再申訴事件，與一般公務員處理行政事務之性質不同，且迴避與否之決定，並非最終實體決定，復審人或再申訴人如不服迴避之決定，應於提起行政訴訟時一併聲明不服，爰未參酌行政程序法第三十三條第三項另定申請迴避人得再向上級機關提請覆決之規定，併予敘明。"},{"bill":"202110036610000","text":"權保會審議復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人合議決定之；委員任一性別比例，不得少於五分之二。\n前項決定，應由權保委員全數出席，出席委員過半數之同意行之。\n權保會審議復審及再申訴事件之規則，由國防部定之。","note":"一、第一項定明復審及再申訴事件，應由專任權保委員二人及兼任權保委員三人共五人合議決定，以提高公信力。又為落實性別平等，定明權保委員之性別比例。\n二、參酌訴願法第五十三條，於第二項定明權保會合議決定之方式。\n三、第三項授權國防部就權保會審議復審及再申訴事件，訂定審議規則。"},{"bill":"202110044700000","text":"權保委員或書記官於復審或再申訴所涉爭議事件，有下列情形之一者，應自行迴避：\n一、與提起復審或再申訴之人有配偶、四親等內血親、三親等內姻親、家長、家屬或曾有此關係。\n二、曾參與該事件之行政調查、行政處分、管理措施或申訴程序。\n三、現為或曾為該事件當事人之代理人、輔佐人。\n四、於該事件，曾為證人、鑑定人。\n五、與該事件有法律上利害關係。\n權保委員或書記官有前項所定情形之一，應自行迴避而不迴避，或有具體事實，足認其執行職務有偏頗之虞者，復審人或再申訴人得備具書狀敘明理由，向權保會申請迴避。\n前項申請，應舉其原因及事實，並應為適當之釋明；被申請迴避之人，對於該申請得提出意見書。\n權保委員被申請迴避者，於權保會就該申請事件為准許或駁回之決定前，應停止審議程序。但有急迫情形，仍應為必要處理。\n前項決定，被申請迴避之權保委員不得參與。\n權保委員或書記官有第一項所定情形之一不自行迴避，而未經復審人或再申訴人申請迴避者，應由該權保會依職權命其迴避。","note":"一、參酌公務人員保障法第七條第一項，於第一項定明權保委員及辦理復審或再申訴事件行政事務之書記官應自行迴避之事由。\n二、參酌公務人員保障法第七條第五項，於第二項定明復審人或再申訴人得申請迴避之事由及程序。\n三、參酌行政程序法第三十三條第二項，於第三項定明申請迴避應釋明原因及事實，被申請迴避之權保委員及書記官亦得提出意見書。\n四、參酌行政程序法第三十三條第四項及民事訴訟法第三十七條第一項本文，於第四項定明迴避申請決定前，權保會之審議程序以停止為原則。又書記官因僅辦理審議事件之行政事務，未涉及審議事件之實質內容，故權保會審議程序不因書記官被申請迴避而停止，併予敘明。\n五、參酌民事訴訟法第三十五條第一項、第二項及公務員懲戒法第三十條第一項，於第五項定明被申請迴避之權保委員不得參與迴避申請之決定。\n六、參酌行政程序法第三十三條第五項，於第六項定明權保會得依職權命權保委員或書記官迴避之事由。\n七、鑒於權保會審議復審及再申訴事件，與一般公務員處理行政事務之性質不同，且迴避與否之決定，並非最終實體決定，復審人或再申訴人如不服迴避之決定，應於提起行政訴訟時一併聲明不服，爰未參酌行政程序法第三十三條第三項另定申請迴避人得再向上級機關提請覆決之規定，併予敘明。"}],"changed":true,"final":"權保委員或書記官於復審或再申訴所涉爭議事件，有下列情形之一者，應自行迴避：\n一、與提起復審或再申訴之人有配偶、四親等內血親、三親等內姻親、家長、家屬或曾有此關係。\n二、曾參與該事件之行政調查、行政處分、管理措施或申訴程序。\n三、現為或曾為該事件當事人之代理人、輔佐人。\n四、於該事件，曾為證人、鑑定人。\n五、與該事件有法律上利害關係。\n權保委員或書記官有前項所定情形之一，應自行迴避而不迴避，或有具體事實，足認其執行職務有偏頗之虞者，復審人或再申訴人得備具書狀敘明理由，向權保會申請迴避。\n前項申請，應舉其原因及事實，並應為適當之釋明；被申請迴避之人，對於該申請得提出意見書。\n權保委員被申請迴避者，於權保會就該申請事件為准許或駁回之決定前，應停止審議程序。但有急迫情形，仍應為必要處理。\n前項決定，被申請迴避之權保委員不得參與。\n權保委員或書記官有第一項所定情形之一不自行迴避，而未經復審人或再申訴人申請迴避者，應由該權保會依職權命其迴避。","finalWhy":"一、參酌公務人員保障法第七條第一項，於第一項定明權保委員及辦理復審或再申訴事件行政事務之書記官應自行迴避之事由。\n二、參酌公務人員保障法第七條第五項，於第二項定明復審人或再申訴人得申請迴避之事由及程序。\n三、參酌行政程序法第三十三條第二項，於第三項定明申請迴避應釋明原因及事實，被申請迴避之權保委員及書記官亦得提出意見書。\n四、參酌行政程序法第三十三條第四項及民事訴訟法第三十七條第一項本文，於第四項定明迴避申請決定前，權保會之審議程序以停止為原則。又書記官因僅辦理審議事件之行政事務，未涉及審議事件之實質內容，故權保會審議程序不因書記官被申請迴避而停止，併予敘明。\n五、參酌民事訴訟法第三十五條第一項、第二項及公務員懲戒法第三十條第一項，於第五項定明被申請迴避之權保委員不得參與迴避申請之決定。\n六、參酌行政程序法第三十三條第五項，於第六項定明權保會得依職權命權保委員或書記官迴避之事由。\n七、鑒於權保會審議復審及再申訴事件，與一般公務員處理行政事務之性質不同，且迴避與否之決定，並非最終實體決定，復審人或再申訴人如不服迴避之決定，應於提起行政訴訟時一併聲明不服，爰未參酌行政程序法第三十三條第三項另定申請迴避人得再向上級機關提請覆決之規定，併予敘明。","review":{"note":"照行政院提案通過","text":"軍人違紀行為之懲罰，除其他法律另有規定外，依本法行之。\n本法規定，對喪失現役軍人身分者於服現役期間之行為，亦適用之。"}},{"no":"第十二條","current":null,"versions":[{"bill":"201110006770000","text":"權保會所為之決定確定後，就其事件有拘束各關係機關（構）、部隊、學校或行政法人之效力。","note":"參酌公務人員保障法第九十一條第一項前段，定明權保會之決定具有拘束力。"},{"bill":"202110033240000","text":"權保會所為之決定確定後，就其事件有拘束各關係機關（構）、部隊、學校或行政法人之效力。","note":"參酌公務人員保障法第九十一條第一項前段，定明權保會之決定具有拘束力。"},{"bill":"202110036610000","text":"權保委員或書記官於復審或再申訴所涉爭議事件，有下列情形之一者，應自行迴避：\n一、與提起復審或再申訴之人有配偶、四親等內血親、三親等內姻親、家長、家屬或曾有此關係。\n二、曾參與該事件之行政調查、行政處分、管理措施或申訴程序。\n三、現為或曾為該事件當事人之代理人、輔佐人。\n四、於該事件，曾為證人、鑑定人。\n五、與該事件有法律上利害關係。\n權保委員或書記官有前項所定情形之一，應自行迴避而不迴避，或有具體事實，足認其執行職務有偏頗之虞者，復審人或再申訴人得備具書狀敘明理由，向權保會申請迴避。\n前項申請，應舉其原因及事實，並應為適當之釋明；被申請迴避之人，對於該申請得提出意見書。\n權保委員被申請迴避者，於權保會就該申請事件為准許或駁回之決定前，應停止審議程序。但有急迫情形，仍應為必要處理。\n前項決定，被申請迴避之權保委員不得參與。\n權保委員或書記官有第一項所定情形之一不自行迴避，而未經復審人或再申訴人申請迴避者，應由該權保會依職權命其迴避。","note":"一、參酌公務人員保障法第七條第一項，於第一項定明權保委員及辦理復審或再申訴事件行政事務之書記官應自行迴避之事由。\n二、參酌公務人員保障法第七條第五項，於第二項定明復審人或再申訴人得申請迴避之事由及程序。\n三、參酌行政程序法第三十三條第二項，於第三項定明申請迴避應釋明原因及事實，被申請迴避之權保委員及書記官亦得提出意見書。\n四、參酌行政程序法第三十三條第四項及民事訴訟法第三十七條第一項本文，於第四項定明迴避申請決定前，權保會之審議程序以停止為原則。又書記官因僅辦理審議事件之行政事務，未涉及審議事件之實質內容，故權保會審議程序不因書記官被申請迴避而停止，併予敘明。\n五、參酌民事訴訟法第三十五條第一項、第二項及公務員懲戒法第三十條第一項，於第五項定明被申請迴避之權保委員不得參與迴避申請之決定。\n六、參酌行政程序法第三十三條第五項，於第六項定明權保會得依職權命權保委員或書記官迴避之事由。\n七、鑒於權保會審議復審及再申訴事件，與一般公務員處理行政事務之性質不同，且迴避與否之決定，並非最終實體決定，復審人或再申訴人如不服迴避之決定，應於提起行政訴訟時一併聲明不服，爰未參酌行政程序法第三十三條第三項另定申請迴避人得再向上級機關提請覆決之規定，併予敘明。"},{"bill":"202110044700000","text":"權保會所為之決定確定後，就其事件有拘束各關係機關（構）、部隊、學校或行政法人之效力。","note":"參酌公務人員保障法第九十一條第一項前段，定明權保會之決定具有拘束力。"}],"changed":true,"final":"權保會所為之決定確定後，就其事件有拘束各關係機關（構）、部隊、學校或行政法人之效力。","finalWhy":"參酌公務人員保障法第九十一條第一項前段，定明權保會之決定具有拘束力。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十三條","current":null,"versions":[{"bill":"201110006770000","text":"軍人對於權責機關對其所為涉及軍人身分變更、公法上財產請求、獎懲或考績事項之行政處分，認為違法或顯然不當，致損害其權利或法律上之利益者，除法律另有規定外，得依本法提起復審。\n前項事件，軍人因權責機關對其依法所為申請，於法定期間內應為行政處分而不作為，或予以駁回，認為損害其權利或法律上之利益者，得提起請求該機關應為行政處分或特定內容行政處分之復審。\n前項期間，法令未定明者，自權責機關受理申請之日起為二個月。","note":"一、軍人自起役日即依兵役法、陸海空軍軍官士官服役條例、陸海空軍軍官士官任職條例、陸海空軍軍官士官任官條例、志願士兵服役條例、軍人待遇條例、陸海空軍獎勵條例、陸海空軍勳賞條例、陸海空軍懲罰法、陸海空軍軍官士官考績條例、軍人撫卹條例及軍人保險條例等法律，與國家發生軍人身分、公法上財產請求、獎懲或考績等公法法律關係，由於此類法律關係之變動，已對軍人之基本權產生干預，爰參酌公務人員保障法第二十五條第一項，於第一項定明軍人如有不服，得提起復審。至法律另有規定，指第二條除書及第五十七條第二項所定應循申訴、再申訴救濟之紀律懲罰、人事晉任或遷調之行政處分。\n二、參酌行政訴訟法第五條，於第二項定明權責機關未於法定期間內為行政處分之「不作為復審」，及駁回申請之「反否准復審」二種類型之課予義務復審，俾與行政訴訟法之訴訟類型接軌。至得提起課予義務復審之行政處分，與第一項所列舉得提起復審之行政處分相同。\n三、參酌公務人員保障法第二十六條第二項，於第三項定明權責機關受理申請之處理期間。"},{"bill":"202110033240000","text":"軍人對於權責機關對其所為涉及軍人身分變更、公法上財產請求、獎懲或考績事項之行政處分，認為違法或顯然不當，致損害其權利或法律上之利益者，除法律另有規定外，得依本法提起復審。\n前項事件，軍人因權責機關對其依法所為申請，於法定期間內應為行政處分而不作為，或予以駁回，認為損害其權利或法律上之利益者，得提起請求該機關應為行政處分或特定內容行政處分之復審。\n前項期間，法令未定明者，自權責機關受理申請之日起為二個月。","note":"一、軍人自起役日即依兵役法、陸海空軍軍官士官服役條例、陸海空軍軍官士官任職條例、陸海空軍軍官士官任官條例、志願士兵服役條例、軍人待遇條例、陸海空軍獎勵條例 法上財產請求權遭受侵害時，亦同。","note":"軍人喪失現役軍人身分後，對於其原軍人身分及衍生之權利救濟，或軍人已死亡者，其遺族就其軍人身分所生之公法上財產權遭受侵害時，如爭議標的屬第十三條所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項之行政處分，以往係依訴願程序處理。為免割裂有關軍人權益事項之救濟程序，爰參酌公務人員保障法第二十五條第一項後段及第二項，定明得依第十三條規定提起復審，以統一爭議事件之救濟。"},{"bill":"202110033240000","text":"非軍人基於其原軍人身分之請求權遭受侵害時，得依前條規定提起復審。軍人已死亡者，其遺族基於該軍人身分所生之公法上財產請求權遭受侵害時，亦同。","note":"軍人喪失現役軍人身分後，對於其原軍人身分及衍生之權利救濟，或軍人已死亡者，其遺族就其軍人身分所生之公法上財產權遭受侵害時，如爭議標的屬第十三條所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項之行政處分，以往係依訴願程序處理。為免割裂有關軍人權益事項之救濟程序，爰參酌公務人員保障法第二十五條第一項後段及第二項，定明得依第十三條規定提起復審，以統一爭議事件之救濟。"},{"bill":"202110036610000","text":"軍人對於權責機關對其所為涉及軍人身分變更、公法上財產請求、獎懲或考績事項之行政處分，認為違法或顯然不當，致損害其權利或法律上之利益者，除法律另有規定外，得依本法提起復審。\n前項事件，軍人因權責機關對其依法所為申請，於法定期間內應為行政處分而不作為，或予以駁回，認為損害其權利或法律上之利益者，得提起請求該機關應為行政處分或特定內容行政處分之復審。\n前項期間，法令未定明者，自權責機關受理申請之日起為二個月。","note":"一、軍人自起役日即依兵役法、陸海空軍軍官士官服役條例、陸海空軍軍官士官任職條例、陸海空軍軍官士官任官條例、志願士兵服役條例、軍人待遇條例、陸海空軍獎勵條例、陸海空軍勳賞條例、陸海空軍懲罰法、陸海空軍軍官士官考績條例、軍人撫卹條例及軍人保險條例等法律，與國家發生軍人身分、公法上財產請求、獎懲或考績等公法法律關係，由於此類法律關係之變動，已對軍人之基本權產生干預，爰參酌公務人員保障法第二十五條第一項，於第一項定明軍人如有不服，得提起復審。至法律另有規定，指第二條除書及第五十七條第二項所定應循申訴、再申訴救濟之紀律懲罰、人事晉任或遷調之行政處分。\n二、參酌行政訴訟法第五條，於第二項定明權責機關未於法定期間內為行政處分之「不作為復審」，及駁回申請之「反否准復審」二種類型之課予義務復審，俾與行政訴訟法之訴訟類型接軌。至得提起課予義務復審之行政處分，與第一項所列舉得提起復審之行政處分相同。\n三、參酌公務人員保障法第二十六條第二項，於第三項定明權責機關受理申請之處理期間。"},{"bill":"202110044700000","text":"非軍人基於其原軍人身分之請求權遭受侵害時，得依前條規定提起復審。軍人已死亡者，其遺族基於該軍人身分所生之公法上財產請求權遭受侵害時，亦同。","note":"軍人喪失現役軍人身分後，對於其原軍人身分及衍生之權利救濟，或軍人已死亡者，其遺族就其軍人身分所生之公法上財產權遭受侵害時，如爭議標的屬第十三條所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項之行政處分，以往係依訴願程序處理。為免割裂有關軍人權益事項之救濟程序，爰參酌公務人員保障法第二十五條第一項後段及第二項，定明得依第十三條規定提起復審，以統一爭議事件之救濟。"}],"changed":true,"final":"非軍人基於其原軍人身分之請求權遭受侵害時，得依前條規定提起復審。軍人已死亡者，其遺族基於該軍人身分所生之公法上財產請求權遭受侵害時，亦同。","finalWhy":"軍人喪失現役軍人身分後，對於其原軍人身分及衍生之權利救濟，或軍人已死亡者，其遺族就其軍人身分所生之公法上財產權遭受侵害時，如爭議標的屬第十三條所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項之行政處分，以往係依訴願程序處理。為免割裂有關軍人權益事項之救濟程序，爰參酌公務人員保障法第二十五條第一項後段及第二項，定明得依第十三條規定提起復審，以統一爭議事件之救濟。","review":null},{"no":"第十五條","current":null,"versions":[{"bill":"201110006770000","text":"復審之提起，應自行政處分送達之次日起三十日內為之。但行政處分於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口之次日起算。\n依第十三條第二項規定，對權責機關之不作為提起復審，應於法定期間屆滿後，始得提起。但自提出申請後，已逾三年者，不得提起。\n復審提起之日，以原處分機關或權保會收受復審書之日期為準。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關提起復審者，以該機關收受之日，視為提起復審之日。","note":"一、參酌公務人員保障法第三十條第一項，於第一項本文定明提起復審之期間。另考量航行中艦艇上之軍人於處分送達後，無從即時提起復審，爰於但書規定自艦艇返抵國內港口之次日起算三十日，為提起復審之不變期間。\n二、第二項定明依第十三條第二項規定提起「不作為復審」之期間，以避免申請人與權責機關間之法律關係長期懸而未決。另復審人如於第十三條第二項所定法定期間屆滿前即提起復審，或於提出申請後逾三年始提起復審，權保會應分別依第四十六條第一項第九款「提起復審不備其他法定要件」及第二款「提起復審逾法定期間」之規定為不受理之決定，併予敘明。\n三、參酌公務人員保障法第三十條第二項，於第三項定明復審提起之日，以原處分機關或權保會收受復審書之日為認定依據。\n四、行政程序法施行後，機關作成行政處分時，多已依該法規定，明確教示應向何機關提起行政救濟，如原處分機關已盡教示責任，復審人應無向教示以外之機關提起復審之理，爰參酌行政程序法第九十九條第一項，於第四項定明須係因原處分機關未為告知或告知錯誤，致復審人向無管轄權之機關提起復審時，始得以該機關收受之日視為提起復審之日。至於原處分機關已正確教示復審管轄機關者，則應依第三項規定，認定復審人提起復審之日。"},{"bill":"202110033240000","text":"復審之提起，應自行政處分送達之次日起三十日內為之。但行政處分於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口之次日起算。\n依第十三條第二項規定，對權責機關之不作為提起復審，應於法定期間屆滿後，始得提起。但自提出申請後，已逾三年者，不得提起。\n復審提起之日，以原處分機關或權保會收受復審書之日期為準。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關提起復審者，以該機關收受之日，視為提起復審之日。","note":"一、參酌公務人員保障法第三十條第一項，於第一項本文定明提起復審之期間。另考量航行中艦艇上之軍人於處分送達後，無從即時提起復審，爰於但書規定自艦艇返抵國內港口之次日起算三十日，為提起復審之不變期間。\n二、第二項定明依第十三條第二項規定提起「不作為復審」之期間，以避免申請人與權責機關間之法律關係長期懸而未決。另復審人如於第十三條第二項所定法定期間屆滿前即提起復審，或於提出申請後逾三年始提起復審，權保會應分別依第四十六條第一項第九款「提起復審不備其他法定要件」及第二款「提起復審逾法定期間」之規定為不受理之決定，併予敘明。\n三、參酌公務人員保障法第三十條第二項，於第三項定明復審提起之日，以原處分機關或權保會收受復審書之日為認定依據。\n四、行政程序法施行後，機關作成行政處分時，多已依該法規定，明確教示應向何機關提起行政救濟，如原處分機關已盡教示責任，復審人應無向教示以外之機關提起復審之理，爰參酌行政程序法第九十九條第一項，於第四項定明須係因原處分機關未為告知或告知錯誤，致復審人向無管轄權之機關提起復審時，始得以該機關收受之日視為提起復審之日。至於原處分機關已正確教示復審管轄機關者，則應依第三項規定，認定復審人提起復審之日。"},{"bill":"202110036610000","text":"非軍人基於其原軍人身分之請求權遭受侵害時，得依前條規定提起復審。軍人已死亡者，其遺族基於該軍人身分所生之公法上財產請求權遭受侵害時，亦同。","note":"軍人喪失現役軍人身分後，對於其原軍人身分及衍生之權利救濟，或軍人已死亡者，其遺族就其軍人身分所生之公法上財產權遭受侵害時，如爭議標的屬第十三條所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項之行政處分，以往係依訴願程序處理。為免割裂有關軍人權益事項之救濟程序，爰參酌公務人員保障法第二十五條第一項後段及第二項，定明得依第十四條規定提起復審，以統一爭議事件之救濟。"},{"bill":"202110044700000","text":"復審之提起，應自行政處分送達之次日起三十日內為之。但行政處分於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口且送達當事人之次日起算。\n依第十三條第二項規定，對權責機關之不作為提起復審，應於法定期間屆滿後，始得提起。但自提出申請後，已逾三年者，不得提起。\n復審提起之日，以原處分機關或權保會收受復審書之日期為準。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關提起復審者，以該機關收受之日，視為提起復審之日。","note":"一、參酌公務人員保障法第三十條第一項，於第一項本文定明提起復審之期間。另考量航行中艦艇上之軍人於處分送達後，無從即時提起復審，爰於但書規定自艦艇返抵國內港口且送達當事人之次日起算三十日，為提起復審之不變期間。\n二、第二項定明依第十三條第二項規定提起「不作為復審」之期間，以避免申請人與權責機關間之法律關係長期懸而未決。另復審人如於第十三條第二項所定法定期間屆滿前即提起復審，或於提出申請後逾三年始提起復審，權保會應分別依第四十六條第一項第九款「提起復審不備其他法定要件」及第二款「提起復審逾法定期間」之規定為不受理之決定，併予敘明。\n三、參酌公務人員保障法第三十條第二項，於第三項定明復審提起之日，以原處分機關或權保會收受復審書之日為認定依據。\n四、行政程序法施行後，機關作成行政處分時，多已依該法規定，明確教示應向何機關提起行政救濟，如原處分機關已盡教示責任，復審人應無向教示以外之機關提起復審之理，爰參酌行政程序法第九十九條第一項，於第四項定明須係因原處分機關未為告知或告知錯誤，致復審人向無管轄權之機關提起復審時，始得以該機關收受之日視為提起復審之日。至於原處分機關已正確教示復審管轄機關者，則應依第三項規定，認定復審人提起復審之日。"}],"changed":true,"final":"復審之提起，應自行政處分送達之次日起三十日內為之。但行政處分於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口之次日起算。\n依第十三條第二項規定，對權責機關之不作為提起復審，應於法定期間屆滿後，始得提起。但自提出申請後，已逾三年者，不得提起。\n復審提起之日，以原處分機關或權保會收受復審書之日期為準。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關提起復審者，以該機關收受之日，視為提起復審之日。","finalWhy":"一、參酌公務人員保障法第三十條第一項，於第一項本文定明提起復審之期間。另考量航行中艦艇上之軍人於處分送達後，無從即時提起復審，爰於但書規定自艦艇返抵國內港口之次日起算三十日，為提起復審之不變期間。\n二、第二項定明依第十三條第二項規定提起「不作為復審」之期間，以避免申請人與權責機關間之法律關係長期懸而未決。另復審人如於第十三條第二項所定法定期間屆滿前即提起復審，或於提出申請後逾三年始提起復審，權保會應分別依第四十六條第一項第九款「提起復審不備其他法定要件」及第二款「提起復審逾法定期間」之規定為不受理之決定，併予敘明。\n三、參酌公務人員保障法第三十條第二項，於第三項定明復審提起之日，以原處分機關或權保會收受復審書之日為認定依據。\n四、行政程序法施行後，機關作成行政處分時，多已依該法規定，明確教示應向何機關提起行政救濟，如原處分機關已盡教示責任，復審人應無向教示以外之機關提起復審之理，爰參酌行政程序法第九十九條第一項，於第四項定明須係因原處分機關未為告知或告知錯誤，致復審人向無管轄權之機關提起復審時，始得以該機關收受之日視為提起復審之日。至於原處分機關已正確教示復審管轄機關者，則應依第三項規定，認定復審人提起復審之日。","review":{"note":"修正通過","text":"軍人有下列行為之一者，為勤務上違紀行為，應受懲罰：\n一、違背或逾越法令執行勤務。\n二、違反權責長官於職權範圍內下達之職務命令或服役機關管理規範。\n三、怠於監督所屬人員執行勤務或服役機關管理規範。\n四、其他違紀行為違反已送立法院備查或國防部頒定之法令。\n軍人雖非執行勤務，而有濫用軍人身分、勤務權限、服制，或於服役機關內為其他不當行為者，視為勤務上違紀行為。"}},{"no":"第十六條","current":null,"versions":[{"bill":"201110006770000","text":"提起復審應具復審書，載明下列事項：\n一、復審人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或復審代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、原處分機關。\n四、復審請求事項。\n五、復審之事實及理由。\n六、收受或知悉行政處分之年、月、日。\n七、受理復審之權保會。\n八、證據。其為文書者，應添具繕本或影本。\n九、有無其他已提起或進行中之復審或救濟事件。\n十、提起復審之年、月、日。\n復審書應由復審人及法定代理人簽名或蓋章。但委任復審代理人者，應由復審代理人簽名或蓋章。\n提起復審應附原行政處分書影本。\n依第十三條第二項規定，對權責機關之不作為提起復審者，第一項第三款、第六款所列事項，載明應為行政處分之權責機關、申請之年、月、日，並附原申請書之影本及受理申請機關收受證明。","note":"一、參酌公務人員保障法第四十三條第一項，於第一項定明復審書應載明事項。\n二、第二項定明復審書應經當事人簽名或蓋章。\n三、參酌公務人員保障法第四十三條第二項，於第三項定明復審書應附原行政處分書影本，以確定復審人不服之標的。\n四、依第十三條第二項規定提起之「不作為復審」，因權責機關並未作成行政處分，爰參酌公務人員保障法第四十三條第三項，於第三項定明復審書就第一項第三款及第六款所定事項，其應記載之內容。"},{"bill":"202110033240000","text":"提起復審應具復審書，載明下列事項：\n一、復審人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或復審代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、原處分機關。\n四、復審請求事項。\n五、復審之事實及理由。\n六、收受或知悉行政處分之年、月、日。\n七、受理復審之權保會。\n八、證據。其為文書者，應添具繕本或影本。\n九、有無其他已提起或進行中之復審或救濟事件。\n十、提起復審之年、月、日。\n復審書應由復審人及法定代理人簽名或蓋章。但委任復審代理人者，應由復審代理人簽名或蓋章。\n提起復審應附原行政處分書影本。\n依第十三條第二項規定，對權責機關之不作為提起復審者，第一項第三款、第六款所列事項，載明應為行政處分之權責機關、申請之年、月、日，並附原申請書之影本及受理申請機關收受證明。","note":"一、參酌公務人員保障法第四十三條第一項，於第一項定明復審書應載明事項。\n二、第二項定明復審書應經當事人簽名或蓋章。\n三、參酌公務人員保障法第四十三條第二項，於第三項定明復審書應附原行政處分書影本，以確定復審人不服之標的。\n四、依第十三條第二項規定提起之「不作為復審」，因權責機關並未作成行政處分，爰參酌公務人員保障法第四十三條第三項，於第三項定明復審書就第一項第三款及第六款所定事項，其應記載之內容。"},{"bill":"202110036610000","text":"復審之提起，應自行政處分送達之次日起三十日內為之。但行政處分於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口之次日起算。\n依第十四條第二項規定，對權責機關之不作為提起復審，應於法定期間屆滿後，始得提起。但自提出申請後，已逾三年者，不得提起。\n復審提起之日，以原處分機關或權保會收受復審書之日期為準。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關提起復審者，以該機關收受之日，視為提起復審之日。","note":"一、參酌公務人員保障法第三十條第一項，於第一項本文定明提起復審之期間。另考量航行中艦艇上之軍人於處分送達後，無從即時提起復審，爰於但書規定自艦艇返抵國內港口之次日起算三十日，為提起復審之不變期間。\n二、第二項定明依第十四條第二項規定提起「不作為復審」之期間，以避免申請人與權責機關間之法律關係長期懸而未決。另復審人如於第十四條第二項所定法定期間屆滿前即提起復審，或於提出申請後逾三年始提起復審，權保會應分別依第四十七條第一項第九款「提起復審不備其他法定要件」及第二款「提起復審逾法定期間」之規定為不受理之決定，併予敘明。\n三、參酌公務人員保障法第三十條第二項，於第三項定明復審提起之日，以原處分機關或權保會收受復審書之日為認定依據。\n四、行政程序法施行後，機關作成行政處分時，多已依該法規定，明確教示應向何機關提起行政救濟，如原處分機關已盡教示責任，復審人應無向教示以外之機關提起復審之理，爰參酌行政程序法第九十九條第一項，於第四項定明須係因原處分機關未為告知或告知錯誤，致復審人向無管轄權之機關提起復審時，始得以該機關收受之日視為提起復審之日。至於原處分機關已正確教示復審管轄機關者，則應依第三項規定，認定復審人提起復審之日。"},{"bill":"202110044700000","text":"提起復審應具復審書，載明下列事項：\n一、復審人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或復審代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、原處分機關。\n四、復審請求事項。\n五、復審之事實及理由。\n六、收受或知悉行政處分之年、月、日。\n七、受理復審之權保會。\n八、證據。其為文書者，應添具繕本或影本。\n九、有無其他已提起或進行中之復審或救濟事件。\n十、提起復審之年、月、日。\n復審書應由復審人及法定代理人簽名或蓋章。但委任復審代理人者，應由復審代理人簽名或蓋章。\n提起復審應附原行政處分書影本。\n依第十三條第二項規定，對權責機關之不作為提起復審者，第一項第三款、第六款所列事項，載明應為行政處分之權責機關、申請之年、月、日，並附原申請書之影本及受理申請機關收受證明。","note":"一、參酌公務人員保障法第四十三條第一項，於第一項定明復審書應載明事項。\n二、第二項定明復審書應經當事人簽名或蓋章。\n三、參酌公務人員保障法第四十三條第二項，於第三項定明復審書應附原行政處分書影本，以確定復審人不服之標的。\n四、依第十三條第二項規定提起之「不作為復審」，因權責機關並未作成行政處分，爰參酌公務人員保障法第四十三條第三項，於第三項定明復審書就第一項第三款及第六款所定事項，其應記載之內容。"}],"changed":true,"final":"提起復審應具復審書，載明下列事項：\n一、復審人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或復審代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、原處分機關。\n四、復審請求事項。\n五、復審之事實及理由。\n六、收受或知悉行政處分之年、月、日。\n七、受理復審之權保會。\n八、證據。其為文書者，應添具繕本或影本。\n九、有無其他已提起或進行中之復審或救濟事件。\n十、提起復審之年、月、日。\n復審書應由復審人及法定代理人簽名或蓋章。但委任復審代理人者，應由復審代理人簽名或蓋章。\n提起復審應附原行政處分書影本。\n依第十三條第二項規定，對權責機關之不作為提起復審者，第一項第三款、第六款所列事項，載明應為行政處分之權責機關、申請之年、月、日，並附原申請書之影本及受理申請機關收受證明。","finalWhy":"一、參酌公務人員保障法第四十三條第一項，於第一項定明復審書應載明事項。\n二、第二項定明復審書應經當事人簽名或蓋章。\n三、參酌公務人員保障法第四十三條第二項，於第三項定明復審書應附原行政處分書影本，以確定復審人不服之標的。\n四、依第十三條第二項規定提起之「不作為復審」，因權責機關並未作成行政處分，爰參酌公務人員保障法第四十三條第三項，於第四項定明復審書就第一項第三款及第六款所定事項，其應記載之內容。","review":{"note":"照行政院提案通過","text":"懲戒案件或違紀事件於下列期間內未繫屬懲戒法院或作成懲罰處分者，懲戒權或懲罰權不得行使：\n一、重大人事懲罰及重大財產懲罰：十年。\n二、前款以外之人事及財產懲罰：五年。\n三、悔過：一年。\n四、罰勤、檢束及禁足：三個月。\n五、罰站：一個月。"}},{"no":"第十七條","current":null,"versions":[{"bill":"201110006770000","text":"原處分機關之認定，以實施行政處分時之名義為準。但上級機關本於法定職權所為行政處分，交由下級機關執行者，以該上級機關為原處分機關。\n原處分機關調整或裁撤，應以承受其業務之機關為原處分機關，依第九條第一項規定，定其復審管轄。","note":"一、參酌公務人員保障法第二十八條，於第一項定明原處分機關之認定依據，以顯名之機關（構）、部隊、學校或行政法人為行政處分之作成機關。\n二、參酌公務人員保障法第二十九條，於第二項定明原處分機關調整或裁撤時，應以承受其業務之機關為原處分機關，以定其復審管轄。"},{"bill":"202110033240000","text":"原處分機關之認定，以實施行政處分時之名義為準。但上級機關本於法定職權所為行政處分，交由下級機關執行者，以該上級機關為原處分機關。\n原處分機關調整或裁撤，應以承受其業務之機關為原處分機關，依第九條第一項規定，定其復審管轄。","note":"一、參酌公務人員保障法第二十八條，於第一項定明原處分機關之認定依據，以顯名之機關（構）、部隊、學校或行政法人為行政處分之作成機關。\n二、參酌公務人員保障法第二十九條，於第二項定明原處分機關調整或裁撤時，應以承受其業務之機關為原處分機關，以定其復審管轄。"},{"bill":"202110036610000","text":"提起復審應具復審書，載明下列事項：\n一、復審人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或復審代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、原處分機關。\n四、復審請求事項。\n五、復審之事實及理由。\n六、收受或知悉行政處分之年、月、日。\n七、受理復審之權保會。\n八、證據。其為文書者，應添具繕本或影本。\n九、有無其他已提起或進行中之復審或救濟事件。\n十、提起復審之年、月、日。\n復審書應由復審人及法定代理人簽名或蓋章。但委任復審代理人者，應由復審代理人簽名或蓋章。\n提起復審應附原行政處分書影本。\n依第十四條第二項規定，對權責機關之不作為提起復審者，第一項第三款、第六款所列事項，載明應為行政處分之權責機關、申請之年、月、日，並附原申請書之影本及受理申請機關收受證明。","note":"一、參酌公務人員保障法第四十三條第一項，於第一項定明復審書應載明事項。\n二、第二項定明復審書應經當事人簽名或蓋章。\n三、參酌公務人員保障法第四十三條第二項，於第三項定明復審書應附原行政處分書影本，以確定復審人不服之標的。\n四、依第十四條第二項規定提起之「不作為復審」，因權責機關並未作成行政處分，爰參酌公務人員保障法第四十三條第三項，於第三項定明復審書就第一項第三款及第六款所定事項，其應記載之內容。"},{"bill":"202110044700000","text":"原處分機關之認定，以實施行政處分時之名義為準。但上級機關本於法定職權所為行政處分，交由下級機關執行者，以該上級機關為原處分機關。\n原處分機關調整或裁撤，應以承受其業務之機關為原處分機關，依第九條第一項規定，定其復審管轄。","note":"一、參酌公務人員保障法第二十八條，於第一項定明原處分機關之認定依據，以顯名之機關（構）、部隊、學校或行政法人為行政處分之作成機關。\n二、參酌公務人員保障法第二十九條，於第二項定明原處分機關調整或裁撤時，應以承受其業務之機關為原處分機關，以定其復審管轄。"}],"changed":true,"final":"原處分機關之認定，以實施行政處分時之名義為準。但上級機關本於法定職權所為行政處分，交由下級機關執行者，以該上級機關為原處分機關。\n原處分機關調整或裁撤，應以承受其業務之機關為原處分機關，依第九條第一項規定，定其復審管轄。","finalWhy":"一、參酌公務人員保障法第二十八條，於第一項定明原處分機關之認定依據，以顯名之機關（構）、部隊、學校或行政法人為行政處分之作成機關。\n二、參酌公務人員保障法第二十九條，於第二項定明原處分機關調整或裁撤時，應以承受其業務之機關為原處分機關，以定其復審管轄。","review":{"note":"照行政院提案通過","text":"撤職，軍官、士官撤除其軍職，並於一定期間停止任用；其期間為一年以上五年以下。"}},{"no":"第十八條","current":null,"versions":[{"bill":"201110006770000","text":"復審人應繕具復審書經由原處分機關向權保會提起復審。\n原處分機關對於前項復審應先行重新審查原行政處分或不作為是否合法妥當，其認復審為有理由者，得自行撤銷或變更原行政處分、作成行政處分或特定內容之行政處分，並通知權保會。\n原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分者，應自收到復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會。\n原處分機關檢卷答辯時，應將前項答辯書抄送復審人。\n復審人向權保會提起復審者，權保會應將復審書影本或副本送交原處分機關依第二項至第四項規定辦理。","note":"一、參酌公務人員保障法第四十四條第一項，於第一項定明復審人應經原處分機關提出復審書。\n二、參酌公務人員保障法第四十四條第二項，於第二項定明原處分機關收受復審書後，應先行重新審查原行政處分或不作為是否合法妥當。\n三、參酌公務人員保障法第四十四條第三項，於第三項定明原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分時，原處分機關應自收受復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會，以避免延宕復審審議作業期間。\n四、為使復審人即時知悉原處分機關答辯之內容，予以補充理由之機會，爰參酌公務人員保障法第四十四條第四項，於第四項定明原處分機關應將答辯書抄送復審人。\n五、參酌公務人員保障法第四十四條第五項，於第五項定明復審人逕向權保會提起復審者，權保會之處理方式。"},{"bill":"202110033240000","text":"復審人應繕具復審書經由原處分機關向權保會提起復審。\n原處分機關對於前項復審應先行重新審查原行政處分或不作為是否合法妥當，其認復審為有理由者，得自行撤銷或變更原行政處分、作成行政處分或特定內容之行政處分，並通知權保會。\n原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分者，應自收到復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會。\n原處分機關檢卷答辯時，應將前項答辯書抄送復審人。\n復審人向權保會提起復審者，權保會應將復審書影本或副本送交原處分機關依第二項至第四項規定辦理。","note":"一、參酌公務人員保障法第四十四條第一項，於第一項定明復審人應經原處分機關提出復審書。\n二、參酌公務人員保障法第四十四條第二項，於第二項定明原處分機關收受復審書後，應先行重新審查原行政處分或不作為是否合法妥當。\n三、參酌公務人員保障法第四十四條第三項，於第三項定明原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分時，原處分機關應自收受復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會，以避免延宕復審審議作業期間。\n四、為使復審人即時知悉原處分機關答辯之內容，予以補充理由之機會，爰參酌公務人員保障法第四十四條第四項，於第四項定明原處分機關應將答辯書抄送復審人。\n五、參酌公務人員保障法第四十四條第五項，於第五項定明復審人逕向權保會提起復審者，權保會之處理方式。"},{"bill":"202110036610000","text":"原處分機關之認定，以實施行政處分時之名義為準。但上級機關本於法定職權所為行政處分，交由下級機關執行者，以該上級機關為原處分機關。\n原處分機關調整或裁撤，應以承受其業務之機關為原處分機關，依第十條第一項規定，定其復審管轄。","note":"一、參酌公務人員保障法第二十八條，於第一項定明原處分機關之認定依據，以顯名之機關（構）、部隊、學校或行政法人為行政處分之作成機關。\n二、參酌公務人員保障法第二十九條，於第二項定明原處分機關調整或裁撤時，應以承受其業務之機關為原處分機關，以定其復審管轄。"},{"bill":"202110044700000","text":"復審人應繕具復審書經由原處分機關向權保會提起復審。\n原處分機關對於前項復審應先行重新審查原行政處分或不作為是否合法妥當，其認復審為有理由者，得自行撤銷或變更原行政處分、作成行政處分或特定內容之行政處分，並通知權保會。\n原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分者，應自收到復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會。\n原處分機關檢卷答辯時，應將前項答辯書抄送復審人。\n復審人向權保會提起復審者，權保會應將復審書影本或副本送交原處分機關依第二項至第四項規定辦理。","note":"一、參酌公務人員保障法第四十四條第一項，於第一項定明復審人應經原處分機關提出復審書。\n二、參酌公務人員保障法第四十四條第二項，於第二項定明原處分機關收受復審書後，應先行重新審查原行政處分或不作為是否合法妥當。\n三、參酌公務人員保障法第四十四條第三項，於第三項定明原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分時，原處分機關應自收受復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會，以避免延宕復審審議作業期間。\n四、為使復審人即時知悉原處分機關答辯之內容，予以補充理由之機會，爰參酌公務人員保障法第四十四條第四項，於第四項定明原處分機關應將答辯書抄送復審人。\n五、參酌公務人員保障法第四十四條第五項，於第五項定明復審人逕向權保會提起復審者，權保會之處理方式。"}],"changed":true,"final":"復審人應繕具復審書經由原處分機關向權保會提起復審。\n原處分機關對於前項復審應先行重新審查原行政處分或不作為是否合法妥當，其認復審為有理由者，得自行撤銷或變更原行政處分、作成行政處分或特定內容之行政處分，並通知權保會。\n原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分者，應自收到復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會。\n原處分機關檢卷答辯時，應將前項答辯書抄送復審人。\n復審人向權保會提起復審者，權保會應將復審書影本或副本送交原處分機關依第二項至第四項規定辦理。","finalWhy":"一、參酌公務人員保障法第四十四條第一項，於第一項定明復審人應經原處分機關提出復審書。\n二、參酌公務人員保障法第四十四條第二項，於第二項定明原處分機關收受復審書後，應先行重新審查原行政處分或不作為是否合法妥當。\n三、參酌公務人員保障法第四十四條第三項，於第三項定明原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分時，原處分機關應自收受復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會，以避免延宕復審審議作業期間。\n四、為使復審人即時知悉原處分機關答辯之內容，予以補充理由之機會，爰參酌公務人員保障法第四十四條第四項，於第四項定明原處分機關應將答辯書抄送復審人。\n五、參酌公務人員保障法第四十四條第五項，於第五項定明復審人逕向權保會提起復審者，權保會之處理方式。","review":{"note":"照行政院提案通過","text":"降階，軍官、士官依其現任官階降一階換敘，並於一年內不得調任主管職務。\n前項違紀行為人於受懲罰時，已喪失現役軍人身分者，依其退伍、解除召集或除役時之官階降階換敘後，重新審定其退除給與。"}},{"no":"第十九條","current":null,"versions":[{"bill":"201110006770000","text":"原處分機關未於前條第三項期間內處理者，權保會得依職權或依復審人之請求，通知原處分機關於十五日內檢送相關卷證資料；屆期未檢送者，權保會得逕為決定。","note":"為免原處分機關藉故拖延，影響復審人權益，參酌公務人員保障法第四十五條，定明原處分機關未依限處理時，權保會得依職權或依復審人之請求逕為決定。"},{"bill":"202110033240000","text":"原處分機關未於前條第三項期間內處理者，權保會得依職權或依復審人之請求，通知原處分機關於十五日內檢送相關卷證資料；屆期未檢送者，權保會得逕為決定。","note":"為免原處分機關藉故拖延，影響復審人權益，參酌公務人員保障法第四十五條，定明原處分機關未依限處理時，權保會得依職權或依復審人之請求逕為決定。"},{"bill":"202110036610000","text":"復審人應繕具復審書經由原處分機關向權保會提起復審。\n原處分機關對於前項復審應先行重新審查原行政處分或不作為是否合法妥當，其認復審為有理由者，得自行撤銷或變更原行政處分、作成行政處分或特定內容之行政處分，並通知權保會。\n原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分者，應自收到復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會。\n原處分機關檢卷答辯時，應將前項答辯書抄送復審人。\n復審人向權保會提起復審者，權保會應將復審書影本或副本送交原處分機關依第二項至第四項規定辦理。","note":"一、參酌公務人員保障法第四十四條第一項，於第一項定明復審人應經原處分機關提出復審書。\n二、參酌公務人員保障法第四十四條第二項，於第二項定明原處分機關收受復審書後，應先行重新審查原行政處分或不作為是否合法妥當。\n三、參酌公務人員保障法第四十四條第三項，於第三項定明原處分機關不依復審人之請求撤銷或變更原行政處分、作成行政處分或特定內容之行政處分時，原處分機關應自收受復審書之次日起二十日內附具答辯書，並將必要之關係文件，送於權保會，以避免延宕復審審議作業期間。\n四、為使復審人即時知悉原處分機關答辯之內容，予以補充理由之機會，爰參酌公務人員保障法第四十四條第四項，於第四項定明原處分機關應將答辯書抄送復審人。\n五、參酌公務人員保障法第四十四條第五項，於第五項定明復審人逕向權保會提起復審者，權保會之處理方式。"},{"bill":"202110044700000","text":"原處分機關未於前條第三項期間內處理者，權保會得依職權或依復審人之請求，通知原處分機關於十五日內檢送相關卷證資料；屆期未檢送者，權保會得逕為決定。","note":"為免原處分機關藉故拖延，影響復審人權益，參酌公務人員保障法第四十五條，定明原處分機關未依限處理時，權保會得依職權或依復審人之請求逕為決定。"}],"changed":true,"final":"原處分機關未於前條第三項期間內處理者，權保會得依職權或依復審人之請求，通知原處分機關於十五日內檢送相關卷證資料；屆期未檢送者，權保會得逕為決定。","finalWhy":"為免原處分機關藉故拖延，影響復審人權益，參酌公務人員保障法第四十五條，定明原處分機關未依限處理時，權保會得依職權或依復審人之請求逕為決定。","review":{"note":"照行政院提案通過","text":"降級，依懲罰時現職之俸級降一級；其期間為三個月以上一年以下，期滿應重計俸級年資。"}},{"no":"第二十條","current":null,"versions":[{"bill":"201110006770000","text":"復審人在第十五條第一項所定期間向原處分機關或權保會為不服原行政處分之表示者，視為已在法定期間內提起復審。權保會應依第二十三條規定通知補正。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關，作不服原行政處分之表示者，視為自始向有管轄權之權保會提起復審。\n前項收受之機關應於十日內將該事件移送於有管轄權之權保會，並通知復審人。","note":"一、參酌訴願法第五十七條本文，於第一項定明復審人於法定期間內向原處分機關或權保會為不服表示者，視為已在法定期間內提起復審。又第十六條第一項已規定復審應繕具復審書，並載明相關事項，故復審人雖視為已在法定期間內提起復審，但權保會仍應依第二十三條規定，通知其於二十日內補正復審書。\n二、為與第十五條第四項之法規範具一致性，於第二項定明復審人誤向原處分機關或有管轄權之權保會以外之機關作不服原行政處分之表示者，須係因原處分機關未告知管轄權保會或告知錯誤者，始得視為自始向有管轄權之權保會提起復審。\n三、復審因係向權保會提起，爰參酌訴願法第六十一條第二項，於第三項定明第二項收受之機關應將該復審事件直接移送權保會，並通知復審人。"},{"bill":"202110033240000","text":"復審人在第十五條第一項所定期間向原處分機關或權保會為不服原行政處分之表示者，視為已在法定期間內提起復審。權保會應依第二十三條規定通知補正。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關，作不服原行政處分之表示者，視為自始向有管轄權之權保會提起復審。\n前項收受之機關應於十日內將該事件移送於有管轄權之權保會，並通知復審人。","note":"一、參酌訴願法第五十七條本文，於第一項定明復審人於法定期間內向原處分機關或權保會為不服表示者，視為已在法定期間內提起復審。又第十六條第一項已規定復審應繕具復審書，並載明相關事項，故復審人雖視為已在法定期間內提起復審，但權保會仍應依第二十三條規定，通知其於二十日內補正復審書。\n二、為與第十五條第四項之法規範具一致性，於第二項定明復審人誤向原處分機關或有管轄權之權保會以外之機關作不服原行政處分之表示者，須係因原處分機關未告知管轄權保會或告知錯誤者，始得視為自始向有管轄權之權保會提起復審。\n三、復審因係向權保會提起，爰參酌訴願法第六十一條第二項，於第三項定明第二項收受之機關應將該復審事件直接移送權保會，並通知復審人。"},{"bill":"202110036610000","text":"原處分機關未於前條第三項期間內處理者，權保會得依職權或依復審人之請求，通知原處分機關於十五日內檢送相關卷證資料；屆期未檢送者，權保會得逕為決定。","note":"為免原處分機關藉故拖延，影響復審人權益，參酌公務人員保障法第四十五條，定明原處分機關未依限處理時，權保會得依職權或依復審人之請求逕為決定。"},{"bill":"202110044700000","text":"復審人在第十五條第一項所定期間向原處分機關或權保會為不服原行政處分之表示者，視為已在法定期間內提起復審。權保會應依第二十三條規定通知補正。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關，作不服原行政處分之表示者，視為自始向有管轄權之權保會提起復審。\n前項收受之機關應於十日內將該事件移送於有管轄權之權保會，並通知復審人。","note":"一、參酌訴願法第五十七條本文，於第一項定明復審人於法定期間內向原處分機關或權保會為不服表示者，視為已在法定期間內提起復審。又第十六條第一項已規定復審應繕具復審書，並載明相關事項，故復審人雖視為已在法定期間內提起復審，但權保會仍應依第二十三條規定，通知其於二十日內補正復審書。\n二、為與第十五條第四項之法規範具一致性，於第二項定明復審人誤向原處分機關或有管轄權之權保會以外之機關作不服原行政處分之表示者，須係因原處分機關未告知管轄權保會或告知錯誤者，始得視為自始向有管轄權之權保會提起復審。\n三、復審因係向權保會提起，爰參酌訴願法第六十一條第二項，於第三項定明第二項收受之機關應將該復審事件直接移送權保會，並通知復審人。"}],"changed":true,"final":"復審人在第十五條第一項所定期間向原處分機關或權保會為不服原行政處分之表示者，視為已在法定期間內提起復審。權保會應依第二十三條規定通知補正。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關，作不服原行政處分之表示者，視為自始向有管轄權之權保會提起復審。\n前項收受之機關應於十日內將該事件移送於有管轄權之權保會，並通知復審人。","finalWhy":"一、參酌訴願法第五十七條本文，於第一項定明復審人於法定期間內向原處分機關或權保會為不服表示者，視為已在法定期間內提起復審。又第十六條第一項已規定復審應繕具復審書，並載明相關事項，故復審人雖視為已在法定期間內提起復審，但權保會仍應依第二十三條規定，通知其於二十日內補正復審書。\n二、為與第十五條第四項之法規範具一致性，於第二項定明復審人誤向原處分機關或有管轄權之權保會以外之機關作不服原行政處分之表示者，須係因原處分機關未告知管轄權保會或告知錯誤者，始得視為自始向有管轄權之權保會提起復審。\n三、復審因係向權保會提起，爰參酌訴願法第六十一條第二項，於第三項定明第二項收受之機關應將該復審事件直接移送權保會，並通知復審人。","review":{"note":"照行政院提案通過","text":"記過，分記過與記大過。\n記過三次，視為記大過一次；在一年內累計記大過三次者，軍官、士官當然撤職，志願士兵當然廢止起役，並停止任用或不得志願入營一年。"}},{"no":"第二十一條","current":null,"versions":[{"bill":"201110006770000","text":"復審提起後，於復審決定書送達前，復審人得撤回之。復審經撤回後，不得再提起同一之復審。","note":"參酌公務人員保障法第四十七條，定明撤回復審之期限及撤回之效果。"},{"bill":"202110033240000","text":"復審提起後，於復審決定書送達前，復審人得撤回之。復審經撤回後，不得再提起同一之復審。","note":"參酌公務人員保障法第四十七條，定明撤回復審之期限及撤回之效果。"},{"bill":"202110036610000","text":"復審人在第十六條第一項所定期間向原處分機關或權保會為不服原行政處分之表示者，視為已在法定期間內提起復審。權保會應依第二十四條規定通知補正。\n因原處分機關未告知有管轄權之權保會或告知錯誤，致復審人誤向原處分機關或有管轄權之權保會以外之機關，作不服原行政處分之表示者，視為自始向有管轄權之權保會提起復審。\n前項收受之機關應於十日內將該事件移送於有管轄權之權保會，並通知復審人。","note":"一、參酌訴願法第五十七條本文，於第一項定明復審人於法定期間內向原處分機關或權保會為不服表示者，視為已在法定期間內提起復審。又第十七條第一項已規定復審應繕具復審書，並載明相關事項，故復審人雖視為已在法定期間內提起復審，但權保會仍應依第二十三條規定，通知其於二十日內補正復審書。\n二、為與第十六條第四項之法規範具一致性，於第二項定明復審人誤向原處分機關或有管轄權之權保會以外之機關作不服原行政處分之表示者，須係因原處分機關未告知管轄權保會或告知錯誤者，始得視為自始向有管轄權之權保會提起復審。\n三、復審因係向權保會提起，爰參酌訴願法第六十一條第二項，於第三項定明第二項收受之機關應將該復審事件直接移送權保會，並通知復審人。"},{"bill":"202110044700000","text":"復審提起後，於復審決定書送達前，復審人得撤回之。復審經撤回後，不得再提起同一之復審。","note":"參酌公務人員保障法第四十七條，定明撤回復審之期限及撤回之效果。"}],"changed":true,"final":"復審提起後，於復審決定書送達前，復審人得撤回之。復審經撤回後，不得再提起同一之復審。","finalWhy":"參酌公務人員保障法第四十七條，定明撤回復審之期限及撤回之效果。","review":{"note":"照行政院提案通過","text":"罰薪，扣除月支待遇總額百分之十至百分之三十；其期間為一個月以上六個月以下。"}},{"no":"第二十二條","current":null,"versions":[{"bill":"201110006770000","text":"復審提起後，復審人死亡者，由其繼承人或其他依法得繼受原行政處分所涉權利或法律上利益之人承受復審程序。但已無取得復審決定之法律上利益或依其性質不得承受者，不在此限。\n依前項規定承受復審者，應於事實發生之日起三十日內，向權保會檢送繼受權利之證明文件。\n依第一項規定得承受復審者未聲明承受復審，權保會於知悉得承受事由時，應通知其承受復審，經通知後未聲明承受復審者，得命其續行復審。","note":"一、參酌公務人員保障法第四十八條第一項，於第一項定明復審人死亡者，得由其繼承人或得繼受其權利之人承受復審之依據，俾資遵循。\n二、參酌公務人員保障法第四十八條第二項，於第二項定明承受復審者，應向權保會提出繼受權利證明文件及期間。\n三、參酌行政訴訟法第一百八十六條準用民事訴訟法第一百七十八條，於第三項定明得承受復審之人不聲明承受復審時，權保會得依職權，命其續行復審。另本項所定命得承受復審者續行復審之情形，限於原行政處分未具一身專屬性之情形，併予敘明。"},{"bill":"202110033240000","text":"復審提起後，復審人死亡者，由其繼承人或其他依法得繼受原行政處分所涉權利或法律上利益之人承受復審程序。但已無取得復審決定之法律上利益或依其性質不得承受者，不在此限。\n依前項規定承受復審者，應於事實發生之日起三十日內，向權保會檢送繼受權利之證明文件。\n依第一項規定得承受復審者未聲明承受復審，權保會於知悉得承受事由時，應通知其承受復審，經通知後未聲明承受復審者，得命其續行復審。","note":"一、參酌公務人員保障法第四十八條第一項，於第一項定明復審人死亡者，得由其繼承人或得繼受其權利之人承受復審之依據，俾資遵循。\n二、參酌公務人員保障法第四十八條第二項，於第二項定明承受復審者，應向權保會提出繼受權利證明文件及期間。\n三、參酌行政訴訟法第一百八十六條準用民事訴訟法第一百七十八條，於第三項定明得承受復審之人不聲明承受復審時，權保會得依職權，命其續行復審。另本項所定命得承受復審者續行復審之情形，限於原行政處分未具一身專屬性之情形，併予敘明。"},{"bill":"202110036610000","text":"復審提起後，於復審決定書送達前，復審人得撤回之。復審經撤回後，不得再提起同一之復審。","note":"參酌公務人員保障法第四十七條，定明撤回復審之期限及撤回之效果。"},{"bill":"202110044700000","text":"復審提起後，復審人死亡者，由其繼承人或其他依法得繼受原行政處分所涉權利或法律上利益之人承受復審程序。但已無取得復審決定之法律上利益或依其性質不得承受者，不在此限。\n依前項規定承受復審者，應於事實發生之日起三十日內，向權保會檢送繼受權利之證明文件。\n依第一項規定得承受復審者未聲明承受復審，權保會於知悉得承受事由時，應通知其承受復審，經通知後未聲明承受復審者，得命其續行復審。","note":"一、參酌公務人員保障法第四十八條第一項，於第一項定明復審人死亡者，得由其繼承人或得繼受其權利之人承受復審之依據，俾資遵循。\n二、參酌公務人員保障法第四十八條第二項，於第二項定明承受復審者，應向權保會提出繼受權利證明文件及期間。\n三、參酌行政訴訟法第一百八十六條準用民事訴訟法第一百七十八條，於第三項定明得承受復審之人不聲明承受復審時，權保會得依職權，命其續行復審。另本項所定命得承受復審者續行復審之情形，限於原行政處分未具一身專屬性之情形，併予敘明。"}],"changed":true,"final":"復審提起後，復審人死亡者，由其繼承人或其他依法得繼受原行政處分所涉權利或法律上利益之人承受復審程序。但已無取得復審決定之法律上利益或依其性質不得承受者，不在此限。\n依前項規定承受復審者，應於事實發生之日起三十日內，向權保會檢送繼受權利之證明文件。\n依第一項規定得承受復審者未聲明承受復審，權保會於知悉得承受事由時，應通知其承受復審，經通知後未聲明承受復審者，得命其續行復審。","finalWhy":"一、參酌公務人員保障法第四十八條第一項，於第一項定明復審人死亡者，得由其繼承人或得繼受其權利之人承受復審之依據，俾資遵循。\n二、參酌公務人員保障法第四十八條第二項，於第二項定明承受復審者，應向權保會提出繼受權利證明文件及期間。\n三、參酌行政訴訟法第一百八十六條準用民事訴訟法第一百七十八條，於第三項定明得承受復審之人不聲明承受復審時，權保會得依職權，命其續行復審。另本項所定命得承受復審者續行復審之情形，限於原行政處分未具一身專屬性之情形，併予敘明。","review":{"note":"照行政院提案通過","text":"悔過，於指定處所實施悔過教育；其期間為一日以上十五日以下，執行期間不列計現役期間及退伍（休、職）年資。\n悔過之實施，不得有禁錮、凌虐或其他非人道待遇之行為。\n第一項悔過實施處所、教育之課程內容、管理與考核、管理人員之資格、權責劃分、不列計現役期間與年資之計算及其他相關事項之辦法，由國防部定之。"}},{"no":"第二十三條","current":null,"versions":[{"bill":"201110006770000","text":"權保會認為復審書不合法定程式，而其情形可補正者，應通知復審人於二十日內補正。","note":"參酌公務人員保障法第四十九條，定明復審書不合法定程式之補正及補正期間。"},{"bill":"202110033240000","text":"權保會認為復審書不合法定程式，而其情形可補正者，應通知復審人於二十日內補正。","note":"參酌公務人員保障法第四十九條，定明復審書不合法定程式之補正及補正期間。"},{"bill":"202110036610000","text":"復審提起後，復審人死亡者，由其繼承人或其他依法得繼受原行政處分所涉權利或法律上利益之人承受復審程序。但已無取得復審決定之法律上利益或依其性質不得承受者，不在此限。\n依前項規定承受復審者，應於事實發生之日起三十日內，向權保會檢送繼受權利之證明文件。\n依第一項規定得承受復審者未聲明承受復審，權保會於知悉得承受事由時，應通知其承受復審，經通知後未聲明承受復審者，得命其續行復審。","note":" t":null,"versions":[{"bill":"201110006770000","text":"二人以上得對於同一原因事實之行政處分共同提起復審，並得選定其中一人至三人為代表人；未選定代表人者，權保會得限期通知其選定；屆期未選定者，權保會得依職權指定之。\n選定代表人應於最初為復審行為時，向權保會提出文書證明。\n代表人經選定或指定後，仍得更換或增減之。\n第一項代表人之選定及前項代表人之更換或增減，非經全體復審人書面通知權保會，不生效力。","note":"一、參酌訴願法第二十一條第一項，於第一項定明對於同一原因事實之數復審事件合併提起救濟時，得選定其中一人至三人為代表人，俾復審程序免於繁複，對未選定代表人時，權保會得予指定。\n二、參酌訴願法第二十二條第二項，於第二項定明選定代表人之方式。\n三、參酌訴願法第二十五條第一項，於第三項定明代表人之更換或增減。\n四、參酌公務人員保障法第三十六條，於第四項定明代表人之選定、更換或增減，應經全體復審人以書面通知權保會。"},{"bill":"202110033240000","text":"二人以上得對於同一原因事實之行政處分共同提起復審，並得選定其中一人至三人為代表人；未選定代表人者，權保會得限期通知其選定；屆期未選定者，權保會得依職權指定之。\n選定代表人應於最初為復審行為時，向權保會提出文書證明。\n代表人經選定或指定後，仍得更換或增減之。\n第一項代表人之選定及前項代表人之更換或增減，非經全體復審人書面通知權保會，不生效力。","note":"一、參酌訴願法第二十一條第一項，於第一項定明對於同一原因事實之數復審事件合併提起救濟時，得選定其中一人至三人為代表人，俾復審程序免於繁複，對未選定代表人時，權保會得予指定。\n二、參酌訴願法第二十二條第二項，於第二項定明選定代表人之方式。\n三、參酌訴願法第二十五條第一項，於第三項定明代表人之更換或增減。\n四、參酌公務人員保障法第三十六條，於第四項定明代表人之選定、更換或增減，應經全體復審人以書面通知權保會。"},{"bill":"202110036610000","text":"能獨立以法律行為負義務者，有復審能力。\n無復審能力人應由其法定代理人代為復審行為。\n關於復審之法定代理，依民法之規定。","note":"一、訴訟法對訴訟能力、訴願法對訴願能力，均有明文定義，而復審係本法所定之救濟程序，爰參酌公務人員保障法第三十四條第一項，於第一項定明能獨立以法律行為負義務，即有辨別事理之能力者，有復審能力，以利其伸張權利並期周延。\n二、參酌公務人員保障法第三十四條第二項，於第二項定明無復審能力人應由其法定代理人代為復審行為。\n三、參酌公務人員保障法第三十四條第三項，於第三項定明復審之法定代理，依民法之規定。"},{"bill":"202110044700000","text":"二人以上得對於同一原因事實之行政處分共同提起復審，並得選定其中一人至三人為代表人；未選定代表人者，權保會得限期通知其選定；屆期未選定者，權保會得依職權指定之。\n選定代表人應於最初為復審行為時，向權保會提出文書證明。\n代表人經選定或指定後，仍得更換或增減之。\n第一項代表人之選定及前項代表人之更換或增減，非經全體復審人書面通知權保會，不生效力。","note":"一、參酌訴願法第二十一條第一項，於第一項定明對於同一原因事實之數復審事件合併提起救濟時，得選定其中一人至三人為代表人，俾復審程序免於繁複，對未選定代表人時，權保會得予指定。\n二、參酌訴願法第二十二條第二項，於第二項定明選定代表人之方式。\n三、參酌訴願法第二十五條第一項，於第三項定明代表人之更換或增減。\n四、參酌公務人員保障法第三十六條，於第四項定明代表人之選定、更換或增減，應經全體復審人以書面通知權保會。"}],"changed":true,"final":"二人以上得對於同一原因事實之行政處分共同提起復審，並得選定其中一人至三人為代表人；未選定代表人者，權保會得限期通知其選定；屆期未選定者，權保會得依職權指定之。\n選定代表人應於最初為復審行為時，向權保會提出文書證明。\n代表人經選定或指定後，仍得更換或增減之。\n第一項代表人之選定及前項代表人之更換或增減，非經全體復審人書面通知權保會，不生效力。","finalWhy":"一、參酌訴願法第二十一條第一項，於第一項定明對於同一原因事實之數復審事件合併提起救濟時，得選定其中一人至三人為代表人，俾復審程序免於繁複，對未選定代表人時，權保會得予指定。\n二、參酌訴願法第二十二條第二項，於第二項定明選定代表人之方式。\n三、參酌訴願法第二十五條第一項，於第三項定明代表人之更換或增減。\n四、參酌公務人員保障法第三十六條，於第四項 日罰勤時間以六小時為限。"}},{"no":"第二十七條","current":null,"versions":[{"bill":"201110006770000","text":"復審人得委任熟諳法律或有專業知識之人為代理人，每一復審人委任者以不超過三人為限，並應於最初為復審代理行為時，向權保會提出委任書。\n前項復審代理人，權保會認為不適當時，得禁止之，並以書面通知復審人。\n復審代理人之更換、增減或解除，非以書面通知權保會，不生效力。\n復審委任之解除，由復審代理人提出者，自為解除意思表示之日起十五日內，仍應為維護復審人權利或法律上利益之必要行為。","note":"一、參酌公務人員保障法第三十八條第一項，於第一項定明復審人得委任熟諳法律或有專業知識之人為代理人，其人數以每一復審人最多委任三人為限。共同提起復審之事件，如委任代理人，則以其代表人為基準，計算得委任之代理人人數，如代表人有三人時，得委任之代理人數最多為九人。\n二、參酌公務人員保障法第三十八條第二項，於第二項定明權保會得禁止不適當之復審代理人，以維復審人之權益。\n三、參酌公務人員保障法第三十八條第三項，於第三項定明代理人之更換、增減或解除，應以書面通知權保會，始生效力。\n四、參酌公務人員保障法第三十八條第四項，於第四項定明復審代理人自為解除委任者，仍應於一定期間內為維護復審人權益之必要行為。"},{"bill":"202110033240000","text":"復審人得委任熟諳法律或有專業知識之人為代理人，每一復審人委任者以不超過三人為限，並應於最初為復審代理行為時，向權保會提出委任書。\n前項復審代理人，權保會認為不適當時，得禁止之，並以書面通知復審人。\n復審代理人之更換、增減或解除，非以書面通知權保會，不生效力。\n復審委任之解除，由復審代理人提出者，自為解除意思表示之日起十五日內，仍應為維護復審人權利或法律上利益之必要行為。","note":"一、參酌公務人員保障法第三十八條第一項，於第一項定明復審人得委任熟諳法律或有專業知識之人為代理人，其人數以每一復審人最多委任三人為限。共同提起復審之事件，如委任代理人，則以其代表人為基準，計算得委任之代理人人數，如代表人有三人時，得委任之代理人數最多為九人。\n二、參酌公務人員保障法第三十八條第二項，於第二項定明權保會得禁止不適當之復審代理人，以維復審人之權益。\n三、參酌公務人員保障法第三十八條第三項，於第三項定明代理人之更換、增減或解除，應以書面通知權保會，始生效力。\n四、參酌公務人員保障法第三十八條第四項，於第四項定明復審代理人自為解除委任者，仍應於一定期間內為維護復審人權益之必要行為。"},{"bill":"202110036610000","text":"代表人經選定或指定後，由其代表全體復審人為復審行為。但撤回復審，非經全體復審人書面同意，不得為之。\n代表人有二人以上者，均得單獨代表共同復審人為復審行為。\n代表人之代表權不因其他共同復審人死亡、喪失復審能力或法定代理變更而消滅。","note":"一、參酌公務人員保障法第三十七條第一項，於第一項本文定明代表人代表為復審行為之權限及效力；另於但書定明撤回復審，應由全體復審人書面同意之。\n二、參酌公務人員保障法第三十七條第二項，於第二項定明代表人有二人以上者之代表權限。\n三、參酌公務人員保障法第三十七條第三項，於第三項定明代表權不因其他共同復審人死亡、喪失復審能力或法定代理變更而消滅。"},{"bill":"202110044700000","text":"復審人得委任熟諳法律或有專業知識之人為代理人，每一復審人委任者以不超過三人為限，並應於最初為復審代理行為時，向權保會提出委任書。\n前項復審代理人，權保會認為不適當時，得禁止之，並以書面通知復審人。\n復審代理人之更換、增減或解除，非以書面通知權保會，不生效力。\n復審委任之解除，由復審代理人提出者，自為解除意思表示之日起十五日內，仍應為維護復審人權利或法律上利益之必要行為。","note":"一、參酌公務人員保障法第三十八條第一項，於第一項定明復審人得委任熟諳法律或有專業知識之人為代理人，其人數以每一復審人最多委任三人為限。共同提起復審之事件，如委任代理人，則以其代表人為基準，計算得委任之代理人人數，如代表人有三人時，得委任之代理人數最多為九人。\n二、參酌公務人員保障法第三十八條第二項，於第二項定明權保會得禁止不適當之復審代理人，以維復審人之權益。\n三、參酌公務人員保障法第三十八條第三項，於第三項定明代理人之更換、增減或解除，應以書面通知權保會，始生效力。\n四、參酌公務人員保障法第三十八條第四項，於第四項定明復審代理人自為解除委任者，仍應於一定期間內為維護復審人權益之必要行為。"}],"changed":true,"final":"復審人得委任熟諳法律或有專業知識之人為代理人，每一復審人委任者以不超過三人為限，並應於最初為復審代理行為時，向權保會提出委任書。\n前項復審代理人，權保會認為不適當時，得禁止之，並以書面通知復審人。\n復審代理人之更換、增減或解除，非以書面通知權保會，不生效力。\n復審委任之解除，由復審代理人提出者，自為解除意思表示之日起十五日內，仍應為維護復審人權利或法律上利益之必要行為。","finalWhy":"一、參酌公務人員保障法第三十八條第一項，於第一項定明復審人得委任熟諳法律或有專業知識之人為代理人，其人數以每一復審人最多委任三人為限。共同提起復審之事件，如委任代理人，則以其代表人為基準，計算得委任之代理人人數，如代表人有三人時，得委任之代理人數最多為九人。\n二、參酌公務人員保障法第三十八條第二項，於第二項定明權保會得禁止不適當之復審代理人，以維復審人之權益。\n三、參酌公務人員保障法第三十八條第三項，於第三項定明代理人之更換、增減或解除，應以書面通知權保會，始生效力。\n四、參酌公務人員保障法第三十八條第四項，於第四項定明復審代理人自為解除委任者，仍應於一定期間內為維護復審人權益之必要行為。","review":{"note":"照行政院提案通過","text":"罰站，以立正行之；其時間以二小時為限。"}},{"no":"第二十八條","current":null,"versions":[{"bill":"201110006770000","text":"復審代理人就其受委任之事件，得為一切復審行為。但撤回復審，非受特別委任不得為之。\n復審代理人有二人以上者，均得單獨代理復審人。\n違反前項規定而為委任者，其復審代理人仍得單獨代理。\n復審代理人事實上之陳述，經到場之復審人本人即時撤銷或更正者，不生效力。\n復審代理權不因復審人本人死亡、破產、喪失復審能力或法定代理變更而消滅。","note":"一、參酌公務人員保障法第三十九條第一項，於第一項本文定明復審代理人之權限，並於但書定明復審之撤回，應受特別委任。\n二、參酌公務人員保障法第三十九條第二項，於第二項定明復審代理人有二人以上者，均具單獨代理權限。\n三、參酌公務人員保障法第三十九條第三項，於第三項定明違反第二項規定而為委任者，各復審代理人仍具單獨代理權限。\n四、復審代理人雖代理復審人為復審行為，惟相關事實，復審人本人仍較熟悉，爰參酌公務人員保障法第三十九條第四項，於第四項定明到場之復審人本人得將該代理人事實上之陳述，即時撤銷或更正，以維復審人權益。\n五、參酌公務人員保障法第三十九條第五項，於第五項定明復審代理權不因復審人死亡、破產、喪失復審能力或法定代理變更等原因受影響。"},{"bill":"202110033240000","text":"復審代理人就其受委任之事件，得為一切復審行為。但撤回復審，非受特別委任不得為之。\n復審代理人有二人以上者，均得單獨代理復審人。\n違反前項規定而為委任者，其復審代理人仍得單獨代理。\n復審代理人事實上之陳述，經到場之復審人本人即時撤銷或更正者，不生效力。\n復審代理權不因復審人本人死亡、破產、喪失復審能力或法定代理變更而消滅。","note":"一、參酌公務人員保障法第三十九條第一項，於第一項本文定明復審代理人之權限，並於但書定明復審之撤回，應受特別委任。\n二、參酌公務人員保障法第三十九條第二項，於第二項定明復審代理人有二人以上者，均具單獨代理權限。\n三、參酌公務人員保障法第三十九條第三項，於第三項定明違反第二項規定而為委任者，各復審代理人仍具單獨代理權限。\n四、復審代理人雖代理復審人為復審行為，惟相關事實，復審人本人仍較熟悉，爰參酌公務人員保障法第三十九條第四項，於第四項定明到場之復審人本人得將該代理人事實上之陳述，即時撤銷或更正，以維復審人權益。\n五、參酌公務人員保障法第三十九條第五項，於第五項定明復審代理權不因復審人死亡、破產、喪失復審能力或法定代理變更等原因受影響。"},{"bill":"202110036610000","text":"復審人得委任熟諳法律或有專業知識之人為代理人，每一復審人委任者以不超過三人為限，並應於最初為復審代理行為時，向權保會提出委任書。\n前項復審代理人，權保會認為不適當時，得禁止之，並以書面通知復審人。\n復審代理人之更換、增減或解除，非以書面通知權保會，不生效力。\n復審委任之解除，由復審代理人提出者，自為解除意思表示之日起十五日內，仍應為維護復審人權利或法律上利益之必要行為。","note":"一、參酌公務人員保障法第三十八條第一項，於第一項定明復審人得委任熟諳法律或有專業知識之人為代理人，其人數以每一復審人最多委任三人為限。共同提起復審之事件，如委任代理人，則以其代表人為基準，計算得委任之代理人人數，如代表人有三人時，得委任之代理人數最多為九人。\n二、參酌公務人員保障法第三十八條第二項，於第二項定明權保會得禁止不適當之復審代理人，以維復審人之權益。\n三、參酌公務人員保障法第三十八條第三項，於第三項定明代理人之更換、增減或解除，應以書面通知權保會，始生效力。\n四、參酌公務人員保障法第三十八條第四項，於第四項定明復審代理人自為解除委任者，仍應於一定期間內為維護復審人權益之必要行為。"},{"bill":"202110044700000","text":"復審代理人就其受委任之事件，得為一切復審行為。但撤回復審，非受特別委任不得為之。\n復審代理人有二人以上者，均得單獨代理復審人。\n違反前項規定而為委任者，其復審代理人仍得單獨代理。\n復審代理人事實上之陳述，經到場之復審人本人即時撤銷或更正者，不生效力。\n復審代理權不因復審人本人死亡、破產、喪失復審能力或法定代理變更而消滅。","note":"一、參酌公務人員保障法第三十九條第一項，於第一項本文定明復審代理人之權限，並於但書定明復審之撤回，應受特別委任。\n二、參酌公務人員保障法第三十九條第二項，於第二項定明復審代理人有二人以上者，均具單獨代理權限。\n三、參酌公務人員保障法第三十九條第三項，於第三項定明違反第二項規定而為委任者，各復審代理人仍具單獨代理權限。\n四、復審代理人雖代理復審人為復審行為，惟相關事實，復審人本人仍較熟悉，爰參酌公務人員保障法第三十九條第四項，於第四項定明到場之復審人本人得將該代理人事實上之陳述，即時撤銷或更正，以維復審人權益。\n五、參酌公務人員保障法第三十九條第五項，於第五項定明復審代理權不因復審人死亡、破產、喪失復審能力或法定代理變更等原因受影響。"}],"changed":true,"final":"復審代理人就其受委任之事件，得為一切復審行為。但撤回復審，非受特別委任不得為之。\n復審代理人有二人以上者，均得單獨代理復審人。\n違反前項規定而為委任者，其復審代理人仍得單獨代理。\n復審代理人事實上之陳述，經到場之復審人本人即時撤銷或更正者，不生效力。\n復審代理權不因復審人本人死亡、破產、喪失復審能力或法定代理變更而消滅。","finalWhy":"一、參酌公務人員保障法第三十九條第一項，於第一項本文定明復審代理人之權限，並於但書定明復審之撤回，應受特別委任。\n二、參酌公務人員保障法第三十九條第二項，於第二項定明復審代理人有二人以上者，均具單獨代理權限。\n三、參酌公務人員保障法第三十九條第三項，於第三項定明違反第二項規定而為委任者，各復審代理人仍具單獨代理權限。\n四、復審代理人雖代理復審人為復審行為，惟相關事實，復審人本人仍較熟悉，爰參酌公務人員保障法第三十九條第四項，於第四項定明到場之復審人本人得將該代理人事實上之陳述，即時撤銷或更正，以維復審人權益。\n五、參酌公務人員保障法第三十九條第五項，於第五項定明復審代理權不因復審人死亡、破產、喪失復審能力或法定代理變更等原因受影響。","review":{"note":"照行政院提案通過","text":"懲罰，應由權責長官核定之。\n懲罰權責，除上將之懲罰與中將、少將重要軍職之撤職及降階懲罰，由服役機關報請總統核定外，其餘人員之平時、戰時懲罰權責，由國防部定之。"}},{"no":"第二十九條","current":null,"versions":[{"bill":"201110006770000","text":"復審人或復審代理人經權保會之許可，得於期日偕同輔佐人到場。\n權保會認為必要時，亦得命復審人或復審代理人偕同輔佐人到場。\n前二項輔佐人，權保會認為不適當時，得廢止其許可或禁止其續為輔佐。\n輔佐人到場所為之陳述，復審人或復審代理人不即時撤銷或更正者，視為其所自為。","note":"一、參酌公務人員保障法第四十條第一項，於第一項定明復審人或復審代理人得偕同輔佐人到場。\n二、參酌公務人員保障法第四十條第二項，於第二項定明權保會得命復審人或復審代理人偕同輔佐人到場。\n三、參酌公務人員保障法第四十條第三項，於第三項定明權保會得廢止許可輔佐人到場或禁止其續為輔佐。\n四、參酌公務人員保障法第四十條第四項，於第四項定明輔佐人到場陳述之效果。"},{"bill":"202110033240000","text":"復審人或復審代理人經權保會之許可，得於期日偕同輔佐人到場。\n權保會認為必要時，亦得命復審人或復審代理人偕同輔佐人到場。\n前二項輔佐人，權保會認為不適當時，得廢止其許可或禁止其續為輔佐。\n輔佐人到場所為之陳述，復審人或復審代理人不即時撤銷或更正者，視為其所自為。","note":"一、參酌公務人員保障法第四十條第一項，於第一項定明復審人或復審代理人得偕同輔佐人到場。\n二、參酌公務人員保障法第四十條第二項，於第二項定明權保會得命復審人或復審代理人偕同輔佐人到場。\n三、參酌公務人員保障法第四十條第三項，於第三項定明權保會得廢止許可輔佐人到場或禁止其續為輔佐。\n四、參酌公務人員保障法第四十條第四項，於第四項定明輔佐人到場陳述之效果。"},{"bill":"202110036610000","text":"復審代理人就其受委任之事件，得為一切復審行為。但撤回復審，非受特別委任不得為之。\n復審代理人有二人以上者，均得單獨代理復審人。\n違反前項規定而為委任者，其復審代理人仍得單獨代理。\n復審代理人事實上之陳述，經到場之復審人本人即時撤銷或更正者，不生效力。\n復審代理權不因復審人本人死亡、破產、喪失復審能力或法定代理變更而消滅。","note":"一、參酌公務人員保障法第三十九條第一項，於第一項本文定明復審代理人之權限，並於但書定明復審之撤回，應受特別委任。\n二、參酌公務人員保障法第三十九條第二項，於第二項定明復審代理人有二人以上者，均具單獨代理權限。\n三、參酌公務人員保障法第三十九條第三項，於第三項定明違反第二項規定而為委任者，各復審代理人仍具單獨代理權限。\n四、復審代理人雖代理復審人為復審行為，惟相關事實，復審人本人仍較熟悉，爰參酌公務人員保障法第三十九條第四項，於第四項定明到場之復審人本人得將該代理人事實上之陳述，即時撤銷或更正，以維復審人權益。\n五、參酌公務人員保障法第三十九條第五項，於第五項定明復審代理權不因復審人死亡、破產、喪失復審能力或法定代理變更等原因受影響。"},{"bill":"202110044700000","text":"復審人或復審代理人經權保會之許可，得於期日偕同輔佐人到場。\n權保會認為必要時，亦得命復審人或復審代理人偕同輔佐人到場。\n前二項輔佐人，權保會認為不適當時，得廢止其許可或禁止其續為輔佐。\n輔佐人到場所為之陳述，復審人或復審代理人不即時撤銷或更正者，視為其所自為。","note":"一、參酌公務人員保障法第四十條第一項，於第一項定明復審人或復審代理人得偕同輔佐人到場。\n二、參酌公務人員保障法第四十條第二項，於第二項定明權保會得命復審人或復審代理人偕同輔佐人到場。\n三、參酌公務人員保障法第四十條第三項，於第三項定明權保會得廢止許可輔佐人到場或禁止其續為輔佐。\n四、參酌公務人員保障法第四十條第四項，於第四項定明輔佐人到場陳述之效果。"}],"changed":true,"final":"復審人或復審代理人經權保會之許可，得於期日偕同輔佐人到場。\n權保會認為必要時，亦得命復審人或復審代理人偕同輔佐人到場。\n前二項輔佐人，權保會認為不適當時，得廢止其許可或禁止其續為輔佐。\n輔佐人到場所為之陳述，復審人或復審代理人不即時撤銷或更正者，視為其所自為。","finalWhy":"一、參酌公務人員保障法第四十條第一項，於第一項定明復審人或復審代理人得偕同輔佐人到場。\n二、參酌公務人員保障法第四十條第二項，於第二項定明權保會得命復審人或復審代理人偕同輔佐人到場。\n三、參酌公務人員保障法第四十條第三項，於第三項定明權保會得廢止許可輔佐人到場或禁止其續為輔佐。\n四、參酌公務人員保障法第四十條第四項，於第四項定明輔佐人到場陳述之效果。","review":null},{"no":"第三十條","current":null,"versions":[{"bill":"201110006770000","text":"復審人因天災、執行軍事勤務或其他不應歸責於己之事由，致遲誤第十五條之復審期間者，於其原因消滅後十日內，得以書面敘明理由向權保會申請回復原狀。但遲誤復審期間已逾一年者，不得為之。\n申請回復原狀，應同時補行期間內應為之復審行為。","note":"一、參酌公務人員保障法第三十一條第一項，於第一項定明復審人如遇天災、執行軍事勤務或其他不可歸責於復審人之事由，致遲誤第十五條之復審期間時，得申請回復原狀，並於但書定明遲誤不變期間已逾一年者，不得再行申請，以免法律關係長久處於不確定狀態。\n二、參酌公務人員保障法第三十一條第二項，於第二項定明申請回復原狀，應同時補行期間內應為之復審行為。"},{"bill":"202110033240000","text":"復審人因天災、執行軍事勤務或其他不應歸責於己之事由，致遲誤第十五條之復審期間者，於其原因消滅後十日內，得以書面敘明理由向權保會申請回復原狀。但遲誤復審期間已逾一年者，不得為之。\n申請回復原狀，應同時補行期間內應為之復審行為。","note":"一、參酌公務人員保障法第三十一條第一項，於第一項定明復審人如遇天災、執行軍事勤務或其他不可歸責於復審人之事由，致遲誤第十五條之復審期間時，得申請回復原狀，並於但書定明遲誤不變期間已逾一年者，不得再行申請，以免法律關係長久處於不確定狀態。\n二、參酌公務人員保障法第三十一條第二項，於第二項定明申請回復原狀，應同時補行期間內應為之復審行為。"},{"bill":"202110036610000","text":"復審人或復審代理人經權保會之許可，得於期日偕同輔佐人到場。\n權保會認為必要時，亦得命復審人或復審代理人偕同輔佐人到場。\n前二項輔佐人，權保會認為不適當時，得廢止其許可或禁止其續為輔佐。\n輔佐人到場所為之陳述，復審人或復審代理人不即時撤銷或更正者，視為其所自為。","note":"一、參酌公務人員保障法第四十條第一項，於第一項定明復審人或復審代理人得偕同輔佐人到場。\n二、參酌公務人員保障法第四十條第二項，於第二項定明權保會得命復審人或復審代理人偕同輔佐人到場。\n三、參酌公務人員保障法第四十條第三項，於第三項定明權保會得廢止許可輔佐人到場或禁止其續為輔佐。\n四、參酌公務人員保障法第四十條第四項，於第四項定明輔佐人到場陳述之效果。"},{"bill":"202110044700000","text":"復審人因天災、執行軍事勤務或其他不應歸責於己之事由，致遲誤第十五條之復審期間者，於其原因消滅後十日內，得以書面敘明理由向權保會申請回復原狀。但遲誤復審期間已逾一年者，不得為之。\n申請回復原狀，應同時補行期間內應為之復審行為。","note":"一、參酌公務人員保障法第三十一條第一項，於第一項定明復審人如遇天災、執行軍事勤務或其他不可歸責於復審人之事由，致遲誤第十五條之復審期間時，得申請回復原狀，並於但書定明遲誤不變期間已逾一年者，不得再行申請，以免法律關係長久處於不確定狀態。\n二、參酌公務人員保障法第三十一條第二項，於第二項定明申請回復原狀，應同時補行期間內應為之復審行為。"}],"changed":true,"final":"復審人因天災、執行軍事勤務或其他不應歸責於己之事由，致遲誤第十五條之復審期間者，於其原因消滅後十日內，得以書面敘明理由向權保會申請回復原狀。但遲誤復審期間已逾一年者，不得為之。\n申請回復原狀，應同時補行期間內應為之復審行為。","finalWhy":"一、參酌公務人員保障法第三十一條第一項，於第一項定明復審人如遇天災、執行軍事勤務或其他不可歸責於復審人之事由，致遲誤第十五條之復審期間時，得申請回復原狀，並於但書定明遲誤不變期間已逾一年者，不得再行申請，以免法律關係長久處於不確定狀態。\n二、參酌公務人員保障法第三十一條第二項，於第二項定明申請回復原狀，應同時補行期間內應為之復審行為。","review":{"note":"照行政院提案通過","text":"依本法進行程序之人員，對違紀行為人有利及不利之情形，應一律注意。"}},{"no":"第三十一條","current":null,"versions":[{"bill":"201110006770000","text":"原處分機關告知之復審期間有錯誤時，應由該機關以通知更正之，並自通知送達之次日起算法定期間。\n原處分機關未告知復審期間，或告知錯誤未通知更正，致受處分人遲誤者，如於處分書送達之次日起一年內提起復審，視為於復審期間內所為。","note":"一、參酌公務人員保障法第二十七條第一項，於第一項定明原處分機關於告知之復審期間有錯誤時，應以通知更正，並自通知送達次日起算法定期間，以保障復審人權益。\n二、參酌公務人員保障法第二十七條第二項，於第二項定明原處分機關未依規定告知復審期間或告知錯誤未通知更正者，如因此導致受處分人遲誤，其自行政處分送達之日起一年內提起救濟，均視為復審期間內所為，以貫徹原處分機關告知義務。"},{"bill":"202110033240000","text":"原處分機關告知之復審期間有錯誤時，應由該機關以通知更正之，並自通知送達之次日起算法定期間。\n原處分機關未告知復審期間，或告知錯誤未通知更正，致受處分人遲誤者，如於處分書送達之次日起一年內提起復審，視為於復審期間內所為。","note":"一、參酌公務人員保障法第二十七條第一項，於第一項定明原處分機關於告知之復審期間有錯誤時，應以通知更正，並自通知送達次日起算法定期間，以保障復審人權益。\n二、參酌公務人員保障法第二十七條第二項，於第二項定明原處分機關未依規定告知復審期間或告知錯誤未通知更正者，如因此導致受處分人遲誤，其自行政處分送達之日起一年內提起救濟，均視為復審期間內所為，以貫徹原處分機關告知義務。"},{"bill":"202110036610000","text":"復審人因天災、執行軍事勤務或其他不應歸責於己之事由，致遲誤第十六條之復審期間者，於其原因消滅後十日內，得以書面敘明理由向權保會申請回復原狀。但遲誤復審期間已逾一年者，不得為之。\n申請回復原狀，應同時補行期間內應為之復審行為。","note":"一、參酌公務人員保障法第三十一條第一項，於第一項定明復審人如遇天災、執行軍事勤務或其他不可歸責於復審人之事由，致遲誤第十六條之復審期間時，得申請回復原狀，並於但書定明遲誤不變期間已逾一年者，不得再行申請，以免法律關係長久處於不確定狀態。\n二、參酌公務人員保障法第三十一條第二項，於第二項定明申請回復原狀，應同時補行期間內應為之復審行為。"},{"bill":"202110044700000","text":"原處分機關告知之復審期間有錯誤時，應由該機關以通知更正之，並自通知送達之次日起算法定期間。\n原處分機關未告知復審期間，或告知錯誤未通知更正，致受處分人遲誤者，如於處分書送達之次日起一年內提起復審，視為於復審期間內所為。","note":"一、參酌公務人員保障法第二十七條第一項，於第一項定明原處分機關於告知之復審期間有錯誤時，應以通知更正，並自通知送達次日起算法定期間，以保障復審人權益。\n二、參酌公務人員保障法第二十七條第二項，於第二項定明原處分機關未依規定告知復審期間或告知錯誤未通知更正者，如因此導致受處分人遲誤，其自行政處分送達之日起一年內提起救濟，均視為復審期間內所為，以貫徹原處分機關告知義務。"}],"changed":true,"final":"原處分機關告知之復審期間有錯誤時，應由該機關以通知更正之，並自通知送達之次日起算法定期間。\n原處分機關未告知復審期間，或告知錯誤未通知更正，致受處分人遲誤者，如於處分書送達之次日起一年內提起復審，視為於復審期間內所為。","finalWhy":"一、參酌公務人員保障法第二十七條第一項，於第一項定明原處分機關於告知之復審期間有錯誤時，應以通知更正，並自通知送達次日起算法定期間，以保障復審人權益。\n二、參酌公務人員保障法第二十七條第二項，於第二項定明原處分機關未依規定告知復審期間或告知錯誤未通知更正者，如因此導致受處分人遲誤，其自行政處分送達之日起一年內提起救濟，均視為復審期間內所為，以貫徹原處分機關告知義務。","review":{"note":"照行政院提案通過","text":"(刪除)"}},{"no":"第三十二條","current":null,"versions":[{"bill":"201110006770000","text":"下列情形，計算法定期間應扣除其在途期間：\n一、復審人向權保會提起復審，且不在權保會所在地住居或服役。\n二、復審人經由原處分機關向權保會提起復審，且不在原處分機關所在地住居或服役。\n三、復審人因第二十條第二項情形，誤向前二款以外之其他機關提起復審，且不在該其他機關所在地住居或服役。\n前項扣除在途期間辦法，由國防部定之。","note":"一、復審人得經由原處分機關向權保會提起復審，亦得逕向權保會提起復審，爰於第一項定明「提起復審之機關」與「復審人住居地或服役地」不同者，得扣除在途期間。\n二、參酌公務人員保障法第三十二條第二項，於第二項授權國防部訂定扣除在途期間之辦法。"},{"bill":"202110033240000","text":"下列情形，計算法定期間應扣除其在途期間：\n一、復審人向權保會提起復審，且不在權保會所在地住居或服役。\n二、復審人經由原處分機關向權保會提起復審，且不在原處分機關所在地住居或服役。\n三、復審人因第二十條第二項情形，誤向前二款以外之其他機關提起復審，且不在該其他機關所在地住居或服役。\n前項扣除在途期間辦法，由國防部定之。","note":"一、復審人得經由原處分機關向權保會提起復審，亦得逕向權保會提起復審，爰於第一項定明「提起復審之機關」與「復審人住居地或服役地」不同者，得扣除在途期間。\n二、參酌公務人員保障法第三十二條第二項，於第二項授權國防部訂定扣除在途期間之辦法。"},{"bill":"202110036610000","text":"原處分機關告知之復審期間有錯誤時，應由該機關以通知更正之，並自通知送達之次日起算法定期間。\n原處分機關未告知復審期間，或告知錯誤未通知更正，致受處分人遲誤者，如於處分書送達之次日起一年內提起復審，視為於復審期間內所為。","note":"一、參酌公務人員保障法第二十七條第一項，於第一項定明原處分機關於告知之復審期間有錯誤時，應以通知更正，並自通知送達次日起算法定期間，以保障復審人權益。\n二、參酌公務人員保障法第二十七條第二項，於第二項定明原處分機關未依規定告知復審期間或告知錯誤未通知更正者，如因此導致受處分人遲誤 一者外，不得拒絕：\n一、復審事件決定擬辦之文稿。\n二、復審事件決定之準備或審議文件。\n三、為第三人之正當權益有保密之必要。\n四、其他依法律或基於國防、軍事或公益，有保密之必要。\n第二項卷內文書之閱覽、抄錄、影印或攝錄，權保會應指定日、時、處所。\n第二項之收費標準，由國防部定之。","note":"一、參酌公務人員保障法第四十一條第一項，於第一項定明復審事件之文書、筆錄等資料，權保會應指派書記官編為卷宗，並依檔案法等規定保存。\n二、參酌公務人員保障法第四十二條第一項，於第二項定明復審人或復審代理人得請求閱覽、抄錄、影印或攝錄卷宗內文書，或預納費用請求付與繕本、影本、節本、重製或複製品，以利參閱。\n三、為避免影響復審程序之正常運作、侵犯他人之隱私或依法應秘密之事項，爰參酌公務人員保障法第四十二條第二項，於第三項定明權保會得拒絕申請或請求之事由，以杜爭議。\n四、參酌訴願法第七十五條第三項，於第四項定明復審人或復審代理人閱覽、抄錄、影印或攝錄復審事件卷內資料之日、時及處所，由權保會指定。\n五、參酌公務人員保障法第四十二條第三項，於第五項授權國防部訂定第二項申請或請求之收費標準。"},{"bill":"202110033240000","text":"復審事件之審議紀錄、筆錄、決定書及其他相關文書、資料，權保會應指派書記官編為卷宗，並依法保存之。\n復審人或復審代理人得向權保會申請閱覽、抄錄、影印或攝錄卷內文書，或預納費用請求付與繕本、影本、節本、重製或複製品。\n權保會對前項申請或請求，除有下列情形之一者外，不得拒絕：\n一、復審事件決定擬辦之文稿。\n二、復審事件決定之準備或審議文件。\n三、為第三人之正當權益有保密之必要。\n四、其他依法律或基於國防、軍事或公益，有保密之必要。\n第二項卷內文書之閱覽、抄錄、影印或攝錄，權保會應指定日、時、處所。\n第二項之收費標準，由國防部定之。","note":"一、參酌公務人員保障法第四十一條第一項，於第一項定明復審事件之文書、筆錄等資料，權保會應指派書記官編為卷宗，並依檔案法等規定保存。\n二、參酌公務人員保障法第四十二條第一項，於第二項定明復審人或復審代理人得請求閱覽、抄錄、影印或攝錄卷宗內文書，或預納費用請求付與繕本、影本、節本、重製或複製品，以利參閱。\n三、為避免影響復審程序之正常運作、侵犯他人之隱私或依法應秘密之事項，爰參酌公務人員保障法第四十二條第二項，於第三項定明權保會得拒絕申請或請求之事由，以杜爭議。\n四、參酌訴願法第七十五條第三項，於第四項定明復審人或復審代理人閱覽、抄錄、影印或攝錄復審事件卷內資料之日、時及處所，由權保會指定。\n五、參酌公務人員保障法第四十二條第三項，於第五項授權國防部訂定第二項申請或請求之收費標準。"},{"bill":"202110036610000","text":"期間之計算，除法律另有規定外，依行政程序法之規定。","note":"行政程序法就有關行政機關為行政行為所涉期間之計算，已有相關規範，爰定明本法有關期間之計算，依行政程序法之規定。"},{"bill":"202110044700000","text":"復審事件之審議紀錄、筆錄、決定書及其他相關文書、資料，權保會應指派書記官編為卷宗，並依法保存之。\n復審人或復審代理人得向權保會申請閱覽、抄錄、影印或攝錄卷內文書，或預納費用請求付與繕本、影本、節本、重製或複製品。\n權保會對前項申請或請求，除有下列情形之一者外，不得拒絕：\n一、復審事件決定擬辦之文稿。\n二、復審事件決定之準備或審議文件。\n三、為第三人之正當權益有保密之必要。\n四、其他依法律或基於國防、軍事或公益，有保密之必要。\n第二項卷內文書之閱覽、抄錄、影印或攝錄，權保會應指定日、時、處所。\n第二項之收費標準，由國防部定之。","note":"一、參酌公務人員保障法第四十一條第一項，於第一項定明復審事件之文書、筆錄等資料，權保會應指派書記官編為卷宗，並依檔案法等規定保存。\n二、參酌公務人員保障法第四十二條第一項，於第二項定明復審人或復審代理人得請求閱覽、抄錄、影印或攝錄卷宗內文書，或預納費用請求付與繕本、影本、節本、重製或複製品，以利參閱。\n三、為避免影響復審程序之正常運作、侵犯他人之隱私或依法應秘密之事項，爰參酌公務人員保障法第四十二條第二項，於第三項定明權保會得拒絕申請或請求之事由，以杜爭議。\n四、參酌訴願法第七十五條第三項，於第四項定明復審人或復審代理人閱覽、抄錄、影印或攝錄復審事件卷內資料之日、時及處所，由權保會指定。\n五、參酌公務人員保障法第四十二條第三項，於第五項授權國防部訂定第二項申請或請求之收費標準。"}],"changed":true,"final":"復審事件之審議紀錄
