提起復審，因其復審已無意義，爰定明權保會亦應為不受理之決定。\n(六)第六款指權保會未就第十三條第二項所定課予義務復審作成決定前，應作為之權責機關如已為行政處分者，權保會應為不受理決定。\n(七)第七款指復審人對於已決定之事件或已依第二十一條規定撤回復審之事件，仍再行提起復審之情形。\n(八)第八款指對非屬第十三條所定復審事件提起復審之情形。\n(九)參酌行政訴訟法第一百零七條第一項第十款有關起訴不備其他要件者，行政法院應以裁定駁回原告之訴之規定，於第九款定明提起復審不備其他法定要件者，權保會應為不受理之決定。\n二、本法之復審為相當於訴願之救濟程序，查最高行政法院一百零一年度二月份庭長法官聯席會議決議雖認以，自程序之保障及訴訟經濟之觀點，所謂「應作為之機關已為行政處分」，係指有利於訴願人之處分而言，至全部或部分拒絕當事人申請之處分，應不包括在內，故於訴願決定作成前，應作為之處分機關已作成之行政處分非全部有利於訴願人時，無須要求訴願人對於該處分重為訴願，訴願機關應續行訴願程序，對嗣後所為之行政處分併為實體審查。惟依第十三條第二項規定提起之復審，應作為之權責機關已為行政處分，復審人如仍對該行政處分不服，因復審之標的及理由與原所提復審均已不相同，倘由同一程序續行審議可能造成處理程序過於複雜，宜以另一復審程序處理較為妥適，且由復審人另提起復審，對其權益實質保障並無影響，為利復審實務運作，爰於第二項定明復審人對第一項第六款之行政處分不服者，應另提起復審救濟之。又為保障復審人權益，使其知悉得就新作成之行政處分另行提起復審，權保會應於不受理決定之理由中教示得另提起復審之意旨，併予敘明。\n三、第一項第八款所定情形，如屬應提申訴而誤提復審者，權保會應移送申訴管轄機關改依申訴程序處理，並通知誤提復審之人，爰參酌公務人員保障法第六十一條第三項，於第三項定明不得逕為不受理決定，以維護其權益。","review":{"note":"照行政院提案通過","text":"調查人員得以書面、言詞或其他適當方法，通知涉有違紀行為之軍人或與事件有關人員到場接受詢問。\n前項通知，應告知下列事項：\n一、詢問之目的。\n二、應到之日、時及處所。\n三、得否委託他人到場。\n四、不到場所生之效果。\n五、實施調查之權責或服役機關。\n六、調查人員之職稱及姓名。\n對非現役軍人之詢問，應以通知書載明前項應告知事項，並由調查機關主管長官簽名後，於到場期日二十四小時前送達。但經受詢問人同意或有急迫情形者，不受於到場期日二十四小時前送達之限制。\n非因自己之違紀行為而接受第一項詢問者，得於詢問完畢後十日內，向調查機關請求日費及旅費。但無正當理由拒絕陳述者，不在此限。\n前項費用之支給項目、基準及其他相關事項之辦法，由國防部定之。"}},{"no":"第四十七條","current":null,"versions":[{"bill":"201110006770000","text":"復審無理由者，權保會應以決定駁回之。\n原行政處分所憑理由雖屬不當，而權保會依其他理由認原行政處分為正當，並經給予復審人表示意見之機會者，得以復審為無理由。\n提起復審因逾法定期間為不受理決定，而原行政處分顯屬違法或顯然不當者，權保會得於決定理由中併予指明之。","note":"一、參酌公務人員保障法第六十三條第一項，於第一項定明權保會審酌事證後，認復審無理由，應以決定駁回之。\n二、參酌公務人員保障法第六十三條第二項，於第二項定明權保會對原行政處分所憑理由雖屬不當，但依其他理由認為正當者，仍得以復審為無理由駁回。惟為避免對復審人造成突襲為不利之決定，仍應先給予復審人表示意見之機會，以資周延。\n三、參酌公務人員保障法第六十四條，於第三項定明提起復審逾期，依法應為不受理之決定。惟對顯屬違法或顯然不當之處分，如任其存在，顯與依法行政原則有違，爰權保會得於決定理由中併予指明，使原處分機關得依職權另依行政程序法或其他相關法律規定處理，以糾正缺失，俾資遵循。"},{"bill":"202110033240000","text":"復審無理由者，權保會應以決定駁回之。\n原行政處分所憑理由雖屬不當，而權保會依其他理由認原行政處分為正當，並經給予復審人表示意見之機會者，得以復審為無理由。\n提起復審因逾法定期間為不受理決定，而原行政處分顯屬違法或顯然不當者，權保會得於決定理由中併予指明之。","note":"一、參酌公務人員保障法第六十三條第一項，於第一項定明權保會審酌事證後，認復審無理由，應以決定駁回之。\n二、參酌公務人員保障法第六十三條第二項，於第二項定明權保會對原行政處分所憑理由雖屬不當，但依其他理由認為正當者，仍得以復審為無理由駁回。惟為避免對復審人造成突襲為不利之決定，仍應先給予復審人表示意見之機會，以資周延。\n三、參酌公務人員保障法第六十四條，於第三項定明提起復審逾期，依法應為不受理之決定。惟對顯屬違法或顯然不當之處分，如任其存在，顯與依法行政原則有違，爰權保會得於決定理由中併予指明，使原處分機關得依職權另依行政程序法或其他相關法律規定處理，以糾正缺失，俾資遵循。"},{"bill":"202110036610000","text":"復審事件有下列各款情形之一者，應為不受理決定：\n一、復審書不合法定程式不能補正或經通知限期補正屆期未補正。\n二、提起復審逾法定期間。\n三、復審人無復審能力而未由法定代理人代為復審行為，經通知限期補正屆期未補正。\n四、復審人不適格。\n五、原行政處分已不存在、已執行而無回復原狀可能且提起復審無實益，或行政處分因其他事由而消滅。\n六、依第十四條第二項提起之復審，應作為之權責機關已為行政處分。\n七、對已決定或已撤回之復審事件重行提起復審。\n八、對不屬復審救濟範圍內之事項，提起復審。\n九、提起復審不備其他法定要件。\n復審人對前項第六款之行政處分不服者，應另提起復審。\n第一項第八款情形，如屬應提起申訴而誤提復審者，權保會應移送申訴管轄機關依申訴程序處理，並通知該誤提復審之人，不得逕為不受理決定。","note":"一、參酌公務人員保障法第六十一條第一項，於第一項定明權保會應為不受理決定之情形：\n(一)第一款指復審書未依第十七條規定載明應記載之事項且無從補正，或未於第二十四條所定通知期間內補正，致復審之提起不合法之情形。\n(二)第二款指復審人未於第十四條第一項或第二項但書所定之法定期間內提起復審等情形。\n(三)第三款指復審之提起違反第二十四條規定，且經通知仍未為補正等情形。\n(四)第四款指復審人對於與自身權益無關之事項提起復審，因欠缺復審權能，故應認復審之提起不合法。\n(五)第五款指原行政處分經撤銷而不存在，以及復審人對「已執行而無回復原狀可能且提起復審無實益」或「因其他事由而消滅」之行政處分提起復審，因其復審已無意義，爰定明權保會亦應為不受理之決定。\n(六)第六款指權保會未就第十三條第二項所定課予義務復審作成決定前，應作為之權責機關如已為行政處分者，權保會應為不受理決定。\n(七)第七款指復審人對於已決定之事件或已依第二十二條規定撤回復審之事件，仍再行提起復審之情形。\n(八)第八款指對非屬第十四條所定復審事件提起復審之情形。\n(九)參酌行政訴訟法第一百零七條第一項第十款有關起訴不備其他要件者，行政法院應以裁定駁回原告之訴之規定，於第九款定明提起復審不備其他法定要件者，權保會應為不受理之決定。\n二、本法之復審為相當於訴願之救濟程序，查最高行政法院一百零一年度二月份庭長法官聯席會議決議雖認以，自程序之保障及訴訟經濟之觀點，所謂「應作為之機關已為行政處分」，係指有利於訴願人之處分而言，至全部或部分拒絕當事人申請之處分，應不包括在內，故於訴願決定作成前，應作為之處分機關已作成之行政處分非全部有利於訴願人時，無須要求訴願人對於該處分重為訴願，訴願機關應續行訴願程序，對嗣後所為之行政處分併為實體審查。惟依第十四條第二項規定提起之復審，應作為之權責機關已為行政處分，復審人如仍對該行政處分不服，因復審之標的及理由與原所提復審均已不相同，倘由同一程序續行審議可能造成處理程序過於複雜，宜以另一復審程序處理較為妥適，且由復審人另提起復審，對其權益實質保障並無影響，為利復審實務運作，爰於第二項定明復審人對第一項第六款之行政處分不服者，應另提起復審救濟之。又為保障復審人權益，使其知悉得就新作成之行政處分另行提起復審，權保會應於不受理決定之理由中教示得另提起復審之意旨，併予敘明。\n三、第一項第八款所定情形，如屬應提申訴而誤提復審者，權保會應移送申訴管轄機關改依申訴程序處理，並通知誤提復審之人，爰參酌公務人員保障法第六十一條第三項，於第三項定明不得逕為不受理決定，以維護其權益。"},{"bill":"202110044700000","text":"復審無理由者，權保會應以決定駁回之。\n原行政處分所憑理由雖屬不當，而權保會依其他理由認原行政處分為正當，並經給予復審人表示意見之機會者，得以復審為無理由。\n提起復審因逾法定期間為不受理決定，而原行政處分顯屬違法或顯然不當者，權保會得於決定理由中併予指明之。","note":"一、參酌公務人員保障法第六十三條第一項，於第一項定明權保會審酌事證後，認復審無理由，應以決定駁回之。\n二、參酌公務人員保障法第六十三條第二項，於第二項定明權保會對原行政處分所憑理由雖屬不當，但依其他理由認為正當者，仍得以復審為無理由駁回。惟為避免對復審人造成突襲為不利之決定，仍應先給予復審人表示意見之機會，以資周延。\n三、參酌公務人員保障法第六十四條，於第三項定明提起復審逾期，依法應為不受理之決定。惟對顯屬違法或顯然不當之處分，如任其存在，顯與依法行政原則有違，爰權保會得於決定理由中併予指明，使原處分機關得依職權另依行政程序法或其他相關法律規定處理，以糾正缺失，俾資遵循。"}],"changed":true,"final":"復審無理由者，權保會應以決定駁回之。\n原行政處分所憑理由雖屬不當，而權保會依其他理由認原行政處分為正當，並經給予復審人表示意見之機會者，得以復審為無理由。\n提起復審因逾法定期間為不受理決定，而原行政處分顯屬違法或顯然不當者，權保會得於決定理由中併予指明之。","finalWhy":"一、參酌公務人員保障法第六十三條第一項，於第一項定明權保會審酌事證後，認復審無理由，應以決定駁回之。\n二、參酌公務人員保障法第六十三條第二項，於第二項定明權保會對原行政處分所憑理由雖屬不當，但依其他理由認為正當者，仍得以復審為無理由駁回。惟為避免對復審人造成突襲為不利之決定，仍應先給予復審人表示意見之機會，以資周延。\n三、參酌公務人員保障法第六十四條，於第三項定明提起復審逾期，依法應為不受理之決定。惟對顯屬違法或顯然不當之處分，如任其存在，顯與依法行政原則有違，爰權保會得於決定理由中併予指明，使原處分機關得依職權另依行政程序法或其他相關法律規定處理，以糾正缺失，俾資遵循。","review":{"note":"照行政院提案通過","text":"調查人員詢問涉有違紀行為之軍人時，應告知所涉違紀行為及違反之法令，並給予陳述意見之機會；如有陳述，應令就其始末連續陳述；其陳述有利之事實者，應令其指出證明之方法。\n調查人員認前項軍人涉有其他違紀行為或犯罪嫌疑時，應即時告知。"}},{"no":"第四十八條","current":null,"versions":[{"bill":"201110006770000","text":"依第十三條第一項規定提起之復審有理由者，權保會應以決定撤銷原行政處分之全部或一部。","note":"一、第十三條第一項規定為撤銷復審之類型，爰參酌公務人員保障法第六十五條第一項本文，定明權保會審酌事證後，認復審有理由時，應以決定撤銷原行政處分之全部或一部。\n二、另訴願法係上級機關依行政一體原則，對下級機關予以行政上之督導，故除得撤銷原處分外，亦得自為處分。惟權保會因非原處分機關之上級單位，且本法適用機關包含與國防部無隸屬關係之軍文併用機關，基於尊重各權責機關間之人事、內部管理之權限，本法爰未參照訴願法有關訴願機關得逕為變更之決定，併予敘明。"},{"bill":"202110033240000","text":"依第十三條第一項規定提起之復審有理由者，權保會應以決定撤銷原行政處分之全部或一部。","note":"一、第十三條第一項規定為撤銷復審之類型，爰參酌公務人員保障法第六十五條第一項本文，定明權保會審酌事證後，認復審有理由時，應以決定撤銷原行政處分之全部或一部。\n二、另訴願法係上級機關依行政一體原則，對下級機關予以行政上之督導，故除得撤銷原處分外，亦得自為處分。惟權保會因非原處分機關之上級單位，且本法適用機關包含與國防部無隸屬關係之軍文併用機關，基於尊重各權責機關間之人事、內部管理之權限，本法爰未參照訴願法有關訴願機關得逕為變更之決定，併予敘明。"},{"bill":"202110036610000","text":"復審無理由者，權保會應以決定駁回之。\n原行政處分所憑理由雖屬不當，而權保會依其他理由認原行政處分為正當，並經給予復審人表示意見之機會者，得以復審為無理由。\n提起復審因逾法定期間為不受理決定，而原行政處分顯屬違法或顯然不當者，權保會得於決定理由中併予指明之。","note":"一、參酌公務人員保障法第六十三條第一項，於第一項定明權保會審酌事證後，認復審無理由，應以決定駁回之。\n二、參酌公務人員保障法第六十三條第二項，於第二項定明權保會對原行政處分所憑理由雖屬不當，但依其他理由認為正當者，仍得以復審為無理由駁回。惟為避免對復審人造成突襲為不利之決定，仍應先給予復審人表示意見之機會，以資周延。\n三、參酌公務人員保障法第六十四條，於第三項定明提起復審逾期，依法應為不受理之決定。惟對顯屬違法或顯然不當之處分，如任其存在，顯與依法行政原則有違，爰權保會得於決定理由中併予指明，使原處分機關得依職權另依行政程序法或其他相關法律規定處理，以糾正缺失，俾資遵循。"},{"bill":"202110044700000","text":"依第十三條第一項規定提起之復審有理由者，權保會應以決定撤銷原行政處分之全部或一部。","note":"一、第十三條第一項規定為撤銷復審之類型，爰參酌公務人員保障法第六十五條第一項本文，定明權保會審酌事證後，認復審有理由時，應以決定撤銷原行政處分之全部或一部。\n二、另訴願法係上級機關依行政一體原則，對下級機關予以行政上之督導，故除得撤銷原處分外，亦得自為處分。惟權保會因非原處分機關之上級單位，且本法適用機關包含與國防部無隸屬關係之軍文併用機關，基於尊重各權責機關間之人事、內部管理之權限，本法爰未參照訴願法有關訴願機關得逕為變更之決定，併予敘明。"}],"changed":true,"final":"依第十三條第一項規定提起之復審有理由者，權保會應以決定撤銷原行政處分之全部或一部。","finalWhy":"一、第十三條第一項規定為撤銷復審之類型，爰參酌公務人員保障法第六十五條第一項本文，定明權保會審酌事證後，認復審有理由時，應以決定撤銷原行政處分之全部或一部。\n二、另訴願法係上級機關依行政一體原則，對下級機關予以行政上之督導，故除得撤銷原處分外，亦得自為處分。惟權保會因非原處分機關之上級單位，且本法適用機關包含與國防部無隸屬關係之軍文併用機關，基於尊重各權責機關間之人事、內部管理之權限，本法爰未參照訴願法有關訴願機關得逕為變更之決定，併予敘明。","review":{"note":"照行政院提案通過","text":"受詢問人得保持緘默，無須違背自己之意思而為陳述，並得委任律師為其代理人及請求調查有利之證據。\n未委任律師之受詢問人表示將委任時，應即停止詢問。但經受詢問人主動請求立即詢問，或等候律師逾四小時未到場者，得逕行詢問。"}},{"no":"第四十九條","current":null,"versions":[{"bill":"201110006770000","text":"依第十三條第二項規定，對權責機關之不作為提起之復審有理由者，權保會應以決定指定相當期間，命應為行政處分之權責機關速為一定之行政處分。\n依第十三條第二項規定對駁回之行政處分提起之復審有理由者，權保會應以決定撤銷原駁回行政處分之全部或一部，並發回原處分機關，命其於指定之期間內另為處分。","note":"一、參酌公務人員保障法第六十六條第一項，於第一項定明復審人依第十三條第二項規定提起「不作為復審」有理由時，權保會應限期該權責機關速為一定處分。\n二、第二項定明復審人依第十三條第二項規定提起「反否准復審」有理由時，權保會除撤銷原駁回行政處分之一部或全部外，並發回原處分機關，命其於指定期間內另為處分。"},{"bill":"202110033240000","text":"依第十三條第二項規定，對權責機關之不作為提起之復審有理由者，權保會應以決定指定相當期間，命應為行政處分之權責機關速為一定之行政處分。\n依第十三條第二項規定對駁回之行政處分提起之復審有理由者，權保會應以決定撤銷原駁回行政處分之全部或一部，並發回原處分機關，命其於指定之期間內另為處分。","note":"一、參酌公務人員保障法第六十六條第一項，於第一項定明復審人依第十三條第二項規定提起「不作為復審」有理由時，權保會應限期該權責機關速為一定處分。\n二、第二項定明復審人依第十三條第二項規定提起「反否准復審」有理由時，權保會除撤銷原駁回行政處分之一部或全部外，並發回原處分機關，命其於指定期間內另為處分。"},{"bill":"202110036610000","text":"依第十四條第一項規定提起之復審有理由者，權保會應以決定撤銷原行政處分之全部或一部。","note":"一、第十四條第一項規定為撤銷復審之類型，爰參酌公務人員保障法第六十五條第一項本文，定明權保會審酌事證後，認復審有理由時，應以決定撤銷原行政處分之全部或一部。\n二、另訴願法係上級機關依行政一體原則，對下級機關予以行政上之督導，故除得撤銷原處分外，亦得自為處分。惟權保會因非原處分機關之上級單位，且本法適用機關包含與國防部無隸屬關係之軍文併用機關，基於尊重各權責機關間之人事、內部管理之權限，本法爰未參照訴願法有關訴願機關得逕為變更之決定，併予敘明。"},{"bill":"202110044700000","text":"依第十三條第二項規定，對權責機關之不作為提起之復審有理由者，權保會應以決定指定相當期間，命應為行政處分之權責機關速為一定之行政處分。\n依第十三條第二項規定對駁回之行政處分提起之復審有理由者，權保會應以決定撤銷原駁回行政處分之全部或一部，並發回原處分機關，命其於指定之期間內另為處分。","note":"一、參酌公務人員保障法第六十六條第一項，於第一項定明復審人依第十三條第二項規定提起「不作為復審」有理由時，權保會應限期該權責機關速為一定處分。\n二、第二項定明復審人依第十三條第二項規定提起「反否准復審」有理由時，權保會除撤銷原駁回行政處分之一部或全部外，並發回原處分機關，命其於指定期間內另為處分。"}],"changed":true,"final":"依第十三條第二項規定，對權責機關之不作為提起之復審有理由者，權保會應以決定指定相當期間，命應為行政處分之權責機關速為一定之行政處分。\n依第十三條第二項規定對駁回之行政處分提起之復審有理由者，權保會應以決定撤銷原駁回行政處分之全部或一部，並發回原處分機關，命其於指定之期間內另為處分。","finalWhy":"一、參酌公務人員保障法第六十六條第一項，於第一項定明復審人依第十三條第二項規定提起「不作為復審」有理由時，權保會應限期該權責機關速為一定處分。\n二、第二項定明復審人依第十三條第二項規定提起「反否准復審」有理由時，權保會除撤銷原駁回行政處分之一部或全部外，並發回原處分機關，命其於指定期間內另為處分。","review":{"note":"照行政院提案通過","text":"詢問不得以強暴、脅迫、利誘、詐欺、疲勞詢問或其他不正方法為之。\n詢問，非經受詢問人同意，不得於夜間行之。\n前項所稱夜間，指午後十時至翌日午前八時。"}},{"no":"第五十條","current":null,"versions":[{"bill":"201110006770000","text":"權保會發現原行政處分雖屬違法或顯然不當，但其撤銷或變更於公益有重大損害，經斟酌復審人所受損害、賠償程度、防止方法及其他一切情事，認原行政處分之撤銷或變更顯與公益相違背時，得駁回其復審。\n前項情形，應於決定主文中載明原行政處分違法或顯然不當。","note":"一、原行政處分縱屬違法或顯然不當，如其撤銷或變更於公益顯有重大損害，則仍應予維持，爰參考情況判決制度之精神，並參酌公務人員保障法第六十七條第一項，於第一項定明得駁回復審，以平衡公、私益。\n二、為促進行政權之合法行使，爰參酌公務人員保障法第六十七條第二項，於第二項定明應於決定主文中載明原行政處分違法或顯然不當。"},{"bill":"202110033240000","text":"權保會發現原行政處分雖屬違法或顯然不當，但其撤銷或變更於公益有重大損害，經斟酌復審人所受損害、賠償程度、防止方法及其他一切情事，認原行政處分之撤銷或變更顯與公益相違背時，得駁回其復審。\n前項情形，應於決定主文中載明原行政處分違法或顯然不當。","note":"一、原行政處分縱屬違法或顯然不當，如其撤銷或變更於公益顯有重大損害，則仍應予維持，爰參考情況判決制度之精神，並參酌公務人員保障法第六十七條第一項，於第一項定明得駁回復審，以平衡公、私益。\n二、為促進行政權之合法行使，爰參酌公務人員保障法第六十七條第二項，於第二項定明應於決定主文中載明原行政處分違法或顯然不當。"},{"bill":"202110036610000","text":"依第十四條第二項規定，對權責機關之不作為提起之復審有理由者，權保會應以決定指定相當期間，命應為行政處分之權責機關速為一定之行政處分。\n依第十四條第二項規定對駁回之行政處分提起之復審有理由者，權保會應以決定撤銷原駁回行政處分之全部或一部，並發回原處分機關，命其於指定之期間內另為處分。","note":"一、參酌公務人員保障法第六十六條第一項，於第一項定明復審人依第十四條第二項規定提起「不作為復審」有理由時，權保會應限期該權責機關速為一定處分。\n二、第二項定明復審人依第十四條第二項規定提起「反否准復審」有理由時，權保會除撤銷原駁回行政處分之一部或全部外，並發回原處分機關，命其於指定期間內另為處分。"},{"bill":"202110044700000","text":"權保會發現原行政處分雖屬違法或顯然不當，但其撤銷或變更於公益有重大損害，經斟酌復審人所受損害、賠償程度、防止方法及其他一切情事，認原行政處分之撤銷或變更顯與公益相違背時，得駁回其復審。\n前項情形，應於決定主文中載明原行政處分違法或顯然不當。","note":"一、原行政處分縱屬違法或顯然不當，如其撤銷或變更於公益顯有重大損害，則仍應予維持，爰參考情況判決制度之精神，並參酌公務人員保障法第六十七條第一項，於第一項定明得駁回復審，以平衡公、私益。\n二、為促進行政權之合法行使，爰參酌公務人員保障法第六十七條第二項，於第二項定明應於決定主文中載明原行政處分違法或顯然不當。"}],"changed":true,"final":"權保會發現原行政處分雖屬違法或顯然不當，但其撤銷或變更於公益有重大損害，經斟酌復審人所受損害、賠償程度、防止方法及其他一切情事，認原行政處分之撤銷或變更顯與公益相違背時，得駁回其復審。\n前項情形，應於決定主文中載明原行政處分違法或顯然不當。","finalWhy":"一、原行政處分縱屬違法或顯然不當，如其撤銷或變更於公益顯有重大損害，則仍應予維持，爰參考情況判決制度之精神，並參酌公務人員保障法第六十七條第一項，於第一項定明得駁回復審，以平衡公、私益。\n二、為促進行政權之合法行使，爰參酌公務人員保障法第六十七條第二項，於第二項定明應於決定主文中載明原行政處分違法或顯然不當。","review":{"note":"照行政院提案通過","text":"詢問應作成紀錄，向受詢問人朗讀或令其閱覽，並全程連續錄音；必要時，應全程連續錄影。但有急迫情況且經記明紀錄者，不在此限。\n受詢問人為聽覺、聲音、語言功能障礙或語言不通者，應由通譯傳譯之；必要時，並得以文字詢問或令以文字陳述。"}},{"no":"第五十一條","current":null,"versions":[{"bill":"201110006770000","text":"權保會為前條決定時，得斟酌復審人因違法或顯然不當行政處分所受損害，於決定理由中載明由原處分機關與復審人進行賠償協議。\n前項協議，與國家賠償法之協議有同一之效力。","note":"一、權保會依第五十條規定為決定時，復審人因此所受損害，允宜由原處分機關與復審人進行賠償協議，爰參酌公務人員保障法第六十八條第一項，為第一項規定。\n二、參酌公務人員保障法第六十八條第二項，於第二項定明第一項之協議與國家賠償法協議有同一效力。"},{"bill":"202110033240000","text":"權保會為前條決定時，得斟酌復審人因違法或顯然不當行政處分所受損害，於決定理由中載明由原處分機關與復審人進行賠償協議。\n前項協議，與國家賠償法之協議有同一之效力。","note":"一、權保會依第五十條規定為決定時，復審人因此所受損害，允宜由原處分機關與復審人進行賠償協議，爰參酌公務人員保障法第六十八條第一項，為第一項規定。\n二、參酌公務人員保障法第六十八條第二項，於第二項定明第一項之協議與國家賠償法協議有同一效力。"},{"bill":"202110036610000","text":"權保會發現原行政處分雖屬違法或顯然不當，但其撤銷或變更於公益有重大損害，經斟酌復審人所受損害、賠償程度、防止方法及其他一切情事，認原行政處分之撤銷或變更顯與公益相違背時，得駁回其復審。\n前項情形，應於決定主文中載明原行政處分違法或顯然不當。","note":"一、原行政處分縱屬違法或顯然不當，如其撤銷或變更於公益顯有重大損害，則仍應予維持，爰參考情況判決制度之精神，並參酌公務人員保障法第六十七條第一項，於第一項定明得駁回復審，以平衡公、私益。\n二、為促進行政權之合法行使，爰參酌公務人員保障法第六十七條第二項，於第二項定明應於決定主文中載明原行政處分違法或顯然不當。"},{"bill":"202110044700000","text":"權保會為前條決定時，得斟酌復審人因違法或顯然不當行政處分所受損害，於決定理由中載明由原處分機關與復審人進行賠償協議。\n前項協議，與國家賠償法之協議有同一之效力。","note":"一、權保會依第五十條規定為決定時，復審人因此所受損害，允宜由原處分機關與復審人進行賠償協議，爰參酌公務人員保障法第六十八條第一項，為第一項規定。\n二、參酌公務人員保障法第六十八條第二項，於第二項定明第一項之協議與國家賠償法協議有同一效力。"}],"changed":true,"final":"權保會為前條決定時，得斟酌復審人因違法或顯然不當行政處分所受損害，於決定理由中載明由原處分機關與復審人進行賠償協議。\n前項協議，與國家賠償法之協議有同一之效力。","finalWhy":"一、權保會依第五十條規定為決定時，復審人因此所受損害，允宜由原處分機關與復審人進行賠償協議，爰參酌公務人員保障法第六十八條第一項，為第一項規定。\n二、參酌公務人員保障法第六十八條第二項，於第二項定明第一項之協議與國家賠償法協議有同一效力。","review":{"note":"照行政院提案通過","text":"調查人員基於調查事實及證據之必要，得向人民或團體請求提供與案情有關之文書、資料或其他物件。"}},{"no":"第五十二條","current":null,"versions":[{"bill":"201110006770000","text":"復審決定，應於權保會收受原處分機關檢卷答辯之次日起三個月內為之。依第二十三條規定通知補正者，自補正之次日起算；未為補正者，自補正期間屆滿之次日起算。\n復審人於復審決定期間內續補具理由者，復審決定期間自權保會收受最後補具理由之次日起算。\n復審事件不能於前二項期間內決定者，得予延長，並通知復審人。延長以一次為限，最長不得逾二個月。\n復審人於延長決定期間後再補具理由者，復審決定期間自權保會收受補具理由之次日起算，不得逾二個月。","note":"一、參酌公務人員保障法第六十九條第一項，於第一項定明復審決定期間以於收受原處分機關檢卷答辯之次日起三個月內為之，以及補正或未補正時，該期間之起算日基準。\n二、第二項定明復審決定期間，復審人續補具理由時，該三個月之起算日基準。\n三、參酌公務人員保障法第六十九條第二項，於第三項定明不能於法定期間內為復審決定時之處理。\n四、第四項定明復審人於延長決定期間再補具理由之處理。"},{"bill":"202110033240000","text":"復審決定，應於權保會收受原處分機關檢卷答辯之次日起三個月內為之。依第二十三條規定通知補正者，自補正之次日起算；未為補正者，自補正期間屆滿之次日起算。\n復審人於復審決定期間內續補具理由者，復審決定期間自權保會收受最後補具理由之次日起算。\n復審事件不能於前二項期間內決定者，得予延長，並通知復審人。延長以一次為限，最長不得逾二個月。\n復審人於延長決定期間後再補具理由者，復審決定期間自權保會收受補具理由之次日起算，不得逾二個月。","note":"一、參酌公務人員保障法第六十九條第一項，於第一項定明復審決定期間以於收受原處分機關檢卷答辯之次日起三個月內為之，以及補正或未補正時，該期間之起算日基準。\n二、第二項定明復審決定期間，復審人續補具理由時，該三個月之起算日基準。\n三、參酌公務人員保障法第六十九條第二項，於第三項定明不能於法定期間內為復審決定時之處理。\n四、第四項定明復審人於延長決定期間再補具理由之處理。"},{"bill":"202110036610000","text":"權保會為前條決定時，得斟酌復審人因違法或顯然不當行政處分所受損害，於決定理由中載明由原處分機關與復審人進行賠償協議。\n前項協議，與國家賠償法之協議有同一之效力。","note":"一、權保會依第五十一條規定為決定時，復審人因此所受損害，允宜由原處分機關與復審人進行賠償協議，爰參酌公務人員保障法第六十八條第一項，為第一項規定。\n二、參酌公務人員保障法第六十八條第二項，於第二項定明第一項之協議與國家賠償法協議有同一效力。"},{"bill":"202110044700000","text":"復審決定，應於權保會收受原處分機關檢卷答辯之次日起三個月內為之。依第二十三條規定通知補正者，自補正之次日起算；未為補正者，自補正期間屆滿之次日起算。\n復審人於復審決定期間內續補具理由者，復審決定期間自權保會收受最後補具理由之次日起算。\n復審事件不能於前二項期間內決定者，得予延長，並通知復審人。延長以一次為限，最長不得逾二個月。\n復審人於延長決定期間後再補具理由者，復審決定期間自權保會收受補具理由之次日起算，不得逾二個月。","note":"一、參酌公務人員保障法第六十九條第一項，於第一項定明復審決定期間以於收受原處分機關檢卷答辯之次日起三個月內為之，以及補正或未補正時，該期間之起算日基準。\n二、第二項定明復審決定期間，復審人續補具理由時，該三個月之起算日基準。\n三、參酌公務人員保障法第六十九條第二項，於第三項定明不能於法定期間內為復審決定時之處理。\n四、第四項定明復審人於延長決定期間再補具理由之處理。"}],"changed":true,"final":"復審決定，應於權保會收受原處分機關檢卷答辯之次日起三個月內為之。依第二十三條規定通知補正者，自補正之次日起算；未為補正者，自補正期間屆滿之次日起算。\n復審人於復審決定期間內續補具理由者，復審決定期間自權保會收受最後補具理由之次日起算。\n復審事件不能於前二項期間內決定者，得予延長，並通知復審人。延長以一次為限，最長不得逾二個月。\n復審人於延長決定期間後再補具理由者，復審決定期間自權保會收受補具理由之次日起算，不得逾二個月。","finalWhy":"一、參酌公務人員保障法第六十九條第一項，於第一項定明復審決定期間以於收受原處分機關檢卷答辯之次日起三個月內為之，以及補正或未補正時，該期間之起算日基準。\n二、第二項定明復審決定期間，復審人續補具理由時，該三個月之起算日基準。\n三、參酌公務人員保障法第六十九條第二項，於第三項定明不能於法定期間內為復審決定時之處理。\n四、第四項定明復審人於延長決定期間再補具理由之處理。","review":{"note":"照行政院提案通過","text":"調查人員得依職權或被調查人之請求，將有關文書、資料或其他物件送請專業機關（構）、法人、團體或具有專門知識經驗者鑑定，或送請業務主管機關提出意見。\n以書面為鑑定者，必要時，得通知鑑定人到場說明。"}},{"no":"第五十三條","current":null,"versions":[{"bill":"201110006770000","text":"復審人死亡者，復審程序於得承受復審之人承受復審前，當然停止。\n復審之決定以他法律關係是否成立為準據，而該法律關係在訴訟或其他救濟程序進行中者，於該法律關係確定前，權保會得停止復審程序之進行，並即通知復審人。\n依前二項規定停止復審程序之進行者，前條所定復審決定期間，自得承受復審之人承受復審或續行復審程序之日起，重行起算。","note":"一、參酌民事訴訟法第一百六十八條，於第一項定明復審人於復審程序進行中死亡者，該程序於復審人之繼承人或得依第二十二條第一項承受復審之人承受復審前，當然停止。\n二、復審決定如係以他法律關係是否成立為準據者，於該法律關係爭訟尚未確定前，為免復審決定與他機關認定兩歧，爰參酌公務人員保障法第七十條第一項，於第二項定明權保會得先予停止復審程序。\n三、參酌公務人員保障法第七十條第二項，於第三項定明有第一項或第二項停止復審程序之情形者，第五十二條之復審決定期間，自得承受復審者承受復審之日或權保會續行復審程序之日起，重行起算。"},{"bill":"202110033240000","text":"復審人死亡者，復審程序於得承受復審之人承受復審前，當然停止。\n復審之決定以他法律關係是否成立為準據，而該法律關係在訴訟或其他救濟程序進行中者，於該法律關係確定前，權保會得停止復審程序之進行，並即通知復審人。\n依前二項規定停止復審程序之進行者，前條所定復審決定期間，自得承受復審之人承受復審或續行復審程序之日起，重行起算。","note":"一、參酌民事訴訟法第一百六十八條，於第一項定明復審人於復審程序進行中死亡者，該程序於復審人之繼承人或得依第二十二條第一項承受復審之人承受復審前，當然停止。\n二、復審決定如係以他法律關係是否成立為準據者，於該法律關係爭訟尚未確定前，為免復審決定與他機關認定兩歧，爰參酌公務人員保障法第七十條第一項，於第二項定明權保會得先予停止復審程序。\n三、參酌公務人員保障法第七十條第二項，於第三項定明有第一項或第二項停止復審程序之情形者，第五十二條之復審決定期間，自得承受復審者承受復審之日或權保會續行復審程序之日起，重行起算。"},{"bill":"202110036610000","text":"復審決定，應於權保會收受原處分機關檢卷答辯之次日起三個月內為之。依第二十四條規定通知補正者，自補正之次日起算；未為補正者，自補正期間屆滿之次日起算。\n復審人於復審決定期間內續補具理由者，復審決定期間自權保會收受最後補具理由之次日起算。\n復審事件不能於前二項期間內決定者，得予延長，並通知復審人。延長以一次為限，最長不得逾二個月。\n復審人於延長決定期間後再補具理由者，復審決定期間自權保會收受補具理由之次日起算，不得逾二個月。","note":"一、參酌公務人員保障法第六十九條第一項，於第一項定明復審決定期間以於收受原處分機關檢卷答辯之次日起三個月內為之，以及補正或未補正時，該期間之起算日基準。\n二、第二項定明復審決定期間，復審人續補具理由時，該三個月之起算日基準。\n三、參酌公務人員保障法第六十九條第二項，於第三項定明不能於法定期間內為復審決定時之處理。\n四、第四項定明復審人於延長決定期間再補具理由之處理。"},{"bill":"202110044700000","text":"復審人死亡者，復審程序於得承受復審之人承受復審前，當然停止。\n復審之決定以他法律關係是否成立為準據，而該法律關係在訴訟或其他救濟程序進行中者，於該法律關係確定前，權保會得停止復審程序之進行，並即通知復審人。\n依前二項規定停止復審程序之進行者，前條所定復審決定期間，自得承受復審之人承受復審或續行復審程序之日起，重行起算。","note":"一、參酌民事訴訟法第一百六十八條，於第一項定明復審人於復審程序進行中死亡者，該程序於復審人之繼承人或得依第二十二條第一項承受復審之人承受復審前，當然停止。\n二、復審決定如係以他法律關係是否成立為準據者，於該法律關係爭訟尚未確定前，為免復審決定與他機關認定兩歧，爰參酌公務人員保障法第七十條第一項，於第二項定明權保會得先予停止復審程序。\n三、參酌公務人員保障法第七十條第二項，於第三項定明有第一項或第二項停止復審程序之情形者，第五十二條之復審決定期間，自得承受復審者承受復審之日或權保會續行復審程序之日起，重行起算。"}],"changed":true,"final":"復審人死亡者，復審程序於得承受復審之人承受復審前，當然停止。\n復審之決定以他法律關係是否成立為準據，而該法律關係在訴訟或其他救濟程序進行中者，於該法律關係確定前，權保會得停止復審程序之進行，並即通知復審人。\n依前二項規定停止復審程序之進行者，前條所定復審決定期間，自得承受復審之人承受復審或續行復審程序之日起，重行起算。","finalWhy":"一、參酌民事訴訟法第一百六十八條，於第一項定明復審人於復審程序進行中死亡者，該程序於復審人之繼承人或得依第二十二條第一項承受復審之人承受復審前，當然停止。\n二、復審決定如係以他法律關係是否成立為準據者，於該法律關係爭訟尚未確定前，為免復審決定與他機關認定兩歧，爰參酌公務人員保障法第七十條第一項，於第二項定明權保會得先予停止復審程序。\n三、參酌公務人員保障法第七十條第二項，於第三項定明有第一項或第二項停止復審程序之情形者，第五十二條之復審決定期間，自得承受復審者承受復審之日或權保會續行復審程序之日起，重行起算。","review":{"note":"照行政院提案通過","text":"調查人員為瞭解違紀事實真相，得就必要之物件或處所實施勘驗。\n實施勘驗應通知涉有違紀行為之軍人及有關人員到場。但不能通知者，不在此限。\n勘驗應製作勘驗紀錄，並得錄音及錄影；必要時，應全程錄影。"}},{"no":"第五十四條","current":null,"versions":[{"bill":"201110006770000","text":"復審決定書，應載明下列事項：\n一、復審人姓名、服役單位、職階或職業、住居所或服役單位之駐地。\n二、有法定代理人或復審代理人者，其姓名、職業、住居所或事務所。\n三、主文、事實及理由；其係不受理決定者，得不記載事實。\n四、參與決定之權保委員姓名。\n五、年、月、日。\n復審決定書之正本，應於決定後十五日內送達復審人及原處分機關。","note":"一、參酌公務人員保障法第七十一條第一項，於第一項定明復審決定書應記載事項。\n二、參酌公務人員保障法第七十一條第二項，於第二項定明決定書正本應送達復審人及原處分機關之期限。"},{"bill":"202110033240000","text":"復審決定書，應載明下列事項：\n一、復審人姓名、服役單位、職階或職業、住居所或服役單位之駐地。\n二、有法定代理人或復審代理人者，其姓名、職業、住居所或事務所。\n三、主文、事實及理由；其係不受理決定者，得不記載事實。\n四、參與決定之權保委員姓名。\n五、年、月、日。\n復審決定書之正本，應於決定後十五日內送達復審人及原處分機關。","note":"一、參酌公務人員保障法第七十一條第一項，於第一項定明復審決定書應記載事項。\n二、參酌公務人員保障法第七十一條第二項，於第二項定明決定書正本應送達復審人及原處分機關之期限。"},{"bill":"202110036610000","text":"復審人死亡者，復審程序於得承受復審之人承受復審前，當然停止。\n復審之決定以他法律關係是否成立為準據，而該法律關係在訴訟或其他救濟程序進行中者，於該法律關係確定前，權保會得停止復審程序之進行，並即通知復審人。\n依前二項規定停止復審程序之進行者，前條所定復審決定期間，自得承受復審之人承受復審或續行復審程序之日起，重行起算。","note":"一、參酌民事訴訟法第一百六十八條，於第一項定明復審人於復審程序進行中死亡者，該程序於復審人之繼承人或得依第二十二條第一項承受復審之人承受復審前，當然停止。\n二、復審決定如係以他法律關係是否成立為準據者，於該法律關係爭訟尚未確定前，為免復審決定與他機關認定兩歧，爰參酌公務人員保障法第七十條第一項，於第二項定明權保會得先予停止復審程序。\n三、參酌公務人員保障法第七十條第二項，於第三項定明有第一項或第二項停止復審程序之情形者，第五十二條之復審決定期間，自得承受復審者承受復審之日或權保會續行復審程序之日起，重行起算。"},{"bill":"202110044700000","text":"復審決定書，應載明下列事項：\n一、復審人姓名、服役單位、職階或職業、住居所或服役單位之駐地。\n二、有法定代理人或復審代理人者，其姓名、職業、住居所或事務所。\n三、主文、事實及理由；其係不受理決定者，得不記載事實。\n四、參與決定之權保委員姓名。\n五、年、月、日。\n復審決定書之正本，應於決定後十五日內送達復審人及原處分機關。","note":"一、參酌公務人員保障法第七十一條第一項，於第一項定明復審決定書應記載事項。\n二、參酌公務人員保障法第七十一條第二項，於第二項定明決定書正本應送達復審人及原處分機關之期限。"}],"changed":true,"final":"復審決定書，應載明下列事項：\n一、復審人姓名、服役單位、職階或職業、住居所或服役單位之駐地。\n二、有法定代理人或復審代理人者，其姓名、職業、住居所或事務所。\n三、主文、事實及理由；其係不受理決定者，得不記載事實。\n四、參與決定之權保委員姓名。\n五、年、月、日。\n復審決定書之正本，應於決定後十五日內送達復審人及原處分機關。","finalWhy":"一、參酌公務人員保障法第七十一條第一項，於第一項定明復審決定書應記載事項。\n二、參酌公務人員保障法第七十一條第二項，於第二項定明決定書正本應送達復審人及原處分機關之期限。","review":null},{"no":"第五十五條","current":null,"versions":[{"bill":"201110006770000","text":"復審人不服復審決定者，得於復審決定送達之次日起二個月內，向原處分機關所在地之勤務法庭提起行政訴訟。但復審決定於艦艇航行期間送達者，其二個月期間自艦艇返抵國內港口之次日起算。\n原處分機關未依第四十九條規定，於權保會指定期間內作成行政處分者，復審人得於指定期間屆滿日之次日起二個月內，逕向原處分機關所在地之勤務法庭提起行政訴訟。\n原處分機關依第四十九條規定再作成之行政處分，復審人仍有不服者，得逕向原處分機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第九條第三項規定合併審議之復審決定者，復審人得向該審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，除記過、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理外，應由勤務法庭準用行政訴訟法通常訴訟程序審理。","note":"一、第一項定明不服復審決定者，得於決定書送達之次日起二個月內，向原處分機關所在地之勤務法庭提起相應之行政訴訟。又復審決定書如係於復審人於海上執行勤務，即艦艇航行期間送達者，因復審人無從即時提起行政訴訟，爰於但書規定提起行政訴訟之不變期間，自艦艇返抵國內港口之次日起算。\n二、又自程序保障及救濟經濟之觀點，避免同一爭議事件因原處分機關未依復審決定意旨另為適法之處分，致事件一再或重複提起復審未果，進而影響復審人權益，爰於第二項及第三項分別定明原處分機關未依復審決定，於權保會指定期間內為行政處分，或復審人不服原處分機關再作成之行政處分者，復審人得逕向原處分機關所在地之勤務法庭提起行政訴訟。\n三、為落實合併審議之立法目的及救濟體系之一致性，避免爭議事件繫屬不同行政法院，或依不同訴訟程序審理，反而造成復審人訴訟或行政法院審理上之不便利，爰於第四項定明復審人不服依第九條第三項合併審議決定之復審事件，得向權保會所在地之勤務法庭合併提起行政訴訟。\n四、配合一百十二年八月十五日施行之行政訴訟法，於第五項定明不服復審決定者，由勤務法庭準用該法通常訴訟程序審理。另考量記過（不含大過）、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟（例如財產懲罰、請求退除給與或撫卹金等公法上財產請求權），屬較為輕微、簡易之訴訟事件，為使事件即早審結，於除書定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。至依第三項合併提起行政訴訟之事件，合併後之標的金額或價額如逾新臺幣五十萬元，或有部分屬通常訴訟程序事件之範圍時，則全部準用行政訴訟法通常訴訟程序審理。"},{"bill":"202110033240000","text":"復審人不服復審決定者，得於復審決定送達之次日起二個月內，向原處分機關所在地之勤務法庭提起行政訴訟。但復審決定於艦艇航行期間送達者，其二個月期間自艦艇返抵國內港口之次日起算。\n原處分機關未依第四十九條規定，於權保會指定期間內作成行政處分者，復審人得於指定期間屆滿日之次日起二個月內，逕向原處分機關所在地之勤務法庭提起行政訴訟。\n原處分機關依第四十九條規定再作成之行政處分，復審人仍有不服者，得逕向原處分機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第九條第三項規定合併審議之復審決定者，復審人得向該審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，除記過、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理外，應由勤務法庭準用行政訴訟法通常訴訟程序審理。","note":"一、第一項定明不服復審決定者，得於決定書送達之次日起二個月內，向原處分機關所在地之勤務法庭提起相應之行政訴訟。又復審決定書如係於復審人於海上執行勤務，即艦艇航行期間送達者，因復審人無從即時提起行政訴訟，爰於但書規定提起行政訴訟之不變期間，自艦艇返抵國內港口之次日起算。\n二、又自程序保障及救濟經濟之觀點，避免同一爭議事件因原處分機關未依復審決定意旨另為適法之處分，致事件一再或重複提起復審未果，進而影響復審人權益，爰於第二項及第三項分別定明原處分機關未依復審決定，於權保會指定期間內為行政處分，或復審人不服原處分機關再作成之行政處分者，復審人得逕向原處分機關所在地之勤務法庭提起行政訴訟。\n三、為落實合併審議之立法目的及救濟體系之一致性，避免爭議事件繫屬不同行政法院，或依不同訴訟程序審理，反而造成復審人訴訟或行政法院審理上之不便利，爰於第四項定明復審人不服依第九條第三項合併審議決定之復審事件，得向權保會所在地之勤務法庭合併提起行政訴訟。\n四、配合一百十二年八月十五日施行之行政訴訟法，於第五項定明不服復審決定者，由勤務法庭準用該法通常訴訟程序審理。另考量記過（不含大過）、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟（例如財產懲罰、請求退除給與或撫卹金等公法上財產請求權），屬較為輕微、簡易之訴訟事件，為使事件即早審結，於除書定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。至依第三項合併提起行政訴訟之事件，合併後之標的金額或價額如逾新臺幣五十萬元，或有部分屬通常訴訟程序事件之範圍時，則全部準用行政訴訟法通常訴訟程序審理。"},{"bill":"202110036610000","text":"復審決定書，應載明下列事項：\n一、復審人姓名、服役單位、職階或職業、住居所或服役單位之駐地。\n二、有法定代理人或復審代理人者，其姓名、職業、住居所或事務所。\n三、主文、事實及理由；其係不受理決定者，得不記載事實。\n四、參與決定之權保委員姓名。\n五、年、月、日。\n復審決定書之正本，應於決定後十五日內送達復審人及原處分機關。","note":"一、參酌公務人員保障法第七十一條第一項，於第一項定明復審決定書應記載事項。\n二、參酌公務人員保障法第七十一條第二項，於第二項定明決定書正本應送達復審人及原處分機關之期限。"},{"bill":"202110044700000","text":"復審人不服復審決定者，得於復審決定送達之次日起二個月內，向原處分機關所在地之勤務法庭提起行政訴訟。但復審決定於艦艇航行期間送達者，其二個月期間自艦艇返抵國內港口且送達當事人之次日起算。\n原處分機關未依第四十九條規定，於權保會指定期間內作成行政處分者，復審人得於指定期間屆滿日之次日起二個月內，逕向原處分機關所在地之勤務法庭提起行政訴訟。\n原處分機關依第四十九條規定再作成之行政處分，復審人仍有不服者，得逕向原處分機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第九條第三項規定合併審議之復審決定者，復審人得向該審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，除記過、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理外，應由勤務法庭準用行政訴訟法通常訴訟程序審理。","note":"一、第一項定明不服復審決定者，得於決定書送達之次日起二個月內，向原處分機關所在地之勤務法庭提起相應之行政訴訟。又復審決定書如係於復審人於海上執行勤務，即艦艇航行期間送達者，因復審人無從即時提起行政訴訟，爰於但書規定提起行政訴訟之不變期間，自艦艇返抵國內港口且送達當事人之次日起算。\n二、又自程序保障及救濟經濟之觀點，避免同一爭議事件因原處分機關未依復審決定意旨另為適法之處分，致事件一再或重複提起復審未果，進而影響復審人權益，爰於第二項及第三項分別定明原處分機關未依復審決定，於權保會指定期間內為行政處分，或復審人不服原處分機關再作成之行政處分者，復審人得逕向原處分機關所在地之勤務法庭提起行政訴訟。\n三、為落實合併審議之立法目的及救濟體系之一致性，避免爭議事件繫屬不同行政法院，或依不同訴訟程序審理，反而造成復審人訴訟或行政法院審理上之不便利，爰於第四項定明復審人不服依第九條第三項合併審議決定之復審事件，得向權保會所在地之勤務法庭合併提起行政訴訟。\n四、配合一百十二年八月十五日施行之行政訴訟法，於第五項定明不服復審決定者，由勤務法庭準用該法通常訴訟程序審理。另考量記過（不含大過）、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟（例如財產懲罰、請求退除給與或撫卹金等公法上財產請求權），屬較為輕微、簡易之訴訟事件，為使事件即早審結，於除書定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。至依第三項合併提起行政訴訟之事件，合併後之標的金額或價額如逾新臺幣五十萬元，或有部分屬通常訴訟程序事件之範圍時，則全部準用行政訴訟法通常訴訟程序審理。"}],"changed":true,"final":"復審人不服復審決定者，得於復審決定送達之次日起二個月內，向原處分機關所在地之勤務法庭提起行政訴訟。但復審決定於艦艇航行期間送達者，其二個月期間自艦艇返抵國內港口之次日起算。\n原處分機關未依第四十九條規定，於權保會指定期間內作成行政處分者，復審人得於指定期間屆滿日之次日起二個月內，逕向原處分機關所在地之勤務法庭提起行政訴訟。\n原處分機關依第四十九條規定再作成之行政處分，復審人仍有不服者，得逕向原處分機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第九條第三項規定合併審議之復審決定者，復審人得向該審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，除記過、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理外，應由勤務法庭準用行政訴訟法通常訴訟程序審理。","finalWhy":"一、第一項定明不服復審決定者，得於決定書送達之次日起二個月內，向原處分機關所在地之勤務法庭提起相應之行政訴訟。又復審決定書如係於復審人於海上執行勤務，即艦艇航行期間送達者，因復審人無從即時提起行政訴訟，爰於但書規定提起行政訴訟之不變期間，自艦艇返抵國內港口之次日起算。\n二、又自程序保障及救濟經濟之觀點，避免同一爭議事件因原處分機關未依復審決定意旨另為適法之處分，致事件一再或重複提起復審未果，進而影響復審人權益，爰於第二項及第三項分別定明原處分機關未依復審決定，於權保會指定期間內為行政處分，或復審人不服原處分機關再作成之行政處分者，復審人得逕向原處分機關所在地之勤務法庭提起行政訴訟。\n三、為落實合併審議之立法目的及救濟體系之一致性，避免爭議事件繫屬不同行政法院，或依不同訴訟程序審理，反而造成復審人訴訟或行政法院審理上之不便利，爰於第四項定明復審人不服依第九條第三項合併審議決定之復審事件，得向權保會所在地之勤務法庭合併提起行政訴訟。\n四、配合一百十二年八月十五日施行之行政訴訟法，於第五項定明不服復審決定者，由勤務法庭準用該法通常訴訟程序審理。另考量記過（不含大過）、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟（例如財產懲罰、請求退除給與或撫卹金等公法上財產請求權），屬較為輕微、簡易之訴訟事件，為使事件即早審結，於除書定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。至依第四項合併提起行政訴訟之事件，合併後之標的金額或價額如逾新臺幣五十萬元，或有部分屬通常訴訟程序事件之範圍時，則全部準用行政訴訟法通常訴訟程序審理。","review":null},{"no":"第五十六條","current":null,"versions":[{"bill":"201110006770000","text":"復審決定書應附記，如不服決定，得於前條第一項所定二個月期間內，向原處分機關或合併審議之權保會所在地之勤務法庭提起行政訴訟。\n前項提起行政訴訟之期間附記錯誤時，應由權保會通知更正之，並自更正通知送達之次日起，計算法定期間。\n權保會未依第一項規定附記期間，或附記錯誤而未依前項規定通知更正，致原提起行政訴訟之人遲誤行政訴訟期間者，如於復審決定書送達之次日起一年內提起行政訴訟，視為於法定期間內提起。","note":"一、參酌公務人員保障法第七十二條第一項，於第一項定明復審決定依法得聲明不服者，復審決定書應附記救濟教示條款。\n二、參酌公務人員保障法第七十二條第二項及第三項，於第二項及第三項定明第一項附記錯誤時之處理及救濟期間之計算。"},{"bill":"202110033240000","text":"復審決定書應附記，如不服決定，得於前條第一項所定二個月期間內，向原處分機關或合併審議之權保會所在地之勤務法庭提起行政訴訟。\n前項提起行政訴訟之期間附記錯誤時，應由權保會通知更正之，並自更正通知送達之次日起，計算法定期間。\n權保會未依第一項規定附記期間，或附記錯誤而未依前項規定通知更正，致原提起行政訴訟之人遲誤行政訴訟期間者，如於復審決定書送達之次日起一年內提起行政訴訟，視為於法定期間內提起。","note":"一、參酌公務人員保障法第七十二條第一項，於第一項定明復審決定依法得聲明不服者，復審決定書應附記救濟教示條款。\n二、參酌公務人員保障法第七十二條第二項及第三項，於第二項及第三項定明第一項附記錯誤時之處理及救濟期間之計算。"},{"bill":"202110036610000","text":"復審人不服復審決定者，得於復審決定送達之次日起二個月內，向原處分機關所在地之勤務法庭提起行政訴訟。但復審決定於艦艇航行期間送達者，其二個月期間自艦艇返抵國內港口之次日起算。\n原處分機關未依第五十條規定，於權保會指定期間內作成行政處分者，復審人得於指定期間屆滿日之次日起二個月內，逕向原處分機關所在地之勤務法庭提起行政訴訟。\n原處分機關依第五十條規定再作成之行政處分，復審人仍有不服者，得逕向原處分機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第十條第三項規定合併審議之復審決定者，復審人得向該審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，除記過、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理外，應由勤務法庭準用行政訴訟法通常訴訟程序審理。","note":"一、第一項定明不服復審決定者，得於決定書送達之次日起二個月內，向原處分機關所在地之勤務法庭提起相應之行政訴訟。又復審決定書如係於復審人於海上執行勤務，即艦艇航行期間送達者，因復審人無從即時提起行政訴訟，爰於但書規定提起行政訴訟之不變期間，自艦艇返抵國內港口之次日起算。\n二、又自程序保障及救濟經濟之觀點，避免同一爭議事件因原處分機關未依復審決定意旨另為適法之處分，致事件一再或重複提起復審未果，進而影響復審人權益，爰於第二項及第三項分別定明原處分機關未依復審決定，於權保會指定期間內為行政處分，或復審人不服原處分機關再作成之行政處分者，復審人得逕向原處分機關所在地之勤務法庭提起行政訴訟。\n三、為落實合併審議之立法目的及救濟體系之一致性，避免爭議事件繫屬不同行政法院，或依不同訴訟程序審理，反而造成復審人訴訟或行政法院審理上之不便利，爰於第四項定明復審人不服依第九條第三項合併審議決定之復審事件，得向權保會所在地之勤務法庭合併提起行政訴訟。\n四、配合一百十二年八月十五日施行之行政訴訟法，於第五項定明不服復審決定者，由勤務法庭準用該法通常訴訟程序審理。另考量記過（不含大過）、申誡及標的金額或價額在新臺幣五十萬元以下關於公法上財產關係之訴訟（例如財產懲罰、請求退除給與或撫卹金等公法上財產請求權），屬較為輕微、簡易之訴訟事件，為使事件即早審結，於除書定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。至依第三項合併提起行政訴訟之事件，合併後之標的金額或價額如逾新臺幣五十萬元，或有部分屬通常訴訟程序事件之範圍時，則全部準用行政訴訟法通常訴訟程序審理。"},{"bill":"202110044700000","text":"復審決定書應附記，如不服決定，得於前條第一項所定二個月期間內，向原處分機關或合併審議之權保會所在地之勤務法庭提起行政訴訟。\n前項提起行政訴訟之期間附記錯誤時，應由權保會通知更正之，並自更正通知送達之次日起，計算法定期間。\n權保會未依第一項規定附記期間，或附記錯誤而未依前項規定通知更正，致原提起行政訴訟之人遲誤行政訴訟期間者，如於復審決定書送達之次日起一年內提起行政訴訟，視為於法定期間內提起。","note":"一、參酌公務人員保障法第七十二條第一項，於第一項定明復審決定依法得聲明不服者，復審決定書應附記救濟教示條款。\n二、參酌公務人員保障法第七十二條第二項及第三項，於第二項及第三項定明第一項附記錯誤時之處理及救濟期間之計算。"}],"changed":true,"final":"復審決定書應附記，如不服決定，得於前條第一項所定二個月期間內，向原處分機關或合併審議之權保會所在地之勤務法庭提起行政訴訟。\n前項提起行政訴訟之期間附記錯誤時，應由權保會通知更正之，並自更正通知送達之次日起，計算法定期間。\n權保會未依第一項規定附記期間，或附記錯誤而未依前項規定通知更正，致原提起行政訴訟之人遲誤行政訴訟期間者，如於復審決定書送達之次日起一年內提起行政訴訟，視為於法定期間內提起。","finalWhy":"一、參酌公務人員保障法第七十二條第一項，於第一項定明復審決定依法得聲明不服者，復審決定書應附記救濟教示條款。\n二、參酌公務人員保障法第七十二條第二項及第三項，於第二項及第三項定明第一項附記錯誤時之處理及救濟期間之計算。","review":null},{"no":"第五十七條","current":null,"versions":[{"bill":"201110006770000","text":"軍人對於權責機關所為復審事件以外之行政處分或管理措施，認為違法或不當，致影響其權益者，得依本法向申訴管轄機關提起申訴。\n軍人不服檢束、禁足、罰勤、罰站、人事晉任或遷調之行政處分，應依前項規定提起申訴。\n軍人於喪失現役軍人身分後，接獲前二項行政處分或管理措施者，亦得依第一項規定提起申訴。","note":"一、第十三條第一項所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項以外之行政處分或管理措施（例如業務調整、職缺甄選、參加各種測驗或考試、服裝撥補、申請休假或公差勤務之派遣等），因此類行政處分或管理措施不必然對基本權產生直接之侵害，或屬干預較為輕微之情形。復考量國家行政及司法資源之合理分配，使較簡易或輕微之爭議事件能循便捷之救濟程序即早確定，爰於第一項定明非第十三條第一項所列舉之行政處分或管理措施，應向申訴管轄機關提出申訴。\n二、第二項定明原應提起復審之行政處分，因軍事特性之考量，應提起申訴，說明如下：\n(一)檢束、禁足、罰勤及罰站為陸海空軍懲罰法所定懲罰種類，其性質固屬第十三條第一項之獎懲行政處分，惟上述懲罰除對軍人權利產生之干預較為輕微外，其執行期間尚屬短暫，事後再循復審程序救濟，恐緩不濟急，爰定明上開懲罰應向申訴管轄機關即時提出救濟。\n(二)又悔過懲罰係陸海空軍懲罰法之重大懲罰，執行期間最長達十五日，對受懲罰軍人之權利影響程度甚大。審酌悔過懲罰之核定，須由權責長官依陸海空軍懲罰法第三十條第四項，召開懲罰評議會決議之，並依同條第五項，給予行為人陳述及申辯之機會，其程序已較上述懲罰種類周延；如仍須先向申訴管轄機關提起申訴，始得提出再申訴及行政訴訟，反不具救濟之即時有效性，爰悔過懲罰之救濟應依第十三條第一項規定提起復審，併予敘明。\n(三)軍人之晉任及遷調，屬總統或權責機關統率（帥）部隊之權力，相關人事選拔或職缺調整自應循指揮鏈或建制內之即時自我督考，方能提拔最適人才，進而落實本法維護部隊紀律及鞏固戰力之立法目的。準此，權責長官對於其所屬軍人所為晉任與否或職務（缺）遷動（例如調離非主管職務或向下派職）之行政處分，因具有高度屬人性評價，基於尊重總統（權責機關）用人之權責，且從機關功能最適之觀點而論，此類行政處分第一次行政爭訟受理機關，由該軍人之原機關、上級或有指揮監督權限之申訴管轄機關予以審查，較獨立於申訴管轄機關外之權保會更為適切，爰定明此類行政處分，縱其性質屬第十三條第一項所定變更軍人身分之行政處分，仍應適用本章之申訴程序救濟之。至受處分人於申訴後，如有不服，仍得依本法規定循序提起再申訴及行政訴訟救濟，自不待言。\n三、軍人於喪失現役軍人身分後，始接獲第一項或第二項規定之行政處分或管理措施時，為使其有提起救濟以保障權益之機會，爰於第三項定明仍得提起申訴。"},{"bill":"202110033240000","text":"軍人對於權責機關所為復審事件以外之行政處分或管理措施，認為違法或不當，致影響其權益者，得依本法向申訴管轄機關提起申訴。\n軍人不服罰勤、人事晉任或遷調之行政處分，應依前項規定提起申訴。\n軍人於喪失現役軍人身分後，接獲前二項行政處分或管理措施者，亦得依第一項規定提起申訴。","note":"一、第十三條第一項所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項以外之行政處分或管理措施（例如業務調整、職缺甄選、參加各種測驗或考試、服裝撥補、申請休假或公差勤務之派遣等），因此類行政處分或管理措施不必然對基本權產生直接之侵害，或屬干預較為輕微之情形。復考量國家行政及司法資源之合理分配，使較簡易或輕微之爭議事件能循便捷之救濟程序即早確定，爰於第一項定明非第十三條第一項所列舉之行政處分或管理措施，應向申訴管轄機關提出申訴。\n二、第二項定明原應提起復審之行政處分，因軍事特性之考量，應提起申訴，說明如下：\n(一)罰勤為陸海空軍懲罰法所定懲罰種類，其性質固屬第十三條第一項之獎懲行政處分，惟該懲罰除對軍人權利產生之干預較為輕微外，其執行期間尚屬短暫，事後再循復審程序救濟，恐緩不濟急，爰定明上開懲罰應向申訴管轄機關即時提出救濟。\n(二)軍人之晉任及遷調，屬總統或權責機關統率（帥）部隊之權力，相關人事選拔或職缺調整自應循指揮鏈或建制內之即時自我督考，方能提拔最適人才，進而落實本法維護部隊紀律及鞏固戰力之立法目的。準此，權責長官對於其所屬軍人所為晉任與否或職務（缺）遷動（例如調離非主管職務或向下派職）之行政處分，因具有高度屬人性評價，基於尊重總統（權責機關）用人之權責，且從機關功能最適之觀點而論，此類行政處分第一次行政爭訟受理機關，由該軍人之原機關、上級或有指揮監督權限之申訴管轄機關予以審查，較獨立於申訴管轄機關外之權保會更為適切，爰定明此類行政處分，縱其性質屬第十三條第一項所定變更軍人身分之行政處分，仍應適用本章之申訴程序救濟之。至受處分人於申訴後，如有不服，仍得依本法規定循序提起再申訴及行政訴訟救濟，自不待言。\n三、軍人於喪失現役軍人身分後，始接獲第一項或第二項規定之行政處分或管理措施時，為使其有提起救濟以保障權益之機會，爰於第三項定明仍得提起申訴。"},{"bill":"202110036610000","text":"復審決定書應附記，如不服決定，得於前條第一項所定二個月期間內，向原處分機關或合併審議之權保會所在地之勤務法庭提起行政訴訟。\n前項提起行政訴訟之期間附記錯誤時，應由權保會通知更正之，並自更正通知送達之次日起，計算法定期間。\n權保會未依第一項規定附記期間，或附記錯誤而未依前項規定通知更正，致原提起行政訴訟之人遲誤行政訴訟期間者，如於復審決定書送達之次日起一年內提起行政訴訟，視為於法定期間內提起。","note":"一、參酌公務人員保障法第七十二條第一項，於第一項定明復審決定依法得聲明不服者，復審決定書應附記救濟教示條款。\n二、參酌公務人員保障法第七十二條第二項及第三項，於第二項及第三項定明第一項附記錯誤時之處理及救濟期間之計算。"},{"bill":"202110044700000","text":"軍人對於權責機關所為復審事件以外之行政處分或管理措施，認為違法或不當，致影響其權益者，得依本法向申訴管轄機關提起申訴。\n軍人不服檢束、禁足、罰勤、罰站、人事晉任或遷調之行政處分，應依前項規定提起申訴。\n軍人於喪失現役軍人身分後，接獲前二項行政處分或管理措施者，亦得依第一項規定提起申訴。","note":"一、第十三條第一項所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項以外之行政處分或管理措施（例如業務調整、職缺甄選、參加各種測驗或考試、服裝撥補、申請休假或公差勤務之派遣等），因此類行政處分或管理措施不必然對基本權產生直接之侵害，或屬干預較為輕微之情形。復考量國家行政及司法資源之合理分配，使較簡易或輕微之爭議事件能循便捷之救濟程序即早確定，爰於第一項定明非第十三條第一項所列舉之行政處分或管理措施，應向申訴管轄機關提出申訴。\n二、第二項定明原應提起復審之行政處分，因軍事特性之考量，應提起申訴，說明如下：\n(一)檢束、禁足、罰勤及罰站為陸海空軍懲罰法所定懲罰種類，其性質固屬第十三條第一項之獎懲行政處分，惟上述懲罰除對軍人權利產生之干預較為輕微外，其執行期間尚屬短暫，事後再循復審程序救濟，恐緩不濟急，爰定明上開懲罰應向申訴管轄機關即時提出救濟。\n(二)又悔過懲罰係陸海空軍懲罰法之重大懲罰，執行期間最長達十五日，對受懲罰軍人之權利影響程度甚大。審酌悔過懲罰之核定，須由權責長官依陸海空軍懲罰法第三十條第四項，召開懲罰評議會決議之，並依同條第五項，給予行為人陳述及申辯之機會，其程序已較上述懲罰種類周延；如仍須先向申訴管轄機關提起申訴，始得提出再申訴及行政訴訟，反不具救濟之即時有效性，爰悔過懲罰之救濟應依第十三條第一項規定提起復審，併予敘明。\n(三)軍人之晉任及遷調，屬總統或權責機關統率（帥）部隊之權力，相關人事選拔或職缺調整自應循指揮鏈或建制內之即時自我督考，方能提拔最適人才，進而落實本法維護部隊紀律及鞏固戰力之立法目的。準此，權責長官對於其所屬軍人所為晉任與否或職務（缺）遷動（例如調離非主管職務或向下派職）之行政處分，因具有高度屬人性評價，基於尊重總統（權責機關）用人之權責，且從機關功能最適之觀點而論，此類行政處分第一次行政爭訟受理機關，由該軍人之原機關、上級或有指揮監督權限之申訴管轄機關予以審查，較獨立於申訴管轄機關外之權保會更為適切，爰定明此類行政處分，縱其性質屬第十三條第一項所定變更軍人身分之行政處分，仍應適用本章之申訴程序救濟之。至受處分人於申訴後，如有不服，仍得依本法規定循序提起再申訴及行政訴訟救濟，自不待言。\n三、軍人於喪失現役軍人身分後，始接獲第一項或第二項規定之行政處分或管理措施時，為使其有提起救濟以保障權益之機會，爰於第三項定明仍得提起申訴。"}],"changed":true,"final":"軍人對於權責機關所為復審事件以外之行政處分或管理措施，認為違法或不當，致影響其權益者，得依本法向申訴管轄機關提起申訴。\n軍人不服檢束、禁足、罰勤、罰站、人事晉任或遷調之行政處分，應依前項規定提起申訴。\n軍人於喪失現役軍人身分後，接獲前二項行政處分或管理措施者，亦得依第一項規定提起申訴。","finalWhy":"一、第十三條第一項所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項以外之行政處分或管理措施（例如業務調整、職缺甄選、參加各種測驗或考試、服裝撥補、申請休假或公差勤務之派遣等），因此類行政處分或管理措施不必然對基本權產生直接之侵害，或屬干預較為輕微之情形。復考量國家行政及司法資源之合理分配，使較簡易或輕微之爭議事件能循便捷之救濟程序即早確定，爰於第一項定明非第十三條第一項所列舉之行政處分或管理措施，應向申訴管轄機關提出申訴。\n二、第二項定明原應提起復審之行政處分，因軍事特性之考量，應提起申訴，說明如下：\n(一)檢束、禁足、罰勤及罰站為陸海空軍懲罰法所定懲罰種類，其性質固屬第十三條第一項之獎懲行政處分，惟上述懲罰除對軍人權利產生之干預較為輕微外，其執行期間尚屬短暫，事後再循復審程序救濟，恐緩不濟急，爰定明上開懲罰應向申訴管轄機關即時提出救濟。\n(二)又悔過懲罰係陸海空軍懲罰法之重大懲罰，執行期間最長達十五日，對受懲罰軍人之權利影響程度甚大。審酌悔過懲罰之核定，須由權責長官依陸海空軍懲罰法原第三十條第四項，召開懲罰評議會決議之，並依同條第五項，給予行為人陳述及申辯之機會，其程序已較上述懲罰種類周延；如仍須先向申訴管轄機關提起申訴，始得提出再申訴及行政訴訟，反不具救濟之即時有效性，爰悔過懲罰之救濟應依第十三條第一項規定提起復審，併予敘明。\n(三)軍人之晉任及遷調，屬總統或權責機關統率（帥）部隊之權力，相關人事選拔或職缺調整自應循指揮鏈或建制內之即時自我督考，方能提拔最適人才，進而落實本法維護部隊紀律及鞏固戰力之立法目的。準此，權責長官對於其所屬軍人所為晉任與否或職務（缺）遷動（例如調離非主管職務或向下派職）之行政處分，因具有高度屬人性評價，基於尊重總統（權責機關）用人之權責，且從機關功能最適之觀點而論，此類行政處分第一次行政爭訟受理機關，由該軍人之原機關、上級或有指揮監督權限之申訴管轄機關予以審查，較獨立於申訴管轄機關外之權保會更為適切，爰定明此類行政處分，縱其性質屬第十三條第一項所定變更軍人身分之行政處分，仍應適用本章之申訴程序救濟之。至受處分人於申訴後，如有不服，仍得依本法規定循序提起再申訴及行政訴訟救濟，自不待言。\n三、軍人於喪失現役軍人身分後，始接獲第一項或第二項規定之行政處分或管理措施時，為使其有提起救濟以保障權益之機會，爰於第三項定明仍得提起申訴。","review":null},{"no":"第五十八條","current":null,"versions":[{"bill":"201110006770000","text":"申訴之提起，應於行政處分或管理措施送達之次日起三十日內，以言詞、書面或其他適當方法向申訴管轄機關提出。但行政處分或管理措施於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口之次日起算。\n前項行政處分或管理措施以書面以外方式作成者，經受處分或措施之人請求作成書面時，原處分機關或原措施機關不得拒絕；受處分或措施之人當場表示不服並陳述理由者，該機關應依其請求，將不服之理由製作紀錄交付之。","note":"一、為即時導正原處分機關或原措施機關所為違法或不當之行政處分或管理措施，以迅速救濟軍人權益，爰參酌公務人員保障法第七十八條第一項前段，於第一項定明提起申訴之期間。另於但書定明行政處分或管理措施於艦艇航行期間送達時，自艦艇返抵國內港口之次日起算三十日，為提起申訴之不變期間。另考量各級軍事機關（構）、學校、部隊之人員組成多元，學經歷背景亦不相同，且軍人之申訴以迅速及簡易處理為原則，爰未參酌公務人員保障法第八十條有關申訴應以書面為之之規定，即本法所定申訴亦得以書面以外之言詞或其他適切方式（例如國軍一九八五申訴電話專線或民意信箱等方式）提起。\n二、參酌行政程序法第九十五條第二項，於第二項定明應循申訴救濟之行政處分或管理措施係以書面以外方式作成者，經受處分或措施之人請求作成書面時，原機關不得拒絕。另考量非以書面作成之行政處分或管理措施，申訴人難於事後提出相關佐證資料，爰一併定明如受處分或措施之人當場表示不服者，該機關應依其請求另行製作紀錄並交付之，以利後續權益救濟並明確責任歸屬。又本項之表示不服，並不當然視為提起申訴，仍應探究受處分或措施之人是否確有依本法提起申訴之意思及作為，併予敘明。"},{"bill":"202110033240000","text":"申訴之提起，應於行政處分或管理措施送達之次日起三十日內，以言詞、書面或其他適當方法向申訴管轄機關提出。但行政處分或管理措施於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口之次日起算。\n前項行政處分或管理措施以書面以外方式作成者，經受處分或措施之人請求作成書面時，原處分機關或原措施機關不得拒絕；受處分或措施之人當場表示不服並陳述理由者，該機關應依其請求，將不服之理由製作紀錄交付之。","note":"一、為即時導正原處分機關或原措施機關所為違法或不當之行政處分或管理措施，以迅速救濟軍人權益，爰參酌公務人員保障法第七十八條第一項前段，於第一項定明提起申訴之期間。另於但書定明行政處分或管理措施於艦艇航行期間送達時，自艦艇返抵國內港口之次日起算三十日，為提起申訴之不變期間。另考量各級軍事機關（構）、學校、部隊之人員組成多元，學經歷背景亦不相同，且軍人之申訴以迅速及簡易處理為原則，爰未參酌公務人員保障法第八十條有關申訴應以書面為之之規定，即本法所定申訴亦得以書面以外之言詞或其他適切方式（例如國軍一九八五申訴電話專線或民意信箱等方式）提起。\n二、參酌行政程序法第九十五條第二項，於第二項定明應循申訴救濟之行政處分或管理措施係以書面以外方式作成者，經受處分或措施之人請求作成書面時，原機關不得拒絕。另考量非以書面作成之行政處分或管理措施，申訴人難於事後提出相關佐證資料，爰一併定明如受處分或措施之人當場表示不服者，該機關應依其請求另行製作紀錄並交付之，以利後續權益救濟並明確責任歸屬。又本項之表示不服，並不當然視為提起申訴，仍應探究受處分或措施之人是否確有依本法提起申訴之意思及作為，併予敘明。"},{"bill":"202110036610000","text":"軍人對於權責機關所為復審事件以外之行政處分或管理措施，認為違法或不當，致影響其權益者，得依本法向申訴管轄機關提起申訴。\n軍人不服檢束、禁足、罰勤、罰站、人事晉任或遷調之行政處分，應依前項規定提起申訴。\n軍人於喪失現役軍人身分後，接獲前二項行政處分或管理措施者，亦得依第一項規定提起申訴。","note":"一、第十四條第一項所定涉及軍人身分變更、公法上財產請求、獎懲或考績事項以外之行政處分或管理措施（例如業務調整、職缺甄選、參加各種測驗或考試、服裝撥補、申請休假或公差勤務之派遣等），因此類行政處分或管理措施不必然對基本權產生直接之侵害，或屬干預較為輕微之情形。復考量國家行政及司法資源之合理分配，使較簡易或輕微之爭議事件能循便捷之救濟程序即早確定，爰於第一項定明非第十三條第一項所列舉之行政處分或管理措施，應向申訴管轄機關提出申訴。\n二、第二項定明原應提起復審之行政處分，因軍事特性之考量，應提起申訴，說明如下：\n(一)檢束、禁足、罰勤及罰站為陸海空軍懲罰法所定懲罰種類，其性質固屬第十四條第一項之獎懲行政處分，惟上述懲罰除對軍人權利產生之干預較為輕微外，其執行期間尚屬短暫，事後再循復審程序救濟，恐緩不濟急，爰定明上開懲罰應向申訴管轄機關即時提出救濟。\n(二)又悔過懲罰係陸海空軍懲罰法之重大懲罰，執行期間最長達十五日，對受懲罰軍人之權利影響程度甚大。審酌悔過懲罰之核定，須由權責長官依陸海空軍懲罰法第三十條第四項，召開懲罰評議會決議之，並依同條第五項，給予行為人陳述及申辯之機會，其程序已較上述懲罰種類周延；如仍須先向申訴管轄機關提起申訴，始得提出再申訴及行政訴訟，反不具救濟之即時有效性，爰悔過懲罰之救濟應依第十四條第一項規定提起復審，併予敘明。\n(三)軍人之晉任及遷調，屬總統或權責機關統率（帥）部隊之權力，相關人事選拔或職缺調整自應循指揮鏈或建制內之即時自我督考，方能提拔最適人才，進而落實本法維護部隊紀律及鞏固戰力之立法目的。準此，權責長官對於其所屬軍人所為晉任與否或職務（缺）遷動（例如調離非主管職務或向下派職）之行政處分，因具有高度屬人性評價，基於尊重總統（權責機關）用人之權責，且從機關功能最適之觀點而論，此類行政處分第一次行政爭訟受理機關，由該軍人之原機關、上級或有指揮監督權限之申訴管轄機關予以審查，較獨立於申訴管轄機關外之權保會更為適切，爰定明此類行政處分，縱其性質屬第十四條第一項所定變更軍人身分之行政處分，仍應適用本章之申訴程序救濟之。至受處分人於申訴後，如有不服，仍得依本法規定循序提起再申訴及行政訴訟救濟，自不待言。\n三、軍人於喪失現役軍人身分後，始接獲第一項或第二項規定之行政處分或管理措施時，為使其有提起救濟以保障權益之機會，爰於第三項定明仍得提起申訴。"},{"bill":"202110044700000","text":"申訴之提起，應於行政處分或管理措施送達之次日起三十日內，以言詞、書面或其他適當方法向申訴管轄機關提出。但行政處分或管理措施於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口且送達當事人之次日起算。\n前項行政處分或管理措施以書面以外方式作成者，經受處分或措施之人請求作成書面時，原處分機關或原措施機關不得拒絕；受處分或措施之人當場表示不服並陳述理由者，該機關應依其請求，將不服之理由製作紀錄交付之。","note":"一、為即時導正原處分機關或原措施機關所為違法或不當之行政處分或管理措施，以迅速救濟軍人權益，爰參酌公務人員保障法第七十八條第一項前段，於第一項定明提起申訴之期間。另於但書定明行政處分或管理措施於艦艇航行期間送達時，自艦艇返抵國內港口且送達當事人之次日起算三十日，為提起申訴之不變期間。另考量各級軍事機關（構）、學校、部隊之人員組成多元，學經歷背景亦不相同，且軍人之申訴以迅速及簡易處理為原則，爰未參酌公務人員保障法第八十條有關申訴應以書面為之之規定，即本法所定申訴亦得以書面以外之言詞或其他適切方式（例如國軍一九八五申訴電話專線或民意信箱等方式）提起。\n二、參酌行政程序法第九十五條第二項，於第二項定明應循申訴救濟之行政處分或管理措施係以書面以外方式作成者，經受處分或措施之人請求作成書面時，原機關不得拒絕。另考量非以書面作成之行政處分或管理措施，申訴人難於事後提出相關佐證資料，爰一併定明如受處分或措施之人當場表示不服者，該機關應依其請求另行製作紀錄並交付之，以利後續權益救濟並明確責任歸屬。又本項之表示不服，並不當然視為提起申訴，仍應探究受處分或措施之人是否確有依本法提起申訴之意思及作為，併予敘明。"}],"changed":true,"final":"申訴之提起，應於行政處分或管理措施送達之次日起三十日內，以言詞、書面或其他適當方法向申訴管轄機關提出。但行政處分或管理措施於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口之次日起算。\n前項行政處分或管理措施以書面以外方式作成者，經受處分或措施之人請求作成書面時，原處分機關或原措施機關不得拒絕；受處分或措施之人當場表示不服並陳述理由者，該機關應依其請求，將不服之理由製作紀錄交付之。","finalWhy":"一、為即時導正原處分機關或原措施機關所為違法或不當之行政處分或管理措施，以迅速救濟軍人權益，爰參酌公務人員保障法第七十八條第一項前段，於第一項定明提起申訴之期間。另於但書定明行政處分或管理措施於艦艇航行期間送達時，自艦艇返抵國內港口之次日起算三十日，為提起申訴之不變期間。另考量各級軍事機關（構）、學校、部隊之人員組成多元，學經歷背景亦不相同，且軍人之申訴以迅速及簡易處理為原則，爰未參酌公務人員保障法第八十條有關申訴應以書面為之之規定，即本法所定申訴亦得以書面以外之言詞或其他適切方式（例如國軍一九八五申訴電話專線或民意信箱等方式）提起。\n二、參酌行政程序法第九十五條第二項，於第二項定明應循申訴救濟之行政處分或管理措施係以書面以外方式作成者，經受處分或措施之人請求作成書面時，原機關不得拒絕。另考量非以書面作成之行政處分或管理措施，申訴人難於事後提出相關佐證資料，爰一併定明如受處分或措施之人當場表示不服者，該機關應依其請求另行製作紀錄並交付之，以利後續權益救濟並明確責任歸屬。又本項之表示不服，並不當然視為提起申訴，仍應探究受處分或措施之人是否確有依本法提起申訴之意思及作為，併予敘明。","review":{"note":"照行政院提案通過","text":"第四十條所定得實施專案調查之情形，應由國防部自行或指定所屬機關或學校召開專案評議會評議。\n前項專案評議會，應由上將編階或相當層級之人員擔任召集人，並邀集適當階級人員、專家學者或社會公正人士七人至十一人組成。\n第一項專案評議會委員任一性別比例不得少於總人數五分之二；專家學者或社會公正人士人數不得少於總人數二分之一。\n第一項專案評議會之決議應以委員過半數之出席，出席委員過半數之同意行之。\n專案評議會委員之遴選、評議方式及其他相關事項之規則，由國防部定之。"}},{"no":"第五十九條","current":null,"versions":[{"bill":"201110006770000","text":"申訴管轄機關對於申訴事件，應於收受申訴之次日起三十日內，就請求事項予以妥適之處理；必要時得延長十日，並通知申訴人。屆期未處理者，申訴人得逕提再申訴。\n申訴處理以書面為之者，應附記如不服處理者，得於第六十二條第二項所定二十日期間內向權保會提起再申訴；以書面以外方式作成者，經申訴人請求作成書面時，申訴管轄機關不得拒絕。\n申訴事件之管轄機關、權責劃分、處理程序及其他相關事項之辦法，由國防部及其他軍文併用機關定之。","note":"一、參酌公務人員保障法第八十一條第一項，於第一項定明申訴管轄機關受理申訴之處理期間，以及申訴管轄機關屆期未處理者，申訴人得逕提再申訴。\n二、參酌公務人員保障法第八十一條第二項，於第二項定明書面申訴處理應附記之事項；及書面以外申訴處理，申訴人得請求作成書面。另考量申訴案多涉及權責機關之人事或內部管理措施，相關法律爭議宜儘早確定，以維法安定性，爰定明再申訴之提起應於申訴處理送達後二十日內提起。\n三、申訴管轄機關以原處分機關、原措施機關或其上級機關為原則，惟申訴事件類型繁多，難於本法中逐一定明應由何機關（單位）受理。為使事權相符，爰於第三項授權國防部及其他軍文併用機關訂定各類型申訴事件之管轄機關、權責劃分、處理程序及相關事項之辦法。"},{"bill":"202110033240000","text":"申訴管轄機關對於申訴事件，應於收受申訴之次日起三十日內，就請求事項予以妥適之處理；必要時得延長十日，並通知申訴人。屆期未處理者，申訴人得逕提再申訴。\n申訴處理以書面為之者，應附記如不服處理者，得於第六十二條第二項所定二十日期間內向權保會提起再申訴；以書面以外方式作成者，經申訴人請求作成書面時，申訴管轄機關不得拒絕。\n申訴事件之管轄機關、權責劃分、處理程序及其他相關事項之辦法，由國防部及其他軍文併用機關定之。","note":"一、參酌公務人員保障法第八十一條第一項，於第一項定明申訴管轄機關受理申訴之處理期間，以及申訴管轄機關屆期未處理者，申訴人得逕提再申訴。\n二、參酌公務人員保障法第八十一條第二項，於第二項定明書面申訴處理應附記之事項；及書面以外申訴處理，申訴人得請求作成書面。另考量申訴案多涉及權責機關之人事或內部管理措施，相關法律爭議宜儘早確定，以維法安定性，爰定明再申訴之提起應於申訴處理送達後二十日內提起。\n三、申訴管轄機關以原處分機關、原措施機關或其上級機關為原則，惟申訴事件類型繁多，難於本法中逐一定明應由何機關（單位）受理。為使事權相符，爰於第三項授權國防部及其他軍文併用機關訂定各類型申訴事件之管轄機關、權責劃分、處理程序及相關事項之辦法。"},{"bill":"202110036610000","text":"申訴之提起，應於行政處分或管理措施送達之次日起三十日內，以言詞、書面或其他適當方法向申訴管轄機關提出。但行政處分或管理措施於艦艇航行期間送達者，其三十日期間自艦艇返抵國內港口之次日起算。\n前項行政處分或管理措施以書面以外方式作成者，經受處分或措施之人請求作成書面時，原處分機關或原措施機關不得拒絕；受處分或措施之人當場表示不服並陳述理由者，該機關應依其請求，將不服之理由製作紀錄交付之。","note":"一、為即時導正原處分機關或原措施機關所為違法或不當之行政處分或管理措施，以迅速救濟軍人權益，爰參酌公務人員保障法第七十八條第一項前段，於第一項定明提起申訴之期間。另於但書定明行政處分或管理措施於艦艇航行期間送達時，自艦艇返抵國內港口之次日起算三十日，為提起申訴之不變期間。另考量各級軍事機關（構）、學校、部隊之人員組成多元，學經歷背景亦不相同，且軍人之申訴以迅速及簡易處理為原則，爰未參酌公務人員保障法第八十條有關申訴應以書面為之之規定，即本法所定申訴亦得以書面以外之言詞或其他適切方式（例如國軍一九八五申訴電話專線或民意信箱等方式）提起。\n二、參酌行政程序法第九十五條第二項，於第二項定明應循申訴救濟之行政處分或管理措施係以書面以外方式作成者，經受處分或措施之人請求作成書面時，原機關不得拒絕。另考量非以書面作成之行政處分或管理措施，申訴人難於事後提出相關佐證資料，爰一併定明如受處分或措施之人當場表示不服者，該機關應依其請求另行製作紀錄並交付之，以利後續權益救濟並明確責任歸屬。又本項之表示不服，並不當然視為提起申訴，仍應探究受處分或措施之人是否確有依本法提起申訴之意思及作為，併予敘明。"},{"bill":"202110044700000","text":"申訴管轄機關對於申訴事件，應於收受申訴之次日起三十日內，就請求事項予以妥適之處理；必要時得延長十日，並通知申訴人。屆期未處理者，申訴人得逕提再申訴。\n申訴處理以書面為之者，應附記如不服處理者，得於第六十二條第二項所定二十日期間內向權保會提起再申訴；以書面以外方式作成者，經申訴人請求作成書面時，申訴管轄機關不得拒絕。\n申訴事件之管轄機關、權責劃分、處理程序及其他相關事項之辦法，由國防部及其他軍文併用機關定之。","note":"一、參酌公務人員保障法第八十一條第一項，於第一項定明申訴管轄機關受理申訴之處理期間，以及申訴管轄機關屆期未處理者，申訴人得逕提再申訴。\n二、參酌公務人員保障法第八十一條第二項，於第二項定明書面申訴處理應附記之事項；及書面以外申訴處理，申訴人得請求作成書面。另考量申訴案多涉及權責機關之人事或內部管理措施，相關法律爭議宜儘早確定，以維法安定性，爰定明再申訴之提起應於申訴處理送達後二十日內提起。\n三、申訴管轄機關以原處分機關、原措施機關或其上級機關為原則，惟申訴事件類型繁多，難於本法中逐一定明應由何機關（單位）受理。為使事權相符，爰於第三項授權國防部及其他軍文併用機關訂定各類型申訴事件之管轄機關、權責劃分、處理程序及相關事項之辦法。"}],"changed":true,"final":"申訴管轄機關對於申訴事件，應於收受申訴之次日起三十日內，就請求事項予以妥適之處理；必要時得延長十日，並通知申訴人。屆期未處理者，申訴人得逕提再申訴。\n申訴處理以書面為之者，應附記如不服處理者，得於第六十二條第二項所定二十日期間內向權保會提起再申訴；以書面以外方式作成者，經申訴人請求作成書面時，申訴管轄機關不得拒絕。\n申訴事件之管轄機關、權責劃分、處理程序及其他相關事項之辦法，由國防部及其他軍文併用機關定之。","finalWhy":"一、參酌公務人員保障法第八十一條第一項，於第一項定明申訴管轄機關受理申訴之處理期間，以及申訴管轄機關屆期未處理者，申訴人得逕提再申訴。\n二、參酌公務人員保障法第八十一條第二項，於第二項定明書面申訴處理應附記之事項；及書面以外申訴處理，申訴人得請求作成書面。另考量申訴案多涉及權責機關之人事或內部管理措施，相關法律爭議宜儘早確定，以維法安定性，爰定明再申訴之提起應於申訴處理送達後二十日內提起。\n三、申訴管轄機關以原處分機關、原措施機關或其上級機關為原則，惟申訴事件類型繁多，難於本法中逐一定明應由何機關（單位）受理。為使事權相符，爰於第三項授權國防部及其他軍文併用機關訂定各類型申訴事件之管轄機關、權責劃分、處理程序及相關事項之辦法。","review":{"note":"照行政院提案通過","text":"專案評議會認有應受懲罰人或有第四十條第二項之申請人時，應通知應受懲罰人或申請人於指定日期及處所陳述意見。\n第四十條第一項第一款所定情形，未經同條第二項所定人員申請專案調查者，專案評議會必要時得通知該等人員於指定日期及處所陳述意見；該等人員於專案評議程序終結前，請求陳述意見且有正當理由者，應予陳述意見之機會。\n前二項通知到場人員，於陳述意見期日前，得向專案評議會申請閱覽、抄寫、複印、攝影有關資料，或請求調查證據。"}},{"no":"第六十條","current":null,"versions":[{"bill":"201110006770000","text":"申訴事件有下列情形之一者，得不予處理：\n一、提起申訴逾第五十八條第一項所定法定期間。\n二、無具體之事實內容，或未具真實姓名、服役單位、住址或其他聯絡方式。\n三、同一事由，已提起復審、申訴或行政訴訟，而仍一再提起。\n四、非申訴管轄機關，接獲申訴人以同一事由分向各機關申訴。","note":"參酌公務人員保障法第八十四條準用同法第七十三條及行政程序法第一百七十三條，定明申訴事件之提起已逾第五十八條第一項之申訴期間；申訴內容未見具體事實、真實姓名或服役單位等聯絡方式；同一事件業經提起救濟程序或進行救濟中，因其申訴之提起不備法定程式或無權利保護之必要，申訴管轄機關自得不予處理。"},{"bill":"202110033240000","text":"申訴事件有下列情形之一者，得不予處理：\n一、提起申訴逾第五十八條第一項所定法定期間。\n二、無具體之事實內容，或未具真實姓名、服役單位、住址或其他聯絡方式。\n三、同一事由，已提起復審、申訴或行政訴訟，而仍一再提起。\n四、非申訴管轄機關，接獲申訴人以同一事由分向各機關申訴。","note":"參酌公務人員保障法第八十四條準用同法第七十三條及行政程序法第一百七十三條，定明申訴事件之提起已逾第五十八條第一項之申訴期間；申訴內容未見具體事實、真實姓名或服役單位等聯絡方式；同一事件業經提起救濟程序或進行救濟中，因其申訴之提起不備法定程式或無權利保護之必要，申訴管轄機關自得不予處理。"},{"bill":"202110036610000","text":"申訴管轄機關對於申訴事件，應於收受申訴之次日起三十日內，就請求事項予以妥適之處理；必要時得延長十日，並通知申訴人。屆期未處理者，申訴人得逕提再申訴。\n申訴處理以書面為之者，應附記如不服處理者，得於第六十三條第二項所定二十日期間內向權保會提起再申訴；以書面以外方式作成者，經申訴人請求作成書面時，申訴管轄機關不得拒絕。\n申訴事件之管轄機關、權責劃分、處理程序及其他相關事項之辦法，由國防部及其他軍文併用機關定之。","note":"一、參酌公務人員保障法第八十一條第一項，於第一項定明申訴管轄機關受理申訴之處理期間，以及申訴管轄機關屆期未處理者，申訴人得逕提再申訴。\n二、參酌公務人員保障法第八十一條第二項，於第二項定明書面申訴處理應附記之事項；及書面以外申訴處理，申訴人得請求作成書面。另考量申訴案多涉及權責機關之人事或內部管理措施，相關法律爭議宜儘早確定，以維法安定性，爰定明再申訴之提起應於申訴處理送達後二十日內提起。\n三、申訴管轄機關以原處分機關、原措施機關或其上級機關為原則，惟申訴事件類型繁多，難於本法中逐一定明應由何機關（單位）受理。為使事權相符，爰於第三項授權國防部及其他軍文併用機關訂定各類型申訴事件之管轄機關、權責劃分、處理程序及相關事項之辦法。"},{"bill":"202110044700000","text":"申訴事件有下列情形之一者，得不予處理：\n一、提起申訴逾第五十八條第一項所定法定期間。\n二、無具體之事實內容，或未具真實姓名、服役單位、住址或其他聯絡方式。\n三、同一事由，已提起復審、申訴或行政訴訟，而仍一再提起。\n四、非申訴管轄機關，接獲申訴人以同一事由分向各機關申訴。","note":"參酌公務人員保障法第八十四條準用同法第七十三條及行政程序法第一百七十三條，定明申訴事件之提起已逾第五十八條第一項之申訴期間；申訴內容未見具體事實、真實姓名或服役單位等聯絡方式；同一事件業經提起救濟程序或進行救濟中，因其申訴之提起不備法定程式或無權利保護之必要，申訴管轄機關自得不予處理。"}],"changed":true,"final":"申訴事件有下列情形之一者，得不予處理：\n一、提起申訴逾第五十八條第一項所定法定期間。\n二、無具體之事實內容，或未具真實姓名、服役單位、住址或其他聯絡方式。\n三、同一事由，已提起復審、申訴或行政訴訟，而仍一再提起。\n四、非申訴管轄機關，接獲申訴人以同一事由分向各機關申訴。","finalWhy":"參酌公務人員保障法第八十四條準用同法第七十三條及行政程序法第一百七十三條，定明申訴事件之提起已逾第五十八條第一項之申訴期間；申訴內容未見具體事實、真實姓名或服役單位等聯絡方式；同一事件業經提起救濟程序或進行救濟中，因其申訴之提起不備法定程式或無權利保護之必要，申訴管轄機關自得不予處理。","review":{"note":"照行政院提案通過","text":"專案評議會認第四十條第一項之專案調查報告有不備之處，或有前條第三項調查證據請求時，應具體說明調查方法，令原調查機關補充調查。\n前項補充調查，以一次為限。但發生新事實或發現新證據者，不在此限。"}},{"no":"第六十一條","current":null,"versions":[{"bill":"201110006770000","text":"應提起復審之事件誤提申訴者，申訴管轄機關應移由原處分機關依復審程序處理，並通知該誤提申訴之人。","note":"參酌公務人員保障法第七十九條第一項，定明申訴管轄機關對應提復審而誤提申訴之處理。"},{"bill":"202110033240000","text":"應提起復審之事件誤提申訴者，申訴管轄機關應移由原處分機關依復審程序處理，並通知該誤提申訴之人。","note":"參酌公務人員保障法第七十九條第一項，定明申訴管轄機關對應提復審而誤提申訴之處理。"},{"bill":"202110036610000","text":"申訴事件有下列情形之一者，得不予處理：\n一、提起申訴逾第五十九條第一項所定法定期間。\n二、無具體之事實內容，或未具真實姓名、服役單位、住址或其他聯絡方式。\n三、同一事由，已提起復審、申訴或行政訴訟，而仍一再提起。\n四、非申訴管轄機關，接獲申訴人以同一事由分向各機關申訴。","note":"參酌公務人員保障法第八十四條準用同法第七十三條及行政程序法第一百七十三條，定明申訴事件之提起已逾第五十九條第一項之申訴期間；申訴內容未見具體事實、真實姓名或服役單位等聯絡方式；同一事件業經提起救濟程序或進行救濟中，因其申訴之提起不備法定程式或無權利保護之必要，申訴管轄機關自得不予處理。"},{"bill":"202110044700000","text":"應提起復審之事件誤提申訴者，申訴管轄機關應移由原處分機關依復審程序處理，並通知該誤提申訴之人。","note":"參酌公務人員保障法第七十九條第一項，定明申訴管轄機關對應提復審而誤提申訴之處理。"}],"changed":true,"final":"應提起復審之事件誤提申訴者，申訴管轄機關應移由原處分機關依復審程序處理，並通知該誤提申訴之人。","finalWhy":"參酌公務人員保障法第七十九條第一項，定明申訴管轄機關對應提復審而誤提申訴之處理。","review":{"note":"照行政院提案通過","text":"專案評議會評議期間，所有出席、列席及記錄人員，對於會議討論事項、會議內容及決議，均應嚴守秘密；未經專案評議會同意，不得對外公開。"}},{"no":"第六十二條","current":null,"versions":[{"bill":"201110006770000","text":"不服申訴管轄機關之申訴處理者，得依本法向權保會提起再申訴。\n申訴人不服申訴處理者，得於申訴處理送達之次日起二十日內，向權保會提起再申訴。但申訴處理於艦艇航行期間送達者，其二十日期間自艦艇返抵國內港口之次日起算。","note":"一、第一項定明申訴人如不服申訴管轄機關之申訴處理，得向權保會提出再申訴，尋求救濟。\n二、參酌公務人員保障法第七十八條第一項後段，於第二項定明再申訴應於申訴處理送達之次日起二十日內提起，俾使申訴事件能即早確定，以維法安定性。另定明再申訴處理於艦艇航行期間送達之特別規定。"},{"bill":"202110033240000","text":"不服申訴管轄機關之申訴處理者，得依本法向權保會提起再申訴。\n申訴人不服申訴處理者，得於申訴處理送達之次日起二十日內，向權保會提起再申訴。但申訴處理於艦艇航行期間送達者，其二十日期間自艦艇返抵國內港口之次日起算。","note":"一、第一項定明申訴人如不服申訴管轄機關之申訴處理，得向權保會提出再申訴，尋求救濟。\n二、參酌公務人員保障法第七十八條第一項後段，於第二項定明再申訴應於申訴處理送達之次日起二十日內提起，俾使申訴事件能即早確定，以維法安定性。另定明再申訴處理於艦艇航行期間送達之特別規定。"},{"bill":"202110036610000","text":"應提起復審之事件誤提申訴者，申訴管轄機關應移由原處分機關依復審程序處理，並通知該誤提申訴之人。","note":"參酌公務人員保障法第七十九條第一項，定明申訴管轄機關對應提復審而誤提申訴之處理。"},{"bill":"202110044700000","text":"不服申訴管轄機關之申訴處理者，得依本法向權保會提起再申訴。\n申訴人不服申訴處理者，得於申訴處理送達之次日起二十日內，向權保會提起再申訴。但申訴處理於艦艇航行期間送達者，其二十日期間自艦艇返抵國內港口且送達當事人之次日起算。","note":"一、第一項定明申訴人如不服申訴管轄機關之申訴處理，得向權保會提出再申訴，尋求救濟。\n二、參酌公務人員保障法第七十八條第一項後段，於第二項定明再申訴應於申訴處理送達之次日起二十日內提起，俾使申訴事件能即早確定，以維法安定性。另定明再申訴處理於艦艇航行期間送達之特別規定。"}],"changed":true,"final":"不服申訴管轄機關之申訴處理者，得依本法向權保會提起再申訴。\n申訴人不服申訴處理者，得於申訴處理送達之次日起二十日內，向權保會提起再申訴。但申訴處理於艦艇航行期間送達者，其二十日期間自艦艇返抵國內港口之次日起算。","finalWhy":"一、第一項定明申訴人如不服申訴管轄機關之申訴處理，得向權保會提出再申訴，尋求救濟。\n二、參酌公務人員保障法第七十八條第一項後段，於第二項定明再申訴應於申訴處理送達之次日起二十日內提起，俾使申訴事件能即早確定，以維法安定性。另定明再申訴處理於艦艇航行期間送達之特別規定。","review":{"note":"照行政院提案通過","text":"專案評議會應將評議結論作成專案報告，送交權責機關及有關機關，並副知第五十九條第一項及第二項通知到場人員。\n前項報告應包括下列事項，並得摘錄對外公開之：\n一、事實之認定。\n二、調查之方法及經過。\n三、認定之理由。\n四、改善建議。\n五、應受懲罰之人、懲罰種類及懲度。\n權責長官應依前項第五款規定核定懲罰。"}},{"no":"第六十三條","current":null,"versions":[{"bill":"201110006770000","text":"提起再申訴應具再申訴書，載明下列事項：\n一、再申訴人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或再申訴代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、請求事項。\n四、再申訴之事實及理由。\n五、證據。\n六、原行政處分或原管理措施及申訴處理送達之年、月、日。\n七、提起再申訴之年、月、日。\n再申訴書應由再申訴人及法定代理人簽名或蓋章。但委任再申訴代理人者，應由再申訴代理人簽名或蓋章。","note":"一、為使再申訴之處理有明確之憑據，於第一項定明再申訴之要式及再申訴書應記載事項。\n二、第二項定明再申訴書應經當事人簽名或蓋章。"},{"bill":"202110033240000","text":"提起再申訴應具再申訴書，載明下列事項：\n一、再申訴人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或再申訴代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、請求事項。\n四、再申訴之事實及理由。\n五、證據。\n六、原行政處分或原管理措施及申訴處理送達之年、月、日。\n七、提起再申訴之年、月、日。\n再申訴書應由再申訴人及法定代理人簽名或蓋章。但委任再申訴代理人者，應由再申訴代理人簽名或蓋章。","note":"一、為使再申訴之處理有明確之憑據，於第一項定明再申訴之要式及再申訴書應記載事項。\n二、第二項定明再申訴書應經當事人簽名或蓋章。"},{"bill":"202110036610000","text":"不服申訴管轄機關之申訴處理者，得依本法向權保會提起再申訴。\n申訴人不服申訴處理者，得於申訴處理送達之次日起二十日內，向權保會提起再申訴。但申訴處理於艦艇航行期間送達者，其二十日期間自艦艇返抵國內港口之次日起算。","note":"一、第一項定明申訴人如不服申訴管轄機關之申訴處理，得向權保會提出再申訴，尋求救濟。\n二、參酌公務人員保障法第七十八條第一項後段，於第二項定明再申訴應於申訴處理送達之次日起二十日內提起，俾使申訴事件能即早確定，以維法安定性。另定明再申訴處理於艦艇航行期間送達之特別規定。"},{"bill":"202110044700000","text":"提起再申訴應具再申訴書，載明下列事項：\n一、再申訴人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或再申訴代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、請求事項。\n四、再申訴之事實及理由。\n五、證據。\n六、原行政處分或原管理措施及申訴處理送達之年、月、日。\n七、提起再申訴之年、月、日。\n再申訴書應由再申訴人及法定代理人簽名或蓋章。但委任再申訴代理人者，應由再申訴代理人簽名或蓋章。","note":"一、為使再申訴之處理有明確之憑據，於第一項定明再申訴之要式及再申訴書應記載事項。\n二、第二項定明再申訴書應經當事人簽名或蓋章。"}],"changed":true,"final":"提起再申訴應具再申訴書，載明下列事項：\n一、再申訴人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或再申訴代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、請求事項。\n四、再申訴之事實及理由。\n五、證據。\n六、原行政處分或原管理措施及申訴處理送達之年、月、日。\n七、提起再申訴之年、月、日。\n再申訴書應由再申訴人及法定代理人簽名或蓋章。但委任再申訴代理人者，應由再申訴代理人簽名或蓋章。","finalWhy":"一、為使再申訴之處理有明確之憑據，於第一項定明再申訴之要式及再申訴書應記載事項。\n二、第二項定明再申訴書應經當事人簽名或蓋章。","review":null},{"no":"第六十四條","current":null,"versions":[{"bill":"201110006770000","text":"再申訴決定應於收受再申訴書之次日起三個月內為之；必要時得延長一個月，並通知再申訴人。","note":"參酌公務人員保障法第八十一條第三項，定明再申訴之處理時限。"},{"bill":"202110033240000","text":"再申訴決定應於收受再申訴書之次日起三個月內為之；必要時得延長一個月，並通知再申訴人。","note":"參酌公務人員保障法第八十一條第三項，定明再申訴之處理時限。"},{"bill":"202110036610000","text":"提起再申訴應具再申訴書，載明下列事項：\n一、再申訴人姓名、出生年月日、服役單位、職階或職業、住居所或服役單位之駐地、身分證明文件字號。\n二、有法定代理人或再申訴代理人者，其姓名、出生年月日、職業、住居所或事務所、身分證明文件字號。\n三、請求事項。\n四、再申訴之事實及理由。\n五、證據。\n六、原行政處分或原管理措施及申訴處理送達之年、月、日。\n七、提起再申訴之年、月、日。\n再申訴書應由再申訴人及法定代理人簽名或蓋章。但委任再申訴代理人者，應由再申訴代理人簽名或蓋章。","note":"一、為使再申訴之處理有明確之憑據，於第一項定明再申訴之要式及再申訴書應記載事項。\n二、第二項定明再申訴書應經當事人簽名或蓋章。"},{"bill":"202110044700000","text":"再申訴決定應於收受再申訴書之次日起三個月內為之；必要時得延長一個月，並通知再申訴人。","note":"參酌公務人員保障法第八十一條第三項，定明再申訴之處理時限。"}],"changed":true,"final":"再申訴決定應於收受再申訴書之次日起三個月內為之；必要時得延長一個月，並通知再申訴人。","finalWhy":"參酌公務人員保障法第八十一條第三項，定明再申訴之處理時限。","review":null},{"no":"第六十五條","current":null,"versions":[{"bill":"201110006770000","text":"原處分機關、原措施機關或申訴管轄機關對於權保會函詢之再申訴事件，應於二十日內將事實、理由及處理意見，並附有關資料，回復權保會。\n前項被函詢之機關對於再申訴事件未於前項規定期間內回復者，權保會得逕為決定。","note":"一、參酌公務人員保障法第八十二條第一項，於第一項定明原處分機關、原措施機關或申訴管轄機關對於權保會查詢之再申訴事件，應就再申訴事實、理由及處理意見及有關資料，迅速回復，俾憑辦理，並限定於二十日內辦理。\n二、參酌公務人員保障法第八十二條第二項，於第二項定明被函詢機關未依限回復者，權保會得就現有資料逕為決定，以免拖延過久。"},{"bill":"202110033240000","text":"原處分機關、原措施機關或申訴管轄機關對於權保會函詢之再申訴事件，應於二十日內將事實、理由及處理意見，並附有關資料，回復權保會。\n前項被函詢之機關對於再申訴事件未於前項規定期間內回復者，權保會得逕為決定。","note":"一、參酌公務人員保障法第八十二條第一項，於第一項定明原處分機關、原措施機關或申訴管轄機關對於權保會查詢之再申訴事件，應就再申訴事實、理由及處理意見及有關資料，迅速回復，俾憑辦理，並限定於二十日內辦理。\n二、參酌公務人員保障法第八十二條第二項，於第二項定明被函詢機關未依限回復者，權保會得就現有資料逕為決定，以免拖延過久。"},{"bill":"202110036610000","text":"再申訴決定應於收受再申訴書之次日起三個月內為之；必要時得延長一個月，並通知再申訴人。","note":"參酌公務人員保障法第八十一條第三項，定明再申訴之處理時限。"},{"bill":"202110044700000","text":"原處分機關、原措施機關或申訴管轄機關對於權保會函詢之再申訴事件，應於二十日內將事實、理由及處理意見，並附有關資料，回復權保會。\n前項被函詢之機關對於再申訴事件未於前項規定期間內回復者，權保會得逕為決定。","note":"一、參酌公務人員保障法第八十二條第一項，於第一項定明原處分機關、原措施機關或申訴管轄機關對於權保會查詢之再申訴事件，應就再申訴事實、理由及處理意見及有關資料，迅速回復，俾憑辦理，並限定於二十日內辦理。\n二、參酌公務人員保障法第八十二條第二項，於第二項定明被函詢機關未依限回復者，權保會得就現有資料逕為決定，以免拖延過久。"}],"changed":true,"final":"原處分機關、原措施機關或申訴管轄機關對於權保會函詢之再申訴事件，應於二十日內將事實、理由及處理意見，並附有關資料，回復權保會。\n前項被函詢之機關對於再申訴事件未於前項規定期間內回復者，權保會得逕為決定。","finalWhy":"一、參酌公務人員保障法第八十二條第一項，於第一項定明原處分機關、原措施機關或申訴管轄機關對於權保會查詢之再申訴事件，應就再申訴事實、理由及處理意見及有關資料，迅速回復，俾憑辦理，並限定於二十日內辦理。\n二、參酌公務人員保障法第八十二條第二項，於第二項定明被函詢機關未依限回復者，權保會得就現有資料逕為決定，以免拖延過久。","review":null},{"no":"第六十六條","current":null,"versions":[{"bill":"201110006770000","text":"對第五十七條第二項所定之檢束、禁足、罰勤、罰站行政處分，提起再申訴有理由者，如該行政處分已經執行完畢，權保會應為確認違法之決定。\n權保會為前項決定時，準用第五十一條規定。","note":"一、考量依陸海空軍懲罰法作成之檢束、禁足、罰勤及罰站行政處分，經執行完畢，即無回復原狀之可能，權保會亦無從為撤銷之決定或發回原處分機關另為適法處分，惟再申訴人仍有確認該行政處分違法之法律上利益，爰於第一項定明權保會應為確認懲罰違法之決定。\n二、上述懲罰係針對軍人較為輕微之不當行止所為之行政處分，故於權保會依本條規定為確認違法決定後，即告確定。至於悔過懲罰係針對軍人較為嚴重之不當行止所為之處分，對於部隊紀律之影響較大，其合法性宜由司法機關審查，故不在本條確認違法決定之範圍內。從而已執行完畢之悔過處分，受處分人如有確認違法之利益，應依第七十條及行政訴訟法第六條第一項後段規定，向高等軍事法院勤務法庭提起確認違法訴訟，併予敘明。\n三、第二項定明第一項懲罰經權保會確認違法者，再申訴人得準用第五十一條規定進行國家賠償協議。"},{"bill":"202110033240000","text":"對第五十七條第二項所定之罰勤行政處分，提起再申訴有理由者，如該行政處分已經執行完畢，權保會應為確認違法之決定。\n權保會為前項決定時，準用第五十一條規定。","note":"一、考量依陸海空軍懲罰法作成之罰勤行政處分，經執行完畢，即無回復原狀之可能，權保會亦無從為撤銷之決定或發回原處分機關另為適法處分，惟再申訴人仍有確認該行政處分違法之法律上利益，爰於第一項定明權保會應為確認懲罰違法之決定。\n二、上述懲罰係針對軍人較為輕微之不當行止所為之行政處分，故於權保會依本條規定為確認違法決定後，即告確定。\n三、第二項定明第一項懲罰經權保會確認違法者，再申訴人得準用第五十一條規定進行國家賠償協議。"},{"bill":"202110036610000","text":"原處分機關、原措施機關或申訴管轄機關對於權保會函詢之再申訴事件，應於二十日內將事實、理由及處理意見，並附有關資料，回復權保會。\n前項被函詢之機關對於再申訴事件未於前項規定期間內回復者，權保會得逕為決定。","note":"一、參酌公務人員保障法第八十二條第一項，於第一項定明原處分機關、原措施機關或申訴管轄機關對於權保會查詢之再申訴事件，應就再申訴事實、理由及處理意見及有關資料，迅速回復，俾憑辦理，並限定於二十日內辦理。\n二、參酌公務人員保障法第八十二條第二項，於第二項定明被函詢機關未依限回復者，權保會得就現有資料逕為決定，以免拖延過久。"},{"bill":"202110044700000","text":"對第五十七條第二項所定之檢束、禁足、罰勤、罰站行政處分，提起再申訴有理由者，如該行政處分已經執行完畢，權保會應為確認違法之決定。\n權保會為前項決定時，準用第五十一條規定。","note":"一、考量依陸海空軍懲罰法作成之檢束、禁足、罰勤及罰站行政處分，經執行完畢，即無回復原狀之可能，權保會亦無從為撤銷之決定或發回原處分機關另為適法處分，惟再申訴人仍有確認該行政處分違法之法律上利益，爰於第一項定明權保會應為確認懲罰違法之決定。\n二、上述懲罰係針對軍人較為輕微之不當行止所為之行政處分，故於權保會依本條規定為確認違法決定後，即告確定。至於悔過懲罰係針對軍人較為嚴重之不當行止所為之處分，對於部隊紀律之影響較大，其合法性宜由司法機關審查，故不在本條確認違法決定之範圍內。從而已執行完畢之悔過處分，受處分人如有確認違法之利益，應依第七十條及行政訴訟法第六條第一項後段規定，向高等軍事法院勤務法庭提起確認違法訴訟，併予敘明。\n三、第二項定明第一項懲罰經權保會確認違法者，再申訴人得準用第五十一條規定進行國家賠償協議。"}],"changed":true,"final":"對第五十七條第二項所定之檢束、禁足、罰勤、罰站行政處分，提起再申訴有理由者，如該行政處分已經執行完畢，權保會應為確認違法之決定。\n權保會為前項決定時，準用第五十一條規定。","finalWhy":"一、考量依陸海空軍懲罰法作成之檢束、禁足、罰勤及罰站行政處分，經執行完畢，即無回復原狀之可能，權保會亦無從為撤銷之決定或發回原處分機關另為適法處分，惟再申訴人仍有確認該行政處分違法之法律上利益，爰於第一項定明權保會應為確認懲罰違法之決定。\n二、上述懲罰係針對軍人較為輕微之不當行止所為之行政處分，故於權保會依本條規定為確認違法決定後，即告確定。至於悔過懲罰係針對軍人較為嚴重之不當行止所為之處分，對於部隊紀律之影響較大，其合法性宜由司法機關審查，故不在本條確認違法決定之範圍內。從而已執行完畢之悔過處分，受處分人如有確認違法之利益，應依第七十條及行政訴訟法第六條第一項後段規定，向高等軍事法院勤務法庭提起確認違法訴訟，併予敘明。\n三、第二項定明第一項懲罰經權保會確認違法者，再申訴人得準用第五十一條規定進行國家賠償協議。","review":{"note":"照行政院提案通過","text":"悔過以外之紀律懲罰，權責長官得以言詞下達後執行之。但應於言詞下達之次日起七日內，依前二條規定辦理。"}},{"no":"第六十七條","current":null,"versions":[{"bill":"201110006770000","text":"應提起復審或申訴之事件，誤向權保會提起再申訴者，權保會應通知原處分機關或申訴管轄機關依復審或申訴程序處理，並通知該誤提再申訴之人。","note":"參酌公務人員保障法第七十九條，定明權保會對於應提復審或申訴之事件，卻誤提再申訴之處理。"},{"bill":"202110033240000","text":"應提起復審或申訴之事件，誤向權保會提起再申訴者，權保會應通知原處分機關或申訴管轄機關依復審或申訴程序處理，並通知該誤提再申訴之人。","note":"參酌公務人員保障法第七十九條，定明權保會對於應提復審或申訴之事件，卻誤提再申訴之處理。"},{"bill":"202110036610000","text":"對第五十八條第二項所定之檢束、禁足、罰勤、罰站行政處分，提起再申訴有理由者，如該行政處分已經執行完畢，權保會應為確認違法之決定。\n權保會為前項決定時，準用第五十二條規定。","note":"一、考量依陸海空軍懲罰法作成之檢束、禁足、罰勤及罰站行政處分，經執行完畢，即無回復原狀之可能，權保會亦無從為撤銷之決定或發回原處分機關另為適法處分，惟再申訴人仍有確認該行政處分違法之法律上利益，爰於第一項定明權保會應為確認懲罰違法之決定。\n二、上述懲罰係針對軍人較為輕微之不當行止所為之行政處分，故於權保會依本條規定為確認違法決定後，即告確定。至於悔過懲罰係針對軍人較為嚴重之不當行止所為之處分，對於部隊紀律之影響較大，其合法性宜由司法機關審查，故不在本條確認違法決定之範圍內。從而已執行完畢之悔過處分，受處分人如有確認違法之利益，應依第七十一條及行政訴訟法第六條第一項後段規定，向高等軍事法院勤務法庭提起確認違法訴訟，併予敘明。\n三、第二項定明第一項懲罰經權保會確認違法者，再申訴人得準用第五十二條規定進行國家賠償協議。"},{"bill":"202110044700000","text":"應提起復審或申訴之事件，誤向權保會提起再申訴者，權保會應通知原處分機關或申訴管轄機關依復審或申訴程序處理，並通知該誤提再申訴之人。","note":"參酌公務人員保障法第七十九條，定明權保會對於應提復審或申訴之事件，卻誤提再申訴之處理。"}],"changed":true,"final":"應提起復審或申訴之事件，誤向權保會提起再申訴者，權保會應通知原處分機關或申訴管轄機關依復審或申訴程序處理，並通知該誤提再申訴之人。","finalWhy":"參酌公務人員保障法第七十九條，定明權保會對於應提復審或申訴之事件，卻誤提再申訴之處理。","review":{"note":"照行政院提案通過","text":"同一違紀行為依本法懲罰後，復移送懲戒，經懲戒法院為懲戒處分或不受懲戒之判決確定者，原懲罰處分失其效力。因逾第三十四條懲戒權行使期間而受免議之判決者，原懲罰處分不失其效力。"}},{"no":"第六十八條","current":null,"versions":[{"bill":"201110006770000","text":"再申訴除本節另有規定外，準用本法復審之規定。","note":"參酌公務人員保障法第八十四條，定明再申訴之處理，準用本法復審之規定。"},{"bill":"202110033240000","text":"再申訴除本節另有規定外，準用本法復審之規定。","note":"參酌公務人員保障法第八十四條，定明再申訴之處理，準用本法復審之規定。"},{"bill":"202110036610000","text":"應提起復審或申訴之事件，誤向權保會提起再申訴者，權保會應通知原處分機關或申訴管轄機關依復審或申訴程序處理，並通知該誤提再申訴之人。","note":"參酌公務人員保障法第七十九條，定明權保會對於應提復審或申訴之事件，卻誤提再申訴之處理。"},{"bill":"202110044700000","text":"再申訴除本節另有規定外，準用本法復審之規定。","note":"參酌公務人員保障法第八十四條，定明再申訴之處理，準用本法復審之規定。"}],"changed":true,"final":"再申訴除本節另有規定外，準用本法復審之規定。","finalWhy":"參酌公務人員保障法第八十四條，定明再申訴之處理，準用本法復審之規定。","review":{"note":"照行政院提案通過","text":"人事懲罰及財產懲罰，自懲罰發布之次日生效。\n懲罰處分因程序瑕疵，經救濟程序撤銷另予適法處分時，如基於同一事實再為相同內容之懲罰處分，該懲罰處分溯及自原懲罰處分生效之日發生效力。"}},{"no":"第六十九條","current":null,"versions":[{"bill":"201110006770000","text":"再申訴人不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於再申訴決定送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。但再申訴決定於艦艇航行期間送達者，其一個月期間自艦艇返抵國內港口之次日起算。\n原處分機關或原措施機關未依第六十八條準用第四十九條規定，於權保會指定期間內作成行政處分或管理措施者，再申訴人得於指定期間屆滿日之次日起一個月內，逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。\n原處分機關或原措施機關依第六十八條準用第四十九條規定再作成之行政處分或管理措施，再申訴人仍有不服者，得逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第九條第三項合併審議之再申訴決定者，再申訴人得向該合併審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理。","note":"一、參酌司法院釋字第七八五號解釋理由書：「各種行政訴訟均有其起訴合法性要件與權利保護要件，公務人員欲循行政訴疵訟法請求救濟，自應符合相關行政訴訟類型之法定要件。至是否違法侵害公務人員之權利，則仍須根據行政訴訟法或其他相關法律之規定，依個案具體判斷，尤應整體考量行政機關所採取措施之目的、性質以及干預之程度，如屬顯然輕微之干預，即難謂構成權利之侵害。」意旨，於第一項定明不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於決定書送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起相應之行政訴訟。又再申訴決定書如係於再申訴人於海上執行勤務即艦艇航行期間送達者，因再申訴人無從即時提起行政訴訟，爰於但書規定起訴之不變期間，自艦艇返抵國內港口之次日起算。\n二、第二項及第三項定明權保會依第六十八條準用第四十九條，作成命原處分機關或原措施機關於指定期間內為一定或另為行政處分、管理措施之再申訴決定時，倘該機關未依再申訴決定意旨處理時，再申訴人得逕提行政訴訟，理由同第五十五條說明二。\n三、第四項定明再申訴人不服依第九條第三項合併決定之再申訴事件，得合併向權保會所在地之勤務法庭提起行政訴訟，理由同第五十五條說明三。\n四、再申訴事件屬性質較輕微、簡易之訴訟事件，為使事件儘早審結，第五項定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。"},{"bill":"202110033240000","text":"再申訴人不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於再申訴決定送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。但再申訴決定於艦艇航行期間送達者，其一個月期間自艦艇返抵國內港口之次日起算。\n原處分機關或原措施機關未依第六十八條準用第四十九條規定，於權保會指定期間內作成行政處分或管理措施者，再申訴人得於指定期間屆滿日之次日起一個月內，逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。\n原處分機關或原措施機關依第六十八條準用第四十九條規定再作成之行政處分或管理措施，再申訴人仍有不服者，得逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第九條第三項合併審議之再申訴決定者，再申訴人得向該合併審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理。","note":"一、參酌司法院釋字第七八五號解釋理由書：「各種行政訴訟均有其起訴合法性要件與權利保護要件，公務人員欲循行政訴疵訟法請求救濟，自應符合相關行政訴訟類型之法定要件。至是否違法侵害公務人員之權利，則仍須根據行政訴訟法或其他相關法律之規定，依個案具體判斷，尤應整體考量行政機關所採取措施之目的、性質以及干預之程度，如屬顯然輕微之干預，即難謂構成權利之侵害。」意旨，於第一項定明不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於決定書送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起相應之行政訴訟。又再申訴決定書如係於再申訴人於海上執行勤務即艦艇航行期間送達者，因再申訴人無從即時提起行政訴訟，爰於但書規定起訴之不變期間，自艦艇返抵國內港口之次日起算。\n二、第二項及第三項定明權保會依第六十八條準用第四十九條，作成命原處分機關或原措施機關於指定期間內為一定或另為行政處分、管理措施之再申訴決定時，倘該機關未依再申訴決定意旨處理時，再申訴人得逕提行政訴訟，理由同第五十五條說明二。\n三、第四項定明再申訴人不服依第九條第三項合併決定之再申訴事件，得合併向權保會所在地之勤務法庭提起行政訴訟，理由同第五十五條說明三。\n四、再申訴事件屬性質較輕微、簡易之訴訟事件，為使事件儘早審結，第五項定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。"},{"bill":"202110036610000","text":"再申訴除本節另有規定外，準用本法復審之規定。","note":"參酌公務人員保障法第八十四條，定明再申訴之處理，準用本法復審之規定。"},{"bill":"202110044700000","text":"再申訴人不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於再申訴決定送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。但再申訴決定於艦艇航行期間送達者，其一個月期間自艦艇返抵國內港口且送達再申訴人之次日起算。\n原處分機關或原措施機關未依第六十八條準用第四十九條規定，於權保會指定期間內作成行政處分或管理措施者，再申訴人得於指定期間屆滿日之次日起一個月內，逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。\n原處分機關或原措施機關依第六十八條準用第四十九條規定再作成之行政處分或管理措施，再申訴人仍有不服者，得逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第九條第三項合併審議之再申訴決定者，再申訴人得向該合併審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理。","note":"一、參酌司法院釋字第七八五號解釋理由書：「各種行政訴訟均有其起訴合法性要件與權利保護要件，公務人員欲循行政訴疵訟法請求救濟，自應符合相關行政訴訟類型之法定要件。至是否違法侵害公務人員之權利，則仍須根據行政訴訟法或其他相關法律之規定，依個案具體判斷，尤應整體考量行政機關所採取措施之目的、性質以及干預之程度，如屬顯然輕微之干預，即難謂構成權利之侵害。」意旨，於第一項定明不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於決定書送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起相應之行政訴訟。又再申訴決定書如係於再申訴人於海上執行勤務即艦艇航行期間送達者，因再申訴人無從即時提起行政訴訟，爰於但書規定起訴之不變期間，自艦艇返抵國內港口之次日起算。\n二、第二項及第三項定明權保會依第六十八條準用第四十九條，作成命原處分機關或原措施機關於指定期間內為一定或另為行政處分、管理措施之再申訴決定時，倘該機關未依再申訴決定意旨處理時，再申訴人得逕提行政訴訟，理由同第五十五條說明二。\n三、第四項定明再申訴人不服依第九條第三項合併決定之再申訴事件，得合併向權保會所在地之勤務法庭提起行政訴訟，理由同第五十五條說明三。\n四、再申訴事件屬性質較輕微、簡易之訴訟事件，為使事件儘早審結，第五項定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。"}],"changed":true,"final":"再申訴人不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於再申訴決定送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。但再申訴決定於艦艇航行期間送達者，其一個月期間自艦艇返抵國內港口之次日起算。\n原處分機關或原措施機關未依第六十八條準用第四十九條規定，於權保會指定期間內作成行政處分或管理措施者，再申訴人得於指定期間屆滿日之次日起一個月內，逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。\n原處分機關或原措施機關依第六十八條準用第四十九條規定再作成之行政處分或管理措施，再申訴人仍有不服者，得逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第九條第三項合併審議之再申訴決定者，再申訴人得向該合併審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理。","finalWhy":"一、參酌司法院釋字第七八五號解釋理由書：「各種行政訴訟均有其起訴合法性要件與權利保護要件，公務人員欲循行政訴訟法請求救濟，自應符合相關行政訴訟類型之法定要件。至是否違法侵害公務人員之權利，則仍須根據行政訴訟法或其他相關法律之規定，依個案具體判斷，尤應整體考量行政機關所採取措施之目的、性質以及干預之程度，如屬顯然輕微之干預，即難謂構成權利之侵害。」意旨，於第一項定明不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於決定書送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起相應之行政訴訟。又再申訴決定書如係於再申訴人於海上執行勤務即艦艇航行期間送達者，因再申訴人無從即時提起行政訴訟，爰於但書規定起訴之不變期間，自艦艇返抵國內港口之次日起算。\n二、第二項及第三項定明權保會依第六十八條準用第四十九條，作成命原處分機關或原措施機關於指定期間內為一定或另為行政處分、管理措施之再申訴決定時，倘該機關未依再申訴決定意旨處理時，再申訴人得逕提行政訴訟，理由同第五十五條說明二。\n三、第四項定明再申訴人不服依第九條第三項合併決定之再申訴事件，得合併向權保會所在地之勤務法庭提起行政訴訟，理由同第五十五條說明三。\n四、再申訴事件屬性質較輕微、簡易之訴訟事件，為使事件儘早審結，第五項定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。","review":{"note":"照行政院提案通過","text":"財產懲罰自處分生效之日起五年內未經執行者，不再執行；其於五年期間屆滿前已開始執行者，仍得繼續執行。但自五年期間屆滿之日起已逾五年尚未執行終結者，不得再執行。"}},{"no":"第七十條","current":null,"versions":[{"bill":"201110006770000","text":"復審人及再申訴人不服權保會所為之復審或再申訴決定者，以勤務法庭為行政訴訟管轄法院。第二條所定權益爭議事件，得逕依行政訴訟法提起行政訴訟者，亦同。\n勤務法庭審理前項事件，除本法另有規定外，準用行政訴訟法之規定。\n勤務法庭之審理細則，由國防部定之。","note":"一、第一項前段定明不服復審或再申訴決定之行政訴訟管轄法院。又第二條所定有關軍人與權責機關間之相關權益爭議事件，如得依行政訴訟法逕行提起訴訟（例如確認訴訟或一般給付訴訟）時，亦應以勤務法庭為行政訴訟第一審管轄法院，爰於第一項後段定明。\n二、第二項定明勤務法庭審理事件，除本法另有規定外，應準用行政訴訟法審理。\n三、第三項定明授權國防部得針對勤務法庭辦理行政訴訟事件有關之技術性或細節性事項，訂定審理細則。"},{"bill":"202110033240000","text":"復審人及再申訴人不服權保會所為之復審或再申訴決定者，以勤務法庭為行政訴訟管轄法院。第二條所定權益爭議事件，得逕依行政訴訟法提起行政訴訟者，亦同。\n勤務法庭審理前項事件，除本法另有規定外，準用行政訴訟法之規定。\n勤務法庭之審理細則，由國防部定之。","note":"一、第一項前段定明不服復審或再申訴決定之行政訴訟管轄法院。又第二條所定有關軍人與權責機關間之相關權益爭議事件，如得依行政訴訟法逕行提起訴訟（例如確認訴訟或一般給付訴訟）時，亦應以勤務法庭為行政訴訟第一審管轄法院，爰於第一項後段定明。\n二、第二項定明勤務法庭審理事件，除本法另有規定外，應準用行政訴訟法審理。\n三、第三項定明授權國防部得針對勤務法庭辦理行政訴訟事件有關之技術性或細節性事項，訂定審理細則。"},{"bill":"202110036610000","text":"再申訴人不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於再申訴決定送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。但再申訴決定於艦艇航行期間送達者，其一個月期間自艦艇返抵國內港口之次日起算。\n原處分機關或原措施機關未依第六十九條準用第五十條規定，於權保會指定期間內作成行政處分或管理措施者，再申訴人得於指定期間屆滿日之次日起一個月內，逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟。\n原處分機關或原措施機關依第六十九條準用第五十條規定再作成之行政處分或管理措施，再申訴人仍有不服者，得逕向原處分機關或原措施機關所在地之勤務法庭提起行政訴訟；其提起行政訴訟期間，準用第一項規定。\n不服依第十條第三項合併審議之再申訴決定者，再申訴人得向該合併審議之權保會所在地之勤務法庭合併提起行政訴訟。\n前四項訴訟，由勤務法庭準用行政訴訟法簡易訴訟程序審理。","note":"一、參酌司法院釋字第七八五號解釋理由書：「各種行政訴訟均有其起訴合法性要件與權利保護要件，公務人員欲循行政訴疵訟法請求救濟，自應符合相關行政訴訟類型之法定要件。至是否違法侵害公務人員之權利，則仍須根據行政訴訟法或其他相關法律之規定，依個案具體判斷，尤應整體考量行政機關所採取措施之目的、性質以及干預之程度，如屬顯然輕微之干預，即難謂構成權利之侵害。」意旨，於第一項定明不服再申訴決定者，除原行政處分或原管理措施屬顯然輕微之干預外，得於決定書送達之次日起一個月內，向原處分機關或原措施機關所在地之勤務法庭提起相應之行政訴訟。又再申訴決定書如係於再申訴人於海上執行勤務即艦艇航行期間送達者，因再申訴人無從即時提起行政訴訟，爰於但書規定起訴之不變期間，自艦艇返抵國內港口之次日起算。\n二、第二項及第三項定明權保會依第六十九條準用第五十條，作成命原處分機關或原措施機關於指定期間內為一定或另為行政處分、管理措施之再申訴決定時，倘該機關未依再申訴決定意旨處理時，再申訴人得逕提行政訴訟，理由同第五十六條說明二。\n三、第四項定明再申訴人不服依第十條第三項合併決定之再申訴事件，得合併向權保會所在地之勤務法庭提起行政訴訟，理由同第五十六條說明三。\n四、再申訴事件屬性質較輕微、簡易之訴訟事件，為使事件儘早審結，第五項定明此類事件應由勤務法庭準用行政訴訟法簡易訴訟程序審理之。"},{"bill":"202110044700000","text":"復審人及再申訴人不服權保會所為之復審或再申訴決定者，以勤務法庭為行政訴訟管轄法院。第二條所定權益爭議事件，得逕依行政訴訟法提起行政訴訟者，亦同。\n勤務法庭審理前項事件，除本法另有規定外，準用行政訴訟法之規定。\n勤務法庭之審理細則，由國防部定之。","note":"一、第一項前段定明不服復審或再申訴決定之行政訴訟管轄法院。又第二條所定有關軍人與權責機關間之相關權益爭議事件，如得依行政訴訟法逕行提起訴訟（例如確認訴訟或一般給付訴訟）時，亦應以勤務法庭為行政訴訟第一審管轄法院，爰於第一項後段定明。\n二、第二項定明勤務法庭審理事件，除本法另有規定外，應準用行政訴訟法審理。\n三、第三項定明授權國防部得針對勤務法庭辦理行政訴訟事件有關之技術性或細節性事項，訂定審理細則。"}],"changed":true,"final":"復審人及再申訴人不服權保會所為之復審或再申訴決定者，以勤務法庭為行政訴訟管轄法院。第二條所定權益爭議事件，得逕依行政訴訟法提起行政訴訟者，亦同。\n勤務法庭審理前項事件，除本法另有規定外，準用行政訴訟法之規定。\n勤務法庭及其他法院間審判權爭議之處理，準用法院組織法之規定。\n勤務法庭應妥速審理，其細則由國防部定之。","finalWhy":"一、第一項前段定明不服復審或再申訴決定之行政訴訟管轄法院。又第二條所定有關軍人與權責機關間之相關權益爭議事件，如得依行政訴訟法逕行提起訴訟（例如確認訴訟或一般給付訴訟）時，亦應以勤務法庭為行政訴訟第一審管轄法院，爰於第一項後段定明。\n二、第二項定明勤務法庭審理事件，除本法另有規定外，應準用行政訴訟法審理。\n三、第三項定明勤務法庭與其他法院間之審判權爭議（例如民事或一般行政訴訟事件）之處理，應準用法院組織法。\n四、第四項定明勤務法庭應妥速審理案件，另授權國防部得針對勤務法庭辦理行政訴訟事件有關之技術性或細節性事項，訂定審理細則。","review":{"note":"保留，送院會處理","text":""}},{"no":"第七十一條","current":null,"versions":[{"bill":"201110006770000","text":"勤務法庭，由軍事審判官三人合議審理之。但簡易訴訟程序，得由軍事審判官一人獨任審理之。\n前項合議審判以庭長充任審判長，無庭長或庭長有事故時，以庭員中階高資深者充任之。","note":"參酌軍事審判法第二十四條第二項及第二十五條第一項，定明勤務法庭成員之組成以及審判長選派方式。"},{"bill":"202110033240000","text":"勤務法庭，由軍事審判官三人合議審理之。但簡易訴訟程序，得由軍事審判官一人獨任審理之。\n前項合議審判以庭長充任審判長，無庭長或庭長有事故時，以庭員中階高資深者充任之。","note":"參酌軍事審判法第二十四條第二項及第二十五條第一項，定明勤務法庭成員之組成以及審判長選派方式。"},{"bill":"202110036610000","text":"復審人及再申訴人不服權保會所為之復審或再申訴決定者，以勤務法庭為行政訴訟管轄法院。第二條所定權益爭議事件，得逕依行政訴訟法提起行政訴訟者，亦同。\n勤務法庭審理前項事件，除本法另有規定外，準用行政訴訟法之規定。\n勤務法庭之審理細則，由國防部定之。","note":"一、第一項前段定明不服復審或再申訴決定之行政訴訟管轄法院。又第二條所定有關軍人與權責機關間之相關權益爭議事件，如得依行政訴訟法逕行提起訴訟（例如確認訴訟或一般給付訴訟）時，亦應以勤務法庭為行政訴訟第一審管轄法院，爰於第一項後段定明。\n二、第二項定明勤務法庭審理事件，除本法另有規定外，應準用行政訴訟法審理。\n三、第三項定明授權國防部得針對勤務法庭辦理行政訴訟事件有關之技術性或細節性事項，訂定審理細則。"},{"bill":"202110044700000","text":"勤務法庭，由軍事審判官三人合議審理之。但簡易訴訟程序，得由軍事審判官一人獨任審理之。\n前項合議審判以庭長充任審判長，無庭長或庭長有事故時，以庭員中階高資深者充任之。","note":"參酌軍事審判法第二十四條第二項及第二十五條第一項，定明勤務法庭成員之組成以及審判長選派方式。"}],"changed":true,"final":"勤務法庭，由軍事審判官三人合議審理之。但簡易訴訟程序，得由軍事審判官一人獨任審理之。\n前項合議審判以庭長充任審判長，無庭長或庭長有事故時，以庭員中階高資深者充任之。","finalWhy":"參酌軍事審判法第二十四條第二項及第二十五條第一項，定明勤務法庭成員之組成以及審判長選派方式。","review":{"note":"照行政院提案通過","text":"受懲罰人依其經濟狀況不能一次完納罰款時，權責長官得酌情准予免息分期繳納。罰款未完納前仍具現役軍人身分者，得自其月支待遇總額中扣抵至多三分之一。\n前項經濟狀況認定基準、分期期數及扣抵等相關事項之辦法，由國防部定之。"}},{"no":"第七十二條","current":null,"versions":[{"bill":"201110006770000","text":"合議庭之組織，因軍事審判官迴避或其他原因致員額不足時，得由地方軍事法院調充之。","note":"定明勤務法庭合議庭因成員員額不足時之調充方式。"},{"bill":"202110033240000","text":"合議庭之組織，因軍事審判官迴避或其他原因致員額不足時，得由地方軍事法院調充之。","note":"定明勤務法庭合議庭因成員員額不足時之調充方式。"},{"bill":"202110036610000","text":"勤務法庭，由軍事審判官三人合議審理之。但簡易訴訟程序，得由軍事審判官一人獨任審理之。\n前項合議審判以庭長充任審判長，無庭長或庭長有事故時，以庭員中階高資深者充任之。","note":"參酌軍事審判法第二十四條第二項及第二十五條第一項，定明勤務法庭成員之組成以及審判長選派方式。"},{"bill":"202110044700000","text":"合議庭之組織，因軍事審判官迴避或其他原因致員額不足時，得由地方軍事法院調充之。","note":"定明勤務法庭合議庭因成員員額不足時之調充方式。"}],"changed":true,"final":"合議庭之組織，因軍事審判官迴避或其他原因致員額不足時，得由地方軍事法院調充之。","finalWhy":"定明勤務法庭合議庭因成員員額不足時之調充方式。","review":{"note":"照行政院提案通過","text":"罰款受懲罰人，經處分機關定相當期間催告，屆期未履行者，得以該懲罰處分為執行名義，移送行政執行。\n前項執行不受陸海空軍軍官士官服役條例第五十一條第三項規定之限制。"}},{"no":"第七十三條","current":null,"versions":[{"bill":"201110006770000","text":"勤務法庭受理行政訴訟事件免徵裁判費。但依行政訴訟法第九十八條之六第一項第一款規定徵收者，不在此限。","note":"定明向勤務法庭起訴時，除行政訴訟法第九十八條之六第一款所定之影印費等規費外，不另徵收訴訟費用，俾適切保障軍人權益。"},{"bill":"202110033240000","text":"勤務法庭受理行政訴訟事件免徵裁判費。但依行政訴訟法第九十八條之六第一項第一款規定徵收者，不在此限。","note":"定明向勤務法庭起訴時，除行政訴訟法第九十八條之六第一款所定之影印費等規費外，不另徵收訴訟費用，俾適切保障軍人權益。"},{"bill":"202110036610000","text":"合議庭之組織，因軍事審判官迴避或其他原因致員額不足時，得由地方軍事法院調充之。","note":"定明勤務法庭合議庭因成員員額不足時之調充方式。"},{"bill":"202110044700000","text":"勤務法庭受理行政訴訟事件免徵裁判費。但依行政訴訟法第九十八條之六第一項第一款規定徵收者，不在此限。","note":"定明向勤務法庭起訴時，除行政訴訟法第九十八條之六第一款所定之影印費等規費外，不另徵收訴訟費用，俾適切保障軍人權益。"}],"changed":true,"final":"勤務法庭受理行政訴訟事件免徵裁判費。但依行政訴訟法第九十八條之六第一項第一款規定徵收者，不在此限。","finalWhy":"定明向勤務法庭起訴時，除行政訴訟法第九十八條之六第一項第一款所定之影印費等規費外，不另徵收訴訟費用，俾適切保障軍人權益。","review":null},{"no":"第七十四條","current":null,"versions":[{"bill":"201110006770000","text":"對於勤務法庭之裁判，得依行政訴訟法第三編或第四編規定，上訴或抗告於勤務法庭所在地之高等行政法院。","note":"勤務法庭為復審及再申訴事件之第一審行政訴訟管轄法院，爰定明不服勤務法庭裁判者，應依行政訴訟法第三編「上訴審程序」或第四編「抗告程序」之規定，向勤務法庭所在地之高等行政法院提起上訴或抗告。至本條所稱高等行政法院，指行政訴訟法第三條之一之高等行政法院高等行政訴訟庭，併予敘明。"},{"bill":"202110033240000","text":"對於勤務法庭之裁判，得依行政訴訟法第三編或第四編規定，上訴或抗告於勤務法庭所在地之高等行政法院。","note":"勤務法庭為復審及再申訴事件之第一審行政訴訟管轄法院，爰定明不服勤務法庭裁判者，應依行政訴訟法第三編「上訴審程序」或第四編「抗告程序」之規定，向勤務法庭所在地之高等行政法院提起上訴或抗告。至本條所稱高等行政法院，指行政訴訟法第三條之一之高等行政法院高等行政訴訟庭，併予敘明。"},{"bill":"202110036610000","text":"勤務法庭受理行政訴訟事件免徵裁判費。但依行政訴訟法第九十八條之六第一項第一款規定徵收者，不在此限。","note":"定明向勤務法庭起訴時，除行政訴訟法第九十八條之六第一款所定之影印費等規費外，不另徵收訴訟費用，俾適切保障軍人權益。"},{"bill":"202110044700000","text":"對於勤務法庭之裁判，得依行政訴訟法第三編或第四編規定，上訴或抗告於勤務法庭所在地之高等行政法院。","note":"勤務法庭為復審及再申訴事件之第一審行政訴訟管轄法院，爰定明不服勤務法庭裁判者，應依行政訴訟法第三編「上訴審程序」或第四編「抗告程序」之規定，向勤務法庭所在地之高等行政法院提起上訴或抗告。至本條所稱高等行政法院，指行政訴訟法第三條之一之高等行政法院高等行政訴訟庭，併予敘明。"}],"changed":true,"final":"對於勤務法庭之裁判，得依行政訴訟法第三編或第四編規定，上訴或抗告於勤務法庭所在地之高等行政法院。","finalWhy":"勤務法庭為復審及再申訴事件之第一審行政訴訟管轄法院，爰定明不服勤務法庭裁判者，應依行政訴訟法第三編「上訴審程序」或第四編「抗告程序」之規定，向勤務法庭所在地之高等行政法院提起上訴或抗告。至本條所稱高等行政法院，指行政訴訟法第三條之一之高等行政法院高等行政訴訟庭，併予敘明。","review":null},{"no":"第七十五條","current":null,"versions":[{"bill":"201110006770000","text":"本法規定於戰時、戒嚴或動員實施階段，有一部或全部暫停適用之必要者，其暫停適用之範圍或地域，由國防部以命令定之。\n前項情形，本法所定期間停止進行，自恢復適用之次日起，重行起算。","note":"一、中央法規標準法第十九條第一項規定「法規因國家遭遇非常事故，一時不能適用者，得暫停適用其一部或全部。」，鑒於國家於軍事審判法第七條所定戰時、戒嚴法第一條所定宣告戒嚴及全民防衛動員準備法第二條第一項第二款所定動員實施階段，係國家遭逢戰爭、叛亂、戰事將發生或緊急危難。由於國家已進入非常時期，各級軍事單位及所有軍人應專注於軍事任務之執行，爰於第一項定明國防部得以命令暫時停止適用本法之一部或全部（如僅停止申訴或再申訴之救濟），或於特定地域（如戒嚴法第二條第一項所定之警戒地域及接戰地域二種戒嚴地域）暫停適用。至停止適用之地域或範圍，除應首重國家安全之維護外，仍應視當下國家資源及人力現況，適足兼顧軍人之基本權保障。例如保全程序等暫時權利保護之規定，非有極為特殊且重大之危難，即不宜暫停適用，併予敘明。\n二、本法所定期間於第一項暫停適用之非常時期內，應停止進行，並於第一項暫停適用之規定恢復適用之次日起重行起算，爰為第二項規定，以臻明確。"},{"bill":"202110033240000","text":"本法規定於戰時、戒嚴或動員實施階段，有一部或全部暫停適用之必要者，其暫停適用之範圍或地域，由國防部以命令定之。\n前項情形，本法所定期間停止進行，自恢復適用之次日起，重行起算。","note":"一、中央法規標準法第十九條第一項規定「法規因國家遭遇非常事故，一時不能適用者，得暫停適用其一部或全部。」，鑒於國家於軍事審判法第七條所定戰時、戒嚴法第一條所定宣告戒嚴及全民防衛動員準備法第二條第一項第二款所定動員實施階段，係國家遭逢戰爭、叛亂、戰事將發生或緊急危難。由於國家已進入非常時期，各級軍事單位及所有軍人應專注於軍事任務之執行，爰於第一項定明國防部得以命令暫時停止適用本法之一部或全部（如僅停止申訴或再申訴之救濟），或於特定地域（如戒嚴法第二條第一項所定之警戒地域及接戰地域二種戒嚴地域）暫停適用。至停止適用之地域或範圍，除應首重國家安全之維護外，仍應視當下國家資源及人力現況，適足兼顧軍人之基本權保障。例如保全程序等暫時權利保護之規定，非有極為特殊且重大之危難，即不宜暫停適用，併予敘明。\n二、本法所定期間於第一項暫停適用之非常時期內，應停止進行，並於第一項暫停適用之規定恢復適用之次日起重行起算，爰為第二項規定，以臻明確。"},{"bill":"202110036610000","text":"對於勤務法庭之裁判，得依行政訴訟法第三編或第四編規定，上訴或抗告於勤務法庭所在地之高等行政法院。","note":"勤務法庭為復審及再申訴事件之第一審行政訴訟管轄法院，爰定明不服勤務法庭裁判者，應依行政訴訟法第三編「上訴審程序」或第四編「抗告程序」之規定，向勤務法庭所在地之高等行政法院提起上訴或抗告。至本條所稱高等行政法院，指行政訴訟法第三條之一之高等行政法院高等行政訴訟庭，併予敘明。"},{"bill":"202110044700000","text":"本法規定於戰時、戒嚴或動員實施階段，有一部或全部暫停適用之必要者，其暫停適用之範圍或地域，由國防部以命令定之。\n前項情形，本法所定期間停止進行，自恢復適用之次日起，重行起算。","note":"一、中央法規標準法第十九條第一項規定「法規因國家遭遇非常事故，一時不能適用者，得暫停適用其一部或全部。」，鑒於國家於軍事審判法第七條所定戰時、戒嚴法第一條所定宣告戒嚴及全民防衛動員準備法第二條第一項第二款所定動員實施階段，係國家遭逢戰爭、叛亂、戰事將發生或緊急危難。由於國家已進入非常時期，各級軍事單位及所有軍人應專注於軍事任務之執行，爰於第一項定明國防部得以命令暫時停止適用本法之一部或全部（如僅停止申訴或再申訴之救濟），或於特定地域（如戒嚴法第二條第一項所定之警戒地域及接戰地域二種戒嚴地域）暫停適用。至停止適用之地域或範圍，除應首重國家安全之維護外，仍應視當下國家資源及人力現況，適足兼顧軍人之基本權保障。例如保全程序等暫時權利保護之規定，非有極為特殊且重大之危難，即不宜暫停適用，併予敘明。\n二、本法所定期間於第一項暫停適用之非常時期內，應停止進行，並於第一項暫停適用之規定恢復適用之次日起重行起算，爰為第二項規定，以臻明確。"}],"changed":true,"final":"本法規定於戰時、戒嚴或動員實施階段，有一部或全部暫停適用之必要者，其暫停適用之範圍或地域，由國防部以命令定之。\n前項情形，本法所定期間停止進行，自恢復適用之次日起，重行起算。","finalWhy":"一、中央法規標準法第十九條第一項規定「法規因國家遭遇非常事故，一時不能適用者，得暫停適用其一部或全部。」，鑒於國家於軍事審判法第七條所定戰時、戒嚴法第一條所定宣告戒嚴及全民防衛動員準備法第二條第二款所定動員實施階段，係國家遭逢戰爭、叛亂、戰事將發生或緊急危難。由於國家已進入非常時期，各級軍事單位及所有軍人應專注於軍事任務之執行，爰於第一項定明國防部得以命令暫時停止適用本法之一部或全部（如僅停止申訴或再申訴之救濟），或於特定地域（如戒嚴法第二條第一項所定之警戒地域及接戰地域二種戒嚴地域）暫停適用。至停止適用之地域或範圍，除應首重國家安全之維護外，仍應視當下國家資源及人力現況，適足兼顧軍人之基本權保障。例如保全程序等暫時權利保護之規定，非有極為特殊且重大之危難，即不宜暫停適用，併予敘明。\n二、本法所定期間於第一項暫停適用之非常時期內，應停止進行，並於第一項暫停適用之規定恢復適用之次日起重行起算，爰為第二項規定，以臻明確。","review":null},{"no":"第七十六條","current":null,"versions":[{"bill":"201110006770000","text":"受軍事教育條例第五條第一項第四款軍事養成教育，且不具軍人身分之學生，於基礎教育期間對於權責機關所為行政處分或管理措施不服之救濟，準用本法之規定。","note":"一、鑒於部分於國防部及所屬機關（構）、部隊或學校接受基礎教育之學生尚未取得軍人身分，其中依軍事教育條例第五條第一項第四款所設之「軍事養成教育」班隊，係針對已具大學、專科或中等教育學歷者所實施，並授予軍事學資，此類學生不服權責機關對其所為之行政處分或管理措施，現行係依同條第三項授權訂定之軍事學校及軍事訓練機構學員生修業規則第七條之一規定，向學校之申訴評議委員會提起申訴。惟審酌此類學生已入營報到，並有接受軍事教育或從事軍事勤務之事實，具準軍人之身分，為使國軍內部人員之救濟程序趨於一致，爰定明不服權責機關對其所為行政處分或管理措施之救濟，準用本法之規定。至於現行軍事學校及軍事訓練機構學員生修業規則有關此類學生之申訴機制，應於本法施行後配合檢討修正，或於第五十九條第三項授權訂定之辦法中，定明此類學生之申訴，應由該軍事學校或軍事訓練機構之評議委員會受理，以避免出現不同類型與法律效果之申訴制度。\n二、另受軍事教育條例第五條第一項第一款至第三款「大學教育」、「專科教育」及「中等學校教育」之學生，仍應分別依大學法第三十三條至第三十三條之二、專科學校法第四十二條、高級中等教育法第五十四條或國民教育法第二十條之一規定提起救濟，不在本法準用範圍之列，併予敘明。"},{"bill":"202110033240000","text":"受軍事教育條例第五條第一項第四款軍事養成教育，且不具軍人身分之學生，於基礎教育期間對於權責機關所為行政處分或管理措施不服之救濟，準用本法之規定。","note":"一、鑒於部分於國防部及所屬機關（構）、部隊或學校接受基礎教育之學生尚未取得軍人身分，其中依軍事教育條例第五條第一項第四款所設之「軍事養成教育」班隊，係針對已具大學、專科或中等教育學歷者所實施，並授予軍事學資，此類學生不服權責機關對其所為之行政處分或管理措施，現行係依同條第三項授權訂定之軍事學校及軍事訓練機構學員生修業規則第七條之一規定，向學校之申訴評議委員會提起申訴。惟審酌此類學生已入營報到，並有接受軍事教育或從事軍事勤務之事實，具準軍人之身分，為使國軍內部人員之救濟程序趨於一致，爰定明不服權責機關對其所為行政處分或管理措施之救濟，準用本法之規定。至於現行軍事學校及軍事訓練機構學員生修業規則有關此類學生之申訴機制，應於本法施行後配合檢討修正，或於第五十九條第三項授權訂定之辦法中，定明此類學生之申訴，應由該軍事學校或軍事訓練機構之評議委員會受理，以避免出現不同類型與法律效果之申訴制度。\n二、另受軍事教育條例第五條第一項第一款至第三款「大學教育」、「專科教育」及「中等學校教育」之學生，仍應分別依大學法第三十三條至第三十三條之二、專科學校法第四十二條、高級中等教育法第五十四條或國民教育法第二十條之一規定提起救濟，不在本法準用範圍之列，併予敘明。"},{"bill":"202110036610000","text":"本法規定 於五日內決定之。\n前項再申訴決定得由地方軍事法院官兵權益保障會專任委員三人合議行之，不適用軍人權益事件處理法第十條第一項規定。"}},{"no":"第七十七條","current":null,"versions":[{"bill":"201110006770000","text":"本法施行前，已依其他法令提起救濟而尚未終結之事件，除已繫屬於行政法院之事件依原訴訟程序規定審理外，應依本法所定程序終結之。但已依法定程序進行之行為，效力不受影響。","note":"本法施行前，已依訴願法、國軍官兵權益保障審議要點或其他機關內部法令提起救濟之事件，如尚未處理完畢，於本法施行後，應即依本法所定程序終結之，例如因懲罰而提起之訴願事件，受理訴願機關應將事件移送原處分機關所在地之權保會審議。至已繫屬行政法院之事件仍依原訴訟程序審理。另為避免程序之勞費，於但書定明本法施行前已進行之程序，效力不受影響。"},{"bill":"202110033240000","text":"本法施行前，已依其他法令提起救濟而尚未終結之事件，除已繫屬於行政法院之事件依原訴訟程序規定審理外，應依本法所定程序終結之。但已依法定程序進行之行為，效力不受影響。","note":"本法施行前，已依訴願法、國軍官兵權益保障審議要點或其他機關內部法令提起救濟之事件，如尚未處理完畢，於本法施行後，應即依本法所定程序終結之，例如因懲罰而提起之訴願事件，受理訴願機關應將事件移送原處分機關所在地之權保會審議。至已繫屬行政法院之事件仍依原訴訟程序審理。另為避免程序之勞費，於但書定明本法施行前已進行之程序，效力不受影響。"},{"bill":"202110036610000","text":"受軍事教育條例第五條第一項第四款軍事養成教育，且不具軍人身分之學生，於基礎教育期間對於權責機關所為行政處分或管理措施不服之救濟，準用本法之規定。","note":"一、鑒於部分於國防部及所屬機關（構）、部隊或學校接受基礎教育之學生尚未取得軍人身分，其中依軍事教育條例第五條第一項第四款所設之「軍事養成教育」班隊，係針對已具大學、專科或中等教育學歷者所實施，並授予軍事學資，此類學生不服權責機關對其所為之行政處分或管理措施，現行係依同條第三項授權訂定之軍事學校及軍事訓練機構學員生修業規則第七條之一規定，向學校之申訴評議委員會提起申訴。惟審酌此類學生已入營報到，並有接受軍事教育或從事軍事勤務之事實，具準軍人之身分，為使國軍內部人員之救濟程序趨於一致，爰定明不服權責機關對其所為行政處分或管理措施之救濟，準用本法之規定。至於現行軍事學校及軍事訓練機構學員生修業規則有關此類學生之申訴機制，應於本法施行後配合檢討修正，或於第六十條第三項授權訂定之辦法中，定明此類學生之申訴，應由該軍事學校或軍事訓練機構之評議委員會受理，以避免出現不同類型與法律效果之申訴制度。\n二、另受軍事教育條例第五條第一項第一款至第三款「大學教育」、「專科教育」及「中等學校教育」之學生，仍應分別依大學法第三十三條至第三十三條之二、專科學校法第四十二條、高級中等教育法第五十四條或國民教育法第二十條之一規定提起救濟，不在本法準用範圍之列，併予敘明。"},{"bill":"202110044700000","text":"本法施行前，已依其他法令提起救濟而尚未終結之事件，除已繫屬於行政法院之事件依原訴訟程序規定審理外，應依本法所定程序終結之。但已依法定程序進行之行為，效力不受影響。","note":"本法施行前，已依訴願法、國軍官兵權益保障審議要點或其他機關內部法令提起救濟之事件，如尚未處理完畢，於本法施行後，應即依本法所定程序終結之，例如因懲罰而提起之訴願事件，受理訴願機關應將事件移送原處分機關所在地之權保會審議。至已繫屬行政法院之事件仍依原訴訟程序審理。另為避免程序之勞費，於但書定明本法施行前已進行之程序，效力不受影響。"}],"changed":true,"final":"本法施行前，已依其他法令提起救濟而尚未終結之事件，除已繫屬於行政法院之事件依原訴訟程序規定審理外，應依本法所定程序終結之。但已依法定程序進行之行為，效力不受影響。","finalWhy":"本法施行前，已依訴願法、國軍官兵權益保障審議要點或其他機關內部法令提起救濟之事件，如尚未處理完畢，於本法施行後，應即依本法所定程序終結之，例如因懲罰而提起之訴願事件，受理訴願機關應將事件移送原處分機關所在地之權保會審議。至已繫屬行政法院之事件仍依原訴訟程序審理。另為避免程序之勞費，於但書定明本法施行前已進行之程序，效力不受影響。","review":{"note":"照行政院提案通過","text":"軍人之違紀行為於戰時、戒嚴或動員實施階段，經調查屬實且有即時懲罰之必要者，權責長官得以言詞下達懲罰後，逕為執行，不適用第五十七條至第六十六條規定。"}},{"no":"第七十八條","current":null,"versions":[{"bill":"201110006770000","text":"本法施行日期，由行政院定之。","note":"考量本法將於高等軍事法院設勤務法庭，審理軍人與國家間公法爭議事件之第一審行政訴訟，因相關行政及人事作業（例如辦理行政訴訟軍事審判官之培訓及考核）之籌備及配套措施，均尚待與相關機關協調，以確保軍人權益相關行政訴訟事務運作之公正性及適法性，爰定明本法施行日期，由行政院定之。"},{"bill":"202110033240000","text":"本法施行日期，由行政院定之。","note":"考量本法將於高等軍事法院設勤務法庭，審理軍人與國家間公法爭議事件之第一審行政訴訟，因相關行政及人事作業（例如辦理行政訴訟軍事審判官之培訓及考核）之籌備及配套措施，均尚待與相關機關協調，以確保軍人權益相關行政訴訟事務運作之公正性及適法性，爰定明本法施行日期，由行政院定之。"},{"bill":"202110036610000","text":"本法施行前，已依其他法令提起救濟而尚未終結之事件，除已繫屬於行政法院之事件依原訴訟程序規定審理外，應依本法所定程序終結之。但已依法定程序進行之行為，效力不受影響。","note":"本法施行前，已依訴願法、國軍官兵權益保障審議要點或其他機關內部法令提起救濟之事件，如尚未處理完畢，於本法施行後，應即依本法所定程序終結之，例如因懲罰而提起之訴願事件，受理訴願機關應將事件移送原處分機關所在地之權保會審議。至已繫屬行政法院之事件仍依原訴訟程序審理。另為避免程序之勞費，於但書定明本法施行前已進行之程序，效力不受影響。"},{"bill":"202110044700000","text":"本法施行日期，由行政院定之。","note":"考量本法將於高等軍事法院設勤務法庭，審理軍人與國家間公法爭議事件之第一審行政訴訟，因相關行政及人事作業（例如辦理行政訴訟軍事審判官之培訓及考核）之籌備及配套措施，均尚待與相關機關協調，以確保軍人權益相關行政訴訟事務運作之公正性及適法性，爰定明本法施行日期，由行政院定之。"}],"changed":true,"final":"本法施行日期，由行政院定之。","finalWhy":"考量本法將於高等軍事法院設勤務法庭，審理軍人與國家間公法爭議事件之第一審行政訴訟，因相關行政及人事作業（例如辦理行政訴訟軍事審判官之培訓及考核）之籌備及配套措施，均尚待與相關機關協調，以確保軍人權益相關行政訴訟事務運作之公正性及適法性，爰定明本法施行日期，由行政院定之。","review":null},{"no":"第七十九條","current":null,"versions":[{"bill":"202110036610000","text":"本法施行日期，由行政院定之。","note":"考量本法將於高等軍事法院設勤務法庭，審理軍人與國家間公法爭議事件之第一審行政訴訟，因相關行政及人事作業（例如辦理行政訴訟軍事審判官之培訓及考核）之籌備及配套措施，均尚待與相關機關協調，以確保軍人權益相關行政訴訟事務運作之公正性及適法性，爰定明本法施行日期，由行政院定之。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2024-03-01","stage":"一讀","code":"院會-11-1-3","bill":"201110006770000","gazref":"113卷005期5187號 10-10頁"},{"date":"2024-04-19","stage":"一讀","code":"院會-11-1-10","bill":"202110033240000","gazref":"113卷028期5210號 8-8頁"},{"date":"2024-04-24","code":"聯席會議-11-1-35,36-1","title":"第11屆第1會期外交及國防、司法及法制委員會第1次聯席會議","gazref":"113卷032期5214號 251-303頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024041990/details?meetingDate=113/04/24","full":["https://ivod.ly.gov.tw/Play/Full/1M/15844"],"pdf":[{"u":"https://ppg.ly.gov.tw function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

function card(title, sub, text, base, o) {

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });

      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
