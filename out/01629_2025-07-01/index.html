<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>證券投資人及期貨交易人保護法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

百零八條規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","versions":[{"bill":"202110012190000","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有涉違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，經檢察官起訴後，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"一、修正第一項序文。\n二、本法目的為促進證券期貨市場健全發展，本條所指違法情事不應以辦理第十條業務為限，爰刪除序文「辦理前條第一項業務」文字。\n三、為落實公司治理精神，擴大增訂證券交易法第二十條、第三十二條有關財報或公開說明書不實等證券詐欺行為、證券交易法第一百七十一條第一項第二款、第三款有關非常規交易、侵占、背信等不法態樣。\n四、本條賦予保護機構啟動裁判解任權之時點，以其「發現」前述態樣發生時，惟應以起訴或判決之時點而定，文字語意模糊恐造成爭議。若以判決確定方能啟動裁判解任權，恐因訴訟曠日費時，超過本條第二項有關兩年除斥期間，未能及時保障投資人權益，故應以起訴之時點為準。爰修正第一項序文文字為「涉違反」前述不法態樣並增列「經檢察官起訴後」，保護機構即得提起代表訴訟、解任訴訟。"},{"bill":"202110048420000","text":"保護機構辦理前條第一項業務，發現上市、上櫃或興櫃公司之董事或監察人，有證券交易法第一百五十五條、第一百五十七條之一或期貨交易法第一百零六條至第一百零八條規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事、監察人或已卸任之董事、監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事、監察人或已卸任之董事、監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"為確保公司及其股東權益，貫徹「證券投資人及期貨交易人保護法」第十條之一第一項第一款董事及監察人失格規定之公益目的，爰提案修正第十條之一第一項第二款，明列已卸任之董事或監察人。\n配合前項法條修正，第十條之一第七項一併明列已卸任之董事或監察人。"},{"bill":"202110097350000","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"實務上保護機構提出訴訟未必皆由第十條第一項所引起，為免爭議，刪除「辦理前條第一項業務」，並將違反可能行為等情事明列，爰修正本條第一項。"},{"bill":"202110107200000","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"一、第一項序文修正如下：\n(一)因實務上就保護機構依第一項所提訴訟，是否係因辦理第十條第一項業務而提起，有不同見解，為免爭議，爰刪除第一項序文「辦理前條第一項業務」之文字。\n(二)經營者誠信乃公司治理最重要之基石，公司董事或監察人有證券交易法第二十條、第三十二條財務報告或公開說明書不實等證券詐欺、證券交易法第一百七十一條第一項第二款、第三款非常規交易、侵占、背信等不法行為，亦屬不適合擔任董事、監察人職務之情事，不論其等是否執行所任公司業務，均有予以解任之必要，亦即在他公司有第一項序文所列不法行為者，亦應將之作為對其擔任現任公司董事或監察人之解任事由，即得為跨公司解任，爰修正第一項序文，併同將違反該等行為之情形明文列舉為保護機構得提起代表訴訟、解任訴訟之事由，以期對涉及證券、期貨市場重大不法行為之董事或監察人予以究責，俾達本法保護公益之立法目的。另為期明確，爰明列第一項序文引用條文之項次。\n二、第二項至第九項未修正。"},{"bill":"202110105180000","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"第一項序文修正如下：\n一、因實務上就保護機構依第一項所提訴訟，是否係因辦理第十條第一項業務而提起，有不同見解，為免爭議，爰刪除第一項序文「辦理前條第一項業務」之文字。\n二、經營者誠信乃公司治理最重要之基石，公司董事或監察人有證券交易法第二十條、第三十二條財務報告或公開說明書不實等證券詐欺、證券交易法第一百七十一條第一項第二款、第三款非常規交易、侵占、背信等不法行為，亦屬不適合擔任董事、監察人職務之情事，不論其等是否執行所任公司業務，均有予以解任之必要，亦即在他公司有第一項序文所列不法行為者，亦應將之作為對其擔任現任公司董事或監察人之解任事由，即得為跨公司解任，爰修正第一項序文，併同將違反該等行為之情形明文列舉為保護機構得提起代表訴訟、解任訴訟之事由，以期對涉及證券、期貨市場重大不法行為之董事或監察人予以究責，俾達本法保護公益之立法目的。另為期明確，爰明列第一項序文引用條文之項次。"},{"bill":"202110107610000","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"一、實務上對於投保機構提起第一項訴訟是否係因辦理第十條第一項業務存有不同見解，為免爭議，爰刪除第一項序文「辦理前條第一項」等文字。\n二、為強化公司治理，董事、監察人等公司經營者本應基於誠信，善盡忠實義務。因此，公司董事或監察人有財報或公開說明書不實、非常規交易、侵占、背信等不法行為，亦屬於不適任董事、監察人事由，不論其是否執行所任公司職務，均有解認知必要，亦即得跨公司解任。"},{"bill":"201110102470000","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"一、第一項序文修正如下：\n(一)因實務上就保護機構依第一項所提訴訟，是否係因辦理第十條第一項業務而提起，有不同見解，為免爭議，爰刪除第一項序文「辦理前條第一項業務」之文字。\n(二)經營者誠信乃公司治理最重要之基石，公司董事或監察人有證券交易法第二十條、第三十二條財務報告或公開說明書不實等證券詐欺、證券交易法第一百七十一條第一項第二款、第三款非常規交易、侵占、背信等不法行為，亦屬不適合擔任董事、監察人職務之情事，不論其等是否執行所任公司業務，均有予以解任之必要，亦即在他公司有第一項序文所列不法行為者，亦應將之作為對其擔任現任公司董事或監察人之解任事由，即得為跨公司解任，爰修正第一項序文，併同將違反該等行為之情形明文列舉為保護機構得提起代表訴訟、解任訴訟之事由，以期對涉及證券、期貨市場重大不法行為之董事或監察人予以究責，俾達本法保護公益之立法目的。另為期明確，爰明列第一項序文引用條文之項次。\n二、第二項至第九項未修正。"},{"bill":"202110126740000","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有違反證券交易法第二十條、第一百五十五條、第一百五十七條之一或期貨交易法第一百零六條至第一百零八條規定，或有證券交易法第三十二條、第一百七十一條之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"一、保護機構（財團法人證券投資人及期貨交易人保護中心）依本條第一項所提訴訟，是否係因辦理第十條第一項業務而提起，有不同見解，為強化公司治理保護投資交易人，爰刪除第一項「辦理前條第一項業務」之文字。\n二、由於經濟環境變遷，金融競爭日熾，特別在亞洲金融危機後，陸續爆發多起企業掏空舞弊案件，由於董監事可能濫用職權和違法，致影響公司經營績效與財務損害。\n三、當公司董事或監察人有證券交易法第二十條、第三十二條財務報告或公開說明書不實等證券詐欺、證券交易法第一百七十一條第非常規交易、侵占、背信等不法行為，亦屬不適合擔任董事、監察人職務之情事，不論其等是否執行所任公司業務，均有予以解任之必要，爰修正本條第一項，以期對涉及證券、期貨市場重大不法行為之董事或監察人予以究責，俾達本法保護公益之立法目的。\n四、第二項至第九項未修正。"},{"bill":"202110128420000","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，或已卸任之董事或監察人，有違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","note":"一、為更落實保障公司經營及投資人權益，建立公平安全之市場交易環境，促進公司治理合法合規，並擴充保護機構經費來源，以因應未來業務發展，明文詳列保護機構得提起代表訴訟、解任訴訟之獨立事由。\n二、爰提案修正本條第一項部分文字，除因實務上就保護機構依第一項所提訴訟，是否係因辦理第十條第一項業務而提起，有不同見解，為免爭議，爰刪除第一項序文「辦理前條第一項業務」之文字外，並增列若違反證券交易法第二十條、第三十二條及第一百七十一條第一項第二款、第三款等相關規定之情事者，亦屬不適合擔任董事、監察人職務之情事，不論其等是否執行所任公司業務，均有予以解任之必要，而已卸任之董事或監察人，亦照相關規定辦理。\n三、第二項至第九項文字未修正。"}],"changed":true,"final":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。","finalWhy":"","review":{"note":"照行政院提案通過","text":"保護機構發現上市、上櫃或興櫃公司之董事或監察人，有違反證券交易法第二十條第一項、第二項、第一百五十五條第一項、第二項、第一百五十七條之一第一項、第二項、期貨交易法第一百零六條至第一百零八條第一項規定，或有證券交易法第三十二條第一項情事而無同條第二項免責事由、第一百七十一條第一項第二款或第三款規定之情事，或執行業務有重大損害公司之行為或違反法令或章程之重大事項，得依下列規定辦理：\n一、以書面請求公司之監察人為公司對董事提起訴訟，或請求公司之董事會為公司對監察人提起訴訟，或請求公司對已卸任之董事或監察人提起訴訟。監察人、董事會或公司自保護機構請求之日起三十日內不提起訴訟時，保護機構得為公司提起訴訟，不受公司法第二百十四條及第二百二十七條準用第二百十四條之限制。\n二、訴請法院裁判解任公司之董事或監察人，不受公司法第二百條及第二百二十七條準用第二百條之限制，且解任事由不以起訴時任期內發生者為限。\n前項第二款訴請法院裁判解任權，自保護機構知有解任事由時起，二年間不行使，或自解任事由發生時起，經過十年而消滅。\n第三十四條至第三十六條規定，於保護機構依第一項規定提起訴訟、上訴或聲請保全程序、執行程序時，準用之。\n公司因故終止上市、上櫃或興櫃者，保護機構就該公司於上市、上櫃或興櫃期間有第一項所定情事，仍有前三項規定之適用。\n保護機構依第一項第一款規定提起訴訟時，就同一基礎事實應負賠償責任且有為公司管理事務及簽名之權之人，得合併起訴或為訴之追加；其職務關係消滅者，亦同。\n公司之監察人、董事會或公司依第一項第一款規定提起訴訟時，保護機構為維護公司及股東權益，於該訴訟繫屬中得為參加，並準用民事訴訟法第五十六條第一項規定。\n第一項第二款之董事或監察人，經法院裁判解任確定後，自裁判確定日起，三年內不得充任上市、上櫃或興櫃公司之董事、監察人及依公司法第二十七條第一項規定受指定代表行使職務之自然人，其已充任者，當然解任。\n第一項第二款之解任裁判確定後，由主管機關函請公司登記主管機關辦理解任登記。\n公司已依法設置審計委員會者，第一項及第六項所稱監察人，指審計委員會或其獨立董事成員。"}},{"no":"第二十條","current":"保護基金之動用，以下列各款為限：\n一、依第二十一條規定，償付證券投資人或期貨交易人之用。\n二、保護機構依本法執行業務之支出及其他必要費用。\n三、依本法規定提起之訴訟或提付仲裁所需之費用。\n四、其他經主管機關核准之用途。\n前項第二款之經費，以當年度保護基金之孳息為上限，編列預算辦理。但主管機關得視其財務、業務情況適當調整之。","versions":[{"bill":"202110097350000","text":"保護基金之動用，以下列各款為限：\n一、依第二十一條規定，償付證券投資人或期貨交易人之用。\n二、保護機構依本法執行業務之支出及其他必要費用。\n三、依本法規定提起之訴訟或提付仲裁所需之費用。\n四、其他經主管機關核准之用途。\n前項第二款之經費，以當年度保護基金之孳息及前三年保護基金孳息支應業務支出賸餘撥回基金累積數之合計為上限，編列預算辦理。但主管機關得視其財務、業務情況適當調整之。","note":"保護機構執行業務及其他必要支出，若以當年度孳息為上限，恐因利率變動及通貨膨脹造成孳息不足支應相關業務所需經費；另若孳息全數保留恐造成惜用，應訂定保留時限以資周全。綜上，爰修正本條第二項。"},{"bill":"202110107200000","text":"保護基金之動用，以下列各款為限：\n一、依第二十一條規定，償付證券投資人或期貨交易人之用。\n二、保護機構依本法執行業務之支出及其他必要費用。\n三、依本法規定提起之訴訟或提付仲裁所需之費用。\n四、其他經主管機關核准之用途。\n前項第二款之經費，以當年度保護基金孳息及歷年保護基金孳息支應業務支出賸餘撥回基金累積數之合計為上限，編列預算辦理。但主管機關得視其財務、業務情況適當調整之。","note":"一、第二項規定保護機構執行業務之支出及其他必要費用，以當年度保護基金之孳息為上限，惟此因利率變動而具不確定性，恐有不足支應保護機構執行業務所需經費之虞。為因應保護機構未來業務發展所需經費，考量歷年來保護基金孳息扣除業務支出之賸餘皆撥回保護基金，目前累積數額，應可優先提供保護機構未來年度孳息不足時之使用，且未動用依第十八條第一項規定各單位歷年來所提撥款項之總額，並不影響保護基金償付之功能，爰修正第二項，將歷年保護基金孳息支應業務支出賸餘撥回基金累積數之合計一併作為保護機構之經費來源。\n二、第一項未修正。"},{"bill":"202110105180000","text":"保護基金之動用，以下列各款為限：\n一、依第二十一條規定，償付證券投資人或期貨交易人之用。\n二、保護機構依本法執行業務之支出及其他必要費用。\n三、依本法規定提起之訴訟或提付仲裁所需之費用。\n四、其他經主管機關核准之用途。\n前項第二款之經費，以當年度保護基金孳息及歷年保護基金孳息支應業務支出賸餘撥回基金累積數之合計為上限，編列預算辦理。但主管機關得視其財務、業務情況適當調整之。","note":"第二項規定保護機構執行業務之支出及其他必要費用，以當年度保護基金之孳息為上限，惟此因利率變動而具不確定性，恐有不足支應保護機構執行業務所需經費之虞。為因應保護機構未來業務發展所需經費，考量歷年來保護基金孳息扣除業務支出之賸餘皆撥回保護基金，目前累積數額，應可優先提供保護機構未來年度孳息不足時之使用，且未動用依第十八條第一項規定各單位歷年來所提撥款項之總額，並不影響保護基金償付之功能，爰修正第二項，將歷年保護基金孳息支應業務支出賸餘撥回基金累積數之合計一併作為保護機構之經費來源。"},{"bill":"201110102470000","text":"保護基金之動用，以下列各款為限：\n一、依第二十一條規定，償付證券投資人或期貨交易人之用。\n二、保護機構依本法執行業務之支出及其他必要費用。\n三、依本法規定提起之訴訟或提付仲裁所需之費用。\n四、其他經主管機關核准之用途。\n前項第二款之經費，以當年度保護基金孳息及歷年保護基金孳息支應業務支出賸餘撥回基金累積數之合計為上限，編列預算辦理。但主管機關得視其財務、業務情況適當調整之。","note":"一、第二項規定保護機構執行業務之支出及其他必要費用，以當年度保護基金之孳息為上限，惟此因利率變動而具不確定性，恐有不足支應保護機構執行業務所需經費之虞。為因應保護機構未來業務發展所需經費，考量歷年來保護基金孳息扣除業務支出之賸餘皆撥回保護基金，目前累積數額，應可優先提供保護機構未來年度孳息不足時之使用，且未動用依第十八條第一項規定各單位歷年來所提撥款項之總額，並不影響保護基金償付之功能，爰修正第二項，將歷年保護基金孳息支應業務支出賸餘撥回基金累積數之合計一併作為保護機構之經費來源。\n二、第一項未修正。"},{"bill":"202110128420000","text":"保護基金之動用，以下列各款為限：\n一、依第二十一條規定，償付證券投資人或期貨交易人之用。\n二、保護機構依本法執行業務之支出及其他必要費用。\n三、依本法規定提起之訴訟或提付仲裁所需之費用。\n四、其他經主管機關核准之用途。\n前項第二款之經費，以當年度保護基金孳息及歷年保護基金孳息支應業務支出賸餘撥回基金累積數之合計為上限，編列預算辦理。但主管機關得視其財務、業務情況適當調整之。","note":"一、第二項規定保護機構執行業務之支出及其他必要費用，以當 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }

}

  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }

      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      btn.addEventListener('click', async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      });
      acts.append(btn);
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
</html>
