<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>通訊保障及監察法 2024 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"通訊保障及監察法","version":"01827:2024-07-12-修正","date":"2024-07-12","action":"修正","title":"通訊保障及監察法　2024 年 7 月修正","lede":"這次修正在法律裡新增「網路流量紀錄」，指使用電信服務後產生的設備識別資料、網際網路位址、通信時間、連線用量、網域名稱等不涉及通訊內容的紀錄。檢察官、司法警察官偵查犯罪時，調取通信紀錄或網路流量紀錄原則上要向法院聲請調取票，原本「最重本刑三年以上有期徒刑之罪」的限制刪除；調取姓名、地址、電信號碼等通訊使用者資料，不必再聲請調取票。電信事業和設置公眾電信網路者有保存、協助調取的義務，違反的罰鍰上限從 250 萬元提高到 500 萬元。調取網路流量紀錄後要通知當事人，違法調取要負損害賠償責任。行政院和台灣民眾黨黨團的提案在 2024 年 6 月 6 日由司法及法制委員會審查，另有四個委員提案逕付二讀。經過四次黨團協商，7 月 12 日院會逐條照協商條文或審查會條文通過，沒有表決。","summary":"新增「網路流量紀錄」，檢警向法院聲請調取票後可以調取；調取通信紀錄不再限於最重本刑三年以上的罪；姓名、地址等通訊使用者資料改為檢察官、司法警察官可以直接調取。","key":"01827_2024-07-12","props":[{"id":"201110047310000","who":"行政院","date":"2024-05-17","name":"「通訊保障及監察法部分條文修正草案」案。","url":"https://ppg.ly.gov.tw/ppg/bills/201110047310000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/14/LCEWA01_110114_00082.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"行政院函請審議「通訊保障及監察法部分條文修正草案」案。","arts":["第三條之一","第五條","第六條","第十一條之一","第十四條","第十四條之一","第二十九條","第三十一條"]},{"id":"202110050370000","who":"台灣民眾黨黨團","date":"2024-05-24","name":"「通訊保障及監察法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110050370000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/15/LCEWA01_110115_00068.pdf","proposers":["黃國昌","黃珊珊","吳春城"],"ncosign":0,"people":[["黃國昌","民眾黨","提案"],["黃珊珊","民眾黨","提案"],["吳春城","民眾黨","提案"]],"party":[["民眾黨",3]],"reason":"本院台灣民眾黨黨團，有鑑於因應日新月異之犯罪手法與科技發展，檢警調於偵辦犯罪時有使用科技方法之必要，始得有效打擊犯罪。配合同步修正刑事訴訟法增設「科技偵查」專章，有必要於通訊保障及監察法另增訂執法機關調取網路流量紀錄之規範，爰擬具「通訊保障及監察法部分條文修正草案」。是否有當？敬請公決。","arts":["第三條之一","第五條","第六條","第十一條之一","第十四條","第十四條之一","第二十九條","第三十一條"]},{"id":"202110053900000","who":"委員鍾佳濱等18人","date":"2024-06-07","name":"「通訊保障及監察法第三條之一、第十一條之一及第十八條之一條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110053900000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00484.pdf","proposers":["鍾佳濱","林宜瑾","賴瑞隆","陳素月"],"ncosign":14,"people":[["鍾佳濱","民進黨","提案"],["林宜瑾","民進黨","提案" "民進黨","連署"],["何欣純","民進黨","連署"],["陳培瑜","民進黨","連署"],["羅美玲","民進黨","連署"],["陳俊宇","民進黨","連署"],["李坤城","民進黨","連署"],["李柏毅","民進黨","連署"],["李昆澤","民進黨","連署"],["陳冠廷","民進黨","連署"],["張宏陸","民進黨","連署"]],"party":[["民進黨",21]],"reason":"本院委員林宜瑾、林楚茵等21人，鑒於近年網路詐騙、盜取個資、資安駭侵犯罪手法日新月異且愈趨猖獗，侵害民眾之財產權、生命與身體安全等，乃至危害國家社會安全。是故，為有效打擊網路犯罪，實有修正本法關於調取通信紀錄之限制、增訂保存及調取網路流量紀錄規定之必要，爰擬具「通訊保障及監察法部分條文修正草案」。是否有當？敬請公決。","arts":["第三條之一","第五條","第六條","第十一條之一","第十四條","第十四條之一","第二十九條","第三十一條"]},{"id":"202110057210000","who":"委員羅智強等16人","date":"2024-06-28","name":"「通訊保障及監察法第十五條及第十九條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110057210000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00482.pdf","proposers":["羅智強","謝龍介","翁曉玲","林沛祥"],"ncosign":12,"people":[["羅智強","國民黨","提案"],["謝龍介","國民黨","提案"],["翁曉玲","國民黨","提案"],["林沛祥","國民黨","提案"],["洪孟楷","國民黨","連署"],["王鴻薇","國民黨","連署"],["傅崐萁","國民黨","連署"],["林思銘","國民黨","連署"],["徐欣瑩","國民黨","連署"],["鄭正鈐","國民黨","連署"],["陳玉珍","國民黨","連署"],["丁學忠","國民黨","連署"],["張智倫","國民黨","連署"],["黃建賓","國民黨","連署"],["游顥","國民黨","連署"],["牛煦庭","國民黨","連署"]],"party":[["國民黨",16]],"reason":"本院委員羅智強、謝龍介、翁曉玲、林沛祥等16人，鑑於對人民秘密通訊自由權益之保護，避免政府調取人民通信紀錄與網路流量紀錄時，被調取人無從獲知被調取行為，致使無從進行救濟，以及明定違法調取應負損害賠償責任，保障人民秘密通訊自由及隱私權不受非法侵害，爰擬具「通訊保障及監察法第十五條及第十九條條文修正草案」。是否有當？敬請公決。","arts":["第十五條","第十九條"]}],"arts":[{"no":"第三條之一","current":"本法所稱通信紀錄者，謂電信使用人使用電信服務後，電信系統所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄。\n本法所稱之通訊使用者資料，謂電信使用者姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料。","versions":[{"bill":"201110047310000","text":"本法所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄。\n本法所稱通訊使用者資料，指用戶或電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料。\n本法所稱網路流量紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之通訊設備識別資料、網際網路位址與位置資訊、通信時間、連線用量與封包數量、網域名稱、應用服務類型及協定等紀錄。","note":"一、電信管理法於一百零八年六月二十六日制定公布，除部分條文自一百零九年十一月一日施行外，其餘條文自一百零九年七月一日施行。配合該法對於電信服務、公眾電信網路與通信紀錄之定義及規範，爰修正第一項通信紀錄及第二項通訊使用者資料之定義。\n二、為因應本法新增有關調取網路流量紀錄之規定，爰增訂第三項網路流量紀錄之定義。用戶或電信使用人使用電信服務後，公眾電信網路產生與網路連線有關之各種未涉及通訊內容之紀錄（Netflow Log），其類型繁多，爰將本法「網路流量紀錄」之資料類型加以限制，以求明確並符實需。"},{"bill":"202110050370000","text":"本法所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄。\n本法所稱通訊使用者資料，指用戶或電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料。\n本法所稱網路流量紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方與接收方之網際網路位址、通訊起迄時間、通訊埠、協定、封包大小及數量、查詢與回應之網域名稱系統及其域名解析器與域名伺服器協力查詢資源等未涉及通訊內容之紀錄。","note":"一、配合電信管理法修正第三條第一項第二款對於電信服務、公眾電信網路及通信紀錄之定義，爰修正第一項關於通信紀錄、第二項關於通訊使用者資料之定義。\n二、配合本次增設第十一條之一、第十四條之一關於調取網路流量紀錄之規定，為避免隱私權之過度干預與負保存紀錄義務者之過度負擔，爰於第三項明定網路流量紀錄之定義。"},{"bill":"202110053900000","text":"本法所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄。\n本法所稱通訊使用者資料，指用戶或電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料。\n本法所稱網路流量紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之通訊設備識別資料、網際網路位址與位置資訊、通信時間、連線用量與封包數量、網域名稱、應用服務類型及協定等紀錄。","note":"一、配合電信管理法對於電信服務、公眾電信網路與通信紀錄之定義及規範，爰修正第一項通信紀錄及第二項通訊使用者資料之定義。\n二、為因應本法新增有關調取網路流量紀錄之規定，爰增訂第三項網路流量紀錄之定義。用戶或電信使用人使用電信服務後，公眾電信網路產生與網路連線有關之各種未涉及通訊內容之紀錄（Netflow Log），其類型繁多，爰列舉本法「網路流量紀錄」之資料類型，以求明確。"},{"bill":"202110054990000","text":"本法所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄。\n本法所稱之通訊使用者資料，指用戶或電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料。\n本法所稱網路流量紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之通訊設備識別資料、網際網路位址與位置資訊、通信時間、連線用量與封包數量、網域名稱、應用服務類型及協定等紀錄。","note":"一、電信管理法於一百零八年六月二十六日制定公布，除部分條文自一百零九年十一月一日施行外，其餘條文自一百零九年七月一日施行。配合該法對於電信服務、公眾電信網路與通信紀錄之定義及規範，爰修正第一項通信紀錄及第二項通訊使用者資料之定義。\n二、為因應本法新增有關調取網路流量紀錄之規定，爰增訂第三項網路流量紀錄之定義。用戶或電信使用人使用電信服務後，公眾電信網路產生與網路連線有關之各種未涉及通訊內容之紀錄（NetflowLog），其類型繁多，爰將本法「網路流量紀錄」之資料類型加以限制，以求明確並符實需。"},{"bill":"202110055570000","text":"本法所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄。\n本法所稱通訊使用者資料，指用戶或電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料。\n本法所稱網路流量紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之通訊設備識別資料、網際網路位址與位置資訊、通信時間、連線用量與封包數量、網域名稱、應用服務類型及協定等紀錄。","note":"一、電信管理法於一百零八年六月二十六日制定公布，除部分條文自一百零九年十一月一日施行外，其餘條文自一百零九年七月一日施行。配合該法對於電信服務、公眾電信網路與通信紀錄之定義及規範，爰修正第一項通信紀錄及第二項通訊使用者資料之定義。\n二、為因應本法新增有關調取網路流量紀錄之規定，爰增訂第三項網路流量紀錄之定義。用戶或電信使用人使用電信服務後，公眾電信網路產生與網路連線有關之各種未涉及通訊內容之紀錄（Netflow Log），其類型繁多，爰將本法「網路流量紀錄」之資料類型加以限制，以求明確並符實需。"}],"changed":true,"final":"本法所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄。\n本法所稱通訊使用者資料，指用戶或電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料。\n本法所稱網路流量紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之通訊設備識別資料、網際網路位址與位置資訊、通信時間、連線用量與封包數量、網域名稱、應用服務類型及協定等未涉及通訊內容之紀錄。","finalWhy":"照委員所提修正動議通過。","review":{"note":"照委員鍾佳濱等7人所提修正動議通過","text":"本法所稱通信紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之發送方、接收方之電信號碼、通信時間、使用長度、位址、服務型態、信箱或位置資訊等紀錄。\n本法所稱通訊使用者資料，指用戶或電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料。\n本法所稱網路流量紀錄，指用戶或電信使用人使用電信服務後，公眾電信網路所產生之通訊設備識別資料、網際網路位址與位置資訊、通信時間、連線用量與封包數量、網域名稱、應用服務類型及協定等未涉及通訊內容之紀錄。"}},{"no":"第五條","current":"有事實足認被告或犯罪嫌疑人有下列各款罪嫌之一，並危害國家安全、經濟秩序或社會秩序情節重大，而有相當理由可信其通訊內容與本案有關，且不能或難以其他方法蒐集或調查證據者，得發通訊監察書。\n一、最輕本刑為三年以上有期徒刑之罪。\n二、刑法第一百條第二項之預備內亂罪、第一百零一條第二項之預備暴動內亂罪或第一百零六條第三項、第一百零九條第一項、第三項、第四項、第一百二十一條第一項、第一百二十二條第三項、第一百三十一條第一項、第一百四十二條、第一百四十三條第一項、第一百四十四條、第一百四十五條、第二百零一條之一、第二百五十六條第一項、第三項、第二百五十七條第一項、第四項、第二百九十八條第二項、第三百條、第三百三十九條、第三百三十九條之三或第三百四十六條之罪。\n三、貪污治罪條例第十一條第一項、第四項關於違背職務行為之行賄罪。\n四、懲治走私條例第二條第一項、第二項或第三條之罪。\n五、藥事法第八十二條第一項、第四項或第八十三條第一項、第四項之罪。\n六、證券交易法第一百七十三條第一項之罪。\n七、期貨交易法第一百十二條或第一百十三條第一項、第二項之罪。\n八、槍砲彈藥刀械管制條例第十二條第一項、第二項、第四項、第五項或第十三條第二項、第四項、第五項之罪。\n九、公職人員選舉罷免法第一百零二條第一項第一款之罪。\n十、農會法第四十七條之一或第四十七條之二之罪。\n十一、漁會法第五十條之一或第五十條之二之罪。\n十二、兒童及少年性剝削防制條例第三十二條第一項、第三項、第四項、第五項之罪。\n十三、洗錢防制法第十一條第一項至第三項之罪。\n十四、組織犯罪防制條例第三條第一項後段、第二項後段、第六條或第十一條第三項之罪。\n十五、陸海空軍刑法第十四條第二項、第十七條第三項、第十八條第三項、第十九條第三項、第二十條第五項、第二十二條第四項、第二十三條第三項、第二十四條第二項、第四項、第五十八條第五項、第六十三條第一項之罪。\n十六、營業秘密法第十三條之二第一項、第二項之罪。\n十七、森林法第五十二條第一項、第二項之罪。\n十八、廢棄物清理法第四十六條之罪。\n前項通訊監察書，偵查中由檢察官依司法警察機關聲請或依職權以書面聲請該管法院核發。聲請書應記載偵、他字案號及第十一條之事項，其監察對象非電信服務用戶，應予載明；並檢附相關文件及監察對象住居所之調查資料，釋明有相當理由可信其通訊內容與本案有關，且曾以其他方法調查仍無效果，或以其他方法調查，合理顯示為不能達成目的或有重大危險情形。檢察官受理聲請案件，應於四小時內核復；如案情複雜，得經檢察長同意延長四小時。法院於接獲檢察官核轉受理聲請案件，應於四十八小時內核復。審判中由法官依職權核發。法官並得於通訊監察書上對執行人員為適當之指示。\n前項聲請不合法定程序、不備理由、未經釋明或釋明不足者，法院應予駁回。其聲請經法院駁回者，不得聲明不服。\n執行機關應於執行監聽期間內，每十五日至少作成一次以上之報告書，說明監聽行為之進行情形，以及有無繼續執行監聽之需要。檢察官或核發通訊監察書之法官並得隨時命執行機關提出報告。法官依據經驗法則、論理法則自由心證判斷後，發現有不應繼續執行監聽之情狀時，應撤銷原核發之通訊監察書。\n通訊監察書之聲請，應以單一監察對象為限，同一偵、他字或相牽連案件，得同時聲請數張通訊監察書。","versions":[{"bill":"201110047310000","text":"有事實足認被告或犯罪嫌疑人有下列各款罪嫌之一，並危害國家安全、經濟秩序或社會秩序情節重大，而有相當理由可信其通訊內容與本案有關，且不能或難以其他方法蒐集或調查證據者，得發通訊監察書：\n一、最輕本刑為三年以上有期徒刑之罪。\n二、刑法第一百條第二項之預備內亂罪、第一百零一條第二項之預備暴動內亂罪或第一百零六條第三項、第一百零九條第一項及其未遂犯、第四項、第一百二十一條、第一百二十二條第三項、第一百三十一條、第一百四十二條、第一百四十三條、第一百四十四條、第一百四十五條、第二百零一條之一、第二百五十六條第一項及其未遂犯、第二百五十七條第一項及其未遂犯、第二百九十八條第二項及其未遂犯、第三百條、第三百零二條第一項、第三項、第三百零二條之一第一項、第三項、第三百十九條之一第二項、第三項及該二項之未遂犯、第三百十九條之二、三百十九條之三、第三百十九條之四、第三百三十九條、第三百三十九條之三、第三百三十九條之四或第三百四十六條之罪。\n三、貪污治罪條例第十一條第一項、第四項關於違背職務行為之行賄罪。\n四、懲治走私條例第二條第一項、第二項或第三條之罪。\n五、藥事法第八十二條第一項、第四項或第八十三條第一項、第四項之罪。\n六、證券交易法第一百七十三條第一項之罪。\n七、期貨交易法第一百十二條第五項或第一百十三條之罪。\n八、槍砲彈藥刀械管制條例第十二條第一項、第二項及該二項之未遂犯、第四項或第十三條第二項及其未遂犯、第四項之罪。\n九、公職人員選舉罷免法第一百零二條第一項第一款之罪。\n十、農會法第四十七條之一第一項或第四十七條之二第一項、第二項之罪。\n十一、漁會法第五十條之一第一項或第五十條之二第一項、第二項之罪。\n十二、兒童及少年性剝削防制條例第三十二條第一項、第三項、第四項及該三項之未遂犯、第三十六條第一項、第四項及該二項之未遂犯、第三十八條第一項、第三項及第四項之罪。\n十三、洗錢防制法第十九條、第二十條或資恐防制法第八條、第九條之罪。\n十四、組織犯罪防制條例第三條第一項後段、第四條、第六條或第十一條第三項之罪。\n十五、陸海空軍刑法第十四條第二項、第十七條第三項、第十八條第三項、第十九條第三項、第二十條第五項、第二十二條第四項、第二十三條第三項、第二十四條第二項及其未遂犯、第四項、第五十八條第五項、第六十三條第一項之罪。\n十六、營業秘密法第十三條之二第一項、第二項之罪。\n十七、森林法第五十二條第一項、第二項之罪。\n十八、廢棄物清理法第四十六條之罪。\n十九、國家安全法第七條第二項、第三項及該二項之未遂犯之罪。\n二十、反滲透法第三條、第四條之罪。\n二十一、人口販運防制法第二十九條、第三十條、第三十一條、第三十三條之罪。\n前項通訊監察書，偵查中由檢察官依司法警察機關聲請或依職權以書面聲請該管法院核發。聲請書應記載偵、他字案號及第十一條之事項，其監察對象非電信服務用戶，應予載明；並檢附相關文件及監察對象住居所之調查資料，釋明有相當理由可信其通訊內容與本案有關，且曾以其他方法調查仍無效果，或以其他方法調查，合理顯示為不能達成目的或有重大危險情形。檢察官受理聲請案件，應於四小時內核復；如案情複雜，得經檢察長同意延長四小時。法院於接獲檢察官核轉受理聲請案件，應於四十八小時內核復。審判中由法官依職權核發。法官並得於通訊監察書上對執行人員為適當之指示。\n前項聲請不合法定程序、不備理由、未經釋明或釋明不足者，法院應予駁回。其聲請經法院駁回者，不得聲明不服。\n執行機關應於執行監聽期間內，每十五日至少作成一次以上之報告書，說明監聽行為之進行情形，以及有無繼續執行監聽之需要。檢察官或核發通訊監察書之法官並得隨時命執行機關提出報告。法官依據經驗法則、論理法則自由心證判斷後，發現有不應繼續執行監聽之情狀時，應撤銷原核發之通訊監察書。\n通訊監察書之聲請，應以單一監察對象為限，同一偵、他字或相牽連案件，得同時聲請數張通訊監察書。","note":"一、因應多部法律修正，修正第一項各款得為通訊監察之罪名如下：\n(一)私行拘禁或剝奪他人行動自由之行為，極易對被害人之生命、身體安全造成嚴重威脅，為儘速查緝，有通訊監察之必要；另因應刑法修正增訂第三百三十九條之四，此類詐欺犯罪情節、手法造成損害範圍較廣，有澈底查緝及追查金流之必要，爰均於第二款增訂之。\n(二)因應刑法增訂妨害性隱私及不實性影像罪章，及兒童及少年性剝削防制條例之修正，考量此類犯罪及具營利意圖者造成之損害及犯罪之隱密性，若未能實施通訊監察恐難以查緝，爰於第二款及第十二款分別增訂之。\n(三)期貨交易法於一百零五年十一月九日修正，該法原一百十二條之條文業已移列為同條第五項，爰修正第七款規定。\n(四)洗錢防制法於一百零五年十二月二十八日修正公布全文，原第十一條第一項、第二項修正為第十四條規定，原第十一條第三項之罪因資恐防制法第八條已有相關規範，爰予刪除；又洗錢防制法增訂第十五條之一收集他人帳戶或帳號罪，為澈底打擊詐欺犯罪，應增列為得通訊監察之罪，爰配合洗錢防制法修正草案之條次，修正第十三款規定。另恐怖活動相關犯罪嚴重危害國家社會安全，查緝前階段之資助行為至關重要，爰於第十三款增列資恐防制法第八條、第九條之罪。\n(五)組織犯罪防制條例已刪除原第三條第二項之罪，並修正第四條規定，考量組織犯罪危害治安甚鉅，爰修正第十四款規定，並增列組織犯罪防制條例第四條之罪。\n(六)有鑑於境外敵對勢力之威脅日增，為維護國家安全，爰於第十九款、第二十款分別增列國家安全法第七條第二項、第三項及該二項之未遂犯、反滲透法第三條、第四條之罪。\n(七)考量人口販運防制法相關犯罪嚴重危害被害人之生命、身體安全，應儘速查緝，爰於第二十一款增列該法之罪。\n(八)另部分款次酌作文字修正。\n二、第二項至第五項未修正。"},{"bill":"202110050370000","text":"有事實足認被告或犯罪嫌疑人有下列各款罪嫌之一，並危害國家安全、經濟秩序或社會秩序情節重大，而有相當理由可信其通訊內容與本案有關，且不能或難以其他方法蒐集或調查證據者，得發通訊監察書。\n一、最輕本刑為三年以上有期徒刑之罪。\n二、刑法第一百條第二項之預備內亂罪、第一百零一條第二項之預備暴動內亂罪或第一百零六條第三項、第一百零九條第一項、第三項、第四項、第一百二十一條、第一百二十二條第三項、第一百三十一條、第一百四十二條、第一百四十三條、第一百四十四條、第一百四十五條、第二百零一條之一、第二百五十六條第一項、第三項、第二百五十七條第一項、第四項、第二百九十八條第二項、第三百條、第三百三十九條、第三百三十九條之三或第三百四十六條之罪。\n三、貪污治罪條例第十一條第一項、第四項關於違背職務行為之行賄罪。\n四、懲治走私條例第二條第一項、第二項或第三條之罪。\n五、藥事法第八十二條第一項、第四項或第八十三條第一項、第四項之罪。\n六、證券交易法第一百七十三條第一項之罪。\n七、期貨交易法第一百十二條或第一百十三條之罪。\n八、槍砲彈藥刀械管制條例第十二條第一項、第二項、第四項、第五項或第十三條第二項、第四項、第五項之罪。\n九、公職人員選舉罷免法第一百零二條第一項第一款之罪。\n十、農會法第四十七條之一或第四十七條之二之罪。\n十一、漁會法第五十條之一或第五十條之二之罪。\n十二、兒童及少年性剝削防制條例第三十二條第一項、第三項、第四項、第五項之罪。\n十三、洗錢防制法第十四條第一項、第二項、資恐防制法第八條之罪。\n十四、組織犯罪防制條例第三條第一項後段、第六條或第十一條第三項之罪。\n十五、陸海空軍刑法第十四條第二項、第十七條第三項、第十八條第三項、第十九條第三項、第二十條第五項、第二十二條第四項、第二十三條第三項、第二十四條第二項、第四項、第五十八條第五項、第六十三條第一項之罪。\n十六、營業秘密法第十三條之二第一項、第二項之罪。\n十七、森林法第五十二條第一項、第二項之罪。\n十八、廢棄物清理法第四十六條之罪。\n前項通訊監察書，偵查中由檢察官依司法警察機關聲請或依職權以書面聲請該管法院核發。聲請書應記載偵、他字案號及第十一條之事項，其監察對象非電信服務用戶，應予載明；並檢附相關文件及監察對象住居所之調查資料，釋明有相當理由可信其通訊內容與本案有關，且曾以其他方法調查仍無效果，或以其他方法調查，合理顯示為不能達成目的或有重大危險情形。檢察官受理聲請案件，應於四小時內核復；如案情複雜，得經檢察長同意延長四小時。法院於接獲檢察官核轉受理聲請案件，應於四十八小時內核復。審判中由法官依職權核發。法官並得於通訊監察書上對執行人員為適當之指示。\n前項聲請不合法定程序、不備理由、未經釋明或釋明不足者，法院應予駁回。其聲請經法院駁回者，不得聲明不服。\n執行機關應於執行監聽期間內，每十五日至少作成一次以上之報告書，說明監聽行為之進行情形，以及有無繼續執行監聽之需要。檢察官或核發通訊監察書之法官並得隨時命執行機關提出報告。法官依據經驗法則、論理法則自由心證判斷後，發現有不應繼續執行監聽之情狀時，應撤銷原核發之通訊監察書。\n通訊監察書之聲請，應以單一監察對象為限，同一偵、他字或相牽連案件，得同時聲請數張通訊監察書。","note":"配合洗錢防制法、資恐防制法及組織犯罪防制條例之修正，爰修正第一項第十三款、第十四款之規定。"},{"bill":"202110054990000","text":"有事實足認被告或犯罪嫌疑人有下列各款罪嫌之一，並危害國家安全、經濟秩序或社會秩序情節重大，而有相當理由可信其通訊內容與本案有關，且不能或難以其他方法蒐集或調查證據者，得發通訊監察書：\n一、最輕本刑為三年以上有期徒刑之罪。\n二、刑法第一百條第二項之預備內亂罪、第一百零一條第二項之預備暴動內亂罪或第一百零六條第三項、第一百零九條第一項及其未遂犯、第三項、第四項、第一百二十一條、第一百二十二條第三項、第一百三十一條、第一百四十二條、第一百四十三條、第一百四十四條、第一百四十五條、第二百零一條之一、第二百五十六條第一項及其未遂犯、第三項、第二百五十七條第一項及其未遂犯、第四項、第二百九十八條第二項及其未遂犯、第三百條、第三百零二條第一項、第三項、第三百零二條之一第一項、第三項、第三百十九條之一第二項、第三項及該二項之未遂犯、第三百十九條之二、三百十九條之三、第三百十九條之四、第三百三十九條、第三百三十九條之三、第三百三十九條之四或第三百四十六條之罪。\n三、貪污治罪條例第十一條第一項、第四項關於違背職務行為之行賄罪。\n四、懲治走私條例第二條第一項、第二項或第三條之罪。\n五、藥事法第八十二條第一項、第四項或第八十三條第一項、第四項之罪。\n六、證券交易法第一百七十三條第一項之罪。\n七、期貨交易法第一百十二條第五項或第一百十三條第一項、第二項之罪。\n八、槍砲彈藥刀械管制條例第十二條第一項、第二項及該二項之未遂犯、第四項或第十三條第二項及其未遂犯、第四項之罪。\n九、公職人員選舉罷免法第一百零二條第一項第一款之罪。\n十、農會法第四十七條之一第一項或第四十七條之二第一項、第二項之罪。\n十一、漁會法第五十條之一第一項或第五十條之二第一項、第二項之罪。\n十二、兒童及少年性剝削防制條例第三十二條第一項、第三項、第四項及該三項之未遂犯、第三十六條第一項、第四項及該二項之未遂犯、第三十八條第一項、第三項及第四項之罪。\n十三、洗錢防制法第十九條、第二十條或資恐防制法第八條、第九條之罪。\n十四、組織犯罪防制條例第三條第一項後段、第四條、第六條或第十一條第三項之罪。\n十五、陸海空軍刑法第十四條第二項、第十七條第三項、第十八條第三項、第十九條第三項、第二十條第五項、第二十二條第四項、第二十三條第三項、第二十四條第二項及其未遂犯、第四項、第五十八條第五項、第六十三條第一項之罪。\n十六、營業秘密法第十三條之二第一項、第二項之罪。\n十七、森林法第五十二條第一項、第二項之罪。\n十八、廢棄物清理法第四十六條之罪。\n十九、國家安全法第七條第二項、第三項及該二項之未遂犯之罪。\n二十、反滲透法第三條、第四條之罪。\n二十一、人口販運防制法第二十九條、第三十條、第三十一條、第三十三條之罪。\n前項通訊監察書，偵查中由檢察官依司法警察機關聲請或依職權以書面聲請該管法院核發。聲請書應記載偵、他字案號及第十一條之事項，其監察對象非電信服務用戶，應予載明；並檢附相關文件及監察對象住居所之調查資料，釋明有相當理由可信其通訊內容與本案有關，且曾以其他方法調查仍無效果，或以其他方法調查，合理顯示為不能達成目的或有重大危險情形。檢察官受理聲請案件，應於四小時內核復；如案情複雜，得經檢察長同意延長四小時。法院於接獲檢察官核轉受理聲請案件，應於四十八小時內核復。審判中由法官依職權核發。法官並得於通訊監察書上對執行人員為適當之指示。\n前項聲請不合法定程序、不備理由、未經釋明或釋明不足者，法院應予駁回。其聲請經法院駁回者，不得聲明不服。\n執行機關應於執行監聽期間內，每十五日至少作成一次以上之報告書，說明監聽行為之進行情形，以及有無繼續執行監聽之需要。檢察官或核發通訊監察書之法官並得隨時命執行機關提出報告。法官依據經驗法則、論理法則自由心證判斷後，發現有不應繼續執行監聽之情狀時，應撤銷原核發之通訊監察書。\n通訊監察書之聲請，應以單一監察對象為限，同一偵、他字或相牽連案件，得同時聲請數張通訊監察書。","note":"一、因應多部法律修正，修正第一項各款得為通訊監察之罪名如下：\n(一)私行拘禁或剝奪他人行動自由之行為，極易對被害人之生命、身體安全造成嚴重威脅，為儘速查緝，有通訊監察之必要；另因應刑法修正增訂第三百三十九條之四，此類詐欺犯罪情節、手法造成損害範圍較廣，有澈底查緝及追查金流之必要，爰均於第二款增訂之。\n(二)因應刑法增訂妨害性隱私及不實性影像罪章，及兒童及少年性剝削防制條例之修正，考量此類犯罪及具營利意圖者造成之損害及犯罪之隱密性，若未能實施通訊監察恐難以查緝，爰於第二款及第十二款分別增訂之。\n(三)期貨交易法於一百零五年十一月九日修正，該法原一百十二條之條文業已移列為同條第五項，爰修正第七款規定。\n(四)洗錢防制法於一百零五年十二月二十八日修正公布全文，原第十一條第一項、第二項修正為第十四條規定，原第十一條第三項之罪因資恐防制法第八條已有相關規範，爰予刪除；又洗錢防制法增訂第十五條之一收集他人帳戶或帳號罪，為澈底打擊詐欺犯罪，應增列為得通訊監察之罪，爰配合洗錢防制法修正草案之條次，修正第十三款規定。另恐怖活動相關犯罪嚴重危害國家社會安全，查緝前階段之資助行為至關重要，爰於第十三款增列資恐防制法第八條、第九條之罪。\n(五)組織犯罪防制條例已刪除原第三條第二項之罪，並修正第四條規定，考量組織犯罪危害治安甚鉅，爰修正第十四款規定，並增列組織犯罪防制條例第四條之罪。\n(六)有鑑於境外敵對勢力之威脅日增，為維護國家安全，爰於第十九款、第二十款分別增列國家安全法第七條第二項、第三項及該二項之未遂犯、反滲透法第三條、第四條之罪。\n(七)考量人口販運防制法相關犯罪嚴重危害被害人之生命、身體安全，應儘速查緝，爰於第二十一款增列該法之罪。\n(八)另部分款次酌作文字修正。\n二、第二項至第五項未修正。"},{"bill":"202110055570000","text":"有事實足認被告或犯罪嫌疑人有下列各款罪嫌之一，並危害國家安全、經濟秩序或社會秩序情節重大，而有相當理由可信其通訊內容與本案有關，且不能或難以其他方法蒐集或調查證據者，得發通訊監察書：\n一、最輕本刑為三年以上有期徒刑之罪。\n二、刑法第一百條第二項之預備內亂罪、第一百零一條第二項之預備暴動內亂罪或第一百零六條第三項、第一百零九條第一項及其未遂犯、第四項、第一百二十一條、第一百二十二條第三項、第一百三十一條、第一百四十二條、第一百四十三條、第一百四十四條、第一百四十五條、第二百零一條之一、第二百五十六條第一項及其未遂犯、第二百五十七條第一項及其未遂犯、第二百九十八條第二項及其未遂犯、第三百條、第三百零二條第一項、第三項、第三百零二條之一第一項、第三項、第三百十九條之一第二項、第三項及該二項之未遂犯、第三百十九條之二、三百十九條之三、第三百十九條之四、第三百三十九條、第三百三十九條之三、第三百三十九條之四或第三百四十六條之罪。\n三、貪污治罪條例第十一條第一項、第四項關於違背職務行為之行賄罪。\n四、懲治走私條例第二條第一項、第二項或第三條之罪。\n五、藥事法第八十二條第一項、第四項或第八十三條第一項、第四項之罪。\n六、證券交易法第一百七十三條第一項之罪。\n七、期貨交易法第一百十二條第五項或第一百十三條之罪。\n八、槍砲彈藥刀械管制條例第十二條第一項、第二項及該二項之未遂犯、第四項或第十三條第二項及其未遂犯、第四項之罪。\n九、公職人員選舉罷免法第一百零二條第一項第一款之罪。\n十、農會法第四十七條之一第一項或第四十七條之二第一項、第二項之罪。\n十一、漁會法第五十條之一第一項或第五十條之二第一項、第二項之罪。\n十二、兒童及少年性剝削防制條例第三十二條第一項、第三項、第四項及該三項之未遂犯、第三十六條第一項、第四項及該二項之未遂犯、第三十八條第一項、第三項及第四項之罪。\n十三、洗錢防制法第十九條、第二十條或資恐防制法第八條、第九條之罪。\n十四、組織犯罪防制條例第三條第一項後段、第四條、第六條或第十一條第三項之罪。\n十五、陸海空軍刑法第十四條第二項、第十七條第三項、第十八條第三項、第十九條第三項、第二十條第五項、第二十二條第四項、第二十三條第三項、第二十四條第二項及其未遂犯、第四項、第五十八條第五項、第六十三條第一項之罪。\n十六、營業秘密法第十三條之二第一項、第二項之罪。\n十七、森林法第五十二條第一項、第二項之罪。\n十八、廢棄物清理法第四十六條之罪。\n十九、國家安全法第七條第二項、第三項及該二項之未遂犯之罪。\n二十、反滲透法第三條、第四條之罪。\n二十一、人口販運防制法第二十九條、第三十條、第三十一條、第三十三條之罪。\n前項通訊監察書，偵查中由檢察官依司法警察機關聲請或依職權以書面聲請該管法院核發。聲請書應記載偵、他字案號及第十一條之事項，其監察對象非電信服務用戶，應予載明；並檢附相關文件及監察對象住居所之調查資料，釋明有相當理由可信其通訊內容與本案有關，且曾以其他方法調查仍無效果，或以其他方法調查，合理顯示為不能達成目的或有重大危險情形。檢察官受理聲請案件，應於四小時內核復；如案情複雜，得經檢察長同意延長四小時。法院於接獲檢察官核轉受理聲請案件，應於四十八小時內核復。審判中由法官依職權核發。法官並得於通訊監察書上對執行人員為適當之指示。\n前項聲請不合法定程序、不備理由、未經釋明或釋明不足者，法院應予駁回。其聲請經法院駁回者，不得聲明不服。\n執行機關應於執行監聽期間內，每十五日至少作成一次以上之報告書，說明監聽行為之進行情形，以及有無繼續執行監聽之需要。檢察官或核發通訊監察書之法官並得隨時命執行機關提出報告。法官依據經驗法則、論理法則自由心證判斷後，發現有不應繼續執行監聽之情狀時，應撤銷原核發之通訊監察書。\ 危害防制條例第四十四條之罪。\n前項通訊監察書，偵查中由檢察官依司法警察機關聲請或依職權以書面聲請該管法院核發。聲請書應記載偵、他字案號及第十一條之事項，其監察對象非電信服務用戶，應予載明；並檢附相關文件及監察對象住居所之調查資料，釋明有相當理由可信其通訊內容與本案有關，且曾以其他方法調查仍無效果，或以其他方法調查，合理顯示為不能達成目的或有重大危險情形。檢察官受理聲請案件，應於四小時內核復；如案情複雜，得經檢察長同意延長四小時。法院於接獲檢察官核轉受理聲請案件，應於四十八小時內核復。審判中由法官依職權核發。法官並得於通訊監察書上對執行人員為適當之指示。\n前項聲請不合法定程序、不備理由、未經釋明或釋明不足者，法院應予駁回。其聲請經法院駁回者，不得聲明不服。\n執行機關應於執行監聽期間內，每十五日至少作成一次以上之報告書，說明監聽行為之進行情形，以及有無繼續執行監聽之需要。檢察官或核發通訊監察書之法官並得隨時命執行機關提出報告。法官依據經驗法則、論理法則自由心證判斷後，發現有不應繼續執行監聽之情狀時，應撤銷原核發之通訊監察書。\n通訊監察書之聲請，應以單一監察對象為限，同一偵、他字或相牽連案件，得同時聲請數張通訊監察書。","finalWhy":"一、因應多部法律修正，修正第一項各款得為通訊監察之罪名如下：\n(一)私行拘禁或剝奪他人行動自由之行為，極易對被害人之生命、身體安全造成嚴重威脅，為儘速查緝，有通訊監察之必要；另因應刑法修正增訂第三百三十九條之四，此類詐欺犯罪情節、手法造成損害範圍較廣，有澈底查緝及追查金流之必要，爰均於第二款增訂之。\n(二)因應刑法增訂妨害性隱私及不實性影像罪章，及兒童及少年性剝削防制條例之修正，考量此類犯罪及具營利意圖者造成之損害及犯罪之隱密性，若未能實施通訊監察恐難以查緝，爰於第二款及第十二款分別增訂之。\n(三)期貨交易法於一百零五年十一月九日修正，該法原一百十二條之條文業已移列為同條第五項，爰修正第七款規定。\n(四)洗錢防制法於一百零五年十二月二十八日修正公布全文，原第十一條第一項、第二項修正為第十四條規定，並增訂第十五條之一收集他人帳戶或帳號罪，原第十一條第三項之罪因資恐防制法第八條已有相關規範，爰予刪除；爰配合洗錢防制法修正草案之條次，修正第十三款規定。另恐怖活動相關犯罪嚴重危害國家社會安全，查緝前階段之資助行為至關重要，爰於第十三款增列資恐防制法第八條、第九條之罪。\n(五)組織犯罪防制條例已刪除原第三條第二項之罪，並修正第四條規定，考量組織犯罪危害治安甚鉅，爰修正第十四款規定，並增列組織犯罪防制條例第四條之罪。\n(六)本條第一項第十五款已將陸海空軍刑法第二十二條第四項預備或陰謀犯第一項之罪，列為得予通訊監察之範圍，故該第二十二條第一項前段之罪自應納入為得予通訊監察之罪，始不輕重失衡，爰於第十五款增列之。\n(七)有鑑於境外敵對勢力之威脅日增，為維護國家安全，爰於第十九款、第二十款分別增列國家安全法第七條第二項、第三項及該二項之未遂犯、反滲透法第三條、第四條之罪。\n(八)考量人口販運防制法相關犯罪嚴重危害被害人之生命、身體安全，應儘速查緝，爰於第二十一款增列該法之罪。\n(九)為澈底打擊詐欺犯罪，爰於第二十二款增列詐欺危害犯罪防制條例草案第四十四條複合型詐欺犯罪為得予通訊監察之罪。\n(十)另部分款次酌作文字修正。\n二、第二項至第五項未修正。","review":{"note":"保留，送院會處理","text":""}},{"no":"第六條","current":"有事實足認被告或犯罪嫌疑人有犯刑法妨害投票罪章、公職人員選舉罷免法、總統副總統選舉罷免法、槍砲彈藥刀械管制條例第七條、第八條、毒品危害防制條例第四條、擄人勒贖罪或以投置炸彈、爆裂物或投放毒物方法犯恐嚇取財罪、組織犯罪條例第三條、洗錢防制法第十一條第一項、第二項、第三項、刑法第二百二十二條、第二百二十六條、第二百七十一條、第三百二十五條、第三百二十六條、第三百二十八條、第三百三十條、第三百三十二條及第三百三十九條，為防止他人生命、身體、財產之急迫危險；或有事實足信有其他通訊作為前條第一項犯罪連絡而情形急迫者，司法警察機關得報請該管檢察官以口頭通知執行機關先予執行通訊監察。但檢察官應告知執行機關第十一條所定之事項，並於二十四小時內陳報該管法院補發通訊監察書；檢察機關為受理緊急監察案件，應指定專責主任檢察官或檢察官作為緊急聯繫窗口，以利掌握偵辦時效。\n法院應設置專責窗口受理前項聲請，並應於四十八小時內補發通訊監察書；未於四十八小時內補發者，應即停止監察。","versions":[{"bill":"201110047310000","text":"有事實足認被告或犯罪嫌疑人有犯刑法妨害投票罪章、公職人員選舉罷免法、 型，常有金流移轉快速、網路匿蹤或組織、集團犯罪特性，亟需儘速溯源、擴大查緝並追查金流去向，而有立即進行通訊監察之必要，爰於第一項增訂之。\n四、第二項未修正。"},{"bill":"202110055570000","text":"有事實足認被告或犯罪嫌疑人有犯刑法妨害投票罪章、公職人員選舉罷免法、總統副總統選舉罷免法、槍砲彈藥刀械管制條例第七條、第八條、毒品危害防制條例第四條、擄人勒贖罪或以投置炸彈、爆裂物或投放毒物方法犯恐嚇取財罪、組織犯罪防制條例第三條、洗錢防制法第十九條、資恐防制法第八條、刑法第二百二十二條、第二百二十六條、第二百七十一條、第三百零二條之一、第三百二十五條、第三百二十六條、第三百二十八條、第三百三十條、第三百三十二條、第三百三十九條、第三百三十九條之三或第三百三十九條之四，為防止他人生命、身體、財產之急迫危險；或有事實足信有其他通訊作為前條第一項犯罪連絡而情形急迫者，司法警察機關得報請該管檢察官以口頭通知執行機關先予執行通訊監察。但檢察官應告知執行機關第十一條所定之事項，並於二十四小時內陳報該管法院補發通訊監察書；檢察機關為受理緊急監察案件，應指定專責主任檢察官或檢察官作為緊急聯繫窗口，以利掌握偵辦時效。\n法院應設置專責窗口受理前項聲請，並應於四十八小時內補發通訊監察書；未於四十八小時內補發者，應即停止監察。","note":"一、第一項所列組織犯罪條例，漏載「防制」二字，爰予修正。另洗錢防制法迭經修正，該法原第十一條第一項、第二項已修正為第十四條，第十一條第三項配合資恐防制法第八條規定刪除，洗錢防制法修正草案並將現行第十四條修正為第十九條，爰修正第一項規定。\n二、鑑於刑法第三百零二條之一之加重私行拘禁或剝奪行動自由之行為可能造成他人生命、身體安全之嚴重危害，有爭取時效儘速查緝及營救被害人之必要，爰於第一項增列之。\n三、刑法第三百三十九條之三及第三百三十九條之四之詐欺犯罪類型，常有金流移轉快速、網路匿蹤或組織、集團犯罪特性，亟需儘速溯源、擴大查緝並追查金流去向，而有立即進行通訊監察之必要，爰於第一項增訂之。\n四、第二項未修正。"}],"changed":true,"final":"有事實足認被告或犯罪嫌疑人有犯刑法妨害投票罪章、公職人員選舉罷免法、總統副總統選舉罷免法、槍砲彈藥刀械管制條例第七條、第八條、毒品危害防制條例第四條、擄人勒贖罪或以投置炸彈、爆裂物或投放毒物方法犯恐嚇取財罪、組織犯罪防制條例第三條、洗錢防制法第十九條、資恐防制法第八條、刑法第二百二十二條、第二百二十六條、第二百七十一條、第三百零二條之一、第三百二十五條、第三百二十六條、第三百二十八條、第三百三十條、第三百三十二條、第三百三十九條、第三百三十九條之三或第三百三十九條之四、詐欺犯罪危害防制條例第四十三條、第四十四條，為防止他人生命、身體、財產之急迫危險；或有事實足信有其他通訊作為前條第一項犯罪連絡而情形急迫者，司法警察機關得報請該管檢察官以口頭通知執行機關先予執行通訊監察。但檢察官應告知執行機關第十一條所定之事項，並於二十四小時內陳報該管法院補發通訊監察書；檢察機關為受理緊急監察案件，應指定專責主任檢察官或檢察官作為緊急聯繫窗口，以利掌握偵辦時效。\n法院應設置專責窗口受理前項聲請，並應於四十八小時內補發通訊監察書；未於四十八小時內補發者，應即停止監察。","finalWhy":"一、第一項所列組織犯罪條例，漏載「防制」二字，爰予修正。另洗錢防制法迭經修正，該法原第十一條第一項、第二項已修正為第十四條，第十一條第三項配合資恐防制法第八條規定刪除，洗錢防制法修正草案並將原第十四條修正為第十九條，爰修正第一項規定。\n二、鑑於刑法第三百零二條之一之加重私行拘禁或剝奪行動自由之行為可能造成他人生命、身體安全之嚴重危害，有爭取時效儘速查緝及營救被害人之必要，爰於第一項增列之。\n三、刑法第三百三十九條之三及第三百三十九條之四、詐欺犯罪危害防制條例草案第四十三條及第四十四條之詐欺犯罪類型，常有金流移轉快速、網路匿蹤或組織、集團犯罪特性，亟需儘速溯源、擴大查緝並追查金流去向，而有立即進行通訊監察之必要，爰於第一項增訂之。\n四、第二項未修正。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十一條之一","current":"檢察官偵查最重本刑三年以上有期徒刑之罪，有事實足認通信紀錄及通信使用者資料於本案之偵查有必要性及關連性時，除有急迫情形不及事先聲請者外，應以書面聲請該管法院核發調取票。聲請書之應記載事項，準用前條第一項之規定。\n司法警察官因調查犯罪嫌疑人犯罪情形及蒐集證據，認有調取通信紀錄之必要時，得依前項規定，報請檢察官許可後，向該管法院聲請核發調取票。\n檢察官、司法警察官為偵辦最輕本刑十年以上有期徒刑之罪、強盜、搶奪、詐欺、恐嚇、擄人勒贖，及違反人口販運防制法、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、組織犯罪防制條例等罪，而有需要時，得由檢察官依職權或司法警察官向檢察官聲請同意後，調取通信紀錄，不受前二項之限制。\n第一項之急迫原因消滅後，應向法院補行聲請調取票。\n調取票，應記載下列事項：\n一、案由。\n二、應調取之通信紀錄或使用者資料。\n三、有效期間，逾期不得執行調取及調取後應將調取票交回之意旨。\n第一項、第二項及第四項之聲請經法院駁回者，不得聲明不服。\n核發調取票之程序，不公開之。\n有調取第七條之監察對象通信紀錄及通訊使用者資料必要者，由綜理國家情報工作機關向電信或郵政事業調取，不受前七項之限制。","versions":[{"bill":"201110047310000","text":"檢察官、司法警察官為偵查犯罪及蒐集證據，有事實足認通訊使用者資料於本案之偵查有必要性及關連性時，得調取之。\n檢察官為偵查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，除有急迫情形不及事先聲請者外，應以書面聲請該管法院核發調取票。聲請書之應記載事項，準用前條第一項之規定。\n司法警察官為調查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之調查有必要性及關連性時，得依前項規定，報請檢察官許可後，向該管法院聲請核發調取票。\n檢察官、司法警察官為偵辦最輕本刑十年以上有期徒刑之罪、強盜、搶奪、詐欺、恐嚇、擄人勒贖、妨害電腦使用、脫逃，及違反人口販運防制法、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、組織犯罪防制條例、廢棄物清理法、兒童及少年性剝削防制條例、洗錢防制法、國家安全法、反滲透法、總統副總統選舉罷免法、公職人員選舉罷免法、農會法第四十七條之一至第四十七條之三、漁會法第五十條之一至第五十條之三等罪，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，得由檢察官依職權或司法警察官經檢察官許可後，調取通信紀錄或網路流量紀錄，不受前二項之限制。\n依第二項急迫情形調取通信紀錄或網路流量紀錄後，應於二十四小時內向法院補行聲請調取票。\n調取票，應記載下列事項：\n一、案由。\n二、應調取之通信紀錄或網路流量紀錄。\n三、有效期間，逾期不得執行調取及調取後應將調取票交回之意旨。\n第二項、第三項及第五項之聲請經法院駁回者，不得聲明不服。\n核發調取票之程序，不公開之。\n有調取第七條之監察對象通信紀錄、網路流量紀錄或通訊使用者資料必要者，由綜理國家情報工作機關向電信事業、設置公眾電信網路者或郵政事業調取，不受前八項之限制。\n檢察官、司法警察官為偵查犯罪及蒐集證據，經用戶或電信使用人同意，得調取其通訊使用者資料、通信紀錄或網路流量紀錄，不受第一項至第八項之限制。","note":"一、通訊使用者資料係電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料，性質上屬於個人資料保護法第二條第一款所規範之「個人資料」，所涉及隱私程度較低，與通訊之有無、對象、時間、方式及內容等事項無涉，非屬司法院釋字第六三一號解釋對於秘密通訊自由之涵攝範圍，調取通訊使用者資料對於隱私權之影響較為輕微，與通信紀錄涉及電信使用人與他人聯絡狀況、使用通訊之型態及所在位置等資訊，所涉隱私程度有所不同。為提升偵查效率，爰將第一項通信使用者資料調取之規定修正為檢察官、司法警察官得依職權調取，並配合修正條文第三條之一，修正用語為「通訊使用者資料」。\n二、現行第一項有關調取通信紀錄之規定移列第二項，並刪除「最重本刑三年以上有期徒刑之罪」要件限制：\n(一)現行規定限制調取通信紀錄之門檻，導致諸多案件無法調取通信紀錄，有害犯罪之調查及真實之發現，更有礙於對被害人及弱勢團體之權利保護，例如刑法第二百七十一條第三項預備殺人罪、第三百二十八條第五項預備強盜罪、第三百三十九條之一準詐欺罪、第三百四十七條第四項預備擄人勒贖罪、兒童及少年性剝削防制條例第四十五條第二項引誘兒童或少年涉及色情罪、公職人員選舉罷免法第九十九條第二項預備賄選罪等，對被害人權益及公益保障顯有重大影響。此外，檢察官辦理相驗案件之初，常因是否有人涉及犯罪或所涉罪名均待釐清，致不符合「偵查最重本刑三年以上有期徒刑之罪」要件，無法即時調取通信紀錄查明死者生前通訊情形，妨害人民權益及社會治安之保障，亦影響通信紀錄作為被告不在場或非實際持用人之有利證據，有礙刑事司法對真實之發現。\n(二)刑事訴訟法就拘提、搜索、羈押等干預基本權程度較高之強制處分，亦未限制一定刑度以上之罪始得發動，通信紀錄調取相較於上開強制處分干預更為輕微，限制最重本刑三年以上之罪始得調取，恐有輕重失衡。爰刪除「最重本刑三年以上有期徒刑之罪」要件，並酌作文字修正。\n三、現行第二項規定司法警察官調取通信紀錄之要件「必要時」之標準低於修正條文第二項檢察官調取通信紀錄之要件，滋生爭議，爰酌為修正，並移列為第三項。\n四、現行第三項移列為第四項。因科技發展快速，不同類型電腦犯罪案件日增，犯罪手法隱密、快速，為即時偵查犯罪及保存證據，有儘速調取相關紀錄之必要；違反廢棄物清理法犯罪案件，對環境或鄰近居民生命、身體安全造成之危害預即時遏止；人犯脫逃案件亦有危及脫逃路線沿線民眾之生命安全之高度可能性；兒童及少年性剝削防制條例犯罪有即時援救被害人及阻止危害擴大之需要；洗錢犯罪因其犯罪所得金流常迅速經由層層轉匯而難以追返；國家安全法、反滲透法等相關犯罪，嚴重危害國家利益；總統副總統選舉罷免法、公職人員選舉罷免法、農會法、漁會法有關賄選或妨害選舉、罷免公正性之罪，如不儘速查緝，將立即造成選舉、罷免之不公正結果。上述犯罪均有爭取時效而儘速調取相關通信紀錄之必要；爰於本項增列前開犯罪得由檢察官依職權調取之規定。\n五、依修正條文第二項急迫情形調取通信紀錄後，向法院補行聲請調取票之期限應予明確規定，爰修正現行第四項規定，並移列為第五項。\n六、現行第五項第二款配合第一項通訊使用者資料修正為得依職權調取，刪除使用者資料之文字，現行第八項酌作文字修正，並分別移列為第六項、第九項。\n七、現行第六項修正所引項次，並移列為第七項。\n八、第七項移列為第八項，內容未修正。\n九、如經用戶或電信使用人同意而調取其通訊使用者資料、通信紀錄，無礙其個人資訊自決權或秘密通訊自由之保障，爰增訂第十項規定。\n十、增訂調取「網路流量紀錄」之規定：\n(一)網路犯罪及資安駭侵事件日益增加，如券商集體遭DDos攻擊勒索案、大型企業遭受勒索軟體攻擊、民眾個資遭盜取而致詐騙案件、網路炸彈恐嚇信件或網路平台販賣兒少或其他被害人性私密影像、付費式偷拍影片或深度偽造色情影片等網路性暴力案件，是類案件發生時，缺乏相關網路連線流量紀錄致案件難以查緝、溯源攻擊者或色情網站經營者真正身分、手法、被害人範圍，亦無法利用網路流量紀錄之分析，發現潛在被害者以提早防範，致查緝、後續預警及防禦作為難以實行，影響被害人權益、資安及國家安全甚鉅。\n(二)網路流量紀錄與通信紀錄相類，均不涉及通訊內容，對個人隱私權及秘密通訊自由之干預有限，然該等資訊應用於查緝網際網路犯罪或資安駭侵案件極有助益，不僅得為認定犯罪事實之補強證據，亦得作為認定被告不在場或非實際持用人等有利證據。參照國外立法例，澳洲已於二○一五年通過法案Telecommunica-tions（Interception and Access Amendment（Data Retention）Act2015），課予網路服務提供者保存一定網路連線資料之義務；美國「儲存通信法」（Stored Communication Act）及通訊協助執行法（Communication Assistance for Law Enforcement Act,CALEA），亦規範電信業者有協助執法機關調取相關紀錄之義務。爰比照調取通信紀錄之程序，於修正條文第二項至第六項、第九項及第十項增訂調取網路流量紀錄之規定。"},{"bill":"202110050370000","text":"檢察官、司法警察官為偵辦犯罪或蒐集證據，有事實足認通訊使用者資料於本案之偵辦有必要性及關連性時，得由檢察官依職權或司法警察官報請檢察官許可後調取之。司法警察官如認有急迫情形者，得逕行調取之，並於調取後立即報請檢察官許可。\n檢察官為偵查犯罪或蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，除有急迫情形不及事先聲請者外，應以書面聲請該管法院核發調取票。聲請書之應記載事項，準用前條第一項之規定。\n司法警察官為調查犯罪或蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之調查有必要性及關連性時，得依前項規定，報請檢察官許可後，向該管法院聲請核發調取票。\n檢察官、司法警察官為偵辦最輕本刑十年以上有期徒刑之罪、強盜、搶奪、詐欺、恐嚇、擄人勒贖、妨害電腦使用、脫逃，及違反人口販運防制法、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、組織犯罪防制條例、廢棄物清理法、總統副總統選舉罷免法、公職人員選舉罷免法、農會法第四十七條之一至第四十七條之三、漁會法第五十條之一至第五十條之三、農田水利會組織通則第三十八條之一、第三十八條之二等罪，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，得由檢察官依職權或司法警察官經檢察官許可後，調取通信紀錄或網路流量紀錄，不受前二項之限制。\n第二項之急迫原因消滅後，應向法院補行聲請調取票。\n調取票，應記載下列事項：\n一、案由。\n二、應調取之通信紀錄或網路流量紀錄。\n三、有效期間，逾期不得執行調取及調取後應將調取票交回之意旨。\n第二項、第三項及第五項之聲請經法院駁回者，不得聲明不服。\n核發調取票之程序，不公開之。\n有調取第七條之監察對象通信紀錄、網路流量紀錄或通訊使用者資料必要者，由綜理國家情報工作機關向電信事業、設置公眾電信網路者或郵政事業調取，不受前八項之限制。\n檢察官、司法警察官為偵辦犯罪或蒐集證據，得用戶或電信使用人之同意，得調取其通訊使用者資料、通信紀錄或網路流量紀錄，不受第一至八項之限制。","note":"一、按「通訊使用者資料」與「通信紀錄」涉及層次完全不同之隱私權保護，前者係電信使用人之姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料，並不包括通訊之有無、對象、時間、方式及內容等事項，所涉及之隱私程度較低；後者則涉及電信使用人與他人之通訊狀況、使用通訊之型態以及所在位置等資訊，所涉及隱私之程度較高。對於「通訊使用者資料」與「通信紀錄」之調取，自應依據隱私權干預之高低而為相異處理，以兼顧犯罪偵查與人權保護。爰增設第一項規定，明定檢察官、司法警察官為偵辦犯罪或蒐集證據，有事實足認通訊使用者資料於本案之偵辦所有必要性及關連性時，即得由檢察官依職權或司法警察官報請檢察官許可後調取通訊使用者資料。\n二、為有效打擊透過網際網路進行詐騙、資安攻擊等犯罪之必要，本次修正將網路流量紀錄納入得調取之範圍；此外，審酌網路流量紀錄於性質上與通信紀錄類似，並不直接涉及通訊內容，因此關於其調取之規範，比照調取通信紀錄，爰於本條第二項、第三項、第四項、第六項、第九項及第十項，增訂調取網路流量紀錄之規定。\n三、在調取通信紀錄或網路流量紀錄之情形，由於涉及一定程度之隱私權干預，原則上採取法官保留原則，當偵辦犯罪或蒐集證據時，有事實足認通信紀錄或網路流量紀錄於本案之偵辦有必要性及關連性時，由檢察官依職權或由司法警察官報請檢察官許可後，向該管法院聲請核發調取票。聲請書之應記載事項，則準用前條第一項之規定。爰於第二項、第三項明文規定。\n四、本條原第三項針對最輕本刑十年以上之重罪及所列舉之特定犯罪，使檢察官依職權或司法警察官經檢察官許可後即得調取通信紀錄之規定，配合本次修正將網路流量紀錄納入得調取紀錄之範圍，並因應為打擊使用隱密快速之犯罪手法而有即時偵辦並保存證據之特定犯罪類型之必要，爰增列檢察官於偵查妨害電腦使用罪章、違反廢棄物清理法、總統副總統選舉罷免法、公職人員選舉罷免法、農會法第四十七條之一至第四十七條之三、漁會法第五十條之一至第五十條之三，與農田水利會組織通則第三十八條之一及第三十八條之二等罪時，亦得依職權調取之規定。\n五、配合前四項之新增與修正，現行第四項至八項移列第五項至第九項，並為必要之文字修正。\n六、在用戶或電信使用人同意時，檢察官、司法警察官調取其通訊使用者資料、通信紀錄或網路流量紀錄進行偵辦犯罪，自無侵害其權益之問題，爰增訂第十項規定。"},{"bill":"202110053900000","text":"檢察官、司法警察官為偵查犯罪及蒐集證據，有事實足認通訊使用者資料於本案之偵查有必要性及關連性時，得由檢察官依職權或司法警察官經檢察官許可後調取之。\n檢察官為偵查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，除有急迫情形不及事先聲請者外，應以書面聲請該管法院核發調取票。聲請書之應記載事項，準用前條第一項之規定。\n司法警察官為調查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之調查有必要性及關連性時，得依前項規定，報請檢察官許可後向該管法院聲請核發調取票。\n檢察官、司法警察官為偵辦最輕本刑十年以上有期徒刑之罪、強盜、搶奪、詐欺、恐嚇、擄人勒贖、妨害電腦使用、脫逃，及違反人口販運防制法、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、組織犯罪防制條例、廢棄物清理法、兒童及少年性剝削防制條例、洗錢防制法、國家安全法、反滲透法、總統副總統選舉罷免法、公職人員選舉罷免法、農會法第四十七條之一至第四十七條之三、漁會法第五十條之一至第五十條之三等罪，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，得由檢察官依職權或司法警察官經檢察官許可後，調取通信紀錄或網路流量紀錄，不受前二項之限制。\n依第二項急迫情形調取通信紀錄或網路流量紀錄後，應於二十四小時內向法院補行聲請調取票。\n調取票，應記載下列事項：\n一、案由。\n二、應調取之通信紀錄或網路流量紀錄。\n三、有效期間，逾期不得執行調取及調取後應將調取票交回之意旨。\n第二項、第三項及第五項之聲請經法院駁回者，不得聲明不服。\n核發調取票之程序，不公開之。\n有調取第七條之監察對象通信紀錄、網路流量紀錄或通訊使用者資料必要者，由綜理國家情報工作機關向電信事業、設置公眾電信網路者或郵政事業調取，不受前八項之限制。\n檢察官、司法警察官為偵查犯罪及蒐集證據，經用戶或電信使用人當場同意，得調取其通訊使用者資料、通信紀錄或網路流量紀錄，不受第一項至第八項之限制。但執行人員應出示證件，並將其同意之意旨記載於筆錄。","note":"一、通訊使用者資料係電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料，性質上屬於個人資料保護法第二條第一款所規範之「個人資料」。調取通訊使用者資料對隱私侵害雖較通信紀錄或通訊監察低，惟仍應至少以檢察官保留為原則。\n二、現行第一項有關調取通信紀錄之規定移列第二項，並刪除「最重本刑三年以上有期徒刑之罪」要件限制，爰刪除「最重本刑三年以上有期徒刑之罪」要件，並酌作文字修正。\n三、現行第二項規定司法警察官調取通信紀錄之要件「必要時」之標準低於修正條文第二項檢察官調取通信紀錄之要件，滋生爭議，爰酌為修正，並移列為第三項。\n四、現行第三項移列為第四項。因科技發展快速，不同類型電腦犯罪案件日增，犯罪手法隱密、快速，為即時偵查犯罪及保存證據，有儘速調取相關紀錄之必要；違反廢棄物清理法犯罪案件，對環境或鄰近居民生命、身體安全造成之危害預即時遏止；人犯脫逃案件亦有危及脫逃路線沿線民眾之生命安全之高度可能性；兒童及少年性剝削防制條犯有即時援救被害及阻止危害擴大之需要；洗錢犯罪因其犯罪所得金流常迅速經由層層轉匯而難以追返；國家安全法、反滲透法等相關犯罪，嚴重危害國家利益；總統副總統選舉罷免法、公職人員選舉罷免法、農會法、漁會法有關賄選或妨害選舉、罷免公正性之罪，如不儘速查緝，將立即造成選舉、罷免之不公正結果。上述犯罪均有爭取時效而儘速調取相關通信紀錄之必要；爰於本項增列前開犯罪得由檢察官依職權調取之規定。\n五、依修正條文第二項急迫情形調取通信紀錄後，向法院補行聲請調取票之期限應予明確規定，爰修正現行第四項規定，並移列為第五項。\n六、現行第五項第二款配合第一項通訊使用者資料修正為得依職權調取，刪除使用者資料之文字，現行第八項酌作文字修正，並分別移列為第六項、第九項。\n七、現行第六項修正所引項次，並移列為第七項。\n八、第七項移列為第八項，內容未修正。\n九、增訂調取「網路流量紀錄」之規定：網路犯罪及資安駭侵事件日益增加，如券商集體遭DDos攻擊勒索案、大型企業遭受勒索軟體攻擊、民眾個資遭盜取而致詐騙案件、網路炸彈恐嚇信件或網路平台販賣兒少或其他被害人性私密影像、付費式偷拍影片或深度偽造色情影片等網路性暴力案件，爰比照調取通信紀錄之程序，於修正條文第二項至第六項、第九項及第十項增訂調取網路流量紀錄之規定。\n十、用戶或電信使用人如出於自願性同意檢察官、司法警察官為無票調取，既已自願放棄其隱私期待，似無加以保護之必要；又為免自願性之同意發生爭執或概括取得同意，爰參酌刑事訴訟法第131-1條及其立法理由，新增同意調取之規定，並應將其同意意旨記明筆錄，以明責任。"},{"bill":"202110054990000","text":"檢察官、司法警察官為偵查犯罪及蒐集證據，有事實足認通訊使用者資料於本案之偵查有必要性及關連性時，得調取之。\n檢察官為偵查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，除有急迫情形不及事先聲請者外，應以書面聲請該管法院核發調取票。聲請書之應記載事項，準用前條第一項之規定。\n司法警察官為調查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之調查有必要性及關連性時，得依前項規定，報請檢察官許可後，向該管法院聲請核發調取票。\n檢察官、司法警察官為偵辦最輕本刑十年以上有期徒刑之罪、強盜、搶奪、詐欺、恐嚇、擄人勒贖、妨害電腦使用、脫逃，及違反人口販運防制法、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、組織犯罪防制條例、廢棄物清理法、兒童及少年性剝削防制條例、洗錢防制法、國家安全法、反滲透法、總統副總統選舉罷免法、公職人員選舉罷免法、農會法第四十七條之一至第四十七條之三、漁會法第五十條之一至第五十條之三等罪，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，得由檢察官依職權或司法警察官經檢察官許可後，調取通信紀錄或網路流量紀錄，不受前二項之限制。\n依第二項急迫情形調取通信紀錄或網路流量紀錄後，應於二十四小時內向法院補行聲請調取票。\n調取票，應記載下列事項：\n一、案由。\n二、應調取之通信紀錄或網路流量紀錄。\n三、有效期間，逾期不得執行調取及調取後應將調取票交回之意旨。\n第二項、第三項及第五項之聲請經法院駁回者，不得聲明不服。\n核發調取票之程序，不公開之。\n有調取第七條之監察對象通信紀錄、網路流量紀錄或通訊使用者資料必要者，由綜理國家情報工作機關向電信事業、設置公眾電信網路者或郵政事業調取，不受前八項之限制。\n檢察官、司法警察官為偵查犯罪及蒐集證據，經用戶或電信使用人同意，得調取其通訊使用者資料、通信紀錄或網路流量紀錄，不受第一項至第八項之限制。","note":"一、通訊使用者資料係電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料，性質上屬於個人資料保護法第二條第一款所規範之「個人資料」，所涉及隱私程度較低，與通訊之有無、對象、時間、方式及內容等事項無涉，非屬司法院釋字第六三一號解釋對於秘密通訊自由之涵攝範圍，調取通訊使用者資料對於隱私權之影響較為輕微，與通信紀錄涉及電信使用人與他人聯絡狀況、使用通訊之型態及所在位置等資訊，所涉隱私程度有所不同。為提升偵查效率，爰將第一項通信使用者資料調取之規定修正為檢察官、司法警察官得依職權調取，並配合修正條文第三條之一，修正用語為「通訊使用者資料」。\n二、現行第一項有關調取通信紀錄之規定移列第二項，並刪除「最重本刑三年以上有期徒刑之罪」要件限制：\n(一)現行規定限制調取通信紀錄之門檻，導致諸多案件無法調取通信紀錄，有害犯罪之調查及真實之發現，更有礙於對被害人及弱勢團體之權利保護，例如刑法第二百七十一條第三項預備殺人罪、第三百二十八條第五項預備強盜罪、第三百三十九條之一準詐欺罪、第三百四十七條第四項預備擄人勒贖罪、兒童及少年性剝削防制條例第四十五條第二項引誘兒童或少年涉及色情罪、公職人員選舉罷免法第九十九條第二項預備賄選罪等，對被害人權益及公益保障顯有重大影響。此外，檢察官辦理相驗案件之初，常因是否有人涉及犯罪或所涉罪名均待釐清，致不符合「偵查最重本刑三年以上有期徒刑之罪」要件，無法即時調取通信紀錄查明死者生前通訊情形，妨害人民權益及社會治安之保障，亦影響通信紀錄作為被告不在場或非實際持用人之有利證據，有礙刑事司法對真實之發現。\n(二)刑事訴訟法就拘提、搜索、羈押等干預基本權程度較高之強制處分，亦未限制一定刑度以上之罪始得發動，通信紀錄調取相較於上開強制處分干預更為輕微，限制最重本刑三年以上之罪始得調取，恐有輕重失衡。爰刪除「最重本刑三年以上有期徒刑之罪」要件，並酌作文字修正。\n三、現行第二項規定司法警察官調取通信紀錄之要件「必要時」之標準低於修正條文第二項檢察官調取通信紀錄之要件，滋生爭議，爰酌為修正，並移列為第三項。\n四、現行第三項移列為第四項。因科技發展快速，不同類型電腦犯罪案件日增，犯罪手法隱密、快速，為即時偵查犯罪及保存證據，有儘速調取相關紀錄之必要；違反廢棄物清理法犯罪案件，對環境或鄰近居民生命、身體安全造成之危害預即時遏止；人犯脫逃案件亦有危及脫逃路線沿線民眾之生命安全之高度可能性；兒童及少年性剝削防制條例犯罪有即時援救被害人及阻止危害擴大之需要；洗錢犯罪因其犯罪所得金流常迅速經由層層轉匯而難以追返；國家安全法、反滲透法等相關犯罪，嚴重危害國家利益；總統副總統選舉罷免法、公職人員選舉罷免法、農會法、漁會法有關賄選或妨害選舉、罷免公正性之罪，如不儘速查緝，將立即造成選舉、罷免之不公正結果。上述犯罪均有爭取時效而儘速調取相關通信紀錄之必要；爰於本項增列前開犯罪得由檢察官依職權調取之規定。\n五、依修正條文第二項急迫情形調取通信紀錄後，向法院補行聲請調取票之期限應予明確規定，爰修正現行第四項規定，並移列為第五項。\n六、現行第五項第二款配合第一項通訊使用者資料修正為得依職權調取，刪除使用者資料之文字，現行第八項酌作文字修正，並分別移列為第六項、第九項。\n七、現行第六項修正所引項次，並移列為第七項。\n八、第七項移列為第八項，內容未修正。\n九、如經用戶或電信使用人同意而調取其通訊使用者資料、通信紀錄，無礙其個人資訊自決權或秘密通訊自由之保障，爰增訂第十項規定。\n十、增訂調取「網路流量紀錄」之規定：\n(一)網路犯罪及資安駭侵事件日益增加，如券商集體遭DDos攻擊勒索案、大型企業遭受勒索軟體攻擊、民眾個資遭盜取而致詐騙案件、網路炸彈恐嚇信件或網路平台販賣兒少或其他被害人性私密影像、付費式偷拍影片或深度偽造色情影片等網路性暴力案件，是類案件發生時，缺乏相關網路連線流量紀錄致案件難以查緝、溯源攻擊者或色情網站經營者真正身分、手法、被害人範圍，亦無法利用網路流量紀錄之分析，發現潛在被害者以提早防範，致查緝、後續預警及防禦作為難以實行，影響被害人權益、資安及國家安全甚鉅。\n(二)網路流量紀錄與通信紀錄相類，均不涉及通訊內容，對個人隱私權及秘密通訊自由之干預有限，然該等資訊應用於查緝網際網路犯罪或資安駭侵案件極有助益，不僅得為認定犯罪事實之補強證據，亦得作為認定被告不在場或非實際持用人等有利證據。參照國外立法例，澳洲已於二○一五年通過法案Telecommunica-tions（Interception and AccessAmendment（Data Retention）Act2015），予網路服務提供者保存一定網路連線資料之義務；美國「儲存通信法」（Stored Communication Act）及通訊協助執行法（Communication Assistance for Law Enforcement Act，CALEA），亦規範電信業者有協助執法機關調取相關紀錄之義務。爰比照調取通信紀錄之程序，於修正條文第二項至第六項、第九項及第十項增訂調取網路流量紀錄之規定。"},{"bill":"202110055570000","text":"檢察官、司法警察官為偵查犯罪及蒐集證據，有事實足認通訊使用者資料於本案之偵查有必要性及關連性時，得調取之。\n檢察官為偵查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，除有急迫情形不及事先聲請者外，應以書面聲請該管法院核發調取票。聲請書之應記載事項，準用前條第一項之規定。\n司法警察官為調查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之調查有必要性及關連性時，得依前項規定，報請檢察官許可後，向該管法院聲請核發調取票。\n檢察官、司法警察官為偵辦最輕本刑十年以上有期徒刑之罪、強盜、搶奪、詐欺、恐嚇、擄人勒贖、妨害電腦使用、脫逃，及違反人口販運防制法、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、組織犯罪防制條例、廢棄物清理法、兒童及少年性剝削防制條例、洗錢防制法、國家安全法、反滲透法、總統副總統選舉罷免法、公職人員選舉罷免法、農會法第四十七條之一至第四十七條之三、漁會法第五十條之一至第五十條之三等罪，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，得由檢察官依職權或司法警察官經檢察官許可後，調取通信紀錄或網路流量紀錄，不受前二項之限制。\n依第二項急迫情形調取通信紀錄或網路流量紀錄後，應於二十四小時內向法院補行聲請調取票。\n調取票，應記載下列事項：\n一、案由。\n二、應調取之通信紀錄或網路流量紀錄。\n三、有效期間，逾期不得執行調取及調取後應將調取票交回之意旨。\n第二項、第三項及第五項之聲請經法院駁回者，不得聲明不服。\n核發調取票之程序，不公開之。\n有調取第七條之監察對象通信紀錄、網路流量紀錄或通訊使用者資料必要者，由綜理國家情報工作機關向電信事業、設置公眾電信網路者或郵政事業調取，不受前八項之限制。\n檢察官、司法警察官為偵查犯罪及蒐集證據，經用戶或電信使用人同意，得調取其通訊使用者資料、通信紀錄或網路流量紀錄，不受第一項至第八項之限制。","note":"一、通訊使用者資料係電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料，性質上屬於個人資料保護法第二條第一款所規範之「個人資料」，所涉及隱私程度較低，與通訊之有無、對象、時間、方式及內容等事項無涉，非屬司法院釋字第六三一號解釋對於秘密通訊自由之涵攝範圍，調取通訊使用者資料對於隱私權之影響較為輕微，與通信紀錄涉及電信使用人與他人聯絡狀況、使用通訊之型態及所在位置等資訊，所涉隱私程度有所不同。為提升偵查效率，爰將第一項通信使用者資料調取之規定修正為檢察官、司法警察官得依職權調取，並配合修正條文第三條之一，修正用語為「通訊使用者資料」。\n二、現行第一項有關調取通信紀錄之規定移列第二項，並刪除「最重本刑三年以上有期徒刑之罪」要件限制：\n(一)現行規定限制調取通信紀錄之門檻，導致諸多案件無法調取通信紀錄，有害犯罪之調查及真實之發現，更有礙於對被害人及弱勢團體之權利保護，例如刑法第二百七十一條第三項預備殺人罪、第三百二十八條第五項預備強盜罪、第三百三十九條之一準詐欺罪、第三百四十七條第四項預備擄人勒贖罪、兒童及少年性剝削防制條例第四十五條第二項引誘兒童或少年涉及色情罪、公職人員選舉罷免法第九十九條第二項預備賄選罪等，對被害人權益及公益保障顯有重大影響。此外，檢察官辦理相驗案件之初，常因是否有人涉及犯罪或所涉罪名均待釐清，致不符合「偵查最重本刑三年以上有期徒刑之罪」要件，無法即時調取通信紀錄查明死者生前通訊情形，妨害人民權益及社會治安之保障，亦影響通信紀錄作為被告不在場或非實際持用人之有利證據，有礙刑事司法對真實之發現。\n(二)刑事訴訟法就拘提、搜索、羈押等干預基本權程度較高之強制處分，亦未限制一定刑度以上之罪始得發動，通信紀錄調取相較於上開強制處分干預更為輕微，限制最重本刑三年以上之罪始得調取，恐有輕重失衡。爰刪除「最重本刑三年以上有期徒刑之罪」要件，並酌作文字修正。\n三、現行第二項規定司法警察官調取通信紀錄之要件「必要時」之標準低於修正條文第二項檢察官調取通信紀錄之要件，滋生爭議，爰酌為修正，並移列為第三項。\n四、現行第三項移列為第四項。因科技發展快速，不同類型電腦犯罪案件日增，犯罪手法隱密、快速，為即時偵查犯罪及保存證據，有儘速調取相關紀錄之必要；違反廢棄物清理法犯罪案件，對環境或鄰近居民生命、身體安全造成之危害預即時遏止；人犯脫逃案件亦有危及脫逃路線沿線民眾之生命安全之高度可能性；兒童及少年性剝削防制條例犯罪有即時援救被害人及阻止危害擴大之需要；洗錢犯罪因其犯罪所得金流常迅速經由層層轉匯而難以追返；國家安全法、反滲透法等相關犯罪，嚴重危害國家利益；總統副總統選舉罷免法、公職人員選舉罷免法、農會法、漁會法有關賄選或妨害選舉、罷免公正性之罪，如不儘速查緝，將立即造成選舉、罷免之不公正結果。上述犯罪均有爭取時效而儘速調取相關通信紀錄之必要；爰於本項增列前開犯罪得由檢察官依職權調取之規定。\n五、依修正條文第二項急迫情形調取通信紀錄後，向法院補行聲請調取票之期限應予明確規定，爰修正現行第四項規定，並移列為第五項。\n六、現行第五項第二款配合第一項通訊使用者資料修正為得依職權調取，刪除使用者資料之文字，現行第八項酌作文字修正，並分別移列為第六項、第九項。\n七、現行第六項修正所引項次，並移列為第七項。\n八、第七項移列為第八項，內容未修正。\n九、如經用戶或電信使用人同意而調取其通訊使用者資料、通信紀錄，無礙其個人資訊自決權或秘密通訊自由之保障，爰增訂第十項規定。\n十、增訂調取「網路流量紀錄」之規定：\n(一)網路犯罪及資安駭侵事件日益增加，如券商集體遭DDos攻擊勒索案、大型企業遭受勒索軟體攻擊、民眾個資遭盜取而致詐騙案件、網路炸彈恐嚇信件或網路平台販賣兒少或其他被害人性私密影像、付費式偷拍影片或深度偽造色情影片等網路性暴力案件，是類案件發生時，缺乏相關網路連線流量紀錄致案件難以查緝、溯源攻擊者或色情網站經營者真正身分、手法、被害人範圍，亦無法利用網路流量紀錄之分析，發現潛在被害者以提早防範，致查緝、後續預警及防禦作為難以實行，影響被害人權益、資安及國家安全甚鉅。\n(二)網路流量紀錄與通信紀錄相類，均不涉及通訊內容，對個人隱私權及秘密通訊自由之干預有限，然該等資訊應用於查緝網際網路犯罪或資安駭侵案件極有助益，不僅得為認定犯罪事實之補強證據，亦得作為認定被告不在場或非實際持用人等有利證據。參照國外立法例，澳洲已於二○一五年通過法案Telecommunica-tions（Interception and Access Amendment（Data Retention）Act2015），課予網路服務提供者保存一定網路連線資料之義務；美國「儲存通信法」（Stored Communication Act）及通訊協助執行法（Communication  Assistance for Law Enforcement Act,CALEA），亦規範電信業者有協助執法機關調取相關紀錄之義務。爰比照調取通信紀錄之程序，於修正條文第二項至第六項、第九項及第十項增訂調取網路流量紀錄之規定。"}],"changed":true,"final":"檢察官、司法警察官為偵查犯罪及蒐集證據，有事實足認通訊使用者資料於本案之偵查有必要性及關連性時，得調取之。\n檢察官為偵查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，除有急迫情形不及事先聲請者外，應以書面聲請該管法院核發調取票。聲請書之應記載事項，準用前條第一項之規定。\n司法警察官為調查犯罪及蒐集證據，有事實足認通信紀錄或網路流量紀錄於本案之調查有必要性及關連性時，得依前項規定，報請檢察官許可後，向該管法院聲請核發調取票。\n檢察官、司法警察官為偵辦最輕本刑十年以上有期徒刑之罪、強盜、搶奪、詐欺、恐嚇、擄人勒贖、妨害電腦使用、脫逃，及違反人口販運防制法、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、組織犯罪防制條例、廢棄物清理法、兒童及少年性剝削防制條例、洗錢防制法、國家安全法、反滲透法、總統副總統選舉罷免法、公職人員選舉罷免法、農會法第四十七條之一至第四十七條之三、漁會法第五十條之一至第五十條之三等罪，有事實足認通信紀錄或網路流量紀錄於本案之偵查有必要性及關連性時，得由檢察官依職權或司法警察官經檢察官許可後，調取通信紀錄或網路流量紀錄，不受前二項之限制。\n依第二項急迫情形調取通信紀錄或網路流量紀錄後，應於二十四小時內向法院補行聲請調取票。\n調取票，應記載下列事項：\n一、案由。\n二、應調取之通信紀錄或網路流量紀錄。\n三、有效期間，逾期不得執行調取及調取後應將調取票交回之意旨。\n第二項、第三項及第五項之聲請經法院駁回者，不得聲明不服。\n核發調取票之程序，不公開之。\n有調取第七條之監察對象通信紀錄、網路流量紀錄或通訊使用者資料必要者，由綜理國家情報工作機關向電信事業、設置公眾電信網路者或郵政事業調取，不受前八項之限制。\n檢察官、司法警察官為偵查犯罪及蒐集證據，經用戶或電信使用人同意，得調取其通訊使用者資料、通信紀錄或網路流量紀錄，不受第一項至第八項之限制。\n通訊使用者資料調取之程序、資料保存、銷燬、監督、稽核等相關事項之辦法，由法務部會同內政部並會商相關機關定之。","finalWhy":"一、通訊使用者資料係電信使用人姓名或名稱、身分證明文件字號、地址、電信號碼及申請各項電信服務所填列之資料，性質上屬於個人資料保護法第二條第一款所規範之「個人資料」，所涉及隱私程度較低，與通訊之有無、對象、時間、方式及內容等事項無涉，非屬司法院釋字第六三一號解釋對於秘密通訊自由之涵攝範圍，調取通訊使用者資料對於隱私權之影響較為輕微，與通信紀錄涉及電信使用人與他人聯絡狀況、使用通訊之型態及所在位置等資訊，所涉隱私程度有所不同。為提升偵查效率，爰將第一項通信使用者資料調取之規定修正為檢察官、司法警察官得依職權調取，並配合修正條文第三條之一，修正用語為「通訊使用者資料」。\n二、原第一項有關調取通信紀錄之規定移列第二項，並刪除「最重本刑三年以上有期徒刑之罪」要件限制：\n(一)原規定限制調取通信紀錄之門檻，導致諸多案件無法調取通信紀錄，有害犯罪之調查及真實之發現，更有礙於對被害人及弱勢團體之權利保護，例如刑法第二百七十一條第三項預備殺人罪、第三百二十八條第五項預備強盜罪、第三百三十九條之一準詐欺罪、第三百四十七條第四項預備擄人勒贖罪、兒童及少年性剝削防制條例第四十五條第二項引誘兒童或少年涉及色情罪、公職人員選舉罷免法第九十九條第二項預備賄選罪等，對被害人權益及公益保障顯有重大影響。此外，檢察官辦理相驗案件之初，常因是否有人涉及犯罪或所涉罪名均待釐清，致不符合「偵查最重本刑三年以上有期徒刑之罪」要件，無法即時調取通信紀錄查明死者生前通訊情形，妨害人民權益及社會治安之保障，亦影響通信紀錄作為被告不在場或非實際持用人之有利證據，有礙刑事司法對真實之發現。\n(二)刑事訴訟法就拘提、搜索、羈押等干預基本權程度較高之強制處分，亦未限制一定刑度以上之罪始得發動，通信紀錄調取相較於上開強制處分干預更為輕微，限制最重本刑三年以上之罪始得調取，恐有輕重失衡。爰刪除「最重本刑三年以上有期徒刑之罪」要件，並酌作文字修正。\n三、原第二項規定司法警察官調取通信紀錄之要件「必要時」之標準低於修正條文第二項檢察官調取通信紀錄之要件，滋生爭議，爰酌為修正，並移列為第三項。\n四、原第三項移列為第四項。因科技發展快速，不同類型電腦犯罪案件日增，犯罪手法隱密、快速，為即時偵查犯罪及保存證據，有儘速調取相關紀錄之必要；違反廢棄物清理法犯罪案件，對環境或鄰近居民生命、身體安全造成之危害預即時遏止；人犯脫逃案件亦有危及脫逃路線沿線民眾之生命安全之高度可能性；兒童及少年性剝削防制條例犯罪有即時援救被害人及阻止危害擴大之需要；洗錢犯罪因其犯罪所得金流常迅速經由層層轉匯而難以追返；國家安全法、反滲透法等相關犯罪，嚴重危害國家利益；總統副總統選舉罷免法、公職人員選舉罷免法、農會法、漁會法有關賄選或妨害選舉、罷免公正性之罪，如不儘速查緝，將立即造成選舉、罷免之不公正結果。上述犯罪均有爭取時效而儘速調取相關通信紀錄之必要；爰於本項增列前開犯罪得由檢察官依職權調取之規定。\n五、依修正條文第二項急迫情形調取通信紀錄後，向法院補行聲請調取票之期限應予明確規定，爰修正原第四項規定，並移列為第五項。\n六、原第五項第二款配合第一項通訊使用者資料修正為得依職權調取，刪除使用者資料之文字，原第八項酌作文字修正，並分別移列為第六項、第九項。\n七、原第六項修正所引項次，並移列為第七項。\n八、第七項移列為第八項，內容未修正。\n九、如經用戶或電信使用人同意而調取其通訊使用者資料、通信紀錄，無礙其個人資訊自決權或秘密通訊自由之保障，爰增訂第十項規定。\n十、增訂調取「網路流量紀錄」之規定：\n(一)網路犯罪及資安駭侵事件日益增加，如券商集體遭DDos攻擊勒索案、大型企業遭受勒索軟體攻擊、民眾個資遭盜取而致詐騙案件、網路炸彈恐嚇信件或網路平台販賣兒少或其他被害人性私密影像、付費式偷拍影片或深度偽造色情影片等網路性暴力案件，是類案件發生時，缺乏相關網路連線流量紀錄致案件難以查緝、溯源攻擊者或色情網站經營者真正身分、手法、被害人範圍，亦無法利用網路流量紀錄之分析，發現潛在被害者以提早防範，致查緝、後續預警及防禦作為難以實行，影響被害人權益、資安及國家安全甚鉅。\n(二)網路流量紀錄與通信紀錄相類，均不涉及通訊內容，對個人隱私權及秘密通訊自由之干預有限，然該等資訊應用於查緝網際網路犯罪或資安駭侵案件極有助益，不僅得為認定犯罪事實之補強證據，亦得作為認定被告不在場或非實際持用人等有利證據。參照國外立法例，澳洲已於二○一五年通過法案Telecommunica-tions（Interception and Access Amendment（Data Retention） Act2015），課予網路服務提供者保存一定網路連線資料之義務；美國「儲存通信法」（Stored Communication Act）及通訊協助執行法（Communication Assistance for Law Enforcement Act, CALEA），亦規範電信業者有協助執法機關調取相關紀錄之義務。爰比照調取通信紀錄之程序，於修正條文第二項至第六項、第九項及第十項增訂調取網路流量紀錄之規定。\n十一、為加強對執法機關調取通訊使用者資料之監督管理，爰增訂第十一項，就通訊使用者資料調取之程序、資料保存、銷燬、監督、稽核等相關事項，授權另定辦法規範之。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十四條","current":"通訊監察之執行機關及處所，得依聲請機關之聲請定之。法官依職權核發通訊監察書時，由核發人指定之；依第七條規定核發時，亦同。\n電信事業及郵政事業有協助執行通訊監察之義務；其協助內容為執行機關得使用該事業之通訊監察相關設施與其人員之協助。\n前項因協助執行通訊監察所生之必要費用，於執行後，得請求執行機關支付；其項目及費額由交通部會商有關機關訂定公告之。\n電信事業之通訊系統應具有配合執行監察之功能，並負有協助建置機關建置、維持通訊監察系統之義務。但以符合建置時之科技及經濟上合理性為限，並不得逾越期待可能性。\n前項協助建置通訊監察系統所生之必要費用，由建置機關負擔。另因協助維持通訊監察功能正常作業所生之必要費用，由交通部會商有關機關訂定公告之。","versions":[{"bill":"201110047310000","text":"通訊監察之執行機關及處所，得依聲請機關之聲請定之。法官依職權核發通訊監察書時，由核發人指定之；依第七條規定核發時，亦同。\n電信事業、設置公眾電信網路者及郵政事業有協助執行通訊監察之義務；其協助內容為執行機關得使用該事業之通訊監察相關設施與其人員之協助。\n前項因協助執行通訊監察所生之必要費用，於執行後，得請求執行機關支付；其項目及費額由目的事業主管機關會商有關機關訂定公告之。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊系統應具有配合執行監察之功能，並負有協助建置機關建置、維持通訊監察系統之義務。但以符合建置時之科技及經濟上合理性為限，並不得逾越期待可能性。\n前項協助建置通訊監察系統所生之必要費用，由建置機關負擔。另因協助維持通訊監察功能正常作業所生之必要費用，由目的事業主管機關會商有關機關訂定公告之。","note":"一、第一項未修正。\n二、電信管理法第九條第四項規定電信事業及設置公眾電信網路者有依本法協助執行通訊監察之義務，爰修正第二項，將設置公眾電信網路者納入具有協助執行通訊監察義務之主體。\n三、依機關組織法規管轄及業務權責，電信事業之目的事業主管機關為國家通訊傳播委員會，郵政事業之目的事業主管機關為交通部，為期明確，爰將第三項及第五項之交通部修正為目的事業主管機關。\n四、電信管理法第二十二條第二項規定，設置公眾電信網路者經通訊監察之建置機關指定者，其電信網路應依本法具有配合執行監察之功能，並負有協助建置與維持通訊監察系統之義務，爰配合修正第四項規定。"},{"bill":"202110050370000","text":"通訊監察之執行機關及處所，得依聲請機關之聲請定之。法官依職權核發通訊監察書時，由核發人指定之；依第七條規定核發時，亦同。\n電信事業、設置公眾電信網路者及郵政事業有協助執行通訊監察之義務；其協助內容為執行機關得使用該事業之通訊監察相關設施與其人員之協助。\n前項因協助執行通訊監察所生之必要費用，於執行後，得請求執行機關支付；其項目及費額由目的事業主管機關會商有關機關訂定公告之。\n電信事業及經通訊監察建置機關指定之設置公眾電信網路者之通訊系統應具有配合執行監察之功能，並負有協助建置機關建置、維持通訊監察系統之義務。但以符合建置時之科技及經濟上合理性為限，並不得逾越期待可能性。\n前項協助建置通訊監察系統所生之必要費用，由建置機關負擔。另因協助維持通訊監察功能正常作業所生之必要費用，由目的事業主管機關會商有關機關訂定公告之。","note":"一、第一項未修正。\n二、配合電信管理法第三條第一項第六款將公眾電信網路納入規範，亦於第九條第四項明定電信事業及設置公眾電信網路者有依本法協助執行通訊監察之義務，爰修正本條第二項規定。\n三、電信事業之目的事業主管機關為國家通訊傳播委員會；郵政事業之目的事業主管機關為交通部，為期明確，爰將第三項、第五項之交通部修正為目的事業主管機關。\n四、配合電信管理法第二十二條第二項已規定設置公眾電信網路者經通訊監察之建置機關指定者，其電信網路應依本法具有配合執行監察之功能，並負有協助建置與維持通訊監察系統之義務，爰修正本條第四項規定。"},{"bill":"202110054990000","text":"通訊監察之執行機關及處所，得依聲請機關之聲請定之。法官依職權核發通訊監察書時，由核發人指定之；依第七條規定核發時，亦同。\n電信事業、設置公眾電信網路者及郵政事業有協助執行通訊監察之義務；其協助內容為執行機關得使用該事業之通訊監察相關設施與其人員之協助。\n前項因協助執行通訊監察所生之必要費用，於執行後，得請求執行機關支付；其項目及費額由目的事業主管機關會商有關機關訂定公告之。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊系統應具有配合執行監察之功能，並負有協助建置機關建置、維持通訊監察系統之義務。但以符合建置時之科技及經濟上合理性為限，並不得逾越期待可能性。\n前項協助建置通訊監察系統所生之必要費用，由建置機關負擔。另因協助維持通訊監察功能正常作業所生之必要費用，由目的事業主管機關會商有關機關訂定公告之。","note":"一、第一項未修正。\n二、電信管理法第九條第四項規定電信事業及設置公眾電信網路者有依本法協助執行通訊監察之義務，爰修正第二項，將設置公眾電信網路者納入具有協助執行通訊監察義務之主體。\n三、依機關組織法規管轄及業務權責，電信事業之目的事業主管機關為國家通訊傳播委員會，郵政事業之目的事業主管機關為交通部，為期明確，爰將第三項及第五項之交通部修正為目的事業主管機關。\n四、電信管理法第二十二條第二項規定，設置公眾電信網路者經通訊監察之建置機關指定者，其電信網路應依本法具有配合執行監察之功能，並負有協助建置與維持通訊監察系統之義務，爰配合修正第四項規定。"},{"bill":"202110055570000","text":"通訊監察之執行機關及處所，得依聲請機關之聲請定之。法官依職權核發通訊監察書時，由核發人指定之；依第七條規定核發時，亦同。\n電信事業、設置公眾電信網路者及郵政事業有協助執行通訊監察之義務；其協助內容為執行機關得使用該事業之通訊監察相關設施與其人員之協助。\n前項因協助執行通訊監察所生之必要費用，於執行後，得請求執行機關支付；其項目及費額由目的事業主管機關會商有關機關訂定公告之。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊系統應具有配合執行監察之功能，並負有協助建置機關建置、維持通訊監察系統之義務。但以符合建置時之科技及經濟上合理性為限，並不得逾越期待可能性。\n前項協助建置通訊監察系統所生之必要費用，由建置機關負擔。另因協助維持通訊監察功能正常作業所生之必要費用，由目的事業主管機關會商有關機關訂定公告之。","note":"一、第一項未修正。\n二、電信管理法第九條第四項規定電信事業及設置公眾電信網路者有依本法協助執行通訊監察之義務，爰修正第二項，將設置公眾電信網路者納入具有協助執行通訊監察義務之主體。\n三、依機關組織法規管轄及業務權責，電信事業之目的事業主管機關為國家通訊傳播委員會，郵政事業之目的事業主管機關為交通部，為期明確，爰將第三項及第五項之交通部修正為目的事業主管機關。\n四、電信管理法第二十二條第二項規定，設置公眾電信網路者經通訊監察之建置機關指定者，其電信網路應依本法具有配合執行監察之功能，並負有協助建置與維持通訊監察系統之義務，爰配合修正第四項規定。"}],"changed":true,"final":"通訊監察之執行機關及處所，得依聲請機關之聲請定之。法官依職權核發通訊監察書時，由核發人指定之；依第七條規定核發時，亦同。\n電信事業、設置公眾電信網路者及郵政事業有協助執行通訊監察之義務；其協助內容為執行機關得使用該事業之通訊監察相關設施與其人員之協助。\n前項因協助執行通訊監察所生之必要費用，於執行後，得請求執行機關支付；其項目及費額由目的事業主管機關會商有關機關訂定公告之。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊系統應具有配合執行監察之功能，並負有協助建置機關建置、維持通訊監察系統之義務。但以符合建置時之科技及經濟上合理性為限，並不得逾越期待可能性。\n前項協助建置通訊監察系統所生之必要費用，由建置機關負擔。另因協助維持通訊監察功能正常作業所生之必要費用，由目的事業主管機關會商有關機關訂定公告之。","finalWhy":"一、第一項未修正。\n二、電信管理法第九條第四項規定電信事業及設置公眾電信網路者有依本法協助執行通訊監察之義務，爰修正第二項，將設置公眾電信網路者納入具有協助執行通訊監察義務之主體。\n三、依機關組織法規管轄及業務權責，電信事業之目的事業主管機關為國家通訊傳播委員會，郵政事業之目的事業主管機關為交通部，為期明確，爰將第三項及第五項之交通部修正為目的事業主管機關。\n四、電信管理法第二十二條第二項規定，設置公眾電信網路者經通訊監察之建置機關指定者，其電信網路應依本法具有配合執行監察之功能，並負有協助建置與維持通訊監察系統之義務，爰配合修正第四項規定。","review":{"note":"照行政院提案通過","text":"通訊監察之執行機關及處所，得依聲請機關之聲請定之。法官依職權核發通訊監察書時，由核發人指定之；依第七條規定核發時，亦同。\n電信事業、設置公眾電信網路者及郵政事業有協助執行通訊監察之義務；其協助內容為執行機關得使用該事業之通訊監察相關設施與其人員之協助。\n前項因協助執行通訊監察所生之必要費用，於執行後，得請求執行機關支付；其項目及費額由目的事業主管機關會商有關機關訂定公告之。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊系統應具有配合執行監察之功能，並負有協助建置機關建置、維持通訊監察系統之義務。但以符合建置時之科技及經濟上合理性為限，並不得逾越期待可能性。\n前項協助建置通訊監察系統所生之必要費用，由建置機關負擔。另因協助維持通訊監察功能正常作業所生之必要費用，由目的事業主管機關會商有關機關訂定公告之。"}},{"no":"第十四條之一","current":null,"versions":[{"bill":"201110047310000","text":"電信事業及設置公眾電信網路者，有保存及協助執行調取通訊使用者資料、通信紀錄之義務。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，有保存及協助執行調取網路流量紀錄之義務。\n電信事業及設置公眾電信網路者因協助執行調取前二項資料或紀錄所生之必要費用，於執行後，得請求執行機關支付。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊或網路系統，應具有保存及執行調取網路流量紀錄之功能，並以公眾電信網路性能可予提供者為限。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，為建置保存網路流量紀錄之系統與維持保存及執行調取網路流量紀錄功能正常作業所生之必要費用，由建置機關負擔。\n網路流量紀錄系統之設置方式、保存方式、保存期間、查詢之作業程序、調取之項目、監督、費額及其他相關事項之辦法，由法務部會同內政部並會商國家通訊傳播委員會及相關機關定之。","note":"一、本條新增。\n二、電信管理法第九條第四項已規定電信事業及設置公眾電信網路者有依本法協助調取通訊使用者資料及通信紀錄之義務，爰為第一項規定。\n三、考量設置公眾電信網路者規模不一，而保存網路流量紀錄所涉系統建置、費用、設備及技術較複雜，爰增訂第二項及第四項，限制具有保存及協助執行調取網路流量紀錄義務之業者範圍，並限制其系統功能應以公眾電信網路性能可予提供者為限，以免對負有保存義務者造成不合理負擔。\n四、電信事業及設置公眾電信網路者雖有保存及協助調取第一項及第二項資料或紀錄之義務，惟協助調取時所生之設備使用或人力成本等必要費用，應得請求執行機關支付，以資衡平，爰增訂第三項。\n五、因保存及調取網路流量紀錄需另行建置系統，就該系統建置與後續維護所生之必要費用，應由建置機關負擔，爰增訂第五項。\n六、有關網路流量紀錄相關設置、保存或調取等細節事項，涉及相關機關主管事項，爰於第六項規定訂定授權辦法之主責機關及會商程序。"},{"bill":"202110050370000","text":"電信事業及設置公眾電信網路者有保存及協助執行調取通訊使用者資料、通信紀錄、網路流量紀錄之義務。\n電信事業及設置公眾電信網路者之通訊或網路系統，應具有保存及執行調取通信紀錄及網路流量紀錄之功能，並以公眾電信網路性能可予提供者為限。\n電信事業及設置公眾電信網路者因協助執行調取通訊使用者資料、通信紀錄、網路流量第一項紀錄所生之必要費用，於執行後，得請求執行機關支付。\n電信事業及設置公眾電信網路者為設置符合前項功能保存網路流量紀錄之系統及維持保存及調取第一項網路流量紀錄功能正常作業所生之必要費用，由建置機關負擔。其費用由目的事業主管機關會商有關機關訂定公告之。\n通訊使用者資料、通信紀錄及網路流量紀錄之保存方式、保存期間、查詢之作業程序、調取之項目與費額及其他相關事項之辦法，由目的事業主管機關會商有關機關定之。","note":"一、本條新增。\n二、電信管理法第九條第四項已規定電信事業及設置公眾電信網路者有依本法協助調取通訊使用者資料及通信紀錄之義務，另因應本法於第十一條之一新增調取流量紀錄之規定，爰增訂本條第一項，以茲明確。\n三、有關第一項調取通信紀錄、網路流量紀錄之義務，涉及紀錄之保存與調取，其技術可行性及耗費之經濟成本等問題，爰增訂第二項，規範該等紀錄之提供，應以公眾電信網路性能可予提供者為限，以免對負有第一項義務者，造成過度不合理之負擔。\n四、電信事業及設置公眾電信網路者雖有保存及協助調取通訊使用者資料、通信紀錄及網路流量紀錄之義務，惟電信事業及設置公眾電信網路者協助調取所生之設備使用或人力成本等必要費用，應得請求執行機關支付，以資衡平，爰增訂本條第三項。\n五、因保存及調取網路流量紀錄需另行建置系統，電信事業及設置公眾電信網路者因此所生之系統建置與維持保存或調取該紀錄功能正常作業所生之必要費用，應由建置機關負擔，以避免對電信事業及設置公眾電信網路者造成過苛負擔，爰增訂本條第四項。\n六、為明確化通訊使用者資料、通信紀錄及網路流量紀錄之保存方式、保存期間、查詢之作業程序、調取之項目，應支付費用之項目與標準等事項，爰規定由目的事業主管機關會商有關機關定之。"},{"bill":"202110054990000","text":"電信事業及設置公眾電信網路者，有保存及協助執行調取通訊使用者資料、通信紀錄之義務。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，有保存及協助執行調取網路流量紀錄之義務。\n電信事業及設置公眾電信網路者因協助執行調取前二項資料或紀錄所生之必要費用，於執行後，得請求執行機關支付。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊或網路系統，應具有保存及執行調取網路流量紀錄之功能，並以公眾電信網路性能可予提供者為限。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，為建置保存網路流量紀錄之系統與維持保存及執行調取網路流量紀錄功能正常作業所生之必要費用，由建置機關負擔。\n網路流量紀錄系統之設置方式、保存方式、保存期間、查詢之作業程序、調取之項目、監督、費額及其他相關事項之辦法，由法務部會同內政部並會商國家通訊傳播委員會及相關機關定之。","note":"一、本條新增。\n二、電信管理法第九條第四項已規定電信事業及設置公眾電信網路者有依本法協助調取通訊使用者資料及通信紀錄之義務，爰為第一項規定。\n三、考量設置公眾電信網路者規模不一，而保存網路流量紀錄所涉系統建置、費用、設備及技術較複雜，爰增訂第二項及第四項，限制具有保存及協助執行調取網路流量紀錄義務之業者範圍，並限制其系統功能應以公眾電信網路性能可予提供者為限，以免對負有保存義務者造成不合理負擔。\n四、電信事業及設置公眾電信網路者雖有保存及協助調取第一項及第二項資料或紀錄之義務，惟協助調取時所生之設備使用或人力成本等必要費用，應得請求執行機關支付，以資衡平，爰增訂第三項。\n五、因保存及調取網路流量紀錄需另行建置系統，就該系統建置與後續維護所生之必要費用，應由建置機關負擔，爰增訂第五項。\n六、有關網路流量紀錄相關設置、保存或調取等細節事項，涉及相關機關主管事項，爰於第六項規定訂定授權辦法之主責機關及會商程序。"},{"bill":"202110055570000","text":"電信事業及設置公眾電信網路者，有保存及協助執行調取通訊使用者資料、通信紀錄之義務。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，有保存及協助執行調取網路流量紀錄之義務。\n電信事業及設置公眾電信網路者因協助執行調取前二項資料或紀錄所生之必要費用，於執行後，得請求執行機關支付。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊或網路系統，應具有保存及執行調取網路流量紀錄之功能，並以公眾電信網路性能可予提供者為限。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，為建置保存網路流量紀錄之系統與維持保存及執行調取網路流量紀錄功能正常作業所生之必要費用，由建置機關負擔。\n網路流量紀錄系統之設置方式、保存方式、保存期間、查詢之作業程序、調取之項目、監督、費額及其他相關事項之辦法，由法務部會同內政部並會商國家通訊傳播委員會及相關機關定之。","note":"一、本條新增。\n二、電信管理法第九條第四項已規定電信事業及設置公眾電信網路者有依本法協助調取通訊使用者資料及通信紀錄之義務，爰為第一項規定。\n三、考量設置公眾電信網路者規模不一，而保存網路流量紀錄所涉系統建置、費用、設備及技術較複雜，爰增訂第二項及第四項，限制具有保存及協助執行調取網路流量紀錄義務之業者範圍，並限制其系統功能應以公眾電信網路性能可予提供者為限，以免對負有保存義務者造成不合理負擔。\n四、電信事業及設置公眾電信網路者雖有保存及協助調取第一項及第二項資料或紀錄之義務，惟協助調取時所生之設備使用或人力成本等必要費用，應得請求執行機關支付，以資衡平，爰增訂第三項。\n五、因保存及調取網路流量紀錄需另行建置系統，就該系統建置與後續維護所生之必要費用，應由建置機關負擔，爰增訂第五項。\n六、有關網路流量紀錄相關設置、保存或調取等細節事項，涉及相關機關主管事項，爰於第六項規定訂定授權辦法之主責機關及會商程序。"}],"changed":true,"final":"電信事業及設置公眾電信網路者，有保存及協助執行調取通訊使用者資料、通信紀錄之義務。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，有保存及協助執行調取網路流量紀錄之義務。\n電信事業及設置公眾電信網路者因協助執行調取前二項資料或紀錄所生之必要費用，於執行後，得請求執行機關支付。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊或網路系統，應具有保存及執行調取網路流量紀錄之功能，並以公眾電信網路性能可予提供者為限。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，為建置保存網路流量紀錄之系統與維持保存及執行調取網路流量紀錄功能正常作業所生之必要費用，由建置機關負擔。\n網路流量紀錄系統之設置方式、保存方式、保存期間、查詢之作業程序、調取之項目、監督、費額及其他相關事項之辦法，由法務部會同內政部並會商國家通訊傳播委員會及相關機關定之。","finalWhy":"一、本條新增。\n二、電信管理法第九條第四項已規定電信事業及設置公眾電信網路者有依本法協助調取通訊使用者資料及通信紀錄之義務，爰為第一項規定。\n三、考量設置公眾電信網路者規模不一，而保存網路流量紀錄所涉系統建置、費用、設備及技術較複雜，爰增訂第二項及第四項，限制具有保存及協助執行調取網路流量紀錄義務之業者範圍，並限制其系統功能應以公眾電信網路性能可予提供者為限，以免對負有保存義務者造成不合理負擔。\n四、電信事業及設置公眾電信網路者雖有保存及協助調取第一項及第二項資料或紀錄之義務，惟協助調取時所生之設備使用或人力成本等必要費用，應得請求執行機關支付，以資衡平，爰增訂第三項。\n五、因保存及調取網路流量紀錄需另行建置系統，就該系統建置與後續維護所生之必要費用，應由建置機關負擔，爰增訂第五項。\n六、有關網路流量紀錄相關設置、保存或調取等細節事項，涉及相關機關主管事項，爰於第六項規定訂定授權辦法之主責機關及會商程序。","review":{"note":"照行政院提案通過","text":"電信事業及設置公眾電信網路者，有保存及協助執行調取通訊使用者資料、通信紀錄之義務。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，有保存及協助執行調取網路流量紀錄之義務。\n電信事業及設置公眾電信網路者因協助執行調取前二項資料或紀錄所生之必要費用，於執行後，得請求執行機關支付。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，其通訊或網路系統，應具有保存及執行調取網路流量紀錄之功能，並以公眾電信網路性能可予提供者為限。\n電信事業及設置公眾電信網路者經通訊監察之建置機關指定者，為建置保存網路流量紀錄之系統與維持保存及執行調取網路流量紀錄功能正常作業所生之必要費用，由建置機關負擔。\n網路流量紀錄系統之設置方式、保存方式、保存期間、查詢之作業程序、調取之項目、監督、費額及其他相關事項之辦法，由法務部會同內政部並會商國家通訊傳播委員會及相關機關定之。"}},{"no":"第十五條","current":"第五條、第六條及第七條第二項通訊監察案件之執行機關於監察通訊結束時，應即敘明受監察人之姓名、住所或居所、該監察案件之第十一條第一項各款及通訊監察書核發機關文號、實際監察期間、有無獲得監察目的之通訊資料及救濟程序報由檢察官、綜理國家情報工作機關陳報法院通知受監察人。如認通知有妨害監察目的之虞或不能通知者，應一併陳報。\n通訊監察結束後，檢察官、綜理國家情報工作機關逾一個月仍未為前項之陳報者，法院應於十四日內主動通知受監察人。但不能通知者，不在此限。\n法院對於第一項陳報，除有具體理由足認通知有妨害監察目的之虞或不能通知之情形外，應通知受監察人。\n前項不通知之原因消滅後，執行機關應報由檢察官、綜理國家情報工作機關陳報法院補行通知。原因未消滅者，應於前項陳報後每三個月向法院補行陳報未消滅之情形。逾期未陳報者，法院應於十四日內主動通知受監察人。\n關於執行機關陳報事項經法院審查後，交由司法事務官通知受監察人與該受監察之電信服務用戶。但不能通知者，不在此限。\n前項受監察之電信服務用戶包括個人、機關（構）、或團體等。","versions":[{"bill":"202110057210000","text":"第五條、第六條及第七條第二項通訊監察案件之執行機關於監察通訊結束時，應即敘明受監察人之姓名、住所或居所、該監察案件之第十一條第一項各款及通訊監察書核發機關文號、實際監察期間、有無獲得監察目的之通訊資料及救濟程序報由檢察官、綜理國家情報工作機關陳報法院通知受監察人。如認通知有妨害監察目的之虞或不能通知者，應一併陳報。\n通訊監察結束後，檢察官、綜理國家情報工作機關逾一個月仍未為前項之陳報者，法院應於十四日內主動通知受監察人。但不能通知者，不在此限。\n法院對於第一項陳報，除有具體理由足認通知有妨害監察目的之虞或不能通知之情形外，應通知受監察人。\n前項不通知之原因消滅後，執行機關應報由檢察官、綜理國家情報工作機關陳報法院補行通知。原因未消滅者，應於前項陳報後每三個月向法院補行陳報未消滅之情形。逾期未陳報者，法院應於十四日內主動通知受監察人。\n關於執行機關陳報事項經法院審查後，交由司法事務官通知受監察人與該受監察之電信服務用戶。但不能通知者，不在此限。\n前項受監察之電信服務用戶包括個人、機關（構）、或團體等。\n前六項規定，於依本法規定調取他人通信紀錄或網路流量紀錄之情形，亦準用之。","note":"一、增列第七項，調取他人通信紀錄或網路流量紀錄之情形，應通知受監察人。\n二、鑑於對人民隱私權之保障，避免受監察人無所得知被監察情況，導致在實然面上不可能進行救濟，因此明定對於通信紀錄、網路流量紀錄之調取，執行機關有義務通知被調取人。"}],"changed":true,"final":"第五條、第六條及第七條第二項通訊監察案件之執行機關於監察通訊結束時，應即敘明受監察人之姓名、住所或居所、該監察案件之第十一條第一項各款及通訊監察書核發機關文號、實際監察期間、有無獲得監察目的之通訊資料及救濟程序報由檢察官、綜理國家情報工作機關陳報法院通知受監察人。如認通知有妨害監察目的之虞或不能通知者，應一併陳報。\n通訊監察結束後，檢察官、綜理國家情報工作機關逾一個月仍未為前項之陳報者，法院應於十四日內主動通知受監察人。但不能通知者，不在此限。\n法院對於第一項陳報，除有具體理由足認通知有妨害監察目的之虞或不能通知之情形外，應通知受監察人。\n前項不通知之原因消滅後，執行機關應報由檢察官、綜理國家情報工作機關陳報法院補行通知。原因未消滅者，應於前項陳報後每三個月向法院補行陳報未消滅之情形。逾期未陳報者，法院應於十四日內主動通知受監察人。\n關於執行機關陳報事項經法院審查後，交由司法事務官通知受監察人與該受監察之電信服務用戶。但不能通知者，不在此限。\n前項受監察之電信服務用戶包括個人、機關（構）、或團體等。\n前六項規定，於依本法規定調取他人網路流量紀錄之情形，亦準用之。但實施第十一條之一第四項調取網路流量紀錄之情形，應由執行機關通知。","finalWhy":"一、增列第七項，調取他人網路流量紀錄之情形，應通知受監察人。\n二、鑑於對人民隱私權之保障，避免受監察人無所得知被監察情況，導致在實然面上不可能進行救濟，因此明定對於網路流量紀錄之調取，執行機關有義務通知被調取人。","review":null},{"no":"第十八條之一","current":"依第五條、第六條或第七條規定執行通訊監察，取得其他案件之內容者，不得作為證據。但於發現後七日內補行陳報法院，並經法院審查認可該案件與實施通訊監察之案件具有關連性或為第五條第一項所列各款之罪者，不在此限。\n依第五條、第六條或第七條規定執行通訊監察所取得之內容或所衍生之證據與監察目的無關者，不得作為司法偵查、審判、其他程序之證據或其他用途，並依第十七條第二項規定予以銷燬。\n違反第五條、第六條或第七條規定進行監聽行為所取得之內容或所衍生之證據，於司法偵查、審判或其他程序中，均不得採為證據或其他用途，並依第十七條第二項規定予以銷燬。","versions":[{"bill":"202110053900000","text":"依第五條、第六條或第七條規定執行通訊監察，取得其他案件之內容者，不得作為證據。但於發現後七日內補行陳報法院，並經法院審查認可該案件與實施通訊監察之案件具有關連性或為第五條第一項所列各款之罪者，不在此限。\n依第五條、第六條或第七條規定執行通訊監察所取得之內容或所衍生之證據與監察目的無關者，不得作為司法偵查、審判、其他程序之證據或其他用途，並依第十七條第二項規定予以銷燬。\n違反第五條、第六條或第七條規定進行監聽行為所取得之內容或所衍生之證據，於司法偵查、審判或其他程序中，均不得採為證據或其他用途，並依第十七條第二項規定予以銷燬。\n前三項之規定，於違反第十一條之規定所取得之通訊使用者資料、通信紀錄或網路流量紀錄準用之。","note":"為加強人民隱私權之保障，於第十一條之一放寬偵查中調取通訊使用者資料、通信紀錄與網路流量紀錄之規定時，另就違法取得前開證據新增證據排除之法律效果，爰新增本條第四項。"}],"changed":false,"final":"依第五條、第六條或第七條規定執行通訊監察，取得其他案件之內容者，不得作為證據。但於發現後七日內補行陳報法院，並經法院審查認可該案件與實施通訊監察之案件具有關連性或為第五條第一項所列各款之罪者，不在此限。\n依第五條、第六條或第七條規定執行通訊監察所取得之內容或所衍生之證據與監察目的無關者，不得作為司法偵查、審判、其他程序之證據或其他用途，並依第十七條第二項規定予以銷燬。\n違反第五條、第六條或第七條規定進行監聽行為所取得之內容或所衍生之證據，於司法偵查、審判或其他程序中，均不得採為證據或其他用途，並依第十七條第二項規定予以銷燬。","finalWhy":null,"review":null},{"no":"第十九條","current":"違反本法或其他法律之規定監察他人通訊或洩漏、提供、使用監察通訊所得之資料者，負損害賠償責任。\n被害人雖非財產上之損害，亦得請求賠償相當之金額；其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項請求權，不得讓與或繼承。但以金額賠償之請求權已依契約承諾或已起訴者，不在此限。","versions":[{"bill":"202110057210000","text":"違反本法或其他法律之規定監察他人通訊或洩漏、提供、使用監察通訊所得之資料者，負損害賠償責任。\n被害人雖非財產上之損害，亦得請求賠償相當之金額；其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項請求權，不得讓與或繼承。但以金額賠償之請求權已依契約承諾或已起訴者，不在此限。\n前三項規定，於違反本法或其他法律之規定調取他人通信紀錄、通訊使用者資料及網路流量紀錄之情形，亦準用之。","note":"一、增列第四項，違法調取他人通信紀錄、通訊使用者資料及網路流量紀錄負損害賠償責任。\n二、鑑於通信紀錄、通訊使用者資料及網路流量紀錄為人民之秘密通訊自由，因此違法調取他人通信紀錄、通訊使用者資料及網路流量紀錄應負損害賠償責任，以保障人民秘密通訊自由及隱私權不受非法侵害。"}],"changed":true,"final":"違反本法或其他法律之規定監察他人通訊或洩漏、提供、使用監察通訊所得之資料者，負損害賠償責任。\n被害人雖非財產上之損害，亦得請求賠償相當之金額；其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項請求權，不得讓與或繼承。但以金額賠償之請求權已依契約承諾或已起訴者，不在此限。\n前三項規定，於違反本法或其他法律之規定調取他人通訊使用者資料及網路流量紀錄之情形，亦準用之。","finalWhy":"一、增列第四項，違法調取他人通訊使用者資料及網路流量紀錄負損害賠償責任。\n二、鑑於通訊使用者資料及網路流量紀錄為人民之秘密通訊自由，因此違法調取他人通訊使用者資料及網路流量紀錄應負損害賠償責任，以保障人民秘密通訊自由及隱私權不受非法侵害。","review":null},{"no":"第二十九條","current":"監察他人之通訊，而有下列情形之一者，不罰：\n一、依法律規定而為者。\n二、電信事業或郵政機關（構）人員基於提供公共電信或郵政服務之目的，而依有關法令執行者。\n三、監察者為通訊之一方或已得通訊之一方事先同意，而非出於不法目的者。","versions":[{"bill":"201110047310000","text":"監察他人之通訊，而有下列情形之一者，不罰：\n一、依法律規定而為。\n二、電信事業、設置公眾電信網路者或郵政事業人員基於提供公共電信、公眾電信網路或郵政服務之目的，而依有關法令執行。\n三、監察者為通訊之一方或已得通訊之一方事先同意，而非出於不法目的。","note":"電信管理法及修正條文第十四條均規定設置公眾電信網路者有協助執行通訊監察之義務，並因應郵政總局改制為中華郵政股份有限公司，爰修正第二款規定；另各款文字酌作修正。"},{"bill":"202110050370000","text":"監察他人之通訊，而有下列情形之一者，不罰：\n一、依法律規定而為者。\n二、電信事業、設置公眾電信網路者或郵政事業人員基於提供公共電信、公眾電信網路或郵政服務之目的，而依有關法令執行者。\n三、監察者為通訊之一方或已得通訊之一方事先同意，而非出於不法目的者。","note":"配合電信管理法第三條第一項第六款之修正，爰修正本條第二款之文字。"},{"bill":"202110054990000","text":"監察他人之通訊，而有下列情形之一者，不罰：\n一、依法律規定而為者。\n二、電信事業、設置公眾電信網路者或郵政事業人員基於提供公共電信、公眾電信網路或郵政服務之目的，而依有關法令執行。\n三、監察者為通訊之一方或已得通訊之一方事先同意，而非出於不法目的者。","note":"電信管理法及修正條文第十四條均規定設置公眾電信網路者有協助執行通訊監察之義務，並因應郵政總局改制為中華郵政股份有限公司，爰修正第二款規定；另各款文字酌作修正。"},{"bill":"202110055570000","text":"監察他人之通訊，而有下列情形之一者，不罰：\n一、依法律規定而為。\n二、電信事業、設置公眾電信網路者或郵政事業人員基於提供公共電信、公眾電信網路或郵政服務之目的，而依有關法令執行。\n三、監察者為通訊之一方或已得通訊之一方事先同意，而非出於不法目的。","note":"電信管理法及修正條文第十四條均規定設置公眾電信網路者有協助執行通訊監察之義務，並因應郵政總局改制為中華郵政股份有限公司，爰修正第二款規定；另各款文字酌作修正。"}],"changed":true,"final":"監察他人之通訊，而有下列情形之一者，不罰：\n一、依法律規定而為。\n二、電信事業、設置公眾電信網路者或郵政事業人員基於提供公共電信、公眾電信網路或郵政服務之目的，而依有關法令執行。\n三、監察者為通訊之一方或已得通訊之一方事先同意，而非出於不法目的。","finalWhy":"電信管理法及修正條文第十四條均規定設置公眾電信網路者有協助執行通訊監察之義務，並因應郵政總局改制為中華郵政股份有限公司，爰修正第二款規定；另各款文字酌作修正。","review":{"note":"照行政院提案通過","text":"監察他人之通訊，而有下列情形之一者，不罰：\n一、依法律規定而為。\n二、電信事業、設置公眾電信網路者或郵政事業人員基於提供公共電信、公眾電信網路或郵政服務之目的，而依有關法令執行。\n三、監察者為通訊之一方或已得通訊之一方事先同意，而非出於不法目的。"}},{"no":"第三十一條","current":"有協助執行通訊監察義務之電信事業及郵政機關（構），違反第十四條第二項之規定者，由交通部處以新臺幣五十萬元以上二百五十萬元以下罰鍰；經通知限期遵行而仍不遵行者，按日連續處罰，並得撤銷其特許或許可。","versions":[{"bill":"201110047310000","text":"有協助執行通訊監察義務之電信事業、設置公眾電信網路者及郵政事業，違反第十四條第二項之規定者，由該管目的事業主管機關處以新臺幣五十萬元以上二百五十萬元以下罰鍰；經通知限期遵行而仍不遵行者，按次處罰。\n有保存及協助調取通訊使用者資料、通信紀錄或網路流量紀錄義務之電信事業及設置公眾電信網路者，違反第十四條之一第一項或第二項之規定者，亦同。\n對電信事業及設置公眾電信網路者之主管機關依本法所為之行政處分不服者，直接適用行政訴訟程序。","note":"一、郵政總局已改制為中華郵政股份有限公司，另電信事業、郵政事業之目的事業主管機關分別屬國家通訊傳播委員會及交通部；又電信事業於電信管理法施行後已無特許、許可規定，而主管機關對於有無違反行政法上義務，應逐次依職權調查事實及證據，以為裁罰基礎，爰修正現行條文，並列為第一項規定。\n二、電信事業及設置公眾電信網路者，違反第十四條之一第一項或第二項規定時，應比照第一項予以處罰，爰增訂第二項規定。\n三、依廣播電視法、有線廣播電視法及衛星廣播電視法之規定，對國家通訊傳播委員會依各該法律及依其他法律所為之行政處分不服者，係直接適用行政訴訟程序，爰增訂第三項規定。"},{"bill":"202110050370000","text":"有協助執行通訊監察義務之電信事業、設置公眾電信網路者及郵政事業，違反第十四條第二項之規定，由目的事業主管機關，處以新臺幣五十萬元以上二百五十萬元以下罰鍰；經通知限期遵行而仍不遵行者，按次處罰，並得廢止其特許、許可、登記或其公眾電信網路之網路設置核准及審驗合格證明之全部或一部。\n有保存及協助調取通訊使用者資料、通信紀錄或網路流量紀錄義務之電信事業及設置公眾電信網路者，違反第十四條之一第一項之規定者，亦同。","note":"一、配合電信管理法第三條第一項第六款之修正以及電信事業與郵政事業之目的事業主管機關之分立，爰修正第一項文字。\n二、配合電信管理法第四十五條之規定，爰修正處罰之態樣。\n三、配合電信管理法第三條第一項第六款及第九條第四項之修正，以及本法此次亦同步修正第十四條、第十四條之一，電信事業及設置公眾電信網路者具有保存及協助調取網路流量紀錄之義務，自有必要於違反義務時，納入本條處罰之規範，爰增設第二項規定。"},{"bill":"202110054990000","text":"有協助執行通訊監察義務之電信事業、設置公眾電信網路者及郵政事業，違反第十四條第二項之規定者，由該管目的事業主管機關處以新臺幣五十萬元以上二百五十萬元以下罰鍰；經通知限期遵行而仍不遵行者，按次處罰。\n有保存及協助調取通訊使用者資料、通信紀錄或網路流量紀錄義務之電信事業及設置公眾電信網路者，違反第十四條之一第一項或第二項之規定者，亦同。\n對電信事業及設置公眾電信網路者之主管機關依本法所為之行政處分不服者，直接適用行政訴訟程序。","note":"一、郵政總局已改制為中華郵政股份有限公司，另電信事業、郵政事業之目的事業主管機關分別屬國家通訊傳播委員會及交通部；又電信事業於電信管理法施行後已無特許、許可規定，而主管機關對於有無違反行政法上義務，應逐次依職權調查事實及證據，以為裁罰基礎，爰修正現行條文，並列為第一項規定。\n二、電信事業及設置公眾電信網路者，違反第十四條之一第一項或第二項規定時，應比照第一項予以處罰，爰增訂第二項規定。\n三、依廣播電視法、有線廣播電視法及衛星廣播電視法之規定，對國家通訊傳播委員會依各該法律及依其他法律所為之行政處分不服者，係直接適用行政訴訟程序，爰增訂第三項規定。"},{"bill":"202110055570000","text":"有協助執行通訊監察義務之電信事業、設置公眾電信網路者及郵政事業，違反第十四條第二項之規定者，由該管目的事業主管機關處以新臺幣五十萬元以上二百五十萬元以下罰鍰；經通知限期遵行而仍不遵行者，按次處罰。\n有保存及協助調取通訊使用者資料、通信紀錄或網路流量紀錄義務之電信事業及設置公眾電信網路者，違反第十四條之一第一項或第二項之規定者，亦同。\n對電信事業及設置公眾電信網路者之主管機關依本法所為之行政處分不服者，直接適用行政訴訟程序。","note":"一、郵政總局已改制為中華郵政股份有限公司，另電信事業、郵政事業之目的事業主管機關分別屬國家通訊傳播委員會及交通部；又電信事業於電信管理法施行後已無特許、許可規定，而主管機關對於有無違反行政法上義務，應逐次依職權調查事實及證據，以為裁罰基礎，爰修正現行條文，並列為第一項規定。\n二、電信事業及設置公眾電信網路者，違反第十四條之一第一項或第二項規定時，應比照第一項予以處罰，爰增訂第二項規定。\n三、依廣播電視法、有線廣播電視法及衛星廣播電視法之規定，對國家通訊傳播委員會依各該法律及依其他法律所為之行政處分不服者，係直接適用行政訴訟程序，爰增訂第三項規定。"}],"changed":true,"final":"有協助執行通訊監察義務之電信事業、設置公眾電信網路者及郵政事業，違反第十四條第二項之規定者，由該管目的事業主管機關處以新臺幣五十萬元以上五百萬元以下罰鍰；經通知限期遵行而仍不遵行者，按次處罰。\n有保存及協助調取通訊使用者資料、通信紀錄或網路流量紀錄義務之電信事業及設置公眾電信網路者，違反第十四條之一第一項或第二項之規定者，亦同。\n對電信事業及設置公眾電信網路者之主管機關依本法所為之行政處分不服者，直接適用行政訴訟程序。","finalWhy":"照協商條文通過。,","review":{"note":"保留，送院會處理","text":""}}],"stages":[{"date":"2024-03-14","code":"公聽會-2024030618","title":"「詐欺犯罪防制立法及各部會打詐機制盤點」公聽會","gazref":"113卷011期5193號 353-525頁","stage":"公聽會","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024030618/details?meetingDate=113/03/14","full":["https://ivod.ly.gov.tw/Play/Full/1M/15728"],"pdf":[],"clips":[],"props":[],"tr":null,"note":null,"mixed":[]},{"date":"2024-05-17","stage":"一讀","code":"院會-11-1-14","bill":"201110047310000","gazref":"113卷044期5226號 12-12頁"},{"date":"2024-05-31","stage":"一讀","code":"院會-11-1-16","bill":"202110050370000","gazref":"113卷051期5233號一冊 22-23頁"},{"date":"2024-06-06","code":"委員會-11-1-36-31","title":"第11屆第1會期司法及法制委員會第31次全體委員會議","gazref":"113卷057期523 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {

  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');

  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],

  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);
  fillBench($('bench'), a);
}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }
  const bench = el('div', {class: 'bench'});
  panel.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  fillBench(bench, a);
}
D.arts.forEach(a => {
  const btn = el('button', {type: 'button', 'data-no': a.no, class: 'chip' + (a.changed ? ' passed' : ''), text: a.no});
  btn.addEventListener('click', () => { current = a.no; showArticle(); });
  $('artnav').append(btn);
});
showArticle();

/* ---------- 提案版本 ---------- */
const partyLine = p => p.party.map(([n]) => n).join('、');
function people(p, role, label) {   // 一列名單：姓名後面標黨籍

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });

    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
