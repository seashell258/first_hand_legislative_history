或協議之外國政府、機構或國際組織。","review":null},{"no":"第六條","current":null,"versions":[{"bill":"202110137730000","text":"依本法經營之虛擬資產業務，係指在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、虛擬資產衍生之金融服務、金融商品之發行或銷售服務，或以虛擬資產為標的之衍生性金融商品業務及相關服務。\n八、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為虛擬資產金融服務商。\n八、經營前項第八款業務者，為其他虛擬資產服務商。","note":"一、FATF四十項建議將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰參考FATF四十項建議之定義，於第一項第一款至第五款及第二項第一款至第五款明定虛擬資產業務及虛擬資產服務商之定義，以及明定虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義。\n二、第一項第一款及第二款所稱之交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務。此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款至第二款及第二項第一款明定虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n三、虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另訂特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款之規定，於第二項第二款明定虛擬資產交易平台之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並敘明虛擬資產交易平台商為虛擬資產交換商之一種。\n四、第一項第三款所稱之虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款明定虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n五、第一項第四款所稱之保管或管理用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含例如非託管錢包業者等對他人之虛擬資產無控制力之情形。\n六、第一項第五款所稱之提供虛擬資產發行或銷售及相關服務，係指為他人辦理之虛擬資產發行提供承銷等服務，不包含虛擬資產發行行為。\n七、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商的財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑑於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款之立法例，於第一項第六款及第二項第六款明定虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n八、第一項第七款所稱之虛擬資產衍生之金融服務、虛擬資產衍生之金融商品之發行、銷售，或以虛擬資產為標的之金融商品者，係指以虛擬資產為基礎所生之類投信投顧業務所為之「代操」、以虛擬資產為標的所生之「期權」等相關商品。鑒於此類商品非屬單純虛擬資產與法幣間交換或虛擬資產間之交換，有另訂相關規範之必要，爰於第一項第七款明確定義之。"},{"bill":"202110171550000","text":"依本法經營之虛擬資產業務，係指在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、虛擬資產衍生之金融服務、金融商品之發行或銷售服務，或以虛擬資產為標的之衍生性金融商品業務及相關服務。\n八、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為虛擬資產金融服務商。\n八、經營前項第八款業務者，為其他虛擬資產服務商。","note":"一、FATF四十項建議將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰參考FATF四十項建議之定義，於第一項第一款至第五款及第二項第一款至第五款明定虛擬資產業務及虛擬資產服務商之定義，以及明定虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義。\n二、第一項第一款及第二款所稱之交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務。此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款至第二款及第二項第一款明定虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n三、虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另訂特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款之規定，於第二項第二款明定虛擬資產交易平台之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並敘明虛擬資產交易平台商為虛擬資產交換商之一種。\n四、第一項第三款所稱之虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款明定虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n五、第一項第四款所稱之保管或管理用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含例如非託管錢包業者等對他人之虛擬資產無控制力之情形。\n六、第一項第五款所稱之提供虛擬資產發行或銷售及相關服務，係指為他人辦理之虛擬資產發行提供承銷等服務，不包含虛擬資產發行行為。\n七、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商的財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑑於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款之立法例，於第一項第六款及第二項第六款明定虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n八、第一項第七款所稱之虛擬資產衍生之金融服務、虛擬資產衍生之金融商品之發行、銷售，或以虛擬資產為標的之金融商品者，係指以虛擬資產為基礎所生之類投信投顧業務所為之「代操」、以虛擬資產為標的所生之「期權」等相關商品。鑒於此類商品非屬單純虛擬資產與法幣間交換或虛擬資產間之交換，有另訂相關規範之必要，爰於第一項第七款明確定義之。"},{"bill":"202110199580000","text":"依本法經營之虛擬資產業務，係指在我國境內為他人託管並提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、虛擬資產衍生之金融商品或服務相關業務。\n八、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為虛擬資產金融商。\n八、經營前項第八款業務者，為其他虛擬資產服務商。","note":"一、FATF四十項建議將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰參考FATF四十項建議之定義，於第一項第一款至第五款及第二項第一款至第五款明定虛擬資產業務及虛擬資產服務商之定義，以及明定虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義。\n二、第一項第一款及第二款所稱之交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務。此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款至第二款及第二項第一款明定虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n三、虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另訂特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款之規定，於第二項第二款明定虛擬資產交易平台之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並敘明虛擬資產交易平台商為虛擬資產交換商之一種。\n四、第一項第三款所稱之虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款明定虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n五、第一項第四款所稱之保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含例如非託管錢包業者等對他人之虛擬資產無控制力之情形。\n六、第一項第五款所稱之提供虛擬資產發行或銷售及相關服務，係指為他人辦理之虛擬資產發行提供承銷等服務，不包含虛擬資產發行行為。\n七、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商的財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑑於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款之立法例，於第一項第六款及第二項第六款明定虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n八、國際上虛擬資產衍生之金融商品或服務交易已行之有年，相關制度相對成熟，並具價格發現、避險工具、市場流動性等功能，實有把既存需求、風險與資金納入監理之必要。爰於第一項第七款及第二項第七款明定虛擬資產衍生性商品業務及虛擬資產金融商之定義，以適用本法納管之。第一項第七款所稱之虛擬資產衍生之金融商品或服務，係指以虛擬資產為交易標的或連結對象的任何金融商品及服務，如「永續合約」、「雙幣期權理財」、「代操」、「跟單」等。"},{"bill":"202110203280000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","note":"一、參考FATF四十項建議，將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務範圍及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義，說明如下：\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑒於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第七款及第二項第七款規定。"},{"bill":"202110207150000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","note":"一、參考FATF四十項建議，將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務範圍及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義，說明如下：\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商係指提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，考量其業務本質須經常性返還虛擬資產，負債占權益之比例通常較高；且亦須依客戶請求即期或於短期內返還虛擬資產，而有相對較高之流動性需求，致其易因業務損失而陷入資不抵債之破產風險，或於市場信任不足時，易因客戶大量請求返還虛擬資產，陷入不能及時返還之流動性風險。是以，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，自有管理之必要。惟此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第七款及第二項第七款規定。"},{"bill":"202110206090000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","note":"一、FATF四十項建議將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰參考FATF四十項建議之定義，於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義。\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑒於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第七款及第二項第七款規定。"},{"bill":"201110205640000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","note":"一、參考FATF四十項建議，將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務範圍及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義，說明如下：\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑒於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第七款及第二項第七款規定。"},{"bill":"202110209160000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","note":"一、參考FATF四十項建議，爰於第一項第一款至第七款及第二項第一款至第七款定明虛擬資產業務範圍及虛擬資產服務商之種類，包括交換商、交易平台商、移轉商、保管商、承銷商、借貸商及其他服務商。\n二、第一項第四款所稱保管或管理虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非保管型錢包業者等對他人虛擬資產無控制力之情形；爰此，non－custodial wallet provider、API或SaaS技術服務提供商、鏈上監控及AML軟體提供商、智慧合約及節點開發商等業者，如未直接控制客戶資產、未保管私鑰，且未直接與客戶發生資產移轉關係者，原則上不屬本法所稱虛擬資產服務商。\n三、虛擬資產服務商經營第六款業務，其涉及收受法定貨幣或具本金保證性質者，應受銀行法及相關金融法規之限制。\n四、第一項第七款為因應虛擬資產業務發展快速，避免未來新型態服務無法即時納管。"},{"bill":"202110209890000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","note":"一、參考FATF四十項建議，將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務範圍及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義，說明如下：\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑒於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第七款及第二項第七款規定。"},{"bill":"202110214790000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","note":"一、參考FATF四十項建議，將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務範圍及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義，說明如下：\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑒於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第七款及第二項第七款規定。"},{"bill":"202110213930000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、虛擬資產衍生性金融商品之相關服務。\n八、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第八款業務者，為其他虛擬資產服務商。\n經營前項業務涉及第一項第七款者，另需取得衍生性金融商品服務許可。","note":"一、參考FATF四十項建議，將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務範圍及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義，說明如下：\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑒於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第八款及第二項第七款規定。\n四、考量虛擬資產衍生性金融商品具槓桿及風險性，其監理強度應高於一般虛擬資產服務，爰於第一項第七款明定衍生性金融商品之服務，並於第三項採另取許可制度，不論從事第二項之虛擬資產服務，只要業務涉及衍生性金融商品，皆須另取得主管機關許可。"},{"bill":"202110217080000","text":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","note":"一、參考FATF四十項建議，將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務範圍及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義，說明如下：\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑒於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第七款及第二項第七款規定。"}],"changed":true,"final":"依本法經營之虛擬資產業務，係在我國境內為他人提供下列服務為業：\n一、虛擬資產與新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣間之交換及相關服務。\n二、虛擬資產間之交換及相關服務。\n三、虛擬資產之移轉及相關服務。\n四、保管或管理虛擬資產或用以控制虛擬資產之工具及相關服務。\n五、虛擬資產發行或銷售及相關服務。\n六、受讓虛擬資產，並約定返還或給付相同或較高數量或價值之虛擬資產及相關服務。\n七、其他經主管機關核定之虛擬資產服務。\n經營前項各款業務之一者為虛擬資產服務商，並依下列各款定其種類：\n一、經營前項第一款或第二款業務者，為虛擬資產交換商。\n二、經營虛擬資產集中交易市場業務之虛擬資產交換商，為虛擬資產交易平台商。\n三、經營前項第三款業務者，為虛擬資產移轉商。\n四、經營前項第四款業務者，為虛擬資產保管商。\n五、經營前項第五款業務者，為虛擬資產承銷商。\n六、經營前項第六款業務者，為虛擬資產借貸商。\n七、經營前項第七款業務者，為其他虛擬資產服務商。","finalWhy":"一、參考FATF四十項建議，將虛擬資產服務商定義為經營虛擬資產與法定貨幣間之交換業務、不同虛擬資產間之交換業務、移轉業務、保管業務及承銷業務之業者，爰於第一項第一款至第五款及第二項第一款至第五款定明虛擬資產業務範圍及虛擬資產服務商之定義，以及定明虛擬資產交換商、虛擬資產交易平台商、虛擬資產移轉商、虛擬資產保管商及虛擬資產承銷商之定義，說明如下：\n(一)第一項第一款及第二款所稱交換及相關服務，係指為他人進行虛擬資產買賣、互易或其他交換約定之相關服務，此類服務與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第一款、第二款及第二項第一款定明虛擬資產交換業務及虛擬資產交換商之定義，以適用本法納管之。\n(二)虛擬資產交易平台商為目前最具規模之虛擬資產服務商類型，有另定特別規定之必要。爰參考歐盟MiCA規則第三條第一項第十八款規定，於第二項第二款定明虛擬資產交易平台商之定義為提供虛擬資產集中交易市場服務之虛擬資產服務商，亦即為供虛擬資產競價交易而開設之市場，並定明虛擬資產交易平台商為虛擬資產交換商之一種。\n(三)第一項第三款所稱虛擬資產移轉及相關服務，係指為他人取得或讓與虛擬資產之相關服務，包含虛擬資產支付之相關服務。此類服務亦與銀行法第二十九條第一項之國內外匯兌業務或電子支付機構管理條例第四條第一項之電子支付業務有別，爰於第一項第三款及第二項第三款定明虛擬資產移轉業務及虛擬資產移轉商之定義，以適用本法納管之。\n(四)第一項第四款所稱保管或管理或用以控制虛擬資產之工具，係指為他人保管或管理錢包或錢包私鑰等可用以控制虛擬資產之工具，不包含非託管錢包業者等對他人虛擬資產無控制力之情形。第二項第四款定明經營前開業務者為虛擬資產保管商。\n(五)第一項第五款所稱提供虛擬資產發行或銷售及相關服務，係指為他人提供辦理虛擬資產發行或銷售之承銷等服務，不包含為自己發行虛擬資產之行為。第二項第五款定明經營前開業務者為虛擬資產承銷商。\n二、經營受讓虛擬資產並約定返還或給付相同或較高數量或價值之虛擬資產業務之虛擬資產借貸商，其業務本質負有經常性返還虛擬資產之義務，故其負債占權益之比例通常較高，容易因業務損失而陷入資不抵債之破產風險；此外其業務本質尚包含須依客戶請求即期或於短期內返還虛擬資產，故有相對較高之流動性需求，於市場信任不足時容易因客戶大量返還請求而陷入不能及時返還之流動性風險。整體而言，虛擬資產借貸商之財務風險相對較高，一旦破產對客戶權益及整體虛擬資產市場健全有不容忽視之影響，故有管理之必要。鑒於此類服務與銀行法第五條之一、第二十九條第一項及第二十九條之一之吸收存款業務有別，爰參考日本關於加密資產交換業者之內閣府令第二十三條第一項第八款規定，於第一項第六款及第二項第六款定明虛擬資產借貸業務及虛擬資產借貸商之定義，以適用本法納管之。\n三、考量虛擬資產業務發展快速，為避免未來產生新型態服務無法即時納管，爰為第一項第七款及第二項第七款規定。","review":null},{"no":"第七條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商應依前條第二項規定，分別依其種類取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構、實體營業據點或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設立分支機構，應經主管機關許可及發給許可證照。\n虛擬資產服務商及其分支機構、實體營業據點及自動化服務設備之設置條件、經營業務之種類、申請程序、應檢附書件等事項之設置標準，以及虛擬資產服務商之財務、業務、開業、停業及復業、終止業務及其他應遵行事項之管理辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，以俾主管機關管理其業務。爰參考證券交易法第四十四條第一項至第二項規定，於第一項明定虛擬資產服務商之許可制要求，並明定未經許可及取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構、實體營業據點或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第二項規定，於第二項明定分支機構、實體營業據點或自動化服務設備之許可或核准制要求。\n三、境外虛擬資產服務商依洗錢防制法第六條第一項規定，須於我國辦理公司或分公司設立登記，倘若其係透過於我國境內設立分公司等分支機構經營虛擬資產業務，主管機關對其之管理即係透過該分支機構為之，故該分支機構亦應經主管機關許可以納管之。爰參考期貨交易法第五十六條第四項規定，於第三項明定境外虛擬資產服務商設立分支機構應經主管機關許可。\n四、就虛擬資產服務商及其分支機構、實體營業據點及自動化服務設備之設置與管理所需之設置標準與管理規則，爰參考證券投資信託及顧問法第七十二條第一項規定，於第四項授權主管機關訂定之。"},{"bill":"202110171550000","text":"虛擬資產服務商應依前條第二項規定，分別依其種類取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構、實體營業據點或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設立分支機構，應經主管機關許可及發給許可證照。\n虛擬資產服務商及其分支機構、實體營業據點及自動化服務設備之設置條件、經營業務之種類、申請程序、應檢附書件等事項之設置標準，以及虛擬資產服務商之財務、業務、開業、停業及復業、終止業務及其他應遵行事項之管理辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，以俾主管機關管理其業務。爰參考證券交易法第四十四條第一項至第二項規定，於第一項明定虛擬資產服務商之許可制要求，並明定未經許可及取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構、實體營業據點或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第二項規定，於第二項明定分支機構、實體營業據點或自動化服務設備之許可或核准制要求。\n三、境外虛擬資產服務商依洗錢防制法第六條第一項規定，須於我國辦理公司或分公司設立登記，倘若其係透過於我國境內設立分公司等分支機構經營虛擬資產業務，主管機關對其之管理即係透過該分支機構為之，故該分支機構亦應經主管機關許可以納管之。爰參考期貨交易法第五十六條第四項規定，於第三項明定境外虛擬資產服務商設立分支機構應經主管機關許可。\n四、就虛擬資產服務商及其分支機構、實體營業據點及自動化服務設備之設置與管理所需之設置標準與管理規則，爰參考證券投資信託及顧問法第七十二條第一項規定，於第四項授權主管機關訂定之。"},{"bill":"202110199580000","text":"虛擬資產服務商應依前條第二項規定，分別依其種類取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務，但符合主管機關依其性質認為不必要者，不在此限。\n虛擬資產服務商設置分支機構、實體營業據點或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設立分支機構，應經主管機關許可及發給許可證照。\n虛擬資產服務商及其分支機構、實體營業據點及自動化服務設備之設置條件、經營業務之種類、申請程序、應檢附書件等事項之設置標準，以及虛擬資產服務商之財務、業務、開業、停業及復業、終止業務及其他應遵行事項之管理辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，以俾主管機關管理其業務。爰參考證券交易法第四十四條第一項至第二項規定，於第一項明定虛擬資產服務商之許可制要求，並明定未經許可及取得許可證照者不得經營虛擬資產業務，惟區塊鏈技術日新月異，虛擬資產產業之性質等變化快速，爰參考證券交易法第十四條之四第一項之規定，特許主管機關依實務情況訂定標準，以利實施監管同時保持市場之開放性。\n二、虛擬資產服務商設置分支機構、實體營業據點或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第二項規定，於第二項明定分支機構、實體營業據點或自動化服務設備之許可或核准制要求。\n三、境外虛擬資產服務商依洗錢防制法第六條第一項規定，須於我國辦理公司或分公司設立登記，倘若其係透過於我國境內設立分公司等分支機構經營虛擬資產業務，主管機關對其之管理即係透過該分支機構為之，故該分支機構亦應經主管機關許可以納管之。爰參考期貨交易法第五十六條第四項規定，於第三項明定境外虛擬資產服務商設立分支機構應經主管機關許可。\n四、就虛擬資產服務商及其分支機構、實體營業據點及自動化服務設備之設置與管理所需之設置標準與管理規則，爰參考證券投資信託及顧問法第七十二條第一項規定，於第四項授權主管機關訂定之。"},{"bill":"202110203280000","text":"虛擬資產服務商應依前條第二項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，俾主管機關於事前審核及管理其業務，爰參考證券交易法第四十四條第一項規定，於第一項定明虛擬資產服務商之許可制，未經許可及未取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第一項及第二項規定，為第二項規定。\n三、境外虛擬資產服務商倘若於我國境內設置分公司等分支機構經營虛擬資產業務，該分支機構亦應經主管機關許可並發給許可證照，爰參考證券交易法第四十四條第三項規定，為第三項規定。\n四、金融機構依各該業管法規已受主管機關管理，開放其兼營虛擬資產業務有助提升虛擬資產服務市場之健全秩序，爰參考歐盟MiCA規則第六十條規定，於第四項定明金融機構得經主管機關許可兼營虛擬資產業務，並應遵循本法對虛擬資產服務商相關管理規範。\n五、第一項至第四項規定應申請許可或核准之申請條件及程序等相關事項，參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定，於第五項授權主管機關訂定相關辦法。"},{"bill":"202110207150000","text":"虛擬資產服務商應依前條第二項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、其業務與其他應遵行事項、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，俾主管機關於事前審核及管理其業務，爰參考證券交易法第四十四條第一項規定，於第一項定明虛擬資產服務商之許可制，未經許可及未取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第一項及第二項規定，為第二項規定。\n三、境外虛擬資產服務商倘若於我國境內設置分公司等分支機構經營虛擬資產業務，該分支機構亦應經主管機關許可並發給許可證照，爰參考證券交易法第四十四條第三項規定，為第三項規定。\n四、金融機構依各該業管法規已受主管機關管理，開放其兼營虛擬資產業務有助提升虛擬資產服務市場之健全秩序，爰參考歐盟MiCA規則第六十條規定，於第四項定明金融機構得經主管機關許可兼營虛擬資產業務，並應遵循本法對虛擬資產服務商相關管理規範。\n五、參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定，於第五項授權主管機關就第一項至第四項規定應申請許可或核准之申請條件、程序及應遵行事項等訂定相關辦法。"},{"bill":"202110206090000","text":"虛擬資產服務商應依前條第二項規定，分別依其種類取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設立分支機構，應經主管機關許可並發給許可證照；主管機關應建立分級許可制及快速審查機制，以鼓勵境外虛擬資產服務商在中華民國境內設立分支機構並取得許可。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。\n主管機關應定期揭露並即時更新取得許可之虛擬資產服務商名單及業務交易之統計資訊。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，以俾主管機關管理其業務。爰參考證券交易法第四十四條第一項至第二項規定，於第一項定明虛擬資產服務商之許可制要求，並定明未經許可及取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第一項及第二項規定，為第二項規定。\n三、境外虛擬資產服務商倘若於我國境內設置分公司等分支機構經營虛擬資產業務，該分支機構亦應經主管機關許可並發給許可證照，爰參考證券交易法第四十四條第三項規定，為第三項規定。\n四、為鼓勵境外虛擬資產服務商在中華民國境內設立分支機構，取得我國主管機關許可及發給許可證照，主管機關應建立分級許可制及快速審查機制。前者可參考新加坡，針對小型創新商核發「限制性許可」，而大型交易所、或已與國內銀行業者合作信託及金流串接之境外服務商則可核發「較多功能許可」，降低初步落地成本；後者則係針對已於歐盟MiCA規則、新加坡或美國取得合規牌照的境外服務商，可簡化其技術細節審查，優先就「在地法遵（AML）與「資訊安全」進行重點稽核。\n五、金融機構依各該業管法規已受主管機關管理，開放其兼營虛擬資產業務有助提升虛擬資產服務市場之健全秩序，爰參考歐盟MiCA規則第六十條規定，於第四項定明金融機構得經主管機關許可兼營虛擬資產業務，並應遵循本法對虛擬資產服務商相關管理規範。\n六、第一項至第四項規定應申請許可或核准之申請條件及程序等相關事項，參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定，於第五項授權主管機關訂定相關辦法。\n七、為防範詐騙、洗錢等不法情事，主管機關亦應負起資訊揭露之責任，向民眾公開並宣導合法業者名單及相關統計資訊。"},{"bill":"201110205640000","text":"虛擬資產服務商應依前條第二項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，俾主管機關於事前審核及管理其業務，爰參考證券交易法第四十四條第一項規定，於第一項定明虛擬資產服務商之許可制，未經許可及未取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第一項及第二項規定，為第二項規定。\n三、境外虛擬資產服務商倘若於我國境內設置分公司等分支機構經營虛擬資產業務，該分支機構亦應經主管機關許可並發給許可證照，爰參考證券交易法第四十四條第三項規定，為第三項規定。\n四、金融機構依各該業管法規已受主管機關管理，開放其兼營虛擬資產業務有助提升虛擬資產服務市場之健全秩序，爰參考歐盟MiCA規則第六十條規定，於第四項定明金融機構得經主管機關許可兼營虛擬資產業務，並應遵循本法對虛擬資產服務商相關管理規範。\n五、第一項至第四項規定應申請許可或核准之申請條件及程序等相關事項，參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定，於第五項授權主管機關訂定相關辦法。"},{"bill":"202110209160000","text":"虛擬資產服務商應依前條第二項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。等效國家之境外虛擬資產服務商，得依主管機關規定以簡化登記方式向我國交易人提供服務，不適用第一項之許可要求，但應遵守本法洗錢防制及資訊揭露規定。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","note":"一、第一項定明虛擬資產服務商之許可制，未經許可及未取得許可證照者不得經營虛擬資產業務，爰參考證券交易法第四十四條第一項規定。\n二、第二項定明設置分支機構或自動化服務設備之許可要求，爰參考銀行法第五十七條第一項及第二項規定。\n三、第三項增列等效國家之境外虛擬資產服務商，得依主管機關規定以簡化登記方式向我國交易人提供服務，不適用許可要求，但仍應遵守本法洗錢防制及資訊揭露規定，以配合第五條第三項等效認定機制，促進國際業者在符合法規前提下進入我國市場；境外服務商設置分支機構者，仍應依本項前段取得許可，爰參考證券交易法第四十四條第三項規定。\n四、第四項定明金融機構得兼營虛擬資產業務，爰參考歐盟MiCA規則第六十條規定。\n五、第五項授權主管機關訂定相關辦法，爰參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定。"},{"bill":"202110209890000","text":"虛擬資產服務商應依前條第二項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，俾主管機關於事前審核及管理其業務，爰參考證券交易法第四十四條第一項規定，於第一項定明虛擬資產服務商之許可制，未經許可及未取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第一項及第二項規定，為第二項規定。\n三、境外虛擬資產服務商倘若於我國境內設置分公司等分支機構經營虛擬資產業務，該分支機構亦應經主管機關許可並發給許可證照，爰參考證券交易法第四十四條第三項規定，為第三項規定。\n四、金融機構依各該業管法規已受主管機關管理，開放其兼營虛擬資產業務有助提升虛擬資產服務市場之健全秩序，爰參考歐盟MiCA規則第六十條規定，於第四項定明金融機構得經主管機關許可兼營虛擬資產業務，並應遵循本法對虛擬資產服務商相關管理規範。\n五、第一項至第四項規定應申請許可或核准之申請條件及程序等相關事項，參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定，於第五項授權主管機關訂定相關辦法。"},{"bill":"202110214790000","text":"虛擬資產服務商應依前條第二項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，俾主管機關於事前審核及管理其業務，爰參考證券交易法第四十四條第一項規定，於第一項定明虛擬資產服務商之許可制，未經許可及未取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第一項及第二項規定，為第二項規定。\n三、境外虛擬資產服務商倘若於我國境內設置分公司等分支機構經營虛擬資產業務，該分支機構亦應經主管機關許可並發給許可證照，爰參考證券交易法第四十四條第三項規定，為第三項規定。\n四、金融機構依各該業管法規已受主管機關管理，開放其兼營虛擬資產業務有助提升虛擬資產服務市場之健全秩序，爰參考歐盟MiCA規則第六十條規定，於第四項定明金融機構得經主管機關許可兼營虛擬資產業務，並應遵循本法對虛擬資產服務商相關管理規範。\n五、第一項至第四項規定應申請許可或核准之申請條件及程序等相關事項，參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定，於第五項授權主管機關訂定相關辦法。"},{"bill":"202110213930000","text":"虛擬資產服務商應依前條第二項及第三項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，俾主管機關於事前審核及管理其業務，爰參考證券交易法第四十四條第一項規定，於第一項定明虛擬資產服務商之許可制，未經許可及未取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第一項及第二項規定，為第二項規定。\n三、境外虛擬資產服務商倘若於我國境內設置分公司等分支機構經營虛擬資產業務，該分支機構亦應經主管機關許可並發給許可證照，爰參考證券交易法第四十四條第三項規定，為第三項規定。\n四、金融機構依各該業管法規已受主管機關管理，開放其兼營虛擬資產業務有助提升虛擬資產服務市場之健全秩序，爰參考歐盟MiCA規則第六十條規定，於第四項定明金融機構得經主管機關許可兼營虛擬資產業務，並應遵循本法對虛擬資產服務商相關管理規範。\n五、第一項至第四項規定應申請許可或核准之申請條件及程序等相關事項，參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定，於第五項授權主管機關訂定相關辦法。"},{"bill":"202110217080000","text":"虛擬資產服務商應依前條第二項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商具有金融服務提供者之性質，應取得主管機關之許可始得營業，俾主管機關於事前審核及管理其業務，爰參考證券交易法第四十四條第一項規定，於第一項定明虛擬資產服務商之許可制，未經許可及未取得許可證照者不得經營虛擬資產業務。\n二、虛擬資產服務商設置分支機構或利用自動化服務設備提供服務者，亦應取得主管機關之許可或核准，始得為之，爰參考銀行法第五十七條第一項及第二項規定，為第二項規定。\n三、境外虛擬資產服務商倘若於我國境內設置分公司等分支機構經營虛擬資產業務，該分支機構亦應經主管機關許可並發給許可證照，爰參考證券交易法第四十四條第三項規定，為第三項規定。\n四、金融機構依各該業管法規已受主管機關管理，開放其兼營虛擬資產業務有助提升虛擬資產服務市場之健全秩序，爰參考歐盟MiCA規則第六十條規定，於第四項定明金融機構得經主管機關許可兼營虛擬資產業務，並應遵循本法對虛擬資產服務商相關管理規範。\n五、第一項至第四項規定應申請許可或核准之申請條件及程序等相關事項，參考銀行法第五十七條第三項及證券投資信託及顧問法第七十二條第一項規定，於第五項授權主管機關訂定相關辦法。"}],"changed":true,"final":"虛擬資產服務商應依前條第二項規定種類，分別取得主管機關之許可及發給許可證照，始得營業；未經許可及發給許可證照者，除主管機關另有規定者外，不得經營各該虛擬資產業務。\n虛擬資產服務商設置分支機構或自動化服務設備，應經主管機關許可或核准。\n境外虛擬資產服務商在中華民國境內設置分支機構，應經主管機關許可及發給許可證照。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。\n前四項虛擬資產服務商與其分支機構及自動化服務設備之設置條件、申請許可或核准之程序、應檢附書件、廢止許可或核准、金融機構兼營之資格條件與經營業務之種類及其他相關事項之辦法，由主管機關定之。","finalWhy":"照行政院提案修正通過。,,,,,,","review":null},{"no":"第八條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商新增經營虛擬資產業務前，應報請主管機關核准。\n虛擬資產服務商應依主管機關核准之業務範圍經營業務。未經核准者，不得兼營他業或經營其他業務。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。其兼營之資格條件，由主管機關定之。","note":"一、依第七條第一項規定取得各該許可之虛擬資產服務商，於新增該服務商種類下其他未經核准之虛擬資產業務前，應經主管機關核准，以俾主管機關管理。爰參考歐盟MiCA規則第五十九條第一項第ａ款規定，於第一項明定虛擬資產服務商經營個別虛擬資產業務之核准制要求。\n二、虛擬資產服務商如經營第六條第一項所定虛擬資產業務以外之其他業務，應經主管機關核准並受管理，以控管其業務風險，避免其他業務影響虛擬資產業務之健全經營，進而影響虛擬資產客戶權益，爰於第二項明定虛擬資產服務商兼營其他業務應經主管機關核准。\n三、金融機構已受主管機關管理，其經營虛擬資產業務有助提升虛擬資產服務市場之健全秩序。爰參考歐盟MiCA規則第六十條規定，於第三項明定金融機構得經主管機關許可兼營虛擬資產業務。兼營虛擬資產業務之金融機構亦為本法之虛擬資產服務商，併予敘明。"},{"bill":"202110171550000","text":"虛擬資產服務商新增經營虛擬資產業務前，應報請主管機關核准。\n虛擬資產服務商應依主管機關核准之業務範圍經營業務。未經核准者，不得兼營他業或經營其他業務。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。其兼營之資格條件，由主管機關定之。","note":"一、依第七條第一項規定取得各該許可之虛擬資產服務商，於新增該服務商種類下其他未經核准之虛擬資產業務前，應經主管機關核准，以俾主管機關管理。爰參考歐盟MiCA規則第五十九條第一項第a款規定，於第一項明定虛擬資產服務商經營個別虛擬資產業務之核准制要求。\n二、虛擬資產服務商如經營第六條第一項所定虛擬資產業務以外之其他業務，應經主管機關核准並受管理，以控管其業務風險，避免其他業務影響虛擬資產業務之健全經營，進而影響虛擬資產客戶權益，爰於第二項明定虛擬資產服務商兼營其他業務應經主管機關核准。\n三、金融機構已受主管機關管理，其經營虛擬資產業務有助提升虛擬資產服務市場之健全秩序。爰參考歐盟MiCA規則第六十條規定，於第三項明定金融機構得經主管機關許可兼營虛擬資產業務。兼營虛擬資產業務之金融機構亦為本法之虛擬資產服務商，併予敘明。"},{"bill":"202110199580000","text":"虛擬資產服務商新增經營虛擬資產業務前，應報請主管機關核准。\n虛擬資產服務商應依主管機關核准之業務範圍經營業務。未經核准者，不得兼營他業或經營其他業務，但符合主管機關依其性質認為不必要者，不在此限。\n金融機構得經主管機關之許可，兼營虛擬資產業務，為本法之虛擬資產服務商。其兼營之資格條件，由主管機關定之。","note":"一、依第七條第一項規定取得各該許可之虛擬資產服務商，於新增該服務商種類下其他未經核准之虛擬資產業務前，應經主管機關核准，以俾主管機關管理。爰參考歐盟MiCA規則第五十九條第一項第a款規定，於第一項明定虛擬資產服務商經營個別虛擬資產業務之核准制要求。\n二、虛擬資產服務商如經營第六條第一項所定虛擬資產業務以外之其他業務，應經主管機關核准並受管理，以控管其業務風險，避免其他業務影響虛擬資產業務之健全經營，進而影響虛擬資產客戶權益，爰於第二項明定虛擬資產服務商兼營其他業務應經主管機關核准，惟區塊鏈技術日新月異，虛擬資產產業之性質變化快速，爰參考證券交易法第十四條之四第一項之規定，特許主管機關依實務情況訂定標準，以利實施監管同時保持市場之開放性。\n三、金融機構已受主管機關管理，其經營虛擬資產業務有助提升虛擬資產服務市場之健全秩序。爰參考歐盟MiCA規則第六十條規定，於第三項明定金融機構得經主管機關許可兼營虛擬資產業務。兼營虛擬資產業務之金融機構亦為本法之虛擬資產服務商，併予敘明。"},{"bill":"202110203280000","text":"虛擬資產服務商應依主管機關核准之業務範圍經營業務；新增虛擬資產業務及經營其他業務，應經主管機關核准。\n虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n前二項虛擬資產服務商經營業務、財務之管理、申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，由主管機關定之。\n前項虛擬資產服務商經營業務、財務之管理涉及中央銀行職掌事項者，應會商中央銀行定之。","note":"一、虛擬資產服務商依第七條第一項規定取得各該種類服務商之許可後，如擬新增該種類服務商下其他未經核准之虛擬資產業務，應先經主管機關核准；如擬經營第六條第一項所定虛擬資產業務以外之其他業務，包括經營主管機關所轄其他特許事業，如證券商、期貨商等，以及經營其他附隨業務，亦應經主管機關核准，俾主管機關控管其業務風險，避免虛擬資產服務商經營其他業務影響虛擬資產業務之健全經營，進而影響虛擬資產客戶權益，爰參考歐盟MiCA規則第五十九條第八項規定，為第一項規定。\n二、為確保主管機關對於虛擬資產業務之持續監督，爰於第二項定明虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n三、為健全虛擬資產業務之經營及發展，第三項授權主管機關訂定虛擬資產服務商經營業務、財務之管理事項，以及第一項及第二項申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，並於第四項定明涉及中央銀行職掌事項者，應會商中央銀行定之。"},{"bill":"202110207150000","text":"虛擬資產服務商應依主管機關核准之業務範圍經營業務；新增虛擬資產業務、經營其他業務及業務範圍之變更，應經主管機關核准。\n虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業及解散，應經主管機關核准。\n前二項虛擬資產服務商經營業務、財務之管理、申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，由主管機關定之。\n前項虛擬資產服務商經營業務、財務之管理涉及中央銀行職掌事項者，應會商中央銀行定之。","note":"一、虛擬資產服務商依第七條第一項規定取得各該種類服務商之許可後，如擬新增該種類服務商下其他未經核准之虛擬資產業務或變更業務範圍，均應先經主管機關核准；如擬經營第六條第一項所定虛擬資產業務以外之其他業務，包括經營主管機關所轄其他特許事業，如證券商、期貨商等，以及經營其他附隨業務，亦應經主管機關核准，俾主管機關控管其業務風險，避免虛擬資產服務商經營其他業務影響虛擬資產業務之健全經營，進而影響虛擬資產客戶權益，爰參考歐盟MiCA規則第五十九條第八項規定，為第一項規定。\n二、為確保主管機關對於虛擬資產業務之持續監督，爰於第二項定明虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業及解散，應經主管機關核准。\n三、為健全虛擬資產業務之經營及發展，第三項授權主管機關訂定虛擬資產服務商經營業務、財務之管理事項，以及第一項及第二項申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，並於第四項定明涉及中央銀行職掌事項者，應會商中央銀行定之。"},{"bill":"202110206090000","text":"虛擬資產服務商應依主管機關核准之業務範圍經營業務；新增虛擬資產業務及經營其他業務，應經主管機關核准。\n虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n前二項虛擬資產服務商經營業務、財務之管理、申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，由主管機關定之。\n前項虛擬資產服務商經營業務、財務之管理涉及中央銀行職掌事項者，應會商中央銀行定之。","note":"一、虛擬資產服務商依第七條第一項規定取得各該種類服務商之許可後，如擬新增該種類服務商下其他未經核准之虛擬資產業務，應先經主管機關核准；如擬經營第六條第一項所定虛擬資產業務以外之其他業務，包括經營主管機關所轄其他特許事業，如證券商、期貨商等，以及經營其他附隨業務，亦應經主管機關核准，俾主管機關控管其業務風險，避免虛擬資產服務商經營其他業務影響虛擬資產業務之健全經營，進而影響虛擬資產客戶權益，爰參考歐盟MiCA規則第五十九條第八項規定，為第一項規定。\n二、為確保主管機關對於虛擬資產業務之持續監督，爰於第二項定明虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n三、為健全虛擬資產業務之經營及發展，第三項授權主管機關訂定虛擬資產服務商經營業務、財務之管理事項，以及第一項及第二項申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，並於第四項定明涉及中央銀行職掌事項者，應會商中央銀行定之。"},{"bill":"201110205640000","text":"虛擬資產服務商應依主管機關核准之業務範圍經營業務；新增虛擬資產業務及經營其他業務，應經主管機關核准。\n虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n前二項虛擬資產服務商經營業務、財務之管理、申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，由主管機關定之。\n前項虛擬資產服務商經營業務、財務之管理涉及中央銀行職掌事項者，應會商中央銀行定之。","note":"一、虛擬資產服務商依第七條第一項規定取得各該種類服務商之許可後，如擬新增該種類服務商下其他未經核准之虛擬資產業務，應先經主管機關核准；如擬經營第六條第一項所定虛擬資產業務以外之其他業務，包括經營主管機關所轄其他特許事業，如證券商、期貨商等，以及經營其他附隨業務，亦應經主管機關核准，俾主管機關控管其業務風險，避免虛擬資產服務商經營其他業務影響虛擬資產業務之健全經營，進而影響虛擬資產客戶權益，爰參考歐盟MiCA規則第五十九條第八項規定，為第一項規定。\n二、為確保主管機關對於虛擬資產業務之持續監督，爰於第二項定明虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n三、為健全虛擬資產業務之經營及發展，第三項授權主管機關訂定虛擬資產服務商經營業務、財務之管理事項，以及第一項及第二項申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，並於第四項定明涉及中央銀行職掌事項者，應會商中央銀行定之。"},{"bill":"202110209160000","text":"虛擬資產服務商應依主管機關核准之業務範圍經營業務；新增虛擬資產業務及經營其他業務，應經主管機關核准。\n虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n前二項虛擬資產服務商經營業務、財務之管理、申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，由主管機關定之。\n前項虛擬資產服務商經營業務、財務之管理涉及中央銀行職掌事項者，應會商中央銀行定之。","note":"一、第一項定明虛擬資產服務商應依核准之業務範圍經營業務，新增業務應先經核准，爰參考歐盟MiCA規則第五十九條第八項規定。\n二、第二項定明服務商遷移、裁撤、開業、停業等重要事項均應報請主管機關核准，以確保主管機關之持續監督。\n三、第三項、第四項授權主管機關訂定辦法，涉及中央銀行職掌者應會商之。"}, 於第四項定明涉及中央銀行職掌事項者，應會商中央銀行定之。"},{"bill":"202110217080000","text":"虛擬資產服務商應依主管機關核准之業務範圍經營業務；新增虛擬資產業務及經營其他業務，應經主管機關核准。\n虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n前二項虛擬資產服務商經營業務、財務之管理、申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，由主管機關定之。\n前項虛擬資產服務商經營業務、財務之管理涉及中央銀行職掌事項者，應會商中央銀行定之。","note":"一、虛擬資產服務商依第七條第一項規定取得各該種類服務商之許可後，如擬新增該種類服務商下其他未經核准之虛擬資產業務，應先經主管機關核准；如擬經營第六條第一項所定虛擬資產業務以外之其他業務，包括經營主管機關所轄其他特許事業，如證券商、期貨商等，以及經營其他附隨業務，亦應經主管機關核准，俾主管機關控管其業務風險，避免虛擬資產服務商經營其他業務影響虛擬資產業務之健全經營，進而影響虛擬資產客戶權益，爰參考歐盟MiCA規則第五十九條第八項規定，為第一項規定。\n二、為確保主管機關對於虛擬資產業務之持續監督，爰於第二項定明虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n三、為健全虛擬資產業務之經營及發展，第三項授權主管機關訂定虛擬資產服務商經營業務、財務之管理事項，以及第一項及第二項申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，並於第四項定明涉及中央銀行職掌事項者，應會商中央銀行定之。"}],"changed":true,"final":"虛擬資產服務商除主管機關另有規定者外，應依主管機關核准之業務範圍經營業務；新增虛擬資產業務及經營其他業務，應經主管機關核准。\n虛擬資產服務商之遷移、裁撤、開業、停業、復業、歇業、解散及業務範圍之變更，應經主管機關核准。\n前二項虛擬資產服務商經營業務、財務之管理、申請核准之條件、程序、應檢附書件、廢止核准及其他應遵行事項之辦法，由主管機關定之。\n前項虛擬資產服務商經營業務、財務之管理涉及中央銀行職掌事項者，應會商中央銀行定之。","finalWhy":"照行政院提案修正通過。,,,,,,","review":null},{"no":"第九條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商之組織，以股份有限公司為限。但金融機構依前條第三項規定兼營、境外虛擬資產服務商依第七條第三項經營或其他經主管機關核准之組織形式者，不在此限。","note":"一、為規範虛擬資產服務商之財務健全經營，虛擬資產服務商應以股份有限公司形式經營，以俾實施相關財務要求並俾問責。爰於本條明定虛擬資產服務商原則應採股份有限公司之組織。\n二、金融機構之業務經營均已受主管機關之管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；此外境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，爰於本條但書明定金融機構與境外虛擬資產服務商可例外不適用本條規定。\n三、考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，於本條但書授權主管機關於新型態組織形式得符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務。"},{"bill":"202110171550000","text":"虛擬資產服務商之組織，以股份有限公司為限。但金融機構依前條第三項規定兼營、境外虛擬資產服務商依第七條第三項經營或其他經主管機關核准之組織形式者，不在此限。","note":"一、為規範虛擬資產服務商之財務健全經營，虛擬資產服務商應以股份有限公司形式經營，以俾實施相關財務要求並俾問責。爰於本條明定虛擬資產服務商原則應採股份有限公司之組織。\n二、金融機構之業務經營均已受主管機關之管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；此外境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，爰於本條但書明定金融機構與境外虛擬資產服務商可例外不適用本條規定。\n三、考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，於本條但書授權主管機關於新型態組織形式得符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務。"},{"bill":"202110199580000","text":"虛擬資產服務商之組織，以股份有限公司為限。但金融機構依前條第三項規定兼營、境外虛擬資產服務商依第七條第三項經營或其他經主管機關核准之組織形式者，不在此限。","note":"一、為規範虛擬資產服務商之財務健全經營，虛擬資產服務商應以股份有限公司形式經營，以俾實施相關財務要求並俾問責。爰於本條明定虛擬資產服務商原則應採股份有限公司之組織。\n二、金融機構之業務經營均已受主管機關之管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；此外境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，爰於本條但書明定金融機構與境外虛擬資產服務商可例外不適用本條規定。\n三、考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，於本條但書授權主管機關於新型態組織形式得符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務。"},{"bill":"202110203280000","text":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司；又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式，亦即主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，爰為本條但書規定。"},{"bill":"202110207150000","text":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、惟考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之。另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司。又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，為兼顧金融創新，爰參考歐盟MiCA規則第五十九條第一項第a款規定，規範主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，而為本條但書規定。"},{"bill":"202110206090000","text":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司；又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式，亦即主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，爰為本條但書規定。"},{"bill":"201110205640000","text":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司；又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式，亦即主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，爰為本條但書規定。"},{"bill":"202110209160000","text":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","note":"一、為確保虛擬資產服務商財務健全，俾實施相關財務要求及問責制度，原則應以股份有限公司形式經營，爰為本法規定。\n二、但書考量金融機構兼營者無須另設立股份有限公司，境外服務商得以分支機構形式設立，以及分散式帳本技術可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式。"},{"bill":"202110209890000","text":"虛擬資產服務商之組織，以股份有限公司為限，但以下列形式提供服務者，不在此限：\n一、境外虛擬資產服務商依第七條第三項設置分支機構；\n二、金融機構依第七條第四項規定兼營虛擬資產業務；\n三、其他經主管機關核准之組織形式者。\n主管機關針對前項第三款之核准，應於本法公布後半年內制定相關細則。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司；又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式，亦即主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，爰為本條但書規定。"},{"bill":"202110214790000","text":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司；又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式，亦即主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，爰為本條但書規定。"},{"bill":"202110213930000","text":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司；又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式，亦即主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，爰為本條但書規定。"},{"bill":"202110217080000","text":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司；又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式，亦即主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，爰為本條但書規定。"}],"changed":true,"final":"虛擬資產服務商之組織，以股份有限公司為限。但境外虛擬資產服務商依第七條第三項設置分支機構、金融機構依第七條第四項規定兼營虛擬資產業務，或其他經主管機關核准之組織形式者，不在此限。","finalWhy":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商原則應以股份有限公司形式經營，俾實施相關財務要求及問責制度，爰為本條本文規定。\n二、考量金融機構依各該業管法規已受主管機關管理，故其兼營虛擬資產業務無須另設立股份有限公司為之；另境外虛擬資產服務商依第七條第三項得以分支機構形式經營虛擬資產業務，亦不限於設立股份有限公司；又考量分散式帳本技術與智慧合約技術之應用可能衍生新型態商業組織形式，爰參考歐盟MiCA規則第五十九條第一項第a款規定，納入其他經主管機關核准之組織形式，亦即主管機關得於新型態組織形式符合監理需求之前提下，核准虛擬資產服務商以新型態組織形式經營業務，爰為本條但書規定。","review":null},{"no":"第十條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商之名稱，應標明虛擬資產之字樣。但依第八條第三項規定兼營虛擬資產業務者，不在此限。\n非虛擬資產服務商不得使用前項名稱或易使人誤認其為虛擬資產服務商之名稱。","note":"一、為俾虛擬資產服務商之客戶容易辨識經主管機關許可與管理之虛擬資產服務商，爰參考證券交易法第五十條、期貨交易法第五十八條及參考銀行法第二十條規定，於第一項明定經主管機關許可之虛擬資產服務商，其名稱應標明虛擬資產之字樣，並於第二項明定非虛擬資產服務商不得使用第一項名稱或易使人誤認其為虛擬資產服務商之名稱。\n二、金融機構兼營虛擬資產業務者，其名稱可例外不標明虛擬資產之字樣，以避免影響其金融業務客戶辨識之。爰於第一項但書明定金融機構不適用本條關於名稱之規定。"},{"bill":"202110171550000","text":"虛擬資產服務商之名稱，應標明虛擬資產之字樣。但依第八條第三項規定兼營虛擬資產業務者，不在此限。\n非虛擬資產服務商不得使用前項名稱或易使人誤認其為虛擬資產服務商之名稱。","note":"一、為俾虛擬資產服務商之客戶容易辨識經主管機關許可與管理之虛擬資產服務商，爰參考證券交易法第五十條、期貨交易法第五十八條及參考銀行法第二十條規定，於第一項明定經主管機關許可之虛擬資產服務商，其名稱應標明虛擬資產之字樣，並於第二項明定非虛擬資產服務商不得使用第一項名稱或易使人誤認其為虛擬資產服務商之名稱。\n二、金融機構兼營虛擬資產業務者，其名稱可例外不標明虛擬資產之字樣，以避免影響其金融業務客戶辨識之。爰於第一項但書明定金融機構不適用本條關於名稱之規定。"},{"bill":"202110199580000","text":"虛擬資產服務商之名稱，應標明虛擬資產之字樣。但依第八條第三項規定兼營虛擬資產業務者，不在此限。\n非虛擬資產服務商不得使用前項名稱或易使人誤認其為虛擬資產服務商之名稱。","note":"一、為俾虛擬資產服務商之客戶容易辨識經主管機關許可與管理之虛擬資產服務商，爰參考證券交易法第五十條、期貨交易法第五十八條及參考銀行法第二十條規定，於第一項明定經主管機關許可之虛擬資產服務商，其名稱應標明虛擬資產之字樣，並於第二項明定非虛擬資產服務商不得使用第一項名稱或易使人誤認其為虛擬資產服務商之名稱。\n二、金融機構兼營虛擬資產業務者，其名稱可例外不標明虛擬資產之字樣，以避免影響其金融業務客戶辨識之。爰於第一項但書明定金融機構不適用本條關於名稱之規定。"},{"bill":"202110203280000","text":"虛擬資產服務商之名稱，應標明虛擬資產之字樣。但依第七條第四項規定兼營虛擬資產業務者，不在此限。\n非虛擬資產服務商不得使用前項名稱或易使人誤認其為虛擬資產服務商之名稱。","note":"一、為使虛擬資產服務商之客戶容易辨識經主管機關許可與管理之虛擬資產服務商，爰參考證券交易法第五十條、期貨交易法第五十八條及銀行法第二十條規定，於第一項定明經主管機關許可之虛擬資產服務商，其名稱應標明虛擬資產之字樣，並於第二項定明非虛擬資產服務商不得使用第一項名稱或易使人誤認其為虛擬資產服務商之名稱。\n二、金融機構兼營虛擬資產業務者，得例外不標明虛擬資產之字樣，以避免影響其金 為第一項但書規定。"},{"bill":"202110213930000","text":"虛擬資產服務商之名稱，應標明虛擬資產之字樣。但依第七條第四項規定兼營虛擬資產業務者，不在此限。\n非虛擬資產服務商不得使用前項名稱或易使人誤認其為虛擬資產服務商之名稱。","note":"一、為使虛擬資產服務商之客戶容易辨識經主管機關許可與管理之虛擬資產服務商，爰參考證券交易法第五十條、期貨交易法第五十八條及銀行法第二十條規定，於第一項定明經主管機關許可之虛擬資產服務商，其名稱應標明虛擬資產之字樣，並於第二項定明非虛擬資產服務商不得使用第一項名稱或易使人誤認其為虛擬資產服務商之名稱。\n二、金融機構兼營虛擬資產業務者，得例外不標明虛擬資產之字樣，以避免影響其金融業務客戶之辨識，爰為第一項但書規定。"},{"bill":"202110217080000","text":"虛擬資產服務商之名稱，應標明虛擬資產之字樣。但依第七條第四項規定兼營虛擬資產業務者，不在此限。\n非虛擬資產服務商不得使用前項名稱或易使人誤認其為虛擬資產服務商之名稱。","note":"一、為使虛擬資產服務商之客戶容易辨識經主管機關許可與管理之虛擬資產服務商，爰參考證券交易法第五十條、期貨交易法第五十八條及銀行法第二十條規定，於第一項定明經主管機關許可之虛擬資產服務商，其名稱應標明虛擬資產之字樣，並於第二項定明非虛擬資產服務商不得使用第一項名稱或易使人誤認其為虛擬資產服務商之名稱。\n二、金融機構兼營虛擬資產業務者，得例外不標明虛擬資產之字樣，以避免影響其金融業務客戶之辨識，爰為第一項但書規定。"}],"changed":true,"final":"虛擬資產服務商之名稱，應標明虛擬資產之字樣。但依第七條第四項規定兼營虛擬資產業務者，不在此限。\n非虛擬資產服務商不得使用前項名稱或易使人誤認其為虛擬資產服務商之名稱。","finalWhy":"一、為使虛擬資產服務商之客戶容易辨識經主管機關許可與管理之虛擬資產服務商，爰參考證券交易法第五十條、期貨交易法第五十八條及銀行法第二十條規定，於第一項定明經主管機關許可之虛擬資產服務商，其名稱應標明虛擬資產之字樣，並於第二項定明非虛擬資產服務商不得使用第一項名稱或易使人誤認其為虛擬資產服務商之名稱。\n二、金融機構兼營虛擬資產業務者，得例外不標明虛擬資產之字樣，以避免影響其金融業務客戶之辨識，爰為第一項但書規定。","review":null},{"no":"第十一條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商之資本額或指撥營運資金，由主管機關審酌其類別、業務範圍及經濟發展情形定之。\n虛擬資產服務商應於開始營業前向主管機關指定之金融機構繳存營業保證金，其金額由主管機關定之。\n虛擬資產服務商因虛擬資產業務所生債務之債權人，對於前項營業保證金有優先受清償之權。\n虛擬資產服務商因履行前項責任，致營業保證金低於第二項所定額度時，應予補足。","note":"一、虛擬資產服務商向大眾提供服務，應具有財務健全性，以確保其具備持續提供服務之財務能力。爰參考證券交易法第四十八條、證券商設置標準第十五條及期貨交易法第五十九條規定，於第一項明定虛擬資產服務商之資本額或指撥營運資金之義務；惟考量本法允許之虛擬資產服務商依其營業內容而有不同營業類別，爰明定主管機關於訂定資本額或指撥之營運資金額度時，需考量各不同類別及業務範圍而有差異規範。\n二、為保護虛擬資產服務商客戶之利益，確保虛擬資產服務商履行責任之能力，爰參考證券交易法第五十五條以及期貨交易法第六十條規定，於第二項明定虛擬資產服務商繳存營業保證金之義務，並於第三項與第四項明定虛擬資產服務商因提供虛擬資產業務對其客戶所生之債務，客戶就營業保證金有優先受償權，以及虛擬資產服務商補足營業保證金之義務。"},{"bill":"202110171550000","text":"虛擬資產服務商之資本額或指撥營運資金，由主管機關審酌其類別、業務範圍及經濟發展情形定之。\n虛擬資產服務商應於開始營業前向主管機關指定之金融機構繳存營業保證金，其金額由主管機關定之。\n虛擬資產服務商因虛擬資產業務所生債務之債權人，對於前項營業保證金有優先受清償之權。\n虛擬資產服務商因履行前項責任，致營業保證金低於第二項所定額度時，應予補足。","note":"一、虛擬資產服務商向大眾提供服務，應具有財務健全性，以確保其具備持續提供服務之財務能力。爰參考證券交易法第四十八條、證券商設置標準第十五條及期貨交易法第五十九條規定，於第一項明定虛擬資產服務商之資本額或指撥營運資金之義務；惟考量本法允許之虛擬資產服務商依其營業內容而有不同營業類別，爰明定主管機關於訂定資本額或指撥之營運資金額度時，需考量各不同類別及業務範圍而有差異規範。\n二、為保護虛擬資產服務商客戶之利益，確保虛擬資產服務商履行責任之能力，爰參考證券交易法第五十五條以及期貨交易法第六十條規定，於第二項明定虛擬資產服務商繳存營業保證金之義務，並於第三項與第四項明定虛擬資產服務商因提供虛擬資產業務對其客戶所生之債務，客戶就營業保證金有優先受償權，以及虛擬資產服務商補足營業保證金之義務。"},{"bill":"202110199580000","text":"虛擬資產服務商之資本額或指撥營運資金，由主管機關審酌其類別、業務範圍分別定之。\n虛擬資產服務商應於開始營業前向主管機關指定之金融機構繳存營業保證金，其金額由主管機關審酌其類別、業務範圍分別定之。\n虛擬資產服務商因虛擬資產業務所生債務之債權人，對於前項營業保證金有優先受清償之權。\n虛擬資產服務商因履行前項責任，致營業保證金低於第二項所定額度時，應予補足。","note":"一、虛擬資產服務商向大眾提供服務，應具有財務健全性，以確保其具備持續提供服務之財務能力。爰參考證券交易法第四十八條、證券商設置標準第十五條及期貨交易法第五十九條規定，於第一項明定虛擬資產服務商之資本額或指撥營運資金之義務；惟考量本法允許之虛擬資產服務商依其營業內容而有不同營業類別，爰明定主管機關於訂定資本額或指撥營運資金額度時，需依其類別、業務範圍差異制定不同規範。\n二、為保護虛擬資產服務商客戶之利益，確保虛擬資產服務商履行責任之能力，爰參考證券交易法第五十五條以及期貨交易法第六十條規定，於第二項明定虛擬資產服務商繳存營業保證金之義務；惟考量不同類別之虛擬資產服務商所面對的財務風險不同，爰明定主管機關需依其類別、業務範圍差異制定不同的保證金額度。\n三、第三項與第四項明定虛擬資產服務商因提供虛擬資產業務對其客戶所生之債務，客戶就營業保證金有優先受償權，以及虛擬資產服務商補足營業保證金之義務。"},{"bill":"202110203280000","text":"虛擬資產服務商應有最低之資本額或指撥營運資金，其金額由主管機關定之。\n虛擬資產服務商應於開始營業前向主管機關指定之金融機構繳存營業保證金，其金額由主管機關定之。\n虛擬資產服務商因虛擬資產業務所生債務之債權人，對於前項營業保證金有優先受清償之權。\n虛擬資產服務商因履行前項責任，致營業保證金低於第二項所定額度時，應予補足。","note":"一、虛擬資產服務商財務應健全，以確保其具備持續提供服務之能力，爰參考證券交易法第四十八條、證券商設置標準第十五條及期貨交易法第五十九條規定，於第一項定明虛擬資產服務商之最低資本額或指撥營運資金，由主管機關定之。\n二、為保護虛擬資產服務商客戶之利益，確保虛擬資產服務商履行責任之能力，爰參考證券交易法第五十五條及期貨交易法第六十條規定，於第二項定明虛擬資產服務商有繳存營業保證金之義務，並於第三項與第四項定明虛擬資產服務商因辦理虛擬資產業務對其客戶所生之債務，該客戶即債權人就營業保證金有優先受償權，以及虛擬資產服務商補足營業保證金之義務。"},{"bill":"202110207150000","text":"虛擬資產服務商應有最低之資本額或指撥營運資金，其金額由主管機關依虛擬資產服務商種類定之。\n虛擬資產服務商應於開始營業前向主管機關指定之金融機構繳存營業保證金，其金額由主管機關定之。\n虛擬資產服務商因虛擬資產業務所生債務之債權人，對於前項營業保證金有優先受清償之權。\n虛擬資產服務商因履行前項責任，致營業保證金低於第二項所定額度時，應予補足。","note":"一、虛擬資產服務商應財務健全，以確保其具備持續提供服務之能力，爰參考證券交易法第四十八條、證券商設置標準第十五條及期貨交易法第五十九條規定，於第一項定明虛擬資產服務商應有之最低資本額或指撥營運資金，並授權主管機關依虛擬資產服務商種類不同，差異訂定其金額。\n二、為保護虛擬資產服務商客戶之利益，確保虛擬資產服務商履行責任之能力，爰參考證券交易法第五十五條及期貨交易法第六十條規定，於第二項定明虛擬資產服務商有繳存營業保證金之義務，並於第三項與第四項定明虛擬資產服務商因辦理虛擬資產業務對其客戶所生之債務，該客戶即債權人就營業保證金有優先受償權，以及虛擬資產服務商補足營業保證金之義務。"},{"bill":"202110206090000","text":"虛擬資產服務商應有最低之資本額或指撥營運資金，其金額由主管機關定之。\n虛擬資產服務商應於開始營業前向主管機關指定之金融機構繳存營業保證金，其金額由主管機關定之。\n虛擬資產服務商因虛擬資產業務所生債務之債權人，對於前項營業保證金有優先受清償之權。\n虛擬資產服務商因履 不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如係於就任虛擬資產服務商之負責人或業務人員嗣後不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考證券投資信託及顧問法第六十八條第一項規定，於第二項明定主管機關解任不具備相關資格條件者之權限。\n三、有鑒於本法通過後將對虛擬資產相關從業人員課以一定資格限制，為使相關從業人員得有足夠一定緩衝期間，爰於第三項明定規範，如未能於指定期限內滿足資格，主管機關應予解任。"},{"bill":"202110171550000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。\n本法通過前已受虛擬資產服務商雇用之業務人員，應於本法通過後六個月內取得第一項所定資格條件；但有正當理由未能於六個月內取得資格條件者，在期限屆滿前得申請延展，延展期限不得超過六個月，並以一次為限。未能於期限內取得資格條件者，主管機關應予解任。","note":"一、為確保虛擬資產服務商之健全經營，其負責人及業務人員應具備一定適格性，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關規定虛擬資產服務商負責人及業務人員之資格條件。本條之負責人係依公司法第八條之定義，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如係於就任虛擬資產服務商之負責人或業務人員嗣後不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考證券投資信託及顧問法第六十八條第一項規定，於第二項明定主管機關解任不具備相關資格條件者之權限。\n三、有鑒於本法通過後將對虛擬資產相關從業人員課以一定資格限制，為使相關從業人員得有足夠一定緩衝期間，爰於第三項明定規範，如未能於指定期限內滿足資格，主管機關應予解任。"},{"bill":"202110199580000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。\n本法通過前已受虛擬資產服務商雇用之業務人員，應於本法通過後六個月內取得第一項所定資格條件；但有正當理由未能於六個月內取得資格條件者，得在期限屆滿前向主管機關申請延展，延展期限不得超過六個月，並以一次為限。未能於期限內取得資格條件者，主管機關應予解任。","note":"一、為確保虛擬資產服務商之健全經營，其負責人及業務人員應具備一定適格性，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關規定虛擬資產服務商負責人及業務人員之資格條件。本條之負責人係依公司法第八條之定義，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如係於就任虛擬資產服務商之負責人或業務人員嗣後不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考證券投資信託及顧問法第六十八條第一項規定，於第二項明定主管機關解任不具備相關資格條件者之權限。\n三、有鑑於本法通過後將對虛擬資產相關從業人員課以一定資格限制，應與其相應之緩衝期，爰於第三項明定相關規。"},{"bill":"202110203280000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。","note":"一、為確保虛擬資產服務商得以健全經營，其負責人及業務人員應具備一定之資格條件，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關就負責人及業務人員之資格條件等另定規範。又本條負責人係依公司法第八條之規定，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如於就任後始不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定，為第二項規定。"},{"bill":"202110207150000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。\n本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商，其負責人與業務人員應於本法施行後六個月內具備第一項規則所定資格條件。","note":"一、為確保虛擬資產服務商得以健全經營，其負責人及業務人員應具備一定之資格條件，其行為亦應符合一定之規範，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關另定負責人及業務人員之資格條件等。又本條所謂負責人，係依公司法第八條規定認定，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如於就任後始不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定，為第二項規定。\n三、因依本法第五十五條規定，本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商，應於本法施行後九個月內向主管機關申請許可，為確保該期間其負責人及業務人員具相當之資格條件，俾利虛擬資產服務商健全經營，爰於第三項規定相關從業人員亦應即時具備第一項規則所定資格條件。"},{"bill":"202110206090000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。","note":"一、為確保虛擬資產服務商之健全經營，其負責人及業務人員應具備一定適格性，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關規定虛擬資產服務商負責人及業務人員之資格條件。本條負責人係依公司法第八條之定義，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如係於就任虛擬資產服務商之負責人或業務人員嗣後不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考證券投資信託及顧問法第六十八條第一項規定，於第二項定明主管機關解任不具備相關資格條件者之權限。"},{"bill":"201110205640000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。","note":"一、為確保虛擬資產服務商得以健全經營，其負責人及業務人員應具備一定之資格條件，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關就負責人及業務人員之資格條件等另定規範。又本條負責人係依公司法第八條之規定，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如於就任後始不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定，為第二項規定。"},{"bill":"202110209160000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。曾因虛擬資產詐欺、洗錢或違反本法受刑事追訴確定者，終身不得擔任虛擬資產服務商之負責人；其擔任董事、監察人者，主管機關應命其解任。","note":"一、第一項授權主管機關就負責人及業務人員之資格條件等另定規範，爰參考證券投資信託及顧問法第六十九條規定。\n二、第二項本法定明不具資格條件者之解任義務，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定。\n三、第二項但書增列終身禁任條款：曾因虛擬資產詐欺、洗錢或違反本法受刑事追訴確定者，終身不得擔任虛擬資產服務商之負責人；其擔任董事、監察人者，主管機關應命其解任，爰參考香港證券及期貨事務監察委員會《二○二三年虛擬資產服務提供者適當人選指引》及美國GENIUS法第四條規定。"},{"bill":"202110209890000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。","note":"一、為確保虛擬資產服務商得以健全經營，其負責人及業務人員應具備一定之資格條件，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關就負責人及業務人員之資格條件等另定規範。又本條負責人係依公司法第八條之規定，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如於就任後始不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定，為第二項規定。"},{"bill":"202110214790000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。","note":"一、為確保虛擬資產服務商得以健全經營，其負責人及業務人員應具備一定之資格條件，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關就負責人及業務人員之資格條件等另定規範。又本條負責人係依公司法第八條之規定，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如於就任後始不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定，為第二項規定。"},{"bill":"202110213930000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。","note":"一、為確保虛擬資產服務商得以健全經營，其負責人及業務人員應具備一定之資格條件，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關就負責人及業務人員之資格條件等另定規範。又本條負責人係依公司法第八條之規定，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如於就任後始不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定，為第二項規定。"},{"bill":"202110217080000","text":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。","note":"一、為確保虛擬資產服務商得以健全經營，其負責人及業務人員應具備一定之資格條件，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關就負責人及業務人員之資格條件等另定規範。又本條負責人係依公司法第八條之規定，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如於就任後始不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定，為第二項規定。"}],"changed":true,"final":"虛擬資產服務商之負責人及業務人員之資格條件、行為規範、訓練及其他應遵行事項之規則，由主管機關定之。\n未具備前項規則所定資格條件者，不得充任虛擬資產服務商之負責人及業務人員；已充任者，主管機關應予解任。\n曾犯虛擬資產詐欺、洗錢或違反本法規定之罪，經判決有罪確定，尚未執行、尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾五年者，不得擔任虛擬資產服務商之負責人；已充任者，主管機關應予解任。","finalWhy":"一、為確保虛擬資產服務商得以健全經營，其負責人及業務人員應具備一定之資格條件，爰參考證券投資信託及顧問法第六十九條規定，於第一項授權主管機關就負責人及業務人員之資格條件等另定規範。又本條負責人係依公司法第八條之規定，併予敘明。\n二、不具備主管機關規定之資格條件者，不得充任虛擬資產服務商之負責人或業務人員；如於就任後始不具備主管機關規定之資格條件者，應許主管機關解消其職位，爰參考銀行法第三十五條之二及保險法第一百三十七條之一規定，為第二項規定。\n三、鑑於虛擬資產具有匿名性、移轉速度快、跨境流通性強等特性，易被作為詐欺或洗錢之媒介，為避免有心人士透過虛擬資產服務商之職位，利用職務之便利從事或掩護不法行為，對於曾因虛擬資產而涉犯詐欺、洗錢之罪或違反本法規定之罪，經判決有罪確定，尚未執行、尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾五年者，其行為已嚴重侵害消費者權益與金融秩序，且難以認列為適任之管理人員，爰於第三項定明曾犯虛擬資產詐欺、洗錢或違反本法規定之罪者，不得擔任虛擬資產服務商之負責人；已充任者，主管機關應予解任。」。","review":null},{"no":"第十三條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商之對外負債總額，不得超過其淨值之規定倍數；其流動負債總額，不得超過其流動資產總額之規定成數。但金融機構依第八條第三項規定兼營者，不在此限。\n前項倍數及成數，由主管機關定之。\n主管機關得就虛擬資產服務商之各項財務比率，於必要時，定其基準。","note":"一、為確保虛擬資產服務商之財務健全，虛擬資產服務商應符合一定之財務審慎要求。爰參考證券交易法第四十九條規定，於第一項明定虛擬資產服務商之財務審慎要求，並於第二項授權主管機關制定具體規範。\n二、考量金融機構受高度監理，各該業法已對其財務訂定相關要求，爰於第一項但書明定兼營虛擬資產業務之金融機構，其財務審慎要求回歸各該業法之規定。\n三、為健全虛擬資產服務商之財務結構，主管機關得於必要時訂定虛擬資產服務商之各項財務比率基準。惟主管機關訂定該基準前，應充分徵詢同業公會之意見。"},{"bill":"202110171550000","text":"虛擬資產服務商之對外負債總額，不得超過其淨值之規定倍數；其流動負債總額，不得超過其流動資產總額之規定成數。但金融機構依第八條第三項規定兼營者，不在此限。\n前項倍數及成數，由主管機關定之。","note":"一、為確保虛擬資產服務商之財務健全，虛擬資產服務商應符合一定之財務審慎要求。爰參考證券交易法第四十九條規定，於第一項明定虛擬資產服務商之財務審慎要求，並於第二項授權主管機關制定具體規範。\n二、考量金融機構受高度監理，各該業法已對其財務訂定相關要求，爰於第一項但書明定兼營虛擬資產業務之金融機構，其財務審慎要求回歸各該業法之規定。"},{"bill":"202110199580000","text":"虛擬資產服務商之對外負債總額，不得超過其淨值之規定倍數；其流動負債總額，不得超過其流動資產總額之規定成數。但金融機構依第八條第三項規定兼營者，不在此限。\n前項倍數及成數，由主管機關審酌其類別、業務範圍分別定之。","note":"一、為確保虛擬資產服務商之財務健全，虛擬資產服務商應符合一定之財務審慎要求。爰參考證券交易法第四十九條規定，於第一項明定虛擬資產服務商之財務審慎要求，並於第二項授權主管機關制定具體規範；惟考量不同類別之虛擬資產服務商所面對的財務風險不同，爰明定主管機關需依其類別、業務範圍差異設置不同規定。\n二、考量金融機構受高度監理，各該業法已對其財務訂定相關要求，爰於第一項但書明定兼營虛擬資產業務之金融機構，其財務審慎要求回歸各該業法之規定。"},{"bill":"202110203280000","text":"虛擬資產服務商之對外負債總額，不得超過其淨值之一定倍數；其流動負債總額，不得超過其流動資產總額之一定成數。但金融機構依第七條第四項規定兼營虛擬資產業務者，不適用之。\n前項一定倍數及成數，由主管機關定之。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商應符合一定之財務審慎要求，爰參考證券交易法第四十九條規定，為第一項本文規定，並於第二項授權主管機關訂定規範。\n二、考量各金融機構所適用之業管法規已就財務事項定有相關規範，並受高度監理，爰於第一項但書定明兼營虛擬資產業務之金融機構不適用該項本文規定。"},{"bill":"202110207150000","text":"虛擬資產服務商之對外負債總額，不得超過其淨值之一定倍數；其流動負債總額，不得超過其流動資產總額之一定成數。但金融機構依第七條第四項規定兼營虛擬資產業務者，不在此限。\n前項一定倍數及成數，由主管機關依虛擬資產服務商種類定之。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商應符合一定之財務審慎要求，爰參考證券交易法第四十九條規定，為第一項本文規定，並於第二項授權主管機關訂定具體規範。\n二、考量各金融機構所適用之業管法規已就財務事項定有相關規範，並受高度監理，爰於第一項但書定明兼營虛擬資產業務之金融機構不適用該項本文規定。"},{"bill":"202110206090000","text":"虛擬資產服務商之對外負債總額，不得超過其淨值之一定倍數；其流動負債總額，不得超過其流動資產總額之一定成數。但金融機構依第七條第四項規定兼營虛擬資產業務者，不適用之。\n前項一定倍數及成數，由主管機關定之。","note":"一、為確保虛擬資產服務商財務健全，虛擬資產服務商應符合一定之財務審慎要求，爰參考證券交易法第四十九條規定，為第一項本文規定，並於第二項授權主管機關訂定具體規範。\n二、考量各金融機構所適用之業管法規已就財務事項定有相關規範，並受高度監理，爰於第一項但書定明兼營虛擬資產業務之金融機構不適用該項本文規定。"},{"bill":"201110205640000","text":"虛擬資產服務商之對外負債總額，不得超過其淨值之一定倍數；其流動負債總額，不得超過其流動資產總額之一定成數。但金融機構依第七條第四項規定兼營虛擬資產業務者，不適用之。\n前項一定倍數及成數，由主管機關定之。",
