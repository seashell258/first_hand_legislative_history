<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>虛擬資產服務法制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

</div>

四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條","第二十七條","第二十八條","第二十九條","第三十條","第三十一條","第三十二條","第三十三條","第三十四條","第三十五條","第三十六條","第三十七條","第三十八條","第三十九條","第四十條","第四十一條","第四十二條","第四十三條","第四十四條","第四十五條","第四十六條","第四十七條","第四十八條","第四十九條","第五十條","第五十一條","第五十二條","第五十三條","第五十四條","第五十五條","第五十六條"]},{"id":"202110209160000","who":"委員賴士葆等20人","date":"2026-04-24","name":"「虛擬資產服務法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110209160000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/05/08/LCEWA01_110508_00207.pdf","proposers":["賴士葆"],"ncosign":19,"people":[["賴士葆","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","連署"],["鄭正鈐","國民黨","連署"],["翁曉玲","國民黨","連署"],["萬美玲","國民黨","連署"],["呂玉玲","國民黨","連署"],["陳玉珍","國民黨","連署"],["廖先翔","國民黨","連署"],["許宇甄","國民黨","連署"],["游顥","國民黨","連署"],["林倩綺","國民黨","連署"],["林德福","國民黨","連署"],["陳雪生","國民黨","連署"],["顏寬恒","國民黨","連署"],["張智倫","國民黨","連署"],["黃健豪","國民黨","連署"],["羅明才","國民黨","連署"],["盧縣一","國民黨","連署"],["黃建賓","國民黨","連署"],["魯明哲","國民黨","連署"]],"party":[["國民黨",20]],"reason":"本院委員賴士葆等20人，鑑於全球虛擬資產市場規模已逾三兆美元，我國民眾持有虛擬資產之比例居亞洲前列，然我國目前對虛擬資產服務業之管理，僅依附於洗錢防制法之登記制度，既無完整之許可審查機制，亦無消費者保護之制度性安排，更無穩定幣發行之法律框架，與歐盟、美國、日本、香港、新加坡等主要法域之立法進程相較，落差日益顯著。本草案以行政院院會版草案為基礎，針對四大面向進行強化。第一，於金融監督管理委員會下設立「虛擬資產管理局」，整合分散之監管職能，以專責機關提升政策一致性與執法效率，回應產業一元化監管之長期需求。第二，大幅強化穩定幣管理規範，明文禁止演算法穩定幣在台發行，並明定持幣人享有第一順位優先受償權，發行人破產時準備資產不入破產財團，保障持幣民眾之財產安全。第三，明文釐清符合條件之支付型穩定幣不屬證券交易法有價證券及期貨交易法商品，由本法統一規範，消除業者長期面臨之法律不確定性，有助吸引國際業者來台布局。第四，授權主管機關以子法納管虛擬資產衍生性商品及代幣化資產相關業務，僅在母法確立法律基礎，細部規範交由主管機關依市場發展靈活調整，兼顧創新空間與監管彈性。本草案共九章五十三條，期待本法通過後，能為台灣虛擬資產產業建立兼顧消費者保護、市場秩序與創新發展的完整法律框架，保護台灣民眾免受無序市場之侵害，並吸引優質國際業者在符合法規的前提下在台落地深耕，爰擬具「虛擬資產服務法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條","第二十七條","第二十八條","第二十九條","第三十條","第三十一條","第三十二條","第三十三條","第三十四條","第三十五條","第三十六條","第三十七條","第三十八條","第三十九條","第四十條","第四十一條","第四十二條","第四十三條","第四十四條","第四十五條","第四十六條","第四十七條","第四十八條" bill":"202110213930000","text":"為健全虛擬資產業務之經營與發展，增進虛擬資產服務及交易市場之管理，並保障虛擬資產交易人權益，促進金融科技創新，特制定本法。","note":"虛擬資產為運用分散式帳本技術與密碼學技術表彰數位價值之金融科技創新，具有促進交易之應用價值；虛擬資產服務與市場亦存在客戶資產保護、資訊不對稱以及人為影響虛擬資產交易市場等風險，有加以管理以促進虛擬資產服務及交易市場健全發展，並提升市場透明度之必要，俾鼓勵負責任之創新，爰於本條定明本法之立法目的。"},{"bill":"202110217080000","text":"為健全虛擬資產業務之經營與發展，增進虛擬資產服務及交易市場之管理，並保障虛擬資產交易人權益，促進金融科技創新，特制定本法。","note":"虛擬資產為運用分散式帳本技術與密碼學技術表彰數位價值之金融科技創新，具有促進交易之應用價值；虛擬資產服務與市場亦存在客戶資產保護、資訊不對稱以及人為影響虛擬資產交易市場等風險，有加以管理以促進虛擬資產服務及交易市場健全發展，並提升市場透明度之必要，俾鼓勵負責任之創新，爰於本條定明本法之立法目的。"}],"changed":true,"final":"為健全虛擬資產業務之經營與發展，增進虛擬資產服務及交易市場之管理，並保障虛擬資產交易人權益，促進金融科技創新及虛擬資產創新應用，特制定本法。","finalWhy":"照委員提案修正通過。,,,,,,","review":null},{"no":"第二條","current":null,"versions":[{"bill":"202110137730000","text":"本法所稱主管機關，為金融監督管理委員會。\n為促進虛擬資產業之發展，並完善虛擬資產業及虛擬資產之發行管理與監理，主管機關應有專責單位及專責人員辦理相關事宜。\n主管機關應依實際需要合理分配、挹注資源，補助、表彰相關學術機構、虛擬資產業界、民間團體與個人等，共同推動相關虛擬資產事務及措施。","note":"一、本法規範之虛擬資產具有支付或投資功能，屬具有金融性質之金融商品，爰於本條明定本法之主管機關為金融監督管理委員會。\n二、為提升對虛擬資產業之監理之量能，並促進虛擬資產業之發展以及虛擬資產之發行管理，爰明定主管機關應有專責單位及專責人員辦理相關事宜。\n三、除建構虛擬資產業界之監理法制外，本條例亦有促進虛擬資產業界發展之目的，爰參酌海洋基本法第十四條第二項之規定，要求主管機關應視整體虛擬資產業界之實際需要而合理分配、挹注資源，並對相關學術機構、業界、民間團體及個人等提供一定補助或表彰其貢獻。"},{"bill":"202110171550000","text":"本法所稱主管機關，為金融監督管理委員會。\n為促進虛擬資產業之發展，並完善虛擬資產業及虛擬資產之發行管理與監理，主管機關應有專責單位及專責人員辦理相關事宜。","note":"一、本法規範之虛擬資產具有支付或投資功能，屬具有金融性質之金融商品，爰於本條明定本法之主管機關為金融監督管理委員會。\n二、為提升對虛擬資產業之監理之量能，並促進虛擬資產業之發展以及虛擬資產之發行管理，爰明定主管機關應有專責單位及專責人員辦理相關事宜。"},{"bill":"202110199580000","text":"本法所稱主管機關，為金融監督管理委員會。\n為辦理本法規定相關事宜，主管機關應置專責單位及專責人員；其人數應依業務增減而調整之。","note":"一、本法規範之虛擬資產具有支付或投資功能，屬具有金融性質之金融商品，爰於本條明定本法之主管機關為金融監督管理委員會。\n二、為強化主管機關對虛擬資產業務監理量能，並促進虛擬資產產業之發展，爰明定主管機關應置專責單位及專責人員，並依業務量之增減調整人力需求。"},{"bill":"202110203280000","text":"本法之主管機關，為金融監督管理委員會。","note":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。"},{"bill":"202110207150000","text":"本法所稱主管機關，為金融監督管理委員會。","note":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。"},{"bill":"202110206090000","text":"本法之主管機關，為金融監督管理委員會。","note":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。"},{"bill":"201110205640000","text":"本法之主管機關，為金融監督管理委員會。","note":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。"},{"bill":"202110209160000","text":"金融監督管理委員會（以下簡稱金管會）為辦理本法事務，應於本法施行後一年內設立「虛擬資產管理局」（以下簡稱本局或主管機關），統一行使本法主管機關職能；本局設立前，由金管會暫代行使本法主管機關職能。\n本局應設立「虛擬資產監理諮詢委員會」，成員包括業者、學者、消費者及相關機關代表，每季召開，並每半年公布虛擬資產監理政策說明。","note":"一、本條爰於金管會下設立「虛擬資產管理局」為專責主管機關，以整合目前分散於各局處之監管職能，提升政策一致性與執法效率，回應產業一元化監管之需求。\n二、國際上，英國金融行為監理總署（FCA）設立數位資產監管部門、香港證券及期貨事務監察委員會設立虛擬資產許可辦公室，均朝專責化方向發展，本條設計與國際趨勢一致；設立本局亦有助強化我國在FATF、IOSCO等國際監理組織之代表性，推動等效認定。\n三、本局設立前，由金管會暫代行使主管機關職能，以確保本法施行期間之監管連續性。\n四、本局應設置「虛擬資產監理諮詢委員會」，確保業者、學者及消費者聲音均納入政策制定，並以定期政策說明維持透明度。"},{"bill":"202110209890000","text":"本法之主管機關，為金融監督管理委員會。","note":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。"},{"bill":"202110214790000","text":"本法之主管機關，為金融監督管理委員會。","note":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。"},{"bill":"202110213930000","text":"本法之主管機關，為金融監督管理委員會。","note":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。"},{"bill":"202110217080000","text":"本法之主管機關，為金融監督管理委員會。","note":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。"}],"changed":true,"final":"本法之主管機關，為金融監督管理委員會。","finalWhy":"本法係規範具有支付或投資功能之虛擬資產，屬具有金融性質之金融商品，爰於本條定明本法之主管機關為金融監督管理委員會。","review":null},{"no":"第三條","current":null,"versions":[{"bill":"202110137730000","text":"本法用詞定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及其他依法令發行之金融資產。\n(二)表彰之權利具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。\n八、關鍵意見領袖：係指常態性於網路分享資訊供大眾閱覽，並基於此而有一定社會影響力，既而藉此營利者。","note":"一、防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰參考FATF四十項建議對虛擬資產之定義，於第一款明定虛擬資產之定義。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五款規定，係可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，而不包含僅可於預設的封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換的航空哩程點數或信用卡點數即非屬之。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用做紀錄或表彰其它資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額的數位形式銀行紀錄即非屬有投資目的。\n四、針對具有其他依法令發行之金融資產性質之虛擬資產，FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Asset Regulations，下稱「MiCA規則」）第二條第四項規定明定將其排除於虛擬資產之定義中，以回歸適用其他金融法規之規範。爰參考FATF及MiCA規則之排除規定，於第一款但書第一目明定其他依法令發行之金融資產例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，仍非屬本法所定之虛擬資產。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之權利具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不致具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無適用本法以保護不特定大眾交易人處於資訊不對稱地位之需要。爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與十一點之說明，於第一款但書第二目明定本法定義之虛擬資產不包含所表彰之權利具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考歐盟MiCA規則上述規定與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性以斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰權利具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，但以約定有對價者為限。爰於第二款定明發行之定義。\n七、本法所稱交易人，係指從事本法所規範之虛擬資產交易類型之人，不限於虛擬資產服務商之客戶。爰於第二款明定虛擬資產交易人之定義。\n八、本法所稱客戶，係指虛擬資產服務商提供服務之對象。爰參考歐盟MiCA規則第三條第三十九款規定及韓國虛擬資產用戶保護法第二條第三款規定，於第三款明定客戶之定義。\n九、洗錢防制法第六條第一項明定納管境外設立之虛擬資產服務商，爰參考洗錢防制法第六條第一項及證券交易法第四條第二項之規定，於第四款明定境外虛擬資產服務商之定義。\n十、按歐盟、日本、英國、新加坡及美國紐約州對於穩定幣發行之監理架構係將價值錨定法定貨幣之虛擬資產視為穩定幣納管，爰參考歐盟MiCA規則第三條第一項第七款之規定、新加坡穩定幣監理框架及美國紐約州金融服務署「發行美元支持穩定幣之指引」，於第五款明定穩定幣之定義。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第六款明定錢包之定義。\n十二、有鑑於虛擬資產業之廣告促銷活動高度仰賴包括關鍵意見領袖（Key Opinion Leader/KOL，又稱網紅）進行，且網紅之活動包括但不限於社群媒體如臉書（Facebook）、推特（Twitter，於2023年改稱X）、Discord、Instagram、Threads，或影音平台如Youtube、Twitch（圖奇）、浪Live、17直播或其他線上媒體等；其形式亦不拘直播主、粉絲專業等。由於虛擬資產本身之特性，為使業界之廣告得有一定規範以避免有大量詐騙情形，業界透過網紅進行廣告之行為允宜於本法納管。爰參酌中華民國證券投資信託暨顧問商業同業公會「會員及其銷售機構從事廣告及營業活動行為規範」第8－5條之規定，於第七款明定關鍵意見領袖之定義。"},{"bill":"202110171550000","text":"本法用詞定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及其他依法令發行之金融資產。\n(二)表彰之權利具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰參考FATF四十項建議對虛擬資產之定義，於第一款明定虛擬資產之定義。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五款規定，係可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，而不包含僅可於預設的封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換的航空哩程點數或信用卡點數即非屬之。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用做紀錄或表彰其它資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額的數位形式銀行紀錄即非屬有投資目的。\n四、針對具有其他依法令發行之金融資產性質之虛擬資產，FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Asset Regulations，下稱「MiCA規則」）第二條第四項規定明定將其排除於虛擬資產之定義中，以回歸適用其他金融法規之規範。爰參考FATF及MiCA規則之排除規定，於第一款但書第一目明定其他依法令發行之金融資產例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，仍非屬本法所定之虛擬資產。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之權利具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不致具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無適用本法以保護不特定大眾交易人處於資訊不對稱地位之需要。爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與十一點之說明，於第一款但書第二目明定本法定義之虛擬資產不包含所表彰之權利具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考歐盟MiCA規則上述規定與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性以斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰權利具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，但以約定有對價者為限。爰於第二款定明發行之定義。\n七、本法所稱交易人，係指從事本法所規範之虛擬資產交易類型之人，不限於虛擬資產服務商之客戶。爰於第二款明定虛擬資產交易人之定義。\n八、本法所稱客戶，係指虛擬資產服務商提供服務之對象。爰參考歐盟MiCA規則第三條第三十九款規定及韓國虛擬資產用戶保護法第二條第三款規定，於第三款明定客戶之定義。\n九、洗錢防制法第六條第一項明定納管境外設立之虛擬資產服務商，爰參考洗錢防制法第六條第一項及證券交易法第四條第二項之規定，於第四款明定境外虛擬資產服務商之定義。\n十、按歐盟、日本、英國、新加坡及美國紐約州對於穩定幣發行之監理架構係將價值錨定法定貨幣之虛擬資產視為穩定幣納管，爰參考歐盟MiCA規則第三條第一項第七款之規定、新加坡穩定幣監理框架及美國紐約州金融服務署「發行美元支持穩定幣之指引」，於第五款明定穩定幣之定義。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第六款明定錢包之定義。"},{"bill":"202110199580000","text":"本法用詞定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及其他依法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰參考FATF四十項建議對虛擬資產之定義，於第一款明定虛擬資產之定義。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五項規定，係可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，而不包含僅可於預設的封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換的航空哩程點數或信用卡點數即非屬之。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用做紀錄或表彰其它資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額的數位形式銀行紀錄即非屬有投資目的。\n四、針對具有其他依法令發行之金融資產性質之虛擬資產，FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Asset Regulations，下稱「MiCA規則」）第二條第四項規定明定將其排除於虛擬資產之定義中，以回歸適用其他金融法規之規範。爰參考FATF及MiCA規則之排除規定，於第一款但書第一目定明或外國、大陸地區、香港或澳門政府發行之數位貨幣、數位型之有價證券或其他依法令發行之金融資產例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，仍非屬本法所定之虛擬資產。又依本法發行之穩定幣仍屬本法所稱之虛擬資產，不適用本木之例外排除規定，併予敘明。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰之價值具有特定性及不可替代性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不致具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無適用本法以保護不特定大眾交易人處於資訊不對稱地位之需要。爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與十一點之說明，於第一款但書第二目定明本法定義之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考歐盟MiCA規則上述規定與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性以斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰權利具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，但以約定有對價者為限。爰於第二款定明發行之定義。\n七、本法所稱交易人，係指從事本法所規範之虛擬資產交易類型之人，不限於虛擬資產服務商之客戶。爰於第三款定明虛擬資產交易人之定義。\n八、本法所稱客戶，係指虛擬資產服務商提供服務之對象。爰參考歐盟MiCA規則第三條第一項第三十九款及韓國虛擬資產使用者保護法第二條第三款規定，於第四款定明客戶之定義。\n九、洗錢防制法第六條第一項明定納管境外設立之虛擬資產服務商，爰參考洗錢防制法第六條第一項及證券交易法第四條第二項之規定，於第五款定明境外虛擬資產服務商之定義。\n十、按歐盟、日本、英國、新加坡及美國紐約州對於穩定幣發行之監理架構係將價值錨定法定貨幣之虛擬資產視為穩定幣納管，爰參考歐盟MiCA規則第三條第一項第七款之規定、新加坡穩定幣監理框架及美國紐約州金融服務署「發行美元支持穩定幣之指引」，於第六款定明穩定幣之定義。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第七款定明錢包之定義。"},{"bill":"202110203280000","text":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、參考防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議，將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰為第一款規定。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五項規定，係指可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，但不包含僅可於預設封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換之航空哩程點數或信用卡點數。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用作紀錄或表彰其他資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額之數位形式銀行紀錄，即非屬有投資目的。\n四、參考FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Assets Regulation，下稱「MiCA規則」）第二條第四項規定，將依其他法令發行具有金融資產性質之虛擬資產排除於虛擬資產之定義外，以其他金融法規規範之，爰於第一款但書第一目定明數位型式之新臺幣、外國、大陸地區、香港或澳門發行之數位貨幣、數位型式之有價證券或依其他法令發行之金融資產，例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，非屬本法所定虛擬資產。又依本法發行之穩定幣並非依其他法令發行之金融資產，故仍屬本法所稱虛擬資產，併予敘明。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無保護不特定交易人處於資訊不對稱地位之需要，爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與第十一點之說明，於第一款但書第二條第三項規定及其序言第十點與第十一點之說明，於第一款但書第二目定明本法之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考前揭歐盟MiCA規則與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性為斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰價值具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，並以約定有對價者為限，爰為第二款規定。\n七、本法所稱交易人，係指從事本法所規範虛擬資產交易類型之人，不以虛擬資產服務商之客戶為限，爰為第三款規定。\n八、參考歐盟MiCA規則第三條第一項第三十九款及韓國虛擬資產使用者保護法第二條第三款規定，於第四款定明本法所稱客戶，係指虛擬資產服務商提供服務之對象。\n九、境外設立之虛擬資產服務商如在境內經營虛擬資產業務，亦應受本法管理，爰參考證券交易法第四條第二項規定，於第五款定明境外虛擬資產服務商之定義。\n十、按美國、歐盟、日本、香港、英國及新加坡係將價值一比一錨定法定貨幣之虛擬資產視為穩定幣納管，我國對此類虛擬資產亦有納管之必要，爰於第六款定明穩定幣之定義，又所謂價值連結係指與法定貨幣有一比一之固定交換比率者。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第七款定明錢包之定義。"},{"bill":"202110207150000","text":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、參考防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議，將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰為第一款規定：\n(一)本款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五項規定，係指可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者。但不包含僅可於預設封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換之航空哩程點數或信用卡點數。\n(二)本款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用。相對而言，單純用作紀錄或表彰其他資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額之數位形式銀行紀錄，即非屬有投資目的。\n(三)參考FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Assets Regulation，下稱「MiCA規則」）第二條第四項規定，將依其他法令發行具有金融資產性質之虛擬資產排除於虛擬資產之定義外，該等資產將以其他金融法規規範之，爰於第一款但書第一目定明數位型式之新臺幣、外國、大陸地區、香港或澳門發行之數位貨幣、數位型式之有價證券或依其他法令發行之金融資產，例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，非屬本法所定虛擬資產。惟依本法發行之穩定幣，因非依其他法令發行之金融資產，故仍屬本法所稱虛擬資產，則屬當然。\n(四)虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無保護不特定交易人處於資訊不對稱地位之需要，爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與第十一點之說明，於第一款但書第二目定明本法之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考前揭歐盟MiCA規則與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性為斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰價值具不可代替性，併予敘明。\n二、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，並以約定有對價者為限，爰為第二款規定。\n三、本法所稱交易人，係指從事本法所規範虛擬資產交易類型之人，不以虛擬資產服務商之客戶為限，爰為第三款規定。\n四、參考歐盟MiCA規則第三條第一項第三十九款及韓國虛擬資產使用者保護法第二條第三款規定，於第四款定明本法所稱客戶，係指虛擬資產服務商提供服務之對象。\n五、境外設立之虛擬資產服務商如在境內經營虛擬資產業務，亦應受本法管理，爰參考證券交易法第四條第二項規定，於第五款定明境外虛擬資產服務商之定義。\n六、按美國、歐盟、日本、香港、英國及新加坡係將價值一比一錨定法定貨幣之虛擬資產視為穩定幣納管，我國對此類虛擬資產亦有納管之必要，爰參考美國引導與建立美國穩定幣之國家創新法（Guiding and Establishing National Innovation for U.S. Stablecoins Act，下稱「GENIUS法」）Section 2(22)、歐盟MiCA規則第三條第一項第七款規定、香港穩定幣條例第四條及新加坡穩定幣監理框架規定，於第六款定明穩定幣之定義。其中所謂「價值連結」，係指與法定貨幣有一比一之固定交換比率者。\n七、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」），於第七款定明錢包之定義。"},{"bill":"202110206090000","text":"本法用詞定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰參考FATF四十項建議對虛擬資產之定義，於第一款定明虛擬資產之定義。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五款規定，係可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，而不包含僅可於預設的封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換的航空哩程點數或信用卡點數即非屬之。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用做紀錄或表彰其它資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額的數位形式銀行紀錄即非屬有投資目的。\n四、針對具有其他依法令發行之金融資產性質之虛擬資產，FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Asset Regulations，下稱「MiCA規則」）第二條第四項規定明定將其排除於虛擬資產之定義中，以回歸適用其他金融法規之規範。爰參考FATF四十項建議及MiCA規則之排除規定，於第一款但書第一目定明其他依法令發行之金融資產例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，仍非屬本法所定之虛擬資產。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不致具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無適用本法以保護不特定大眾交易人處於資訊不對稱地位之需要。爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與十一點之說明，於第一款但書第二目定明本法定義之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考歐盟MiCA規則上述規定與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性以斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰價值具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，但以約定有對價者為限。爰於第二款定明發行之定義。\n七、本法所稱交易人，係指從事本法所規範之虛擬資產交易類型之人，不限於虛擬資產服務商之客戶。爰於第三款定明虛擬資產交易人之定義。\n八、本法所稱客戶，係指虛擬資產服務商提供服務之對象。爰參考歐盟MiCA規則第三條第三十九款規定及韓國虛擬資產用戶保護法第二條第四款規定，於第四款定明客戶之定義。\n九、洗錢防制法第六條第一項明定納管境外設立之虛擬資產服務商，爰參考洗錢防制法第六條第一項及證券交易法第四條第二項規定，於第五款定明境外虛擬資產服務商之定義。\n十、按歐盟、日本、英國、新加坡及美國紐約州對於穩定幣發行之監理架構係將價值錨定法定貨幣之虛擬資產視為穩定幣納管，爰參考歐盟MiCA規則第三條第一項第七款規定、新加坡穩定幣監理框架及美國紐約州金融服務署「發行美元支持穩定幣之指引」，於第六款定明穩定幣之定義。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第七款定明錢包之定義。"},{"bill":"201110205640000","text":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、參考防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議，將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰為第一款規定。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五項規定，係指可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，但不包含僅可於預設封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換之航空哩程點數或信用卡點數。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用作紀錄或表彰其他資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額之數位形式銀行紀錄，即非屬有投資目的。\n四、參考FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Assets Regulation，下稱「MiCA規則」）第二條第四項規定，將依其他法令發行具有金融資產性質之虛擬資產排除於虛擬資產之定義外，以其他金融法規規範之，爰於第一款但書第一目定明數位型式之新臺幣、外國、大陸地區、香港或澳門發行之數位貨幣、數位型式之有價證券或依其他法令發行之金融資產，例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，非屬本法所定虛擬資產。又依本法發行之穩定幣並非依其他法令發行之金融資產，故仍屬本法所稱虛擬資產，併予敘明。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無保護不特定交易人處於資訊不對稱地位之需要，爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與第十一點之說明，於第一款但書第二目定明本法之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考前揭歐盟MiCA規則與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性為斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰價值具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，並以約定有對價者為限，爰為第二款規定。\n七、本法所稱交易人，係指從事本法所規範虛擬資產交易類型之人，不以虛擬資產服務商之客戶為限，爰為第三款規定。\n八、參考歐盟MiCA規則第三條第一項第三十九款及韓國虛擬資產使用者保護法第二條第三款規定，於第四款定明本法所稱客戶，係指虛擬資產服務商提供服務之對象。\n九、境外設立之虛擬資產服務商如在境內經營虛擬資產業務，亦應受本法管理，爰參考證券交易法第四條第二項規定，於第五款定明境外虛擬資產服務商之定義。\n十、按美國、歐盟、日本、香港、英國及新加坡係將價值一比一錨定法定貨幣之虛擬資產視為穩定幣納管，我國對此類虛擬資產亦有納管之必要，爰參考美國引導與建立美國穩定幣之國家創新法（Guiding and Establishing National Innovation for U.S.Stablecoins Act，下稱「GENIUS法」）Section2(22)、歐盟MiCA規則第三條第一項第七款規定、香港穩定幣條例第四條及新加坡穩定幣監理框架規定，於第六款定明穩定幣之定義，又所謂價值連結係指與法定貨幣有一比一之固定交換比率者。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第七款定明錢包之定義。"},{"bill":"202110209160000","text":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括下列資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)非同質化代幣，如其表彰之權利或價值具有特定性及不可代替性，且同時不具有大量系列化發行、對不特定人公開招募、於集中交易市場流通、收益分配或投資性質者。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指以十足法定貨幣準備資產為支撐，且表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、演算法穩定幣：指未以十足準備資產為支撐，而係透過演算法、自動增減供給或其他智慧合約設計，以維持或標榜維持價格穩定之數位資產；演算法穩定幣不屬本法所稱穩定幣，適用一般虛擬資產規範。\n八、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。\n九、虛擬資產衍生性商品：指以虛擬資產或與虛擬資產相關之權利或指數為標的，其價值係衍生自該標的之金融商品或契約。","note":"一、第一款至第五款及第八款參考FATF四十項建議，定明虛擬資產、發行、交易人、客戶、境外虛擬資產服務商及錢包之定義。\n二、第一款但書第二目非同質化代幣（NFT）之豁免，改採實質判斷標準，以是否同時具有大量系列化發行、對不特定人公開招募、於集中交易市場流通、收益分配或投資性質等因素為判斷依據，避免以技術形式全面規避監管，參考歐盟MiCA規則序言第六至十點。\n三、第六款穩定幣定義明確限於「以十足法定貨幣準備資產為支撐」者，與第七款演算法穩定幣明確區隔。\n四、第七款新增演算法穩定幣定義，明定其不屬本法所稱穩定幣，適用一般虛擬資產規範，爰參考歐盟MiCA規則第十八條及美國引導與建立美國穩定幣之國家創新法（以下稱「GENIUS法」）第十四條規定。\n五、第九款新增虛擬資產衍生性商品定義，為第四十三條授權納管條款提供法律基礎。"},{"bill":"202110209890000","text":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、參考防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議，將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰為第一款規定。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五項規定，係指可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，但不包含僅可於預設封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換之航空哩程點數或信用卡點數。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用作紀錄或表彰其他資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額之數位形式銀行紀錄，即非屬有投資目的。\n四、參考FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Assets Regulation，下稱「MiCA規則」）第二條第四項規定，將依其他法令發行具有金融資產性質之虛擬資產排除於虛擬資產之定義外，以其他金融法規規範之，爰於第一款但書第一目定明數位型式之新臺幣、外國、大陸地區、香港或澳門發行之數位貨幣、數位型式之有價證券或依其他法令發行之金融資產，例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，非屬本法所定虛擬資產。又依本法發行之穩定幣並非依其他法令發行之金融資產，故仍屬本法所稱虛擬資產，併予敘明。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無保護不特定交易人處於資訊不對稱地位之需要，爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與第十一點之說明，於第一款但書第二目定明本法之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考前揭歐盟MiCA規則與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性為斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰價值具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，並以約定有對價者為限，爰為第二款規定。\n七、本法所稱交易人，係指從事本法所規範虛擬資產交易類型之人，不以虛擬資產服務商之客戶為限，爰為第三款規定。\n八、參考歐盟MiCA規則第三條第一項第三十九款及韓國虛擬資產使用者保護法第二條第三款規定，於第四款定明本法所稱客戶，係指虛擬資產服務商提供服務之對象。\n九、境外設立之虛擬資產服務商如在境內經營虛擬資產業務，亦應受本法管理，爰參考證券交易法第四條第二項規定，於第五款定明境外虛擬資產服務商之定義。\n十、按美國、歐盟、日本、香港、英國及新加坡係將價值一比一錨定法定貨幣之虛擬資產視為穩定幣納管，我國對此類虛擬資產亦有納管之必要，爰參考美國引導與建立美國穩定幣之國家創新法（Guiding and Establishing National Innovation for U.S. Stablecoins Act，下稱「GENIUS法」）Section 2(22)、歐盟MiCA規則第三條第一項第七款規定、香港穩定幣條例第四條及新加坡穩定幣監理框架規定，於第六款定明穩定幣之定義，又所謂價值連結係指與法定貨幣有一比一之固定交換比率者。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第七款定明錢包之定義。"},{"bill":"202110214790000","text":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、參考防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議，將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰為第一款規定。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五項規定，係指可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，但不包含僅可於預設封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換之航空哩程點數或信用卡點數。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用作紀錄或表彰其他資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額之數位形式銀行紀錄，即非屬有投資目的。\n四、參考FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Assets Regulation，下稱「MiCA規則」）第二條第四項規定，將依其他法令發行具有金融資產性質之虛擬資產排除於虛擬資產之定義外，以其他金融法規規範之，爰於第一款但書第一目定明數位型式之新臺幣、外國、大陸地區、香港或澳門發行之數位貨幣、數位型式之有價證券或依其他法令發行之金融資產，例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，非屬本法所定虛擬資產。又依本法發行之穩定幣並非依其他法令發行之金融資產，故仍屬本法所稱虛擬資產，併予敘明。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無保護不特定交易人處於資訊不對稱地位之需要，爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與第十一點之說明，於第一款但書第二目定明本法之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考前揭歐盟MiCA規則與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性為斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰價值具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，並以約定有對價者為限，爰為第二款規定。\n七、本法所稱交易人，係指從事本法所規範虛擬資產交易類型之人，不以虛擬資產服務商之客戶為限，爰為第三款規定。\n八、參考歐盟MiCA規則第三條第一項第三十九款及韓國虛擬資產使用者保護法第二條第三款規定，於第四款定明本法所稱客戶，係指虛擬資產服務商提供服務之對象。\n九、境外設立之虛擬資產服務商如在境內經營虛擬資產業務，亦應受本法管理，爰參考證券交易法第四條第二項規定，於第五款定明境外虛擬資產服務商之定義。\n十、按美國、歐盟、日本、香港、英國及新加坡係將價值一比一錨定法定貨幣之虛擬資產視為穩定幣納管，我國對此類虛擬資產亦有納管之必要，爰參考美國引導與建立美國穩定幣之國家創新法（Guiding and Establishing National Innovation for U.S.Stablecoins Act，下稱「GENIUS法」）Section2(22)、歐盟MiCA規則第三條第一項第七款規定、香港穩定幣條例第四條及新加坡穩定幣監理框架規定，於第六款定明穩定幣之定義，又所謂價值連結係指與法定貨幣有一比一之固定交換比率者。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第七款定明錢包之定義。"},{"bill":"202110213930000","text":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、虛擬資產衍生性金融商品：指其價值由虛擬資產價格、指數、商品、信用事件或其他利益及其組合等所衍生之交易契約及其他經主管機關公告之商品。\n七、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n八、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","note":"一、參考防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議，將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰為第一款規定。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五項規定，係指可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，但不包含僅可於預設封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換之航空哩程點數或信用卡點數。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用作紀錄或表彰其他資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額之數位形式銀行紀錄，即非屬有投資目的。\n四、參考FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Assets Regulation，下稱「MiCA規則」）第二條第四項規定，將依其他法令發行具有金融資產性質之虛擬資產排除於虛擬資產之定義外，以其他金融法規規範之，爰於第一款但書第一目定明數位型式之新臺幣、外國、大陸地區、香港或澳門發行之數位貨幣、數位型式之有價證券或依其他法令發行之金融資產，例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，非屬本法所定虛擬資產。又依本法發行之穩定幣並非依其他法令發行之金融資產，故仍屬本法所稱虛擬資產，併予敘明。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無保護不特定交易人處於資訊不對稱地位之需要，爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與第十一點之說明，於第一款但書第二目定明本法之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考前揭歐盟MiCA規則與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性為斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰價值具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，並以約定有對價者為限，爰為第二款規定。\n七、本法所稱交易人，係指從事本法所規範虛擬資產交易類型之人，不以虛擬資產服務商之客戶為限，爰為第三款規定。\n八、參考歐盟MiCA規則第三條第一項第三十九款及韓國虛擬資產使用者保護法第二條第三款規定，於第四款定明本法所稱客戶，係指虛擬資產服務商提供服務之對象。\n九、境外設立之虛擬資產服務商如在境內經營虛擬資產業務，亦應受本法管理，爰參考證券交易法第四條第二項規定，於第五款定明境外虛擬資產服務商之定義。\n十、參考證券商營業處所經營衍生性金融商品交易業務規則第五條規定，考量虛擬資產市場創新快速，採「包括但不限於」之開放列舉方式，並授權主管機公告補充。\n十一、按美國、歐盟、日本、香港、英國及新加坡係將價值一比一錨定法定貨幣之虛擬資產視為穩定幣納管，我國對此類虛擬資產亦有納管之必要，爰參考美國引導與建立美國穩定幣之國家創新法（Guiding and Establishing National Innovation for U.S.Stablecoins Act，下稱「GENIUS法」）Section2(22)、歐盟MiCA規則第三條第一項第七款規定、香港穩定幣條例第四條及新加坡穩定幣監理框架規定，於第七款定明穩定幣之定義，又所謂價值連結係指與法定貨幣有一比一之固定交換比率者。\n十二、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第八款定明錢包之定義。"},{"bill":"202110217080000","text":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型 lecoins Act，下稱「GENIUS法」）Section2(22)、歐盟MiCA規則第三條第一項第七款規定、香港穩定幣條例第四條及新加坡穩定幣監理框架規定，於第六款定明穩定幣之定義，又所謂價值連結係指與法定貨幣有一比一之固定交換比率者。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第七款定明錢包之定義。"}],"changed":true,"final":"本法用詞，定義如下：\n一、虛擬資產：指運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且用於支付或投資目的者。但不包括以下資產：\n(一)數位型式之新臺幣、外國貨幣及大陸地區、香港或澳門發行之貨幣、有價證券及依其他法令發行之金融資產。\n(二)表彰之價值具不可代替性之非同質化代幣。\n二、發行：指於我國境內對不特定人或特定多數人，創設並招募虛擬資產之有償行為。\n三、交易人：指從事虛擬資產之交換、移轉、託管、認購、借貸或其他主管機關核定之交易類型者。\n四、客戶：指接受虛擬資產服務商提供第六條第一項各款之服務者。\n五、境外虛擬資產服務商：指以營利為目的，依照境外法律組織登記之虛擬資產服務商。\n六、穩定幣：指表彰與單一或多個法定貨幣之價值連結，以維持其價值穩定之虛擬資產。\n七、錢包：指用以儲存使用虛擬資產所需之密碼金鑰之應用程式或設備。","finalWhy":"一、參考防制洗錢金融行動工作組織（Financial Action Task Force，下稱「FATF」）四十項建議，將虛擬資產定義為運用密碼學及分散式帳本技術或其他類似技術，表彰得以數位方式儲存、交換或移轉之價值，且限於具有支付或投資目的者，爰為第一款規定。\n二、第一款所稱「支付目的」，參考FATF於一百十年提出之虛擬資產與虛擬資產服務商風險基礎方法更新指引（下稱「FATF更新指引」）第五十段及第八十四段之說明，及日本支付服務法第二條第五項規定，係指可用於支付不特定人所提供之商品或服務對價或與不特定人交換法定貨幣或其他資產者，例如透過比特幣和穩定幣進行支付者，但不包含僅可於預設封閉系統內使用且不可轉讓或交換者，例如不可於預設使用系統外轉讓或交換之航空哩程點數或信用卡點數。\n三、第一款所稱「投資目的」，參考FATF更新指引第五十段之說明，係指具有可供移轉或交換之內在價值者。由於此類虛擬資產之市場交換價值與其所表彰資產之價值有別，已成為市場上有其獨立價值之資產，故已具備投資用途而可供交易人投資之用；相對而言，單純用作紀錄或表彰其他資產之所有權或其他權益之方法者，例如單純用以表彰消費者存款數額之數位形式銀行紀錄，即非屬有投資目的。\n四、參考FATF四十項建議及歐盟加密資產市場規則（Markets in Crypto-Assets Regulation，下稱「MiCA規則」）第二條第四項規定，將依其他法令發行具有金融資產性質之虛擬資產排除於虛擬資產之定義外，以其他金融法規規範之，爰於第一款但書第一目定明數位型式之新臺幣、外國、大陸地區、香港或澳門發行之數位貨幣、數位型式之有價證券或依其他法令發行之金融資產，例如期貨、存款、保險單等，縱運用密碼學及分散式帳本技術或其他類似技術表彰之，非屬本法所定虛擬資產。又依本法發行之穩定幣並非依其他法令發行之金融資產，故仍屬本法所稱虛擬資產，併予敘明。\n五、虛擬資產市場上所稱之非同質化代幣（Non-Fungible Token），如其表彰之價值具有特定性及不可代替性者，例如表彰特定藝術品或收藏品或不動產者，其交易本質上係對特定財產之交易，屬於立基於當事人間信賴關係之特定人間交易，較不具有大宗交易性質，故縱使此類非同質化代幣可能因有其獨立之內在價值而具有投資目的，但較無保護不特定交易人處於資訊不對稱地位之需要，爰參考歐盟MiCA規則第二條第三項規定及其序言第十點與第十一點之說明，於第一款但書第二目定明本法之虛擬資產不包含所表彰之價值具不可代替性之非同質化代幣。至於個案非同質化代幣是否適用此例外規定，參考前揭歐盟MiCA規則與說明，應依該非同質化代幣表彰權利之內容是否具有不可代替性為斷，而非以該非同質化代幣應用之技術規格為準，例如個案非同質化代幣如係表彰對指定商品或服務之兌換權，但具有獨立於該商品或服務之價值且有一定發行數量者，縱使個別非同質化代幣彼此間具有技術規格之非同質性，但因其表彰之兌換權具有共通性，故仍非屬本目所稱之表彰價值具不可代替性，併予敘明。\n六、本法所稱發行，係指於我國境內創設虛擬資產並對他人招募之行為，包括對不特定人或特定多數人之招募，並以約定有對價者為限，爰為第二款規定。\n七、本法所稱交易人，係指從事本法所規範虛擬資產交易類型之人，不以虛擬資產服務商之客戶為限，爰為第三款規定。\n八、參考歐盟MiCA規則第三條第一項第三十九款及韓國虛擬資產使用者保護法第二條第三款規定，於第四款定明本法所稱客戶，係指虛擬資產服務商提供服務之對象。\n九、境外設立之虛擬資產服務商如在境內經營虛擬資產業務，亦應受本法管理，爰參考證券交易法第四條第二項規定，於第五款定明境外虛擬資產服務商之定義。\n十、按美國、歐盟、日本、香港、英國及新加坡係將價值一比一錨定法定貨幣之虛擬資產視為穩定幣納管，我國對此類虛擬資產亦有納管之必要，爰參考美國引導與建立美國穩定幣之國家創新法（Guiding and Establishing National Innovation for U.S.Stablecoins Act，下稱「GENIUS法」）Section2(22)、歐盟MiCA規則第三條第一項第七款規定、香港穩定幣條例第四條及新加坡穩定幣監理框架規定，於第六款定明穩定幣之定義，又所謂價值連結係指與法定貨幣有一比一之固定交換比率者。\n十一、虛擬資產係透過錢包（wallet）儲存其密碼金鑰而得以持有與處分，爰參考國際證券管理機構組織於一百十二年提出之虛擬與數位資產市場政策建議最終報告（下稱「IOSCO最終報告」）之定義，於第七款定明錢包之定義。","review":null},{"no":"第四條","current":null,"versions":[{"bill":"202110137730000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務、交易或發行之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n業者參與第一項之創新實驗並通過者得逕行營業，並應於六個月內向主管機關申請許可，於十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證，主管機關應勒令其停業，其相關規範，準用本法第四十二條規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性，每年應於年度終了後三個月內，向立法院提出檢討報告，並將內容揭露於主管機關網站。","note":"一、虛擬資產具有金融科技創新性，其未來業務、交易或發行面向之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項明定得申請創新實驗者不限於依本法取得許可之虛擬資產服務商，並於第二項明定創新實驗過程得不適用本法規定。\n二、有鑑於現行創新實驗條例規範尚有缺漏，依該條例完成沙盒實驗之業者雖已獲得主管機關同意，卻無法逕行營業，似有違沙盒之本意。爰於第三項增訂完成沙盒實驗之業者應有之逕行營業規範。為本法將虛擬資產服務商視為特許機構，縱完成沙盒仍應取得主管機關之許可，宜有完成沙盒之過渡規定，故明定之。複考量本法將虛擬資產服務商視為特許，未於時限內取得許可者，應視為不許可並勒令其退場；退場相關規範，準用本法第四十二條規定。\n三、以及於第四項明定主管機關應參酌創新實驗檢討相關法規；並為強化相關法規檢討及修訂作業，明定主管機關應每年於年度終了後三個月內向立法院提交檢討報告。"},{"bill":"202110171550000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務、交易或發行之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性，每年應於年度終了後三個月內，向立法院提出檢討報告，並將內容揭露於主管機關網站。","note":"虛擬資產具有金融科技創新性，其未來業務、交易或發行面向之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項明定得申請創新實驗者不限於依本法取得許可之虛擬資產服務商，並於第二項明定創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。"},{"bill":"202110199580000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"虛擬資產具有金融科技創新性，其未來業務、交易或發行面向之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項明定得申請創新實驗者不限於依本法取得許可之虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。"},{"bill":"202110203280000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性，並每年提出報告。","note":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定。第三項定明主管機關應參酌創新實驗檢討相關法規，並負有每年提出檢討報告之義務，以強化監理效能並掌握法規動態調整進程。"},{"bill":"202110207150000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以刺激金融科技發展，進而促進普惠金融，並逐步與本法規範進行法規接軌調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗辦理情形即時檢討相關法規。"},{"bill":"202110206090000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於依本法取得許可之虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。"},{"bill":"201110205640000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。"},{"bill":"202110209160000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。但涉及客戶資產保管、洗錢防制及反資恐相關規定者，不在此限。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"一、虛擬資產具有金融科技創新性，其業務發展可能有辦理創新實驗之需要，以與本法規範進行法規調適，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。\n二、第二項增訂客戶資產保管、洗錢防制及反資恐相關規定之底線要求，即便於創新實驗期間，前揭規定仍應遵循，以確保基本保護義務不因創新實驗而遭規避，爰參考歐盟MiCA規則第一百四十三條沙盒機制規定。"},{"bill":"202110209890000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。"},{"bill":"202110214790000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。"},{"bill":"202110213930000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。"},{"bill":"202110217080000","text":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","note":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。"}],"changed":true,"final":"為促進普惠金融及金融科技發展，不限於虛擬資產服務商，得依金融科技發展與創新實驗條例申請辦理虛擬資產業務之創新實驗。\n前項之創新實驗，於主管機關核准辦理之期間及範圍內，得不適用本法之規定。\n主管機關應參酌第一項創新實驗之辦理情形，檢討本法及相關金融法規之妥適性。","finalWhy":"虛擬資產具有金融科技創新性，其未來業務之發展可能有辦理創新實驗之需要，以與本法規範進行法規調適。為使未來虛擬資產相關事項得適用金融科技發展與創新實驗條例申請辦理創新實驗，爰參考證券交易法第四十四條之一及期貨交易法第五條之一規定，於第一項定明得申請創新實驗者不限於虛擬資產服務商，並於第二項定明創新實驗過程得不適用本法規定，以及於第三項定明主管機關應參酌創新實驗檢討相關法規。","review":null},{"no":"第五條","current":null,"versions":[{"bill":"202110137730000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。","note":"虛擬資產具有跨境性，其監理有與其他國家主管機關辦理國際合作以及資訊交換之必要。爰參考證券交易法第二十一條之一第一項至第二項、期貨交易法第六條及銀行法第五十一條之二規定，於第一項授權主管機關辦理國際合作，並於第二項明定主管機關取得必要資訊與提供資訊與其他國家主管機關之權限。"},{"bill":"202110171550000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。","note":"虛擬資產具有跨境性，其監理有與其他國家主管機關辦理國際合作以及資訊交換之必要。爰參考證券交易法第二十一條之一第一項至第二項、期貨交易法第六條及銀行法第五十一條之二規定，於第一項授權主管機關辦理國際合作，並於第二項明定主管機關取得必要資訊與提供資訊與其他國家主管機關之權限。"},{"bill":"202110199580000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。","note":"虛擬資產具有跨境性，其監理有與其他國家主管機關辦理國際合作以及資訊交換之必要。爰參考證券交易法第二十一條之一第一項至第二項、期貨交易法第六條及銀行法第五十一條之二規定，於第一項授權主管機關辦理國際合作，並於第二項明定主管機關取得必要資訊與提供資訊與其他國家主管機關之權限。"},{"bill":"202110203280000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。","note":"虛擬資產具有跨境性，其監理有與其他國家主管機關辦理國際合作以及資訊交換之必要。爰參考證券交易法第二十一條之一第一項及第二項、期貨交易法第六條及銀行法第五十一條之二規定，於第一項規定主管機關或其授權者得與外國政府、機構或國際組織簽訂合作條約、協定或協議，並於第二項定明主管機關得要求相關機關（構）、法人、團體或自然人提供與虛擬資產業務相關之必要資訊並提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。"},{"bill":"202110207150000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。","note":"虛擬資產具有跨境性，其監理有與其他國家主管機關辦理國際合作以及資訊交換之必要。爰參考證券交易法第二十一條之一第一項及第二項、期貨交易法第六條及銀行法第五十一條之二規定，於第一項規定主管機關或其授權者得與外國政府、機構或國際組織簽訂合作條約、協定或協議，並於第二項明定，除有妨害國家利益或交易大眾權益，主管機關得依該合作條約、協定或協議，要求有關之機構、法人、團體及自然人提供必要資訊予外國政府、機構或國際組織。"},{"bill":"202110206090000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。","note":"虛擬資產具有跨境性，其監理有與其他國家主管機關辦理國際合作以及資訊交換之必要。爰參考證券交易法第二十一條之一第一項至第二項、期貨交易法第六條及銀行法第五十一條之二規定，於第一項授權主管機關辦理國際合作，並於第二項定明主管機關取得必要資訊與提供資訊與其他國家主管機關之權限。"},{"bill":"201110205640000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。","note":"虛擬資產具有跨境性，其監理有與其他國家主管機關辦理國際合作以及資訊交換之必要。爰參考證券交易法第二十一條之一第一項及第二項、期貨交易法第六條及銀行法第五十一條之二規定，於第一項規定主管機關或其授權者得與外國政府、機構或國際組織簽訂合作條約、協定或協議，並於第二項定明主管機關得要求相關機關（構）、法人、團體或自然人提供與虛擬資產業務相關之必要資訊並提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。"},{"bill":"202110209160000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。\n主管機關應積極參與FATF全體會議及國際虛擬資產監理論壇，推動我國納入等效認定或白名單機制；並就外國政府對虛擬資產服務商之監理制度進行等效評估，認定為等效者，公告之（以下簡稱等效國家）。","note":"一、第一項、第二項定明主管機關得與外國政府、機構或國際組織簽訂合作條約、協定或協議，並得要求相關機關提供必要資訊，爰參考證券交易法第二十一條之一第一項及第二項、期貨交易法第六條及銀行法第五十一條之二規定。\n二、第三項增訂主管機關應積極參與國際監理論壇並推動等效認定之積極義務，並就外國政府之監理制度進行等效評估，認定為等效者予以公告（以下簡稱等效國家），作為第七條第三項境外服務商簡化登記及第三十五條境外穩定幣認可名單制之授權基礎。"},{"bill":"202110209890000","text":"為促進我國與其他國家虛擬資產主管機關之國際合作，主管機關或其授權之機關、機構或團體依互惠原則，得與外國政府、機構或國際組織，就資訊交換、技術合作、協助調查等事項，簽訂合作條約、協定或協議。\n除有妨害國家利益或交易大眾權益者外，主管機關依前項簽訂之條約、協定或協議，得洽請相關機關或要求有關之機構、法人、團體或自然人依該條約、協定或協議提供必要資訊，並基於互惠及保密原則，提供予與我國簽訂條約、協定或協議之外國政府、機構或國際組織。","note":"虛擬資產具有跨境性，其監理有與其他國家主管機關辦理國際合作以及資訊交換之必要。爰參考證券交易法第二十
