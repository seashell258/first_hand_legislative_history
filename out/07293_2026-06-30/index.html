商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。"},{"bill":"202110217080000","text":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。"}],"changed":true,"final":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","finalWhy":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。","review":null},{"no":"第四十九條","current":null,"versions":[{"bill":"202110137730000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"未經營虛擬資產業務者如使用虛擬資產服務商之名稱或易使人誤認其為虛擬資產服務商之名稱者，可能造成虛擬資產交易人之混淆誤認，並且不利主管機關管理虛擬資產服務商與檢調單位取締未經許可之虛擬資產服務商，故有施以刑事責任以嚇阻此行為之必要。爰參考證券交易法第一百七十七條第一項規定，於本條明定非虛擬資產服務商使用虛擬資產服務商或易使人誤認其為虛擬資產服務商名稱之刑事責任。"},{"bill":"202110171550000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，為明定法人之故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條明定以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110199580000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得命其限期改善；屆期未改善者，得按次處罰：\n一、違反第七條第二項、第八條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第一項、第二十條第三項準用第二十七條第三項及第四項、第二十一條第一項、第二十三條第一項、第二十四條第二項、第二十五條、第二十六條、第二十七條、第二十八條、第二十九條、第三十一條第一項、第二項、第三十六條第三項規定、第三十七條第一項、第三項規定。\n二、未依第十四條及第十五條建立內部控制及稽核制度、政策、程序或措施或未確實執行。\n三、虛擬資產服務商違反第七條第四項所定規則有關財務、業務、開業、停業及復業、終止業務或其他應遵行事項之規定。\n四、同業公會違反第三十二條第一項所定規則之規定。\n五、對於主管機關命令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n六、於依本法或主管機關基於本法所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務之文件，不依規定製作、申報、公告、備置或保存。\n違反本法或本法授權所定命令中有關強制或禁止規定或應為一定行為而不為者，除本法另有處罰規定而應從其規定外，處新臺幣三十萬元以上六百萬元以下罰鍰，並得命其限期改善；屆期未改善者，得按次處罰。\n依前二項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十七條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保本法及主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理，對於違反本法或本法授權所定命令之規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關之文書提出命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實辦理法令遵循。爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條及銀行法第一百三十二條規定，於第一項及第二項明定違反本法相關規定之行政責任。\n二、對於情節輕微或已於限期內改善完成之違反本法或本法授權所定命令之行為者，主管機關得免予處罰，以符比例原則並鼓勵行為人盡速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第三項定明免罰之規定。\n三、對穩定幣發行人未繳存足額準備金者，參考電子支付機構管理條例第五十四條規定，於第四項定明加收利息之規定及情節重大者之罰則。"},{"bill":"202110203280000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。"},{"bill":"202110207150000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。"},{"bill":"202110206090000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。"},{"bill":"201110205640000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。"},{"bill":"202110209160000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任嚇阻之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、第二項定明法人雙罰規定，以督促相關機構完善內部管理制度，俾維護整體虛擬資產服務市場公信力，爰參考電子支付機構管理條例第四十七條第二項規定。"},{"bill":"202110209890000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。"},{"bill":"202110214790000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。"},{"bill":"202110213930000","text":"違反第四十四條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。"},{"bill":"202110217080000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。"}],"changed":true,"final":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定，或穩定幣發行人違反第三十六條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","finalWhy":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。","review":null},{"no":"第五十條","current":null,"versions":[{"bill":"202110137730000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得命其限期改善；屆期未改善者，得按次處罰：\n一、違反第七條第二項、第八條第二項、第十一條第四項、第十二條第三項、第十三條第一項、第十七條第五項、第十八條第一項、第四項、第十九條第一項、第二十條第一項、第二十一條第三項準用第二十八條第三項及第四項、第二十二條第一項、第二十四條第一項、第二十五條第二項、第二十六條至第三十一條、第三十二條第一項、第二項、第三十七條第三項規定。\n二、未依第十四條至第十六條建立內部控制及稽核、資通訊安全制度、政策、程序或措施或未確實執行。\n三、虛擬資產服務商違反第七條第四項所定規則有關財務、業務、開業、停業及復業、終止業務或其他應遵行事項之規定。\n四、同業公會違反第三十三條第一項所定規則之規定。\n五、對於主管機關命令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n六、於依本法或主管機關基於本法所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務之文件，不依規定製作、申報、公告、備置或保存。\n違反本法或本法授權所定命令中有關強制或禁止規定或應為一定行為而不為者，除本法另有處罰規定而應從其規定外，處新臺幣三十萬元以上六百萬元以下罰鍰，並得命其限期改善；屆期未改善者，得按次處罰。\n依前二項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。","note":"一、為確保本法及主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理，對於違反本法或本法授權所定命令之規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關之文書提出命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實辦理法令遵循。爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條及銀行法第一百三十二條規定，於第一項及第二項明定違反本法相關規定之行政責任。\n二、對於情節輕微或已於限期內改善完成之違反本法或本法授權所定命令之行為者，主管機關得免予處罰，以符比例原則並鼓勵行為人盡速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第三項明定免罰之規定。"},{"bill":"202110171550000","text":"犯本法之罪，所科罰金達新臺幣五千萬元以上而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元以上而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定，併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110199580000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，為明定法人之故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條明定以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110203280000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十三條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110207150000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十三條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要。爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110206090000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十三條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"201110205640000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十三條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110209160000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。\n有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策，或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人違反第三十六條、第三十七條、第三十九條、第四十條或第四十一條規定，或未依規定建立各項控制制度，或未確實執行。\n十三、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、第一項定明誤用名稱之刑事責任，以避免非虛擬資產服務商使用虛擬資產服務商名稱或使人誤認之名稱，造成交易人混淆，爰參考證券交易法第一百七十七條第一項規定。\n二、本條整合行政罰款規定，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避或拒絕主管機關提出文書之命令或檢查，或未依規定製作、申報、公告、備置或保存法定文書者，課以行政罰鍰，以敦促確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條及證券投資信託及顧問法第一百十一條規定。\n三、第二項定明情節輕微者之免罰或限期改善規定，爰參考證券交易法第一百七十八條之一第二項規定，以符比例原則並鼓勵行為人儘速改善。\n四、第三項定明中央銀行對穩定幣準備金缺口加收利息及罰鍰之規定，爰參考電子支付機構管理條例第五十四條規定。"},{"bill":"202110209890000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十三條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110214790000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十三條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110213930000","text":"違反第七條第一項、第三項或第三十六條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。"},{"bill":"202110217080000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十三條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。"}],"changed":true,"final":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十三條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","finalWhy":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。","review":null},{"no":"第五十一條","current":null,"versions":[{"bill":"202110137730000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，為明定法人之故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條明定以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110171550000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十五個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"本法施行後對虛擬資產服務商之管理將由洗錢防制登記制度轉換為許可制度，應提供虛擬資產服務商過渡期間以供其辦理轉換，爰明定本法之許可制度與洗錢防制登記制度之過渡期間規定。"},{"bill":"202110199580000","text":"犯本法之罪，所科罰金達新臺幣五千萬元以上而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元以上而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定，併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110203280000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。"},{"bill":"202110207150000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。"},{"bill":"202110206090000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。"},{"bill":"201110205640000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。"},{"bill":"202110209160000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。\n犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"一、第一項定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失，爰參考證券投資信託及顧問法第一百十七條規定。\n二、第二項定明高額罰金之易服勞役特別規定。依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條規定，將易服勞役期間依罰金總額提高為二年或三年以下，並依罰金總額與勞役期間折算其比例。"},{"bill":"202110209890000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。"},{"bill":"202110214790000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。"},{"bill":"202110213930000","text":"虛擬資產服務商違反第十九條第四項或第二十條第二項規定，或穩定幣發行人違反第三十八條第三項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商或穩定幣發行人亦科以前項所定罰金。","note":"一、虛擬資產服務商違法動用客戶資產、未將客戶留存之法定貨幣交付信託或取得十足履約保證，以及穩定幣發行人違法動用準備資產者，影響客戶權益及市場信任甚鉅，有對行為負責人課予刑事責任以嚇阻此不法行為之必要，爰參考電子支付機構管理條例第四十七條第一項、信託業法第五十一條第一項及第二項規定，為第一項規定。\n二、參考電子支付機構管理條例第四十七條第二項規定，於第二項定明處罰行為負責人外，併罰虛擬資產服務商或穩定幣發行人，以督促渠等完善內部管理制度，俾維護整體虛擬資產服務市場公信力。"},{"bill":"202110217080000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。"}],"changed":true,"final":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","finalWhy":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。","review":null},{"no":"第五十二條","current":null,"versions":[{"bill":"202110137730000","text":"犯本法之罪，所科罰金達新臺幣五千萬元以上而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元以上而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定，併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110171550000","text":"本法授權主管機關訂定辦法者，主管機關應定期邀集同業公會及學者專家檢討各項辦法。\n前項辦法檢討會議每六個月至少開會一次，並做成會議記錄於會議結束後三十日內公告。\n第一項檢討會議就各辦法內容是否修訂，均應敘明理由，載於前項會議紀錄中。\n同業公會於必要時，得擬具辦法修正建議書送交主管機關。主管機關於收受該建議書之日起十日內，應邀集同業公會及相關機關，並遴聘（選）學者專家就該建議書之內容召開辦法修正會議。\n前項會議應做成會議記錄，並於會議結束後十五日內公告。\n主管機關於第四項所定會議結束後四十五日內，應就建議書所建議事項敘明理由，以書面回覆同業公會。\n第一項所定辦法修訂檢討會議、第四項所定辦法修正建議書、專家學者遴聘（選）規定及辦法修正建議書之範本、遞件流程及其他應遵循事項之辦法，由主管機關定之。主管機關訂定前，應徵詢同業公會之意見。","note":"一、鑒於虛擬資產業變化幅度大、速度快，本條例雖授權主管機關進行各項辦法之修正，惟主管機關仍應掌握虛擬資產業界之國際發展趨勢及各虛擬資產商品、服務之變遷，並適時修正各相關辦法。爰於第一項明定主管機關就本法授權訂定之辦法，應定期邀及同業公會及學者專家就各項辦法之內容，召開檢討會議。\n二、為避免主管機關怠惰拖沓，以致延宕辦法檢討會議召開期程，爰於第二項定明至少每六個月應召開一次會議，並做成會議記錄，於會議結束後三十日內公告。\n三、針對該檢討會議所討論之事項、與會者所提意見，均應製成會議紀錄並於會議結束後三十日內公告。其形式，可參考中央銀行理監事會議紀錄。\n四、為就各該辦法內容是否修訂以及主管機關為裁量時所據之理由，均應以書面清楚載明於會議記錄中，以資明確，俾利社會大眾、學者專家及業者清楚了解主管機關之意見及態度。爰於第三項定明。\n五、考量虛擬資產業變動快速，爰於第四項定明，倘遇有虛擬資產業重大變動而主管機關未能立即修訂辦法者，同業公會得於必要時，擬具辦法修正建議書送交主管機關。主管機關於收受該建議書後十日內必須召開辦法修正會議。\n六、就第四項所定會議，於第五項明定該會議之會議記錄應於會議結束後十五日內公告。\n七、為避免主管機關認召開會議後其相關修正辦法工作便已結束，爰於第五項定明主管機關應於會議結束後四十五日內，就建議書所建議之辦法修正建議事項，就各建議事項是否採納、修正辦法，敘明理由並以書面回覆，俾利社會大眾、學者專家及業者清楚了解主管機關之意見與態度，並加強主管機關就其監理政策與外界溝通。"},{"bill":"202110199580000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商，應於本法施行後十二個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照，主管機關應於收到申請文件次日起三個月內完成審查，經審查應補正者，應通知申請人限期補正；逾期未補正、補正不完全或無法補正者，駁回其申請。\n屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"本法施行後對虛擬資產服務商之管理將由洗錢防制登記制度轉換為許可制度，應提供虛擬資產服務商過渡期間以供其辦理轉換，爰明定本法之許可制度與洗錢防制登記制度之過渡期間規定，惟為避免行政怠惰導致業者喪失經營之權利，明定主管機關之審查期限，以兼顧實體審查與程序保障。"},{"bill":"202110203280000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十六條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十七條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第三十九條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十條規定。\n(五)違反第四十一條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十三條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n三、參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。"},{"bill":"202110207150000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十六條第二項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十五條第三項、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十六條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十七條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第三十九條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十條規定。\n(五)違反第四十一條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十三條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n三、參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。"},{"bill":"202110206090000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十六條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十七條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第三十九條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十條規定。\n(五)違反第四十一條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十三條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n三、參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。"},{"bill":"201110205640000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十六條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十七條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第三十九條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十條規定。\n(五)違反第四十一條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十三條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n三、參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。"},{"bill":"202110209160000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。\n本法施行後一年內，主管機關應完成虛擬資產管理局之設立，並就第四十二條所定穩定幣法律性質定性，完成與金融監督管理委員會所轄各局之法規協調作業。\n主管機關應於本法施行後一年內，依第四十三條第二項授權，完成虛擬資產衍生性商品業務管理辦法之草案研擬並公開徵詢意見。","note":"一、第一項定明本法施行前已完成洗錢防制登記之服務商之過渡期間規定。現行依洗錢防制法對虛擬資產服務商之管理係採登記制，於本法施行後將改為許可制，應提供業者辦理申請許可之充足時間，爰應於施行後九個月內申請、十八個月內取得許可。\n二、第二項增訂主管機關應於一年內完成虛擬資產管理局之設立，以及就第四十二條所定穩定幣法律性質定性完成與金管會所轄各局之法規協調作業，確保本法核心政策措施儘早落地。\n三、第三項增訂主管機關應於一年內完成衍生性商品業務管理辦法草案研擬並公開徵詢意見，確保第四十三條授權條款儘早產生實效，並使市場有充分參與子法制定之機會。"},{"bill":"202110209890000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十六條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十七條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第三十九條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十條規定。\n(五)違反第四十一條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十三條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。"},{"bill":"202110214790000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十六條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十七條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第三十九條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十條規定。\n(五)違反第四十一條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十三條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n三、參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。"},{"bill":"202110213930000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十六條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十五條第一項令虛擬資產服務商、穩定幣發行人或與其有財務或業務往來之關係人提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關有仰賴確實記載之紀錄對虛擬資產服務商及穩定幣發行人進行管理，以嚇阻有心人士利用虛擬資產服務市場遂行相關犯罪行為之必要。相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之監管與市場秩序之維持，亦可能妨礙執法機關偵查，不利整體社會秩序維護，故有課予刑事責任以嚇阻相關犯罪行為之必要，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款、期貨交易法第一百十五條第一款、第四款、第五款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條定明相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110217080000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十六條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十七條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第三十九條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十條規定。\n(五)違反第四十一條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十三條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n三、參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。"}],"changed":true,"final":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項、第二十條第一項、第二十一條、第二十四條、第二十七條、第二十九條第一項、第二項、第三十五條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十七條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十二條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十三條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十五條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十六條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十八條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十六條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十七條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第三十九條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十條規定。\n(五)違反第四十一條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十三條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十六條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","finalWhy":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n三、參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。","review":null},{"no":"第五十三條","current":null,"versions":[{"bill":"202110137730000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十五個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"本法施行後對虛擬資產服務商之管理將由洗錢防制登記制度轉換為許可制度，應提供虛擬資產服務商過渡期間以供其辦理轉換，爰明定本法之許可制度與洗錢防制登記制度之過渡期間規定。"},{"bill":"202110171550000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110199580000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110203280000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110207150000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110206090000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"201110205640000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110209160000","text":"本法施行日期，由行政院定之。","note":"考量本法規範之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。"},{"bill":"202110209890000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110214790000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110213930000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"為避免非虛擬資產服務商使用虛擬資產服務商名稱或容易使人誤信為虛擬資產服務商之名稱，造成虛擬資產交易人混淆誤認，影響其權益，有課予刑事責任以嚇阻此行為之必要，爰參考證券交易法第一百七十七條第一項規定，為本條規定。"},{"bill":"202110217080000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"}],"changed":true,"final":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","finalWhy":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。","review":null},{"no":"第五十四條","current":null,"versions":[{"bill":"202110137730000","text":"本法授權主管機關訂定辦法者，主管機關應定期邀集同業公會及學者專家檢討各項辦法。\n前項辦法檢討會議每六個月至少開會一次，並做成會議記錄於會議結束後三十日內公告。\n第一項檢討會議就各辦法內容是否修訂，均應敘明理由，載於前項會議紀錄中。\n同業公會於必要時，得擬具辦法修正建議書送交主管機關。主管機關於收受該建議書之日起十日內，應邀集同業公會及相關機關，並遴聘（選）學者專家就該建議書之內容召開辦法修正會議。\n前項會議應做成會議記錄，並於會議結束後十五日內公告。\n主管機關於第四項所定會議結束後四十五日內，應就建議書所建議事項敘明理由，以書面回覆同業公會。\n第一項所定辦法修訂檢討會議、第四項所定辦法修正建議書、專家學者遴聘（選）規定及辦法修正建議書之範本、遞件流程及其他應遵循事項之辦法，由主管機關定之。主管機關訂定前，應徵詢同業公會之意見。","note":"一、鑒於虛擬資產業變化幅度大、速度快，本條例雖授權主管機關進行各項辦法之修正，惟主管機關仍應掌握虛擬資產業界之國際發展趨勢及各虛擬資產商品、服務之變遷，並適時修正各相關辦法。爰於第一項明定主管機關就本法授權訂定之辦法，應定期邀及同業公會及學者專家就各項辦法之內容，召開檢討會議。\n二、為避免主管機關怠惰拖沓，以致延宕辦法檢討會議召開期程，爰於第二項定明至少每六個月應召開一次會議，並做成會議記錄，於會議結束後三十日內公告。\n三、針對該檢討會議所討論之事項、與會者所提意見，均應製成會議紀錄並於會議結束後三十日內公告。其形式，可參考中央銀行理監事會議紀錄。\n四、為就各該辦法內容是否修訂以及主管機關為裁量時所據之理由，均應以書面清楚載明於會議記錄中，以資明確，俾利社會大眾、學者專家及業者清楚了解主管機關之意見及態度。爰於第三項定明。\n五、考量虛擬資產業變動快速，爰於第四項定明，倘遇有虛擬資產業重大變動而主管機關未能立即修訂辦法者，同業公會得於必要時，擬具辦法修正建議書送交主管機關。主管機關於收受該建議書後十日內必須召開辦法修正會議。\n六、就第四項所定會議，於第五項明定該會議之會議記錄應於會議結束後十五日內公告。\n七、為避免主管機關認召開會議後其相關修正辦法工作便已結束，爰於第五項定明主管機關應於會議結束後四十五日內，就建議書所建議之辦法修正建議事項，就各建議事項是否採納、修正辦法，敘明理由並以書面回覆，俾利社會大眾、學者專家及業者清楚了解主管機關之意見與態度，並加強主管機關就其監理政策與外界溝通。"},{"bill":"202110203280000","text":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110207150000","text":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110206090000","text":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"201110205640000","text":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110209890000","text":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110214790000","text":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110213930000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得令其限期改善；屆期未完成改善者，得按次處罰：\n一、違反第七條第二項、第十一條第四項、第十三條第一項、第十九條第一項、第二十條第三項準用第二十七條第三項、第二十一條第一項、第二十二條、第二十五條、第二十八條、第三十一條第一項、第二項、第三十七條規定。\n二、違反第八條第一項、第二項或第三項所定辦法中有關財務、業務管理之規定。\n三、未依第十四條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度、營運資訊之管理及保密政策或營運持續性政策、或採取適當程序或措施，或未確實執行。\n四、未依第十五條規定訂定內部作業制度、程序，或未確實執行。\n五、違反第十八條第一項規定，或未依主管機關依同條第二項所為命令訂定書面保密措施或未依規定方式揭露保密措施之重要事項。\n六、違反第二十三條第一項或第二項所定辦法中有關財務報告編製、申報、公告、備置或保存之規定。\n七、違反第二十四條第一項前段、第二項、第三項或第一項後段所定辦法中有關資訊揭露及通報方式、項目、範圍、時點之規定。\n八、未依第二十六條第一項規定訂定審查基準、審查程序，或違反同條第二項規定。\n九、違反第二十七條第一項至第三項或第四項所定辦法中有關報告之種類、申報、公告、備置或保存之規定。\n十、違反第二十九條第一項規定，或未依同條第二項規定訂定審查基準、審查程序。\n十一、同業公會違反第三十二條第一項所定規則中有關同業公會章程應記載事項、負責人與業務人員之資格條件、財務或業務之規定。\n十二、穩定幣發行人有下列情事之一者：\n(一)違反第三十八條第一項或第四項所定辦法中有關準備資產之設置或定期查核程序、方式之規定。\n(二)違反第三十九條第一項至第三項或第四項所定辦法中有關穩定幣發行或贖回程序、方式之規定。\n(三)未依第四十一條規定建立內部控制制度、內部稽核制度、資通系統之安全管理制度或營運持續性政策，或未確實執行。\n(四)違反第四十二條規定。\n(五)違反第四十三條第一項、第三項或第二項所定辦法中有關資訊揭露之頻率、程序、方式之規定。\n十三、同業公會或與其有財務或業務往來之關係人對於主管機關依第四十五條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n十四、對於主管機關令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n依前項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。\n違反第三十八條第二項規定未繳存足額準備金者，由中央銀行就其不足部分，按該行公告最低之融通利率，加收年息百分之五之利息；其情節重大者，由中央銀行處新臺幣三十萬元以上六百萬元以下罰鍰。","note":"一、為確保主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理得以落實，對於違反本法規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關提出文書之命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實遵循法令，爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條規定，為第一項規定。\n二、為符比例原則並鼓勵行為人儘速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第二項定明對於情節輕微或已於限期內改善完成之違法行為，主管機關得免予處罰。\n三、參考電子支付機構管理條例第五十四條規定，於第三項定明穩定幣發行人未繳存足額準備金者，加收利息之規定，其情節重大者，並處以罰鍰。"},{"bill":"202110217080000","text":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"}],"changed":true,"final":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","finalWhy":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。","review":null},{"no":"第五十五條","current":null,"versions":[{"bill":"202110137730000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110203280000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"現行依洗錢防制法，對提供虛擬資產服務之事業或人員之管理係採登記制，於本法施行後將改為許可制，應提供虛擬資產服務商及已依主管機關規定提供虛擬資產服務之金融機構辦理申請許可相關作業充足時間，爰為本條過渡期間之規定。"},{"bill":"202110207150000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"現行依洗錢防制法，對提供虛擬資產服務之事業或人員之管理係採登記制，於本法施行後將改為許可制，應提供虛擬資產服務商及已依主管機關規定提供虛擬資產服務之金融機構辦理申請許可相關作業充足時間，爰為本條過渡期間之規定。"},{"bill":"202110206090000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"現行依洗錢防制法，對提供虛擬資產服務之事業或人員之管理係採登記制，於本法施行後將改為許可制，應提供虛擬資產服務商及已依主管機關規定提供虛擬資產服務之金融機構辦理申請許可相關作業充足時間，爰為本條過渡期間之規定。"},{"bill":"201110205640000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"現行依洗錢防制法，對提供虛擬資產服務之事業或人員之管理係採登記制，於本法施行後將改為許可制，應提供虛擬資產服務商及已依主管機關規定提供虛擬資產服務之金融機構辦理申請許可相關作業充足時間，爰為本條過渡期間之規定。"},{"bill":"202110209890000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"現行依洗錢防制法，對提供虛擬資產服務之事業或人員之管理係採登記制，於本法施行後將改為許可制，應提供虛擬資產服務商及已依主管機關規定提供虛擬資產服務之金融機構辦理申請許可相關作業充足時間，爰為本條過渡期間之規定。"},{"bill":"202110214790000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"現行依洗錢防制法，對提供虛擬資產服務之事業或人員之管理係採登記制，於本法施行後將改為許可制，應提供虛擬資產服務商及已依主管機關規定提供虛擬資產服務之金融機構辦理申請許可相關作業充足時間，爰為本條過渡期間之規定。"},{"bill":"202110213930000","text":"法人違反本法有關行政法上義務應受處罰者，其負責人、業務人員或其他受僱人之故意或過失，視為該法人之故意或過失。","note":"以法人作為處罰對象者，應定明其故意過失責任，爰參考證券投資信託及顧問法第一百十七條規定，於本條定明以法人之負責人、業務人員或其他受僱人之故意、過失，視為該法人之故意、過失。"},{"bill":"202110217080000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後九個月內向主管機關申請許可，並於本法施行後十八個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。","note":"現行依洗錢防制法，對提供虛擬資產服務之事業或人員之管理係採登記制，於本法施行後將改為許可制，應提供虛擬資產服務商及已依主管機關規定提供虛擬資產服務之金融機構辦理申請許可相關作業充足時間，爰為本條過渡期間之規定。"}],"changed":true,"final":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務商或已依主管機關規定提供虛擬資產服務之金融機構，應於本法施行後十二個月內向主管機關申請許可，並於本法施行後二十一個月內經主管機關許可及發給許可證照；屆期未向主管機關申請許可或未經主管機關許可及發給許可證照者，不得繼續經營虛擬資產業務。\n前項取得許可證照期限，必要時得延長三個月，並以一次為限。","finalWhy":"一、本法制定公布後，業者依法必須重新建置、調整符合國家特許監理標準之內部控制制度、資通安全管理、經會計師簽證之財務報告及各項法律合規作業程序。實務上，不論是國際資安標準之驗證程序，亦或是各項合規文件之整備，皆需耗費大量勞費與期程。若過渡期之申請時限過於倉促，恐導致業者因時間壓力無法產出高質量之法遵文件，反不利於監理機關之實質審查。\n二、為使新舊法規順利銜接，並兼顧監理品質與產業穩定，將過渡期間酌予放寬為「十二加九」共二十一個月。","review":null},{"no":"第五十六條","current":null,"versions":[{"bill":"202110203280000","text":"本法施行日期，由行政院定之。","note":"考量本法規範內容之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。"},{"bill":"202110207150000","text":"本法施行日期，由行政院定之。","note":"考量本法規範內容之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。"},{"bill":"202110206090000","text":"本法施行日期，由行政院定之。","note":"考量本法規範內容之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。"},{"bill":"201110205640000","text":"本法施行日期，由行政院定之。","note":"考量本法規範內容之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。"},{"bill":"202110209890000","text":"本法施行日期，由行政院定之。","note":"考量本法規範內容之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。"},{"bill":"202110214790000","text":"本法施行日期，由行政院定之。","note":"考量本法規範內容之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。"},{"bill":"202110213930000","text":"犯本法之罪，所科罰金達新臺幣五千萬元而無力完納者，易服勞役期間為二年以下，其折算標準以罰金總額與二年之日數比例折算；所科罰金達新臺幣一億元而無力完納者，易服勞役期間為三年以下，其折算標準以罰金總額與三年之日數比例折算。","note":"依刑法第四十二條第三項規定，易服勞役期限不得逾一年，惟法院依本法相關規定併科巨額罰金時，如僅執行一年，實無法嚇阻犯罪，與高額罰金刑之處罰意旨有悖，爰參考證券交易法第一百八十條之一及證券投資信託及顧問法第一百十九條之立法例，於本條將易服勞役期間依其罰金總額提高為二年或三年以下，並依罰金總額與勞役期間之二年或三年折算其比例。"},{"bill":"202110217080000","text":"本法施行日期，由行政院定之。","note":"考量本法規範內容之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。"}],"changed":true,"final":"本法施行日期，由行政院定之。","finalWhy":"考量本法規範內容之執行，涉及相關辦法及配套措施之研擬、訂定，須妥為規劃，爰定明本法之施行日期由行政院定之。","review":null},{"no":"第五十七條","current":null,"versions":[{"bill":"202110213930000","text":"本法施行前已依洗錢防制法第六條第一項完成洗錢防制登記之虛擬資產服務 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);

};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';

  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;

function finder(turns) {   // 在這場逐字稿裡找字

    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
