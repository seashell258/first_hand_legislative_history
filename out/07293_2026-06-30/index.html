規則，倘該虛擬資產業經虛擬資產交易平台商申請主管機關同意交易，則無須再為申請，併予敘明。\n二、為保護客戶之權益與交易市場健全性，爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產使用者保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第三項定明虛擬資產交易平台商有建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。"},{"bill":"202110214790000","text":"虛擬資產交易平台商應就虛擬資產之上下架訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產交易平台商應確保其提供集中交易市場服務之虛擬資產經申請主管機關同意，始得提供服務；虛擬資產交易平台商申請同意之程序、條件、廢止及其他應遵行事項之規則，由主管機關定之。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施。","note":"一、虛擬資產交易平台商就其上下架之虛擬資產，負有客觀審查之義務，爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項定明虛擬資產交易平台商之虛擬資產上下架審查義務，並於第二項定明虛擬資產交易平台商提供交易平台服務之虛擬資產應經主管機關同意，及授權主管機關訂定申請同意之相關規則，倘該虛擬資產業經虛擬資產交易平台商申請主管機關同意交易，則無須再為申請，併予敘明。\n二、為保護客戶之權益與交易市場健全性，爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產使用者保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第三項定明虛擬資產交易平台商有建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。"},{"bill":"202110213930000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。\n三、符合主管機關規定之特殊情形。","note":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考；倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。"},{"bill":"202110217080000","text":"虛擬資產交易平台商應就虛擬資產之上下架訂定審查基準及審查程序；前開審查基準應納入虛擬資產之洗錢、資恐及鏈上風險審查，至少包括代幣合約是否具增發、凍結、黑名單或暫停交易權限、主要持幣地址是否高度集中、是否與詐欺、駭客、洗錢或受制裁地址具鏈上關聯、初始資金來源，以及是否曾經其他司法管轄區警示或下架等項目；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產交易平台商應確保其提供集中交易市場服務之虛擬資產經申請主管機關同意，始得提供服務；虛擬資產交易平台商申請同意之程序、條件、廢止及其他應遵行事項之規則，由主管機關定之。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施。","note":"一、虛擬資產交易平台商就其上下架之虛擬資產，負有客觀審查之義務，爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項定明虛擬資產交易平台商之虛擬資產上下架審查義務，且上下架審查不應僅審酌白皮書、技術、流動性、發行團隊與市場操縱，亦應納入洗錢與鏈上風險審查，以避免合法交易平台成為高風險代幣之流動性出口。並於第二項定明虛擬資產交易平台商提供交易平台服務之虛擬資產應經主管機關同意，及授權主管機關訂定申請同意之相關規則，倘該虛擬資產業經虛擬資產交易平台商申請主管機關同意交易，則無須再為申請，併予敘明。\n二、為保護客戶之權益與交易市場健全性，爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產使用者保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第三項定明虛擬資產交易平台商有建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。"}],"changed":true,"final":"虛擬資產交易平台商應就虛擬資產之上下架訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產交易平台商就其提供集中交易市場服務之虛擬資產，應報主管機關核備；虛擬資產交易平台商核備之程序、條件、廢止及其他應遵行事項之規則，由主管機關定之。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施。","finalWhy":"一、虛擬資產交易平台商就其上下架之虛擬資產，負有客觀審查之義務，爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項定明虛擬資產交易平台商之虛擬資產上下架審查義務，並於第二項定明虛擬資產交易平台商就其提供集中交易市場服務之虛擬資產應報主管機關核備及授權主管機關訂定核備之程序、條件、廢止及其他應遵行事項之規則。\n二、為保護客戶之權益與交易市場健全性，爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產使用者保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第三項定明虛擬資產交易平台商有建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。","review":null},{"no":"第二十六條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產交換商應公告其提供交換服務之虛擬資產之發行說明文書，虛擬資產未有依主管機關之規定編製與公告之發行說明文書者，虛擬資產交換商不得提供該虛擬資產之交換服務。但主管機關另有規定者，不在此限。","note":"虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應提供此發行說明文書網頁連結；未依主管機關規定編製發行說明文書之虛擬資產，可能存在較高之資訊不對稱風險與交易人保護之疑慮，故虛擬資產交換商原則應拒絕提供無發行說明文書之虛擬資產之交換服務。爰參考歐盟MiCA規則第六十六條第三項規定，於本條明定虛擬資產交換商提供虛擬資產發行說明文書資訊之義務，以及虛擬資產交換商不得提供無發行說明文書之虛擬資產之交換服務之義務，並授權主管機關另定例外情形。"},{"bill":"202110171550000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性之對帳措施，且委任會計師出具報告，並向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項及其他應遵循事項，由主管機關定之。","note":"一、虛擬資產保管商保管之客戶虛擬資產，其財產權應歸客戶，且不應與虛擬資產服務商之自有財產混合，以避免財產權歸屬不清影響客戶權益。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產用戶保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項明定虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項明定虛擬資產保管商不得混合保管客戶虛擬資產。\n二、為防免虛擬資產保管商挪用客戶資產，有必要建立客觀第三人對虛擬資產保管商之定期對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項明定虛擬資產保管商設置經常性對帳措施之義務，並於第四項授權主管機關視虛擬資產服務市場發展程度另定會計師應出具報告之種類、申報程序、公告事項及其他應遵循事項。"},{"bill":"202110199580000","text":"虛擬資產交易平台商應依主管機關之規定，就虛擬資產之上下架訂定審查標準及審查程序。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施。\n前條之規定，於虛擬資產交易平台商亦適用之。","note":"一、虛擬資產交易平台商就其上下架之虛擬資產，應負有客觀審查之義務。爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項明定虛擬資產交易平台商之虛擬資產上下架審查義務。\n二、虛擬資產交易平台商應防止其交易市場中之不公正交易行為，以保護其客戶之權益與交易市場健全性。爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產用戶保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第三項明定虛擬資產交易平台商建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。\n三、虛擬資產交易平台商性質上亦屬虛擬資產交換商之一種，爰於第四項明定虛擬資產交易平台商適用虛擬資產交換商之規定。"},{"bill":"202110203280000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。"},{"bill":"202110207150000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商；如仍有約定，依民法第七十一條本文規定，該約定為無效。並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。"},{"bill":"202110206090000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。"},{"bill":"201110205640000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。"},{"bill":"202110209160000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、第一項、第二項定明保管商不得與客戶約定財產權移轉，不得混合保管，爰參考IOSCO最終報告建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定。\n二、第三項定明保管商應設置對帳措施、委任會計師出具報告及申報公告義務，以防止保管商不當挪用客戶資產，爰參考IOSCO最終報告建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定；第四項授權主管機關訂定辦法。"},{"bill":"202110209890000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。"},{"bill":"202110214790000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。"},{"bill":"202110213930000","text":"虛擬資產交易平台商應就虛擬資產之上下架訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產交易平台商應確保其提供集中交易市場服務之虛擬資產經申請主管機關同意，始得提供服務；虛擬資產交易平台商申請同意之程序、條件、廢止及其他應遵行事項之規則，由主管機關定之。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施。","note":"一、虛擬資產交易平台商就其上下架之虛擬資產，負有客觀審查之義務，爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項定明虛擬資產交易平台商之虛擬資產上下架審查義務，並於第二項定明虛擬資產交易平台商提供交易平台服務之虛擬資產應經主管機關同意，及授權主管機關訂定申請同意之相關規則，倘該虛擬資產業經虛擬資產交易平台商申請主管機關同意交易，則無須再為申請，併予敘明。\n二、為保護客戶之權益與交易市場健全性，爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產使用者保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第三項定明虛擬資產交易平台商有建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。"},{"bill":"202110217080000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。"}],"changed":true,"final":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","finalWhy":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。","review":null},{"no":"第二十七條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產交易平台商應依主管機關之規定，就虛擬資產之上下架訂定審查標準及審查程序。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施。\n前條之規定，於虛擬資產交易平台商亦適用之。","note":"一、虛擬資產交易平台商就其上下架之虛擬資產，應負有客觀審查之義務。爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項明定虛擬資產交易平台商之虛擬資產上下架審查義務。\n二、虛擬資產交易平台商應防止其交易市場中之不公正交易行為，以保護其客戶之權益與交易市場健全性。爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產用戶保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第二項明定虛擬資產交易平台商建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。\n三、虛擬資產交易平台商性質上亦屬虛擬資產交換商之一種，爰於第三項明定虛擬資產交易平台商適用虛擬資產交換商之規定。"},{"bill":"202110171550000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商或提供虛擬資產保管服務之金融機構為限。\n虛擬資產保管商應告知客戶前項之情形。如客戶遭受損害，由與客戶簽約之保管商負擔損害賠償責任。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人之專業性，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項明定受虛擬資產保管商委託保管客戶虛擬資產之第三人應具備之資格；於第二項明定虛擬資產保管商之客戶告知義務，並定明如發生虛擬資產安全事件，由與客戶簽約之保管商負擔客戶之損害賠償責任。"},{"bill":"202110199580000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性之對帳措施，且委任會計師出具報告，並向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項及其他應遵循事項，由主管機關定之。","note":"一、虛擬資產保管商保管之客戶虛擬資產，其財產權應歸客戶，且不應與虛擬資產服務商之自有財產混合，以避免財產權歸屬不清影響客戶權益。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產用戶保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項明定虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項明定虛擬資產保管商不得混合保管客戶虛擬資產。\n二、為防免虛擬資產保管商挪用客戶資產，有必要建立客觀第三人對虛擬資產保管商之定期對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項明定虛擬資產保管商設置經常性對帳措施之義務，並於第四項授權主管機關視虛擬資產服務市場發展程度另定會計師應出具報告之種類、申報程序、公告事項及其他應遵循事項。"},{"bill":"202110203280000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商應將前項委託他人保管虛擬資產之情形告知客戶。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人為有能力保管虛擬資產之人，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。"},{"bill":"202110207150000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商應將前項委託他人保管虛擬資產之情形告知客戶。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人為有能力保管虛擬資產之人，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。"},{"bill":"202110206090000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商應將前項委託他人保管虛擬資產之情形告知客戶。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人為有能力保管虛擬資產之人，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。"},{"bill":"201110205640000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商應將前項委託他人保管虛擬資產之情形告知客戶。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人為有能力保管虛擬資產之人，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。"},{"bill":"202110209160000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商應將前項委託他人保管虛擬資產之情形告知客戶。","note":"保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保受委託之第三人具有保管能力，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受委託之第三人以主管機關許可之虛擬資產保管商為限；第二項定明保管商應告知客戶委外保管之情形。"},{"bill":"202110209890000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商應將前項委託他人保管虛擬資產之情形告知客戶。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人為有能力保管虛擬資產之人，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。"},{"bill":"202110214790000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商應將前項委託他人保管虛擬資產之情形告知客戶。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人為有能力保管虛擬資產之人，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。"},{"bill":"202110213930000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性及定期性之對帳措施，並委任會計師出具報告；該報告應向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產保管商為客戶保管之虛擬資產，財產權為客戶所有，為避免與虛擬資產保管商之自有財產混合致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項定明虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項定明虛擬資產保管商不得將客戶之虛擬資產與自有虛擬資產混合保管。\n二、為防止虛擬資產保管商不當挪用客戶資產，有必要建立經常性及定期性對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項定明虛擬資產保管商設置經常性及定期性對帳措施之義務，並應委任會計師出具報告及向主管機關申報及公告，另於第四項授權主管機關另定會計師應出具報告之種類、申報程序、公告事項及其他應遵行事項之辦法。"},{"bill":"202110217080000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商應將前項委託他人保管虛擬資產之情形告知客戶。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人為有能力保管虛擬資產之人，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。"}],"changed":true,"final":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商為限。\n虛擬資產保管商有前項之情形者，應告知客戶。如因受委託機構或其受僱人之故意或過失致客戶權益受損，虛擬資產保管商仍應對客戶依法負同一責任。","finalWhy":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人為有能力保管虛擬資產之人，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。另虛擬資產服務商不因將客戶資產委託他人保管而影響其對客戶應負之責任，對客戶仍應就受委託機構之故意或過失負同一責任。","review":null},{"no":"第二十八條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產保管商保管之客戶虛擬資產，其財產權歸屬於客戶，虛擬資產保管商不得與客戶約定財產權移轉予虛擬資產保管商。\n虛擬資產保管商收受客戶之虛擬資產，不得與其自有之虛擬資產混合保管。\n虛擬資產保管商就所保管之客戶資產，應設置經常性之對帳措施，且委任會計師出具報告，並向主管機關申報及公告。\n前項報告之種類、申報程序、公告事項及其他應遵循事項，由主管機關定之。","note":"一、虛擬資產保管商保管之客戶虛擬資產，其財產權應歸客戶，且不應與虛擬資產服務商之自有財產混合，以避免財產權歸屬不清影響客戶權益。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十五條第七項、日本支付服務法第六十三條之十一、韓國虛擬資產用戶保護法第七條第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第六段規定，於第一項明定虛擬資產保管商不得與客戶約定客戶虛擬資產之財產權移轉於虛擬資產保管商，並於第二項明定虛擬資產保管商不得混合保管客戶虛擬資產。\n二、為防免虛擬資產保管商挪用客戶資產，有必要建立客觀第三人對虛擬資產保管商之定期對帳措施，爰參考IOSCO最終報告之建議十五、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十八條及香港有關認可機構提供數碼資產保管服務的預期標準的指引第二十一段規定，於第三項明定虛擬資產保管商設置經常性對帳措施之義務，並於第四項授權主管機關視虛擬資產服務市場發展程度另定會計師應出具報告之種類、申報程序、公告事項及其他應遵循事項。"},{"bill":"202110171550000","text":"虛擬資產承銷商應公告其提供發行或銷售及相關服務之虛擬資產之發行說明文書資訊。\n虛擬資產未有依主管機關之規定編製與公告之發行說明文書者，虛擬資產承銷商不得提供該虛擬資產之發行或銷售相關服務。但主管機關另有規定者，不在此限。\n虛擬資產承銷商應依主管機關之規定，就其提供發行或銷售及相關服務之虛擬資產訂定審查標準及審查程序。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，應提供此發行說明文書之網頁連結，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定規定，於第一項明定虛擬資產承銷商提供虛擬資產發行說明文書相關資訊之義務。\n二、第二項明定虛擬資產承銷商就無發行說明文書之虛擬資產，原則不得提供承銷服務，並授權主管機關另定例外情形。\n三、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第三項明定要求虛擬資產承銷商就所承銷之虛擬資產訂定審查標準及審查程序。"},{"bill":"202110199580000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商或具虛擬資產保管資格之金融機構為限。\n虛擬資產保管商或具虛擬資產保管資格之金融機構應告知客戶前項之情形。如客戶遭受損害，由與客戶簽約之保管商或具虛擬資產保管資格之金融機構負擔損害賠償責任。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人之專業性，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項明定受虛擬資產保管商委託保管客戶虛擬資產之第三人應具備之資格；並於第二項明定虛擬資產保管商或具虛擬資產保管資格之金融機構之客戶告知義務，並定明發生損害事件時，由與客戶簽約之保管商或具虛擬資產保管資格之金融機構對客戶負擔損害賠償責任。"},{"bill":"202110203280000","text":"虛擬資產承銷商應確保其提供發行或銷售及相關服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有第二十四條但書所定情形之一者，不在此限。\n虛擬資產承銷商應就其提供發行或銷售及相關服務之虛擬資產訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，與虛擬資產交換商提供服務時相同，亦負有應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告方式之義務，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定，於第一項定明虛擬資產承銷商就不具符合主管機關規定之發行說明文書之虛擬資產，除有第二十四條但書所定情形外，原則不得提供承銷服務，並定明虛擬資產承銷商有將虛擬資產發行說明文書相關資訊公告之義務。\n二、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第二項定明虛擬資產承銷商就所承銷之虛擬資產應依主管機關所定辦法訂定審查基準及審查程序。"},{"bill":"202110207150000","text":"虛擬資產承銷商應確保其提供發行或銷售及相關服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有第二十四條但書所定情形之一者，不在此限。\n虛擬資產承銷商應就其提供發行或銷售及相關服務之虛擬資產訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，與虛擬資產交換商提供服務時相同，亦負有應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告方式之義務，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定，於第一項定明虛擬資產承銷商就不具符合主管機關規定之發行說明文書之虛擬資產，除有第二十四條但書所定情形外，原則不得提供承銷服務，並定明虛擬資產承銷商有將虛擬資產發行說明文書相關資訊公告之義務。\n二、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第二項定明虛擬資產承銷商就所承銷之虛擬資產應依主管機關所定辦法訂定審查基準及審查程序。"},{"bill":"202110206090000","text":"虛擬資產承銷商應確保其提供發行或銷售及相關服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有第二十四條但書所定情形之一者，不在此限。\n虛擬資產承銷商應就其提供發行或銷售及相關服務之虛擬資產訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，與虛擬資產交換商提供服務時相同，亦負有應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告方式之義務，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定，於第一項定明虛擬資產承銷商就不具符合主管機關規定之發行說明文書之虛擬資產，除有第二十四條但書所定情形外，原則不得提供承銷服務，並定明虛擬資產承銷商有將虛擬資產發行說明文書相關資訊公告之義務。\n二、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第二項定明虛擬資產承銷商就所承銷之虛擬資產應依主管機關所定辦法訂定審查基準及審查程序。"},{"bill":"201110205640000","text":"虛擬資產承銷商應確保其提供發行或銷售及相關服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有第二十四條但書所定情形之一者，不在此限。\n虛擬資產承銷商應就其提供發行或銷售及相關服務之虛擬資產訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，與虛擬資產交換商提供服務時相同，亦負有應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告方式之義 則第七十五條第九項規定，於第一項定明受虛擬資產保管商委託保管客戶虛擬資產之第三人以主管機關許可之虛擬資產保管商為限，並於第二項定明虛擬資產保管商為第一項行為時，對客戶之告知義務。"},{"bill":"202110217080000","text":"虛擬資產承銷商應確保其提供發行或銷售及相關服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有第二十四條但書所定情形之一者，不在此限。\n虛擬資產承銷商應就其提供發行或銷售及相關服務之虛擬資產訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，與虛擬資產交換商提供服務時相同，亦負有應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告方式之義務，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定，於第一項定明虛擬資產承銷商就不具符合主管機關規定之發行說明文書之虛擬資產，除有第二十四條但書所定情形外，原則不得提供承銷服務，並定明虛擬資產承銷商有將虛擬資產發行說明文書相關資訊公告之義務。\n二、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第二項定明虛擬資產承銷商就所承銷之虛擬資產應依主管機關所定辦法訂定審查基準及審查程序。"}],"changed":true,"final":"虛擬資產承銷商應確保其提供發行或銷售及相關服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有第二十四條但書所定情形之一者，不在此限。\n虛擬資產承銷商應就其提供發行或銷售及相關服務之虛擬資產訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。","finalWhy":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，與虛擬資產交換商提供服務時相同，亦負有應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告方式之義務，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定，於第一項定明虛擬資產承銷商就不具符合主管機關規定之發行說明文書之虛擬資產，除有第二十四條但書所定情形外，原則不得提供承銷服務，並定明虛擬資產承銷商有將虛擬資產發行說明文書相關資訊公告之義務。\n二、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第二項定明虛擬資產承銷商就所承銷之虛擬資產應依主管機關所定辦法訂定審查基準及審查程序。","review":null},{"no":"第二十九條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產保管商委託他人保管客戶之虛擬資產者，該他人以主管機關許可之虛擬資產保管商或提供虛擬資產保管服務之金融機構為限。\n虛擬資產保管商應告知客戶前項之情形。如客戶遭受損害，由與客戶簽約之保管商負擔損害賠償責任。","note":"虛擬資產保管商得委託第三人保管客戶虛擬資產，以提升客戶資產安全性。為確保該第三人之專業性，爰參考歐盟MiCA規則第七十五條第九項規定，於第一項明定受虛擬資產保管商委託保管客戶虛擬資產之第三人應具備之資格；於第二項明定虛擬資產保管商之客戶告知義務，並定明如發生虛擬資產安全事件，由與客戶簽約之保管商負擔客戶之損害賠償責任。"},{"bill":"202110171550000","text":"虛擬資產金融服務商發行虛擬資產衍生之金融商品或金融服務，或以虛擬資產為標的之衍生性金融商品之認定規則及投資人資格認定規則等辦法，由主管機關定之。\n虛擬資產業者辦理虛擬資產衍生之金融商品或金融服務，或虛擬資產衍生性金融商品業務，其對該業務範圍及規範、風險管理等相關辦法，由主管機關定之。","note":"一、本法為健全虛擬資產市場之秩序及完善虛擬資產業之發展與監理，故於本條允許虛擬資產金服商開發虛擬資產衍生之金融商品或金融服務，或以虛擬資產為標的之衍生性金融商品。\n二、惟考量虛擬資產之價格波動劇烈，且價格易受操縱，故虛擬資產所衍生之金融商品或金融服務，如虛擬資產之授信商品、虛擬資產金融服務商從事之虛擬資產代操等業務均應訂定相關業務規範；衍生性商品本身又較一般傳統金融商品更為複雜，遑論虛擬資產之衍生性金融商品或以虛擬資產為標的之衍生性金融商品。故於第一項明定相關商品及服務之認定規則，以及得投資各該商品之投資人資格認定規則，授權由主管機關訂定；主管機關訂定前應徵詢同業公會之意見。復考量虛擬資產業之變化快速，主管機關允宜保持辦法一定彈性，最少應每月邀集同業公會檢視相關辦法；以符合產業國際發展趨勢。\n三、鑒於虛擬資產相關衍生性金融商品仍以虛擬資產為其基礎，其性質、交易行為、產品設計等細節，或與傳統衍生性金融商品有所區隔，如市場上常見之雙幣選擇權商品或永續契約商品，與期貨交易法第三條所定期貨商品似不完全一致；雖現行有槓桿保證金契約等類似期貨交易法所定之期貨交易，惟其所立基之虛擬資產於本法定義上非屬期貨交易法第三條所謂「商品、貨幣、有價證券、利率、指數或其他利益」，故似不宜以傳統金融法規完全套用。爰於第二項定明虛擬資產衍生之金融商品或金融服務，或以虛擬資產為標的之衍生性金融商品之相關業務範圍及規範、人員管理、客戶權益保障及風險管理等相關規則，授權由主管機關訂定；主管機關訂定前應徵詢同業公會之意見。復考量虛擬資產業之變化快速，主管機關允宜保持辦法一定彈性，最少應每月邀集同業公會檢視相關辦法；以符合產業國際發展趨勢。"},{"bill":"202110199580000","text":"虛擬資產承銷商應公告其提供發行或銷售及相關服務之虛擬資產之發行說明文書資訊，虛擬資產未有依主管機關之規定編製與公告之發行說明文書者，虛擬資產承銷商不得提供該虛擬資產之發行或銷售相關服務。但主管機關另有規定者，不在此限。\n虛擬資產承銷商應依主管機關之規定，就其提供發行或銷售及相關服務之虛擬資產訂定審查標準及審查程序。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，應提供此發行說明文書之網頁連結，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定規定，於第一項明定虛擬資產承銷商提供虛擬資產發行說明文書相關資訊之義務，並明定虛擬資產承銷商就無發行說明文書之虛擬資產，原則不得提供承銷服務，並授權主管機關另定例外情形。\n二、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第三項明定要求虛擬資產承銷商就所承銷之虛擬資產訂定審查標準及審查程序。"},{"bill":"202110203280000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、按虛擬資產服務商同業公會本屬商業團體，原應適用商業團體法，惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，故對其設立、組織及監督等事項設有特別規定，本法未規定者，虛擬資產服務商同業公會仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"},{"bill":"202110207150000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、因加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、虛擬資產服務商同業公會性質屬商業團體，而有商業團體法之適用。惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，而對其設立、組織及監督等事項設有特別規定，故倘本法未規定者，虛擬資產服務商同業公會自仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"},{"bill":"202110206090000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、按虛擬資產服務商同業公會本屬商業團體，原應適用商業團體法，惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，故對其設立、組織及監督等事項設有特別規定，本法未規定者，虛擬資產服務商同業公會仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"},{"bill":"201110205640000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、按虛擬資產服務商同業公會本屬商業團體，原應適用商業團體法，惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，故對其設立、組織及監督等事項設有特別規定，本法未規定者，虛擬資產服務商同業公會仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"},{"bill":"202110209160000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明服務商加入同業公會之義務。\n二、加入同業公會為服務商之營業要件，涉及業務經營權益，故同業公會無正當理由不得拒絕加入，爰參考證券投資信託及顧問法第八十四條第一項規定，為第一項及第二項規定。\n三、同業公會本屬商業團體，本法未規定者仍應適用商業團體法，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"},{"bill":"202110209890000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、按虛擬資產服務商同業公會本屬商業團體，原應適用商業團體法，惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，故對其設立、組織及監督等事項設有特別規定，本法未規定者，虛擬資產服務商同業公會仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"},{"bill":"202110214790000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、按虛擬資產服務商同業公會本屬商業團體，原應適用商業團體法，惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，故對其設立、組織及監督等事項設有特別規定，本法未規定者，虛擬資產服務商同業公會仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"},{"bill":"202110213930000","text":"虛擬資產承銷商應確保其提供發行或銷售及相關服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有第二十五條但書所定情形之一者，不在此限。\n虛擬資產承銷商應就其提供發行或銷售及相關服務之虛擬資產訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，與虛擬資產交換商提供服務時相同，亦負有應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告方式之義務，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定，於第一項定明虛擬資產承銷商就不具符合主管機關規定之發行說明文書之虛擬資產，除有第二十四條但書所定情形外，原則不得提供承銷服務，並定明虛擬資產承銷商有將虛擬資產發行說明文書相關資訊公告之義務。\n二、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第二項定明虛擬資產承銷商就所承銷之虛擬資產應依主管機關所定辦法訂定審查基準及審查程序。"},{"bill":"202110217080000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、按虛擬資產服務商同業公會本屬商業團體，原應適用商業團體法，惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，故對其設立、組織及監督等事項設有特別規定，本法未規定者，虛擬資產服務商同業公會仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"}],"changed":true,"final":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","finalWhy":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、按虛擬資產服務商同業公會本屬商業團體，原應適用商業團體法，惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，故對其設立、組織及監督等事項設有特別規定，本法未規定者，虛擬資產服務商同業公會仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。","review":null},{"no":"第三十條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產承銷商應公告其提供發行或銷售及相關服務之虛擬資產之發行說明文書資訊。\n虛擬資產未有依主管機關之規定編製與公告之發行說明文書者，虛擬資產承銷商不得提供該虛擬資產之發行或銷售相關服務。但主管機關另有規定者，不在此限。\n虛擬資產承銷商應依主管機關之規定，就其提供發行或銷售及相關服務之虛擬資產訂定審查標準及審查程序。","note":"一、虛擬資產之發行說明文書為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產承銷商提供發行或銷售及相關服務（簡稱「承銷服務」）時，應提供此發行說明文書之網頁連結，爰參考歐盟MiCA規則第六十六條第三項及第七十九條第一項規定規定，於第一項明定虛擬資產承銷商提供虛擬資產發行說明文書相關資訊之義務。\n二、第二項明定虛擬資產承銷商就無發行說明文書之虛擬資產，原則不得提供承銷服務，並授權主管機關另定例外情形。\n三、為督促虛擬資產承銷商發揮職責審慎把關虛擬資產發行之品質，虛擬資產承銷商應於承銷前審查發行人資格條件、相關發行計畫、技術及是否涉有虛偽、詐欺、隱匿或足致他人誤信情事，爰於第三項明定要求虛擬資產承銷商就所承銷之虛擬資產訂定審查標準及審查程序。"},{"bill":"202110171550000","text":"虛擬資產服務商非加入同業公會，不得營業。境外虛擬資產服務商，亦同。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項明定虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之許可要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會不得無正當理由拒絕虛擬資產服務商之加入。爰參考證券投資信託及顧問法第八十四條第一項後段規定，於第二項明定同業公會不得無故拒絕虛擬資產服務商加入。\n三、按虛擬資產同業公會本屬商業團體，原應適用商業團體法，僅主管機關基於虛擬資產同業公會涉及虛擬資產服務商健全發展之公益考量，故於本章對其設立、組織及監督等事項設有特別規定。惟除此之外，虛擬資產同業公會仍應回歸商業團體法之規範，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，於第三項明定同業公會適用商業團體法規定。"},{"bill":"202110199580000","text":"虛擬資產金融商發行虛擬資產衍生之金融商品或服務，其業務範圍、規則及風險管理等相關辦法，由主管機關定之，並每半年會同同業公會檢討。\n虛擬資產金融商受託從事虛擬資產衍生之金融商品或服務，得評估客戶從事虛擬資產衍生性商品交易之能力，如經評估其信用狀況及財力有逾越其從事交易能力者，除提供適當之擔保外，應拒絕其委託。","note":"一、虛擬資產衍生之金融商品或服務與一般傳統金融衍生性商品略有不同，例如「永續合約」因其不具「到期日」，以致無法直接適用於現行期貨交易法；又或其交易之標的無法透過期貨交易所進行結算等。且虛擬資產價格波動較一般傳統金融資產更為劇烈，故授權主管機關對其商品及服務之業務範圍、規則及風險管理等訂定相關辦法，另考量虛擬資產發展變化快速，為保持彈性，爰要求主管機關應每半年邀集同業公會討論。\n二、為免客戶交易之委託超過其履行義務之能力，參考期貨交易法第六十四條規定，於第二項明定虛擬資產金融商於接受客戶委託前，得先評估其財務狀況，如其財務狀況不良，應拒絕其委託。"},{"bill":"202110203280000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程；同業公會章程應記載事項、監督事項、其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、為維護虛擬資產市場健全之公益性，定明同業公會訂定章程之考量因素，又主管機關對同業公會之事務仍應有監督管理權，以促進同業公會發揮自律組織之功能，爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關訂定同業公會監督等相關規範；又章程應記載事項包含業務範圍、規範等事項，併予敘明。\n二、同業公會為推動公會事務之進行，有自闢財源向會員收費以穩定財務收入之必要，爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，為第二項規定。"},{"bill":"202110207150000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程；同業公會章程應記載事項、監督事項、其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、為維護虛擬資產市場健全之公益性，定明同業公會訂定章程之考量因素。又主管機關對同業公會之事務仍應有監督管理權，以促進同業公會發揮自律組織之功能。爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關訂定同業公會監督等相關規範；又章程應記載事項包含業務範圍、規範等事項，併予敘明。\n二、同業公會為推動公會事務之進行，有自闢財源向會員收費以穩定財務收入之必要，爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，為第二項規定。"},{"bill":"202110206090000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程；同業公會章程應記載事項、監督事項、其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、為維護虛擬資產市場健全之公益性，定明同業公會訂定章程之考量因素，又主管機關對同業公會之事務仍應有監督管理權，以促進同業公會發揮自律組織之功能，爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關訂定同業公會監督等相關規範；又章程應記載事項包含業務範圍、規範等事項，併予敘明。\n二、同業公會為推動公會事務之進行，有自闢財源向會員收費以穩定財務收入之必要，爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，為第二項規定。"},{"bill":"201110205640000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程；同業公會章程應記載事項、監督事項、其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、為維護虛擬資產市場健全之公益性，定明同業公會訂定章程之考量因素，又主管機關對同業公會之事務仍應有監督管理權，以促進同業公會發揮自律組織之功能，爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關訂定同業公會監督等相關規範；又章程應記載事項包含業務範圍、規範等事項，併予敘明。\n二、同業公會為推動公會事務之進行，有自闢財源向會員收費以穩定財務收入之必要，爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，為第二項規定。"},{"bill":"202110209160000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程；同業公會章程應記載事項、監督事項、其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、為維護虛擬資產市場健全之公益性，定明同業公會訂定章程之考量因素，並授權主管機關訂定同業公會監督等相關規範，爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定；章程應記載事項包含業務範圍、規範等，併予敘明。\n二、同業公會為推動公會事務之進行，有自闢財源向會員收費以穩定財務收入之必要，爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，為第二項規定。"},{"bill":"202110209890000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調 機關對同業公會之事務仍應有監督管理權，以促進同業公會發揮自律組織之功能，爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關訂定同業公會監督等相關規範；又章程應記載事項包含業務範圍、規範等事項，併予敘明。\n二、同業公會為推動公會事務之進行，有自闢財源向會員收費以穩定財務收入之必要，爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，為第二項規定。","review":null},{"no":"第三十一條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產金融服務商發行虛擬資產衍生之金融商品或金融服務，或以虛擬資產為標的之衍生性金融商品之認定規則及投資人資格認定規則等辦法，由主管機關定之。\n虛擬資產業者辦理虛擬資產衍生之金融商品或金融服務，或虛擬資產衍生性金融商品業務，其對該業務範圍及規範、風險管理等相關辦法，由主管機關定之。","note":"一、本法為健全虛擬資產市場之秩序及完善虛擬資產業之發展與監理，故於本條允許虛擬資產金服商開發虛擬資產衍生之金融商品或金融服務，或以虛擬資產為標的之衍生性金融商品。\n二、惟考量虛擬資產之價格波動劇烈，且價格易受操縱，故虛擬資產所衍生之金融商品或金融服務，如虛擬資產之授信商品、虛擬資產金融服務商從事之虛擬資產代操等業務均應訂定相關業務規範；衍生性商品本身又較一般傳統金融商品更為複雜，遑論虛擬資產之衍生性金融商品或以虛擬資產為標的之衍生性金融商品。故於第一項明定相關商品及服務之認定規則，以及得投資各該商品之投資人資格認定規則，授權由主管機關訂定；主管機關訂定前應徵詢同業公會之意見。復考量虛擬資產業之變化快速，主管機關允宜保持辦法一定彈性，最少應每月邀集同業公會檢視相關辦法；以符合產業國際發展趨勢。\n三、鑒於虛擬資產相關衍生性金融商品仍以虛擬資產為其基礎，其性質、交易行為、產品設計等細節，或與傳統衍生性金融商品有所區隔，如市場上常見之雙幣選擇權商品或永續契約商品，與期貨交易法第三條所定期貨商品似不完全一致；雖現行有槓桿保證金契約等類似期貨交易法所定之期貨交易，惟其所立基之虛擬資產於本法定義上非屬期貨交易法第三條所謂「商品、貨幣、有價證券、利率、指數或其他利益」，故似不宜以傳統金融法規完全套用。爰於第二項定明虛擬資產衍生之金融商品或金融服務，或以虛擬資產為標的之衍生性金融商品之相關業務範圍及規範、人員管理、客戶權益保障及風險管理等相關規則，授權由主管機關訂定；主管機關訂定前應徵詢同業公會之意見。復考量虛擬資產業之變化快速，主管機關允宜保持辦法一定彈性，最少應每月邀集同業公會檢視相關辦法；以符合產業國際發展趨勢。"},{"bill":"202110171550000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程。有關同業公會章程應記載事項、業務之規範與監督事項，及其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、主管機關對同業公會之事務應有管理權，以促進同業公會發揮自律組織之功能。爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關制定同業公會之規範。\n二、同業公會為推動公會事務之進行，得向會員收費以取得穩定財務收入。爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，於第二項明定同業公會之收費事項。"},{"bill":"202110199580000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項明定虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之許可要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會不得無正當理由拒絕虛擬資產服務商之加入。爰參考證券投資信託及顧問法第八十四條第一項後段規定，於第二項明定同業公會不得無故拒絕虛擬資產服務商加入。\n三、按虛擬資產同業公會本屬商業團體，原應適用商業團體法，僅主管機關基於虛擬資產同業公會涉及虛擬資產服務商健全發展之公益考量，故於本章對其設立、組織及監督等事項設有特別規定。惟除此之外，虛擬資產同業公會仍應回歸商業團體法之規範，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，於第三項明定同業公會適用商業團體法規定。"},{"bill":"202110203280000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。"},{"bill":"202110207150000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。"},{"bill":"202110206090000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。"},{"bill":"201110205640000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。"},{"bill":"202110209160000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、第一項定明主管機關對同業公會之監督權，以確保同業公會發揮自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定。\n二、第二項定明主管機關對同業公會理監事之監督權，以確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定。"},{"bill":"202110209890000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。"},{"bill":"202110214790000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。"},{"bill":"202110213930000","text":"虛擬資產服務商非加入同業公會，不得營業。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產服務商同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項定明虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之營業要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會無正當理由不得拒絕虛擬資產服務商之加入，參考證券投資信託及顧問法第八十四條第一項規定，爰為第一項及第二項規定。\n三、按虛擬資產服務商同業公會本屬商業團體，原應適用商業團體法，惟主管機關基於虛擬資產服務商有其專業性及特殊性以及市場健全發展等公益考量，故對其設立、組織及監督等事項設有特別規定，本法未規定者，虛擬資產服務商同業公會仍應適用商業團體法之規定，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，為第三項規定。"},{"bill":"202110217080000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。"}],"changed":true,"final":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","finalWhy":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。","review":null},{"no":"第三十二條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商非加入同業公會，不得營業。境外虛擬資產服務商，亦同。\n同業公會非有正當理由，不得拒絕虛擬資產服務商之加入，或就其加入附加不當之條件。\n同業公會之設立、組織及監督，除本法另有規定外，適用商業團體法之規定。","note":"一、虛擬資產同業公會可形成虛擬資產服務商之自律規則與自律管理，爰參考證券投資顧問事業設置標準第八條第四項規定，於第一項明定虛擬資產服務商加入同業公會之義務。\n二、加入同業公會為虛擬資產服務商之許可要件之一，涉及虛擬資產服務商之業務經營權益，故同業公會不得無正當理由拒絕虛擬資產服務商之加入。爰參考證券投資信託及顧問法第八十四條第一項後段規定，於第二項明定同業公會不得無故拒絕虛擬資產服務商加入。\n三、按虛擬資產同業公會本屬商業團體，原應適用商業團體法，僅主管機關基於虛擬資產同業公會涉及虛擬資產服務商健全發展之公益考量，故於本章對其設立、組織及監督等事項設有特別規定。惟除此之外，虛擬資產同業公會仍應回歸商業團體法之規範，爰參考期貨交易法第八十九條第二項及證券投資信託及顧問法第八十四條第二項規定，於第三項明定同業公會適用商業團體法規定。"},{"bill":"202110171550000","text":"主管機關基於保護公益或交易人權益，認有必要時，得命令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或命令同業公會予以解任。","note":"一、為確保同業公會公正客觀發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項明定主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項明定主管機關對同業公會理監事之監督權。"},{"bill":"202110199580000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程。有關同業公會章程應記載事項、業務之規範與監督事項，及其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、主管機關對同業公會之事務應有管理權，以促進同業公會發揮自律組織之功能。爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關制定同業公會之規範。\n二、同業公會為推動公會事務之進行，得向會員收費以取得穩定財務收入。爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，於第二項明定同業公會之收費事項。"},{"bill":"202110203280000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並提供會員受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。"},{"bill":"202110207150000","text":"同業公會得依章程之規定，對違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項之會員及其會員代表，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並應予受違規處置之會員救濟機會，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。"},{"bill":"202110206090000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並提供會員受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。"},{"bill":"201110205640000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並提供會員受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。"},{"bill":"202110209160000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、第一項定明同業公會對其會員或會員代表違反章程等事項之處置權，使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定。\n二、第二項定明同業公會應訂定自律規範供會員遵循，並提供受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定。"},{"bill":"202110209890000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並提供會員受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。"},{"bill":"202110214790000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並提供會員受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。"},{"bill":"202110213930000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程；同業公會章程應記載事項、監督事項、其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、為維護虛擬資產市場健全之公益性，定明同業公會訂定章程之考量因素，又主管機關對同業公會之事務仍應有監督管理權，以促進同業公會發揮自律組織之功能，爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關訂定同業公會監督等相關規範；又章程應記載事項包含業務範圍、規範等事項，併予敘明。\n二、同業公會為推動公會事務之進行，有自闢財源向會員收費以穩定財務收入之必要，爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，為第二項規定。"},{"bill":"202110217080000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並提供會員受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。"}],"changed":true,"final":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","finalWhy":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並提供會員受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。","review":null},{"no":"第三十三條","current":null,"versions":[{"bill":"202110137730000","text":"同業公會應基於健全虛擬資產業務之經營與發展、保障虛擬資產交易市場秩序、協調同業自律及促進虛擬資產產業創新之目的訂定其章程。有關同業公會章程應記載事項、業務之規範與監督事項，及其負責人與業務人員之資格條件、財務、業務及其他應遵行事項之規則，由主管機關定之。\n同業公會為發揮自律功能及配合虛擬資產業務之發展，得向其會員收取商業團體法所規定經費以外之必要費用；其種類及費率，由同業公會擬訂，報經主管機關備查。","note":"一、主管機關對同業公會之事務應有管理權，以促進同業公會發揮自律組織之功能。爰參考證券投資信託及顧問法第八十六條及期貨交易法第九十三條規定，於第一項授權主管機關制定同業公會之規範。\n二、同業公會為推動公會事務之進行，得向會員收費以取得穩定財務收入。爰參考期貨交易法第九十一條及證券投資信託及顧問法第八十七條規定，於第二項明定同業公會之收費事項。"},{"bill":"202110171550000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項明定同業公會對其會員或會員代表之處置權。\n二、為使同業公會得明確規範其會員之權利義務，爰參考證券投資信託及顧問法第八十九條規定，於第二項明定同業公會之制定規則權。"},{"bill":"202110199580000","text":"主管機關基於保護公益或交易人權益，認有必要時，得命令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或命令同業公會予以解任。","note":"一、為確保同業公會公正客觀發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項明定主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項明定主管機關對同業公會理監事之監督權。"},{"bill":"202110203280000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，為避免虛擬資產服務商與虛擬資產交易人間存在專業知能落差，致生虛擬資產交易爭議，爰參考金融消費者保護法第十三條第三項規定，於第一項定明同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其保護客戶、防制洗錢、資恐及詐騙之義務，應對其負責人及業務人員辦理教育訓練，為提升教育訓練成效，爰於第二項定明同業公會應協助虛擬資產服務商辦理上開教育訓練。"},{"bill":"202110207150000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，為避免虛擬資產服務商與虛擬資產交易人間存在專業知能落差，致生虛擬資產交易爭議，爰參考金融消費者保護法第十三條第三項規定，於第一項定明同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其保護客戶、防制洗錢、資恐及詐騙之義務，應對其負責人及業務人員辦理教育訓練，為提升教育訓練成效，爰於第二項定明同業公會應協助虛擬資產服務商辦理上開教育訓練。"},{"bill":"202110206090000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，為避免虛擬資產服務商與虛擬資產交易人間存在專業知能落差，致生虛擬資產交易爭議，爰參考金融消費者保護法第十三條第三項規定，於第一項定明同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其保護客戶、防制洗錢、資恐及詐騙之義務，應對其負責人及業務人員辦理教育訓練，為提升教育訓練成效，爰於第二項定明同業公會應協助虛擬資產服務商辦理上開教育訓練。"},{"bill":"201110205640000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，為避免虛擬資產服務商與虛擬資產交易人間存在專業知能落差，致生虛擬資產交易爭議，爰參考金融消費者保護法第十三條第三項規定，於第一項定明同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其保護客戶、防制洗錢、資恐及詐騙之義務，應對其負責人及業務人員辦理教育訓練，為提升教育訓練成效，爰於第二項定明同業公會應協助虛擬資產服務商辦理上開教育訓練。"},{"bill":"202110209160000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、第一項定明同業公會應定期辦理教育宣導，以避免服務商與交易人間存在專業知能落差而生交易爭議，爰參考金融消費者保護法第十三條第三項規定。\n二、第二項定明同業公會應協助服務商辦理教育訓練，以提升訓練成效及強化業者防制洗錢、資恐及詐騙之能力。"},{"bill":"202110209890000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，為避免虛擬資產服務商與虛擬資產交易人間存在專業知能落差，致生虛擬資產交易爭議，爰參考金融消費者保護法第十三條第三項規定，於第一項定明同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其保護客戶、防制洗錢、資恐及詐騙之義務，應對其負責人及業務人員辦理教育訓練，為提升教育訓練成效，爰於第二項定明同業公會應協助虛擬資產服務商辦理上開教育訓練。"},{"bill":"202110214790000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，為避免虛擬資產服務商與虛擬資產交易人間存在專業知能落差，致生虛擬資產交易爭議，爰參考金融消費者保護法第十三條第三項規定，於第一項定明同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其保護客戶、防制洗錢、資恐及詐騙之義務，應對其負責人及業務人員辦理教育訓練，為提升教育訓練成效，爰於第二項定明同業公會應協助虛擬資產服務商辦理上開教育訓練。"},{"bill":"202110213930000","text":"主管機關基於保護公益或交易人權益，認有必要時，得令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或令同業公會予以解任。","note":"一、為確保同業公會發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項定明主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項定明主管機關對同業公會理監事之監督權。"},{"bill":"202110217080000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，為避免虛擬資產服務商與虛擬資產交易人間存在專業知能落差，致生虛擬資產交易爭議，爰參考金融消費者保護法第十三條第三項規定，於第一項定明同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其保護客戶、防制洗錢、資恐及詐騙之義務，應對其負責人及業務人員辦理教育訓練，為提升教育訓練成效，爰於第二項定明同業公會應協助虛擬資產服務商辦理上開教育訓練。"}],"changed":true,"final":"同業公會應定期辦理對虛擬資產服務商、客戶或公眾之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。必要時，同業公會得辦理教育訓練。","finalWhy":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，虛擬資產服務商與虛擬資產交易人間可能存在專業落差，導致易生虛擬資產交易爭議。為加強對虛擬資產交易之教育宣導，爰參考金融消費者保護法第十三條第三項規定，於第一項明定同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其客戶保護、洗錢資恐及詐騙防制之義務，應對其負責人及業務人員辦理在職訓練。為提升在職訓練之成效，爰於第二項明定同業公會應協助虛擬資產服務商辦理上開在職訓練。並於必要時，得由同業公會自行辦理教育訓練。","review":null},{"no":"第三十四條","current":null,"versions":[{"bill":"202110137730000","text":"主管機關基於保護公益或交易人權益，認有必要時，得命令同業公會變更其章程、規則、決議，或提供參考、報告之資料，或為其他一定之行為。\n同業公會之理事或監事有違反法令、怠於實施該會章程或規則、濫用職權或違背誠實信用原則之行為者，主管機關得予糾正，或命令同業公會予以解任。","note":"一、為確保同業公會公正客觀發揮其自律組織功能，爰參考證券交易法第九十一條及證券投資信託及顧問法第九十條規定，於第一項明定主管機關對同業公會之監督權。\n二、為確保同業公會之健全經營，爰參考證券交易法第九十二條及證券投資信託及顧問法第九十一條規定，於第二項明定主管機關對同業公會理監事之監督權。"},{"bill":"202110171550000","text":"同業公會應定期辦理對虛擬資產服務商、客戶或公眾之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。必要時，同業公會得辦理教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，虛擬資產服務商與虛擬資產交易人間可能存在專業落差，導致易生虛擬資產交易爭議。為加強對虛擬資產交易之教育宣導，爰參考金融消費者保護法第十三條第三項規定，於第一項明定同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其客戶保護、洗錢資恐及詐騙防制之義務，應對其負責人及業務人員辦理在職訓練。為提升在職訓練之成效，爰於第二項明定同業公會應協助虛擬資產服務商辦理上開在職訓練。並於必要時，得由同業公會自行辦理教育訓練。"},{"bill":"202110199580000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項明定同業公會對其會員或會員代表之處置權。\n二、為使同業公會得明確規範其會員之權利義務，爰參考證券投資信託及顧問法第八十九條規定，於第二項明定同業公會之制定規則權。"},{"bill":"202110203280000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關定之，必要時得會商中央銀行或有關機關之意見檢討修正。","note":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法。另鑒於穩定幣多與法定貨幣掛鉤，中央銀行具專業權責，爰明定主管機關必要時得會商中央銀行或有關機關之意見檢討修正，以因應市場發展及風險變化適時調整。"},{"bill":"202110207150000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，並應會商中央銀行意見。其中運用場景包含得於交易平台使用、交易用途等，併予敘明。"},{"bill":"202110206090000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，並應會商中央銀行意見，其中運用場景包含得於交易平台使用、交易用途等，併予敘明。"},{"bill":"201110205640000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，並應會商中央銀行意見，其中運用場景包含得於交易平台使用、交易用途等，併予敘明。"},{"bill":"202110209160000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n演算法穩定幣不得申請本條之許可，任何人不得在我國境內發行演算法穩定幣；違反者，主管機關得命令立即停止發行並限期清退，並依第四十七條規定移送法辦。","note":"一、第一項至第四項定明穩定幣發行之許可制，許可前應會商中央銀行同意，爰參考歐盟MiCA規則第四十八條第一項規定；穩定幣發行人應限於股份有限公司，並授權訂定申請資格、程序、文件、運用場景及廢止許可等相關辦法。\n二、第五項為本法新增規定，爰明定演算法穩定幣不得申請本法之許可，任何人不得在我國境內發行演算法穩定幣，違反者由主管機關命令停止發行並限期清退，並依第四十七條移送法辦。二○二二年TerraUSD崩潰造成全球投資人鉅額損失，顯示演算法穩定幣因未以十足準備資產為支撐，具有根本性結構風險，有必要明文禁止，爰參考歐盟MiCA規則第十八條及美國GENIUS法第十四條規定。"},{"bill":"202110209890000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，並應會商中央銀行意見，其中運用場景包含得於交易平台使用、交易用途等，併予敘明。"},{"bill":"202110214790000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，並應會商中央銀行意見，其中運用場景包含得於交易平台使用、交易用途等，併予敘明。"},{"bill":"202110213930000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項定明同業公會對其會員或會員代表違反章程等事項之處置權。\n二、同業公會應訂定自律規範供會員遵循，並提供會員受違規處置之救濟途徑，爰參考證券投資信託及顧問法第八十九條規定，為第二項規定。"},{"bill":"202110217080000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，並應會商中央銀行意見，其中運用場景包含得於交易平台使用、交易用途等，併予敘明。"}],"changed":true,"final":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關定之，必要時得會商中央銀行、相關同業公會或有關機關之意見檢討修正。","finalWhy":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法。另鑑於穩定幣多與法定貨幣價值掛鉤，中央銀行就相關制度規劃及風險管理具專業權責：同業公會對市場實務運作、自律規範反風險控管亦具協力功能，爰明定主管機關必要時得會商中央銀行、同業公會及有關機關之意見，並適時檢討修正，以因應市場發展及風險變化。","review":null},{"no":"第三十五條","current":null,"versions":[{"bill":"202110137730000","text":"同業公會得依章程之規定，對會員及其會員代表違反章程、規章、自律公約、相關業務自律規範或會員大會或理事會決議等事項時，為必要之處置。\n同業公會應訂立會員自律公約及違規處置申復辦法，提經會員大會通過後，報請主管機關核定後實施；修正時，亦同。","note":"一、為使同業公會得以發揮自律功能，爰參考期貨交易法第九十四條及證券投資信託及顧問法第九十二條規定，於第一項明定同業公會對其會員或會員代表之處置權。\n二、為使同業公會得明確規範其會員之權利義務，爰參考證券投資信託及顧問法第八十九條規定，於第二項明定同業公會之制定規則權。"},{"bill":"202110171550000","text":"在我國境內發行穩定幣，應經主管機關許可。\n主管機關為前項之許可前，應洽商中央銀行意見。\n非經主管機關許可發行或同意交易之穩定幣，虛擬資產服務商不得提供涉及該穩定幣之第六條第一項各款服務。其申請同意之程序極其他應遵行事項之規則，由主管機關會商中央銀行後定之。\n申請第一項許可之發行人資格條件、申請程序、得發行之穩定幣種類、廢止許可事由及其他應遵行事項之辦法，由主管機關洽商中央銀行定之。","note":"一、穩定幣之發行涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要。爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國境內發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應洽商中央銀行意見。\n二、為保障交易人權益，於第三項定明非經主管機關許可發行或同意交易之穩定幣，虛擬資產服務商不得提供涉及該穩定幣之第六條第一項各款服務，並授權主管機關會商中央銀行後訂定申請同意之相關規則。\n三、於第三項授權主管機關訂定申請第一項許可之發行人資格條件、申請程序、得發行之穩定幣種類、廢止許可事由及其他應遵行事項之辦法，並應洽商中央銀行意見。"},{"bill":"202110199580000","text":"同業公會應定期辦理對虛擬資產服務商、虛擬資產交易人、客戶及公眾之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，虛擬資產服務商與虛擬資產交易人間可能存在專業落差，導致易生虛擬資產交易爭議。為加強對虛擬資產交易之教育宣導，爰參考金融消費者保護法第十三條第三項規定，於第一項明定同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其客戶保護、洗錢資恐及詐騙防制之義務，應對其負責人及業務人員辦理在職訓練。為提升在職訓練之成效，爰於第二項明定同業公會應協助虛擬資產服務商辦理上開在職訓練。"},{"bill":"202110203280000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣依前條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。"},{"bill":"202110207150000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣依第三十四條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。"},{"bill":"202110206090000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣依第三十四條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。"},{"bill":"201110205640000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣依第三十四條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。"},{"bill":"202110209160000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣屬下列情形之一，始得提供服務：\n一、依第三十四條第一項規定，已在我國取得許可發行之穩定幣。\n二、依本條第二項，已獲主管機關公告列入「境外穩定幣認可名單」之境外穩定幣。\n主管機關應建立境外穩定幣認可制度，凡符合下列全部條件之境外穩定幣，得申請列入認可名單，各虛擬資產服務商毋須就同一穩定幣逐案申請同意交易：\n一、在一個以上等效國家已依法取得監理核可。\n二、發行人保有十足法定貨幣準備資產，並經認可法域之主管機關或獨立審計機構定期查核。\n三、持幣人得隨時依面額贖回，且於一個營業日內完成贖回。\n四、發行人指定我國境內之法律代理人，並承諾配合主管機關之監理要求。\n五、發行人同意接受我國主管機關關於洗錢防制及消費者保護規定之適用。\n六、無演算法穩定幣之性質，準備資產以十足法定貨幣為支撐。\n主管機關應於收到完整申請文件後六十日內作成決定，並公告認可名單；名單至少每半年更新，並即時公告撤銷或暫停認可之情形；已認可之境外穩定幣不再符合資格時，相關服務商應於公告後九十日內完成下架。\n境外穩定幣承認之申請程序、審查標準、認可名單管理及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"一、本條修訂原逐案申請制度，改採「公告認可名單制度」。原制度由各服務商就欲上架之境外穩定幣逐案向主管機關申請同意交易，同一穩定幣可能由不同平台重複申請，行政成本高且准駁結果可能不一致，不利國際通用穩定幣在我國流通。\n二、認可名單制度使符合條件之境外穩定幣由發行人一次性申請列入認可名單，各服務商毋須逐案申請，大幅降低行政成本並提升監管一致性；六項認可條件確保認可之境外穩定幣達到與本法穩定幣同等之保護水準。\n三、六十日審查期限、至少每半年更新及九十日下架緩衝期，兼顧效率與持續合規監理，爰參考歐盟MiCA規則第一百一十一條至第一百一十四條及美國GENIUS法第十八條規定。"},{"bill":"202110209890000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣依第三十四條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。"},{"bill":"202110214790000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣依第三十四條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。"},{"bill":"202110213930000","text":"同業公會應定期辦理對虛擬資產服務商及虛擬資產交易人之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，為避免虛擬資產服務商與虛擬資產交易人間存在專業知能落差，致生虛擬資產交易爭議，爰參考金融消費者保護法第十三條第三項規定，於第一項定明同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其保護客戶、防制洗錢、資恐及詐騙之義務，應對其負責人及業務人員辦理教育訓練，為提升教育訓練成效，爰於第二項定明同業公會應協助虛擬資產服務商辦理上開教育訓練。"},{"bill":"202110217080000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣依第三十四條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。"}],"changed":true,"final":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，除經主管機關另有規定者外，應確保該穩定幣依第三十四條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","finalWhy":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。","review":null},{"no":"第三十六條","current":null,"versions":[{"bill":"202110137730000","text":"同業公會應定期辦理對虛擬資產服務商、客戶或公眾之教育宣導。\n同業公會應協助虛擬資產服務商辦理其負責人及業務人員之教育訓練。必要時，同業公會得辦理教育訓練。","note":"一、虛擬資產交易具有一定之金融、科技及法律專業門檻，虛擬資產服務商與虛擬資產交易人間可能存在專業落差，導致易生虛擬資產交易爭議。為加強對虛擬資產交易之教育宣導，爰參考金融消費者保護法第十三條第三項規定，於第一項明定同業公會應定期辦理虛擬資產交易教育宣導。\n二、虛擬資產服務商基於其客戶保護、洗錢資恐及詐騙防制之義務，應對其負責人及業務人員辦理在職訓練。為提升在職訓練之成效，爰於第二項明定同業公會應協助虛擬資產服務商辦理上開在職訓練。並於必要時，得由同業公會自行辦理教育訓練。"},{"bill":"202110171550000","text":"穩定幣發行人應設置與維持足額之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，其準備資產應包括足額繳存之準備金。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人之債權人不得對前項準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第一項之準備資產不屬於其破產財團。\n穩定幣發行人除依主管機關許可之事由外，不得動用第一項之準備資產。\n第一項準備資產之設置與動用、穩定幣之發行與贖回、穩定幣發行人之管理及其他應遵行事項之辦法，由主管機關洽商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、穩定幣發行人為維持穩定幣之價值穩定，應設置與維持足額之準備資產，並儲存於境內之金融機構，以供穩定幣持有人贖回之用，且該準備資產應與穩定幣發行人之自有財產隔離，並進行定期查核，爰參考歐盟MiCA規則第三十六條第一項、第三項置第五項定明穩定幣發行人建置與維持足額準備資產，並進行定期查核之義務、準備資產之法律性質以及穩定幣發行人動用準備資產之權限。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法令所稱存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，其準備資產應包括足額繳存之準備金，並於第七項授權由中央銀行洽商主管機關訂定相關事項之辦法。\n三、參考電子支付機構管理條例第六條第一款規定，於第二項後段規定穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n四、於第六項授權主管機訂定第一項準備資產之設置、動用與定期查核、穩定幣之發行、贖回與資訊揭露、穩定幣發行人之管理及其他應遵行事項之辦法，並應洽商中央銀行意見。"},{"bill":"202110199580000","text":"在我國發行穩定幣，應經主管機關許可。\n主管機關為前項之許可前，應洽商中央銀行意見。\n非經主管機關許可發行或同意交易之穩定幣，虛擬資產服務商不得提供涉及該穩定幣之第六條第一項各款服務，但符合主管機關依其規模、型態及其他必要情況所定條件者，不在此限。其申請同意之程序及其他應遵行事項之規則，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、得發行之穩定幣種類、運用場景、廢止許可事由及其他應遵行事項之辦法，由主管機關洽商中央銀行定之。","note":"一、穩定幣之發行涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要。爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應洽商中央銀行意見。\n二、為保障交易人權益，於第三項定明非經主管機關許可發行或同意交易之穩定幣，虛擬資產服務商不得提供涉及該穩定幣之第六條第一項各款服務，惟為避免已在國際流通之海外穩定幣因行政程序等因素，導致影響國內市場交易，特許主管機關依實務情況開放，以利實施監管同時保障市場之開放性，並授權主管機關訂定申請同意之相關規則。\n三、於第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請程序、得發行之穩定幣種類、運用場景、廢止許可事由及其他應遵行事項之辦法，並應洽商中央銀行意見。"},{"bill":"202110203280000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。"},{"bill":"202110207150000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。"},{"bill":"202110206090000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。"},{"bill":"201110205640000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。"},{"bill":"202110209160000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，且應全數信託予金融機構保管，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、第一項定明穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，供持幣人贖回，且準備資產應與發行人之自有財產分別獨立，且應全數信託予金融機構保管，並進行定期查核，爰參考美國GENIUS法第四條第一項第一款、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定。\n二、第二項定明達一定金額者應繳存準備金，以保持準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定；外匯部分應依中央銀行規定辦理；準備金繳存比率等相關事項授權中央銀行會商主管機關訂定。\n三、第三項定明準備資產動用之限制；第四項授權主管機關就準備資產之設置、動用與查核訂定辦法，保留彈性，俾主管機關得依市場發展逐步調整準備資產之適格範圍。"},{"bill":"202110209890000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。"},{"bill":"202110214790000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。"},{"bill":"202110213930000","text":"在我國發行穩定幣，應由發行人向主管機關申請許可。\n主管機關為前項許可前，應會商中央銀行同意。\n申請第一項許可之穩定幣發行人以股份有限公司為限，其最低實收資本額，由主管機關定之。\n申請第一項許可之發行人資格條件、申請程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、發行穩定幣涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要，爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應會商中央銀行同意。\n二、為確保穩定幣發行人財務健全，具備持續維持準備資產之能力，爰於第三項定明穩定幣發行人應限於股份有限公司之組織，並授權主管機關訂定穩定幣發行人之最低實收資本額。\n三、第四項授權主管機關訂定申請第一項許可之發行人資格條件、申請許可程序、應檢附書件、得發行之穩定幣種類、運用場景、廢止許可及其他應遵行事項之辦法，並應會商中央銀行意見，其中運用場景包含得於交易平台使用、交易用途等，併予敘明。"},{"bill":"202110217080000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。"}],"changed":true,"final":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，除依第二項規定繳存之準備金外，應全數信託予金融機構保管，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","finalWhy":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。又考量準備資產中可能有部分須依中央銀行規定繳存準備金，爰於第一項明定準備資產扣除繳存準備金後之餘額應全數交付信託，使穩定幣之準備資產受有充分保障，並避免適用衝突。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。","review":null},{"no":"第三十七條","current":null,"versions":[{"bill":"202110137730000","text":"在我國境內發行穩定幣，應經主管機關許可。\n主管機關為前項之許可前，應洽商中央銀行意見。\n非經主管機關許可發行或同意交易之穩定幣，虛擬資產服務商不得提供涉及該穩定幣之第六條第一項各款服務。其申請同意之程序極其他應遵行事項之規則，由主管機關會商中央銀行後定之。\n申請第一項許可之發行人資格條件、申請程序、得發行之穩定幣種類、廢止許可事由及其他應遵行事項之辦法，由主管機關洽商中央銀行定之。","note":"一、穩定幣之發行涉及向大眾吸收資金、客戶資產之保管以及穩定幣發行人之債務償還能力，有特別管理之需要。爰參考歐盟MiCA規則第四十八條第一項規定，於第一項定明在我國境內發行穩定幣係採許可制，並於第二項定明主管機關為第一項之許可前應洽商中央銀行意見。\n二、為保障交易人權益，於第三項定明非經主管機關許可發行或同意交易之穩定幣，虛擬資產服務商不得提供涉及該穩定幣之第六條第一項各款服務，並授權主管機關會商中央銀行後訂定申請同意之相關規則。\n三、於第三項授權主管機關訂定申請第一項許可之發行人資格條件、申請程序、得發行之穩定幣種類、廢止許可事由及其他應遵行事項之辦法，並應洽商中央銀行意見。"},{"bill":"202110171550000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人所受之損害，應負賠償責任。","note":"一、虛擬資產市場具有高度資訊敏感性，容易受到市場內外之不實資訊而影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為。爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項明定禁止於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）之虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n二、虛擬資產詐欺以提供之不實資訊涉及重大影響虛擬資產發行或交易之資訊為前提。爰參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項以及「證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法」第二條第十八款及第三條第五款規定，於第二項明定重大影響虛擬資產發行或交易之資訊之定義。\n三、虛擬資產詐欺之行為人應就其對善意交易人造成之損害負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，於第三項明定虛擬資產詐欺之損害賠償責任。\n四、虛擬資產交易市場具有高度資訊敏感性，有心人士可能利用操縱行為影響虛擬資產的價格或供給，從而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員國應規範虛擬資產市場之操縱行為。爰參考歐盟MiCA規則第九十一條第二項與第三項、日本金融商品取引法第一百八十五條之二十三與第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項明定禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象之操縱行為。本項之操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約；自行或與他人共謀提高、維持或降低虛擬資產之交易價格；自行或與他人共謀提高、維持或降低虛擬資產之供需；散布流言或不實資訊；以非法方法中斷、延遲或危害虛擬資產服務商功能正常運作以及其他直接或間接影響虛擬資產交易之操縱行為。\n五、虛擬資產操縱行為人應就其對善意交易人造成之損害負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，於第五項明定虛擬資產操縱行為之損害賠償責任。又因操縱行為以具有不法之操縱意圖為要件，故此之損害賠償責任解釋上屬故意責任，併予敘明。"},{"bill":"202110199580000","text":"穩定幣發行人應設置與維持足額之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行有關資料。\n除本法、其他法律或主管機關另有規定者外，穩定幣發行人不得拒絕穩定幣持有人申請贖回。穩定幣發行人之債權人不得對第一項準備資產為任何之請求或行使其他權利。\n穩定幣持有人對於第一項準備資產，有優先受清償之權。穩定幣發行人破產時，第一項之準備資產不屬於其破產財團。\n穩定幣發行人除依主管機關許可之事由外，不得動用第一項之準備資產。\n第一項準備資產之設置、動用與定期查核、穩定幣之發行、贖回與資訊揭露、穩定幣發行人之管理及其他應遵行事項之辦法，由主管機關洽商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行洽商主管機關定之。","note":"一、穩定幣發行人為維持穩定幣之價值穩定，應設置與維持足額之準備資產，並儲存於境內之金融機構，以供穩定幣持有人贖回之用，且該準備資產應與穩定幣發行人之自有財產隔離，並進行定期查核，爰參考歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，於第一項定明穩定幣發行人建置與維持足額準備資產，並進行定期查核之義務。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法令所稱存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入前項準備資產，並於第八項授權由中央銀行洽商主管機關訂定相關事項之辦法。\n三、參考電子支付機構管理條例第六條第一款規定，於第二項後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n四、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行有關資料之規定。\n五、為保障穩定幣持有人之權益，於第四項前段定明穩定幣發行人原則不得拒絕持有人贖回穩定幣，並於第四項後段定明穩定幣發行人之債權人不得對第一項準備資產行使權利。\n六、於第五項定明穩定幣持有人對於第一項準備資產有優先受清償之權，以及穩定幣發行人破產時，第一項之準備資產不屬於其破產財團。\n七、於第六項定明穩定幣發行人動用準備資產之權限。\n八、於第七項授權主管機關訂定第一項準備資產之設置、動用與定期查核、穩定幣之發行、贖回與資訊揭露、穩定幣發行人之管理及其他應遵行事項之辦法，並應洽商中央銀行意見。"},{"bill":"202110203280000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、參考歐盟MiCA規則第四十九條規定，於第一項定明穩定幣發行人應以面額發行及贖回穩定幣。\n二、考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法Section 4(11)、歐盟MiCA規則第四十條第一項及第五十條第一項規定，於第二項定明穩定幣發行人就其於我國境內發行之穩定幣，不得支付任何形式之利息或收益。\n三、為保障穩定幣持有人之權益，於第三項定明穩定幣發行人除依其他法律或符合主管機關規定之特殊情形外，不得拒絕持有人贖回穩定幣。\n四、第四項授權主管機關訂定穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，並應會商中央銀行意見。"},{"bill":"202110207150000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回。但依其他法律或主管機關另有規定者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、參考歐盟MiCA規則第四十九條規定，於第一項定明穩定幣發行人應以面額發行及贖回穩定幣。\n二、考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法Section 4（a）(11)、歐盟MiCA規則第四十條第一項及第五十條第一項規定，於第二項定明穩定幣發行人就其於我國境內發行之穩定幣，不得支付任何形式之利息或收益。\n三、為保障穩定幣持有人之權益，於第三項定明穩定幣發行人除依其他法律或符合主管機關規定之特殊情形外，不得拒絕持有人贖回穩定幣。\n四、第四項授權主管機關訂定穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，並應會商中央銀行意見。"},{"bill":"202110206090000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、參考歐盟MiCA規則第四十九條規定，於第一項定明穩定幣發行人應以面額發行及贖回穩定幣。\n二、考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法Section 4(11)、歐盟MiCA規則第四十條第一項及第五十條第一項規定，於第二項定明穩定幣發行人就其於我國境內發行之穩定幣，不得支付任何形式之利息或收益。\n三、為保障穩定幣持有人之權益，於第三項定明穩定幣發行人除依其他法律或符合主管機關規定之特殊情形外，不得拒絕持有人贖回穩定幣。\n四、第四項授權主管機關訂定穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，並應會商中央銀行意見。"},{"bill":"201110205640000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、參考歐盟MiCA規則第四十九條規定，於第一項定明穩定幣發行人應以面額發行及贖回穩定幣。\n二、考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法Section 4(11)、歐盟MiCA規則第四十條第一項及第五十條第一項規定，於第二項定明穩定幣發行人就其於我國境內發行之穩定幣，不得支付任何形式之利息或收益。\n三、為保障穩定幣持有人之權益，於第三項定明穩定幣發行人除依其他法律或符合主管機關規定之特殊情形外，不得拒絕持有人贖回穩定幣。\n四、第四項授權主管機關訂定穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，並應會商中央銀行意見。"},{"bill":"202110209160000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回，且應於收到贖回申請後一個營業日內完成贖回。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、第一項定明穩定幣發行人應以面額發行及贖回穩定幣，爰參考歐盟MiCA規則第四十九條規定。\n二、第二項定明不得支付任何形式之利息或收益，考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法第四條第十一款、歐盟MiCA規則第四十條第一項及第五十條第一項規定。\n三、第三項本文增訂穩定幣發行人應於收到贖回申請後一個營業日內完成贖回，以確保持幣人能及時取回資金，防範流動性風險，爰參考美國GENIUS法第四條第一項第一款第B目及歐盟MiCA規則第四十九條第三項規定。\n四、第四項授權主管機關會商中央銀行訂定穩定幣發行與贖回之程序及方式辦法。"},{"bill":"202110209890000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、參考歐盟MiCA規則第四十九條規定，於第一項定明穩定幣發行人應以面額發行及贖回穩定幣。\n二、考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法Section 4(11)、歐盟MiCA規則第四十條第一項及第五十條第一項規定，於第二項定明穩定幣發行人就其於我國境內發行之穩定幣，不得支付任何形式之利息或收益。\n三、為保障穩定幣持有人之權益，於第三項定明穩定幣發行人除依其他法律或符合主管機關規定之特殊情形外，不得拒絕持有人贖回穩定幣。\n四、第四項授權主管機關訂定穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，並應會商中央銀行意見。"},{"bill":"202110214790000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、參考歐盟MiCA規則第四十九條規定，於第一項定明穩定幣發行人應以面額發行及贖回穩定幣。\n二、考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法Section 4(11)、歐盟MiCA規則第四十條第一項及第五十條第一項規定，於第二項定明穩定幣發行人就其於我國境內發行之穩定幣，不得支付任何形式之利息或收益。\n三、為保障穩定幣持有人之權益，於第三項定明穩定幣發行人除依其他法律或符合主管機關規定之特殊情形外，不得拒絕持有人贖回穩定幣。\n四、第四項授權主管機關訂定穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，並應會商中央銀行意見。"},{"bill":"202110213930000","text":"虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，應確保該穩定幣依第三十六條第一項規定許可發行或經申請主管機關同意交易，始得提供服務；虛擬資產服務商申請同意交易之程序、條件、廢止及其他應遵行事項之規則，由主管機關會商中央銀行定之。","note":"為保障交易人權益，於本條定明虛擬資產服務商提供第六條第一項各款服務涉及穩定幣者，限於經主管機關許可於我國發行之穩定幣，或雖非於我國發行，但經主管機關同意於我國交易之穩定幣，並授權主管機關會商中央銀行訂定虛擬資產服務商申請同意穩定幣交易之相關規則。"},{"bill":"202110217080000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、參考歐盟MiCA規則第四十九條規定，於第一項定明穩定幣發行人應以面額發行及贖回穩定幣。\n二、考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法Section 4(11)、歐盟MiCA規則第四十條第一項及第五十條第一項規定，於第二項定明穩定幣發行人就其於我國境內發行之穩定幣，不得支付任何形式之利息或收益。\n三、為保障穩定幣持有人之權益，於第三項定明穩定幣發行人除依其他法律或符合主管機關規定之特殊情形外，不得拒絕持有人贖回穩定幣。\n四、第四項授權主管機關訂定穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，並應會商中央銀行意見。"}],"changed":true,"final":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回，且應於收到贖回申請後儘速完成贖回。但依其他法律或主管機關另有規定者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","finalWhy":"照行政院提案修正通過。,,,,,,","review":null},{"no":"第三十八條","current":null,"versions":[{"bill":"202110137730000","text":"穩定幣發行人應設置與維持足額之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，其準備資產應包括足額繳存之準備金。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人之債權人不得對前項準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第一項之準備資產不屬於其破產財團。\n穩定幣發行人除依主管機關許可之事由外，不得動用第一項之準備資產。\n第一項準備資產之設置與動用、穩定幣之發行與贖回、穩定幣發行人之管理及其他應遵行事項之辦法，由主管機關洽商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、穩定幣發行人為維持穩定幣之價值穩定，應設置與維持足額之準備資產，並儲存於境內之金融機構，以供穩定幣持有人贖回之用，且該準備資產應與穩定幣發行人之自有財產隔離，並進行定期查核，爰參考歐盟MiCA規則第三十六條第一項、第三項置第五項定明穩定幣發行人建置與維持足額準備資產，並進行定期查核之義務、準備資產之法律性質以及穩定幣發行人動用準備資產之權限。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法令所稱存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，其準備資產應包括足額繳存之準備金，並於第七項授權由中央銀行洽商主管機關訂定相關事項之辦法。\n三、參考電子支付機構管理條例第六條第一款規定，於第二項後段規定穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n四、於第六項授權主管機訂定第一項準備資產之設置、動用與定期查核、穩定幣之發行、贖回與資訊揭露、穩定幣發行人之管理及其他應遵行事項之辦法，並應洽商中央銀行意見。"},{"bill":"202110171550000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時命令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務或業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；如發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他主管機關或命令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人應有檢查權，其檢查範圍及於上述之人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料，包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制或其他有關資料物件。爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，於本條明定主管機關之檢查權。\n二、為協助主管機關為財務業務之檢查，爰參考期貨交易法第六條第三項、第九十九條第一項之規定及證券投資信託及顧問法第一百零一條規定，於第三項明定主管機關得請求其他主管機關或命令金融機構提供必要資訊或紀錄，所稱金融機構，係指受主管機關監管對大眾提供金融服務之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業。"},{"bill":"202110199580000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n除發行人外，如能證明已盡相當注意，且有正當理由可合理確信其內容無虛偽或隱匿之情事者，不受本條第一項及前項之規範。\n對於虛擬資產，除虛擬資產服務商依其內部控管程序及主管機關規範，為維持交易市場價格衡平所為之必要措施外，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人所受之損害，應負賠償責任。","note":"一、虛擬資產市場具有高度資訊敏感性，容易受到市場內外之不實資訊而影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為。爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項明定禁止於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）之虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n二、虛擬資產詐欺以提供之不實資訊涉及重大影響虛擬資產發行或交易之資訊為前提。爰參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項以及「證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法」第二條第十八款及第三條第五款規定，於第二項明定重大影響虛擬資產發行或交易之資訊之定義。\n三、虛擬資產詐欺之行為人應就其對善意交易人造成之損害負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，於第三項明定虛擬資產詐欺之損害賠償責任。\n四、參考證券交易法第二十條之一第二項規定，保留已善盡應盡之義務者的免責空間。\n五、虛擬資產交易市場具有高度資訊敏感性，有心人士可能利用操縱行為影響虛擬資產的價格或供給，從而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員國應規範虛擬資產市場之操縱行為。爰參考歐盟MiCA規則第九十一條第二項與第三項、日本金融商品取引法第一百八十五條之二十三與第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第五項明定禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象之操縱行為。本項之操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約；自行或與他人共謀提高、維持或降低虛擬資產之交易價格；自行或與他人共謀提高、維持或降低虛擬資產之供需；散布流言或不實資訊；以非法方法中斷、延遲或危害虛擬資產服務商功能正常運作以及其他直接或間接影響虛擬資產交易之操縱行為，惟虛擬資產市場波動劇烈，適度的造市行為有助於降低滑價（Slippage），保護投資人免於極端波動傷害。是以應區別「意圖獲取不法利益之操縱」與「意圖維持市場秩序之管理」，以避免產生法律上的寒蟬效應，導致服務商不敢提供流動性，爰此排除虛擬資產服務商在規範下之適度造市行為。\n六、虛擬資產操縱行為人應就其對善意交易人造成之損害負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，於第六項明定虛擬資產操縱行為之損害賠償責任。又因操縱行為以具有不法之操縱意圖為要件，故此之損害賠償責任解釋上屬故意責任，併予敘明。"},{"bill":"202110203280000","text":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","note":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十六條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。"},{"bill":"202110207150000","text":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","note":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十六條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。"},{"bill":"202110206090000","text":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","note":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十六條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。"},{"bill":"201110205640000","text":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","note":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十六條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。"},{"bill":"202110209160000","text":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權，其優先順位優先於稅捐及特定工資債權以外之一切其他債權人。\n法院就準備資產之返還裁定，應以最速件處理，並於受理聲請後十四日內作成裁定。","note":"一、第一項定明非穩定幣持有人不得對準備資產行使任何權利，爰為保障穩定幣持有人之權益。\n二、第二項強化持有人優先受償之法律位階，明確其優先順位優先於稅捐及特定工資債權以外之一切其他債權人，確立準備資產不入破產財團且具法律位階之第一順位優先受償權，爰參考美國GENIUS法第十一條第一項第一款及歐盟MiCA規則第七十五條第七項規定。\n三、第三項爰明定法院就準備資產之返還裁定應以最速件處理，並於受理聲請後十四日內作成裁定，以縮短持幣人等待返還之期間，爰參考美國GENIUS法第十一條規定。"},{"bill":"202110209890000","text":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","note":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十六條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。"},{"bill":"202110214790000","text":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","note":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十六條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。"},{"bill":"2
