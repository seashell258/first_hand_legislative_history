versions":[{"bill":"202110137730000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序、內部稽核人員應具備之資格條件、委託會計師、律師或其他適當機構辦理內部控制查核範圍及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應自行建立幣流分析調查專責人員及專責主管；其專責人員及專責主管應具備之資格條件、委託律師或其他適當機構辦理幣流分析調查範圍及其他應遵行事項之準則，由主管機關定之。\n虛擬資產金融服務商辦理虛擬資產衍生性之商品或服務業務或以虛擬資產為標的之衍生性金融商品業務，對該業務範圍、人員管理、客戶權益保障及風險管理，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"一、虛擬資產服務商應建立與維持有效與健全的內部控制及稽核制度，以控管其業務相關風險與遵循相關法令。爰於第一項明定虛擬資產服務商建立內部控制及稽核制度之義務，並參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條規定等規定，明定虛擬資產服務商內部控制及稽核制度應具備之內容。\n二、為強化虛擬資產服務商協助反洗錢、反資恐及資武擴，並配合我國目前打擊詐欺犯罪之政策走向，爰於第二項明定虛擬資產服務商應自行建立幣流分析調查專責人員，並應設置專責主管。惟相關人員應具備之資格條件、委託律師或其他適當機構辦理幣流分析調查之範圍及其他應遵行事項之準則，由主管機關定之。\n三、虛擬資產金融服務商辦理虛擬資產衍生之商品或服務或以虛擬資產為標的之金融商品業務，應建立內部作業制度及程序，以健全虛擬資產金服商之風險管理並保障客戶權益，爰於第三項明定，並授權主管機關針對其辦理該業務範圍、人員管理、客戶權益保障及風險管理等，於徵詢同業公會意見後，訂定辦法。"},{"bill":"202110171550000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序、內部稽核人員應具備之資格條件、委託會計師、律師或其他適當機構辦理內部控制查核範圍及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應自行建立幣流分析調查專責人員及專責主管；其專責人員及專責主管應具備之資格條件、委託律師或其他適當機構辦理幣流分析調查範圍及其他應遵行事項之準則，由主管機關定之。\n虛擬資產金融服務商辦理虛擬資產衍生性之商品或服務業務或以虛擬資產為標的之衍生性金融商品業務，對該業務範圍、人員管理、客戶權益保障及風險管理，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"一、虛擬資產服務商應建立與維持有效與健全的內部控制及稽核制度，以控管其業務相關風險與遵循相關法令。爰於第一項明定虛擬資產服務商建立內部控制及稽核制度之義務，並參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條規定等規定，明定虛擬資產服務商內部控制及稽核制度應具備之內容。\n二、為強化虛擬資產服務商協助反洗錢、反資恐及資武擴，並配合我國目前打擊詐欺犯罪之政策走向，爰於第二項明定虛擬資產服務商應自行建立幣流分析調查專責人員，並應設置專責主管。惟相關人員應具備之資格條件、委託律師或其他適當機構辦理幣流分析調查之範圍及其他應遵行事項之準則，由主管機關定之。\n三、虛擬資產金融服務商辦理虛擬資產衍生之商品或服務或以虛擬資產為標的之金融商品業務，應建立內部作業制度及程序，以健全虛擬資產金服商之風險管理並保障客戶權益，爰於第三項明定，並授權主管機關針對其辦理該業務範圍、人員管理、客戶權益保障及風險管理等，於徵詢同業公會意見後，訂定辦法。"},{"bill":"202110199580000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應訂定資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施與程序；其辦法，由主管機關定之。","note":"虛擬資產服務商應建立與維持有效與健全的內部控制及稽核制度，以控管其業務相關風險與遵循相關法令。爰於第一項明定虛擬資產服務商建立內部控制及稽核制度之義務，並參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條規定等規定，明定虛擬資產服務商內部控制及稽核制度應具備之內容，並授權主管機關訂定相關規範。"},{"bill":"202110203280000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序，主管機關得定期辦理資安檢查；其辦法，由主管機關定之，必要時得會商數位發展部或有關機關之意見。","note":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策。又鑒於虛擬資產服務涉及高度數位化、網路化之交易環境，資通安全風險對交易秩序、用戶權益及市場穩定影響重大，爰規定主管機關得定期辦理資安檢查，以強化對虛擬資產服務商資安管理之監理密度與風險控管。另考量數位發展部就資通安全政策、制度及技術面向具專業權責，為利相關辦法之訂定更臻周延，爰明定主管機關於必要時，得會商數位發展部或有關機關之意見。"},{"bill":"202110207150000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之。","note":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、鑑於各項虛擬資產業務均高度仰賴資通系統，其安全性與交易人、客戶權益至為相關，虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策。爰參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條等規定，為第二項規定。"},{"bill":"202110206090000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之。","note":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策，爰參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條等規定，為第二項規定。"},{"bill":"201110205640000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之。","note":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策，爰參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條等規定，為第二項規定。"},{"bill":"202110209160000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之。","note":"一、第一項定明虛擬資產服務商應依主管機關訂定之準則建立有效之內部控制及稽核制度，以控管業務相關風險與遵循相關法令。\n二、第二項定明應建立資通系統安全管理制度及營運持續性政策，爰參考IOSCO最終報告建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第十二條之三規定。"},{"bill":"202110209890000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之。","note":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策，爰參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條等規定，為第二項規定。"},{"bill":"202110214790000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之。","note":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策，爰參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條等規定，為第二項規定。"},{"bill":"202110213930000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之。","note":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策，爰參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條等規定，為第二項規定。"},{"bill":"202110217080000","text":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之。\n虛擬資產服務商應依其業務性質及風險程度，建立虛擬資產交易監測機制，對交易對象之錢包地址進行風險辨識，並於交易前、交易中及交易後進行風險評估；對於高風險交易，應採取升級審查、延遲執行、拒絕交易或申報等處置。\n前項交易監測機制之系統標準、地址風險辨識方式、風險分級、警示處理、人工覆核、資料保存及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策，爰參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條等規定，為第二項規定。\n三、虛擬資產與傳統金融最大差異在於資金流直接存在於公鏈，僅憑確認客戶身分無法判斷資金是否來自詐欺、駭客、混幣服務或受制裁地址，必須將交易監測與鏈上地址風險辨識納入法定內控項目。綜上，服務商有交易監測與風險評估義務爰為第三項規定。並於第四項授權主管機關訂定系統標準與資料保存等事項，與第二十三條紀錄保存規定相互配合。（並參酌國際證券管理機構組織IOSCO最終報告建議十七及防制洗錢金融行動工作組織FATF四十項建議，請自行核對最新版本。）"}],"changed":true,"final":"虛擬資產服務商應建立內部控制及稽核制度；其目的、原則、政策、作業程序及其他應遵行事項之準則，由主管機關定之。\n虛擬資產服務商應建立資通系統之安全管理制度、營運資訊之管理及保密政策、營運持續性政策，並採取適當措施及程序；其辦法，由主管機關定之，必要時得會商數位發展部或有關機關。","finalWhy":"一、虛擬資產服務商應依主管機關訂定之準則建立與維持有效與健全之內部控制及稽核制度，以控管其業務相關風險與遵循相關法令，爰為第一項規定。\n二、虛擬資產服務商應依主管機關訂定之辦法建立穩定與安全之資通系統安全管理制度以確保其資通安全，及訂定營運持續性政策以確保其持續營運，並對營運相關資訊設置管理及保密政策，爰參考IOSCO最終報告之建議十七、歐盟MiCA規則第六十八條第七項、日本支付服務法第六十三條之八、日本關於加密資產交換業者之內閣府令第十三條及香港適用於虛擬資產交易平台營運者的指引第12.3條等規定，為第二項規定。另考量數位發展部就資通安全政策、制度及技術面向具專業權責，為利相關辦法之訂定更臻周延，爰明定主管機關於必要時，得會商數位發展部或有關機關。","review":null},{"no":"第十五條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商應建置符合一定水準之資訊系統，以確保客戶及交易資料之隱密性及安全性，並維持資料傳輸、交換或處理之正確性。\n虛擬資產服務商辦理業務之資訊系統標準及安全控管作業基準，由同業公會擬定，報請主管機關備查之；變更時亦同。\n虛擬資產服務商為因應資安事件，應訂定通報及應變機制。\n虛擬資產服務商於知悉資安事件時，應向主管機關通報。\n虛擬資產服務商應向主管機關提出資安事件調查、處理及改善報告；如為重大資安事件者，並應送交主管機關。\n前三項通報及應變機制之必要事項、通報內容、報告之提出及其他應遵行事項之辦法，由主管機關定之。","note":"一、鑒於虛擬資產服務業係二十四小時營運之產業，為確保產業得持續營運，故參酌電子支付機構條例及外國立法例，明定虛擬資產服務商應就維持營運之持續性及該系統之安全性訂定相關政策及程序。\n二、考量虛擬資產服務商保有客戶之虛擬資產，應負相當之資通安全責任，爰於第二項明定相關資訊系統標準及安全控管作業基準由同業公會擬定報請主管機關核定；惟就此基準而言，允宜包含資通安全政策及目標、資通安全專責組織及其權責、業者資通安全風險評估、資安防護控制及法遵等事項。\n三、鑒於資訊安全係虛擬資產服務商應特別注意之一環，爰參酌資通安全管理法第十八條規定，於第三項至第六項明定虛擬資產業者除應訂定資安事件通報及應變機制外，亦應於知悉資安事件時通報主管機關；惟通報及應變機制之事項、內容、報告提出等規定則由主管機關定之。本條所謂資通安全事件，係指系統、服務或網路狀態經鑑別而顯示有可能違反資訊安全控管基準或保護措施失效之狀態發生而影響虛擬資產服務商之資通訊系統運作，而構成資通安全之威脅。"},{"bill":"202110171550000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商辦理作業委託，應建立內部處理制度及程序，以確保作業之品質及客戶之權益，並減低對虛擬資產服務商可能造成之風險，爰參考銀行法第四十五條之一第三項規定，於本條授權主管機關制定虛擬資產服務商作業委託他人處理之規範。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110199580000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商辦理作業委託，應建立內部處理制度及程序，以確保作業之品質及客戶之權益，並減低對虛擬資產服務商可能造成之風險，爰參考銀行法第四十五條之一第三項規定，於本條授權主管機關制定虛擬資產服務商作業委託他人處理之規範。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110203280000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商作業委託他人處理者，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低作業委外可能造成之風險，爰參考銀行法第四十五條之一第三項規定，為本條規定。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶應負之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110207150000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。\n虛擬資產服務商作業委託他人處理者，如因受委託機構或其受僱人之故意或過失致客戶權益受損，仍應對客戶負同一責任。","note":"一、虛擬資產服務商作業委託他人處理者，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低作業委外可能造成之風險，爰參考銀行法第四十五條之一第三項規定，為第一項規定。\n二、虛擬資產服務商不因將部分作業委託他人處理而解免其對客戶應負之責任，為明確其對客戶仍應就受委託機構之故意或過失負同一責任，爰訂定第二項規定。"},{"bill":"202110206090000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商作業委託他人處理者，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低作業委外可能造成之風險，爰參考銀行法第四十五條之一第三項規定，為本條規定。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶應負之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"201110205640000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商作業委託他人處理者，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低作業委外可能造成之風險，爰參考銀行法第四十五條之一第三項規定，為本條規定。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶應負之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110209160000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商作業委外時，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低委外風險，爰參考銀行法第四十五條之一第三項規定。服務商不因委外而免除其對客戶之責任，仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110209890000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商作業委託他人處理者，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低作業委外可能造成之風險，爰參考銀行法第四十五條之一第三項規定，為本條規定。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶應負之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110214790000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商作業委託他人處理者，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低作業委外可能造成之風險，爰參考銀行法第四十五條之一第三項規定，為本條規定。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶應負之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110213930000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商作業委託他人處理者，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低作業委外可能造成之風險，爰參考銀行法第四十五條之一第三項規定，為本條規定。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶應負之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110217080000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。\n虛擬資產服務商委託他人提供虛擬資產交易監測、地址風險辨識或相關防制洗錢系統服務者，應就受託機構之區塊鏈別覆蓋範圍、風險標籤類型、資料更新頻率、證據輸出能力、查詢留痕及誤判申訴處理等事項進行評估；其評估指引，得由主管機關會商虛擬資產服務商同業公會定之。","note":"一、虛擬資產服務商作業委託他人處理者，應依主管機關所定辦法建立內部處理制度及程序，確保作業品質及客戶權益，並降低作業委外可能造成之風險，爰參考銀行法第四十五條之一第三項規定，為本條規定。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶應負之責任，對客戶仍應就受委託機構之故意或過失負同一責任。\n二、交易監測與地址風險辨識系統供應商之資料品質，直接影響能否攔阻不法資金、是否誤傷正常客戶、能否提供司法證據及跨平台辨識同一犯罪集團，與一般資訊委外性質不同，不宜僅視為普通委外廠商。要求服務商採用第三方系統時就鏈別覆蓋、標籤類型、更新頻率、證據能力、查詢留痕及誤判處理等項目進行評估，並授權主管機關會商同業公會訂定評估指引，以避免採用僅具形式介接而無實質偵測能力之系統，且不致強制業者採用特定廠商，爰為第二項規定。"}],"changed":true,"final":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。\n虛擬資產服務商作業委託他人處理者，如因受委託機構或其受僱人之故意或過失致客戶權益受損，仍應對客戶依法負同一責任。","finalWhy":"照委員提案修正通過。,,,,,,","review":null},{"no":"第十六條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商作業委託他人處理者，其對委託事項範圍、客戶權益保障、風險管理及內部控制原則，應訂定內部作業制度及程序；其辦法，由主管機關定之。","note":"虛擬資產服務商辦理作業委託，應建立內部處理制度及程序，以確保作業之品質及客戶之權益，並減低對虛擬資產服務商可能造成之風險，爰參考銀行法第四十五條之一第三項規定，於本條授權主管機關制定虛擬資產服務商作業委託他人處理之規範。另虛擬資產服務商不因將部分作業委託他人處理而影響其對客戶之責任，對客戶仍應就受委託機構之故意或過失負同一責任。"},{"bill":"202110171550000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠信原則，盡善良管理人之注意義務與忠實義務。\n虛擬資產服務商與客戶簽訂契約前，需進行商品、服務之說明及風險之揭露，並應以客戶能充分了解之方式為之。所應揭露之內容及應遵循事項之辦法，由主管機關定之。\n違反前二項規定者，其條款不構成契約內容。但客戶得主張該款仍構成契約之內容。\n虛擬資產服務商與客戶訂定虛擬資產商品或服務契約前，應充分了解客戶相關資料，以確保該商品或服務對客戶之適合度，並應留存紀錄。\n前項所定應充分了解之客戶相關資料、適合度應考量事項及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商屬金融消費者保護法之金融服務提供者，應踐行金融消費者保護義務。爰參考歐盟MiCA規則第六十六條第一項規定，於第一項明定虛擬資產服務商提供虛擬資產服務，應本公平合理、平等互惠及誠信原則，盡其善良管理人之注意義務與忠實義務。\n二、為避免客戶因對所投資商品不甚理解而至權益受損，爰於第二項明定虛擬資產業者必須在與客戶簽訂契約前，向客戶說明商品、服務內容並揭露相關風險。而相關應揭露之內容及應遵循之規定，則授權由主管機關定之。\n三、參酌金融消費者保護法第七條規定，定明虛擬資產業者與客戶所簽訂之契約條款顯失公平者，該部分無效；遇有疑義時，應採有利於客戶之解釋。\n四、為落實消費者保護，於第四項規定虛擬資產服務商與客戶簽訂契約前，應充分瞭解客戶是否適合該商品或服務。關於審酌客戶適合度之相關辦法，於第五項授權由主管機關訂定；主管機關訂定前應徵詢同業公會之意見。復考量虛擬資產業之變化快速，主管機關允宜保持辦法一定彈性，定期邀集同業公會檢視相關辦法；以符合產業國際發展趨勢。"},{"bill":"202110199580000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠信原則，盡善良管理人之注意義務與忠實義務。","note":"虛擬資產服務商屬金融消費者保護法之金融服務提供者，應踐行金融消費者保護義務。爰參考歐盟MiCA規則第六十六條第一項規定，於第一項明定虛擬資產服務商提供虛擬資產服務，應本公平合理、平等互惠及誠信原則，盡其善良管理人之注意義務與忠實義務。"},{"bill":"202110203280000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","note":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。"},{"bill":"202110207150000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。\n虛擬資產服務商提供虛擬資產服務前，應充分瞭解客戶之相關資料，以確保該服務對客戶之適合度，並應向客戶充分說明該服務之重要內容，並充分揭露其風險。\n前項應充分瞭解之客戶相關資料、適合度應考量之事項、說明及揭露之內容及其他應遵行事項之辦法，由主管機關定之。","note":"一、為明確虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條第一項定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。\n二、虛擬資產服務商應充分瞭解客戶（know your customer），以評估適當性、建立風險管理機制，並使其充分瞭解服務之重要內容與風險，爰參考金融消費者保護法第九條及第十條規定，為第二項及第三項規定。"},{"bill":"202110206090000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","note":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。"},{"bill":"201110205640000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","note":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。"},{"bill":"202110209160000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","note":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。"},{"bill":"202110209890000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","note":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。"},{"bill":"202110214790000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","note":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。"},{"bill":"202110213930000","text":"虛擬資產服務商從事廣告、公開說明會及其他營業活動，其限制、取締、禁止或其他應遵行事項之規則，由主管機關定之。\n非屬虛擬資產服務商，且未受虛擬資產服務商委託者，不得從事虛擬資產業務招攬之廣告。","note":"一、虛擬資產相關商品具有高度波動性及投資風險，其廣告內容如未適當規範，易產生誇大不實、隱匿風險或誤導投資人之情形，爰有必要建立明確規範機制。參考投信投顧法第七十條之一規定，金融商品之廣告及宣傳行為應受主管機關規範，爰採授權立法方式，由主管機關訂定包括廣告內容、風險揭露、禁止行為及審核程序等事項。\n二、為防止未經授權之招攬行為，並建立責任歸屬機制，爰明定僅限虛擬資產服務商或受其合法委託者，始得從事相關業務廣告，以助於強化市場秩序，使客戶得以辨識合法服務提供者，提升整體市場信賴度。"},{"bill":"202110217080000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","note":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。"}],"changed":true,"final":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","finalWhy":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。","review":null},{"no":"第十七條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠信原則，盡善良管理人之注意義務與忠實義務。\n虛擬資產服務商與客戶簽訂契約前，需進行商品、服務之說明及風險之揭露，並應以客戶能充分了解之方式為之。所應揭露之內容及應遵循事項之辦法，由主管機關定之。\n違反前二項規定者，其條款不構成契約內容。但客戶得主張該款仍構成契約之內容。\n虛擬資產服務商與客戶訂定虛擬資產商品或服務契約前，應充分了解客戶相關資料，以確保該商品或服務對客戶之適合度，並應留存紀錄。\n前項所定應充分了解之客戶相關資料、適合度應考量事項及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商屬金融消費者保護法之金融服務提供者，應踐行金融消費者保護義務。爰參考歐盟MiCA規則第六十六條第一項規定，於第一項明定虛擬資產服務商提供虛擬資產服務，應本公平合理、平等互惠及誠信原則，盡其善良管理人之注意義務與忠實義務。\n二、為避免客戶因對所投資商品不甚理解而至權益受損，爰於第二項明定虛擬資產業者必須在與客戶簽訂契約前，向客戶說明商品、服務內容並揭露相關風險。而相關應揭露之內容及應遵循之規定，則授權由主管機關定之。\n三、參酌金融消費者保護法第七條規定，定明虛擬資產業者與客戶所簽訂之契約條款顯失公平者，該部分無效；遇有疑義時，應採有利於客戶之解釋。\n四、為落實消費者保護，於第四項規定虛擬資產服務商與客戶簽訂契約前，應充分瞭解客戶是否適合該商品或服務。關於審酌客戶適合度之相關辦法，於第五項授權由主管機關訂定；主管機關訂定前應徵詢同業公會之意見。復考量虛擬資產業之變化快速，主管機關允宜保持辦法一定彈性，定期邀集同業公會檢視相關辦法；以符合產業國際發展趨勢。"},{"bill":"202110171550000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除其他法律或主管機關另有規定者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以公告、網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴。爰參考金融控股公司法第四十二條規定，於第一項明定虛擬資產服務商之客戶資料保密義務，並於第二項授權主管機關制定虛擬資產服務商應採取與揭露保密措施之具體規範。"},{"bill":"202110199580000","text":"虛擬資產服務商與客戶簽訂契約前，需進行商品、服務之說明及風險之揭露，並應以客戶能充分了解之方式為之。所應揭露之內容及應遵循事項之辦法，由主管機關定之。","note":"為避免客戶因對所投資商品不了解而至權益受損，爰明定虛擬資產業者必須在與客戶簽訂契約前，向客戶說明商品、服務內容並揭露相關風險。而相關應揭露之內容及應遵循之規定，授權由主管機關定之。"},{"bill":"202110203280000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務；另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。\n二、又為確保虛擬資產服務商落實第一項保密義務，爰於第二項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。"},{"bill":"202110207150000","text":"除其他法律或主管機關另有規定者外，虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務。惟考量司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰以除書定明依其他法律或主管機關規定，得排除適用保密義務。\n二、又為確保虛擬資產服務商落實第一項保密義務，爰於第二項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。"},{"bill":"202110206090000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務；另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。\n二、又為確保虛擬資產服務商落實第一項保密義務，爰於第二項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。"},{"bill":"201110205640000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務；另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。\n二、又為確保虛擬資產服務商落實第一項保密義務，爰於第二項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。"},{"bill":"202110209160000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、第一項定明虛擬資產服務商對客戶資料之保密義務，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定；司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料者，不適用保密義務之規定。\n二、第二項定明主管機關得要求服務商訂定書面保密措施並對外揭露重要事項，以確保服務商落實第一項保密義務。"},{"bill":"202110209890000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務；另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。\n二、又為確保虛擬資產服務商落實第一項保密義務，爰於第二項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。"},{"bill":"202110214790000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務；另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。\n二、又為確保虛擬資產服務商落實第一項保密義務，爰於第二項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。"},{"bill":"202110213930000","text":"虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡善良管理人之注意義務與忠實義務。","note":"為強化虛擬資產服務商對客戶踐行保護義務，爰參考歐盟MiCA規則第六十六條第一項規定，於本條定明虛擬資產服務商提供虛擬資產服務，應本公平合理及誠實信用原則，盡其善良管理人之注意義務與忠實義務。"},{"bill":"202110217080000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。\n有下列情形之一者，不受前項保密義務之限制：\n一、依法向司法、檢察、調查、警政、稅捐或洗錢防制主管機關提供。\n二、向主管機關指定之情資平台或虛擬資產服務商同業公會通報。\n三、為辨識或阻斷不法資金流，與其他虛擬資產服務商交換必要之風險資訊。\n四、為辦理交易監測或地址風險辨識，與受託之防制洗錢系統供應商進行必要之資料處理。\n五、對經確認或高度可疑之不法錢包地址進行風險標籤共享。\n依前項規定提供或交換資料，應遵循必要性、目的限制、最小揭露及留痕稽核原則。\n主管機關得令虛擬資產服務商就第一項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務；另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。\n二、保密義務雖屬必要，惟過度保密將阻礙反詐及防制洗錢協作；不法資金散落於各機關、各平台及各分析工具之間，欠缺得快速攔阻之共同風險資訊交換基礎。明列得不受保密義務限制之五款情形，爰為第二項規定。\n三、要求依必要性、目的限制、最小揭露及留痕稽核四原則為之，以防資料濫用，爰為第三項規定。\n四、又為確保虛擬資產服務商落實第一項保密義務，爰於第四項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。"}],"changed":true,"final":"除其他法律或主管機關另有規定者外，虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","finalWhy":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務。惟考量司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰以除書定明依其他法律或主管機關規定，得排除適用保密義務。\n二、又為確保虛擬資產服務商落實第一項保密義務，爰於第二項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。","review":null},{"no":"第十八條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商之廣告、行銷活動，應以顯著方式表明公司名稱及主管機關所核發之許可證照號碼。\n虛擬資產服務商刊登、播放廣告及進行業務招攬或營業促銷活動時，不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事，並應確保其廣告內容之真實。虛擬資產服務商對客戶所負擔之義務不得低於廣告內容及進行業務招攬或營業促銷活動時對客戶所提示之資料或說明。\n虛擬資產服務商從事廣告、業務招攬或營業促銷活動之人員為關鍵意見領袖時，應確認該關鍵意見領袖成年並具備一定資格條件。\n虛擬資產服務商從事廣告、行銷活動、業務招攬之方式、內容及其他應遵行事項之辦法，及前項所定關鍵意見領袖應具備之資格條件，由主管機關訂定，並每半年會同同業公會檢討之。","note":"一、為落實消費者保護並避免虛擬資產業相關詐騙案件持續發生，爰於第一項規定虛擬資產服務商之廣告、行銷活動，應以顯著方式表明業者名稱及主管機關所核發之許可證照號碼。\n二、為避免虛擬資產服務商之廣告或行銷活動中，有誤導客戶之情事，使之陷入誤認，而與虛擬資產業者簽訂契約或進行交易，繼而衍生消費爭議，爰於第二項規定，虛擬資產業者廣告、行銷活動中有關虛擬資產、虛擬資產之商品、衍生性商品或服務，不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事，例如與事實有差異或使人誤認有較實際條件更為優惠之文字、語言。\n三、由於虛擬資產服務商實務上進行廣告時，大量與關鍵意見領袖（又稱網紅）合作；惟與虛擬資產服務商合作之網紅未必具有一定專業知識或相關要求而能正確無誤地進行廣告、業務招攬活動。為避免網紅進行廣告、招攬業務所生之消費爭議，爰於第三項明定虛擬資產服務商從事廣告、業務招攬或營業促銷活動之人員為網紅時，應確認網紅具備一定資格條件。\n四、第四項規定虛擬資產服務商從事廣告、行銷活動之規範，授權由主管機關訂定；主管機關訂定前應徵詢同業公會之意見。復考量虛擬資產業之變化快速，主管機關允宜保持辦法一定彈性，每半年邀集同業公會檢視相關辦法；以符合產業國際發展趨勢。"},{"bill":"202110171550000","text":"虛擬資產服務商為客戶保管之資產，與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商保管之客戶資產，其財產權應歸客戶，故不應與虛擬資產服務商之自有財產混合，以避免財產權歸屬不清影響客戶權益。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十條第一項及第二項及第七十五條第七項規定等立法例，於第一項明定虛擬資產保管商之自有財產應與客戶資產分別獨立。所謂客戶資產包括客戶之虛擬資產、法定貨幣以及其他資產，併予敘明。\n二、虛擬資產服務商保管之客戶資產，其財產權係歸客戶，故虛擬資產保管商之債權人自不得對客戶資產行使任何權利。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十五條第七項規定等立法例，於第二項明定虛擬資產服務商之債權人不得對客戶資產行使權利。\n三、於虛擬資產服務商破產時，因客戶資產如上述屬客戶之財產權，故不屬於虛擬資產服務商之破產財團。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十條第一項及第七十五條第七項規定等立法例，於第三項明定客戶資產不屬於虛擬資產服務商之破產財團。\n四、為保護客戶資產之完整，避免虛擬資產服務商挪用客戶資產後不能清償導致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定等立法例，於第四項明定虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110199580000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除其他法律或主管機關另有規定者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以公告、網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴。爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商之客戶資料保密義務，並於第二項授權主管機關訂定虛擬資產服務商應採取與揭露保密措施之具體規範。"},{"bill":"202110203280000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，併予敘明。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，故虛擬資產服務商之債權人自不得對客戶資產行使任何權利，虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110207150000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定，於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，虛擬資產服務商之債權人自不得對客戶資產行使任何權利。虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110206090000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定，於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，併予敘明。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，故虛擬資產服務商之債權人自不得對客戶資產行使任何權利，虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"201110205640000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定，於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，併予敘明。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，故虛擬資產服務商之債權人自不得對客戶資產行使任何權利，虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110209160000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、第一項定明客戶資產應與服務商自有財產分別獨立；所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，爰參考IOSCO最終報告建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定。\n二、第二項及第三項定明服務商之債權人不得對客戶資產行使任何權利，服務商破產時客戶資產不屬其破產財團，爰參考IOSCO最終報告建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定。\n三、第四項定明服務商原則不得動用客戶資產及例外可動用之情形，以保護客戶資產，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定。"},{"bill":"202110209890000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定，於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，併予敘明。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，故虛擬資產服務商之債權人自不得對客戶資產行使任何權利，虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110214790000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定，於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，併予敘明。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，故虛擬資產服務商之債權人自不得對客戶資產行使任何權利，虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110213930000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"一、虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴，爰參考金融控股公司法第四十二條規定，於第一項定明虛擬資產服務商對客戶資料之保密義務；另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。\n二、又為確保虛擬資產服務商落實第一項保密義務，爰於第二項定明主管機關得要求虛擬資產服務商訂定保密措施，並對外揭露保密措施之重要事項。"},{"bill":"202110217080000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財產。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定，於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，併予敘明。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，故虛擬資產服務商之債權人自不得對客戶資產行使任何權利，虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"}],"changed":true,"final":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","finalWhy":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定，於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，併予敘明。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，故虛擬資產服務商之債權人自不得對客戶資產行使任何權利，虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。","review":null},{"no":"第十九條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商對於客戶資料、往來交易資料及其他相關資料，除其他法律或主管機關另有規定者外，應保守秘密。\n主管機關得令虛擬資產服務商就前項應保守秘密之資料訂定相關之書面保密措施，並以公告、網際網路或主管機關指定之方式，揭露保密措施之重要事項。","note":"虛擬資產服務商對其持有之客戶資料應保守秘密，以保護客戶隱私與維持大眾信賴。爰參考金融控股公司法第四十二條規定，於第一項明定虛擬資產服務商之客戶資料保密義務，並於第二項授權主管機關制定虛擬資產服務商應採取與揭露保密措施之具體規範。"},{"bill":"202110171550000","text":"虛擬資產服務商得為辦理虛擬資產業務所涉法定貨幣之收付，經客戶同意將客戶之法定貨幣留存於其於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依本條規定留存客戶法定貨幣者，準用第二十六條第三項及第四項規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項明定虛擬資產服務商得經客戶同意而基於辦理虛擬資產交易之目的留存客戶之法定貨幣，但規定其須將客戶法定貨幣留存於其於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項、韓國虛擬資產用戶保護法第六條第一項及香港適用於虛擬資產交易平台營運者的指引第10.11條規定等立法例，以及我國電子支付機構管理條例第二十一條規定，於第二項明定虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、虛擬資產服務商留存客戶法定貨幣可能涉及自有與客戶資產混合、服務商破產風險以及服務商挪用客戶資產等影響客戶資產安全之事項，故應比照虛擬資產保管商所受之客戶資產保管規範，以維護客戶權益，爰參考IOSCO最終報告之建議十五，於第三項明定虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商之定期對帳規定。"},{"bill":"202110199580000","text":"虛擬資產服務商為客戶保管之資產，與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商保管之客戶資產，其財產權應歸客戶，故不應與虛擬資產服務商之自有財產混合，以避免財產權歸屬不清影響客戶權益。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十條第一項及第二項及第七十五條第七項規定等立法例，於第一項明定虛擬資產保管商之自有財產應與客戶資產分別獨立。所謂客戶資產包括客戶之虛擬資產、法定貨幣以及其他資產，併予敘明。\n二、虛擬資產服務商保管之客戶資產，其財產權係歸客戶，故虛擬資產保管商之債權人自不得對客戶資產行使任何權利。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十五條第七項規定等立法例，於第二項明定虛擬資產服務商之債權人不得對客戶資產行使權利。\n三、於虛擬資產服務商破產時，因客戶資產如上述屬客戶之財產權，故不屬於虛擬資產服務商之破產財團。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十條第一項及第七十五條第七項規定等立法例，於第三項明定客戶資產不屬於虛擬資產服務商之破產財團。\n四、為保護客戶資產之完整，避免虛擬資產服務商挪用客戶資產後不能清償導致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定等立法例，於第四項明定虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110203280000","text":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。"},{"bill":"202110207150000","text":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。該取得銀行十足之履約保證，係指與銀行簽訂足額之履約保證契約，由銀行承擔虛擬資產服務商對客戶之履約保證責任。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。"},{"bill":"202110206090000","text":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。"},{"bill":"201110205640000","text":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。"},{"bill":"202110209160000","text":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","note":"一、第一項定明辦理法定貨幣收付業務時，得將客戶法定貨幣留存於相同幣別存款專戶，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定。\n二、第二項定明應交付信託或取得十足履約保證，以確保服務商返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、韓國虛擬資產使用者保護法第六條第一項及我國電子支付機構管理條例第二十一條規定。\n三、第三項定明準用保管商之對帳規定，以避免服務商與客戶法定貨幣混合或挪用，爰參考IOSCO最終報告建議十五。"},{"bill":"202110209890000","text":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。"},{"bill":"202110214790000","text":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。"},{"bill":"202110213930000","text":"虛擬資產服務商為客戶保管之資產與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商為客戶保管之資產，財產權仍屬客戶所有，為避免與虛擬資產服務商之自有財產混合，致財產權歸屬不清影響客戶權益，爰參考IOSCO最終報告之建議十三與歐盟MiCA規則第七十條第一項、第二項及第七十五條第七項規定，於第一項定明虛擬資產服務商之自有財產與客戶資產應分別獨立。又所謂客戶資產，包括客戶之虛擬資產、法定貨幣及其他資產，併予敘明。\n二、虛擬資產服務商為客戶保管之資產，財產權為客戶所有，故虛擬資產服務商之債權人自不得對客戶資產行使任何權利，虛擬資產服務商破產時，其所保管之客戶資產亦不屬於虛擬資產服務商破產財團之範圍。爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第一項及第七十五條第七項規定，為第二項及第三項規定。\n三、為保護客戶資產，避免虛擬資產服務商挪用客戶資產後不能清償致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項、香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定，於第四項定明虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110217080000","text":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。"}],"changed":true,"final":"虛擬資產服務商為辦理虛擬資產業務所涉法定貨幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十六條第三項及第四項所定辦法之規定。","finalWhy":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。","review":null},{"no":"第二十條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商為客戶保管之資產，與其自有財產，應依主管機關規定之方式分別獨立。\n虛擬資產服務商之債權人不得對虛擬資產服務商保管之客戶資產為任何之請求或行使其他權利。\n虛擬資產服務商破產時，其保管之客戶資產不屬於其破產財團。\n虛擬資產服務商除依客戶之指示處分客戶之資產、依法抵銷客戶對其之費用債務或其他主管機關許可之事由外，不得動用或指示金融機構動用客戶之資產。","note":"一、虛擬資產服務商保管之客戶資產，其財產權應歸客戶，故不應與虛擬資產服務商之自有財產混合，以避免財產權歸屬不清影響客戶權益。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十條第一項及第二項及第七十五條第七項規定等立法例，於第一項明定虛擬資產保管商之自有財產應與客戶資產分別獨立。所謂客戶資產包括客戶之虛擬資產、法定貨幣以及其他資產，併予敘明。\n二、虛擬資產服務商保管之客戶資產，其財產權係歸客戶，故虛擬資產保管商之債權人自不得對客戶資產行使任何權利。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十五條第七項規定等立法例，於第二項明定虛擬資產服務商之債權人不得對客戶資產行使權利。\n三、於虛擬資產服務商破產時，因客戶資產如上述屬客戶之財產權，故不屬於虛擬資產服務商之破產財團。爰參考IOSCO最終報告之建議十三及歐盟MiCA規則第七十條第一項及第七十五條第七項規定等立法例，於第三項明定客戶資產不屬於虛擬資產服務商之破產財團。\n四、為保護客戶資產之完整，避免虛擬資產服務商挪用客戶資產後不能清償導致損及客戶權益，爰參考歐盟MiCA規則第七十條第一項及第二項及香港有關認可機構提供數碼資產保管服務的預期標準的指引第七段規定等立法例，於第四項明定虛擬資產服務商原則不得動用客戶資產以及例外可動用之情形。"},{"bill":"202110171550000","text":"虛擬資產服務商不得拒絕客戶提取或轉出其資產。但本法、其他法令或主管機關另有規定者，不在此限。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得予暫停轉入、提取或轉出其資產或暫停全部或部分交易功能。\n前項疑似不法或顯屬異常交易客戶之認定標準，及暫停轉入、提取、轉出或交易之作業程序及辦法，由主管機關定之。","note":"一、虛擬資產服務商保管之客戶資產，其財產權應歸客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出其資產。爰參考韓國密碼資產客戶保護法第十一條規定，於第一項明定虛擬資產服務商原則不得拒絕客戶提取或轉出其資產。\n二、虛擬資產服務商應辨識不法交易之客戶，以避免其提供之虛擬資產服務被用作犯罪交易用途。爰參考銀行法第四十五條之二規定，於第二項明定虛擬資產服務商得基於管理不法或異常交易客戶而暫停客戶資產之轉入、提取或轉出等交易功能，並於第三項授權主管機關訂定相關規範。"},{"bill":"202110199580000","text":"虛擬資產服務商得為辦理虛擬資產業務所涉法定貨幣之收付，經客戶同意將客戶之法定貨幣留存於其於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依本條規定留存客戶法定貨幣者，準用第二十七條第三項及第四項規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項明定虛擬資產服務商得經客戶同意而基於辦理虛擬資產交易之目的留存客戶之法定貨幣，但規定其須將客戶法定貨幣留存於其於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項、韓國虛擬資產用戶保護法第六條第一項及香港適用於虛擬資產交易平台營運者的指引第10.11條規定等立法例，以及我國電子支付機構管理條例第二十一條規定，於第二項明定虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、虛擬資產服務商留存客戶法定貨幣可能涉及自有與客戶資產混合、服務商破產風險以及服務商挪用客戶資產等影響客戶資產安全之事項，故應比照虛擬資產保管商所受之客戶資產保管規範，以維護客戶權益，爰參考IOSCO最終報告之建議十五，於第三項明定虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商之定期對帳規定。"},{"bill":"202110203280000","text":"虛擬資產服務商不得拒絕客戶提取或轉出其資產。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得予暫停轉入、提取或轉出其資產或暫停全部或部分交易功能。\n前項疑似不法或顯屬異常交易客戶之認定基準，暫停轉入、提取、轉出或交易之作業程序及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商為客戶保管之資產，其財產權為客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出，爰參考韓國虛擬資產使用者保護法第十一條規定，於第一項定明虛擬資產服務商除依法律或符合主管機關規定之特殊情形外，不得拒絕客戶提取或轉出其資產。又法律包含基於法律授權之法規命令，併予敘明。\n二、為避免虛擬資產服務被用作犯罪交易用途，爰參考銀行法第四十五條之二規定，於第二項定明虛擬資產服務商對疑似不法或顯屬異常交易之客戶得暫停其資產之轉入、提取或轉出等交易功能，並於第三項授權主管機關訂定疑似不法或顯屬異常交易客戶之認定基準及相關作業程序之辦法。"},{"bill":"202110207150000","text":"除本法、其他法令或主管機關另有規定者外，虛擬資產服務商不得拒絕客戶提取或轉出其資產。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得予暫停轉入、提取或轉出其資產或暫停全部或部分交易功能，並得向司法警察機關通報。\n前項疑似不法或顯屬異常交易客戶之認定基準、暫停轉入、提取、轉出或交易之作業程序及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商為客戶保管之資產，其財產權為客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出，爰參考韓國虛擬資產使用者保護法第十一條規定，於第一項定明虛擬資產服務商除依法律、授權命令或主管機關規定之特殊情形外，不得拒絕客戶提取或轉出其資產。\n二、為避免虛擬資產服務被用作犯罪交易用途，爰參考銀行法第四十五條之二及詐欺犯罪危害防制條例第九條第一項前段規定，於第二項定明虛擬資產服務商對疑似不法或顯屬異常交易之客戶得暫停其資產之轉入、提取或轉出等交易功能，及得通報司法警察機關，並於第三項授權主管機關訂定疑似不法或顯屬異常交易客戶之認定基準及相關作業程序之辦法。"},{"bill":"202110206090000","text":"虛擬資產服務商不得拒絕客戶提取或轉出其資產。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得予暫停轉入、提取或轉出其資產或暫停全部或部分交易功能。\n前項疑似不法或顯屬異常交易客戶之認定基準、暫停轉入、提取、轉出或交易之作業程序及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商為客戶保管之資產，其財產權為客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出，爰參考韓國虛擬資產使用者保護法第十一條規定，於第一項定明虛擬資產服務商除依法律或符合主管機關規定之特殊情形外，不得拒絕客戶提取或轉出其資產。又法律包含基於法律授權之法規命令，併予敘明。\n二、為避免虛擬資產服務被用作犯罪交易用途，爰參考銀行法第四十五條 幣之收付，得經客戶同意，將客戶之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將前項客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依前二項規定留存客戶法定貨幣者，準用第二十七條第三項及第四項所定辦法之規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，為保障客戶權益，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項定明虛擬資產服務商辦理業務涉及法定貨幣收付時，得經客戶同意將其交付之法定貨幣留存於該虛擬資產服務商於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項及韓國虛擬資產使用者保護法第六條第一項，以及我國電子支付機構管理條例第二十一條規定，於第二項定明虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、為避免虛擬資產服務商將客戶留存之法定貨幣與自有資產混合、服務商破產或挪用客戶資產等情事影響客戶權益，爰參考IOSCO最終報告之建議十五，於第三項定明虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商保管客戶資產時之對帳規定。"},{"bill":"202110217080000","text":"虛擬資產服務商不得拒絕客戶提取或轉出其資產。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得暫停入帳、延遲入帳、凍結可用餘額、限制提取或轉出，或暫停全部或部分交易功能。\n前項疑似不法或顯屬異常交易之認定基準，應包括與已知不法地址往來、與混幣服務或其他高風險服務往來、短時間多層或跨鏈異常移轉、客戶行為與其申報目的顯不相符，以及經司法、主管機關、同業公會或防制洗錢系統供應商風險情資命中等態樣；其認定基準、作業程序及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商依本法或主管機關所定辦法，基於合理依據暫停、延遲、限制或拒絕疑似不法或顯屬異常交易者，除有故意或重大過失外，對客戶不負損害賠償責任。","note":"一、虛擬資產服務商為客戶保管之資產，其財產權為客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出，爰參考韓國虛擬資產使用者保護法第十一條規定，於第一項定明虛擬資產服務商除依法律或符合主管機關規定之特殊情形外，不得拒絕客戶提取或轉出其資產。又法律包含基於法律授權之法規命令，併予敘明。\n二、為避免虛擬資產服務被用作犯罪交易用途，爰參考銀行法第四十五條之二規定，於第二項定明虛擬資產服務商對疑似不法或顯屬異常交易之客戶得暫停其資產之轉入、提取或轉出等交易功能，且公鏈交易一經發送，服務商無法阻止外部地址轉入虛擬資產，能採行者為不入帳、延遲入帳、凍結可用餘額或限制提領。\n三、於第三項授權主管機關訂定疑似不法或顯屬異常交易客戶之認定基準及相關作業程序之辦法，並明文例示異常交易態樣，使認定基準更具可操作性。\n四、於第四項訂定業者安全港，明定基於合理依據暫停或限制交易者除故意或重大過失外不負損害賠償責任，以免業者因懼於客訴或訴訟而不敢即時攔阻可疑資金。"}],"changed":true,"final":"虛擬資產服務商不得拒絕客戶提取或轉出其資產。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得予暫停轉入、提取或轉出其資產或暫停全部或部分交易功能。\n前項疑似不法或顯屬異常交易客戶之認定基準、暫停轉入、提取、轉出或交易之作業程序及其他應遵行事項之辦法，由主管機關定之。","finalWhy":"一、虛擬資產服務商為客戶保管之資產，其財產權為客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出，爰參考韓國虛擬資產使用者保護法第十一條規定，於第一項定明虛擬資產服務商除依法律或符合主管機關規定之特殊情形外，不得拒絕客戶提取或轉出其資產。又法律包含基於法律授權之法規命令，併予敘明。\n二、為避免虛擬資產服務被用作犯罪交易用途，爰參考銀行法第四十五條之二規定，於第二項定明虛擬資產服務商對疑似不法或顯屬異常交易之客戶得暫停其資產之轉入、提取或轉出等交易功能，並於第三項授權主管機關訂定疑似不法或顯屬異常交易客戶之認定基準及相關作業程序之辦法。","review":null},{"no":"第二十一條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商得為辦理虛擬資產業務所涉法定貨幣之收付，經客戶同意將客戶之法定貨幣留存於其於金融機構開立之相同幣別存款專戶。\n虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得銀行十足之履約保證。\n虛擬資產服務商依本條規定留存客戶法定貨幣者，準用第二十八條第三項及第四項規定。","note":"一、虛擬資產服務商為辦理虛擬資產業務，可能辦理客戶法定貨幣留存之業務，爰參考電子支付機構管理條例第十七條及證券商管理規則第三十八條第二項規定，於第一項明定虛擬資產服務商得經客戶同意而基於辦理虛擬資產交易之目的留存客戶之法定貨幣，但規定其須將客戶法定貨幣留存於其於金融機構開立之相同幣別專戶。\n二、虛擬資產服務商應採取適當措施確保其返還客戶留存法定貨幣之能力，爰參考IOSCO最終報告之建議十三、歐盟MiCA規則第七十條第三項、日本支付服務法第六十三條之十一、日本關於加密資產交換業者之內閣府令第二十六條第一項、韓國虛擬資產用戶保護法第六條第一項及香港適用於虛擬資產交易平台營運者的指引第10.11條規定等立法例，以及我國電子支付機構管理條例第二十一條規定，於第二項明定虛擬資產服務商應將客戶留存之法定貨幣交付信託或取得十足履約保證。\n三、虛擬資產服務商留存客戶法定貨幣可能涉及自有與客戶資產混合、服務商破產風險以及服務商挪用客戶資產等影響客戶資產安全之事項，故應比照虛擬資產保管商所受之客戶資產保管規範，以維護客戶權益，爰參考IOSCO最終報告之建議十五，於第三項明定虛擬資產服務商留存客戶法定貨幣者，準用虛擬資產保管商之定期對帳規定。"},{"bill":"202110171550000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額以及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，於借用人不能返還時可能影響虛擬資產服務商之財務健全性，甚至影響虛擬資產服務商之繼續經營能力，從而影響其客戶權益及整體市場穩定，因此有適度控管虛擬資產服務商之虛擬資產出借業務規模或出借對象之必要，爰參考銀行法第三十三條之三第一項、保險法第一百四十六條之七第一項規定，於本條明定授權主管機關針對虛擬資產出借業務的總體規模、個別虛擬資產出借規模以及關係人或關係企業出借業務另訂規範。"},{"bill":"202110199580000","text":"虛擬資產服務商不得拒絕客戶提取或轉出其資產。但本法、其他法令或主管機關另有規定者，不在此限。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得予暫停轉入、提取或轉出其資產或暫停全部或部分交易功能，並應即時通報司法警察機關。除經司法機關通知應繼續控管者外，相關限制措施以二十日為限。\n前項疑似不法或顯屬異常交易客戶之認定標準，及暫停轉入、提取、轉出或交易之作業程序及辦法，由主管機關定之。","note":"一、虛擬資產服務商保管之客戶資產，其財產權應歸客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出其資產。爰參考韓國密碼資產客戶保護法第十一條規定，於第一項明定虛擬資產服務商原則不得拒絕客戶提取或轉出其資產。\n二、虛擬資產服務商應辨識不法交易之客戶，以避免其提供之虛擬資產服務被用作犯罪交易用途。爰參考銀行法第四十五條之二規定，於第二項明定虛擬資產服務商得基於管理不法或異常交易客戶而暫停客戶資產之轉入、提取或轉出等交易功能，惟考量人民之財產自由乃受憲法保障之基本人權，並配合《金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法》關於司法警察機關應於二十日回覆通報之義務，爰明定業務機構執行控管措施之期限。\n三、於第三項授權主管機關訂定相關規範。"},{"bill":"202110203280000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要，爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。"},{"bill":"202110207150000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要。爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。"},{"bill":"202110206090000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要，爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。"},{"bill":"201110205640000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要，爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。"},{"bill":"202110209160000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產借貸商因辦理出借業務，將承受借用人不能返還之信用風險，財務風險相對較高，有適度控管出借業務額度及出借對象之必要，爰授權主管機關就出借業務之總體規模、個別出借限額及關係人出借事項另定規範，參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定。"},{"bill":"202110209890000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要，爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。"},{"bill":"202110214790000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要，爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。"},{"bill":"202110213930000","text":"虛擬資產服務商不得拒絕客戶提取或轉出其資產。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得予暫停轉入、提取或轉出其資產或暫停全部或部分交易功能。\n前項疑似不法或顯屬異常交易客戶之認定基準、暫停轉入、提取、轉出或交易之作業程序及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產服務商為客戶保管之資產，其財產權為客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出，爰參考韓國虛擬資產使用者保護法第十一條規定，於第一項定明虛擬資產服務商除依法律或符合主管機關規定之特殊情形外，不得拒絕客戶提取或轉出其資產。又法律包含基於法律授權之法規命令，併予敘明。\n二、為避免虛擬資產服務被用作犯罪交易用途，爰參考銀行法第四十五條之二規定，於第二項定明虛擬資產服務商對疑似不法或顯屬異常交易之客戶得暫停其資產之轉入、提取或轉出等交易功能，並於第三項授權主管機關訂定疑似不法或顯屬異常交易客戶之認定基準及相關作業程序之辦法。"},{"bill":"202110217080000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要，爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。"}],"changed":true,"final":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","finalWhy":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要，爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。","review":null},{"no":"第二十二條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商不得拒絕客戶提取或轉出其資產。但本法、其他法令或主管機關另有規定者，不在此限。\n虛擬資產服務商對疑似不法或顯屬異常交易之客戶，得予暫停轉入、提取或轉出其資產或暫停全部或部分交易功能。\n前項疑似不法或顯屬異常交易客戶之認定標準，及暫停轉入、提取、轉出或交易之作業程序及辦法，由主管機關定之。","note":"一、虛擬資產服務商保管之客戶資產，其財產權應歸客戶所有，虛擬資產服務商自不得任意拒絕客戶提取或轉出其資產。爰參考韓國密碼資產客戶保護法第十一條規定，於第一項明定虛擬資產服務商原則不得拒絕客戶提取或轉出其資產。\n二、虛擬資產服務商應辨識不法交易之客戶，以避免其提供之虛擬資產服務被用作犯罪交易用途。爰參考銀行法第四十五條之二規定，於第二項明定虛擬資產服務商得基於管理不法或異常交易客戶而暫停客戶資產之轉入、提取或轉出等交易功能，並於第三項授權主管機關訂定相關規範。"},{"bill":"202110171550000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之申報程序、公告事項及其他應記載之事項與格式，由主管機關定之。","note":"為確保虛擬資產服務商之財務健全，爰參考證券投資信託及顧問業法第九十九條及期貨交易法第九十七條規定，於第一項明定虛擬資產服務商之財務報告公告與申報義務，並於第二項授權主管機關制定具體規範。"},{"bill":"202110199580000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額以及對關係人或關係企業之出借，得予限制，其限制額度、出借交易規範及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，於借用人不能返還時可能影響虛擬資產服務商之財務健全性，甚至影響虛擬資產服務商之繼續經營能力，從而影響其客戶權益及整體市場穩定，因此有適度控管虛擬資產服務商之虛擬資產出借業務規模或出借對象之必要，爰參考銀行法第三十三條之三第一項、保險法第一百四十六條之七第一項規定，於本條明定授權主管機關針對虛擬資產出借業務的總體規模、個別虛擬資產出借規模以及關係人或關係企業出借業務另訂規範。"},{"bill":"202110203280000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達及健全其會計師對財務報告之簽證，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範；另鑒於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則，考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。"},{"bill":"202110207150000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達，有令會計師定期查核其財務報告之必要。爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範。\n三、另鑑於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則。惟考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬資產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。"},{"bill":"202110206090000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達及健全其會計師對財務報告之簽證，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範；另鑒於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則，考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。"},{"bill":"201110205640000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達及健全其會計師對財務報告之簽證，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範；另鑒於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則，考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。"},{"bill":"202110209160000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、第一項定明服務商有定期申報及公告財務報告之義務，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定。\n二、第二項授權主管機關訂定財務報告相關辦法；鑒於我國金融業及主要法域之虛擬資產服務商皆採用國際財務報導準則（IFRS），爰排除商業會計法第四章、第六章及第七章之適用，以增加財務報告之國際比較性，爰參考證券交易法第十四條第二項規定。"},{"bill":"202110209890000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達及健全其會計師對財務報告之簽證，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範；另鑒於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則，考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。"},{"bill":"202110214790000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達及健全其會計師對財務報告之簽證，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範；另鑒於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則，考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。"},{"bill":"202110213930000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範、關係人與關係企業之範圍及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，為避免虛擬資產借用人不能返還虛擬資產致影響虛擬資產服務商之財務健全性、繼續經營能力，進而影響其他客戶權益及整體市場穩定，有適度控管虛擬資產服務商之虛擬資產出借業務額度及出借對象之必要，爰參考銀行法第三十三條之三第一項及保險法第一百四十六條之七第一項規定，於本條定明限制事項，並授權主管機關針對虛擬資產出借業務之總體規模、個別虛擬資產出借限額以及關係人或關係企業出借事項另定規範。"},{"bill":"202110217080000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達及健全其會計師對財務報告之簽證，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範；另鑒於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則，考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。"}],"changed":true,"final":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","finalWhy":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達及健全其會計師對財務報告之簽證，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範；另鑒於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則，考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。","review":null},{"no":"第二十三條","current":null,"versions":[{"bill":"202110137730000","text":"主管機關對於虛擬資產服務商辦理出借虛擬資產業務之出借總額、個別虛擬資產出借限額以及對關係人或關係企業之出借，得予限制；其限制額度、出借交易規範及其他應遵行事項之辦法，由主管機關定之。","note":"虛擬資產服務商因辦理虛擬資產出借業務，將承受借用人不能返還之信用風險，於借用人不能返還時可能影響虛擬資產服務商之財務健全性，甚至影響虛擬資產服務商之繼續經營能力，從而影響其客戶權益及整體市場穩定，因此有適度控管虛擬資產服務商之虛擬資產出借業務規模或出借對象之必要，爰參考銀行法第三十三條之三第一項、保險法第一百四十六條之七第一項規定，於本條明定授權主管機關針對虛擬資產出借業務的總體規模、個別虛擬資產出借規模以及關係人或關係企業出借業務另訂規範。"},{"bill":"202110171550000","text":"虛擬資產服務商之財務業務或其他資訊，應依主管機關之規定公告與通報主管機關，其公告與通報之方式、項目及範圍，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"為降低虛擬資產服務市場之資訊不對稱，並協助客戶日後取得其服務相關紀錄，爰參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項授權主管機關制定虛擬資產服務商資訊公告之具體規範，並參考洗錢防制法第十條第二項規定，於第二項與第三項明定虛擬資產服務商之客戶記錄保存義務與期間。又第三項所稱服務關係終止時起，須依不同服務內容下之服務關係定其起算時點，併予敘明。"},{"bill":"202110199580000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之申報程序、公告事項及其他應記載之事項與格式，由主管機關定之。","note":"為確保虛擬資產服務商之財務健全，爰參考證券投資信託及顧問業法第九十九條及期貨交易法第九十七條規定，於第一項明定虛擬資產服務商之財務報告公告與申報義務，並於第二項授權主管機關制定具體規範。"},{"bill":"202110203280000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。"},{"bill":"202110207150000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。\n第二項留存相關紀錄之適用範圍、程序、方式之辦法，由主管機關定之。","note":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點。該揭露與通報，應包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項及第三項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形，並於第四項授權主管機關訂定所應留存為客戶辦理虛擬資產服務之相關紀錄之適用範圍等之辦法。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。"},{"bill":"202110206090000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。"},{"bill":"201110205640000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。"},{"bill":"202110209160000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"一、第一項定明服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，以降低虛擬資產服務市場之資訊不對稱，爰參考IOSCO最終報告建議三、四、五、六、七、十四、十七及十八。\n二、第二項及第三項定明客戶服務紀錄之保存義務與期間，備供主管機關查核，爰參考洗錢防制法第十條第二項規定；第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。"},{"bill":"202110209890000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。"},{"bill":"202110214790000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。"},{"bill":"202110213930000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之內容、適用範圍、作業程序、編製、查核簽證或核閱、申報程序、申報期間、公告事項、備置、保存及其他應遵行事項之辦法，由主管機關定之，不適用商業會計法第四章、第六章及第七章之規定。","note":"一、為確保虛擬資產服務商之財務健全、強化虛擬資產服務商管理，促進虛擬資產服務商財務狀況之忠實表達及健全其會計師對財務報告之簽證，爰參考證券投資信託及顧問法第九十九條及期貨交易法第九十七條規定，於第一項定明虛擬資產服務商有定期申報及公告財務報告之義務。\n二、第二項授權主管機關就第一項財務報告相關事項訂定具體規範；另鑒於我國金融業及歐盟、香港、新加坡與韓國虛擬資產服務商皆採用國際財務報導準則（IFRS），為增加我國虛擬資產服務商財務報告與國際之比較性，提升國際競爭力，我國虛擬資產服務商亦宜採用國際財務報導準則，考量現行商業會計法第四章、第六章、第七章對於會計處理之規範，與國際財務報導準則有所不同，爰參考證券交易法第十四條第二項，於第二項後段定明虛擬產服務商之財務報告排除商業會計法第四章、第六章、第七章規定之適用。"},{"bill":"202110217080000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核；其紀錄至少應包括客戶確認身分資料、客戶使用之錢包地址、入金及出金之交易雜湊值、交易對手地址、交易時間、區塊鏈別、幣種、金額及手續費、地址風險標籤及風險分數、交易監測查詢紀錄、警示觸發原因、人工覆核紀錄、暫停或放行等處置決定，以及辨識風險時所採用之風險資料版本。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。\n虛擬資產服務商辦理虛擬資產移轉時，應依主管機關所定標準，蒐集、保存並傳遞匯款人及收款人之必要資訊。\n前項移轉涉及無法取得對手方必要資訊、與非託管錢包往來或與高風險地址往來者，虛擬資產服務商應採取強化審查、限制交易或其他降低風險之措施。\n前兩項必要資訊之範圍、傳遞與保存方式、前項強化審查措施及其他應遵行事項之辦法，由主管機關定之。","note":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形；並應保存之鏈上證據項目，及納入辨識風險時所採用之風險資料版本，因實務常見某地址於交易當時尚未被標記、事後始被標記之情形，保存當時之風險資料版本，方能判斷業者於交易時是否已盡合理注意義務。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。\n三、於本條明定移轉資訊蒐集、保存及傳遞義務，並就無法取得對手方資訊、非託管錢包及高風險地址往來增訂強化審查義務，將旅行規則提升至本法之法律位階。"}],"changed":true,"final":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。\n第二項留存相關紀錄之適用範圍、程序、方式之辦法，由主管機關定之。","finalWhy":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點。該揭露與通報，應包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項及第三項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形，並於第四項授權主管機關訂定所應留存為客戶辦理虛擬資產服務之相關紀錄之適用範圍等之辦法。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。","review":null},{"no":"第二十四條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商應定期向主管機關申報及公告經會計師查核簽證或核閱之財務報告。\n前項財務報告之申報程序、公告事項及其他應記載之事項與格式，由主管機關定之。","note":"為確保虛擬資產服務商之財務健全，爰參考證券投資信託及顧問業法第九十九條及期貨交易法第九十七條規定，於第一項明定虛擬資產服務商之財務報告公告與申報義務，並於第二項授權主管機關制定具體規範。"},{"bill":"202110171550000","text":"虛擬資產交換商應公告其提供交換服務之虛擬資產之發行說明文書，虛擬資產未有依主管機關之規定編製與公告之發行說明文書者，虛擬資產交換商不得提供該虛擬資產之交換服務。但主管機關另有規定者，不在此限。","note":"虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應提供此發行說明文書網頁連結；未依主管機關規定編製發行說明文書之虛擬資產，可能存在較高之資訊不對稱風險與交易人保護之疑慮，故虛擬資產交換商原則應拒絕提供無發行說明文書之虛擬資產之交換服務。爰參考歐盟MiCA規則第六十六條第三項規定，於本條明定虛擬資產交換商提供虛擬資產發行說明文書資訊之義務，以及虛擬資產交換商不得提供無發行說明文書之虛擬資產之交換服務之義務，並授權主管機關另定例外情形。"},{"bill":"202110199580000","text":"虛擬資產服務商之財務業務或其他資訊，應依主管機關之規定公告與通報主管機關，其公告與通報之方式、項目及範圍，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核；其保存之方式、項目及範圍，由主管機關定之。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"為降低虛擬資產服務市場之資訊不對稱，並協助客戶日後取得其服務相關紀錄，爰參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項授權主管機關制定虛擬資產服務商資訊公告之具體規範，並參考洗錢防制法第十條第二項規定，於第二項與第三項明定虛擬資產服務商之客戶記錄保存義務與期間，其保存之方式、項目及範圍，由主管機關參考臺灣證券交易股份有限公司營業細則等相關規範訂之，又第三項所稱服務關係終止時起，須依不同服務內容下之服務關係定其起算時點，併予敘明。"},{"bill":"202110203280000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。\n三、符合主管機關規定之特殊情形。","note":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考；倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。"},{"bill":"202110207150000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但主管機關另有規定或有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。","note":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考。倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，而恐影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。"},{"bill":"202110206090000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。\n三、符合主管機關規定之特殊情形。","note":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考；倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。"},{"bill":"201110205640000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。\n三、符合主管機關規定之特殊情形。","note":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考；倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。"},{"bill":"202110209160000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。\n三、符合主管機關規定之特殊情形。","note":"一、發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，交換商提供服務時，原則應確保所提供之虛擬資產具有充分揭露相關資訊之發行說明文書，並公告予客戶參考，爰參考歐盟MiCA規則第六十六條第三項規定。\n二、但書規定部分虛擬資產於發行時無發行說明文書係有正當理由，如無償發行（空投）或作為維持分散式帳本運作之勞務報酬（如比特幣），此類發行因無涉集資，故無要求具備發行說明文書之必要，爰參考歐盟MiCA規則第四條第三項規定。"},{"bill":"202110209890000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。\n三、符合主管機關規定之特殊情形。","note":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考；倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。"},{"bill":"202110214790000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。\n三、符合主管機關規定之特殊情形。","note":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考；倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。"},{"bill":"202110213930000","text":"虛擬資產服務商之財務、業務或其他資訊，應揭露與通報主管機關；其揭露與通報之方式、項目、範圍、時點及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"一、為降低虛擬資產服務市場之資訊不對稱，使客戶得獲取其服務相關紀錄，參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項定明虛擬資產服務商應依主管機關訂定之辦法揭露及通報財務、業務或其他資訊，揭露及通報之時點包括定期或發生重大偶發事件（例如發生影響客戶權益或資通安全事件）時。\n二、參考洗錢防制法第十條第二項規定，於第二項與第三項定明虛擬資產服務商客戶紀錄之保存義務與期間，備供主管機關查核以利主管機關監理虛擬資產服務商業務執行之情形。又第三項所稱服務關係終止時，係依個別服務關係定其起算時點，併予敘明。"},{"bill":"202110217080000","text":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。\n三、符合主管機關規定之特殊情形。","note":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考；倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。"}],"changed":true,"final":"虛擬資產交換商應確保其提供交換服務之虛擬資產具有符合主管機關規定之發行說明文書，始得提供服務，並應公告該虛擬資產之發行說明文書。但主管機關另有規定或有下列情形之一者，不在此限：\n一、虛擬資產之發行係無償。\n二、虛擬資產之發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬。","finalWhy":"一、虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應確保所提供之虛擬資產具有充分揭露該虛擬資產相關資訊之發行說明文書，並公告予客戶參考。倘若虛擬資產未具有充分揭露虛擬資產相關資訊之發行說明文書，該虛擬資產可能存在較高之資訊不對稱風險，而恐影響交易人權益，故虛擬資產交換商原則應拒絕提供無發行說明文書或未於發行說明文書充分揭露虛擬資產相關資訊者之交換服務，爰參考歐盟MiCA規則第六十六條第三項規定，定明虛擬資產交換商應確保所提供服務之虛擬資產已具備符合主管機關規定發行說明文書應編製之事項與公告之方式始得提供服務；並定明虛擬資產交換商有將虛擬資產發行說明文書資訊公告之義務。\n二、部分虛擬資產於發行時無發行說明文書係有正當理由，例如其係無償發行（如空投）或其發行係作為維持其分散式帳本運作或驗證其交易之勞務報酬（例如比特幣），此類虛擬資產之發行因無涉集資，故無要求具備發行說明文書以保護認購人及後續交易人之必要，爰參考歐盟MiCA規則第四條第三項規定，於但書規定虛擬資產無須有發行說明文書之例外情形，並得由主管機關另定例外之特殊情形。","review":null},{"no":"第二十五條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商之財務業務或其他資訊，應依主管機關之規定公告與通報主管機關，其公告與通報之方式、項目及範圍，由主管機關定之。\n虛擬資產服務商應留存其為客戶辦理虛擬資產服務之相關紀錄，備供查核。\n前項服務紀錄之保存，自服務關係終止時起，應保存五年。但遇有爭議者，應保存至爭議消除為止。","note":"為降低虛擬資產服務市場之資訊不對稱，並協助客戶日後取得其服務相關紀錄，爰參考IOSCO最終報告之建議三、四、五、六、七、十四、十七及十八，於第一項授權主管機關制定虛擬資產服務商資訊公告之具體規範，並參考洗錢防制法第十條第二項規定，於第二項與第三項明定虛擬資產服務商之客戶記錄保存義務與期間。又第三項所稱服務關係終止時起，須依不同服務內容下之服務關係定其起算時點，併予敘明。"},{"bill":"202110171550000","text":"虛擬資產交易平台商應依主管機關之規定，就虛擬資產之上下架訂定審查標準及審查程序。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施。\n前條之規定，於虛擬資產交易平台商亦適用之。","note":"一、虛擬資產交易平台商就其上下架之虛擬資產，應負有客觀審查之義務。爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項明定虛擬資產交易平台商之虛擬資產上下架審查義務。\n二、虛擬資產交易平台商應防止其交易市場中之不公正交易行為，以保護其客戶之權益與交易市場健全性。爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產用戶保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第二項明定虛擬資產交易平台商建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。\n三、虛擬資產交易平台商性質上亦屬虛擬資產交換商之一種，爰於第三項明定虛擬資產交易平台商適用虛擬資產交換商之規定。"},{"bill":"202110199580000","text":"虛擬資產交換商應公告其提供交換服務之虛擬資產之發行說明文書，虛擬資產未有依主管機關之規定編製與公告之發行說明文書者，虛擬資產交換商不得提供該虛擬資產之交換服務。但主管機關另有規定者，不在此限。","note":"虛擬資產之發行說明文書（又稱「白皮書」）為交易人了解虛擬資產權利義務內容之主要依據，虛擬資產交換商提供交換服務時，原則應提供此發行說明文書網頁連結；未依主管機關規定編製發行說明文書之虛擬資產，可能存在較高之資訊不對稱風險與交易人保護之疑慮，故虛擬資產交換商原則應拒絕提供無發行說明文書之虛擬資產之交換服務。爰參考歐盟MiCA規則第六十六條第三項規定，於本條明定虛擬資產交換商提供虛擬資產發行說明文書資訊之義務，以及虛擬資產交換商不得提供無發行說明文書之虛擬資產之交換服務之義務，並授權主管機關另定例外情形。"},{"bill":"202110203280000","text":"虛擬資產交易平台商應就虛擬資產之上下架訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產交易平台商應確保其提供集中交易市場服務之虛擬資產經申請主管機關同意，始得提供服務；虛擬資產交易平台商申請同意之程序、條件、廢止及其他應遵行事項之規則，由主管機關定之。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施，其警示等措施及其他應遵行事項之辦法，由主管機關定之。","note":"一、虛擬資產交易平台商就其上下架之虛擬資產，負有客觀審查之義務，爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項定明虛擬資產交易平台商之虛擬資產上下架審查義務，並於第二項定明虛擬資產交易平台商提供交易平台服務之虛擬資產應經主管機關同意，及授權主管機關訂定申請同意之相關規則，倘該虛擬資產業經虛擬資產交易平台商申請主管機關同意交易，則無須再為申請，併予敘明。\n二、為保護客戶之權益與交易市場健全性，爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產使用者保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第三項定明虛擬資產交易平台商有建置防止市場交易不公正之機制及偵測價量異常警示措施之義務，並授權主管機關訂定警示等措施及其他應遵行事項之辦法。"},{"bill":"202110207150000","text":"虛擬資產交易平台商應就虛擬資產之上下架訂定審查基準及審查程序；其審查基準與審查程序之訂定及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產交易平台商應確保其提供集中交易市場服務之虛擬資產經申請主管機關同意，始得提供服務；虛擬資產交易平台商申請同意之程序、條件、廢止及其他應遵行事項之規則，由主管機關定之。\n虛擬資產交易平台商應建置防止市場交易不公正之機制及偵測價量異常警示等措施。","note":"一、虛擬資產交易平台商就其上下架之虛擬資產，負有客觀審查之義務，爰參考IOSCO最終報告之建議六及歐盟MiCA規則第七十六條第一項規定，於第一項定明虛擬資產交易平台商之虛擬資產上下架審查義務，並於第二項定明虛擬資產交易平台商提供交易平台服務之虛擬資產應經主管機關同意，及授權主管機關訂定申請同意之相關規則，倘該虛擬資產業經虛擬資產交易平台商申請主管機關同意交易，則無須再為申請，併予敘明。\n二、為保護客戶之權益與交易市場健全性，爰參考IOSCO最終報告之建議九、歐盟MiCA規則第七十六條第七項、日本關於加密資產交換業者之內閣府令第二十三條第二項第四款、韓國虛擬資產使用者保護法第十二條第一項及香港適用於虛擬資產交易平台營運者的指引第7.22條及第8.1條規定，於第三項定明虛擬資產交易平台商有建置防止市場交易不公正之機制及偵測價量異常警示措施之義務。"},{"bill":"202110206090000","text":"虛擬資產交易平台商應就虛擬資產之上下架訂定審查基準及審查程序；其審查基準與程序之訂定及其他應遵行事項之辦法，由主管機關定之。\n虛擬資產交易平台商應確保其提供集中交易市場服務之虛擬資產經申請主管機關同意，始得提供服務；虛擬資產交易平台商申請同意之程序、條件
