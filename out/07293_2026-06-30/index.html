02110213930000","text":"穩定幣發行人應設置與維持十足之準備資產，儲存於境內之金融機構，且該準備資產應與其自有財產分別獨立，並進行定期查核。\n穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，該準備金計入前項準備資產。穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。\n穩定幣發行人除符合主管機關規定之事由外，不得動用第一項之準備資產。\n第一項及前項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n第二項之一定金額、準備金繳存之比率、方式、調整、查核及其他應遵行事項之辦法，由中央銀行會商主管機關定之。","note":"一、為維持穩定幣價值穩定，穩定幣發行人應設置與維持十足之準備資產，並儲存於境內之金融機構，供穩定幣持有人贖回，且該準備資產應與穩定幣發行人之自有財產分別獨立，並進行定期查核，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第三十六條第一項至第三項及第五十八條規定，為第一項規定。\n二、穩定幣發行人發行之穩定幣雖非銀行法或電子支付機構管理條例等法律所定之存款或儲值款項，但仍屬多用途支付工具，具有交易中介、替代通貨之功能。為保持穩定幣準備資產之高度流動性，爰參考電子支付機構管理條例第二十條規定，於第二項定明穩定幣發行人發行之穩定幣總面額達一定金額者，應繳存足額之準備金，且該準備金計入第一項準備資產，並參考電子支付機構管理條例第六條第一款規定，於後段定明穩定幣之發行涉及外匯部分，應依中央銀行規定辦理。另於第五項授權由中央銀行會商主管機關訂定準備金相關事項之辦法。\n三、第三項定明穩定幣發行人動用準備資產之限制。\n四、第四項授權主管機關就第一項及第三項準備資產之設置、動用與定期查核之程序、方式及其他應遵行事項訂定辦法，並應會商中央銀行意見。"},{"bill":"202110217080000","text":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","note":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十六條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。"}],"changed":true,"final":"非穩定幣持有人不得對第三十六條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","finalWhy":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十六條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十六條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。","review":null},{"no":"第三十九條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人所受之損害，應負賠償責任。","note":"一、虛擬資產市場具有高度資訊敏感性，容易受到市場內外之不實資訊而影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為。爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項明定禁止於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）之虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n二、虛擬資產詐欺以提供之不實資訊涉及重大影響虛擬資產發行或交易之資訊為前提。爰參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項以及「證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法」第二條第十八款及第三條第五款規定，於第二項明定重大影響虛擬資產發行或交易之資訊之定義。\n三、虛擬資產詐欺之行為人應就其對善意交易人造成之損害負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，於第三項明定虛擬資產詐欺之損害賠償責任。\n四、虛擬資產交易市場具有高度資訊敏感性，有心人士可能利用操縱行為影響虛擬資產的價格或供給，從而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員國應規範虛擬資產市場之操縱行為。爰參考歐盟MiCA規則第九十一條第二項與第三項、日本金融商品取引法第一百八十五條之二十三與第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項明定禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象之操縱行為。本項之操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約；自行或與他人共謀提高、維持或降低虛擬資產之交易價格；自行或與他人共謀提高、維持或降低虛擬資產之供需；散布流言或不實資訊；以非法方法中斷、延遲或危害虛擬資產服務商功能正常運作以及其他直接或間接影響虛擬資產交易之操縱行為。\n五、虛擬資產操縱行為人應就其對善意交易人造成之損害負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，於第五項明定虛擬資產操縱行為之損害賠償責任。又因操縱行為以具有不法之操縱意圖為要件，故此之損害賠償責任解釋上屬故意責任，併予敘明。"},{"bill":"202110171550000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、命其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"虛擬資產服務商違反法令、章程或有其他有礙健全經營之虞之情事者，應許主管機關採取相關管制性不利處分，以控制避免違法情事之擴大。爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，於本條明定主管機關對虛擬資產服務商之處分權。"},{"bill":"202110199580000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時命令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務或業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；如發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他主管機關或命令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人應有檢查權，其檢查範圍及於上述之人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料，包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制或其他有關資料物件。爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，於本條明定主管機關之檢查權。\n二、為協助主管機關為財務業務之檢查，爰參考期貨交易法第六條第三項、第九十九條第一項之規定及證券投資信託及顧問法第一百零一條規定，於第三項明定主管機關得請求其他主管機關或命令金融機構提供必要資訊或紀錄，所稱金融機構，係指受主管機關監管對大眾提供金融服務之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業。"},{"bill":"202110203280000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","note":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項；若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定。"},{"bill":"202110207150000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","note":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項。若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定，併予指明。"},{"bill":"202110206090000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","note":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項；若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定。"},{"bill":"201110205640000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","note":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項；若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定。"},{"bill":"202110209160000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","note":"穩定幣發行人應就穩定幣之發行與贖回建立有效之內部控制及稽核制度、資通系統安全管理制度及營運持續性政策，以控管業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。"},{"bill":"202110209890000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","note":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項；若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定。"},{"bill":"202110214790000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","note":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項；若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定。"},{"bill":"202110213930000","text":"穩定幣發行人應以面額發行及贖回穩定幣。\n穩定幣發行人就其發行之穩定幣，不得支付任何形式之利息或收益。\n穩定幣發行人不得拒絕穩定幣持有人申請贖回。但依其他法律或符合主管機關規定之特殊情形者，不在此限。\n第一項穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。","note":"一、參考歐盟MiCA規則第四十九條規定，於第一項定明穩定幣發行人應以面額發行及贖回穩定幣。\n二、考量穩定幣係用於支付目的，與具存款性質之金融資產不同，爰參考美國GENIUS法Section 4(11)、歐盟MiCA規則第四十條第一項及第五十條第一項規定，於第二項定明穩定幣發行人就其於我國境內發行之穩定幣，不得支付任何形式之利息或收益。\n三、為保障穩定幣持有人之權益，於第三項定明穩定幣發行人除依其他法律或符合主管機關規定之特殊情形外，不得拒絕持有人贖回穩定幣。\n四、第四項授權主管機關訂定穩定幣發行與贖回之程序、方式及其他應遵行事項之辦法，並應會商中央銀行意見。"},{"bill":"202110217080000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應就穩定幣之鑄造及贖回建立確認客戶身分及交易監測機制，對大額鑄造、贖回及短期循環交易進行監控，並於司法機關依法請求時，配合辦理凍結、返還或追索；其辦法，由主管機關會商中央銀行定之。","note":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項；若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定。\n三、穩定幣最大風險不僅在準備資產，更在流通後遭用於詐欺、洗錢及地下匯兌；若穩定幣成為我國虛擬資產交易媒介，未來極可能成為不法案件之主要流通工具。爰於第二項定明要求穩定幣發行人就鑄造、贖回端建立確認客戶身分及交易監測機制，對大額或短期循環交易進行監控，並配合司法機關辦理凍結、返還或追索。"}],"changed":true,"final":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","finalWhy":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項；若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定。","review":null},{"no":"第四十條","current":null,"versions":[{"bill":"202110137730000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時命令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務或業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；如發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他主管機關或命令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人應有檢查權，其檢查範圍及於上述之人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料，包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制或其他有關資料物件。爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，於本條明定主管機關之檢查權。\n二、為協助主管機關為財務業務之檢查，爰參考期貨交易法第六條第三項、第九十九條第一項之規定及證券投資信託及顧問法第一百零一條規定，於第三項明定主管機關得請求其他主管機關或命令金融機構提供必要資訊或紀錄，所稱金融機構，係指受主管機關監管對大眾提供金融服務之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業。"},{"bill":"202110171550000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，除依本法處罰外，主管機關並得視情節輕重命令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"虛擬資產服務商之內部人如有違法情事，應許主管機關採取停職或解職之處分，以控制違法情事之擴大及維護整體虛擬資產服務市場之秩序。爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條明定主管機關對虛擬資產服務商內部人之處分權。"},{"bill":"202110199580000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、命其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"虛擬資產服務商違反法令、章程或有其他有礙健全經營之虞之情事者，應許主管機關採取相關管制性不利處分，以控制避免違法情事之擴大。爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，於本條明定主管機關對虛擬資產服務商之處分權。"},{"bill":"202110203280000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。","note":"鑒於隱私權之保障及對穩定幣持有人往來交易等資料控制處分權之尊重，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。"},{"bill":"202110207150000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或主管機關另有規定者外，應保守秘密。","note":"鑑於隱私權及穩定幣持有人往來交易等資料控制處分權之保障，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。惟考量司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。"},{"bill":"202110206090000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。","note":"鑒於隱私權之保障及對穩定幣持有人往來交易等資料控制處分權之尊重，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。"},{"bill":"201110205640000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。","note":"鑒於隱私權之保障及對穩定幣持有人往來交易等資料控制處分權之尊重，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。"},{"bill":"202110209160000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。","note":"鑒於隱私權之保障及對穩定幣持有人往來交易等資料控制處分權之尊重，爰參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對發行與贖回之交易資料及相關資料之保密義務；司法、監察及稅捐稽徵等機關因執行職務得依法取得資料者，不適用保密義務之規定。"},{"bill":"202110209890000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。","note":"鑒於隱私權之保障及對穩定幣持有人往來交易等資料控制處分權之尊重，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。"},{"bill":"202110214790000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。","note":"鑒於隱私權之保障及對穩定幣持有人往來交易等資料控制處分權之尊重，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。"},{"bill":"202110213930000","text":"非穩定幣持有人不得對第三十八條第一項之準備資產為任何之請求或行使其他權利。\n穩定幣發行人破產時，第三十八條第一項之準備資產不屬於其破產財團，穩定幣持有人對於該準備資產，有優先受清償之權。","note":"一、為保障穩定幣持有人之權益，於第一項定明非穩定幣持有人不得對第三十八條第一項準備資產行使任何權利。\n二、參考美國GENIUS法Section 11（a）(1)規定，於第二項定明穩定幣發行人破產時，第三十八條第一項之準備資產不屬於其破產財團之範圍，及穩定幣持有人對於該準備資產有優先受清償之權。"},{"bill":"202110217080000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。","note":"鑒於隱私權之保障及對穩定幣持有人往來交易等資料控制處分權之尊重，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。"}],"changed":true,"final":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或主管機關另有規定者外，應保守秘密。","finalWhy":"鑑於隱私權及穩定幣持有人往來交易等資料控制處分權之保障，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。惟考量司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。","review":null},{"no":"第四十一條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、命其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"虛擬資產服務商違反法令、章程或有其他有礙健全經營之虞之情事者，應許主管機關採取相關管制性不利處分，以控制避免違法情事之擴大。爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，於本條明定主管機關對虛擬資產服務商之處分權。"},{"bill":"202110171550000","text":"虛擬資產服務商經主管機關依本法之規定撤銷或廢止其營業許可或命令停業，或解散或停止全部或部分營業者，應了結其被撤銷、廢止或命令停業前或自行解散或停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項之事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經同意解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或函請入出國管理機關限制其負責人或受僱人出境，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、虛擬資產服務商停止經營其業務時，對其尚未結束之事務應有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，於第一項明定虛擬資產服務商了結事務之義務，並於第二項明定其於了結目的範圍內仍具有處理相關業務權限之擬制規定。\n二、為減少虛擬資產服務商業務中斷對客戶及整體交易市場產生之衝擊，主管機關應有權對問題虛擬資產服務商及其內部人做成相關處分，以及將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。爰參考電子支付機構管理條例第四十條第一項規定，於第三項明定主管機關對問題虛擬資產服務商之處分與清理權限。\n三、退場虛擬資產服務商為了結其事務，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，以降低對其客戶權益之影響與主管機關之清理成本。爰參考電子支付機構管理條例第四十條第二項規定，於第四項明定主管機關得限期要求退場虛擬資產服務商洽其他業者承受其業務以了結其事務。\n四、退場虛擬資產服務商未能依第四項規定洽得其他業者承受其業務時，為促進其事務之了結以及保護客戶權益，應許主管機關指定其他虛擬資產服務商承受之。爰參考證券投資信託及顧問法第九十六條第二項及電子支付機構管理條例第四十條第三項規定，於第五項明定主管機關得指定其他虛擬資產服務商承受退場業者之業務。"},{"bill":"202110199580000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，除依本法處罰外，主管機關並得視情節輕重命令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"虛擬資產服務商之內部人如有違法情事，應許主管機關採取停職或解職之處分，以控制違法情事之擴大及維護整體虛擬資產服務市場之秩序。爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條明定主管機關對虛擬資產服務商內部人之處分權。"},{"bill":"202110203280000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露穩定幣發行相關資訊，將有助於提升大眾對該穩定幣之信心，爰參考美國GENIUS法Section 4(1)、歐盟MiCA規則第二十八條、第五十一條第十三項、香港穩定幣條例第五條(7)，為第一項規定，並於第二項授權主管機關會商中央銀行訂定該等資訊揭露之頻率、程序、方式及其他應遵行事項之辦法。\n二、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料以利監管。"},{"bill":"202110207150000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露穩定幣發行相關資訊，有助於提升大眾對該穩定幣之信心，爰參考美國GENIUS法Section 4（a）(1)、歐盟MiCA規則第二十八條、第五十一條第十三項、香港穩定幣條例第五條(7)，為第一項規定，並於第二項授權主管機關會商中央銀行訂定該等資訊揭露之頻率、程序、方式及其他應遵行事項之辦法。\n二、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料以利監管。"},{"bill":"202110206090000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露穩定幣發行相關資訊，將有助於提升大眾對該穩定幣之信心，爰參考美國GENIUS法Section 4(1)、歐盟MiCA規則第二十八條、第五十一條第十三項、香港穩定幣條例第五條(7)，為第一項規定，並於第二項授權主管機關會商中央銀行訂定該等資訊揭露之頻率、程序、方式及其他應遵行事項之辦法。\n二、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料以利監管。"},{"bill":"201110205640000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露穩定幣發行相關資訊，將有助於提升大眾對該穩定幣之信心，爰參考美國GENIUS法Section 4(1)、歐盟MiCA規則第二十八條、第五十一條第十三項、香港穩定幣條例第五條(7)，為第一項規定，並於第二項授權主管機關會商中央銀行訂定該等資訊揭露之頻率、程序、方式及其他應遵行事項之辦法。\n二、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料以利監管。"},{"bill":"202110209160000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、準備資產之外部審計報告。\n六、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露發行相關資訊，將有助提升大眾對該穩定幣之信心，爰參考美國GENIUS法第四條第一款、歐盟MiCA規則第二十八條、第五十一條第十三項及香港穩定幣條例第五條第七款規定，為第一項規定；第二項授權主管機關會商中央銀行訂定揭露頻率、程序及方式辦法。\n二、第一項第五款增訂應揭露準備資產之外部審計報告，以強化準備資產之透明度與市場信心，爰參考美國GENIUS法第四條第一項第一款第C目規定。\n三、第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料，以利監管，爰參考電子支付機構管理條例第三十四條第一項規定。"},{"bill":"202110209890000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露穩定幣發行相關資訊，將有助於提升大眾對該穩定幣之信心，爰參考美國GENIUS法Section 4(1)、歐盟MiCA規則第二十八條、第五十一條第十三項、香港穩定幣條例第五條(7)，為第一項規定，並於第二項授權主管機關會商中央銀行訂定該等資訊揭露之頻率、程序、方式及其他應遵行事項之辦法。\n二、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料以利監管。"},{"bill":"202110214790000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露穩定幣發行相關資訊，將有助於提升大眾對該穩定幣之信心，爰參考美國GENIUS法Section 4(1)、歐盟MiCA規則第二十八條、第五十一條第十三項、香港穩定幣條例第五條(7)，為第一項規定，並於第二項授權主管機關會商中央銀行訂定該等資訊揭露之頻率、程序、方式及其他應遵行事項之辦法。\n二、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料以利監管。"},{"bill":"202110213930000","text":"穩定幣發行人應就穩定幣發行與贖回建立內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策；其辦法，由主管機關會商中央銀行定之。","note":"一、穩定幣發行人應就穩定幣之發行與贖回建立與維持有效與健全之內部控制及稽核制度、資通系統之安全管理制度及營運持續性政策，以控管其業務相關風險（包括流動性、信用及市場風險）、管理利益衝突及遵循相關法令，並授權主管機關會商中央銀行訂定相關規範，爰為本條規定。\n二、另穩定幣發行人就穩定幣發行業務範圍內負有洗錢防制之義務，發行人若屬金融機構者，本即應依洗錢防制法辦理洗錢防制內部控制與稽核制度等事項；若屬非金融機構者，亦將依洗錢防制法第五條第一項第十八款之指定，適用洗錢防制法相關規定。"},{"bill":"202110217080000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、該穩定幣鏈上智慧合約之地址凍結、黑名單、銷毀、重新發行或合約升級等權限及其治理機制。\n六、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露穩定幣發行相關資訊，將有助於提升大眾對該穩定幣之信心，爰參考美國GENIUS法Section 4(1)、歐盟MiCA規則第二十八條、第五十一條第十三項、香港穩定幣條例第五條(7)，為第一項規定，並為使穩定幣持有人及交易人得評估該穩定幣之可控性與風險，要求揭露穩定幣鏈上智慧合約之地址凍結、黑名單、銷毀、重新發行或升級等權限及治理機制。\n二、於第二項授權主管機關會商中央銀行訂定該等資訊揭露之頻率、程序、方式及其他應遵行事項之辦法。\n三、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料以利監管。"}],"changed":true,"final":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十六條第一項規定進行定期查核之結果。\n五、準備資產之外部審計報告。\n六、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","finalWhy":"一、穩定幣發行人對外揭露發行相關資訊，將有助提升大眾對該穩定幣之信心，爰參考美國GENIUS法第四條第一款、歐盟MiCA規則第二十八條、第五十一條第十三項及香港穩定幣條例第五條第七款規定，為第一項規定；第二項授權主管機關會商中央銀行訂定揭露頻率、程序及方式辦法。\n二、第一項第五款增訂應揭露準備資產之外部審計報告，以強化準備資產之透明度與市場信心，爰參考美國GENIUS法第四條第一項第一款第C目規定。\n三、第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料，以利監管，爰參考電子支付機構管理條例第三十四條第一項規定。","review":null},{"no":"第四十二條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，除依本法處罰外，主管機關並得視情節輕重命令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"虛擬資產服務商之內部人如有違法情事，應許主管機關採取停職或解職之處分，以控制違法情事之擴大及維護整體虛擬資產服務市場之秩序。爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條明定主管機關對虛擬資產服務商內部人之處分權。"},{"bill":"202110171550000","text":"為使虛擬資產服務商未依第二十一條規定交付信託或取得銀行十足履約保證、依前條規定應停業或解散或因違反本法規定而致有損及客戶權益情事時，客戶之權益及客戶所受損害得受補償，應設置虛擬資產基金。\n基金之來源如下：\n一、政府預算撥充。\n二、由加入同業公會之虛擬資產服務商提撥。\n三、捐贈收入。\n四、基金孳息收入。\n五、經合法沒收或扣押之虛擬資產。\n六、其他收入。\n前項第二款之提撥比率，由主管機關審酌經濟、金融發展情形及虛擬資產業者承擔能力，於徵詢同業公會之意見後定之。\n第二項第五款所定之經扣押之虛擬資產，於檢察官認有相當理由應變價時，應先行移撥至虛擬資產基金，其應變價額，由虛擬資產基金鑑定後撥與檢察機關。虛擬資產之鑑定、移撥、交付等相關事項辦法，由主管機關會同法務部訂定之。\n遇有下列情形時，虛擬資產基金得償付之：\n一、虛擬資產服務商因財務困難失卻清償能力時，虛擬資產基金得以第三人之地位向該虛擬資產服務商之客戶為清償，並自清償時起，於清償之限度內承受客戶之權利。\n二、對於違反本法規定且造成二十人以上虛擬資產服務商之客戶受損害之虛擬資產事件，由同業公會認定為同一原因所引起之虛擬資產事件者，虛擬資產基金應負擔客戶提起訴訟或仲裁所應支付之必要費用。\n虛擬資產基金之組織、管理、償付及其他事項之辦法，由主管機關定之。","note":"一、為避免虛擬資產服務商違法未將客戶所託管之法定貨幣資產交付信託或取得銀行十足履約保證、依前條規定應停業或解散或因違反本法規定而致有嚴重損害客戶權益之情事，爰規定設置虛擬資產基金，用以填補客戶之損失。\n二、第二項明定虛擬資產基金來源。鑒於虛擬資產服務商目前大小不一，且各服務商之營運概況亦有差距，為避免造成過大負擔，故基金成立之前二年，政府應由預算撥充一定額度用以成立此基金，以利本法通過前已營業虛擬資產服務商、本法通過時正在申請登記之虛擬資產服務商以及擬加入虛擬資產業界之潛在業者得以順利銜接，不致因提撥基金之要求而徒增業者加入門檻。\n三、第三項明定第二項第二款虛擬資產服務商應提撥之比率，由主管機關審酌經濟、金融發展情形及虛擬資產業者承擔能力，於徵詢同業公會意見後定之。\n四、考量虛擬資產業界倘發生客戶損失，其損失應以虛擬資產居多。為使虛擬資產客戶得以就其所受損之虛擬資產受補償，爰於第二項第五款明定經法務部於刑事案件調查程序中，所扣押之虛擬資產應撥入本基金。惟考量依刑事訴訟法第一百四十條、第一百四十一條所規定之扣押物變價相關程序已有規定，且扣押物並非沒收物，未來仍有免除扣押或返還與行為人之可能；本項規定僅要求將扣押之虛擬資產撥入基金，而非侵害人民財產權，其變價程序仍應有所規定。復於第四項明定第二項第五款所定「經合法扣押之虛擬資產」應撥入虛擬資產基金時，其鑑定、移撥、交付等相關事項辦法，由主管機關會同法務部訂定之。\n五、第五項明定虛擬資產基金得償付之情況，包括虛擬資產業者因財務困難而失去清償能力以致由基金代為清償時，以及虛擬資產業者有違反本法規定之情形而造成二十人以上虛擬資產業者客戶受害，且經同業公會認定為同一原因所引起之虛擬資產事件者，當虛擬資產業者之客戶以訴訟或仲裁程序爭取權益時，虛擬資產基金需負擔客戶進行訴訟或仲裁程序應負擔之費用，以周全客戶權益保護制度。惟相關訴訟或仲裁費用之認定、申請資格等規定，則於第五項授權主管機關定之。\n六、第六項明定虛擬資產基金之組織、管理、償付及其他相關事項之辦法，由主管機關定之。"},{"bill":"202110199580000","text":"虛擬資產服務商經主管機關依本法之規定撤銷或廢止其營業許可或命令停業，或解散或停止全部或部分營業者，應了結其被撤銷、廢止或命令停業前或自行解散或停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項之事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經同意解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或函請入出國管理機關限制其負責人或受僱人出境，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、虛擬資產服務商停止經營其業務時，對其尚未結束之事務應有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，於第一項明定虛擬資產服務商了結事務之義務，並於第二項明定其於了結目的範圍內仍具有處理相關業務權限之擬制規定。\n二、為減少虛擬資產服務商業務中斷對客戶及整體交易市場產生之衝擊，主管機關應有權對問題虛擬資產服務商及其內部人做成相關處分，以及將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。爰參考電子支付機構管理條例第四十條第一項規定，於第三項明定主管機關對問題虛擬資產服務商之處分與清理權限。\n三、退場虛擬資產服務商為了結其事務，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，以降低對其客戶權益之影響與主管機關之清理成本。爰參考電子支付機構管理條例第四十條第二項規定，於第四項明定主管機關得限期要求退場虛擬資產服務商洽其他業者承受其業務以了結其事務。\n四、退場虛擬資產服務商未能依第四項規定洽得其他業者承受其業務時，為促進其事務之了結以及保護客戶權益，應許主管機關指定其他虛擬資產服務商承受之。爰參考證券投資信託及顧問法第九十六條第二項及電子支付機構管理條例第四十條第三項規定，於第五項明定主管機關得指定其他虛擬資產服務商承受退場業者之業務。"},{"bill":"202110203280000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）不得有虛偽、詐欺、隱匿或其他足致他人誤信之行為；違反者，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，為第三項規定。\n二、虛擬資產詐欺以提供涉及重大影響虛擬資產發行或交易之不實資訊為前提，參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項與證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法第二條第十八款及第三條第五款規定，於第二項定明重大影響虛擬資產發行或交易資訊之定義。\n三、虛擬資產交易市場具有高度資訊敏感性，為避免有心人士之操縱行為影響虛擬資產交易價格或供需，進而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之操縱行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、日本金融商品取引法第一百八十五條之二十三及第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項定明禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象等操縱行為。本項操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約、自行或與他人共謀提高、維持或降低虛擬資產之交易價格、自行或與他人共謀提高、維持或降低虛擬資產之供需、散布流言或不實資訊、以非法方法中斷、延遲或危害虛擬資產服務商正常運作，以及其他直接或間接影響虛擬資產交易等行為。\n四、違反第四項規定之行為人，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，為第五項規定。又本項操縱行為以具有不法意圖為要件，故此損害賠償責任解釋上屬故意責任，併予敘明。\n五、為維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定，於第六項定明本條損害賠償請求權之消滅時效。"},{"bill":"202110207150000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時，起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）不得有虛偽、詐欺、隱匿或其他足致他人誤信之行為；違反者，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，為第三項規定。\n二、虛擬資產詐欺以提供涉及重大影響虛擬資產發行或交易之不實資訊為前提，參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項與證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法第二條第十八款及第三條第五款規定，於第二項定明重大影響虛擬資產發行或交易資訊之定義。\n三、虛擬資產交易市場具有高度資訊敏感性，為避免有心人士之操縱行為影響虛擬資產交易價格或供需，進而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之操縱行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、日本金融商品取引法第一百八十五條之二十三及第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項定明禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象等操縱行為。本項操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約、自行或與他人共謀提高、維持或降低虛擬資產之交易價格、自行或與他人共謀提高、維持或降低虛擬資產之供需、散布流言或不實資訊、以非法方法中斷、延遲或危害虛擬資產服務商正常運作，以及其他直接或間接影響虛擬資產交易等行為。\n四、違反第四項規定之行為人，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，為第五項規定。\n五、第三項及第五項之損害賠償責任，前者係行為人為虛偽、詐欺、隱匿或其他足致他人誤信之行為，均以其主觀上具有虛偽、詐欺、隱匿或其他足致他人誤信之行為之故意為構成要件要素；後者操縱行為以具有不法意圖為要件。故該等損害賠償責任解釋上均屬故意責任，併予敘明。\n六、為維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定，於第六項定明本條損害賠償請求權之消滅時效。"},{"bill":"202110206090000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）不得有虛偽、詐欺、隱匿或其他足致他人誤信之行為；違反者，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，為第三項規定。\n二、虛擬資產詐欺以提供涉及重大影響虛擬資產發行或交易之不實資訊為前提，參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項與證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法第二條第十八款及第三條第五款規定，於第二項定明重大影響虛擬資產發行或交易資訊之定義。\n三、虛擬資產交易市場具有高度資訊敏感性，為避免有心人士之操縱行為影響虛擬資產交易價格或供需，進而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之操縱行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、日本金融商品取引法第一百八十五條之二十三及第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項定明禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象等操縱行為。本項操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約、自行或與他人共謀提高、維持或降低虛擬資產之交易價格、自行或與他人共謀提高、維持或降低虛擬資產之供需、散布流言或不實資訊、以非法方法中斷、延遲或危害虛擬資產服務商正常運作，以及其他直接或間接影響虛擬資產交易等行為。\n四、違反第四項規定之行為人，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，為第五項規定。又本項操縱行為以具有不法意圖為要件，故此損害賠償責任解釋上屬故意責任，併予敘明。\n五、為維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定，於第六項定明本條損害賠償請求權之消滅時效。"},{"bill":"201110205640000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）不得有虛偽、詐欺、隱匿或其他足致他人誤信之行為；違反者，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，為第三項規定。\n二、虛擬資產詐欺以提供涉及重大影響虛擬資產發行或交易之不實資訊為前提，參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項與證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法第二條第十八款及第三條第五款規定，於第二項定明重大影響虛擬資產發行或交易資訊之定義。\n三、虛擬資產交易市場具有高度資訊敏感性，為避免有心人士之操縱行為影響虛擬資產交易價格或供需，進而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之操縱行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、日本金融商品取引法第一百八十五條之二十三及第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項定明禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象等操縱行為。本項操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約、自行或與他人共謀提高、維持或降低虛擬資產之交易價格、自行或與他人共謀提高、維持或降低虛擬資產之供需、散布流言或不實資訊、以非法方法中斷、延遲或危害虛擬資產服務商正常運作，以及其他直接或間接影響虛擬資產交易等行為。\n四、違反第四項規定之行為人，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，為第五項規定。又本項操縱行為以具有不法意圖為要件，故此損害賠償責任解釋上屬故意責任，併予敘明。\n五、為維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定，於第六項定明本條損害賠償請求權之消滅時效。"},{"bill":"202110209160000","text":"符合下列條件之支付型穩定幣，不屬證券交易法所稱有價證券，亦不屬期貨交易法所稱商品，其發行、買賣、移轉及保管等行為，不適用證券交易法及期貨交易法相關規定，由本法統一規範：\n一、依第三十四條取得主管機關許可發行，或依第三十五條取得主管機關認可之境外穩定幣。\n二、以十足法定貨幣準備資產為支撐，且維持與法定貨幣一比一之固定兌換比率。\n三、發行人對持幣人負有隨時依面額贖回之義務。\n四、不具投資目的，係以支付或結算為主要用途。\n前項規定不影響證券交易法或期貨交易法對以穩定幣為媒介之有價證券交易、穩定幣與期貨商品之連結交易，或其他性質上屬有價證券或商品之虛擬資產交易之適用。\n主管機關應依本條規定，就現行法規命令中涉及穩定幣定性之相關規定，與金融監督管理委員會所轄各局會商修正。","note":"一、本條爰明定符合條件之支付型穩定幣不屬證券交易法所稱有價證券，亦不屬期貨交易法所稱商品，由本法統一規範，以降低業者合規不確定性。\n二、目前國內法規對穩定幣之法律性質存在模糊地帶，業者面臨是否需同時申請證券商或期貨商許可之疑慮，不確定性阻礙市場健全發展；本條參考美國GENIUS法第十七條（明確修正一九三三年證券法、一九三四年證券交易法、投資公司法及商品交易法）、歐盟MiCA規則（明定符合監管要求之穩定幣不適用MiFID II）及香港穩定幣條例之監管邊界明確化設計，以明確之立法消弭前開疑慮。\n三、第二項明定保留條款，以穩定幣為媒介之有價證券交易仍適用證券交易法，防止業者以穩定幣包裝規避有價證券監管。\n四、第三項要求主管機關主動與金管會所轄各局完成法規協調，確保法律確定性落地執行。"},{"bill":"202110209890000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）不得有虛偽、詐欺、隱匿或其他足致他人誤信之行為；違反者，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，為第三項規定。\n二、虛擬資產詐欺以提供涉及重大影響虛擬資產發行或交易之不實資訊為前提，參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項與證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法第二條第十八款及第三條第五款規定，於第二項定明重大影響虛擬資產發行或交易資訊之定義。\n三、虛擬資產交易市場具有高度資訊敏感性，為避免有心人士之操縱行為影響虛擬資產交易價格或供需，進而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之操縱行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、日本金融商品取引法第一百八十五條之二十三及第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項定明禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象等操縱行為。本項操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約、自行或與他人共謀提高、維持或降低虛擬資產之交易價格、自行或與他人共謀提高、維持或降低虛擬資產之供需、散布流言或不實資訊、以非法方法中斷、延遲或危害虛擬資產服務商正常運作，以及其他直接或間接影響虛擬資產交易等行為。\n四、違反第四項規定之行為人，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，為第五項規定。又本項操縱行為以具有不法意圖為要件，故此損害賠償責任解釋上屬故意責任，併予敘明。\n五、為維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定，於第六項定明本條損害賠償請求權之消滅時效。"},{"bill":"202110214790000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）不得有虛偽、詐欺、隱匿或其他足致他人誤信之行為；違反者，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，為第三項規定。\n二、虛擬資產詐欺以提供涉及重大影響虛擬資產發行或交易之不實資訊為前提，參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項與證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法第二條第十八款及第三條第五款規定，於第二項定明重大影響虛擬資產發行或交易資訊之定義。\n三、虛擬資產交易市場具有高度資訊敏感性，為避免有心人士之操縱行為影響虛擬資產交易價格或供需，進而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之操縱行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、日本金融商品取引法第一百八十五條之二十三及第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項定明禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象等操縱行為。本項操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約、自行或與他人共謀提高、維持或降低虛擬資產之交易價格、自行或與他人共謀提高、維持或降低虛擬資產之供需、散布流言或不實資訊、以非法方法中斷、延遲或危害虛擬資產服務商正常運作，以及其他直接或間接影響虛擬資產交易等行為。\n四、違反第四項規定之行為人，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，為第五項規定。又本項操縱行為以具有不法意圖為要件，故此損害賠償責任解釋上屬故意責任，併予敘明。\n五、為維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定，於第六項定明本條損害賠償請求權之消滅時效。"},{"bill":"202110213930000","text":"穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料，除依其他法律或符合主管機關規定之特殊情形者外，應保守秘密。","note":"鑒於隱私權之保障及對穩定幣持有人往來交易等資料控制處分權之尊重，參考電子支付機構管理條例第三十一條規定，於本條定明穩定幣發行人對於穩定幣發行與贖回之交易資料及其他相關資料之保密義務。另鑒於司法、監察及稅捐稽徵等機關因執行職務得依法取得客戶資料，爰於除書定明依其他法律或符合主管機關規定之特殊情形者，不適用保密義務之規定。"},{"bill":"202110217080000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）不得有虛偽、詐欺、隱匿或其他足致他人誤信之行為；違反者，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，為第三項規定。\n二、虛擬資產詐欺以提供涉及重大影響虛擬資產發行或交易之不實資訊為前提，參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項與證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法第二條第十八款及第三條第五款規定，於第二項定明重大影響虛擬資產發行或交易資訊之定義。\n三、虛擬資產交易市場具有高度資訊敏感性，為避免有心人士之操縱行為影響虛擬資產交易價格或供需，進而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之操縱行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、日本金融商品取引法第一百八十五條之二十三及第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項定明禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象等操縱行為。本項操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約、自行或與他人共謀提高、維持或降低虛擬資產之交易價格、自行或與他人共謀提高、維持或降低虛擬資產之供需、散布流言或不實資訊、以非法方法中斷、延遲或危害虛擬資產服務商正常運作，以及其他直接或間接影響虛擬資產交易等行為。\n四、違反第四項規定之行為人，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，為第五項規定。又本項操縱行為以具有不法意圖為要件，故此損害賠償責任解釋上屬故意責任，併予敘明。\n五、為維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定，於第六項定明本條損害賠償請求權之消滅時效。"}],"changed":true,"final":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，除虛擬資產服務商依主管機關規範，為維持交易市場價格衡平所為之必要措施外，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","finalWhy":"照委員所提修正動議通過。,,,,,,","review":null},{"no":"第四十三條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商經主管機關依本法之規定撤銷或廢止其營業許可或命令停業，或解散或停止全部或部分營業者，應了結其被撤銷、廢止或命令停業前或自行解散或停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項之事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經同意解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或函請入出國管理機關限制其負責人或受僱人出境，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、虛擬資產服務商停止經營其業務時，對其尚未結束之事務應有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，於第一項明定虛擬資產服務商了結事務之義務，並於第二項明定其於了結目的範圍內仍具有處理相關業務權限之擬制規定。\n二、為減少虛擬資產服務商業務中斷對客戶及整體交易市場產生之衝擊，主管機關應有權對問題虛擬資產服務商及其內部人做成相關處分，以及將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。爰參考電子支付機構管理條例第四十條第一項規定，於第三項明定主管機關對問題虛擬資產服務商之處分與清理權限。\n三、退場虛擬資產服務商為了結其事務，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，以降低對其客戶權益之影響與主管機關之清理成本。爰參考電子支付機構管理條例第四十條第二項規定，於第四項明定主管機關得限期要求退場虛擬資產服務商洽其他業者承受其業務以了結其事務。\n四、退場虛擬資產服務商未能依第四項規定洽得其他業者承受其業務時，為促進其事務之了結以及保護客戶權益，應許主管機關指定其他虛擬資產服務商承受之。爰參考證券投資信託及顧問法第九十六條第二項及電子支付機構管理條例第四十條第三項規定，於第五項明定主管機關得指定其他虛擬資產服務商承受退場業者之業務。"},{"bill":"202110171550000","text":"違反第三十七條第一項或第四項之規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，如自動繳交全部犯罪所得者，減輕或免除其刑；並因而查獲其他正犯或共犯者，免除其刑。\n犯第一項之罪，在偵查中自白，如自動繳交全部犯罪所得者，減輕其刑；並因而查獲其他正犯或共犯者，減輕其刑至二分之一。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，可能面臨事證調查不易及救濟不足之困難，故有課予刑事責任以嚇阻之，俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款及第四項至第七項及期貨交易法第一百十二條第一項至第四項規定，於第一項明定虛擬資產詐欺或操縱罪之刑事責任，並於第二項及第三項明定犯罪後自首與偵查中自白的減刑規定，以及於第四項及第五項明定犯罪所得之相關規定。"},{"bill":"202110199580000","text":"為促進金融科技創新，主管機關應設立金融科技創新發展基金。\n基金之來源如下：\n一、由政府循預算程序之撥充。\n二、捐贈收入。\n三、基金孳息收入。\n四、其他收入。\n基金用途如下：\n一、增進數位金融韌性、補助金融科技研發、培育金融技術人才等有關促進金融科技創新發展之用途。\n二、補助相關同業公會辦理教育宣導。\n金融科技創新發展基金之組織、管理及運用等事項之辦法，由主管機關定之。","note":"一、有鑑於金融科技正快速重塑全球金融基礎，為強化我國在國際上競爭力並提升我國金融韌性，政府應設立金融科技創新發展基金。\n二、第二項明定金融科技創新發展基金來源。\n三、第三項明定金融科技創新發展基金用途。\n四、第四項明定金融科技創新發展基金之組織、管理及運用等相關事項之辦法，由主管機關定之。"},{"bill":"202110203280000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料應有檢查權，範圍包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制等，爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，為第一項規定，並於第二項定明主管機關得指定適當專門職業或技術人員執行檢查業務。\n二、為維護虛擬資產市場健全，並保障交易人權益，爰參考期貨交易法第六條第三項、第九十九條第一項及證券投資信託及顧問法第一百零一條規定，於第三項定明主管機關得請求其他機關或令金融機構提供必要資訊或紀錄。所稱金融機構，係指對大眾提供金融服務並受主管機關監管之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業，併予敘明。\n三、為保障各該事業、機構或關係人之營業秘密，爰於第四項定明除為健全監理或保護交易人之必要外，主管機關依本條所得之資訊，不得公布或提供他人。\n四、第五項授權主管機關就第一項關係人之範圍另定規範。"},{"bill":"202110207150000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料應有檢查權，範圍包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制等，爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，為第一項規定，並於第二項定明主管機關得指定適當專門職業或技術人員執行檢查業務。\n二、為維護虛擬資產市場健全，並保障交易人權益，爰參考期貨交易法第六條第三項、第九十九條第一項及證券投資信託及顧問法第一百零一條規定，於第三項定明主管機關得請求其他機關或令金融機構提供必要資訊或紀錄。所稱金融機構，係指對大眾提供金融服務並受主管機關監管之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業，併予敘明。\n三、為保障各該事業、機構或關係人之營業秘密，爰於第四項定明除為健全監理或保護交易人之必要外，主管機關依本條所得之資訊，不得公布或提供他人。\n四、第五項授權主管機關就第一項關係人之範圍另定規範。"},{"bill":"202110206090000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料應有檢查權，範圍包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制等，爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，為第一項規定，並於第二項定明主管機關得指定適當專門職業或技術人員執行檢查業務。\n二、為維護虛擬資產市場健全，並保障交易人權益，爰參考期貨交易法第六條第三項、第九十九條第一項及證券投資信託及顧問法第一百零一條規定，於第三項定明主管機關得請求其他機關或令金融機構提供必要資訊或紀錄。所稱金融機構，係指對大眾提供金融服務並受主管機關監管之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業，併予敘明。\n三、為保障各該事業、機構或關係人之營業秘密，爰於第四項定明除為健全監理或保護交易人之必要外，主管機關依本條所得之資訊，不得公布或提供他人。\n四、第五項授權主管機關就第一項關係人之範圍另定規範。"},{"bill":"201110205640000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料應有檢查權，範圍包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制等，爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，為第一項規定，並於第二項定明主管機關得指定適當專門職業或技術人員執行檢查業務。\n二、為維護虛擬資產市場健全，並保障交易人權益，爰參考期貨交易法第六條第三項、第九十九條第一項及證券投資信託及顧問法第一百零一條規定，於第三項定明主管機關得請求其他機關或令金融機構提供必要資訊或紀錄。所稱金融機構，係指對大眾提供金融服務並受主管機關監管之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業，併予敘明。\n三、為保障各該事業、機構或關係人之營業秘密，爰於第四項定明除為健全監理或保護交易人之必要外，主管機關依本條所得之資訊，不得公布或提供他人。\n四、第五項授權主管機關就第一項關係人之範圍另定規範。"},{"bill":"202110209160000","text":"為支持虛擬資產市場之創新發展，依本法許可之虛擬資產服務商，得申請辦理虛擬資產衍生性商品及代幣化資產相關業務。\n前項業務之範圍、許可條件、資格要求、業務規範及其他應遵行事項之辦法，由主管機關定之；涉及中央銀行職掌事項者，應會商中央銀行定之。\n主管機關訂定前項辦法前，應廣泛徵詢業者、學者、消費者保護機構及相關機關之意見，並對外公開說明政策方向。","note":"一、本條為採保守立法精神，爰僅在母法層次確立依本法許可之虛擬資產服務商得申請辦理虛擬資產衍生性商品及代幣化資產相關業務之法律基礎，細部規定全部授權主管機關以辦法定之，俾主管機關得依市場成熟度及國際規範發展逐步調整，無須修法即可因應市場變化。\n二、「代幣化資產相關業務」之涵蓋，使主管機關在制定子法時，得就代幣化資產（RWA）之交換、移轉、保管等事項一併納入規範，實現以子法靈活管理代幣化資產業務之政策目標。\n三、第三項廣泛徵詢程序確保子法制定具有充分市場基礎及民主正當性，爰參考歐盟MiCA規則委任立法之諮詢程序精神。\n四、主管機關得針對一般散戶與專業投資人設置不同之准入機制（如投資門檻限制），以強化消費者保護。"},{"bill":"202110209890000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料應有檢查權，範圍包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制等，爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，為第一項規定，並於第二項定明主管機關得指定適當專門職業或技術人員執行檢查業務。\n二、為維護虛擬資產市場健全，並保障交易人權益，爰參考期貨交易法第六條第三項、第九十九條第一項及證券投資信託及顧問法第一百零一條規定，於第三項定明主管機關得請求其他機關或令金融機構提供必要資訊或紀錄。所稱金融機構，係指對大眾提供金融服務並受主管機關監管之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業，併予敘明。\n三、為保障各該事業、機構或關係人之營業秘密，爰於第四項定明除為健全監理或保護交易人之必要外，主管機關依本條所得之資訊，不得公布或提供他人。\n四、第五項授權主管機關就第一項關係人之範圍另定規範。"},{"bill":"202110214790000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料應有檢查權，範圍包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制等，爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，為第一項規定，並於第二項定明主管機關得指定適當專門職業或技術人員執行檢查業務。\n二、為維護虛擬資產市場健全，並保障交易人權益，爰參考期貨交易法第六條第三項、第九十九條第一項及證券投資信託及顧問法第一百零一條規定，於第三項定明主管機關得請求其他機關或令金融機構提供必要資訊或紀錄。所稱金融機構，係指對大眾提供金融服務並受主管機關監管之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業，併予敘明。\n三、為保障各該事業、機構或關係人之營業秘密，爰於第四項定明除為健全監理或保護交易人之必要外，主管機關依本條所得之資訊，不得公布或提供他人。\n四、第五項授權主管機關就第一項關係人之範圍另定規範。"},{"bill":"202110213930000","text":"穩定幣發行人應對外揭露下列資訊：\n一、發行說明文書。\n二、準備資產管理政策及穩定幣贖回政策。\n三、流通在外之穩定幣餘額。\n四、準備資產之組成內容、價值及依第三十八條第一項規定進行定期查核之結果。\n五、其他主管機關指定之資訊。\n前項資訊揭露之頻率、程序、方式及其他應遵行事項之辦法，由主管機關會商中央銀行定之。\n穩定幣發行人應依主管機關及中央銀行之規定，申報穩定幣發行相關資料。","note":"一、穩定幣發行人對外揭露穩定幣發行相關資訊，將有助於提升大眾對該穩定幣之信心，爰參考美國GENIUS法Section 4(1)、歐盟MiCA規則第二十八條、第五十一條第十三項、香港穩定幣條例第五條(7)，為第一項規定，並於第二項授權主管機關會商中央銀行訂定該等資訊揭露之頻率、程序、方式及其他應遵行事項之辦法。\n二、參考電子支付機構管理條例第三十四條第一項規定，於第三項定明穩定幣發行人應向主管機關及中央銀行申報發行相關資料以利監管。"},{"bill":"202110217080000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關得自行或委託適當機構，建立虛擬資產高風險地址之通報、查詢及回饋機制，並得會商法務部調查局、內政部警政署及虛擬資產服務商同業公會辦理。\n前項機制之功能應包括詐騙地址、駭客地址、受制裁及資恐地址之通報與同步、被害人報案地址之關聯、供虛擬資產服務商查詢之介接、風險標籤之解除或更正，以及查詢與命中紀錄之保存。\n虛擬資產服務商應依主管機關規定，向前項機制通報及查詢高風險地址資訊；其通報、查詢、資料保護、爭議處理及其他應遵行事項之辦法，由主管機關定之。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n執行本條所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料應有檢查權，範圍包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制等，爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，為第一項規定，並於第四項定明主管機關得指定適當專門職業或技術人員執行檢查業務。\n二、反詐實務最大痛點並非欠缺個案，而是不法地址散落於各機關、各交易平台及各分析工具之間，無法形成得快速攔阻之共同風險資料庫。爰於本條第二項至第四項授權主管機關自行或委託適當機構，並會商法務部調查局、內政部警政署及虛擬資產服務商同業公會，建立高風險地址通報、查詢及回饋機制，使本法兼具反詐與數位金融安全基礎建設之功能。\n三、為維護虛擬資產市場健全，並保障交易人權益，爰參考期貨交易法第六條第三項、第九十九條第一項及證券投資信託及顧問法第一百零一條規定，於第六項定明主管機關得請求其他機關或令金融機構提供必要資訊或紀錄。所稱金融機構，係指對大眾提供金融服務並受主管機關監管之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業，併予敘明。\n四、為保障各該事業、機構或關係人之營業秘密，爰於第七項定明除為健全監理或保護交易人之必要外，主管機關依本條所得之資訊，不得公布或提供他人。\n五、第八項授權主管機關就第一項關係人之範圍另定規範。"}],"changed":true,"final":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n主管機關應協助司法警察機關向虛擬資產服務商調閱虛擬資產高風險地址資料，並督導虛擬資產服務商配合司法警察機關建立聯防通報機制；虛擬資產服務商於接獲司法警察機關之通報時，應對通報之虛擬資產地址持續監控。\n執行本條所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","finalWhy":"照委員所提修正動議通過。,,,,,,","review":null},{"no":"第四十四條","current":null,"versions":[{"bill":"202110137730000","text":"為使虛擬資產服務商未依第二十一條規定交付信託或取得銀行十足履約保證、依前條規定應停業或解散或因違反本法規定而致有損及客戶權益情事時，客戶之權益及客戶所受損害得受補償，應設置虛擬資產基金。\n基金之來源如下：\n一、政府預算撥充。\n二、由加入同業公會之虛擬資產服務商提撥。\n三、捐贈收入。\n四、基金孳息收入。\n五、經合法沒收或扣押之虛擬資產。\n六、其他收入。\n前項第二款之提撥比率，由主管機關審酌經濟、金融發展情形及虛擬資產業者承擔能力，於徵詢同業公會之意見後定之。\n第二項第五款所定之經扣押之虛擬資產，於檢察官認有相當理由應變價時，應先行移撥至虛擬資產基金，其應變價額，由虛擬資產基金鑑定後撥與檢察機關。虛擬資產之鑑定、移撥、交付等相關事項辦法，由主管機關會同法務部訂定之。\n遇有下列情形時，虛擬資產基金得償付之：\n一、虛擬資產服務商因財務困難失卻清償能力時，虛擬資產基金得以第三人之地位向該虛擬資產服務商之客戶為清償，並自清償時起，於清償之限度內承受客戶之權利。\n二、對於違反本法規定且造成二十人以上虛擬資產服務商之客戶受損害之虛擬資產事件，由同業公會認定為同一原因所引起之虛擬資產事件者，虛擬資產基金應負擔客戶提起訴訟或仲裁所應支付之必要費用。\n虛擬資產基金之組織、管理、償付及其他事項之辦法，由主管機關定之。","note":"一、為避免虛擬資產服務商違法未將客戶所託管之法定貨幣資產交付信託或取得銀行十足履約保證、依前條規定應停業或解散或因違反本法規定而致有嚴重損害客戶權益之情事，爰規定設置虛擬資產基金，用以填補客戶之損失。\n二、第二項明定虛擬資產基金來源。鑒於虛擬資產服務商目前大小不一，且各服務商之營運概況亦有差距，為避免造成過大負擔，故基金成立之前二年，政府應由預算撥充一定額度用以成立此基金，以利本法通過前已營業虛擬資產服務商、本法通過時正在申請登記之虛擬資產服務商以及擬加入虛擬資產業界之潛在業者得以順利銜接，不致因提撥基金之要求而徒增業者加入門檻。\n三、第三項明定第二項第二款虛擬資產服務商應提撥之比率，由主管機關審酌經濟、金融發展情形及虛擬資產業者承擔能力，於徵詢同業公會意見後定之。\n四、考量虛擬資產業界倘發生客戶損失，其損失應以虛擬資產居多。為使虛擬資產客戶得以就其所受損之虛擬資產受補償，爰於第二項第五款明定經法務部於刑事案件調查程序中，所扣押之虛擬資產應撥入本基金。惟考量依刑事訴訟法第一百四十條、第一百四十一條所規定之扣押物變價相關程序已有規定，且扣押物並非沒收物，未來仍有免除扣押或返還與行為人之可能；本項規定僅要求將扣押之虛擬資產撥入基金，而非侵害人民財產權，其變價程序仍應有所規定。復於第四項明定第二項第五款所定「經合法扣押之虛擬資產」應撥入虛擬資產基金時，其鑑定、移撥、交付等相關事項辦法，由主管機關會同法務部訂定之。\n五、第五項明定虛擬資產基金得償付之情況，包括虛擬資產業者因財務困難而失去清償能力以致由基金代為清償時，以及虛擬資產業者有違反本法規定之情形而造成二十人以上虛擬資產業者客戶受害，且經同業公會認定為同一原因所引起之虛擬資產事件者，當虛擬資產業者之客戶以訴訟或仲裁程序爭取權益時，虛擬資產基金需負擔客戶進行訴訟或仲裁程序應負擔之費用，以周全客戶權益保護制度。惟相關訴訟或仲裁費用之認定、申請資格等規定，則於第五項授權主管機關定之。\n六、第六項明定虛擬資產基金之組織、管理、償付及其他相關事項之辦法，由主管機關定之。"},{"bill":"202110171550000","text":"違反第七條第一項、第三項或第三十五條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、未依本法規定取得許可即經營虛擬資產業務者，不只妨礙主管機關對虛擬資產服務之管理與維護大眾客戶資產安全，從而可能損及客戶權益及市場健全外，亦損害其他虛擬資產服務商之公平競爭權益；又穩定幣發行則涉及向大眾吸收資金，對於金融市場秩序及社會大眾權益影響甚鉅，故兩者均有必要課予刑事責任以嚇阻其不法行為，且於有期徒刑之外併科相當程度之罰金，以嚇阻相關行為人未經許可經營虛擬資產業務或發行穩定幣以妄圖吸收大眾資產。爰參考期貨交易法第一百十二條第五項規定，於第一項明定未經許可經營虛擬資產業務或發行穩定幣之刑事責任。\n二、針對未經許可經營虛擬資產服務業務者，除對該虛擬資產服務商之行為負責人課予刑事責任外，對該虛擬資產服務商亦應設有對應之刑事責任，以督促其行為負責人以外之內部人監督預防此不法行為，俾維護整體虛擬資產服務市場公信力；針對穩定幣發行人，亦同。爰參考電子支付機構管理條例第四十六條第三項規定，於第二項明定法人之刑事責任。"},{"bill":"202110199580000","text":"違反第三十八條第一項或第四項之規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。\n應發還或沒收之犯罪所得，屬虛擬資產者，以虛擬資產抵充之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，可能面臨事證調查不易及救濟不足之困難，故有課予刑事責任以嚇阻之，俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款及第四項至第七項及期貨交易法第一百十二條第一項至第四項規定，於第一項明定虛擬資產詐欺或操縱罪之刑事責任，並於第二項及第三項明定犯罪後自首與偵查中自白的減刑規定，以及於第四項及第五項明定犯罪所得之相關規定。\n二、為保障犯罪被害人之求償權，並使虛擬資產客戶得以就其所受損之虛擬資產受補償，爰參酌民法回復原狀及清償之法理，增訂第六項之規定。"},{"bill":"202110203280000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。"},{"bill":"202110207150000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。"},{"bill":"202110206090000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。"},{"bill":"201110205640000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。"},{"bill":"202110209160000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明禁止虛偽詐欺行為，並於第三項定明民事賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定。\n二、第二項定明重大影響虛擬資產發行或交易資訊之定義，爰參考歐盟MiCA規則第八十七條第四項及我國證券交易法第一百五十七條之一第五項規定。\n三、第四項定明禁止操縱行為，解釋上可包括洗售交易、共謀拉抬或壓低價格、散布不實資訊及其他影響虛擬資產交易等行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、韓國虛擬資產使用者保護法第十條第二項至第四項及我國證券交易法第一百五十五條第一項規定，並於第五項定明民事賠償責任，爰參考我國證券交易法第一百五十五條第三項規定。\n四、第六項定明損害賠償請求權之消滅時效，以維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定。"},{"bill":"202110209890000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。"},{"bill":"202110214790000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。"},{"bill":"202110213930000","text":"虛擬資產之發行或交易，不得就足以重大影響虛擬資產發行或交易之資訊有虛偽、詐欺、隱匿或其他足致他人誤信之行為。\n前項所稱有重大影響虛擬資產發行或交易之資訊，指對虛擬資產發行或交易價格有重大影響，或對正當交易人之認購或交易決定有重大影響之資訊。\n違反第一項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n對於虛擬資產，不得意圖影響虛擬資產交易之價格或意圖造成虛擬資產交易活絡之表象，而為直接或間接從事影響虛擬資產交易價格或供需之操縱行為。\n違反前項規定者，對於該虛擬資產之善意交易人因而所受之損害，應負賠償責任。\n第三項及前項規定之損害賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、虛擬資產市場具有高度資訊敏感性，為避免不實資訊影響市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之詐欺行為，爰參考歐盟MiCA規則第九十一條第二項第b款、日本金融商品取引法第一百八十五條之二十二、韓國虛擬資產使用者保護法第十條第四項、我國證券交易法第二十條第一項及期貨交易法第一百零八條第一項規定，於第一項定明於虛擬資產初級發行市場或次級交易市場（例如虛擬資產間或與法定貨幣間之交換市場）不得有虛偽、詐欺、隱匿或其他足致他人誤信之行為；違反者，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第二十條第三項規定，為第三項規定。\n二、虛擬資產詐欺以提供涉及重大影響虛擬資產發行或交易之不實資訊為前提，參考歐盟MiCA規則第八十七條第四項、我國證券交易法第一百五十七條之一第五項與證券交易法第一百五十七條之一第五項及第六項重大消息範圍及其公開方式管理辦法第二條第十八款及第三條第五款規定，於第二項定明重大影響虛擬資產發行或交易資訊之定義。\n三、虛擬資產交易市場具有高度資訊敏感性，為避免有心人士之操縱行為影響虛擬資產交易價格或供需，進而影響虛擬資產交易市場健全性，故IOSCO最終報告之建議八建議會員應規範虛擬資產市場之操縱行為，爰參考歐盟MiCA規則第九十一條第二項及第三項、日本金融商品取引法第一百八十五條之二十三及第一百八十五條之二十四、韓國虛擬資產使用者保護法第十條第二項至第四項、我國證券交易法第一百五十五條第一項及期貨交易法第一百零六條規定，於第四項定明禁止意圖影響虛擬資產交易之價格或造成某種虛擬資產交易活絡之表象等操縱行為。本項操縱行為，解釋上可包括無意取得或處分虛擬資產而為虛偽之虛擬資產交易或交易要約、自行或與他人共謀提高、維持或降低虛擬資產之交易價格、自行或與他人共謀提高、維持或降低虛擬資產之供需、散布流言或不實資訊、以非法方法中斷、延遲或危害虛擬資產服務商正常運作，以及其他直接或間接影響虛擬資產交易等行為。\n四、違反第四項規定之行為人，對該虛擬資產善意交易人所受損害應負賠償責任，爰參考韓國虛擬資產使用者保護法第十條第六項及我國證券交易法第一百五十五條第三項規定，為第五項規定。又本項操縱行為以具有不法意圖為要件，故此損害賠償責任解釋上屬故意責任，併予敘明。\n五、為維護法律秩序及交易之安定性，爰參考證券交易法第二十一條、期貨交易法第八十四條第五項及證券投資信託及顧問法第九條第二項規定，於第六項定明本條損害賠償請求權之消滅時效。"},{"bill":"202110217080000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。"}],"changed":true,"final":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","finalWhy":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。","review":null},{"no":"第四十五條","current":null,"versions":[{"bill":"202110137730000","text":"違反第三十九條第一項或第四項之規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，如自動繳交全部犯罪所得者，減輕或免除其刑；並因而查獲其他正犯或共犯者，免除其刑。\n犯第一項之罪，在偵查中自白，如自動繳交全部犯罪所得者，減輕其刑；並因而查獲其他正犯或共犯者，減輕其刑至二分之一。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，可能面臨事證調查不易及救濟不足之困難，故有課予刑事責任以嚇阻之，俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款及第四項至第七項及期貨交易法第一百十二條第一項至第四項規定，於第一項明定虛擬資產詐欺或操縱罪之刑事責任，並於第二項及第三項明定犯罪後自首與偵查中自白的減刑規定，以及於第四項及第五項明定犯罪所得之相關規定。"},{"bill":"202110171550000","text":"虛擬資產服務商違反第十八條第四項或第十九條第二項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商亦科以前項所定罰金。","note":"虛擬資產服務商違反其保管客戶資產義務，以及虛擬資產服務商違法動用客戶資產者，涉及大眾客戶資產安全，影響客戶權益及市場信任甚鉅，有必要對虛擬資產服務商行為負責人課予刑事責任以嚇阻此不法行為，以及對虛擬資產服務商課予對應刑事責任以督促其完善內部管理制度，俾維護整體虛擬資產服務市場公信力。爰參考電子支付機構管理條例第四十七條規定，於第一項明定虛擬資產服務商違法動用客戶資產之刑事責任，並於第二項明定併罰虛擬資產服務商之規定。"},{"bill":"202110199580000","text":"違反第七條第一項、第三項或第三十六條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、未依本法規定取得許可即經營虛擬資產業務者，不只妨礙主管機關對虛擬資產服務之管理與維護大眾客戶資產安全，從而可能損及客戶權益及市場健全外，亦損害其他虛擬資產服務商之公平競爭權益；又穩定幣發行則涉及向大眾吸收資金，對於金融市場秩序及社會大眾權益影響甚鉅，故兩者均有必要課予刑事責任以嚇阻其不法行為，且於有期徒刑之外併科相當程度之罰金，以嚇阻相關行為人未經許可經營虛擬資產業務或發行穩定幣以妄圖吸收大眾資產。爰參考期貨交易法第一百十二條第五項規定，於第一項明定未經許可經營虛擬資產業務或發行穩定幣之刑事責任。\n二、針對未經許可經營虛擬資產服務業務者，除對該虛擬資產服務商之行為負責人課予刑事責任外，對該虛擬資產服務商亦應設有對應之刑事責任，以督促其行為負責人以外之內部人監督預防此不法行為，俾維護整體虛擬資產服務市場公信力；針對穩定幣發行人，亦同。爰參考電子支付機構管理條例第四十六條第三項規定，於第二項明定法人之刑事責任。"},{"bill":"202110203280000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。"},{"bill":"202110207150000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。"},{"bill":"202110206090000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。"},{"bill":"201110205640000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。"},{"bill":"202110209160000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。\n虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"一、第一項至第三項定明主管機關之檢查權，範圍包括服務商使用中心化帳本或分散式帳本保存之電磁紀錄、於境內外服務商之虛擬資產帳號、使用之錢包及相關技術與管理機制等。\n二、第四項定明主管機關對違規服務商之各種處分手段，以避免違法情事擴大，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定。\n三、第五項定明主管機關對服務商負責人或受僱人之停職解職處分權，以維護整體市場秩序，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定。"},{"bill":"202110209890000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。"},{"bill":"202110214790000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。"},{"bill":"202110213930000","text":"主管機關為保護公益或交易人利益或維護市場秩序，得隨時令虛擬資產服務商、同業公會、穩定幣發行人或與其有財務或業務往來之關係人，於期限內提出財務、業務報告或其他相關資料，並得直接派員或委託適當機構，檢查虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料；發現有違反法令之重大嫌疑者，並得封存或調取其有關文件。\n主管機關認為必要時，得隨時指定律師、會計師或其他專門職業或技術人員為前項之檢查，並向主管機關據實提出報告或表示意見，其費用由被檢查人負擔。\n主管機關對於有違反本法行為之虞者，得請求其他機關或令金融機構提供必要資訊或紀錄。\n前三項所得之資訊，除為健全監理及保護交易人之必要外，不得公布或提供他人。\n第一項關係人之範圍，由主管機關定之。","note":"一、為保護公益或交易人利益或維護虛擬資產交易市場秩序，主管機關對虛擬資產服務商、同業公會、穩定幣發行人或其關係人之營業、財產、設備、帳簿、書類、電磁紀錄、系統、錢包或其他有關物件或資料應有檢查權，範圍包括其使用中心化帳本或於分散式帳本保存之電磁紀錄、於境內外虛擬資產服務商之虛擬資產帳號、使用之錢包以及相關技術與管理機制等，爰參考證券交易法第六十四條、期貨交易法第九十八條及證券投資信託及顧問法第一百零一條規定，為第一項規定，並於第二項定明主管機關得指定適當專門職業或技術人員執行檢查業務。\n二、為維護虛擬資產市場健全，並保障交易人權益，爰參考期貨交易法第六條第三項、第九十九條第一項及證券投資信託及顧問法第一百零一條規定，於第三項定明主管機關得請求其他機關或令金融機構提供必要資訊或紀錄。所稱金融機構，係指對大眾提供金融服務並受主管機關監管之金融服務業，包含金融監督管理委員會組織法第二條第三項規定之銀行業、證券業、期貨業及保險業、電子支付機構管理條例第三條第一款之電子支付機構及其他主管機關指定之金融服務業，併予敘明。\n三、為保障各該事業、機構或關係人之營業秘密，爰於第四項定明除為健全監理或保護交易人之必要外，主管機關依本條所得之資訊，不得公布或提供他人。\n四、第五項授權主管機關就第一項關係人之範圍另定規範。"},{"bill":"202110217080000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。"}],"changed":true,"final":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","finalWhy":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。","review":null},{"no":"第四十六條","current":null,"versions":[{"bill":"202110137730000","text":"違反第七條第一項、第三項或第三十七條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、未依本法規定取得許可即經營虛擬資產業務者，不只妨礙主管機關對虛擬資產服務之管理與維護大眾客戶資產安全，從而可能損及客戶權益及市場健全外，亦損害其他虛擬資產服務商之公平競爭權益；又穩定幣發行則涉及向大眾吸收資金，對於金融市場秩序及社會大眾權益影響甚鉅，故兩者均有必要課予刑事責任以嚇阻其不法行為，且於有期徒刑之外併科相當程度之罰金，以嚇阻相關行為人未經許可經營虛擬資產業務或發行穩定幣以妄圖吸收大眾資產。爰參考期貨交易法第一百十二條第五項規定，於第一項明定未經許可經營虛擬資產業務或發行穩定幣之刑事責任。\n二、針對未經許可經營虛擬資產服務業務者，除對該虛擬資產服務商之行為負責人課予刑事責任外，對該虛擬資產服務商亦應設有對應之刑事責任，以督促其行為負責人以外之內部人監督預防此不法行為，俾維護整體虛擬資產服務市場公信力；針對穩定幣發行人，亦同。爰參考電子支付機構管理條例第四十六條第三項規定，於第二項明定法人之刑事責任。"},{"bill":"202110171550000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項或第八條之申請事項為虛偽或隱匿之記載者。\n二、對於主管機關依第三十二條第一項命令提出之參考、報告之資料、或第三十八條第一項命令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關須仰賴確實記載之紀錄對虛擬資產服務商及同業公會進行管理，相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之管理與市場秩序之維持，亦損害其他虛擬資產服務商遵循相關法令公平競爭之權益，故有課予刑事責任以嚇阻相關人士從事監管規避行為之必要。爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款規定、期貨交易法第一百十五條第一款至第四款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條明定相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110199580000","text":"虛擬資產服務商違反第十九條第四項或第二十條第二項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商亦科以前項所定罰金。","note":"虛擬資產服務商違反其保管客戶資產義務，以及虛擬資產服務商違法動用客戶資產者，涉及大眾客戶資產安全，影響客戶權益及市場信任甚鉅，有必要對虛擬資產服務商行為負責人課予刑事責任以嚇阻此不法行為，以及對虛擬資產服務商課予對應刑事責任以督促其完善內部管理制度，俾維護整體虛擬資產服務市場公信力。爰參考電子支付機構管理條例第四十七條規定，於第一項明定虛擬資產服務商違法動用客戶資產之刑事責任，並於第二項明定併罰虛擬資產服務商之規定。"},{"bill":"202110203280000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。"},{"bill":"202110207150000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或函請入出國管理機關限制其負責人或職員出境，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。"},{"bill":"202110206090000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。"},{"bill":"201110205640000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。"},{"bill":"202110209160000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、第一項、第二項定明服務商於撤銷許可、停業或解散時之了結事務義務，並於了結事務目的範圍內，仍視為服務商或視為尚未停業解散，以利其履行了結事務所需之法律行為，爰參考證券交易法第六十七條至第六十九條及期貨交易法第七十六條至第七十八條規定。\n二、第三項定明主管機關對財務惡化服務商得禁止負責人或職員脫產，或令其業務移轉予其他服務商，以維護客戶權益與整體交易市場穩定，爰參考電子支付機構管理條例第四十條第一項規定。\n三、第四項、第五項定明主管機關得限期要求洽承受或逕行指定承受服務商，爰參考電子支付機構管理條例第四十條第二項、第三項及證券投資信託及顧問法第九十六條第二項規定。"},{"bill":"202110209890000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。"},{"bill":"202110214790000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。"},{"bill":"202110213930000","text":"虛擬資產服務商違反法令、章程或有礙健全經營之虞時，主管機關除得予以糾正、令其限期改善外，並得視情節之輕重，為下列處分：\n一、警告。\n二、撤銷法定會議之決議。\n三、命令虛擬資產服務商解除其負責人或其他有關人員職務或停止其一年以下業務之執行。\n四、停止虛擬資產服務商六個月以內全部或一部之業務。\n五、命令或禁止特定資產之處分或移轉。\n六、撤銷或廢止營業許可。\n七、其他必要之處置。","note":"為避免虛擬資產服務商有違反法令、章程或其他有礙健全經營之虞等情事時，所造成之損害或違法事情擴大，有賦予主管機關採取相關管制性不利處分之必要，爰參考證券交易法第六十六條、期貨交易法第一百條及銀行法第六十一條之一規定，為本條規定。"},{"bill":"202110217080000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","note":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。"}],"changed":true,"final":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務商，於其了結停業或解散前所為虛擬資產事務之範圍內，視為尚未停業或解散。\n虛擬資產服務商因業務或財務顯著惡化，不能支付其債務或有損及客戶權益之虞時，主管機關得通知有關機關或機構禁止該虛擬資產服務商及其負責人或職員為財產移轉、交付、設定他項權利或行使其他權利，或令其將業務移轉予其他虛擬資產服務商。\n虛擬資產服務商因第一項或前項之事由致不能繼續經營業務者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，並報經主管機關核准。\n虛擬資產服務商不能依前項規定辦理者，主管機關得指定其他虛擬資產服務商承受。","finalWhy":"一、為保障客戶權益，虛擬資產服務商經撤銷、廢止、命令停業，或自行解散、停業時，對尚未結束之事務負有了結義務，爰參考證券交易法第六十七條至六十九條及期貨交易法第七十六條至七十八條規定，為第一項規定，並於第二項定明於了結事務之目的範圍內，仍視為虛擬資產服務商尚未停業或尚未解散，以利其履行了結事務義務所需行為。\n二、為減少虛擬資產服務商經營不善對客戶及整體交易市場產生衝擊，避免其負責人或職員脫產，爰參考電子支付機構管理條例第四十條第一項規定，於第三項定明主管機關得禁止負責人或職員處分其財產，或將問題虛擬資產服務商之業務移轉予其他業者，以維護客戶權益與整體交易市場穩定。\n三、虛擬資產服務商為了結事務或因經營不善而擬退場者，主管機關得限期要求其洽其他虛擬資產服務商承受其業務，或逕由主管機關指定其他虛擬資產服務商承受之，以保護客戶權益，爰參考電子支付機構管理條例第四十條第二項、第三項、證券投資信託及顧問法第九十六條第二項規定，為第四項及第五項規定。","review":null},{"no":"第四十七條","current":null,"versions":[{"bill":"202110137730000","text":"虛擬資產服務商違反第二十條第四項或第二十一條第二項規定者，其行為負責人處五年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前項情形，除處罰行為負責人外，對該虛擬資產服務商亦科以前項所定罰金。","note":"虛擬資產服務商違反其保管客戶資產義務，以及虛擬資產服務商違法動用客戶資產者，涉及大眾客戶資產安全，影響客戶權益及市場信任甚鉅，有必要對虛擬資產服務商行為負責人課予刑事責任以嚇阻此不法行為，以及對虛擬資產服務商課予對應刑事責任以督促其完善內部管理制度，俾維護整體虛擬資產服務市場公信力。爰參考電子支付機構管理條例第四十七條規定，於第一項明定虛擬資產服務商違法動用客戶資產之刑事責任，並於第二項明定併罰虛擬資產服務商之規定。"},{"bill":"202110171550000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"未經營虛擬資產業務者如使用虛擬資產服務商之名稱或易使人誤認其為虛擬資產服務商之名稱者，可能造成虛擬資產交易人之混淆誤認，並且不利主管機關管理虛擬資產服務商與檢調單位取締未經許可之虛擬資產服務商，故有施以刑事責任以嚇阻此行為之必要。爰參考證券交易法第一百七十七條第一項規定，於本條明定非虛擬資產服務商使用虛擬資產服務商或易使人誤認其為虛擬資產服務商名稱之刑事責任。"},{"bill":"202110199580000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項或第八條之申請事項為虛偽或隱匿之記載者。\n二、對於主管機關依第三十三條第一項命令提出之參考、報告之資料、或第三十九條第一項命令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關須仰賴確實記載之紀錄對虛擬資產服務商及同業公會進行管理，相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之管理與市場秩序之維持，亦損害其他虛擬資產服務商遵循相關法令公平競爭之權益，故有課予刑事責任以嚇阻相關人士從事監管規避行為之必要。爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款規定、期貨交易法第一百十五條第一款至第四款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條明定相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110203280000","text":"違反第四十二條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。"},{"bill":"202110207150000","text":"違反第四十二條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額，及自動繳交其其餘犯罪所得者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額，及自動繳交其其餘犯罪所得者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。"},{"bill":"202110206090000","text":"違反第四十二條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。"},{"bill":"201110205640000","text":"違反第四十二條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。"},{"bill":"202110209160000","text":"違反第四十四條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究恐面臨救濟不足之困難，有課予刑事責任嚇阻之必要，爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項及期貨交易法第一百十二條第一項及第四項規定，於第一項定明詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得加重罰金及沒收之規定。\n二、第二項、第三項定明自首及自白之減刑規定，以達溯源打擊犯罪之效，爰參考詐欺犯罪危害防制條例第四十六條及第四十七條規定。"},{"bill":"202110209890000","text":"違反第四十二條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。"},{"bill":"202110214790000","text":"違反第四十二條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。"},{"bill":"202110213930000","text":"虛擬資產服務商之負責人或受僱人有違反本法或其他有關法令者，主管機關得視情節輕重令虛擬資產服務商停止其一年以下業務之執行，或解除其職務。","note":"為維護整體虛擬資產服務市場之秩序，避免虛擬資產服務商之內部人員違法情事擴大，有賦予主管機關對渠等採取停職或解職處分之必要，爰參考證券交易法第五十六條及期貨交易法第一百零一條規定，於本條定明主管機關對虛擬資產服務商內部人員之處分權。"},{"bill":"202110217080000","text":"違反第四十二條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","note":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。"}],"changed":true,"final":"違反第四十二條第一項或第四項規定者，處三年以上十年以下有期徒刑，得併科新臺幣一千萬元以上二億元以下罰金。\n犯前項之罪，於犯罪後自首，並於自首之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕或免除其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得免除其刑。\n犯第一項之罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑；並因而查獲發起、主持、操縱或指揮犯罪組織之人，或得以扣押該組織所取得全部被害人交付之財物或財產上利益者，得減輕或免除其刑。\n犯第一項之罪，其因犯罪獲致財物或財產上利益超過罰金最高額時，得於所得利益之範圍內加重罰金。\n犯第一項之罪，犯罪所得屬犯罪行為人或其以外之自然人、法人或非法人團體因刑法第三十八條之一第二項所列情形取得者，除應發還被害人、第三人或得請求損害賠償之人外，沒收之。","finalWhy":"一、虛擬資產詐欺或操縱行為，影響虛擬資產交易人權益與整體交易市場健全性甚鉅，單以民事或行政責任追究行為人責任，恐面臨事證調查不易及救濟不足之困難，故有課予刑事責任嚇阻俾維護整體虛擬資產交易人權益之必要，比較法上如日本及香港亦將虛擬資產詐欺或操縱罪訂為十年以下有期徒刑之重罪。爰參考證券交易法第一百七十一條第一項第一款、第六項及第七項、期貨交易法第一百十二條第一項及第四項規定，於第一項定明虛擬資產詐欺或操縱罪之刑事責任，並於第四項及第五項定明犯罪所得之相關規定。\n二、另參考詐欺犯罪危害防制條例第四十六條及第四十七條規定，於第二項及第三項定明犯罪後自首與偵查中自白之減刑規定，以達溯源打擊犯罪之效。","review":null},{"no":"第四十八條","current":null,"versions":[{"bill":"202110137730000","text":"有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項或第八條之申請事項為虛偽或隱匿之記載者。\n二、對於主管機關依第三十四條第一項命令提出之參考、報告之資料、或第四十條第一項命令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"主管機關須仰賴確實記載之紀錄對虛擬資產服務商及同業公會進行管理，相關文件或紀錄如有虛偽或隱匿之記載，不僅妨礙主管機關之管理與市場秩序之維持，亦損害其他虛擬資產服務商遵循相關法令公平競爭之權益，故有課予刑事責任以嚇阻相關人士從事監管規避行為之必要。爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款規定、期貨交易法第一百十五條第一款至第四款及證券投資信託及顧問法第一百零六條第二款及第三款規定，於本條明定相關業務文件虛偽或隱匿記載之刑事責任。"},{"bill":"202110171550000","text":"有下列情事之一者，處新臺幣三十萬元以上六百萬元以下罰鍰，並得命其限期改善；屆期未改善者，得按次處罰：\n一、違反第七條第二項、第八條第二項、第十一條第四項、第十二條第三項、第十三條第一項、第十七條第一項、第十八條第一項、第十九條第三項準用第二十六條第三項及第四項、第二十條第一項、第二十二條第一項、第二十三條第二項、第二十四條至第二十九條、第三十條第一項、第二項、第三十五條第三項規定。\n二、未依第十四條及第十五條建立內部控制及稽核、資通訊安全制度、政策、程序或措施或未確實執行。\n三、虛擬資產服務商違反第七條第四項所定規則有關財務、業務、開業、停業及復業、終止業務或其他應遵行事項之規定。\n四、同業公會違反第三十一條第一項所定規則之規定。\n五、對於主管機關命令提出之帳簿、表冊、文件或其他參考或報告資料，屆期不提出，或對於主管機關依法所為之檢查予以規避、妨礙或拒絕。\n六、於依本法或主管機關基於本法所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務之文件，不依規定製作、申報、公告、備置或保存。\n違反本法或本法授權所定命令中有關強制或禁止規定或應為一定行為而不為者，除本法另有處罰規定而應從其規定外，處新臺幣三十萬元以上六百萬元以下罰鍰，並得命其限期改善；屆期未改善者，得按次處罰。\n依前二項規定應處罰鍰之行為，其情節輕微者，得免予處罰，或先命其限期改善，已改善完成者，免予處罰。","note":"一、為確保本法及主管機關對虛擬資產服務商、同業公會及穩定幣發行人之管理，對於違反本法或本法授權所定命令之規定、未建立或未確實執行內部控制及稽核制度等內部作業程序、規避、妨礙或拒絕主管機關之文書提出命令或檢查或未依規定製作、申報、公告、備置或保存法定文書者，應有相應之行政裁罰，以敦促其確實辦理法令遵循。爰參考證券交易法第一百七十八條之一第一項、期貨交易法第一百十九條、證券投資信託及顧問法第一百十一條及銀行法第一百三十二條規定，於第一項及第二項明定違反本法相關規定之行政責任。\n二、對於情節輕微或已於限期內改善完成之違反本法或本法授權所定命令之行為者，主管機關得免予處罰，以符比例原則並鼓勵行為人盡速改善，爰參考證券交易法第一百七十八條之一第二項規定，於第三項明定免罰之規定。"},{"bill":"202110199580000","text":"違反第十條第二項規定者，處一年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。","note":"未經營虛擬資產業務者如使用虛擬資產服務商之名稱或易使人誤認其為虛擬資產服務商之名稱者，可能造成虛擬資產交易人之混淆誤認，並且不利主管機關管理虛擬資產服務商與檢調單位取締未經許可之虛擬資產服務商，故有施以刑事責任以嚇阻此行為之必要。爰參考證券交易法第一百七十七條第一項規定，於本條明定非虛擬資產服務商使用虛擬資產服務商或易使人誤認其為虛擬資產服務商名稱之刑事責任。"},{"bill":"202110203280000","text":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。"},{"bill":"202110207150000","text":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不僅妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。"},{"bill":"202110206090000","text":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。"},{"bill":"201110205640000","text":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。"},{"bill":"202110209160000","text":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。\n有下列情事之一者，處三年以下有期徒刑、拘役或科或併科新臺幣二百四十萬元以下罰金：\n一、依第七條第一項、第三項、第四項、第八條第一項或第三十四條第一項之申請事項為虛偽或隱匿之記載。\n二、對於主管機關依第四十五條第一項令提出之財務或業務報告或其他相關資料之內容為虛偽或隱匿之記載。\n三、於依法或主管機關基於法律所發布之命令規定之帳簿、表冊、傳票、財務報告或其他有關業務文件之內容為虛偽或隱匿之記載。\n四、意圖妨礙主管機關檢查或司法機關調查，偽造、變造、湮滅、隱匿、掩飾工作底稿、有關紀錄或文件。","note":"一、本法對虛擬資產服務商之經營及穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙監理，亦可能損害金融市場秩序及社會大眾權益，有課予刑事責任嚇阻之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定；第二項定明法人雙罰規定，爰參考電子支付機構管理條例第四十六條第三項規定。\n二、本條整合相關業務文件虛偽或隱匿記載之刑事責任，以嚇阻有心人士妨礙主管機關監管及司法偵查，爰參考證券交易法第一百七十四條第一項第一款、第四款、第五款、第九款及期貨交易法第一百十五條第一款、第四款、第五款規定，為第三項規定。"},{"bill":"202110209890000","text":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。"},{"bill":"202110214790000","text":"違反第七條第一項、第三項或第三十四條第一項規定者，處七年以下有期徒刑，得併科新臺幣一億元以下罰金。\n法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前項之罪者，除處罰其行為負責人外，對該法人亦科以前項所定罰金。","note":"一、本法對虛擬資產服務商之經營、設置分支機構、穩定幣之發行均採許可制，未依規定取得許可者，不只妨礙主管機關對虛擬資產服務之監理權，亦可能損害金融市場秩序、健全性及社會大眾權益，故有課予刑事責任以嚇阻不法行為之必要，爰參考期貨交易法第一百十二條第五項規定，為第一項規定。\n二、為加強法人對內部人員監督管理責任，參考電子支付機構管理條例第四十六條第三項規定，於第二項定明法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯第一項之罪者，除處罰其行為負責人外，對該法人亦科以罰金，以收嚇阻之效。"},{"bill":"202110213930000","text":"虛擬資產服務商經主管機關依本法規定撤銷或廢止其營業許可或命令停業，或自行解散或停止全部或部分營業者，應了結其被撤銷、廢止、命令停業前或自行解散、停業前所為虛擬資產業務之事務。\n經撤銷或廢止營業許可之虛擬資產服務商，於了結前項事務時，就其了結目的之範圍內，仍視為虛擬資產服務商；經命令停業或經核准解散或停業之虛擬資產服務
