<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>紀念日及節日實施條例制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

利義務的直接影響。又《中央法規標準法》第五條規定：「關於人民之權利、義務者，應以法律定之。」惟目前我國紀念日及節日之名稱、日期及放假規定皆僅以辦法定之，實有以法律明定之必要，爰擬具「紀念日及節日實施條例草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110097840000","who":"委員李彥秀等16人","date":"2025-03-14","name":"「國定紀念日及節日實施條例草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110097840000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/05/LCEWA01_110305_00046.pdf","proposers":["李彥秀"],"ncosign":15,"people":[["李彥秀","國民黨","提案"],["翁曉玲","國民黨","連署"],["羅明才","國民黨","連署"],["盧縣一","國民黨","連署"],["賴士葆","國民黨","連署"],["葛如鈞","國民黨","連署"],["羅廷瑋","國民黨","連署"],["陳玉珍","國民黨","連署"],["張智倫","國民黨","連署"],["徐巧芯","國民黨","連署"],["邱鎮軍","國民黨","連署"],["魯明哲","國民黨","連署"],["林德福","國民黨","連署"],["林沛祥","國民黨","連署"],["林思銘","國民黨","連署"],["廖先翔","國民黨","連署"]],"party":[["國民黨",16]],"reason":"本院委員李彥秀等16人，有鑑於我國現行紀念日與節日是否放假，或調整放假等事，係依照內政部訂立之「紀念日及節日實施辦法」，位階僅屬行政命令，然而國家紀念日與節日之制定及是否放假，涉及民眾重要之權利義務，依據憲法法律保留原則，自應透過法律規範，以避免行政命令規定之不當與不確定性，爰擬具「國定紀念日及節日實施條例草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條"]},{"id":"202110099380000","who":"委員王育敏等17人","date":"2025-03-21","name":"「中華民國國定紀念日與節日實施法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110099380000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/11/LCEWA01_110311_00698.pdf","proposers":["王育敏","林沛祥"],"ncosign":15,"people":[["王育敏","國民黨","提案"],["林沛祥","國民黨","提案"],["翁曉玲","國民黨","連署"],["羅智強","國民黨","連署"],["洪孟楷","國民黨","連署"],["盧縣一","國民黨","連署"],["鄭正鈐","國民黨","連署"],["陳玉珍","國民黨","連署"],["林倩綺","國民黨","連署"],["賴士葆","國民黨","連署"],["邱鎮軍","國民黨","連署"],["謝龍介","國民黨","連署"],["張智倫","國民黨","連署"],["李彥秀","國民黨","連署"],["葉元之","國民黨","連署"],["魯明哲","國民黨","連署"],["黃建賓","國民黨","連署"]],"party":[["國民黨",17]],"reason":"本院委員王育敏、林沛祥等17人，有鑑於我國目前紀念日及節日之放假，長期以來均以「紀念日及節日實施辦法」辦理，惟依照「中央法規標準法」第五條規定，關於人民之權利、義務者，應以法律定之。故紀念日及節日之名稱、日期與放假方式，涉及人民的權利義務關係，應將其制度賦予其法律位階。另查，民進黨政府在推行與探討促進轉型正義之議題時，卻遺忘第二次世界大戰期間慰安婦人權，為撫平歷史傷痛，應將慰安婦之歷史納入紀念，落實慰安婦應有的歷史正義，故將八月十四日定為慰安婦紀念日，爰擬具「中華民國國定紀念日與節日實施法」草案。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四 ions":[{"bill":"202110030420000","text":"紀念日及節日之實施，依本法之規定。","note":"立法目的。"},{"bill":"202110036170000","text":"紀念日及節日之實施，依本條例規定。","note":"一、本條例之立法目的。\n二、中央法規標準法第五條，舉凡有關人民之權利、義務者，或其他重要事項應以法律定之。"},{"bill":"202110046340000","text":"中華民國國定紀念日及節日之實施，依本法之規定。","note":"明定本法之立法目的。"},{"bill":"202110047800000","text":"為彰顯紀念日及節日之特殊意義，並規定放假日期及舉行慶祝或紀念活動，以紀念國家發展歷史、傳承中華傳統民俗及促進多元文化發展，特制定本條例。\n紀念日及節日之實施，依本條例之規定。","note":"一、明定本條例之立法目的。\n二、現行紀念日及節日實施辦法係由內政部頒之職權命令，然指定紀念日、節日及實施放假為國家對於發展歷史、傳統民俗及各種社會文化之紀念、傳承或肯定，且放假涉及全國工商經濟發展，涉及人民之權利義務，爰依中央法規標準法第五條第二款特以法律定之。"},{"bill":"202110068720000","text":"中華民國國定紀念日及節日之實施，依本條例之規定。","note":"明定本條例之立法目的。"},{"bill":"202110073030000","text":"國家紀念日及節日之實施，依本法之規定。但其他法律另有規定者，從其規定。","note":"明定本法名稱。"},{"bill":"202110072050000","text":"國家紀念日及節日之實施依本法之規定。","note":"本法之立法目的。"},{"bill":"202110074310000","text":"中華民國國定紀念日及節日之實施，依本條例之規定。","note":"明定本條例之立法目的。"},{"bill":"202110074620000","text":"紀念日及節日之實施，依本法之規定。但每週正常工時逾四十小時之事業單位，其紀念日及節日之放假，勞動基準法另有規定者，從其規定。","note":"一、依照中央法規標準法第五條，舉凡有關人民之權利、義務者，或其他重要事項應以法律定之。\n二、惟因公、私部門工時制度不同，為兼顧不同工時人員權益，爰列但書。"},{"bill":"202110076000000","text":"紀念日及節日之實施依本條例之規定。","note":"明定本條例之立法目的。"},{"bill":"202110075240000","text":"為紀念民主發展、尊重多元文化及傳統民俗價值，並保障國民休息及自我發展之權利，明定全國一致之紀念日及節日。","note":"一、本條例之立法目的。\n二、中央法規標準法第五條，舉凡有關人民之權利、義務者，或其他重要事項應以法律定之。"},{"bill":"202110077660000","text":"國定紀念日及民俗節日之實施，依本條例規定。","note":"明定本條例之立法目的。"},{"bill":"202110080400000","text":"國家紀念日及節日之實施，依本法之規定。但其他法律另有規定者，從其規定。","note":"明定本法名稱。"},{"bill":"202110082810000","text":"為彰顯紀念日及節日之特殊意義，並規定放假日期及舉行慶祝或紀念活動，以紀念國家發展歷史、傳承中華傳統民俗及促進多元文化發展，特制定本條例。\n紀念日及節日之實施，依本條例之規定。","note":"一、明定本條例之立法目的。\n二、我國紀念日或節日之名稱、日期及放假規定皆僅以辦法定之，然放假與否除關乎經濟活動與文化傳承外，更涉及國人權利義務之規範，實有以法明定之必要"},{"bill":"202110087510000","text":"為彰顯紀念日及節日之特殊意義，並規定放假日期及舉行慶祝或紀念活動，以紀念國家發展歷史、傳承中華傳統民俗及促進多元文化發展，特制定本條例。\n紀念日及節日之實施，依本條例之規定。","note":"一、明定本條例之立法目的。\n二、現行紀念日及節日實施辦法係由內政部頒之職權命令，然指定紀念日、節日及實施放假為國家對於發展歷史、傳統民俗及各種社會文化之紀念、傳承或肯定，且放假涉及全國工商經濟發展，涉及人民之權利義務，爰依中央法規標準法第五條第二款特以法律定之。"},{"bill":"202110087570000","text":"為紀念民主發展、尊重多元文化及傳統民俗價值，並保障國民休息及自我發展之權利，茲明定全國一致之國定假日。","note":"一、本法之立法目的。\n二、國定假日屬「文化憲法」之範疇，具有我國重要文化、歷史、社會、政治等意涵，更關乎國民休息權與自我發展權之實現，應享有法律上制度性保障之地位。\n三、我國現行國定假日法之規定為行政命令位階之《紀念日及節日實施辦法》，長久以來專由行政機關自行擅定，實有不妥，有予立法明定之必要，並使全國放假日一致化。"},{"bill":"202110086500000","text":"為彰顯紀念日及節日之特殊意義，並規定放假日期及舉行慶祝或紀念活動，以紀念國家發展歷史、傳承中華傳統民俗及促進多元文化發展，特制定本條例。\n紀念日及節日之實施，依本條例之規定。","note":"明定本條例之立法目的。"},{"bill":"202110093980000","text":"紀念日及節日之實施，依本條例之規定。","note":"明定本條例立法目的。"},{"bill":"202110093510000","text":"紀念日及節日之實施依本條例之規定辦理。","note":"於本條明定立法目的。"},{"bill":"202110096450000","text":"紀念日及節日之實施依本條例之規定。","note":"明定本條例之立法目的。"},{"bill":"202110097410000","text":"為彰顯紀念日及節日之特殊意義，並規定放假日期及舉行慶祝或紀念活動，以紀念國家發展歷史、傳承中華傳統民俗、彰顯原住民族文化價值並促進多元文化發展，特制定本條例。\n紀念日及節日之實施，依本條例規定。","note":"一、本條例之立法目的。\n二、中央法規標準法第五條，舉凡有關人民之權利、義務者，或其他重要事項應以法律定之。"},{"bill":"202110097740000","text":"為彰顯紀念日及節日之特殊意義，並規定放假日期及舉行慶祝或紀念活動，以紀念國家發展歷史、傳承中華傳統民俗及促進多元文化發展，特制定本條例。\n紀念日及節日之實施，依本條例之規定。","note":"明定本條例之立法目的。"},{"bill":"202110097840000","text":"中華民國國定紀念日及節日之訂定，依本條例規定之。","note":"一、明定本條例之立法目的。\n二、為符合憲法之法律保留原則，攸關國家紀念日、民俗節日及節日之制定、名稱及放假之細節，應由法律定之。"},{"bill":"202110099380000","text":"中華民國國定紀念日及節日之實施，依本法之規定。","note":"明定本法之立法目的，依照「中央法規標準法」第五條之規定，關於人民之權利、義務者，應以法律定之。"},{"bill":"202110107560000","text":"中華民國國定紀念日及節日之實施，依本條例之規定。","note":"明定本條例之立法目的。"},{"bill":"202110102380000","text":"國家紀念日及節日之實施依本法之規定。","note":"本法之立法目的。"},{"bill":"202110044280000","text":"為深化民主、尊重與傳承多元文化價值，並確保國民放假、恢復身心及自我發展之必要權利，茲明定一致之國假及文化節日。\n國假暨文化節日之實施，依本條例之規定。","note":"一、本條例之立法目的。\n二、中央法規標準法第五條規定：舉凡有關人民之權利、義務者，或其他重要事項應以法律定之。\n三、現行國定假日係以內政部頒布之「紀念日及節日實施辦法」作為依據與實施，乃行政命令之位階，實有立法明定以確定法律位階之制度性必要，以使全國放假日一致。"},{"bill":"202110043520000","text":"紀念日及節日之實施，依本法規定。","note":"本法之立法目的。"}],"changed":true,"final":"為彰顯紀念日及節日之特殊意義，並規定放假日期及舉行慶祝或紀念活動，以紀念國家發展歷史、傳承各族群傳統民俗及促進多元文化發展，特制定本條例。\n紀念日及節日之實施，依本條例之規定。","finalWhy":"修正通過。,,","review":{"note":"修正通過","text":"為彰顯紀念日及節日之特殊意義，並規定放假日期及舉行慶祝或紀念活動，以紀念國家發展歷史、傳承各族群傳統民俗及促進多元文化發展，特制定本條例。\n紀念日及節日之實施，依本條例之規定。"}},{"no":"第二條","current":null,"versions":[{"bill":"202110030420000","text":"本法所稱主管機關：在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"主管機關。"},{"bill":"202110036170000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110046340000","text":"本法之主管機關為內政部。","note":"明定本法之主管機關。"},{"bill":"202110047800000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110068720000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110073030000","text":"本法之主管機關為內政部。","note":"明定本法之主管機關。"},{"bill":"202110072050000","text":"本法主管機關為內政部。","note":"本法之主管機關。"},{"bill":"202110074310000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110074620000","text":"本法之主管機關為內政部。","note":"明定本法之主管機關。"},{"bill":"202110076000000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110075240000","text":"本條例之主管機關為內政部。","note":"明訂本條例之主管機關。"},{"bill":"202110077660000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110080400000","text":"本法之主管機關為內政部。","note":"明定本法之主管機關。"},{"bill":"202110082810000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110087510000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110087570000","text":"本法之主管機關為內政部。","note":"明定本法之主管機關。"},{"bill":"202110086500000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110093980000","text":"本條例之主管機關為內政部。","note":"明定本條例主管機關。"},{"bill":"202110093510000","text":"本條例之主管機關為內政部。","note":"於本條明定主管機關。"},{"bill":"202110096450000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110097410000","text":"本條例之主管機關為內政部。","note":"明訂本條例之主管機關。"},{"bill":"202110097740000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110097840000","text":"本條例主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110099380000","text":"本法之主管機關為內政部。","note":"明定本法之主管機關。"},{"bill":"202110107560000","text":"本條例之主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110102380000","text":"本法主管機關為內政部。","note":"本法之主管機關。"},{"bill":"202110044280000","text":"本條例所稱主管機關為內政部。","note":"明定本條例之主管機關。"},{"bill":"202110043520000","text":"本法之主管機關為內政部。","note":"本法之主管機關。"}],"changed":true,"final":"本條例之主管機關為內政部。","finalWhy":"明定本條例之主管機關。","review":{"note":"照委員牛煦庭等提案通過","text":"本條例之主管機關為內政部。"}},{"no":"第三條","current":null,"versions":[{"bill":"202110030420000","text":"紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、反侵略日：三月十四日。\n五、革命先烈紀念日：三月二十九日。\n六、佛陀誕辰紀念日：農曆四月八日。\n七、解嚴紀念日：七月十五日。\n八、孔子誕辰紀念日：九月二十八日。\n九、國慶日：十月十日。\n十、中華民國（臺灣）聯合國日：十月二十四日。\n十一、國父誕辰紀念日：十一月十二日。\n十二、行憲紀念日：十二月二十五日。","note":"規範紀念日名稱及日期。"},{"bill":"202110036170000","text":"紀念日之名稱及日期如下：\n一、元旦：一月一日。\n二、全國客家日：農曆一月二十日。\n三、和平紀念日：二月二十八日。\n四、孫文逝世紀念日：三月十二日。\n五、言論自由日：四月七日。\n六、環境日：六月五日。\n七、解嚴紀念日：七月十五日。\n八、原住民族日：八月一日。\n九、終戰紀念日：八月十五日。\n十、國慶日：十月十日。\n十一、國際移民日：十二月十八日。","note":"一、明定紀念日及節日之名稱及日期。\n二、本條例所訂紀念日均有重要歷史緣由，影響國家發展深遠，足資全國人民紀念。\n三、為落實「客家基本法」第十四條「政府應訂定全國客家日，以彰顯客家族群對台灣多元文化之貢獻」，客委會業於99年9月公布農曆1月20日「天穿日」為全國客家日。\n四、為彰顯性別平權、去除紀念日名稱所含家父長氣息，改現行「紀念日及節日實施辦法」中「國父逝世紀念日」，為「孫文逝世紀念日」。\n五、「二二八事件處理及賠償條例」第四條第二項規定：「每年二月二十八日為『和平紀念日』」。\n六、為紀念鄭南榕先生為台灣言論自由的奉獻犧牲，促成刑法第一百條的廢除，台灣人民重獲得公開討論國家體制的言論自由，擬將4月7日鄭南榕先生自焚殉道日訂為言論自由日。\n七、西元1972年6月5日，聯合國於斯德哥爾摩召開人類環境會議，發表人類環境宣言及行動計畫，開啟永續發展概念，並將當日定為世界環境日，以資紀念。台灣亦於91年12月11日制定「環境基本法」，明定6月5日為環境日。身為地球村一員，應落實節能減碳，以確保環境生態的永續發展，故明定環境日為紀念日。\n八、為儆醒戒嚴歷史，珍貴民主化不易，規定每年7月15日為「解嚴紀念日」。\n九、民國83年8月1日「中華民國憲法增修條文」已將「山胞」正名為「原住民」，且第十條明定「國家肯定多元文化，並積極維護發展原住民族語言及文化」，為體現政府重視原住民族之地位與權益，以及肯定多元文化之精神，擬訂8月1日為原住民族日。\n十、為警惕戰爭及台灣被殖民歷史，規定每年8月15日為「終戰紀念日」。\n十一、為緬懷國家歷史，沿用現行「紀念日及節日實施辦法」，規定每年10月10日為「國慶日」。\n十二、為感念及彰顯歷史上，外來移工、移民對台灣社會經濟之巨大貢獻，規定每年12月18日為「國際移民日」。"},{"bill":"202110046340000","text":"本法之紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、八二三紀念日：八月二十三日。\n八、孔子誕辰紀念日：九月二十八日。\n九、國慶日：十月十日。\n十、國父誕辰紀念日：十一月十二日。\n十一、行憲紀念日：十二月二十五日。","note":"一、明定我國國家紀念日名稱及日期。\n二、1958年8月23日起，中共在接下來的44天內對150平方公里的金門島發射47萬多發砲彈，造成金門軍民死傷與房舍毀損。最後在全國軍民上下一心，共同守衛國家，終致獲得勝利，捍衛中華民國家園及臺海和平。爰訂定八二三紀念日，以緬懷當年經歷戰爭烽火、犧牲奉獻之全體軍民。"},{"bill":"202110047800000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、革命先烈紀念日：三月二十九日。\n五、言論自由日：四月七日。\n六、解嚴紀念日：七月十五日。\n七、原住民族日：八月一日。\n八、終戰紀念日：八月十五日。\n九、國家防災日：九月二十一日。\n十、孔子誕辰紀念日：九月二十八日。\n十一、國慶日：十月十日。\n十二、聯合國日：十月二十四日。\n十三、臺灣光復紀念日：十月二十五日。\n十四、國父誕辰紀念日：十一月十二日。\n十五、行憲紀念日：十二月二十五日。","note":"一、明定紀念日及節日之名稱及其日期。\n二、本條例所定之紀念日，均有其歷史緣由及社會背景，以在國家歷史上占有重要地位、對國家發展具深遠影響者定之。\n三、依二二八事件處理及賠償條例第四條第二項規定將每年二月二十八日定為和平紀念日。\n四、鄭南榕先生於七十八年四月七日為爭取言論自由而犧牲，為臺灣社會開啟改革契機，催化修正刑法第一百條及廢止懲治叛亂條例，讓國人在思想、學術及言論自由獲得更進一步保障，爰定四月七日為言論自由日。\n五、鑑於八十三年八月一日總統令修正公布中華民國憲法增修條文將「山胞」正名為「原住民」，且憲法增修條文第十條明文規定「國家肯定多元文化，並積極維護發展原住民族語言及文化」，具有政府重視原住民族之地位與權益之深遠意義。為體現國家肯定多元文化之精神，爰定八月一日為原住民族日。\n六、我國歷經第二次世界大戰，臺灣於當時亦受日本殖民統治，而日本於三十四年八月十五日發布「投降詔書」，爰將八月十五日定為終戰紀念日，以警惕戰爭及彰顯和平之重要性。\n七、有鑑於南投縣集集鎮於八十八年九月二十一日凌晨發生芮氏規模七點三之淺層地震，造成人民生命財產之重大損害。為提升全民防災意識及國家防災應變能力，我國自八十九年起將九月二十一日定為「災害防救日」，九十一年更名為「國家防災日」，爰將其明文規定。"},{"bill":"202110068720000","text":"紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、全國客家日：農曆一月二十日。\n三、和平紀念日：二月二十八日。\n四、國父逝世紀念日：三月十二日。\n五、反侵略日：三月十四日。\n六、革命先烈紀念日：三月二十九日。\n七、言論自由日：四月七日。\n八、佛陀誕辰紀念日：農曆四月八日。\n九、解嚴紀念日：七月十五日。\n十、原住民族日：八月一日。\n十一、孔子誕辰紀念日：九月二十八日。\n十二、國慶日：十月十日。\n十三、臺灣聯合國日：十月二十四日。\n十四、國父誕辰紀念日：十一月十二日。\n十五、國際移民日：十二月十八日。\n十六、行憲紀念日：十二月二十五日。","note":"明定國家紀念日名稱及日期。"},{"bill":"202110073030000","text":"國家紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、反侵略日：三月十四日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、原住民族紀念日：八月一日。\n八、孔子誕辰紀念日：九月二十八日。\n九、國慶日：十月十日。\n十、臺灣聯合國日：十月二十四日。\n十一、國父誕辰紀念日：十一月十二日。\n十二、行憲紀念日：十二月二十五日。\n十三、民族平等紀念日：由政府徵詢原住民族明定日期。","note":"一、明定國家紀念日名稱及日期。\n二、憲法增修條文於民國83年8月1日將山胞正名為原住民族，爰明定8月1日為原住民族紀念日。\n三、清朝及日據時期，統治政權以武力征伐侵犯原住民族固有領域，造成原住民族群及族人重大傷亡，計有牡丹社事件等十三個重大歷史事件，爰增訂民族平等紀念日以資紀念。"},{"bill":"202110072050000","text":"我國國家紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、反侵略日：三月十四日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、八二三紀念日：八月二十三日。\n八、孔子誕辰紀念日：九月二十八日。\n九、國慶日：十月十日。\n十、臺灣聯合國日：十月二十四日。\n十一、國父誕辰紀念日：十一月十二日。\n十二、行憲紀念日：十二月二十五日。\n國父逝世紀念日在三月十二日植樹節舉行。","note":"我國國家紀念日名稱及日期。"},{"bill":"202110074310000","text":"紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、全國客家日：農曆一月二十日。\n三、和平紀念日：二月二十八日。\n四、國父逝世紀念日：三月十二日。\n五、言論自由日：四月七日。\n六、解嚴紀念日：七月十五日。\n七、原住民族日：八月一日。\n八、終戰紀念日：八月十五日。\n九、國家防災日：九月二十一日。\n十、孔子誕辰紀念日：九月二十八日。\n十一、國慶日：十月十日。\n十二、臺灣聯合國日：十月二十四日。\n十三、臺灣光復紀念日：十月二十五日。\n十四、國父誕辰紀念日：十一月十二日。\n十五、國際移民日：十二月十八日。\n十六、行憲紀念日：十二月二十五日。","note":"明定國家紀念日名稱及日期。"},{"bill":"202110074620000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、反侵略日：三月十四日。\n五、革命先烈紀念日：三月二十九日。\n六、佛陀誕辰紀念日：農曆四月八日。\n七、抗戰紀念日：七月七日。\n八、解嚴紀念日：七月十五日。\n九、孔子誕辰紀念日：九月二十八日。\n十、國慶日：十月十日。\n十一、臺灣聯合國日：十月二十四日。\n十二、臺灣光復紀念日：十月二十五日。\n十三、國父誕辰紀念日：十一月十二日。\n十四、行憲紀念日：十二月二十五日。","note":"一、參酌現行紀念日及節日實施辦法，明定本法紀念日名稱及日期。\n二、本法所定之紀念日，均有重要歷史緣由，影響國家發展深遠，足資全國人民紀念。\n三、七七盧溝橋事變揭開抗日戰爭的序幕，攸關中華民族存亡的反侵略戰爭，以此為紀念，藉以表彰國軍英勇事蹟，喚起世人對戰爭殘酷的了解與重視。\n四、現行紀念日及節日實施辦法明定十月二十五日為臺灣光復節，鑑於其訂定係為紀念三十四年十月二十五日，臺灣正式脫離日本統治，重獲自由，在國家歷史發展中具重大意義及深遠影響，爰改列為臺灣光復紀念日。"},{"bill":"202110076000000","text":"紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、反侵略日：三月十四日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、佛陀誕辰紀念日：農曆四月八日。\n八、解嚴紀念日：七月十五日。\n九、原住民族日：八月一日。\n十、孔子誕辰紀念日：九月二十八日。\n十一、國慶日：十月十日。\n十二、臺灣聯合國日：十月二十四日。\n十三、臺灣光復紀念日：十月二十五日。\n十四、國父誕辰紀念日：十一月十二日。\n十五、行憲紀念日：十二月二十五日。\n十六、全國客家日：十二月二十八日。\n國父逝世紀念日在三月十二日植樹節舉行。","note":"明定國家紀念日名稱及日期。"},{"bill":"202110075240000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、全國客家日：農曆一月二十日。\n三、和平紀念日：二月二十八日。\n四、革命先烈紀念日：三月二十九日。\n五、國父逝世紀念日：三月十二日。\n六、佛陀誕辰紀念日：農曆四月八日。\n七、解嚴紀念日：七月十五日。\n八、原住民族日：八月一日。\n九、八二三紀念日：八月二十三日。\n十、孔子誕辰紀念日：九月二十八日。\n十一、國慶日：十月十日。\n十二、臺灣光復紀念日：十月二十五日。\n十三、國父誕辰紀念日：十一月十二日。\n十四、行憲紀念日：十二月二十五日。","note":"一、明定紀念日之名稱及日期。\n二、本條例所訂紀念日均有重要歷史緣由，影響國家發展深遠，足資全國人民紀念。\n三、為落實《客家基本法》第十四條規定：「政府應訂定全國客家日，以彰顯客家族群對台灣多元文化之貢獻」，依上開規範，客家委員會業於九十九年九月公布農曆一月二十日「天穿日」為全國客家日，以彰顯客家族群對台灣多元文化之貢獻。\n四、「二二八事件處理及賠償條例」第四條第二項規定：「每年二月二十八日為『和平紀念日』」。\n五、民國八十三年八月一日「中華民國憲法增修條文」將「山胞」正名為「原住民」，且第十條明定「國家肯定多元文化，並積極維護發展原住民族語言及文化」，為體現政府重視原住民族之地位與權益，以及肯定多元文化之精神，擬訂八月一日為原住民族日。\n六、民國四十七年八月二十三日，中共在連續四十四天針對金門島發射四十七萬多發砲彈，造成金門軍民死傷與房舍毀損。最後在全國軍民上下一心，共同守衛國家，終致獲得勝利，捍衛中華民國家園及台海和平。爰訂定八二三紀念日，以緬懷當年經歷戰爭烽火、犧牲奉獻之全體軍民。\n七、臺灣光復節係民國三十四年十月二十五日，日本戰敗後，在臺灣地區的受降典禮，象徵臺灣結束五十年的日本殖民統治，是臺灣人歷史認同的重要一環，也提供回顧歷史、反思戰後發展的契機。\n八、為緬懷國家歷史，沿用現行「紀念日及節日實施辦法」，規定國父逝世紀念日、佛陀誕辰紀念日、解嚴紀念日、孔子誕辰紀念日、國慶日、國父誕辰紀念日及行憲紀念日。"},{"bill":"202110077660000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、反侵略日：三月十四日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、孔子誕辰紀念日：九月二十八日。\n八、國慶日：十月十日。\n九、臺灣聯合國日：十月二十四日。\n十、國父誕辰紀念日：十一月十二日。\n十一、行憲紀念日：十二月二十五日。\n國父逝世紀念日在三月十二日植樹節舉行。","note":"一、明定紀念日之名稱及其日期。\n二、本條例所定之紀念日，均有其歷史緣由及社會背景，是以在國家歷史上占有重要地位、對國家發展具深遠影響者定之。"},{"bill":"202110080400000","text":"國家紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、反侵略日：三月十四日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、原住民族紀念日：八月一日。\n八、孔子誕辰紀念日：九月二十八日。\n九、國慶日：十月十日。\n十、臺灣聯合國日：十月二十四日。\n十一、國父誕辰紀念日：十一月十二日。\n十二、行憲紀念日：十二月二十五日。\n十三、民族平等紀念日：三月二十一日。","note":"一、明定國家紀念日名稱及日期。\n二、憲法增修條文於民國83年8月1日將山胞正名為原住民族，爰明定8月1日為原住民族紀念日。\n三、查我國各個歷史時期都有族群的壓迫經驗，像是清領、日據時期對原住民族、閩客族群皆有殖民式的壓迫，考慮到只有全面的歷史才能夠提供不同時期、不同階段的多重視角，使社會能夠真正理解歷史的原因與後果，並有效避免重蹈覆轍，促進歷史正義和族群和解，故有必要增訂民族平等紀念日以資紀念。而每年的3月21日是「國際消除種族歧視日」，值此全球人口跨國移動日益頻繁，我國也致力人權立國目標，並以多元族群平等，尊重多元文化的精神，這個日期尤其值得我國各界共同反省深思與致力落實。為增進國家間及種族或民族團體間之諒解，容恕與睦誼，並宣揚普遍人權原則。明訂三月二十一日為民族平等紀念日。"},{"bill":"202110082810000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、全國客家日：農曆一月二十日。\n三、和平紀念日：二月二十八日。\n四、國父逝世紀念日：三月十二日。\n五、革命先烈紀念日：三月二十九日。\n六、言論自由日：四月七日。\n七、解嚴紀念日：七月十五日。\n八、原住民族日：八月一日。\n九、終戰紀念日：八月十五日。\n十、國家防災日：九月二十一日。\n十一、孔子誕辰紀念日：九月二十八日。\n十二、國慶日：十月十日。\n十三、聯合國日：十月二十四日。\n十四、臺灣光復紀念日：十月二十五日。\n十五、國父誕辰紀念日：十一月十二日。\n十六、行憲紀念日：十二月二十五日。","note":"明定紀念日及節日之名稱及其日期。"},{"bill":"202110087510000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、革命先烈紀念日：三月二十九日。\n五、言論自由日：四月七日。\n六、解嚴紀念日：七月十五日。\n七、原住民族日：八月一日。\n八、終戰紀念日：八月十五日。\n九、國家防災日：九月二十一日。\n十、孔子誕辰紀念日：九月二十八日。\n十一、國慶日：十月十日。\n十二、聯合國日：十月二十四日。\n十三、臺灣光復紀念日：十月二十五日。\n十四、國父誕辰紀念日：十一月十二日。\n十五、行憲紀念日：十二月二十五日。","note":"一、明定紀念日及節日之名稱及其日期。\n二、本條例所定之紀念日，均有其歷史緣由及社會背景，以在國家歷史上占有重要地位、對國家發展具深遠影響者定之。\n三、依二二八事件處理及賠償條例第四條第二項規定將每年二月二十八日定為和平紀念日。\n四、鄭南榕先生於七十八年四月七日為爭取言論自由而犧牲，為臺灣社會開啟改革契機，催化修正刑法第一百條及廢止懲治叛亂條例，讓國人在思想、學術及言論自由獲得更進一步保障，爰定四月七日為言論自由日。\n五、鑑於八十三年八月一日總統令修正公布中華民國憲法增修條文將「山胞」正名為「原住民」，且憲法增修條文第十條明文規定「國家肯定多元文化，並積極維護發展原住民族語言及文化」，具有政府重視原住民族之地位與權益之深遠意義。為體現國家肯定多元文化之精神，爰定八月一日為原住民族日。\n六、我國歷經第二次世界大戰，臺灣於當時亦受日本殖民統治，而日本於三十四年八月十五日發布「投降詔書」，爰將八月十五日定為終戰紀念日，以警惕戰爭及彰顯和平之重要性。\n七、有鑑於南投縣集集鎮於八十八年九月二十一日凌晨發生芮氏規模七點三之淺層地震，造成人民生命財產之重大損害。為提升全民防災意識及國家防災應變能力，我國自八十九年起將九月二十一日定為「災害防救日」，九十一年更名為「國家防災日」，爰將其明文規定。"},{"bill":"202110087570000","text":"國定假日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、除夕：農曆十二月之末日。\n三、春節：農曆一月一日至一月三日。\n四、和平紀念日：二月二十八日。\n五、兒童節：四月四日。\n六、清明節：四月五日或前後一日。\n七、言論自由日：四月七日。\n八、勞動節：五月一日。\n九、端午節：農曆五月五日。\n十、解嚴紀念日：七月十五日。\n十一、原住民族日：八月一日。\n十二、中秋節：農曆八月十五日。\n十三、國民體育日：九月九日。\n十四、國家防災日：九月二十一日。\n十五、孔子誕辰紀念日：九月二十八日。\n十六、國慶日：十月十日。\n十七、行憲紀念日：十二月二十五日。\n前項所定國定假日，為放假日。但兒童節與清明節為同一日時，由主管機關依第五條規定，公告調整兒童節放假之日。\n除第一項規定外，為尊重原住民族歲時祭儀舉行之必要，各原住民族部落得擇定歲時祭儀三日為放假日，於前一年十月三十一日前，報請主管機關公告之。","note":"一、明定國定假日之名稱及日期，並國家假日應予放假，全國一致為十九日：\n(一)依二二八事件處理及賠償條例第四條第二項規定，將每年2月28日定為和平紀念日。\n(二)鄭南榕先生於78年4月7日為爭取言論自由而犧牲，為臺灣社會開啟改革契機，催化修正刑法第一百條及廢止懲治叛亂條例，讓國人在思想、學術及言論自由獲得更進一步保障。\n(三)1987年7月15日前總統蔣經國解除「台灣省戒嚴令」。2007年6月，前總統陳水扁任內，行政院舉辦「解嚴二十週年紀念系列活動」會議，決議提請內政部研訂7月15日為紀念日。內政部隨即修正《紀念日及節日實施辦法》，將7月15日訂為解嚴紀念日。為紀念我國開啟民主自由、捍衛法治與人權價值之里程碑，爰明定解嚴紀念日放假一日。\n(四)有鑑於行政院於94年6月15日召開第2944次院會時，通過「紀念日及節日實施條例」草案，明定每年8月1日為「原住民族日」，以紀念83年8月1日憲法增修條文將「山胞」正名成為「原住民」。原住民族日的意義係紀念原住民原住民族藉由正名運動，回復原住民在臺灣的地位，並喚醒國人對原住民族正確認知。\n(五)依據國民體育法第六條規定，為鼓勵國民參與體育活動，明定每年9月9日為國民體育日，以利提升各年齡層之運動風氣及國民體能，實踐健康與樂活之願景。\n(六)為記取天災無情之教訓及提升地震防災應變之能力，行政院將每年9月21日訂為「國家防災日」，以國家層次推廣地震避難智能，提升全民防災意識與應變能力，爰明定國家防災日放假一日。\n(七)1998年以前9月28日孔子誕辰紀念日為國定假日，直至2000年取消。為紀念至聖先師孔子、彰顯我國尊崇中華儒家精神，並感謝教師的付出，爰明定孔子誕辰紀念日放假一日。\n(八)為紀念1947年三讀通過之中華民國憲法，1963年曾由行政院將12月25日行憲日指定為國定假日，直至2000年取消。基於尊重憲法之精神，並落實憲法揭示之價值，爰明定行憲紀念日放假一日。\n二、原住民族歲時祭儀蘊含重要歷史、生活、文化及傳承意義。由於各族部落之傳統、祭儀及公共事務決策方式不同，明定歲時祭儀日期由各族部落擇定後報請主管機關公告之。"},{"bill":"202110086500000","text":"紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、反侵略日：三月十四日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、原住民族日：八月一日。\n八、金門八二三炮戰紀念日：八月二十三日。\n九、國家防災日：九月二十一日。\n十、孔子誕辰紀念日：九月二十八日。\n十一、國慶日：十月十日。\n十二、臺灣聯合國日：十月二十四日。\n十三、臺灣光復紀念日：十月二十五日。\n十四、國父誕辰紀念日：十一月十二日。\n十五、國家棒球日：十一月二十四日。\n十六、行憲紀念日：十二月二十五日。\n十七、全國客家日：十二月二十八日。\n國父逝世紀念日在三月十二日植樹節舉行。","note":"明定國家紀念日名稱及日期。"},{"bill":"202110093980000","text":"本條例所定之紀念日名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、反侵略日：三月十四日。\n五、革命先烈紀念日：三月二十九日。\n六、解嚴紀念日：七月十五日。\n七、原住民族日：八月一日。\n八、國家防災日：九月二十一日。\n九、孔子誕辰紀念日：九月二十八日。\n十、國慶日：十月十日。\n十一、臺灣聯合國日：十月二十四日。\n十二、臺灣光復紀念日：十月二十五日。\n十三、國父誕辰紀念日：十一月十二日。\n十四、中華民國國旗日：十二月十七日。\n十五、國際移民日：十二月十八日。\n十六、行憲紀念日：十二月二十五日。\n十七、全國客家日：十二月二十八日。","note":"明定本條例紀念日名稱及日期。"},{"bill":"202110093510000","text":"紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、反侵略日：三月十四日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、孔子誕辰紀念日：九月二十八日。\n八、國慶日：十月十日。\n九、臺灣聯合國日：十月二十四日。\n十、國父誕辰紀念日：十一月十二日。\n十一、行憲紀念日：十二月二十五日。\n國父逝世紀念日在三月十二日植樹節舉行。","note":"於本條明定紀念日。"},{"bill":"202110096450000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、反侵略日：三月十四日。\n五、革命先烈紀念日：三月二十九日。\n六、佛陀誕辰紀念日：農曆四月八日。\n七、解嚴紀念日：七月十五日。\n八、原住民族日：八月一日。\n九、抗日戰爭勝利紀念日：九月三日。\n十、國家防災日：九月二十一日。\n十一、孔子誕辰紀念日：九月二十八日。\n十二、國慶日：十月十日。\n十三、臺灣聯合國日：十月二十四日。\n十四、臺灣光復紀念日：十月二十五日。\n十五、國父誕辰紀念日：十一月十二日。\n十六、行憲紀念日：十二月二十五日。\n十七、全國客家日：農曆一月二十日。","note":"一、紀念日名稱及日期。\n二、本條例所訂紀念日均有重要歷史緣由，影響國家發展深遠，足資全國人民紀念。\n三、「二二八事件處理及賠償條例」第四條第二項規定：「每年二月二十八日為『和平紀念日』」。\n四、行政院定三月十四日為反侵略日，惕厲「國人天下雖平，忘戰必危」。\n五、鑑於八十三年八月一日總統令修正公布中華民國憲法增修條文將「山胞」正名為「原住民」，且憲法增修條文第十條明文規定「國家肯定多元文化，並積極維護發展原住民族語言及文化」，具有政府重視原住民族之地位與權益之深遠意義。為體現國家肯定多元文化之精神，爰定八月一日為原住民族日。\n六、每年九月三日是「抗日戰爭紀念日」，也是「軍人節」。為表彰與紀念為國捐驅之忠烈將士，每年該日舉辦秋祭國殤大典，由總統親臨主祭，並率領中樞文武百官向國民革命烈士之靈位獻花，鐘鼓齊鳴，肅穆莊嚴，富含著對抗戰犧牲烈士崇高的敬意與緬懷。\n七、有鑑於南投縣集集鎮於八十八年九月二十一日凌晨發生芮氏規模七點三之淺層地震，造成人民生命財產之重大損害。為提升全民防災意識及國家防災應變能力，我國自八十九年起將九月二十一日定為「災害防救日」，九十一年更名為「國家防災日」，爰將其明文規定。\n八、紀念聯合國於一九四五年十月二十四日成立，代表中華民國持續追求參與國際社會和共享全球責任的決心。\n九、臺灣光復節係民國三十四年十月二十五日，日本戰敗後，在臺灣地區的受降典禮，象徵臺灣結束五十年的日本殖民統治，是臺灣人歷史認同的重要一環，也提供回顧歷史、反思戰後發展的契機。\n十、天穿日為客家庄很重要的節日，為促進各族群認識與共享客家文化價值，彰顯客家族群對臺灣多元文化之貢獻，爰訂農曆一月二十日為全國客家日。"},{"bill":"202110097410000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、革命先烈紀念日：三月二十九日。\n五、原住民族抵抗日：六月二十六日。\n六、解嚴紀念日：七月十五日。\n七、原住民族日：八月一日。\n八、終戰紀念日：八月十五日。\n九、國家防災日：九月二十一日。\n十、孔子誕辰紀念日：九月二十八日。\n十一、國慶日：十月十日。\n十二、聯合國日：十月二十四日。\n十三、臺灣光復紀念日：十月二十五日。\n十四、原住民族轉型正義紀念日：十月三十一日。\n十五、國父誕辰紀念日：十一月十二日。\n十六、行憲紀念日：十二月二十五日。","note":"一、明定紀念日及節日之名稱及其日期。\n二、本條例所定之紀念日，均有其歷史緣由及社會背景，以在國家歷史上占有重要地位、對國家發展具深遠影響者定之。\n三、依二二八事件處理及賠償條例第四條第二項規定將每年二月二十八日定為和平紀念日。\n四、一九一零年日本總督佐久間左馬太發動「五年理蕃計畫」，對台灣原住民族展開血腥鎮壓。原住民族先祖為了生存奮戰，最終於一九一四年六月二十六日讓佐久間重傷落馬。這段原住民族抵抗殖民的集體記憶，應立法紀念，以提醒世人這片土地與古老文化的無可取代價值，並確立原住民族的歷史地位與尊嚴。爰定六月二十六日為原住民族抵抗日。\n五、為儆醒戒嚴歷史，珍貴民主化不易，規定每年七月十五日為「解嚴紀念日」。\n六、鑑於八十三年八月一日總統令修正公布中華民國憲法增修條文將「山胞」正名為「原住民」，且憲法增修條文第十條明文規定「國家肯定多元文化，並積極維護發展原住民族語言及文化」，具有政府重視原住民族之地位與權益之深遠意義。為體現國家肯定多元文化之精神，爰定八月一日為原住民族日。\n七、我國歷經第二次世界大戰，臺灣於當時亦受日本殖民統治，而日本於三十四年八月十五日發布「投降詔書」，爰將八月十五日定為終戰紀念日，以警惕戰爭及彰顯和平之重要性。\n八、有鑑於南投縣集集鎮於八十八年九月二十一日凌晨發生芮氏規模七點三之淺層地震，造成人民生命財產之重大損害。為提升全民防災意識及國家防災應變能力，我國自八十九年起將九月二十一日定為「災害防救日」，九十一年更名為「國家防災日」，爰將其明文規定。\n九、二十一世紀以來，許多國家推動原住民族紀念日正名運動，核心在於揭示殖民者對原住民族的滅絕罪行。而一八九五年十月三十一日，台灣總督府頒布「官有林野及樟腦製造業取締規則」，強制將無地券證明的山林歸為官有，剝奪原住民族土地，使其流離失所，成為邊緣群體。前開殖民政策成為原住民族土地流失的關鍵轉折點，也是推動轉型正義的核心議題，應立法紀念，提醒世人這片土地與古老傳統的無可取代價值，確立原住民族歷史地位與尊嚴。爰定十月三十一日為原住民族轉型正義紀念日。"},{"bill":"202110097740000","text":"紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、原住民族日：八月一日。\n八、金門八二三炮戰紀念日：八月二十三日。\n九、國家防災日：九月二十一日。\n十、孔子誕辰紀念日：九月二十八日。\n十一、國慶日：十月十日。\n十二、臺灣聯合國日：十月二十四日。\n十三、臺灣光復紀念日：十月二十五日。\n十四、國父誕辰紀念日：十一月十二日。\n十五、國家棒球日：十一月二十四日。\n十六、行憲紀念日：十二月二十五日。\n十七、全國客家日：十二月二十八日。","note":"明定國家紀念日名稱及日期。"},{"bill":"202110097840000","text":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、革命先烈紀念日：三月二十九日。\n五、言論自由日：四月七日。\n六、佛陀誕辰紀念日：農曆四月八日。\n七、解嚴紀念日：七月十五日。\n八、原住民族日：八月一日。\n九、終戰紀念日：八月十五日。\n十、國家防災日：九月二十一日。\n十一、孔子誕辰紀念日：九月二十八日。\n十二、國慶日：十月十日。\n十三、聯合國日：十月二十四日。\n十四、臺灣光復紀念日：十月二十五日。\n十五、國父誕辰紀念日：十一月十二日。\n十六、行憲紀念日：十二月二十五日。\n十七、全國客家日：十二月二十八日。","note":"明定國家紀念日名稱及日期。"},{"bill":"202110099380000","text":"本法之紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、革命先烈紀念日：三月二十九日。\n五、佛陀誕辰紀念日：農曆四月八日。\n六、解嚴紀念日：七月十五日。\n七、慰安婦紀念日：八月十四日。\n八、孔子誕辰紀念日：九月二十八日。\n九、國慶日：十月十日。\n十、國父誕辰紀念日：十一月十二日。\n十一、行憲紀念日：十二月二十五日。","note":"一、參酌「紀念日及節日實施辦法」明定國家紀念日名稱及日期。\n二、第二次世界大戰期間，慰安婦人權遭受日本政府侵害甚鉅，自1992年起雖曾要求日本政府公開道歉、賠償等，均未獲得公平正義的結果。慰安婦經歷之傷痛為不容磨滅之歷史事實，故將國際慰安婦紀念日八月十四日定為每年之「慰安婦紀念日」。"},{"bill":"202110107560000","text":"紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、全國客家日：農曆一月二十日。\n三、和平紀念日：二月二十八日。\n四、國父逝世紀念日：三月十二日。\n五、言論自由日：四月七日。\n六、國家防災日：九月二十一日。\n七、孔子誕辰紀念日：九月二十八日。\n八、國慶日：十月十日。\n九、國父誕辰紀念日：十一月十二日。\n十、行憲紀念日：十二月二十五日。","note":"明定國家紀念日名稱及日期。"},{"bill":"202110102380000","text":"我國國家紀念日如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、反侵略日：三月十四日。\n四、革命先烈紀念日：三月二十九日。\n五、解嚴紀念日：七月十五日。\n六、原住民族日：八月一日。\n七、八二三紀念日：八月二十三日。\n八、孔子誕辰紀念日：九月二十八日。\n九、國慶日：十月十日。\n十、國父誕辰紀念日：十一月十二日。\n十一、新住民日：十二月十八日。\n十二、行憲紀念日：十二月二十五日。\n國父逝世紀念日在三月十二日植樹節舉行。","note":"我國國家紀念日名稱及日期。"},{"bill":"202110044280000","text":"國假暨文化節日之名稱與日期如下：\n一、元旦：一月一日。\n二、除夕：農曆十二月之末日。\n三、春節：農曆正月初一至初三。\n四、和平紀念日：二月二十八日。\n五、兒童節：四月四日。\n六、清明節：四月五日或前後一日。\n七、端午節：農曆五月五日。\n八、原住民族日：八月一日。\n九、中秋節：農曆八月十五日。\n十、國慶日：十月十日。\n前項所定國假暨文化節日為全國放假日。","note":"一、明定國假暨文化節日之名稱及日期。\n二、明定國假暨文化節日應予放假，全國一致為「十大」國假暨文化節日。\n三、本條例訂定之國假暨文化節日，均有重要民主發展脈絡及歷史意義，足資實施全國放假。"},{"bill":"202110043520000","text":"國家紀念日之名稱及日期如下：\n一、元旦：一月一日。\n二、全國客家日：農曆一月二十日。\n三、世界母語日：二月二十一日。\n四、和平紀念日：二月二十八日。\n五、言論自由日：四月七日。\n六、勞動權益日：五月一日。\n七、環境日：六月五日。\n八、解嚴紀念日：七月十五日。\n九、原住民族日：八月一日。\n十、國慶日：十月十日。\n十一、臺灣女權日：十一月三十日。\n十二、世界人權日：十二月十日。\n十三、國際移民日：十二月十八日。","note":"一、國家紀念日及節日之名稱及日期。\n二、本法所訂之國家紀念日均有重要歷史緣由，影響國家發展深遠，藉由紀念緬懷歷史、彰顯人權價值。\n三、「客家基本法」第十四條「政府應訂定全國客家日，以彰顯客家族群對臺灣多元文化之貢獻」，客委會於99年9月以行政命令公布農曆1月20日為全國客家日。\n四、聯合國教科文組織為宣傳保護語言的重要、促進母語傳播、教育等活動，於2000年決議每年的2月21日為世界母語日。\n五、為紀念臺灣言論自由之得來不易，擬將4月7日鄭南榕先生逝世日訂為言論自由日。\n六、五一勞動節依現有辦法非屬國定假日，且適用範圍限適用勞動基準法之勞工，無法全體適用，惟勞動節作為保障所有勞動者的權益，爰於本法定為國定假日，並以「勞動權益日」稱之。\n七、「環境基本法」第40條「6月5日為環境日」。\n八、1994年8月1日「中華民國憲法增修條文」正名為「原住民」，且第十條明定國家肯定多元文化，並積極維護發展原住民族語言及文化，擬訂8月1日為原住民族日。\n九、紀念臺灣女性權益之得來不易，擬將11月30日，促成多項女性法案及一生致力於婦女運動之彭婉如女士逝世日訂為臺灣女權日。\n十、聯合國大會自1950年起定每年的12月10日為國際人權日，以紀念聯合國於1948年12月10日通過了《世界人權宣言》。\n十一、聯合國於2000年12月18日聯合大會宣布將每年12月18日訂為「國際移民日」（International Migrants Day），內政部也於2011年將每年12月18日訂為臺灣「移民節」，為跟上國際潮流擬將該日定為「國際移民日」，以彰對移民人權、新住民照護及多元文化的重視。"}],"changed":true,"final":"紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、反侵略日：三月十四日。\n五、民族平等紀念日：三月二十一日。\n六、革命先烈紀念日：三月二十九日。\n七、言論自由日：四月七日。\n八、原住民族抵抗日：六月二十六日。\n九、解嚴紀念日：七月十五日。\n十、原住民族日：八月一日。\n十一、終戰紀念日：八月十五日。\n十二、八二三紀念日：八月二十三日。\n十三、國家防災日：九月二十一日。\n十四、孔子誕辰紀念日：九月二十八日。\n十五、國慶日：十月十日。\n十六、臺灣聯合國日：十月二十四日。\n十七、臺灣光復暨金門古寧頭大捷紀念日：十月二十五日。\n十八、國父誕辰紀念日：十一月十二日。\n十九、行憲紀念日：十二月二十五日。\n二十、全國客家日：十二月二十八日。","finalWhy":"照國民黨黨團、台灣民眾黨黨團再修正動議條文通過。","review":{"note":"照委員牛煦庭等22人提案、民眾黨黨團提案、委員高金素梅等29人提案、委員牛煦庭等50人所提修正動議及委員會初步審查修正條文併案保留協商","text":"委員會初步審查修正條文：\n第三條　紀念日之名稱及日期如下：\n一、中華民國開國紀念日：一月一日。\n二、和平紀念日：二月二十八日。\n三、國父逝世紀念日：三月十二日。\n四、反侵略日：三月十四日。\n五、總統直選紀念日：三月二十三日。\n六、革命先烈紀念日：三月二十九日。\n七、言論自由日：四月七日。\n八、白色恐怖記憶日：五月十九日。\n九、婚姻平權紀念日：五月二十四日。\n十、原住民族抵抗日：六月二十六日。\n十一、抗戰紀念日：七月七日。\n十二、解嚴紀念日：七月十五日。\n十三、原住民族日：八月一日。\n十四、終戰紀念日：八月十五日。\n十五、八二三紀念日：八月二十三日。\n十六、鄭成功誕辰紀念日：八月二十七日。\n十七、國家防災日：九月二十一日。\n十八、孔子誕辰紀念日：九月二十八日。\n十九、國慶日：十月十日。\n二十、臺灣聯合國日：十月二十四日。\n二十一、臺灣光復暨金門古寧頭大捷紀念日：十月二十五日。\n二十二、原住民族轉型正義紀念日：十月三十一日。\n二十三、國父誕辰紀念日：十一月十二日。\n二十四、美麗島事件紀念日：十二月十日\n二十五、行憲紀念日：十二月二十五日。\n二十六、全國客家日：十二月二十八日。"}},{"no":"第四條","current":null,"versions":[{"bill":"202110030420000","text":"前條各紀念日，其紀念方式如下：\n一、中華民國開國紀念日、國慶日、行憲紀念日：全國應懸掛國旗，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：全國得懸掛國旗，由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：全國得懸掛國旗，在植樹節植樹紀念。\n四、反侵略日、解嚴紀念日、中華民國臺灣聯合國日：全國得懸掛國旗，有關機關、團體得分別舉行紀念活動。\n五、革命先烈紀念日：全國得懸掛國旗，中央及地方政府分別春祭國殤。\n六、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n七、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。","note":"各項紀念日及節日之紀念方式及放假日。"},{"bill":"202110036170000","text":"前條所列紀念日，放假依下列規定辦理：\n一、元旦：放假一日。\n二、全國客家日：放假一日。\n三、和平紀念日：放假一日。\n四、原住民族日：放假一日。\n五、國慶日：放假一日。\n六、國際移民日：放假一日。\n前項以外之紀念日，均不放假。","note":"一、元旦及國慶日係國家建國歷史中最重要之紀念日，具有深遠意義，為緬懷前人建國艱辛，凝聚全民國家意識，爰明定各放假一日。\n二、「二二八事件處理及賠償條例」第四條第二項規定：「每年二月二十八日為『和平紀念日』，為國定紀念日，應予放假。」爰配合相關條例，明定和平紀念日放假一日，以省思緬懷，撫平歷史傷痛，促進族群融和。\n三、為鼓勵族群相互理解、促進多元文化，明定原住民族日、全國客家日及國際移民日各放假一日。"},{"bill":"202110046340000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日、行憲紀念日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日、八二三紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在三月十二日植樹節植樹紀念。\n四、解嚴紀念日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n七、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。","note":"明定本法紀念日之紀念方式及放假日。"},{"bill":"202110047800000","text":"下列紀念日均放假一日，其餘均不放假：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、解嚴紀念日。\n四、原住民族日。\n五、國家防災日。\n六、孔子誕辰紀念日。\n七、國慶日。\n八、行憲紀念日。","note":"一、中華民國開國紀念日、國慶日係國家歷史中最重要之紀念日，具有深遠意義，為緬懷前人建國艱辛，凝聚全民國家意識，爰明定各放假一日。\n二、二二八事件處理及賠償條例第四條第二項規定和平紀念日為國定紀念日，應予放假，爰明定和平紀念日放假一日，以省思緬懷，撫平歷史傷痛，促進和解。\n三、為紀念我國解嚴並開啟自由民主之新猷，爰明定解嚴紀念日放假一日。\n四、為落實憲法積極維護發展原住民族語言及文化之意旨，爰明定原住民族日放假一日。\n五、為使全民充實各種防災知能，爰明定國家防災日放假一日。\n六、為彰顯我國尊崇中華儒家精神，爰明定孔子誕辰紀念日放假一日。\n七、為倡導國家尊重憲法及宏揚法治精神，並持續深化民主，爰明定行憲紀念日放假一日。"},{"bill":"202110068720000","text":"前條各紀念日放假依下列規定辦理：\n一、中華民國開國紀念日、國慶日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、反侵略日、解嚴紀念日、臺灣聯合國日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n七、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。\n(三)行憲紀念日。","note":"明定我國紀念日之紀念方式及放假日。"},{"bill":"202110073030000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、反侵略日、佛陀誕辰紀念日、解嚴紀念日、原住民族紀念日、臺灣聯合國日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。\n(三)行憲紀念日。\n七、民族平等紀念日：由有關機關、團體舉行紀念活動，放假一日。","note":"明定紀念日紀念方式及放假日。"},{"bill":"202110072050000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、反侵略日、解嚴紀念日、臺灣聯合國日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n七、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。\n(三)行憲紀念日。","note":"我國紀念日之紀念方式及放假日。"},{"bill":"202110074310000","text":"前條所列紀念日，放假依下列規定辦理：\n一、中華民國開國紀念日。\n二、全國客家日。\n三、和平紀念日。\n四、原住民族日。\n五、國慶日。\n前項以外之紀念日，均不放假。","note":"明定我國紀念日之放假規定。"},{"bill":"202110074620000","text":"下列紀念日均放假一日，其餘均不放假：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、國慶日。\n四、臺灣光復紀念日。\n五、行憲紀念日。","note":"一、中華民國開國紀念日、國慶日係國家歷史中最重要之紀念日，具有深遠意義，為緬懷前人建國艱辛，凝聚全民意識，爰明定各放假一日。\n二、二二八事件處理及賠償條例第四條第二項規定和平紀念日為國定紀念日，應予放假，爰明定和平紀念日放假一日，以省思緬懷並共勉為國家之和平而努力。\n三、為謹記臺灣正式脫離日本殖民統治，重獲自由的歷史意義，傳承捍衛國家、犧牲奉獻的精神，爰明定臺灣光復紀念日放假一日。\n四、為倡導國家尊重憲法及宏揚法治精神，並持續深化民主，爰明定行憲紀念日放假一日。"},{"bill":"202110076000000","text":"前條以下紀念日，均放假一日：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、國慶日。\n四、臺灣光復紀念日。\n五、行憲紀念日。\n其他紀念日之紀念活動與方式由中央及地方政府分別明定。","note":"明定我國紀念日之放假及紀念規定。"},{"bill":"202110075240000","text":"下列紀念日，實施放假：\n一、中華民國開國紀念日：放假一日。\n二、和平紀念日：放假一日。\n三、國慶日：放假一日。\n四、臺灣光復紀念日：放假一日。\n五、行憲紀念日：放假一日。","note":"一、開國紀念日、國慶日、臺灣光復紀念日及行憲紀念日係國家歷史中最重要之紀念日，具有深遠意義，為緬懷前人建國艱辛，凝聚全民國家意識，爰明訂各放假一日。\n二、「二二八事件處理及賠償條例」第四條第二項規定：「每年二月二十八日為『和平紀念日』，為國定紀念日，應予放假。」爰配合相關條例，明訂和平紀念日放假一日。"},{"bill":"202110077660000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日：全中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動。\n二、和平紀念日：由有關機關、團體舉行紀念活動。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、反侵略日、解嚴紀念日、臺灣聯合國日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n七、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。\n(三)行憲紀念日。\n下列紀念日均放假一日，其餘均不放假：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、國慶日。","note":"參照現行紀念日及節日實施辦法加以援用。"},{"bill":"202110080400000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、反侵略日、佛陀誕辰紀念日、解嚴紀念日、原住民族紀念日、臺灣聯合國日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。\n(三)行憲紀念日。\n七、民族平等紀念日：由有關機關、團體舉行紀念活動，放假一日。","note":"明定紀念日紀念方式及放假日。"},{"bill":"202110082810000","text":"下列紀念日均放假一日：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、解嚴紀念日。\n四、原住民族日。\n五、國家防災日。\n六、孔子誕辰紀念日。\n七、國慶日。\n八、行憲紀念日。","note":"明定紀念日放假方式。"},{"bill":"202110087510000","text":"下列紀念日均放假一日，其餘均不放假：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、解嚴紀念日。\n四、原住民族日。\n五、國家防災日。\n六、孔子誕辰紀念日。\n七、國慶日。\n八、行憲紀念日。","note":"一、中華民國開國紀念日、國慶日係國家歷史中最重要之紀念日，具有深遠意義，為緬懷前人建國艱辛，凝聚全民國家意識，爰明定各放假一日。\n二、二二八事件處理及賠償條例第四條第二項規定和平紀念日為國定紀念日，應予放假，爰明定和平紀念日放假一日，以省思緬懷，撫平歷史傷痛，促進和解。\n三、為紀念我國解嚴並開啟自由民主之新猷，爰明定解嚴紀念日放假一日。\n四、為落實憲法積極維護發展原住民族語言及文化之意旨，爰明定原住民族日放假一日。\n五、為使全民充實各種防災知能，爰明定國家防災日放假一日。\n六、為彰顯我國尊崇中華儒家精神，爰明定孔子誕辰紀念日放假一日。\n七、為倡導國家尊重憲法及宏揚法治精神，並持續深化民主，爰明定行憲紀念日放假一日。"},{"bill":"202110087570000","text":"國定假日逢例假日者，應予補假。例假日為星期六者，於前一個上班日補假，為星期日者，於次一個上班日補假。但除夕及春節逢例假日者，均於次一個上班日補假。\n上班日為星期一或星期五，其後一日或前一日逢星期二或星期四之除夕及春節連假、清明節、端午節、中秋節、重陽節之放假，調整該上班日為放假日。\n除夕及春節假期、清明節、端午節、中秋節、重陽節如逢星期二或星期四，其前、後一日上班日調整放假。\n前項調整放假，除除夕及春節假期外，應依下列規定補行上班：\n一、逢星期二者，於節日當週之星期六補行上班。\n二、逢星期四者，於節日前一週之星期六補行上班。但清明節於節日後一週之星期六補行上班。\n前二項調整放假及補行上班日期，由主管機關於前一年十月三十一日前調移並公告之。","note":"一、第一項明定國定假日逢例假例假日應予補假一天。\n二、為利於民眾返鄉通勤、緩解交通疏運、發展觀光旅遊、維護傳統習俗，爰於第二項明定民俗節日（除夕及春節連假、清明節、端午節、中秋節、重陽節）適逢星期二及星期四者，其前、後上班日均予以調整放假，其於國定假日則視實際需要調整放假。\n三、第五項明定必要時調整放假及補行上班之規定，調整放假及補行上班日期，主管機關應於前一年十月三十一日前公告之。"},{"bill":"202110086500000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日、孔子誕辰紀念日、臺灣光復紀念日、行憲紀念日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、反侵略日、解嚴紀念日、金門八二三炮戰紀念日、臺灣聯合國日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n七、國父誕辰紀念日、原住民族日、國家棒球日、全國客家日、國家防災日：由中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動。","note":"明定紀念日之紀念方式及放假規定，其紀念活動為有關單位、機關、團體及學校訂之。"},{"bill":"202110093980000","text":"下列紀念日均放假一日，其餘均不放假：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、解嚴紀念日。\n四、國慶日。\n五、臺灣光復紀念日。\n六、國父誕辰紀念日。\n七、中華民國國旗日。\n八、行憲紀念日。","note":"明定本條例紀念日之放假日。"},{"bill":"202110093510000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日、行憲紀念日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、反侵略日、解嚴紀念日、臺灣聯合國日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n七、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。","note":"於本條明定各紀念日之慶祝及放假方式。"},{"bill":"202110096450000","text":"下列紀念日均放假一日：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、孔子誕辰紀念日。\n四、國慶日。\n五、臺灣光復紀念日。\n六、行憲紀念日。","note":"一、開國紀念日、國慶日、臺灣光復紀念日、行憲紀念日係國家歷史中最重要之紀念日，具有深遠意義，為緬懷前人建國、臺灣光復、制憲艱辛，凝聚全民國家意識，爰明訂各放假一日。\n二、「二二八事件處理及賠償條例」第四條第二項規定：「每年二月二十八日為『和平紀念日』，為國定紀念日，應予放假。」爰配合相關條例，明訂和平紀念日放假一日。\n三、為彰顯我國尊崇中華儒家精神，爰明定孔子誕辰紀念日放假一日。"},{"bill":"202110097410000","text":"下列紀念日均放假一日，其餘均不放假：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、原住民族抵抗日。\n四、解嚴紀念日。\n五、原住民族日。\n六、國家防災日。\n七、孔子誕辰紀念日。\n八、國慶日。\n九、原住民族轉型正義紀念日。\n十、行憲紀念日。","note":"一、中華民國開國紀念日、國慶日係國家歷史中最重要之紀念日，具有深遠意義，為緬懷前人建國艱辛，凝聚全民國家意識，爰明定各放假一日。\n二、二二八事件處理及賠償條例第四條第二項規定和平紀念日為國定紀念日，應予放假，爰明定和平紀念日放假一日，以省思緬懷，撫平歷史傷痛，促進和解。\n三、為紀念原住民族驅逐外辱，成功抵抗抵抗殖民者集體記憶，提醒世人原住民族的古老文化的無可取代價值，爰明定原住民族抵抗日放假一日。\n四、為紀念我國解嚴並開啟自由民主之新猷，爰明定解嚴紀念日放假一日。\n五、為落實憲法積極維護發展原住民族語言及文化之意旨，爰明定原住民族日放假一日。\n六、為使全民充實各種防災知能，爰明定國家防災日放假一日。\n七、為彰顯我國尊崇中華儒家精神，爰明定孔子誕辰紀念日放假一日。\n八、總督府強占原住民族土地，致其流離失所，成轉型正義關鍵議題。應立法紀念，彰顯文化價值，確立原住民族尊嚴，爰明定原住民族轉型正義紀念日放假一日。\n九、為倡導國家尊重憲法及宏揚法治精神，並持續深化民主，爰明定行憲紀念日放假一日。"},{"bill":"202110097740000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日、孔子誕辰紀念日、臺灣光復紀念日、行憲紀念日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、革命先烈紀念日：中央及地方政府分別春祭國殤。\n五、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n六、國父誕辰紀念日、原住民族日、國家棒球日、全國客家日、國家防災日：由中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動。","note":"明定紀念日之紀念方式及放假規定，其紀念活動為有關單位、機關、團體及學校定之。"},{"bill":"202110097840000","text":"下列紀念日均放假一日：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、孔子誕辰紀念日。\n四、國慶日。\n五、行憲紀念日。\n其他紀念日之紀念活動與方式由中央及地方政府分別明定。","note":"明定紀念日放假方式及紀念規定。"},{"bill":"202110099380000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在三月十二日植樹節植樹紀念。\n四、革命先烈紀念日：中央及地方政府分別春祭國殤，放假一日。\n五、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n六、解嚴紀念日、慰安婦紀念日：由有關機關、團體舉行紀念活動。\n七、孔子誕辰紀念日：中央及地方政府分別舉行紀念活動，放假一日。\n八、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)國父誕辰紀念日。\n(二)行憲紀念日。","note":"一、參酌「紀念日及節日實施辦法」明定本法紀念日之紀念方式及放假日。\n二、黃花崗起義對我國影響深遠，為紀念起義犧牲之烈士，將三月二十九日訂為我國「革命先烈紀念日」，此紀念日也象徵我國青年蓬勃奮發之朝氣與活潑進取之精神，也為本法第六條之「青年節」，放假一日。\n三、孔子奠基我國之教育理念，其「有教無類」、「因材施教」等思想，至今仍是教育政策之方針，為彰顯其教育理念及體恤教師之辛勞，特訂孔子誕辰日為我國之紀念日，亦為我國之「教師節」，放假一日。"},{"bill":"202110107560000","text":"前條所列紀念日，放假依下列規定辦理：\n一、中華民國開國紀念日。\n二、全國客家日。\n三、和平紀念日。\n四、國慶日。\n前項以外之紀念日，均不放假。","note":"明定我國紀念日之放假規定。"},{"bill":"202110102380000","text":"前條各紀念日，全國懸掛國旗，其紀念方式如下：\n一、中華民國開國紀念日、國慶日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動，放假一日。\n二、和平紀念日：由有關機關、團體舉行紀念活動，放假一日。\n三、國父逝世紀念日：在植樹節植樹紀念。\n四、反侵略日、解嚴紀念日：由有關機關、團體舉行紀念活動。\n五、革命先烈紀念日：中央及地方政府分別春祭國殤。\n六、下列各紀念日，中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動：\n(一)孔子誕辰紀念日。\n(二)國父誕辰紀念日。\n(三)行憲紀念日。","note":"我國紀念日之紀念方式及放假日。"},{"bill":"202110044280000","text":"除前條規定外，其它節日之放假，依下列規定辦理：\n一、消防節：一月十九日。\n二、勞動節：五月一日。\n三、警察節：六月十五日。\n四、軍人節：九月三日。\n除前項規定放假節日以外，基於尊重與傳承多元文化價值，原住民每年應有三日之歲時祭儀放假日。\n第一項第一款及第三款依內政部規定放假，第一項第二款適用勞動基準法之勞工放假一日，第一項第四款依國防部規定放假。","note":"一、其它節日依各主管機關規定放假。\n二、本條例除定之「十大」國假暨文化節日以外，為彰顯原住民族之民主發展意義，凡具原住民族身分者均應享專屬專有年度三日之歲時祭儀放假日。"},{"bill":"202110043520000","text":"前條所列之國家紀念日，放假依下列規定辦理：\n一、元旦：放假一日。\n二、全國客家日：放假一日。\n三、和平紀念日：放假一日。\n四、勞動權益日：放假一日。\n五、原住民族日：放假一日。\n六、國慶日：放假一日。\n七、國際移民日：放假一日。","note":"國家紀念日之放假規定。"}],"changed":true,"final":"下列紀念日均放假一日，其餘均不放假：\n一、中華民國開國紀念日。\n二、和平紀念日。\n三、孔子誕辰紀念日。\n四、國慶日。\n五、臺灣光復暨金門古寧頭大捷紀念日。\n六、行憲紀念日。","finalWhy":"照國民黨黨團、台灣民眾黨黨團再修正動議條文通過。","review":{"note":"照委員牛煦庭等22人提案、民眾黨黨團提案、委員高金素梅等29人提案及委員牛煦庭等50人所提修正動議併案保留協商","text":""}},{"no":"第五條","current":null,"versions":[{"bill":"202110030420000","text":"下列民俗節日，除春節放假四日外，其餘均放假一日：\n一、春節。\n二、民族掃墓節。\n三、端午節。\n四、中秋節。\n五、農曆除夕。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"民俗節日及放假方式。"},{"bill":"202110036170000","text":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：定於清明日。\n(四)端午節：農曆五月五日。\n(五)中秋節：農曆八月十五日。\n(六)重陽敬老節：農曆九月九日。\n(七)除夕：農曆十二月之末日。\n(八)原住民族歲時祭儀：由各原住民族部落自行擇定，報請主管機關公告之。\n(九)其他民族及宗教歲時祭儀：由各民族及宗教群體自行擇定，報請各該主管機關公告之。\n二、消防節：一月十九日。\n三、農民節：立春日。\n四、婦女節：三月八日。\n五、國際醫師節：三月三十日。\n六、兒童節：四月四日。\n七、世界地球日：四月二十二日。\n八、勞動節：五月一日。\n九、國際護士節：五月十二日。\n十、母親節：五月第二個週日。\n十一、警察節：六月十五日。\n十二：父親節：八月八日。\n十三：祖父母節：八月第四個週日。\n十四、軍人節：九月三日。\n十五、教師節：九月二十八日。","note":"一、明定節日之名稱及日期。\n二、本條例所訂之民俗節日為春節、元宵節、清明節、端午節、中秋節、重陽敬老節、除夕、其他民族及宗教歲時祭儀。上述節日蘊含重要民俗傳統及倫理道德，民間習於配合慣俗舉行相關活動，爰配合民情訂為民俗節日。其餘節日包括消防節、農民節、婦女節、國際醫師節、兒童節、世界地球日、勞動節、國際護士節、母親節、警察節、父親節、祖父母節、軍人節、教師節。\n三、政府為發揚慎終追遠之美德，訂清明節為民族掃墓節，其日期依節氣而定，考量民間亦慣稱清明節，故還原節日名稱（依據中央氣象局所提供資料，清明日之推算方式，由春分開始將地球公轉太陽的軌道上，每15度定一個節氣，一周360度共分為二十四節氣。假設地球不動，太陽全年繞地球一周，將春分時太陽所在位置的春分點定為太陽黃經度零度，當太陽運行到太陽黃經度15度時，定為清明。近一百餘年（西元1900年至2010年），清明日曾出現在四月四、五、六日中之一日。\n四、原住民族歲時祭儀蘊含重大之文化、歷史意義，代表各族群、部落最深刻的集體記憶。惟各族群、部落之歲時祭儀繁多且時間不同，難以統一之具體時間規定，故由各原住民族部落自行擇定後報請主管機關公告，以應實際需要。\n五、民族及宗教之歲時祭儀蘊含重大之文化、歷史意義，代表各群體最深刻的集體記憶。惟各民族、宗教之歲時祭儀繁多且時間不同，難以統一之具體時間規定，故由各民族及宗教團體自行擇定後報請各該主管機關公告，以應實際需要。\n六、民國62年1月3日，內政部警政署以（六二）警署消字第2007號令，核定62年1月19日為「第一屆消防節」。\n七、立春，是二十四節氣中的第一個節氣，指太陽到達黃經315度時，為公曆每年2月3日至5日之間，表示春天的開始，於傳統農業社會具有重大意義。\n八、世界地球日源自於1970年，由美國威斯康辛州兩名參議員發起，吸引大批美國人民上街頭，遊說國會議員通過環境生態法案。到了1990年，已有141個國家，共2億人參與，環保議題在各地蔓延。每年4月22日的世界地球日已成為國際重要的環保節日。\n九、1991年，美國國會將3月30日定為醫生節，後為全球沿用。\n十、1886年5月1日，美國勞工以芝加哥為中心，於全美進行大規模罷工和示威遊行，要求改善勞動條件、實行八小時工作制。5月4日，在芝加哥乾草市場舉行集會的勞工遭警察開槍鎮壓，其中數人死亡，史稱「乾草市場事件」（Haymarket Affair）。1889年，為紀念上述歷史，第一國際決議未來，每年5月1日為「國際勞動節」，日後逐漸為世界各國接納、採用。\n十一、南丁格爾被譽為近代護理創始人，致力推動世界各地護理工作與護士教育的發展，1963年國際護士會決定以她的生日5月12日為國際護士節。\n十二、母親節由安娜‧賈維斯（Anna Jarvis,1864-1948）發起，她提出應設立一個紀念日來紀念沒沒無聞做出奉獻的母親們，1913年，美國國會確定將每年5月的第二個星期日作為法定的母親節。\n十三、「警察法」於1979年6月15日正式施行，時任警政署長孔令晟特別將615定為警察節。\n十四、8月8日取「爸爸」之諧音，訂為父親節。\n十五、由教育部發起祖父母節，定在每年8月的第四個星期日，可以趁學童在開始學期前，與祖父母相處增進親情。"},{"bill":"202110046340000","text":"下列民俗節日，除春節放假三日外，其餘均放假一日：\n一、農曆除夕。\n二、春節。\n三、民族掃墓節。\n四、端午節。\n五、中秋節。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"明定民俗節日及放假方式。"},{"bill":"202110047800000","text":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：定於清明日。\n(四)端午節：農曆五月五日。\n(五)中元節：農曆七月十五日。\n(六)中秋節：農曆八月十五日。\n(七)重陽節：農曆九月九日。\n(八)除夕：農曆十二月之末日。\n(九)原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗及徵詢各該原住民族部落意見後公告，並刊登政府公報。\n二、消防節：一月十九日。\n三、農民節：定於立春日。\n四、婦女節：三月八日。\n五、植樹節：三月十二日。\n六、青年節：三月二十九日。\n七、兒童節：四月四日。\n八、勞動節：五月一日。\n九、母親節：五月第二個星期日。\n十、環境日：六月五日。\n十一、國家海洋日：六月八日。\n十二、警察節：六月十五日。\n十三：父親節：八月八日。\n十四：祖父母節：八月第四個星期日。\n十五、軍人節：九月三日。\n十六、教師節：九月二十八日。\n十七、臺灣光復節：十月二十五日。\n十八、中華文化復興節：十一月十二日。\n十九、身心障礙者日：十二月三日。\n二十、人權日：十二月十日。\n二十一、移民日：十二月十八日。\n二十二、全國客家日：由客家委員會訂定後公告，並刊登政府公報。","note":"一、明定節日之名稱及日期。\n二、春節、元宵節、清明節、端午節、中元節、中秋節、重陽節及除夕在民間由來已久，民間習於配合慣俗舉行相關活動，蘊藏重要民俗傳統及倫理道德，爰配合民情並參酌現行紀念日及節日實施辦法定為民俗節日，以傳承中華傳統民俗。\n三、政府為發揚慎終追遠之美德，訂清明節為民族掃墓節，其日期依節氣而定，考量民間亦慣稱清明節，故還原節日名稱。另清明日之推算方式，由春分開始將地球公轉太陽的軌道上，每十五度定一個節氣，一周三百六十度共分為二十四節氣。採假設地球不動，太陽全年繞地球一周的方式，將春分時太陽所在位置的春分點定為太陽黃經度零度，當太陽運行到太陽黃經度十五度時，定為清明。近一百餘年（西元一九○○年至二○一○年），清明日曾出現在四月四、五、六日中之一日。\n四、原住民各族之歲時祭儀，在各部落中源遠流長，與原住民族之日常生活息息相關，內蘊深刻之部落倫理、宗教信仰及社會規範，為原住民族文化之核心，本於憲法增修條文肯定多元文化之精神，爰將原住民族之歲時祭儀明定為民俗節日。惟各部落舉辦歲時祭儀之時間不同，且同一部落舉辦之時間往往年年變更，難以定出具體時間，故其日期由原住民族委員會參酌各該原住民族習俗，並徵詢各該部落意見定之，以應實際需要。\n五、婦女節、植樹節、青年節、兒童節、勞動節、軍人節、教師節、臺灣光復節及中華文化復興節均參照現行紀念日及節日實施辦法加以援用。\n六、立春係二十四節氣中之第一個節氣，指太陽到達黃經三百十五度時，約為公曆二月三日至五日之間，以示春天之始，為彰顯農為國本並敬重農民對國家之貢獻，爰將立春日定為農民節。\n七、警察及消防人員係社會安定之中流砥柱，為彰顯警消人員之辛勞，參照警察法於四十二年六月十五日施行，爰以是日定為警察節；內政部警政署於六十二年一月三日核定六十二年一月十九日為「第一屆消防節」，爰援引該日定為消防節。\n八、為促使國民、事業及各級政府深植環境保護理念，共同關懷環境問題，環境基本法第四十條明定六月五日為環境日。\n九、為促使政府及社會各界深植海洋意識，海洋基本法第十八條明定六月八日為國家海洋日。\n十、為喚起國人重視祖孫世代互動及關懷祖父母，教育部依據家庭教育法中倫理教育之內涵，並訂每年八月第四個星期日為「祖父母節」，以倡導祖孫關係之重要性，並鼓勵祖孫互動，相互表達情感與感謝，進一步以教育搭起世代橋樑，落實不分年齡共享之融合社會願景。\n十一、為促進社會大眾共同參與並喚起對身心障礙者議題之重視，爰參考第四十七屆聯合國大會之決議，將十二月三日定為身心障礙者日。\n十二、鑑於聯合國大會於三十七年十二月十日通過「世界人權宣言」，以表彰人權之普世價值，我國當時亦參與其中，爰將十二月時日定為人權日。\n十三、為肯定多元文化並促進其發展，並感念移民及移工對我國社會之貢獻，爰參考聯合國之倡議，將十二月十八日定為移民日。\n十四、為促進各族群認識與共享客家文化價值，彰顯客家族群對臺灣多元文化之貢獻，客家基本法第二十條第一項授權行政機關訂定全國客家日。"},{"bill":"202110068720000","text":"下列民俗節日，除春節放假四日外，其餘均放假一日：\n一、春節：農曆一月一日。\n二、民族掃墓節：四月五日。\n三、端午節：農曆五月五日。\n四、中秋節：農曆八月十五日。\n五、農曆除夕：農曆十二月三十一日。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"明定民俗節日及放假方式。"},{"bill":"202110073030000","text":"下列民俗節日，除春節及原住民族歲時祭儀至少放假三日外，其餘均放假一日：\n一、清明節。\n二、端午節。\n三、中秋節。\n四、農曆除夕。\n五、原住民族歲時祭儀：各該原住民族放假日期及日數，由原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"一、明定民俗節日及放假天數。\n二、原住民族歲時祭儀對原住民維繫文化、凝聚族群認同，具有非常重要的意義，故各族原住民將參加歲時祭儀視為重要義務。為使原住民可以放假返鄉參加祭儀，以助益原住民族重要文化的傳承，爰明定原住民族歲時祭儀放假日期及日數，由原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。"},{"bill":"202110072050000","text":"下列民俗節日，除春節放假三日外，其餘均放假一日：\n一、春節。\n二、民族掃墓節。\n三、端午節。\n四、中秋節。\n五、農曆除夕。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"我國民俗節日及放假方式。"},{"bill":"202110074310000","text":"下列民俗節日，除春節放假四日外，其餘均放假一日：\n一、春節：農曆一月一日至一月四日。\n二、清明節：定於清明日。\n三、端午節：農曆五月五日。\n四、中秋節：農曆八月十五日。\n五、農曆除夕：農曆十二月之末日。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"明定民俗節日及放假方式。"},{"bill":"202110074620000","text":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)清明節：定於清明日。\n(三)端午節：農曆五月五日。\n(四)中秋節：農曆八月十五日。\n(五)除夕：農曆十二月之末日。\n(六)原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗及徵詢各該原住民族部落意見後公告，並刊登政府公報。\n二、道教節：農曆一月一日。\n三、婦女節：三月八日。\n四、青年節：三月二十九日。\n五、兒童節：四月四日。\n六、勞動節：五月一日。\n七、軍人節：九月三日。\n八、教師節：九月二十八日。\n九、中華文化復興節：十一月十二日。","note":"一、參酌現行紀念日及節日實施辦法，明定節日之名稱及日期。\n二、春節、清明節、端午節、中秋節及除夕在民間由來已久，民間習於配合慣俗舉行相關活動，蘊藏重要民俗傳統及倫理道德，爰配合民情並參酌現行紀念日及節日實施辦法定為民俗節日，以傳承中華傳統民俗。\n三、政府為發揚慎終追遠之美德，訂清明節為民族掃墓節，其日期依節氣而定，考量民間亦慣稱清明節，故還原節日名稱。另依清明日之推算方式，由春分開始將地球公轉太陽的軌道上，每十五度定一個節氣，一周三百六十度共分為二十四節氣。採假設地球不動，太陽全年繞地球一周的方式，將春分時太陽所在位置的春分點定為太陽黃經度零度，當太陽運行到太陽黃經度十五度時，定為清明。近一百餘年（西元一九○○年至二○一○年），清明日曾出現在四月四、五、六日中之一日。\n四、原住民各族之歲時祭儀，在各部落中源遠流長，與原住民族之日常生活息息相關，內蘊深刻之部落倫理、宗教信仰及社會規範，為原住民族文化之核心，本於憲法增修條文肯定多元文化之精神，爰將原住民族之歲時祭儀明定為民俗節日。惟各部落舉辦歲時祭儀之時間不同，且同一部落舉辦之時間往往年年變更，難以定出具體時間，故其日期由原住民族委員會參酌各該原住民族習俗，以應實際需要。\n五、道教節、婦女節、青年節、兒童節、勞動節、軍人節、教師節及中華文化復興節均參照現行紀念日及節日實施辦法加以援用。"},{"bill":"202110076000000","text":"下列民俗節日，除春節放假四日外，其餘均放假一日：\n一、春節。\n二、民族掃墓節。\n三、端午節。\n四、中秋節。\n五、農曆除夕。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"明定民俗節日及放假方式。"},{"bill":"202110075240000","text":"下列為民俗節日，除春節放假三日外，其餘均放假一日：\n一、農曆除夕。\n二、春節。\n三、清明節。\n四、端午節。\n五、中秋節。\n六、原住民族歲時祭儀：其日期由原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"本條例參酌「紀念日及節日實施辦法」明定民俗節日及放假方式。"},{"bill":"202110077660000","text":"節日之名稱及日期如下：\n一、春節、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、民族掃墓節：訂於清明日。\n六、端午節：農曆五月五日。\n七、勞動節：五月一日。\n八、軍人節：九月三日。\n九、中秋節：農曆八月十五日。\n十、教師節：九月二十八日。\n十一、臺灣光復節：十月二十五日。\n十二、中華文化復興節：十一月十二日。\n十三、農曆除夕：農曆十二月之末日。\n十四、原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"一、明定節日之名稱及其日期。\n二、本條例所定之節日，有其民俗價值、族群象徵意義或歷史淵源，為尊重民俗傳統與促進族群多元價值而定之。"},{"bill":"202110080400000","text":"下列民俗節日，除春節及原住民族歲時祭儀至少放假三日外，其餘均放假一日：\n一、清明節。\n二、端午節。\n三、中秋節。\n四、農曆除夕。\n五、原住民族歲時祭儀：各該原住民族放假日期及日數，由原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"一、明定民俗節日及放假天數。\n二、原住民族歲時祭儀對原住民維繫文化、凝聚族群認同，具有非常重要的意義，應將原住民參加歲時祭儀視為重要義務。為使原住民可以放假返鄉參加祭儀，以助益原住民族重要文化的傳承，爰明定原住民族歲時祭儀放假日期及日數，由原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。"},{"bill":"202110082810000","text":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：定於清明日。\n(四)端午節：農曆五月五日。\n(五)中元節：農曆七月十五日。\n(六)中秋節：農曆八月十五日。\n(七)重陽節：農曆九月九日。\n(八)除夕：農曆十二月之末日。\n(九)原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗及徵詢各該原住民族部落意見後公告，並刊登政府公報。\n二、消防節：一月十九日。\n三、農民節：定於立春日。\n四、婦女節：三月八日。\n五、植樹節：三月十二日。\n六、青年節：三月二十九日。\n七、兒童節：四月四日。\n八、勞動節：五月一日。\n九、母親節：五月第二個星期日。\n十、環境日：六月五日。\n十一、國家海洋日：六月八日。\n十二、警察節：六月十五日。\n十三：父親節：八月八日。\n十四：祖父母節：八月第四個星期日。\n十五、軍人節：九月三日。\n十六、教師節：九月二十八日。\n十七、臺灣光復節：十月二十五日。\n十八、中華文化復興節：十一月十二日。\n十九、身心障礙者日：十二月三日。\n二十、人權日：十二月十日。\n二十一、移民日：十二月十八日。\n二十二、全國客家日：由客家委員會訂定後公告，並刊登政府公報。","note":"明定節日之名稱及日期。"},{"bill":"202110087510000","text":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：定於清明日。\n(四)端午節：農曆五月五日。\n(五)中元節：農曆七月十五日。\n(六)中秋節：農曆八月十五日。\n(七)重陽節：農曆九月九日。\n(八)除夕：農曆十二月之末日。\n(九)原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗及徵詢各該原住民族部落意見後公告，並刊登政府公報。\n二、消防節：一月十九日。\n三、農民節：定於立春日。\n四、婦女節：三月八日。\n五、植樹節：三月十二日。\n六、青年節：三月二十九日。\n七、兒童節：四月四日。\n八、勞動節：五月一日。\n九、母親節：五月第二個星期日。\n十、環境日：六月五日。\n十一、國家海洋日：六月八日。\n十二、警察節：六月十五日。\n十三：父親節：八月八日。\n十四：祖父母節：八月第四個星期日。\n十五、軍人節：九月三日。\n十六、教師節：九月二十八日。\n十七、臺灣光復節：十月二十五日。\n十八、中華文化復興節：十一月十二日。\n十九、身心障礙者日：十二月三日。\n二十、人權日：十二月十日。\n二十一、移民日：十二月十八日。\n二十二、全國客家日：由客家委員會訂定後公告，並刊登政府公報。","note":"一、明定節日之名稱及日期。\n二、春節、元宵節、清明節、端午節、中元節、中秋節、重陽節及除夕在民間由來已久，民間習於配合慣俗舉行相關活動，蘊藏重要民俗傳統及倫理道德，爰配合民情並參酌現行紀念日及節日實施辦法定為民俗節日，以傳承中華傳統民俗。\n三、政府為發揚慎終追遠之美德，訂清明節為民族掃墓節，其日期依節氣而定，考量民間亦慣稱清明節，故還原節日名稱。另清明日之推算方式，由春分開始將地球公轉太陽的軌道上，每十五度定一個節氣，一周三百六十度共分為二十四節氣。採假設地球不動，太陽全年繞地球一周的方式，將春分時太陽所在位置的春分點定為太陽黃經度零度，當太陽運行到太陽黃經度十五度時，定為清明。近一百餘年（西元一九○○年至二○一○年），清明日曾出現在四月四、五、六日中之一日。\n四、原住民各族之歲時祭儀，在各部落中源遠流長，與原住民族之日常生活息息相關，內蘊深刻之部落倫理、宗教信仰及社會規範，為原住民族文化之核心，本於憲法增修條文肯定多元文化之精神，爰將原住民族之歲時祭儀明定為民俗節日。惟各部落舉辦歲時祭儀之時間不同，且同一部落舉辦之時間往往年年變更，難以定出具體時間，故其日期由原住民族委員會參酌各該原住民族習俗，並徵詢各該部落意見定之，以應實際需要。\n五、婦女節、植樹節、青年節、兒童節、勞動節、軍人節、教師節、臺灣光復節及中華文化復興節均參照現行紀念日及節日實施辦法加以援用。\n六、立春係二十四節氣中之第一個節氣，指太陽到達黃經三百十五度時，約為公曆二月三日至五日之間，以示春天之始，為彰顯農為國本並敬重農民對國家之貢獻，爰將立春日定為農民節。\n七、警察及消防人員係社會安定之中流砥柱，為彰顯警消人員之辛勞，參照警察法於四十二年六月十五日施行，爰以是日定為警察節；內政部警政署於六十二年一月三日核定六十二年一月十九日為「第一屆消防節」，爰援引該日定為消防節。\n八、為促使國民、事業及各級政府深植環境保護理念，共同關懷環境問題，環境基本法第四十條明定六月五日為環境日。\n九、為促使政府及社會各界深植海洋意識，海洋基本法第十八條明定六月八日為國家海洋日。\n十、為喚起國人重視祖孫世代互動及關懷祖父母，教育部依據家庭教育法中倫理教育之內涵，並訂每年八月第四個星期日為「祖父母節」，以倡導祖孫關係之重要性，並鼓勵祖孫互動，相互表達情感與感謝，進一步以教育搭起世代橋樑，落實不分年齡共享之融合社會願景。\n十一、為促進社會大眾共同參與並喚起對身心障礙者議題之重視，爰參考第四十七屆聯合國大會之決議，將十二月三日定為身心障礙者日。\n十二、鑑於聯合國大會於三十七年十二月十日通過「世界人權宣言」，以表彰人權之普世價值，我國當時亦參與其中，爰將十二月時日定為人權日。\n十三、為肯定多元文化並促進其發展，並感念移民及移工對我國社會之貢獻，爰參考聯合國之倡議，將十二月十八日定為移民日。\n十四、為促進各族群認識與共享客家文化價值，彰顯客家族群對臺灣多元文化之貢獻，客家基本法第二十條第一項授權行政機關訂定全國客家日。"},{"bill":"202110087570000","text":"第三條及前條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、警察、消防、海巡、醫療、關務、矯正等全年無休實施輪班、輪休制度之政府機關或機構，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關基於國防安全考量及因應戰備之需要，由目的事業主管機關視實際需要調移之。\n四、事業單位因經營需要，由勞資雙方協議調移之。","note":"一、鑑於特殊職種需要及各行業經營需求有別，爰明定第三條及第四條之放假日，得由勞資雙方協議或目的事業機關調移之。本條第四款之「事業單位」，包括公、民營事業單位在內。\n二、考量本法行後之法律位階高於公務人員週休二日實施辦法，為避免該辦法第四條所規範之對象，如交通運輸、警察、消防、海岸巡防、醫療、關務、其他為民服務機關、機構或軍事機關等，其放假產生法規適用之問題，爰將該條文適用之對象納入規範。"},{"bill":"202110086500000","text":"下列民俗節日，除春節放假三日外，其餘均放假一日：\n一、春節。\n二、民族掃墓節。\n三、端午節。\n四、中秋節。\n五、農曆除夕。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"明定民俗節日及放假方式。"},{"bill":"202110093980000","text":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：定於清明日。\n(四)端午節：農曆五月五日。\n(五)中元節：農曆七月十五日。\n(六)中秋節：農曆八月十五日。\n(七)重陽節：農曆九月九日。\n(八)除夕：農曆十二月之末日。\n(九)原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。\n(十)其他民族及宗教歲時祭儀：由各民族及宗教群體自行擇定，報請各該主管機關公告之。\n二、道教節：農曆一月一日。\n三、消防節：一月十九日。\n四、婦女節：三月八日。\n五、植樹節：三月十二日。\n六、青年節：三月二十九日。\n七、國際醫師節：三月三十日。\n八、兒童節：四月四日。\n九、世界地球日：四月十二日。\n十、勞動節：五月一日。\n十一、母親節：五月第二個星期日。\n十二、國際護理師節：五月十二日。\n十三、環境日：六月五日。\n十四、國家海洋日：六月八日。\n十五、警察節：六月十五日。\n十六、父親節：八月八日。\n十七、祖父母節：八月第四個星期日。\n十八、軍人節：九月三日。\n十九、教師節：九月二十八日。\n二十、中華文化復興節：十一月十二日。\n二十一、身心障礙者日：十二月三日。\n二十二、人權日：十二月十日。\n二十三、聖誕節：十二月二十五日。","note":"明定本條例節日之名稱及日期。"},{"bill":"202110093510000","text":"下列民俗節日，除春節放假三日外，其餘均放假一日：\n一、春節。\n二、民族掃墓節。\n三、端午節。\n四、中秋節。\n五、農曆除夕。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"於本條明定民俗節日及其放假方式。"},{"bill":"202110096450000","text":"下列民俗節日，除春節放假三日外，其餘均放假一日：\n一、春節。\n二、清明節。\n三、端午節。\n四、中秋節。\n五、農曆除夕。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"本條例參酌「紀念日及節日實施辦法」明定民俗節日及放假方式。"},{"bill":"202110097410000","text":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：定於清明日。\n(四)端午節：農曆五月五日。\n(五)中元節：農曆七月十五日。\n(六)中秋節：農曆八月十五日。\n(七)重陽節：農曆九月九日。\n(八)除夕：農曆十二月之末日。\n(九)原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗及徵詢各該原住民族部落意見後公告，並刊登政府公報。\n(十)其他民族及宗教歲時祭儀：\n由各民族及宗教群體自行擇定，報請各該主管機關公告之。\n二、消防節：一月十九日。\n三、農民節：定於立春日。\n四、婦女節：三月八日。\n五、植樹節：三月十二日。\n六、青年節：三月二十九日。\n七、國際醫師節：三月三十日。\n八、兒童節：四月四日。\n九、勞動節：五月一日。\n十、國際護理師節：五月十二日。\n十一、母親節：五月第二個星期日。\n十二、環境日：六月五日。\n十三、國家海洋日：六月八日。\n十四、警察節：六月十五日。\n十五、父親節：八月八日。\n十六、祖父母節：八月第四個星期日。\n十七、軍人節：九月三日。\n十八、教師節：九月二十八日。\n十九、臺灣光復節：十月二十五日。\n二十、中華文化復興節：十一月十二日。\n二十一、身心障礙者日：十二月三日。\n二十二、人權日：十二月十日。\n二十三、移民日：十二月十八日。\n二十四、全國客家日：由客家委員會訂定後公告，並刊登政府公報。","note":"一、明定節日之名稱及日期。\n二、春節、元宵、清明、端午、中元、中秋、重陽及除夕歷史悠久，承載重要民俗傳統與倫理價值，民間長期依習俗舉行相關活動。為配合民情，並參酌現行《紀念日及節日實施辦法》，特將其訂為民俗節日，以延續與傳承中華傳統文化。\n三、政府為發揚慎終追遠之美德，訂清明節為民族掃墓節，其日期依節氣而定，考量民間亦慣稱清明節，故還原節日名稱。另清明日之推算方式，由春分開始將地球公轉太陽的軌道上，每十五度定一個節氣，一周三百六十度共分為二十四節氣。採假設地球不動，太陽全年繞地球一周的方式，將春分時太陽所在位置的春分點定為太陽黃經度零度，當太陽運行到太陽黃經度十五度時，定為清明。近一百餘年（西元一九○○年至二○一○年），清明日曾出現在四月四、五、六日中之一日。\n四、原住民各族之歲時祭儀，在各部落中源遠流長，與原住民族之日常生活息息相關，內蘊深刻之部落倫理、宗教信仰及社會規範，為原住民族文化之核心，本於憲法增修條文肯定多元文化之精神，爰將原住民族之歲時祭儀明定為民俗節日。惟各部落舉辦歲時祭儀之時間不同，且同一部落舉辦之時間往往年年變更，難以定出具體時間，故其日期由原住民族委員會參酌各該原住民族習俗，並徵詢各該部落意見定之，以應實際需要。\n五、民族及宗教之歲時祭儀蘊含重大之文化、歷史意義，代表各群體最深刻的集體記憶。惟各民族、宗教之歲時祭儀繁多且時間不同，難以統一之具體時間規定，故由各民族及宗教團體自行擇定後報請各該主管機關公告，以應實際需要。\n六、婦女節、植樹節、青年節、兒童節、勞動節、軍人節、教師節、臺灣光復節及中華文化復興節均參照現行紀念日及節日實施辦法加以援用。\n七、立春係二十四節氣中之第一個節氣，指太陽到達黃經三百十五度時，約為公曆二月三日至五日之間，以示春天之始，為彰顯農為國本並敬重農民對國家之貢獻，爰將立春日定為農民節。\n八、一九九一年，美國國會將三月三十日定為醫生節，後為全球沿用。\n九、警察及消防人員係社會安定之中流砥柱，為彰顯警消人員之辛勞，參照警察法於四十二年六月十五日施行，爰以是日定為警察節；內政部警政署於六十二年一月三日核定六十二年一月十九日為「第一屆消防節」，爰援引該日定為消防節。\n十、南丁格爾被譽為近代護理創始人，致力推動世界各地護理工作與護士教育的發展，一九六三年國際護理師會決定以她的生日五月十二日為國際護士節。\n十一、為促使國民、事業及各級政府深植環境保護理念，共同關懷環境問題，環境基本法第四十條明定六月五日為環境日。\n十二、為促使政府及社會各界深植海洋意識，海洋基本法第十八條明定六月八日為國家海洋日。\n十三、為喚起國人重視祖孫世代互動及關懷祖父母，教育部依據家庭教育法中倫理教育之內涵，並訂每年八月第四個星期日為「祖父母節」，以倡導祖孫關係之重要性，並鼓勵祖孫互動，相互表達情感與感謝，進一步以教育搭起世代橋樑，落實不分年齡共享之融合社會願景。\n十四、為促進社會大眾共同參與並喚起對身心障礙者議題之重視，爰參考第四十七屆聯合國大會之決議，將十二月三日定為身心障礙者日。\n十五、鑑於聯合國大會於三十七年十二月十日通過「世界人權宣言」，以表彰人權之普世價值，我國當時亦參與其中，爰將十二月十日定為人權日。\n十六、為肯定多元文化並促進其發展，並感念移民及移工對我國社會之貢獻，爰參考聯合國之倡議，將十二月十八日定為移民日。\n十七、為促進各族群認識與共享客家文化價值，彰顯客家族群對臺灣多元文化之貢獻，客家基本法第二十條第一項授權行政機關訂定全國客家日。"},{"bill":"202110097740000","text":"下列民俗節日，除春節放假三日外，其餘均放假一日：\n一、春節。\n二、民族掃墓節。\n三、端午節。\n四、中秋節。\n五、農曆除夕。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"明定民俗節日及放假方式。"},{"bill":"202110097840000","text":"下列民俗節日，除另有規定外，其餘放假一日：\n一、春節：農曆除夕前一日至翌年一月三日，放假五日。\n二、清明節：定於清明日。\n三、端午節：農曆五月五日。\n四、中秋節：農曆八月十五日。\n五、原住民族歲時祭儀：各該原住民族放假三日，日期由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"明定民俗節日及放假方式。"},{"bill":"202110099380000","text":"下列民俗節日，除春節放假三日外，其餘均放假一日：\n一、農曆除夕。\n二、春節。\n三、民族掃墓節。\n四、端午節。\n五、中秋節。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"參酌「紀念日及節日實施辦法」明定民俗節日及放假方式。"},{"bill":"202110107560000","text":"下列民俗節日，除春節放假四日外，其餘均放假一日：\n一、春節：農曆一月一日至一月四日。\n二、清明節：定於清明日。\n三、端午節：農曆五月五日。\n四、中秋節：農曆八月十五日。\n五、農曆除夕：農曆十二月之末日。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"明定民俗節日及放假方式。"},{"bill":"202110102380000","text":"下列民俗節日，除春節放假三日外，其餘均放假一日：\n一、春節。\n二、民族掃墓節。\n三、端午節。\n四、中秋節。\n五、農曆除夕。\n六、原住民族歲時祭儀：各該原住民族放假日期，由行政院原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"我國民俗節日及放假方式。"},{"bill":"202110044280000","text":"為尊重原住民族歲時祭儀舉行之必要，由各原住民族部落自主擇定歲時祭儀節日三日為放假日，並報請主管機關公告之。","note":"一、兩人權公約施行法中《經濟社會文化權利國際公約》第十五條規定：「人人有權參與文化生活」，原住民族歲時祭儀係屬原住民族文化生活之重要體現。\n二、考量每個原住民族部落之傳統特色、祭典實施及不同公共事務決策模式，原住民族每年專屬專有之祭儀節日，由各原住民族部落自主擇定後報請主管機關公告之。"},{"bill":"202110043520000","text":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：四月五日或前後一日。\n(四)端午節：農曆五月五日。\n(五)中秋節：農曆八月十五日。\n(六)重陽敬老節：農曆九月九日。\n(七)除夕：農曆十二月之末日。\n(八)原住民族歲時祭儀：由各原住民族部落自行擇定，報請主管機關公告之。\n(九)其他民族及宗教歲時祭儀：由各民族及宗教群體自行擇定，報請各該主管機關公告之。\n二、消防節：一月十九日。\n三、農民節：農民曆之立春日。\n四、婦女節：三月八日。\n五、國際醫師節：三月三十日。\n六、兒童節：四月四日。\n七、世界地球日：四月二十二日。\n八、國際護理師節：五月十二日。\n九、母親節：五月第二個週日。\n十、國家海洋日：六月八日。\n十一、警察節：六月十五日。\n十二、礦工日：七月十日。\n十三、父親節：八月八日。\n十四、國際青年日：八月十二日。\n十五、祖父母節：八月第四個週日。\n十六、軍人節：九月三日。\n十七、教師節：九月二十八日。","note":"一、節日之名稱及日期。\n二、1973年1月3日，內政部警政署以（六二）警署消字第2007號令，核定1月19日為「第一屆消防節」，往後每一年皆會舉辦相關節日。\n三、立春，是二十四節氣中的第一個節氣，指太陽到達黃經315度時，為公曆每年2月3日至5日之間，表示春天的開始，於傳統農業社會具有重大意義。\n四、1991年，美國國會為紀念1842年3月30日美國麻醉科醫師Crawford Long成功實施了世界上的第一例乙醚全身麻醉，定為醫生節，後為全球沿用。\n五、1970年的4月22日，首屆「世界地球日」舉行，由美國威斯康辛州的參議員Gaylord Nelson和Denis Hayes發起。\n六、1963年，國際護士會決定以近代護理創始人Florence Nightingale的生日5月12日為國際護理師節。\n七、「海洋基本法」第18條「6月8日為國家海洋日」。\n八、「警察法」於1979年6月15日正式施行，時任警察署長長孔令晟特將「6月15日」為警察節。\n九、自西元2000年臺灣最後的煤礦場宣告停工後，煤礦產業走入歷史，留下來的礦工，或因已屆中高齡又無其他專長，或因長年的嚴苛工作環境導致身心狀況不佳，且罹患肺塵症如火山矽肺症（Pneumonoultramicroscopicsilicovolcanoco Niosis）等疾病之比例遠高於其他職業，形成多數礦工轉職不易、經濟狀況不佳、生活陷入困境。然臺灣煤礦產業及礦工，乃是工業發展年代的重要功臣，為臺灣的經濟基礎貢獻極大，政府卻未如對待農民、漁民般予以相關之福利津貼補助，顯有不平等對待之情形，為彰顯礦工之貢獻、促進其之職業光榮感，擬將1984年7月10日台北縣瑞芳鎮煤山煤礦發生之103人死亡，22人輕重傷，臺灣礦業史上最大的災變定為「礦工日」，以紀念之。\n十、聯合國在1999年通過了第54/120號決議，將每年的8月12日定為國際青年日。\n十一、2011年，由教育部發起，將每年8月的第4個星期日定為祖父母節。\n十二、1955年，國防部將9月3日定為軍人節。"}],"changed":true,"final":"節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：定於清明日。\n(四)端午節：農曆五月五日。\n(五)中元節：農曆七月十五日。\n(六)中秋節：農曆八月十五日。\n(七)重陽節：農曆九月九日。\n(八)除夕：農曆十二月之末日。\n(九)原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗及徵詢各該原住民族部落意見後公告，並刊登政府公報。\n二、道教節：農曆一月一日。\n三、消防節：一月十九日。\n四、農民節：定於立春日。\n五、婦女節：三月八日。\n六、植樹節：三月十二日。\n七、青年節：三月二十九日。\n八、國際醫師節：三月三十日。\n九、兒童節：四月四日。\n十、佛陀誕辰日：農曆四月八日。\n十一、勞動節：五月一日。\n十二、國際護理師節：五月十二日。\n十三、母親節：五月第二個星期日。\n十四、環境日：六月五日。\n十五、國家海洋日：六月八日。\n十六、警察節：六月十五日。\n十七、漁民節：七月一日。\n十八、父親節：八月八日。\n十九、祖父母節：八月第四個星期日。\n二十、軍人節：九月三日。\n二十一、國民體育日：九月九日。\n二十二、教師節：九月二十八日。\n二十三、海巡節：十一月八日。\n二十四、中華文化復興節：十一月十二日。\n二十五、身心障礙者日：十二月三日。\n二十六、人權日：十二月十日。\n二十七、移民日：十二月十八日。\n二十八、其他由中央目的事業主管機關核定之日。","finalWhy":"照國民黨黨團、台灣民眾黨黨團再修正動議條文通過。","review":{"note":"照委員牛煦庭等22人提案、民眾黨黨團提案、委員高金素梅等29人提案、委員牛煦庭等50人所提修正動議及委員會初步審查修正條文併案保留協商","text":"委員會初步審查修正條文：\n第五條　節日之名稱及日期如下：\n一、民俗節日：\n(一)春節：農曆一月一日。\n(二)元宵節：農曆一月十五日。\n(三)清明節：定於清明日。\n(四)端午節：農曆五月五日。\n(五)中元節：農曆七月十五日。\n(六)中秋節：農曆八月十五日。\n(七)重陽節：農曆九月九日。\n(八)除夕：農曆十二月之末日。\n(九)原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗及徵詢各該原住民族部落意見後公告，並刊登政府公報。\n二、道教節：農曆一月一日。\n三、消防節：一月十九日。\n四、農民節：定於立春日。\n五、世界母語日：二月二十一日。\n六、婦女節：三月八日。\n七、植樹節：三月十二日。\n八、青年節：三月二十九日。\n九、國際醫師節：三月三十日。\n十、兒童節：四月四日。\n十一、勞動節：五月一日。\n十二、佛陀誕辰日：農曆四月八日。\n十三、國際護理師節：五月十二日。\n十四、母親節：五月第二個星期日。\n十五、環境日：六月五日。\n十六、國家海洋日：六月八日。\n十七、警察節：六月十五日。\n十八、漁民節：七月一日。\n十九：父親節：八月八日。\n二十：祖父母節：八月第四個星期日。\n二十一、軍人節：九月三日。\n二十二、國民體育日：九月九日。\n二十三、教師節：九月二十八日。\n二十四、海巡節：十一月八日。\n二十五、中華文化復興節：十一月十二日。\n二十六、身心障礙者日：十二月三日。\n二十七、人權日：十二月十日。\n二十八、移民日：十二月十八日。\n二十九、其他由中央目的事業主管機關核定之日。"}},{"no":"第六條","current":null,"versions":[{"bill":"202110030420000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。\n十、耶誕節：十二月二十五日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：勞工放假。\n三、軍人節：依國防部規定放假。","note":"紀念日、節日之紀念與慶祝或放假方式"},{"bill":"202110036170000","text":"前條所列節日，放假依下列規定辦理：\n一、春節：自農曆一月一日至一月三日，放假三日。\n二、兒童節：放假一日。\n三、清明節：放假一日。\n四、端午節：放假一日。\n五、中秋節：放假一日。\n六、除夕：放假一日。\n七、原住民族歲時祭儀、其他民族及宗教歲時祭儀：凡具中華民國國籍或居留資格者，每年得依按前條第一項第八款、第九款公告之原住民族歲時祭儀、其他民族及宗教歲時祭儀，擇定三日放假之。\n八、勞動節：適用勞動基準法之勞工放假一日。\n九、消防節：依主管機關規定。\n十、警察節：依主管機關規定。\n十一、軍人節：依主管機關規定。\n前項兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n本條第一項以外之節日，均不放假。","note":"一、明定節日放假規定。\n二、明定春節、兒童節、清明節、端午節、中秋節、除夕、其他民族及宗教歲時祭儀等七個節日之放假日數。\n三、春節、清明節、端午節、中秋節、除夕、其他民族及宗教歲時祭儀，蘊藏重要民俗傳統及倫理道德，民間習於配合慣俗舉行相關活動，爰配合民情定為民俗節日，並明定放假日數。\n四、西元1925年8月，各國代表齊聚瑞士日內瓦舉行兒童幸福促進大會，並通過「保障兒童宣言」。此後各國政府先後訂定「兒童節」，我國亦規定4月4日為兒童節，以提醒各界重視並落實兒童教育、人權及福祉。同時，為利於親子互動，爰明定兒童節放假一日。\n五、民族及宗教之歲時祭儀蘊含重大之文化、歷史意義，代表各群體最深刻的集體記憶。惟各民族、宗教之歲時祭儀繁多且時間不同，難以統一之具體時間規定。為保障少數群體、協助文化傳承，且避免按現行「紀念日及節日實施辦法」，僅具原住民族身份者得施放「祭典假」，反而造成原住民族於就業市場「劣勢」；故特以「文化學習假」及「多元文化日」概念，規定凡具中華民國國籍或居留資格者，每年均得依各民族及宗教群體報請主管機關公告之「各民族及宗教歲時祭儀」，擇定三日休假之。\n六、有鑑於我國軍警消人力嚴重不足，已有嚴重過勞現象。現行法規，軍人節得依國防部規定放假，按照比例原則，警察與消防人員也應於警察節、消防節放假。"},{"bill":"202110046340000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：勞工放假一日。\n三、軍人節：依國防部規定放假。","note":"明定紀念日、節日之紀念與慶祝方式。"},{"bill":"202110047800000","text":"前條所列節日之放假依下列規定辦理：\n一、除夕及春節：自農曆十二月末日之前一日至翌年一月三日，放假五日。\n二、兒童節、清明節、端午節、中秋節、重陽節：均放假一日。\n三、原住民族歲時祭儀：由原住民依其族別歲時祭儀擇定三日放假。\n四、勞動節：適用勞動基準法之勞工放假一日。\n五、消防節及警察節：依主管機關規定放假。\n六、軍人節：依國防部規定放假。\n兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n第一項以外之節日，均不放假。","note":"一、鑑於春節、清明節、端午節、中秋節、重陽節及除夕蘊藏重要民俗傳統及倫理道德，民間習於配合慣俗舉行相關活動，爰配合民情定為民俗節日，並明定放假日數。另為分散春節輸運人潮，使大眾提早返鄉準備，爰規定除夕前一日並同放假。\n二、兒童節之訂定，乃為提醒各界重視與落實兒童之教育、人權與福祉。西元一九二五年八月，來自五十四個國家關心兒童福祉之代表，聚集瑞士日內瓦舉行兒童幸福促進大會，通過「保障兒童宣言」。此後各國政府都先後訂定「兒童節」，我國紀念日及節日實施辦法亦規定四月四日為兒童節。為凸顯對兒童主體之重視，並利親子互動，爰明定兒童節放假一日。\n三、鑑於原住民族歲時祭儀常長達數日，為使原住民充分參與及考量交通往返時間，爰規定由原住民依其族別歲時祭儀擇定三日放假。"},{"bill":"202110068720000","text":"下列節日，相關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。\n二、勞動節：放假一日。\n三、軍人節：依國防部規定放假。\n四、教師節：放假一日。","note":"明定紀念日、節日之紀念與慶祝方式。"},{"bill":"202110073030000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、植樹節：三月十二日。\n四、青年節：三月二十九日。\n五、兒童節：四月四日。\n六、勞動節：五月一日。\n七、軍人節：九月三日。\n八、教師節：九月二十八日。\n九、臺灣光復節：十月二十五日。\n十、聖誕節：十二月二十五日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：勞工放假。\n三、軍人節：依國防部規定放假。","note":"明定需舉行慶祝活動之節日。"},{"bill":"202110072050000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：放假一日。\n三、軍人節：依國防部規定放假。\n四、教師節：放假一日。","note":"我國紀念日、節日之紀念予慶祝方式。"},{"bill":"202110074310000","text":"下列節日，相關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。\n二、勞動節：放假一日。\n三、軍人節：依國防部規定放假。\n四、教師節：放假一日。","note":"明定紀念日、節日之紀念與慶祝方式。"},{"bill":"202110074620000","text":"節日之放假，依下列規定辦理：\n一、春節：自農曆一月一日至一月三日，放假三日。\n二、兒童節、清明節、端午節、中秋節、除夕：均放假一日。\n三、原住民族歲時祭儀：各該原住民族放假一日。\n四、勞動節：放假一日。\n五、軍人節：依國防部規定放假。\n前項以外之節日，均不放假。\n兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。","note":"一、參酌現行紀念日及節日實施辦法，規定節日放假事宜。\n二、春節、清明節、端午節、中秋節及除夕等五個節日，在民間由來已久，蘊藏重要民俗傳統及倫理道德，民間習於配合慣俗舉行相關活動，爰配合民情定為民俗節日，並明定放假日數。\n三、兒童節之訂定，乃為提醒各界重視與落實兒童之教育、人權與福祉。西元一九二五年八月，來自五十四個國家關心兒童福祉之代表，聚集瑞士日內瓦舉行兒童幸福促進大會，通過「保障兒童宣言」。此後各國政府都先後訂定「兒童節」，我國現行「紀念日及節日實施辦法」亦規定四月四日為兒童節。為彰顯對兒童主體之重視，並利親子互動，爰明定兒童節放假一日。\n四、原住民極為重視其歲時祭儀，如未參與，往往遭到所屬部落之責難，故過去常有原住民為參加部落祭典而曠職，銓敘部八十三年四月十六日以（八三）臺華法一字第０九八０六五０號函同意原住民公務員得以公假方式返回部落參加豐年祭，有鑑於此，原住民於其所屬部落舉辦歲時祭儀，賦予各該原住民族放假一日之權利。\n五、勞動節是勞工年度的重大節日，為表達慶祝勞動者對社會和經濟的所作貢獻，爰明定全國放假一日。"},{"bill":"202110076000000","text":"下列節日，相關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。\n二、勞動節：適用勞動基準法之勞工放假一日。\n三、軍人節：依國防部規定放假。","note":"明定紀念日、節日之紀念慶祝及放假方式。"},{"bill":"202110075240000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、母親節：五月第二個週日。\n七、父親節：八月八日。\n八、祖父母節：八月第四個週日。\n九、軍人節：九月三日。\n十、教師節：九月二十八日。\n十一、中華文化復興節：十一月十二日。\n前項兒童節、勞動節、教師節及軍人節，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：勞工放假一日。\n三、教師節：放假一日，依教育部規定辦理。\n四、軍人節：放假一日，依國防部規定辦理。","note":"一、本條例參酌「紀念日及節日實施辦法」明定紀念日、節日之紀念與慶祝方式。\n二、母親節與父親節讓人們可以公開表達對父母的感謝，讓父母的愛和關懷得到應有的重視。此感恩文化有助於養成尊重長輩和感恩的社會氛圍，而有舉行慶祝活動之必要。\n三、由教育部發起祖父母節，訂在每年八月的第四個星期日，可以趁學童在開始學期前，與祖父母相處增進親情。"},{"bill":"202110077660000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節。\n二、婦女節。\n三、青年節。\n四、兒童節。\n五、勞動節。\n六、軍人節。\n七、教師節。\n八、臺灣光復節。\n九、中華文化復興節。\n前條節日，按下列規定放假：\n一、春節：放假三日。\n二、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n三、民族掃墓節。\n四、端午節：放假一日。\n五、勞動節：放假一日。\n六、軍人節：依國防部規定放假。\n七、中秋節：放假一日。\n八、臺灣光復節：放假一日。\n九、農曆除夕：放假一日。\n十、原住民族歲時祭儀：各該原住民族放假日期，由原住民族委員會參酌各該原住民族習俗公告，並刊登政府公報。","note":"一、明定各節日之紀念或慶祝方式及放假規定。\n二、現行勞動節放假辦法造成民眾諸多不便，、將勞動節定為全國性的國定假日為目前世界趨勢、勞動價值不應為職業而分化，所有勞動者皆應受到尊重與感謝，爰明定勞動節放假一日。\n三、臺灣光復節國家歷史中重要之紀念日，具有深遠意義，為凝聚全民國家意識，爰明定臺灣光復節放假一日。\n四、其餘節日參照現行紀念日及節日實施辦法加以援用。"},{"bill":"202110080400000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、植樹節：三月十二日。\n四、青年節：三月二十九日。\n五、兒童節：四月四日。\n六、勞動節：五月一日。\n七、軍人節：九月三日。\n八、教師節：九月二十八日。\n九、臺灣光復節：十月二十五日。\n十、聖誕節：十二月二十五日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：勞工放假。\n三、軍人節：依國防部規定放假。","note":"明定需舉行慶祝活動之節日。"},{"bill":"202110082810000","text":"前條所列節日之放假依下列規定辦理：\n一、除夕及春節：自農曆十二月末日之前一日至翌年一月三日，放假五日。\n二、兒童節、清明節、端午節、中秋節、重陽節：均放假一日。\n三、原住民族歲時祭儀：由原住民依其族別歲時祭儀擇定三日放假。\n四、勞動節：適用勞動基準法之勞工放假一日。\n五、消防節及警察節：依主管機關規定放假。\n六、軍人節：依國防部規定放假。\n兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。","note":"明定節日放假方式。"},{"bill":"202110087510000","text":"前條所列節日之放假依下列規定辦理：\n一、除夕及春節：自農曆十二月末日之前一日至翌年一月三日，放假五日。\n二、兒童節、清明節、端午節、中秋節、重陽節：均放假一日。\n三、原住民族歲時祭儀：由原住民依其族別歲時祭儀擇定三日放假。\n四、勞動節：適用勞動基準法之勞工放假一日。\n五、消防節及警察節：依主管機關規定放假。\n六、軍人節：依國防部規定放假。\n兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n第一項以外之節日，均不放假。","note":"一、鑑於春節、清明節、端午節、中秋節、重陽節及除夕蘊藏重要民俗傳統及倫理道德，民間習於配合慣俗舉行相關活動，爰配合民情定為民俗節日，並明定放假日數。另為分散春節輸運人潮，使大眾提早返鄉準備，爰規定除夕前一日並同放假。\n二、兒童節之訂定，乃為提醒各界重視與落實兒童之教育、人權與福祉。西元一九二五年八月，來自五十四個國家關心兒童福祉之代表，聚集瑞士日內瓦舉行兒童幸福促進大會，通過「保障兒童宣言」。此後各國政府都先後訂定「兒童節」，我國紀念日及節日實施辦法亦規定四月四日為兒童節。為凸顯對兒童主體之重視，並利親子互動，爰明定兒童節放假一日。\n三、鑑於原住民族歲時祭儀常長達數日，為使原住民充分參與及考量交通往返時間，爰規定由原住民依其族別歲時祭儀擇定三日放假。"},{"bill":"202110087570000","text":"駐外使領館、代表處、辦事處、外交部授權機構及其他政府機關駐外機構紀念日及節日之放假，依外交部或大陸委員會之規定辦理。","note":"一、明定駐外單位機構紀念日及節日放假規定。\n二、目前各機關配屬駐外使領館、代表處、辦事處等駐外機構之單位或人員，除承其原派機關之命辦理業務外，並受各該駐外館處首長之指揮監督，其紀念日及節日之放假，目前係依外交部規定辦理，主要係配合駐在國之國定假日放假，依我國紀念日及節日放假者，僅限元旦、春節及國慶日，倘該三假日適逢當地例假日，不另予補假。另政府於香港、澳門地區設立之交流機構，其放假情形亦有別於國內，為免產生法規適用爭議，爰對政府機關派駐境外，執行國家涉外事務之機構，明定其紀念日及節日之放假，依外交部或大陸委員會規定辦理。"},{"bill":"202110086500000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、消防節：一月十九日。\n三、婦女節：三月八日。\n四、青年節：三月二十九日。\n五、兒童節：四月四日。\n六、勞動節：五月一日。\n七、警察節：六月十五日。\n八、軍人節：九月三日。\n九、教師節：九月二十八日。\n十、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：勞工放假。\n三、軍人節：依國防部規定放假。\n四、消防節：依主管機關規定放假。\n五、警察節：依主管機關規定放假。","note":"明定紀念日、節日之紀念慶祝及放假方式。"},{"bill":"202110093980000","text":"前條所列節日之放假，依下列規定辦理：\n一、除夕及春節：自農曆十二月之末日及一月一日至一月三日，放假四日。\n二、兒童節。\n三、清明節。\n四、勞動節。\n五、端午節。\n六、軍人節。\n七、中秋節。\n八、原住民族歲時祭儀、其他民族及宗教歲時祭儀。","note":"明定本條例節日放假規定。"},{"bill":"202110093510000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。","note":"於本條明定我國節日。"},{"bill":"202110096450000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、母親節：五月第二個週日。\n七、父親節：八月八日。\n八、祖父母節：八月第四個週日。\n九、軍人節：九月三日。\n十、教師節：九月二十八日。\n十一、臺灣光復節：十月二十五日。\n十二、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：放假一日。\n三、軍人節：依國防部規定放假。\n四、教師節：於孔子誕辰紀念日放假一日。","note":"一、明定紀念日、節日之紀念與慶祝方式。\n二、母親節與父親節為感念父母對子女的愛與關懷，鼓勵子女勇於表達對父母恩的感謝。有助於弘揚孝敬父母的價值觀，而有舉行慶祝活動之必要。\n三、由教育部發起祖父母節，訂在每年八月的第四個星期日。該日與開學日接近，係透過祖父母與子女、孫子女團聚，分享暑期生活點滴，及指導孫子女做人處事道理，並鼓勵讓祖父母、父母陪伴孫子女上下學，也讓祖父母與家人更親密。"},{"bill":"202110097410000","text":"前條所列節日，放假依下列規定辦理：\n一、除夕及春節：自農曆十二月末日之前一日至翌年一月三日，放假五日。\n二、兒童節：放假一日。\n三、清明節：放假一日。\n四、端午節：放假一日。\n五、中秋節：放假一日。\n六、重陽節：放假一日。\n七、原住民族歲時祭儀、其他民族及宗教歲時祭儀：凡具中華民國國籍或居留資格者，每年得依按前條第一項第九款、第十款公告之原住民族歲時祭儀、其他民族及宗教歲時祭儀，擇定三日放假之。\n八、勞動節：適用勞動基準法之勞工放假一日。\n九、消防節：依主管機關規定。\n十、國際護理師節：依主管機關規定。\n十一、警察節：依主管機關規定。\n十二、軍人節：依主管機關規定。\n前項兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n本條第一項以外之節日，均不放假。","note":"一、明定節日放假規定。\n二、鑑於春節、清明、端午、中秋、重陽及除夕承載重要民俗與倫理價值，民間依習俗舉行活動，故依民情訂為民俗節日並規定假期。另為分散春節返鄉人潮，除夕前一日亦放假。\n三、西元一九二五年八月，各國代表齊聚瑞士日內瓦舉行兒童幸福促進大會，並通過「保障兒童宣言」。此後各國政府先後訂定「兒童節」，我國亦規定四月四日為兒童節，以提醒各界重視並落實兒童教育、人權及福祉。同時，為利於親子互動，爰明定兒童節放假一日。\n四、民族及宗教之歲時祭儀蘊含重大之文化、歷史意義，代表各群體最深刻的集體記憶。惟各民族、宗教之歲時祭儀繁多且時間不同，難以統一之具體時間規定。為保障少數群體、協助文化傳承，且避免按現行「紀念日及節日實施辦法」，僅具原住民族身份者得施放「祭典假」，反而造成原住民族於就業市場「劣勢」；故特以「文化學習假」及「多元文化日」概念，規定凡具中華民國國籍或居留資格者，每年均得依各民族及宗教群體報請主管機關公告之「各民族及宗教歲時祭儀」，擇定三日休假之。\n五、有鑑於我國軍警消以及醫護人力嚴重不足，已有嚴重過勞現象。現行法規，軍人節得依國防部規定放假，按照比例原則，警察、消防以及醫護人員也應於國際護理師節、警察節、消防節放假。"},{"bill":"202110097740000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、消防節：一月十九日。\n三、婦女節：三月八日。\n四、青年節：三月二十九日。\n五、兒童節：四月四日。\n六、勞動節：五月一日。\n七、警察節：六月十五日。\n八、軍人節：九月三日。\n九、教師節：九月二十八日。\n十、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：勞工放假。\n三、軍人節：依國防部規定放假。\n四、消防節：依主管機關規定放假。\n五、警察節：依主管機關規定放假。","note":"明定紀念日、節日之紀念慶祝及放假方式。"},{"bill":"202110097840000","text":"下列節日，由有關機關、團體及學校舉行慶祝活動：\n一、消防節：一月十九日。\n二、農民節：立春日。\n三、婦女節：三月八日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、母親節：五月第二個週日。\n七、警察節：六月十五日。\n八、父親節：八月八日。\n九、軍人節：九月三日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。\n二、勞動節：放假一日。\n三、警察節及消防節依主管機關規定放假。\n四、軍人節依國防部規定放假。","note":"明定節日之紀念慶祝及放假方式。"},{"bill":"202110099380000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、婦女節：放假一日。\n二、青年節：放假一日。\n三、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n四、勞動節：放假一日。\n五、軍人節：依國防部規定放假。\n六、教師節：放假一日。","note":"一、參酌「紀念日及節日實施辦法」明定民俗節日及放假方式。\n二、婦女節：1910年17國支持正式將三月八日設為「國際婦女節」，我國過去曾將此日設為國定假日，但卻在1991年取消當日放假，並且合併兒童節之假日，實為對女性權益關注之倒退，擬研議恢復婦女節之定位並放假一日。\n三、青年節：同第三、四條之「革命先烈紀念日」，放假一日。\n四、勞動節：為表彰全國勞工對經濟、社會之貢獻，放假一日。\n五、教師節：同第三、四條之「孔子誕辰紀念日」，放假一日。"},{"bill":"202110107560000","text":"下列節日，相關機關、團體、學校舉行慶祝活動：\n一、道教節：農曆一月一日。\n二、婦女節：三月八日。\n三、青年節：三月二十九日。\n四、兒童節：四月四日。\n五、勞動節：五月一日。\n六、軍人節：九月三日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。\n二、勞動節：放假一日。\n三、軍人節：依國防部規定放假。\n四、教師節：放假一日。","note":"明定紀念日、節日之紀念與慶祝方式。"},{"bill":"202110102380000","text":"下列節日，由有關機關、團體、學校舉行慶祝活動：\n一、婦女節：三月八日。\n二、青年節：三月二十九日。\n三、兒童節：四月四日。\n四、勞動節：五月一日。\n五、軍人節：九月三日。\n六、國民體育日：九月九日。\n七、教師節：九月二十八日。\n八、臺灣光復節：十月二十五日。\n九、中華文化復興節：十一月十二日。\n十、全國客家日：農曆一月二十日。\n前項節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：放假一日。\n三、軍人節：依國防部規定放假。\n四、教師節：放假一日。","note":"我國紀念日、節日之紀念與慶祝方式。"},{"bill":"202110044280000","text":"國假暨文化節日逢週休二日者，應予補假。\n補假之實施日期及其他應遵循事項之辦法，由主管機關定之。","note":"一、明定國假暨文化節日逢週休二日應予補假。\n二、授權主管機關擬定國假暨文化節日之補假方式。"},{"bill":"202110043520000","text":"前條所列節日，放假依下列規定辦理：\n一、春節：自農曆一月一日起放假三日。\n二、兒童節：放假一日。\n三、清明節：放假一日。\n四、端午節：放假一日。\n五、中秋節：放假一日。\n六、除夕：放假一日。\n七、原住民族歲時祭儀、其他民族及宗教歲時祭儀：凡具中華民國國籍或居留資格者，每年得依按前條第一項第八款、第九款公告之原住民族歲時祭儀、其他民族及宗教歲時祭儀，擇定三日放假之。\n八、消防節：依主管機關規定。\n九、軍人節：依主管機關規定。\n前項兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。","note":"節日放假規定。"}],"changed":true,"final":"前條所列節日之放假依下列規定辦理：\n一、除夕及春節：自農曆十二月末日之前一日至翌年一月三日，放假五日。\n二、兒童節、清明節、勞動節、端午節、教師節及中秋節：均放假一日。\n三、原住民族歲時祭儀：由原住民依其族別歲時祭儀擇
