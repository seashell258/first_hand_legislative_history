定三日放假。\n四、消防節及警察節：依主管機關規定放假。\n五、軍人節：依國防部規定放假。\n六、海巡節：依海洋委員會規定放假。\n兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n第一項以外之節日，均不放假。","finalWhy":"照國民黨黨團、台灣民眾黨黨團再修正動議條文通過。","review":{"note":"照委員牛煦庭等22人提案、民眾黨黨團提案、委員高金素梅等29人提案、委員牛煦庭等50人所提修正動議、委員麥玉珍等5人所提修正動議及委員會初步審查修正條文併案保留協商","text":"委員會初步審查修正條文：\n第六條　前條所列節日之放假依下列規定辦理：\n一、除夕及春節：自農曆十二月末日之前一日至翌年一月三日，放假五日。\n二、兒童節、清明節、勞動節、端午節、教師節、中秋節：均放假一日。\n三、原住民族歲時祭儀：由原住民依其族別歲時祭儀擇定三日放假。\n四、消防節及警察節：依主管機關規定放假。\n五、軍人節：依國防部規定放假。\n六、海巡節：依海洋委員會規定放假。\n兒童節與清明節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n第一項以外之節日，均不放假。"}},{"no":"第七條","current":null,"versions":[{"bill":"202110030420000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"法定放假日、農曆除夕及春節放假日逢例假日時之放假方式及補假方式。"},{"bill":"202110036170000","text":"紀念日及節日之放假，逢例假日應補為連假。\n上班日為星期一或星期五，其後一日或前一日逢星期二或星期四之除夕及春節連假、清明節、端午節、中秋節之放假，調整該上班日為放假日。\n前項上班日調整為放假日，依下列規定補行上班：\n一、除夕及春節連假：不需補行上班。\n二、清明節、端午節、中秋節：\n(一)逢星期二者：於節日當週之星期六補行上班。\n(二)逢星期四者：於節日前一週之星期六補行上班。但清明節於節日後一週之星期六補行上班。\n前項調整放假及補行上班日期，由主管機關於前一年六月底前調移並公告之。","note":"一、第一項明定紀念日及節日逢週六、週日，一律補為連假。\n二、現行「政府行政機關紀念日及民俗節日假期調整原則」規定，民俗節日適逢星期二或星期四者，其前、後上班日均予調整放假；紀念日則視實際需要調整放假。為利與國際接軌及對外貿易，應儘量避免調整放假，惟考量民俗節日連續假期對於維繫民俗傳統，提供家族團聚機會，增進旅遊觀光，疏解交通運輸，具有重要意義及正面功能，爰參酌上開假期調整原則並酌作修正，於第二項明定民俗節日調整放假原則。"},{"bill":"202110046340000","text":"紀念日及節日之放假日適逢星期六、星期日，應予工作日補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。\n農曆除夕及春節放假日得由主管機關會同行政院人事行政總處彈性調整，並至遲於三個月前公告之。","note":"明定依本法所定之放假日，若遇到星期六或星期日時之補假方式，以及農曆除夕及春節彈性放假之調整規定。"},{"bill":"202110047800000","text":"紀念日，中央及地方政府應懸掛國旗，並依下列規定辦理：\n一、中華民國開國紀念日、孔子誕辰紀念日及國慶日舉行紀念活動。\n二、革命先烈紀念日舉行春祭國殤。\n三、其他紀念日得依其性質舉行紀念活動。\n各機關、團體及學校得依紀念日及節日之性質，舉行紀念、慶祝或民俗等相關活動。","note":"一、參酌現行紀念日及節日實施辦法，明定紀念日、節日之紀念及慶祝方式。\n二、為彰顯紀念日之特殊意義，展現舉國慶祝或紀念之景象，規定紀念日舉行紀念活動並懸掛國旗。\n三、現行國旗下半旗實施辦法第三條規定，各級政府機關（構）、公立學校和平紀念日當日下半旗一日。有關和平紀念日懸掛國旗，並應依上開規定辦理。"},{"bill":"202110068720000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110073030000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110072050000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。\n因應連續假期所為之上班日調整，以國家紀念日之假期不補行上班；民俗節日、節日之假期，均於前一個星期六補行上班。","note":"依本法所定之放假日，若遇到星期六或星期日時之補假方式，以及農曆除夕及春節彈性放假之調整規定；國家紀念日、民俗節日、節日之上班日調整補行上班規定。"},{"bill":"202110074310000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110074620000","text":"紀念日，中央及地方政府應懸掛國旗，並依下列規定辦理：\n一、中華民國開國紀念日、孔子誕辰紀念日及國慶日舉行紀念活動。\n二、革命先烈紀念日舉行春祭國殤。\n三、其他紀念日得依其性質舉行紀念活動。\n各機關、團體及學校得依紀念日及節日之性質，舉行紀念、慶祝或民俗等相關活動。","note":"一、參酌現行紀念日及節日實施辦法，明定紀念日、節日之紀念及慶祝方式。\n二、為彰顯紀念日之特殊意義，展現舉國慶祝或紀念之景象，規定紀念日舉行紀念活動並懸掛國旗。\n三、現行國旗下半旗實施辦法第三條規定，各級政府機關（構）、公立學校和平紀念日當日下半旗一日。有關和平紀念日懸掛國旗，並應依上開規定辦理。"},{"bill":"202110076000000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110075240000","text":"紀念日及節日之放假日逢例假日、休息日應予補假。主管機關得調整假日前一日或後一日之工作日為放假日，並另補行上班。\n農曆除夕前一日為上班日者，調整該上班日為放假日。因應春節連續假期所為之上班日調整，除特殊情形者外，以提前於前一週之星期六補行上班為原則。\n前二項調整放假與補行上班日，由主管機關於六個月前公告之。","note":"一、本條例參酌「紀念日及節日實施辦法」明定本條例之放假日適逢例假日、休息日之放假方式。並授權主管得調整該假日前或後一工作日之放假方式，以為連續假期。\n二、本條例參酌「政府機關調整上班日期處理要點」，故於第二項明定農曆除夕前一日為放假日，透過「補班挪移」方式，使春節連假得予連續且彈性。\n三、本條例第三項明定：主管機關會同行政院人事行政總處彈性調整，並至遲於六個月前公告之。"},{"bill":"202110077660000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"紀念日及節日之補假、調整放假及補行上班原則。"},{"bill":"202110080400000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110082810000","text":"紀念日，中央及地方政府應懸掛國旗，並依下列規定辦理：\n一、中華民國開國紀念日、孔子誕辰紀念日及國慶日舉行紀念活動。\n二、革命先烈紀念日舉行春祭國殤。\n三、其他紀念日得依其性質舉行紀念活動。\n各機關、團體及學校得依紀念日及節日之性質，舉行紀念、慶祝或民俗等相關活動。","note":"明定紀念日、節日之紀念及慶祝方式。"},{"bill":"202110087510000","text":"紀念日，中央及地方政府應懸掛國旗，並依下列規定辦理：\n一、中華民國開國紀念日、孔子誕辰紀念日及國慶日舉行紀念活動。\n二、革命先烈紀念日舉行春祭國殤。\n三、其他紀念日得依其性質舉行紀念活動。\n各機關、團體及學校得依紀念日及節日之性質，舉行紀念、慶祝或民俗等相關活動。","note":"一、參酌現行紀念日及節日實施辦法，明定紀念日、節日之紀念及慶祝方式。\n二、為彰顯紀念日之特殊意義，展現舉國慶祝或紀念之景象，規定紀念日舉行紀念活動並懸掛國旗。\n三、現行國旗下半旗實施辦法第三條規定，各級政府機關（構）、公立學校和平紀念日當日下半旗一日。有關和平紀念日懸掛國旗，並應依上開規定辦理。"},{"bill":"202110087570000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110086500000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110093980000","text":"紀念日，中央及地方政府應懸掛國旗，並依下列規定辦理：\n一、中華民國開國紀念日、國慶日、孔子誕辰紀念日及中華民國國旗日舉行紀念活動。\n二、革命先烈紀念日舉行春祭國殤。\n三、其他紀念日得依其性質舉行紀念活動。\n各機關、團體及學校得依紀念日及節日之性質，舉行紀念、慶祝或民俗等相關活動。","note":"明定本條例紀念日之紀念及慶祝方式。"},{"bill":"202110093510000","text":"前條節日，按下列規定放假：\n一、兒童節：放假一日。兒童節與民族掃墓節同一日時，於前一日放假。但逢星期四時，於後一日放假。\n二、勞動節：放假一日。\n三、軍人節：依國防部規定放假。\n四、教師節：放假一日。","note":"於本條明定我國節日慶祝及放假方式。"},{"bill":"202110096450000","text":"紀念日，中央及地方政府應懸掛國旗，並依下列規定辦理：\n一、中華民國開國紀念日、國慶日：中央及地方政府分別舉行紀念活動，各機關、團體、學校亦得分別舉行紀念活動。\n二、和平紀念日：由有關機關、團體舉行紀念活動。\n三、國父逝世紀念日為植樹節植樹紀念。\n四、革命先烈紀念日舉行春祭國殤。\n五、佛陀誕辰紀念日：由有關機關、團體舉行紀念活動。\n六、其他紀念日亦得依其性質由中央及地方政府、有關機關、學校、團體舉行紀念、慶祝或民俗等相關活動。","note":"一、參酌現行紀念日及節日實施辦法，明定紀念日、節日之紀念及慶祝方式。\n二、為彰顯紀念日之特殊意義，展現舉國慶祝或紀念之景象，規定紀念日舉行紀念活動並懸掛國旗。\n三、現行國旗下半旗實施辦法第三條規定，各級政府機關（構）、公立學校和平紀念日當日下半旗一日。有關和平紀念日懸掛國旗，並應依上開規定辦理。"},{"bill":"202110097410000","text":"紀念日，中央及地方政府應懸掛國旗，並依下列規定辦理：\n一、中華民國開國紀念日、孔子誕辰紀念日及國慶日舉行紀念活動。\n二、革命先烈紀念日舉行春祭國殤。\n三、其他紀念日得依其性質舉行紀念活動。\n各機關、團體及學校得依紀念日及節日之性質，舉行紀念、慶祝或民俗等相關活動。","note":"一、參酌現行紀念日及節日實施辦法，明定紀念日、節日之紀念及慶祝方式。\n二、為彰顯紀念日之特殊意義，展現舉國慶祝紀念之景象，規定紀念日舉行紀念活動並懸掛國旗。\n三、現行國旗下半旗實施辦法第三條規定，各級政府機關（構）、公立學校和平紀念日當日下半旗一日。有關和平紀念日懸掛國旗，並應依上開規定辦理。"},{"bill":"202110097740000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110097840000","text":"放假日逢例假日應予補假。例假日為星期六者，於前一上班日補假；為星期日者於次一上班日補假；春節放假日逢例假日者，於次上班日補假。","note":"明定放假日、春節逢例假日時補假之規定。"},{"bill":"202110099380000","text":"紀念日及節日之放假日適逢星期六、星期日，應予工作日補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。\n農曆除夕及春節放假日得由主管機關會同行政院人事行政總處彈性調整，並至遲於三個月前公告之。","note":"一、明定本法之放假日若遇到星期六或星期日時之放假方式。\n二、為使國人重視之春節民俗節日假期能連續，故於第二項明定得由主管機關會同行政院人事行政總處彈性調整，並提前公告之。"},{"bill":"202110107560000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110102380000","text":"紀念日及節日之放假日逢例假日應予補假，不需補班。","note":"依本法所定之放假日，若遇到星期六或星期日時之補假方式。"},{"bill":"202110044280000","text":"凡落實原住民族歲時祭儀假之公民營事業單位，應申領獎勵補貼。","note":"原住民族歲時祭儀假係為法律規定，作為尊重與傳承原住民族之多元文化價值，應屬無疑。惟考量公營事業、民間企業之運作及經營，凡同意於上述單位服務原住民於該年度內履行完成原住民族歲時祭儀假，應享有獎勵補貼。"},{"bill":"202110043520000","text":"國家紀念日及節日之放假，逢例假日應補為連假。\n上班日為星期一或星期五，其後一日或前一日逢星期二或星期四之除夕及春節連假、清明節、端午節、中秋節之放假，調整該上班日為放假日。\n前項上班日調整為放假日，依下列規定補行上班：\n一、除夕及春節連假：不需補行上班。\n二、清明節、端午節、中秋節：\n(一)逢星期二者：於節日當週之星期六補行上班。\n(二)逢星期四者：於節日前一週之星期六補行上班。但清明節於節日後一週之星期六補行上班。\n前項調整放假及補行上班日期，由主管機關於前一年六月底前調移並公告之。","note":"一、第一項明訂紀念日及節日逢週六、週日，一律補為連假。\n二、現行「政府行政機關紀念日及民俗節日假期調整原則」規定，民俗節日適逢星期二或星期四者，其前、後上班日均予調整放假；紀念日則視實際需要調整放假。為利與國際接軌及對外貿易，應儘量避免調整放假，惟考量民俗節日連續假期對於維繫民俗傳統，提供家族團聚機會，增進旅遊觀光，疏解交通運輸，具有重要意義及正面功能，爰參酌上開假期調整原則並酌作修正，於第二項明定民俗節日調整放假原則。"}],"changed":true,"final":"紀念日，各機關應懸掛國旗，並由相關機關、團體及學校依下列規定辦理：\n一、中華民國開國紀念日、孔子誕辰紀念日及國慶日舉行紀念活動。\n二、革命先烈紀念日舉行春祭國殤。\n三、和平紀念日應全國下半旗一日，舉行紀念活動。\n四、其他紀念日得依其性質舉行紀念活動。\n節日，各機關、團體及學校得依其性質，舉行紀念、慶祝或民俗等相關活動。","finalWhy":"照國民黨黨團、台灣民眾黨黨團再修正動議條文通過。","review":{"note":"不予採納","text":""}},{"no":"第八條","current":null,"versions":[{"bill":"202110030420000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110036170000","text":"本條例第四條、第六條及前條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、警察、消防、海岸巡防、醫療、關務、矯正等全年無休實施輪班、輪休制度之政府機關或機構，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關基於國防安全考量及因應戰備之需要，由目的事業主管機關視實際需要調移之。\n四、事業單位因經營需要，由勞資雙方協商調移之。","note":"一、明定特殊職種需要及為民服務之行政機關學校放假之調移規定。\n二、鑒於特殊職種需要及各行業經營需求有別，爰明定第四條、第六及第七條之放假日，得由勞資雙方協商或目的事業機關調移之。第四款之「事業單位」，包括公、民營事業單位在內。\n三、考量本條例施行後之法律位階高於公務人員週休二日實施辦法，為避免該辦法第四條所規範之對象，如交通運輸、警察、消防、海岸巡防、醫療、關務、其他為民服務機關、機構或軍事機關等，其放假產生法規適用之問題，爰將該條文適用之對象納入規範。"},{"bill":"202110046340000","text":"本法第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本法規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110047800000","text":"紀念日及節日之放假日逢例假日者，應予補假。例假日為星期六者於前一個上班日補假；為星期日者於次一個上班日補假。但除夕及春節放假日逢例假日，均於次一個上班日補假。\n上班日為星期一或星期五，其後一日或前一日逢星期二或星期四之除夕及春節連假、清明節、端午節、中秋節、重陽節之放假，調整該上班日為放假日。\n除夕及春節假期、清明節、端午節、中秋節、重陽節如逢星期二或星期四，其前、後一日上班日調整放假。\n前項調整放假，除除夕及春節假期外，應依下列規定補行上班：\n一、逢星期二者，於節日當週之星期六補行上班。\n二、逢星期四者，於節日前一週之星期六補行上班。但清明節於節日後一週之星期六補行上班。\n前二項調整放假及補行上班日期，由主管機關於前一年六月底前調移並公告之。","note":"一、第一項明定紀念日及節日之放假日逢例假日者應予補假，並一律補為連假。\n二、現行政府行政機關紀念日及民俗節日假期調整原則規定，民俗節日適逢星期二或星期四者，其前、後上班日均予調整放假；紀念日則視實際需要調整放假。為利與國際接軌及對外貿易，應儘量避免調整放假，惟考量民俗節日連續假期對於維繫民俗傳統，提供家族團聚機會，增進旅遊觀光，疏解交通運輸，具有重要意義及正面功能，爰參酌上開假期調整原則並酌作修正，於第二項明定民俗節日調整放假原則。\n三、除夕及春節假期，指除夕及春節之放假日及其逢例假日之補假。\n四、為使社會大眾提前知悉次一年度之調整放假及補行上班之日以預先規劃，爰為第五項規定主管機關應於前一年六月底前調移並公告之。"},{"bill":"202110068720000","text":"上班日為星期一或星期五，其後一日或前一日為星期二或星期四之第四條至第六條所稱休假日，調整該上班日為休假日。\n前項彈性放假，中央主管機關得訂定一日補行上班，其日期於前一年六月底公告之。","note":"明定彈性休假之放假方式。"},{"bill":"202110073030000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本法規定紀念日及節日以外具特殊意義之日，目的事業主管機關會商有關機關得訂定實施慶祝或舉辦活動。"},{"bill":"202110072050000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"本法規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110074310000","text":"上班日為星期一或星期五，其後一日或前一日為星期二或星期四之第四條至第六條所稱休假日，調整該上班日為休假日。\n前項彈性放假及補行上班日期，由主管機關於前一年六月底公告之。","note":"明定彈性休假之放假方式。"},{"bill":"202110074620000","text":"紀念日及節日之放假日適逢例假日，應予工作日補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。\n農曆除夕及春節放假日得由主管機關會同行政院人事行政總處彈性調整，並至遲於三個月前公告之。","note":"一、明定本法之放假日逢例假日者之放假方式。\n二、為使國人重視之春節民俗節日假期能連續，故於第二項明定得由主管機關會同行政院人事行政總處彈性調整，並提前公告之。"},{"bill":"202110076000000","text":"農曆除夕、春節、民族掃墓節、端午節、中秋節，若為星期二或星期四，其前、後一日之上班日，調整為放假日。\n除農曆除夕及春節，無需補行上班外，前項調整後之放假日及補行上班日期，中央主管機關應於前一年六月底公告之。","note":"明定彈性放假及補行上班之機制方式。"},{"bill":"202110075240000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關以辦法訂定之。","note":"本條例參酌「紀念日及節日實施辦法」明定本條例紀念日及節日以外具有特殊意義，有慶祝或舉辦活動必要者，得由目的事業主管機關會商有關機關以辦法訂定實施之。"},{"bill":"202110077660000","text":"第四條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110080400000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本法規定紀念日及節日以外具特殊意義之日，目的事業主管機關會商有關機關得訂定實施慶祝或舉辦活動。"},{"bill":"202110082810000","text":"紀念日及節日之放假日逢例假日者，應予補假。例假日為星期六者於前一個上班日補假；為星期日者於次一個上班日補假。但除夕及春節放假日逢例假日，均於次一個上班日補假。\n上班日為星期一或星期五，其後一日或前一日逢星期二或星期四之除夕及春節連假、清明節、端午節、中秋節、重陽節之放假，調整該上班日為放假日。\n除夕及春節假期、清明節、端午節、中秋節、重陽節如逢星期二或星期四，其前、後一日上班日調整放假。\n前項調整放假，除除夕及春節假期外，應依下列規定補行上班：\n一、逢星期二者，於節日當週之星期六補行上班。\n二、逢星期四者，於節日前一週之星期六補行上班。但清明節於節日後一週之星期六補行上班。\n前二項調整放假及補行上班日期，由主管機關於前一年六月底前調移並公告之。","note":"明定紀念日、節日若逢例假日時補假及彈性放假之方式。"},{"bill":"202110087510000","text":"紀念日及節日之放假日逢例假日者，應予補假。例假日為星期六者於前一個上班日補假；為星期日者於次一個上班日補假。但除夕及春節放假日逢例假日，均於次一個上班日補假。\n上班日為星期一或星期五，其後一日或前一日逢星期二或星期四之除夕及春節連假、清明節、端午節、中秋節、重陽節之放假，調整該上班日為放假日。\n除夕及春節假期、清明節、端午節、中秋節、重陽節如逢星期二或星期四，其前、後一日上班日調整放假。\n前項調整放假，除除夕及春節假期外，應依下列規定補行上班：\n一、逢星期二者，於節日當週之星期六補行上班。\n二、逢星期四者，於節日前一週之星期六補行上班。但清明節於節日後一週之星期六補行上班。\n前二項調整放假及補行上班日期，由主管機關於前一年六月底前調移並公告之。","note":"一、第一項明定紀念日及節日之放假日逢例假日者應予補假，並一律補為連假。\n二、現行政府行政機關紀念日及民俗節日假期調整原則規定，民俗節日適逢星期二或星期四者，其前、後上班日均予調整放假；紀念日則視實際需要調整放假。為利與國際接軌及對外貿易，應儘量避免調整放假，惟考量民俗節日連續假期對於維繫民俗傳統，提供家族團聚機會，增進旅遊觀光，疏解交通運輸，具有重要意義及正面功能，爰參酌上開假期調整原則並酌作修正，於第二項明定民俗節日調整放假原則。\n三、除夕及春節假期，指除夕及春節之放假日及其逢例假日之補假。\n四、為使社會大眾提前知悉次一年度之調整放假及補行上班之日以預先規劃，爰為第五項規定主管機關應於前一年六月底前調移並公告之。"},{"bill":"202110086500000","text":"農曆除夕、春節、民族掃墓節、端午節、中秋節，若為星期二或星期四，其前、後一日之上班日，調整為放假日。\n除農曆除夕及春節，無需補行上班外，前項調整後之放假日及補行上班日期，中央主管機關應於前一年六月底公告之。","note":"明定彈性放假及補行上班之機制方式。"},{"bill":"202110093980000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定本條例放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110093510000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"於本條明定紀念日及節日放假之補假規定。"},{"bill":"202110096450000","text":"紀念日及節日之放假日逢例假日應予補假。例假日為星期六者於前一個上班日補假，為星期日者於次一個上班日補假。但農曆除夕及春節放假日逢例假日，均於次一個上班日補假。","note":"明定法定放假日、農曆除夕及春節放假日逢例假日時之放假方式。"},{"bill":"202110097410000","text":"紀念日及節日之放假日逢例假日者，應予補假。例假日為星期六者於前一個上班日補假；為星期日者於次一個上班日補假。但除夕及春節放假日逢例假日，均於次一個上班日補假。\n上班日為星期一或星期五，其後一日或前一日逢星期二或星期四之除夕及春節連假、清明節、端午節、中秋節、重陽節、原住民族抵抗日、原住民族日及原住民族轉型正義紀念日之放假，調整該上班日為放假日。\n除夕及春節假期、清明節、端午節、中秋節、重陽節、原住民族抵抗日、原住民族日及原住民族轉型正義紀念日如逢星期二或星期四，其前、後一日上班日調整放假。\n前項調整放假，除除夕及春節假期外，應依下列規定補行上班：\n一、逢星期二者，於節日當週之星期六補行上班。\n二、逢星期四者，於節日前一週之星期六補行上班。但清明節於節日後一週之星期六補行上班。\n前二項調整放假及補行上班日期，由主管機關於前一年六月底前調移並公告之。","note":"一、第一項明定紀念日及節日之放假日逢例假日者應予補假，並一律補為連假。\n二、現行政府行政機關紀念日及民俗節日假期調整原則規定，民俗節日適逢星期二或星期四者，其前、後上班日均予調整放假；紀念日則視實際需要調整放假。為利與國際接軌及對外貿易，應儘量避免調整放假，惟考量民俗節日連續假期對於維繫民俗傳統，提供家族團聚機會，增進旅遊觀光，疏解交通運輸，具有重要意義及正面功能，爰參酌上開假期調整原則並酌作修正，於第二項明定民俗節日調整放假原則。\n三、除夕及春節假期，指除夕及春節之放假日及其逢例假日之補假。\n四、為使社會大眾提前知悉次一年度之調整放假及補行上班之日以預先規劃，爰為第五項規定主管機關應於前一年六月底前調移並公告之。"},{"bill":"202110097740000","text":"農曆除夕、春節、民族掃墓節、端午節、中秋節，若為星期二或星期四，其前、後一日之上班日，調整為放假日。\n除農曆除夕及春節，無需補行上班外，前項調整後之放假日及補行上班日期，中央主管機關應於前一年六月底公告之。","note":"明定彈性放假及補行上班之機制方式。"},{"bill":"202110097840000","text":"上班日為星期一，其後一日為放假日；上班日為星期五，其前一日為放假日者，調整該上班日為休假日。\n前項彈性放假及補行上班日期，由主管機關於前一年六月底公告之。","note":"明定彈性放假及補行上班之方式。"},{"bill":"202110099380000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本法規定紀念日及節日以外具有特殊意義之日時，有慶祝或舉辦活動必要者，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110107560000","text":"上班日為星期一或星期五，其後一日或前一日為星期二或星期四之第四條至第六條所稱休假日，調整該上班日為休假日。\n前項彈性放假及補行上班日期，由主管機關於前一年六月底公告之。","note":"明定彈性休假之放假方式。"},{"bill":"202110102380000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"本法規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110044280000","text":"本條例自公布日施行。","note":"明定本條例施行日期。"},{"bill":"202110043520000","text":"本法第四條、第六條及前條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、消防、海岸巡防、醫療、關務、矯正等全年無休實施輪班、輪休制度之政府機關或機構，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關基於國防安全考量及因應戰備之需要，由目的事業主管機關視實際需要調移之。\n四、事業單位因經營需要，由勞資雙方協商調移之。","note":"特殊職種需要及為民服務之行政機關學校放假之調移規定。"}],"changed":true,"final":"紀念日及節日之放假日逢例假日者，應予補假。調整放假及補行上班日期，除其他法令另有規定者外，由目的事業主管機關調移並公告之。","finalWhy":"修正通過。,,","review":{"note":"修正通過","text":"第四條、第六條及前條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、警察、消防、海巡、醫療、關務、矯正等全年無休實施輪班、輪休制度之政府機關或機構，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關基於國防安全考量及因應戰備之需要，由目的事業主管機關視實際需要調移之。"}},{"no":"第九條","current":null,"versions":[{"bill":"202110030420000","text":"本法自發布日施行。","note":"施行日期。"},{"bill":"202110036170000","text":"駐外使領館、代表處、辦事處、外交部授權機構及其他政府機關駐外機構紀念日及節日之放假，依外交部或行政院大陸委員會之規定辦理。","note":"一、明定駐外單位機構紀念日及節日放假規定。\n二、目前各機關配屬駐外使領館、代表處、辦事處等駐外機構之單位或人員，除承其原派機關之命辦理業務外，並受各該駐外館處首長之指揮監督，其紀念日及節日之放假，目前係依外交部規定辦理，主要係配合駐在國之國定假日放假，依我國紀念日及節日放假者，僅限元旦、春節及國慶日，倘該三假日適逢當地例假日，不另予補假。另政府於香港、澳門地區設立之交流機構，其放假情形亦有別於國內，為免產生法規適用爭議，爰對政府機關派駐境外，執行國家涉外事務之機構，明定其紀念日及節日之放假，依外交部或行政院大陸委員會規定辦理。"},{"bill":"202110046340000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110047800000","text":"第四條、第六條及前條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、警察、消防、海巡、醫療、關務、矯正等全年無休實施輪班、輪休制度之政府機關或機構，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關基於國防安全考量及因應戰備之需要，由目的事業主管機關視實際需要調移之。\n四、事業單位因經營需要，由勞資雙方協議調移之。","note":"一、鑑於特殊職種需要及各行業經營需求有別，爰明定第四條、第六及第七條之放假日，得由勞資雙方協議或目的事業機關調移之。第四款之「事業單位」，包括公、民營事業單位在內。\n二、考量本條例施行後之法律位階高於公務人員週休二日實施辦法，為避免該辦法第四條所規範之對象，如交通運輸、警察、消防、海岸巡防、醫療、關務、其他為民服務機關、機構或軍事機關等，其放假產生法規適用之問題，爰將該條文適用之對象納入規範。"},{"bill":"202110068720000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本條例規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110073030000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110072050000","text":"本法自發布日施行。","note":"本法之施行日期。"},{"bill":"202110074310000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或紀念必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本條例規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110074620000","text":"本法第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本法規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110076000000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本條例規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110075240000","text":"本條例自公布日施行，修正時亦同。","note":"明定本條例之施行日期。"},{"bill":"202110077660000","text":"本條例施行細則，由主管機關定之。","note":"為符合彈性原則，爰授權主管機關訂定施行細則。"},{"bill":"202110080400000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110082810000","text":"本條例施行細則，由主管機關定之。","note":"為防實際執行面之技術性問題，並洽符實際需求，授權主管機關訂定施行細則。"},{"bill":"202110087510000","text":"第四條、第六條及前條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、警察、消防、海巡、醫療、關務、矯正等全年無休實施輪班、輪休制度之政府機關或機構，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關基於國防安全考量及因應戰備之需要，由目的事業主管機關視實際需要調移之。\n四、事業單位因經營需要，由勞資雙方協議調移之。","note":"一、鑑於特殊職種需要及各行業經營需求有別，爰明定第四條、第六及第七條之放假日，得由勞資雙方協議或目的事業機關調移之。第四款之「事業單位」，包括公、民營事業單位在內。\n二、考量本條例施行後之法律位階高於公務人員週休二日實施辦法，為避免該辦法第四條所規範之對象，如交通運輸、警察、消防、海岸巡防、醫療、關務、其他為民服務機關、機構或軍事機關等，其放假產生法規適用之問題，爰將該條文適用之對象納入規範。"},{"bill":"202110086500000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本條例規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110093980000","text":"第三條及第五條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本條例規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110093510000","text":"除本條例規定之紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"於本條明定，除本條規定之紀念日及節日外，具特殊意義之日，可由目的事業主管機關會商相關機關訂定、實施。"},{"bill":"202110096450000","text":"上班日逢第四條至第六條所稱休假日，得彈性往前或往後調整一至二日該上班日為休假日。\n前項彈性放假，中央主管機關得訂定一至二日補行上班，其日期於前一年六月底公告之。但有特殊情形時，得予延後於八月三十一日前公告。","note":"明定彈性休假之放假方式。"},{"bill":"202110097410000","text":"本條例第四條、第六條及前條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、警察、消防、海岸巡防、醫療、關務、矯正等全年無休實施輪班、輪休制度之政府機關或機構，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關基於國防安全考量及因應戰備之需要，由目的事業主管機關視實際需要調移之。\n四、事業單位因經營需要，由勞資雙方協商調移之。","note":"一、明定特殊職種需要及為民服務之行政機關學校放假之調移規定。\n二、鑒於特殊職種需要及各行業經營需求有別，爰明定第四條、第六及第七條之放假日，得由勞資雙方協商或目的事業機關調移之。第四款之「事業單位」，包括公、民營事業單位在內。\n三、考量本條例施行後之法律位階高於公務人員週休二日實施辦法，為避免該辦法第四條所規範之對象，如交通運輸、警察、消防、海岸巡防、醫療、關務、其他為民服務機關、機構或軍事機關等，其放假產生法規適用之問題，爰將該條文適用之對象納入規範。"},{"bill":"202110097740000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本條例規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110097840000","text":"除本條例第三條至第六條規定外，其他具有特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定除本條例所規定之紀念日及節日外，得由目的事業主管機關會商有關機關，訂定其他具有特殊意義之日。"},{"bill":"202110099380000","text":"本法自公布日施行。","note":"明定本法之施行日期。"},{"bill":"202110107560000","text":"第三條、第五條及第六條規定紀念日及節日以外具特殊意義，有慶祝或紀念必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"明定本條例規定紀念日及節日外，其餘具有特殊意義之日時，得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110102380000","text":"本法自公布日施行。","note":"本法之施行日期。"},{"bill":"202110043520000","text":"除本法第三條及第五條規定外，具特殊意義、有慶祝或紀念必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"考量本法所定紀念日及節日皆有其歷史緣由或民俗傳統，僅限特定範圍。為保持彈性，非屬本法規範範疇者，若各族群、團體或各級政府機關基於特定目的，對具特殊意義之日，認為有統一明訂、以資慶祝或紀念之需要者，因不涉放假，明定得由目的事業主管機關會商有關機關訂定實施之。"}],"changed":true,"final":"第四條、第六條及前條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、警察、消防、海巡、醫療、關務、矯正等全年無休實施輪班、輪休制度之政府機關或機構，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關基於國防安全考量及因應戰備之需要，由目的事業主管機關視實際需要調移之。","finalWhy":"修正通過。,,","review":{"note":"不予採納","text":""}},{"no":"第十條","current":null,"versions":[{"bill":"202110036170000","text":"除本條例第三條及第五條規定外，具特殊意義、有慶祝或紀念必要之日，得由目的事業主管機關會商有關機關訂定實施之。","note":"考量本條例所定紀念日及節日皆有其歷史緣由或民俗傳統，僅限特定範圍。為保持彈性，非屬本條例規範範疇者，若各族群、團體或各級政府機關基於特定目的，對具特殊意義之日，認為有統一明定、以資慶祝或紀念之需要者，因不涉放假，明定得由目的事業主管機關會商有關機關訂定實施之。"},{"bill":"202110047800000","text":"駐外使領館、代表處、辦事處、外交部授權機構及其他政府機關駐外機構紀念日及節日之放假，依外交部或大陸委員會之規定辦理。","note":"一、明定駐外單位機構紀念日及節日放假規定。\n二、目前各機關配屬駐外使領館、代表處、辦事處等駐外機構之單位或人員，除承其原派機關之命辦理業務外，並受各該駐外館處首長之指揮監督，其紀念日及節日之放假，目前係依外交部規定辦理，主要係配合駐在國之國定假日放假，依我國紀念日及節日放假者，僅限元旦、春節及國慶日，倘該三假日適逢當地例假日，不另予補假。另政府於香港、澳門地區設立之交流機構，其放假情形亦有別於國內，為免產生法規適用爭議，爰對政府機關派駐境外，執行國家涉外事務之機構，明定其紀念日及節日之放假，依外交部或大陸委員會規定辦理。"},{"bill":"202110068720000","text":"本條例自發布日施行。","note":"本條例之施行日期。"},{"bill":"202110074310000","text":"本條例自中華民國○年一月一日施行。","note":"一、本條例之施行日期。\n二、為避免造成社會各界已排定之行程因本條例之施行而受影響，爰俟本院三讀時再行討論施行日期，並應自該年首日施行。"},{"bill":"202110074620000","text":"本法自中華民國○年一月一日施行。","note":"一、本條例施行日期。\n二、為避免造成社會各界已排定之行程因本條例之施行而受影響，爰俟本院三讀時再行討論施行日期，並應自該年首日施行。"},{"bill":"202110076000000","text":"本條例自發布日施行。","note":"本條例之施行日期。"},{"bill":"202110077660000","text":"本條例自發布日實施。","note":"本條例施行日期。"},{"bill":"202110082810000","text":"本條例自發布日施行。","note":"本條例施行日期。"},{"bill":"202110087510000","text":"駐外使領館、代表處、辦事處、外交部授權機構及其他政府機關駐外機構紀念日及節日之放假，依外交部或大陸委員會之規定辦理。","note":"一、明定駐外單位機構紀念日及節日放假規定。\n二、目前各機關配屬駐外使領館、代表處、辦事處等駐外機構之單位或人員，除承其原派機關之命辦理業務外，並受各該駐外館處首長之指揮監督，其紀念日及節日之放假，目前係依外交部規定辦理，主要係配合駐在國之國定假日放假，依我國紀念日及節日放假者，僅限元旦、春節及國慶日，倘該三假日適逢當地例假日，不另予補假。另政府於香港、澳門地區設立之交流機構，其放假情形亦有別於國內，為免產生法規適用爭議，爰對政府機關派駐境外，執行國家涉外事務之機構，明定其紀念日及節日之放假，依外交部或大陸委員會規定辦理。"},{"bill":"202110086500000","text":"本條例自公布日施行。","note":"本條例之施行日期。"},{"bill":"202110093980000","text":"本條例自中華民國○年一月一日施行。","note":"一、本條例之施行日期。\n二、為避免造成社會各界已排定之行程因本條例之施行而受影響，爰俟本院三讀時再行討論施行日期，並應自該年首日施行。"},{"bill":"202110093510000","text":"本條例自公布日施行。","note":"於本條明定本條例施行日期。"},{"bill":"202110096450000","text":"第四條至第六條、第八條及第九條放假日之調移，情形特殊者得依下列規定辦理：\n一、交通運輸、警察、消防、海巡、醫療、關務、矯正等機關，由目的事業主管機關調移之。\n二、前款以外為民服務之政府機關或機構、學校，在不影響為民服務之原則下，由目的事業主管機關視實際業務需要調移之。\n三、軍事機關由國防部視實際需要調移之。\n四、事業單位因經營需要，由勞資雙方協議調移之。","note":"一、鑑於特殊職種需要及各行業經營需求有別，爰明定第四條、第五條、第六條、第八條及第九條之放假日，得由勞資雙方協議或目的事業機關調移之。第四款之「事業單位」，包括公、民營事業單位在內。\n二、考量本條例施行後之法律位階高於公務人員週休二日實施辦法，為避免該辦法第四條所規範之對象，如交通運輸、警察、消防、海岸巡防、醫療、關務、其他為民服務機關、機構或軍事機關等，其放假產生法規適用之問題，爰將該條文適用之對象納入規範。"},{"bill":"202110097410000","text":"駐外使領館、代表處、辦事處、外交部授權機構及其他政府機關駐外機構紀念日及節日之放假，依外交部或大陸委員會之規定辦理。","note":"一、明定駐外單位機構紀念日及節日放假規定。\n二、目前各機關配屬駐外使領館、代表處、辦事處等駐外機構之單位或人員，除承其原派機關之命辦理業務外，並受各該駐外館處首長之指揮監督，其紀念日及節日之放假，目前係依外交部規定辦理，主要係配合駐在國之國定假日放假，依我國紀念日及節日放假者，僅限元旦、春節及國慶日，倘該三假日適逢當地例假日，不另予補假。另政府於香港、澳門地區設立之交流機構，其放假情形亦有別於國內，為免產生法規適用爭議，爰對政府機關派駐境外，執行國家涉外事務之機構，明定其紀念日及節日之放假，依外交部或大陸委員會規定辦理。"},{"bill":"202110097740000","text":"本條例自公布日施行。","note":"本條例之施行日期。"},{"bill":"202110097840000","text":"本條例施行細則，由主管機關定之。","note":"授權主管機關訂定施行細則。"},{"bill":"202110107560000","text":"本條例自中華民國○年一月一日施行。","note":"一、本條例之施行日期。\n二、為避免造成社會各界已排定之行程因本條例之施行而受影響，爰俟本院三讀時再行討論施行日期，並應自該年首日施行。"},{"bill":"202110043520000","text":"本法施行日期，由行政院以命令定之。","note":"本法施行日期。"}],"changed":true,"final":"本條例自公布日施行。","finalWhy":"照國民黨黨團、台灣民眾黨黨團再修正動議條文通過。","review":{"note":"照委員牛煦庭等22人提案、民眾黨黨團提案、委員高金素梅等29人提案及委員牛煦庭等50人所提修正動議併案保留協商","text":""}},{"no":"第十一條","current":null,"versions":[{"bill":"202110036170000","text":"本條例自中華民國○年一月一日施行。","note":"本條例施行日期。"},{"bill":"202110047800000","text":"第三條及第五條規定以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關以辦法訂之。","note":"考量本條例所定紀念日及節日皆有其歷史緣由或民俗傳統，僅限特定範圍。為保持彈性，非屬本條例規範範疇者，若各族群、團體或各級政府機關基於特定目的，對具特殊意義之日，認為有統一明定、以資慶祝或紀念之需要者，因不涉放假，明定得由目的事業主管機關會商有關機關以辦法訂之。"},{"bill":"202110087510000","text":"第三條及第五條規定以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關以辦法定之。","note":"考量本條例所定紀念日及節日皆有其歷史緣由或民俗傳統，僅限特定範圍。為保持彈性，非屬本條例規範範疇者，若各族群、團體或各級政府機關基於特定目的，對具特殊意義之日，認為有統一明定、以資慶祝或紀念之需要者，因不涉放假，明定得由目的事業主管機關會商有關機關以辦法定之。"},{"bill":"202110096450000","text":"駐外使領館、代表處、辦事處、外交部授權機構及其他政府機關駐外機構紀念日及節日之放假，依外交部或大陸委員會之規定辦理。","note":"一、明定駐外單位機構紀念日及節日放假規定。\n二、目前各機關配屬駐外使領館、代表處、辦事處等駐外機構之單位或人員，除承其原派機關之命辦理業務外，並受各該駐外館處首長之指揮監督，其紀念日及節日之放假，目前係依外交部規定辦理，主要係配合駐在國之國定假日放假，依我國紀念日及節日放假者，僅限元旦、春節及國慶日，倘該三假日適逢當地例假日，不另予補假。另政府於香港、澳門地區設立之交流機構，其放假情形亦有別於國內，為免產生法規適用爭議，爰對政府機關派駐境外，執行國家涉外事務之機構，明定其紀念日及節日之放假，依外交部或大陸委員會規定辦理。"},{"bill":"202110097410000","text":"第三條及第五條規定以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關以辦法訂之。","note":"考量本條例所定紀念日及節日皆有其歷史緣由或民俗傳統，僅限特定範圍。為保持彈性，非屬本條例規範範疇者，若各族群、團體或各級政府機關基於特定目的，對具特殊意義之日，認為有統一明定、以資慶祝或紀念之需要者，因不涉放假，明定得由目的事業主管機關會商有關機關以辦法訂之。"},{"bill":"202110097840000","text":"本條例自公布日施行，修正時亦同。","note":"明定本條例之施行日期。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十二條","current":null,"versions":[{"bill":"202110047800000","text":"本條例施行細則，由主管機關定之。","note":"基於本條例定位為總則性之基準法，僅宜作綱領性原則性及政策性之規定，有關實際執行層面之細節性規定，以及補假、調整放假及補行上班之規定，授權於施行細則規範，較符合彈性原則，爰授權主管機關訂定施行細則。"},{"bill":"202110087510000","text":"本條例施行細則，由主管機關定之。","note":"基於本條例定位為總則性之基準法，僅宜作綱領性原則性及政策性之規定，有關實際執行層面之細節性規定，以及補假、調整放假及補行上班之規定，授權於施行細則規範，較符合彈性原則，爰授權主管機關訂定施行細則。"},{"bill":"202110096450000","text":"第三條至第六條規定紀念日及節日以外具特殊意義，有慶祝或舉辦活動必要之日，得由目的事業主管機關會商有關機關以辦法訂定之。","note":"本條例參酌「紀念日及節日實施辦法」明定本條例紀念日及節日以外具有特殊意義，有慶祝或舉辦活動必要者，得由目的事業主管機關會商有關機關以辦法訂定實施之。"},{"bill":"20 function finder(turns) {   // 在這場逐字稿裡找字

    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
