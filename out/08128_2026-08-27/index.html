額之計算、資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額及比率之計算、符合政府政策之範圍、投資於新創事業公司累計金額占有限合夥事業實收出資總額比率之計算與申請及核定程序、第四項之特殊情形及延長適用期間之申請程序、前項實際營運活動在我國境內之外國公司之認定與相關證明文件及其他相關事項之辦法，由中央主管機關會同財政部定之。\n適用第三項規定事業之所得計算與申報程序、第七項扣繳程序及其他相關事項之辦法，由財政部定之；第七項之扣繳率，由財政部擬訂，報請行政院核定。","finalWhy":"","review":null},{"no":"第二十三條之二","current":"個人以現金投資於成立未滿二年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣一百萬元，並取得該公司之新發行股份，持有期間達二年者，得就投資金額百分之五十限度內，自持有期間屆滿二年之當年度個人綜合所得總額中減除。該個人適用本項規定每年得減除之金額，合計以新臺幣三百萬元為限。\n前項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","versions":[{"bill":"202110086560000","text":"個人以現金投資於經中央目的事業主管機關核定之國內高風險新創事業公司，符合下列各款情形之一者，得就投資金額百分之五十限度內，自當年度個人綜合所得總額中減除。該個人適用本項規定每年得減除之金額，合計以新臺幣三百萬元為限：\n一、投資於成立未滿二年之高風險新創事業公司，且對同一公司當年度投資金額達新臺幣一百萬元，並取得該公司之新發行股份，於持有期間屆滿二年之當年度。\n二、投資於成立二年以上未滿五年之高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，於持有期間屆滿三年之當年度。\n前項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行第一項提供租稅優惠，旨在鼓勵資金投入高風險新創事業。自2017年11月24日起，個人若以現金投資成立未滿兩年的高風險新創事業公司，且投資額達100萬元新臺幣並持股兩年以上，可享有所得稅減免優惠。因考量不同產業的需求差異和新創企業需要較長的天使期，修正條文將適用範圍擴大至成立未滿五年的高風險新創公司，以協助其穩定發展並獲取必要資金：\n(一)第一款規定個人投資成立未滿二年之高風險新創事業公司之租稅優惠，維持現行投資金額及持股期間門檻之規定。\n(二)第二款對於個人投資成立二年以上未滿五年之高風險新創事業公司，亦提供租稅誘因，並將投資金額門檻定為新臺幣五十萬元，幫助公司募集資金、累積資本，同時為利公司規劃中長期資金之運用，明定持股期間需達三年，始得適用本項租稅優惠。\n二、第二項未修正。"},{"bill":"202110086570000","text":"個人以現金投資於成立未滿五年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得總額中減除。\n個人適用前項投資金額減除優惠，當年度合計得減除總額以新臺幣五百萬元為限；其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n前二項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、國家重點發展產業之範圍及認定程序、減除總額限額之計算、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行第一項所定租稅優惠措施，係為引導資金挹注高風險新創事業公司並扶植其發展，自一百零六年十一月二十四日施行迄今，提供個人以現金投資於成立未滿二年之高風險新創事業公司，投資金額達新臺幣一百萬元，並取得該公司之新發行股份，持有期間達二年者，得就其投資金額自每年個人綜合所得總額減除之租稅優惠。惟考量不同產業新創樣態有所差異，需要較長之天使期，並參酌「行政院國家發展基金創業天使投資方案」，係以風險性較高且設立年限未滿五年之新創事業為適用對象，為協助該等新創事業公司取得營運發展所需資金、穩健成長，爰修正第一項，將高風險新創事業公司設立年限修正為未滿五年、投資金額門檻修正為新臺幣五十萬元，幫助公司募集資金、累積資本，同時為利公司規劃中長期資金之運用，明定持股期間需達三年，始得適用本項租稅優惠。\n二、第一項後段減除金額上限之規定移列為第二項，定明個人投資之高風險新創事業公司，當年度合計得減除總額以新臺幣五百萬元為限，其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n三、第二項移列為第三項，並增訂第二項國家重點發展產業之範圍及認定程序、減除總額限額之計算，授權由中央主管機關會同財政部定之。中央主管機關會同財政部擬定國家重點發展產業範圍及認定程序時，並得會商相關中央目的事業主管機關提供意見，併予敘明。\n四、另有關修正後，新、舊法所定高風險新創事業公司設立年限及投資金額門檻之適用，應以個人現金繳納股款日為基準，個人自一百十四年一月一日起至一百十八年十二月三十一日止繳納股款者，應適用修正條文規定；於一百十三年十二月三十一日以前繳納股款者，應適用現行條文規定，併予敘明。"},{"bill":"202110099000000","text":"個人以現金投資於成立未滿五年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得總額中減除。\n個人適用前項投資金額減除優惠，當年度合計得減除總額以新臺幣五百萬元為限；其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n前二項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、國家重點發展產業之範圍及認定程序、減除總額限額之計算、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行第一項所定租稅優惠措施，係為引導資金挹注高風險新創事業公司並扶植其發展，自一百零六年十一月二十四日施行迄今，提供個人以現金投資於成立未滿二年之高風險新創事業公司，投資金額達新臺幣一百萬元，並取得該公司之新發行股份，持有期間達二年者，得就其投資金額自每年個人綜合所得總額減除之租稅優惠。惟考量不同產業新創樣態有所差異，需要較長之天使期，並參酌「行政院國家發展基金創業天使投資方案」，係以風險性較高且設立年限未滿五年之新創事業為適用對象，為協助該等新創事業公司取得營運發展所需資金、穩健成長，爰修正第一項，將高風險新創事業公司設立年限修正為未滿五年、投資金額門檻修正為新臺幣五十萬元，幫助公司募集資金、累積資本，同時為利公司規劃中長期資金之運用，明定持股期間需達三年，始得適用本項租稅優惠。\n二、第一項後段減除金額上限之規定移列為第二項，定明個人投資之高風險新創事業公司，當年度合計得減除總額以新臺幣五百萬元為限，其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n三、第二項移列為第三項，並增訂第二項國家重點發展產業之範圍及認定程序、減除總額限額之計算，授權由中央主管機關會同財政部定之。中央主管機關會同財政部擬定國家重點發展產業範圍及認定程序時，並得會商相關中央目的事業主管機關提供意見，併予敘明。\n四、另有關修正後，新、舊法所定高風險新創事業公司設立年限及投資金額門檻之適用，應以個人現金繳納股款日為基準，個人自一百十四年一月一日起至一百十八年十二月三十一日止繳納股款者，應適用修正條文規定；於一百十三年十二月三十一日以前繳納股款者，應適用現行條文規定，併予敘明。"},{"bill":"202110174490000","text":"個人以現金投資於成立未滿八年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得總額中減除。\n個人適用前項投資金額減除優惠，當年度合計得減除總額以新臺幣一千萬元為限；其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n營利事業原始認股或應募屬第一項國內高風險新創事業公司發行之股票，成為該公司記名股東達三年以上，且該公司未以該認股或應募金額，依其他法律規定申請免徵營利事業所得稅或股東投資抵減者，得以其取得該股票之價款百分之二十限度內，自其有應納營利事業所得稅之年度起五年內抵減各年度應納營利事業所得稅額。其每一年度得抵減總額，以不超過該營利事業當年度應納營利事業所得稅額百分之五十為限。\n前項營利事業如為創業投資事業，應由其營利事業股東或合夥人按該創業投資事業依該項規定原可抵減之金額，依其持有該創業投資事業股權或出資額比例計算可享投資抵減金額，自創業投資事業成為該高風險新創事業公司記名股東第四年度起五年內抵減各年度應納營利事業所得稅額。其每一年度得抵減總額，以不超過該營利事業當年度應納營利事業所得稅額百分之五十為限。\n第一項及第二項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、國家重點發展產業之範圍及認定程序、減除總額限額之計算，第三項營利事業及前項創業投資事業適用股東投資抵減之要件及前四項之申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、將現行第一項國內高風險新創事業之設立年限自「未滿五年」調整為「未滿八年」，其修正理由同第二十三條之一第九項之修正，俱為符合國際實務及經濟部對新創事業之認定，爰建議擴大適用範圍，以提升政策涵蓋效果。\n二、現行第二項規定，個人投資國內高風險新創事業公司者，得自其綜合所得總額中減除其投資金額，惟每年最高以新臺幣五百萬元為限。考量目前高風險新創事業投資規模逐漸提升，且我國推動創新創業政策目標需仰賴更多民間資金挹注，為進一步提升境內個人參與創投活動之誘因，爰將該等個人於課稅年度內可減除之金額上限自原新臺幣五百萬元調整為一千萬元。\n三、鑒於國內高風險新創事業營運風險極高，傳統融資管道有限，需倚賴創投或企業資金挹注。倘能比照現行生技醫藥產業發展條例第七條及文化創意產業發展法第二十七條之一針對生技醫藥與文化創意產業所設之投資抵減優惠，將現行稅賦誘因擴及營利事業原始認股或應募國內高風險新創事業公司，將有助於分散資金配置侷限，促使營利事業資源投入多元創新領域，強化新創發展動能。\n四、爰建議參照上開生技醫藥與文化創意產業之相關規定，增列第三項及第四項，針對營利事業於成為國內高風險新創事業公司記名股東達三年以上，且未重複適用其他所得稅或投資抵減優惠者，得就其出資金額百分之二十為上限，自有應納營利事業所得稅之年度起五年內，抵減其應納稅額，每年最高不得逾應納稅額百分之五十，藉以建立穩定且具誘因之長期投資制度。\n五、現行第三項項次調移至第五項，並配合前二項之增訂，將前二項有關抵減制度之適用要件、申請期限、程序、持有期間計算等相關事項之配套規定，亦授權由主管機關會同財政部另定辦法，以利實務操作並確保政策彈性。"},{"bill":"202110199250000","text":"個人以現金投資於成立未滿八年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得總額中減除。\n個人適用前項投資金額減除優惠，當年度合計得減除總額以新臺幣一千萬元為限；其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n營利事業原始認股或應募屬第一項國內高風險新創事業公司發行之股票，成為該公司記名股東達三年以上，且該公司未以該認股或應募金額，依其他法律規定申請免徵營利事業所得稅或股東投資抵減者，得以其取得該股票之價款百分之二十限度內，自其有應納營利事業所得稅之年度起五年內抵減各年度應納營利事業所得稅額。其每一年度得抵減總額，以不超過該營利事業當年度應納營利事業所得稅額百分之五十為限。\n前項營利事業如為創業投資事業，應由其營利事業股東或合夥人按該創業投資事業依該項規定原可抵減之金額，依其持有該創業投資事業股權或出資額比例計算可享投資抵減金額，自創業投資事業成為該高風險新創事業公司記名股東第四年度起五年內抵減各年度應納營利事業所得稅額。其每一年度得抵減總額，以不超過該營利事業當年度應納營利事業所得稅額百分之五十為限。\n第一項及第二項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、國家重點發展產業之範圍及認定程序、減除總額限額之計算，第三項營利事業及前項創業投資事業適用股東投資抵減之要件及前四項之申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、將現行第一項國內高風險新創事業之設立年限自「未滿五年」調整為「未滿八年」，其修正理由同第二十三條之一第九項之修正，俱為符合國際實務及經濟部對新創事業之認定，爰建議擴大適用範圍，以提升政策涵蓋效果。\n二、現行第二項規定，個人投資國內高風險新創事業公司者，得自其綜合所得總額中減除其投資金額，惟每年最高以新臺幣五百萬元為限。考量目前高風險新創事業投資規模逐漸提升，且我國推動創新創業政策目標需仰賴更多民間資金挹注，為進一步提升境內個人參與創投活動之誘因，爰將該等個人於課稅年度內可減除之金額上限自原新臺幣五百萬元調整為一千萬元。\n三、鑒於國內高風險新創事業營運風險極高，傳統融資管道有限，需倚賴創投或企業資金挹注。倘能比照現行生技醫藥產業發展條例第七條及文化創意產業發展法第二十七條之一針對生技醫藥與文化創意產業所設之投資抵減優惠，將現行稅賦誘因擴及營利事業原始認股或應募國內高風險新創事業公司，將有助於分散資金配置侷限，促使營利事業資源投入多元創新領域，強化新創發展動能。\n四、爰建議參照上開生技醫藥與文化創意產業之相關規定，增列第三項及第四項，針對營利事業於成為國內高風險新創事業公司記名股東達三年以上，且未重複適用其他所得稅或投資抵減優惠者，得就其出資金額百分之二十為上限，自有應納營利事業所得稅之年度起五年內，抵減其應納稅額，每年最高不得逾應納稅額百分之五十，藉以建立穩定且具誘因之長期投資制度。\n五、現行第三項項次調移至第五項，並配合前二項之增訂，將前二項有關抵減制度之適用要件、申請期限、程序、持有期間計算等相關事項之配套規定，亦授權由主管機關會同財政部另定辦法，以利實務操作並確保政策彈性。"}],"changed":true,"final":"個人以現金投資於成立未滿八年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得總額中減除。\n個人適用前項投資金額減除優惠，當年度合計得減除總額以新臺幣五百萬元為限；其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n前二項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、國家重點發展產業之範圍及認定程序、減除總額限額之計算、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","finalWhy":"","review":null},{"no":"第二十三條之三","current":"為促進營利事業以盈餘進行實質投資，提升生產技術、產品或勞務品質，自辦理一百零七年度未分配盈餘加徵營利事業所得稅申報起，公司或有限合夥事業因經營本業或附屬業務所需，於當年度盈餘發生年度之次年起三年內，以該盈餘興建或購置供自行生產或營業用之建築物、軟硬體設備或技術達一定金額，該投資金額於依所得稅法第六十六條之九規定計算當年度未分配盈餘時，得列為減除項目。\n適用前項規定之公司或有限合夥事業於依所得稅法第一百零二條之二規定辦理未分配盈餘申報時，應依規定格式填報，並檢附投資證明文件送所在地之稅捐稽徵機關。\n適用第一項規定之公司或有限合夥事業於申報繳納當年度未分配盈餘加徵營利事業所得稅後始完成投資者，應於完成投資之日起一年內，依規定格式並檢附投資證明文件，向所在地之稅捐稽徵機關申請依第一項規定重行計算該年度未分配盈餘，退還溢繳稅款。\n第一項規定之一定金額、前二項規定格式、投資證明文件、前項退還溢繳稅款之申請程序、應提示文件資料及其他相關事項之辦法，由財政部定之。","versions":[{"bill":"202110199230000","text":"為促進營利事業以盈餘進行實質投資，提升生產技術、產品或勞務品質，自辦理一百零七年度未分配盈餘加徵營利事業所得稅申報起，公司、有限合夥事業或醫療事業因經營本業或附屬業務所需，於當年度盈餘發生年度之次年起三年內，以該盈餘興建或購置供自行生產或營業用之建築物、軟硬體設備或技術達一定金額，該投資金額於依所得稅法第六十六條之九規定計算當年度未分配盈餘時，得列為減除項目。\n適用前項規定之公司、有限合夥事業或醫療事業於依所得稅法第一百零二條之二規定辦理未分配盈餘申報時，應依規定格式填報，並檢附投資證明文件送所在地之稅捐稽徵機關。\n適用第一項規定之公司、有限合夥事業或醫療事業於申報繳納當年度未分配盈餘加徵營利事業所得稅後始完成投資者，應於完成投資之日起一年內，依規定格式並檢附投資證明文件，向所在地之稅捐稽徵機關申請依第一項規定重行計算該年度未分配盈餘，退還溢繳稅款。\n第一項規定之一定金額、前二項規定格式、投資證明文件、前項退還溢繳稅款之申請程序、應提示文件資料及其他相關事項之辦法，由財政部定之。","note":"一、本條係於民國108年所增訂，其立法理由明載，本條係對於營利事業所得稅中未分配盈餘加徵之投資抵減而設。\n二、醫療社團法人為醫療事業類型之一，然據財政部賦稅署95年7月13日台稅一發字第09504526550號函釋略以，醫療社團法人之結餘可按出資比例分配予其社員，具有營利之性質，應屬所得稅法第11條第二項規定，以其他組織方式成立之營利事業。即醫療社團法人係屬營利事業所得稅及其中未分配盈餘加徵營利事業所得稅之課徵主體。此外，基於醫療產業之高資金密集、高固定資產等特性，醫療社團法人之盈餘再投資實屬常態且必要。\n三、綜整前述二點，醫療社團法人之現況即為「需課徵營利事業所得稅及未分配盈餘加徵營利事業所得稅，且有盈餘再投資之必要，但卻無本條之適用」，恐與課稅公平原則相悖，且不利醫療社團法人之創新與發展。\n四、經查，按納稅者權利保護法第五條後段「無合理之政策目的不得為差別待遇」及第七條第一項規定「涉及租稅事項之法律，其解釋應本於租稅法律主義之精神，依各該法律之立法目的，衡酌經濟上之意義及實質課稅之公平原則為之」。再按大法官釋字第694號解釋理由書第一段所述「憲法第七條所揭示之平等原則非指絕對、機械之形式上平等，而係保障人民在法律上地位之實質平等，要求本質上相同之事物應為相同之處理，不得恣意為無正當理由之差別待遇」。承前所述，均係揭櫫課稅公平原則與平等原則，即本質上相同之事物應為相同之租稅優惠措施。\n五、再依據衛生福利部之衛部醫字第1140122296號函所指，「查按目前稅法實務上，醫療社團法人與公司、有限合夥事業皆被視為營利事業。考量醫療社團法人與公司、有限合夥事業於稅務上皆因相同屬性被賦予相同義務，爰於同樣符合稅捐稽徵機關開列之適用條件下，給予等同之租稅優惠，應為合理」。\n六、綜上，為符合租稅公平原則，並鼓勵醫療社團法人將未分配盈餘用於提升營運績效、創新與轉型，爰將醫療事業納入本條之適用。"}],"changed":false,"final":"為促進營利事業以盈餘進行實質投資，提升生產技術、產品或勞務品質，自辦理一百零七年度未分配盈餘加徵營利事業所得稅申報起，公司或有限合夥事業因經營本業或附屬業務所需，於當年度盈餘發生年度之次年起三年內，以該盈餘興建或購置供自行生產或營業用之建築物、軟硬體設備或技術達一定金額，該投資金額於依所得稅法第六十六條之九規定計算當年度未分配盈餘時，得列為減除項目。\n適用前項規定之公司或有限合夥事業於依所得稅法第一百零二條之二規定辦理未分配盈餘申報時，應依規定格式填報，並檢附投資證明文件送所在地之稅捐稽徵機關。\n適用第一項規定之公司或有限合夥事業於申報繳納當年度未分配盈餘加徵營利事業所得稅後始完成投資者，應於完成投資之日起一年內，依規定格式並檢附投資證明文件，向所在地之稅捐稽徵機關申請依第一項規定重行計算該年度未分配盈餘，退還溢繳稅款。\n第一項規定之一定金額、前二項規定格式、投資證明文件、前項退還溢繳稅款之申請程序、應提示文件資料及其他相關事項之辦法，由財政部定之。","finalWhy":null,"review":{"note":"保留，送院會處理","text":""}},{"no":"第三十九條","current":"產業園區得規劃下列用地：\n一、產業用地。\n二、社區用地。\n三、公共設施用地。\n四、其他經中央主管機關核定之用地。\n產業用地所占面積，不得低於全區土地總面積百分之六十。\n社區用地所占面積，不得超過全區土地總面積百分之十。\n公共設施用地所占面積，不得低於全區土地總面積百分之二十。\n第一項各種用地之用途、使用規範及其他相關事項之辦法，由中央主管機關會商各中央目的事業主管機關定之。","versions":[{"bill":"202110034270000","text":"產業園區得規劃下列用地：\n一、產業用地。\n二、社區用地。\n三、公共設施用地。\n四、其他經中央主管機關核定之用地。\n產業用地所占面積，不得低於全區土地總面積百分之六十。\n社區用地所占面積，不得超過全區土地總面積百分之十五。\n公共設施用地所占面積，不得低於全區土地總面積百分之二十。\n第一項各種用地之用途、使用規範及其他相關事項之辦法，由中央主管機關會商各中央目的事業主管機關定之。","note":"本修正草案於下列修正條文中調整處理方式，因此於本條中放寬總面積百分比，以利政府推動社福建設及社會住宅之用地取得。"}],"changed":false,"final":"產業園區得規劃下列用地：\n一、產業用地。\n二、社區用地。\n三、公共設施用地。\n四、其他經中央主管機關核定之用地。\n產業用地所占面積，不得低於全區土地總面積百分之六十。\n社區用地所占面積，不得超過全區土地總面積百分之十。\n公共設施用地所占面積，不得低於全區土地總面積百分之二十。\n第一項各種用地之用途、使用規範及其他相關事項之辦法，由中央主管機關會商各中央目的事業主管機關定之。","finalWhy":null,"review":{"note":"保留，送院會處理","text":""}},{"no":"第四十六條","current":"中央主管機關或直轄市、縣（市）主管機關開發之產業園區內土地、建築物及設施，應分別依下列規定使用、收益或處分；其使用、收益或處分之計價，由開發產業園區之各該主管機關審定。但資金全部由受託之公民營事業籌措者，依委託開發契約規定辦理：\n一、產業用地及其地上之建築物，由開發產業園區之各該主管機關辦理租售、設定地上權或依其他經中央主管機關核定之方式處理。\n二、社區用地，由開發產業園區之各該主管機關，依序依下列方式處理：\n(一)配售予被價購或徵收之土地或房屋所有權人。\n(二)出售予園區內企業興建員工住宅及售供員工興建住宅使用。\n(三)出售供興建住宅使用。\n三、公共設施用地、公共建築物及設施，由開發產業園區之各該主管機關辦理租售、設定負擔、收益或無償提供使用。\n前項第二款第一目房屋所有權人，以依第四十一條第一項公告停止所有權移轉之日前，已辦竣戶籍登記者為限。\n辦理第一項土地、建築物與設施使用、收益或處分之程序、條件及其他相關事項之辦法，由中央主管機關定之。\n中央主管機關或直轄市、縣（市）主管機關開發之產業園區內土地，為配合國家經濟發展政策，得按區位、承購對象、出售價格及相關條件，報行政院專案核准出售，並得由承購土地者，依可行性規劃報告完成興建相關公共設施。","versions":[{"bill":"202110034270000","text":"中央主管機關或直轄市、縣（市）主管機關開發之產業園區內土地、建築物及設施，應分別依下列規定使用、收益或處分；其使用、收益或處分之計價，由開發產業園區之各該主管機關審定。但資金全部由受託之公民營事業籌措者，依委託開發契約規定辦理：\n一、產業用地及其地上之建築物，由開發產業園區之各該主管機關辦理租售、設定地上權或依其他經中央主管機關核定之方式處理。\n二、社區用地，由開發產業園區之各該主管機關，依序依下列方式處理：\n(一)配售予被價購或徵收之土地或房屋所有權人。\n(二)出售予園區內企業興建員工住宅使用。\n三、公共設施用地、公共建築物及設施，由開發產業園區之各該主管機關辦理租售、設定負擔、收益或無償提供使用。\n前項第二款第一目房屋所有權人，以依第四十一條第一項公告停止所有權移轉之日前，已辦竣戶籍登記者為限。\n辦理第一項土地、建築物與設施使用、收益或處分之程序、條件及其他相關事項之辦法，由中央主管機關定之。\n中央主管機關或直轄市、縣（市）主管機關開發之產業園區內土地，為配合國家經濟發展政策，得按區位、承購對象、出售價格及相關條件，報行政院專案核准出售，並得由承購土地者，依可行性規劃報告完成興建相關公共設施。","note":"限制產業園區社區用地不得出售供興建住宅，以利政府推動社福建設及社會住宅之用地取得。"}],"changed":false,"final":"中央主管機關或直轄市、縣（市）主管機關開發之產業園區內土地、建築物及設施，應分別依下列規定使用、收益或處分；其使用、收益或處分之計價，由開發產業園區之各該主管機關審定。但資金全部由受託之公民營事業籌措者，依委託開發契約規定辦理：\n一、產業用地及其地上之建築物，由開發產業園區之各該主管機關辦理租售、設定地上權或依其他經中央主管機關核定之方式處理。\n二、社區用地，由開發產業園區之各該主管機關，依序依下列方式處理：\n(一)配售予被價購或徵收之土地或房屋所有權人。\n(二)出售予園區內企業興建員工住宅及售供員工興建住宅使用。\n(三)出售供興建住宅使用。\n三、公共設施用地、公共建築物及設施，由開發產業園區之各該主管機關辦理租售、設定負擔、收益或無償提供使用。\n前項第二款第一目房屋所有權人，以依第四十一條第一項公告停止所有權移轉之日前，已辦竣戶籍登記者為限。\n辦理第一項土地、建築物與設施使用、收益或處分之程序、條件及其他相關事項之辦法，由中央主管機關定之。\n中央主管機關或直轄市、縣（市）主管機關開發之產業園區內土地，為配合國家經濟發展政策，得按區位、承購對象、出售價格及相關條件，報行政院專案核准出售，並得由承購土地者，依可行性規劃報告完成興建相關公共設施。","finalWhy":null,"review":{"note":"保留，送院會處理","text":""}},{"no":"第四十六條之一","current":"由中央主管機關或直轄市、縣（市）主管機關開發設置之產業園區，土地所有權人無正當理由已持續閒置土地相當期間，除與主管機關另有契約約定或依相關規定處理者外，如符合中央主管機關所定閒置土地認定基準，各該主管機關得公告及通知土地所有權人及利害關係人，於二年期限內依法完成建築使用；各該主管機關並得隨時輔導土地所有權人及利害關係人於期限內依法完成建築使用。\n各該主管機關依前項規定限期完成建築使用時，應囑託土地登記機關辦理註記登記。二年期間不因土地所有權移轉而中斷，效力仍及於繼受人。土地所有權人因有不可歸責之事由致遲誤之期間，應予扣除，如有正當理由者，並得請求延展之。\n於前二項期限內依法完成建築使用者，各該主管機關應囑託土地登記機關辦理塗銷註記登記；屆期未完成建築使用者，各該主管機關得處以土地所有權人該閒置土地當期公告現值總額百分之十以下之罰鍰，並得通知土地所有權人於一個月內提出改善計畫。各該主管機關於接獲改善計畫後得通知土地所有權人進行協商，土地所有權人應於接獲進行協商之通知日起一個月內完成協商。土地所有權人未遵期提出改善計畫或屆期未與各該主管機關完成協商者，各該主管機關基於促進產業園區用地合於立法目的使用及發展國家經濟防止土地囤積之公共利益，得作成書面處分並載明該閒置土地依查估市價審定之合理價格後，予以公開強制拍賣。\n前項強制拍賣，各該主管機關囑託法務部行政執行署所屬各分署辦理之，其程序除本條另有規定外，準用行政執行法之規定。\n前二項強制拍賣之閒置土地，如投標無效、應買人所出之最高價未達查估市價審定之合理價格，或不符合其他拍賣條件者，不得拍定。\n前項情形，各該主管機關得以同一或另定合理價格，依前三項規定囑託重行拍賣。\n經拍定之土地，不適用土地法或其他法令關於優先承買之規定，並應由法務部行政執行署所屬各分署通知土地登記機關塗銷註記登記、他項權利登記與限制登記，及除去租賃後，點交予拍定人。各該主管機關認無繼續拍賣之必要時，得向法務部行政執行署所屬各分署撤回囑託，並囑託土地登記機關塗銷註記登記。\n前七項閒置土地與完成建築使用認定基準、公告及通知事項、不可歸責事由扣除期間與請求延展期間之事由、囑託登記之事項、查估市價審定之方法、程序及應遵行事項、強制拍賣應買人之資格及應遵守取得土地之使用條件等相關事項之辦法，由中央主管機關定之。","versions":[{"bill":"202110034270000","text":"由中央主管機關或直轄市、縣（市）主管機關開發設置之產業園區，土地所有權人無正當理由已持續閒置土地相當期間，除與主管機關另有契約約定或依相關規定處理者外，如符合中央主管機關所定閒置土地認定基準，各該主管機關得公告及通知土地所有權人及利害關係人，於二年期限內依法完成建築使用；各該主管機關並得隨時輔導土地所有權人及利害關係人於期限內依法完成建築使用。\n各該主管機關依前項規定限期完成建築使用時，應囑託土地登記機關辦理註記登記。二年期間不因土地所有權移轉而中斷，效力仍及於繼受人。土地所有權人因有不可歸責之事由致遲誤之期間，應予扣除，如有正當理由者，並得請求延展之，延展期限不得超過二年，並以一次為限。\n於前二項期限內依法完成建築使用者，各該主管機關應囑託土地登記機關辦理塗銷註記登記；屆期未完成建築使用者，各該主管機關得處以土地所有權人該閒置土地當期公告現值總額百分之十以下之罰鍰，並得通知土地所有權人於一個月內提出改善計畫。各該主管機關於接獲改善計畫後得通知土地所有權人進行協商，土地所有權人應於接獲進行協商之通知日起一個月內完成協商。土地所有權人未遵期提出改善計畫或屆期未與各該主管機關完成協商者，各該主管機關基於促進產業園區用地合於立法目的使用及發展國家經濟防止土地囤積之公共利益，得作成書面處分並載明該閒置土地依查估市價審定之合理價格後，予以公開強制拍賣。\n前項強制拍賣，各該主管機關囑託法務部行政執行署所屬各分署辦理之，其程序除本條另有規定外，準用行政執行法之規定。\n前二項強制拍賣之閒置土地，如投標無效、應買人所出之最高價未達查估市價審定之合理價格，或不符合其他拍賣條件者，不得拍定。\n前項情形，各該主管機關得以同一或另定合理價格，依前三項規定囑託重行拍賣。\n經拍定之土地，不適用土地法或其他法令關於優先承買之規定，並應由法務部行政執行署所屬各分署通知土地登記機關塗銷註記登記、他項權利登記與限制登記，及除去租賃後，點交予拍定人。各該主管機關認無繼續拍賣之必要時，得向法務部行政執行署所屬各分署撤回囑託，並囑託土地登記機關塗銷註記登記。\n前七項閒置土地與完成建築使用認定基準、公告及通知事項、不可歸責事由扣除期間與請求延展期間之事由、囑託登記之事項、查估市價審定之方法、程序及應遵行事項、強制拍賣應買人之資格及應遵守取得土地之使用條件等相關事項之辦法，由中央主管機關定之。","note":"為避免取得土地後，利用低成本獲得正當理由證明，進而長期持有並閒置產業園區土地，形同養地，增加完成建築使用期限延展限制，延展期限不得超過二年，並以一次為限。"}],"changed":false,"final":"由中央主管機關或直轄市、縣（市）主管機關開發設置之產業園區，土地所有權人無正當理由已持續閒置土地相當期間，除與主管機關另有契約約定 外，按其應申報或短計之所得金額，處公司負責人百分之十之罰鍰，但最高不得超過新臺幣五十萬元，最低不得少於新臺幣五萬元；逾期自動申報或填發者，處新臺幣五萬元以上五十萬元以下罰鍰。\n經稅捐稽徵機關限期責令補報或填發，公司未依限補報或填發者，處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、第一項增訂列單申報期間遇連續三日以上國定假日者延長五日之規定。以因應配合稅務實務作業之情形，並參考所得稅法第八十九條第三項規定。\n二、修正第一項及第二項，將應處罰鍰之對象由公司負責人，修正為公司。另配合一百十三年八月七日修正公布所得稅法之優化扣繳制度所訂，將按所得金額之固定比率計算罰鍰及自動補報或填發者固定減半處罰規定，修正為按原罰鍰上限、下限金額處罰。"},{"bill":"202110099000000","text":"適用第十二條之一、第十二條之二及第十九條之一者，公司應於股東轉讓或辦理帳簿劃撥之年度、或緩課期間屆滿年度之次年度一月三十一日前，依規定格式向該管稅捐稽徵機關列單申報該已轉讓、辦理帳簿劃撥或屆期尚未轉讓之股份資料；該次年度一月遇連續三日以上國定假日者，列單申報期間延長至二月五日止；其未依限或未據實申報者，稅捐稽徵機關除限期責令補報或填發外，處新臺幣五萬元以上五十萬元以下罰鍰。\n經稅捐稽徵機關限期責令補報或填發，公司未依限補報或填發者，處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、參考所得稅法第八十九條第三項規定及配合實務作業需要，第一項增訂列單申報期間遇連續三日以上國定假日者延長五日之規定。\n二、配合一百十三年八月七日修正公布所得稅法之優化扣繳制度規定，修正第一項及第二項，說明如下：\n(一)將應處罰鍰之對象由公司負責人，修正為公司。\n(二)將按所得金額之固定比率計算罰鍰及自動補報或填發者固定減半處罰規定，修正為按原罰鍰上限、下限金額處罰。至具體處罰之裁量基準，將另予規範。"}],"changed":false,"final":"適用第十二條之一、第十二條之二及第十九條之一者，公司應於股東轉讓或辦理帳簿劃撥之年度、或緩課期間屆滿年度之次年度一月三十一日前，依規定格式向該管稅捐稽徵機關列單申報該已轉讓、辦理帳簿劃撥或屆期尚未轉讓之股份資料；該次年度一月遇連續三日以上國定假日者，列單申報期間延長至二月五日止；其未依限或未據實申報者，稅捐稽徵機關除限期責令補報或填發外，處新臺幣五萬元以上五十萬元以下罰鍰。\n經稅捐稽徵機關限期責令補報或填發，公司未依限補報或填發者，處新臺幣十萬元以上一百萬元以下罰鍰。","finalWhy":null,"review":null},{"no":"第六十七條之二","current":"適用第二十三條之一規定之事業有下列各款情形之一，由稅捐稽徵機關分別依各該款規定處罰：\n一、違反所得稅法第七十一條規定，未依限辦理結算申報，而已依同法第七十九條第一項規定補辦結算申報者，應依稅捐稽徵機關調查核定之所得額，按當年度適用之營利事業所得稅稅率計算之金額另徵百分之十滯報金。但最高不得超過新臺幣三萬元，最低不得少於新臺幣一千五百元。\n二、逾所得稅法第七十九條第一項規定之補報期限，仍未辦理結算申報者，應依稅捐稽徵機關調查核定之所得額，按當年度適用之營利事業所得稅稅率計算之金額另徵百分之二十怠報金。但最高不得超過新臺幣九萬元，最低不得少於新臺幣四千五百元。\n三、已依所得稅法規定辦理結算、決算或清算申報，有短漏報依所得稅法規定之課稅所得額者，應就稅捐稽徵機關核定短漏之課稅所得額，按當年度適用之營利事業所得稅稅率計算之金額，處以二倍以下之罰鍰。\n四、未依所得稅法規定自行辦理結算、決算或清算申報，而經稅捐稽徵機關調查，有短漏報依所得稅法規定計算之課稅所得額者，應就稅捐稽徵機關核定短漏之課稅所得額，按當年度適用之營利事業所得稅稅率計算之金額，處三倍以下之罰鍰。\n五、未依有限合夥法第二十八條第二項規定之盈餘分配比例計算各合夥人營利所得額者，應按其計算之所得額與依規定計算所得額之差額，處百分之五之罰鍰。但最高不得超過新臺幣三十萬元，最低不得少於新臺幣一萬五千元。\n六、未依限或未據實填發第二十三條之一第七項規定文件者，處新臺幣七千五百元之罰鍰，並通知限期填發；屆期未填發或未據實填發者，應按未填發文件之所得額，處百分之五之罰鍰，但最高不得超過新臺幣三十萬元，最低不得少於新臺幣一萬五千元。\n第二十三條之一第八項規定之扣繳義務人有下列各款情形之一，由稅捐稽徵機關分別依各該款規定處罰：\n一、未依第二十三條之一第八項規定扣繳稅款者，除限期責令補繳應扣未扣或短扣之稅款及補報扣繳憑單外，並按應扣未扣或短扣之稅額處一倍以下之罰鍰；其未於限期內補繳應扣未扣或短扣之稅款，或不按實補報扣繳憑單者，應按應扣未扣或短扣之稅額處三倍以下之罰鍰。\n二、已依第二十三條之一第八項規定扣繳稅款，而未依同項規定之期限按實申報或填發扣繳憑單者，除限期責令補報或填發外，應按扣繳稅額處百分之二十之罰鍰，但最高不得超過新臺幣二萬元，最低不得少於新臺幣一千五百元；逾期自動申報或填發者，減半處罰。經稅捐稽徵機關限期責令補報或填發扣繳憑單，扣繳義務人未依限按實補報或填發者，應按扣繳稅額處三倍以下之罰鍰，但最高不得超過新臺幣四萬五千元，最低不得少於新臺幣三千元。\n三、逾第二十三條之一第八項規定期限繳納所扣稅款者，每逾二日加徵百分之一滯納金。","versions":[{"bill":"202110086560000","text":"適用第二十三條之一規定之事業有下列各款情形之一，由稅捐稽徵機關分別依各該款規定處罰：\n一、違反所得稅法第七十一條規定，未依限辦理結算申報，而已依同法第七十九條第一項規定補辦結算申報者，應依稅捐稽徵機關調查核定之所得額，按當年度適用之營利事業所得稅稅率計算之金額另徵百分之十滯報金。但最高不得超過新臺幣三萬元，最低不得少於新臺幣一千五百元。\n二、逾所得稅法第七十九條第一項規定之補報期限，仍未辦理結算申報者，應依稅捐稽徵機關調查核定之所得額，按當年度適用之營利事業所得稅稅率計算之金額另徵百分之二十怠報金。但最高不得超過新臺幣九萬元，最低不得少於新臺幣四千五百元。\n三、已依所得稅法規定辦理結算、決算或清算申報，有短漏報依所得稅法規定之課稅所得額者，應就稅捐稽徵機關核定短漏之課稅所得額，按當年度適用之營利事業所得稅稅率計算之金額，處以二倍以下之罰鍰。\n四、未依所得稅法規定自行辦理結算、決算或清算申報，而經稅捐稽徵機關調查，有短漏報依所得稅法規定計算之課稅所得額者，應就稅捐稽徵機關核定短漏之課稅所得額，按當年度適用之營利事業所得稅稅率計算之金額，處三倍以下之罰鍰。\n五、未依有限合夥法第二十八條第二項規定之盈餘分配比例計算各合夥人營利所得額者，應按其計算之所得額與依規定計算所得額之差額，處百分之五之罰鍰。但最高不得超過新臺幣三十萬元，最低不得少於新臺幣一萬五千元。\n六、未依限或未據實填發第二十三條之一第六項規定文件者，處新臺幣七千五百元之罰鍰，並通知限期填發；屆期未填發或未據實填發者，應按未填發文件之所得額，處百分之五之罰鍰，但最高不得超過新臺幣三十萬元，最低不得少於新臺幣一萬五千元。\n第二十三條之一第七項規定之扣繳義務人有下列各款情形之一，由稅捐稽徵機關分別依各該款規定處罰：\n一、未依第二十三條之一第七項規定扣繳稅款者，除限期責令補繳應扣未扣或短扣之稅款及補報扣繳憑單外，並按應扣未扣或短扣之稅額處一倍以下之罰鍰；其未於限期內補繳應扣未扣或短扣之稅款，或不按實補報扣繳憑單者，應按應扣未扣或短扣之稅額處三倍以下之罰鍰。\n二、已依第二十三條之一第七項規定扣繳稅款，而未依同項規定之期限按實申報或填發扣繳憑單者，除限期責令補報或填發外，應按扣繳稅額處百分之二十之罰鍰，但最高不得超過新臺幣二萬元，最低不得少於新臺幣一千五百元；逾期自動申報或填發者，減半處罰。經稅捐稽徵機關限期責令補報或填發扣繳憑單，扣繳義務人未依限按實補報或填發者，應按扣繳稅額處三倍以下之罰鍰，但最高不得超過新臺幣四萬五千元，最低不得少於新臺幣三千元。\n三、逾第二十三條之一第七項規定期限繳納所扣稅款者，每逾二日加徵百分之一滯納金。","note":"配合修正條文第二十三條之一，修正第一項第六款、第二項序文及各款引用之條文項次；第一項第一款至第五款內容未修正。"},{"bill":"202110086570000","text":"適用第二十三條之一規定之事業有下列各款情形之一，由稅捐稽徵機關分別依各該款規定處罰：\n一、違反所得稅法第七十一條規定，未依限辦理結算申報，而已依同法第七十九條第一項規定補辦結算申報者，應依稅捐稽徵機關調查核定之所得額，按當年度適用之營利事業所得稅稅率計算之金額另徵百分之十滯報金。但最高不得超過新臺幣三萬元，最低不得少於新臺幣一千五百元。\n二、逾所得稅法第七十九條第一項規定之補報期限，仍未辦理結算申報者，應依稅捐稽徵機關調查核定之所得額，按當年度適用之營利事業所得稅稅率計算之金額另徵百分之二十怠報金。但最高不得超過新臺幣九萬元，最低不得少於新臺幣四千五百元。\n三、已依所得稅法規定辦理結算、決算或清算申報，有短漏報依所得稅法規定之課稅所得額者，應就稅捐稽徵機關核定短漏之課稅所得額，按當年度適用之營利事業所得稅稅率計算之金額，處以二倍以下之罰鍰。\n四、未依所得稅法規定自行辦理結算、決算或清算申報，而經稅捐稽徵機關調查，有短漏報依所得稅法規定計算之課稅所得額者，應就稅捐稽徵機關核定短漏之課稅所得額，按當年度適用之營利事業所得稅稅率計算之金 <script>

const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],

const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);
  fillBench($('bench'), a);
}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }
  const bench = el('div', {class: 'bench'});
  panel.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;

    if (!hits.length) return;

    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;

    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
