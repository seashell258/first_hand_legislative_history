<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>環境影響評估法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"環境影響評估法","version":"03716:2025-11-14-修正","date":"2025-11-14","action":"修正","title":"環境影響評估法　2025 年修正","lede":"","summary":"","key":"03716_2025-11-14","props":[{"id":"202110157090000","who":"台灣民眾黨黨團","date":"2025-08-29","name":"「環境影響評估法第五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110157090000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/09/LCEWA01_110409_00204.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"本院台灣民眾黨黨團，有鑑於近年太陽光電發電系統屢傳破壞環境，山也光電板、海也光電板，但多數光電案場卻不須實施環境影響評估，環境部長期不作為、怠忽職守，直至2025年1月才修改《開發行為應實施環境影響評估細目及範圍認定標準》擴大太陽光電發電系統應實施環境影響評估之範圍，惟現行標準仍有漏洞，不僅水面型太陽光電發電系統不須實施環境影響評估，甚至部分區位經主管機關同意者，亦不須實施環境影響評估，有開後門之嫌。為避免太陽光電發電系統一再破壞國土，有必要將太陽光電發電系統應實施環境影響評估之範圍提升至法律位階，並擴大應實施環境影響評估之範圍，爰擬具「環境影響評估法第五條條文修正草案」。是否有當？敬請公決。","arts":["第五條"]},{"id":"202110173210000","who":"委員盧縣一等16人","date":"2025-11-14","name":"「環境影響評估法第三條及第五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110173210000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/09/LCEWA01_110409_00205.pdf","proposers":["盧縣一","林沛祥"],"ncosign":14,"people":[["盧縣一","國民黨","提案"],["林沛祥","國民黨","提案"],["顏寬恒","國民黨","連署"],["鄭正鈐","國民黨","連署"],["謝龍介","國民黨","連署"],["黃仁","國民黨","連署"],["林倩綺","國民黨","連署"],["林德福","國民黨","連署"],["許宇甄","國民黨","連署"],["涂權吉","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["丁學忠","國民黨","連署"],["翁曉玲","國民黨","連署"],["黃建賓","國民黨","連署"],["陳超明","無黨籍","連署"],["羅智強","國民黨","連署"]],"party":[["國民黨",15],["無黨籍",1]],"reason":"本院委員盧縣一、林沛祥等16人，為改善現行環境影響評估機制，爰擬具「環境影響評估法第三條及第五條條文修正草案」。是否有當？敬請公決。","arts":["第三條","第五條"]}],"arts":[{"no":"第三條","current":"各級主管機關為審查環境影響評估報告有關事項，應設環境影響評估審查委員會（以下簡稱委員會）。\n前項委員會任期二年，其中專家學者不得少於委員會總人數三分之二。目的事業主管機關為開發單位時，目的事業主管機關委員應迴避表決。\n中央主管機關所設之委員會，其組織規程，由行政院環境保護署擬訂，報請行政院核定後發布之。\n直轄市主管機關所設之委員會，其組織規程，由直轄市主管機關擬訂，報請權責機關核定後發布之。\n縣（市）主管機關所設之委員會，其組織規程，由縣（市）主管機關擬訂，報請權責機關核定後發布之。","versions":[{"bill":"202110173210000","text":"各級主管機關為審查環境影響評估報告有關事項，應設環境影響評估審查委員會（以下簡稱委員會）。\n前項委員會任期二年，其中專家學者不得少於委員會總人數三分之二，審查案件涉及原住民族土地時，應至少聘任一名具有原住民族領域相關專業背景者。目的事業主管機關為開發單位時，目的事業主管機關委員應迴避表決。\n中央主管機關所設之委員會，其組織規程，由環境部擬訂，報請行政院核定後發布之。\n直轄市主管機關所設之委員會，其組織規程，由直轄市主管機關擬訂，報請權責機關核定後發布之。\n縣（市）主管機關所設之委員會，其組織規程，由縣（市）主管機關擬訂，報請權責機關核定後發布之。","note":"一、修正第二項。\n二、現行環境影響評估審查委員會僅規範委員會任期及專家學者比例，但審查案件涉及原住民族土地時，卻未有原住民族代表，恐欠缺代表性，故增列「應至少聘任一名具有原住民族相關專業背景者」補足制度之不足，且符合《原住民族基本法》第二十一條意旨，確保涉及原住民族土地資源開發案，於審查中有相當之代表，以強化程序正當性。"}],"changed":false,"final":"各級主管機關為審查環境影響評估報告有關事項，應設環境影響評估審查委員會（以下簡稱委員會）。\n前項委員會任期二年，其中專家學者不得少於委員會總人數三分之二。目的事業主管機關為開發單位時，目的事業主管機關委員應迴避表決。\n中央主管機關所設之委員會，其組織規程，由行政院環境保護署擬訂，報請行政院核定後發布之。\n直轄市主管機關所設之委員會，其組織規程，由直轄市主管機關擬訂，報請權責機關核定後發布之。\n縣（市）主管機關所設之委員會，其組織規程，由縣（市）主管機關擬訂，報請權責機關核定後發布之。","finalWhy":null,"review":null},{"no":"第五條","current":"下列開發行為對環境有不良影響之虞者，應實施環境影響評估：\n一、工廠之設立及工業區之開發。\n二、道路、鐵路、大眾捷運系統、港灣及機場之開發。\n三、土石採取及探礦、採礦。\n四、蓄水、供水、防洪排水工程之開發。\n五、農、林、漁、牧地之開發利用。\n六、遊樂、風景區、高爾夫球場及運動場地之開發。\n七、文教、醫療建設之開發。\n八、新市區建設及高樓建築或舊市區更新。\n九、環境保護工程之興建。\n十、核能及其他能源之開發及放射性核廢料儲存或處理場所之興建。\n十一、其他經中央主管機關公告者。\n前項開發行為應實施環境影響評估者，其認定標準、細目及環境影響評估作業準則，由中央主管機關會商有關機關於本法公布施行後一年內定之，送立法院備查。","versions":[{"bill":"202110157090000","text":"下列開發行為對環境有不良影響之虞者，應實施環境影響評估：\n一、工廠之設立及工業區之開發。\n二、道路、鐵路、大眾捷運系統、港灣及機場之開發。\n三、土石採取及探礦、採礦。\n四、蓄水、供水、防洪排水工程之開發。\n五、農、林、漁、牧地之開發利用。\n六、遊樂、風景區、高爾夫球場及運動場地之開發。\n七、文教、醫療建設之開發。\n八、新市區建設及高樓建築或舊市區更新。\n九、環境保護工程之興建。\n十、核能及其他能源之開發及放射性核廢料儲存或處理場所之興建。\n十一、其他經中央主管機關公告者。\n前項開發行為應實施環境影響評估者，其認定標準、細目及環境影響評估作業準則，由中央主管機關會商有關機關於本法公布施行後一年內定之，送立法院備查。\n設置太陽光電發電系統符合下列規定之一者，應依第五條及第八條實施環境影響評估：\n一、位於國家公園、國家風景區或脆弱敏感區域。\n二、位於野生動物保護區或野生動物重要棲息環境。\n三、位於重要濕地。\n四、位於臺灣沿海地區自然環境保護計畫核定公告之自然保護區。\n五、位於特定農業區之農業用地。\n六、位於政府核定補助或獎勵實施造林之土地，屬國有土地、公有土地、國營事業土地或公營事業土地者。\n七、位於山坡地，設置或累積設置裝置容量一萬瓩以上，或設置或累積設置面積五公頃以上。\n八、位於山坡地之申請設置太陽光電發電系統，符合下列規定之一，其申請設置或累積設置之面積應合併計算，且達前款規定規模：\n(一)申請設置或累積設置用地位於同一筆地號。\n(二)申請設置或累積設置用地之地號互相連接或僅間隔道路、渠道、排水路等公共設施。\n(三)申請設置或累積設置用地邊界相隔水平距離在二十公尺範圍內。\n九、設置水面型太陽光電系統，且設置或累積設置裝置容量一萬瓩以上，或設置或累積設置面積五公頃以上。\n十、設置或累積設置裝置容量二萬瓩以上，或設置或累積設置面積十公頃以上。\n前項太陽光電發電系統，不含屋頂型太陽光電系統。","note":"有鑑於近年太陽光電發電系統屢傳破壞環境卻不須實施環境影響評估，環境部長期不作為、怠忽職守，直至2025年1月才修改《開發行為應實施環境影響評估細目及範圍認定標準》第二十九條第一項第七款，擴大太陽光電發電系統應實施環境影響評估之範圍，惟現行標準仍有漏洞，不僅水面型太陽光電發電系統不須實施環境影響評估，甚至「屬其他開發行為之附屬設施且經各目的事業主管機關確認者」、「位於政府核定補助或獎勵實施造林之土地，屬國有土地、公有土地、國營事業土地或公營事業土地，經能源主管機關同意者」亦不須實施環境影響評估，有開後門之嫌。為避免太陽光電發電系統一再破壞國土，有必要將太陽光電發電系統應實施環境影響評估之範圍提升至法律位階，並擴大範圍，爰新增第三項及第四項之規定。"},{"bill":"202110173210000","text":"下列開發行為對環境有不良影響之虞者，應實施環境影響評估：\n一、工廠之設立及工業區之開發。\n二、道路、鐵路、大眾捷運系統、港灣及機場之開發。\n三、土石採取及探礦、採礦。\n四、蓄水、供水、防洪排水工程之開發。\n五、農、林、漁、牧地之開發利用。\n六、遊樂、風景區、高爾夫球場及運動場地之開發。\n七、文教、醫療建設之開發。\n八、新市區建設及高樓建築或舊市區更新。\n九、環境保護工程之興建。\n十、核能及其他能源之開發及放射性核廢料儲存或處理場所之興建。\n十一、於溼地、埤塘、滯洪池、水庫及魚塭等水域空間，進行太陽光電發電系統之開發。\n十二、其他經中央主管機關公告者。\n前項開發行為應實施環境影響評估者，其認定標準、細目及環境影響評估作業準則，由中央主管機關會商有關機關於本法公布施行後一年內定之，送立法院備查。","note":"一、新增第一項第十一款，依據環境部「開發行為應實施環境影響評估細目及範圍認定標準」，我國開發核能電廠、火力電廠、水力電廠、風力電廠及太陽光電，皆須進行環評，能源開發種類繁多，但對於濕地、水庫等水域空間之太陽能光電系統開發，卻缺少環評機制審查，實有不足。\n二、且立柱型太陽能光電如在農地、魚塭等非都市土地上大規模設置，將引發許多土地問題，包括：農地破碎化流失、影響農業生產、與漁業、養殖業衝突，及生態環境潛在風險。為解決這些問題，政府限制單一農地不得低於2公頃才能申請，並優先開發不利耕作區、屋頂等地區，顯見太陽能光電發電系統並非毫無風險，實有環評之必要。\n三、原第十一款改列第十二款。"}],"changed":true,"final":"下列開發行為對環境有不良影響之虞者，應實施環境影響評估：\n一、工廠之設立及工業區之開發。\n二、道路、鐵路、大眾捷運系統、港灣及機場之開發。\n三、土石採取及探礦、採礦。\n四、蓄水、供水、防洪排水工程之開發。\n五、農、林、漁、牧地之開發利用。\n六、遊樂、風景區、高爾夫球場及運動場地之開發。\n七、文教、醫療建設之開發。\n八、新市區建設及高樓建築或舊市區更新。\n九、環境保護工程之興建。\n十、核能及其他能源之開發及放射性核廢料儲存或處理場所之興建。\n十一、其他經中央主管機關公告者。\n前項開發行為應實施環境影響評估者，其認定標準、細目及環境影響評估作業準則，由中央主管機關會商有關機關於本法公布施行後一年內定之，送立法院備查。\n設置太陽光電發電系統符合下列規定之一者，應實施環境影響評估：\n一、位於國家風景區或經劃定之地質遺跡地質敏感區、山崩與地滑地質敏感區。\n二、位於野生動物保護區或野生動物重要棲息環境。\n三、位於重要濕地。\n四、位於臺灣沿海地區自然環境保護計畫核定公告之自然保護區。\n五、位於特定農業區之農業用地。\n六、位於政府核定補助或獎勵實施造林之土地，屬國有土地、公有土地、國營事業土地或公營事業土地者。\n七、位於山坡地，設置或累積設置裝置容量一萬瓩以上，或設置或累積設置面積五公頃以上。\n八、設置水面型太陽光電系統，且設置或累積設置裝置容量一萬瓩以上，或設置或累積設置面積五公頃以上。\n九、設置或累積設置裝置容量四萬瓩以上，或設置或累積設置面積四十公頃以上。\n十、第七款至第九款之申請設置太陽光電發電系統，符合下列規定之一，其申請設置或累積設置之面積應合併計算，且達該款規定規模：\n(一)申請設置或累積設置用地位於同一筆地號。\n(二)申請設置或累積設置用地之地號互相連接或僅間隔道路、渠道、排水路等公共設施。\n(三)申請設置或累積設置用地邊界相隔水平距離在二十公尺範圍內。\n前項太陽光電發電系統，不含下列情形：\n一、屋頂型太陽光電發電系統。\n二、屬其他開發行為之附屬設施且經各目的事業主管機關確認之太陽光電發電系統。\n三、設置面積一百平方公尺以下且供自用之太陽光電發電系統。","finalWhy":"一、有鑑於近年太陽光電發電系統屢傳破壞環境卻不須實施環境影響評估，環境部長期不作為、怠忽職守，直至2025年1月才修改《開發行為應實施環境影響評估細目及範圍認定標準》第二十九條第一項第七款，擴大太陽光電發電系統應實施環境影響評估之範圍，惟現行標準仍有漏洞，不僅水面型太陽光電發電系統不須實施環境影響評估，甚至「屬其他開發行為之附屬設施且經各目的事業主管機關確認者」、「位於政府核定補助或獎勵實施造林之土地，屬國有土地、公有土地、國營事業土地或公營事業土地，經能源主管機關同意者」亦不須實施環境影響評估，有開後門之嫌。另依現行國家公園法之規定，並未列舉許可設置地面型或水面型太陽光電發電系統，且內政部國家公園署長王成機於一百十四年十一月十三日立法院黨團協商會議時表示，未來國家公園署也不會依據國家公園法第十四條第一項第十款同意設置地面型或水面型太陽光電發電系統，既無設置之可能，即無環境影響評估之必要。為避免太陽光電發電系統一再破壞國土，有必要將太陽光電發電系統應實施環境影響評估之範圍提升至法律位階，並擴大範圍，爰新增第三項之規定。\n二、為避免對較無環境疑慮之小型或自用太陽光電發電系統課予高強度環境影響評估之義務，爰新增第四項，明定前項太陽光電發電系統不含「屋頂型太陽光電系統」、「屬其他開發行為之附屬設施且經各目的事業主管機關確認之太陽光電發電系統」或「設置面積一百平方公尺以下之太陽光電發電系統」。","review":null}],"stages":[{"date":"2025-08-29","stage":"一讀","code":"院會-11-3-27","bill":"202110157090000","gazref":"114卷075期5368號一冊 6-6頁"},{"date":"2025-11-13","code":"黨團協商-2025110550","title":"立法院朝野黨團協商","gazref":"114卷097期5390號 437-459頁","stage":"黨團協商","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2025110550/details?meetingDate=114/11/13","full":["https://ivod.ly.gov.tw/Play/Full/1M/17035"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/114/97/LCIDC01_1149701.pdf","p1":437,"p2":460}],"clips":[],"props":["202110157090000"],"tr":"tr/1.json","note":null,"mixed":["發展觀光條例","國家公園法","地質法"],"nspeak":13,"nmem":8,"ntable":0,"nfold":0},{"date":"2025-11-14","stage":"一讀","code":"院會-11-4-9","bill":"202110173210000","gazref":"114卷094期5387號 20-20頁"},{"date":"2025-11-14","code":"黨團協商-2025111426","title":"立法院朝野黨團協商","gazref":"114卷093期5386號 399-413頁","stage":"黨團協商","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2025111426/details?meetingDate=114/11/14","full":["https://ivod.ly.gov.tw/Play/Full/1M/17037"],"pdf":[],"clips":[],"props":[],"tr":null,"note":null,"mixed":[]},{"date":"2025-11-14","code":"院會-11-4-9","title":"第11屆第4會期第9次會議","gazref":"114卷094期5387號 67-74頁；114卷094期5387號 74-90頁；114卷094期5387號 90-95頁；114卷094期5387號 94-94頁","stage":"二讀、三讀、附帶決議","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2025111293/details?meetingDate=114/11/14","full":["https://ivod.ly.gov.tw/Play/Full/1M/17036"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/commu <script>

};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],

function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };

    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
</html>
