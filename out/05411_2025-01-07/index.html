之出席，其決議應有出席董事過半數之同意。但前條第一款至第七款之決議，應有董事總人數過半數之同意。","note":"一、第一項明定董事會開會頻率、方式及由董事長擔任主席。\n二、第二項明定董事會決議方式。"},{"bill":"201110072960000","text":"董事會每三個月開會一次；必要時，得召開臨時會議，由董事長召集，並擔任主席。\n董事會會議應有過半數董事之出席，其決議應有出席董事過半數之同意。但前條第一款至第七款之決議，應有董事總人數過半數之同意。","note":"本條未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十三條","current":"監事之職權如下：\n一、業務、財務狀況之監督。\n二、財務帳冊、文件及財產資料之稽核。\n三、決算報告之審核。\n四、其他重大事項之審核及稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","versions":[{"bill":"201110072960000","text":"監事之職權如下：\n一、年度業務決算之審核。\n二、業務、財務狀況之監督。\n三、財務帳冊、文件及財產資料之稽核。\n四、其他重大事項之審核及稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","note":"一、為確實發揮本中心監事監督功能，第一項明定監事職權，包括各重大事項之審核、監督、稽核及其他重大事項之審核及稽核，以避免掛一漏萬。\n二、第二項明定監事職權行使方式及常務監事應列席董事會會議。"},{"bill":"201110072960000","text":"監事之職權如下：\n一、業務、財務狀況之監督。\n二、財務帳冊、文件及財產資料之稽核。\n三、決算報告之審核。\n四、其他重大事項之審核及稽核。\n監事單獨行使職權，常務監事應代表全體監事列席董事會會議。","note":"本條未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十四條","current":"董事、監事應遵守利益迴避原則，不得假借職務上權力、機會或方法，圖謀本人或關係人之利益；其利益迴避範圍及違反時處置之準則，由監督機關定之。\n董事、監事相互間，不得有或曾有配偶及三親等以內血親、姻親之關係。\n本條例所稱關係人，指配偶或二親等內之親屬。","versions":[{"bill":"201110072960000","text":"董事、監事相互間，不得有配偶及三親等以內血親、姻親之關係。","note":"董事、監事相互間，不得有配偶及三親等以內血親、姻親之關係，以避免形成濫用私人之現象。"},{"bill":"201110072960000","text":"董事、監事相互間，不得有或曾有配偶及三親等以內血親、姻親之關係。","note":"一、依利衝法第二條第一項第七款，「公法人之董事、監察人、首長、執行長與該等職務之人」屬該法所稱之公職人員，爰本中心董事、監事及執行長應適用利衝法有關利益迴避之相關規定。又同法第一條第二項規定，公職人員利益衝突之迴避，除其他法律另有嚴格規定者外，適用該法之規定。因利衝法就利益迴避之規定，較本條例有更嚴格之規定，爰將第一項前段利益迴避之規定，移列修正條文第十五條第一項，與現行第十五條第一項合併修正。\n二、因第一項前段利益迴避之規定移列整併至修正條文第十五條第一項，第一項後段有關違反利益迴避之處置，配合移列修正條文第十五條第三項後段。\n三、查利衝法第三條第一項所定關係人之範圍，較現行第三項有更嚴格之規定，且修正條文第十五條第一項已明定董事、監事、執行長及其關係人之利益迴避事項應適用利衝法之規定，則第三項已無規範之必要，爰予刪除。\n四、第二項未修正，並列為本條文。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十五條","current":"第一項　董事、監事應遵守利益迴避原則，不得假借職務上權力、機會或方法，圖謀本人或關係人之利益；其利益迴避範圍及違反時處置之準則，由監督機關定之。\n第十五條　董事、監事或其關係人，不得與本中心為買賣、租賃、承攬等交易行為。但有正當理由，經董事會特別決議者，不在此限。\n違反前項規定致本中心受有損害者，行為人應對其負損害賠償責任。\n第一項但書情形，本中心應將董事會特別決議內容，於會後二十日內主動公開之，並報監督機關備查。","versions":[{"bill":"201110072960000","text":"董事、監事、執行長及其關係人之利益迴避事項，依公職人員利益衝突迴避法之規定辦理。\n違反前項規定致本中心受有損害者，行為人應對其負損害賠償責任。\n第一項人員違反公職人員利益衝突迴避法之規定者，除依該法規定處罰外，監督機關並得為適當之處置；其處置規定，由監督機關定之。","note":"一、依公職人員利益衝突迴避法第二條第一項第七款規定，該法所稱公職人員，包括公法人之董事、監察人、首長、執行長與該等職務之人，爰於第一項明定董事、監事、執行長及其關係人，應依公職人員利益衝突迴避法之規定辦理。\n二、第二項明定違反第一項規定致本中心受有損害者，行為人應負損害賠償責任，以杜弊端。\n三、第三項明定第一項人員違反公職人員利益衝突迴避法之處置規定，由監督機關定之。"},{"bill":"201110072960000","text":"董事、監事、執行長及其關係人之利益迴避事項，依公職人員利益衝突迴避法之規定辦理。\n違反前項規定致本中心受有損害者，行為人應對其負損害賠償責任。\n第一項人員違反公職人員利益衝突迴避法之規定者，除依該法規定處罰外，監督機關並得為適當之處置；其處置規定，由監督機關定之。","note":"一、本條由現行第十四條第一項及第十五條整併規定。\n二、第一項由現行第十四條第一項前段及第十五條第一項整併修正。有關董事、監事特定交易行為之禁止，已於利衝法第十四條明文規定，且較本條例嚴格；又利衝法第二條第一項第七款業明定「本法所稱公職人員，其範圍如下：……七、公法人之董事、監察人、首長、執行長與該等職務之人。」並於同法第三條第一項明定關係人之範圍，故本中心董事、監事、執行長及其關係人屬利衝法之適用對象，爰修正明定本中心之董事、監事、執行長及其關係人之利益迴避事項應依利衝法規定辦理，並刪除現行第十五條第一項但書規定。\n三、第二項由現行第十五條第二項移列，內容未修正。\n四、第三項由現行第十四條第一項後段修正移列，考量利衝法就公職人員違反利衝法者，已定有罰則規定，本中心董事、監事、執行長及其關係人應適用利衝法之規定，違反利衝法時，自應依利衝法之罰則規定予以處罰；此外，配合本中心之性質，尚有為其他處置（例如予以解聘等）之必要，爰明定違反利衝法時除依該法處罰外，監督機關並得為必要之處置，其相關規定由監督機關訂定之。\n五、配合現行第十五條第一項但書之刪除，現行第十五條第三項已無規定必要，爰予刪除。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十六條","current":"董事、常務監事應親自出席、列席董事會議，不得委託他人代理出席。","versions":[{"bill":"201110072960000","text":"董事、常務監事應親自出席、列席董事會會議，不得委託他人代理出席。","note":"為確保董事對於本中心業務執行及常務監事對本中心監督職能，明定董事、常務監事出席、列席董事會會議之方式。"},{"bill":"201110072960000","text":"董事、常務監事應親自出席、列席董事會會議，不得委託他人代理出席。","note":"酌作文字修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十七條","current":"本中心董事長、董事及監事，均為無給職。","versions":[{"bill":"201110072960000","text":"本中心之董事長得為專任或兼任，專任者之報酬由監督機關核定之；兼任者為無給職。\n本中心之董事、常務監事及監事，均為無給職。","note":"本中心除專任董事長外，其餘董事、常務監事及監事均為無給職。"},{"bill":"201110072960000","text":"本中心董事長、董事、常務監事及監事，均為無給職。","note":"考量常務監事亦為無給職，為利明確，爰予以增列。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十八條","current":"本中心置執行長一人，專任，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第一項、第二項前段、第三項、第四項、第十條第四項、第十四條、第十五條、第十九條第二項、第三項及第二十一條第六款有關董事及董事長之規定，於執行長準用之。","versions":[{"bill":"201110072960000","text":"本中心置執行長一人，專任，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第一項至第四項、第十條第四項、第十四條及第二十二條第六款有關董事及董事長之規定，於執行長準用之。","note":"一、本中心置執行長，人選由董事長推薦，又依第十一條第七款規定，執行長任免之同意須經董事會審議通過。又執行長應依法執行本中心業務及督導所屬人員，爰於第一項明定執行長之遴聘方式及職權。\n二、第二項明定執行長準用董事、董事長之相關規定。又以本中心執行長本為第十五條適用對象，並依第十九條第二項、第三項規定辦理，爰無須規定準用各該條項有關董事之規定，併予敘明。"},{"bill":"201110072960000","text":"本中心置執行長一人，專任，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第一項至第四項、第十條第四項、第十四條及第二十二條第六款有關董事及董事長之規定，於執行長準用之。","note":"一、第一項未修正。\n二、修正第二項：\n(一)考量實務運作之需，執行長亦有列席董事會之必要，爰修正明定第九條之準用範圍。\n(二)因修正條文第十五條第一項，已將執行長納入利衝法之適用對象，爰將第二項所定執行長準用第十五條之規定予以刪除，俾期周延。\n(三)配合修正條文第十九條第二項、第三項已明定本中心執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，且不得進用其配偶及三親等以內血親、姻親，擔任本中心職務，爰配合將現行條文所定「第十九條第二項、第三項」予以刪除。"},{"bill":"201110072960000","text":"本中心置執行長一人，專任，由董事長提請董事會通過後聘任之；解聘時，亦同。執行長依本中心規章、董事會之決議及董事長之授權，執行本中心業務，並督導所屬人員。\n第九條第一項至第四項、第十條第四項、第十四條及第二十一條第六款有關董事及董事長之規定，於執行長準用之。","note":"一、第一項未修正。\n二、配合修正條文第十九條第二項、第三項規定，已明定執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，且執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務，第二項無明定執行長應準用第十九條第二項、第三項有關董事、監事、董事長規定之必要，爰予以刪除。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十九條","current":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","versions":[{"bill":"201110072960000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事、執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長、執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","note":"一、第一項明定本中心進用人員依本中心人事管理規章辦理，渠等權利義務關係，應以契約約定，釐清本中心及進用人員之法律關係，並符合建制之目的。\n二、第二項明定董事、監事、執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，落實利益迴避原則，避免循私。\n三、鑑於董事長、執行長對於本中心進用人員有決定權，為避免循私，爰於第三項明定董事長、執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。"},{"bill":"201110072960000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事、執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長、執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","note":"一、第一項未修正。\n二、第二項增列明定執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，落實利益迴避原則，避免循私。\n三、除董事長外，執行長對於本中心進用人員亦有相當之決定權，為避免循私，爰於第三項增列明定執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。"},{"bill":"201110072960000","text":"本中心進用之人員，依本中心人事管理規章辦理，不具公務人員身分；其權利義務關係，應於契約中明定。\n董事、監事及執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務。\n董事長及執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。","note":"一、第一項未修正。\n二、第二項增列明定執行長之配偶及其三親等以內血親、姻親，不得擔任本中心總務、會計及人事職務，落實利益迴避原則，避免循私。\n三、除董事長外，執行長對於本中心進用人員亦有相當之決定權，為避免循私，爰於第三項增列明定執行長不得進用其配偶及三親等以內血親、姻親，擔任本中心職務。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十九條之一","current":null,"versions":[{"bill":"201110072960000","text":"本中心為應業務需要，得報請監督機關核准，依任務性質遴派專業人員駐境外辦事。","note":"一、本條新增。\n二、為應業務需要，明定本中心得經運動部核准後，派員駐境外辦事，至於派駐境外辦事之期間及方式，悉依任務需要定之，併予敘明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十條","current":null,"versions":[{"bill":"201110072960000","text":"本中心為應業務需要，得報請監督機關核准，依任務性質遴派專業人員駐境外辦事。","note":"為應業務需要，明定本中心經運動部核准後，派員駐境外辦事，至於派駐境外辦事之期間及方式，悉依任務需要定之，併予敘明。"},{"bill":"201110072960000","text":"本中心為應業務需要，得報請監督機關核准，依任務性質遴派專業人員駐境外辦事。","note":"一、本條新增。\n二、為應業務需要，明定本中心得經運動部核准後，派員駐境外辦事。至於派駐境外辦事之期間及方式，悉依任務需要定之，併予敘明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十一條","current":"本中心應擬訂發展目標及計畫，報請監督機關核定。\n本中心應訂定年度業務計畫及其預算，提經董事會通過後，報請監督機關備查。","versions":[{"bill":"201110072960000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度業務計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、依第十一條第一款規定，本中心發展目標及計畫係由董事會審議，爰第一項明定本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定，俾利本中心長遠、穩定之發展。\n二、依第十一條第二款及第三款規定，本中心年度業務計畫、年度預算及決算報告係由董事會審議，本中心應訂定年度業務計畫，因係於監督機關核定之發展目標（計畫）架構下每年訂定，與第一項計畫有所不同，為賦彈性，爰第二項規定該年度業務計畫及其預算經董事會通過後，報請監督機關備查。"},{"bill":"201110072960000","text":"本中心應擬訂發展目標及計畫，提經董事會通過後，報請監督機關核定。\n本中心應訂定年度業務計畫及其預算，提經董事會通過後，報請監督機關備查。","note":"一、條次變更。\n二、依第十一條第一款規定，發展目標及計畫之審議為董事會之職權，故本中心之發展目標及計畫，於報請監督機關核定前，應提經董事會通過，爰於第一項增列「提經董事會通過後」之規定。\n三、第二項未修正。"},{"bill":"201110072960000","text":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要處分。\n七、本中心違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、本中心遴派專業人員駐境外辦事之核准。\n十、其他依法律所為之監督。","note":"配合修正條文第十九條之一規定，增列第九款明定本中心遴派專業人員駐境外辦事之核准，為監督機關對本中心之監督權限事項，其後款次遞移，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十二條","current":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事之遴選及建議。\n六、董事、監事執行業務違反法令時，得為必要之處分。\n七、本中心違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、其他依法律所為之監督。","versions":[{"bill":"201110072960000","text":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要處分。\n七、本中心違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、本中心遴派專業人員駐境外辦事之核准。\n十、其他依法律所為之監督。","note":"監督機關對本中心之監督權限，包括財務、營運、人事、財產等監督，及於董事、監事於執行業務違反法令時，得為必要之處分。"},{"bill":"201110072960000","text":"監督機關對本中心之監督權限如下：\n一、發展目標及計畫之核定。\n二、規章、年度業務計畫與預算、年度執行成果及決算報告書之核定或備查。\n三、財產及財務狀況之檢查。\n四、業務績效之評鑑。\n五、董事、監事遴聘、解聘之建議。\n六、董事、監事於執行業務違反法令時，得為必要處分。\n七、本中心違反憲法、法律、法規命令時，予以撤銷、變更、廢止、限期改善、停止執行或其他處分。\n八、自有不動產處分或設定負擔之核可。\n九、本中心遴派專業人員駐境外辦事之核准。\n十、其他依法律所為之監督。","note":"一、條次變更。\n二、修正第五款至第七款，參考國家運動科學中心設置條例第二十一條第五款至第七款規定體例，酌作文字修正。\n三、配合修正條文第二十條規定，增列第九款明定本中心遴派專業人員駐境外辦事之核准，為監督機關對本中心之監督權限事項；其後款次遞移，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十三條","current":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本中心之績效評鑑；其學者專家及社會公正人士之人數不得少於二分之一。\n前項績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本中心年度執行成果之考核。\n二、本中心業務績效及目標達成率之評量。\n三、本中心年度自籌款比率達成率。\n四、本中心經費核撥之建議。\n五、其他有關事項。","versions":[{"bill":"201110072960000","text":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本中心之績效評鑑；其學者專家及社會公正人士之人數，不得少於二分之一。\n前項評鑑成員，任一性別不得少於總人數三分之一。\n第一項績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本中心年度執行成果之考核。\n二、本中心業務績效及目標達成率之評量。\n三、本中心年度自籌款比率達成率。\n四、本中心經費核撥之建議。\n五、其他有關事項。","note":"一、第一項明定監督機關應邀集有關機關（例如經濟部、國家科學及技術委員會或行政院公共工程委員會等）代表、學者專家及社會公正人士，辦理本中心績效評鑑，期評鑑結果更具公正性及客觀性。\n二、第二項明定評鑑成員之任一性別之保障比例。\n三、第三項授權監督機關訂定績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法。\n四、本中心公共事務之實施效能及權責是否相符，須有績效評鑑機制作為衡量依據。以本中心之績效評鑑，除評核其營運與效能及目標達成情形，作為監督機關未來核撥經費之參據外，亦透過評鑑機制對於本中心之營運給予指導，以確保其所負責之公共事務能適切實施並具有效能，爰於第四項明定績效評鑑內容，俾資依循。"},{"bill":"201110072960000","text":"監督機關應邀集有關機關代表、學者專家及社會公正人士，辦理本中心之績效評鑑；其學者專家及社會公正人士之人數，不得少於二分之一。\n前項評鑑成員，任一性別不得少於總人數三分之一。\n第一項績效評鑑之成員資格條件、遴聘程序、績效評鑑之方式、程序及其他相關事項之辦法，由監督機關定之。\n績效評鑑之內容如下：\n一、本中心年度執行成果之考核。\n二、本中心業務績效及目標達成率之評量。\n三、本中心年度自籌款比率達成率。\n四、本中心經費核撥之建議。\n五、其他有關事項。","note":"一、條次變更。\n二、第一項酌作標點符號修正。\n三、為明確評鑑成員之性別比例，俾促進性別平權，爰增列第二項，明定評鑑成員之任一性別不得少於總人數三分之一。\n四、第二項移列為第三項，並為使本條授權監督機關訂定之績效評鑑辦法內容及範圍明確，爰增列授權之內容，包括「績效評鑑之成員資格條件、遴聘程序」；另配合第二項之增列，將「前項」修正為「第一項」。\n五、第三項移列為第四項，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十四條","current":"本中心會計年度，應與政府會計年度一致。\n本中心之會計制度，依行政法人會計制度設置相關法規訂定。\n本中心財務報表，應委請會計師進行查核簽證。","versions":[{"bill":"201110072960000","text":"本中心會計年度，應與政府會計年度一致。\n本中心之會計制度，依行政法人會計制度設置相關法規訂定。\n本中心財務報表，應委請會計師進行查核簽證。","note":"一、第一項明定本中心會計年度，應與政府會計年度一致。\n二、第二項明定本中心會計制度，依行政法人會計制度設置相關法規訂定，期各行政法人機構之會計制度達一致性及衡平性之標準。\n三、第三項明定本中心財務報表之查核方式，以確保其財務報表之公正性及專業性。"},{"bill":"201110072960000","text":"本中心會計年度，應與政府會計年度一致。\n本中心之會計制度，依行政法人會計制度設置相關法規訂定。\n本中心財務報表，應委請會計師進行查核簽證。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十五條","current":"本中心於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提交董事會審議，並經全體監事通過後，報請監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","versions":[{"bill":"201110072960000","text":"本中心於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提交董事會審議，並經全體監事通過後，報請監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","note":"一、第一項明定本中心年度執行成果及決算報告書，報請監督機關備查及送審計機關之程序及期限。\n二、顧及審計機關對本中心之審計監督權，並兼顧其自主性，爰於第二項明定本中心決算報告，審計機關得審計，審計結果，得送監督機關等為必要之處理。"},{"bill":"201110072960000","text":"本中心於會計年度終了後三個月內，應將年度執行成果及決算報告書，委託會計師查核簽證，提交董事會審議，並經全體監事通過後，報請監督機關備查，並送審計機關。\n前項決算報告，審計機關得審計之；審計結果，得送監督機關或其他相關機關為必要之處理。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十六條","current":"本中心成立年度之政府核撥經費，得由監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","versions":[{"bill":"201110072960000","text":"本中心成立年度之政府核撥經費，得由監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","note":"考量本中心成立之年度，倘立法通過總預算案未及改以行政法人型態編列時，則預算執行時可能有跨單位預算、跨工作計畫及跨用途別執行之問題，為避免影響相關預算之執行，爰明定不受預算法流用限制。"},{"bill":"201110072960000","text":"本中心成立年度之政府核撥經費，得由監督機關在原預算範圍內調整因應，不受預算法第六十二條及第六十三條規定之限制。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十七條","current":"本中心設立時，因業務必要使用之公有不動產，由監督機關無償提供使用，設立時在興建中，於興建完成後為本中心業務必要使用之公有不動產者，亦同。因業務必要使用之公有動產，得由監督機關捐贈本中心或無償提供使用，採捐贈者，不適用預算法第二十五條、第二十六條、國有財產法第二十八條及第六十條相關規定。\n本中心設立後，因業務需要得價購公有不動產。土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項無償提供使用及前項之公有財產以外由本中心取得之財產，為自有財產。\n第一項無償提供使用及第三項公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關，不得任意處分。","versions":[{"bill":"201110072960000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項之公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制，其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關，不得任意處分。","note":"一、第一項：\n(一)明定本中心因業務必要使用之公有財產之取得方式及考量公有財產包括國有及地方所有之財產，爰規定不受土地法第二十五條規定「直轄市或縣（市）政府對於其所管公有土地，非經該管區內民意機關同意，並經行政院核准，不得處分或設定負擔或為超過十年期間之租賃。」國有財產法第二十八條規定「主管機關或管理機關對於公用財產不得為任何處分或擅為收益。但其收益不違背其事業目的或原定用途者，不在此限。」國有財產法第六十條規定「（第一項）在國外之國有財產，有贈與外國政府或其人民必要者，得層請行政院核准贈與之。（第二項）在國內之國有財產，其贈與行為以動產為限。但現為寺廟、教堂所使用之不動產，合於國人固有信仰，有贈與該寺廟、教堂依法成立之財團法人必要者，得贈與之。（第三項）前項贈與辦法，由行政院定之。」及地方政府公產管理法令相關規定之限制。\n(二)考量本中心為新設行政法人，須循預算程序成立後始正式運作，與原機關（構）改制之行政法人性質不同，無改制過渡期未及編列預算送立法院審議而須法規鬆綁，不受預算法第二十五條、第二十六條相關規定限制之情形，併予敘明。\n二、第二項明定本中心價購公有不動產之規定，並明定土地及地上建築改良物之價款計算基準。\n三、第三項明定以政府機關核撥經費指定用途所購置之財產，為公有財產。\n四、第四項明定自有財產範圍。\n五、第五項明定公有財產由本中心為管理者及收益列為本中心收入者，不受國有財產法第七條第一項規定「國有財產收益及處分，依預算程序為之；其收入應解國庫。」之限制，並由監督機關訂定其管理、使用、收益相關辦法。\n六、第六項明定公有財產用途廢止時，應移交各級政府公產管理機關接管。\n七、第七項明定本中心接受捐贈之公有不動產，於不需使用時之處理方式。"},{"bill":"201110072960000","text":"本中心因業務必要使用之公有財產，得價購或由政府機關採捐贈、出租或無償提供使用方式為之；採捐贈者，不受土地法第二十五條、國有財產法第二十八條、第六十條及地方政府公產管理法令相關規定之限制。\n前項價購公有土地之價款，以當期公告土地現值為準。地上建築改良物之價款，以稅捐稽徵機關提供之當年期評定現值為準；無該當年期評定現值者，依公產管理機關估價結果為準。\n本中心以政府機關核撥經費指定用途所購置之財產，為公有財產。\n第一項出租、無償提供使用及前項之公有財產以外，由本中心取得之財產為自有財產。\n第一項無償提供使用及第三項公有財產，由本中心登記為管理人，所生之收益，列為本中心之收入，不受國有財產法第七條第一項及地方政府公產管理法令相關規定之限制；其管理、使用、收益等相關事項之辦法，由監督機關定之。\n公有財產用途廢止時，應移交各級政府公產管理機關接管。\n本中心接受捐贈之公有不動產，不需使用時，應歸還原捐贈機關，不得任意處分。","note":"一、條次變更。\n二、第一項修正如下：\n(一)依第二項規定，本中心於設立後僅得以價購方式取得公有不動產，惟本中心經費籌措不易，價購公有不動產較為困難，復審酌本中心有持續擴充體育訓練設備及用地之需要，如未能由政府機關採捐贈、出租或無償提供使用公有財產，恐不利於本中心之業務推動，爰修正前段規定，本中心因業務必要使用之公有財產，不論係設立時或設立後，均得以價購或由政府機關採捐贈、出租或無償提供使用等方式為之。\n(二)依行政法人法第三十四條第一項規定「原機關（構）改制為行政法人業務上有必要使用之公有財產，得採捐贈、出租或無償提供使用等方式為之；採捐贈者，不適用預算法第二十五條及第二十六條、國有財產法第二十八條及第六十條相關規定。」按其立法意旨，係為行政法人改制之過渡期間，因業務上有必要使用公有財產，故就預算法、國有財產法作適度之鬆綁。惟本中心已設立多年，並無改制過渡期須鬆綁預算法規定之情形，爰刪除不適用「預算法第二十五條、第二十六條」之規定。\n(三)另因公有財產包括國有及直轄市、縣（市）政府所有之財產，爰於後段增列本中心受捐贈而取得公有財產，不受土地法第二十五條及地方政府公產管理法令相關規定之限制。\n三、配合第一項之修正，修正第二項，刪除前段有關本中心設立後僅得價購取得公有不動產規定，並酌修文字。\n四、配合第一項之修正，本中心因業務必要使用之公有財產，得由政府機關採出租方式為之，爰於第四項增列「出租、」等字，並酌作標點符號修正。\n五、修正第五項，就第一項無償提供使用及第三項公有財產，由本中心登記為管理人，其所生之收益，列為本中心之收入，增列不受地方政府公產管理法令相關規定之限制。\n六、第三項、第六項及第七項未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十八條","current":"政府機關核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n政府機關核撥之經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將其年度預算書，送立法院審議。","versions":[{"bill":"201110072960000","text":"政府機關核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n政府機關核撥之經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將其年度預算書，送立法院審議。\n本中心自主財源及其運用管理相關事項，由本中心訂定收支管理規章，報請監督機關備查。","note":"一、本中心除接受政府機關核撥經費外，亦有自主財源（例如委託研究或企業贊助），為明權責，爰於第一項明定政府機關核撥之經費，應依法定預算程序辦理，並受審計監督。\n二、第二項明定本中心年度預算書應送立法院審議之情形。\n三、第三項明定本中心自主財源及其運用管理相關事項規章之訂定程序。"},{"bill":"201110072960000","text":"政府機關核撥本中心之經費，應依法定預算程序辦理，並受審計監督。\n政府機關核撥之經費超過本中心當年度預算收入來源百分之五十者，應由監督機關將其年度預算書，送立法院審議。\n本中心自主財源及其運用管理相關事項，由本中心訂定收支管理規章，報請監督機關備查。","note":"一、條次變更。\n二、第一項及第二項未修正。\n三、鑑於本中心仍有自主財源收入，且其使用管理亦須接受監督機關之監督，爰增列第三項，明定本中心應針對自主財源及其運用管理相關事項，訂定收支管理規章，並報請監督機關備查。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十九條","current":"本中心所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞者，應即檢討提出改善措施，報請監督機關核定。","versions":[{"bill":"201110072960000","text":"本中心所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"為避免本中心任意舉債而無力償還，衍生由政府概括承受債務之虞，同時為免未來計算整體政府債務有所爭議，明定其舉借之債務以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施報請監督機關核定。"},{"bill":"201110072960000","text":"本中心所舉借之債務，以具自償性質者為限，並應先送監督機關核定。預算執行結果，如有不能自償之虞時，應即檢討提出改善措施，報請監督機關核定。","note":"一、條次變更。\n二、參考國家運動科學中心設置條例第二十八條規定體例，酌作文字修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十條","current":"本中心之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報請監督機關核定。\n前項應依政府採購法第四條規定辦理之採購，於其他法律另有規定者，從其規定。","versions":[{"bill":"201110072960000","text":"本中心之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條第一項所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報請監督機關核定。\n前項應依政府採購法第四條第一項規定辦理之採購，於其他法律另有規定者，從其規定。","note":"一、第一項明定本中心採購作業原則，除符合我國締結之條約、協定或政府採購法第四條第一項規定，應依各該規定辦理外，其餘不適用政府採購法之規定，使本中心運作更具彈性，並明定本中心採購作業實施規章之訂定程序。\n二、為因應政府採購法以外其他法律對於行政法人辦理採購另為規範之情形，爰明定第二項。"},{"bill":"201110072960000","text":"本中心之採購作業，應本公開、公正之原則，除符合我國締結之條約、協定或政府採購法第四條第一項所定情形，應依各該規定辦理外，不適用政府採購法之規定；其採購作業實施規章，應報請監督機關核定。\n前項應依政府採購法第四條第一項規定辦理之採購，於其他法律另有規定者，從其規定。","note":"一、條次變更。\n二、配合一百零八年五月二十二日修正公布政府採購法，已於第四條增列第二項，故第一項及第二項援引政府採購法第四條規定應配合修正為「第四條第一項」。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十一條","current":"本中心之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本中心之董事長、執行長或相關主管至立法院報告營運狀況並備詢。","versions":[{"bill":"201110072960000","text":"本中心之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本中心之董事長、執行長或相關主管至立法院報告營運狀況並備詢。","note":"一、第一項明定本中心之相關資訊，應依政府資訊公開法規定公開之，其年度財務報表、年度業務資訊及年度績效評鑑報告，並應主動公開，其方式可包括刊載於新聞紙或其他出版品；利用電信網路或其他方式供公眾線上查詢及提供公開閱覽、抄錄、影印、錄音、錄影或攝影等。\n二、第二項明定監督機關應提交績效評鑑分析報告，送立法院備查。必要時，立法院得要求本中心之董事長、執行長或相關主管報告及備詢。"},{"bill":"201110072960000","text":"本中心之相關資訊，應依政府資訊公開法相關規定公開之；其年度財務報表、年度業務資訊及年度績效評鑑報告，應主動公開。\n前項年度績效評鑑報告，應由監督機關提交分析報告，送立法院備查。必要時，立法院得要求監督機關首長率同本中心之董事長、執行長或相關主管至立法院報告營運狀況並備詢。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十二條","current":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","versions":[{"bill":"201110072960000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"本中心係行政法人，其定位為公法人，人民對於本中心行使公權力所為行政處分不服時，明定得依訴願法規定，向監督機關提起訴願，以確定其訴願管轄機關。"},{"bill":"201110072960000","text":"對於本中心之行政處分不服者，得依訴願法之規定，向監督機關提起訴願。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十三條","current":"本中心因情事變更或績效不彰，致不能達成其設立目的時，由監督機關提請行政院同意後解散之。\n本中心解散時，其人員應終止契約；其賸餘財產繳庫；其相關債務由監督機關概括承受。","versions":[{"bill":"201110072960000","text":"本中心因情事變更或績效不彰，致不能達成其設立目的時，由監督機關提請行政院同意後解散之。\n本中心解散時，其人員應終止契約；其賸餘財產歸屬國庫；其相關權利義務，由監督機關概括承受。","note":"一、第一項明定本中心解散之條件及其程序。\n二、第二項明定本中心解散時，有關人員、賸餘財產及相關權利義務之處理方式。"},{"bill":"201110072960000","text":"本中心因情事變更或績效不彰，致不能達成其設立目的時，由監督機關提請行政院同意後解散之。\n本中心解散時，其人員應終止契約；其賸餘財產歸屬國庫；其相關權利義務，由監督機關概括承受。","note":"一、條次變更。\n二、第一項未修正。\n三、參考國家運動科學中心設置條例第三十二條第二項規定體例，將「繳庫」修正為「歸屬國庫」；「債務」修正為「權利義務」，並酌作文字修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十四條","current":"本條例施行日期，由行政院定之。","versions":[{"bill":"201110072960000","text":"本條例施行日期，由行政院定之。","note":"本條例之施行日期。"},{"bill":"201110072960000","text":"本條例施行日期，由行政院定之。","note":"條次變更，內容未修正。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2024-04-19","stage":"一讀","code":"院會-11-1-10","bill":"202110033000000","gazref":"113卷028期5210號 6-7頁"},{"date":"2024-10-11","stage":"一讀","code":"院會-11-2-4","bill":"202110070210000","gazref":"113卷078期5260號 4-4頁"},{"date":"2024-10-11","stage":"一讀","code":"院會-11-2-4","bill":"202110069850000","gazref":"113卷078期5260號 6-6頁"},{"date":"2024-10-25","stage":"一讀","code":"院會-11-2-6","bill":"202110072690000","gazref":"113卷084期5266號 15-15頁"},{"date":"2024-10-25","stage":"一讀","code":"院會-11-2-6","bill":"202110072350000","gazref":"113卷084期5266號 22-22頁"},{"date":"2024-11-01","stage":"一讀","code":"院會-11-2-7","bill":"202110072860000", /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
const PARTY = D.parties || {};
const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));
  return p;
}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {

}
function copyHere(id) {

  const ok = () => toast('已複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言，可以往前往後讀。');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, () => prompt('複製這個連結', url));
  else prompt('複製這個連結', url);

}
function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}

      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };

  idx.append(chips);

}

const READING = {
  '一讀': {t: '一讀會', sub: '朗讀標題、交付審查', what: '議案送進立法院後，在院會中由主席宣付朗讀議案名稱。', pts: [
    '朗讀標題後，通常會將法案交付給相關的委員會進行詳細的實質審查（例如：教育及文化委員會、司法及法制委員會等）。',
    '如果有立委提案並經 20 人以上連署、表決通過，也可以選擇「逕付二讀」（跳過委員會審查）。',
    '如果有異議，可以退回程序委員會或不予審議。']},
  '逕付二讀': {t: '逕付二讀', sub: '跳過委員會審查，直接排進院會二讀', what: '院會決定這個提案不交委員會審查（或從委員會抽出），直接進入二讀。', pts: [
    '通常在一讀報告事項時由黨團提議，院會無異議或表決通過。',
    '逕付二讀的提案多半會交黨團協商，或與已經審查完的相關提案併案處理。',
    '這一天只有主席宣告的幾句話，沒有實質討論。']},
  '二讀': {t: '二讀會', sub: '實質討論、逐條審議，最關鍵的階段', what: '委員會審查完畢，或是經逕付二讀後，將法案送到院會進行全體討論與表決。', pts: [
    '這是法案通過與否最關鍵、辯論最激烈的階段。',
    '進行廣泛討論以及逐條討論、修正。',
    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
Object.assign(READING, {
  '復議': {t: '復議', sub: '要求把已經表決的案子重新討論', what: '議案表決之後，當初投贊成的一方可以提出復議，要求重新討論、重新表決。', pts: [
    '復議被否決之後，同一個案子不能再提復議，決議就此確定。',
    '實務上常見多數方自己提出復議、再自己否決，目的是讓剛通過的條文確定下來。']},
  '重付表決': {t: '重付表決', sub: '對表決結果有異議，再表決一次', what: '出席委員對表決結果有異議時，經 15 人以上連署或附議，可以要求重新表決。', pts: ['以一次為限。']},
  '修正動議': {t: '修正動議', sub: '在院會對條文提出的修改案', what: '委員或黨團在二讀（或三讀）時，對討論中的條文提出另一個版本的文字，交院會表決。', pts: ['需要 10 人以上連署或附議。']},
  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
