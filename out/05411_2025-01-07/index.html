<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>運動部組織法制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

含運動教育、運動競技、運動產業及運動外交等，打造多元運動環境，落實運動平權，應有專責主管機關規劃及推動；綜整運動資源，壯大運動相關業務，爰擬具「運動部組織法草案」，以利運動相關業務之推行。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110076740000","who":"委員陳亭妃等16人","date":"2024-11-15","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110076740000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/09/LCEWA01_110209_00036.pdf","proposers":["陳亭妃","蔡易餘"],"ncosign":14,"people":[["陳亭妃","民進黨","提案"],["蔡易餘","民進黨","提案"],["賴惠員","民進黨","連署"],["陳秀寳","民進黨","連署"],["陳俊宇","民進黨","連署"],["沈伯洋","民進黨","連署"],["邱議瑩","民進黨","連署"],["鍾佳濱","民進黨","連署"],["羅美玲","民進黨","連署"],["林月琴","民進黨","連署"],["賴瑞隆","民進黨","連署"],["張雅琳","民進黨","連署"],["吳沛憶","民進黨","連署"],["林楚茵","民進黨","連署"],["郭昱晴","民進黨","連署"],["陳培瑜","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員陳亭妃、蔡易餘等16人，為致力促進全民運動，發展運動之教育、競技、產業與外交，推廣運動文化並落實運動多元平權、社會包容及永續發展之價值，以保障基本人權，並順應國際潮流及各界期待，應有成立運動部做為行政院所屬中央二級機關，專責國內運動政策規劃及相關計畫執行機關之必要。爰擬具「運動部組織法草案」，藉由專責且具專業能量之機關，整體規劃運動相關資源，並透過提倡全民運動增進國民健康、強化選手培育及權益保障以促進競技專業發展、推動運動產業促進幸福經濟、推展國際事務讓世界看見臺灣等目標，達到以體育運動壯大臺灣之願景。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110076840000","who":"委員郭昱晴等16人","date":"2024-11-15","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110076840000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/09/LCEWA01_110209_00046.pdf","proposers":["郭昱晴"],"ncosign":15,"people":[["郭昱晴","民進黨","提案"],["賴惠員","民進黨","連署"],["陳秀寳","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["沈伯洋","民進黨","連署"],["陳俊宇","民進黨","連署"],["王正旭","民進黨","連署"],["陳培瑜","民進黨","連署"],["林月琴","民進黨","連署"],["張雅琳","民進黨","連署"],["李坤城","民進黨","連署"],["范雲","民進黨","連署"],["羅美玲","民進黨","連署"],["蔡易餘","民進黨","連署"],["洪申翰","民進黨","連署"],["林淑芬","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員郭昱晴等16人，體育活動不僅是促進個人健康的工具，更是現代國家社會發展的基礎之一。在此基礎上，我國有責任確保國民能夠享有運動的機會和權利，同時應提升運動的國際能見度，以宣傳國家形象。而國家運動發展涉及長期且穩定的資金投入，從運動設施的建設與維護，到運動產業的發展、運動員培育等，都需要充足的經費支持。因此，成立運動發展部是國家體育發展的重要里程碑，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三 :"本院委員葛如鈞、蘇清泉、鄭正鈐等17人，有鑑於國人參與運動人口之比例已於二○二三年突破百分之八十二，規律運動人口比例則首度達到百分之三十五，我國運動產業產值亦隨之穩定成長，有望於二○二六年突破新臺幣一兆元，為持續推行全民運動以增進國民健康、強化選手培育及權益保障以促進競技專業發展，應提升教育部體育署之位階，成為行政院所屬中央二級機關，使之能有效推動全民體育，促進運動產業蓬勃發展，透過體育外交與國際接軌，形塑多元運動文化並落實運動平權，爰擬具「運動發展部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110078720000","who":"委員王正旭等16人","date":"2024-11-22","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110078720000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/10/LCEWA01_110210_00062.pdf","proposers":["王正旭","王美惠"],"ncosign":14,"people":[["王正旭","民進黨","提案"],["王美惠","民進黨","提案"],["沈伯洋","民進黨","連署"],["范雲","民進黨","連署"],["林月琴","民進黨","連署"],["王世堅","民進黨","連署"],["沈發惠","民進黨","連署"],["莊瑞雄","民進黨","連署"],["張雅琳","民進黨","連署"],["郭昱晴","民進黨","連署"],["陳培瑜","民進黨","連署"],["郭國文","民進黨","連署"],["洪申翰","民進黨","連署"],["徐富癸","民進黨","連署"],["林淑芬","民進黨","連署"],["黃秀芳","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員王正旭、王美惠等16人，有鑑於聯合國教育、科學與文化組織於2015年11月18日第38屆大會修正通過之「體育、身體活動與競技運動國際憲章」開宗明義闡明，體育、身體活動及競技運動之實踐，為人類基本權利。爰此，人人都享有運動機會與權利，已為國際進步趨勢，亦是我國運動發展政策之重要基石。基此，我國將致力於促進全民運動，落實健康台灣，發展運動之推廣、教育、競技、產業、科學研究與外交，形塑運動文化並落實運動多元平權、社會包容及永續發展之價值，以保障基本人權，並符應國際潮流及各界期待。為推動及落實上開運動發展政策，實有成立運動部（以下簡稱本部）之必要，藉由專責且具專業能量之機關，整體規劃運動相關資源，並透過提倡全民運動增進國民健康、強化選手培育及權益保障以促進競技專業發展、推動運動產業促進幸福經濟、推展國際事務讓世界看見臺灣等目標，達到以體育運動壯大臺灣之願景。此外，原由教育部體育署辦理之運動教育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策規劃、輔導及行政監督等事項，為整合相關業務，將改由本部辦理。至於學校體育包括十二年國民教育課程綱要及體育教學（包括場館設施等）部分，則由教育部辦理。爰依中央行政機關組織基準法第四條第一項第一款規定，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110080290000","who":"委員伍麗華Saidhai Tahovecahe等16人","date":"2024-11-29","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110080290000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00238.pdf","proposers":["伍麗華Saidhai‧Tahovecahe"],"ncosign":6,"people":[["伍麗華Saidhai‧Tahovecahe","民進黨","提案"],["范雲","民進黨","連署"],["張雅琳","民進黨","連署"],["郭昱晴","民進黨","連署"],["徐富癸","民進黨","連署"],["沈伯洋","民進黨","連署"],["陳培瑜","民進黨","連署"]],"party":[["民進黨",7]],"reason":"本院委員伍麗華Saidhai Tahovecahe、莊瑞雄等16人，為促進全民運動，發展體育教育、共融運動、體育外交及運動產業，培育與輔導運動產業人才及競技選手，保障原住民體育人才，形塑運動文化並落實健康促進、多元平權，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110080570000","who":"委員柯志恩等16人","date":"2024-12-06","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110080570000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00147.pdf","proposers":["柯志恩","葛如鈞"],"ncosign":14,"people":[["柯志恩","國民黨","提案"],["葛如鈞","國民黨","提案"],["羅智強","國民黨","連署"],["顏寬恒","國民黨","連署"],["陳菁徽","國民黨","連署"],["王鴻薇","國民黨","連署"],["李彥秀","國民黨","連署"],["羅明才","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["林倩綺","國民黨","連署"],["陳玉珍","國民黨","連署"],["陳超明","無黨籍","連署"],["游顥","國民黨","連署"],["黃建賓","國民黨","連署"],["萬美玲","國民黨","連署"],["洪孟楷","國民黨","連署"]],"party":[["國民黨",15],["無黨籍",1]],"reason":"本院委員柯志恩、葛如鈞等16人，有鑑於體育運動事務置於教育體系，已無法反映運動發展現況，以及有效推動運動事務，加上運動產業經營環境好壞與否，更攸關我國運動發展及人才培育競爭力，能否與國際接軌；此外，透過運動外交已成為我國維繫國際關係的重要渠道。然目前教育部體育署之規模及架構已無法因應相關任務及目標，為強化體育運動在國家發展中角色，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條"]},{"id":"202110081030000","who":"委員徐巧芯等18人","date":"2024-12-06","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110081030000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00148.pdf","proposers":["徐巧芯","葉元之","陳菁徽","黃健豪"],"ncosign":14,"people":[["徐巧芯","國民黨","提案"],["葉元之","國民黨","提案"],["陳菁徽","國民黨","提案"],["黃健豪","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","連署"],["林沛祥","國民黨","連署"],["鄭正鈐","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["黃建賓","國民黨","連署"],["林倩綺","國民黨","連署"],["游顥","國民黨","連署"],["牛煦庭","國民黨","連署"],["廖先翔","國民黨","連署"],["邱鎮軍","國民黨","連署"],["林思銘","國民黨","連署"],["顏寬恒","國民黨","連署"],["林憶君","民眾黨","連署"],["謝龍介","國民黨","連署"]],"party":[["國民黨",17],["民眾黨",1]],"reason":"本院委員徐巧芯、葉元之、陳菁徽、黃健豪等18人，為了有效推動我國運動發展，提升全民運動參與及增進國民健康，應將現行教育部體育署升格為專責的運動部。近年來，我國運動風氣日盛，運動產業與科技蓬勃發展，但目前體育署隸屬於教育部，造成資源與人力不足，影響運動政策的推動。鑒於國際體育事務發展及我國選手的亮眼表現，設立專責運動部，有助於整合資源、促進運動教育、競技與產業發展，並加強運動外交，全面提升我國運動實力及國際影響力，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110081370000","who":"委員陳菁徽等17人","date":"2024-12-06","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110081370000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00149.pdf","proposers":["陳菁徽"],"ncosign":9,"people":[["陳菁徽","國民黨","提案"],["牛煦庭","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["林沛祥","國民黨","連署"],["陳玉珍","國民黨","連署"],["葉元之","國民黨","連署"],["林倩綺","國民黨","連署"],["黃建賓","國民黨","連署"],["張智倫","國民黨","連署"],["許宇甄","國民黨","連署"]],"party":[["國民黨",10]],"reason":"本院委員陳菁徽等17人，有鑑於近來台灣運動員在國際賽事中的優異表現，不僅帶來國內的歡欣鼓舞，也提升了台灣在國際社會的能見度。近期如中華隊在世界12強棒球賽中奪冠，這是我國棒球史上的重大突破，而棒球以外，台灣在舉重、跆拳道、羽球與拳擊等運動項目，也常於國際賽事中取得顯著的佳績，此些成果，再再展現了台灣選手的實力和韌性。然而，這些成功背後需要有系統性的支持，包括完善的訓練設施、專業的教練團隊以及充足的資源投入。現實中，台灣的運動發展仍面臨諸多挑戰，如資源投入不足、分配不均，從更博觀的角度來看，國家對於全民運動的推廣也有待加強；從組織面而言，台灣的運動政策由多個部門共同推動，往往造成資源分散、政策執行效率不彰等疑慮。運動產業的發展需要政府的統籌與支持，成立專責部門才可整合各方資源，統籌規劃運動政策，為促進國內體育全面發展，強化體育行政組織體系，提升台灣運動的國際競爭力，並兼顧運動員權益保障與心理健康支持，爰擬具「運動部組織法草案」，作為運動部設立及運作之法源基礎。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110083570000","who":"委員吳琪銘等16人","date":"2024-12-27","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110083570000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/16/LCEWA01_110216_00332.pdf","proposers":["吳琪銘"],"ncosign":15,"people":[["吳琪銘","民進黨","提案"],["張宏陸","民進黨","連署"],["李柏毅","民進黨","連署"],["郭國文","民進黨","連署"],["李坤城","民進黨","連署"],["王美惠","民進黨","連署"],["何欣純","民進黨","連署"],["陳俊宇","民進黨","連署"],["蘇巧慧","民進黨","連署"],["蔡易餘","民進黨","連署"],["陳素月","民進黨","連署"],["邱志偉","民進黨","連署"],["徐富癸","民進黨","連署"],["陳秀寳","民進黨","連署"],["郭昱晴","民進黨","連署"],["劉建國","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員吳琪銘等16人，為致力促進全民運動，發展運動之教育、競技、產業與外交，推廣運動文化並落實運動多元平權、社會包容及永續發展之價值，並順應國際潮流及各界期待及實踐聯合國永續發展目標，應有成立運動部專責國內運動政策規劃及相關計畫執行機關之必要，以利運動相關業務之推行，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110084150000","who":"委員王鴻薇等20人","date":"2025-01-03","name":"「運動發展部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110084150000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/16/LCEWA01_110216_00016.pdf","proposers":["王鴻薇"],"ncosign":19,"people":[["王鴻薇","國民黨","提案"],["洪孟楷","國民黨","連署"],["黃健豪","國民黨","連署"],["林沛祥","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["鄭正鈐","國民黨","連署"],["邱鎮軍","國民黨","連署"],["林德福","國民黨","連署"],["陳玉珍","國民黨","連署"],["林思銘","國民黨","連署"],["廖先翔","國民黨","連署"],["盧縣一","國民黨","連署"],["葛如鈞","國民黨","連署"],["魯明哲","國民黨","連署"],["林國成","民眾黨","連署"],["邱若華","國民黨","連署"],["顏寬恒","國民黨","連署"],["蘇清泉","國民黨","連署"],["牛煦庭","國民黨","連署"],["楊瓊瓔","國民黨","連署"]],"party":[["國民黨",19],["民眾黨",1]],"reason":"本院委員王鴻薇等20人，有鑑國內運動習慣日漸興盛、運動產業快速發展，運動選手參與國際賽事亦受到國內重視。然現今相關組織仍隸屬於教育部門，致使運動發展無法有效率因應環境做出相應政策，亦缺乏足夠資源發展。是以，政府思考相關政策時，不應僅侷限於「體育」，而是應以運動政策之發展做全盤考量。為避免運動政策受限於決策層級並提升培育資源，應提升體育之位階，成為行政院所屬中央二級機關，以強化培育、發展及產業推展等，爰擬具「運動發展部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條"]}],"arts":[{"no":"第一條","current":"為設立國家運動訓練中心（以下簡稱本中心），以推動國家運動訓練事務，培育優秀運動人才，提升國際運動競爭力，特制定本條例。","versions":[{"bill":"202110033000000","text":"行政院為辦理國民之體育及運動參與權利保障，健全國內產業及環境，推廣與其他國家之交流，並強化全國體育運動發展業務，特設運動發展部（以下簡稱本部）。","note":"明定運動發展部設立目的及隸屬關係。"},{"bill":"202110070210000","text":"行政院為辦理國民之體育及運動參與權利保障，健全國內產業及環境，推廣與其他國家之交流，並強化全國體育運動發展業務，特設體育暨運動發展部（以下簡稱本部）。","note":"明定體育暨運動發展部設立目的及隸屬關係。"},{"bill":"202110069850000","text":"行政院為辦理國民之體育及運動參與權利保障，健全國內產業及環境，推廣與其他國家之交流，並強化全國體育運動發展業務，特設體育暨運動發展部（以下簡稱本部）。","note":"明定體育暨運動發展部之設立目的及隸屬關係。"},{"bill":"202110072690000","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"為推動我國運動發展政策，包括促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，有設運動部（以下簡稱本部）之必要，爰明定本法之立法目的。"},{"bill":"202110072350000","text":"行政院為辦理全國體育運動發展業務，特設體育暨運動發展部（以下簡稱本部）。","note":"體育暨運動發展部之設立目的及隸屬關係。"},{"bill":"202110072860000","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"為推動我國運動發展政策，包括促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，有設運動部（以下簡稱本部）之必要，爰明定本部之設立目的及隸屬關係。"},{"bill":"202110073830000","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"為推動我國運動發展政策，包括促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，有設運動部（以下簡稱本部）之必要，爰明定本部之設立目的及隸屬關係。"},{"bill":"202110074060000","text":"行政院為辦理全國運動業務，促進全民運動、保障選手與運動人才、推動運動外交，使運動在教育、競技、產業各方面均能良好發展，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"一、明定本法之宗旨。\n二、條文納入及運動人才，含教練、運動科技研究人員、防護員、運動心理師等等，提供穩定發展之機會。\n三、條文納入推動運動外交使運動成為我對我國對外發展之助力。\n四、條文納入需於運動領域落實多元平權之價值。"},{"bill":"202110074490000","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"為推動我國運動發展政策，包括促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，有設運動部（以下簡稱本部）之必要，爰明定本部之設立目的及隸屬關係。"},{"bill":"201110072960000","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"為推動我國運動發展政策，包括促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，有設運動部（以下簡稱本部）之必要，爰明定本部之設立目的及隸屬關係。"},{"bill":"201110072960000","text":"運動部為辦理全民運動之全齡化與社區化發展，促進競技運動全民化、各層級賽事推廣、運動教育及技能發展，形塑運動文化，特設全民運動署（以下簡稱本署）。","note":"配合運動部（以下簡稱本部）之成立，為落實推動「提倡全民運動，增進國民健康」之核心目標，促使國民養成規律運動之習慣及建立熱愛運動之生活模式，將運動融入生活中，以形塑運動文化，有設全民運動署（以下簡稱本署）之必要，爰明定本署之設立目的及隸屬關係。"},{"bill":"201110072960000","text":"為建構優質運動產業環境，促進運動產業發展，特設國家運動產業發展中心（以下簡稱本中心），並制定本條例。","note":"一、為因應國際運動發展新趨勢，我國運動推展將擴及以全民為本之運動平等參與、以運動員為主體之競技科學發展、跨域智慧科技導入及永續運動產業發展，並強化運動產業之創新及永續等面向，為推行及達成上開政策目標，成立運動部。\n二、承上，運動部成立後，為執行「推動運動產業，促進幸福經濟」之業務，有必要設置國家運動產業發展中心（以下簡稱本中心），藉由行政法人彈性化及自主化之組織特性，導入多元領域思維，予以執行相關業務，以建構優質運動產業環境，促進運動產業發展，爰定明本條例之立法目的。"},{"bill":"201110072960000","text":"為設立國家運動訓練中心（以下簡稱本中心），以推動國家運動訓練事務，培育優秀運動人才，提升國際運動競爭力，特制定本條例。","note":"本條未修正。"},{"bill":"202110076260000","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"明定本法立法目的。"},{"bill":"202110076180000","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實健康促進、多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"為推動我國運動政策，包括促進 劃、落實及獎補助事項。\n三、運動彩券、運動發展基金之規劃、執行、督導及獎助。\n四、學校體育發展之規劃、執行及督導。\n五、全民運動之規劃、執行及督導。\n六、競技運動發展之規劃、執行及督導。\n七、國際及兩岸運動交流發展之規劃、執行及督導。\n八、國際各賽事之爭辦、規劃、執行、協調及督導。\n九、地方政府運動政策之規劃、執行及獎勵與補助。\n十、職業運動之推動、聯繫及協調事項。\n十一、運動產業之規劃、培植、輔導及發展。\n十二、國家運動訓練中心之輔導及監督。\n十三、其他有關體育及運動事項。","note":"本部之權限職掌。"},{"bill":"202110072690000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理與監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理與監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理與監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、管理與監督。\n五、海洋、山林及水域等自然環境推動、輔導及執行。\n六、運動產業發展與運動產業人才培育；運動文化記憶保存與再現。\n七、職業運動人才培育、發展、訓練輔導、推動及執行。\n八、運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理與監督。\n九、國際運動事務交流與人才培育；國際賽事舉辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理與監督。\n十、運動設施發展與運動場館之規劃、興整建及永續營運；運動設施與場館分級統籌運用、多元友善運動環境之規劃、推動、管理與監督。\n十一、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n十二、所屬機關辦理全民運動事項之督導。\n十三、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110072350000","text":"本部掌理下列事項：\n一、體育運動政策、制度之綜合規劃、法規研擬、推動及督導。\n二、運動產業發展條例之規劃、落實及獎補助事項。\n三、全民運動發展之綜合規劃、推動及督導。\n四、身心障礙者運動發展之綜合規劃、推動及督導。\n五、高齡運動發展之綜合規劃、推動及督導。\n六、學校體育發展之綜合規劃、推動及督導。\n七、競技運動發展之綜合規劃、推動及督導。\n八、國際及兩岸運動交流發展之規劃、推動及督導。\n九、國際各賽事之規劃、推動、協調及督導。\n十、地方政府運動政策之規劃、推動、獎勵及補助。\n十一、職業運動之推動、聯繫及協調事項。\n十二、運動產業之培植、輔導及發展。\n十三、運動設施之綜合規劃、推動及督導。\n十四、國家運動訓練中心之輔導及監督。\n十五、其他有關體育運動事項。","note":"本部之權限職掌。"},{"bill":"202110072860000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110073830000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110074060000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位等各面向多元運動平權之規劃；運動相關之兒少權益保障措施之推動、輔導、管理及監督。\n三、適應運動發展及人才培育、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動彩券、運動發展基金、多元資金募集、挹注。\n六、運動文化記憶之保存及再現之規劃、推動、管理及監督。\n七、運動科學發展與創新應用之規劃、推動、管理及監督。\n八、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n九、運動設施發展與運動場館之興建規劃、興辦、整建及永續營運；運動設施與場館之分級統籌運用與良好友善運動環境之規劃、推動、管理、研究及監督。\n十、全國性運動團體業務健全發展與良善治理之促進、輔導及督導；相關機關（構）、團體運動發展事項之協調。\n十一、促進新興運動項目之發展與所屬機關辦理全民運動事項之督導。\n十二、選手參與國際賽事之權益保障及申訴、國際運動仲裁等相關事項辦理。\n十三、其他有關運動事項。\n本部得將前項第六款業務委託具相關專業之機關、法人、學術單位或專業團體辦理。\n本部得將第一項第十二款業務委託具相關專業之事業機構、法人、團體辦理。","note":"一、明定運動部之權限職掌。\n二、於第一項第二款除保障運動之多元平權外，另明定應保障兒少權益。\n三、第一項第十二款乃指協助如拳擊國手林郁婷，在國際遭遇不公待遇之狀況。\n四、第二項之機關、法人包括政府所設立之博物館。\n五、第三項之「具相關業事業機構」指律師事務所等，能藉由國際賽事、組織規章，維護選手權益之事業機構。"},{"bill":"202110074490000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"201110072960000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"201110072960000","text":"本署掌理下列事項：\n一、全民運動政策之規劃、推動與執行及相關法規之研擬。\n二、國民規律運動、運動教育與體適能檢測之規劃、推動及執行。\n三、兒童、少年、青年、壯年與高齡者全齡運動之規劃、推動及執行。\n四、海洋、水域與山林運動之規劃、推動及執行。\n五、新興、極限與傳統民俗運動之規劃、推動及執行。\n六、社區運動俱樂部與社團、各層級賽事推廣之規劃、推動及執行。\n七、全國性運動團體推動全民運動之輔導。\n八、多元運動專業人員之培育及輔導。\n九、其他有關全民運動事項。","note":"本署之權限職掌。"},{"bill":"201110072960000","text":"本中心為行政法人；其監督機關為運動部。","note":"本中心組織型態及監督機關。"},{"bill":"201110072960000","text":"本中心為行政法人；其監督機關為運動部。","note":"一、配合運動部之成立，國家運動訓練中心（以下簡稱本中心）之監督機關改為運動部，爰修正第一項，並列為本條文。\n二、現行教育部指定教育部體育署督導本中心，運動部成立後，無委託或指定專責機關督導本中心之必要，爰刪除第二項。"},{"bill":"201110072960000","text":"本中心為行政法人；其監督機關為運動部。","note":"一、配合運動部之成立，國家運動科學中心（以下簡稱本中心）之監督機關改為運動部，爰修正第一項，並列為本條文。\n二、現行教育部指定教育部體育署督導本中心，運動部成立後，無委託或指定專責機關督導本中心之必要，爰刪除第二項。"},{"bill":"201110072960000","text":"本部掌理下列事項：\n一、高等教育、技術職業教育政策之規劃，大專校院發展、師資、招生、資源分配、品質提升、產學合作之輔導及行政監督。\n二、終身教育、社會教育、成人教育、家庭教育、藝術教育、進修補習教育、特殊教育、性別平等教育、公民素養、閱讀語文、教育基金會政策之規劃、輔導與行政監督，與所屬社會教育機構之督導、協調及推動。\n三、國際與兩岸教育學術交流、國際青年與教育活動參與、海外華語文教育推廣、留學生、外國學生、僑生、港澳生與陸生之輔導、外僑學校、大陸地區臺商學校與海外臺灣學校之輔導及行政監督。\n四、師資培育政策、師資職前教育課程、師資培育大學之獎補助與評鑑、教師專業證照與實習、教師在職進修、教師專業組織輔導、教師專業發展與教師評鑑之規劃、輔導及行政監督。\n五、學校資訊教育、環境教育政策之規劃、輔導與行政監督、人文社會、科技教育政策之規劃、協調與推動、學術網路資源與系統之規劃及管理。\n六、學生事務之輔導及行政監督、學校全民國防教育、校園安全政策之規劃、輔導與行政監督，學校軍訓教官與護理教師之管理及輔導。\n七、原住民族及少數族群教育、學校衛生教育政策之規劃、輔導及行政監督。\n八、中小學與學前教育、青年發展、學校體育政策之規劃、輔導及行政監督。\n九、教育人事政策之規劃、教育人事法令之訂定、解釋與私立學校教職員退休、撫卹、資遣之規劃、輔導及行政監督。\n十、其他有關教育事項。","note":"配合行政院增設運動部，原由教育部體育署（以下簡稱體育署）辦理之運動教育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策規劃、輔導及行政監督等事項，改由運動部辦理；至於學校體育包括十二年國民教育課程綱要及體育教學（包括場館設施等）部分，則由本部辦理，爰修正第八款規定。"},{"bill":"202110076260000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"明定本部職掌。"},{"bill":"202110076180000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動及管理。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、輔導、獎勵及推動。\n三、適應運動發展、帕拉競技與共融運動之規劃、輔導、獎勵及推動。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、輔導、獎勵、管理及推動。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、輔導、監督、管理及推動。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、輔導、獎勵、管理及推動。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、輔導、獎勵、管理及推動。\n八、全國性運動團體業務健全發展與良善治理之促進、輔導及獎勵；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110075690000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、全民運動及友善運動環境之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及營運；運動設施與場館之分級統籌運用。\n八、全國性運動團體之管理及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"明確規範運動部的業務範疇，涵蓋全民運動、競技運動、運動產業及國際運動事務等多方面的政策推動與監督職責。"},{"bill":"202110074130000","text":"本部掌理下列事項：\n一、國家運動政策與法規之研擬、規劃、執行、管理及監督。\n二、身心條件、年齡、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、福利、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、發證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之種類、分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進、輔導及督導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他運動相關事項。","note":"本部之職掌權限。"},{"bill":"202110076630000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、執行、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展 0078520000","text":"本部掌理下列事項：\n一、國家運動政策與法規之研擬、規劃、執行、管理及監督。\n二、身心條件、年齡、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、福利、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、發證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之種類、分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進、輔導及督導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他運動相關事項。","note":"本部之職掌權限。"},{"bill":"202110078560000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110078590000","text":"本部掌理下列事項：\n一、運動政策、法制及人力之整合規劃、落實與監督。\n二、運動產業發展條例之規劃、落實及獎補助事項。\n三、全民運動之規劃、執行及督導。\n四、競技運動發展之規劃、執行及督導。\n五、國際及兩岸運動交流發展之規劃、執行及督導。\n六、國際各賽事之爭辦、規劃、執行、協調及督導。\n七、地方政府運動政策之規劃、執行及獎勵與補助。\n八、職業運動之推動、聯繫及協調事項。\n九、運動產業之培植、輔導及發展。\n十、國家運動訓練中心之輔導及監督。\n十一、其他有關體育及運動事項。","note":"本部之權限職掌。"},{"bill":"202110078720000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心健康條件、性別、年齡、族群、區域與社會經濟地位各面向多元運動平權之研究、規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學研究、發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"一、本部之權限職掌。\n二、本條第四款之「多元運動專業人才」，係包括教練、裁判、防護員、陪練員、物理治療師、運動場館營運人才、賽事規劃及辦理人才等能健全各項運動發展、形塑安全健康運動觀念與專業環境之相關人才。"},{"bill" 督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110084150000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、運動產業發展條例之規劃、落實及獎補助事項。\n三、全民運動之規劃、執行及督導。\n四、競技運動發展之規劃、執行及督導。\n五、國際及兩岸運動交流發展之規劃、執行及督導。\n六、國際各賽事之爭辦、規劃、執行、協調及督導。\n七、地方政府運動政策之規劃、執行及獎勵與補助。\n八、職業運動之推動、聯繫及協調事項。\n九、運動產業之培植、輔導及發展。\n十、國家運動訓練中心之輔導及監督。\n十一、其他有關體育及運動事項。","note":"明定本部之職掌權限。"},{"bill":"202110083570000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限執掌。"}],"changed":true,"final":"本部掌理下列事項：\n一、國家運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、年齡、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、獎勵、管理及監督。\n三、適應運動發展、身心障礙競技運動與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之蒐藏、保存、再現、展示及推廣；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之種類、分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進、輔導及監督；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","finalWhy":"照委員所提修正動議通過。,,","review":{"note":"照委員鍾佳濱等7人所提修正動議通過","text":"本部掌理下列事項：\n一、國家運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、年齡、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、獎勵、管理及監督。\n三、適應運動發展、身心障礙競技運動與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之蒐藏、保存、再現、展示及推廣；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之種類、分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進、輔導及監督；相關機關(構)、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。"}},{"no":"第三條","current":"本中心之業務範圍如下：\n一、國家級優秀運動選手之選拔、培訓及輔導參賽。\n二、國家級優秀運動教練之培育及進修。\n三、運動科學支援訓練之執行。\n四、本中心場館之營運及管理。\n五、優秀運動選手之生涯諮商輔導。\n六、與國內外運動訓練相關機構之合作交流。\n七、其他與競技運動推展相關之事項。","versions":[{"bill":"202110033000000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"明定本部首長、副首長職稱、官職等及其員額。"},{"bill":"202110070210000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"明定本部首長、副首長職稱、官職等及其員額。"},{"bill":"202110069850000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110072690000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110072350000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110072860000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110073830000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110074060000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"首長、副首長職稱、官職等及員額。"},{"bill":"202110074490000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"201110072960000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"201110072960000","text":"本署置署長一人，職務列簡任第十三職等，必要時得比照大學校長之資格聘任；副署長一人，職務列簡任第十二職等。","note":"本署首長、副首長之職稱、官職等、員額及首長任用資格之特別規定。"},{"bill":"201110072960000","text":"本中心之業務範圍如下：\n一、運動產業之調查、統計及研究發展。\n二、運動產業專業人才之培育與媒合及國際交流。\n三、運動產業營運與投融資之輔導、諮詢及協助。\n四、運動產業資產之規劃、建置、治理及運用。\n五、運動產品或服務之加值運用與市場拓展及商業模式之營運管理。\n六、公有、私有運動場域與學校場地開放及社區運動俱樂部設置之輔導。\n七、競技運動全民化與全民運動產業化之推動及輔導。\n八、運動賽事產業化、傳播、行銷規劃與平臺建立之諮詢及協助。\n九、其他與運動產業相關之業務。","note":"一、本中心之業務範圍。\n二、依運動產業發展條例第四條規定「本條例所稱運動產業，指提供民眾從事運動或運動觀賞所需產品或服務，或可促進運動推展之支援性服務，而具有增進國民身心健康、提升體能及生活品質之下列產業：一、職業或業餘運動業。二、運動休閒教育服務業。三、運動傳播媒體或資訊出版業。四、運動表演業。五、運動旅遊業。六、電子競技業。七、運動博弈業。八、運動經紀、管理顧問或行政管理業。九、運動場館或設施營建業。十、運動用品或器材製造、批發及零售業。十一、運動用品或器材租賃業。十二、運動保健業。十三、其他經中央主管機關認定之產業。」，本中心應配合運動部及其他中央目的事業主管機關政策，協助促進及推動運動產業。\n三、為達成促進及推動運動產業之政策目的，本中心將辦理運動產業之策略研究（例如辦理調查、統計及研究等）、運動產業促進（例如協助培育及媒合運動人才、國際交流、提供運動產業營運事項之協助、輔導民間投資運動產業及協助取得融資貸款之信用保證等）、全齡運動發展（例如將競技運動推廣全民參與、推動全民運動相關產業發展、公有、私有運動場域與學校場地開放及社區運動俱樂部設置之輔導等）、跨域創新（運動產業軟硬體資產之規劃、建置、治理、運用、協助運動產品創新設計開發、促進運動旅遊、推動運動文化加值應用及促進運動傳播及行銷等）及運動賽會輔導（包括輔導運動賽會產業化等），爰於各款明定本中心之業務範圍。"},{"bill":"201110072960000","text":"本中心之業務範圍如下：\n一、國家級優秀運動選手之選拔、培訓及輔導參賽。\n二、國家級優秀運動教練之培育及進修。\n三、醫療照護支援訓練之執行。\n四、本中心場館之營運及管理。\n五、國家級優秀運動選手之課業輔導及生涯諮商輔導。\n六、競技運動相關事項之國際交流。\n七、與國內外運動訓練相關機構之合作交流。\n八、其他與競技運動推展相關之事項。","note":"一、依實務運作，運動科學支援訓練，由國家運動科學中心辦理，本中心辦理醫療照護支援訓練事宜，爰修正第三款，將所定「運動科學」修正為「醫療照護」。\n二、第五款修正如下：\n(一)考量至本中心接受訓練者均為國家級優秀運動選手，為利明確及體例一致，爰將所定優秀運動選手修正為「國家級」優秀運動選手。\n(二)另考量國家級優秀運動選手於本中心訓練期間，其課業輔導為本中心既有之業務，為保障學生選手之受教權，並使本中心辦理該項業務有所依循，爰增列「課業輔導」為本中心業務，以期明確。\n三、為促進競技運動之國際交流，爰增列第六款，明定競技運動相關事項之國際交流為本中心之業務；現行第六款及第七款配合移列為第七款及第八款，內容未修正。"},{"bill":"201110072960000","text":"本中心之業務範圍如下：\n一、辦理國家優秀運動選手培訓、參賽所需之運動科學支援服務、健康管理及運動醫學研究。\n二、辦理國際運動賽事資訊之蒐集、分析及支援。\n三、推動運動科學之研究及國際交流。\n四、進行運動科技之研發、技術移轉及加值應用，提升產業競爭力。\n五、促進國內外運動科學研究機構之合作交流。\n六、協助規劃及培育運動科學專業人才。\n七、運動科學成果推廣全民運用。\n八、其他與運動科學相關之業務。","note":"一、依實務運作，醫療照護支援訓練事宜係由國家運動訓練中心辦理，本中心辦理運動醫學研究，爰修正第一款，將所定「醫療照護」修正為「運動醫學研究」。\n二、修正第三款，明定推動運動科學之研究及國際交流為本中心之業務。\n三、其餘各款未修正。"},{"bill":"202110076260000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"明定本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110076180000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110075690000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"規範運動部的組織架構與高階職位設置。"},{"bill":"202110074130000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"明定本部首長、副首長職稱、官職等及其員額。"},{"bill":"202110076630000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"明定本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110076740000","text":"本部置部長一人，特任；政務次長二人，職務比照簡任第十四職等；常務次長一人，職務列簡任第十四職等。","note":"本部首長、副首長之職稱、官職等及員額。"},{"bill":"202110076840000","text urrent":"本中心應訂定人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報請監督機關備查。\n本中心就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報請監督機關備查。","versions":[{"bill":"202110033000000","text":"本部之次級機關及其業務如下：\n一、運動產業局：執行運動產業培植、獎勵補助及民間聯絡等政策及業務有關之事項。\n二、運動推廣及合作交流局：執行運動推廣及行銷，與國內外運動業務合作交流等事項。","note":"明定本部設立所屬機關之名稱及業務。"},{"bill":"202110070210000","text":"本部之次級機關及其業務如下：\n一、運動產業局：執行運動產業之培植、發展輔導及其有關事項。\n二、運動推廣及合作交流局：執行運動推廣及行銷，與國內外運動業務合作交流等事項。","note":"明定本部設立所屬機關之名稱及業務。"},{"bill":"202110069850000","text":"本部之次級機關及其業務如下：\n一、全民運動暨運動設施局：執行全民運動推廣及行銷，和各運動設施之事務。\n二、運動產業發展局：運動產業培植、獎勵補助及民間聯絡等政策及業務有關之事項。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110072690000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關及其職掌事項。"},{"bill":"202110072350000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑全民運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110072860000","text":"本部之次級機關及其業務如下：\n一、本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。\n二、本部設運動產業發展署，辦理促進運動產業發展與協助運動科技研發、應用之政策規劃及執行。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110073830000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110074060000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"所屬次級機關之名稱及業務。"},{"bill":"202110074490000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"201110072960000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"201110072960000","text":"本署各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條或第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再重申。"},{"bill":"201110072960000","text":"本中心應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報請監督機關備查。\n本中心就執行之公共事務，在不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報請監督機關備查。","note":"一、為期本中心得以有效運作，並具一定程度之自主性，爰於第一項明定本中心應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報請監督機關備查。\n二、由於本中心仍肩負執行特定公共事務之使命，爰於第二項明定本中心就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，可訂定對外發生效力之規章，並提經董事會通過後，報請監督機關備查。"},{"bill":"201110072960000","text":"本中心應訂定組織章程、人事管理、會計制度、內部控制、稽核作業及其他規章，提經董事會通過後，報請監督機關備查。\n本中心就其執行之公共事務，在不牴觸有關法律或法規命令之範圍內，得訂定規章，並提經董事會通過後，報請監督機關備查。","note":"一、本中心於行政法人化之初，即已訂定國家運動訓練中心組織章程，考量該組織章程之性質屬本中心組織架構及業務職掌之重要規章，爰於第一項增列本中心應訂定組織章程，俾資明確。\n二、第二項未修正。"},{"bill":"201110072960000","text":"本部之次級機關及其業務如下：\n一、國民及學前教育署：規劃、推動高級中等以下學校與學前教育政策及制度，並督導、協調、協助各地方高級中等以下學校與學前教育之發展及執行本部所轄高級中等以下學校教育事項。\n二、青年發展署：規劃全國青年發展政策，推動青年生涯輔導、公共參與、國際與體驗學習及其他青年發展事項。","note":"配合運動部之設立，刪除第二款規定。原第三款規定遞移至第二款，內容未修正。"},{"bill":"202110076260000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"明定本部依職掌設次級機關之名稱及主管業務。"},{"bill":"202110076180000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110075690000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"為推廣全民運動與競技運動全民化，專設全民運動署以負責相關業務。"},{"bill":"202110074130000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"明定本部設立所屬機關之名稱及業務。"},{"bill":"202110076630000","text":"本部設全民運動署，辦理全民運動業務，實踐運動平權，形塑運動文化。","note":"明定本部之次級機關及其職掌事項，主要負責辦理全民運動業務，致力推動並實踐運動平權，締造運動文化。"},{"bill":"202110076740000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110076840000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110077820000","text":"本部之次級機關及其業務如下：\n一、全民運動署：辦理全民運動業務，推動競技運動全民化，形塑運動文化。\n二、運動產業發展局：辦理運動相關產業培植、人才培育、獎勵補助等事項之政策執行。","note":"於本條明定本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110077400000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化，執行全民運動推廣及行銷。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110077600000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110077760000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110077910000","text":"本部設全民運動署，辦理全民運動業務，推動運動發展現代化，形塑全民運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110077690000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑全民運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110078140000","text":"本部設全民運動署，辦理全民運動業務，推動競技運動全民化，形塑運動文化。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110078470000","text":"本部設運動推廣及產業發展署，辦理全民運動及運動產業等業務，推動競技運動全民化，形塑運動文化，促進相關產業發展。","note":"本部依職掌所設次級機關之名稱及業務。"},{"bill":"202110078520000","text ","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"202110072860000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"202110073830000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"202110074060000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"派員駐外及相關規定。"},{"bill":"202110074490000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"201110072960000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"201110072960000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"201110072960000","text":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與運動產業相關之學者、專家。\n三、民間企業經營、管理專家及對國家體育運動有重大貢獻之社會人士。\n前項第一款之董事，不得逾董事總人數三分之一；第二款之董事，不得少於董事總人數二分之一。\n第一項董事，任一性別不得少於董事總人數三分之一。","note":"一、考量本中心組織規模，董事人數定為十一人至十五人，又為落實本中心任務執行，爰於第一項明定本中心董事資格、遴聘及解聘方式。第一款所定「政府相關機關」，例如經濟部、國家通訊傳播委員會、文化部、交通部、內政部、財政部、國家科學及技術委員會、數位發展部及教育部等；第二款所定「與運動產業相關之學者、專家」，包括運動產業相關領域之民間學會成員等，第三款所定「對國家體育運動有重大貢獻之社會人士」，主要係借重其對於運動產業之經驗分享及實務建議。\n二、第二項明定第一項第一款規定政府機關代表人數之比例限制，以維持其獨立性，並明定第一項第二款規定運動產業相關之學者、專家代表人數之保障比例，以發揮渠等所長。\n三、第三項明定董事之任一性別之保障比例。"},{"bill":"201110072960000","text":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與運動相關之學者、專家。\n三、民間企業經營、管理專家。\n四、對國家體育運動有重大貢獻之社會人士。\n前項第一款之董事不得逾董事總人數三分之一；第二款之董事不得少於董事總人數二分之一。\n第一項董事，應至少一人具原住民身分；任一性別不得少於董事總人數三分之一。","note":"一、第一項及第二項未修正。\n二、為期明確，修正第三項，增列「董事」二字。"},{"bill":"201110072960000","text":"本中心設董事會，置董事十一人至十五人，由監督機關就下列人員遴選提請行政院院長聘任之；解聘時，亦同：\n一、政府相關機關代表。\n二、與運動科學相關之學者、專家。\n三、民間企業經營、管理專家及對國家體育運動有重大貢獻之社會人士。\n前項第一款之董事，不得逾董事總人數三分之一；第二款之董事，不得少於董事總人數二分之一。\n第一項董事，任一性別不得少於董事總人數三分之一。","note":"一、第一項及第二項未修正。\n二、為期明確，修正第三項，增列「董事」二字。"},{"bill":"202110076260000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"明定本部業務辦事需要得派員駐外，並應保障相關駐外人員之權益。"},{"bill":"202110076180000","text":"本部為應業務需要，得報請行政院核准，派員 t":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"202110078720000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"202110080290000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"202110080570000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動部職掌函括運動外交、運動產業、運動文化、運動平權、競技運動等業務，為促進各項運動業務發展，實有借重相關領域之學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以符合多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110081030000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"202110081370000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"},{"bill":"202110084150000","text":"本部為應業務需要，得報經行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"考量本部業務派員駐境外辦事之需要，需經行政院核准，爰為本條之規定。"},{"bill":"202110083570000","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","note":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。"}],"changed":true,"final":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。","finalWhy":"本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。","review":{"note":"照行政院提案通過","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。"}},{"no":"第七條","current":"本中心置監事三人，互推一人為常務監事。\n監事由監督機關就具運動、法律或會計等相關學識經驗者遴選提請行政院院長聘任之；解聘時，亦同。\n第一項監事，任一性別不得少於總人數三分之一。","versions":[{"bill":"202110033000000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"鑒於中央政府機關總員額法第六條已授權各機關訂定編制表，惟考量本法於第三條及第四條對於首長、副首長及幕僚長配置之規定下，爰於本條員額之編制，明定另以編制表定之。"},{"bill":"202110070210000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法授權各機關訂定編制表，惟考量本法於第三、第四條對於首長、副首長及幕僚長配置之規定下，爰於本條員額之編制，明定另以編制表定之。"},{"bill":"202110069850000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110072690000","text":"本部各一級業務單位之主管、副主管其中一人，必要時，得比照下列資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之：\n一、主管得比照專科以上學校副教授、教授之資格或副教授及專業技術人員之資格聘任。\n二、副主管得比照專科以上學校副教授之資格或副教授及專業技術人員之資格聘任。","note":"一、鑒於運動發展日趨多元及專業，並已被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之推展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位之主管、副主管其中一人，必要時得彈性進用，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，定由本部核定之。另其所具八十五年一月三十一日以前（及教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110072350000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"本部各職稱之官等職等及員額，另以編制表定之。"},{"bill":"202110072860000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110073830000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110074060000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"為廣納人才，故擴張一級業務單位主管之聘任範圍。"},{"bill":"202110074490000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"201110072960000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"201110072960000","text":"本中心置監事三人，由監督機關就具運動產業、法律或會計等相關學識經驗者遴選，提請行政院院長聘任之；解聘時，亦同。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於監事總人數三分之一。","note":"一、第一項為發揮監督功能，爰明定本中心監事應具運動產業、法律或會計等相關學識經驗者，並規定監事人數及其遴聘、解聘方式。\n二、第二項明定常務監事之選任方式。\n三、第三項明定監事之任一性別之保障比例。"},{"bill":"201110072960000","text":"本中心置監事三人，互推一人為常務監事。\n監事由監督機關就具運動、法律或會計等相關學識經驗者遴選提請行政院院長聘任之；解聘時，亦同。\n第一項監事，任一性別不得少於監事總人數三分之一。","note":"一、第一項及第二項未修正。\n二、為期明確，修正第三項，增列「監事」二字。"},{"bill":"201110072960000","text":"本中心置監事三人，由監督機關就具運動科學、法律或會計等相關學識經驗者遴選，提請行政院院長聘任之；解聘時，亦同。\n監事應互選一人為常務監事。\n第一項監事，任一性別不得少於監事總人數三分之一。","note":"一、第一項及第二項未修正。\n二、為期明確，修正第三項，增列「監事」二字。"},{"bill":"202110076260000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"為促進各項運動有關業務之發展，有借重學界專家協助推動之必要，明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任及比照教師退休撫卹，以滿足本部多元人才進用之需求。"},{"bill":"202110076180000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110075690000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"為確保運動部業務的專業性，允許以學術機構等級聘任相關專業人才。"},{"bill":"202110074130000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110076630000","text":"本部一級業務單位之主管，必要時得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，從運動教育、運動競技、運動外交、運動平權、多元運動環境、社會包容及永續發展，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。"},{"bill":"202110076740000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運 、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。","review":{"note":"照行政院提案通過","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。"}},{"no":"第八條","current":"董事、監事任期為四年，期滿得續聘一次。但續聘人數不得超過總人數三分之二，不得少於三分之一。\n代表政府機關之董事，應依其職務異動改聘，不受前項續聘次數之限制；依第六條第一項第二款至第四款及前條第二項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","versions":[{"bill":"202110033000000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110070210000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110069850000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110072690000","text":"本部及所述機關為應運動發展，多元化進用人才，得依照聘用人員聘用條例之規定，聘用運動領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣壯年、兒少及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依照聘用人員聘用條例之規定聘用運動領域專業人員。"},{"bill":"202110072350000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110072860000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"202110073830000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"202110074060000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"為廣納人才，擴張運動部人才之進用範圍。"},{"bill":"202110074490000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"201110072960000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"201110072960000","text":"董事、監事任期為四年，期滿得續聘之。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關出任之董事，應依其職務異動改聘；依第六條第一項第二款、第三款及前條第一項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","note":"一、第一項明定董事、監事任期。參考國家運動訓練中心設置條例第八條及國家運動科學中心設置條例第八條董事任期均為四年，爰將董事、監事之任期定為四年，又為應實務運作彈性，明定董事、監事任期屆滿得續聘之。\n二、第二項明定董事為政府機關代表者，依其職務異動改聘；並明定董事、監事任期屆滿前出缺補聘之方式及補聘者之任期。"},{"bill":"201110072960000","text":"董事、監事任期為四年，期滿得續聘之。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關之董事，應依其職務異動改聘；依第六條第一項第二款至第四款及前條第二項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","note":"一、為配合實務運作並兼顧董事、監事之專業性，爰刪除第一項所定董事、監事僅得續聘一次之規定，並酌作文字修正。\n二、配合第一項有關董事、監事僅得續聘一次之規定業已刪除，爰刪除第二項有關代表政府機關之董事，應依其職務異動改聘，不受續聘次數限制之規定。"},{"bill":"201110072960000","text":"董事、監事任期為四年，期滿得續聘之。但續聘人數不得逾總人數三分之二，不得少於三分之一。\n代表政府機關出任之董事，應依其職務異動改聘；依第六條第一項第二款、第三款及前條第一項聘任之董事、監事，任期屆滿前出缺者，由監督機關遴選提請行政院院長補聘之，其任期至原任者任期屆滿時為止。","note":"一、為配合實務運作並兼顧董事、監事之專業性，爰刪除第一項所定董事、監事僅得續聘一次之規定，並酌作文字修正。\n二、配合第一項有關董事、監事僅得續聘一次之規定業已刪除，爰刪除第二項有關代表政府機關之董事，應依其職務異動改聘，不受續聘次數限制之規定。"},{"bill":"202110076260000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。\n前項進用人才具原住民身分者，不得低於百分之二十。","note":"明定本部及所屬機關應採多元進用人才制度並保障進用原住民之人數比例。"},{"bill":"202110076180000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動增進健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"202110075690000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"確保運動部能靈活運用人力資源，聘請相關領域的專業人才以推動運動事務。"},{"bill":"202110074130000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"202110076630000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立之重要核心目標即為「提倡全民運動，增進國民健康」，為實現目標，需投入相關運動專業人力，以順利推廣各年齡層、各族群之運動相關事務；爰明定本部及所屬機關得依《聘用人員聘用條例》之規定聘 運動相關領域專業人員。"},{"bill":"202110084150000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110083570000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"}],"changed":true,"final":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","finalWhy":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。","review":{"note":"照行政院提案通過","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。"}},{"no":"第九條","current":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告尚未復權。\n四、褫奪公權尚未復權。\n五、經公立醫院證明身心障礙致不能執行職務。\n董事、監事有前項情形之一或無故連續不出席董事會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反本條例所定利益迴避原則或第十五條第一項前段特定交易行為禁止之情事，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","versions":[{"bill":"202110072690000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，為利明確，爰明定本部各職稱之官等職等及員額，另以編制表定之。"},{"bill":"202110072860000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110073830000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110074060000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"編制表之規定。"},{"bill":"202110074490000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"201110072960000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"201110072960000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n董事、監事有前項情形之一或無故連續不出席、不列席董事會會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十四條或第十五條第一項利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、第一項明定不得聘任為董事、監事之情事。\n二、第二項明定董事、監事應予解聘之情事。\n三、第三項明定董事、監事得予解聘之情事。\n四、為保障當事人權益，爰於第四項明定監督機關於解聘董事、監事前，應給予當事人陳述意見及申辯之機會。\n五、第五項明定董事、監事之遴聘、解聘、補聘相關事項之辦法，由監督機關定之。"},{"bill":"201110072960000","text":"有下列情事之一者，不得聘任為董事、監事：\n一、受監護宣告或輔助宣告尚未撤銷。\n二、受有期徒刑以上刑之判決確定，而未受緩刑之宣告。\n三、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n四、褫奪公權尚未復權。\n董事、監事有前項情形之一或無故連續不出席、不列席董事會會議達三次者，應予解聘。\n董事、監事有下列各款情事之一者，得予解聘：\n一、行為不檢或品行不端，致影響本中心形象，有確實證據。\n二、工作執行不力或怠忽職責，有具體事實或違反聘約情節重大。\n三、當屆之本中心年度績效評鑑連續二年未達監督機關所定標準。\n四、違反公務人員行政中立法之情事，有確實證據。\n五、就主管事件，接受關說或請託，或利用職務關係，接受招待或餽贈，致損害公益或本中心利益，有確實證據。\n六、非因職務之需要，動用本中心財產，有確實證據。\n七、違反第十四條或第十五條第一項利益迴避規定，有確實證據。\n八、其他不適任董事、監事職位之行為。\n前項各款情形，監督機關於解聘前，應給予當事人陳述意見及申辯之機會。\n本中心董事、監事之遴聘、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。","note":"一、依消費者債務清理條例第八十四條規定，其他法令關於破產人資格、權利限制之規定，於受法院裁定開始清算程序之債務人均準用，故債務人因法院裁定開始清算程序所受公、私法上資格、權利之限制，與破產人相同，又參酌財團法人法第四十二條第一項第四款、第五十一條第二項第一款之立法例，爰於第一項第三款增列有依消費者債務清理條例經裁定開始清算程序，尚未復權之情事，為本中心董事、監事之消極資格。\n二、身心障礙者權利公約（以下簡稱CRPD）第二十九條，要求締約國應保障身心障礙者享有政治權利及有機會在與其他人平等基礎上享有該等權利。復依一百零三年八月二十日制定公布身心障礙者權利公約施行法，賦予該公約國內法之效力。董事、監事及執行長適任與否，應以是否具備該職務所需專業為考量，又以董事、監事及執行長是否不能執行職務，與其是否為身心障礙者無關，為使本條例更符CRPD精神，爰刪除現行第一項第五款所定不得聘任經公立醫院證明身心障礙致不能執行職務者為董事、監事之規定。\n三、為確保本中心董事會議決議各議案時，監事得以發揮應有之監督功能，爰於第二項增列監事無故不列席董事會議達連續三次者，應予以解聘。\n四、配合修正條文第十四條及第十五條第一項業明定董事、監事之利益迴避有關規範，並明定董事、監事、執行長及其關係人之利益迴避事項，依公職人員利益衝突迴避法（以下簡稱利衝法）之規定辦理，第三項第七款爰配合酌作文字修正。\n五、第四項及第五項未修正。"},{"bill":"201110072960000","text":"本法施行日期，由行政院定之。\n本法修正條文，除中華民國○年○月○日修正之條文施行日期由行政院定之外，自公布日施行。","note":"一、第一項未修正。\n二、配合運動部組織法草案之施行日期由行政院定之，修正第二項規定，明定本法修正條文除本次修正之條文施行日期由行政院定之外，自公布日施行。"},{"bill":"202110076260000","text":"本部各職稱之官等職等及員額，另以編制表定之。\n前項人員，簡任、薦任、委任各官等人員具原住民身分者，均不得低於百分之十。本法所定進用原住民比例，現有員額未達比例者，俟非原住民公務人員出缺後，再行進用補足。","note":"明定本部各官等職等及員額，並保障進用具原住民身分之人員之比例，不得低於百分之十。"},{"bill":"202110076180000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110075690000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"規範運動部內各職位的等級與人數配置。"},{"bill":"202110074130000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"鑒於中央政府機關總員額法第六條已授權各機關訂定編制表，惟考量本法於第三條及第四條對於首長、副首長及幕僚長配置之規定下，爰於本條員額之編制，明定另以編制表定之。"},{"bill":"202110076630000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"明定本部各職稱之官等職等及員額，另以編制表定之，以明確本部之人員配置。"},{"bill":"202110076740000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110076840000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110077820000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量本法僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條明定，應另定員額編制表。"},{"bill":"202110077400000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110077600000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110077760000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110077910000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110078140000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110078470000","text": text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110073830000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110074060000","text":"本部為整合規劃、協調、推動、諮詢第二條第一項各款之業務，應定期就下列事項召開諮詢委員會：\n一、多元運動平權。\n二、兒童及少年運動員保障。\n三、職業選手保障。\n前項諮詢委員會，成員應包括主管機關、目的事業主管機關、選手、教練、多元專業運動人才、學者專家及團體代表。其設置辦法由中央主管機關訂定之，其中單一性別不得少於三分之一、不具官方身分之代表，不得少於委員總人數二分之一。\n第一項第二款之諮詢委員會應包括兒少代表。\n第一項第三款之諮詢委員會應包括職業選手代表與職業選手工會代表。","note":"為強化推動本法所規定之業務，以召開諮詢委員會之方式蒐集各界意見，以強化推動成效。"},{"bill":"202110074490000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"201110072960000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"201110072960000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、第一項明定董事長之聘任。\n二、第二項明定董事長之聘任、解聘、補聘之方式及其他相關事項，由監督機關訂定辦法據以執行。\n三、第三項明定董事長職權及其不能執行職務之代理方式。\n四、考量董事長對內綜理本中心事務，對外代表本中心，職責繁重，宜由具適度身心能力者擔任，並避免其淪為酬傭性質，爰於第四項明定董事長之年齡限制。"},{"bill":"201110072960000","text":"本中心置董事長一人，由監督機關就董事中提請行政院院長聘任之；解聘時，亦同。\n董事長之聘任、解聘、補聘之方式及其他相關事項之辦法，由監督機關定之。\n董事長對內綜理本中心一切事務，對外代表本中心；其因故不能執行職務時，由其指定之董事代行職權，不能指定時，由董事互推一人代行職權。\n董事長初任年齡不得逾六十五歲，任期屆滿前年滿七十歲者，應即更換。但有特殊考量，經行政院核准者，不在此限。","note":"一、考量實務執行上，董事長聘任後，可能會有解聘、補聘或其他相關事項等情形，為使本法授權監督機關訂定之作業辦法內容及範圍明確，爰修正第二項，就授權之內容及範圍，包括增列解聘、補聘之方式及其他相關事項，俾資明確。\n二、第一項、第三項及第四項未修正。"},{"bill":"202110076260000","text":"本法施行日期，由行政院定之。","note":"明定本法施行日期。"},{"bill":"202110076180000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110075690000","text":"本法施行日期，由行政院定之。","note":"明定本法施行日期。"},{"bill":"202110074130000","text":"本法施行日期，由行政院以命令定之。","note":"明定本條例之施行日期。"},{"bill":"202110076630000","text":"本法施行日期，由行政院定之。","note":"明定本法之施行日期，授權由行政院定之。"},{"bill":"202110076740000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110076840000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110077820000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110077400000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"2021100
