<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>運動部組織法制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"運動部組織法","version":"05411:2025-01-07-制定","date":"2025-01-07","action":"制定","title":"運動部組織法　2025 年制定","lede":"這是一部新制定的法。它規定行政院設運動部，辦理全國運動業務，掌理運動政策與法規、多元運動平權、適應運動與身心障礙競技運動、競技選手培育與權益保障、運動產業、國際運動事務、運動設施等事項；部長特任，置政務次長二人、常務次長一人，並設全民運動署。行政院和委員、黨團共提出 35 個草案，名稱有「運動部」「運動發展部」「體育暨運動發展部」三種。司法及法制、教育及文化委員會 2024 年 11 月 13 日聯席會議詢答，11 月 28 日逐條審查完竣：名稱和第二條以外的條文照行政院提案通過，第二條修正部分款次文字，並決議須交黨團協商；審查後才提出的 6 個草案由院會決定逕付二讀、併案協商。12 月 31 日院會決議協商後再行處理；2025 年 1 月 6 日黨團協商的結論是新增附帶決議 1 項、其餘照審查會審查結果通過。1 月 7 日院會照協商結論逐條通過並完成三讀，沒有表決。","summary":"制定運動部的組織法：行政院設運動部辦理全國運動業務，部下設全民運動署。","key":"05411_2025-01-07","props":[{"id":"202110033000000","who":"委員洪孟楷等19人","date":"2024-04-19","name":"「運動發展部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110033000000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/10/LCEWA01_110110_00061.pdf","proposers":["洪孟楷","林倩綺","廖先翔"],"ncosign":16,"people":[["洪孟楷","國民黨","提案"],["林倩綺","國民黨","提案"],["廖先翔","國民黨","提案"],["羅廷瑋","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["王鴻薇","國民黨","連署"],["吳春城","民眾黨","連署"],["葉元之","國民黨","連署"],["張啓楷","民眾黨","連署"],["萬美玲","國民黨","連署"],["葛如鈞","國民黨","連署"],["鄭正鈐","國民黨","連署"],["呂玉玲","國民黨","連署"],["徐巧芯","國民黨","連署"],["林思銘","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["邱鎮軍","國民黨","連署"],["吳宗憲","國民黨","連署"],["高金素梅","無黨籍","連署"]],"party":[["國民黨",16],["民眾黨",2],["無黨籍",1]],"reason":"本院委員洪孟楷、林倩綺、廖先翔等19人，有鑑於社會變遷及生活條件改善等，國內運動人口變多，帶動運動產業興起，國手表現亦提升我國國際能見度，運動發展更加多元化，成為人民重要社會文化生活的一部分。倘若國內仍將體育運動事務置於教育體系，既無法反映運動發展現況，亦未能有效推動運動事務。是以，政府思考運動推廣策略時，應將「運動」的概念取代「體育」，並從「提倡運動風氣」進一步轉為「透過運動帶動城市發展」等思維。惟教育部體育署僅設六組業務單位，所需推動人力與資源恐不足，亦不適合教育體系單獨推廣執行。為避免弱化決策層級、缺乏跨部會統籌能力、具政策性質卻無常設法源依據之組織等問題，應藉提升教育部體育署之位階，成為行政院所屬中央二級機關，方能有效發揮並處理全球體育交流、體育行銷、全民體育、體育產業及扶植運動經濟等，爰擬具「運動發展部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條"]},{"id":"202110070210000","who":"委員楊瓊瓔等21人","date":"2024-10-11","name":"「體育暨運動發展部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110070210000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/04/LCEWA01_110204_00030.pdf","proposers":["楊瓊瓔","顏寬恒","謝龍介","廖偉翔","盧縣一"],"ncosign":16,"people":[["楊瓊瓔","國民黨","提案"],["顏寬恒","國民黨","提案"],["謝龍介","國民黨","提案"],["廖偉翔","國民黨","提案"],["盧縣一","國民黨","提案"],["黃仁","國民黨","連署"],["邱鎮軍","國民黨","連署"],["羅智強","國民黨","連署"],["傅崐萁","國民黨","連署"],["張智倫","國民黨","連署"],["呂玉玲","國民黨","連署"],["鄭正鈐","國民黨","連署"],["葉元之","國民黨","連署"],["葛如鈞","國民黨","連署"],["賴士葆","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["魯明哲","國民黨","連署"],["洪孟楷","國民黨","連署"],["黃健豪","國民黨","連署"],["陳超明","無黨籍","連署"],["徐巧芯","國民黨","連署"]],"party":[["國民黨",20],["無黨籍",1]],"reason":"本院委員楊瓊瓔、顏寬恒、謝龍介、廖偉翔、盧縣一等21人，鑑於國內運動人口增加，近年來國手表現亮眼提升我國國際能見度，運動發展蓬勃發展，運動已經成為國人生活重要的一部分，此外，地方政府陸續設置專責體育之機關，顯示成立專責單位負責推廣全民運動、健全運動產業發展及培育體育人才等工作刻不容緩。現行將體育運動事務限於教育體系，已經無法應對運動發展之現況，所需推動人力與資源不足恐難以有效推動運動事務，應藉提升教育部體育署之位階，成為行政院所屬中央二級機關，方能有效發揮並處理全球體育交流、體育行銷、全民體育、體育產業及扶植運動經濟等，爰擬具「體育暨運動發展部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條"]},{"id":"202110069850000","who":"台灣民眾黨黨團","date":"2024-10-11","name":"「體育暨運動發展部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110069850000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/04/LCEWA01_110204_00056.pdf","proposers":["吳春城","黃國昌","麥玉珍"],"ncosign":0,"people":[["吳春城","民眾黨","提案"],["黃國昌","民眾黨","提案"],["麥玉珍","民眾黨","提案"]],"party":[["民眾黨",3]],"reason":"本院台灣民眾黨黨團，鑑於社會環境及生活條件提升，國內運動人口增加，帶動運動產業興起，運動發展更加多元化，同時選手之表現亦提升我國國際能見度，運動事務在現代社會中扮演的角色愈加重要。惟現今將運動相關事務，置於教育部下屬機關，無法反映運動發展現況，亦未能效率推動運動事務，為避免弱化決策層級、缺乏跨部會統籌能力、具政策性質卻無常設法源依據之組織等問題，應提升教育部體育署之位階，成為行政院所屬中央二級機關，故設立運動發展部以更有效地整合資源，提升行政效能，促進全民運動及產業發展，以創造經濟效益，同時提升我國在國際體育組織中的話語權與影響力，爰擬具「體育暨運動發展部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條"]},{"id":"202110072690000","who":"委員鍾佳濱等16人","date":"2024-10-25","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110072690000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/06/LCEWA01_110206_00247.pdf","proposers":["鍾佳濱"],"ncosign":15,"people":[["鍾佳濱","民進黨","提案"],["何欣純","民進黨","連署"],["陳秀寳","民進黨","連署"],["沈發惠","民進黨","連署"],["李坤 ,18]],"reason":"本院委員陳秀寳、李坤城、邱志偉、郭昱晴、陳亭妃等18人，聯合國教育、科學與文化組織於2015年11月18日修正通過之「體育、身體活動與競技運動國際憲章」第一條即闡明：「體育教育、體育活動及體育運動是每個人所享有的基本權利。」全民運動已然成為國際趨勢，促使全民具有運動之習慣，促進全民健康福祉，儼然成為政府之責任。惟我國規律運動人口占比普遍低落，據體育署統計顯示，112年規律運動人口僅有35%，顯見推動全民運動刻不容緩。除全民運動外，包含運動教育、運動競技、運動產業及運動外交等，打造多元運動環境，落實運動平權，應有專責主管機關規劃及推動；綜整運動資源，壯大運動相關業務，爰擬具「運動部組織法草案」，以利運動相關業務之推行。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110076740000","who":"委員陳亭妃等16人","date":"2024-11-15","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110076740000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/09/LCEWA01_110209_00036.pdf","proposers":["陳亭妃","蔡易餘"],"ncosign":14,"people":[["陳亭妃","民進黨","提案"],["蔡易餘","民進黨","提案"],["賴惠員","民進黨","連署"],["陳秀寳","民進黨","連署"],["陳俊宇","民進黨","連署"],["沈伯洋","民進黨","連署"],["邱議瑩","民進黨","連署"],["鍾佳濱","民進黨","連署"],["羅美玲","民進黨","連署"],["林月琴","民進黨","連署"],["賴瑞隆","民進黨","連署"],["張雅琳","民進黨","連署"],["吳沛憶","民進黨","連署"],["林楚茵","民進黨","連署"],["郭昱晴","民進黨","連署"],["陳培瑜","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員陳亭妃、蔡易餘等16人，為致力促進全民運動，發展運動之教育、競技、產業與外交，推廣運動文化並落實運動多元平權、社會包容及永續發展之價值，以保障基本人權，並順應國際潮流及各界期待，應有成立運動部做為行政院所屬中央二級機關，專責國內運動政策規劃及相關計畫執行機關之必要。爰擬具「運動部組織法草案」，藉由專責且具專業能量之機關，整體規劃運動相關資源，並透過提倡全民運動增進國民健康、強化選手培育及權益保障以促進競技專業發展、推動運動產業促進幸福經濟、推展國際事務讓世界看見臺灣等目標，達到以體育運動壯大臺灣之願景。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110076840000","who":"委員郭昱晴等16人","date":"2024-11-15","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110076840000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/09/LCEWA01_110209_00046.pdf","proposers":["郭昱晴"],"ncosign":15,"people":[["郭昱晴","民進黨","提案"],["賴惠員","民進黨","連署"],["陳秀寳","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["沈伯洋","民進黨","連署"],["陳俊宇","民進黨","連署"],["王正旭","民進黨","連署"],["陳培瑜","民進黨","連署"],["林月琴","民進黨","連署"],["張雅琳","民進黨","連署"],["李坤城","民進黨","連署"],["范雲","民進黨","連署"],["羅美玲","民進黨","連署"],["蔡易餘","民進黨","連署"],["洪申翰","民進黨","連署"],["林淑芬","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員郭昱晴等16人，體育活動不僅是促進個人健康的工具，更是現代國家社會發展的基礎之一。在此基礎上，我國有責任確保國民能夠享有運動的機會和權利，同時應提升運動的國際能見度，以宣傳國家形象。而國家運動發展涉及長期且穩定的資金投入，從運動設施的建設與維護，到運動產業的發展、運動員培育等，都需要充足的經費支持。因此，成立運動發展部是國家體育發展的重要里程碑，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110077820000","who":"委員萬美玲等16人","date":"2024-11-15","name":"「運動發展部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110077820000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/09/LCEWA01_110209_00095.pdf","proposers":["萬美玲"],"ncosign":15,"people":[["萬美玲","國民黨","提案"],["王育敏","國民黨","連署"],["王鴻薇","國民黨","連署"],["張智倫","國民黨","連署"],["柯志恩","國民黨","連署"],["洪孟楷","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["林思銘","國民黨","連署"],["賴士葆","國民黨","連署"],["顏寬恒","國民黨","連署"],["羅明才","國民黨","連署"],["葛如鈞","國民黨","連署"],["林倩綺","國民黨","連署"],["陳菁徽","國民黨","連署"],["盧縣一","國民黨","連署"],["林德福","國民黨","連署"]],"party":[["國民黨",16]],"reason":"本院委員萬美玲等16人，有鑒於全球運動風氣盛行，我國運動人口逐步增加，且運動有助於民眾維持健康，應加強推動全民運動之力度及完善友善運動之環境。另我國選手於各項體育競賽之亮眼表現，亦可推動與他國之運動外交，然當前僅由教育部底下之體育署推動體育暨運動發展相關業務，恐其人力及資源不足，使相關業務推動緩慢，為有效推動運動之教育、競技、環境、產業與外交相關業務，爰擬具「運動發展部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110077400000","who":"委員沈發惠等17人","date":"2024-11-15","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110077400000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/09/LCEWA01_110209_00112.pdf","proposers":["沈發惠"],"ncosign":16,"people":[["沈發惠","民進黨","提案"],["林楚茵","民進黨","連署"],["陳秀寳","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["范雲","民進黨","連署"],["沈伯洋","民進黨","連署"],["陳培瑜","民進黨","連署"],["李坤城","民進黨","連署"],["黃捷","民進黨","連署"],["郭昱晴","民進黨","連署"],["張雅琳","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳俊宇","民進黨","連署"],["羅美玲","民進黨","連署"],["王美惠","民進黨","連署"],["陳素月","民進黨","連署"],["吳沛憶","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員沈發惠等17人，鑒於我國運動相關事務，置於教育部下屬機關，無法反映運動發展現況，聯合國教育、科學與文化組織訂定之「體育、身體活動與競技運動國際憲章」開宗明義闡明，體育、身體活動及競技運動之實踐，為人類基本權利，意即人人都享有運動機會與權利，我國亦戮力於促進全民運動，應提升教育部體育署之位階，成為行政院所屬中央二級機關， ,"國民黨","連署"],["張智倫","國民黨","連署"],["盧縣一","國民黨","連署"],["羅明才","國民黨","連署"],["陳超明","無黨籍","連署"],["廖先翔","國民黨","連署"],["王鴻薇","國民黨","連署"],["黃珊珊","民眾黨","連署"],["馬文君","國民黨","連署"],["涂權吉","國民黨","連署"]],"party":[["國民黨",15],["無黨籍",1],["民眾黨",1]],"reason":"本院委員葛如鈞、蘇清泉、鄭正鈐等17人，有鑑於國人參與運動人口之比例已於二○二三年突破百分之八十二，規律運動人口比例則首度達到百分之三十五，我國運動產業產值亦隨之穩定成長，有望於二○二六年突破新臺幣一兆元，為持續推行全民運動以增進國民健康、強化選手培育及權益保障以促進競技專業發展，應提升教育部體育署之位階，成為行政院所屬中央二級機關，使之能有效推動全民體育，促進運動產業蓬勃發展，透過體育外交與國際接軌，形塑多元運動文化並落實運動平權，爰擬具「運動發展部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110078720000","who":"委員王正旭等16人","date":"2024-11-22","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110078720000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/10/LCEWA01_110210_00062.pdf","proposers":["王正旭","王美惠"],"ncosign":14,"people":[["王正旭","民進黨","提案"],["王美惠","民進黨","提案"],["沈伯洋","民進黨","連署"],["范雲","民進黨","連署"],["林月琴","民進黨","連署"],["王世堅","民進黨","連署"],["沈發惠","民進黨","連署"],["莊瑞雄","民進黨","連署"],["張雅琳","民進黨","連署"],["郭昱晴","民進黨","連署"],["陳培瑜","民進黨","連署"],["郭國文","民進黨","連署"],["洪申翰","民進黨","連署"],["徐富癸","民進黨","連署"],["林淑芬","民進黨","連署"],["黃秀芳","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員王正旭、王美惠等16人，有鑑於聯合國教育、科學與文化組織於2015年11月18日第38屆大會修正通過之「體育、身體活動與競技運動國際憲章」開宗明義闡明，體育、身體活動及競技運動之實踐，為人類基本權利。爰此，人人都享有運動機會與權利，已為國際進步趨勢，亦是我國運動發展政策之重要基石。基此，我國將致力於促進全民運動，落實健康台灣，發展運動之推廣、教育、競技、產業、科學研究與外交，形塑運動文化並落實運動多元平權、社會包容及永續發展之價值，以保障基本人權，並符應國際潮流及各界期待。為推動及落實上開運動發展政策，實有成立運動部（以下簡稱本部）之必要，藉由專責且具專業能量之機關，整體規劃運動相關資源，並透過提倡全民運動增進國民健康、強化選手培育及權益保障以促進競技專業發展、推動運動產業促進幸福經濟、推展國際事務讓世界看見臺灣等目標，達到以體育運動壯大臺灣之願景。此外，原由教育部體育署辦理之運動教育、全民運動、競技運動、運動產業、國際與兩岸運動及運動設施政策規劃、輔導及行政監督等事項，為整合相關業務，將改由本部辦理。至於學校體育包括十二年國民教育課程綱要及體育教學（包括場館設施等）部分，則由教育部辦理。爰依中央行政機關組織基準法第四條第一項第一款規定，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110080290000","who":"委員伍麗華Saidhai Tahovecahe等16人","date":"2024-11-29","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110080290000/details","pdf":"https://ppg.ly.gov.tw/ppg/d ,"國民黨","連署"],["林憶君","民眾黨","連署"],["謝龍介","國民黨","連署"]],"party":[["國民黨",17],["民眾黨",1]],"reason":"本院委員徐巧芯、葉元之、陳菁徽、黃健豪等18人，為了有效推動我國運動發展，提升全民運動參與及增進國民健康，應將現行教育部體育署升格為專責的運動部。近年來，我國運動風氣日盛，運動產業與科技蓬勃發展，但目前體育署隸屬於教育部，造成資源與人力不足，影響運動政策的推動。鑒於國際體育事務發展及我國選手的亮眼表現，設立專責運動部，有助於整合資源、促進運動教育、競技與產業發展，並加強運動外交，全面提升我國運動實力及國際影響力，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110081370000","who":"委員陳菁徽等17人","date":"2024-12-06","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110081370000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00149.pdf","proposers":["陳菁徽"],"ncosign":9,"people":[["陳菁徽","國民黨","提案"],["牛煦庭","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["林沛祥","國民黨","連署"],["陳玉珍","國民黨","連署"],["葉元之","國民黨","連署"],["林倩綺","國民黨","連署"],["黃建賓","國民黨","連署"],["張智倫","國民黨","連署"],["許宇甄","國民黨","連署"]],"party":[["國民黨",10]],"reason":"本院委員陳菁徽等17人，有鑑於近來台灣運動員在國際賽事中的優異表現，不僅帶來國內的歡欣鼓舞，也提升了台灣在國際社會的能見度。近期如中華隊在世界12強棒球賽中奪冠，這是我國棒球史上的重大突破，而棒球以外，台灣在舉重、跆拳道、羽球與拳擊等運動項目，也常於國際賽事中取得顯著的佳績，此些成果，再再展現了台灣選手的實力和韌性。然而，這些成功背後需要有系統性的支持，包括完善的訓練設施、專業的教練團隊以及充足的資源投入。現實中，台灣的運動發展仍面臨諸多挑戰，如資源投入不足、分配不均，從更博觀的角度來看，國家對於全民運動的推廣也有待加強；從組織面而言，台灣的運動政策由多個部門共同推動，往往造成資源分散、政策執行效率不彰等疑慮。運動產業的發展需要政府的統籌與支持，成立專責部門才可整合各方資源，統籌規劃運動政策，為促進國內體育全面發展，強化體育行政組織體系，提升台灣運動的國際競爭力，並兼顧運動員權益保障與心理健康支持，爰擬具「運動部組織法草案」，作為運動部設立及運作之法源基礎。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110083570000","who":"委員吳琪銘等16人","date":"2024-12-27","name":"「運動部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110083570000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/16/LCEWA01_110216_00332.pdf","proposers":["吳琪銘"],"ncosign":15,"people":[["吳琪銘","民進黨","提案"],["張宏陸","民進黨","連署"],["李柏毅","民進黨","連署"],["郭國文","民進黨","連署"],["李坤城","民進黨","連署"],["王美惠","民進黨","連署"],["何欣純","民進黨","連署"],["陳俊宇","民進黨","連署"],["蘇巧慧","民進黨","連署"],["蔡易餘","民進黨","連署"],["陳素月","民進黨","連署"],["邱志偉","民進黨","連署"],["徐富癸","民進黨","連署"],["陳秀寳","民進黨","連署"],["郭昱晴","民進黨","連署"],["劉建國","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員吳琪銘等16人，為致力促進全民運動，發展運動之教育、競技、產業與外交，推廣運動文化並落實運動多元平權、社會包容及永續發展之價值，並順應國際潮流及各界期待及實踐聯合國永續發展目標，應有成立運動部專責國內運動政策規劃及相關計畫執行機關之必要，以利運動相關業務之推行，爰擬具「運動部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條"]},{"id":"202110084150000","who":"委員王鴻薇等20人","date":"2025-01-03","name":"「運動發展部組織法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110084150000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/16/LCEWA01_110216_00016.pdf","proposers":["王鴻薇"],"ncosign":19,"people":[["王鴻薇","國民黨","提案"],["洪孟楷","國民黨","連署"],["黃健豪","國民黨","連署"],["林沛祥","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["鄭正鈐","國民黨","連署"],["邱鎮軍","國民黨","連署"],["林德福","國民黨","連署"],["陳玉珍","國民黨","連署"],["林思銘","國民黨","連署"],["廖先翔","國民黨","連署"],["盧縣一","國民黨","連署"],["葛如鈞","國民黨","連署"],["魯明哲","國民黨","連署"],["林國成","民眾黨","連署"],["邱若華","國民黨","連署"],["顏寬恒","國民黨","連署"],["蘇清泉","國民黨","連署"],["牛煦庭","國民黨","連署"],["楊瓊瓔","國民黨","連署"]],"party":[["國民黨",19],["民眾黨",1]],"reason":"本院委員王鴻薇等20人，有鑑國內運動習慣日漸興盛、運動產業快速發展，運動選手參與國際賽事亦受到國內重視。然現今相關組織仍隸屬於教育部門，致使運動發展無法有效率因應環境做出相應政策，亦缺乏足夠資源發展。是以，政府思考相關政策時，不應僅侷限於「體育」，而是應以運動政策之發展做全盤考量。為避免運動政策受限於決策層級並提升培育資源，應提升體育之位階，成為行政院所屬中央二級機關，以強化培育、發展及產業推展等，爰擬具「運動發展部組織法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條"]}],"arts":[{"no":"第一條","current":null,"versions":[{"bill":"202110033000000","text":"行政院為辦理國民之體育及運動參與權利保障，健全國內產業及環境，推廣與其他國家之交流，並強化全國體育運動發展業務，特設運動發展部（以下簡稱本部）。","note":"明定運動發展部設立目的及隸屬關係。"},{"bill":"202110070210000","text":"行政院為辦理國民之體育及運動參與權利保障，健全國內產業及環境，推廣與其他國家之交流，並強化全國體育運動發展業務，特設體育暨運動發展部（以下簡稱本部）。","note":"明定體育暨運動發展部設立目的及隸屬關係。"},{"bill":"202110069850000","text":"行政院為辦理國民之體育及運動參與權利保障，健全國內產業及環境，推廣與其他國家之交流，並強化全國體育運動發展業務，特設體育暨運動發展部（以下簡稱本部）。","note":"明定體育暨運動發展部之設立目的及隸屬關係。"},{"bill":"202110072690000","text":"行政院為辦理全國運動業務，促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，特設運動部（以下簡稱本部）。","note":"為推動我國運動發展政策，包括促進全民運動，發展運動之教育、競技、產業與外交，形塑運動文化並落實多元平權、社會包容及永續發展之價值，有設運動部（以下簡稱本部）之必要，爰明定本法之立法目的。"},{"bill":"202110072350000","text":"行政院為辦 動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理與監督。\n九、國際運動事務交流與人才培育；國際賽事舉辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理與監督。\n十、運動設施發展與運動場館之規劃、興整建及永續營運；運動設施與場館分級統籌運用、多元友善運動環境之規劃、推動、管理與監督。\n十一、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n十二、所屬機關辦理全民運動事項之督導。\n十三、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110072350000","text":"本部掌理下列事項：\n一、體育運動政策、制度之綜合規劃、法規研擬、推動及督導。\n二、運動產業發展條例之規劃、落實及獎補助事項。\n三、全民運動發展之綜合規劃、推動及督導。\n四、身心障礙者運動發展之綜合規劃、推動及督導。\n五、高齡運動發展之綜合規劃、推動及督導。\n六、學校體育發展之綜合規劃、推動及督導。\n七、競技運動發展之綜合規劃、推動及督導。\n八、國際及兩岸運動交流發展之規劃、推動及督導。\n九、國際各賽事之規劃、推動、協調及督導。\n十、地方政府運動政策之規劃、推動、獎勵及補助。\n十一、職業運動之推動、聯繫及協調事項。\n十二、運動產業之培植、輔導及發展。\n十三、運動設施之綜合規劃、推動及督導。\n十四、國家運動訓練中心之輔導及監督。\n十五、其他有關體育運動事項。","note":"本部之權限職掌。"},{"bill":"202110072860000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110073830000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110074060000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位等各面向多元運動平權之規劃；運動相關之兒少權益保障措施之推動、輔導、管理及監督。\n三、適應運動發展及人才培育、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動彩券、運 之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進、輔導、管理及監督；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌，並建議規劃相關業務分工為運動文化與資源、運動監理、國際事務、運動產業、競技運動、綜合規劃等業務司；並以全民運動署掌理全民運動之推展、各年齡層運動政策之規劃與執行、適應運動政策之規劃與執行等業務；另除國家運動訓練中心、運科中心外，新設行政法人國家運動發展中心，作為相關政策之執行載體，負責如運動彩券發行、運動產業投融資、運動團體與相關業務之獎補助、運動人才育成、運動設施專業研究單位、國際運動合作等包含但不限於運動產業之業務執行，其以提供運動部於政策落實之全面性支持與人員進用彈性。"},{"bill":"202110077690000","text":"本部掌理下列事項：\n一、體育運動政策、制度之綜合規劃、法規研擬、推動及督導。\n二、運動產業發展條例之規劃、落實及獎補助事項。\n三、全民運動發展之綜合規劃、推動及督導。\n四、身心障礙者運動發展之綜合規劃、推動及督導。\n五、高齡運動發展之綜合規劃、推動及督導。\n六、學校體育發展之綜合規劃、推動及督導。\n七、競技運動發展之綜合規劃、推動及督導。\n八、國際及兩岸運動交流發展之規劃、推動及督導。\n九、國際各賽事之規劃、推動、協調及督導。\n十、地方政府運動政策之規劃、推動、獎勵及補助。\n十一、職業運動之推動、聯繫及協調事項。\n十二、運動產業之培植、輔導及發展。\n十三、運動設施之綜合規劃、推動及督導。\n十四、國家運動訓練中心之輔導及監督。\n十五、其他有關體育運動事項。","note":"本部之權限職掌。"},{"bill":"202110078140000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、新興運動發展、推動、輔導、管理及監督。\n六、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n七、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n八、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n九、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n十、所屬機關辦理全民運動事項之督導。\n十一、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110078470000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、宗教、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110078520000","text":"本部掌理下列事項：\n一、國家運動政策與法規之研擬、規劃、執行、管理及監督。\n二、身心條件、年齡、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、福利、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、發證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之種類、分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進、輔導及督導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他運動相關事項。","note":"本部之職掌權限。"},{"bill":"202110078560000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心條件、性別、族群、區域與社會經濟地位各面向多元運動平權之規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"本部之權限職掌。"},{"bill":"202110078590000","text":"本部掌理下列事項：\n一、運動政策、法制及人力之整合規劃、落實與監督。\n二、運動產業發展條例之規劃、落實及獎補助事項。\n三、全民運動之規劃、執行及督導。\n四、競技運動發展之規劃、執行及督導。\n五、國際及兩岸運動交流發展之規劃、執行及督導。\n六、國際各賽事之爭辦、規劃、執行、協調及督導。\n七、地方政府運動政策之規劃、執行及獎勵與補助。\n八、職業運動之推動、聯繫及協調事項。\n九、運動產業之培植、輔導及發展。\n十、國家運動訓練中心之輔導及監督。\n十一、其他有關體育及運動事項。","note":"本部之權限職掌。"},{"bill":"202110078720000","text":"本部掌理下列事項：\n一、運動政策與法規之研擬、規劃、推動、管理及監督。\n二、身心健康條件、性別、年齡、族群、區域與社會經濟地位各面向多元運動平權之研究、規劃、推動、輔導、管理及監督。\n三、適應運動發展、帕拉競技與共融運動之規劃、推動、輔導、管理及監督。\n四、競技運動發展與選手之培育、選拔、獎勵、輔導、生涯發展及權益保障；教練與多元運動專業人才之培育、增能、認證、聘用之規劃、推動、管理及監督。\n五、運動產業發展及運動產業人才之培育；職業運動之輔導；運動文化記憶之保存及再現；運動彩券、運動發展基金、多元資金挹注、運動科學研究、發展與創新應用之規劃、推動、管理及監督。\n六、國際運動事務交流與人才之培育；國際賽事籌辦、鼓勵運動人才參與國際運動組織之規劃、推動、管理及監督。\n七、運動設施發展與運動場館之興整建及永續營運；運動設施與場館之分級統籌運用與友善運動環境之規劃、推動、管理及監督。\n八、全國性運動團體業務健全發展與良善治理之促進及輔導；相關機關（構）、團體運動發展事項之協調。\n九、所屬機關辦理全民運動事項之督導。\n十、其他有關運動事項。","note":"一、本部之權限職掌。\n二、本條第四款之「多元運動專業人才」，係包括教練、裁判、防護員、陪練員、物理治療師、運動場館營運人才、賽事規劃及辦理人才等能健全各項運動發展、形塑安全健康運動觀念與專業環境之相關人才。"},{"bill":"202110080290000","text":"本部掌理下列事項：\n一、運動政策之規劃、推動、管理及監督與相 本部業務有派員駐境外辦事需要，考量其特殊性及相關駐外人員之權益，爰為本條規定。","review":{"note":"照行政院提案通過","text":"本部為應業務需要，得報請行政院核准，派員駐境外辦事，並依駐外機構組織通則規定辦理。"}},{"no":"第七條","current":null,"versions":[{"bill":"202110033000000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"鑒於中央政府機關總員額法第六條已授權各機關訂定編制表，惟考量本法於第三條及第四條對於首長、副首長及幕僚長配置之規定下，爰於本條員額之編制，明定另以編制表定之。"},{"bill":"202110070210000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法授權各機關訂定編制表，惟考量本法於第三、第四條對於首長、副首長及幕僚長配置之規定下，爰於本條員額之編制，明定另以編制表定之。"},{"bill":"202110069850000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難窺知機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110072690000","text":"本部各一級業務單位之主管、副主管其中一人，必要時，得比照下列資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之：\n一、主管得比照專科以上學校副教授、教授之資格或副教授及專業技術人員之資格聘任。\n二、副主管得比照專科以上學校副教授之資格或副教授及專業技術人員之資格聘任。","note":"一、鑒於運動發展日趨多元及專業，並已被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之推展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位之主管、副主管其中一人，必要時得彈性進用，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，定由本部核定之。另其所具八十五年一月三十一日以前（及教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110072350000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"本部各職稱之官等職等及員額，另以編制表定之。"},{"bill":"202110072860000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110073830000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"一、鑒於運動發展日趨多元及專業，並被賦予更多功能要求，從永續發展、多元包容到運動外交，更跨足運動產業及運動文化等，為促進各項運動有關業務之發展，確實有借重學者專家協助推動之必要，爰明定本部一級業務單位主管，必要時得彈性進用，比照專科以上學校副教授或教授之資格聘任，以滿足本部多元人才進用之需求。\n二、上開聘任人員之退休、撫卹比照教師相關規定辦理，並由本部核定之。另其所具八十五年一月三十一日以前（即教育人員退撫新制施行以前）年資之退撫經費，由本部編列預算支應。"},{"bill":"202110074060000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核定之。","note":"為廣納人才，故擴張一級業務單位主管之聘任範圍。"},{"bill":"202110074490000","text":"本部一級業務單位主管，必要時，得比照專科以上學校副教授或教授之資格聘任；其退休、撫卹比照教師相關規定辦理，並由本部核 "},{"bill":"202110080290000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。\n前項進用人才具原住民身分者，不得低於百分之十。","note":"一、本部成立核心目標之一為「提倡全民運動增進健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。\n二、原住民族在我國體育表現傑出，亦培育諸多運動產業人才，對我國體育貢獻良多，運動部聘用人員保障原住民進用比例，確保我國運動發展兼具原住民視角，落實族群主流化。"},{"bill":"202110080570000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110081030000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"202110081370000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"},{"bill":"202110084150000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110083570000","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","note":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。"}],"changed":true,"final":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。","finalWhy":"本部成立核心目標之一為「提倡全民運動，增進國民健康」，為達此目標，實需投入運動專業人力，以推廣全齡及特殊族群運動、成立社區運動俱樂部等事務，另為因應運動發展日趨多元專業，人員進用管道宜更為彈性，以符業務推動需求，爰明定本部及所屬機關得依聘用人員聘用條例之規定聘用運動相關領域專業人員。","review":{"note":"照行政院提案通過","text":"本部及所屬機關為應運動發展，多元化進用人才，得依聘用人員聘用條例之規定，聘用運動相關領域專業人員。"}},{"no":"第九條","current":null,"versions":[{"bill":"202110072690000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，為利明確，爰明定本部各職稱之官等職等及員額，另以編制表定之。"},{"bill":"202110072860000","text":"本部各職稱之官等職等及員額，另以編制表定之。","note":"中央政府機關總員額法第六條雖已授權各機關訂定編制表，惟考量如僅於第三條及第四條規定首長、副首長及幕僚長之配置，將難顯現機關人員配置及運作之全貌，爰於本條再予重申。"},{"bill":"202110073830000","text":"本部各職稱之 作之全貌，爰於本條再予重申。","review":{"note":"照行政院提案通過","text":"本部各職稱之官等職等及員額，另以編制表定之。"}},{"no":"第十條","current":null,"versions":[{"bill":"202110072690000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期係由行政院定之，爰予明定。"},{"bill":"202110072860000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110073830000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110074060000","text":"本部為整合規劃、協調、推動、諮詢第二條第一項各款之業務，應定期就下列事項召開諮詢委員會：\n一、多元運動平權。\n二、兒童及少年運動員保障。\n三、職業選手保障。\n前項諮詢委員會，成員應包括主管機關、目的事業主管機關、選手、教練、多元專業運動人才、學者專家及團體代表。其設置辦法由中央主管機關訂定之，其中單一性別不得少於三分之一、不具官方身分之代表，不得少於委員總人數二分之一。\n第一項第二款之諮詢委員會應包括兒少代表。\n第一項第三款之諮詢委員會應包括職業選手代表與職業選手工會代表。","note":"為強化推動本法所規定之業務，以召開諮詢委員會之方式蒐集各界意見，以強化推動成效。"},{"bill":"202110074490000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"201110072960000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110076260000","text":"本法施行日期，由行政院定之。","note":"明定本法施行日期。"},{"bill":"202110076180000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110075690000","text":"本法施行日期，由行政院定之。","note":"明定本法施行日期。"},{"bill":"202110074130000","text":"本法施行日期，由行政院以命令定之。","note":"明定本條例之施行日期。"},{"bill":"202110076630000","text":"本法施行日期，由行政院定之。","note":"明定本法之施行日期，授權由行政院定之。"},{"bill":"202110076740000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110076840000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110077820000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110077400000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110077600000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110077760000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110077910000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110078140000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110078470000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110078520000","text":"本法施行日期，由行政院以命令定之。","note":"明定本條例之施行日期。"},{"bill":"202110078560000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期。"},{"bill":"202110078590000","text":"本法施行日期，由行政院定之。","note":"本法之施行日期 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};

  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));

}

}

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');

const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));
  return p;
}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {

function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {
  box.textContent = '';

  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      const pa = PARTY[normName(t.s)];
      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});

      here.addEventListener('click', () => copyHere(d.id + '-' + d.dataset.fp));

      d.append(who);

      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));

  idx.append(chips);

const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});

let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
</html>
