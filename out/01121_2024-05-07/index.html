<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>國籍法 2024 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

1_110109_00043.pdf","proposers":["林岱樺"],"ncosign":16,"people":[["林岱樺","民進黨","提案"],["王美惠","民進黨","連署"],["郭昱晴","民進黨","連署"],["徐富癸","民進黨","連署"],["陳冠廷","民進黨","連署"],["吳沛憶","民進黨","連署"],["黃秀芳","民進黨","連署"],["黃捷","民進黨","連署"],["王世堅","民進黨","連署"],["張雅琳","民進黨","連署"],["陳亭妃","民進黨","連署"],["鍾佳濱","民進黨","連署"],["賴惠員","民進黨","連署"],["蔡易餘","民進黨","連署"],["林俊憲","民進黨","連署"],["陳素月","民進黨","連署"],["羅美玲","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員林岱樺等17人，鑑於現行國籍法對於無國籍之認定及外國人歸化之特殊功勳均無明文規定，僅以細則作為認定，恐有違法律保留原則。爰擬具「國籍法第二條及第六條條文修正草案」，將無國籍人之認定及殊勳之認定明定入法，避免爭議。是否有當？敬請公決。","arts":["第二條","第六條"]},{"id":"202110034810000","who":"台灣民眾黨黨團","date":"2024-04-19","name":"「國籍法第四條及第七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110034810000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/10/LCEWA01_110110_00172.pdf","proposers":["麥玉珍","黃國昌","黃珊珊","吳春城"],"ncosign":0,"people":[["麥玉珍","民眾黨","提案"],["黃國昌","民眾黨","提案"],["黃珊珊","民眾黨","提案"],["吳春城","民眾黨","提案"]],"party":[["民眾黨",4]],"reason":"本院台灣民眾黨黨團，有鑒於民法成年年齡將修正為十八歲，國籍法第四條第二款之文義將受影響，為遵守法律明確性原則並保障我國十八歲以上未滿二十歲之外國人或無國籍人之歸化資格，應配合修正條文以維護其權益。爰擬具「國籍法第四條及第七條條文修正草案」。是否有當？敬請公決。","arts":["第四條","第七條"]}],"arts":[{"no":"第二條","current":"有下列各款情形之一者，屬中華民國國籍：\n一、出生時父或母為中華民國國民。\n二、出生於父或母死亡後，其父或母死亡時為中華民國國民。\n三、出生於中華民國領域內，父母均無可考，或均無國籍者。\n四、歸化者。\n前項第一款及第二款規定，於本法中華民國八十九年二月九日修正施行時未滿二十歲之人，亦適用之。","versions":[{"bill":"202110017780000","text":"有下列各款情形之一者，屬中華民國國籍：\n一、出生時父或母為中華民國國民。\n二、出生於父或母死亡後，其父或母死亡時為中華民國國民。\n三、出生於中華民國領域內，父母均無可考，或均無國籍者。\n四、歸化者。\n前項第一款及第二款規定，於本法中華民國八十九年二月九日修正施行時未滿二十歲之人，亦適用之。\n出生於中華民國領域內，其母為外國人，但有事實足認其行方不明者，視同無可考。","note":"一、增列第三項。\n二、依聯合國兒童權利公約第二條規定略以，簽約國不因兒童、父母或法定監護人之國籍或其他身分地位之不同而有所歧視；第七條規定略以，兒童於出生後應立即被登記，並自出生起即應有取得姓名及國籍之權利。\n三、移民署統計，累計至111年底，接收國健署非本國籍新生兒通報數為15,555筆，經比對及篩濾產婦資料後，其生母為失聯移工或不實身分者計3,098人，其人數及占比皆有上升趨勢。\n四、本條第三項所稱有事實足認其行方不明者，由中央主管機關認定之。"},{"bill":"202110027850000","text":"有下列各款情形之一者，屬中華民國國籍：\n一、出生時父或母為中華民國國民。\n二、出生於父或母死亡後，其父或母死亡時為中華民國國民。\n三、出生於中華民國領域內，父母均無可考，或均無國籍者。\n四、歸化者。\n前項第一款及第二款規定，於本法中華民國八十九年二月九日修正施行時未滿二十歲之人，亦適用之。\n本法所稱無國籍人，指任何國家依該國法律，認定不屬於該國國民者。\n有下列各款情形之一者，得認定為無國籍人：\n一、持外國政府核發載明無國籍之旅行身分證件。\n二、符合入出國及移民法第十六條第二項至第四項規定之泰國、緬甸、印尼、印度或尼泊爾地區無國籍人民，持有載明無國籍之外僑居留證。\n三、其他經內政部認定。\n前項第三款之認定要件、應備文件、處理程序及其他相關事項之標準，由內政部定之。","note":"一、按本法施行細則第三條規定，本法所稱「無國籍人」，係指任何國家依該國法律，認定不屬於該國國民者。如有「持外國政府核發載明無國籍之旅行身分證件」、「符合入出國及移民法第十六條第二項至第四項規定之泰國、緬甸、印尼、印度或尼泊爾地區無國籍人民，持有載明無國籍之外僑居留證」或「其他經內政部認定」情形，亦得認定為無國籍人。\n二、惟有無國籍事涉個人重要權利義務關係事項，應依循現代法治國原則及民主要求制定法律或有法律明確之授權為依據。如以法律授權主管機關發布命令為補充規定時，其授權亦應符合具體明確之原則。若僅屬執行法律之細節性、技術性事項，始得由主管機關發布命令為必要之規範。而「無國籍人」之認定，既涉個人重要權利義務關係，僅以本法第二十二條作為概括性授權依據之施行細則第三條第二項第三款逕予規定，甚至賦予內政部得逕為認定無國籍人，是否妥適，似不無疑義。蓋本法既無明文復未有明確授權，且自本法第一條立法目的及本法規範體系綜合觀察，亦無從推知可供主管機關自為認定時得以遵循之方針指示或概念框架，僅以本法施行細則予以規範，恐有違反法律保留原則之疑慮。\n三、爰新增第三項、第四項及第五項規定，如修正條文所示。"},{"bill":"202110029400000","text":"有下列各款情形之一者，屬中華民國國籍：\n一、出生時父或母為中華民國國民。\n二、出生於父或母死亡後，其父或母死亡時為中華民國國民。\n三、出生於中華民國領域內，父母均無可考，或均無國籍者。\n四、歸化者。\n前項第一款及第二款規定，於本法中華民國八十九年二月九日修正施行時未滿二十歲之人，亦適用之。\n本法所稱無國籍人，指任何國家依該國法律，認定不屬於該國國民者。\n有下列各款情形之一者，得認定為無國籍人：\n一、持外國政府核發載明無國籍之旅行身分證件。\n二、符合入出國及移民法第十六條第二項至第四項之規定者。","note":"有關無國籍人之認定，事涉個人重要權利義務關係，僅以施行細則作為認定有欠妥當。爰提案增訂第二條第三至四項，以符合法律保留原則。"}],"changed":false,"final":"有下列各款情形之一者，屬中華民國國籍：\n一、出生時父或母為中華民國國民。\n二、出生於父或母死亡後，其父或母死亡時為中華民國國民。\n三、出生於中華民國領域內，父母均無可考，或均無國籍者。\n四、歸化者。\n前項第一款及第二款規定，於本法中華民國八十九年二月九日修正施行時未滿二十歲之人，亦適用之。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第四條","current":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚未成年之外國人或無國籍人，其父、母、養父或養母現為中華民國國民者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化。","versions":[{"bill":"201110009790000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，有下列情形之一者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化：\n一、父、母、養父或養母現為中華民國國民。\n二、現由社會福利主管機關或社會福利機構監護。","note":"一、第二項修正如下：\n(一)配合民法成年年齡調降，為明確計，涉及外國人部分定明成年年齡，爰將「未婚未成年」修正為「未婚且未滿十八歲」。\n(二)為處理出生於我國領域內，生父不詳，生母為外國人且行方不明，或已出境或遭遣返回國後行方不明之非本國籍無依兒童與少年身分認定事宜，內政部業於一百零六年一月九日訂頒「在臺出生非本國籍兒童、少年申請認定為無國籍人一覽表及流程」，如渠等經外交部或內政部移民署協尋生母行蹤未果（國外協尋生母行蹤逾三個月未果或國內協尋生母行蹤逾六個月未果），且洽生母原屬國政府確認渠等無該國國籍或逾三個月無回應，內政部即依國籍法施行細則第三條規定認定渠等為無國籍人，並由國人養父、養母或社政機關監護人代為申請歸化，另渠等社會福利服務、醫療照顧、就學權益等事項依兒童及少年福利與權益保障法第二十二條第二項規定，均應依法予以保障。\n(三)考量上揭兒童及少年最佳利益，落實聯合國兒童權利公約第七條規範意旨，以保障渠等身分權益，避免成為無國籍人，爰將渠等得申請歸化之情形分款規定，現行規定列為序文，並增訂「有下列情形之一者」等文字，現行所定「其父、母、養父或養母現為中華民國國民」移為第一款；另增訂第二款規定未婚且未滿十八歲之外國人或無國籍人，由社會福利主管機關或社會福利機構為其監護人者，得由社會福利主管機關或社會福利機構申請歸化。\n二、第一項未修正。"},{"bill":"202110012830000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚，或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚未成年之外國人或無國籍人，其父、母、養父或養母現為中華民國國民者，或其監護人為法院裁定之社會福利主管機關者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化。","note":"一、移民署統計，累計自96年1月至108年6月底，移民署接收之非本國籍新生兒通報有9,381人，經比對及篩濾產婦資料，其中生母為失聯移工或不實身分者計754人。\n二、依聯合國兒童權利公約第二條規定略以，簽約國不得因為兒童及其父母或法定監護人之國籍或其他身分之不同而有任何差別待遇；第七條規定，兒童於出生後應立即被登記，並自出生起即應有取得姓名及國籍的權利。\n三、目前經社會福利主管機關監護之非本國籍無依兒少經認定為無國籍人，倘未被國人收養，迄滿20歲前，依現行國籍法規定無法申請歸化。自106年內政部函頒相關作業流程後，未滿20歲之是類兒少方能由直轄市、縣（市）社會福利主管機關代當事人向戶政事務所送件申請歸化國籍。\n四、非本國籍兒少若無穩定身分恐影響其身心發展，且我國人口面臨少子化問題，基於渠等權益及我國國家利益，爰提案修正國籍法第四條，其監護人為法院裁定之社會福利主管機關者，得申請歸化我國國籍。"},{"bill":"202110022170000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，有下列情形之一者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化：\n一、父、母、養父或養母現為中華民國國民。\n二、現由社會福利主管機關或社會福利機構監護。","note":"一、修正第二項。\n二、配合《民法》成年年齡調降，並明確外國人適用之成年年齡，將「未婚未成年」修正為「未婚且未滿十八歲」。\n三、為落實《聯合國兒童權利公約》第七條規範意旨，保障兒童身分權益，避免成為無國籍人，爰將得第二項外國人及無國籍人得申請歸化之情形分款規定，並另增訂第二款，明定未婚且未滿十八歲之外國人或無國籍人，由社會福利主管機關或社會福利機構為其監護人者，得由社會福利主管機關或社會福利機構申請歸化。"},{"bill":"202110021360000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，其父、母、養父或養母現為中華民國國民者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化。","note":"配合民法成年定義規定之修正，將本條文中未成年修正為未滿十八歲。"},{"bill":"202110021490000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，有下列情形之一者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化：\n一、父、母、養父或養母現為中華民國國民。\n二、現由社會福利主管機關或社會福利機構監護。","note":"一、配合《民法》成年年齡調降，爰將第二項「未婚未成年」修正為「未婚且未滿十八歲」。\n二、為處置出生於我國領域內，生父不詳，生母為外國人且行方不明，或已出境或遭遣返回國後行方不明之非本國籍無依兒童與少年身分認定，內政部業於一百零六年一月九日訂頒「在臺出生非本國籍兒童、少年申請認定為無國籍人一覽表及流程」，如渠等經外交部或內政部移民署協尋生母行蹤未果（國外協尋生母行蹤逾三個月未果或國內協尋生母行蹤逾六個月未果），且洽生母原屬國政府確認渠等無該國國籍或逾三個月無回應，內政部即依《國籍法》施行細則第三條規定認定渠等為無國籍人，並由國人養父、養母或社政機關監護人代為申請歸化，另渠等社會福利服務、醫療照顧、就學權益等事項依《兒童及少年福利與權益保障法》第二十二條第二項規定，均有所保障。\n三、為照顧上揭兒童及少年最佳利益，並落實聯合國兒童權利公約第七條規範意旨，以保障渠等身分權益，避免其成為無國籍人，爰將渠等得申請歸化之情形分款規定，並增訂第二款，明定未婚且未滿十八歲之外國人或無國籍人，由社會福利主管機關或社會福利機構為其監護人者，得由社會福利主管機關或社會福利機構申請歸化。"},{"bill":"202110021550000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，有下列情形之一者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化：\n一、父、母、養父或養母現為中華民國國民。\n二、現由社會福利主管機關或社會福利機構監護。","note":"一、配合民法已將成年年齡調降，又涉及外國人部分均以年齡規範之體例，爰將「未婚未成年」修正為「未婚且未滿十八歲」，以求法律規範一致性。\n二、新增第二項說明如下：\n(一)依「聯合國兒童權利公約」第七條規定略以，兒童於出生後即應有取得國籍之權利。\n(二)承上，惟我國國籍採「屬人主義」，因此若有「父不詳、生母為外國籍但行方不明」之情形，由於該生母外國籍明確，因此該兒少無法被認定為我國國籍，該兒少極有可能成為無國籍之「非本國籍兒童」。"},{"bill":"202110022080000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚未成年之外國人或無國籍人，有下列情形之一者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化：\n一、父、母、養父或養母現為中華民國國民。\n二、現由社會福利主管機關或社會福利機構監護。","note":"一、查我國現行規範，依據「國籍法施行細則」第三條以及內政部訂定之「在臺出生非本國籍兒少申請認定為無國籍人流程」，當兒童及少年生父不詳，生母為行方不明外國人，由內政部請外交部轉駐外館處協助向該生母之原屬國或請內政部移民署協尋生母，如經協尋無法找到生母且生母原屬國不認該兒少具有該國國籍者，或逾3個月無回應，內政部將依國籍法施行細則第三條規定，認定該名兒少為無國籍人。\n二、然僅止於認定為無國籍人，未能滿足《兒童權利公約》第7條所定「取得國籍之權利」，進而無法透過政府之力量給予權利保障，以滿足《兒童權利公約》第6條所定之「生命權」以及對「生存及發展」之保障。\n三、此類兒少因遭父母遺棄，獨立生存極為艱難，方會交由社福主管機關或社福機構監護。故擬修改本條第二項，使其能取得國籍，使其生存及發展能或法律之保障，並滿足我國應《兒童權利公約》所生之責任。"},{"bill":"202110023990000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，其父、母、養父或養母現為中華民國國民者，或現由社會福利主管機關、社會福利機構監護者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化。","note":"一、配合民法成年年齡調降政策，涉及外國人部分均以年齡規範之體例，爰將第二項本文「未婚未成年」修正為「未婚且未滿十八歲」。\n二、考量部分渠等經外交部或內政部移民署協尋生母行蹤未果，且洽生母原屬國政府確認渠等無該國籍或逾三個月無回應，內政部依法認定渠等為國籍人，並由國人養父、養母或社政機關監護人代為申請歸化之兒童及少年最佳利益，為落實聯合國兒童權利公約第七條規範意旨，以保障渠等身分權益，避免成為無國籍者，增訂未婚且未滿十八歲之外國人或無國籍人，由社會福利主管機關或社會福利機構為其監護人者，得由社會福利主管機關或社會福利機構申請歸化。"},{"bill":"202110024020000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚，或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，有下列情形之一者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化：\n一、父、母、養父或養母現為中華民國國民。\n二、現由社會福利主管機關或社會福利機構監護。","note":"一、第二項修正如下：\n(一)配合民法成年年齡調降，為明確計，涉及外國人部分定明成年年齡，爰將「未婚未成年」修正為「未婚且未滿十八歲」。\n(二)為處理出生於我國領域內，生父不詳生母為外國人且行方不明，或已出境或遭遣返回國後行方不明之非本國籍無依兒童與少年身分認定事宜，內政部業於一百零六年一月九日訂頒「在臺出生非本國籍兒童、少年申請認定為無國籍人一覽表及流程」，如渠等經外交部或內政部移民署協尋生母行蹤未果（國外協尋生母行蹤逾三個月未果或國內協尋生母行蹤逾六個月未果），且洽生母原屬國政府確認渠等無該國國籍或逾三個月無回應，內政部即依國籍法施行細則第三條規定認定渠等為無國籍人，並由國人養父、養母或社政機關監護人代為申請歸化，另渠等社會福利服務、醫療照顧、就學權益等事項依兒童及少年福利與權益保障法第二十二條第二項規定，均應依法予以保障。\n(三)考量上揭兒童及少年最佳利益，落實聯合國兒童權利公約第七條規範意旨以保障渠等身分權益，避免成為無國籍人，爰將渠等得申請歸化之情形分款規定，現行規定列為序文，並增訂「有下列情形之一者」等文字，現行所定「其父、母、養父或養母現為中華民國國民」移為第一款；另增訂第二款規定未婚且未滿十八歲之外國人或無國籍人，由社會福利主管機關或社會福利機構為其監護人者，得由社會福利主管機關或社會福利機構申請歸化。\n二、第一項未修正。"},{"bill":"202110034810000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿二十歲之外國人或無國籍人，其父、母、養父或養母現為中華民國國民者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化。","note":"配合民法成年年齡調降政策，國籍法第二條已配合民法修改法規，調整相關的年齡規範。有關本法涉及外國人歸化年齡部分，為保障十八歲以上未滿二十歲人之歸化權益，將本條文中「未婚未成年」修正為「未婚且未滿二十歲」。"}],"changed":true,"final":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，有下列情形之一者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化：\n一、父、母、養父或養母現為中華民國國民。\n二、現由社會福利主管機關或社會福利機構監護。","finalWhy":"一、第二項修正如下：\n(一)配合民法成年年齡調降，為明確計，涉及外國人部分定明成年年齡，爰將「未婚未成年」修正為「未婚且未滿十八歲」。\n(二)為處理出生於我國領域內，生父不詳，生母為外國人且行方不明，或已出境或遭遣返回國後行方不明之非本國籍無依兒童與少年身分認定事宜，內政部業於一百零六年一月九日訂頒「在臺出生非本國籍兒童、少年申請認定為無國籍人一覽表及流程」，如渠等經外交部或內政部移民署協尋生母行蹤未果（國外協尋生母行蹤逾三個月未果或國內協尋生母行蹤逾六個月未果），且洽生母原屬國政府確認渠等無該國國籍或逾三個月無回應，內政部即依國籍法施行細則第三條規定認定渠等為無國籍人，並由國人養父、養母或社政機關監護人代為申請歸化，另渠等社會福利服務、醫療照顧、就學權益等事項依兒童及少年福利與權益保障法第二十二條第二項規定，均應依法予以保障。\n(三)考量上揭兒童及少年最佳利益，落實聯合國兒童權利公約第七條規範意旨，以保障渠等身分權益，避免成為無國籍人，爰將渠等得申請歸化之情形分款規定，原規定列為序文，並增訂「有下列情形之一者」等文字，原所定「其父、母、養父或養母現為中華民國國民」移為第一款；另增訂第二款規定未婚且未滿十八歲之外國人或無國籍人，由社會福利主管機關或社會福利機構為其監護人者，得由社會福利主管機關或社會福利機構申請歸化。\n二、第一項未修正。","review":{"note":"照行政院提案通過","text":"外國人或無國籍人，現於中華民國領域內有住所，具備前條第一項第二款至第五款要件，於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續三年以上，並有下列各款情形之一者，亦得申請歸化：\n一、為中華民國國民之配偶，不須符合前條第一項第四款。\n二、為中華民國國民配偶，因受家庭暴力離婚且未再婚；或其配偶死亡後未再婚且有事實足認與其亡故配偶之親屬仍有往來，但與其亡故配偶婚姻關係已存續二年以上者，不受與親屬仍有往來之限制。\n三、對無行為能力、或限制行為能力之中華民國國籍子女，有扶養事實、行使負擔權利義務或會面交往。\n四、父或母現為或曾為中華民國國民。\n五、為中華民國國民之養子女。\n六、出生於中華民國領域內。\n七、為中華民國國民之監護人或輔助人。\n未婚且未滿十八歲之外國人或無國籍人，有下列情形之一者，在中華民國領域內合法居留雖未滿三年且未具備前條第一項第二款、第四款及第五款要件，亦得申請歸化：\n一、父、母、養父或養母現為中華民國國民。\n二、現由社會福利主管機關或社會福利機構監護。"}},{"no":"第五條","current":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n第九條第五項　前項第二款所定高級專業人才之認定標準，由內政部定之。","versions":[{"bill":"201110009790000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、由中央目的事業主管機關推薦之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士及相關機關共同審核通過，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n前項第三款所定高級專業人才之認定要件、審核程序、方式及其他相關事項之標準，由內政部定之。","note":"一、現行條文列為第一項。另鑑於國際上專業人才競逐日益激烈，且我國為延攬外國專業人才，持續檢討放寬相關法規，如訂修外國專業人才延攬及僱用法、入出國及移民法等。為吸引優秀外籍人士來臺，增加渠等歸化我國誘因，爰放寬居留年限之規定，惟考量外籍高級專業人才歸化依修正條文第九條第四項第一款規定無須喪失原有國籍，存在忠誠衝突問題，宜使渠等在我國領域內居留一定期間，以瞭解渠等對我國國家安全無危害，爰參酌法國、英國、新加坡、菲律賓等國立法例，縮短渠等之合法居留年限，渠等如持有我國外僑居留證，並合法居留一定期限，經中央目的事業主管機關推薦，並經內政部召開審查會審核通過後，即可申請歸化我國國籍，爰增訂第三款。\n二、現行第九條第五項移列為第二項，並為使授權明確，增訂相關授權事項。"},{"bill":"202110022170000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、由中央目的事業主管機關推薦之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士及相關機關共同審核通過，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n前項第三款所定高級專業人才之認定要件、審核程序、方式及其他相關事項之標準，由內政部定之。","note":"一、增訂第一項第三款及第二項。\n二、為吸引優秀外籍人士來台，增加歸化我國之誘因，爰增訂第一項第三款放寬其居留年限，並明定經中央目的事業主管機關推薦，並經內政部召開審查會審核通過後，即可申請歸化我國國籍。\n三、增訂第二項，授權內政部制定高及專業人才認定及規畫相關子法。"},{"bill":"202110021490000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、由中央目的事業主管機關推薦之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士及相關機關共同審核通過，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n前項第三款所定高級專業人才之認定要件、審核程序、方式及其他相關事項之標準，由內政部定之。","note":"一、現行條文列為第一項。另鑑於國際上專業人才競逐日益激烈，且我國為延攬外國專業人才，持續檢討放寬相關法規，如訂修外國專業人才延攬及僱用法、入出國及移民法等。為吸引優秀外籍人士來臺，增加渠等歸化我國誘因，爰放寬居留年限之規定，惟考量外籍高級專業人才歸化依修正條文第九條第四項第一款規定無須喪失原有國籍，存在忠誠衝突問題，宜使渠等在我國領域內居留一定期間，以瞭解渠等對我國國家安全無危害，爰參酌法國、英國、新加坡、菲律賓等國立法例，縮短渠等之合法居留年限，渠等如持有我國外僑居留證，並合法居留一定期限，經中央目的事業主管機關推薦，並經內政部召開審查會審核通過後，即可申請歸化我國國籍，爰增訂第三款。\n二、現行第九條第五項移列為第二項，並為使授權明確，增訂相關授權事項。"},{"bill":"202110021550000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、由中央目的事業主管機關推薦之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士、相關領域專家學者及相關機關共同審核通過，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n內政部為前項第三款歸化許可，得附加附款。未遵守附加之附款者，得廢止其歸化許可。\n第一項第三款所定高級專業人才之認定要件、審核程序、方式、附款、廢止歸化程序及其他相關事項之辦法，由內政部定之。\n六年內曾具有大陸、香港或澳門戶籍之外國人及無國籍人，不適用第一項第三款之規定。","note":"一、現行條文列為第一項。另鑑於國際上專業人才競逐日益激烈，且我國為延攬外國專業人才，持續檢討放寬相關法規，如訂修外國專業人才延攬及僱用法、入出國及移民法等。為吸引優秀外籍人士來臺，增加渠等歸化我國誘因，爰放寬居留年限之規定，惟考量外籍高級專業人才歸化依修正條文第九條第四項第一款規定無須喪失原有國籍，存在忠誠衝突問題，宜使渠等在我國領域內居留一定期間，以瞭解渠等對我國國家安全無危害，爰參酌法國、英國、新加坡、菲律賓等國立法例，縮短渠等之合法居留年限，渠等如持有我國外僑居留證，並合法居留一定期限，經中央目的事業主管機關推薦，並經內政部召開審查會審核通過後，即可申請歸化我國國籍，爰增訂第三款。\n二、現行第九條第五項移列為第三項，並為使授權明確，增訂相關授權事項。\n三、為避免本條遭具不當目的之人士濫用，另規定不適用本條之情形。"},{"bill":"202110023990000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、由中央目的事業主管機關推薦之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士及相關機關共同審核通過，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n前項第三款所定高級專業人才之認定要件、審核程序、方式及其他相關事項之標準，由內政部定之。","note":"一、鑑於國際上專業人才競逐日趨激烈，我國為延攬外國專業人才，實需持續檢討放寬相關法規。\n二、為吸引優秀外籍人士來臺，增加渠等歸化我國誘因，爰放寬居留年限之規定。\n三、另，現行法規定，因外籍高級專業人才歸化無須喪失原有國籍，存在忠誠衝突問題，爰增訂相關附款使渠等在我國領域內居留一定期間，以瞭解渠等對我國國家安全無危害。然其期限之所訂，同增加延攬優秀外籍人士歸化我國誘因之難度，爰縮短相關合法居留年限，並增訂第三款，渠等如持有我國外僑居留證，並經中央目的事業主管機關推薦，並經內政部召開審查會審核通過後，即可申請歸化我國國籍。\n四、現行法第九條第五款移列為本條第二項，並增訂相關授權事項以使授權明確。"},{"bill":"202110024020000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、由中央目的事業主管機關推薦之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士及相關機關共同審核通過，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n前項第三款所定高級專業人才之認定要件、審核程序、方式及其他相關事項之標準，由內政部定之。","note":"一、現行條文列為第一項。另鑑於國際上專業人才競逐日益激烈，且我國為延攬外國專業人才，持續檢討放寬相關法規，如訂修外國專業人才延攬及僱用法、入出國及移民法等。為吸引優秀外籍人士來臺，增加渠等歸化我國誘因，爰放寬居留年限之規定，惟考量外籍高級專業人才歸化依修正條文第九條第四項第一款規定無須喪失原有國籍，存在忠誠衝突問題，宜使渠等在我國領域內居留一定期間，以瞭解渠等對我國國家安全無危害，爰參酌法國、英國、新加坡、菲律賓等國立法例，縮短渠等之合法居留年限，渠等如持有我國外僑居留證，並合法居留一定期限，經中央目的事業主管機關推薦，並經內政部召開審查會審核通過後，即可申請歸化我國國籍，爰增訂第三款。\n二、現行第九條第五項移列為第二項，並為使授權明確，增訂相關授權事項。"},{"bill":"202110024080000","text":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、具特殊專業技能並經政府機關、企業或立案團體聘任專職，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n前項第三款所定高級專業人才之認定要件、審核程序、方式及其他相關事項之標準，由內政部定之。","note":"一、增訂第一項第三款及第三項。\n二、為增加外國專業人才歸化我國之誘因，並考量專業人才頻繁出國進行競賽、研究或執行公務之需要，放寬其居留年限之規定。"}],"changed":true,"final":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、由中央目的事業主管機關推薦之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士及相關機關共同審核通過，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n前項第三款所定高級專業人才之認定要件、審核程序、方式及其他相關事項之標準，由內政部定之。","finalWhy":"一、原條文列為第一項。另鑑於國際上專業人才競逐日益激烈，且我國為延攬外國專業人才，持續檢討放寬相關法規，如訂修外國專業人才延攬及僱用法、入出國及移民法等。為吸引優秀外籍人士來臺，增加渠等歸化我國誘因，爰放寬居留年限之規定，惟考量外籍高級專業人才歸化依修正條文第九條第四項第一款規定無須喪失原有國籍，存在忠誠衝突問題，宜使渠等在我國領域內居留一定期間，以瞭解渠等對我國國家安全無危害，爰參酌法國、英國、新加坡、菲律賓等國立法例，縮短渠等之合法居留年限，渠等如持有我國外僑居留證，並合法居留一定期限，經中央目的事業主管機關推薦，並經內政部召開審查會審核通過後，即可申請歸化我國國籍，爰增訂第三款。\n二、原第九條第五項移列為第二項，並為使授權明確，增訂相關授權事項。","review":{"note":"照行政院提案通過","text":"外國人或無國籍人，現於中華民國領域內有住所，具備第三條第一項第二款至第五款要件，並具有下列各款情形之一者，亦得申請歸化：\n一、出生於中華民國領域內，其父或母亦出生於中華民國領域內。\n二、曾在中華民國領域內合法居留繼續十年以上。\n三、由中央目的事業主管機關推薦之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士及相關機關共同審核通過，且於中華民國領域內，每年合計有一百八十三日以上合法居留之事實繼續二年以上，或曾在中華民國領域內合法居留繼續五年以上。\n前項第三款所定高級專業人才之認定要件、審核程序、方式及其他相關事項之標準，由內政部定之。"}},{"no":"第六條","current":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。","versions":[{"bill":"201110009790000","text":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。\n依第一項規定申請歸化者，免徵國籍許可證書規費。","note":"一、有殊勳於我國者，均係長期在臺居留，於醫療、社會福利、教育等方面持續付出，協助弱勢民眾、原鄉部落或偏鄉地區自立，所作所為皆為社會大眾所稱揚，為感恩渠等對國家、社會之貢獻，渠等申請歸化我國國籍之許可證書免徵規費。為使該免徵規費有明確法律依據，爰增訂第三項。\n二、第一項及第二項未修正。"},{"bill":"202110022170000","text":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。\n依第一項規定申請歸化者，免徵國籍許可證書規費。","note":"一、增訂第三項。\n二、明定有殊勳於我國之外國人或無國籍人士申請歸化，得免徵國籍許可證書規費，以表彰其貢獻。"},{"bill":"202110021490000","text":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。\n依第一項規定申請歸化者，免徵國籍許可證書規費。","note":"為感激有殊勳於我國者對國家、社會之貢獻，渠等申請歸化我國國籍之許可證書免徵規費。為使該免徵規費有明確法律依據，爰增訂第三項。"},{"bill":"202110021550000","text":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。\n依第一項規定申請歸化者，免徵國籍許可證書規費。\n第一項有殊勳於中華民國之認定原則、應備文件、處理程序及其他相關事項之標準，由內政部定之。","note":"一、有殊勳於我國者，均係長期在臺居留，於醫療、社會福利、教育等方面持續付出，協助弱勢民眾、原鄉部落或偏鄉地區自立，所作所為皆為社會大眾所稱揚，為感恩渠等對國家、社會之貢獻，渠等申請歸化我國國籍之許可證書免徵規費。為使該免徵規費有明確法律依據，爰增訂第三項。\n二、第一項及第二項未修正。"},{"bill":"202110023990000","text":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。依第一項規定申請歸化者，免徵國籍許可證書規費。","note":"考量有殊勳於我國者，均係對中華民國各項領域方面持續付出、或有重大之貢獻者，所作所為皆為國人所稱揚，為感恩渠等對國家、社會之貢獻，爰增訂第三項，渠等申請歸化我國國籍之許可證書免徵規費。"},{"bill":"202110024020000","text":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。\n依第一項規定申請歸化者，免徵國籍許可證書規費。","note":"一、有殊勳於我國者，均係長期在臺居留，於醫療、社會福利、教育等方面持續付出，協助弱勢民眾、原鄉部落或偏鄉地區自立，所作所為皆為社會大眾所稱揚，為感恩渠等對國家、社會之貢獻，渠等申請歸化我國國籍之許可證書免徵規費。為使該免徵規費有明確法律依據爰增訂第三項。\n二、第一項及第二項未修正。"},{"bill":"202110029400000","text":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。\n第一項有殊勳於中華民國之認定原則、應備文件、處理程序及其他相關事項之標準，由內政部定之。","note":"有關第一項「有殊勳於中華民國者」，應有相關法律授權，方符合法律保留原則。爰提案增列第六條第三項。"}],"changed":true,"final":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。\n依第一項規定申請歸化者，免徵國籍許可證書規費。","finalWhy":"一、有殊勳於我國者，均係長期在臺居留，於醫療、社會福利、教育等方面持續付出，協助弱勢民眾、原鄉部落或偏鄉地區自立，所作所為皆為社會大眾所稱揚，為感恩渠等對國家、社會之貢獻，渠等申請歸化我國國籍之許可證書免徵規費。為使該免徵規費有明確法律依據，爰增訂第三項。\n二、第一項及第二項未修正。","review":{"note":"照行政院提案通過","text":"外國人或無國籍人，有殊勳於中華民國者，雖不具備第三條第一項各款要件，亦得申請歸化。\n內政部為前項歸化之許可，應經行政院核准。\n依第一項規定申請歸化者，免徵國籍許可證書規費。"}},{"no":"第六條之一","current":null,"versions":[{"bill":"202110012820000","text":"外國人或無國籍人，具特殊專業技能並經政府機關或民間企業聘任專職，於中華民國領域內，合法連續居留二年以上且平均每年居住一百八十三日以上，或曾在中國民國領域內合法居留繼續五年以上者，亦得申請歸化。\n內政部為前項歸化之許可，應會同各目的事業主管機關開會決議後，經行政院核准。\n六年內曾具有大陸、香港或澳門戶籍之外國人及無國籍人，不適用本條。","note":"一、本條新增。\n二、現行具有特殊專業之外國人或無國籍人如欲歸化我國，除有殊勳於中華民國者得依《國籍法》第六條歸化外，均須依照《國籍法》第四條或第五條申請歸化。\n三、但要有殊勳於中華民國並非易事，而國際情勢變化迅速，部分特殊專業人士有頻繁出國工作、研究、比賽等必要，要於台灣連續五年住滿一百八十三天以上亦不容易。\n四、為強化延攬符合我國需要之專業人士，進而提升國家競爭力，爰增訂本條，於第一項規定有特殊專業技能並經政府機關或民間企業聘任專職，連續在台灣居留兩年且平均每年居住一百八十三日以上，或曾在中國民國領域內合法居留繼續五年以上者，亦可申請歸化。\n五、於第二項規定，歸化之許可由內政部會同各目的事業主管機關決議，並須經行政院核准。\n六、為避免本條遭具不當目的之人士濫用，於第三項規定不適用本條之情形。"},{"bill":"202110018710000","text":"外國人之父母於本法中華民國八十九年二月九日修正施行時已滿二十歲，且其父母之母為中華民國國民，如其符合奧、亞運項目國際體育組織規範，於取得國籍後可直接代表我國參與國際賽事，得經外國人本人同意後，由特定體育團體申請歸化，並免提出喪失原有國籍證明。\n內政部為前項歸化之許可，應與教育部共同會商後，經行政院核准。\n依本條申請歸化通過者，自歸化核定日起五年內受教育部列管，如未依教育部通知之期限、地點配合國家代表隊完成報到、參加集訓或比賽，得撤銷其歸化許可。","note":"一、現行國籍法第二條第二項所定「本法中華民國八十九年二月九日修正施行時未滿二十歲之人，亦適用之。」之設計，係為該次國籍法修正中，調整過去僅中華民國國籍父系子女可取得國籍之條件，改為父母為中華民國國民均可取得國籍。同時，該次亦保留修法時間點未滿二十歲，且母方為中華民國國民之子女者亦回溯適用。\n二、然查現行國際體育賽事之具血緣球員之認定，多可放寬至向上三代內直系血親具該國國籍者，均可不必受是否有一定時間居住事實，或是取得國籍後一定時間方可代表出賽之限制。故如現有選手之父或母為民國六十九年二月九日前出生，且其父或母之母方為中華民國國民，雖該球員依國際體育組織規範可代表我國出賽，但因現有國籍法之規定，反會因其父或母無法取得國籍，進而使我國失去爭取具台灣血統之優秀海外球員效力之可能。\n三、考量近年來國際體育賽事廣納具國籍血統之選手代表出賽已為主流趨勢，且前述條件與單純透過殊勳模式取得國籍之邏輯顯有差異，為擴充我國體育運動代表隊之人才庫與選材可能，增加我國競技體育之競爭力，爰擬具「國籍法第六條之一」條文草案，並援用「國家體育競技代表隊服補充兵役辦法」精神，設定歸化球員列管期限及撤銷歸化許可之但書。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第七條","current":"歸化人之未婚未成年子女，得申請隨同歸化。","versions":[{"bill":"201110009790000","text":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。","note":"將「未婚未成年」修正為「未婚且未滿十八歲」，理由同修正條文第四條說明一、(一)。"},{"bill":"202110017780000","text":"歸化人之未成年子女，得申請隨同歸化。但未成年子女之原屬國法令不允許放棄國籍或須滿一定年齡以上始得放棄國籍者，得取得我國居留，並享有國民之權利義務。","note":"一、考量部分國家之法令或政策，不允許放棄原屬國國籍，或須滿一定年齡以上始得放棄原屬國籍，為保障歸化人之未成年子女權益，爰增訂但書，始其得取得我國居留，並享有國民之權利義務。\n二、為維持法律體系之一貫性，配合民法成年年齡及男女最低結婚年齡均修正為十八歲，爰刪除「未婚」之文字。"},{"bill":"202110022170000","text":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。","note":"將「未婚未成年之用法」統一修正為「未婚且未滿十八歲」，以配合《民法》成年年齡調降，並將外國人適用之成年年齡明確化。"},{"bill":"202110021360000","text":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。","note":"配合民法成年定義規定之修正，將本條文中未成年修正為未滿十八歲。"},{"bill":"202110021490000","text":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。","note":"配合《民法》成年年齡調降，爰將第二項「未婚未成年」修正為「未婚且未滿十八歲」。"},{"bill":"202110021550000","text":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。","note":"配合民法已將成年年齡調降，又涉及外國人部分均以年齡規範之體例，爰將「未婚未成年」修正為「未婚且未滿十八歲」，以求法律規範一致性。"},{"bill":"202110023990000","text":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。","note":"原條文內容以未成年做申請歸化之規範，因應民法成年年齡調降政策，為國籍法配合民法一致，爰將「未婚未成年」修正為「未婚且未滿十八歲」。"},{"bill":"202110024020000","text":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。","note":"將「未婚未成年」修正為「未婚且未滿十八歲」，理由同修正條文第四條說明一、(一)。"},{"bill":"202110034810000","text":"歸化人之未婚且未滿二十歲子女，得申請隨同歸化。","note":"配合民法成年年齡調降政策，國籍法第二條已配合民法修改法規，調整相關的年齡規範。有關本法涉及外國人歸化年齡部分，為保障十八歲以上未滿二十歲人之歸化權益，將本條文中「未婚未成年」修正為「未婚且未滿二十歲」。"}],"changed":true,"final":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。","finalWhy":"將「未婚未成年」修正為「未婚且未滿十八歲」，理由同修正條文第四條說明一、(一)。","review":{"note":"照行政院提案通過","text":"歸化人之未婚且未滿十八歲子女，得申請隨同歸化。"}},{"no":"第九條","current":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第六條規定申請歸化。\n二、由中央目的事業主管機關推薦科技、經濟、教育、文化、藝術、體育及其他領域之高級專業人才，有助中華民國利益，並經內政部邀請社會公正人士及相關機關共同審核通過。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。\n前項第二款所定高級專業人才之認定標準，由內政部定之。","versions":[{"bill":"201110009790000","text":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第五條第一項第三款規定申請歸化。\n二、依第六條第一項規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。","note":"一、配合修正條文第五條第一項增訂第三款，第四項第二款移列至第一款並修正文字；另第一款移列至第二款，並酌修文字。\n二、第一項至第三項未修正；另第五項移列為修正條文第五條第二項，爰予刪除。"},{"bill":"202110022170000","text":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第五條第一項第三款規定申請歸化。\n二、依第六條第一項規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。","note":"一、修正第四項第一款及第二款，刪除第五項。\n二、配合第五條修正，將現有第四項第二款及第五項移至第五條。"},{"bill":"202110021490000","text":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第五條第一項第三款規定申請歸化。\n二、依第六條第一項規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。","note":"一、配合修正條文第五條第一項增訂第三款，第四項第二款移列至第一款並修正文字；另第一款移列至第二款，並酌修文字。\n二、第一項至第三項未修正；另第五項移列為修正條文第五條第二項，爰予刪除。"},{"bill":"202110021550000","text":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第五條第一項第三款規定申請歸化。\n二、依第六條第一項規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。","note":"第一項至第三項未修正；另第五項移列為修正條文第五條第三項，爰予刪除。"},{"bill":"202110023990000","text":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第五條第一項第三款規定申請歸化。\n二、依第六條第一項規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。","note":"一、配合修正條文第五條第一項增訂第三款，第四項第二款移列至第一款並修正文字；另第一款移列至第二款，並酌修文字。\n二、第一項至第三項未修正；另第五項移列為修正條文第五條第二項，爰予刪除。"},{"bill":"202110024020000","text":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第五條第一項第三款規定申請歸化。\n二、依第六條第一項規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。\n四、上述申請人之配偶及未成年子女，得隨同本人申請；未隨同本人申請者，得於本人申請許可後申請之。本人國籍許可經撤銷或廢止時，原隨同或於其許可後申請配偶及子女之國籍許可，應併同撤銷或廢止之。","note":"一、配合修正條文第五條第一項增訂第三款，第四項第二款移列至第一款並修正文字；另第一款移列至第二款，並酌修文字。\n二、第一項至第三項未修正；另第五項移列為修正條文第五條第二項，爰予刪除。\n三、考量其配偶及未成年子女與其隨同在臺，為使家庭完整，相關權益應涵蓋─國籍隨同本人或於其許可後申請之。惟，因配偶或未成年子女係依附於本人入籍。若於本人國籍經撤銷或廢止時，則應併同撤銷或廢止之，爰增訂本項第四款之規定。"},{"bill":"202110024080000","text":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第六條規定申請歸化。\n二、依第五條第一項第三款規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。","note":"一、增訂第四項第二款。\n二、考量特殊專業人才可能因母國之國籍規定差異，而不能提出國籍喪失證明，免除其提出相關證明之必要性。"}],"changed":true,"final":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第五條第一項第三款規定申請歸化。\n二、依第六條第一項規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。","finalWhy":"一、配合修正條文第五條第一項增訂第三款，第四項第二款移列至第一款並修正文字；另第一款移列至第二款，並酌修文字。\n二、第一項至第三項未修正；另第五項移列為修正條文第五條第二項，爰予刪除。","review":{"note":"照行政院提案通過","text":"外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，一年內提出喪失原有國籍證明。\n屆期未提出者，除經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外，應撤銷其歸化許可。\n未依前二項規定提出喪失原有國籍證明前，應不予許可其定居。\n外國人符合下列情形之一者，免提出喪失原有國籍證明：\n一、依第五條第一項第三款規定申請歸化。\n二、依第六條第一項規定申請歸化。\n三、因非可歸責於當事人之事由，致無法取得喪失原有國籍證明。"}},{"no":"第十九條","current":"歸化、喪失或回復中華民國國籍後，除依第九條第一項規定應撤銷其歸化許可外，內政部知有與本法之規定不合情形之日起二年得予撤銷。但自歸化、喪失或回復中華民國國籍之日起逾五年，不得撤銷。\n經法院確定判決認其係通謀為虛偽結婚或收養而歸化取得中華民國國籍者，不受前項撤銷權行使期間之限制。\n撤銷歸化、喪失或回復國籍處分前，內政部應召開審查會，並給予當事人陳述意見之機會。但有下列情形之一者，撤銷其歸化許可，不在此限：\n一、依第二條規定認定具有中華民國國籍。\n二、經法院確定判決，係通謀為虛偽結婚或收養而歸化取得中華民國國籍。\n前項審查會由內政部遴聘有關機關代表、社會公正人士及學者專家共同組成，其中任一性別不得少於三分之一，且社會公正人士及學者專家之人數不得少於二分之一。\n第三項審查會之組成、審查要件、程序等事宜，由內政部定之。","versions":[{"bill":"202110027850000","text":"歸化、喪失或回復中華民國國籍後，除違反第九條第一項規定應撤銷其歸化許可外，內政部知有與本法之規定不合情形之日起二年得予撤銷。但自歸化、喪失或回復中華民國國籍之日起逾五年，不得撤銷。\n經法院確定判決認其係通謀為虛偽結婚或收養而歸化取得中華民國國籍者，不受前項撤銷權行使期間之限制。\n撤銷歸化、喪失或回復國籍處分前，內政部應召開審查會，並給予當事人陳述意見之機會。但有下列情形之一者，撤銷其歸化許可，不在此限：\n一、依第二條規定認定具有中華民國國籍。\n二、經法院確定判決，係通謀為虛偽結婚或收養而歸化取得中華民國國籍。\n前項審查會由內政部遴聘有關機關代表、社會公正人士及學者專家共同組成，其中任一性別不得少於三分之一，且社會公正人士及學者專家之人數不得少於二分之一。\n第三項審查會之組成、審查要件、程序等事宜，由內政部定之。","note":"一、按現行條文第一項規定，歸化、喪失或回復中華民國國籍後，除依第九條第一項規定應撤銷其歸化許可外，內政部知有與本法之規定不合情形之日起2年得予撤銷。但自歸化、喪失或回復中華民國國籍之日起逾5年，不得撤銷。惟查本法第九條第一項係規定，外國人申請歸化，應於許可歸化之日起，或依原屬國法令須滿一定年齡始得喪失原有國籍者自滿一定年齡之日起，1年內提出喪失原有國籍證明。屆期未提出者，而本法第九條第二項規定，乃違反第一項規定之法律效果及除外規定得展延之情事為：「經外交部查證因原屬國法律或行政程序限制屬實，致使不能於期限內提出喪失國籍證明者，得申請展延時限外」，應撤銷其歸化許可。\n二、因此，現行條文第一項規定「除依第九條第一項規定應撤銷其歸化許可外」，文字似有未妥，爰如修正條文所示。"}],"changed":false,"final":"歸化、喪失或回復中華民國國籍後，除依第九條第一項規定應撤銷其歸化許可外，內政部知有與本法之規定不合情形之日起二年得予撤銷。但自歸化、喪失或回復中華民國國籍之日起逾五年，不得撤銷。\n經法院確定判決認其係通謀為虛偽結婚或收養而歸化取得中華民國國籍者，不受前項撤銷權行使期間之限制。\n撤銷歸化、喪失或回復國籍處分前，內政部應召開審查會，並給予當事人陳述意見之機會。但有下列情形之一者，撤銷其歸化許可，不在此限：\n一、依第二條規定認定具有中華民國國籍。\n二、經法院確定判決，係通謀為虛偽結婚或收養而歸化取得中華民國國籍。\n前項審查會由內政部遴聘有關機關代表、社會公正人士及學者專家共同組成，其中任一性別不得少於三分之一，且社會公正人士及學者專家之人數不得少於二分之一。\n第三項審查會之組成、審查要件、程序等事宜，由內政部定之。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第二十條","current":"中華民國國民取得外國國籍者，不得擔任中華民國公職；其已擔任者，除立法委員由立法院；直轄市、縣（市）、鄉（鎮、市）民選公職人員，分別由行政院、內政部、縣政府；村（里）長由鄉（鎮、市、區）公所解除其公職外，由各該機關免除其公職。但下列各款經該管主管機關核准者，不在此限：\n一、公立大學校長、公立各級學校教師兼任行政主管人員與研究機關（構）首長、副首長、研究人員（含兼任學術研究主管人員）及經各級主管教育行政或文化機關核准設立之社會教育或文化機構首長、副首長、聘任之專業人員（含兼任主管人員）。\n二、公營事業中對經營政策負有主要決策責任以外之人員。\n三、各機關專司技術研究設計工作而以契約定期聘用之非主管職務。\n四、僑務主管機關依組織法遴聘僅供諮詢之無給職委員。\n五、其他法律另有規定者。\n前項第一款至第三款人員，以具有專長或特殊技能而在我國不易覓得之人才且不涉及國家機密之職務者為限。\n第一項之公職，不包括公立各級學校未兼任行政主管之教師、講座、研究人員、專業技術人員。\n中華民國國民兼具外國國籍者，擬任本條所定應受國籍限制之公職時，應於就（到）職前辦理放棄外國國籍，並於就（到）職之日起一年內，完成喪失該國國籍及取得證明文件。但其他法律另有規定者，從其規定。","versions":[{"bill":"201110009790000","text":"中華民國國民取得外國國籍者，不得擔任中華民國公職；其已擔任者，除立法委員由立法院；直轄市、縣（市）、直轄市山地原住民區、鄉（鎮、市）民選公職人員，分別由行政院、內政部、直轄市政府、縣政府；村（里）長由鄉（鎮、市、區）公所解除其公職外，由各該機關免除其公職。但下列各款經該管主管機關核准者，不在此限：\n一、公立大學校長、公立各級學校教師兼任行政主管人員與研究機關（構）首長、副首長、研究人員（含兼任學術研究主管人員）及經各級主管教育行政或文化機關核准設立之社會教育或文化機構首長、副首長、聘任之專業人員（含兼任主管人員）。\n二、公營事業中對經營政策負有主要決策責任以外之人員。\n三、各機關專司技術研究設計工作而以契約定期聘用之非主管職務。\n四、僑務主管機關依組織法遴聘僅供諮詢之無給職委員。\n五、其他法律另有規定者。\n前項第一款至第三款人員，以具有專長或特殊技能而在我國不易覓得之人才且不涉及國家機密之職務者為限。\n第一項之公職，不包括公立各級學校未兼任行政主管之教師、講座、研究人員、專業技術人員。\n中華民國國民兼具外國國籍者，擬任本條所定應受國籍限制之公職時，應於就（到）職前辦理放棄外國國籍，並於就（到）職之日起一年內，完成喪失該國國籍及取得證明文件。但其他法律另有規定者，從其規定。","note":"一、查一百零三年一月二十九日修正公布之地方制度法增訂第八十三條之二規定，直轄市之區由山地鄉改制者，稱直轄市山地原住民區（以下簡稱山地原住民區），為地方自治團體；山地原住民區與直轄市之關係，準用該法關於縣與鄉（鎮、市）關係之規定。另公職人員選舉罷免法第二條第二款規定，直轄市山地原住民區民代表會代表及區長為地方公職人員，為臻明確，爰第一項序文增列山地原住民區民選公職人員具外國國籍並擔任我國公職者，由直轄市政府解除其公職之規定。\n二、第二項至第四項未修正。"},{"bill":"202110022170000","text":"中華民國國民取得外國國籍者，不得擔任中華民國公職；其已擔任者，除立法委員由立法院；直轄市、縣（市）、鄉（鎮、市、區）民選公職人員，分別由行政院、內政部、直轄市政府、縣政府；村（里）長由鄉（鎮、市、區）公所解除其公職外，由各該機關免除其公職。但下列各款經該管主管機關核准者，不在此限：\n一、公立大學校長、公立各級學校教師兼任行政主管人員與研究機關（構）首長、副首長、研究人員（含兼任學術研究主管人員）及經各級主管教育行政或文化機關核准設立之社會教育或文化機構首長、副首長、聘任之專業人員（含兼任主管人員）。\n二、公營事業中對經營政策負有主要決策責任以外之人員。\n三、各機關專司技術研究設計工作而以契約定期聘用之非主管職務。\n四、僑務主管機關依組織法遴聘僅供諮詢之無給職委員。\n五、其他法律另有規定者。\n前項第一款至第三款人員，以具有專長或特殊技能而在我國不易覓得之人才且不涉及國家機密之職務者為限。\n第一項之公職，不包括公立各級學校未兼任行政主管之教師、講座、研究人員、專業技術人員。\n中華民國國民兼具外國國籍者，擬任本條所定應受國籍限制之公職時，應於就（到）職前辦理放棄外國國籍，並於就（到）職之日起一年內，完成喪失該國國籍及取得證明文件。但其他法律另有規定者，從其規定。","note":"一、修正第一項。\n二、按《地方制度法》第八十三條之二規定，直轄市之山地原住民區與直轄市之關係，準用關於縣與鄉（鎮、市）關係之規定。另《公職人員選舉罷免法》第二條第二款規定，直轄市山地原住民區民代表會代表及區長為地方公職人員，準此，爰將直轄市民選之區長納入規範，並得由直轄市政府解除其職務。"},{"bill":"202110021490000","text":"中華民國國民取得外國國籍者，不得擔任中華民國公職；其已擔任者，除立法委員由立法院；直轄市、縣（市）、直轄市山地原住民區、鄉（鎮、市）民選公職人員，分別由行政院、內政部、直轄市政府、縣政府；村（里）長由鄉（鎮、市、區）公所解除其公職外，由各該機關免除其公職。但下列各款經該管主管機關核准者，不在此限：\n一、公立大學校長、公立各級學校教師兼任行政主管人員與研究機關（構）首長、副首長、研究人員（含兼任學術研究主管人員）及經各級主管教育行政或文化機關核准設立之社會教育或文化機構首長、副首長、聘任之專業人員（含兼任主管人員）。\n二、公營事業中對經營政策負有主要決策責任以外之人員。\n三、各機關專司技術研究設計工作而以契約定期聘用之非主管職務。\n四、僑務主管機關依組織法遴聘僅供諮詢之無給職委員。\n五、其他法律另有規定者。\n前項第一款至第三款人員，以具有專長或特殊技能而在我國不易覓得之人才且不涉及國家機密之職務者為限。\n第一項之公職，不包括公立各級學校未兼任行政主管之教師、講座、研究人員、專業技術人員。\n中華民國國民兼具外國國籍者，擬任本條所定應受國籍限制之公職時，應於就（到）職前辦理放棄外國國籍，並於就（到）職之日起一年內，完成喪失該國國籍及取得證明文件。但其他法律另有規定者，從其規定。","note":"一百零三年一月二十九日修正公布之《地方制度法》增訂第八十三條之二規定，直轄市之區由山地鄉改制者，稱直轄市山地原住民區（以下簡稱山地原住民區），為地方自治團體；山地原住民區與直轄市之關係，準用該法關於縣與鄉（鎮、市）關係之規定。另《公職人員選舉罷免法》第二條第二款規定，直轄市山地原住民區民代表會代表及區長為地方公職人員，為臻明確，爰第一項序文增列山地原住民區民選公職人員具外國國籍並擔任我國公職者，由直轄市政府解除其公職之規定。"},{"bill":"202110024020000","text":"中華民國國民取得外國國籍者，不得擔任中華民國公職；其已擔任者，除立法委員由立法院；直轄市、縣（市）、直轄市山地原住民區、鄉（鎮、市）民選公職人員，分別由行政院、內政部、直轄市政府、縣政府；村（里）長由鄉（鎮、市、區）公所解除其公職外，由各該機關免除其公職。但下列各款經該管主管機關核准者，不在此限：\n一、公立大學校長、公立各級學校教師兼任行政主管人員與研究機關（構）首長、副首長、研究人員（含兼任學術研究主管人員）及經各級主管教育行政或文化機關核准設立之社會教育或文化機構首長、副首長、聘任之專業人員（含兼任主管人員）。\n二、公營事業中對經營政策負有主要決策責任以外之人員。\n三、各機關專司技術研究設計工作而以契約定期聘用之非主管職務。\n四、僑務主管機關依組織法遴聘僅供諮詢之無給職委員。\n五、其他法律另有規定者。\n前項第一款至第三款人員，以具有專長或特殊技能而在我國不易覓得之人才且不涉及國家機密之職務者為限。\n第一項之公職，不包括公立各級學校未兼任行政主管之教師、講座、研究人員、專業技術人員。\n中華民國國民兼具外國國籍者，擬任本條所定應受國籍限制之公職時，應於就（到）職前辦理放棄外國國籍，並於就（到）職之日起一年內，完成喪失該國國籍及取得證明文件。但其他法律另有規定者，從其規定。","note":"查一百零三年一月二十九日修正公布之地方制度法增訂第八十三條之二規定，直轄市之區由山地鄉改制者，稱直轄市山地原住民區（以下簡稱山地原住民區），為地方自治團體；山地原住民區與直轄市之關係，準用該法關於縣與鄉（鎮、市）關係之規定。另公職人員選舉罷免法第二條第二款規定，直轄市山地原住民區民代表會代表及區長為地方公職人員，為臻明確，爰第一項序文增列山地原住民區民選公職人員具外國國籍並擔任我國公職者，由直轄市政府解除其公職之規定。"}],"changed":true,"final":"中華民國國民取得外國國籍者，不得擔任中華民國公職；其已擔任者，除立法委員由立法院；直轄市、縣（市）、直轄市山地原住民區、鄉（鎮、市）民選公職人員，分別由行政院、內政部、直轄市政府、縣政府；村（里）長由鄉（鎮、市、區）公所解除其公職外，由各該機關免除其公職。但下列各款經該管主管機關核准者，不在此限：\n一、公立大學校長、公立各級學校教師兼任行政主管人員與研究機關（構）首長、副首長、研究人員（含兼任學術研究主管人員）及經各級主管教育行政或文化機關核准設立之社會教育或文化機構首長、副首長、聘任之專業人員（含兼任主管人員）。\n二、公營事業中對經營政策負有主要決策責任以外之人員。\n三、各機關專司技術研究設計工作而以契約定期聘用之非主管職務。\n四、僑務主管機關依組織法遴聘僅供諮詢之無給職委員。\n五、其他法律另有規定者。\n前項第一款至第三款人員，以具有專長或特殊技能而在我國不易覓得之人才且不涉及國家機密之職務者為限。\n第一項之公職，不包括公立各級學校未兼任行政主管之教師、講座、研究人員、專業技術人員。\n中華民國國民兼具外國國籍者，擬任本條所定應受國籍限制之公職時，應於就（到）職前辦理放棄外國國籍，並於就（到）職之日起一年內，完成喪失該國國籍及取得證明文件。但其他法律另有規定者，從其規定。","finalWhy":"一、查一百零三年一月二十九日修正公布之地方制度法增訂第八十三條之二規定，直轄市之區由山地鄉改制者，稱直轄市山地原住民區（以下簡稱山地原住民區），為地方自治團體；山地原住民區與直轄市之關係，準用該法關於縣與鄉（鎮、市）關係之規定。另公職人員選舉罷免法第二條第二款規定，直轄市山地原住民區民代表會代表及區長為 <script>

[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));

function finder(turns) {   // 在這場逐字稿裡找字

  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
