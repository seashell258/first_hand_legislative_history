定之資遣費、退休金及相當於十二個月工資補償金，合意終止勞動契約。\n第二項及前項之補償金，依受不利措施者為第八條第一項各款行為之前一月工資計算。\n未具公務員身分之受不利措施者為政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約者，得準用第二項、第四項至前項規定請求補償金。但契約之約定有利於該受不利措施者，從其約定。","finalWhy":"一、為了保護揭弊者，參酌勞動基準法第十四條第一項第六款規定，爰於第一項明定，雇主違反第八條第一項規定為報復性行為時，賦予未具公務員身分之受不利措施者得不經預告終止勞動契約之權利。\n二、勞動契約終止後，為保障揭弊者依法享有之權益，並給予待業時之補償，第二項明定雇主除應給付該內部人員適用勞動法規規定所得領取之資遣費、退休金外，尚應給付相當於六個月之工資補償金；其請求權自勞動契約終止時起，六個月間不行使而消滅。\n三、第三項明定未具公務員身分而受不利措施者所生第八條第三項之請求權，自知悉事實發生之日起，六個月間不行使而消滅；自損害發生時起，逾二年者亦同。\n四、未具公務員遭受不利措施依法提起救濟時，如主張該不利措施係因其揭弊行為所致，則其揭弊抗辯應優先調查，並依調查結果而為成立或不成立之認定，法院就前揭認定得依個案審理情形以中間判決或終局判決為之，爰為第四項規定。\n五、本條第二項、第三項所定之請求權，在於提供揭弊者必要之保護。若依民法或其他法律，揭弊者另有得行使之權利，自無排除揭弊者主張行使該權利之理由，爰於第五項規定。\n六、考量未具公務員身分者請求復職時，若依第八條第三項第一款復職顯有事實上困難，為避免受僱人於合意內容協議時處於弱勢，於第六項就合意內容明定最低保障之宣示規定，除可請求相當於十二個月工資補償金外，另應包括資遣費、退休金，爰於第六項規定。\n七、第七項明定第二項及前項之補償金，依受不利措施者為第八條第一項各款行為之前一月工資計算。\n八、考量「委任關係」者無勞動法規之適用，為保障其工作權，第八項明定未具公務員身分之受不利措施者為政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約者，得準用第二項、第四項至前項規定請求補償金。但契約之約定有利於該受不利措施者，從其約定。","review":{"note":"條文及委員吳宗憲等4人所提修正動議均保留，送院會處理","text":""}},{"no":"第十一條","current":null,"versions":[{"bill":"202110005890000","text":"違反第七條第一項規定者，其具有公務員身分者，按其情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；未具公務員身分之人、法人、團體者，由各目的事業主管機關處新臺幣五萬元以上五百萬元以下罰鍰，但其他法律有較重之處罰規定者，從其規定。\n前項後段情形，各目的事業主管機關得限期命其改善，屆期不改善者，按次處罰。","note":"一、參酌公務人員行政中立法第十六條規定，就公務員對揭弊者施以報復性不利人事措施者，應按其情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；未具有公務員身分之自然人、法人或團體，由揭弊案件之目的事業主管機關依違反情節處以行政罰鍰。\n二、如揭弊案件目的事業主管機關不明或涉及數個主管機關權責，而無法確定裁罰機關者，由法務部依第二條第二項確定主管機關。\n三、依行政罰法第二十四條規定，為達嚇阻效用，對施以報復行為之行為人，應予從重處罰，如一行為違反二以上行政法規定時，罰鍰從重，如各單行法規所定之裁罰種類與本法不同者，則得併為裁處。故各單行法規如定有罰鍰以外之其他裁罰，如勞動基準法第八十條之一、職業安全衛生法第四十九條規定，對於違規之事業單位或事業主得公布名稱、負責人姓名，得併予處罰。"},{"bill":"202110006520000","text":"揭弊者或其關係人因揭弊行為致其生命、身體或自由有遭受立即危害之虞時，司法警察機關得依職權或依揭弊者或其密切關係人、受理揭弊機關之請求，採取必要之保護措施。","note":"明定對揭弊者或其關係人必要保護措施。"},{"bill":"202110013980000","text":"揭弊者其本人或其配偶、直系血親、其他身分上或生活上有密切關係之人，因揭弊導致生命、身體、自由或財產有遭受危害之虞，而有受保護之必要者，受理揭弊機關應依據本法第七條第一項規定受理揭弊案件後，將本案移交第四條第一項第三款規定之檢察機關。符合證人保護法第三條之要件者，其本人或其配偶、直系血親、其他身分上或生活上有密切關係之人，得依該法施以人身安全之保護措施，不受該法第二條所列罪名之限制。\n前項規定揭弊者之真實姓名及身分資料，主管機關於製作紀錄或文書時，應以代號為之，不得記載揭弊者之性別、年齡、籍貫、住居所、國民身分證統一編號或護照號碼等其他足以識別其身分之資訊，並簽名，得以指印代之。\n載有揭弊者真實身分資料之文書原本，應另行加密封存之。除有檢察機關或法院有調查、審判權者，基於案件審理之必要外，不得閱覽之。\n揭弊者於接受調查或訴訟程序中，得依其要求蒙面、變聲、變像、視訊傳送或其他適當方法隔離為之。","note":"一、揭弊者其本人或其配偶、直系血親、其他身分上或生活上有密切關係之人，因揭弊導致生命、身體、自由或財產有遭受危害之虞，而有受保護之必要者，受理揭弊機關應在受理時發現其有遭受危害之虞，並在受理後將案件移交予檢察機關，以利檢察機關開啟證人保護法之保護機制。\n二、針對揭弊者以遭受危害之虞的案件，主管機關應以代號表示揭弊者之真實姓名，且不得記載其身分之相關資訊。又如公益揭弊者之簽名有保密不足之疑慮者，其得以指印代替之。\n三、針對揭弊者以遭受危害之虞的案件，有真實身分資料之文件應加密封存，並限制除了檢察機關基於調查權、以及法院基於審判權，於案件審理的必要性之外，其他機關不得閱覽。\n四、於訴訟程序中，其亦得要求適當之隔離方法使其身分受到保障。"},{"bill":"202110014070000","text":"揭弊者向受理揭弊機關之陳述內容涉及國家機密、營業秘密或其他依法應保密之事項者，不負洩密之民事、刑事、行政及職業倫理之懲戒責任。其因揭弊向律師徵詢法律意見者，亦同。","note":"為保護鼓勵揭弊者勇於揭露不法行為、積極協助舉證，完善調查程序，爰明定保密義務之豁免條款。"},{"bill":"202110025210000","text":"違反第七條第一項規定者，其具有公務員身分者，按其情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；未具公務員身分之自然人或其他法人、團體者，由揭弊案件之各目的事業主管機關檢附相關資料移送揭弊者保護委員會，由揭弊者保護委員會處新臺幣二十萬元以上二億元以下罰鍰，但其他法律有較重之處罰規定者，從其規定。\n前項後段情形，揭弊者保護委員會亦得限期命其改善，屆期不改善者，得依前項後段規定按次處罰至改善為止。","note":"一、對揭弊者施以不利措施為公務員者，應按其情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；在施以不利措施者為非公務員之情形，則由揭弊案件之各目的事業主管機關檢附相關資料移送揭弊者保護委員會，由揭弊者保護委員會依違反情節輕重，處以處新臺幣二十萬元以上二億元以下之行政罰鍰。\n二、在對揭弊者施以不利措施為非公務員之情形，揭弊者保護委員會亦得限期命其改善，屆期不改善者，得依前項後段規定按次課以罰鍰。"},{"bill":"202110033190000","text":"揭弊者向受理揭弊機關之陳述內容涉及國家機密、營業秘密或其他依法應保密之事項者，不負洩密之民事、刑事、行政及職業倫理之懲戒責任。其因揭弊向律師徵詢法律意見者，亦同。","note":"為保護鼓勵揭弊者勇於揭露不法行為、積極協助舉證，完善調查程序，爰明定保密義務之豁免條款。"},{"bill":"202110039800000","text":"揭弊者依本法程序向第四條所列受理揭弊機關所陳述之內容涉及國家機密、營業秘密或其他依法應保密之事項者，不負洩密之民事、刑事、行政及職業倫理之懲戒責任；其為揭弊向律師徵詢法律意見而涉及前開依法應保密之事項者，亦同。","note":"一、為完善保障揭弊者權益，並鼓勵揭弊者勇於揭露不法行為，揭弊者依本法程序向受理揭弊機關陳述之內容，若涉及國家機密、營業秘密或其他依法應保密之事項者，於刑事責任上，屬於刑法第二十一條之「依法令之行為」而不罰；就民事、行政責任及職業倫理之懲戒責任，應予免責，以周全對揭弊者之保護。惟若向本法第四條所列揭弊機關以外之人洩密，仍應負相關法律責任，自不待言。\n二、揭弊者於揭弊前或揭弊後向律師徵詢法律意見時，因而洩漏國家機密、營業秘密或其他應保密之事項者，事關揭弊者權益之保障，亦應免責，爰為本條後段之規定。"}],"changed":true,"final":"違反第八條第一項規定者，依下列情形予以處罰：\n一、有公務員身分者，按其情節輕重，公務員懲戒法、公務人員考績法或其相關法規予以懲戒或懲處。\n二、未具公務員身分之自然人、國營事業、受政府控制之事業、團體或機構，由各目的事業主管機關處新臺幣五萬元以上五百萬元以下罰鍰，但其他法律有較重之處罰規定者，從其規定。\n前項第二款情形，各目的事業主管機關得限期命其改善，屆期不改善者，按次處罰之。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"照委員吳宗憲等19人提案通過","text":"揭弊者依本法程序向第四條所列受理揭弊機關所陳述之內容涉及國家機密、營業秘密或其他依法應保密之事項者，不負洩密之民事、刑事、行政及職業倫理之懲戒責任；其為揭弊向律師徵詢法律意見而涉及前開依法應保密之事項者，亦同。"}},{"no":"第十二條","current":null,"versions":[{"bill":"202110005890000","text":"揭弊者向受理揭弊機關之陳述內容涉及國家機密、營業秘密或其他依法應保密之事項者，不負洩密之民事、刑事、行政及職業倫理之懲戒責任。其因揭弊向律師徵詢法律意見者，亦同。\n前項規定揭弊者之真實姓名及身分資料，受理機關於製作紀錄或文書時，應以代號為之，不得記載揭弊者之性別、年齡、籍貫、住居所、國民身分證統一編號或護照號碼等其他足以識別其身分之資訊，其簽名得以指印代之。\n載有揭弊者真實身分資料之文書原本，應另行加密封存之。除法院、檢察機關或監察院有調查、審判、彈劾權者，基於案件審理之必要外，不得閱覽之。","note":"一、揭弊者揭弊時若向受理揭弊機關洩漏依法應保密之事項者，是否屬刑法第二十一條之「依法令之行為」而不罰，不無爭議。為明確化，爰參酌美國立法例，為本條之規定。\n二、揭弊者於揭弊前或揭弊後向律師徵詢法律意見時，因而洩漏國家機密或營業秘密者，事關揭弊者權益之保障，亦應免責，爰參照美國立法例，為本條後段之規定。\n三、針對揭弊者有遭受危害之虞之案件，受理機關應以代號表示揭弊者之真實姓名，且不得記載其身分之相關資訊。又如揭弊者之簽名有保密不足之疑慮者，其得以指印代替之。\n四、針對揭弊者有遭受危害之虞之案件，有真實身分資料之文件應加密封存，並限制除了檢察機關機於調查權、法院基於審判權、監察院基於彈劾權，於案件審理之必要性外，其他機關不得閱覽。"},{"bill":"202110006520000","text":"揭弊者或其關係人因揭弊行為致其生命、身體、自由、財產有遭受危害之虞，而有受保護之必要者，法院於審理中或檢察官於偵查中得依職權或依揭弊者或其關係人、受理揭弊機關之聲請，核發揭弊者保護書（以下簡稱保護書）。\n聲請保護書之案件，以該管案件之法院為管轄法院。\n核發保護書之審查程序，不公開之。\n執行保護之案件應受保護之事由消滅、已無保護之必要、情事變更或受保護人違反前條應遵守之事項者，檢察官或法院得依職權或依聲請停止或變更保護措施。","note":"明定對揭弊者於偵查或審理中之保護措施。"},{"bill":"202110013980000","text":"因業務或職務知悉揭弊者身分之人違反第十條規定者，應按其情節輕重，依法追究刑事與行政責任。\n揭弊者因身分洩漏，致其生命、身體、財產、勞動條件及其他相關利益之權益受有損害者，受理揭弊機關應負損害賠償責任。","note":"一、本條規定保密義務之違反與受理揭弊機關之損害賠償責任。\n二、蓋揭弊者身分資料之保護係本法制度之優先保護事項，若其身分保護無法獲得保障，則揭弊通報將難以執行，且其信賴基礎亦將受有質疑。故第一項明定業務或職務上知悉揭弊者身分之人負有身分資料保密之義務，若違反則應按其情節之輕重，依法負有相關之法律責任。\n三、又揭弊者因身分洩漏，致其生命、身體、財產、勞動條件及其他相關利益之權益受有損害者，除有刑事與行政責任外，依民事損害賠償之法理，業務或職務上知悉揭弊者身分之人亦有損害賠償之責任。惟考量其經濟能力與主管機關之監督指導責任，故於第二項明定主管機關應負損害賠償責任。"},{"bill":"202110014070000","text":"揭弊者係揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項之要件者，得依同法第十四條第一項予以減輕或免除其刑，不受該法第二條所列罪名之限制。\n機關受理前項經法院判決免除其刑確定之揭弊者申請再任公職案件時，得不受公務人員任用法第二十八條第一項第四款之限制。","note":"一、為鼓勵揭弊、改過自新，揭露者若同時為所揭露資訊之共同犯罪者或共同違失者時，得給予其減輕或免除法律責任之優惠。至於個案減免程度，得參酌該案件所侵害之法益、保護公共利益之程度、取得不法資訊之手段、所提供之供述或資料對於查獲不法之重要性等綜合判斷。\n二、為鼓勵公務員勇於揭弊，並保障其免職後申請再任公職之權益。爰明定第二項，賦予揭弊者再任公職之申請權利，受理任職機關仍得依個案裁量、進行審酌。"},{"bill":"202110025210000","text":"揭弊者依本法所定之程序向受理揭弊機關之陳述內容，涉及國家機密、營業秘密或其他依法應保密之事項者，不負洩密之民事、刑事、行政責任及職業倫理之懲戒責任。其因揭弊向律師徵詢法律意見者，亦同。","note":"一、揭弊者依本法所定之程序向受理揭弊機關提出之資訊，若涉及國家機密、營業秘密或其他依法應保密之事項者，明定其不負洩密之民事、刑事、行政責任及職業倫理之懲戒責任，以周全對揭弊者之保護。爰參照外國立法例，為本條前段規定。\n二、揭弊者於揭弊前或揭弊後向律師徵詢法律意見時，若涉及國家機密、營業秘密或其他依法應保密之事項者，攸關揭弊者權益之保障，亦應明文免責，爰參照外國立法例，為本條後段規定。"},{"bill":"202110033190000","text":"揭弊者係揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項之要件者，得依同法第十四條第一項予以減輕其刑。\n機關受理前項經法院判決免除其刑確定之揭弊者申請再任公職案件時，得不受公務人員任用法第二十八條第一項第四款之限制。","note":"一、為鼓勵揭弊、改過自新，揭露者若同時為所揭露資訊之共同犯罪者或共同違失者時，得給予其減輕之優惠，惟因犯罪內容與事實明確者，不應以免刑做為揭弊者逃避法律究責之原因，至於個案減免程度，得參酌該案件所侵害之法益、保護公共利益之程度、取得不法資訊之手段、所提供之供述或資料對於查獲不法之重要性等綜合判斷。\n二、為鼓勵公務員勇於揭弊，並保障其免職後申請再任公職之權益。爰明定第二項，賦予揭弊者再任公職之申請權利，受理任職機關仍得依個案裁量、進行審酌。"},{"bill":"202110039800000","text":"揭弊者係揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項之要件者，得依同法第十四條第一項予以減輕或免除其刑，不受該法第二條所列罪名之限制。\n機關受理前項經法院判決免除其刑確定之揭弊者申請再任公職案件，得不受公務人員任用法第二十八條第一項第四款之限制。","note":"一、揭弊者為共同正犯、幫助犯或教唆犯時，並非當然免責，而是在證人保護法之援引加以鬆綁。亦即，若揭弊後有出庭作證，且符合證人保護法第十四條第一項規定，則所涉罪名不受證人保護法第二條罪名之限制，亦得享有刑責減免寬典。\n二、揭弊者因正犯或共犯行為經判決有罪，仍不影響其得受第七條至第九條之保護權益。\n三、為鼓勵共犯中之公務員勇於揭弊，並保障其免職後申請再任公職之權益，依司法院大法官釋字第六十六號解釋，公務員因貪污行為經判決確定，而受緩刑之宣告者，俟緩刑期滿而緩刑之宣告並未撤銷時，得再任公務人員，舉重以明輕，揭弊者因共犯貪污行為而受免刑之宣告者，自應不受公務人員任用法第二十八條消極資格限制。另此僅是提供揭弊者再回任公職之申請權利。\n四、，是否得以回任原職，仍由受理任職機關依個案裁量。"}],"changed":true,"final":"揭弊者依本法程序向第四條所列受理揭弊機關所陳述之內容涉及國家機密、營業秘密或其他依法應保密之事項者，不負洩密之民事、刑事、行政及職業倫理之懲戒責任；其為揭弊向律師徵詢法律意見而涉及前開依法應保密之事項者，亦同。","finalWhy":"一、為完善保障揭弊者權益，並鼓勵揭弊者勇於揭露不法行為，揭弊者依本法程序向受理揭弊機關陳述之內容，若涉及國家機密、營業秘密或其他依法應保密之事項者，於刑事責任上，屬於刑法第二十一條之「依法令之行為」而不罰；就民事、行政責任及職業倫理之懲戒責任，應予免責，以周全對揭弊者之保護。惟若向本法第四條所列揭弊機關以外之人洩密，仍應負相關法律責任，自不待言。\n二、揭弊者於揭弊前或揭弊後向律師徵詢法律意見時，因而洩漏國家機密、營業秘密或其他應保密之事項者，事關揭弊者權益之保障，亦應免責，爰為本條後段之規定。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十三條","current":null,"versions":[{"bill":"202110005890000","text":"揭弊者係揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項之要件者，得依同法第十四條第一項予以減輕或免除其刑，不受該法第二條所列罪名之限制。\n機關受理前項經法院判決免除其刑確定之揭弊者申請再任公職案件時，得不受公務人員任用法第二十八條第一項第四款之限制。","note":"一、揭弊者若有到場作證且符合證人保護法第十四條第一項之規定，則所涉罪名不受證人保護法第二條之罪名之限制，亦得享有刑責減免之寬典，參酌兒童及少年性剝削防制條例第十一條及人口販運防制法第二十三條之規定，爰為第一項規定。另揭弊者因正犯或共犯行為經判決有罪，仍不影響其得受第七條至第十條之保護權益。\n二、按公務人員任用法第二十八條第一項第四款規定「有下列情事之一者，不得任用為公務人員：……四、曾服公務有貪污行為，經有罪判決確定或通緝有案尚未結案」，為鼓勵正犯或共犯中之公務員勇於揭弊，並保障其免職後申請再任公職之權益，爰為第二項之規定。本項僅提供揭弊者再任公職之申請權利，至於受理任職機關仍得依個案裁量，審酌准否再任公職。"},{"bill":"202110006520000","text":"揭弊者或其關係人，因揭弊行為受所屬機關（構）或其上級機關（構）、法人或團體、個人施予不當措施者，得依其原有身分關係所適用之法律程序，請求救濟。\n前項機關（構）、法人或團體、個人於前項救濟程序中，應就其措施與揭弊行為無關負舉證責任。","note":"明定受不當措施之救濟。"},{"bill":"202110013980000","text":"行政院、直轄市、縣（市）政府應置揭弊者保護官若干名。揭弊者保護官職權之行使，由行政院指揮監督。\n揭弊者保護官任用及職掌之辦法，由行政院定之。","note":"參照消費者保護法第三十九條規定，設置公益揭弊者保護官以強化對揭弊者之保護與公益揭弊制度之完善。另考量揭弊者保護官為推動揭弊者保護事項之主要人員，應置若干名於行政院、直轄市與縣（市）政府。其任用及職掌之相關辦法，由行政院另行定之。"},{"bill":"202110014070000","text":"揭弊者符合證人保護法第三條之要件者，其本人或其配偶、直系血親、其他身分上或生活上有密切關係之人，得依該法施以人身安全之保護措施，不受該法第二條所列罪名之限制。\n意圖妨害或報復受本法保護之揭弊者揭發弊端、配合調查或擔任證人，而向揭弊者或其配偶、直系血親、其他身分上或生活上有密切關係之人實施犯罪行為者，依其所犯之罪，加重其本刑二分之一以上。","note":"一、為保障揭弊者及其密切關係人之生命、身體、自由法益之安全，明定揭弊者或其配偶、直系血親、其他身分或生活有密切相關之人，得依證人保護法施以人身安全之保護措施。\n二、為防止揭弊者及其密切關係之人遭受妨害或報復之犯罪行為，明定所犯之罪應加重處分。"},{"bill":"202110025210000","text":"揭弊者係揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項之要件者，依同法第十四條第一項減輕或免除其刑，不受該法第二條所列罪名之限制。\n政府機關受理前項經法院判決免除其刑確定之揭弊者申請再任公職案件時，得不受公務人員任用法第二十八條第一項第四款之限制。","note":"一、當揭弊者本身即為揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項所定減輕或免除其刑之要件，自有受到相同寬典之必要，而不應因證人保護法第二條所限定之適用範圍而遭排除，爰於第一項明定。\n二、當揭弊者係公務員，雖因其涉案而經有罪判決確定，惟若其滿足前項所定之要件而經法院判決免除其刑確定者，為鼓勵公務員勇於揭弊，實不應使該揭弊者再因公務人員任用法第二十八條第一項第四款之規定而不得申請再任公職，以保障其經免除其刑確定後申請再任公職之權益，爰為第二項規定。"},{"bill":"202110033190000","text":"揭弊者符合證人保護法第三條之要件者，其本人或其配偶、直系血親、其他身分上或生活上有密切關係之人及對於揭弊行為之合作關係者，得依該法施以人身安全之保護措施，不受該法第二條所列罪名之限制。\n意圖妨害或報復受本法保護之揭弊者揭發弊端、配合調查或擔任證人，而向揭弊者或其配偶、直系血親、其他身分上或生活上有密切關係之人實施犯罪行為者，依其所犯之罪，加重其本刑二分之一以上。","note":"一、為保障揭弊者及其密切關係人之生命、身體、自由法益之安全，明定揭弊者或其配偶、直系血親、其他身分或生活有密切相關之人，得依證人保護法施以人身安全之保護措施。\n二、為防止揭弊者及其密切關係之人遭受妨害或報復之犯罪行為，明定所犯之罪應加重處分。"},{"bill":"202110039800000","text":"揭弊者符合證人保護法第三條之要件者，其本人或其配偶、直系血親、其他身分上或生活上有密切利害關係之人，得依該法施以人身安全之保護措施，不受該法第二條所列罪名之限制。\n意圖妨害或報復受本法保護之揭弊者揭發弊端、配合調查或擔任證人，而向揭弊者或其配偶、直系血親、其他身分上或生活上有密切利害關係之人實施犯罪行為者，依其所犯之罪，加重其刑至二分之一。","note":"一、證人保護法關於人身安全保護等規定，只適用於實體法上的刑事案件，但若個案中不是刑事案件，為擴大保護範圍，避免被揭弊者以揭弊者及其密切關係之人之人身安全要脅，爰仿照該法意旨。又揭弊者之配偶及直系血親之身分者，無待舉證即有受保護之適格。\n二、所謂「密切利害關係之人」之範圍，參酌證人保護法施行細則第三條，係指證人之配偶、直系血親、三親等內旁系血親、二親等內姻親或家長、家屬、與證人訂有婚約者或其他身分上或生活上有密切利害關係之人，除了以親等之遠近為判斷依據外，尚應就個案審酌其否與揭弊者實際上有緊密之身分上或生活上關係為判斷；且所涉罪名不受該法第二條之限制。\n三、為強化揭弊者之人身保護，參酌證人保護法第十八條之規定，明定對於揭弊者及其密切利害關係之人實施犯罪者，加重刑罰，爰為第二項規定。"}],"changed":true,"final":"揭弊者係揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項之要件者，得依同法第十四條第一項予以減輕或免除其刑，不受該法第二條所列罪名之限制。\n前項經法院判決免除其刑確定之揭弊者再任公職案件，得不受公務人員任用法第二十八條第一項第四款之限制。","finalWhy":"一、當揭弊者本身即為揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項所定減輕或免除其刑之要件，自有受到相同寬典之必要，而不應因證人保護法第二條所限定之適用範圍而遭排除，爰於第一項明定。\n二、當揭弊者係公務員，雖因其涉案而經有罪判決確定，惟若其滿足前項所定之要件而經法院判決免除其刑確定者，為鼓勵公務員勇於揭弊，實不應使該揭弊者再因公務人員任用法第二十八條第一項第四款之規定而不得再任公職，以保障其經免除其刑確定後再任公職之權益，爰為第二項規定。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十四條","current":null,"versions":[{"bill":"202110005890000","text":"揭弊者符合證人保護法第三條之要件者，其本人或其配偶、直系血親、其他身分上或生活上有密切關係之人，得依該法施以人身安全之保護措施，不受該法第二條所列罪名之限制。\n意圖妨害或報復受本法保護之揭弊者揭發弊端、配合調查或擔任證人，而向揭弊者或其配偶、直系血親、其他身分上或生活上有密切關係之人實施犯罪行為者，依其所犯之罪，加重其刑至二分之一。","note":"一、為擴大保護範圍，避免被揭弊者以揭弊者密切關係之人的人身安全相脅，本條所稱揭弊者之密切關係之人，其範圍係指具揭弊者之配偶及直系血親之身分者，無待舉證即有受保護之適格；其餘有密切關係之人除參酌證人保護法施行細則第三條所稱「密切利害關係之人」以親等之遠近為判斷依據外，尚應就個案審酌其是否與揭弊者實際上有緊密之身分上或生活上關係為判斷，爰參酌證人保護法將揭弊者之密切關係人列入人身保護範圍，於第一項明定揭弊者若有到場作證，即可獲證人保護法之人身安全保護措施，所涉罪名不受該法第二條之限制。\n二、為強化揭弊者之人身保護，參酌證人保護法第十八條之規定，明定對於揭弊者及其密切關係之人實施犯罪者，加重刑罰，爰為第二項之規定。"},{"bill":"202110006520000","text":"違反本法之規定，致揭弊者或其關係人受有損害者，負損害賠償責任。但能證明其無故意或過失者，不在此限。\n前項損害賠償案件，適用民事法律之規定。","note":"明定違反本法而致揭弊者損害之責任歸屬。"},{"bill":"202110013980000","text":"揭弊者保護官行使職權時，得為必要之調查，並得採取下列措施：\n一、向受理揭弊機關查詢有關事項或請求提供相關資料。\n二、洽請受理揭弊機關對揭弊者所屬事業單位或機關（構）進行調查，並查明與案情有關事項。\n三、洽請受理揭弊機關為必要之處置。\n四、其他適當之措施。","note":"本條規定揭弊者保護官之主要職責，其行使職權進行保護工作時，得為必要之調查，以確實掌握揭弊者權益之保障或遭受不當措施之情形，並得向主管機關查詢相關事項或洽請主管機關為必要之處置等措施。"},{"bill":"202110014070000","text":"揭弊者之個人資料，除法律另有規定、或已無身分保密必要之情形者外，公務員於製作筆錄或文書時，應以代號為之，不得記載揭弊者之姓名、性別、出生年月日、住居所、身分證明文件編號或其他得以直接或間接方式識別該個人之資料。\n揭弊者之簽名有保密之必要者，以按指印或簽寫代號代之。\n載有揭弊者身分資料之筆錄或文書原本，應另行製作卷面封存之。其他文書足以顯示揭弊者之身分者，亦同。\n前項封存之筆錄、文書，除法律另有規定外，不得供閱覽或提供偵查、審判機關以外之其他機關（構）、法人或團體、個人。\n揭弊者於接受調查、審理時，得依其要求蒙面、變聲、變像、視訊傳送或其他適當隔離方式為之。於其依法接受對質或詰問時，亦同。\n前五項身分保密措施，揭弊者得以書面聲明並附載本人簽名之方式，經公正程序放棄之。","note":"一、參酌證人保護法第十一條，為保護及鼓勵揭發重大不法，亦避免揭弊者身分曝光，明定揭弊者個人資料之保護規定。\n二、保密措施應依本法規定辦理。為尊重揭弊者意願，爰明定第六項，揭弊者得放棄保密措施之規定。即揭弊者放棄此保密措施，須經受理揭發機關告知前五項保密措施後，揭弊者以書面聲明並附載本人簽名之方式，始得放棄。"},{"bill":"202110025210000","text":"揭弊者符合證人保護法第三條之要件者，其本人或其密切關係人，得依該法第十二條及第十三條規定施以人身安全之保護措施及安置措施，不受該法第二條所列罪名之限制。\n意圖妨害或報復受本法保護之揭弊者揭發弊端、配合調查或擔任證人，而向揭弊者或其密切關係人實施犯罪行為者，依其所犯之罪，加重其刑至二分之一。","note":"一、為鼓勵揭弊者勇於揭弊並提供必要保障，當揭弊者或其密切關係人之生命、身體或自由有遭受危害之虞時，自有依證人保護法之相關規定，施以人身安全之保護措施及安置措施之必要，以避免揭弊者或其密切關係人之生命、身體或自由遭受危害，爰於第一項明定當揭弊者符合證人保護法第三條之要件，其本人或其密切關係人即可獲得人身安全之保護措施及安置措施，不因證人保護法第二條所限定之適用範圍而遭排除。\n二、為強化對揭弊者之保護，參酌證人保護法第十八條之規定，明定對於向揭弊者或其密切關係人實施犯罪行為者，依其所犯之罪，加重其刑至二分之一，爰為第二項之規定。"},{"bill":"202110033190000","text":"揭弊者之個人資料，除法律另有規定、或已無身分保密必要之情形者外，公務員於製作筆錄或文書時，應以代號為之，不得記載揭弊者之姓名、性別、出生年月日、住居所、身分證明文件編號或其他得以直接或間接方式識別該個人之資料。\n揭弊者之簽名有保密之必要者，以按指印或簽寫代號代之。\n載有揭弊者身分資料之筆錄或文書原本，應另行製作卷面封存之。其他文書足以顯示揭弊者之身分者，亦同。\n前項封存之筆錄、文書，除法律另有規定外，不得供閱覽或提供偵查、審判機關以外之其他機關（構）、法人或團體、個人。\n揭弊者於接受調查、審理時，得依其要求蒙面、變聲、變像、視訊傳送或其他適當隔離方式為之。於其依法接受對質或詰問時，亦同。\n前五項身分保密措施，揭弊者得以書面聲明並附載本人簽名之方式，經公正程序放棄之。","note":"一、參酌證人保護法第十一條，為保護及鼓勵揭發重大不法，亦避免揭弊者身分曝光，明定揭弊者個人資料之保護規定。\n二、保密措施應依本法規定辦理。為尊重揭弊者意願，爰明定第六項，揭弊者得放棄保密措施之規定。即揭弊者放棄此保密措施，須經受理揭發機關告知前五項保密措施後，揭弊者以書面聲明並附載本人簽名之方式，始得放棄。"},{"bill":"202110039800000","text":"受理揭弊機關及其承辦調查、稽查人員、執法人員或其他依法執行該相當職務、業務之人，對於揭弊者之身分應予保密，非經揭弊者本人同意，不得無故洩漏於被揭弊對象或他人。\n公務員無故洩漏揭弊者之身分者，處六月以上五年以下有期徒刑，得併科三十萬元以下罰金。\n因過失犯前項之罪者，處一年以下有期徒刑、拘役或科或併科十萬元以下罰金。\n非公務員無故洩漏揭弊者之身分者，處一年以下有期徒刑、拘役或科或併科十萬元以下罰金。","note":"一、為了鼓勵揭弊者勇於挺身而出，明定禁止公、私部門受理揭弊機關洩漏揭弊者之個人資料，爰規範因執行職務或業務而知悉揭弊者身分者，不論是否具公務員身分，皆不得洩漏或交付得以直接或間接識別揭弊者身分之資料，且屬保護他人權利之法律，得請求法院依民事侵權行為法，併此敘明。\n二、又第一項對於揭弊者身分保密之規定，除受理揭弊機關及其承辦個案之調查、稽查人員外，尚包含其他依法執行該揭弊案件之受理、調查等相當職務人員，例如政風機構人員、行政調查人員或私部門內部通報程序之調查單位等，對揭弊者之身分均有保密之義務。至有正當理由時，例如因調查之必要揭露給其他協辦人員，並非本條之所禁止，故明定「不得無故」洩漏之用詞。\n三、根據洩漏者是否具公務員身分，分別訂定不同程度之處罰，具公務員身分者，參照刑法第一百三十二條第一項、第二項，故意犯採較高之自由刑刑度，以彰顯本法保護法益不僅是公共利益，對於揭弊者的身分保密更慎重視；而過失犯則採相同自由刑刑度，且不論故意犯或過失犯，罰金刑額度均提高，由法院得依個案情節嚴重程度裁量之，爰訂定第二項、第三項。至於不具公務員身分者，仍比照刑法第一百三十二條第三項，採相同之自由刑刑度，一方面，現行法制對於私部門尚無洩密刑責之規範，故於推動揭弊者保護法之時，仍須加以推廣相關法治教育，不宜先行加重刑期，且僅處罰故意犯，以免失之過苛；惟提高併科之罰金刑額度，由法院得依個案情節嚴重程度裁量之，爰訂定第四項。\n四、依據刑法第三十三條第五款，罰金貨幣單位為新臺幣，特此說明。\n五、考量揭弊行為多數是需要勇氣與道德的，為了提升揭弊風氣，必須提供完善的保護制度，相較於公部門已多年有保密義務的宣導，而在私部門中，即便是職員有上千人的大型企業，針對揭弊內容相關的業務範圍進行調查的話，也有可能找出揭弊者，更何況是職員大部分互相認識的中小企業，甚難期待建立保密措施，故本法在要求揭弊者「具名」之同時，亦須課予私部門主管保密之義務，若故意違反應負有刑事責任。"}],"changed":true,"final":"揭弊者符合證人保護法第三條之要件者，其本人或其密切關係人，得依該法施以人身安全之保護措施，不受該法第二條所列罪名之限制。\n意圖妨害或報復受本法保護之揭弊者揭發弊端、配合調查或擔任證人，而向揭弊者或其密切關係人實施犯罪行為者，依其所犯之罪，加重其刑至二分之一。\n本法所稱揭弊者之密切關係人，指揭弊者之配偶、直系血親、三親等內旁系血親、二親等內姻親或家長、家屬、與其訂有婚約者或其他身分上或生活上有密切利害關係之人。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十五條","current":null,"versions":[{"bill":"202110005890000","text":"受理揭弊機關及其承辦調查、稽查人員或其他依法執行該相當職務、業務之人，對於揭弊者之身分應予保密，非經揭弊者本人同意，不得無故洩漏於被揭弊對象或他人。","note":"本條之規定屬於保護他人權利之法律，至於違反本條之民刑事責任，宜由法院依民事侵權行為法則及刑法之洩密罪構成要件認定之。"},{"bill":"202110006520000","text":"揭弊者於刑事案件偵查中或行政案件調查中之供述或所提證據，有助於弊案之調查並因而查獲不法行為者，揭弊者於該弊案所涉刑事犯罪，得減輕或免除其刑；其所涉行政責任，亦得減輕或免除。","note":"明定揭弊者犯罪之責任減輕或免除。"},{"bill":"202110013980000","text":"政府機關（構）、法人或團體、個人，不得因第五條第一項、第二項所列人員其本人（下稱內部人員），或其配偶、直系血親、其他身分上或生活上有密切關係之人有下列行為，而意圖報復對其採行不利之措施：\n一、揭發弊案。\n二、配合弊案之調查或擔任證人。\n三、拒絕參與弊案之決定或實施。\n四、因前三款之作為而遭受不利措施後，依法提起救濟。\n前項所稱不利措施，指下列情形之一：\n一、解職、撤職、免職、停職、解約、降調，或不利之考績、懲處、懲罰及評定。\n二、減薪（俸）、罰款、剝奪或減少獎金、退休（職、伍）金。\n三、與陞遷有關之教育或訓練機會、福利、特殊權利之剝奪。\n四、工作地點、職務內容或其他工作條件、管理措施之不利變更。\n五、非依法令規定揭露揭弊者之身分。\n因第一項各款行為而受不利措施之內部人員，或其配偶、直系血親、其他身分上或生活上有密切關係之人得為下列請求：\n一、回復其受不利措施前之職位及職務；其原職位已補缺或經裁撤者，回復至相當之職位及職務。\n二、回復其原有之年資、特殊權利、獎金、退休（職、伍）金、福利、工作條件及管理措施。\n三、受不利措施期間俸（薪）給或工資之補發，及財產上損害之賠償。\n四、受有身體、健康、名譽、自由、信用、隱私，或其他人格法益之侵害者，雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項第三款所定財產上損害之賠償，包括俸（薪）給或工資以外其他期待利益之合理估算金額，及遭受不利措施後依法提起救濟所合理支出之必要費用。\n訂有禁止內部人員為第一項第一款至第四款行為之約定者，其約定無效。","note":"一、不利處分之禁止。\n二、第一項所稱個人，包含第五條第一項第一款列舉政府機關（構）之員工、其他公務員及同條項第二款所稱任職或提供勞務對象之雇主或其員工；所稱內部人員，包含第五條第一項各款所稱接受政府機關（構）僱用、定作、委任、派遣、承攬、特約、教育實習及接受公司、獨資或合夥商號、非法人團體、財團法人或社團法人之僱用、定作、委任、委任、派遣、承攬、特約、教育實習之人，及其配偶、直系血親、或與其有密切厲害之關係人；及同條第二項各款所稱具有勞務契約關係之民法上受僱人，包括因僱用、定作、委任、派遣、承攬、特約或其他契約關係而提供勞務之人及接受補助、或簽訂有教育實習合約之機關內部人員。另參酌水污染防治法第三十九條之一第一項規定，本法保護之揭弊作為，不限於「揭弊」本身，尚及於配合調查、擔任證人，弊案發生時不願意同流合污者，及揭弊者因遭受不利措施提起救濟後，二度遭受不利措施者，爰為第一項之規定。\n三、第二項所稱不利措施，參酌美國法立法例，分別規定第一款係對內部人員為解職、撤職、免職、停職、解約、降調、不利於其身分、官職等級之人事行政行為，所稱撤職指陸海空軍懲罰法第十二條、第十三條等相關法令之人事行政處分措施；所稱免職係指公務人員考績法第七條及第十二條，警察人員人事條例第三十一條，交通事業人員考成條例第五條、第六條、第十條等相關法令之人事行政處分措施；所稱停職指警察人員人事條例第二十九條第二項等相關法令之人事行政處分措施。依公務員懲戒法或法官法所為具司法懲戒性質之撤職、免職等懲戒決定均不在本項規範之範圍內；第二款係對俸給薪資、獎金、退休（職、伍）金之處分；第三款指受訓機會、福利或特殊權利之剝奪，如專用辦公室、電梯、停車位、貴賓室使用、免簽到簽退等職場上之特別禮遇或權限。第四款所稱工作條件、管理措施不利變更等情形，包括剝奪其原有接觸特殊資訊之權限、特殊會議之出席及輔助人員之提供等工作上之支援與後勤；另考量現行職場霸凌對員工之實質影響甚大，爰對於故意揭露揭弊者身分而排擠或孤立（含採行報復性調查）之行為，一併列入不利措施之範疇，為第五款之規定。\n四、為有效落實內部人員工作權之保障，就內部人員因第一項各款行為受有不利措施而為救濟時，賦予一獨立之請求權，內部人員得據以請求回復原狀及損害賠償，含財產上及非財產上之損害賠償，爰於第三項第一款至第三款明定回復原有工作權益狀態、工資補發及財產上損害賠償；另第二項所列不利措施，如第五款非依法令規定揭露揭弊者身分而生排擠或孤立之職場霸凌行為，對揭弊者之名譽、信用、隱私等人格法益或精神健康等均可能造成非財產上之損害，故參酌民法第一百九十五條規定，明定第四款針對非財產上損害亦得請求賠償。另因本法保護對象涵蓋公、私部門人員，依其身分就相關請求權之行使，本即得分別歸類為公法上或私法上請求權性質，本項就內部人員所得請求之法律效果未予分列，故就各款請求權性質應依個別事件性質續行認定屬公法或私法性質之請求權類型。\n五、內部人員依本法第十六條第二項、第十七條第一項時效之規定行使本條第三項各款請求權時，得第十六條第一項揭弊抗辯優先調查之規定；如內部人員依民法、國家賠償法或其他法律行使請求權時，自不受第十六條第二項及第十七條第一項短期時效之限制，惟亦不得援引第十六條第一項之規定。\n六、第四項所稱期待利益，包含揭弊者依一般經驗，可得期待領取之加班費與績效獎金、年終獎金等經常性給與等期待利益之損失，惟此等報酬原應有勞務之實際支出始得支領，故僅能用估算方式計算之；所稱合理支出之必要費用，包含對於人事行政行為救濟程序所合理支出之必要程序費等，爰參考美國立法例，為第四項之規定。至第三項第四款所稱非財產上之損害含身體、健康、名譽、自由、信用、隱私上之損害，及被同事孤立、歧視之精神上痛苦（屬其他人格法益）等損害。\n七、第五項所稱訂有禁止揭弊條款者，該約定無效，係指該禁止揭弊條款之部分無效，而非派令、協議、契約全部無效，參酌民法第一百十一條但書，為第五項之規定。\n八、參酌公務人員任用法第二十八條第三項規定，揭弊者於遭受不利措施期間所為之職務行為，不因其原受不利措施救濟成功而失其效力。"},{"bill":"202110014070000","text":"受理揭弊機關及其承辦調查、稽查人員、執法人員或其他依法執行該相當職務、業務之人，對於揭弊者之身分應予保密，非經揭弊者本人同意，不得無故洩漏於被揭弊對象或他人。\n公務員無故洩漏揭弊者之身分者，處一年以上七年以下有期徒刑。\n因過失犯前項之罪者，處二年以下有期徒刑、拘役或科新臺幣五十萬元以下罰金。\n非公務員無故洩漏揭弊者之身分者，處三年以下有期徒刑、拘役或科新臺幣一百萬元以下罰金。","note":"一、明定揭弊者個人資料洩漏之禁止，爰規定因執行職務或業務而知悉揭弊者身分者，不論是否具公務員身分，皆不得洩漏或交付得以直接或間接識別揭弊者身分之資料。\n二、又根據洩漏者是否具公務員身分，分別訂定處罰，爰訂定第二項、第三項及第四項。"},{"bill":"202110025210000","text":"受理揭弊機關及其承辦人員或其他依法執行該相當職務、業務之人，對於揭弊者之身分、個人資料及足以顯示揭弊者身分之資料，均應予保密，非經揭弊者本人同意，不得無故洩漏。","note":"明定受理揭弊機關及其承辦人員或其他依法執行該相當職務、業務之人，除非經揭弊者本人同意外，對於揭弊者之身分、個人資料及足以顯示揭弊者身分之資料，均應予保密，不得無故洩漏。"},{"bill":"202110033190000","text":"受理揭弊機關及其承辦調查、稽查人員、執法人員或其他依法執行該相當職務、業務之人，對於揭弊者之身分應予保密，非經揭弊者本人同意，不得無故洩漏於被揭弊對象或他人。\n公務員無故洩漏揭弊者之身分者，處一年以上七年以下有期徒刑。\n因過失犯前項之罪者，處三年以下有期徒刑、拘役或科新臺幣五十萬元以下罰金。\n非公務員無故洩漏揭弊者之身分者，處五年以下有期徒刑、拘役或科新臺幣一百萬元以下罰金。","note":"一、明定揭弊者個人資料洩漏之禁止，爰規定因執行職務或業務而知悉揭弊者身分者，不論是否具公務員身分，皆不得洩漏或交付得以直接或間接識別揭弊者身分之資料。\n二、又根據洩漏者是否具公務員身分，分別訂定處罰，爰訂定第二項、第三項及第四項。"},{"bill":"202110039800000","text":"揭弊者之個人資料，除法律另有規定或已無身分保密必要者外，揭弊者得請求以代號製作筆錄或文書，遮隱其姓名、性別、出生年月日、住居所、身分證明文件編號或其他得以直接或間接方式識別該個人之資料，其簽名有保密之必要者，以按指印或簽寫代號代之；並應製作代號及真實姓名對照表，以密封套密封附卷。\n前項筆錄或文書，除法律另有規定外，不得供閱覽或提供偵查、審判機關以外之其他機關（構）、法人或團體、個人。\n揭弊者於偵查或審理中為訊問時，得依其要求蒙面、變聲、變像、視訊傳送或其他適當隔離方式為之。於其依法接受對質或詰問時，亦同。\n前三項之保密措施，揭弊者得放棄之。","note":"一、本法雖明定受理揭弊機關調查人員等之保密義務，然仍屬事後追究洩密之責，對揭弊者而言，揭弊的同時，為避免身分曝光，反而導致揭弊者陷於恐懼且增加保護成本，更需要優於現行法制之保障。\n二、參酌證人保護法第十一條規定，徹底執行對於揭弊相關的秘密保護，明定揭弊者身分保密之具體措施，以全面防止個人資料的洩漏。\n三、載有揭弊者身分資料之筆錄或文書，應禁止任意閱覽或提供。惟為兼顧被揭弊者於訴訟上之防禦權，爰為第二項、第三項規定，以維護被揭弊者應有之訴訟權益。\n四、揭弊者認無保密必要，亦應尊重，爰為第四項規定。"}],"changed":true,"final":"受理揭弊之機關及其承辦調查、稽查人員、執法人員或其他依法執行該相當職務、業務之人，對於揭弊者身分應予保密，非經揭弊者本人同意，不得無故洩漏於被揭弊對象或他人。\n公務員無故洩漏揭弊者之身分者，處六月以上五年以下有期徒刑，得併科新臺幣三十萬元以下罰金。\n因過失犯前項之罪者，處一年以下有期徒刑、拘役或科或併科新臺幣十萬元以下罰金。\n非公務員無故洩漏揭弊者之身分者，處一年以下有期徒刑、拘役或科或併科新臺幣十萬元以下罰金。","finalWhy":"一、第一項明定受理揭弊機關及其承辦人員或其他依法執行該相當職務、業務之人，除非經揭弊者本人同意外，對於揭弊者之身分、個人資料及足以顯示揭弊者身分之資料，均應予保密，不得無故洩漏。\n二、第二項至第四項明定無故洩漏揭弊者之身分、個人資料及足以顯示揭弊者身分之資料者之處罰。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十六條","current":null,"versions":[{"bill":"202110005890000","text":"揭弊者依本法所受之保護，不因下列情形而喪失：\n一、所揭露之內容無法證實。但明顯虛偽不實、檢舉行為經以誣告、偽證罪判決有罪、未提供弊案相關之事證、真實資訊、出於獲利或損害他人之不當目的者，不在此限。\n二、所揭露之內容業經他人檢舉或受理揭弊機關已知悉。但案件已公開或揭弊者明知已有他人檢舉者，不在此限。","note":"一、揭弊者若係基於事實合理相信而揭弊，非明知不實或出於惡意，縱經調查後查無實據仍應受保護。惟若檢舉之內容明顯虛偽不實、空泛或未提供弊案相關事證時，為避免浪費調查資源，間接助長造假文化，自不應受本法保護，爰為第一款之規定。\n二、針對非首位檢舉之揭弊者，雖其所提供之消息與首位揭弊者有所重複，惟若其因而遭受不利之人事措施，其權益仍應受保護，爰參酌美國立法例，為第二款本文之規定。另考量國家資源衡平分配，對已公開或明知他人已檢舉之案件而再為檢舉者，恐有濫訴或以獲取不當利益為目的之虞，而徒增偵查資源之浪費，爰為第二款但書之規定。"},{"bill":"202110006520000","text":"因揭弊者之舉報或提供相關具體事證而查獲不法事實者，應給予獎金。\n揭弊者同時有兩人以上時，視為共同揭弊者。\n第一項獎金發給之標準及其他相關事項，由主管機關會同各法規之主管機關定之。","note":"明定揭弊者之獎勵機制。"},{"bill":"202110013980000","text":"公務員於申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序中，主張其有第十五條第一項各款之行為，而遭移送或受有不利措施者，應先於其他事證而為調查，並依調查結果而為成立或不成立之認定。\n具公務員身分之內部人員因受第十五條第二項第一款至第四款不利措施所生同條第三項第三款及第四款之賠償請求權，自政府機關（構）依前項主張作成回復原狀、行政救濟為有理由之決定確定之日起；因第十五條第二項第五款不利措施所生之賠償請求權，自知悉事實發生之日起，六個月間不行使而消滅。\n具公務員身分之內部人員主張其因有第十五條第一項各款之行為而遭移送懲戒，經公務員懲戒委員會或職務法庭審理後，認定其依第一項之主張成立並為不受懲戒之判決確定者，亦得請求第十五條第三項第三款及第四款之賠償，並準用前項時效之規定。\n前二項請求權之行使，不妨礙依民法、國家賠償法或其他法律所得行使之權利。\n法院於第二項、第三項審理期間，必要時得徵詢兩造同意後，由律師公會、以公益為目的之社團法人或財團法人、同業公會、工會、主管機關或檢察署，就法律與事實爭點提出書狀，供法院認事用法之參考。第十七條第一項審理期間，亦同。","note":"一、公務員遭受不利措施依法提起救濟時，如主張該不利措施係因其揭弊行為所致，則其揭弊抗辯應優先調查，並依調查結果而為成立或不成立之認定，爰為第一項之規定。\n二、有關具公務員身分之內部人員受有不利措施時，應依其原有身分別適用法令提起救濟，如依公務人員保障法規定先行提起申訴、再申訴、復審，或依訴願法提起訴願等救濟程序，如依其主張之揭弊者抗辯後，經行政救濟程序，作成不利措施救濟成功者，得於機關自行回復原狀或行政救濟成功而獲有理由之決定確定者，足認公務員確有因揭弊行為而受不當處遇時，公務員就遭受不利措施期間所受損害，及因揭弊者身分遭故意洩漏而受之損害，應續行提供損害賠償之請求權，為避免不利處遇之影響過久，本法之損害賠償請求權為特殊之短期時效請求權，六個月間不行使而消滅，如逾六個月，內部人員仍得依其他民事法規請求之，爰為第二項之規定。如揭弊者未能於行政救濟程序獲有回復原狀或撤銷不利措施之結果，亦不得依本法另行提起損害賠償請求。至揭弊者如依公務人員保障法第七十二條規定不服復審決定，及依行政訴訟法第四條規定不服訴願決定者，本即均得依法提起行政訴訟，並依行政訴訟法第七條合併請求損害賠償或其他財產上給付，屬公務員現有保障制度，仍得依其規定併同請求，自不待言。\n三、考量公務員僅因為揭弊行為而遭報復性之不當移送懲戒，於公務員懲戒委員會或職務法庭認定公務員依第一項之揭弊抗辯主張成立並為不受懲戒之判決確定者，就其遭移送審理期間，公務員之信用、名譽等人格權所受損害，亦應給予必要之賠償請求權，爰為第三項之規定。\n四、第四項規定依據請求權競合之法理，公務員本得選擇行使其原有國家賠償法或民法侵權行為之請求權，惟有關本條第一項揭弊者抗辯應優先調查之適用範圍，同第十五條說明四。\n五、揭弊者保護涉及公益，法院於個案之決定影響深遠，故宜引進「法庭之友」制度，讓公益團體、同業公會、工會、主管機關或檢察署得針對事實與法律表示意見，以協助裁判者妥適認定事實與適用法律，爰參考美國立法例，為第五項之規定。"},{"bill":"202110014070000","text":"揭弊者依本法所受之保護，不因下列情形而喪失：\n一、所揭露之內容無法證實。但明顯虛偽不實、檢舉行為經以誣告、偽證罪判決有罪、未提供弊案相關之事證、真實資訊、出於獲利或損害他人之不當目的者，不在此限。\n二、所揭露之內容業經他人檢舉或受理揭弊機關已知悉。但案件已公開或揭弊者明知已有他人檢舉者，不在此限。","note":"一、本法目的為保護及鼓勵本法第三條之揭弊者，並藉由揭弊者所揭露之資訊開啟調查程序，以維護公共利益。\n二、為避免揭弊者為惡意揭露或重複揭露，徒增資源浪費與社會動盪，爰明定明顯虛偽不實、出於損害他人之不當目的；或是案件已公開或揭弊者明知已有他人檢舉等情形，不受本法之保護。"},{"bill":"202110025210000","text":"揭弊者依本法所受之保護，不因下列情形而喪失：\n一、揭弊者所揭露之弊案內容無法證實。但其內容明顯虛偽不實或其檢舉行為經以誣告、偽證罪判決有罪確定者，不在此限。\n二、揭弊者所揭露之弊案內容業經他人提出檢舉或受理揭弊機關已知悉。但案件已公開或揭弊者明知已有他人提出檢舉者，不在此限。","note":"一、揭弊者若非明知不實或出於惡意，而係本於事實合理相信其所揭露之弊案內容，縱經調查後無法證實，仍應受到本法之保護，否則將使揭弊者退怯而不願挺身揭弊，爰為第一款規定。\n二、針對非首位提出檢舉之揭弊者，雖其所揭露之弊案內容業經他人提出檢舉或受理揭弊機關已知悉，只要案件尚未公開或揭弊者不知已有他人提出檢舉者，其權益仍應受保護，爰為第二款之規定。"},{"bill":"202110033190000","text":"揭弊者依本法所受之保護，不因下列情形而喪失：\n一、所揭露之內容無法證實。但明顯虛偽不實、檢舉行為經以誣告、偽證罪判決有罪、未提供弊案相關之事證、真實資訊、出於獲利或損害他人之不當目的者，不在此限。\n二、所揭露之內容業經他人檢舉或受理揭弊機關已知悉。但案件已公開或揭弊者明知已有他人檢舉者，不在此限。","note":"一、本法目的為保護及鼓勵本法第三條之揭弊者，並藉由揭弊者所揭露之資訊開啟調查程序，以維護公共利益。\n二、為避免揭弊者為惡意揭露或重複揭露，徒增資源浪費與社會動盪，爰明定明顯虛偽不實、出於損害他人之不當目的；或是案件已公開或揭弊者明知已有他人檢舉等情形，不受本法之保護。"},{"bill":"202110039800000","text":"揭弊者之揭弊內容有下列情形之一者，仍得依本法受有保護：\n一、所揭露之內容無法證實。但明顯虛偽不實或揭弊行為經以誣告、偽證罪緩起訴或判決有罪確定者，不在此限。\n二、所揭露之內容業經他人檢舉或受理揭弊機關已知悉。但案件已公開或揭弊者明知已有他人檢舉，不在此限。","note":"一、本法基於社會公益考量，欲透過提供組織內部人誘因及保護之方式，鼓勵其揭露組織內部不法情事，且以「有事實合理相信」為揭弊時之心證程度，針對揭弊動機，是否必須出於「善意」或以正當目的為前提，在所不問，已於第五條立法理由敘明。然而，實務上不免有以為尋謀私利或挾怨報復為目的之揭弊者，甚至亦有明知不實而濫用揭弊等情形，不但使得企業名譽受到損害，亦造成國家司法及行政調查資源的浪費。故揭弊之內容或所檢附之資訊事證明顯虛偽不實者，仍應依法追究其刑事及行政責任。\n二、由於揭弊前期程序採保密措施，可能會有揭弊者所提供之消息與首位弊端通報者有所重複。惟若其因而遭受不利措施，其權益仍應受保護，爰為第二款本文之規定。另考量國家偵查行政資源有限，須衡平分配，凡案件尚未公開或揭弊者並非明知已有他人提出檢舉者，其權益仍應受本法保護，爰為第二款但書規定。"}],"changed":true,"final":"揭弊者之個人資料，除法律另有規定或已無身分保密之必要者外，揭弊者得請求以代號製作筆錄或文書，遮隱其姓名、性別、出生年月日、住居所、身分證明文件編號或其他得以直接或間接方式識別該個人之資料，其簽名有保密之必要者，以按指印或簽寫代號代之；並應製作代號及真實姓名對照表，以密封套密封附卷。\n前項筆錄或文書，除法律另有規定外，不得供閱覽或提供偵查、審判機關以外之其他機關（構）、法人或團體、個人。\n揭弊者於偵查或審理中為詢（訊）問時，得依其要求蒙面、變聲、變像、視訊傳送或其他適當隔離方式為之。於其依法接受對質或詰問時，亦同。\n前三項之保密措施，揭弊者得放棄之。","finalWhy":"一、為保護揭弊者之身分，爰於第一項明定揭弊者身分保密之具體措施。\n二、第二項明定載有揭弊者身分資料之筆錄或文書，除法律另有規定外，不得供閱覽或提供偵查、審判機關以外之其他機關（構）、法人或團體、個人。\n三、第三項明定揭弊者於偵查或審理中為詢（訊）問時，得依其要求蒙面、變聲、變像、視訊傳送或其他適當隔離方式為之。於其依法接受對質或詰問時，亦同。\n四、若揭弊者認無保密之必要，理應尊重，爰於第四項明定前三項之保密措施，揭弊者得放棄之。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十七條","current":null,"versions":[{"bill":"202110005890000","text":"揭弊行為得給與獎金者，其獎金給與基準及相關事項之規定，由各目的事業主管機關定之。\n任職之政府機關（構）、法人、團體或雇主對於揭弊者依法令所得領取之檢舉獎金，不得主張扣抵。\n公務員因揭弊致不法案件受查獲，應享相關之行政獎勵。","note":"一、檢舉獎金之領取與本法所提供之保護，條件容有不同，故宜由目的事業主管機關，於單行法規中明定其給與基準與其他相關事項，爰訂定第一項。惟因公務員之獎金發給，涉及行政院待遇決策權行使，且公務員執行本職業務知有不法，本即具有告發義務，不宜再行發給獎金。為免引致獎金發給爭議，各目的事業主管機關訂定上述獎金給與標準及相關事項規定，不得引據本條作為法律授權依據及公務員執行本職業務所為揭弊行為發給獎金之合理性理由。\n二、揭弊者依法令領取揭弊獎金，與任職之政府機關（構）、法人、團體或雇主依第七條第三項對揭弊者所負之損害賠償責任無涉，為免上開雇主等以揭弊者因揭弊行為已領有檢舉獎金主張扣抵之抗辯，爰為第二項之規定。"},{"bill":"202110006520000","text":"無故騷擾、違反檢察官或法官依本法所為之命令或裁定者，處三年以下有期徒刑、拘役或科新臺幣五十萬元以下罰金。","note":"明定違反保護命令或裁定、無故騷擾揭弊者之刑責。"},{"bill":"202110013980000","text":"未具公務員身分之內部人員因受不利措施所生第十五條第三項之請求權，自知悉事實發生之日起，六個月間不行使而消滅。\n前項請求權之行使，不妨礙依民法或其他法律所得行使之權利。\n政府機關（構）、法人或團體、個人違反第十五條第一項規定，致有損害第一項之內部人員權益之虞者，該內部人員得不經預告終止契約，雇主應給付不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金，及三個月補償金之總額。\n依第十五條第三項第一款復職顯有事實上之困難時，雇主得給付受僱人不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及六個月以上補償金之總額，合意終止勞務契約。\n前二項補償金依受僱人為第十五條第一項各款行為日之前一日起六個月平均工資計算。\n第一項之內部人員為政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約者，得準用前三項規定請求補償金。但契約約定有利於內部人員者，從其約定。","note":"一、為使法律關係早日確定且避免事證消失，參酌第十六條第二項及第四項，爰為第一項、第二項之規定。\n二、參照勞動基準法第十四條，雇主有違反勞動契約或勞工法令，損害勞工權益者，勞工得不經預告終止勞務契約，而雇主仍應依法給付資遣費、退休金等規定，對於雇主因揭弊者為揭弊行為而有違反勞動法規之行為時，亦得不經預告終止勞務契約，且除依法給付之資遣費、退休金外，尚應給付三個月之補償金，爰為第三項之規定。\n三、私部門之復職方面，若事業單位恢復內部人員之職務顯有困難，勞雇雙方得以合意方式協商解決爭議，為避免受僱人於合意內容協議時處於弱勢，就合意內容明定最低保障之宣示規定，除六個月以上之補償金總額外，另應包括資遣費、退休金，爰為第四項之規定：\n(一)適用勞動基準法之受僱人，不低於勞動基準法及勞工退休金條例關於資遣費、退休金之計給標準。\n(二)不適用勞動基準法之受僱人，不低於依其適用法規（如學校法人及其所屬私立學校教職員退休撫卹離職資遣條例、各機關學校聘僱人員離職給與辦法等）關於退休金、資遣費之計給標準。\n(三)至如無勞動法令或其他法規適用之受僱者，其退休金、資遣費從其契約約定。\n四、上開補償之給付時點，由勞雇雙方約定之，如未約定者，雇主應於契約終止時給付之。另，如雇主有拒絕受僱人復職之情形，因已涉違反勞動契約，損及其勞動權益，第四項規定不影響受僱人得依勞動基準法第十四條規定主張終止契約及請求資遣費之權利。\n五、為使揭弊者得有合理時間另尋工作，明定雇主應依其為第十五條第一項各款行為日前一日之六個月平均工資為基準，提供待業補償金，爰為第五項之規定。\n六、考量私企業內部高階人員或保險從業人員、房仲人員等亦有為內部揭弊之可能，而前開特定行業人員與企業間係屬委任關係，無勞動法規之適用，本法為提供內部受委任人員工作權之保障，就編制內固定支領俸（薪）給之受委任人員亦得請求待業補償金，如為企業編制外之外部委任關係，如法律顧問、會計師等則不在本項適用範圍，爰為第六項之規定。"},{"bill":"202110014070000","text":"依相關法規公部門得就揭弊行為給與獎金者，其獎金給與基準及相關事項之規定，由各目的事業主管機關按主管機關辦法定之。\n前項情形，私部門就其內部規章得給與獎金者，從其規定。\n任職之政府機關（構）、法人、團體或雇主對於揭弊者依法令所得領取之檢舉獎金，不得主張扣抵。","note":"一、為鼓勵揭弊者於知悉不法情事時，勇於舉發，應有獎勵規定，爰於本法第一條規定揭弊者之揭弊行為符合本法規定時，應給予獎金。\n二、為加強鼓勵揭弊通報，並適應不同法規之需要，爰規定獎金發給之標準，由主管機關按主管機關辦法定之。"},{"bill":"202110025210000","text":"因揭弊者之揭弊而查獲不法事實者，應給與獎金。但因行使公權力而得知不法事實之政府機關（構）及其所屬人員、配偶或三親等以內之親屬，不在此限。\n揭弊人任職之政府機關（構）、法人、團體或雇主對於揭弊者依法令所得領取之檢舉獎金，不得主張扣抵。\n第一項獎金發給之標準及其他相關事項，由主管機關會同各目的事業主管機關定之。但其數額不得低於違反法令者因揭弊所受罰鍰、罰金、沒收之財物或財產上利益、追徵價額、財產抵償之總額百分之十。","note":"一、為鼓勵勇敢揭弊，爰於第一項明定因揭弊者之揭弊而查獲不法事實者，應給與獎金。但公務員執行職務知有不法，本即有舉發之義務，本不應再另行發給獎金，參酌「檢舉違法聯合行為獎金發放辦法」第四條第六款之規定，於第一項但書設置排除條款。\n二、揭弊者依法令所領取之檢舉獎金，本與其任職之政府機關（構）、法人、團體或雇主對揭弊者所負之損害賠償責任無涉，為免得否以揭弊者因揭弊所領取之檢舉獎金主張扣抵之爭議，爰為第二項規定。\n三、關於第一項獎金發給之標準及其他相關事項，明定由主管機關會同各目的事業主管機關定之。但獎金之數額，不得低於違反法令者因揭弊所受罰鍰、罰金、沒收之財物或財產上利益、追徵價額、財產抵償之總額百分之十。"},{"bill":"202110033190000","text":"依相關法規公部門得就揭弊行為給與獎金者，其獎金給與基準及相關事項之規定，由各目的事業主管機關按主管機關辦法定之。\n前項情形，私部門就其內部規章得給與獎金者，從其規定。\n任職之政府機關（構）、法人、團體或雇主對於揭弊者依法令所得領取之檢舉獎金，不得主張扣抵。","note":"一、為鼓勵揭弊者於知悉不法情事時，勇於舉發，應有獎勵規定，爰於本法第一條規定揭弊者之揭弊行為符合本法規定時，應給予獎金。\n二、為加強鼓勵揭弊通報，並適應不同法規之需要，爰規定獎金發給之標準，由主管機關按主管機關辦法定之。"},{"bill":"202110039800000","text":"依相關法令公部門得就揭弊行為給與獎金者，其獎金給與基準及相關事項之規定，由各目的事業主管機關定之。\n前項情形，私部門亦得依其內部規章或決定給與獎金。\n任職之政府機關（構）、法人、團體或雇主對於揭弊者依法令、內部規章或決定所得領取之檢舉獎金，不得主張扣抵。","note":"一、由於檢舉獎金涉及揭弊情事所涉法令，檢舉獎金之領取與本法所提供之保護，條件並不相同，故宜由目的事業主管機關，於各該法規中明定給與基準，爰為第一項規定。\n二、又公務員於執行業務時知有不法，其職掌上本具有告發義務，不宜再行發給獎金，特此敘明。\n三、私部門之設立宗旨、組織運作、組織目標、資源分配及經費來源均不一，為尊重私法自治及公司治理原則，除就公部門依相關法令給予檢舉獎金外，私部門亦得依其內部規章或決定另定給與獎金基準等相關事項，爰為第二項規定。\n四、揭弊者依法領取之檢舉獎金，無論公部門依各該目的事業主管機關制定之法規所發給或私部門依內部規範所給與之獎金，與任職政府機關（構）、法人、團體或雇主對於揭弊者所負損害賠償責任無涉，不得主張損益相抵，爰為第三項規定。"}],"changed":true,"final":"揭弊者之揭弊內容有下列情形之一者，仍得依本法受有保護：\n一、所揭露之內容無法證實。但明顯虛偽不實或揭弊行為經受誣告、偽證罪緩起訴或判決有罪確定者，不在此限。\n二、所揭露之內容業經他人檢舉或受理揭弊機關已知悉。但案件已公開或揭弊者明知已有他人檢舉，不在此限。","finalWhy":"一、揭弊者若非明知不實或出於惡意，而係本於事實合理相信其所揭露之弊案內容，縱經調查後無法證實，仍應受到本法之保護，否則將使揭弊者退怯而不願挺身揭弊，爰為第一款規定。\n二、針對非首位提出檢舉之揭弊者，雖其所揭露之弊案內容業經他人提出檢舉或受理揭弊機關已知悉，只要案件尚未公開或揭弊者不知已有他人提出檢舉者，其權益仍應受保護，爰為第二款之規定。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十八條","current":null,"versions":[{"bill":"202110005890000","text":"本法施行細則，由行政院會同司法院、考試院、監察院定之。","note":"因本法對於揭弊者之保護涉及法院審理程序及公務員保障等規範，爰由行政院會同司法院、考試院及監察院訂定施行細則。"},{"bill":"202110006520000","text":"公務員違反本法之規定者，得按其情節輕重，依法予以懲戒或懲處。","note":"明定加強要求公務員依法執行職務之規定。"},{"bill":"202110013980000","text":"違反第十五條第一項規定者，其具有公務員身分者，按其情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；未具公務員身分之人、法人、團體者，由各目的事業主管機關處新臺幣五萬元以上五百萬元以下罰鍰，但其他法律有較重之處罰規定者，從其規定。\n前項後段情形，各目的事業主管機關得限期命其改善，屆期不改善者，按次處罰。","note":"一、參酌公務人員行政中立法第十六條規定，就公務員對揭弊者施以報復性不利人事措施者，應按其情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；未具有公務員身分之自然人、法人或團體，由揭弊案件之目的事業主管機關依違反情節處以行政罰鍰。\n二、如揭弊案件目的事業主管機關不明或涉及數個主管機關權責，而無法確定裁罰機關者，由法務部依第二條第二項確定主管機關。\n三、依行政罰法第二十四條規定，為達嚇阻效用，對施以報復行為之行為人，應予從重處罰，如一行為違反二以上行政法規定時，罰鍰從重，如各單行法規所定之裁罰種類與本法不同者，則得併為裁處。故各單行法規如定有罰鍰以外之其他裁罰，如勞動基準法第八十條之一、職業安全衛生法第四十九條規定，對於違規之事業單位或事業主得公布名稱、負責人姓名，得併予處罰。"},{"bill":"202110014070000","text":"本法自公布後一年施行。","note":"明定本法自公布後一年施行。"},{"bill":"202110025210000","text":"為保障揭弊者之權益，揭弊者保護委員會得辦理下列業務：\n一、協助揭弊者依本法主張除去不利措施及請求損害賠償等權益。\n二、提供揭弊者必要的法律諮詢與法律扶助。\n三、協助揭弊者或其密切關係人依本法請求人身安全之保護措施及安置措施。\n四、提供揭弊者緊急之生理、心理醫療與生活重建之協助。\n五、揭弊者保護之宣導、倡議及研究。\n六、其他符合揭弊者保護之事項。\n主管機關應調派專任人員或聘用專業人員，承主任委員之命，協助辦理揭弊者保護委員會之業務。","note":"一、為有效保障揭弊者之權益，爰於第一項明定揭弊者保護委員會得辦理相關業務。\n二、為使揭弊者保護委員會得以順利推動各項業務，實有專任人員輔助委員會運作之必要，爰於第二項明定主管機關應調派專任人員或聘用專業人員，承主任委員之命，協助辦理揭弊者保護委員會之業務。"},{"bill":"202110033190000","text":"揭弊者所揭露之內容若為明顯虛偽不實、或意圖栽贓毀謗他人、變造證據、隱瞞部分事實者，依行為事實與情節，以誣告、偽證罪交由檢調機關調查後依法起訴。","note":"利用本法保護之法益來進行對他人抹黑、增加國家調查審判成本者，應以刑法進行嚇阻與懲罰。"},{"bill":"202110039800000","text":"本法施行細則，由行政院會同司法院、考試院定之。","note":"明定施行細則訂定機關。"}],"changed":true,"final":"因揭弊者之揭弊而查獲不法事實者，應給與獎金。但因行使公權力而得知不法事實之政府機關（構）及其所屬人員、配偶或三親等以內之親屬，不在此限。\n揭弊者任職之政府機關（構）、法人、團體或雇主對於揭弊者依法令所得領取之檢舉獎金，不得主張扣抵。\n第一項獎金發給之標準及其他相關事項，由主管機關會同各目的事業主管機關定之。但其數額不得低於違反法令者因揭弊所受罰鍰、罰金、沒收之財物或財產上利益、追徵價額、財產抵償之總額百分之十。","finalWhy":"一、為鼓勵勇敢揭弊，爰於第一項明定因揭弊者之揭弊而查獲不法事實者，應給與獎金。但公務員執行職務知有不法，本即有舉發之義務，本不應再另行發給獎金，參酌檢舉違法聯合行為獎金發放辦法第四條第六款之規定，於第一項但書設置排除條款。\n二、揭弊者依法令所領取之檢舉獎金，本與其任職之政府機關（構）、法人、團體或雇主對揭弊者所負之損害賠償責任無涉，為免得否以揭弊者因揭弊所領取之檢舉獎金主張扣抵之爭議，爰為第二項規定。\n三、關於第一項獎金發給之標準及其他相關事項，明定由主管機關會同各目的事業主管機關定之。但獎金之數額，不得低於違反法令者因揭弊所受罰鍰、罰金、沒收之財物或財產上利益、追徵價額、財產抵償之總額百分之十。","review":{"note":"保留，送院會處理","text":""}},{"no":"第十九條","current":null,"versions":[{"bill":"202110005890000","text":"本法自公布後一年施行。","note":"明定本法自公布後一年施行。"},{"bill":"202110006520000","text":"本法施行細則，由行政院會同司法院及考試院定之。","note":"明定施行細則訂定機關。"},{"bill":"202110013980000","text":"揭弊者向受理揭弊機關之陳述內容涉及國家機密、營業秘密或其他依法應保密之事項者，不負洩密之民事、刑事、行政及職業倫理之懲戒責任。其因揭弊向律師徵詢法律意見者，亦同。","note":"一、揭弊者揭弊時若向受理揭弊機關洩漏依法應保密之事項者，是否屬刑法第二十一條之「依法令之行為」而不罰，尚有爭議，為明確化，爰參酌美國立法例，為本條之規定。至於向辦案人員以外之人洩密者，仍應負刑責，固不待言。\n二、揭弊者於揭弊前或揭弊後向律師徵詢法律意見時，因而洩漏國家機密或營業秘密者，事關揭弊者權益之保障，亦應免責，爰參照美國立法例，為本條後段之規定。\n三、揭弊者向第六條之受理人員或法人揭弊時，應自行過濾機密事項，否則若有洩密，仍應負法律責任，不受本法保護。"},{"bill":"202110025210000","text":"本法施行細則，由行政院會同司法院、考試院定之。","note":"因本法內容涉及行政院、司法院及考試院之權責，爰於本條明定本法施行細則，由行政院會同司法院及考試院訂定。"},{"bill":"202110033190000","text":"本法自公布後一年施行。","note":"明定本法自公布後一年施行。"},{"bill":"202110039800000","text":"本法施行日期，由行政院定之。","note":"為使本法順利施行，尚須辦理法令宣導及推動私部門建置通報管道等相關事宜，明定施行日期由行政院定之。"}],"changed":true,"final":"為保障揭弊者之權益，揭弊者保護委員會辦理下列業務：\n一、協助揭弊者依本法主張除去不利措施及請求損害賠償等權益。\n二、提供揭弊者必要的法律諮詢與法律扶助。\n三、協助揭弊者或其密切關係人依本法請求人身安全之保護措施及安置措施。\n四、提供揭弊者緊急之生理、心理醫療與生活重建之協助。\n五、揭弊者保護之宣導、倡議及研究。\n六、其他符合揭弊者保護之事項。\n主管機關應調派專任人員或聘用專業人員，承主任委員之命，協助辦理揭弊者保護委員會之業務。","finalWhy":"一、為有效保障揭弊者之權益，爰於第一項明定揭弊者保護委員會辦理相關業務。\n二、為使揭弊者保護委員會得以順利推動各項業務，實有專任人員輔助委員會運作之必要，爰於第二項明定主管機關應調派專任人員或聘用專業人員，承主任委員之命，協助辦理揭弊者保護委員會之業務。","review":{"note":"保留，送院會處理","text":""}},{"no":"第二十條","current":null,"versions":[{"bill":"202110006520000","text":"本法施行日期，由行政院定之。","note":"明定施行日期。"},{"bill":"202110013980000","text":"揭弊者係揭弊內容所涉犯罪之正犯或共犯，且符合證人保護法第三條及第十四條第一項之要件者，得依同法第十四條第一項予以減輕或免除其刑，不受該法第二條所列罪名之限制。\n機關受理前項經法院判決免除其刑確定之揭弊者申請再任公職案件時，得不受公務人員任用法第二十八條第一項第四款之限制。","note":"一、揭弊者若有到場作證且符合證人保護法第十四條第一項之規定，則所涉罪名不受證人保護法第二條之罪名之限制，亦得享有刑責減免之寬典，參酌兒童及少年性剝削防制條例第十一條及人口販運防制法第二十三條之規定，爰為第一項規定。\n二、按公務人員任用法第二十八條第一項第四款規定「有下列情事之一者，不得任用為公務人員：……四、曾服公務有貪污行為，經有罪判決確定或通緝有案尚未結案」，為鼓勵正犯或共犯中之公務員勇於揭弊，並保障其免職後申請再任公職之權益，爰為第二項之規定。本項僅提供揭弊者再任公職之申請權利，至於受理任職機關仍得依個案裁量，審酌准否再任公職。"},{"bill":"202110025210000","text":"本法自公布後一年施行。","note":"明定本法自公布後一年施行。"}],"changed":true,"final":"本法施行細則，由行政院會同司法院、考試院定之。","finalWhy":"因本法內容涉及行政院、司法院及考試院之權責，爰於本條明定本法施行細則，由行政院會同司法院及考試院訂定。","review":null},{"no":"第二十一條","current":null,"versions":[{"bill":"202110013980000","text":"揭弊者符合證人保護法第三條之要件者，其本人或其配偶、直系血親、其他身分上或生活上有密切關係之人，得依該法施以人身安全之保護措施，不受該法第二條所列罪名之限制。\n意圖妨害或報復受本法保護之揭弊者揭發弊端、配合調查或擔任證人，而向揭弊者或其配偶、直系血親、其他身分上或生活上有密切關係之人實施犯罪行為者，依其所犯之罪，加重其刑至二分之一。","note":"一、為擴大保護範圍，避免被揭弊者以揭弊者密切關係之人之人身安全相脅，本條所稱揭弊者之密切關係之人，其範圍係指具揭弊者之配偶及直系血親之身分者，無待舉證即有受保護之適格；其餘有密切關係之人除參酌證人保護法施行細則第三條所稱「密切利害關係之人」以親等之遠近為判斷依據外，尚應就個案審酌其是否與揭弊者實際上有緊密之身分上或生活上關係為判斷，爰參酌證人保護法將揭弊者之密切關係人列入人身保護範圍，於第一項明定揭弊者若有到場作證，即可獲證人保護法之人身安全保護措施，所涉罪名不受該法第二條之限制。\n二、為強化揭弊者之人身保護，參酌證人保護法第十八條之規定，明定對於揭弊者及其密切關係之人實施犯罪者，加重刑罰，爰為第二項之規定。"}],"changed":true,"final":"本法自公布後六個月施行。","finalWhy":"明定本法自公布後六個月施行。","review":null},{"no":"第二十二條","current":null,"versions":[{"bill":"202110013980000","text":"揭弊者依本法所受之保護，不因下列情形而喪失：\n一、所揭露之內容無法證實。但明顯虛偽不實或檢舉行為經以誣告、偽證罪判決有罪者，不在此限。\n二、所揭露之內容業經他人檢舉或受理揭弊機關已知悉。但案件已公開或揭弊者明知已有他人檢舉者，不在此限。","note":"一、揭弊者若係基於有事實合理相信而揭弊，非明知不實或出於惡意，縱經調查後查無實據仍應受保護，否則將使揭弊者退怯而不願挺身揭弊。惟若檢舉之內容明顯虛偽不實或空泛時，為避免浪費調查資源，間接助長造假文化，自不應受本法保護，爰為第一款之規定。\n二、針對非首位檢舉之揭弊者，雖其所提供之消息與首位揭弊者有所重複，惟若其因而遭受不利之人事措施，其權益仍應受保護，爰參酌美國立法例，為第二款本文之規定。另考量國家資源衡平分配，對已公開或明知他人已檢舉之案件而再為檢舉者，恐有濫訴或以獲取不當利益為目的之虞，而徒增偵查資源之浪費，爰為第二款但書之規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十三條","current":null,"versions":[{"bill":"202110013980000","text":"依相關法規公部門得就揭弊行為給與獎金者，其獎金給與基準及相關事項之規定，由各目的事業主管機關定之。\n前項情形，私部門就其內部規章得給與獎金者，從其規定。\n任職之政府機關（構）、法人、團體或雇主對於揭弊者依法令所得領取之檢舉獎金，不得主張扣抵。","note":"一、檢舉獎金之領取與本法所提供之保護，條件容有不同，故宜由目的事業主管機關，於單行法規中明定其給與基準與其他相關事項，爰訂定第一項。惟因公務員之獎金發給，涉及行政院待遇決策權行使，且公務員執行本職業務知有不法，本即具有告發義務，不宜再行發給獎金。為免引致獎金發給爭議，各目的事業主管機關訂定上述獎金給與標準及相關事項規定，不得引據本條作為法律授權依據及公務員執行本職業務所為揭弊行為發給獎金之合理性理由。\n二、揭弊者依法令領取揭弊獎金，與任職之政府機關（構）、法人、團體或雇主依第七條第三項對揭弊者所負之損害賠償責任無涉，為免上開雇主等以揭弊者因揭弊行為已領有檢舉獎金主張扣抵之抗辯，爰為第二項之規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十四條","current":null,"versions":[{"bill":"202110013980000","text":"揭弊者保護官，就主管機關調查認定為揭弊通報事由或揭弊者所屬事業單位或機關（構）有違反本法規定之行為，且情節重大者，得向法院訴請停止或禁止該行為。\n前項訴訟免繳裁判費。","note":"參照消費者保護法第五十三條之規定，揭弊者保護官就主管機關調查認定為揭弊通報事由或揭弊者因所屬事業單位或機關（構）之違反本法規定之行為，且情節重大者，得向法院提起公益訴訟。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"保留，送院會處理","text":""}},{"no":"第二十五條","current":null,"versions":[{"bill":"202110013980000","text":"本法施行細則，由行政院會同司法院、考試院定之。","note":"因本法對於揭弊者之保護涉及法院審理程序及公務員保障等規範，爰由行政院會同司法院及考試院訂定施行細則。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十六條","current":null,"versions":[{"bill":"202110013980000","text":"本法自公布後一年施行。","note":"明定本法自公布後一年施行。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2024-02-23","stage":"一讀","code":"院會-11-1-2","bill":"202110005890000","gazref":"113卷004期5186號 264-264頁"},{"date":"2024-03-01","stage":"一讀","code":"院會-11-1-3","bill":"202110006520000","gazref":"113卷005期5187號 6-6頁"},{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110013980000","gazref":"113卷010期5192號 13-14頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110014070000","gazref":"113卷014期5196號 2-2頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110025210000","gazref":"113卷018期5200號 17-17頁"},{"date":"2024-04-19","stage":"一讀","code":"院會-11-1-10","bill":"202110033190000","gazref":"113卷028期5210號 8-8頁"},{"date":"2024-05-03","stage":"一讀","code":"院會-11-1-12","bill":"202110039800000","gazref":"113卷035期5217號 5-5頁"},{"date":"2024-05-16","code":"委員會-11-1-36-23","title":"第11屆第1會期司法及法制委員會第23次全體委員會議","gazref":"113卷048期5230號 39-282頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024051091/details?meetingDate=113/05/16","full":["https://ivod.ly.gov.tw/Play/Full/1M/15923"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/48/LCIDC01_1134801_00002.pdf","p1":39,"p2":282}],"clips":[{"n":"洪孟楷","t":"09:07","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152559"},{"n":"徐欣瑩","t":"09:10","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152569"},{"n":"林月琴","t":"09:13","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152570"},{"n":"黃國昌","t":"09:16","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152571"},{"n":"羅智強","t":"09:25","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152572"},{"n":"王世堅","t":"09:29","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152573"},{"n":"黃健豪","t":"09:33","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152574"},{"n":"吳宗憲","t":"09:37","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152575"},{"n":"謝龍介","t":"09:50","u":"https://ivod.ly.gov.tw/Play/Clip/1M/152611"},{"n":"黃國昌","t":"09:57","u":"https://ivod.ly.gov.tw/Play/Clip/ /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
const PARTY = D.parties || {};
const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));
  return p;
}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = el('div', {class: 'toast', role: 'status', text: msg});
  document.body.append(t); setTimeout(() => t.remove(), 4500);
}
function copyHere(id) {
  const url = location.href.split('#')[0] + '#' + id;
  const ok = () => toast('已複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言，可以往前往後讀。');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, () => prompt('複製這個連結', url));
  else prompt('複製這個連結', url);
  history.replaceState(null, '', '#' + id);
}
function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {
  box.textContent = '';

  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      const pa = PARTY[normName(t.s)];
      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});
      d.dataset.fp = fp(t.s + '|' + (t.b.find(x => typeof x === 'string') || '').slice(0, 30));

        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});
          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));
          into.append(el('div', {class: 'readnote'}, btn));
        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));
    turns.append(d);
  });

  const chips = el('div', {class: 'chips'});

  idx.append(chips);
  box.append(idx, finder(turns), turns);
}

    '逕付二讀的提案多半會交黨團協商，或與已經審查完的相關提案併案處理。',
    '這一天只有主席宣告的幾句話，沒有實質討論。']},
  '二讀': {t: '二讀會', sub: '實質討論、逐條審議，最關鍵的階段', what: '委員會審查完畢，或是經逕付二讀後，將法案送到院會進行全體討論與表決。', pts: [
    '這是法案通過與否最關鍵、辯論最激烈的階段。',
    '進行廣泛討論以及逐條討論、修正。',
    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
Object.assign(READING, {
  '復議': {t: '復議', sub: '要求把已經表決的案子重新討論', what: '議案表決之後，當初投贊成的一方可以提出復議，要求重新討論、重新表決。', pts: [
    '復議被否決之後，同一個案子不能再提復議，決議就此確定。',
    '實務上常見多數方自己提出復議、再自己否決，目的是讓剛通過的條文確定下來。']},
  '重付表決': {t: '重付表決', sub: '對表決結果有異議，再表決一次', what: '出席委員對表決結果有異議時，經 15 人以上連署或附議，可以要求重新表決。', pts: ['以一次為限。']},
  '修正動議': {t: '修正動議', sub: '在院會對條文提出的修改案', what: '委員或黨團在二讀（或三讀）時，對討論中的條文提出另一個版本的文字，交院會表決。', pts: ['需要 10 人以上連署或附議。']},
  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
