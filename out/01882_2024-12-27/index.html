<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公益揭弊者保護法制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"公益揭弊者保護法","version":"01882:2024-12-27-制定","date":"2024-12-27","action":"制定","title":"公益揭弊者保護法　2024 年制定","lede":"這是一部新制定的法，保護揭發公部門、國營事業和受政府控制之事業、團體或機構弊案的人。主管機關是法務部，並要組成揭弊者保護委員會。揭弊者具名向受理揭弊機關檢舉後，任何機關、法人或個人不得因此對他解職、減薪、降調或採取其他不利措施；檢舉後 20 天內沒有收到受理調查的通知、促請後 10 天內仍沒有回應，可以改向民意代表、媒體或公益團體揭弊，仍受保護。公務員無故洩漏揭弊者身分，處六月以上五年以下有期徒刑；因揭弊查獲不法事實的，應發給獎金。委員廖偉翔、楊瓊瓔、林月琴、洪孟楷、徐巧芯、吳宗憲等人和台灣民眾黨黨團共提出七個草案，司法及法制委員會在 2024 年 7 月 8 日開公聽會，11 月 7 日逐條審查時大部分條文保留，交黨團協商。協商沒有共識，12 月 27 日院會逐條記名表決，照台灣民眾黨黨團和國民黨黨團的再修正動議通過，三讀無異議。","summary":"制定專法保護揭發公部門、國營事業和受政府控制之事業、團體或機構弊案的人：不得因揭弊對其採取解職、減薪等不利措施，身分要保密，查獲不法應給獎金，主管機關為法務部。","key":"01882_2024-12-27","props":[{"id":"202110005890000","who":"委員廖偉翔等18人","date":"2024-02-23","name":"「揭弊者保護法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110005890000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/02/LCEWA01_110102_00011.pdf","proposers":["廖偉翔","黃健豪","羅廷瑋"],"ncosign":15,"people":[["廖偉翔","國民黨","提案"],["黃健豪","國民黨","提案"],["羅廷瑋","國民黨","提案"],["王育敏","國民黨","連署"],["陳菁徽","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["丁學忠","國民黨","連署"],["謝衣鳯","國民黨","連署"],["蘇清泉","國民黨","連署"],["牛煦庭","國民黨","連署"],["柯志恩","國民黨","連署"],["林倩綺","國民黨","連署"],["陳永康","國民黨","連署"],["盧縣一","國民黨","連署"],["翁曉玲","國民黨","連署"],["羅智強","國民黨","連署"],["林思銘","國民黨","連署"],["王鴻薇","國民黨","連署"]],"party":[["國民黨",18]],"reason":"本院委員廖偉翔、黃健豪、羅廷瑋等18人，為求我國公、私機關有效防堵潛在弊端，藉由訂定專法並建立鼓勵舉發機制，以及加強保障揭弊者之舉，可有效增加讓相關違法犯行受曝光之可能，是以參照英國、日本、紐西蘭、美國、澳洲等國之吹哨者保護法（Whistleblower Protection Act）、公益揭露法（Public Interest Disclosure Act）及公益通報者保護法，爰擬具「揭弊者保護法草案」，以利建立廉能政府、維護社會公義。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條"]},{"id":"202110006520000","who":"委員楊瓊瓔等21人","date":"2024-03-01","name":"「揭弊者保護法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110006520000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/03/LCEWA01_110103_00053.pdf","proposers":["楊瓊瓔","洪孟楷","黃健豪","廖偉翔","羅廷瑋","黃仁"],"ncosign":15,"people":[["楊瓊瓔","國民黨","提案"],["洪孟楷","國民黨","提案"],["黃健豪","國民黨","提案"],["廖偉翔","國民黨","提案"],["羅廷瑋","國民黨","提案"],["黃仁","國民黨","提案"],["陳超明","無黨籍","連署"],["邱鎮軍","國民黨","連署"],["羅智強","國民黨","連署"],["牛煦庭","國民黨","連署"],["王育敏","國民黨","連署"],["林沛祥","國民黨","連署"],["陳雪生","國民黨","連署"],["張嘉郡","國民黨","連署"],["賴士葆","國民黨","連署"],["陳玉珍","國民黨","連署"],["葉元之","國民黨","連署"],["盧縣一","國民黨","連署"],["蘇清泉","國民黨","連署"],["謝龍介","國民黨","連署"],["吳宗憲","國民黨","連署"]],"party":[["國民黨",20],["無黨籍",1]],"reason":"本院委員楊瓊瓔、洪孟楷、黃健豪、廖偉翔、羅廷瑋、黃仁等21人，鑑於社會多元化之發展，許多公、私部門之行為，咸有危害國家公共利益之可能，惟對於機關內部之不當弊端而違反法令，往往因缺乏具體事證而難以查辦。即使現行部分法令中有訂定吹哨者保護條款，但由於保護未有全面制度化之安排，甚至常常遭到秋後算帳的威脅，導致揭弊者大多卻步。因此，世界各國為強化對揭弊者之保護，早已訂定相關專法來鼓勵揭弊者勇於揭發不法，而《聯合國反腐敗公約》也規定，各締約國均應當考慮在本國法律制度中納入適當措施，以便對出於合理理由善意，向主管機關舉報涉及根據本公約確立的犯罪任何事實之任何人員提供保護，使其不致受到任何不公正的待遇。綜此，為維護公共利益、有效發覺、追查公私部門之內部違法情事，並保護、鼓勵揭弊者，爰擬具「揭弊者保護法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條"]},{"id":"202110013980000","who":"委員林月琴等17人","date":"2024-03-15","name":"「公益揭弊者保護法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110013980000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/05/LCEWA01_110105_00133.pdf","proposers":["林月琴"],"ncosign":16,"people":[["林月琴","民進黨","提案"],["林淑芬","民進黨","連署"],["楊曜","民進黨","連署"],["沈伯洋","民進黨","連署"],["張雅琳","民進黨","連署"],["賴惠員","民進黨","連署"],["林俊憲","民進黨","連署"],["莊瑞雄","民進黨","連署"],["郭昱晴","民進黨","連署"],["王美惠","民進黨","連署"],["黃捷","民進黨","連署"],["黃秀芳","民進黨","連署"],["羅美玲","民進黨","連署"],["李坤城","民進黨","連署"],["吳沛憶","民進黨","連署"],["王正旭","民進黨","連署"],["劉建國","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員林月琴等17人，鑑於事業單位之違法情事時有發生，我國雖於「勞動基準法」、「食品衛生管理法」等法規有吹哨者揭弊通報規定，然面對國內揭弊案件，分散各部法律的吹哨者條款，囿無完備之受理、調查、保護法制可依據，對於吹哨者權益保障恐不盡周全，連帶影響國民揭弊之意願，不利於人民權益維護、國家政風端正。故此參酌他國相關法制與我國研究文獻，訂定專法以保護公、私部門之公益揭弊者之生命、身體、財產、勞動條件及其他相關利益之權益，俾利建立廉能政府、維護社會公共利益與公共安全且有效防制違法之情事。爰擬具「公益揭弊者保護法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條","第二十一條","第二十二條","第二十三條","第二十四條","第二十五條","第二十六條"]},{"id":"202110014070000","who":"委員洪孟楷等22人","date":"2024-03-22","name":"「揭弊者保護法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110014070000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/06/LCEWA01_110106_00016.pdf","proposers":["洪孟楷","羅廷瑋","牛煦庭"],"ncosign":19,"people":[["洪孟楷","國民黨","提案"],["羅廷瑋","國民黨","提案"],["牛煦庭","國民黨","提案"],["黃仁","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["萬美玲","國民黨","連署"],["陳雪生","國民黨","連署"],["黃健豪","國民黨","連署"],["羅智強","國民黨","連署"],["陳玉珍","國民黨","連署"],["林思銘","國民黨","連署"],["吳宗憲","國民黨","連署"],["張智倫","國民黨","連署"],["盧縣一","國民黨","連署"],["翁曉玲","國民黨","連署"],["林德福","國民黨","連署"],["李彥秀","國民黨","連署"],["廖先翔","國民黨","連署"],["高金素梅","無黨籍","連署"],["柯志恩","國民黨","連署"],["邱鎮軍","國民黨","連署"],["徐巧芯","國民黨","連署"]],"party":[["國民黨",21],["無黨籍",1]],"reason":"本院委員洪孟楷、羅廷瑋、牛煦庭等22人，有鑑於我國公務機關或事業單位等治理體系發生之不法案件未能有效制裁，以致衍生社會成本，嚴重犧牲人民權益、影響社會秩序及擾亂經濟安定。考量犯罪形成初期，單藉不法犯罪周遭成員之外部執法查察，難以提早發現並遏止其蔓延；另犯罪揭發後之調查程序，仍需仰賴內部知情者協助舉證並提供重要資訊。是以，為促進國民生命、身體、財產或其他利益保護之法令的遵守，應立法積極保護及鼓勵揭弊者勇於揭發重大不法，進而維護公共利益、實現公平正義，爰擬具「揭弊者保護法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條"]},{"id":"202110025210000","who":"台灣民眾黨黨團","date":"2024-03-29","name":"「公益揭弊者保護法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110025210000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/07/LCEWA01_110107_00174.pdf","proposers":["黃國昌","黃珊珊","吳春城"],"ncosign":0,"people":[["黃國昌","民眾黨","提案"],["黃珊珊","民眾黨","提案"],["吳春城","民眾黨","提案"]],"party":[["民眾黨",3]],"reason":"本院台灣民眾黨黨團，鑑於我國欠缺完整的吹哨者保護法制，導致知悉不法弊案存在之人民，一方面擔心遭受報復，往往不敢向政府機關舉發，使不法之徒逍遙法外；一方面在鼓起勇氣舉發弊案之後，揭弊者往往面臨各種不利對待，整體而言，現行法制之規範與運作，根本無法提供揭弊者完整與必要之保護。然而，建立揭弊者保護法制，卻早已是我國在《聯合國反貪腐公約》內國法化之下，所應履行之國家義務，更是在2017年司法改革國是會議所達成之決議。綜上，為保障及鼓勵揭弊者踴躍揭發不法弊案，建立廉能政府，維護公共利益之實現，爰擬具「公益揭弊者保護法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條","第二十條"]},{"id":"202110033190000","who":"委員徐巧芯等19人","date":"2024-04-19","name":"「揭弊者保護法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110033190000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/10/LCEWA01_110110_00077.pdf","proposers":["徐巧芯","洪孟楷"],"ncosign":17,"people":[["徐巧芯","國民黨","提案"],["洪孟楷","國民黨","提案"],["張嘉郡","國民黨","連署"],["陳菁徽","國民黨","連署"],["邱鎮軍","國民黨","連署"],["牛煦庭","國民黨","連署"],["林沛祥","國民黨","連署"],["馬文君","國民黨","連署"],["翁曉玲","國民黨","連署"],["陳永康","國民黨","連署"],["廖先翔","國民黨","連署"],["王育敏","國民黨","連署"],["賴士葆","國民黨","連署"],["張智倫","國民黨","連署"],["林思銘","國民黨","連署"],["高金素梅","無黨籍","連署"],["楊瓊瓔","國民黨","連署"],["陳超明","無黨籍","連署"],["林德福","國民黨","連署"]],"party":[["國民黨",17],["無黨籍",2]],"reason":"本院委員徐巧芯、洪孟楷等19人，鑒於國際社會先進國家，皆已經通過專門法律以保護揭發者，達成揭露犯罪行為和打擊腐敗之目的，並同時維護政府廉潔。我國雖有刑法和反貪污法等相關規範，其中納入相當的嚴懲腐敗和不法行為之規定，惟在犯罪尚未被揭發或調查過程中，因資訊不對等或對於證據採集不夠全面，若有內部知情者能協助舉報或提供信息，將對於反腐工作有更大的助益，且能更迅速掌握犯罪事實與調查方向，以維護公共利益。綜上，通過制定專門法律來鼓勵揭發重大不法行為，保障揭發者的人身安全和工作實有相當之必要與時效性，爰擬具「揭弊者保護法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條"]},{"id":"202110039800000","who":"委員吳宗憲等19人","date":"2024-05-03","name":"「公益揭弊者保護法草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110039800000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/12/LCEWA01_110112_00043.pdf","proposers":["吳宗憲","廖偉翔","陳菁徽","許宇甄","牛煦庭","羅廷瑋"],"ncosign":13,"people":[["吳宗憲","國民黨","提案"],["廖偉翔","國民黨","提案"],["陳菁徽","國民黨","提案"],["許宇甄","國民黨","提案"],["牛煦庭","國民黨","提案"],["羅廷瑋","國民黨","提案"],["黃國昌","民眾黨","連署"],["黃建賓","國民黨","連署"],["涂權吉","國民黨","連署"],["鄭正鈐","國民黨","連署"],["丁學忠","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["謝龍介","國民黨","連署"],["羅明才","國民黨","連署"],["高金素梅","無黨籍","連署"],["柯志恩","國民黨","連署"],["林思銘","國民黨","連署"],["張智倫","國民黨","連署"],["馬文君","國民黨","連署"]],"party":[["國民黨",17],["民眾黨",1],["無黨籍",1]],"reason":"本院委員吳宗憲、廖偉翔、陳菁徽、許宇甄、牛煦庭、羅廷瑋等19人，有鑑於近年來食安、公害、金融及瀆職弊案層出不窮，且制定揭弊者保護專法為反貪腐之重要機制，亦為國際間衡量國家廉能之重要指標。而我國現有針對揭弊保護之規範，散見於「證人保護法」、「食品安全衛生管理法」、「食品安全衛生檢舉案件處理及獎勵辦法」、「勞動基準法」及「金融控股公司及銀行業內部控制及稽核制度」等；惟該揭法令對保護對象及適用情事均有所不同，或僅屬行政命令層級，整體而言仍有欠周延。為落實保障揭弊者權益，並建立專法將揭弊者權益保護明文化，以提供揭露不法資訊者全面性之保護機制，進而形塑揭弊為正面之價值觀，鼓勵揭弊者勇於揭發不法情事，爰擬具「公益揭弊者保護法草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條","第十條","第十一條","第十二條","第十三條","第十四條","第十五條","第十六條","第十七條","第十八條","第十九條"]}],"arts":[{"no":"第一條","current":null,"versions":[{"bill":"202110005890000","text":"為維護公共利益，有效發現、防止、追究重大不法行為，保障公部門及私部門揭弊者之權益，特制定本法。\n揭弊者之揭弊程序及保護，依本法之規定。但其他法律之規定更有利於揭弊者之保護者，從其規定。","note":"一、明定本法立法目的係為保障公共利益、追究不法行為並維護揭弊者之權益。\n二、有關揭弊者之揭弊程序及保護。"},{"bill":"202110006520000","text":"為維護公共利益、有效發覺、追查公私部門之內部違法情事，並保護、鼓勵揭弊者，特制定本法。\n揭弊者之鼓勵及保護，依本法之規定。但其他法律之規定，較本法更有利者，適用最有利之規定。","note":"明定本法之立法目的。"},{"bill":"202110013980000","text":"為維護公共利益，有效發現、防止、追究重大不法行為，保障公部門及私部門揭弊者之權益，特制定本法。\n揭弊者之揭弊程序及保護，依本法之規定。但其他法律之規定更有利於揭弊者之保護者，從其規定。","note":"一、揭示本法立法目的係為保障基於公共利益維護之目的提出檢舉，並有利於不法行為訴追之揭弊者之權益，並不及於私人紛爭案件。故本法名稱訂為：公益揭弊者保護法。\n二、「揭弊」之概念非同於「檢舉」。其為內部人員對弊端之發生與經過有第一手之資料，而主動揭發，則事先能防止發生，事後能追究責任，其揭弊功效超乎其他一般民眾。故本法所稱之揭弊者限於機關（構）「內部人員」。惟採公部門與私部門合併立法之方式設立規則。\n三、因內部揭弊者多屬於被揭弊者之部屬或員工，可能遭受解僱、降級、減薪、與其他侵害該員身體法意之報復措施，故有立法保護之必要，爰為第一項之規定。\n四、為落實保護從優之精神，有關本法對於揭弊者之保護措施與其他法規競合時，原則依本法規定為之。但其他法規對於揭弊者如有較有利之保護規定者，則分別適用該更有利揭弊者之保護規定。惟基於資源分配精神，避免重複保護，揭弊者不得依不同法規請求同時適用相同類型之保護措施，爰為第二項之規定。故本法第三條弊案範圍以外部分，非本法保護範圍，其他法規如有提供優於本法規定之保護措施，自應優先適用，併予敘明。\n五、一般檢舉程序、檢舉人之保護，如目的事業主管機關依權責要求所轄單位遵循之一般檢舉程序及規範，非本條所稱「揭弊程序」或「揭弊保護」，自不受本法之影響。有關其他法規之自首、自白減刑規定，屬司法機關審理時量刑參考，故其他法規之減刑規定與本法第二十條之減刑規定得同時為法院量刑之參考，不在第二項之適用範圍。"},{"bill":"202110014070000","text":"為維護我國公共利益，鼓勵對於政府機關、公司及商業之內部違法情事之揭弊，並使揭弊者獲得保護，特制定本法。\n揭發人之保護及鼓勵，依本法之規定。但其他法律之規定，較本法更有利者，適用最有利之規定。","note":"一、明定本法之立法目的，為促進公益、提升國際競爭力，鼓勵組織成員勇於揭發內部不法情事，以維護組織本身利益及社會公益。\n二、本法若與其他法律競合時則適用最有利於揭發人之法律。"},{"bill":"202110025210000","text":"為維護公共利益，有效防止、發現弊案並追究責任，保障公部門及私部門揭弊者之權益，特制定本法。\n揭弊者之揭弊程序及保護，依本法之規定。但其他法律之規定更有利於揭弊者之保護者，從其規定。","note":"一、明示本法立法目的係為了保障基於公共利益維護之目的揭發不法行為，並為了有效防止、發現弊案並追究責任，保障公部門及私部門揭弊者之權益，爰為第一項之規定。\n二、在本法對於揭弊者之保護措施與其他法規競合時，原則依本法規定為之。惟為落實保護從優之原則，若其他法規更有利於揭弊者之保護者，則適用該更有利於揭弊者之保護規定。"},{"bill":"202110033190000","text":"為維護我國公共利益，鼓勵對於政府機關、公司及商業之內部違法情事之揭弊，並使揭弊者獲得保護，特制定本法。\n揭發人之保護及鼓勵，依本法之規定。但其他法律之規定，較本法更有利者，適用最有利之規定。","note":"一、明定本法之立法目的，為促進公益、提升國際競爭力，鼓勵組織成員勇於揭發內部不法情事，以維護組織本身利益及社會公益。\n二、本法若與其他法律競合時則適用最有利於揭發人之法律。"},{"bill":"202110039800000","text":"為維護公共利益，有效發覺、防止、追查重大不法行為，保障公部門及私部門揭弊者之權益，特制定本法。\n揭弊者之揭弊程序及保護，依本法之規定。但其他法律之規定更有利於揭弊者之保護者，從其規定。","note":"一、國際上所有現代民主化國家，均以廉潔與效率為追求目標，且政府廉潔性與施政能力對於國家競爭力有巨大影響；為了提升國家整體廉能效度、保障人民法益，打擊公、私部門的不法貪腐，均至關重要。故本法立法目的係保障為了維護公共利益且及早發現不法之目的所提揭弊，並不及於私人間糾紛，且係為了保障揭弊者權益。\n二、本法所稱揭弊者，限於組織「內」部人員，與「檢舉」不限內、外部人員，有所不同。且若能鼓勵內部人員主動提供相關資訊，除了可以及時取得事證、有效打擊不法外，基於預防勝於治療之精神，如能事前預防即時修正，更能有效遏止弊端發生，甚至減少損害的擴大，其揭弊功效超乎其他一般民眾，然因其屬於被揭弊者之部屬或員工，於公、私部門均可能遭到降級、降調，或處以減薪、解聘等報復措施，故有立法保護之必要。\n三、本法對於揭弊者之保護措施若與其他法律競合時，原則依本法規定為之。但其他法律之規定對於揭弊者如有較有利之保護規定者，則適用該更有利揭弊者之保護規定。惟避免重複保護，不得依不同法律請求同時適用相同類型之保護措施。例如貪瀆案件，於刑事偵查程序中，必須揭弊者同時具備證人身分且須符合證人保護法之相關要件時，始有同時適用證人保護法之可能，而本法所定之保護措施，其與證人保護法可能發生競合適用者，乃身分保密、人身安全保護、刑責減免等部分，依本法規定，就人身安全保護、刑責減免等措施之啟動，均係於揭弊案件繫屬後，始由檢察官或法院在具體個案中加以審酌。基此，有關本法與證人保護法發生競合適用時，自應由案件繫屬之檢察官或法院依揭弊者意願或其受危害之程度及急迫性等因素，適用最有利於揭弊者之規定。又本法第三條弊案範圍以外部分，非本法保護範圍，其他法律如有提供保護措施，自應予以適用，併予敘明。\n四、如政府部門或民間企業已有制定檢舉程序及檢舉人之保護規範，非本條所稱「揭弊程序」或「揭弊保護」，自不受本法之影響。有關其他法規之自首、自白減刑規定，屬司法機關審理時量刑參考，故其他法規之減刑規定與本法第十三條之減刑規定得同時為法院量刑之參考，不在第二項之適用範圍。"}],"changed":true,"final":"為維護公共利益，有效發現、防止、追究重大不法行為，並保障公部門、國營事業及受政府控制之事業、團體或機構揭弊者之權益，特制定本法。\n揭弊者之揭弊程序及保護，依本法之規定。但其他法律之規定更有利於揭弊者之保護者，從其規定。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"條文及委員吳宗憲等4人所提修正動議均保留，送院會處理","text":""}},{"no":"第二條","current":null,"versions":[{"bill":"202110005890000","text":"本法之主管機關為法務部。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。目的事業主管機關有爭議者，由法務部確定之。","note":"一、本法之制定與修正由法務部負責，爰為第一項之規定。\n二、本法所定事項包含受理揭弊、案件調查、揭弊者相關保護措施（如身分保密、工作權保障、報復行為人之裁罰、各項揭弊獎金之訂定與發放等）之執行，均可能涉及中央及地方目的事業主管機關職掌，為免爭議，明定主管機關不明時，由法務部確定之原則，爰為第二項之規定。"},{"bill":"202110006520000","text":"本法之用詞定義如下：\n一、揭弊者：指依本法或其他法律之規定，舉發或提供相關具體事證者。\n二、內部違法情事：指故意犯刑法瀆職罪章、公共危險罪章、侵占罪章、詐欺背信及重利罪章、妨害電腦使用罪章之罪；犯貪污治罪條例之罪、政府採購法、違反公務員服務法而情節重大、違反公職人員利益衝突迴避法而情節重大；違反銀行法、金融控股公司法、信用合作社法、信託業法、票券金融管理法、證券交易法、期貨交易法、公平交易法或其他有關經濟、財政法規之行為；違反空氣污染防制法、水污染防治法、海洋污染防治法、廢棄物清理法、環境用藥管理法、土壤及地下水污染整治法或其他有關環境保護法規之行為；違反食品安全衛生管理法、藥事法、醫療法或其他有關衛生福利法規之行為；違反勞動基準法、職業安全衛生法或其他有關勞動法規之行為或違反其他經主管機關以命令指定法規之行為。\n三、不當措施：指揭弊者或其關係人所屬機關（構）或其上級機關（構）、法人、或團體、個人，因揭發行為，無正當理由，不得對揭弊者或其密切關係人有不利於其身分、官職等級、俸給、工作條件、管理措施、解僱、降調、減薪等不利益待遇、終止、解除、變更或不給予其依法令、契約或習慣上所應享有之權益或為強暴、脅迫、侮辱、騷擾或其他干擾之行為。\n四、受理揭弊機關：指檢察機關、司法警察機關、政風機構或各法規之主管機關。","note":"明定本法之用詞定義。"},{"bill":"202110013980000","text":"本法之主管機關為法務部。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。目的事業主管機關有爭議者，由法務部確定之。","note":"一、本法之制定與修正由法務部負責，爰為第一項之規定。\n二、本法所定事項包含受理揭弊、案件調查、揭弊者相關保護措施（如身分保密、工作權保障、報復行為人之裁罰、各項揭弊獎金之訂定與發放等）之執行，均可能涉及中央及地方目的事業主管機關職掌，例如受僱勞工因雇主違反勞動法令所提申訴之勞動爭議案件，係以勞動部及地方勞動主管機關為主管機關；參酌公務人員保障法第四條第二項規定，公務人員保障事件，則由公務人員保障暨培訓委員會為主管機關。另因本法涉及目的事業主管機關繁雜，為免爭議，參酌臺灣地區與大陸地區人民關係條例施行細則第四十六條第二項，明定主管機關不明時，由法務部確定之原則，爰為第二項之規定。\n三、若勞工與雇主因本法所生勞動爭議，仍得依各該法律提起救濟，例如權利事項勞資爭議之救濟管道，可透過勞資爭議處理法之調解、仲裁或裁決，亦可同時透過民事訴訟、勞動事件法進行訴訟救濟。"},{"bill":"202110014070000","text":"本法之主管機關為法務部。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。目的事業主管機關有爭議者，由法務部確定之。","note":"一、明定本法之主管機關。\n二、鑒於揭弊內容涉及各類公共利益，諸如勞工權益、職業安全、金融交易、環境保護、食品衛生、醫藥醫療等，均屬不同主管機關之管轄，故應針對各機關之管轄為主管機關之設定。若有爭議時，則交由法務部確定之。"},{"bill":"202110025210000","text":"本法之主管機關為法務部。\n法務部為辦理本法所定之揭弊者保護事項事項，應組成揭弊者保護委員會。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。目的事業主管機關有爭議者，由揭弊者保護委員會確定之。\n揭弊者保護委員會置委員七人，由主管機關就具下列資格者遴聘之，任期三年，並由委員互推一人為主任委員：\n一、曾任法官、檢察官、律師及其他依法具有專門執業及技術執業資格人員五年以上者。\n二、曾任或現任教育部認可之大專院校教授五年以上，聲譽卓著者。\n三、對揭弊者保護、人權保障有專門研究或貢獻，或具相關公民團體實務經驗，聲譽卓著者。\n揭弊者保護委員會之組織規程、遴聘方式、處理程序及其他應遵行事項之辦法，由主管機關定之。","note":"一、明定本法之主管機關。\n二、為有效保障揭弊者之權益，法務部應組成揭弊者保護委員會，以利處理相關事宜。\n三、本法所定事項，可能涉及中央及地方目的事業主管機關職掌，例如受僱勞工因雇主違反勞動法令所提申訴之勞動爭議案件，則以勞動部及地方勞動主管機關為主管機關。公務人員保障事件，則由公務人員保障暨培訓委員會為主管機關。此外，當目的事業主管機關究竟為何出現爭議時，則明定由揭弊者保護委員會確定之，爰為第三項之規定。\n四、明定揭弊者保護委員會置委員七人，由主管機關遴聘之，任期三年。其他關於揭弊者保護委員會之組織規程、遴聘方式、處理程序及其他應遵行事項之辦法，明確授權由主管機關定之。"},{"bill":"202110033190000","text":"本法之主管機關為法務部。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。目的事業主管機關有爭議者，由法務部確定之。","note":"一、明定本法之主管機關。\n二、鑒於揭弊內容涉及各類公共利益，諸如勞工權益、職業安全、金融交易、環境保護、食品衛生、醫藥醫療等，均屬不同主管機關之管轄，故應針對各機關之管轄為主管機關之設定。若有爭議時，則交由法務部確定之。"},{"bill":"202110039800000","text":"本法之主管機關為法務部。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。目的事業主管機關有爭議者，由主管機關確定之。","note":"一、本法主管機關為法務部。\n二、鑒於私部門之揭弊可能涉及各類不一之公共利益，諸如食品安全、勞工權益、公司治理、環保、衛生、金融等，涉及不同目的事業主管機關之職掌，故應針對各機關之管轄為主管機關之設定，並於有爭議時，交由法務部確定之。"}],"changed":true,"final":"本法之主管機關為法務部。\n法務部為辦理本法所定之揭弊者保護事項，應組成揭弊者保護委員會。\n本法所定事項，涉及各目的事業主管機關職掌者，由各該目的事業主管機關辦理。目的事業主管機關有爭議者，由揭弊者保護委員會確定之。\n揭弊者保護委員會置委員七人，以法務部部長為主任委員，並為當然委員；其餘委員由主管機關就具下列資格者遴聘之，任期三年：\n一、曾任法官、檢察官、律師及其他依法具有專門執業及技術執業資格人員五年以上者。\n二、曾任或現任教育部認可之大專院校教授五年以上，聲譽卓著者。\n三、對揭弊者保護、人權保障有專門研究或貢獻，或具相關公民團體實務經驗，聲譽卓著者。\n揭弊者保護委員會之組織規程、遴聘方式、處理程序及其他應遵行事項之辦法，由主管機關定之。","finalWhy":"一、明定本法之主管機關。\n二、為有效保障揭弊者之權益，法務部應組成揭弊者保護委員會，以利處理相關事宜。\n三、本法所定事項，可能涉及中央及地方目的事業主管機關職掌，例如受僱勞工因雇主違反勞動法令所提申訴之勞動爭議案件，則以勞動部及地方勞動主管機關為主管機關。公務人員保障事件，則由公務人員保障暨培訓委員會為主管機關。此外，當目的事業主管機關究竟為何出現爭議時，則明定由揭弊者保護委員會確定之，爰為第三項之規定。\n四、明定揭弊者保護委員會置委員七人，以法務部部長為主任委員，並為當然委員；其餘委員由主管機關遴聘之，任期三年。其他關於揭弊者保護委員會之組織規程、遴聘方式、處理程序及其他應遵行事項之辦法，明確授權由主管機關定之。","review":{"note":"保留，送院會處理","text":""}},{"no":"第三條","current":null,"versions":[{"bill":"202110005890000","text":"本法所稱弊案如下：\n一、犯刑法瀆職罪章之罪。\n二、犯貪污治罪條例之罪。\n三、包庇他人犯罪之行為。但以法律有明文規定刑事處罰者為限。\n四、違反公職人員利益衝突迴避法得處以罰鍰之違規行為。\n五、違反法官法第三十條第二項第七款或第八十九條第四項第七款之應付評鑑行為。\n六、其他涉及公共利益之犯罪、重大管理不當、浪費公帑、濫用權勢，或對國民健康、公共安全造成具體危險之行為。","note":"定義弊案之內涵，凡影響政府廉能之不法資訊揭露、對社會有重大危害、影響市場與公共利益者，均屬本法所稱之弊案，故有關公務員貪瀆相關犯罪行為與違規行為，並包括其他重大管理不當、浪費公帑、濫用權勢之行為，或對國民健康、公共安全造成具體危險之行為。"},{"bill":"202110006520000","text":"本法之主管機關為法務部。","note":"明定本法之主管機關。"},{"bill":"202110013980000","text":"本法所稱弊案如下：\n一、犯刑法瀆職罪章之罪。\n二、犯貪污治罪條例之罪。\n三、包庇他人犯罪之行為。但以法律有明文規定刑事處罰者為限。\n四、違反公職人員利益衝突迴避法得處以罰鍰之違規行為。\n五、違反法官法第三十條第二項第七款或第八十九條第四項第七款之應付評鑑行為。\n六、其他涉及公共利益之犯罪、處以罰鍰之違規行為、或應付懲戒之行為。\n前項第六款弊案範圍，由法務部會商相關機關定之；並應定期檢討、調整或增減。","note":"一、影響政府廉能之不法資訊揭露，均屬本法所稱之弊案，故有關公務員貪瀆相關犯罪行為與違規行為均應涵括之，爰參考美國立法例，為第一款、第二款及第四款之規定。\n二、第三款所稱「包庇他人犯罪」之行為，以刑法或其他特別刑法有明文處罰「包庇罪」之刑事犯罪者為限，例如刑法第二百六十四條、人口販運防制法第三十六條、懲治走私條例第十條等公務員包庇罪，如公務員僅消極之不為舉發者，不在此限，爰為本款之規定。\n三、第五款於司法公正領域，將法官與檢察官之倫理規範亦納入公部門揭弊範圍。\n四、揭發之犯罪不以貪污瀆職罪為限，尚包括影響國計民生、危害公共健康與安全、違反公益之犯罪與違規行為及諸此影響社會公益性甚高，且犯罪型態隱密，亟需鼓勵內部員工勇於揭弊之案件類型。為因應社會變遷並鼓勵不同弊端類型之揭弊者，考量社會民情需求，並整合近年社會矚目之公益揭弊案件類型，包含違反金融、環境保護、衛生福利、勞動法規等涉及公共利益之犯罪、處以罰鍰之違規行為、或應付懲戒之行為，均得列為私部門弊端項目範疇，而為因應社會變遷，本法施行後，除列舉之弊端項目外，有增列概括條款之必要，使主管機關得視實務需要，並參考下列基準，適時調整本法保護之弊端項目範圍，爰於第二項增訂授權主管機關定期檢討、調整或增減弊端項目之規定：\n(一)侵害國家法益、社會法益之重大不法行為。\n(二)涉及不特定多數人利益之犯罪。\n(三)違反環保、食安、社會福利、金融秩序等法規，足生損害於公眾之生命、身體、健康、財產等利益之虞者。\n(四)維護弱勢族群之權益保障。\n(五)其他侵害公共利益，情節重大者。"},{"bill":"202110014070000","text":"本法所稱揭弊者，係指針對下列犯罪或違法行為或致公眾之生命、身體、健康、財產等利益受有侵害或有侵害之虞者之事項進行揭露：\n一、犯刑法瀆職罪章、公共危險罪章、侵占罪章及詐欺背信及重利罪章之罪。\n二、犯貪污治罪條例之罪。\n三、藉職務所犯及對行不法之包庇行為。\n四、公職人員違反公職人員利益衝突迴避法，有利益衝突之情事。\n五、公職人員違反政府採購法，有損依公平、公開之採購程序，以及提升採購效率、功能，及採購品質之情事。\n六、其他重大之人為管理不當、浪費公帑、以權勢脅迫行使特定目的，或對公眾能源供應、國民健康、食品安全、邊境防檢、兒少保護、校園經營、環境保護、金融穩定、社會秩序、司法公正造成具體損害之行為者。\n七、違反藥事法、醫療法或其他有關衛生福利法規之行為。\n八、違反勞動基準法、職業安全衛生法或其他有關勞動法規之行為。\n九、違反其他經主管機關以命令指定法規之行為。","note":"一、明定符合揭弊者及揭露事由之定義。\n二、本法規範目的係為保護及鼓勵不法情事之揭弊者，而「揭弊者」之身分宜從被揭發事務之性質及揭發之方式判斷。\n三、爰第一項各款明列牽涉公益之刑事不法、行政不法之事項，包含貪汙瀆職之罪、違反公務人員利益衝突迴避法及政府採購法等。又揭發之事由屢次引發外溢成本，影響社會不特定多數人、特定多數人之生命、身體、財產等利益，具有立法之迫切性，包含重大刑事、勞動權益、環境汙染、衛生福利、食品安全相關法規之案件。\n四、為使本法與時俱進，第一項第十款授權主管機關以命令指定法規，以廣開舉發不法事件管道，俾利及時發現、遏止重大不法情事，以因應社會現況與法令之改變。"},{"bill":"202110025210000","text":"本法所稱弊案如下：\n一、違反刑法瀆職罪章之行為。\n二、違反貪污治罪條例之行為。\n三、包庇他人犯罪之行為。但以法律有明文規定刑事處罰者為限。\n四、違反公職人員利益衝突迴避法之行為。\n五、違反洗錢防制法、組織犯罪防制條例、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、兒童及少年性剝削防制條例或人口販運防制法之行為。\n六、違反銀行法、金融控股公司法、信用合作社法、信託業法、證券投資信託及顧問法、證券交易法、期貨交易法、公平交易法或營業秘密法之行為。\n七、違反空氣污染防制法、水污染防治法、海洋污染防治法、廢棄物清理法、環境用藥管理法或土壤及地下水污染整治法之行為。\n八、違反食品安全衛生管理法、藥事法或醫療法之行為。\n九、違反勞動基準法或職業安全衛生法之行為。\n十、違反法官法第三十條第二項或第八十九條第四項之應付個案評鑑行為。\n十一、違反刑法妨害投票罪章、公職人員選舉罷免法、總統副總統選舉罷免法、公民投票法或反滲透法之行為。\n十二、其他重大管理不當、浪費公帑、濫用權勢，或對國民健康、公共安全造成具體危險之行為，有受監察院彈劾、糾舉或糾正之虞者。\n十三、其他經主管機關公告之犯罪、處以罰鍰之違規行為、或應付懲戒之行為。\n前項第十三款弊案範圍，由主管機關會商相關機關公告定之；並應定期檢討、調整、增減公告之弊案範圍。","note":"一、本法係為保護及鼓勵重大不法情事之揭弊，因此保護揭弊者之揭發弊案範圍，以牽涉公益之刑事不法及重大行政不法為原則，涵蓋貪腐、黑金槍毒、金融秩序、環境污染、食品安全、勞動權益、選舉公投等面向，爰於第一項明定弊案之範圍。。\n二、為使本法能因應現實需要及法令變更而為即時彈性之調整，爰於第二項明定前項第十三款弊案之範圍，由主管機關會商相關機關公告定之；並應定期檢討、調整、增減公告之弊案範圍，俾能實現本法目的。"},{"bill":"202110033190000","text":"本法所稱揭弊者，係指針對下列犯罪或違法行為或致公眾之生命、身體、健康、財產等利益受有侵害或有侵害之虞者之事項進行揭露：\n一、犯刑法瀆職罪章、公共危險罪章、侵占罪章及詐欺背信及重利罪章之罪。\n二、犯貪污治罪條例之罪。\n三、藉職務所犯及對行不法之包庇行為。\n四、公職人員違反公職人員利益衝突迴避法，有利益衝突之情事。\n五、公職人員違反政府採購法，有損依公平、公開之採購程序，以及提升採購效率、功能，及採購品質之情事。\n六、其他重大之人為管理不當、浪費公帑、以權勢脅迫行使特定目的，或對公眾能源供應、國民健康、食品安全、邊境防檢、兒少保護、校園經營、環境保護、金融穩定、社會秩序、司法公正造成具體損害之行為者。\n七、違反藥事法、醫療法或其他有關衛生福利法規之行為。\n八、違反勞動基準法、職業安全衛生法或其他有關勞動法規之行為。\n九、違反其他經主管機關以命令指定法規之行為。","note":"一、明定符合揭弊者及揭露事由之定義。\n二、本法規範目的係為保護及鼓勵不法情事之揭弊者，而「揭弊者」之身分宜從被揭發事務之性質及揭發之方式判斷。\n三、爰第一項各款明列牽涉公益之刑事不法、行政不法之事項，包含貪汙瀆職之罪、違反公務人員利益衝突迴避法及政府採購法等。又揭發之事由屢次引發外溢成本，影響社會不特定多數人、特定多數人之生命、身體、財產等利益，具有立法之迫切性，包含重大刑事、勞動權益、環境汙染、衛生福利、食品安全相關法規之案件。\n四、為使本法與時俱進，第一項第十款授權主管機關以命令指定法規，以廣開舉發不法事件管道，俾利及時發現、遏止重大不法情事，以因應社會現況與法令之改變。"},{"bill":"202110039800000","text":"本法所稱弊案，係指針對下列犯罪或違法行為或涉及公共利益且情節重大者：\n一、犯刑法瀆職罪章之行為。\n二、違反貪污治罪條例之行為。\n三、包庇他人犯罪之行為。但以法律有明文規定刑事處罰者為限。\n四、違反公職人員利益衝突迴避法得處以罰鍰之行為。\n五、違反政府採購法之行為。\n六、法官法第三十條第二項第七款或第八十九條第四項第七款之應付評鑑行為。\n七、違反下列各目涉有危害公共利益且情節重大之行為：\n(一)犯刑法公共危險罪章、詐欺背信及重利罪、第二百三十一條之一、第二百九十六條、第二百九十六條之一之行為。\n(二)違反洗錢防制法、組織犯罪防制條例、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、人口販運防制法、兒童及少年性剝削防制條例之行為。\n(三)犯刑法妨害投票罪章或違反公職人員選舉罷免法、總統副總統選舉罷免法、公民投票法、反滲透法之行為。\n(四)違反營業秘密法之行為。\n(五)違反銀行法、保險法、證券交易法、期貨交易法、信託業法、金融控股公司法、票券金融管理法、證券投資信託及顧問法、公平交易法或其他有關經濟、財政法規之行為。\n(六)違反水土保持法、山坡地保育利用條例、空氣污染防制法、水污染防治法、海洋污染防治法、廢棄物清理法、毒性及關注化學物質管理法、土壤及地下水污染整治法、環境用藥管理法之罪或其他有關環境保護法規之行為。\n(七)違反藥事法、醫療器材管理法、食品安全衛生管理法、傳染病防治法或其他有關衛生福利法規之行為。\n(八)違反勞動基準法、勞動檢查法、職業安全衛生法、就業服務法或其他有關勞動法規之行為。\n(九)違反性騷擾防治法、性別工作平等法、性別平等教育法之行為。\n(十)違反身心障礙者權益保障法、老人福利法、兒童及少年福利與權益保障法之行為。\n八、其他涉及重大公共利益之犯罪、處以罰鍰之或應付懲戒之行為。前項第八款弊案範圍，由主管機關會商相關機關定之，並定期檢討、調整或增減。","note":"一、有關公務員貪瀆之不法行為均足以影響政府廉能，爰為第一項第一款、第二款、第四款及第五款之規定。\n二、第一項第三款所稱「包庇他人犯罪」之行為，以刑法或其他特別刑法有明文處罰「包庇罪」之刑事犯罪者為限，例如刑法第二百六十四條、人口販運防制法第三十六條、懲治走私條例第十條等公務員包庇罪，如公務員僅係消極之不為舉發者，不在此限。\n三、第一項第六款屬司法公正領域，將法官與檢察官之倫理規範亦納入公部門揭弊範圍。\n四、揭發之不法類型包括影響國計民生、危害公共健康與安全、影響社會公益性甚高之犯罪與行政不法情事，亟需鼓勵內部員工勇於揭弊之案件類型。為因應社會變遷並鼓勵不同弊端類型之揭弊者，考量社會民情需求及避免境外勢力不當侵害我國產業國際競爭力，並整合近年社會矚目之公益通報案件類型，包含違反刑法公共危險、詐欺、洗錢、組織犯罪、槍砲、走私、毒品、人口販運、兒少權利、選舉、營業秘密、金融、環境保護、衛生福利、勞動、性別平權、弱勢族群法律等涉及重大公共利益之犯罪、處以罰鍰之違規情事或應付懲戒之行為，均得列為私部門弊端項目範疇，爰為第一項第七款規定。\n五、因應社會變遷，為使主管機關得視實務需要，於第一項第八款訂有概括條款。為使上開概括條款有所依循，爰參考下列基準，適時調整本法保護之弊端項目範圍，並於第二項授權主管機關就第一項第八款之弊案範圍定期檢討、調整或增減弊端\n(一)侵害國家法益、社會法益之重大不法行為。\n(二)涉及不特定多數人利益之犯罪。\n(三)違反環境保護、食品安全、社會福利、金融秩序等法律，足以生損害於公眾之生命、身體、健康、財產等利益之虞者。\n(四)維護性別平權、弱勢族群之權益保障。\n(五)其他侵害公共利益，情節重大者。\n(六)揭弊者保護之必要性。"}],"changed":true,"final":"本法所稱弊案，係指公務員或政府機關（構）、受政府控制之事業、團體或機構之人員，涉有下列犯罪或違法行為或涉及公共利益且情節重大者：\n一、犯刑法瀆職罪章之行為。\n二、違反貪污治罪條例之行為。\n三、包庇他人犯罪之行為。但以法律有明文規定刑事處罰者為限。\n四、違反公職人員利益衝突迴避法得處以罰鍰之行為。\n五、違反政府採購法之行為。\n六、法官法第三十條第二項第七款或第八十九條第四項第七款之應付評鑑行為。\n七、違反下列各目涉有危害公共利益且情節重大之行為：\n(一)犯刑法公共危險罪章、詐欺背信及重利罪、第二百三十一條之一、第二百九十六條、第二百九十六條之一之行為。\n(二)違反洗錢防制法、組織犯罪防制條例、槍砲彈藥刀械管制條例、懲治走私條例、毒品危害防制條例、人口販運防制法、兒童及少年性剝削防制條例之行為。\n(三)犯刑法妨害投票罪章或違反公職人員選舉罷免法、總統副總統選舉罷免法、公民投票法、反滲透法之行為。\n(四)違反營業秘密法之行為。\n(五)違反銀行法、保險法、證券交易法、期貨交易法、信託業法、金融控股公司法、票券金融管理法、證券投資信託及顧問法、公平交易法或其他有關經濟、財政法規之行為。\n(六)違反水土保持法、山坡地保育利用條例、空氣污染防制法、水污染防治法、海洋污染防治法、廢棄物清理法、毒性及關注化學物質管理法、土壤及地下水污染整治法、環境用藥管理法之罪或其他有關環境保護法規之行為。\n(七)違反藥事法、醫療器材管理法、食品安全衛生管理法、傳染病防治法或其他有關衛生福利法規之行為。\n(八)違反勞動基準法、勞動檢查法、職業安全衛生法、就業服務法或其他有關勞動法規之行為。\n(九)違反性騷擾防治法、性別平等工作法、性別平等教育法之行為。\n(十)違反身心障礙者權益保障法、老人福利法、兒童及少年福利與權益保障法之行為。\n八、其他涉及重大公共利益之犯罪、處以罰鍰或應付懲戒之行為。\n前項第八款弊案範圍，由主管機關會商相關機關定之，並定期檢討、調整或增減。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"保留，送院會處理","text":""}},{"no":"第四條","current":null,"versions":[{"bill":"202110005890000","text":"本法所稱受理揭弊機關如下：\n一、公部門之政府機關（構）主管、首長或其指定人員、私部門之法人、團體、雇主或其關係企業之主管、負責人或其指定人員。\n二、檢察機關。\n三、司法警察機關。\n四、目的事業主管機關。\n五、監察院。\n六、政風機構。\n揭弊者為現役軍人或情報人員，其揭弊限於向前項第一款、第二款、第五款或第六款之機關（構）、人員為之，始受本法保護。\n揭弊內容涉及國家機密保護法之國家機密者，應向下列機關揭弊，始受本法保護：\n一、涉及密、機密等級事項，應向第一項第二款或第五款之機關為之。\n二、涉及絕對機密及極機密等級事項，應向最高檢察署為之。\n受理揭弊機關，認所受理之揭弊內容非其主管事項時，應將案件移送各權責機關，並通知揭弊者。揭弊案件經移送各權責機關者，仍依本法規定保護之。","note":"一、明定本法所稱受理揭弊之機關。\n二、規範第一項第一款之人員得為受理揭弊機關，係為給予政府機關（構）自我檢討改正與內部查證不肖份子之機會。\n三、第一項第六款所稱政風機構依政風機構人員設置管理條例第三條第一項，指中央與地方機關（構）及公營事業機構掌理政風業務之機構。\n四、第二項所稱現役軍人，係參考軍事審判法第二條，指依兵役法或其他法律服現役之軍官、士官、士兵；所稱情報人員，係依國家情報工作法第三條，指情報機關所屬從事相關情報工作之人員。前開人員均有其特殊之服從性質，且其職務經常涉及國家安全，故提出揭弊之第一層受理機關應予限縮，以具有對外獨立性的檢察與監察機構、內部主管、首長或其指定人員及軍情機關之政風機構為限。\n五、揭弊內容涉及國家機密保護法所定之機密等級事項者，依其機密等級，分別向第一項第二款、第五款機關以及最高檢察署為之。"},{"bill":"202110006520000","text":"揭弊者應具名以言詞、書面、電磁紀錄或其他適當之方式向受理揭弊機關為之。其非以文書或電磁紀錄為之者，受理揭弊機關應錄音錄影、作成書面紀錄。\n揭弊者向受理揭弊機關以外之政府機關（構）、媒體為前項行為，而經該機關（構）、媒體認符合第二條規定移送受理揭弊機關處理者，適用本法之規定。","note":"明定適用本法之揭弊者揭弊方式。"},{"bill":"202110013980000","text":"本法所稱受理揭弊機關如下：\n一、政風機構。\n二、私部門之法人、團體、雇主或其關係企業之主管、負責人或其指定人員。\n三、檢察機關。\n四、司法警察機關。\n五、監察院。\n揭弊內容涉及國家機密保護法之國家機密者，應向下列機關揭弊，始受本法保護：\n一、涉及機密等級事項，應向前項第一款、第三款或第五款之機關為之。\n二、涉及絕對機密及極機密等級事項，應向最高檢察署為之。\n受理揭弊機關對揭弊內容，應依相關法令予以保密；如認所受理之揭弊內容非其主管事項時，應將案件移送各權責機關，並通知揭弊者。揭弊案件經移送各權責機關者，仍依本法規定保護之。","note":"一、第一項規定受理揭弊機關範疇，包含政風機構、私部門之主管、負責人或其指定之人、檢察機關、司法警察機關、監察院，揭弊者得依其身分別或揭弊內容之特殊限制，在數有權受理機關中擇一提出揭弊，均為本法規定之受理揭弊機關。\n二、第一項第一款所稱政風機構依政風機構人員設置管理條例第三條第一項，指中央與地方機關（構）及公營事業機構掌理政風業務之機構，執行政府機關（構）的內部監督機制。\n三、第一項第二款所稱私部門之主管、負責人，依商業登記法第十條第一項規定「本法所稱商業負責人，在獨資組織，為出資人或其法定代理人；在合夥組織者，為執行業務之合夥人。」；至財團法人或社團法人，則指董事、執行長。\n四、揭弊內容涉及國家機密保護法所定之機密等級事項者，其揭弊限於向第一項第一款政風機構、第二款檢察機關或第五款監察院為之，以兼顧國家安全與利益；揭弊內容涉及國家安全之絕對機密與極機密事項之案件時，更不容有任何之洩漏，故其揭弊應向最高檢察署為之，由具有民意基礎與犯罪調查權之檢察總長親自或指揮其他檢察官進行調查，爰參考美國立法例，為第二項之規定。\n五、揭弊者誤向非主管權責之受理揭弊機關提出揭弊或經受理揭弊機關調查後，認非其主管事項，如檢察機關偵查終結後認未涉及犯罪，但仍有本法第三條所列違規行為或其他情事者，應移送各權責機關辦理，或如政風機構調查後認疑涉有犯罪情事時，亦應即移送檢察機關或司法警察機關偵辦。受理揭弊機關之管轄，依刑事訴訟法或行政程序法等相關規定辦理；至揭弊案件經移送其他權責機關續行辦理者，仍依本法規定保護之，爰為第三項之規定。"},{"bill":"202110014070000","text":"本法所稱受理揭弊機關如下：\n一、公部門之政府機關（構）主管、首長或其指定人員、私部門之法人、團體、雇主或其關係企業之主管、負責人、其獨立行使職權之內部單位或其指定人員。\n二、檢察機關。\n三、司法警察機關。\n四、目的事業主管機關。\n五、監察院。\n六、政風機構。\n揭弊者為現役軍人或情報人員，其揭弊限於向前項第一款、第二款、第五款或第六款之機關（構）及其人員為之，始受本法保護。\n揭弊內容涉及國家機密保護法之國家機密者，應向下列機關揭弊，始受本法保護：\n一、涉及機密等級事項，應向第一項第二款或第五款之機關為之。\n二、涉及絕對機密及極機密等級事項，應向最高檢察署為之。\n受理揭弊機關，認所受理之揭弊內容非其主管事項時，應將案件移送各權責機關，並通知揭弊者。揭弊案件經移送各權責機關者，仍依本法規定保護之。\n前項受移送機關，就其受理權限有爭議時，應交由法務部定受理揭弊機關。","note":"一、明定公部門層級之受理揭弊機關。\n二、揭發人應向有權受理揭發之機關揭發不法 情事，然為保護不諳揭發程序之揭發人，其誤向本法所定受理揭發之機關以外之政府機關（構）為舉報或提供相關具體事證，仍認揭發人所為之揭發行為，適用本法之規定，政府機關（構）並應將揭發案件移送於受理揭發機關處理。至於受理揭發機關之管轄，應依刑事訴訟法或行政程序法等相關規定辦理，併予說明。"},{"bill":"202110025210000","text":"本法所稱受理揭弊機關如下：\n一、公部門之政府機關（構）主管、首長或其指定人員、私部門之法人、團體、雇主或其關係企業之主管、負責人或其指定人員。\n二、檢察機關。\n三、司法警察機關。\n四、目的事業主管機關。\n五、監察院。\n六、政風機構。\n揭弊內容涉及國家機密保護法所定之國家機密者，應向下列機關揭弊，始受本法保護：\n一、涉及機密等級事項，應向前項第一款、第二款或第五款之機關為之。\n二、涉及絕對機密及極機密等級事項，應向最高檢察署為之。\n受理揭弊機關對揭弊內容，應依相關法令予以保密。\n受理揭弊機關判定揭弊之內容非其主管事項時，應將案件移送各權責機關，並通知揭弊者。揭弊案件經移送各權責機關者，仍依本法規定保護之。","note":"一、就受理揭弊之機關，包含公部門之政府機關（構）之主管、首長或其指定人員、私部門之法人、團體、雇主或其關係企業之主管、負責人或其指定人員、檢察機關、司法警察機關、目的事業主管機關、監察院及政風機構，揭弊者得依其身分或揭弊內容，在數個受理機關中擇一揭弊，爰於第一項明定本法所定之第一層受理揭弊機關。\n二、揭弊內容涉及國家機密保護法所定之機密等級事項者，為兼顧國家安全，明定揭弊限於向前項第一款、第二款或第五款機關為之；揭弊內容涉及絕對機密及極機密等級事項者，明定揭弊應向最高檢察署為之，爰於第二項規定。\n三、第三項明定受理揭弊機關對揭弊內容，應依相關法令予以保密，以保護揭弊者。\n四、若受理揭弊機關判定揭弊之內容非其主管事項時，明定其應將案件移送各權責機關，並通知揭弊者。揭弊案件經移送各權責機關者，仍依本法規定保護之，爰為第四項之規定。"},{"bill":"202110033190000","text":"本法所稱受理揭弊機關如下：\n一、公部門之政府機關（構）主管、首長或其指定人員、私部門之法人、團體、雇主或其關係企業之主管、負責人、其獨立行使職權之內部單位或其指定人員。\n二、檢察機關。\n三、司法警察機關。\n四、目的事業主管機關。\n五、監察院。\n六、政風機構。\n揭弊者為現役軍人或情報人員，其揭弊限於向前項第一款、第二款、第五款或第六款之機關（構）及其人員為之，始受本法保護。\n揭弊內容涉及國家機密保護法之國家機密者，應向下列機關揭弊，始受本法保護：\n一、涉及機密等級事項，應向第一項第二款或第五款之機關為之。\n二、涉及絕對機密及極機密等級事項，應向最高檢察署為之。\n受理揭弊機關，認所受理之揭弊內容非其主管事項時，應將案件移送各權責機關，並通知揭弊者。揭弊案件經移送各權責機關者，仍依本法規定保護之。\n前項受移送機關，就其受理權限有爭議時，應交由法務部定受理揭弊機關。","note":"一、明定公部門層級之受理揭弊機關。\n二、揭發人應向有權受理揭發之機關揭發不法情事，然為保護不諳揭發程序之揭發人，其誤向本法所定受理揭發之機關以外之政府機關（構）為舉報或提供相關具體事證，仍認揭發人所為之揭發行為，適用本法之規定，政府機關（構）並應將揭發案件移送於受理揭發機關處理。至於受理揭發機關之管轄，應依刑事訴訟法或行政程序法等相關規定辦理，併予說明。"},{"bill":"202110039800000","text":"本法所稱受理揭弊機關如下：\n一、公部門之政府機關（構）主管、首長或其指定單位、人員；私部門之法人、團體、雇主或其關係企業之主管、負責人或其指定單位、人員。\n二、檢察機關。\n三、司法警察機關。\n四、目的事業主管機關。\n五、監察院。\n六、政風機構。\n揭弊內容涉及國家機密保護法之國家機密者，應向下列機關揭弊，始受本法保護：\n一、涉及機密等級事項，應向前項第一款、第二款或第五款之受理揭弊機關為之。\n二、涉及絕對機密及極機密等級事項，應向最高檢察署或高等檢察署及其檢察分署為之。\n受理揭弊機關對揭弊內容，應依相關法令予以保密。\n受理揭弊機關經判定揭弊內容非其主管事項時，應將案件移送各權責機關，並通知揭弊者。揭弊案件經移送各權責機關者，仍依本法規定保護之。","note":"一、第一項規定受理揭弊機關範疇，包含公部門之政府機關（構）之主管、首長或其指定之單位、人員、私部門之主管、負責人或其指定之單位、人員、檢察機關、司法警察機關、目的事業主管機關、監察院及政風機構，揭弊者得依其身分別或揭弊內容之特殊限制，在數有權受理揭弊機關（構）中擇一提出揭弊，均為本法規定之第一層受理揭弊機關。\n二、第一項第一款所稱公部門之主管、首長或其指定單位、人員，係指被揭弊者所屬政府機關（構）之內部直屬主管、首長或其指定單位、人員；所稱私部門之主管、負責人，依商業登記法第十條第一項規定「本法所稱商業負責人，在獨資組織，為出資人或其法定代理人；在合夥組織者，為執行業務之合夥人。」；至於財團法人或社團法人，則指董事、執行長。\n三、第一項第一款在於向非執法單位之內部主管檢舉，亦受保護，且列舉之第一款至第六款，並無優先順序，亦即並非採「內部檢舉先行主義」，而是「內部、外部通報併行機制」。之所以向非執法機關檢舉亦受保護，目的是鼓勵公部門自我檢討、改正，也讓私部門內部建立揭弊防治機制，讓內部主管有改進之機會與空間。例如火車駕駛員向鐵路局局長舉發安全重大問題，而遭報復性人事調動，如果因為是向內部檢舉而不能納入保護時，將會產生寒蟬效應而無法讓鐵路局在事故發生前自我改進，防止事故之發生。係為給內部自我檢討改正與查證不肖份子之機會。\n四、第一項第六款所稱政風機構，依政風機構人員設置管理條例第三條第一項，指中央與地方機關（構）及公營事業機構掌理政風業務之機構。\n五、第二項，揭弊內容涉及國家機密保護法所定之機密等級事項者，其揭弊限於向第一項第一款、第二款或第五款之受理揭弊機關（構）為之，以兼顧國家安全與利益；揭弊內容涉及國家安全之絕對機密與極機密事項之案件時，更不容有任何之洩漏，爰比照刑事訴訟法第四條規定就內亂罪、外患罪及妨害國交罪第一審管轄權專屬高等法院之意旨，規範此類犯罪應向高等檢察署及其檢察分署或具有犯罪調查監督權限之最高檢察署提出揭弊。另，本法第六條之「第二層揭弊」並未將國家機密排除在外，故若第一層受理揭弊機關對檢舉置之不理，仍得進而向第二層受理揭弊機關揭弊，併此敘明。\n六、第三項明定受理揭弊機關對揭弊內容，應依相關法令予以保密，以保護揭弊者。\n七、揭弊者誤向非主管權責之受理揭弊機關（構）提出揭弊或經受理揭弊機關調查後，認非其主管事項，如檢察機關偵查終結後認未涉及犯罪，但仍有第三條所列違規行為或其他情事者，應移送各權責機關（構）辦理，或如政風機構調查後認疑涉有犯罪情事時，亦應即移送檢察機關或司法警察機關偵辦。受理揭弊機關（構）之管轄，依刑事訴訟法或行政程序法等相關規定辦理；至揭弊案件經移送其他權責機關（構）續行辦理者，仍依本法規定保護之，爰為第四項規定。"}],"changed":true,"final":"本法所稱受理揭弊機關如下：\n一、公部門之政府機關（構）主管、首長或其指定單位、人員。\n二、國營事業、受政府控制之事業、團體或機構之主管、負責人或其指定單位、人員。\n三、檢察機關。\n四、司法警察機關。\n五、目的事業主管機關。\n六、監察院。\n七、政風機構。\n揭弊內容涉及國家機密保護法之國家機密者，應向下列機關揭弊，始受本法保護：\n一、涉及機密等級事項，應向前項第一款、第三款或第六款之受理揭弊機關為之。\n二、涉及絕對機密及極機密等級事項，應向最高檢察署或高等檢察署及其檢察分署為之。\n受理揭弊機關對揭弊內容，應依相關法令予以保密之。\n受理揭弊機關經判定揭弊內容非其主管事項時，應將案件移送各權責機關，並通知揭弊者。揭弊案件經移送各權責機關者，仍依本法規定保護之。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"保留，送院會處理","text":""}},{"no":"第五條","current":null,"versions":[{"bill":"202110005890000","text":"本法所稱揭弊者如下：\n一、公部門揭弊者：指公務員或接受政府機關（構）僱用、委任而從事工作獲致報酬之內部人員，有事實合理相信政府機關（構）或其員工、其他公務員涉有第三條所列之弊案，具名向前條第一項受理揭弊機關提出檢舉者。\n二、私部門揭弊者：指接受公司、獨資或合夥商號、非法人團體、財團法人或社團法人之僱用、委任而從事工作獲致報酬之內部人員，有事實合理相信任職或提供勞務對象之法人、團體、雇主或其關係企業、員工，涉有第三條第一項第六款之揭弊事由，具名向前條第一項第一款至第四款之受理揭弊機關提出相關之事證或真實資訊者。\n前項第一款所稱揭弊之公務員，指政務官及各級民意代表以外，適用國家賠償法之公務員；所稱政府機關（構），指中央與各級地方政府機關、行政法人、公立學校、公立醫療院所、公營事業、政府捐助之財團法人。","note":"一、公部門揭弊：公務員採最廣義之公務員定義，即依國家賠償法第二條第一項規定之「依法令從事於公務之人員。」故無論文武職、地方自治人員、編制內外、聘僱人員或臨時派用人員均屬之，至於是否受有俸給則不在所問。此外，因承攬契約、委任契約而提供勞務給政府機關（構）之工作者或其受僱人、派遣人員，亦有可能得知政府機關（構）之弊案，故此等人揭弊時亦應受保護。復因各公務機關（構）間業務與人員往來頻繁，資訊互通，故公務員所揭弊之情事不限其任職機關，而包括所有政府機關（構）之弊案，屬廣義的內部人檢舉，爰於第一項第一款明定公部門揭弊者之定義。\n二、私部門之內部人員並不以具有勞務契約關係之民法上受僱人為限，尚包括因承攬、委任而提供勞務之人。所稱關係企業之定義，係依公司法第三百六十九條之一以下規定，爰參考美國與日本立法例，為第一項第二款之規定。\n三、揭弊者揭弊時必須有一定之心證程度始受本法保護，惟依本法所提出之揭弊，僅在提供受理揭弊機關啟動調查，並避免誣告濫訟之情事，故其揭弊之門檻不宜過高，揭弊者依其揭弊時之具體情狀，加以觀察、判斷、客觀上足使一般人產生合理懷疑，即為已足。另為避免揭弊者濫行舉發，故以具名為要件，如揭弊內容明顯虛偽或無具體內容，自不受保護。"},{"bill":"202110006520000","text":"揭弊者之揭弊內容有下列情形之一者，受理揭弊機關得不予處理：\n一、非第二條第二款所定揭弊者所為之內部違法情事。\n二、未依第四條所定揭弊方式所為之揭弊。\n三、揭弊內容明顯虛偽不實或無具體之內容。\n四、與調查中或調查程序終結之案件為同一案件，而揭弊者未能提出新證據或新事證。","note":"明定對於揭弊內容虛偽不實之處理。"},{"bill":"202110013980000","text":"本法所稱揭弊者如下：\n一、為下列人員之一，有事實合理相信政府機關（構）或其員工、其他公務員，涉有第三條第一項第一款至第六款所列之弊案，具名向前條第一項受理揭弊機關檢舉者：\n(一)公務員、或政府機關（構）自行進用之人員。\n(二)接受政府機關（構）、國營事業、公法人團體補助、委任、特約、委託、與其他採購關係之相對人及其員工。\n(三)與政府機關（構）具有僱用、定作、委任、派遣、承攬、特約或其他契約關係而獲致報酬之相對人及其員工。\n(四)與政府機關（構）具有教育實習契約之各級教育單位、教師、及其學生。\n(五)各級民意代表之助理。\n二、為下列人員之一，有事實合理相信任職或提供勞務對象之法人、團體、雇主或其關係企業、員工，涉有第三條第一項第六款弊案，具名向前條第一項各款之受理揭弊機關提出檢舉者：\n(一)與公司、獨資或合夥商號、非法人團體、財團法人或社團法人具有僱用、定作、委任、派遣、承攬、特約關係而獲致報酬之相對人及其員工。\n(二)接受公司、獨資或合夥商號、非法人團體、財團法人或社團法人補助之相對人及其員工。\n(三)與公司、獨資或合夥商號、非法人團體、財團法人或社團法人簽定教育實習契約之各級教育單位、教師、及其學生。\n前項第一款第一目所稱公務員，指政務官及各級民意代表以外，適用國家賠償法之公務員；所稱政府機關（構），指中央與各級地方政府機關、行政法人、公立學校、公立醫療院所、公營事業、政府捐助之財團法人。","note":"一、本法所稱之揭弊案件係分為政府機關（構）內部人員揭弊與私部門內部人員揭弊兩大類。\n二、政府機關（構）內部人員揭弊採廣義公務員定義，即：\n(一)依國家賠償法第二條第一項規定之「依法令從事於公務之人員。」故無論文武職、地方自治人員、編制內外、聘僱人員或臨時派用人員均屬之，至於是否受有俸給則不在所問。\n(二)因各公務機關（構）間業務與人員往來頻繁，資訊互通，故公務員所揭弊之情事不限其任職機關，而包括所有政府機關（構）之弊案，屬廣義的內部人檢舉，爰於第一項第一款明定公部門揭弊者之定義。\n(三)因僱用、定作、委任、派遣、承攬、特約或其他契約關係而提供勞務給政府機關（構）之工作者或其受僱人、派遣人員及接受政府機關補助之內部人員、各級民意代表之助理，亦有可能得知政府機關（構）之弊案，故此等人揭弊時亦應受保護。\n(四)與政府機關（構）簽定教育實習契約之各級教育單位，及教授實習課程與從事生活輔導之教師、和受教實習課程之學生（實習生）。該學生雖不以勞務、工資之對價認定，而以提生活津貼為實習課程之生活補助，其教育單位、教師、學生亦有可能得知政府機關（構）之弊案，故此等人揭弊時亦應受保護。具勞工身分以符合勞動基準法規定之第六十四條規定之養成工、見習生、建教合作、及其他技術生另有本條第一項第一款第一目、第二目、第三目適用之。\n(五)參照公職人員利益衝突迴避法第三條第二項立法例，第一項第一款第五目所稱「各級民意代表之助理」指各級民意代表之公費助理、其加入助理工會之助理及其他受其指揮監督之助理。\n三、私部門之內部人員並不以具有勞務契約關係之民法上受僱人為限，包括因僱用、定作、委任、派遣、承攬、特約或其他契約關係而提供勞務之人及接受補助之機關內部人員；以及簽定有教育實習契約之教育單位、教師、及學生。所稱關係企業之定義，係依公司法第三百六十九條之一以下規定，爰參考美國與日本立法例，為第一項第二款之規定。\n四、揭弊者揭弊時必須有一定之心證程度始受本法保護，惟依本法所提出之揭弊，僅在提供受理揭弊機關啟動調查，並避免誣告濫訟之情事，故其揭弊之門檻不宜過高，揭弊者依其揭弊時之具體情狀，加以觀察、判斷、客觀上足使一般人產生合理懷疑，即為已足，爰參考「刑事案件確定後去氧核醣核酸鑑定條例」第二條之用語及最高法院一百零六年台上字第一一五八號判決，以「有事實合理相信」為門檻。另第四條規定多元之受理揭弊機關，且為使受理揭弊機關得依第六條為立案與結案通知，並避免揭弊者濫行舉發，故以具名為要件，如揭弊內容明顯虛偽或無具體內容，自不受保護。至揭弊之動機，則在所不問。\n五、參酌政務人員退職撫卹條例第二條規定，政務官係參與國家大政方針之決策並隨政黨選舉成敗或政策改變而進退之公務員，而各級民意代表則係經由選舉而產生，二者之職位與職務之保障均不同於一般事務官公務員，故不屬本法所稱公部門之揭弊者範疇，但仍為本法被揭弊之對象，爰參考美國立法例，為第二項前段規定。另就本法涵蓋之「政府機關（構）」除各級政府機關外，就行政法人、公立學校、公立醫療院所、公營事業、政府捐助之財團法人，亦屬涉及公權力行使、公款運用或國家社會政策與公共福利之一環，爰於第二項後段明定本法適用之政府機關（構）範疇。\n六、第二項後段所稱政府捐助之財團法人，指財團法人法第二條第二項、第三項規定之財團法人。"},{"bill":"202110014070000","text":"揭弊者向受理揭弊機關揭弊後，未於二十日內獲受理調查之通知，經促請辦理後於十日內仍未獲回應，而具名向下列人員或法人揭弊者，自其向受理揭弊機關揭弊時起，依本法規定保護：\n一、中央或地方民意代表。\n二、具公司登記之媒體業者。\n三、具法人登記之民間公益團體。\n揭弊者經受理揭弊機關受理調查後為查無實據之結案通知後，再向前項人員或法人揭弊者，以該案另經起訴、裁定交付審判、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰者為限，依本法規定保護之。\n前二項之揭弊內容，不適用第十二條規定。\n第一項受理揭弊之機關，以所設於我國者為限。","note":"明定公部門層級以外之受理揭弊機關，包含中央及地方民意代表、具公司登記之媒體業者及法人登記之民間公益團體，揭弊者向前述受理揭弊機關揭弊時起，適用本法規定之保護。"},{"bill":"202110025210000","text":"本法所稱揭弊者，指有事實合理相信存在第三條所定之弊案，具名向前條第一項受理揭弊機關檢舉或依第六條規定提出檢舉者。\n本法所稱揭弊者之密切關係人，指揭弊者之配偶、直系血親、三親等內旁系血親、二親等內姻親或家長、家屬、與其訂有婚約者或其他身分上或生活上有密切利害關係之人。","note":"一、就本法所稱揭弊者，係指有事實合理相信存在第三條所定之弊案，具名向前條第一項受理揭弊機關檢舉或依第六條規定提出檢舉者，爰於第一項予以明定。\n二、就本法所稱揭弊者之密切關係人，參酌證人保護法就密切利害關係之人之定義，爰於第二項明定為揭弊者之配偶、直系血親、三親等內旁系血親、二親等內姻親或家長、家屬、與其訂有婚約者或其他身分上或生活上有密切利害關係之人。"},{"bill":"202110033190000","text":"揭弊者向受理揭弊機關揭弊後，未於十日內獲受理調查之通知，經促請辦理後於十日內仍未獲回應，而具名向下列人員或法人揭弊者，自其向受理揭弊機關揭弊時起，依本法規定保護：\n一、中央或地方民意代表。\n二、具公司登記之媒體業者。\n三、具法人登記之民間公益團體。\n揭弊者經受理揭弊機關受理調查後為查無實據之結案通知後，再向前項人員或法人揭弊者，以該案另經起訴、裁定交付審判、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰者為限，依本法規定保護之。\n前二項之揭弊內容，不適用第十二條規定。\n第一項受理揭弊之機關，以所設於我國者為限。","note":"明定公部門層級以外之受理揭弊機關，包含中央及地方民意代表、具公司登記之媒體業者及法人登記之民間公益團體，揭弊者向前述受理揭弊機關揭弊時起，適用本法規定之保護。"},{"bill":"202110039800000","text":"本法所稱揭弊者如下：\n一、公部門揭弊者：指公務員或接受政府機關（構）僱用、定作、委任、派遣、承攬、特約或其他契約關係而提供勞務獲致報酬之相對人及其員工，有事實合理相信政府機關（構）或其員工、其他公務員涉有第三條所列之弊案，具名向前條第一項受理揭弊機關提出檢舉者。\n二、私部門揭弊者：指接受公司、獨資或合夥商號、非法人團體、財團法人或社團法人之僱用、定作、委任派遣、承攬、特約或其他契約關係而提供勞務獲致報酬之相對人及其員工，有事實合理相信任職或提供勞務對象之法人、團體、雇主或其關係企業、員工，涉有第三條第五款、第七款或第八款之弊案，具名向前條第一項之受理揭弊機關提出檢舉者。\n前項第一款所稱公務員，指政務官及各級民意代表以外，依法令從事於公務之人員。\n本法所稱政府機關（構），指中央與各級地方政府機關、行政法人、公立學校、公立醫療院所、公營事業、政府捐助之財團法人。","note":"一、本法所稱揭弊案件分為公部門即政府機關（構）內部人員揭弊與私部門內部人員揭弊。\n二、公部門揭弊方面，公務員採最廣義之公務員定義，即：\n(一)參考國家賠償法第二條第一項「依法令從事於公務之人員」之規定，故無論文武職、地方自治人員、編制內外、聘僱人員或臨時派用人員均屬之，至於是否受有俸給則不在所問。\n(二)惟於政府機關（構）內仍有非依法令從事公務而接觸並知悉政府機關（構）弊案內容之人員，包括因僱用、定作、委任、派遣、承攬、特約或其他契約關係而提供勞務給政府機關（構）之工作者或其受僱人、派遣人員等員工，亦有可能得知政府機關（構）之弊案，故此等人揭弊時亦應受保護。\n(三)又因各公務機關（構）間業務與人員往來頻繁，資訊互通，故公務員所揭弊之情事不限其任職機關（構），而包括所有政府機關（構）之弊案，屬廣義之內部人員揭弊，爰於第一項第一款明定公部門揭弊者之定義。\n三、私部門揭弊方面，考量第三條第一項第一款至第四款及第六款列舉之弊端法律處罰主體均以公務員為限，故就私部門人員可能涉犯之弊案範圍予以限縮。\n四、私部門之內部人員並不以具有勞務契約關係之民法上受僱人為限，尚包括因僱用、定作、委任、派遣、承攬、特約或其他契約關係而提供勞務之人。\n五、以「有事實合理相信」作為揭弊者揭弊時必須有一定之心證程度，始受本法保護。所謂「有事實合理相信」是指依其揭弊時之具體情狀，加以觀察、判斷、客觀上足使一般人產生合理懷疑，即為已足；易言之，一位無利害關係之旁觀者，在獲得與揭弊者相同之資訊下，亦會推斷出相同結論。且以具名為要件，如揭弊內容明顯虛偽或無具體內容，自不受保護。\n六、本法目的在鼓勵勇於揭弊，增進公共利益，故揭弊之動機，是否必須出於「善意」或以正當目的為保護要件，在所不問。\n七、參酌政務人員退職撫卹條例第二條規定，政務官係參與國家大政方針之決策並隨政黨選舉成敗或政策改變而進退之公務員，而各級民意代表則係經由選舉而產生，二者之職位與職務之保障均不同於一般事務官公務員，故不屬本法所稱公部門之揭弊者範疇，但仍為本法被揭弊之對象。\n八、另就本法所稱之「政府機關（構）」，除各級政府機關外，衡酌行政法人、公立學校、公立醫療院所、公營事業、政府捐助之財團法人，亦屬涉及公權力行使、公款運用或國家社會政策與公共福利之一環，爰於第三項明定本法所稱政府機關（構）範疇。至政府捐助之財團法人，指財團法人法第二條第二項、第三項規定之財團法人。"}],"changed":true,"final":"本法所稱揭弊者如下：\n一、公部門揭弊者：指公務員或接受政府機關（構）僱用、定作、委任、派遣、承攬、特約或其他契約關係而提供勞務獲致報酬之相對人及其員工，有事實合理相信政府機關（構）或其員工、其他公務員涉有第三條所列之弊案，具名向前條第一項受理揭弊機關提出檢舉者。\n二、國營事業、受政府控制之事業、團體或機構揭弊者：指接受國營事業、受政府控制之事業、團體或機構之派任、僱用、定作、委任、派遣、承攬、特約或其他契約關係而提供勞務獲致報酬之相對人及其員工，有事實合理相信任職或提供勞務對象之事業、團體或機構或其員工，涉有第三條第五款、第七款或第八款之弊案，具名向前條第一項之受理揭弊機關提出檢舉者。\n前項第一款所稱公務員，係指政務官及各級民意代表以外，依法令從事於公務之人員。\n本法所稱政府機關（構），係指中央與各級地方政府機關、行政法人、公立學校、公立醫療院所、公營事業、政府捐助之財團法人。\n本法所稱國營事業，係指國營事業管理法第三條所規定之事業。\n本法所稱受政府控制之事業、團體或機構，係指銓敘部公告之政府暨其所屬營業基金、非營業基金轉投資金額累計占該事業資本額百分之二十以上之轉投資或再轉投資事業、受政府直接或間接控制其人事、財務或業務之轉投資或再轉投資事業、團體或機構。\n前項事業、團體或機構之揭弊，限於弊案原因發生時屬於公告所列之事業、團體或機構。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"保留，送院會處理","text":""}},{"no":"第六條","current":null,"versions":[{"bill":"202110005890000","text":"揭弊者向受理揭弊機關揭弊後，未於二十日內獲受理調查之通知，經促請辦理後於十日內仍未獲回應，而向下列人員或法人揭弊者，自其向原受理揭弊機關揭弊時起，依本法規定保護：\n一、中央或地方民意代表。\n二、具公司登記之媒體業者。\n三、具法人登記之民間公益團體。\n揭弊者經受理揭弊機關受理調查後為查無實據之結案通知後，再向前項人員或法人揭弊者，以該案另經起訴、裁定交付審判、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰者為限，依本法規定保護之。\n前二項之揭弊內容，不適用第十二條規定。","note":"一、向民意代表、媒體業與民間公益團體揭弊，固亦有預防或減少國家與社會損失之效果，然因此等機關（構）人員並無行政或犯罪調查權，如揭弊內容不實所造成之企業與社會衝擊甚大，故將此三者列為第二層之受理揭弊對象，以求一均衡點，爰訂定第一項。\n二、揭弊者應先向有權調查之第一層受理揭弊機關具名提出揭弊，經第一層受理揭弊機關於一定期限內未予回應受理案件通知，或查無實據結案後，始例外得向第二層之人員與機關（構）提出揭弊，而受本法保護。揭弊者依第一項規定對於未獲回應之案件，復向第二層機關進行外部揭弊時，自其初始向第一層受理揭弊機關提出揭弊時起，即受本法規定保護之。\n三、若揭弊者未符合第一項、第二項規定，先向第二層揭弊，或同時向第一層及第二層之人員與機關（構）揭弊，或在第一層受理揭弊機關依法調查期間，復向第二層或其他人洩漏揭弊內容，均不受本法保護。但同時向同一層之不同機關（構）揭弊者則仍受保護。\n四、若揭弊案件業經第一層之受理揭弊機關為查無實據之結論，則應課以揭弊者更高之揭弊保護要件，在第二層揭弊之情形下，應以該揭弊案件最終獲有具體結果者為限，以提高本法保護之門檻，爰於第二項明定以案件獲有起訴、裁定交付審判、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰等具體客觀不法或違規情事者，受本法保護之。\n五、考量國家機密涉及之國安因素與揭弊者言論免責權之衡平，仍應課予揭弊者就涉及國家機密事項時應注意保密之規範，爰為第三項之規定。"},{"bill":"202110006520000","text":"受理揭弊機關對揭弊內容，應依法於職權範圍內為必要之調查。\n為進行前項調查，除犯罪應依刑事訴訟或其他法律所定之訴訟程序追訴處罰外，得請求相關機關（構）、法人或團體、個人提供必要之文書、資料或物品，並得以書面通知相關之人陳述意見。\n受理揭弊機關應將案件之受理、調查過程、調查結果及相關文件製作紀錄。\n受理揭弊機關應於調查終結後，將結果通知揭弊者。","note":"明定受理揭弊機關對於揭弊內容之程序。"},{"bill":"202110013980000","text":"揭弊者向受理揭弊機關揭弊後，未於二十日內獲受理調查之通知，經促請辦理後於十日內仍未獲回應，而向下列人員或法人揭弊者，自其向原受理揭弊機關揭弊時起，依本法規定保護：\n一、中央或地方民意代表。\n二、具公司登記之媒體業者。\n三、具法人登記之民間公益團體。\n揭弊者經原受理揭弊機關受理調查後六個月內未獲調查結果之通知，經促請辦理後於十日內仍未獲回應，得具名向前項人員或法人揭弊，自其向原受理揭弊機關揭弊時起，依本法規定保護。\n揭弊者經原受理揭弊機關受理調查後為查無實據之結案通知後，再向第一項人員或法人揭弊者，以該案另經起訴、緩起訴、裁定交付審判、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰者為限，依本法規定保護之。\n前三項之揭弊內容，不適用第十九條前段之規定。","note":"一、向民意代表、媒體業者與民間公益團體爆料，固亦有預防或減少國家與社會損失之效果，然因此等機關（構）人員並無行政或犯罪調查權，如揭弊內容不實所造成之企業與社會衝擊亦甚鉅大，故將此三者列為第二層之受理揭弊對象，以求一均衡點，爰訂定第一項。\n二、揭弊者應先向有權調查之受理揭弊機關具名提出揭弊，經受理揭弊機關於一定期限內未予回應受理案件通知，或查無實據結案後，始例外得向特定外部之人員與機關（構）提出揭弊，而受本法保護。揭弊者依第一項規定對於未獲回應之案件，復向特定外部機關進行外部揭弊時，自其初始向受理揭弊機關提出揭弊時起，即受本法規定保護之。\n三、若揭弊者未符合第一項、第二項規定之程序，先向特定外部揭弊，或同時向受理揭弊機關及特定外部之人員與機關（構）揭弊，或在受理揭弊機關依法調查期間，復向特定外部之人員與機關（構）或其他人洩漏揭弊內容，均不受本法保護。但同時向第一項各款之不同機關（構）揭弊者則仍受保護。\n四、為避免受理揭弊機關受理後案件久懸未結，致揭弊者無從得知案件調查之情形，有規定受理揭弊機關應於一定期限內為調查結果通知之必要。另考量本法弊端項目類型繁多，調查期限不宜過短，爰於第二項規範六個月之辦案期限。\n五、若揭弊案件業經受理揭弊機關為查無實據之結論，則應課以揭弊者更高之揭弊保護要件，在外部揭弊之情形下，應以該揭弊案件最終獲有具體結果者為限，以提高本法保護之門檻，爰於第三項明定以案件獲有起訴、緩起訴、裁定交付審判、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰等具體客觀不法或違規情事者，受本法保護之。\n六、考量國家機密涉及之國安因素與揭弊者言論免責權之衡平，仍應課予揭弊者就涉及國家機密事項時應注意保密之規範。本條之揭弊若涉及國家機密、營業秘密或其他依法應保密事項者，揭弊者須自行過濾資料，就可能涉及秘密事項之內容予以隱匿、遮掩或其他適當方式避免洩漏，例如就涉案人員、機密案件或營業機密等足以辨識確實的對象或具體的內容以代號為之，否則須負洩密責任，不適用第十九條前段之洩密免責保護，但揭弊者為揭弊行為前、後，向律師徵詢法律意見者，仍得依本法第十九條後段保護之，而律師應依刑法第三百十六條、律師法第三十二條第二項、第五十條之一規定就其因業務知悉之秘密，應予保密，爰為第四項之規定。"},{"bill":"202110014070000","text":"政府機關（構）、法人或團體、個人，不得因第六條第一項所列公務員或從事工作獲致報酬之內部人員有下列行為，而意圖報復對其採行不利之人事措施：\n一、揭發第三條所列揭弊事由之弊案（下稱弊案）。\n二、配合弊案之調查或擔任證人。\n三、拒絕參與弊案之決定或實施。\n四、因前三款之作為而遭受不利人事措施後，依法提起救濟。\n前項所稱不利之人事措施，指下列情形之一：\n一、解職、撤職、免職、停職、解約、降調，或不利之考績、懲處、懲罰及評定。\n二、減薪（俸）、罰款、剝奪或減少獎金、退休（職、伍）金。\n三、與陞遷有關之教育或訓練機會、福利、特殊權利之剝奪。\n四、工作地點、職務內容或其他工作條件、管理措施之不利變更。\n五、無故揭露揭弊者之身分。\n前項所定不利人事措施之爭議，應先由受不利人事措施之內部人員證明下列情事：\n一、有前條第一項各款之行為。\n二、有遭受前條第二項之不利人事措施。\n三、第一款行為之發生時間在前款不利人事措施之前。\n內部人員為前項證明後，該等人事措施推定為有違反前條第一項規定。但任職之政府機關（構）、法人、團體或其主管、雇主證明縱無該等行為，其於當時仍有正當理由採相同之人事措施者，不在此限。\n政府機關（構）、法人或團體、個人，不得訂定禁止內部人員為第一項第一款至第四款行為之約定；如有訂定，該約定視為無效。","note":"一、明定禁止對揭弊者採行不當措施。為避免政府機關、法人或團體、個人因有第一項所明定之行為而受到不利待遇，且實務中懲戒報復行為主要以剝奪影響揭弊者之工作權益居多，爰於第二項明定各款不得對揭弊者採行之不利人事措施。\n二、為使本法有效保護揭弊者、避免揭弊保護遭濫用，爰於第四項規定保護之排除，即政府機關（構）、法人、團體或其主管、雇主證明該揭發情事無該等行為，其餘當時仍有正當理由採相同之人事措施者，不在此限。\n三、基於對等誠信、善良風俗之契約精神，爰於第五項明定政府機關（構）、法人或團體、個人，不得訂定禁止內部人員為第一項第一款至第四項行為之約定；如有訂定，該約定則無效。"},{"bill":"202110025210000","text":"揭弊者向受理揭弊機關揭弊後，未於二十日內獲受理調查之通知，經促請辦理後於十日內仍未獲回應，而具名向下列人員或法人揭弊者，自其向原受理揭弊機關揭弊時起，受本法之保護：\n一、中央或地方民意代表。\n二、具公司登記之媒體業者。\n三、具法人登記之民間公益團體。\n揭弊者向受理揭弊機關揭弊後，六個月內未獲調查結果之通知，經促請辦理後於十日內仍未獲回應，得具名向前項人員或法人揭弊，自其向原受理揭弊機關揭弊時起，受本法之保護。\n揭弊者未依第四條規定揭弊，而先向第一項人員或法人揭弊，第一項人員或法人受理後，應於十日內轉由受理揭弊機關辦理，經調查後發現揭弊屬實者，自其向第一項人員或法人揭弊時起，受本法之保護。\n揭弊者向受理揭弊機關揭弊後，經通知為查無實據而予結案，再向第一項人員或法人揭弊者，以該案後經起訴、緩起訴、裁定交付審判、懲戒、懲處、懲罰、彈劾、糾正、糾舉或課予罰鍰者為限，始受本法之保護。","note":"一、為實現本法之立法目的，受理揭弊機關於受理案件後，應於二十日內回覆揭弊者已受理調查之通知。若揭弊者未獲通知，則可於十日內再促請受理揭弊機關辦理，若於十日內仍未獲回應，揭弊者則可向第二層受理揭弊機關進行揭弊，爰於第一項明定。\n二、揭弊者向受理揭弊機關揭弊後，如六個月內未獲調查結果之通知，經促請辦理後於十日內仍未獲回應，則此時揭弊者得具名向第二層受理揭弊機關進行揭弊，並自其向原受理揭弊機關揭弊時起，受本法之保護，爰於第二項明定。\n三、揭弊者若未依第四條規定揭弊，而先向第二層受理揭弊機關進行揭弊，該人員或法人受理後，應於十日內轉由受理揭弊機關辦理，經調查後發現揭弊屬實者，自其向第一項人員或法人揭弊時起，受本法之保護，爰於第三項明定。\n四、揭弊者若經第一層之受理揭弊機關通知為查無實據而予結案，其若再向第二層受理揭弊機關進行揭弊，則應課以揭弊者更高之揭弊保護要件，此時應以該案後經起訴、緩起訴、裁定交付審判、懲戒、懲處、懲罰、彈劾、糾正、糾舉或課予罰鍰者為限，始受本法之保護，爰於第四項明定。"},{"bill":"202110033190000","text":"政府機關（構）、法人或團體、個人，不得因第六條第一項所列公務員或從事工作獲致報酬之內部人員有下列行為，而意圖報復對其採行不利之人事措施：\n一、揭發第三條所列揭弊事由之弊案（下稱弊案）。\n二、配合弊案之調查或擔任證人。\n三、拒絕參與弊案之決定或實施。\n四、因前三款之作為而遭受不利人事措施後，依法提起救濟。\n前項所稱不利之人事措施，指下列情形之一：\n一、解職、撤職、免職、停職、解約、降調，或不利之考績、懲處、懲罰及評定。\n二、減薪（俸）、罰款、剝奪或減少獎金、退休（職、伍）金。\n三、與陞遷有關之教育或訓練機會、福利、特殊權利之剝奪。\n四、工作地點、職務內容或其他工作條件、管理措施之不利變更。\n五、無故揭露揭弊者之身分。\n前項所定不利人事措施之爭議，應先由受不利人事措施之內部人員證明下列情事：\n一、有前條第一項各款之行為。\n二、有遭受前條第二項之不利人事措施。\n三、第一款行為之發生時間在前款不利人事措施之前。\n內部人員為前項證明後，該等人事措施推定為有違反前條第一項規定。但任職之政府機關（構）、法人、團體或其主管、雇主證明縱無該等行為，其於當時仍有正當理由採相同之人事措施者，不在此限。\n政府機關（構）、法人或團體、個人，不得訂定禁止內部人員為第一項第一款至第四款行為之約定；如有訂定，該約定視為無效。","note":"一、明定禁止對揭弊者採行不當措施。為避免政府機關、法人或團體、個人因有第一項所明定之行為而受到不利待遇，且實務中懲戒報復行為主要以剝奪影響揭弊者之工作權益居多，爰於第二項明定各款不得對揭弊者採行之不利人事措施。\n二、為使本法有效保護揭弊者、避免揭弊保護遭濫用，爰於第四項規定保護之排除，即政府機關（構）、法人、團體或其主管、雇主證明該揭發情事無該等行為，其餘當時仍有正當理由採相同之人事措施者，不在此限。\n三、基於對等誠信、善良風俗之契約精神，爰於第五項明定政府機關（構）、法人或團體、個人，不得訂定禁止內部人員為第一項第一款至第四項行為之約定；如有訂定，該約定則無效。"},{"bill":"202110039800000","text":"揭弊者向受理揭弊機關揭弊後，未於二十日內獲受理調查之通知，經促請辦理後於十日內仍未獲回應，得再具名向下列人員或法人揭弊，自其向原受理揭弊機關揭弊時起，依本法規定保護之：\n一、中央或地方民意代表。\n二、具公司登記之媒體業者。\n三、具法人登記之公益團體。\n揭弊者向受理揭弊機關揭弊後，六個月內未獲調查結果之通知，經促請辦理後於十日內仍未獲回應，得再具名向前項人員或法人揭弊，自其向原受理揭弊機關揭弊時起，受本法之保護。\n揭弊者未依第四條規定揭弊，而先向第一項人員或法人揭弊，第一項人員或法人受理後，應於十日內轉由受理揭弊機關辦理，經調查後發現揭弊屬實者，自其向第一項人員或法人揭弊時起，受本法之保護。\n揭弊者經原受理揭弊機關受理調查為查無實據之結案通知後，再向前項人員或法人揭弊者，以該案另經起訴、緩起訴、職權不起訴、聲請簡易判決處刑、裁定准予自訴、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰者為限，依本法規定保護之。\n前項之揭弊內容，不適用第十二條前段規定。","note":"一、為落實本法追查重大公益危害案件之目的，前條受理揭弊之單位是否展開調查及後續查明之處置，關乎揭弊機制之有效運作，爰規定揭弊者應先依本法前條向有權調查之第一層受理揭弊機關（構）具名提出揭弊，受理揭弊機關於受理案件後，並應於二十日內回覆揭弊者已受理調查之通知。若揭弊者未獲通知，則可於十日內再促請受理揭弊機關辦理，若於十日內仍未獲回應，揭弊者則可向本條第一項所列第二層受理揭弊機關進行揭弊。\n二、向民意代表、媒體業者與公益團體爆料，固亦有預防或減少國家與社會損失之效果，然因該等單位並無行政或犯罪調查權，如揭弊內容不實，將對被揭弊之機關（構）、企業，甚或社會造成傷害，故將此三者列為第二層之受理揭弊對象，以求平衡。\n三、揭弊者向受理揭弊機關（構）揭弊後，如六個月內未獲調查結果之通知，為免久懸未決，經促請辦理後於十日內仍未獲回應，則此時揭弊者得具名向第二層受理揭弊機關（構）進行揭弊，並自其向原受理揭弊機關揭弊時起，受本法之保護，爰為第二項規定。\n四、為考量形塑公益揭弊風氣之同時，民眾可能未依第四條規定之第一層受理機關揭弊，而誤先向第二層受理揭弊機關進行揭弊，則相關人員或法人於受理後，應於十日內轉由第四條之受理揭弊機關辦理，經調查後發現揭弊屬實者，自其向本條第一項人員或法人揭弊時起，受本法之保護，爰為第三項規定。\n五、若揭弊案件業經第一層之受理揭弊機關（構）為查無實據之結論，則揭弊者再向第二層揭弊時，應課予揭弊者更高之心證門檻，改採客觀說，以該案終獲起訴、緩起訴、職權不起訴、聲請簡易判決處刑、裁定准予自訴、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰者為限，始受本法保護，爰為第四項規定。考量國家機密涉及之國安因素與揭弊者言論免責權之衡平，仍應課予揭弊者就涉及國家機密事項時應注意保密之規範。本條之揭弊若涉及國家機密、營業秘密或其他依法應保密事項者，揭弊者須自行過濾資料，就可能涉及秘密事項之內容予以隱匿、遮掩或其他適當方式避免洩漏，例如就涉案人員、機密案件或營業機密等足以辨識確實之對象或具體之內容以代號為之，否則須負洩密責任，不適用第十二條前段之洩密免責保護，但揭弊者為揭弊行為前、後，向律師徵詢法律意見者，仍得依第十二條後段保護之，而律師應依刑法第三百十六條、律師法第三十六條、第一百三十條規定就其因業務知悉之秘密，應予保密，併此敘明。"}],"changed":true,"final":"揭弊者向受理揭弊機關揭弊後，未於二十日內獲受理調查之通知，經促請辦理後於十日內仍未獲回應，得再具名向下列人員或法人揭弊，自其向原受理揭弊機關揭弊時起，依本法規定保護之：\n一、中央或地方民意代表。\n二、具公司登記之媒體業者。\n三、具法人登記之公益團體。\n揭弊者向受理揭弊機關揭弊後，六個月內未獲調查結果之通知，經促請辦理後於十日內仍未獲回應，得再具名向前項人員或法人揭弊，自其向原受理揭弊機關揭弊時起，受本法之保護。\n揭弊者未依第四條規定揭弊，而先向第一項人員或法人揭弊，第一項人員或法人受理後，應於十日內轉由受理揭弊機關辦理，經調查後發現揭弊屬實者，自其向第一項人員或法人揭弊時起，受本法之保護。\n揭弊者經原受理揭弊機關受理調查為查無實據之結案通知後，再向前項人員或法人揭弊者，以該案另經起訴、緩起訴、職權不起訴、聲請簡易判決處刑、裁定准予自訴、懲戒、懲處、懲罰、彈劾、糾正、糾舉或行政罰鍰者為限，依本法規定保護之。","finalWhy":"一、為實現本法之立法目的，受理揭弊機關於受理案件後，應於二十日內回覆揭弊者已受理調查之通知。若揭弊者未獲通知，則可於十日內再促請受理揭弊機關辦理，若於十日內仍未獲回應，揭弊者則可向第二層受理揭弊機關進行揭弊，爰於第一項明定。\n二、揭弊者向受理揭弊機關揭弊後，如六個月內未獲調查結果之通知，經促請辦理後於十日內仍未獲回應，則此時揭弊者得具名向第二層受理揭弊機關進行揭弊，並自其向原受理揭弊機關揭弊時起，受本法之保護，爰於第二項明定。\n三、揭弊者若未依第四條規定揭弊，而先向第二層受理揭弊機關進行揭弊，該人員或法人受理後，應於十日內轉由受理揭弊機關辦理，經調查後發現揭弊屬實者，自其向第一項人員或法人揭弊時起，受本法之保護，爰於第三項明定。\n四、揭弊者若經第一層之受理揭弊機關通知為查無實據而予結案，其若再向第二層受理揭弊機關進行揭弊，則應課以揭弊者更高之揭弊保護要件，此時應以該案後經起訴、緩起訴、職權不起訴、聲請簡易判決處刑、裁定准予自訴、懲戒、懲處、懲罰、彈劾、糾正、糾舉或課予罰鍰者為限，始受本法之保護，爰於第四項明定。","review":{"note":"保留，送院會處理","text":""}},{"no":"第七條","current":null,"versions":[{"bill":"202110005890000","text":"政府機關（構）、法人或團體、個人，不得因第五條第一項所列公務員或從事工作獲致報酬之人（下稱內部人員）有下列行為，而意圖報復對其採行不利之人事措施：\n一、揭發第三條所列揭弊事由之弊案。\n二、配合弊案之調查或擔任證人。\n三、拒絕參與弊案之決定或實施。\n四、因前三款之作為而遭受不利人事措施後，依法提起救濟。\n前項所稱不利之人事措施，指下列情形之一：\n一、解職、撤職、免職、停職、解約、降調，或不利之考績、懲處、懲罰及評定。\n二、減薪（俸）、罰款、剝奪或減少獎金、退休（職、伍）金。\n三、與陞遷有關之教育或訓練機會、福利、特殊權利之剝奪。\n四、工作地點、職務內容或其他工作條件、管理措施之不利變更。\n五、無故揭露揭弊者之身分。\n因第一項各款行為而受不利人事措施之內部人員得為下列請求：\n一、回復其受不利人事措施前之職位及職務；其原職位已補缺或經裁撤者，回復至相當之職位及職務。\n二、回復其原有之年資、特殊權利、獎金、退休（職、伍）金、福利、工作條件及管理措施。\n三、受人事不利措施期間俸（薪）給或工資之補發，及財產上損害之賠償。\n四、受有身體、健康、名譽、自由、信用、隱私，或其他人格法益之侵害者，雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項第三款所定財產上損害之賠償，包括俸（薪）給或工資以外其他期待利益之合理估算金額，及遭受不利人事措施後依法提起救濟所合理支出之必要費用。\n訂有禁止內部人員為第一項第一款至第四款行為之約定者，其約定無效。","note":"一、第一項所稱個人，包含第五條第一項第一款列舉政府機關（構）之員工、其他公務員及同條項第二款所稱任職或提供勞務對象之雇主或其員工；所稱從事工作獲致報酬之內部人員，包含第五條第一項各款所稱接受政府機關（構）僱用、委任及接受公司、獨資或合夥商號、非法人團體、財團法人或社團法人之僱用、委任之人。\n二、第二項明訂前項所稱不利人事措施，分別規定第一款係對內部人員為解職、撤職、免職、停職、解約、降調、不利於其身分、官職等級之人事行政行為。依公務員懲戒法或法官法所為具司法懲戒性質之撤職、免職等懲戒決定均不在本項規範之範圍內；第二款係對俸給薪資、獎金、退休（職、伍）金之處分；第三款指受訓機會、福利或特殊權利之剝奪，如專用辦公室、電梯、停車位、貴賓室使用、免簽到簽退等職場上之特別禮遇或權限。第四款所稱工作條件、管理措施不利變更等情形，包括剝奪其原有接觸特殊資訊之權限、特殊會議之出席及輔助人員之提供等工作上之支援與後勤；另考量現行職場霸凌對員工之實質影響甚大，爰對於故意揭露揭弊者身分而排擠或孤立（含採行報復性調查）之行為，一併列入不利人事措施之範疇，為第五款之規定。\n三、為有效落實內部人員工作權之保障，就內部人員因第一項各款行為受有不利人事措施而為救濟時，賦予一獨立之請求權，內部人員得據以請求回復原狀及損害賠償，含財產上及非財產上之損害賠償，爰於第三項第一款至第三款明定回復原有工作權益狀態、工資補發及財產上損害賠償；另參酌民法第一百九十五條規定，明定第四款針對非財產上損害亦得請求賠償。\n另因本法保護對象涵蓋公、私部門人員，依其身分就相關請求權之行使，本即得分別歸類為公法上或私法上請求權性質，本項就內部人員所得請求之法律效果未予分列，故依照各款請求權性質應依個別事件性質續行認定屬公法或私法性質之請求權類型。\n四、具公務員身分之內部人員為第三項請求權時，因涉及現有公務員保障制度，其損害賠償請求權之行使應依本法第九條第二項時效之規定為之，始得適用第八條舉證責任分配原則及第九條第一項揭弊抗辯優先調查之規定，如內部人員依民法、國家賠償法或其他法律行使請求權，自不受第九條第二項短期時效之限制，亦不得援引前開第八條及第九條第一項之規定。\n五、第四項所稱期待利益，包含揭弊者依一般經驗，可得期待領取之加班費與績效獎金、年終獎金等經常性給與等期待利益之損失，惟此等報酬原應有勞務之實際支出始得支領，故僅能用估算方式計算之；所稱合理支出之必要費用，包含對於人事行政行為救濟程序所合理支出之必要程序費、交通費、差旅費、律師費等。\n第三項第四款所稱非財產上之損害包含身體、健康、名譽、自由、信用、隱私上之損害，及被同事孤立、歧視之精神上痛苦（屬其他人格法益）等損害。\n六、第五項所稱訂有禁止揭弊條款者，該約定無效，係指該禁止揭弊條款之部分無效，而非派令、協議、契約全部無效，參酌民法第一百十一條但書，為第五項之規定。\n七、參酌公務人員任用法第二十八條第三項規定，揭弊者於遭受不利人事措施期間所為之職務行為，不因其原受不利人事措施救濟成功而失其效力。"},{"bill":"202110006520000","text":"揭弊者或其關係人所屬機關（構）或其上級機關（構）、法人或團體、個人不得無正當理由，而對揭弊者或其關係人為第二條第三款之不當措施。","note":"明定對於揭弊者或其關係人不得為不當措施。"},{"bill":"202110013980000","text":"揭弊者得備妥相關事證，以書面、電磁紀錄、或言詞之方式，具名向受理揭弊機關揭弊，亦得委任律師代為之。\n揭弊者以言詞方式通報，得獨自或經由委任之律師陪同至主管機關進行陳述，再由主管機關作成紀錄並經揭弊者簽名確認。","note":"本法所規定之通報方式得以多管道為之，不以書面為限，亦納入電磁紀錄與言詞方式。不僅配合現有法制、符合社會溝通模式，且不因狹義的形式程序要求，排除可能之揭弊事由。又得以具名之方式通報，以鼓勵揭弊者於知悉違法情事時，勇於揭弊以維護社會公共利益與公共安全。"},{"bill":"202110014070000","text":"因前條第一項各款行為而受不利人事措施之內部人員得為下列請求：\n一、回復其受不利人事措施前之職位及職務；其原職位已補缺或經裁撤者，回復至相當之職位及職務。\n二、回復其原有之年資、特殊權利、獎金、退休（職、伍）金、福利、工作條件及管理措施。\n三、受人事不利措施期間俸（薪）給或工資之補發，及財產上損害之賠償。\n四、受有身體、健康、名譽、自由、信用、隱私，或其他人格法益之侵害者，雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項第三款所定財產上損害之賠償，包括俸（薪）給或工資以外其他期待利益之合理估算金額，及遭受不利人事措施後依法提起救濟所合理支出之必要費用。","note":"揭弊者遇有不利人事措施之救濟，得請求事項包含：回復其受不利人事措施前之職位及職務；回復其原有之年資、獎金、退休金、福利等工作條件及管理措施；補發不利措施期間之工資、財產損害之賠償；人格法益損害賠償等。"},{"bill":"202110025210000","text":"政府機關（構）、法人或團體、個人，不得因揭弊者有下列行為，而對其採行不利之措施：\n一、揭發弊案。\n二、配合弊案之調查或擔任證人。\n三、拒絕參與弊案之決定或實施。\n四、因前三款之作為而遭受不利措施後，依法提起救濟。\n前項所稱不利措施，指下列情形之一：\n一、解職、撤職、免職、停職、解約、降調、移送懲戒，或不利之考績、懲處、懲罰及評定。\n二、減薪（俸）、罰款、剝奪或減少獎金、退休（職、伍）金。\n三、與陞遷有關之教育或訓練機會、福利、特殊權利之剝奪。\n四、工作地點、職務內容或其他工作條件、管理措施之不利變更。\n五、非依法令規定揭露揭弊者之身分。\n因第一項各款行為而受不利措施之揭弊者，得為下列請求：\n一、回復其受不利措施前之職位及職務；其原職位已補缺或經裁撤者，回復至相當之職位及職務。\n二、回復其原有之年資、特殊權利、獎金、退休（職、伍）金、福利、工作條件及管理措施。\n三、受不利措施期間俸（薪）給或工資之補發，以及包括其他期待利益在內之財產上損害賠償。\n四、受有身體、健康、名譽、自由、信用、隱私，或其他人格法益之侵害者，雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求為回復名譽之適當處分。\n揭弊者因受不利措施，有依法提起救濟之必要，或為第三項所定之請求而提起訴訟者，揭弊者得請求給付其所合理支出之費用及律師酬金。\n前二項請求權之行使，不妨礙揭弊者依民法或其他法律所得行使之權利。\n訂有禁止揭弊者為第一項各款行為之約定，或限制揭弊者依第三項、第四項為請求之權利者，其約定無效。","note":"一、為保障揭弊者不因其揭弊行為而招致報復並導致權益受損，明定政府機關（構）、法人或團體、個人不得因揭弊者之揭弊行為，而對其採取不利之措施，爰於第一項明定。\n二、就第一項所稱不利措施，爰於第二項予以明定。\n三、就因揭弊行為而遭不利措施之揭弊者，明文賦予其獨立之請求權，得據以請求回復原狀及財產上與非財產上之損害賠償，爰於第三項明定。\n四、揭弊者因受不利措施，有依法提起救濟之必要，或為第三項所定之請求而提起訴訟者，其所因而支出之合理費用及律師酬金，自得一併請求給付，方足以充分保障其權益，爰於第四項明定。\n五、本條第三項、第四項所定之請求權，在於提供揭弊者必要之保護。若依民法或其他法律，揭弊者另有得行使之權利，自無排除揭弊者主張行使該權利之理由。\n六、在契約中訂有禁止揭弊者為揭弊行為，或限制揭弊者依第三項、第四項提出請求之權利者，其約定本應無效，始得有效保障揭弊者之權益，爰於第五項明定。"},{"bill":"202110033190000","text":"因前條第一項各款行為而受不利人事措施之內部人員得為下列請求：\n一、回復其受不利人事措施前之職位及職務；其原職位已補缺或經裁撤者，回復至相當之職位及職務。\n二、回復其原有之年資、特殊權利、獎金、退休（職、伍）金、福利、工作條件及管理措施。\n三、受人事不利措施期間俸（薪）給或工資之補發，及財產上損害之賠償。\n四、受有身體、健康、名譽、自由、信用、隱私，或其他人格法益之侵害者，雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項第三款所定財產上損害之賠償，包括俸（薪）給或工資以外其他期待利益之合理估算金額，及遭受不利人事措施後依法提起救濟所合理支出之必要費用。","note":"揭弊者遇有不利人事措施之救濟，得請求事項包含：回復其受不利人事措施前之職位及職務；回復其原有之年資、獎金、退休金、福利等工作條件及管理措施；補發不利措施期間之工資、財產損害之賠償；人格法益損害賠償等。"},{"bill":"202110039800000","text":"政府機關（構）、法人、團體或個人，不得因第五條第一項第一款、第二款所示提供勞務獲致報酬之人有下列行為，而意圖報復對其採行不利之措施：\n一、揭發第三條所列弊案。\n二、配合弊案之調查或擔任證人。\n三、拒絕參與弊案之決定或實施。\n四、因前三款之作為而遭受不利措施後，依法提起救濟。\n前項所稱不利措施，指下列情形之一：\n一、解職、撤職、免職、停職、解約、降調，或不利之考績、懲處、懲罰及評定。\n二、減薪（俸）、罰款（薪）、剝奪或減少獎金、退休（職、伍）金。\n三、與陞遷有關之教育或訓練機會、福利、特殊權利之剝奪。\n四、工作地點、職務內容或其他工作條件、管理措施之不利變更。\n五、非依法令規定揭露揭弊者之身分。\n因第一項各款行為而受不利措施者，得為下列請求：\n一、回復其受不利措施前之職位及職務；其原職位已補缺或經裁撤者，回復至相當之職位及職務。\n二、回復其原有之年資、特殊權利、獎金、退休（職、伍）金、福利、工作條件及管理措施。\n三、受不利措施期間俸（薪）給或工資之補發，及財產上損害之賠償。\n四、受有身體、健康、名譽、自由、信用、隱私，或其他人格法益之侵害者，雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項第三款所定財產上損害之賠償，包括俸（薪）給或工資以外其他期待利益之合理估算金額，及遭受不利措施後，依法提起救濟所合理支出之必要費用。\n第三項所定不利措施之爭議，應先由受不利措施之人證明下列情事：\n一、有第一項各款之行為。\n二、有遭受第二項之不利措施。\n三、第一款行為之發生時間在第二款不利措施之前。\n受不利措施之人為前項證明後，定為有違反前條第一項規定。但任職之政府機關（構）、法人、團體或其主管、雇主證明縱無該等行為，其於當時仍有正當理由採相同之人事措施者，不在此限。\n政府機關（構）、法人或團體、個人，不得訂有禁止內部人員為第一項各款行為之約定；如有訂定，該約定無效。","note":"一、本條保護之作為，不限於「揭弊」本身，尚及於配合調查或擔任證人，以及弊案發生時不願意同流合污者，爰參酌水污染防治法第三十九條之一第一項，將配合調查之人、證人、不願同流合污之人及揭弊者因遭受不利措施提起救濟後，二度遭受不利措施者亦受保護，惟僅限於本條之工作權益，並不包括其他條文所定之保護。\n二、本法提供之工作權保障，屬事後救濟之損害補償，須待第一項各款行為人因揭弊行為受不利措施，致生損害結果時，方得依其原有身分關係請求救濟。\n三、第二項明定第一項所稱之不利措施具體內容。其中第四款所稱工作條件、管理措施之不利變更，包括剝奪其原有接觸特殊資訊之權限、特殊會議之出席及輔助人員之提供等工作上之支援與後勤；另考量現行職場霸凌對員工之實質影響甚大，爰對於故意揭露揭弊者身分而排擠或孤立之行為，一併列入不利措施之範疇，爰為第五款規定。\n四、為有效落實工作權之保障，就因第一項各款行為受有第二項之不利措施而為救濟時，賦予獨立之請求權，得據以請求回復原狀及損害賠償，包含財產上及非財產上之損害賠償，爰為第三項規定。\n五、第四項所稱期待利益，包含遭不利措施者依一般經驗，可得期待領取之加班費、績效獎金或年終獎金等經常性給與之損失，惟此等報酬原應有勞務之實際支出始得支領，故僅能用估算方式計算之；所稱合理支出之必要費用，包含救濟程序所合理支出之交通費及律師費等。\n六、第五項、第六項就舉證責任之分配，乃參考水污染防治法第三十九條之一第三項，由政府機關（構）、法人、團體或其主管、雇主對於所為不利處分與第一項規定行為無關之事實，負舉證責任。且舉證責任分配於司法訴訟程序及行政救濟階段均有適用。\n七、為免揭弊保護遭濫用，爰於第六項但書規定保護之排除，即政府機關（構）、法人、團體或其主管、雇主證明該揭發情事無該等行為，其餘當時仍有正當理由採相同之措施者，不在此限。又所謂「當時」，係指採取不利措施當時之考量因素，不含事後新發生之因素。\n八、本於誠信原則，並參酌民法第一百十一條但書，為第七項規定。所稱訂有禁止揭弊條款者，該約定無效，係指該禁止揭弊條款之部分無效，而非契約全部無效，併此敘明。"}],"changed":true,"final":"受理揭弊機關對揭弊事由應為調查，並得要求揭弊者、涉嫌事業單位或機關（構）等關係人提供相關事證配合調查，涉案關係人非有正當理由不得拒絕。\n受理揭弊機關基於證據保全，於法院判決前，得向法院聲請扣押，準用刑事訴訟法第一百三十三條之規定。","finalWhy":"一、受理揭弊機關對受理揭弊之案件應對揭弊事由之內容調查。為使受理揭弊機關有效行使調查權，得要求揭弊者、涉嫌事業單位或機關（構）等關係人協助調查並提供事證資料，關係人非有正當理由不得拒絕。\n二、賦予受理揭弊機關於調查時，對於可為證據之物有即時保全之依據，準用刑事訴訟法第一百三十三條之規定。","review":null},{"no":"第八條","current":null,"versions":[{"bill":"202110005890000","text":"前條第二項所定不利人事措施之爭議，應先由受不利人事措施之內部人員證明下列情事：\n一、有前條第一項各款之行為。\n二、有遭受前條第二項之不利人事措施。\n三、第一款行為之發生時間在前款不利人事措施之前。\n內部人員為前項證明後，該等人事措施推定為有違反前條第一項規定。","note":"參酌水污染防治法第三十九條之一第三項就舉證責任轉換規定為雇主對於該不利處分與第一項規定行為無關之事實，負舉證責任。係對消極事實舉證，且欠缺受僱人之證明責任，爰參考美國立法例，採取積極之舉證責任分配，且不限於司法訴訟階段始有適用，揭弊者因不利人事措施提起行政救濟時，亦應依本條規定為舉證責任之分配，爰為第一項、第二項之規定。"},{"bill":"202110006520000","text":"揭弊者明知其揭弊事證不實或以獲取不正利益為目的者，不受本法之保護。","note":"明定揭弊事證不實者不受本法之保護。"},{"bill":"202110013980000","text":"受理揭弊機關對揭弊事由應為調查，並得要求揭弊者、涉嫌事業單位或機關（構）等關係人提供相關事證配合調查，涉案關係人非有正當理由不得拒絕。\n受理揭弊機關基於證據保全，於法院判決前，得向法院聲請扣押，準用刑事訴訟法第一百三十三條之規定。","note":"一、理揭弊機關對受理通報之案件，則應對揭弊事由之內容為調查。並為有效落實調查，主管機關得要求有關單位機關等案件關係人協助調查提供事證資料，但如被要求之有關單位機關有正當理由者，得拒絕主管機關之要求。\n二、賦予主管機關於調查時，對於可為證據之物得有即時保全之依據，準用刑事訴訟法第一百三十三條之扣押規定。"},{"bill":"202110014070000","text":"公務員於申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序中，主張其有第六條第一項各款之行為，而遭移送或受有不利人事措施者，應先於其他事證而為調查，並依調查結果而為成立或不成立之認定。\n具公務員身分之內部人員因受第六條第二項第一款至第四款不利人事措施所生同條第三項第三款及第四款之賠償請求權，自政府機關（構）依前項主張作成回復原狀、行政救濟為有理由之決定確定之日起；因第六條第二項第五款不利人事措施所生之賠償請求權，自知悉事實發生之日起，六個月間不行使而消滅。\n具公務員身分之內部人員主張其因有第六條第一項各款之行為而遭移送懲戒，經公務員懲戒委員會或職務法庭審理後，認定其依第一項之主張成立並為不受懲戒之判決確定者，亦得請求第六條第三項第三款及第四款之賠償，並準用前項時效之規定。\n前二項請求權之行使，不妨礙依民法、國家賠償法或其他法律所得行使之權利。","note":"一、考量公務員遭受不利之人事措施，其原先態樣已有懲戒（公務人員懲戒法、法官法）、懲處（公務人員考績法）、懲罰（陸海空軍懲罰法）與福利、特殊權利及與升遷有關之教育或訓練機會之剝奪；工作地點、職務內容或其他工作條件之不利變更，亦均具相對之救濟程序。\n二、爰明定具公務員身分揭弊者遇有不利人事措施之救濟措施，意指其依原有申訴程序將可以「揭弊」而非「因違法或不當行為」作為抗辯，使懲戒或懲處機關列入考量。\n三、有關請求權行使，不妨礙依民法、國家賠償法或其他適用法律所得行使之權利。"},{"bill":"202110025210000","text":"前條第二項所定不利措施之爭議，應先由受不利措施之揭弊者證明下列情事：\n一、有前條第一項各款之行為。\n二、有遭受前條第二項各款之不利措施。\n三、第一款行為之發生時間在前款不利措施之前。\n揭弊者為前項證明後，該等不利措施即推定為違反前條第一項規定。但揭弊者任職之政府機關（構）、法人、團體或其主管、雇主證明其當時乃係基於正當理由而採取該不利措施，與揭弊者前條第一項各款之行為無關者，不在此限。\n揭弊者為公務員，主張其係因有第七條第一項各款之行為而受有不利措施，該公務員於申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序中提出此主張者，此主張應先於其他事項進行調查，並依調查結果而為成立或不成立之認定。","note":"一、當揭弊者遭受不利措施時，就該不利措施之採行，揭弊者任職之政府機關（構）、法人、團體或其主管、雇主經常否認與揭弊者之揭弊行為有關，致使揭弊者在舉證困難之情形下，往往無法獲得有效之救濟。爰參酌美國之立法例，在揭弊者證明其揭弊行為之存在、遭受不利措施以及揭弊行為在不利措施之前時，即推定為違反前條第一項之規定，合理減輕揭弊者之舉證責任。爰為第一項、第二項之規定。\n二、在第二項明定揭弊者任職之政府機關（構）、法人、團體或其主管、雇主得積極提出反證，證明其當時乃係基於正當理由而採取該不利措施，與揭弊者前條第一項各款之行為無關者，始得推翻違法為不利措施之推定。\n三、當揭弊者為公務員，主張自己係因揭弊行為而受有不利措施，該公務員於申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序中提出此主張時，此主張應先於其他事項進行調查，並依調查結果而為成立或不成立之認定，以保護公務員免因揭弊行為而遭受報復，並賦與其必要之保障，爰為第三項規定。"},{"bill":"202110033190000","text":"公務員於申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序中，主張其有第六條第一項各款之行為，而遭移送或受有不利人事措施者，應先於其他事證而為調查，並依調查結果而為成立或不成立之認定。\n具公務員身分之內部人員因受第六條第二項第一款至第四款不利人事措施所生同條第三項第三款及第四款之賠償請求權，自政府機關（構）依前項主張作成回復原狀、行政救濟為有理由之決定確定之日起；因第六條第二項第五款不利人事措施所生之賠償請求權，自知悉事實發生之日起，六個月間不行使而消滅。\n具公務員身分之內部人員主張其因有第六條第一項各款之行為而遭移送懲戒，經公務員懲戒委員會或職務法庭審理後，認定其依第一項之主張成立並為不受懲戒之判決確定者，亦得請求第六條第三項第三款及第四款之賠償，並準用前項時效之規定。\n前二項請求權之行使，不妨礙依民法、國家賠償法或其他法律所得行使之權利。","note":"一、考量公務員遭受不利之人事措施，其原先態樣已有懲戒（公務人員懲戒法、法官法）、懲處（公務人員考績法）、懲罰（陸海空軍懲罰法）與福利、特殊權利及與升遷有關之教育或訓練機會之剝奪；工作地點、職務內容或其他工作條件之不利變更，亦均具相對之救濟程序。\n二、爰明定具公務員身分揭弊者遇有不利人事措施之救濟措施，意指其依原有申訴程序將可以「揭弊」而非「因違法或不當行為」作為抗辯，使懲戒或懲處機關列入考量。\n三、有關請求權行使，不妨礙依民法、國家賠償法或其他適用法律所得行使之權利。"},{"bill":"202110039800000","text":"具公務員身分之人因受前條第二項第一款至第四款不利措施者，應依其原有身分關係適用之法律程序提起行政救濟，所生同條第三項第三款及第四款之賠償請求權，自政府機關（構）依第二項主張作成回復原狀、行政救濟為有理由之決定確定之日起；因第七條第二項第五款不利措施所生之賠償請求權，自知悉事實發生之日起，六個月間不行使而消滅；自損害發生時起，逾二年者亦同。\n公務員於申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序中，主張其有第七條第一項各款之行為，而遭移送或受有不利措施者，應先於其他事證而為調查，並依調查結果而為成立或不成立之認定。\n具公務員身分之受不利措施者主張其因有第七條第一項各款之行為而遭移送懲戒，經懲戒法院審理後，認定其依前項之主張成立並為不受懲戒之判決確定者，亦得請求第七條第三項第三款及第四款之賠償，並準用前項時效之規定。\n前二項請求權之行使，不妨礙依民法、國家賠償法或其他法律所得行使之權利。","note":"一、本條限於規範申訴人或請求人係公務員時之程序，非具公務員身分者，則依第九條規定之。\n二、公務員如果因為揭弊而遭受不利人事措施，其申訴之程序可分為二大種類，第一種是在被移送懲戒等程序時，提出「揭弊者抗辯」，主張其之所以被送懲戒或懲處，係因為揭弊；第二種類就是在遭受工作條件之不利處置時，主動提出申訴請求撤銷。此二種類，都是依現有機制行之，亦即依其原有身分關係所適用之法律程序（人事行政行為救濟程序）請求救濟。至於損害賠償的請求，有部分情形是可以在該等程序中即獲得滿足（實現），例如依據公務人員保障法第六十八條所進行之協議。但大部分之情況，必須等這些救濟「勝訴」（即不成立懲戒懲處或撤銷原處分）後，才開始另行請求損害賠償，爰明確規範賠償請求權時效起算時點，以保障公務員請求權。\n三、關於賠償請求權之時效，為避免不利處遇之影響過久，本法採特殊之短期時效請求權，六個月間不行使而消滅；復為維護法安定性，自因不利措施受有損害時起，逾二年而未請求者，亦不得再依本法提起。\n四、公務員遭受不利措施依法提起救濟時，如主張該不利措施係因其揭弊行為所致，則其揭弊抗辯應優先調查，並依調查結果而為成立或不成立之認定，法院就前揭認定得依個案審理情形以中間判決或終局判決為之，爰為第二項規定。又為符行政訴訟法理，公務員依本法所為之揭弊抗辯，至遲應於行政訴訟第一審事實審言詞辯論終結前主張之，併此敘明。\n五、具公務員身分之受不利措施者主張其因有第七條第一項各款之行為而遭移送懲戒，經懲戒法院審理後，認定其依前項之主張成立並為不受懲戒之判決確定者，亦得請求第七條第三項第三款及第四款之賠償，並準用第一項時效之規定。\n六、第三項規定依據請求權競合之法理，公務員本得選擇行使其原有國家賠償法或民法侵權行為之請求權，惟此時則不得援引有關本法第七條第五、六項關於舉證責任分配之規定。"}],"changed":true,"final":"政府機關（構）、法人或團體、個人，不得因揭弊者有下列行為，而對其採行不利之措施：\n一、揭發第三條所列弊案。\n二、配合弊案之調查或擔任證人。\n三、拒絕參與弊案之決定或實施。\n四、因前三款之作為而遭受不利措施後，依法提起救濟。\n前項所稱不利措施，指下列情形之一：\n一、解職、撤職、免職、停職、解約、降調，或不利之考績、懲處、懲罰及評定。\n二、減薪（俸）、罰款（薪）、剝奪或減少獎金、退休（職、伍）金。\n三、與陞遷有關之教育或訓練機會、福利、特殊權利之剝奪。\n四、工作地點、職務內容或其他工作條件、管理措施之不利變更。\n五、非依法令規定揭露揭弊者之身分。\n因第一項各款行為而受不利措施者，得為下列請求：\n一、回復其受不利措施前之職位及職務；其原職位已補缺或經裁撤者，回復至相當之職位及職務。\n二、回復其原有年資、特殊權利、獎金、退休（職、伍）金、福利、工作條件及管理措施。\n三、受不利措施期間俸（薪）給或工資之補發，及財產上損害之賠償。\n四、受有身體、健康、名譽、自由、信用、隱私，或其他人格法益之侵害者，雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求為回復名譽之適當處分。\n前項第三款所定財產上損害之賠償，包括俸（薪）給或工資以外其他期待利益之合理估算金額，及遭受不利措施後，依法提起救濟所合理支出之費用及律師酬金。\n第二項所定不利措施之爭議，應先由受不利措施之人證明下列情事：\n一、有第一項各款之行為。\n二、有遭受第二項之不利措施。\n三、第一款行為之發生時間在第二款不利措施之前。\n受不利措施之人為前項證明後，推定為有違反本條第一項規定。但任職之政府機關（構）、法人、團體或其主管、雇主證明縱無該等行為，其於當時仍有正當理由採相同之人事措施者，不在此限。\n訂有禁止揭弊者為第一項各款行為之約定，或限制揭弊者依第三項、第四項為請求之權利者，其約定無效。","finalWhy":"一、為保障揭弊者不因其揭弊行為而招致報復並導致權益受損，明定政府機關（構）、法人或團體、個人不得因揭弊者之揭弊行為，而對其採取不利之措施，爰於第一項明定。\n二、就第一項所稱不利措施，爰於第二項予以明定。\n三、就因揭弊行為而遭不利措施之揭弊者，明文賦予其獨立之請求權，得據以請求回復原狀及財產上與非財產上之損害賠償，爰於第三項明定。\n四、揭弊者因受不利措施，有依法提起救濟之必要，或為第三項所定之請求而提起訴訟者，其所因而支出之合理費用及律師酬金，自得一併請求給付，方足以充分保障其權益，爰於第四項明定。\n五、當揭弊者遭受不利措施時，就該不利措施之採行，揭弊者任職之政府機關（構）、法人、團體或其主管、雇主經常否認與揭弊者之揭弊行為有關，致使揭弊者在舉證困難之情形下，往往無法獲得有效之救濟。爰參酌美國之立法例，在揭弊者證明其揭弊行為之存在、遭受不利措施以及揭弊行為在不利措施之前時，即推定為違反本條第一項之規定，合理減輕揭弊者之舉證責任，爰為第五項之規定。\n六、為免揭弊保護遭濫用，爰於第六項但書規定保護之排除，即政府機關（構）、法人、團體或其主管、雇主證明該揭發情事無該等行為，其於當時仍有正當理由採相同之措施者，不在此限。又所謂當時，係指採取不利措施當時之考量因素，不含事後新發生之因素。\n七、在契約中訂有禁止揭弊者為揭弊行為，或限制揭弊者依第三項、第四項提出請求之權利者，其約定本應無效，始得有效保障揭弊者之權益，爰於第七項明定。","review":{"note":"保留，送院會處理","text":""}},{"no":"第九條","current":null,"versions":[{"bill":"202110005890000","text":"公務員於申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序中，主張其有第七條第一項各款之行為，而遭移送或受有不利人事措施者，應先於其他事證而為調查，並依調查結果而為成立或不成立之認定。\n具公務員身分之內部人員因受第七條第二項第一款至第四款不利人事措施所生同條第三項第三款及第四款之賠償請求權，自政府機關（構）依前項主張作成回復原狀、行政救濟為有理由之決定確定之日起；因第七條第二項第五款不利人事措施所生之賠償請求權，自知悉事實發生之日起，六個月間不行使而消滅。\n具公務員身分之內部人員主張其因有第七條第一項各款之行為而遭移送懲戒，經公務員懲戒委員會或職務法庭審理後，認定其依第一項之主張成立並為不受懲戒之判決確定者，亦得請求第七條第三項第三款及第四款之賠償，並準用前項時效之規定。\n前二項請求權之行使，不妨礙依民法、國家賠償法或其他法律所得行使之權利。","note":"一、公務員遭受不利人事措施依法提起救濟時，如主張該不利人事措施係因其揭弊行為所致，則其揭弊抗辯應優先調查，並依調查結果而為成立或不成立之認定，爰為第一項之規定。\n二、有關具公務員身分之內部人員受有不利人事措施時，應依其原有身分別適用法令提起救濟，如依公務人員保障法規定先行提起申訴、再申訴、復審，或依訴願法提起訴願等救濟程序，如依其主張之揭弊者抗辯後，經行政救濟程序，作成不利人事措施救濟成功者，得於機關自行回復原狀或行政救濟成功而獲有理由之決定確定者，足認公務員確有因揭弊行為而受不當處遇時，公務員就遭受不利人事措施期間所受損害，及因揭弊者身分遭故意洩漏而受之損害，應續行提供損害賠償之請求權，為避免不利處遇之影響過久，本法之損害賠償請求權為特殊之短期時效請求權，六個月間不行使而消滅，如逾六個月，內部人員仍得依其他民事法規請求之，爰為第二項之規定。\n如揭弊者未能於行政救濟程序獲有回復原狀或撤銷不利人事措施之結果，亦不得依本法另行提起損害賠償請求。至揭弊者如依公務人員保障法第七十二條規定不服復審決定，及依行政訴訟法第四條規定不服訴願決定者，本即均得依法提起行政訴訟，並依行政訴訟法第七條合併請求損害賠償或其他財產上給付，屬公務員現有保障制度，仍得依其規定併同請求，自不待言。\n三、考量公務員僅因為揭弊行為而遭報復性之不當移送懲戒，於公務員懲戒委員會或職務法庭認定公務員依第一項之揭弊抗辯主張成立並為不受懲戒之判決確定者，就其遭移送審理期間，公務員之信用、名譽等人格權所受損害，亦應給予必要之賠償請求權，爰為第三項之規定。\n四、第四項規定依據請求權競合之法理，公務員本得選擇行使其原有國家賠償法或民法侵權行為之請求權，惟此時應不得援引第八條舉證責任分配之規定。"},{"bill":"202110006520000","text":"揭弊者之個人資料，除法律另有規定、或已無身分保密必要之情形者外，公務員於製作筆錄或文書時，應以代號為之，不得記載揭弊者之姓名、性別、出生年月日、住居所、身分證明文件編號或其他得以直接或間接方式識別該個人之資料。\n載有揭弊者身分資料之筆錄或文書原本，應另行製作卷面封存之。其他文書足以顯示揭弊者之身分者，亦同。\n前項封存之筆錄、文書，除法律另有規定外，不得供閱覽或提供偵查、審判機關以外之其他機關（構）、法人或團體、個人。\n揭弊者於接受調查、審理時，得依其要求蒙面、變聲、變像、視訊傳送或其他適當隔離方式為之。於其依法接受對質或詰問時，亦同。\n前四項之保密措施，揭弊者得放棄之。","note":"明定揭弊者個人資料之保護。"},{"bill":"202110013980000","text":"揭弊有下列各款情事之一者，受理通報之主管機關得不予調查或停止調查：\n一、不符合本法之規定。\n二、通報之案件明顯虛偽不實。\n三、案件已被公開，而揭弊者未能提出新事證。\n四、與調查程序中或調查程序已結束之案件為同一案件，而揭弊者未能提出新事證。\n五、主管機關要求揭弊者協助調查或提供事證資料，但揭弊者非有正當理由不予協助或拒絕提供。\n六、違反其他檢舉相關之法令。\n依前項不予調查或停止調查後三十日內，應以書面敘明事由通知揭弊者。","note":"一、受理揭弊之主管機關應以對於所有通報案件進行調查為原則。但若有特殊情事如不符本法之規定、通報案件明顯虛偽不實、該案件已經公開或結束而揭弊者並未提供新事證、揭弊者不予協助調查，或違反其他檢舉相關之法令等情形，即賦予主管機關得例外不予調查或停止調查，以求調查資源之有效運用。\n二、不予調查或停止調查之通報案件，主管機關應以書面敘明理由通知揭弊者。"},{"bill":"202110014070000","text":"未具公務員身分之內部人員因受不利措施所生第六條第三項之請求權，自知悉事實發生之日起，六個月間不行使而消滅。\n前項請求權之行使，不妨礙依民法或其他法律所得行使之權利。\n政府機關（構）、法人或團體、個人違反第六條第一項規定，致有損害第一項之內部人員權益之虞者，該內部人員得不經預告終止契約，雇主應給付不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費及三個月以上補償金之總額。\n依第六條第三項第一款復職顯有事實上之困難時，雇主得給付受僱人不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及六個月以上補償金之總額，合意終止勞務契約。\n前二項補償金依受僱人為第六條第一項各款行為之前一月工資計算。\n第一項之內部人員為政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約者，得準用前三項規定請求補償金。但契約約定有利於內部人員者，從其約定。","note":"一、考量政府機關（構）、法人或團體、個人（下稱行為人）因內部人員有第六條第一項所列之行為，而意圖報復內部人員，導致其權益受損。\n二、明定未具公務員身分揭弊者遇有不利人事措施之救濟程序，並賦予揭弊者對於行為人懲罰性賠償金之請求權基礎。\n三、爰訂定第三項，內部人員除得不經預告終止契約，亦要求雇主應給付勞動相關法令（勞動基準法、勞工保險條例、勞工退休金條例等）所規定之資遣費及三個月以上補償金之總額；訂定第四項，行為人對於恢復揭弊者之原職原位顯有困難，雇主得給付受僱人不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及六個月以上補償金之總額，合意終止勞務契約。"},{"bill":"202110025210000","text":"政府機關（構）、法人或團體、個人違反第七條第一項規定，致有損害揭弊者權益之虞者，未具公務員身分之揭弊者得不經預告終止契約，雇主應給付不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費以及相當於六個月工資之補償金之總額。\n依第七條第三項第一款復職顯有事實上之困難，雇主得給付未具公務員身分之揭弊者不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金以及相當於十二個月工資之補償金之總額，合意終止勞務契約。\n前二項補償金依揭弊者為第七條第一項各款行為之前一月工資計算。\n揭弊者為政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約者，得準用前三項規定請求補償金。但契約有更有利於揭弊者之約定者，從其約定。","note":"一、在揭弊者為未具公務員身分之情形，雇用其之政府機關（構）、法人或團體、個人違反第七條第一項規定，致有損害揭弊者權益之虞時，參酌勞動基準法第十四條規定使揭弊者得不經預告終止契約，並為強化揭弊者保護，使揭弊者除依法本得請求給付之資遣費、退休金外，另得請求相當於六個月工資之補償金，爰為第一項規定。\n二、在私部門揭弊之情形，由於揭弊者回復原職在實務上有時將產生一定之困難，特明定此時得給付未具公務員身分之揭弊者不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金以及相當於十二個月工資之補償金之總額，合意終止勞務契約，爰為第二項規定。\n三、就前二項所定計算補償金之工資，於第三項明定係為揭弊行為之前一月工資。\n四、當揭弊者屬於政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約之情形，明定亦得準用前三項規定請求補償金，以使其得受到相同之保障。惟契約若有更有利於揭弊者之約定者，自當從其約定，不待另言。"},{"bill":"202110033190000","text":"未具公務員身分之內部人員因受不利措施所生第六條第三項之請求權，自知悉事實發生之日起，六個月間不行使而消滅。\n前項請求權之行使，不妨礙依民法或其他法律所得行使之權利。\n政府機關（構）、法人或團體、個人違反第六條第一項規定，致有損害第一項之內部人員權益之虞者，該內部人員得不經預告終止契約，雇主應給付不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費及三個月以上補償金之總額。\n依第六條第三項第一款復職顯有事實上之困難時，雇主得給付受僱人不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及六個月以上補償金之總額，合意終止勞務契約。\n前二項補償金依受僱人為第六條第一項各款行為之前一月工資計算。\n第一項之內部人員為政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約者，得準用前三項規定請求補償金。但契約約定有利於內部人員者，從其約定。","note":"一、考量政府機關（構）、法人或團體、個人（下稱行為人）因內部人員有第六條第一項所列之行為，而意圖報復內部人員，導致其權益受損。\n二、明定未具公務員身分揭弊者遇有不利人事措施之救濟程序，並賦予揭弊者對於行為人懲罰性賠償金之請求權基礎。\n三、爰訂定第三項，內部人員除得不經預告終止契約，亦要求雇主應給付勞動相關法令（勞動基準法、勞工保險條例、勞工退休金條例等）所規定之資遣費及三個月以上補償金之總額；訂定第四項，行為人對於恢復揭弊者之原職原位顯有困難，雇主得給付受僱人不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及六個月以上補償金之總額，合意終止勞務契約。"},{"bill":"202110039800000","text":"未具公務員身分之受不利措施者因雇主違反第七條第一項規定者，得自知悉其情形之日起三十日內，不經預告終止勞動契約。\n前項人員得請求雇主給付其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及相當於六個月工資補償金；其請求權自勞動契約終止時起，六個月間不行使而消滅。\n未具公務員身分而受不利措施者所生第七條第三項之請求權，自知悉事實發生之日起，六個月間不行使而消滅；自損害發生時起，逾二年者亦同。\n於行使前二項請求權之救濟程序中，未具公務員身分之受不利措施者主張其有第七條第一項各款之行為，應先於其他事證而為調查，並依調查結果而為成立或不成立之認定。\n第二項及第三項請求權之行使，適用第七條第五項、第六項之規定，且不妨礙依民法或其他法律所得行使之權利。\n依第七條第三項第一款復職顯有事實上之困難時，雇主得給付受不利措施者適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及相當於十二個月工資補償金，合意終止勞動契約。\n第二項及前項之補償金，依受不利措施者為第七條第一項各款行為之前一月工資計算。\n未具公務員身分之受不利措施者為政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約者，得準用第二項、第四項至前項規定請求補償金。但契約之約定有利於該受不利措施者，從其約定。","note":"一、有鑑於我國現行就私部門勞工之公益性揭弊，僅有對於災害不法行為之積極防治，於職業安全衛生法第三十九條規範賦予勞工得於發現事業單位有違反本法或有關安全衛生之規定時，得向雇主、主管機關或勞動檢查機構申訴，而雇主不得因此對第一項申訴之工作者予以解僱、調職或其他不利之處分，也就是只對於舉發雇主違反職業安全衛生法之勞工給予保障；由此觀之，我國社會似乎尚未重視勞工對公共利益維護得以發揮之貢獻。加上我國相關勞動法規多揭櫫勞工對於雇主有廣泛的忠實義務，則對於私部門勞工而言，勢必會在公益揭弊貢獻與組織忠誠義務間產生衝突，故更需要保障私部門內部人員揭弊後的相關權益。\n二、為了強化私部門內部人員揭弊動力，提供其選擇主動終止勞務契約，經參酌勞動基準法第十四條第一項第六款規定，雇主違反勞動契約或勞工法令，致有損害勞工權益之虞者，勞工得不經預告終止勞動契約，而雇主仍應依法給付資遣費、退休金等規定，爰於雇主違反第七條第一項規定為報復性行為時，賦予未具公務員身分之內部人員得不經預告終止勞動契約之權利。\n三、為及早確認契約關係存續狀態，以避免勞資關係僵持不下，該內部人員應於知悉遭報復行為之日起之三十日之除斥期間內為之。契約終止後，為保障其依法享有之權益並給予待業時之補償，參照上開勞動基準法內容，明定雇主除應給付該內部人員適用勞動法規規定所得領取之資遣費、退休金外，尚應給付相當於六個月之工資補償金，爰為第一項、第二項規定。\n四、未具公務員身分之內部人員，於主張第二項規定終止契約後所生之請求權及第七條第三項各款請求權時，亦享有揭弊抗辯應優先調查及舉證責任倒置之程序性保障，且參照前條說明四，依本法所為之揭弊抗辯，至遲應於民事訴訟第二審事實審言詞辯論終結前主張之，法院就揭弊抗辯成立與否之認定得依個案審理情形以中間判決或終局判決為之；另依據請求權競合之法理，未具公務員身分之內部人員本得選擇行使其原有勞動基準法、勞工退休金條例、國家賠償法、民法侵權行為或其他法規之請求權，爰為第四項、第五項規定。\n五、考量私部門內部人員請求復職時，若有事實上困難，為避免受僱人於合意內容協議時處於弱勢，於第六項就合意內容明定最低保障之宣示規定，除可請求相當於十二個月工資補償金外，另應包括資遣費、退休金如下：(一)適用勞動基準法之受僱人，依勞動基準法及勞工退休金條例關於資遣費、退休金之計給標準。(二)不適用勞動基準法之受僱人，依其適用法規（如學校法人及其所屬私立學校教職員退休撫卹離職資遣條例、各機關學校聘僱人員離職給與辦法等）關於退休金、資遣費之計給標準。(三)至如無勞動法令或其他法規適用之受僱人者，其退休金、資遣費從其契約約定。\n六、上開補償之給付時點，由勞雇雙方約定之，如未約定者，雇主應於契約終止時給付之。另如雇主有拒絕受僱人復職之情形，因已涉違反勞動契約，損及其勞動權益，第六項規定不影響受僱人得依勞動基準法第十四條規定主張終止契約及請求資遣費之權利。\n七、為使揭弊者得有合理時間另尋工作，明定雇主應依其為第七條第一項各款行為前一月之工資為基準，提供待業補償金，爰為第七項規定。\n八、考量私部門內部高階人員或保險從業人員、房仲人員等特定行業人員與企業間係屬「委任關係」，無勞動法規之適用，為保障其工作權，就編制內固定支領俸（薪）給之受委任人員亦得請求待業補償金，如為私部門企業編制外之外部委任關係，如法律顧問、會計師等則不在本項適用範圍，爰為第八項規定。"}],"changed":true,"final":"具公務員身分之人因受第八條第二項第一款至第四款不利措施者，應依其原有身分關係適用之法律程序提起行政救濟，所生同條第三項第三款及第四款之賠償請求權，自政府機關（構）依第二項主張作成回復原狀、行政救濟為有理由之決定確定之日起；因第八條第二項第五款不利措施所生之賠償請求權，自知悉事實發生之日起，六個月間不行使而消滅；自損害發生時起，逾二年者亦同。\n公務員於申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序中，主張其有第八條第一項各款行為者，而遭移送或受有不利措施者，應先於其他事證而為調查，並依調查結果而為成立或不成立之認定。\n具公務員身分之受不利措施者主張其因有第八條第一項各款之行為而遭移送懲戒，經懲戒法院審理後，認定其依前項之主張成立並為不受懲戒之判決確定者，亦得請求第八條第三項第三款及第四款之賠償，並準用第一項時效之規定。\n第一項及前項請求權之行使，不妨礙依民法、國家賠償法或其他法律所得行使之權利。","finalWhy":"一、第一項明定公務員因揭弊而遭受不利措施之賠償請求權時效。\n二、公務員遭受不利措施依法提起救濟時，如主張該不利措施係因其揭弊行為所致，則其揭弊抗辯應優先調查，並依調查結果而為成立或不成立之認定，法院就前揭認定得依個案審理情形以中間判決或終局判決為之，爰為第二項規定。\n三、具公務員身分之受不利措施者主張其因有第八條第一項各款之行為而遭移送懲戒，經懲戒法院審理後，認定其依前項之主張成立並為不受懲戒之判決確定者，亦得請求第八條第三項第三款及第四款之賠償，並準用第一項時效之規定，爰於第三項規定。\n四、第一項及第三項所定之請求權，在於提供揭弊者必要之保護。若依民法、國家賠償法或其他法律，揭弊者另有得行使之權利，自無排除揭弊者主張行使該權利之理由，爰於第四項規定。","review":{"note":"條文及委員吳宗憲等4人所提修正動議均保留，送院會處理","text":""}},{"no":"第十條","current":null,"versions":[{"bill":"202110005890000","text":"未具公務員身分之內部人員因受不利人事措施所生第七條第三項之請求權，自知悉事實發生之日起，六個月間不行使而消滅。\n前項請求權之行使，不妨礙依民法或其他法律所得行使之權利。\n依第七條第三項第一款復職顯有事實上之困難時，雇主應給付受僱人不低於其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及十個月以上薪資之補償金，合意終止勞務契約。\n前項補償金依受僱人為第七條第一項各款行為之前一月工資計算。\n第一項之內部人員為政府機關（構）、法人或團體編制內支領俸（薪）給而訂有委任契約者，得準用前二項規定請求十個月以上之補償金。但契約約定有利於內部人員者，從其約定。","note":"一、為使法律關係早日確定且避免事證消失，參酌第九條第二項及第四項，爰為第一項、第二項之規定。\n二、私部門之復職方面，為降低雇主從事不法行為之動機，規範事業單位恢復內部人員之職務顯有困難，應課予雇主補償受僱人10個月薪資以上補償金以及給付相關勞動法規所訂之資遣費、退休金等，方得合意終止勞務契約。\n三、上開補償之給付時點，由勞雇雙方約定之，如未約定者，雇主應於契約終止時給付之。另，如雇主有拒絕受僱人復職之情形，因已涉違反勞動契約，損及其勞動權益，第三項規定不影響受僱人得依勞動基準法第十四條規定主張終止契約及請求資遣費之權利。\n四、為使揭弊者得有合理時間另尋工作，明定雇主應依其為第七條第一項各款行為前一月之工資為基準，提供十個月以上之待業補償金，爰為第四項之規定。\n五、考量私企業內部高階人員或保險從業人員、房仲人員等亦有為內部揭弊之可能，而前開特定行業人員與企業間係屬委任關係，無勞動法規之適用，本法為提供內部受委任人員工作權之保障，就編制內固定支領俸（薪）給之受委任人員亦得請求待業補償金，如為企業編制外之外部委任關係，如法律顧問、會計師等則不在本項適用範圍，爰為第五項之規定。"},{"bill":"202110006520000","text":"因執行職務或業務知悉揭弊者身分之人，除法律另有規定或經本人同意者外，不得洩漏足以識別揭弊者身分之資訊。\n違反前項之規定者，依相關法律處罰。","note":"明定執行業務或業務知悉揭弊者身分不得洩漏。"},{"bill":"202110013980000","text":"因業務或職務知悉揭弊者身分之人應對揭弊者身分資料嚴守秘密，除法律另有規定，不得洩漏足以識別揭弊者本人、配偶、直系血親或與其有密切利害關係人身分之資訊。","note":"一、揭弊者之身分資料自通報開始均須受到保密。\n二、業務或職務上知悉揭弊者身分之人，對於揭弊者本人、配偶、直系血親或與其有密切利害關係人之身分資訊，除法律另有規定外，負有保密之義務。"},{"bill":"202110014070000","text":"違反第六條第一項規定者，其具有公務員身分者，按其情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；未具公務員身分之人、法人、團體者，由各目的事業主管機關處新臺幣五萬元以上五百萬元以下罰鍰，但其他法律有較重之處罰規定者，從其規定。\n前項後段情形，各目的事業主管機關得限期命其改善，屆期不改善者，按次處罰。","note":"一、為積極保護內部人員基於公益揭弊免於工作權剝奪及其他不利待遇，爰明定政府機關（構）、法人或團體、個人（下稱行為人）違反第六條第一項，對揭弊者採行不利人事措施，應受懲戒、懲處及處罰規定。\n二、針對未具公務員身分之行為人及法人團體，事業主管機關得命限期改善，屆期未改善者，則訂有按次處罰之規定。"},{"bill":"202110025210000","text":"第七條第三項各款所定揭弊者之請求權，除別有規定外，自知悉事實發生時起，六個月間不行使而消滅。\n第七條第四項所定揭弊者之請求權，自救濟程序或訴訟終結時起，六個月間不行使而消滅。\n揭弊者為公務員者，因受第七條第二項各款不利措施所生同條第三項第三款及第四款之請求權，自政府機關（構）依第八條第三項之主張而作成回復原狀或行政救濟為有理由之決定確定之日起，六個月間不行使而消滅。","note":"一、就本法第七條第三項、第四項之請求權，爰於第一項及第二項明定消滅時效為六個月，另於第三項為起算時點之特別規定。\n二、在揭弊者為公務員者，因受第七條第二項各款不利措施而導致其有必要進行申訴、再申訴、復審、訴願、評鑑、懲戒、行政訴訟或其他人事行政行為救濟程序者，就公務員因此所生第七條第三項第三款及第四款之請求權，其時效期間之起算，應自政府機關（構）依第八條第三項之主張而作成回復原狀或行政救濟為有理由之決定確定之日起算，始為合理，爰於第三項為特別規定。"},{"bill":"202110033190000","text":"違反第六條第一項規定者，其具有公務員身分者，按其情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；未具公務員身分之人、法人、團體者，由各目的事業主管機關處新臺幣五萬元以上五百萬元以下罰鍰，但其他法律有較重之處罰規定者，從其規定。\n前項後段情形，各目的事業主管機關得限期命其改善，屆期不改善者，按次處罰。","note":"一、為積極保護內部人員基於公益揭弊免於工作權剝奪及其他不利待遇，爰明定政府機關（構）、法人或團體、個人（下稱行為人）違反第六條第一項，對揭弊者採行不利人事措施，應受懲戒、懲處及處罰規定。\n二、針對未具公務員身分之行為人及法人團體，事業主管機關得命限期改善，屆期未改善者，則訂有按次處罰之規定。"},{"bill":"202110039800000","text":"違反第七條第一項規定者，依下列情形予以處罰：\n一、有公務員身分者，按其情節輕重，公務員懲戒法、公務人員考績法或其相關法規予以懲戒或懲處。\n二、未具公務員身分之自然人、法人、團體者，由各目的事業主管機關處新臺幣五萬元以上五百萬元以下罰鍰，但其他法律有較重之處罰規定者，從其規定。\n前項第二款情形，各目的事業主管機關得限期命其改善，屆期不改善者，按次處罰。","note":"一、公務人員有維持行政中立之義務，又揆諸公務人員行政中立法第十六條之意旨，對於違反行政中立之程度，應依具體個案及侵害中立義務之嚴重程度，分別依公務員懲戒法、公務人員考績法或其他相關規定處理，故就公務員對揭弊者施以報復性不利人事措施者，亦應按其情節輕重，依相關法規予以懲戒或懲處。\n二、不具公務員身分之自然人、法人或團體，由揭弊情節之目的事業主管機關依違反情節處以行政罰鍰。若揭弊案件目的事業主管機關不明或涉及數個主管機關權責，而無法確定裁罰機關者，由法務部確定之。\n三、為保障揭弊者權益，並預防遭揭弊之一方為報復行為，針對施以報復行為者或單位予以從重處罰，以達嚇阻效用。爰參照行政罰法第二十四條，一行為違反數個行政法上義務規定者，罰鍰從重，如各單行法規所定之裁罰種類與本法不同者，得併為裁處。故各單行法規如定有罰鍰以外之其他裁罰，如勞動基準法第八十條之一、職業安全衛生法第四十九條規定，對於違規之事業單位或事業主得公布名稱、負責人姓名，得併予處罰。"}],"changed":true,"final":"未具公務員身分之受不利措施者因雇主違反第八條第一項規定者，得自知悉其情形之日起三十日內，不經預告終止勞動契約。\n前項人員得請求雇主給付其適用勞動基準法、勞工退休金條例或其他法規所規定之資遣費、退休金及相當於六個月工資補償金；其請求權自勞動契約終止時起，六個月間不行使而消滅。\n未具公務員身分而受不利措施者所生第八條第三項之請求權，自知悉事實發生之日起，六個月間不行使而消滅；自損害發生時起，逾二年者亦同。\n於行使前二項請求權之救濟程序中，未具公務員身分之受不利措施者主張其有第八條第一項各款行為者，應先於其他事證而為調查，並依調查結果而為成立或不成立之認定。\n第二項及第三項請求權之行使，適用第八條第五項、第六項之規定，且不妨礙依民法或其他法律所得行使之權利。\n依第八條第三項第一款復職顯有事實上之困難時，雇主得給付受不利措施者適用勞動基準法、勞工退休金條例或其他法規所規
