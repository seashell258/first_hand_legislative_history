有所得利益者；(二)為他人利益而實施行為，致使他人　違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之　虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第　一項及第二項規定，增訂第三項及第四項規定。\n三、第三項移列為第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第五項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"},{"bill":"202110214090000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","note":"一、第一項未修正。\n二、為與其他環保法規規定一致，參考水污染防治法第六十六條之二第一項、空氣污染防制法第八十六條第一項規定，修正第二項，採取追繳不法利得與罰鍰併行之立法體例，以遏止環境不法。\n三、任何人皆不應因違反行政法義務而受有財產上利益，依其類型包括：(一)行為人違反本法義務行為而有所得利益者；(二)為他人利益而實施行為，致使他人　違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之　虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第一項及第二項規定，增訂第三項及第四項規定。\n四、第三項移列為第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第四項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"},{"bill":"201110206460001","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","note":"一、第一項未修正。\n二、為與其他環保法規規定一致，參考水污染防治法第六十六條之二第一項、空氣污染防制法第八十六條第一項規定，修正第二項，採取追繳不法利得與罰鍰併行之立法體例，以遏止環境不法。\n三、任何人皆不應因違反行政法義務而受有財產上利益，依其類型包括：(一)行為人違反本法義務行為而有所得利益者；(二)為他人利益而實施行為，致使他人　違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之　虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第一項及第二項規定，增訂第三項及第四項規定。\n四、第三項移列為第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第四項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"}],"changed":true,"final":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","finalWhy":"","review":null},{"no":"第六十四條","current":"依本法處罰鍰案件，涉及刑事責任者，應分別處罰。","versions":[{"bill":"202110179890000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則容有扞格，爰予刪除。"},{"bill":"202110204880000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110207050000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110207590000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"201110206460000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110209830000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110209810000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110209180000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110209760000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110211360000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110211860000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110214910000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"202110214090000","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"},{"bill":"201110206460001","text":"（刪除）","note":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。"}],"changed":true,"final":"（刪除）","finalWhy":"一、本條刪除。\n二、本條規定與行政罰法第二十六條第一項揭示之刑事優先原則、一行為不二罰原則容有扞格，爰予刪除。","review":null},{"no":"第七十一條","current":"不依規定清除、處理之廢棄物，直轄市、縣（市）主管機關或執行機關得命事業、受託清除處理廢棄物者、仲介非法清除處理廢棄物者、容許或因重大過失致廢棄物遭非法棄置於其土地之土地所有人、管理人或使用人，限期清除處理。屆期不為清除處理時，直轄市、縣（市）主管機關或執行機關得代為清除、處理，並向其求償清理、改善及衍生之必要費用。屆期未清償者，移送強制執行；直轄市、縣（市）主管機關或執行機關得免提供擔保向行政法院聲請假扣押、假處分。\n直轄市、縣（市）主管機關或執行機關依前項規定代為清除、處理廢棄物時，得不經土地所有人、管理人或使用人同意，強制進入公私場所進行有關採樣、檢測、清除或處理等相關措施。\n第一項必要費用之求償權，優於一切債權及抵押權。\n直轄市、縣（市）主管機關或執行機關代為清除、處理第一項廢棄物時，得委託適當公民營廢棄物清除處理機構清除、處理之。","versions":[{"bill":"202110108300000","text":"不依規定清除、處理之廢棄物，直轄市、縣（市）主管機關或執行機關得命事業、受託清除處理廢棄物者、仲介非法清除處理廢棄物者、容許或因重大過失致廢棄物遭非法棄置於其土地之土地所有人、管理人或使用人，限期清除處理。屆期不為清除處理時，直轄市、縣（市）主管機關或執行機關得代為清除、處理，並向其求償清理、改善及衍生之必要費用。屆期未清償者，移送強制執行；直轄市、縣（市）主管機關或執行機關得免提供擔保向行政法院聲請假扣押、假處分。\n事業為公司組織時，直轄市、縣（市）主管機關或執行機關得限期命其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前項必要費用；事業因合併、分割或其他事由消滅時，亦同。\n直轄市、縣（市）主管機關或執行機關依前項規定代為清除、處理廢棄物時，得不經土地所有人、管理人或使用人同意，強制進入公私場所進行有關採樣、檢測、清除或處理等相關措施。\n第一項必要費用之求償權，優於一切債權及抵押權。\n第一項及第二項應繳納費用，於繳納義務人有數人者，應就繳納費用負連帶清償責任。\n第一項及第二項應繳納費用，屆期未繳納者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，處新臺幣二十萬元以上一百萬元以下罰鍰，並限期繳入指定基金。\n直轄市、縣（市）主管機關或執行機關代為清除、處理第一項廢棄物時，得委託適當公民營廢棄物清除處理機構清除、處理之。","note":"一、第一項未修正。\n二、增訂第二項，參考土壤及地下水污染整治法第四十三條第三項立法例，明定事業為公司組織時，直轄市、縣（市）主管機關得對公司負責人、主要股東或控制公司之人課以連帶清理責任，以防止透過公司組織型態規避法律責任。同時規定事業消滅後，相關責任人仍應負擔清理費用，確保環境復原責任不因事業消滅而免除。原第二項移列為第三項。\n三、原第三項移列為第四項，內容未修正。\n四、原第四項移列為第七項，內容未修正。\n五、增訂第五項，明確規定繳納義務人有數人時，應負連帶清償責任，避免互相推諉，確保費用求償。\n六、增訂第六項，參考土壤及地下水污染整治法第四十三條第五項立法例，增訂滯納金及罰鍰規定，明定每日按滯納金額加徵百分之零點五滯納金，逾期三十日處以新臺幣二十萬元以上一百萬元以下罰鍰，以強化費用繳納之執行力。"},{"bill":"202110179890000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將予強制執行之意旨及估計之代履行數額；必要時，得要求處置義務人提出處置計畫書，依直轄市、縣（市）主管機關或執行機關核定期程、內容執行：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列各款情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關指定期限內完成清除、處理及改善環境，或未於指定期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度及調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正說明如次：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條命義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法棄置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分併應載明估計之代履行數額，以符明確；其後續代履行之強制執行事宜，依行政執行法第三十四條等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，新增處置計畫書之提出及確實履行之義務。\n三、現行第二項至第四項已移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，新增修正條文第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達時，確保債權保全之有效性。另考量實務上無聲請假處分之需求，爰予刪除。\n六、新增修正條文第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等情形。\n七、新增修正條文第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之裁量基準等相關辦法。"},{"bill":"202110204880000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110207050000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110207590000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"201110206460000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110209830000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、修正代履行求償機制，無須實際清理完畢即可預估費用向義務人求償。\n二、將假扣押保全時點提前至處分送達後，並增訂逕為代履行之特定情形（如無意願或隱匿財產）。"},{"bill":"202110209810000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110209180000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、因非法棄置案件常衍生高額清理費，且現行須清理完成後始得求償，實務上易遭脫產規避，爰引入代履行制度、調整求償要件並提前保全程序，以落實污染者負責原則。\n二、第一項修正如下：\n(一)明確列舉處置義務人，並將「棄置」修正為「回填、堆置」。\n(二)納入代履行制度，得限期命義務人清理並預告代履行及費用。\n(三)必要時要求提出處置計畫書並確實執行。\n三、原第二項至第四項移列他條，爰予刪除。\n四、增訂第二項，授權機關得逕行採取應變措施，費用由義務人負擔。\n五、將債權保全規定提前，於行政處分送達後即得聲請假扣押，以防脫產並確保求償。\n六、增訂第四項，於無處置意願或能力等情形下，機關得逕行代履行。\n七、增訂第五項，授權中央主管機關訂定代履行、費用估算、計畫審查及保全措施等相關辦法。"},{"bill":"202110209760000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110211360000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110211710000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，處置計畫書涉及原住民族土地部分，核定前應適度徵詢當地部落或原住民族代表之意見，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：處置計畫書應納入「部落諮詢機制」。因廢棄物清理計畫涉及大規模機具進場或土地翻動，應尊重原鄉部落對環境復原方式之知情參與權。\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110211860000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110214910000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"202110214090000","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"},{"bill":"201110206460001","text":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)現行第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、現行第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。"}],"changed":true,"final":"直轄市、縣（市）主管機關或執行機關發現不依規定清除、處理之廢棄物，得以書面令下列處置義務人限期清除、處理及改善環境，並載明不依限履行將代為清除、處理、改善環境（以下簡稱代履行）之意旨及估計之代履行費用數額；必要時，得以書面限期令處置義務人提出處置計畫書及依直轄市、縣（市）主管機關或執行機關核定之期程、內容執行，並載明上開不依限履行之相關事項：\n一、事業。\n二、受託清除、處理廢棄物者。\n三、仲介非法清除、處理廢棄物者。\n四、容許或因重大過失致廢棄物遭非法回填、堆置於其土地之所有人、管理人或使用人。\n為避免污染危害發生或防止污染擴大，直轄市、縣（市）主管機關或執行機關得於前項處分作成前，逕行採取應變措施；所生採樣、檢測、清除、處理等必要費用，得以書面令處置義務人負擔。\n直轄市、縣（市）主管機關或執行機關得於前二項書面行政處分送達後，免提供擔保向行政法院聲請假扣押；實施假扣押後，有下列情形之一者，直轄市、縣（市）主管機關或執行機關應辦理該保全措施之解除：\n一、處置義務人已自行或由第三人提供相當擔保。\n二、處置義務人已清除、處理及改善環境或依核准之處置計畫書執行達一定程度。\n處置義務人有下列情形之一者，直轄市、縣（市）主管機關或執行機關得逕為代履行：\n一、無處置意願或能力。\n二、未於直轄市、縣（市）主管機關或執行機關依第一項所定期限內完成清除、處理及改善環境，或未於期限內提出處置計畫書。\n三、提出之處置計畫書不符規定或內容有欠缺，經直轄市、縣（市）主管機關或執行機關通知限期補正，屆期未補正或補正後仍不符規定。\n四、未依直轄市、縣（市）主管機關或執行機關核定之處置計畫書期程、內容執行。\n第一項、第二項及前項代履行費用之估算、應變措施必要費用之範圍、處置計畫書之格式、應載明事項、應檢附文件、補正、審查、核定、廢止、管理、第三項聲請假扣押之裁量基準、擔保之方式、數額與清除、處理及改善環境或依核准之處置計畫書執行達一定程度之認定及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、鑑於非法棄置廢棄物案件常衍生巨額清理費用，現行規定須直轄市、縣（市）主管機關或執行機關「已實際代為清理完成後」，始得向義務人求償。實務上常見處置義務人藉由脫產或解散公司等手段，規避清理責任，導致執行代履行之巨額清理費用求償無門。考量土地等環境資源之有限性及不可回復性，為落實污染者負責原則及有效、及時排除土地危險、危害狀態，以符環境正義，有必要納入代履行制度、調整機關求償要件及將聲請假扣押之保全程序時點提前。\n二、第一項修正如下：\n(一)原第一項應負清除、處理之義務人分列各款，以臻明確；並考量現行實務依本條令義務人清理之狀況，不限於廢棄物棄置情形，併將第四款「棄置」用語修正為「回填、堆置」。\n(二)納入代履行制度，直轄市、縣（市）主管機關或執行機關不待實際清理，於發現非法回填、堆置廢棄物行為，得以書面令處置義務人限期清理及改善環境，該處分並應載明不依限履行將代履行之意旨及估計之代履行費用數額，以符明確；其後續逾期未繳納代履行費用之移送行政執行事宜，依行政執行法第三十四條規定，適用第二章公法上金錢給付義務之執行等相關規定辦理。另「清除、處理」，包括廢棄物之收集、運輸與中間處理、最終處置及再利用等行為。\n(三)配合現行實務執行情形，增訂必要時，令處置義務人提出處置計畫書及確實履行之義務。\n三、第二項至第四項分別移列至修正條文第七十一條之一第四項、第七十一條之二第一項、第二項，爰予刪除。\n四、為避免現場回填、堆置之廢棄物造成環境風險或損害，參考土壤及地下水污染整治法第十五條第一項規定，增訂第二項，定明主管機關或執行機關得逕行採取應變措施，其必要費用由處置義務人負擔。\n五、原第一項後段債權保全規定移列至第三項，考量廢棄物清理費用通常相當龐大，處置義務人脫產風險極高，現行實務移送強制執行結果大多為義務人財產不足清償或無可供執行財產，若不即時保全扣押義務人財產，一旦義務人脫產，機關難以求償清理費用，最終可能由全民承擔。為維護土地等環境資源，爰參考民事訴訟法第五百二十二條第二項及關稅法第四十八條第二項、稅捐稽徵法第二十四條第二項規定，應由處置義務人負擔之代履行費用債權，縱附有條件（繫於處置義務人是否遵期清理之不確定事實），此預估代履行費用之債權，亦有聲請假扣押之必要，爰將聲請假扣押之時點修正提前至第一項、第二項之書面行政處分送達後，以確保債權保全之有效性，並定明應辦理保全措施解除之情形，以利依循。另考量實務上無聲請假處分之需求，爰予刪除。\n六、增訂第四項，定明機關得逕為代履行之情形。第一款所指無處置意願或能力，例如：處置義務人有逃匿之虞，或有隱匿、毀棄、處分財產之情事，或捏造債務或以其他不正當方法使其財產狀況不正確，或提出之處置計畫書顯無執行之可能等；處置義務人如有該款情形，縱直轄市、縣（市）主管機關或執行機關依第一項令清除、處理及改善環境或令提出處置計畫書之期限尚未屆至，為及時維護土地等環境資源並落實污染者負責原則，仍得逕為代履行，並由處置義務人負擔費用。\n七、增訂第五項，定明授權中央主管機關訂定代履行、應變措施費用之估算、處置計畫書之審查核定及聲請假扣押之裁量基準、處置義務人提出相當擔保或已清理廢棄物達一定程度之認定等相關事項之辦法。","review":null},{"no":"第七十一條之一","current":"第三項　第一項必要費用之求償權，優於一切債權及抵押權。","versions":[{"bill":"202110179890000","text":"處置義務人有數人者，應就土地遭非法回填、堆置廢棄物之清除、處理及環境之改善，負連帶責任。\n處置義務人為公司組織時，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優於一切債權及抵押權，不受扣押禁止處分效力之拘束，並因十年間不行使而消滅。","note":"一、本條新增。\n二、考量土地等環境資源之不可回復性及有限性，參考土壤及地下水污染整治法第三十一條規定，於第一項定明數處置義務人就回填、堆置廢棄物之清除、處理及改善環境義務（包括代履行費用、應變措施必要費用），負連帶責任。\n三、參考土壤及地下水污染整治法第四十三條規定，於第二項、第三項定明處置義務人為公司組織時，其負責人、控制公司或股東應負連帶責任，以避免實際應負責之人濫用公司人格而解免責任；並排除容許廢棄物回填、堆置於其管領土地之情形，明文土地所有人、管理人、使用人之內部求償機制。\n四、第四項定明代履行及應變措施相關費用債權之優先性，縱處置義務人財產已受刑事訴訟法第一百三十三條第六項扣押禁止處分，亦不受扣押效力拘束，行政執行機關仍得就義務人財產拍賣執行，以期受污染場址得儘速清理復原；另為落實司法改革國是會議決議並落實處置義務人責任，延長非法棄置案件請求權時效。"},{"bill":"202110204880000","text":"土地遭非法回填、堆置廢棄物之處置義務人有數人者，應就該廢棄物負連帶清除、處理及改善環境責任，並就代履行費用、應變措施必要費用負連帶清償責任。\n處置義務人為公司組織者，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優先於一切債權及抵押權受償，且不受扣押禁止處分效力之拘束；該債權請求權因十年間不行使而消滅。","note":"一、本條新增。\n二、考量土地等環境資源之不可回復性及有限性，參考土壤及地下水污染整治法第三十一條規定，增訂第一項定明數處置義務人就回填、堆置廢棄物之清除、處理及改善環境義務（包括代履行費用、應變措施必要費用），負連帶責任。\n三、參考土壤及地下水污染整治法第四十三條第三項、第四項規定，增訂第二項、第三項定明處置義務人為公司組織時，其負責人、控制公司或股東應負連帶責任，以避免實際應負責之人濫用公司人格而解免責任；並明定土地所有人、管理人、使用人之內部求償機制，及排除容許廢棄物回填、堆置於其管領土地之情形。\n四、現行第七十一條第三項規定移列第四項，考量加速復原環境之需求，定明代履行及應變措施相關費用債權之優先性，縱處置義務人財產已受刑事訴訟法第一百三十三條第六項扣押禁止處分，亦不受扣押效力拘束，行政執行機關仍得就義務人財產拍賣執行，以期受污染場址得儘速清理復原；另為落實司法改革國是會議決議並落實處置義務人責任，延長該債權請求權之時效為十年。"},{"bill":"202110207050000","text":"土地遭非法回填、堆置廢棄物之處置義務人有數人者，應就該廢棄物負連帶清除、處理及改善環境責任，並就代履行費用、應變措施必要費用負連帶清償責任。\n處置義務人為公司組織者，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優先於一切債權及抵押權受償，且不受扣押禁止處分效力之拘束；該債權請求權因十年間不行使而消滅。","note":"一、考量土地等環境資源之不可回復性及有限性，參考土壤及地下水污染整治法第三十一條規定，增訂第一項定明數處置義務人就回填、堆置廢棄物之清除、處理及改善環境義務（包括代履行費用、應變措施必要費用），負連帶責任。\n二、參考土壤及地下水污染整治法第四十三條第三項、第四項規定，增訂第二項、第三項定明處置義務人為公司組織時，其負責人、控制公司或股東應負連帶責任，以避免實際應負責之人濫用公司人格而解免責任；並明定土地所有人、管理人、使用人之內部求償機制，及排除容許廢棄物回填、堆置於其管領土地之情形。\n三、現行第七十一條第三項規定移列第四項，考量加速復原環境之需求，定明代履行及應變措施相關費用債權之優先性，縱處置義務人財產已受刑事訴訟法第一百三十三條第六項扣押禁止處分，亦不受扣押效力拘束，行政執行機關仍得就義務人財產拍賣執行，以期受污染場址得儘速清理復原；另為落實司法改革國是會議決議並落實處置義務人責任，延長該債權請求權之時效為十年。"},{"bill":"202110207590000","text":"土地遭非法回填、堆置廢棄物之處置義務人有數人者，應就該廢棄物負連帶清除、處理及改善環境責任，並就代履行費用、應變措施必要費用負連帶清償責任。\n處置義務人為公司組織者，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優先於一切債權及抵押權受償，且不受扣押禁止處分效力之拘束；該債權請求權因十年間不行使而消滅。","note":"一、考量土地等環境資源之不可回復性及有限性，參考土壤及地下水污染整治法第三十一條規定，增訂第一項定明數處置義務人就回填、堆置廢棄物之清除、處理及改善環境義務（包括代履行費用、應變措施必要費用），負連帶責任。\n二、參考土壤及地下水污染整治法第四十三條第三項、第四項規定，增訂第二項、第三項定明處置義務人為公司組織時，其 下水污染整治法第四十三條第三項、第四項規定，增訂第二項、第三項定明處置義務人為公司組織時，其負責人、控制公司或股東應負連帶責任，以避免實際應負責之人濫用公司人格而解免責任；並明定土地所有人、管理人、使用人之內部求償機制，及排除容許廢棄物回填、堆置於其管領土地之情形。\n三、現行第七十一條第三項規定移列第四項，考量加速復原環境之需求，定明代履行及應變措施相關費用債權之優先性，縱處置義務人財產已受刑事訴訟法第一百三十三條第六項扣押禁止處分，亦不受扣押效力拘束，行政執行機關仍得就義務人財產拍賣執行，以期受污染場址得儘速清理復原；另為落實司法改革國是會議決議並落實處置義務人責任，延長該債權請求權之時效為十年。"},{"bill":"202110209180000","text":"土地遭非法回填、堆置廢棄物之處置義務人有數人者，應就該廢棄物負連帶清除、處理及改善環境責任，並就代履行費用、應變措施必要費用負連帶清償責任。\n處置義務人為公司組織者，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優先於一切債權及抵押權受償，且不受扣押禁止處分效力之拘束；該債權請求權因十年間不行使而消滅。","note":"一、本條新增。\n二、參考相關法制，第一項明定多數處置義務人對清除、處理及環境改善（含代履行及應變費用）負連帶責任。\n三、增訂第二項、第三項，規範公司負責人、控制公司或股東之連帶責任，並明定內部求償機制及排除容許回填、堆置之情形，以防規避責任。\n四、原第七十一條第三項移列第四項，明定相關費用債權具優先性，不受刑事扣押限制，並延長請求權時效為十年，以加速環境復原。"},{"bill":"202110209760000","text":"土地遭非法回填、堆置廢棄物之處置義務人有數人者，應就該廢棄物負連帶清除、處理及改善環境責任，並就代履行費用、應變措施必要費用負連帶清償責任。\n處置義務人為公司組織者，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優先於一切債權及抵押權受償，且不受扣押禁止處分效力之拘束；該債權請求權因十年間不行使而消滅。","note":"一、本條新增。\n二、考量土地等環境資源之不可回復性及有限性，參考土壤及地下水污染整治法第三十一條規定，增訂第一項定明數處置義務人就回填、堆置廢棄物之清除、處理及改善環境義務（包括代履行費用、應變措施必要費用），負連帶責任。\n三、參考土壤及地下水污染整治法第四十三條第三項、第四項規定，增訂第二項、第三項定明處置義務人為公司組織時，其負責人、控制公司或股東應負連帶責任，以避免實際應負責之人濫用公司人格而解免責任；並明定土地所有人、管理人、使用人之內部求償機制，及排除容許廢棄物回填、堆置於其管領土地之情形。\n四、現行第七十一條第三項規定移列第四項，考量加速復原環境之需求，定明代履行及應變措施相關費用債權之優先性，縱處置義務人財產已受刑事訴訟法第一百三十三條第六項扣押禁止處分，亦不受扣押效力拘束，行政執行機關仍得就義務人財產拍賣執行，以期受污染場址得儘速清理復原；另為落實司法改革國是會議決議並落實處置義務人責任，延長該債權請求權之時效為十年。"},{"bill":"202110211360000","text":"土地遭非法回填、堆置廢棄物之處置義務人有數人者，應就該廢棄物負連帶清除、處理及改善環境責任，並就代履行費用、應變措施必要費用負連帶清償責任。\n處置義務人為公司組織者，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優先於一切債權及抵押權 且不受扣押禁止處分效力之拘束；該債權請求權因十年間不行使而消滅。","note":"一、考量土地等環境資源之不可回復性及有限性，參考土壤及地下水污染整治法第三十一條規定，增訂第一項定明數處置義務人就回填、堆置廢棄物之清除、處理及改善環境義務（包括代履行費用、應變措施必要費用），負連帶責任。\n二、參考土壤及地下水污染整治法第四十三條第三項、第四項規定，增訂第二項、第三項定明處置義務人為公司組織時，其負責人、控制公司或股東應負連帶責任，以避免實際應負責之人濫用公司人格而解免責任；並明定土地所有人、管理人、使用人之內部求償機制，及排除容許廢棄物回填、堆置於其管領土地之情形。\n三、現行第七十一條第三項規定移列第四項，考量加速復原環境之需求，定明代履行及應變措施相關費用債權之優先性，縱處置義務人財產已受刑事訴訟法第一百三十三條第六項扣押禁止處分，亦不受扣押效力拘束，行政執行機關仍得就義務人財產拍賣執行，以期受污染場址得儘速清理復原；另為落實司法改革國是會議決議並落實處置義務人責任，延長該債權請求權之時效為十年。"}],"changed":true,"final":"土地遭非法回填、堆置廢棄物之處置義務人有數人者，應就該廢棄物負連帶清除、處理及改善環境責任，並就代履行費用、應變措施必要費用負連帶清償責任。\n處置義務人為公司組織者，直轄市、縣（市）主管機關或執行機關得限期令其負責人、持有超過其已發行有表決權之股份總數或資本總額半數或直接或間接控制其人事、財務或業務經營之公司或股東繳納前條代履行及應變措施必要費用；處置義務人因合併、分割或其他事由消滅時，亦同。\n除因容許致廢棄物遭非法回填、堆置於其土地者外，土地所有人、管理人或使用人支出前條代履行及應變措施必要費用，得向其他處置義務人求償。\n代履行及應變措施必要費用之債權，優先於一切債權及抵押權受償，且不受扣押禁止處分效力之拘束；該債權請求權因十年間不行使而消滅。","finalWhy":"","review":null},{"no":"第七十一條之二","current":"第二項、第四項\n直轄市、縣（市）主管機關或執行機關依前項規定代為清除、處理廢棄物時，得不經土地所有人、管理人或使用人同意，強制進入公私場所進行有關採樣、檢測、清除或處理等相關措施。\n直轄市、縣（市）主管機關或執行機關代為清除、處理第一項廢棄物時，得委託適當公民營廢棄物清除處理機構清除、處理之。","versions":[{"bill":"202110179890000","text":"土地所有人、管理人或使用人對於直轄市、縣（市）主管機關或執行機關代履行與採取應變措施、進行採樣、檢測等相關措施及處置義務人對於處置計畫書之實施，應予配合。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；受託之廢棄物清除、處理、再利用機構或清除處理設施經原核發機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回堆、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，囑託土地登記主管機關於相關地籍資料註記；並於妥善清理後，囑託塗銷註記。","note":"一、本條新增。\n二、第一項參考現行條文第七十一條第二項規定，定明土地所有人、管理人或使用人應配合之義務。如有違反，並於第五十八條之一第二款增列處罰規定。\n三、第二項參考現行條文第七十一條第四項及空氣污染防制法第十四條規定，為使此非常態、非持續性產出之廢棄物得以有效、及時之清理，避免環境危害發生或擴大，爰定明直轄市、縣（市）主管機關或執行機關執行代履行或採取應變措施時，受託之合法廢棄物清除、處理、再利用機構或清除處理設施經原核發機關核准後，其受託清除、處理、再利用之項目及數量，不受原許可或同意、設置文件及環境影響評估相關管制規定之限制。\n四、第三項定明公開土地遭回填、堆置廢棄物之環境資訊，提升資訊透明，以保障善意第三人權益。如回填、堆置廢棄物已造成土地污染，土壤及地下水污染整治法所定主管機關已依法公告有關資訊，土地登記主管機關將另行註記土地污染資訊。"},{"bill":"202110204880000","text":"土地所有人、管理人或使用人應配合直轄市、縣（市）主管機關或執行機關代履行、採取應變措施、進行採樣、檢測等相關措施，及處置義務人依處置計畫書執行之行為，不得規避、妨礙或拒絕。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；該廢棄物清除、處理、再利用機構或清除處理設施經原核發許可或同意之機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回填、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，並囑託土地登記主管機關於相關地籍資料註記；於廢棄物經妥善清理後，囑託塗銷註記。","note":"一、本條新增。\n二、現行第七十一條第二項規定移列為第一項，並修正定明土地所有人、管理人或使用人應配合之義務。如有違反，並於修正條文第五十八條之一第二款增列處罰規定。\n三、現行第七十一條第四項規定移列為第二項，參考空氣污染防制法第十四條規定，為使此非常態、非持續性產出之廢棄物得以有效、及時之清理，避免環境危害發生或擴大，爰定明直轄市、縣（市）主管機關或執行機關執行代履行或採取應變措施時，受託之合法廢棄物清除、處理、再利用機構或清除處理設施經原核發機關核准後，其受託清除、處理、再利用之項目及數量，不受原許可或同意、設置文件及環境影響評估相關管制規定之限制。\n四、增訂第三項，定明直轄市、縣（市）主管機關或執行機關得公開土地遭回填、堆置廢棄物之環境資訊，提升資訊透明，以保障善意第三人權益。如回填、堆置廢棄物已造成土地污染，土壤及地下水污染整治法所定主管機關已依法公告有關資訊，土地登記主管機關將另行註記土地污染資訊。"},{"bill":"202110207050000","text":"土地所有人、管理人或使用人應配合直轄市、縣（市）主管機關或執行機關代履行、採取應變措施、進行採樣、檢測等相關措施，及處置義務人依處置計畫書執行之行為，不得規避、妨礙或拒絕。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；該廢棄物清除、處理、再利用機構或清除處理設施經原核發許可或同意之機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回填、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，並囑託土地登記主管機關於相關地籍資料註記；於廢棄物經妥善清理後，囑託塗銷註記。","note":"一、現行第七十一條第二項規定移列為第一項，並修正定明土地所有人、管理人或使用人應配合之義務。如有違反，並於修正條文第五十八條之一第二款增列處罰規定。\n二、現行第七十一條第四項規定移列為第二項，參考空氣污染防制法第十四條規定，為使此非常態、非持續性產出之廢棄物得以有效、及時之清理，避免環境危害發生或擴大，爰定明直轄市、縣（市）主管機關或執行機關執行代履行或採取應變措施時，受託之合法廢棄物清除、處理、再利用機構或清除處理設施經原核發機關核准後，其受託清除、處理、再利用之項目及數量，不受原許可或同意、設置文件及環境影響評估相關管制規定之限制。\n三、增訂第三項，定明直轄市、縣（市）主管機關或執行機關得公開土地遭回填、堆置廢棄物之環境資訊，提升資訊透明，以保障善意第三人權益。如回填、堆置廢棄物已造成土地污染，土壤及地下水污染整治法所定主管機關已依法公告有關資訊，土地登記主管機關將另行註記土地污染資訊。"},{"bill":"202110207590000","text":"土地所有人、管理人或使用人應配合直轄市、縣（市）主管機關或執行機關代履行、採取應變措施、進行採樣、檢測等相關措施，及處置義務人依處置計畫書執行之行為，不得規避、妨礙或拒絕。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；該廢棄物清除、處理、再利用機構或清除處理設施經原核發許可或同意之機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回填、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，並囑託土地登記主管機關於相關地籍資料註記；於廢棄物經妥善清理後，囑託塗銷註記。","note":"一、現行第七十一條第二項規定移列為第一項，並修正定明土地所有人、管理人或使用人應配合之義務。如有違反，並於修正條文第五十八條之一第二款增列處罰規定。\n二、現行第七十一條第四項規定移列為第二項，參考空氣污染防制法第十四條規定，為使此非常態、非持續性產出之廢棄物得以有效、及時之清理，避免環境危害發生或擴大，爰定明直轄市、縣（市）主管機關或執行機關執行代履行或採取應變措施時，受託之合法廢棄物清除、處理、再利用機構或清除處理設施經原核發 污染整治法所定主管機關已依法公告有關資訊，土地登記主管機關將另行註記土地污染資訊。"},{"bill":"202110214910000","text":"土地所有人、管理人或使用人應配合直轄市、縣（市）主管機關或執行機關代履行、採取應變措施、進行採樣、檢測等相關措施，及處置義務人依處置計畫書執行之行為，不得規避、妨礙或拒絕。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；該廢棄物清除、處理、再利用機構或清除處理設施經原核發許可或同意之機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回填、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，並囑託土地登記主管機關於相關地籍資料註記；於廢棄物經妥善清理後，囑託塗銷註記。","note":"一、本條新增。\n二、現行第七十一條第二項規定移列為第一項，並修正定明土地所有人、管理人或使用人應配合之義務。如有違反，並於修正條文第五十八條之一第二款增列處罰規定。\n三、現行第七十一條第四項規定移列為第二項，參考空氣污染防制法第十四條規定，為使此非常態、非持續性產出之廢棄物得以有效、及時之清理，避免環境危害發生或擴大，爰定明直轄市、縣（市）主管機關或執行機關執行代履行或採取應變措施時，受託之合法廢棄物清除、處理、再利用機構或清除處理設施經原核發機關核准後，其受託清除、處理、再利用之項目及數量，不受原許可或同意、設置文件及環境影響評估相關管制規定之限制。\n四、增訂第三項，定明直轄市、縣（市）主管機關或執行機關得公開土地遭回填、堆置廢棄物之環境資訊，提升資訊透明，以保障善意第三人權益。如回填、堆置廢棄物已造成土地污染，土壤及地下水污染整治法所定主管機關已依法公告有關資訊，土地登記主管機關將另行註記土地污染資訊。"},{"bill":"202110214090000","text":"土地所有人、管理人或使用人應配合直轄市、縣（市）主管機關或執行機關代履行、採取應變措施、進行採樣、檢測等相關措施，及處置義務人依處置計畫書執行之行為，不得規避、妨礙或拒絕。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；該廢棄物清除、處理、再利用機構或清除處理設施經原核發許可或同意之機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回填、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，並囑託土地登記主管機關於相關地籍資料註記；於廢棄物經妥善清理後，囑託塗銷註記。","note":"一、現行第七十一條第二項規定移列為第一項，並修正定明土地所有人、管理人或使用人應配合之義務。如有違反，並於修正條文第五十八條之一第二款增列處罰規定。\n二、現行第七十一條第四項規定移列為第二項，參考空氣污染防制法第十四條規定，為使此非常態、非持續性產出之廢棄物得以有效、及時之清理，避免環境危害發生或擴大，爰定明直轄市、縣（市）主管機關或執行機關執行代履行或採取應變措施時，受託之合法廢棄物清除、處理、再利用機構或清除處理設施經原核發機關核准後，其受託清除、處理、再利用之項目及數量，不受原許可或同意、設置文件及環境影響評估相關管制規定之限制。\n三、增訂第三項，定明直轄市、縣（市）主管機關或執行機關得公開土地遭回填、堆置廢棄物之環境資訊，提升資訊透明，以保障善意第三人權益。如回填、堆置廢棄物已造成土地污染，土壤及地下水污染整治法所定主管機關已依法公告有關資訊，土地登記主管機關將另行註記土地污染資訊。"},{"bill":"201110206460001","text":"土地所有人、管理人或使用人應配合直轄市、縣（市）主管機關或執行機關代履行、採取應變措施、進行採樣、檢測等相關措施，及處置義務人依處置計畫書執行之行為，不得規避、妨礙或拒絕。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；該廢棄物清除、處理、再利用機構或清除處理設施經原核發許可或同意之機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回填、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，並囑託土地登記主管機關於相關地籍資料註記；於廢棄物經妥善清理後，囑託塗銷註記。","note":"一、現行第七十一條第二項規定移列為第一項，並修正定明土地所有人、管理人或使用人應配合之義務。如有違反，並於修正條文第五十八條之一第二款增列處罰規定。\n二、現行第七十一條第四項規定移列為第二項，參考空氣污染防制法第十四條規定，為使此非常態、非持續性產出之廢棄物得以有效、及時之清理，避免環境危害發生或擴大，爰定明直轄市、縣（市）主管機關或執行機關執行代履行或採取應變措施時，受託之合法廢棄物清除、處理、再利用機構或清除處理設施經原核發機關核准後，其受託清除、處理、再利用之項目及數量，不受原許可或同意、設置文件及環境影響評估相關管制規定之限制。\n三、增訂第三項，定明直轄市、縣（市）主管機關或執行機關得公開土地遭回填、堆置廢棄物之環境資訊，提升資訊透明，以保障善意第三人權益。如回填、堆置廢棄物已造成土地污染，土壤及地下水污染整治法所定主管機關已依法公告有關資訊，土地登記主管機關將另行註記土地污染資訊。"}],"changed":true,"final":"土地所有人、管理人或使用人應配合直轄市、縣（市）主管機關或執行機關代履行、採取應變措施、進行採樣、檢測等相關措施，及處置義務人依處置計畫書執行之行為，不得規避、妨礙或拒絕。\n直轄市、縣（市）主管機關或執行機關代履行或採取應變措施，得委託適當廢棄物清除、處理、再利用機構或清除處理設施為之；該廢棄物清除、處理、再利用機構或清除處理設施經原核發許可或同意之機關核准後，得不受其許可或同意、指定文件項目、數量之限制；屬依環境影響評估法審查通過者，亦不受環境影響說明書、環境影響評估書及審查結論記載之限制。\n直轄市、縣（市）主管機關或執行機關得公開遭非法回填、堆置廢棄物之土地位置、廢棄物種類、數量及其他受污染情形，並囑託土地登記主管機關於相關地籍資料註記；於廢棄物經妥善清理後，囑託塗銷註記。","finalWhy":"","review":null},{"no":"第七十一條之三","current":null,"versions":[{"bill":"202110214090000","text":"經中央主管機關指定公告具高環境風險之事業或責任業者，應依規定對其運作風險投保責任保險。前項保險標的、最低金額及管理辦法由中央主管機關定之。","note":"一、本條新增。\n二、參考《毒性及關注化學物質管理法》第二十四條。確保非法棄置或意外發生時，環境復原經費能由保險即時支應，而非僅依賴事後脫產防堵。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第七十七條","current":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。","versions":[{"bill":"202110179890000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之條文，除第三十九條至第三十九條之五自公布後二年施行外，自公布日施行。","note":"考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行管理制度及運作方式之重大變革，爰增訂第四項緩衝期規定，定明前開規定自公布後二年施行，其餘條文自公布日施行，俾利相關配套法規訂修及實務運作調整。"},{"bill":"202110204880000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行管理制度及運作方式之重大變革，爰增訂第四項緩衝期規定，定明前開規定自公布後二年施行，俾利相關配套法規訂修及實務運作調整。\n二、第三十九條至第三十九條之五既係自公布後二年施行，其所對應之第五章罰則規定，於上開條文尚未生效前，尚無從作為處罰依據，為避免適用上孳生疑義，爰明定第五章有關第三十九條至第三十九條之五之處罰規定，亦同自公布後二年施行，俾利實務適用。\n三、於修正條文第三十九條至第三十九條之五規定施行前，事業廢棄物之再利用，仍依現行第三十九條及第三十九條之一規定辦理，若非合法之再利用行為，仍有第四十六條刑罰規定之適用；如為合法之再利用行為，僅違反再利用程序等規定，則依第五十二條、第五十三條行政罰規定裁處（最高法院一百十一年度台上字第二○八三號刑事判決參照），併予敘明。"},{"bill":"202110207050000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行管理制度及運作方式之重大變革，爰增訂第四項緩衝期規定，定明前開規定自公布後二年施行，俾利相關配套法規訂修及實務運作調整。\n二、第三十九條至第三十九條之五既係自公布後二年施行，其所對應之第五章罰則規定，於上開條文尚未生效前，尚無從作為處罰依據，為避免適用上孳生疑義，爰明定第五章有關第三十九條至第三十九條之五之處罰規定，亦同自公布後二年施行，俾利實務適用。\n三、於修正條文第三十九條至第三十九條之五規定施行前，事業廢棄物之再利用，仍依現行第三十九條及第三十九條之一規定辦理，若非合法之再利用行為，仍有第四十六條刑罰規定之適用；如為合法之再利用行為，僅違反再利用程序等規定，則依第五十二條、第五十三條行政罰規定裁處（最高法院一百十一年度台上字第二○八三號刑事判決參照），併予敘明。"},{"bill":"202110207590000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行管理制度及運作方式之重大變革，爰增訂第四項緩衝期規定，定明前開規定自公布後二年施行，俾利相關配套法規訂修及實務運作調整。\n二、第三十九條至第三十九條之五既係自公布後二年施行，其所對應之第五章罰則規定，於上開條文尚未生效前，尚無從作為處罰依據，為避免適用上孳生疑義，爰明定第五章有關第三十九條至第三十九條之五之處罰規定，亦同自公布後二年施行，俾利實務適用。\n三、於修正條文第三十九條至第三十九條之五規定施行前，事業廢棄物之再利用，仍依現行第三十九條及第三十九條之一規定辦理，若非合法之再利用行為，仍有第四十六條刑罰規定之適用；如為合法之再利用行為，僅違反再利用程序等規定，則依第五十二條、第五十三條行政罰規定裁處（最高法院一百十一年度台上字第二○八三號刑事判決參照），併予敘明。"},{"bill":"201110206460000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行管理制度及運作方式之重大變革，爰增訂第四項緩衝期規定，定明前開規定自公布後二年施行，俾利相關配套法規訂修及實務運作調整。\n二、第三十九條至第三十九條之五既係自公布後二年施行，其所對應之第五章罰則規定，於上開條文尚未生效前，尚無從作為處罰依據，為避免適用上孳生疑義，爰明定第五章有關第三十九條至第三十九條之五之處罰規定，亦同自公布後二年施行，俾利實務適用。\n三、於修正條文第三十九條至第三十九條之五規定施行前，事業廢棄物之再利用，仍依現行第三十九條及第三十九條之一規定辦理，若非合法之再利用行為，仍有第四十六條刑罰規定之適用；如為合法之再利用行為，僅違反再利用程序等規定，則依第五十二條、第五十三條行政罰規定裁處（最高法院一百十一年度台上字第二○八三號刑事判決參照），併予敘明。"},{"bill":"202110209830000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"定明再利用管理相關條文與罰則自公布後二年施行，以提供實務運作與法規配套調整之緩衝期。"},{"bill":"202110209810000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行管理制度及運作方式之重大變革，爰增訂第四項緩衝期規定，定明前開規定自公布後二年施行，俾利相關配套法規訂修及實務運作調整。\n二、第三十九條至第三十九條之五既係自公布後二年施行，其所對應之第五章罰則規定，於上開條文尚未生效前，尚無從作為處罰依據，為避免適用上孳生疑義，爰明定第五章有關第三十九條至第三十九條之五之處罰規定，亦同自公布後二年施行，俾利實務適用。\n三、於修正條文第三十九條至第三十九條之五規定施行前，事業廢棄物之再利用，仍依現行第三十九條及第三十九條之一規定辦理，若非合法之再利用行為，仍有第四十六條刑罰規定之適用；如為合法之再利用行為，僅違反再利用程序等規定，則依第五十二條、第五十三條行政罰規定裁處（最高法院一百十一年度台上字第二○八三號刑事判決參照），併予敘明。"},{"bill":"202110209180000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、因再利用管理制度全面改由中央統籌，屬重大變革，增訂第四項緩衝期，定明相關規定自公布後二年施行。\n二、配合前開條文尚未生效，相關罰則亦同延後二年施行，以避免適用爭議。\n三、過渡期間仍適用現行規定：非法再利用適用刑罰，合法但程序違規者依行政罰裁處。"},{"bill":"202110209760000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行管理制度及運作方式之重大變革，爰增訂第四項緩衝期規定，定明前開規定自公布後二年施行，俾利相關配套法規訂修及實務運作調整。\n二、第三十九條至第三十九條之五既係自公布後二年施行，其所對應之第五章罰則規定，於上開條文尚未生效前，尚無從作為處罰依據，為避免適用上孳生疑義，爰明定第五章有關第三十九條至第三十九條之五之處罰規定，亦同自公布後二年施行，俾利實務適用。\n三、於修正條文第三十九條至第三十九條之五規定施行前，事業廢棄物之再利用，仍依現行第三十九條及第三十九條之一規定辦理，若非合法之再利用行為，仍有第四十六條刑罰規定之適用；如為合法之再利用行為，僅違反再利用程序等規定，則依第五十二條、第五十三條行政罰規定裁處（最高法院一百十一年度台上字第二○八三號刑事判決參照），併予敘明。"},{"bill":"202110211860000","text":"本法自公布日施行。\n本法中華民國九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零一年十一月十三日修正之條文，自一百零一年九月六日施行。\n本法中華民國○年○月○日修正之第三十九條至第三十九條之五及第五章有關上開條文之處罰規定，自公布後二年施行。","note":"一、考量第三十九條至第三十九條之五所定再利用管理事權統一由中央主管機關統籌規範，除事業廢棄物再利用外，並擴及再利用產品流向及加工再製事業管理等相關事項，乃相較現行 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;

  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
