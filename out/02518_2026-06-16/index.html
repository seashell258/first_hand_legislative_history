<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>廢棄物清理法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

se,"final":"本法所稱廢棄物，指下列能以搬動方式移動之固態或液態物質或物品：\n一、被拋棄者。\n二、減失原效用、被放棄原效用、不具效用或效用不明者。\n三、於營建、製造、加工、修理、販賣、使用過程所產生目的以外之產物。\n四、製程產出物不具可行之利用技術或不具市場經濟價值者。\n五、其他經中央主管機關公告者。\n前項廢棄物，分下列二種：\n一、一般廢棄物：指事業廢棄物以外之廢棄物。\n二、事業廢棄物：指事業活動產生非屬其員工生活產生之廢棄物，包括有害事業廢棄物及一般事業廢棄物。\n(一)有害事業廢棄物：由事業所產生具有毒性、危險性，其濃度或數量足以影響人體健康或污染環境之廢棄物。\n(二)一般事業廢棄物：由事業所產生有害事業廢棄物以外之廢棄物。\n前項有害事業廢棄物認定標準，由中央主管機關會商中央目的事業主管機關定之。\n游離輻射之放射性廢棄物之清理，依原子能相關法令之規定。\n第二項之事業，係指農工礦廠（場）、營造業、醫療機構、公民營廢棄物清除處理機構、事業廢棄物共同清除處理機構、學校或機關團體之實驗室及其他經中央主管機關指定之事業。","finalWhy":null,"review":null},{"no":"第三條","current":"本法專用名詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及回收再利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、回收再利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","versions":[{"bill":"201110206460000","text":"本法用詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","note":"一、條次變更。\n二、序文酌作文字修正。\n三、配合本法由原「回收再利用」擴及整體資源循環，爰將第一款及第二款「回收再利用」修正為「循環利用」。"},{"bill":"201110206460001","text":"本法用詞，定義如下：\n一、再生資源：指原效用減失之物質，具經濟及循環利用技術可行性，並依本法公告或核准再使用或再生利用者。\n二、循環利用：指再生資源再使用或再生利用之行為。\n三、再使用：指未改變原物質形態，將再生資源直接重複使用或經過適當程序恢復原功用或部分功用後使用之行為。\n四、再生利用：指改變原物質形態或與其他物質結合，供作為材料、燃料、肥料、飼料、填料、土壤改良等用途或其他經中央目的事業主管機關認定之用途，使再生資源產生功用之行為。\n五、事業：指凡從事生產、製造、運輸、販賣、教育、研究、訓練、工程施工及服務活動之公司、行號、機構、非法人團體及其他經中央主管機關指定者。\n六、再生產品：指以一定比例以上之再生資源為原料所製成之產品。","note":"一、條次變更。\n二、序文酌作文字修正。\n三、配合本法由原「回收再利用」擴及整體資源循環，爰將第一款及第二款「回收再利用」修正為「循環利用」。"}],"changed":false,"final":"本法所稱指定清除地區，謂執行機關基於環境衛生需要，所公告指定之清除地區。","finalWhy":null,"review":null},{"no":"第四條","current":"本法所稱主管機關：在中央為行政院環境保護署；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","versions":[{"bill":"202110179890000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110204880000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110207050000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110207590000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"201110206460000","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"},{"bill":"201110206460000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110209830000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"配合行政院組織改造，修正中央主管機關為環境部。"},{"bill":"202110209810000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110209180000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110209760000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110211360000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110211860000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110214910000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"202110214090000","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"},{"bill":"201110206460001","text":"為達成資源永續利用，在可行之技術及經濟為基礎下，對於物質之使用，應優先考量減少產生廢棄物，失去原效用後應依序考量再使用，其次物質再生利用、能源回收及妥善處理。但經生命週期考量，可得最佳整體環境效益者，不在此限。","note":"一、條次變更。\n二、本法以推動資源循環為主，廢棄物管理回歸廢棄物清理法規範，爰酌作文字修正。\n三、所稱能源回收，指物質具有生質能、直接利用或經處理產生能源特性，供進行再生能源利用之行為。\n四、為達成資源循環目標，宣示物質使用優先順序，以利各級政府、國民、事業、團體共同推動及合作。"},{"bill":"201110206460001","text":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","note":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。"}],"changed":true,"final":"本法所稱主管機關：在中央為環境部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","finalWhy":"因應政府組織改造，原行政院環境保護署改制為環境部，爰修正本法之中央主管機關名稱。","review":null},{"no":"第五條","current":"本法所稱執行機關，為直轄市政府環境保護局、縣（市）環境保護局及鄉（鎮、市）公所。\n執行機關應設專責單位，辦理一般廢棄物之回收、清除、處理及廢棄物稽查工作。\n執行機關應負責規劃一般廢棄物回收、清除、處理用地，並協同相關機關優先配合取得用地。\n一般廢棄物之回收、清除、處理，在直轄市由直轄市政府環境保護局為之；在省轄市由省轄市環境保護局為之；在縣由鄉（鎮、市）公所負責回收、清除，由縣環境保護局負責處理，必要時，縣得委託鄉（鎮、市）公所執行處理工作。\n中華民國九十三年七月十四日前，縣環境保護局應依前項規定完成一般廢棄物工作調整，由縣環境保護局統一處理。\n第二項一般廢棄物回收項目，由中央主管機關定之。但直轄市、縣（市）主管機關得視轄區內特殊需要，增訂其他一般廢棄物回收項目，報請中央主管機關備查。","versions":[{"bill":"202110068620000","text":"本法所稱執行機關，為直轄市政府環境保護局、縣（市）環境保護局及鄉（鎮、市）公所。\n執行機關應設專責單位，辦理一般廢棄物之回收、清除、處理及廢棄物稽查工作。\n執行機關應負責規劃一般廢棄物回收、清除、處理用地，並協同相關機關優先配合取得用地。\n一般廢棄物之回收、清除、處理，在直轄市由直轄市政府環境保護局為之；在省轄市由省轄市環境保護局為之；在縣由鄉（鎮、市）公所負責回收、清除，由縣環境保護局負責處理，必要時，縣得委託鄉（鎮、市）公所執行處理工作。\n中華民國九十三年七月十四日前，縣環境保護局應依前項規定完成一般廢棄物工作調整，由縣環境保護局統一處理。\n第二項一般廢棄物回收項目，由中央主管機關定之。但直轄市、縣（市）主管機關得視轄區內特殊需要，增訂其他一般廢棄物回收項目，報請中央主管機關備查。\n受僱從事清潔工作人員管理及權益保障之辦法，由中央主管機關訂定之。","note":"一、增訂本條第七項。\n二、經查，全國約有三萬四千名清潔工作人員，負擔全國垃圾清運、災後清理及環境清潔之工作。清潔人員的工作是高污染、高危險及高工作量的三高行業。\n三、然，清潔人員之管理、權益保障及福利等等則缺乏一致性的法規，現行法規是由各地方政府分別訂定，產生同工不同酬之現象。中央主管機關應為全國清潔工作人員訂定「清潔人員管理及權益保障辦法」，全國一體適用，以保障全國清潔人員的勞動權益。\n四、爰擬具「廢棄物清理法第五條修正草案」，增訂第七項：「受僱從事清潔工作人員管理及權益保障之辦法，由中央主管機關訂定之」，以責由中央主管機關環境部訂定之。"},{"bill":"202110207110000","text":"本法所稱執行機關，為直轄市政府環境保護局、縣（市）環境保護局及鄉（鎮、市）公所。\n執行機關應設專責單位，辦理一般廢棄物之回收、清除、處理及廢棄物稽查工作。\n執行機關應負責規劃一般廢棄物回收、清除、處理用地，並協同相關機關優先配合取得用地。\n一般廢棄物之回收、清除、處理，在直轄市由直轄市政府環境保護局為之；在省轄市由省轄市環境保護局為之；在縣由鄉（鎮、市）公所負責回收、清除，由縣環境保護局負責處理，必要時，縣得委託鄉（鎮、市）公所執行處理工作。\n中華民國九十三年七月十四日前，縣環境保護局應依前項規定完成一般廢棄物工作調整，由縣環境保護局統一處理。\n第二項一般廢棄物回收項目，由中央主管機關定之。但直轄市、縣（市）主管機關得視轄區內特殊需要，增訂其他一般廢棄物回收項目，報請中央主管機關備查。\n第二項有關執行機關有關清潔人員之進用、薪給、考核、退休、撫卹、資遣、保險、福利、其他權益保障及人事管理事項，由中央主管機關訂定之。","note":"一、增列本條第七項。\n二、據統計，全國約有三萬四千名清潔人員，長期肩負廢棄物清運、災後環境復原及日常維護重任。該職業具備「高污染、高風險、高勞動量」之三高特性，工作環境極為艱辛。\n三、然現行清潔人員的管理、福利與權益保障，因缺乏全國統一之法源規範，目前均由各地方政府自行訂定，導致各地勞動條件不一，產生「同工不同酬」之不公平現況。中央主管機關實有必要制定全國一體適用的「清潔人員管理及權益保障辦法」，以落實對全體清潔人員勞動權益的保障。\n四、爰此，於第七項增訂：「受僱從事清潔工作人員管理及權益保障之辦法，由中央主管機關訂定之」，藉此明確法源依據，責成中央主管機關環境部統一制定相關規範。"},{"bill":"201110206460000","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。"},{"bill":"201110206460001","text":"事業於進行事業活動時，應循下列原則，以減少資源之消耗，抑制廢棄物之產生，及促進資源循環：\n一、選用清潔生產技術。\n二、對於原料之使用，應採取減少廢棄物產生之必要措施。\n三、原材料失去原效用後，應自行或供循環利用；無法循環利用者，應進行能源回收或妥善處理。\n四、從事物品、容器之製造、販賣之事業，有責任提升產品耐用年限及落實修繕服務，以抑制該物品、容器成為廢棄物，並應朝促使該產品利於資源循環之方向進行產品之研發、設計及標示材質種類。","note":"一、條次變更。\n二、配合本法由原「回收再利用」擴及整體資源循環，修正序文及第四款，將「資源回收再利用」、「回收再利用」修正為「資源循環」，並酌作文字修正。\n三、修正第三款將「回收再利用」修正為「循環利用」，理由同說明二；並依前條物質使用優先順序規定，新增「進行能源回收」，以符實務需求。"},{"bill":"202110016760000","text":"本法所稱執行機關，為直轄市政府環境保護局、縣（市）環境保護局及鄉（鎮、市）公所。\n執行機關應設專責單位，辦理一般廢棄物之回收、清除、處理及廢棄物稽查工作。\n執行機關應負責規劃一般廢棄物回收、清除、處理用地，並協同相關機關優先配合取得用地。\n一般廢棄物之回收、清除、處理，在直轄市由直轄市政府環境保護局為之；在省轄市由省轄市環境保護局為之；在縣由鄉（鎮、市）公所負責回收、清除，由縣環境保護局負責處理，必要時，縣得委託鄉（鎮、市）公所執行處理工作。\n中華民國九十三年七月十四日前，縣環境保護局應依前項規定完成一般廢棄物工作調整，由縣環境保護局統一處理。\n第二項一般廢棄物回收項目，由中央主管機關定之。但直轄市、縣（市）主管機關得視轄區內特殊需要，增訂其他一般廢棄物回收項目，報請中央主管機關備查。\n第二項有關執行機關有關清潔人員之進用、薪給、考核、退休、撫卹、資遣、保險、福利、其他權益保障及人事管理事項，由主管機關定之，並報請中央主管機關備查。","note":"一、新增第七項。\n二、全國約有三萬四千名清潔工作人員，擔任全國垃圾等之清運及環境清潔工作。清潔人員的工作是高污染、高危險及高工作量的三高行業。\n三、民國八十七年精省後，原由臺灣省政府訂定供地方政府遵循的《清潔隊員之管理要點及設置基準》隨之廢止，導致各地方政府制定各別管理辦法，造成全國各縣市清潔隊員的相關進用、管理、考核、勞動條件、福利等各行其是，並無一致標準，同工不同酬之不公平現象。\n四、爰擬具「廢棄物清理法第五條修正草案」，增訂第七項：有關清潔人員之進用、薪給、考核、退休、撫卹、資遣、保險、福利、其他權益保障及人事管理事項，由主管機關定之，並報請中央主管機關備查。"}],"changed":false,"final":"本法所稱執行機關，為直轄市政府環境保護局、縣（市）環境保護局及鄉（鎮、市）公所。\n執行機關應設專責單位，辦理一般廢棄物之回收、清除、處理及廢棄物稽查工作。\n執行機關應負責規劃一般廢棄物回收、清除、處理用地，並協同相關機關優先配合取得用地。\n一般廢棄物之回收、清除、處理，在直轄市由直轄市政府環境保護局為之；在省轄市由省轄市環境保護局為之；在縣由鄉（鎮、市）公所負責回收、清除，由縣環境保護局負責處理，必要時，縣得委託鄉（鎮、市）公所執行處理工作。\n中華民國九十三年七月十四日前，縣環境保護局應依前項規定完成一般廢棄物工作調整，由縣環境保護局統一處理。\n第二項一般廢棄物回收項目，由中央主管機關定之。但直轄市、縣（市）主管機關得視轄區內特殊需要，增訂其他一般廢棄物回收項目，報請中央主管機關備查。","finalWhy":null,"review":null},{"no":"第六條","current":"國民有其責任義務依循減少資源之消耗，抑制廢棄物之產生，及促進資源回收再利用之原則，儘可能延長用品之使用期限，配合使用再生製品及分類回收再生資源，藉此抑制製品成為廢棄物，並適當回收循環利用製品及再生資源。","versions":[{"bill":"201110206460000","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"},{"bill":"201110206460001","text":"國民應減少資源之消耗，抑制廢棄物之產生，儘可能延長產品使用年限，使用促進資源循環之產品或服務。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，爰修正國民配合事項規定，並酌作文字修正。"}],"changed":false,"final":"主管機關或目的事業主管機關依本法規定規劃設置廢棄物清理設施時，其用地涉及都市計畫變更者，主管機關、目的事業主管機關應協調都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用變更者，於報准徵收或撥用取得土地後，依法辦理變更編定。完成報編為廢棄物清理專區之土地，其屬公有者，得辦理撥用或出租、讓售與興辦人，不受土地法第二十五條規定之限制。","finalWhy":null,"review":null},{"no":"第七條","current":"主管機關應指定專責單位或人員，辦理再生資源回收再利用之政策制定、查核、宣導、訓練、輔導、評鑑及研究相關事宜；必要時，並得委託或委辦相關機關或機構辦理。\n目的事業主管機關得視實際需要指定專責單位或人員辦理前項所定相關工作；必要時，並得委託或委辦相關機關或機構辦理。","versions":[{"bill":"201110206460000","text":"主管機關及目的事業主管機關得委任所屬機關（構）、委託或委辦其他機關（構）、法人或團體，辦理本法規定之查核、審查、宣導、訓練、輔導、評鑑、獎勵、補助及研究相關事宜。","note":"一、條次變更。\n二、考量專責單位或人員之指定屬機關內部組織或事務分配，無須於作用法明文，爰刪除第一項前段及第二項前段規定。\n三、因應本法修正擴及整體資源循環面向，有整合公部門及民間資源協助辦理有關事項之必要，爰參考氣候變遷因應法第七條規定，整併及修正第一項、第二項後段規定，明定主管機關及目的事業主管機關得委任（託）、委辦之對象及事務範圍。"},{"bill":"201110206460000","text":"","note":"一、本條刪除。\n二、中央有關機關應推動資源循環及其權責事項之應辦理事項，已於修正條文第九條明文，爰予刪除。"},{"bill":"201110206460001","text":"主管機關及目的事業主管機關得委任所屬機關（構）、委託或委辦其他機關（構）、法人或團體，辦理本法規定之查核、審查、宣導、訓練、輔導、評鑑、獎勵、補助及研究相關事宜。","note":"一、條次變更。\n二、考量專責單位或人員之指定屬機關內部組織或事務分配，無須於作用法明文，爰刪除第一項前段及第二項前段規定。\n三、因應本法修正擴及整體資源循環面向，有整合公部門及民間資源協助辦理有關事項之必要，爰參考氣候變遷因應法第七條規定，整併及修正第一項、第二項後段規定，明定主管機關及目的事業主管機關得委任（託）、委辦之對象及事務範圍。"},{"bill":"201110206460001","text":"","note":"一、本條刪除。\n二、中央有關機關應推動資源循環及其權責事項之應辦理事項，已於修正條文第九條明文，爰予刪除。"}],"changed":false,"final":"直轄市、縣（市）主管機關，為聯合設置廢棄物處理場，辦理廢棄物清除、處理工作，得擬訂設置管理辦法，報經中央主管機關核定，組設區域性聯合清除、處理單位。","finalWhy":null,"review":null},{"no":"第八條","current":"主管機關及目的事業主管機關得自行或委託專業機構派員攜帶證明文件，進入事業或再生資源回收再利用之營運、工作或營業場所，檢查並要求提供有關資料。\n對於前項檢查及要求，相關業者不得規避、妨礙或拒絕。\n主管機關及目的事業主管機關委託專業機構單獨進行第一項檢查前，應將委託事項及依據公告之，並通知受檢場所。","versions":[{"bill":"201110206460000","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。"},{"bill":"201110206460000","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"},{"bill":"201110206460001","text":"主管機關或目的事業主管機關得派員攜帶證明文件，進入公私場所，實施本法所定資源循環相關產品、服務、營建工程、物品、包裝、容器製造、輸入、販賣、使用情形及再生資源、創新實驗運作或執行之檢查，或令其提供有關資料，受檢查者不得規避、妨礙或拒絕。\n主管機關或目的事業主管機關為實施前項之檢查，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、條次變更。\n二、因應本法修正擴及整體資源循環面向，參考氣候變遷因應法第四十條規定，整併第一項及第二項規定，修正主管機關及目的事業主管機關行政檢查之實施對象及範圍。另前條已含括行政檢查事務之權限移轉，其權限移轉及通知受檢場所等程序，回歸行政程序法相關規定辦理，爰刪除第一項、第三項委託專業機構檢查及程序規定。\n三、增訂第二項，定明相關機關（構）、法人或團體協助或提供資料之義務。"},{"bill":"201110206460001","text":"","note":"一、本條刪除。\n二、有關直轄市、縣（市）主管機關之權責已併入修正條文第十一條第三項，爰予刪除。"}],"changed":false,"final":"因天然災害、重大事故或其他急迫之情事，致現有廢棄物貯存、回收、清除、處理設施能量不足，而有污染環境或影響人體健康之虞時，中央主管機關應會同中央目的事業主管機關及有關機關，並報請行政院核准後，得指定廢棄物緊急清理之方法、設施、處所及其期限，不受第二十八條、第三十一條第一項第一款、第三十六條、第三十九條、第四十一條、水污染防治法第十三條、空氣污染防制法第二十四條、環境影響評估法第十六條、公司法第十五條、商業登記法第八條及都市計畫法、區域計畫法、促進產業升級條例有關土地使用管制規定之限制。","finalWhy":null,"review":null},{"no":"第九條","current":null,"versions":[{"bill":"201110206460000","text":"中央有關機關應推動資源循環，其權責事項如下：\n一、能源、製造及商業部門資源循環事項：由經濟部主辦；各中央目的事業主管機關協辦。\n二、科學園區資源循環事項：由國家科學及技術委員會主辦；各中央目的事業主管機關協辦。\n三、運輸部門資源循環事項：由交通部主辦；各中央目的事業主管機關協辦。\n四、農業部門資源循環事項：由農業部主辦；各中央目的事業主管機關協辦。\n五、建築部門資源循環事項：由內政部主辦；各中央目的事業主管機關協辦。\n六、工程部門資源循環事項：由各工程中央目的事業主管機關主辦；各中央目的事業主管機關協辦。\n七、環境部門資源循環事項：由環境部主辦；各中央目的事業主管機關協辦。\n八、綠色金融資源循環事項：由金融監督管理委員會及環境部主辦；各中央目的事業主管機關協辦。\n九、科技研發及推動資源循環事項：由國家科學及技術委員會及環境部主辦；各中央目的事業主管機關協辦。\n十、衛生福利部門資源循環事項：由衛生福利部主辦；各中央目的事業主管機關協辦。\n十一、其他資源循環事項：由中央主管機關報請行政院指定之。","note":"一、本條新增。\n二、由於資源循環議題具有跨領域、跨部門等特性，參考氣候變遷因應法第八條第二項規定，並參酌行政院一百十一年九月二十六日核定之「廢棄資源管理及資源化行動方案」，明確規範推動資源循環各中央有關機關之權責事項。\n三、第六款權責事項，各類工程之中央目的事業主管機關，原則依公共工程專業技師簽證規則第五條第二項所定之附表；非屬附表所列工程種類，則由個別工程之中央目的事業主管機關推動。\n四、第八款權責事項，除「綠色及轉型金融行動方案」中涉及推動資源循環之綠色金融措施相關事項由金融監督管理委員會主辦外，由環境部主辦。"},{"bill":"201110206460001","text":"中央有關機關應推動資源循環，其權責事項如下：\n一、能源、製造及商業部門資源循環事項：由經濟部主辦；各中央目的事業主管機關協辦。\n二、科學園區資源循環事項：由國家科學及技術委員會主辦；各中央目的事業主管機關協辦。\n三、運輸部門資源循環事項：由交通部主辦；各中央目的事業主管機關協辦。\n四、農業部門資源循環事項：由農業部主辦；各中央目的事業主管機關協辦。\n五、建築部門資源循環事項：由內政部主辦；各中央目的事業主管機關協辦。\n六、工程部門資源循環事項：由各工程中央目的事業主管機關主辦；各中央目的事業主管機關協辦。\n七、環境部門資源循環事項：由環境部主辦；各中央目的事業主管機關協辦。\n八、綠色金融資源循環事項：由金融監督管理委員會及環境部主辦；各中央目的事業主管機關協辦。\n九、科技研發及推動資源循環事項：由國家科學及技術委員會及環境部主辦；各中央目的事業主管機關協辦。\n十、衛生福利部門資源循環事項：由衛生福利部主辦；各中央目的事業主管機關協辦。\n十一、其他資源循環事項：由中央主管機關報請行政院指定之。","note":"一、本條新增。\n二、由於資源循環議題具有跨領域、跨部門等特性，參考氣候變遷因應法第八條第二項規定，並參酌行政院一百十一年九月二十六日核定之「廢棄資源管理及資源化行動方案」，明確規範推動資源循環各中央有關機關之權責事項。\n三、第六款權責事項，各類工程之中央目的事業主管機關，原則依公共工程專業技師簽證規則第五條第二項所定之附表；非屬附表所列工程種類，則由個別工程之中央目的事業主管機關推動。\n四、第八款權責事項，除「綠色及轉型金融行動方案」中涉及推動資源循環之綠色金融措施相關事項由金融監督管理委員會主辦外，由環境部主辦。"}],"changed":false,"final":"主管機關得自行或委託執行機關派員攜帶證明文件，進入公私場所或攔檢廢棄物、剩餘土石方清除機具，檢查、採樣廢棄物貯存、清除、處理或再利用情形，並命其提供有關資料；廢棄物、剩餘土石方清除機具應隨車持有載明廢棄物、剩餘土石方產生源及處理地點之證明文件，以供檢查。\n主管機關或其委託之執行機關依前項規定為行政檢查時，有下列情形之一者，得扣留清除機具、處理設施或設備，並得命該清除機具、處理設施或設備之所有人或使用人限期清除處理。必要時，並得使用或限制使用其動產、不動產或斷絕其營業所必須之自來水、電力或其他能源之處分：\n一、公私場所之廢棄物、剩餘土石方或其清除機具、處理設施或設備有嚴重污染之虞。\n二、清除機具裝載之廢棄物、剩餘土石方有嚴重污染之虞。\n前項扣留清除機具、處理設施或設備作業相關規定，由中央主管機關定之。","finalWhy":null,"review":null},{"no":"第十條","current":null,"versions":[{"bill":"201110206460000","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"},{"bill":"201110206460001","text":"目的事業主管機關應輔導事業規劃導入源頭減量及資源循環推動機制，並培育資源循環技術研發人才及推廣教育。","note":"一、本條新增。\n二、配合修正條文第九條定明中央各部會權責，增訂目的事業主管機關應負輔導、人才培育及推廣教育之責。"}],"changed":false,"final":"依前條第二項規定扣留之清除機具、處理設施或設備，於其所貯存、清除、處理或再利用之廢棄物、剩餘土石方已無嚴重污染之虞，或該清除機具、處理設施或設備之所有人或使用人妥善清除處理其廢棄物、剩餘土石方，並於繳納清除機具、處理設施或設備拖吊及保管等相關費用後發還。\n扣留清除機具、處理設施或設備之期間，以一年為限。但情形特殊者，得報經上級主管機關核准延長一次。\n第一項之清除機具、處理設施或設備拖吊及保管等相關費用之收費方式及標準，由直轄市、縣（市）主管機關定之。","finalWhy":null,"review":null},{"no":"第十條之一","current":null,"versions":[{"bill":"202110179890000","text":"為防止營建剩餘土石方非法棄置，營建剩餘土石方中央主管機關應建立包含營建工地施工廠商、清運業者及收容處理場所之流向管理機制，確保其產出、運送及最終處置過程均具可追蹤性。\n經營建剩餘土石方中央主管機關指定公告之施工廠商、清運業者及收容處理場所，應於一定期限辦理下列事項：\n一、施工廠商及收容處理場所，應檢具營建剩餘土石方處理計畫，送營建剩餘土石方直轄市、縣（市）主管機關或公共工程主辦（管）機關審查核准後，始得清運或再利用營建剩餘土石方；與營建剩餘土石方清運或再利用有關事項變更時，亦同。\n二、施工廠商及收容處理場所，應以規定之網路傳輸方式，向營建剩餘土石方中央主管機關申報營建剩餘土石方之來源、種類、數量及流向。\n三、清運業者載運營建剩餘土石方之清除機具，應裝置即時追蹤系統並經審驗通過及維持正常運作。\n四、收容處理場所應具備執行營建剩餘土石方之再利用設施。\n前項營建剩餘土石方處理計畫之提報、審查、核准事項、變更、廢止或管理；網路申報格式、項目、內容、頻率與即時追蹤系統設備規格、審驗、管理及運作方式，及收容處理場所設置條件、設施、管理及其他應遵行事項之辦法，由營建剩餘土石方中央主管機關定之。\n營建剩餘土石方直轄市、縣（市）主管機關及工程主辦（管）機關為實施第一項行政檢查，對於施工廠商、清運業者、收容處理場所及清除機具，所為攔檢、檢查、採樣或命提供有關資料，準用第九條第一項規定。","note":"一、本條新增。\n二、隨著國家都市發展進程，建築工程日益增加，為防止營建剩餘土石方遭任意棄置，造成環境污染，特於本條增訂專用於營建剩餘土石方管理之規定，提供營建剩餘土石方中央主管機關、直轄市、縣（市）主管機關及工程主辦（管）機關適用。\n三、第一項定明營建剩餘土石方中央主管機關應建立全流向管理機制，以確保營建剩餘土石方之產出、運送及最終處置全程可追蹤，說明如下：\n(一)任意棄置營建剩餘土石方之行為，現行司法實務認為仍適用本法第四十一條及第四十六條之處罰。\n(二)另考量內政部所定「營建剩餘土石方處理方案」位階僅為行政規則，強制力不足，且地方自治法規相關營建剩餘土石方流向管理規範密度不盡相同。\n(三)參考內政部擬具短、中、長期因應方式：「短期強化現行法令管理機制加強查處；中期修訂廢棄物清理法統一營建剩餘土石方全流向管理機制；長期再行研議推動營建剩餘土石方專法立法。」，爰配合於本法增訂之。\n四、為落實營建剩餘土石方流向管理，爰增訂第二項，說明如下：\n(一)增訂第一款，課予施工廠商及收容處理場所應提報營建剩餘土石方處理計畫。\n(二)增訂第二款，課予施工廠商及收容處理場所應進行網路申報。\n(三)增訂第三款，課予清運業者之清除機具裝置即時追蹤系統。\n(四)增訂第四款，課予收容處理場所設置能再利用營建剩餘土石方設施之義務。\n五、基於第二項流向管理相關義務要求切實執行，為營建剩餘土石方主管機關監督管理事項，爰於第三項授權營建剩餘土石方中央主管機關訂定分別有關施工廠商、清運業者、收容處理場所有關營建剩餘土石方之處理計畫、網路申報、即時追蹤系統裝置運作及再利用設施設置之管理規定。\n六、第四項規定營建剩餘土石方地方主管機關或工程主辦機關進行相關查核時，準用第九條行政檢查之規定。並依「營建剩餘土石方處理方案－參、剩餘土石方處理方針」，「建築工程及民間工程剩餘土石方處理」與「公共工程剩餘土石方處理」，應分別向營建剩餘土石方直轄市、縣（市）主管機關及工程主辦（管）機關辦理相關管制文件，為符合現行管理機制。惟並非每個工程主辦（管）機關均設有裁處單位，故違規裁罰仍移請營建剩餘土石方直轄市、縣（市）主管機關裁處。\n七、營建剩餘土石方之清運係指自營建工地或土資場清運營建剩餘土石方之行為；營建剩餘土石之再利用係指將營建剩餘土石方進行回收、分類、加工、煆燒、堆置、填埋或送交後端再利用之行為。\n八、營建剩餘土石方處理計畫係載明施工廠商及收容處理場所有關營建剩餘土石方清運或再利用之執行方式。\n九、對於未檢具營建剩餘土石方處理計畫送營建剩餘土石方直轄市、縣（市）主管機關或公共工程主辦（管）機關審查核准者，課予施工廠商不得自營建工地清運離場、課予收容處理場所不得進行營建剩餘土石方再利用行為。"},{"bill":"202110204880000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"},{"bill":"202110207050000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"},{"bill":"202110207590000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行 、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之 土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料），以利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業"},{"bill":"202110209180000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬等科技執法措施，理由如下：\n(一)因應環保犯罪手法日益複雜，且土地等環境資源具有限性與不可回復性，一旦污染將造成高額復原成本。為強化非法棄置廢棄物之查緝能力，有必要導入現代科技工具，授權主管機關得蒐集、處理及利用相關資料。\n(二)基於比例原則，相關設備之設置以不法行為頻繁或具合理風險之公共場所為限，並應依客觀事實判斷，例如犯罪熱區或跨縣市運輸要道等。\n(三)可運用之科技工具，包括監視系統、車牌辨識、GPS、電子聯單、ETC系統，及必要之現場檢測設備等。\n三、為利查核與追查不法行為，第二項明定相關機關（構）、法人及團體之協助義務，以強化執法效能。"},{"bill":"202110209760000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"},{"bill":"202110211360000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。\n第一項科技執法設備之建置與維護經費，得由中央主管機關編列預算或由環境保護基金專款補助之。\n主管機關依第二項規定取得之資料，僅得作為環境污染調查之用，資料之保存期限與銷毀作業準則，由中央主管機關定之。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"},{"bill":"202110211710000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。\n中央主管機關應優先補助原住民族地區建置第一項之監視攝錄系統及其他科技工具；其補助對象、申請程序、經費撥付及監督管理之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、考量原住民族地區地理條件特殊，非法清運車輛常利用交通要道非法回填。突破人力巡查限制，有必要導入電子圍籬科技執法，介接警政監控系統、車牌辨識或GPS，掌握跨縣市交通要道之廢棄物動向，於危害發生前及時追查，並保障環境資源，鑑於原鄉土地資源有限性及不可回復性，必須運用現代科技手段預防不法行為。\n三、補足偏遠地區預算缺口：\n(一)因原住民族地區多地處偏遠且腹地廣闊，地方政府（鄉、鎮、市公所）財政普遍困窘，難以獨力負擔電子圍籬、車牌辨識系統（ETC）或GPS流向追蹤等高昂科技執法設備之建置及後續維護成本。\n(二)落實環境正義與空間防護：非法業者常利用原鄉土地巡查人力不足之弱點，於深夜或偏僻聯外道路進行非法回填。中央政府經費專款補助，可確保電子圍籬之監控路網覆蓋原住民族土地，防止成為環境犯罪法外之地。\n(三)提升科技治理效能：修正導入電子圍籬等科技執法措施（如介接警政監控、車牌辨識等），對於環境資源有限且具不可回復性之原民地區，具有及時追查與防堵不法之必要性，明確確保執法手段與科技發展同步。\n(四)符合《原住民族基本法》精神：依《原住民族基本法》第二十二條，政府應保障原住民族之生態環境保護權。增訂補助條文係政府履行保護原住民族地區自然資源義務，確保原住民族土地不因外部廢棄物非法棄置而受損。"},{"bill":"202110211860000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"},{"bill":"202110214910000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"},{"bill":"202110214090000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n前項監視攝錄系統之設置與攝錄影音資料之蒐集、處理、利用、查閱、保存方式與期限及其他相關事項之辦法，由中央主管機關定之。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為確保廢棄物流向，防止污染或危害環境之證據之保存，以利責任歸屬，保障當事人之權益，於第二項授權中央主關機關就監視攝錄系統之設置、管理等事項訂定辦法予以規範。\n四、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"},{"bill":"201110206460001","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","note":"一、本條新增。\n二、第一項導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所定監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為或辦理查核作業，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，於第二項定明相關機關（構）、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）。"}],"changed":true,"final":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料。","finalWhy":"","review":null},{"no":"第十條之二","current":null,"versions":[{"bill":"202110179890000","text":"為掌握廢棄物流向，防止污染或危害環境案件發生，主管機關對於經常發生或經合理判斷可能發生非法清除、回填、堆置、再利用、處理廢棄物之道路或其他公共場所，得自行、協調相關機關（構）裝設或利用監視攝錄系統及其他科技工具蒐集、處理及利用資料。\n主管機關、執行機關或目的事業主管機關就本法規定事項所實施之檢查、採樣及查證，得請求有關機關、法人、團體協助或提供必要之資料。\n依前二項規定取得之個人資料，應辦理安全維護事項，防止個人資料被竊取、竄改、毀損、滅失或洩漏；其個人資料檔案安全維護事項、管理機制、應採取之措施及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項增訂導入電子圍籬科技執法措施，理由如下：\n(一)因應環保犯罪手法日新月異，考量土地等環境資源之有限性及不可回復性，為避免不法行為造成環境污染或危害，致場址清理及環境復原耗費且所費不貲。基於此特定目的，為有效追查非法清理廢棄物之行為，亟需將因應現代科技發展之手段導入執法作為，爰增訂主管機關得運用監視攝錄系統或其他科技工具蒐集、處理及利用資料。\n(二)基於比例原則要求，主管機關自行或協調裝設監視攝錄系統或其他科技工具，限於經常發生或經合理判斷可能發生不法行為之公共場所；所謂合理、可能之判斷，非主觀臆測或憑空想像，而係依經驗法則、客觀情狀判斷之，包括：犯罪熱區、非法清運機具行經之跨縣市交通要道等。\n(三)所指監視攝錄系統及其他科技工具，例如：介接警政機關所設攝錄影監視器或車牌辨識系統、內政部國土管理署營建剩餘土石方之資訊服務中心、GPS系統、電子聯單系統、交通部高速公路局或公路局所設ETC電子標籤辨識之系統等設施或設備，或使用攜帶式X射線螢光光譜儀、地電阻等調查用科技設備。\n三、為利主管機關、執行機關或目的事業主管機關追查不法行為，參考兒童及少年福利與權益保障法第七十條、入出國及移民法第三十七條、發展觀光條例第三十七條之一等規定，第二項定明相關機關、法人、團體協助或提供資料之義務（例如：協助不法行為現場查處、提供責任業者稅籍資料）；其目的事業主管機關，包括前條營建剩餘土石方主管機關或工程主辦機關。\n四、為合理利用資料，第三項增訂授權由中央主管機關訂定個人資料檔案安全維護事項、管理機制、應採取之措施及其他相關事項之辦法。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十一條","current":null,"versions":[{"bill":"201110206460000","text":"中央主管機關應依我國環境狀況、資源循環目標，參酌國際現況與國內情勢變化及第九條分工事項，會商中央目的事業主管機關擬訂國家整體資源循環計畫（以下簡稱資源循環計畫），報請行政院核定後實施，並對外公開，且至少每五年檢討一次。\n中央主管機關及中央目的事業主管機關應依前項資源循環計畫推動資源循環，由中央主管機關綜整各中央目的事業主管機關推動情形，每年編寫資源循環推動成果報告，報請行政院核定後，對外公開。\n直轄市、縣（市）主管機關應依第一項資源循環計畫，擬訂資源循環行動計畫（以下簡稱行動計畫），報請中央主管機關核定後實施，並對外公開，且至少每五年檢討一次。\n直轄市、縣（市）主管機關應每年編寫行動計畫成果報告，對外公開。","note":"一、本條新增。\n二、考量資源循環事務之推動，應有整體性指導方針，爰於第一項定明中央主管機關應評估國內外各項有關因素，擬訂國家整體資源循環計畫；並定明應對外公開及定期檢討，以利民眾參與及符合實際需求。\n三、為利國人瞭解資源循環推動成果，爰於第二項定明中央主管機關應彙整各中央目的事業主管機關資源循環推動情形，每年製作成果報告並對外公開。\n四、考量地方政府亦應配合中央政策推動資源循環事務，爰於第三項及第四項定明直轄市、縣（市）主管機關應擬訂行動計畫、定期檢討及編寫製作成果報告，並對外公開。"},{"bill":"201110206460001","text":"中央主管機關應依我國環境狀況、資源循環目標，參酌國際現況與國內情勢變化及第九條分工事項，會商中央目的事業主管機關擬訂國家整體資源循環計畫（以下簡稱資源循環計畫），報請行政院核定後實施，並對外公開，且至少每五年檢討一次。\n中央主管機關及中央目的事業主管機關應依前項資源循環計畫推動資源循環，由中央主管機關綜整各中央目的事業主管機關推動情形，每年編寫資源循環推動成果報告，報請行政院核定後，對外公開。\n直轄市、縣（市）主管機關應依第一項資源循環計畫，擬訂資源循環行動計畫（以下簡稱行動計畫），報請中央主管機關核定後實施，並對外公開，且至少每五年檢討一次。\n直轄市、縣（市）主管機關應每年編寫行動計畫成果報告，對外公開。","note":"一、本條新增。\n二、考量資源循環事務之推動，應有整體性指導方針，爰於第一項定明中央主管機關應評估國內外各項有關因素，擬訂國家整體資源循環計畫；並定明應對外公開及定期檢討，以利民眾參與及符合實際需求。\n三、為利國人瞭解資源循環推動成果，爰於第二項定明中央主管機關應彙整各中央目的事業主管機關資源循環推動情形，每年製作成果報告並對外公開。\n四、考量地方政府亦應配合中央政策推動資源循環事務，爰於第三項及第四項定明直轄市、縣（市）主管機關應擬訂行動計畫、定期檢討及編寫製作成果報告，並對外公開。"}],"changed":false,"final":"一般廢棄物，除應依下列規定清除外，其餘在指定清除地區以內者，由執行機關清除之：\n一、土地或建築物與公共衛生有關者，由所有人、管理人或使用人清除。\n二、與土地或建築物相連接之騎樓或人行道，由該土地或建築物所有人、管理人或使用人清除。\n三、因特殊用途，使用道路或公共用地者，由使用人清除。\n四、火災或其他災變發生後，經所有人拋棄遺留現場者，由建築物所有人或管理人清除；無力清除者，由執行機關清除。\n五、建築物拆除後所遺留者，由原所有人、管理人或使用人清除。\n六、家畜或家禽在道路或其他公共場所便溺者，由所有人或管理人清除。\n七、化糞池之污物，由所有人、管理人或使用人清除。\n八、四公尺以內之公共巷、弄路面及水溝，由相對戶或相鄰戶分別各半清除。\n九、道路之安全島、綠地、公園及其他公共場所，由管理機構清除。","finalWhy":null,"review":null},{"no":"第十二條","current":"中央主管機關應設再生資源回收再利用促進委員會（以下簡稱委員會），負責審議主管機關及目的事業主管機關所擬有關再生資源回收再利用重大政策、措施、有關源頭管理章各條公告指定事項與執行及運作之協調、評估等事宜。\n委員會置主任委員一人，由行政院環境保護署署長擔任；委員任期二年，由相關政府機關、學者專家及環境保護團體代表組成。其中學者專家及環境保護團體代表不得少於委員會人數二分之一。委員會委員、其配偶及直系血親於其任期中及該任期屆滿後三年內，應迴避其任期中所審核之再生資源回收再利用相關產業之執行及運作事宜。\n委員會之組織規程由行政院環境保護署擬定，報請行政院核定後發布之。","versions":[{"bill":"201110206460000","text":"中央主管機關為執行前條第一項至第三項職權，得邀集相關政府機關、學者專家及環境保護團體代表組成資源循環推動會，提供諮詢意見。","note":"一、條次變更。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，並配合推動會之設置，爰整併第一項及第二項規定，定明其成員組成。\n三、為賦予推動會實務運作彈性，第二項有關推動會召集人、任期及成員組成之比例，另於推動會設置要點規定，爰予刪除；另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。\n四、推動會為任務編組，無需以組織規程規範，爰刪除第三項規定。"},{"bill":"201110206460001","text":"中央主管機關為執行前條第一項至第三項職權，得邀集相關政府機關、學者專家及環境保護團體代表組成資源循環推動會，提供諮詢意見。","note":"一、條次變更。\n二、為賦予資源循環推動會（以下簡稱推動會）成立依據及明確其功能角色，並配合推動會之設置，爰整併第一項及第二項規定，定明其成員組成。\n三、為賦予推動會實務運作彈性，第二項有關推動會召集人、任期及成員組成之比例，另於推動會設置要點規定，爰予刪除；另考量推動會任務為諮詢性質，已無審核權責，爰刪除第二項後段利益迴避相關規定。\n四、推動會為任務編組，無需以組織規程規範，爰刪除第三項規定。"}],"changed":false,"final":"一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備及再利用，應符合中央主管機關之規定，其辦法，由中央主管機關定之。\n執行機關得視指定清除地區之特性，增訂前項一般廢棄物分類、貯存、排出之規定，並報其上級主管機關備查。","finalWhy":null,"review":null},{"no":"第十三條","current":"目的事業主管機關應輔導事業回收再利用再生資源。\n中央目的事業主管機關並得視產業發展狀況公告指定產品、營建工程、或事業別及其規模於研發、設計、製造、生產、銷售或工程施工等階段，應遵行經指定之下列事項：\n一、使用易於分解、拆解或回收再利用之材質、規格或設計。\n二、使用一定比例或數量之再生資源。\n三、使用可重複填充之容器。\n四、其他經中央目的事業主管機關會商中央主管機關指定之事項。\n前項公告指定之產品或營建工程、業別、材質、規格、一定比例或數量及其實施方式等，由中央目的事業主管機關會商中央主管機關定之。","versions":[{"bill":"201110206460000","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。"},{"bill":"201110206460001","text":"為提升產品與營建工程永續性、資源使用效率及延長使用壽命，中央主管機關應規劃產品及營建工程之綠色設計原則，其內容包括下列項目：\n一、使用單一、易於分解、拆解或資源循環之材質。\n二、使用一定比率或數量之再生粒（材）料。\n三、易維修、可升級或提升耐用性。\n四、禁止或限制使用有害環境物質。\n五、營建工程源頭現場分類減少廢棄物。\n六、其他於生命週期節約能資源使用及減少廢棄物之設計。\n中央主管機關應就前項綠色設計原則之內容、項目及其他相關事項，訂定綠色設計準則。\n中央目的事業主管機關應依第一項綠色設計原則，檢討所主管之相關法令，並輔導事業遵行。","note":"一、條次變更。\n二、第一項目的事業主管機關之輔導權責，已於修正條文第十條明文，爰予刪除。\n三、第二項移列為第一項，為提升產品及營建工程永續性、資源使用效率及延長使用壽命，並參酌歐盟二○二四年永續產品生態設計規範（ESPR），爰規範中央主管機關應規劃我國產品及營建工程之綠色設計原則，並定明其包含之項目，說明如下：\n(一)材質單一設計有利於材料回收再製造，爰於第一款增訂材質單一規定；另有關規格或設計事項，已分別含納於修正條文第二款至第六款，爰予刪除。\n(二)參考現行市售產品製造實務運作模式，修正第二款，將再生資源修正為再生粒（材）料，並酌作文字修正。\n(三)配合修正條文第十六條已增訂促進容器重複使用之相關管理機制，爰刪除第三款規定。\n(四)為提升產品可維修性及耐用性，增列第三款，導入延長使用之設計。\n(五)為接軌國際禁止或限制使用有害環境物質之規範，增列第四款。\n(六)為提升營建廢棄物之循環，增列第五款，導入營建工地源頭分類管理。\n(七)第四款移列第六款並酌修文字，定明其他節約能資源使用及減少廢棄物設計之概括規定，例如：電子電器產品需具一定能效標準節約能源使用或接軌國際採用標準規格提升通用性等設計。\n四、增訂第二項，定明中央主管機關應就產品及營建工程之綠色設計原則訂定綠色設計準則。\n五、產品及營建工程強制實施綠色設計之相關規定，已於修正條文第十四條及第十五條分別明文，爰刪除第三項。\n六、增訂第三項，定明中央目的事業主管機關應配合綠色設計原則檢討相關法令及輔導事業。"}],"changed":false,"final":"各級執行機關，應視實際需要，於適當地點及公共場所，設一般廢棄物回收、貯存設備。","finalWhy":null,"review":null},{"no":"第十四條","current":null,"versions":[{"bill":"201110206460000","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，說明如下：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生料證明等內容。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。"},{"bill":"201110206460001","text":"中央主管機關得指定公告一定種類、規模之產品應遵行綠色設計準則指定項目，其製造、輸入業者應於公告所定期限檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n非屬前項指定公告之產品，其製造、輸入業者得自願遵行綠色設計準則，並檢具產品綠色設計文件向中央主管機關申請核定符合綠色設計準則。\n依第一項指定公告之產品應使用一定比率或數量再生粒（材）料者，其製造、輸入業者應提送再生粒（材）料來源、使用總量、產品產量及銷量等資料報中央主管機關備查。\n第一項、第二項之申請程序、產品綠色設計文件應記載事項、審查、核定事項、變更、查核、抽樣檢驗、廢止，與前項資料備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項授權中央主管機關得公告特定產品強制性實施綠色設計，說明如下：\n(一)參酌歐盟永續產品生態設計規範（ESPR）投放市場產品均須符合生態化設計要求之精神，以及歐盟電池法明定依指定年限分階段提高電池之鎳、鈷、鉛等再生料使用比率等強制性規定，爰增訂之。\n(二)所定應遵行綠色設計準則指定項目，例如產品使用單一或易於資源循環之材質、使用一定比率再生材料或採行易維修、可升級等提升耐用性設計等。\n(三)所定產品綠色設計文件，包含指定項目符合情形評估資料、使用再生料證明等內容。\n三、為鼓勵產品之製造、輸入業者自願實施綠色設計，爰於第二項規定非屬指定公告產品亦得申請核定符合綠色設計準則。\n四、為瞭解特定產品使用再生粒（材）料之情形，爰於第三項規定業者應提報相關資料送中央主管機關備查；其提報資料如再生料數量購買證明、國內外第三方驗證再生料來源或驗證文件等。\n五、第四項授權中央主管機關訂定強制與自願實施產品綠色設計申請核定及使用再生粒（材）料備查之辦法；自願實施產品綠色設計倘未依中央主管機關核定事項辦理，將於授權辦法定明廢止其核定文件。"}],"changed":false,"final":"一般廢棄物，應由執行機關負責清除，並作適當之衛生處理。但家戶以外所產生者，得由執行機關指定其清除方式及處理場所。\n前項一般廢棄物之清除、處理，執行機關得報經上級主管機關核准，委託公民營廢棄物清除處理機構或依中央主管機關公告或核准之方式辦理。","finalWhy":null,"review":null},{"no":"第十五條","current":"物品或其包裝、容器經食用或使用後，足以產生下列性質之一之一般廢棄物，致有嚴重污染環境之虞者，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作。\n一、不易清除、處理。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、具回收再利用之價值。\n前項物品或其包裝、容器及其應負回收、清除、處理責任之業者範圍，由中央主管機關公告之。","versions":[{"bill":"202110179890000","text":"物品或其包裝、容器經食用或使用後，足以產生下列性質之一之廢棄物，致有嚴重污染環境之虞者，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作：\n一、不易清除處理。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、具回收再利用之價值。\n前項物品或其包裝、容器及其應負回收、清除、處理責任之業者範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，爰修正第一項得由中央主管機關公告為應回收廢棄物之範疇，不以一般廢棄物為限亦包括事業廢棄物，並酌作文字修正。\n二、第二項未修正。"},{"bill":"202110201390000","text":"物品或其包裝、容器經食用或使用後，足以產生下列性質之一之一般廢棄物，致有嚴重污染環境之虞者，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作。\n一、不易清除、處理。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、具回收再利用之價值。\n前項經公告之物品中，屬動力型電動車電池及大型儲能電池者，其製造、輸入業者應依中央主管機關規定，建立數位化追蹤標示，並揭露產品材料組成、可回收率及碳足跡資訊。\n第一項物品或其包裝、容器及其應負回收、清除、處理責任之業者範圍，由中央主管機關公告之。","note":"明確將「動力型電動車電池」及「大型儲能電池」納入公告物品，並賦予製造及輸入業者「數位追蹤標示」與「資訊揭露」之法定義務，以對接歐盟電池法之碳足跡與材料比例規範。"},{"bill":"202110204880000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"202110207050000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"202110207590000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"201110206460000","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"201110206460000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"202110209830000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、修正應回收廢棄物定義，不以一般廢棄物為限。\n二、增訂再生能源發電設備（如太陽光電板、風機葉片）為應回收廢棄物，並明定由製造、輸入或設備設置者負責回收、清除與處理。"},{"bill":"202110209810000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"202110209180000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、因應實務需求，並納入事業活動產生之廢棄物及再生能源設備（如太陽光電板、風機葉片）之回收處理需求，修正第一項應回收廢棄物定義，不再限於一般廢棄物：\n(一)現行內容移列為第一款並酌修文字。\n(二)增訂第二款，將再生能源發電設備使用後產生之廢棄物納入。\n二、將現行第一項有關回收、清除、處理責任之規定移列第二項，並增訂再生能源設備由製造、輸入或設置者負責處理之責。\n三、原第二項移列第三項，並明定應回收廢棄物由中央主管機關公告指定，及相關責任業者之簡稱。"},{"bill":"202110209760000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"202110211360000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"202110211860000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"},{"bill":"202110214910000","text":"為促進資源循環利用，中央主管機關得指定物品或其包裝、容器經食用或使用後所產生之一般廢棄物或事業廢棄物為應回收廢棄物，並得指定該物品或其包裝、容器、原料（下稱責任物）之製造、輸入、販賣、使用業者（以下簡稱責任業者），依指定之方式，負其回收、清除、處理責任。\n前項責任物及其責任業者範圍、責任履行方式，由中央主管機關公告之。","note":"一、生產者延伸責任（Extended Producer Responsibility），也就是由生產者負起其產品使用後所產生廢棄物之回收清除處理責任，是世界各國在推動循環利用的重要制度。透過該制度，生產者須考量其產品廢棄後是否易於拆解、分類、回收再利用，從而重新思考產品設計，是促進綠色設計與資源循環的重要手段，應為所有產品生產者的責任，不需要有任何前提要件，也不需要考量是否該產品廢棄後是否會對環境造成嚴重污染。\n二、鑑於產品廢棄後若沒有回收再利用，本身就是種資源浪費，是對環境與後世不負責任的行為；也基於永續潮流下，生產者不應只是製造產品營利賺錢，卻不負擔其產品廢棄後的回收責任或對其產品廢棄後造成的環境負擔視若無睹，爰刪除第一項第一款至第四款公告應回收廢棄物的前提要件，同時將適用範圍從民生用品消費使用後產生的一般廢棄物擴大至事業活動用品使用後所產生的事業廢棄物，比如廢棄的風機葉片、太陽能光電版、漁網、浮具與農膜等事業廢棄物。\n三、鑑於當代產品供應鏈相當冗長，從原料開採到終端產品的銷售，每個環節都可能對於產品設計或包裝帶來影響，故整個供應鏈均應負起生產者延伸責任，爰將責任業者範圍擴大到物品或其包裝、容器、原料之製造、輸入、販賣、使用業者，其中使用業者為使用產品經營事業活動的業者，如風機、光電版等再生能源發電設備的設置者。至於應由供應鏈的那個環節負擔責任，負擔何種責任，則得由中央主管機關視產品供應鏈的特性來決定。爰修正本條第一、二項，授權中主管機關指定公告責任業者範圍與責任履行方式。"},{"bill":"202110214090000","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理、申報及資料保存。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理、申報及資料保存之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物及2025年因丹娜絲颱風造成再生能源發電設備13萬片受損，導致後續追蹤、回收及盤點出現問題，爰於後段增訂由製造、輸入或設備設置者負責回收、清除、處理、申報及資料保存之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理、申報及資料保存之業者簡稱。"},{"bill":"201110206460001","text":"中央主管機關得指定公告一定規模之營建工程，其工程主辦機關或起造人應於規劃設計及施工階段遵行綠色設計準則指定項目。\n各工程中央目的事業主管機關應依前項指定項目，檢討營建工程設計施工技術及作業規範相關規定。","note":"一、本條新增。\n二、考量營建工程新建耗費大量資源，完工使用之生命週期可長達四十至五十年，且拆除後產生大量廢棄物，為提升營建工程資源循環，推動營建工程綠色設計，需由特定類型之工程（例如公共工程），優先導入強制性規範，並授權中央主管機關指定公告強制性實施綠色設計之營建工程規模及其項目。後續將依實務運作情形，優先推動「使用一定比率再生粒料」及「營建工程源頭現場分類減少廢棄物產生」項目，爰為第一項規定。\n三、為落實營建工程綠色設計準則之指定項目並與各階段之工程活動相結合，爰於第二項定明各工程中央目的事業主管機關應配合檢討營建工程設計施工技術及作業規範。"},{"bill":"201110206460001","text":"本章所稱應回收廢棄物，指符合下列情形之一之廢棄物：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一，致有嚴重污染環境之虞之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入或原料之製造、輸入業者負責回收、清除、處理，並由販賣業者負責回收、清除工作；第二款應回收廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","note":"一、為符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)現行第一項列為第一款，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、現行第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並配合第一項第二款之應回收廢棄物，於後段增訂由製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。"}],"changed":true,"final":"本章所稱應回收廢棄物，指為促進廢棄物循環利用，減輕物質生命週期對環境生態之影響，符合下列情形之一之廢棄物，經中央主管機關指定者：\n一、物品或其包裝、容器經食用或使用後，足以產生下列性質之一之廢棄物：\n(一)不易清除處理。\n(二)含長期不易腐化之成分。\n(三)含有害物質之成分。\n(四)具回收再利用之價值。\n二、經中央主管機關指定之再生能源發電設備經使用後產生之廢棄物。\n前項第一款應回收廢棄物，由該物品或其包裝、容器之製造、輸入、販賣或原料之製造、輸入、販賣業者負責回收、清除、處理；第二款應回收廢棄物，由再生能源發電設備之製造、輸入或設備設置者負責回收、清除、處理。\n第一項第一款物品或其包裝、容器、第二款再生能源發電設備之指定及前項應負責回收、清除、處理之業者（以下簡稱責任業者）範圍，由中央主管機關公告之。","finalWhy":"一、為促進廢棄物循環利用，減輕環境影響，並符合實務運作需求，考量具備應回收要件之廢棄物，尚包含由事業活動所產生者，又為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰修正第一項定明應回收廢棄物之定義，且不以一般廢棄物為限：\n(一)原第一項列為第一款，考量廢棄物應以循環利用優先，刪除「致有嚴重污染環境之虞」之情形，並作文字修正。\n(二)增訂第二款再生能源發電設備經使用後產生之廢棄物為應回收廢棄物。\n二、原第一項序文有關負責回收、清除、處理業者之規定移列第二項前段，並鑑於產品供應鏈除製造及輸入業者外，產品銷售之販賣業者，亦應負起生產者延伸責任，爰將責任業者範圍擴大至販賣者；另配合第一項第二款之應回收廢棄物，於後段增訂由再生能源發電設備之製造、輸入或設備設置者負責回收、清除、處理之責。\n三、第二項移列第三項，並酌修文字，增訂第一項應回收廢棄物之指定由中央主管機關公告及負責回收、清除、處理之業者簡稱。","review":null},{"no":"第十六條","current":"依前條第二項公告之應負回收、清除、處理責任之業者（以下簡稱責任業者），應向主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費，作為資源回收管理基金，並應委託金融機構收支保管；其收支保管及運用辦法，由中央主管機關定之。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。\n第一項責任業者辦理登記、申報、繳費方式、流程、期限、扣抵、退費及其他應遵行事項之管理辦法，由中央主管機關會商中央目的事業主管機關定之。\n第一項之費率，由中央主管機關所設之資源回收費率審議委員會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告；資源回收費率審議委員會設置辦法，由中央主管機關定之。","versions":[{"bill":"202110179890000","text":"依前條第二項公告之業者，應向主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費，作為資源回收管理基金，並應委託金融機構收支保管。\n前項基金分為信託基金及非營業基金，信託基金收支保管及運用辦法，由中央主管機關定之。\n第一項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、現行第一項前段責任業者範圍及簡稱規定，移列修正條文第十六條之一第四項；另配合現況基金運作管理區分為信託基金及非營業基金，為與依預算法第二十一條授權之非營業基金管理區別，明確信託基金之收支保管及運用辦法授權依據；第一項後段移列修正條文第二項。至於非營業基金之收支保管及運用辦法逕依預算法授權定之。\n二、現行第二項配合移列修正條文第三項，並酌修文字。\n三、現行第三項移列修正條文第四項，並酌修文字。\n四、現行第四項及第五項移列修正條文第十六條之一第四項及第五項。"},{"bill":"202110204880000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110207050000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110207590000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"201110206460000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110209830000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"配合第十五條修正責任業者範疇，並明定登記、申報及繳費之機關與流程。"},{"bill":"202110209810000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110209180000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、配合第十五條修正，調整第一項規範主體，並明定登記機關；原資源回收管理基金相關規定移列第十六條之一第二項，爰刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列至第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110209760000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110211360000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110211860000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"202110214910000","text":"前條責任業者，應向中央主管機關辦理登記，依指定方式與頻率、期限，申報其責任物之製造、輸入、銷售或使用情形（下稱運作情形），並依其運作量與中央主管機關核定費率或浮動費率公式計費之數額，繳納回收清除處理費。\n前項責任業者於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、配合修正條文第十五條擴大責任業者及責任物範圍，不同責任物及責任業者之申報、計費及繳費方式，可能因產品特性、供應鏈結構及實務管理需求而有差異，爰修正第一項，定明責任業者應依中央主管機關指定之方式、頻率及期限申報運作情形，並依運作量及核定費率或浮動費率公式繳納回收清除處理費。\n二、第三項未修正。\n三、現行第一項後段有關資源回收管理基金之規定，移列修正條文第十六條之一第一項；現行第四項及第五項移列修正條文第十六條之一第二項及第三項，爰予刪除。"},{"bill":"202110214090000","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"},{"bill":"201110206460001","text":"中央主管機關得指定公告物品或其包裝、容器重複使用目標及方式，其製造、輸入或販賣業者應於公告所定期限檢具重複使用計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願檢具重複使用計畫，送中央主管機關核准，並提送執行成果報中央主管機關備查。\n前二項重複使用計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為減少物品或其包裝、容器於一次性使用後衍生廢棄物造成資源浪費，並參酌歐盟包裝及包裝廢棄物規章對業者課以重複使用目標之責任，爰於第一項授權中央主管機關得指定公告特定物品或其包裝、容器須強制性重複使用，例如餐盒及飲料之容器、清潔劑之玻璃容器等；製造、輸入、販賣業者應依指定公告之目標、方式及期限提出重複使用計畫及提送執行成果。\n三、為使自願實施物品包裝容器重複使用之業者有所依循，爰為第二項規定。\n四、第三項授權中央主管機關訂定重複使用計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"201110206460001","text":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造或輸入之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量或辦理退費。","note":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關；後段有關資源回收管理基金規定移列修正條文第十六條之一第二項，爰予刪除。\n二、第二項、第三項未修正。\n三、第四項及第五項移列修正條文第十六條之一第三項及第四項，爰予刪除。"}],"changed":true,"final":"前條第一項第一款應回收廢棄物之責任業者，應向中央主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，販賣業應按當期銷售量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費。\n前項輸入業於向海關申報進口量時，應同時申報容器材質及其他經中央主管機關指定之物品或容器規格等資料。\n製造、輸入或販賣之物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之責任業者，得檢具相關證明文件扣抵營業量、進口量、銷售量或辦理退費。","finalWhy":"一、第一項規範主體配合修正條文第十五條修正，並依實際情形定明辦理登記之機關，並增訂販賣業按銷售量申報繳納回收清除處理費；後段有關資源回收管理基金規定移列修正條文第十六條之一第三項，爰予刪除。\n二、第二項未修正。\n三、第三項配合修正條文第十五條修正，物品或其包裝、容器，不在國內廢棄或使用後不產生廢棄物之販賣業者，得扣抵銷售量或辦理退費。\n四、第四項及第五項移列修正條文第十六條之一第四項及第五項，爰予刪除。","review":null},{"no":"第十六條之一","current":"第一項、第四項及第五項\n依前條第二項公告之應負回收、清除、處理責任之業者（以下簡稱責任業者），應向主管機關辦理登記；製造業應按當期營業量，輸入業應按向海關申報進口量，於每期營業稅申報繳納後十五日內，依中央主管機關核定之費率，繳納回收清除處理費，作為資源回收管理基金，並應委託金融機構收支保管；其收支保管及運用辦法，由中央主管機關定之。\n第一項責任業者辦理登記、申報、繳費方式、流程、期限、扣抵、退費及其他應遵行事項之管理辦法，由中央主管機關會商中央目的事業主管機關定之。\n第一項之費率，由中央主管機關所設之資源回收費率審議委員會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告；資源回收費率審議委員會設置辦法，由中央主管機關定之。","versions":[{"bill":"202110179890000","text":"經中央主管機關指定之再生能源發電設備，其使用後產生之廢棄物，由製造、輸入或設備設置者負責回收、清除、處理。\n前項再生能源發電設備及其應負回收、清除、處理責任之業者範圍，由中央主管機關公告之。\n依前項公告之業者，應向主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費，作為資源回收管理基金，並應委託金融機構收支保管。\n依第十五條第二項及本條第二項公告之業者（以下簡稱責任業者），其辦理登記、申報、繳費方式、流程、期限、扣抵、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n前條第一項及本條第三項之費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告。","note":"一、本條新增。\n二、為因應如太陽光電板、風機葉片等再生能源發電設備屬新興廢棄物之回收、清除、處理需求，爰第一項增訂再生能源發電設備之業者應負回收、清除、處理之責。\n三、第二項賦予中央主管機關公告應回收、清除、處理之再生能源發電設備及其責任業者範疇之授權依據。\n四、第三項定明再生能源發電設備業者繳納回收清除處理費之義務及其費率與計費基礎。\n五、現行第十六條第四項移列修正條文第四項，並增訂第二項之業者範圍，授權中央主管機關訂定相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n六、現行第十六條第五項移列修正條文第五項，配合現行法制體例，將費率審議委員會改為「費率審議會」，並刪除設置辦法授權規定。"},{"bill":"202110204880000","text":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。上開責任業者於妥善清理應回收廢棄物後，得檢附相關紀錄及證明文件向中央主管機關申請退費。\n前項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依第一項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項及前條第一項費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告。","note":"一、本條新增。\n二、本條由第十六條第一項、第四項、第五項修正移列。\n三、第一項增訂再生能源發電設備業者繳納回收清除處理費之義務與其費率及計費基礎，並定明再生能源設備責任業者得申請退費之條件。\n四、第二項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n五、第三項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n六、第四項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"},{"bill":"202110207050000","text":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。上開責任業者於妥善清理應回收廢棄物後，得檢附相關紀錄及證明文件向中央主管機關申請退費。\n前項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依第一項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項及前條第一項費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告。","note":"一、本條由第十六條第一項、第四項、第五項修正移列。\n二、第一項增訂再生能源發電設備業者繳納回收清除處理費之義務與其費率及計費基礎，並定明再生能源設備責任業者得申請退費之條件。\n三、第二項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n四、第三項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、第四項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"},{"bill":"202110207590000","text":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。上開責任業者於妥善清理應回收廢棄物後，得檢附相關紀錄及證明文件向中央主管機關申請退費。\n前項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依第一項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、退費、管理及其他應遵行事項之辦法
