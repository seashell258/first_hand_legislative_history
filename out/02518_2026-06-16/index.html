有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影像，尚未能逕以影像資料直接查知確認違反第二十七條各款行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人者，應以該應歸責之人為處罰對象。\n(二)另考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考道路交通管理處罰條例第三十一條第二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"},{"bill":"202110209180000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)因現行罰鍰上限偏低，難具嚇阻效果，參考國際立法，提高上限至新臺幣十萬元，並由中央主管機關訂定裁量準則。\n(二)將按日連續處罰修正為按次處罰，以符法制體例。\n(三)修正第二款，明確處罰範圍。\n二、增訂第二項：\n(一)針對無法直接辨識行為人之車輛違規情形，推定車輛所有人為處罰對象，並設舉證責任轉換機制。\n(二)客運業者於已盡告知義務之情形下，納入免責規定。"},{"bill":"202110209760000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影像，尚未能逕以影像資料直接查知確認違反第二十七條各款行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人者，應以該應歸責之人為處罰對象。\n(二)另考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考道路交通管理處罰條例第三十一條第二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"},{"bill":"202110211360000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影像，尚未能逕以影像資料直接查知確認違反第二十七條各款行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人者，應以該應歸責之人為處罰對象。\n(二)另考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考道路交通管理處罰條例第三十一條第二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"},{"bill":"202110211860000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影像，尚未能逕以影像資料直接查知確認違反第二十七條各款行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢 二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"},{"bill":"201110206460001","text":"本法施行細則，由中央主管機關定之。","note":"條次變更，內容未修正。"},{"bill":"201110206460001","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影像，尚未能逕以影像資料直接查知確認違反第二十七條各款行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人者，應以該應歸責之人為處罰對象。\n(二)另考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考道路交通管理處罰條例第三十一條第二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"}],"changed":true,"final":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第二款、第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","finalWhy":"一、原條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中違反第十二條或第二十七條之違規影像，尚未能逕以影像資料直接查知確認行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人者，應以該應歸責之人為處罰對象。\n(二)另考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考道路交通管理處罰條例第三十一條第二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。","review":null},{"no":"第五十一條","current":"未依第十六條第一項規定繳納回收清除處理費者，經限期繳納，屆期仍未繳納者，移送強制執行，並處應繳納費用一倍至二倍之罰鍰；提供不實申報資料者，除追繳應繳納之回收清除處理費外，並處應繳納費用一倍至三倍之罰鍰，屆期仍未繳納者，移送強制執行。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰；經限期改善，屆期仍未完成改善者，按日連續處罰：\n一、違反依第十六條第四項或第十八條第四項所定辦法。\n二、違反第十八條第一項至第三項、第十九條、第二十二條或第二十三條規定。\n三、無故規避、妨礙或拒絕第二十條之查核或索取有關資料規定。\n四、違反第二十一條中央主管機關規定之禁用或限制製造、輸入之規定者。\n違反第二十一條中央主管機關規定之限制販賣、使用規定者，處新臺幣一千二百元以上六千元以下罰鍰。經限期改善，屆期仍未完成改善者，按日連續處罰。\n第一項及第二項情節重大者，並得處一個月以上一年以下停業處分，或命其部分或全部停工。","versions":[{"bill":"202110179890000","text":"未依第十六條之一第四項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第三項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額，中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或命其部分或全部停工：\n一、違反依第十六條之一第四項或第十八條第四項所定辦法有關登記、申報或管理之規定。\n二、違反第十八條第一項所定標準有關方法及設施規定。\n三、違反第十八條第二項所定辦法有關稽核認證規定。\n四、違反第十九條第一項回收標誌標示或管理之規定。\n五、違反第十九條第二項回收設施設置或管理之規定。\n六、規避、妨礙或拒絕依第二十條之查核或要求提供資料之命令。\n七、違反第二十二條回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且修正條文第三項、現行第四十八條已就申報不實行為設有處罰規定，爰刪除現行第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、第二項參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、現行第二項移列修正條文第三項，並依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，說明如下：\n(一)第一款配合修正違反條次，並定明違反授權辦法之處罰事項。\n(二)現行第二款，臚列於修正條文第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反第十八條第三項情事已納入同條第四項授權辦法規定，爰予刪除，以及考量共同回收清除處理組織已完成移撥資源回收管理基金，違反本法第二十三條情事已無適用餘地，爰刪除現行第二項第二款關於第二十三條規定。\n(三)現行第三款遞移至至修正條文第六款，內容未修正。\n(四)配合刪除第二十一條禁限用規定，現行第四款爰予刪除。\n四、現行第三項配合刪除第二十一條禁限用規定，爰予刪除。\n五、鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除現行第四項有關第一項情事之適用，並移列至修正條文第三項序文後段，文字酌作修正。"},{"bill":"202110204880000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110207050000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110207590000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"201110206460000","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。"},{"bill":"201110206460000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110209830000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、刪除欠繳回收費之罰鍰規定，改以加徵滯納金及加計利息機制辦理。\n二、增訂針對偽造變造資料短漏報者，得依二倍費率計算應繳費額並追繳五年利息。"},{"bill":"202110209810000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110209180000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、刪除第一項罰鍰規定，改採加徵滯納金及利息，並設最高上限，以避免過苛處罰。\n二、增訂第二項，規範以不正當方式短報或漏報者之應納費額計算、追徵期限及利息。\n三、整併原第二項及第四項為第三項，並修正如下：\n(一)改採按次處罰，並納入情節重大之處分規定，刪除停工停業相關規定。\n(二)配合條次修正，明確各類違規行為之處罰範圍。\n(三)刪除已無適用必要或已由其他規定涵蓋之處罰事項。\n四、配合刪除第二十一條禁限用規定，刪除相關條文。"},{"bill":"202110209760000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110211360000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110211860000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110214910000","text":"未依第十六條之一第二項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。\n中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第二項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定方法或設施標準之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第四項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n(六)第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"202110214090000","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"},{"bill":"201110206460001","text":"本法除第十四條及第三十七條第一項規定自公布後二年施行外，自公布日施行。","note":"一、條次變更。\n二、考量修正條文第十四條促進產品資源循環之強制管制措施及第三十七條第一項對應之罰則配套需時，爰修正施行日期予以二年緩衝期間，其餘條文自公布日施行。"},{"bill":"201110206460001","text":"未依第十六條之一第三項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第三項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","note":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、現行第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，為依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將現行第四項有關情節重大得為之處分納入規範；鑒於現行第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反現行第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。"}],"changed":true,"final":"未依第十六條之一第四項所定辦法，於期限內繳納回收清除處理費者，每逾一日按滯納之金額加徵百分之零點五滯納金，一併繳納；逾期三十日仍未繳納者，移送強制執行。其應繳納之回收清除處理費，應自滯納期限屆滿之次日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n依第十六條第一項及第十六條之一第一項規定應繳納回收清除處理費，有偽造、變造或其他不正當方式短報或漏報與回收清除處理費計算有關資料者，中央主管機關得逕依查核結果，以回收清除處理費費率之二倍計算其應繳費額。中央主管機關除依前項計算及徵收逃漏之回收清除處理費外，並追繳最近五年內之應繳費額；起徵未滿五年者，自起徵日起計算追繳應繳費額。其追繳應繳費額，應自中央主管機關通知限期繳納截止日之次日或逃漏回收清除處理費發生日起，至繳納之日止，依繳納當日郵政儲金一年期定期存款固定利率按日加計利息。\n有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處一個月以上一年以下停業處分，或令其部分或全部停工：\n一、違反依第十六條之一第四項或第十八條第三項所定辦法有關登記、申報或管理之規定。\n二、違反依第十八條第一項所定標準有關方法或設施之規定。\n三、違反依第十八條第五項所定辦法有關稽核認證之規定。\n四、違反依第十九條第一項所定公告有關回收標誌或標示之規定。\n五、違反依第十九條第二項所定公告有關回收設施設置或回收工作執行之規定。\n六、規避、妨礙或拒絕依第二十條之查核或提供資料。\n七、違反依第二十二條第一項所定公告有關回收獎勵金支付規定。","finalWhy":"一、考量針對逾期未繳納回收清除處理費者裁處罰鍰，恐有過苛情形，且本次修正之第三項第一款、原第四十八條已就申報不實行為設有處罰規定，爰刪除第一項罰鍰規定，並參考氣候變遷因應法第六十條及空氣污染防制法第七十四條規定，增訂未繳納清除處理費應加徵滯納金、加計利息及滯納金加徵最高限額規定。\n二、參考氣候變遷因應法第五十五條及空氣污染防制法第七十五條規定，增訂第二項規範以偽造、變造或其他不正當方式短、漏報與清除處理費有關資料者，其應納費額之計算方式及追徵期限、加計利息規定。\n三、第二項、第四項整併為第三項，依行為態樣及違反條次分列不同款次，按日連續處罰修正為按次處罰，以與其他環保法律體例相符，修正如下：\n(一)序文將原第四項有關情節重大得為之處分納入規範；鑑於原第一項欠繳回收清除處理費之業者現行實務運作尚無情節重大致有停工停業之必要，且強制業者停工停業將更不利於收回欠繳之費用，爰刪除有關第一項情事之規定。另酌作文字修正。\n(二)第一款配合修正違反條次，並定明違反授權辦法應予處罰事項。\n(三)第二款所定情形，依違反之條次分列為第二款至第五款及第七款，並配合修正違反條次，明確應處罰之相關規定事項。另考量違反原第十八條第三項情事已納入修正條文第十八條第三項所定辦法規範而得依本項第一款規定處罰，爰予刪除；又考量共同回收清除處理組織已依第二十三條規定完成移撥資源回收管理基金，違反該條之處罰已無保留必要，爰刪除關於違反第二十三條之規定。\n(四)第三款移列為第六款，並酌修文字。\n(五)配合刪除第二十一條禁限用規定，爰刪除第四款規定。\n四、第三項配合刪除第二十一條禁限用規定，爰予刪除。","review":null},{"no":"第五十二條","current":"貯存、清除、處理或再利用一般事業廢棄物，違反第二十八條第一項、第三十一條第一項、第五項、第三十四條、第三十六條第一項、第三十九條規定或依第二十九條第二項、第三十九條之一第二項所定管理辦法者，處新臺幣六千元以上三百萬元以下罰鍰。經限期改善，屆期仍未完成改善者，按次處罰。","versions":[{"bill":"202110179890000","text":"有下列情形之一者，處新臺幣六千元以上三百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第二十八條第一項規定方式清理事業廢棄物。\n二、違反依第二十九條第二項所定辦法有關提供條件、許可程序與期限或管理之規定。\n三、未依第三十一條第一項第一款、第三十九條第三項、第三十九條之五第一項規定，取得事業廢棄物清理計畫書之核准或變更。\n四、違反第三十一條第一項第二款或同條第五項申報規定。\n五、未依第三十一條第一項第三款規定裝置即時追蹤系統或維持正常運作。\n六、未依第三十四條規定處理事業廢棄物。\n七、違反第三十六條第二項所定標準有關貯存、清除或處理方法及設施規定。\n八、違反依第三十九條第五項、第三十九條之五第二項準用第三十九條第五項所定辦法有關管理方式、檢核、許可事項、記錄、申報或管理之規定。\n九、違反依第三十九條之一第三項、第三十九條之五第三項準用第三十九條之一第三項所定辦法有關記錄、申報、使用證明保存、環境監測計畫書應記載事項、核准事項、提報方式、採樣監測紀錄與環境監測結果報告提送或管理之規定。\n十、違反依第三十九條之二第二項、第三十九條之五第二項準用 0164950000","text":"從事廢棄物運輸之駕駛人，因違反第四十六條第七款之行為經判決確定者，主管機關得通報公路主管機關，吊銷或停止其職業駕駛執照一年以上五年以下。","note":"一、本條新增。\n二、建立資格處分機制：增訂駕駛若涉違法並經判決確定，主管機關可通報公路主管機關，吊銷或停止職業駕駛執照，避免駕駛人重複涉案。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十五條","current":"有下列情形之一者，處新臺幣六千元以上三百萬元以下罰鍰，並限期令其改善，屆期仍未完成改善者，得按次處罰：\n一、公民營廢棄物清除處理機構違反第十二條規定或依第四十二條所定管理辦法。\n二、指定公告之事業違反第二十八條第二項應置專業技術人員或自行清除處理事業廢棄物違反依第二十八條第二項所定管理辦法。\n三、廢棄物共同清除處理機構，清除處理設施所屬之公營事業或民間機構違反依第二十八條第三項至第五項所定管理辦法。\n四、有害事業廢棄物貯存、清除、處理之操作及檢測違反依第三十七條第二項所定管理辦法。\n五、廢棄物檢驗測定機構違反第四十三條第一項規定。","versions":[{"bill":"202110179890000","text":"有下列情形之一者，處新臺幣六千元以上三百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、公民營廢棄物清除處理機構違反第十二條規定或依第四十二條所定辦法有關自有設施、專業技術人員設置、許可、許可期限或管理之規定。\n二、指定公告之事業違反第二十八條第二項應置專業技術人員或自行清除處理事業廢棄物違反依第二十八條第二項所定辦法有關事業清除機具及處理設施或設備應具備之條件、許可、許可期限或管理之規定。\n三、廢棄物共同清除處理機構，清除處理設施所屬之公營事業或民間機構違反依第二十八條第三項至第五項所定辦法有關許可、許可期限、專業技術人員設置、營運、操作紀錄或管理之規定。\n四、有害事業廢棄物貯存、清除、處理之操作及檢測違反依第三十七條第二項所定辦法有關檢測之項目、方法、頻率或管理之規定。","note":"依違反條次順序之違規行為態樣分別臚列於第一款至第四款；第五款檢驗測定機構違反修正條文第四十三條規定之處罰，已移列至修正條文第五十八條第二項完整規範，爰予刪除。"},{"bill":"202110204880000","text":"有下列情形之一者，處新臺幣六千元以上三百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、公民營廢棄物清除處理機構違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、方法、設備或再利用規定，或同條第二項之分類、貯存規定或違反依第四十二條所定辦法有關自有設施、專業技術人員設置、許可、許可期限或管理之規定。\n二、指定公告之事業未依第二十八條第二項規定置專業技術人員；或自行清除處理事業廢棄物違反依第二十八條第二項所定辦法有關清除機具、處理設施或設備應具備之條件、許可、許可期限或管理之規定。\n三、廢棄物共同清除處理機構，清除處理設施所屬之公營事業或民間機構違反依第二十八條第三項至第五項所定辦法有關許可、許可期限、專業技術人員設置、營運、操作紀錄或管理之規定。\n四、有害事業廢棄物貯存、清除、處理之操作及檢測違反依第三十七條第二項所定辦法有關檢測之項目、方法、頻率或管理之規定。","note":"一、序文酌作文字修正，並明確第一款至第四款違規態樣。\n二、修正條文第五十八條第一項已完整規範檢驗測定機構違反第四十三條規定之處罰，爰刪除第五款規定。"},{"bill":"202110207050000","text":"有下列情形之一者，處新臺幣六千元以上三百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、公民營廢棄物清除處理機構違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、方法、設備或再利用規定，或同條第二項之分類、貯存規定或違反依第四十二條所定辦法有關自有設施、專業技術人員設置、許可、許可期限或管理之規定。\n二、指定公告之事業未依第二十八條第二項規定置專業技術人員；或自行清除處理事業廢棄物違反依第二十八條第二項所定辦法有關清除機具、處理設施或設備應具備之條件、許可、許可期限或管理之規定。\n三、廢棄物共同清除處理機構，清除處理設施所屬之公營事業或民間機構違反依第二十八條第三項至第五項所定辦法有關許可、許可期限、專業技術人員設置、營運、操作紀錄或管理之規定。\n四、有害事業廢棄物貯存、清除、處理之操作及檢測違反依第三十七條第二項所定辦法有關檢測之項目、方法 下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、公民營廢棄物清除處理機構違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、方法、設備或再利用規定，或同條第二項之分類、貯存規定或違反依第四十二條所定辦法有關自有設施、專業技術人員設置、許可、許可期限或管理之規定。\n二、指定公告之事業未依第二十八條第二項規定置專業技術人員；或自行清除處理事業廢棄物違反依第二十八條第二項所定辦法有關清除機具、處理設施或設備應具備之條件、許可、許可期限或管理之規定。\n三、廢棄物共同清除處理機構，清除處理設施所屬之公營事業或民間機構違反依第二十八條第三項至第五項所定辦法有關許可、許可期限、專業技術人員設置、營運、操作紀錄或管理之規定。\n四、有害事業廢棄物貯存、清除、處理之操作及檢測違反依第三十七條第二項所定辦法有關檢測之項目、方法、頻率或管理之規定。","finalWhy":"一、序文酌作文字修正，並明確第一款至第四款違規態樣。\n二、修正條文第五十八條第一項已完整規範檢驗測定機構違反第四十三條規定之處罰，爰刪除第五款規定。","review":null},{"no":"第五十八條","current":"廢棄物檢驗測定機構、檢驗檢測人員違反依第四十三條第二項所定管理辦法、廢棄物專業技術人員違反依第四十四條所定管理辦法者，處新臺幣六萬元以上一百萬元以下罰鍰。","versions":[{"bill":"202110179890000","text":"有下列情形之一者，由中央主管機關處新臺幣六萬元以上一百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第四十三條第一項規定取得許可證逕行檢驗測定。\n二、違反依第四十三條第二項所定辦法有關檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可事項或管理之規定。\n廢棄物專業技術人員違反依第四十四條所定辦法有關資格、合格證書、訓練、執行業務或管理之規定，處新臺幣一萬元以上十萬元以下罰鍰。","note":"一、現行條文前段有關檢驗測定之違反行為處罰規定，配合修正條文第四十三條規定分款列明，以茲明確。\n二、現行條文後段有關廢棄物專業技術人員違反第四十四條授權辦法之處罰移列增訂第二項，並參考水污染防治法第四十八條第四項、空氣污染防制法第六十九條第二項規定，爰針對廢棄物專業技術人員違反行為之罰鍰額度，為一致性規定，以符責罰相當原則。\n三、除本法外，現行其他環保作用法針對環境檢驗測定機構違規時之裁罰，因機構對受雇檢驗人員執行業務負有善盡管理責任之義務，故發生違規情形時機構自應成為歸責主體，爰參考其他環境作用法，刪除裁罰檢測人員之規定。"},{"bill":"202110204880000","text":"有下列情形之一者，由中央主管機關處新臺幣六萬元以上一百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第四十三條第一項規定取得許可證，逕行辦理檢驗測定。\n二、違反依第四十三條第二項所定辦法有關檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可事項或管理之規定。\n廢棄物專業技術人員違反依第四十四條所定辦法有關資格、合格證書、訓練、執行業務或管理之規定，處新臺幣一萬元以上十萬元以下罰鍰。","note":"一、現行條文列為第一項，並修正如下：\n(一)有關檢驗測定之違反行為處罰規定，配合修正條文第四十三條規定分款列明，以茲明確，並於序文增訂限期改善及按次處罰規定，以與其他環保法律體例相符。\n(二)除本法外，現行其他環保法律針對環境檢驗測定機構違規時之裁罰，考量機構對所屬檢驗人員執行業務具指揮監督之責，如有發生違規情形，機構自應成為歸責主體，爰參考其他環境作用法，刪除裁罰檢驗檢測人員之規定。\n二、有關廢棄物專業技術人員違反第四十四條授權辦法之處罰移列增訂第二項，並參考水污染防治法第四十八條第四項、空氣污染防制法第六十九條第二項規定，針對廢棄物專業技術人員違反行為之罰鍰額度，為一致性規定，以符責罰相當原則。"},{"bill":"202110207050000","text":"有下列情形之一者，由中央主管機關處新臺幣六萬元以上一百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第四十三條第一項規定取得許可證，逕行辦理檢驗測定。\n二、違反依第四十三條第二項所定辦法有關檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可事項或管理之規定。\n廢棄物專業技術人員違反依第四十四條所定辦法有關資格、合格證書、訓練、執行業務或管理之規定，處新臺幣一萬元以上十萬元以下罰鍰。","note":"一、現行條文列為第一項，並修正如下：\n(一)有關檢驗測定之違反行為處罰規定，配合修正 四項、空氣污染防制法第六十九條第二項規定，針對廢棄物專業技術人員違反行為之罰鍰額度，為一致性規定，以符責罰相當原則。"}],"changed":true,"final":"有下列情形之一者，由中央主管機關處新臺幣六萬元以上一百萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第四十三條第一項規定取得許可證，逕行辦理檢驗測定。\n二、違反依第四十三條第二項所定辦法有關檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可事項或管理之規定。\n廢棄物專業技術人員違反依第四十四條所定辦法有關資格、合格證書、訓練、執行業務或管理之規定，處新臺幣一萬元以上十萬元以下罰鍰。","finalWhy":"一、原條文列為第一項，並修正如下：\n(一)有關檢驗測定之違反行為處罰規定，配合修正條文第四十三條規定分款列明，以資明確，並於序文增訂限期改善及按次處罰規定，以與其他環保法律體例相符。\n(二)除本法外，現行其他環保法律針對環境檢驗測定機構違規時之裁罰，考量機構對所屬檢驗人員執行業務具指揮監督之責，如有發生違規情形，機構自應成為歸責主體，爰參考其他環境作用法，刪除裁罰檢驗檢測人員之規定。\n二、有關廢棄物專業技術人員違反第四十四條授權辦法之處罰移列增訂第二項，並參考水污染防治法第四十八條第四項、空氣污染防制法第六十九條第二項規定，針對廢棄物專業技術人員違反行為之罰鍰額度，為一致性規定，以符責罰相當原則。","review":null},{"no":"第五十八條之一","current":null,"versions":[{"bill":"202110179890000","text":"有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善；屆期仍未完成改善者，按次處罰：\n一、違反第七十一條第一項規定，屆期不為清除、處理及改善環境，或屆期未提出處置計畫書、未補正、經補正後仍不符規定或未依核定期程、內容執行。\n二、規避、妨礙或拒絕第七十一條之二第一項規定應配合事項。","note":"一、本條新增。\n二、考量土地等環境資源之不可回復性及有限性，為確保直轄市、縣（市）主管機關或執行機關依第七十一條令清除、處理及環境改善或提出處置計畫書之行為責任、狀態責任人，確實履行其義務，依法務部九十九年四月十二日法律字第○九九九○○二○三六號函，行政強制執行方法與行政罰性質有所不同，無一行為不二罰之適用，二者得併行之，爰參考土壤及地下水污染整治法第三十七條及第三十八條第二項增訂第一款處罰規定。\n三、考量土地所有人、管理人或使用人違反修正條文第七十一條之二第一項不配合直轄市、縣（市）主管機關或執行機關代履行、採取應變等相關措施，或妨礙處置計畫書實施情事發生，將影響場址之清理及復原，爰參考土壤及地下水污染整治法第三十八條第一項增訂第二款處罰規定。"},{"bill":"202110204880000","text":"有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善；屆期仍未完成改善者，按次處罰：\n一、違反直轄市、縣（市）主管機關或執行機關依第七十一條第一項規定所為命令，屆期不為清除、處理、改善環境，或屆期未提出處置計畫書、未補正、經補正後仍不符規定或未依核定期程、內容執行。\n二、無正當理由規避、妨礙或拒絕第七十一條之二第一項規定應配合事項。","note":"一、本條新增。\n二、考量土地等環境資源之不可回復性及有限性，為確保直轄市、縣（市）主管機關或執行機關依第七十一條令清除、處理及環境改善或提出處置計畫書之行為責任、狀態責任人，確實履行其義務，爰參考土壤及地下水污染整治法第三十七條及第三十八條第二項增訂第一款處罰規定。\n三、考量土地所有人、管理人或使用人如有違反修正條文第七十一條之二第一項不配合直轄市、縣（市）主管機關或執行機關代履行、採取應變等相關措施，或妨礙處置計畫書實施情事發生，將影響場址之清理及復原，爰參考土壤及地下水污染整治法第三十八條第一項增訂第二款處罰規定。"},{"bill":"202110207050000","text":"有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得通知限期改善；屆期仍未完成改善者，按次處罰：\n一、違反直轄市、縣（市）主管機關或執行機關依第七十一條第一項規定所為命令，屆期不為清除、處理、改善環境，或屆期未提出處置計畫書、未補正、經補正後仍不符規定或未依核定期程、內容執行。\n二、無正當理由規避、妨礙或拒絕第七十一條之二第一項規定應配合事項。","note":"一、本條新增。\n二、考量土地等環境資源之不可回復性及有限性，為確保直轄市、縣（市）主管機關或執行機關依第七十一條令清除、處理及環境改善或提出處置計畫書之行為責任、狀態責 或設施、專業技術人員、檢驗測定機構查核、處分之個別及統計資訊。","note":"一、現行條文列為第一項，定明違反本法之處罰機關，除第五十八條第一項檢測機構違規由中央主管機關處罰外，由執行機關為之。\n二、為落實資訊公開制度，主管機關或執行機關得公開其查核、處分資訊，爰增訂第二項。"},{"bill":"202110214090000","text":"本法所定之處罰，除另有規定外，由執行機關為之；執行機關應作為而不作為時，得由上級主管機關為之。\n主管機關或執行機關得於中央主管機關指定之網站，公開對事業、公民營廢棄物清除處理機構或設施、專業技術人員、檢驗測定機構查核、處分之個別及統計資訊。","note":"一、現行條文列為第一項，定明違反本法之處罰機關，除第五十八條第一項檢測機構違規由中央主管機關處罰外，由執行機關為之。\n二、為落實資訊公開制度，主管機關或執行機關得公開其查核、處分資訊，爰增訂第二項。"},{"bill":"201110206460001","text":"本法所定之處罰，除另有規定外，由執行機關為之；執行機關應作為而不作為時，得由上級主管機關為之。\n主管機關或執行機關得於中央主管機關指定之網站，公開對事業、公民營廢棄物清除處理機構或設施、專業技術人員、檢驗測定機構查核、處分之個別及統計資訊。","note":"一、現行條文列為第一項，定明違反本法之處罰機關，除第五十八條第一項檢測機構違規由中央主管機關處罰外，由執行機關為之。\n二、為落實資訊公開制度，主管機關或執行機關得公開其查核、處分資訊，爰增訂第二項。"}],"changed":true,"final":"本法所定之處罰，除另有規定外，由執行機關為之；執行機關應作為而不作為時，得由上級主管機關為之。\n主管機關或執行機關得於中央主管機關指定之網站，公開對事業、公民營廢棄物清除處理機構或設施、專業技術人員、檢驗測定機構查核、處分之個別及統計資訊。","finalWhy":"一、原條文列為第一項，定明違反本法之處罰機關，除第五十八條第一項檢測機構違規由中央主管機關處罰外，由執行機關為之。\n二、為落實資訊公開制度，主管機關或執行機關得公開其查核、處分資訊，爰增訂第二項。","review":null},{"no":"第六十三條之一","current":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n其違法所得之利益超過法定罰鍰最高額者，得於所得利益之範圍內酌量加重裁處，不受法定罰鍰最高額之限制。\n前項所得利益認定、核算辦法，由中央主管機關定之。","versions":[{"bill":"202110179890000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則除本法另有規定外，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由處分機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估辦法，由中央主管機關定之。","note":"一、第一項考量第四十九條之一授權營建剩餘土石方中央主管機關訂定裁罰準則，爰予修正。\n二、為與其他環保法規規定一致，參考水污染防治法第六十六條之二第一項、空氣污染防制法第八十六條第一項規定，修正本法追繳不法利得規定，採取追繳不法利得與罰鍰併行之立法體例。徹底剝奪不法行為人所獲利得，遏止環境不法，爰修正第二項。\n三、任何人皆不應因違反行政法義務而受有財產上利益，依其類型包括：(一)行為人違反本法義務行為而有所得利益者；(二)為他人利益而實施行為，致使他人違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第一項及第二項規定，增訂第三項及第四項規定。\n四、現行第三項移列修正條文第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第四項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"},{"bill":"202110204880000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","note":"一、為與其他環保法規規定一致，參考水污染防治法第六十六條之二第一項、空氣污染防制法第八十六條第一項規定，修正第二項，採取追繳不法利得與罰鍰併行之立法體例，以遏止環境不法。\n二、任何人皆不應因違反行政法義務而受有財產上利益，依其類型包括：(一)行為人違反本法義務行為而有所得利益者；(二)為他人利益而實施行為，致使他人違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第一項及第二項規定，增訂第三項及第四項規定。\n三、第三項移列為第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第四項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"},{"bill":"202110207050000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","note":"一、第一項未修正。\n二、為與其他環保法規規定一致，參考水污染防治法第六十六條之二第一項、空氣污染防制法第八十六條第一項規定，修正第二項，採取追繳不法利得與罰鍰併行之立法體例，以遏止環境不法。\n三、任何人皆不應因違反行政法義務而受有財產上利益，依其類型包括：(一)行為人違反本法義務行為而有所得利益者；(二)為他人利益而實施行為，致使他人違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第一項及第二項規定，增訂第三項及第四項規定。\n四、第三項移列為第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第四項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"},{"bill":"202110207590000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。", 機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","note":"一、第一項未修正。\n二、為與其他環保法規規定一致，參考水污染防治法第六十六條之二第一項、空氣污染防制法第八十六條第一項規定，修正第二項，採取追繳不法利得與罰鍰併行之立法體例，以遏止環境不法。\n三、任何人皆不應因違反行政法義務而受有財產上利益，依其類型包括：(一)行為人違反本法義務行為而有所得利益者；(二)為他人利益而實施行為，致使他人違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第一項及第二項規定，增訂第三項及第四項規定。\n四、第三項移列為第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第四項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"},{"bill":"202110209180000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","note":"一、參考相關環保法規，修正第二項，採罰鍰與追繳不法利得併行之制度，以強化遏止效果。\n二、增訂第三項及第四項，規範不法利得之追繳範圍，包含行為人、為他人行為及他人受益等情形，以避免形成制裁漏洞。\n三、原第三項移列第五項，並明定不法利得之追繳由主管機關以行政處分為之，授權中央主管機關訂定計算及認定方式。"},{"bill":"202110209760000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以追繳。\n為他人利益而實施行為，致使他人違反本法上義務應受處罰者，該行為人因其行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n行為人違反本法上義務應受處罰，他人因該行為受有財產上利益而未受處罰時，得於其所受財產上利益價值範圍內，予以追繳。\n前三項追繳，由裁處機關以行政處分為之；所稱利益得包括積極利益及應支出而未支出或減少支出之消極利益，其核算及推估之辦法，由中央主管機關定之。","note":"一、為與其他環保法規規定一致，參考水污染防治法第六十六條之二第一項、空氣污染防制法第八十六條第一項規定，修正第二項，採取追繳不法利得與罰鍰併行之立法體例，以遏止環境不法。\n二、任何人皆不應因違反行政法義務而受有財產上利益，依其類型包括：(一)行為人違反本法義務行為而有所得利益者；(二)為他人利益而實施行為，致使他人違反本法上義務而有所得利益者；(三)行為人違反本法上義務應受處罰，他人因該行為受有財產上利益者等三類，如未剝奪其所得利益，顯有形成制裁漏洞之虞，為避免其違法取得不當利益，俾求得公平正義，爰參考行政罰法第二十條第一項及第二項規定，增訂第三項及第四項規定。\n三、第三項移列為第五項，並考量本條所定不當利益之追繳，賦予主管機關裁量權，依個案情形裁處之，其係基於實現公平正義等理念而設，性質上並非制裁，故與責任能力、責任條件等無關，爰參考行政罰法第二十條第三項，於第四項增訂本條所定追繳，行政機關應以行政處分為之，以資明確，並杜爭議。且考量利益之核算及推估，涉及人民權利之限制，由本法就其構成要件，授權中央主管機關以法規命令補充之。"},{"bill":"202110211360000","text":"依本法處罰鍰者，其額度應依污染程度、特性及危害程度裁處；其裁罰準則，由中央主管機關定之。\n違反本法義務行為而有所得利益者，除應依本法規定裁處一定金額之罰鍰外，並得於所得利益之範圍內，予以
