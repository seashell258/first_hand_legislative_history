用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110209180000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合再利用管理事權統一由中央主管機關統籌，修正第一項，刪除中央目的事業主管機關之追蹤責任，並明定再利用產品使用者之記錄、申報及監測義務，以強化流向管理。\n二、增訂第二項，規範指定再利用產品之使用者，應於環境監測前提報計畫書並經核准，依計畫執行採樣與監測，並將結果報送地方主管機關備查。\n三、原第二項移列第三項，修正授權範圍，並刪除「會商」規定。"},{"bill":"202110209760000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、增訂第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110211360000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、增訂第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110211860000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、增訂第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110214910000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品來源、使用數量及實際使用地點，並保存使用證明以供查核；有下列情形之一並經中央主管機關指定公告者，其產源事業應自行或共同設立專責組織實施再利用產品流向追蹤及環境監測，並將流向追蹤與環境監測結果申報至中央主管機關指定網站公開並供主管機關查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n第一項再利用產品之指定、使用者應記錄與申報之項目、頻率及使用證明保存、產源事業追蹤再利用產品流向方式與記錄、環境監測之項目、採樣檢測之頻率、方法與結果紀錄、流向追蹤與環境監測結果申報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報義務；對於有不當再利用之虞之產品，其產源事業並應負再利用產品流向追蹤及環境監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、第二項配合前項修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110214090000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、增訂第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"201110206460001","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、增訂第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"}],"changed":true,"final":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查後，於中央主管機關指定之網站公開產品流向及監測結果。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查、產品流向與監測結果之公開及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"","review":null},{"no":"第三十九條之二","current":null,"versions":[{"bill":"202110179890000","text":"中央主管機關得考量事業廢棄物或再利用產品之用途、成分、特性、數量、棄置風險及其他相關因素，指定產源事業、再利用事業及再利用產品使用者，採取下列全部或一部之管理措施：\n一、簽訂再利用委託或再利用產品銷售契約書及記載中央主管機關指定事項。\n二、進行再利用產品或再利用製程之驗證。\n三、設置中央主管機關指定之設備。\n四、設置專業技術人員。\n五、設置閉路電視錄影監視系統及瀏覽伺服，供主管機關檢視。\n六、其他經中央主管機關指定之管理措施。\n前項應採取之管理措施、契約書應記載事項、驗證事項、設備設置、專業技術人員設置、監視系統與瀏覽伺服規格、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為強化事業廢棄物再利用及再利用產品使用管理，中央主管機關得視其運作風險，明定不同管理措施，例如再利用產品做為原料、材料等，高質化再利用者運作風險相對較低，如用於填土、燃料等用途，因受社會關注度大、管理密度需求較高，故明文管理之必要，爰增訂第一項，說明如下：\n(一)增訂第一款，透過簽訂契約方式，使產源事業、再利用事業及再利用產品使用者於實際從事再利用運作或使用產品前，掌握後續再利用行為及再利用產品使用符合相關規定。\n(二)增訂第二款，透過驗證機制提升再利用產品市場接受度及競爭力。\n(三)增訂第三款，要求產源事業、再利用事業及再利用產品使用者應設置必要之設備，確保再利用行為及再利用產品使用符合相關規定。\n(四)增訂第四款，強化再利用機構自我管理能力。\n(五)增訂第五款，設置閉路電視錄影監視系統及瀏覽伺服，以利主管機關即時遠端檢視再利用運作情形。\n(六)增訂第六款，由中央主管機關視需求採取其他管理措施。\n三、第二項授權中央主管機關訂定管理措施之相關管理規定。"},{"bill":"202110204880000","text":"中央主管機關得考量事業廢棄物或再利用產品之用途、成分、特性、數量、棄置風險及其他相關因素，指定產源事業、再利用事業及再利用產品使用者，採取下列全部或一部之管理措施：\n一、簽訂再利用委託或再利用產品銷售契約書及記載中央主管機關指定事項。\n二、進行再利用產品或再利用製程之驗證。\n三、進行再利用產品檢測。\n四、限制再利用產品銷售對象。\n五、限制再利用產品使用用途或方式。\n六、設置中央主管機關指定之設備。\n七、設置專業技術人員。\n八、設置閉路電視錄影監視系統及瀏覽伺服，供主管機關檢視。\n九、其他經中央主管機關指定之管理措施。\n前項產源事業、再利用事業及再利用產品使用者之指定、契約書應記載事項、驗證事項、產品檢測事項、檢測報告應具備之內容、銷售對象、使用用途或方式、設備設置、專業技術人員設置、監視系統及瀏覽伺服規格、其他管理措施之指定及相關應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為強化事業廢棄物再利用及再利用產品使用管理，中央主管機關得視其運作風險，明定不同管理措施，例如再利用產品做為原料、材料等，高質化再利用之運作風險相對較低；如用於填土、燃料等用途，因受社會關注度大、管理密度需求較高，有強化管理之必要，爰為第一項規定：\n(一)第一款在透過簽訂契約方式，使產源事業、再利用事業及再利用產品使用者於實際從事再利用運作或使用產品前，掌握後續再利用行為及再利用產品使用符合相關規定。\n(二)第二款在透過驗證機制提升再利用產品市場接受度及競爭力。\n(三)第三款在透過再利用產品檢測，確認產品符合品質規範。\n(四)第四款要求再利用事業銷售再利用產品之對象應符合資格。\n(五)第五款要求再利用產品使用者應依規定使用再利用產品。\n(六)第六款要求產源事業、再利用事業及再利用產品使用者應設置必要之設備，確保再利用行為及再利用產品使用符合相關規定。\n(七)第七款要求設置專業技術人員，以強化再利用機構自我管理能力。\n(八)第八款要求設置閉路電視錄影監視系統及瀏覽伺服，以利主管機關即時遠端檢視再利用運作情形。\n(九)第九款授權由中央主管機關視需求採取其他管理措施。\n三、第二項授權中央主管機關就第一項所定事項訂定辦法。"},{"bill":"202110207050000","text":"中央主管機關得考量事業廢棄物或再利用產品之用途、成分、特性、數量、棄置風險及其他相關因素，指定產源事業、再利用事業及再利用產品使用者，採取下列全部或一部之管理措施：\n一、簽訂再利用委託或再利用產品銷售契約書及記載中央主管機關指定事項。\n二、進行再利用產品或再利用製程之驗證。\n三、進行再利用產品檢測。\n四、限制再利用產品銷售對象。\n五、限制再利用產品使用用途或方式。\n六、設置中央主管機關指定之設備。\n七、設置專業技術人員。\n八、設置閉路電視錄影監視系統及瀏覽伺服，供主管機關檢視。\n九、其他經中央主管機關指定之管理措施。\n前項產源事業、再利用事業及再利用產品使用者之指定、契約書應記載事項、驗證事項、產品檢測事項、檢測報告應具備之內容、銷售對象、使用用途或方式、設備設置、專業技術人員設置、監視系統及瀏覽伺服規格、其他管理措施之指定及相關應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為強化事業廢棄物再利用及再利用產品使用管理，中央主管機關得視其運作風險，明定不同管理措施，例如再利用產品做為原料、材料等，高質化再利用之運作風險相對較低；如用於填土、燃料等用途，因受社會關注度大、管理密度需求較高，有強化管理之必要，爰為第一項規定：\n(一)第一款在透過簽訂契約方式，使產源事業、再利用事業及再利用產品使用者於實際從事再利用運作或使用產品前，掌握後續再利用行為及再利用產品使用符合相關規定。\n(二)第二款在透過驗證機制提升再利用產品市場接受度及競爭力。\n(三)第三款在透過再利用產品檢測，確認產品符合品質規範。\n(四)第四款要求再利用事業銷售再利用產品之對象應符合資格。\n(五)第五款要求再利用產品使用者應依規定使用再利用產品。\n(六)第六款要求產源事業、再利用事業及再利用產品使用者應設置必要之設備，確保再利用行為及再利用產品使用符合相關規定。\n(七)第七款要求設置專業技術人員，以強化再利用機構自我管理能力。\n(八)第八款要求設置閉路電視錄影監視系統及瀏覽伺服，以利主管機關即時遠端檢視再利用運作情形。\n(九)第九款授權由中央主管機關視需求採取其他管理措施。\n三、第二項授權中央主管機關就第一項所定事項訂定辦法。"},{"bill":"202110207590000","text":"中央主管機關得考量事業廢棄物或再利用產品之用途、成分、特性、數量、棄置風險及其他相關因素，指定產源事業、再利用事業及再利用產品使用者，採取下列全部或一部之管理措施：\n一、簽訂再利用委託或再利用產品銷售契約書及記載中央主管機關指定事項。\n二、進行再利用產品或再利用製程之驗證。\n三、進行再利用產品檢測。\n四、限制再利用產品銷售對象。\n五、限制再利用產品使用用途或方式。\n六、設置中央主管機關指定之設備。\n七、設置專業技術人員。\n八、設置閉路電視錄影監視系統及瀏覽伺服，供主管機關檢視。\n九、其他經中央主管機關指定之管理措施。`\n前項產源事業、再利用事業及再利用產品使用者之指定、契約書應記載事項、驗證事項、產品檢測事項、檢測報告應具備之內容、銷售對象、使用用途或方式、設備設置、專業技術人員設置、監視系統及瀏覽伺服規格、其他管理措施之指定及相關應遵行事項之辦法，由中央主管機關定之。","note":"一、 取管理措施。包含簽訂契約、產品驗證、檢測、設置監控系統（如錄影監視、瀏覽伺服）或設置專業技術人員。"},{"bill":"202110209810000","text":"中央主管機關得考量事業廢棄物或再利用產品之用途、成分、特性、數量、棄置風險及其他相關因素，指定產源事業、再利用事業及再利用產品使用者，採取下列全部或一部之管理措施：\n一、簽訂再利用委託或再利用產品銷售契約書及記載中央主管機關指定事項。\n二、進行再利用產品或再利用製程之驗證。\n三、進行再利用產品檢測。\n四、限制再利用產品銷售對象。\n五、限制再利用產品使用用途或方式。\n六、設置中央主管機關指定之設備。\n七、設置專業技術人員。\n八、設置閉路電視錄影監視系統及瀏覽伺服，供主管機關檢視。\n九、其他經中央主管機關指定之管理措施。\n前項產源事業、再利用事業及再利用產品使用者之指定、契約書應記載事項、驗證事項、產品檢測事項、檢測報告應具備之內容、銷售對象、使用用途或方式、設備設置、專業技術人員設置、監視系統及瀏覽伺服規格、其他管理措施之指定及相關應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為強化事業廢棄物再利用及再利用產品使用管理，中央主管機關得視其運作風險，明定不同管理措施，例如再利用產品做為原料、材料等，高質化再利用之運作風險相對較低；如用於填土、燃料等用途，因受社會關注度大、管理密度需求較高，有強化管理之必要，爰為第一項規定：\n(一)第一款在透過簽訂契約方式，使產源事業、再利用事業及再利用產品使用者於實際從事再利用運作或使用產品前，掌握後續再利用行為及再利用產品使用符合相關規定。\n(二)第二款在透過驗證機制提升再利用產品市場接受度及競爭力。\n(三)第三款在透過再利用產品檢測，確認產品符合品質規範。\n(四)第四款要求再利用事業銷售再利用產品之對象應符合資格。\n(五)第五款要求再利用產品使用者應依規定使用再利用產品。\n(六)第六款要求產源事業、再利用事業及再利用產品使用者應設置必要之設備，確保再利用行為及再利用產品使用符合相關規定。\n(七)第七款要求設置專業技術人員，以強化再利用機構自我管理能力。\n(八)第八款要求設置閉路電視錄影監視系統及瀏覽伺服，以利主管機關即時遠端檢視再利用運作情形。\n(九)第九款授權由中央主管機關視需求採取其他管理措施。\n三、第二項授權中央主管機關就第一項所定事項訂定辦法。"},{"bill":"202110209180000","text":"中央主管機關得考量事業廢棄物或再利用產品之用途、成分、特性、數量、棄置風險及其他相關因素，指定產源事業、再利用事業及再利用產品使用者，採取下列全部或一部之管理措施：\n一、簽訂再利用委託或再利用產品銷售契約書及記載中央主管機關指定事項。\n二、進行再利用產品或再利用製程之驗證。\n三、進行再利用產品檢測。\n四、限制再利用產品銷售對象。\n五、限制再利用產品使用用途或方式。\n六、設置中央主管機關指定之設備。\n七、設置專業技術人員。\n八、設置閉路電視錄影監視系統及瀏覽伺服，供主管機關檢視。\n九、其他經中央主管機關指定之管理措施。\n前項產源事業、再利用事業及再利用產品使用者之指定、契約書應記載事項、驗證事項、產品檢測事項、檢測報告應具備之內容、銷售對象、使用用途或方式、設備設置、專業技術人員設置、監視系統及瀏覽伺服規格、其他管理措施之指定及相關應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為強化事業廢棄物再利用及產品使用管理，中央主管機關得依運作風險採取分級管理措施（如填土、燃料用途管理強度較高），第一項規定如下：\n(一)透過契約機制，掌握產源、再利用及使用端之運作情形。\n(二)建立驗證機制，提升產品市場信任。\n(三)辦理產品檢測，確保品質符合規範。\n(四)限制再利用產品銷售對象之資格。\n(五)規範使用者依規定使用產品。\n(六)要求設置必要設備，確保運作合規。\n(七)設置專業技術人員，強化自主管理。\n(八)設置監視系統，供主管機關遠端查核。\n(九)授權中央主管機關採行其他必要管理措施。\n三、第二項授權中央主管機關就前項事項訂定相關辦法。"},{"bill":"202110209760000","text":"中央主管機關得考量事業廢棄物或再利用產品之用途、成分、特性、數量、棄置風險及其他相關因素，指定產源事業、再利用事業及再利用產品使用者，採取下列全部或一部之管理措施：\n一、簽訂再利用委託或再利用產品銷售契約書及記載中央主管機關指定事項。\n二、進行再利用產品或再利用製程之驗證。\n三、進行再利用產品檢測。\n四、限制再利用產品銷售對象。\n五、限制再利用產品使用用途或方 應記載事項、驗證事項、產品檢測事項、檢測報告應具備之內容、銷售對象、使用用途或方式、設備設置、專業技術人員設置、監視系統及瀏覽伺服規格、其他管理措施之指定及相關應遵行事項之辦法，由中央主管機關定之。","finalWhy":"","review":null},{"no":"第三十九條之三","current":null,"versions":[{"bill":"202110179890000","text":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業生產經中央主管機關指定之再利用產品，其再利用製程及產品規格，應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n前二項再利用產品品質規範、標示、使用限制、警語、供料履歷、驗證機構及認證機關（構）資格、驗證及認證程序、驗證及認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n再利用事業生產之改善及再利用產品推廣，由中央目的事業主管機關輔導之，並得委託或委辦其他機關（構）、法人或團體辦理。","note":"一、本條新增。\n二、第一項明定經指定之再利用產品應符合品質規範及標示義務。\n三、第二項定明經指定之再利用產品，其製程或規格應通過驗證。\n四、第三項授權中央主管機關訂定再利用產品品質、標示、驗證認證之相關管理規定。\n五、第四項考量再利用事業生產再利用產品過程及後續產品使用階段，涉及事業廢棄物產源、再利用製程及再利用產品管理等相關事項，各中央目的事業主管機關應掌握其所轄事業特性及運作情形，爰定明應負輔導改善及產品推廣之權責。"},{"bill":"202110204880000","text":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業依前條第一項第二款規定，應進行再利用產品或再利用製程之驗證者，其生產之再利用產品應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n第一項再利用產品之指定、再利用產品品質規範、標示、使用限制、警語、供料履歷，及前項驗證機構與認證機關（構）資格、驗證與認證程序、驗證與認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n中央目的事業主管機關應輔導再利用事業進行生產之改善及推廣再利用產品，並得委託或委辦其他機關（構）、法人或團體辦理。","note":"一、本條新增。\n二、第一項定明經指定之再利用產品應符合品質規範及標示義務。\n三、第二項定明經指定之再利用產品或再利用製程應通過驗證。\n四、第三項授權中央主管機關訂定再利用產品品質、標示、驗證、認證等相關事項之辦法。\n五、第四項考量再利用事業生產再利用產品過程及後續產品使用階段，涉及事業廢棄物產源、再利用製程及再利用產品管理等相關事項，各中央目的事業主管機關應掌握其所轄事業特性及運作情形，爰定明應負輔導改善及產品推廣之權責。"},{"bill":"202110207050000","text":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業依前條第一項第二款規定，應進行再利用產品或再利用製程之驗證者，其生產之再利用產品應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n第一項再利用產品之指定、再利用產品品質規範、標示、使用限制、警語、供料履歷，及前項驗證機構與認證機關（構）資格、驗證與認證程序、驗證與認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n中央目的事業主管機關應輔導再利用事業進行生產之改善及推廣再利用產品，並得委託或委辦其他機關（構）、法人或團體辦理。","note":"一、本條新增。\n二、第一項定明經指定之再利用產品應符合品質規範及標示義務。\n三、第二項定明經指定之再利用產品或再利用製程應通過驗證。\n四、第三項授權中央主管機關訂定再利用產品品質、標示、驗證、認證等相關事項之辦法。\n五、第四項考量再利用事業生產再利用產品過程及後續產品使用階段，涉及事業廢棄物產源、再利用製程及再利用產品管理等相關事項，各中央目的事業主管機關應掌握其所轄事業特性及運作情形，爰定明應負輔導改善及產品推廣之權責。"},{"bill":"202110207590000","text":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業依前條第一項第二款規定，應進行再利用產品或再利用製程之驗證者，其生產之再利用產品應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n第一項再利用產品之指定、再利用產品品質規範、標示、使用限制、警語、供料履歷，及前項驗證機構與認證機關（構）資格、驗證與認證程序、驗證與認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n中央目的事業主管機關應輔導再利用事業進行生產之改善及推廣再利用產品，並得委託或委辦其他機關（構）、法人或團體辦理。","note":"一、本條新增。\n二、第一項定明經指定之再利用產品應符合品質規範及標示義務。\n三、第二項定明經指定之再利用產品或再利用製程應通過驗證。\n四、第三項授權中央主管機關訂定再利用產品品質、標示、驗證、認證等相關事項之辦法。\n五、第四項考量再利用事業生產再利用產品過程及後續產品使用階段，涉及事業廢棄物產源、再利用製程及再利用產品管理等相關事項，各中央目的事業主管機關應掌握其所轄事業特性及運作情形，爰定明應負輔導改善及產品推廣之權責。"},{"bill":"201110206460000","text":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業依前條第一項第二款規定，應進行再利用產品或再利用製程之驗證者，其生產之再利用產品應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n第一項再利用產品之指定、再利用產品品質規範、標示、使用限制、警語、供料履歷，及前項驗證機構與認證機關（構）資格、驗證與認證程序、驗證與認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n中央目的事業主管機關應輔導再利用事業進行生產之改善及推廣再利用產品，並得委託或委辦其他機關（構）、法人或團體辦理。","note":"一、本條新增。\n二、第一項定明經指定之再利用產品應符合品質規範及標示義務。\n三、第二項定明經指定之再利用產品或再利用製程應通過驗證。\n四、第三項授權中央主管機關訂定再利用產品品質、標示、驗證、認證等相關事項之辦法。\n五、第四項考量再利用事業生產再利用產品過程及後續產品使用階段，涉及事業廢棄物產源、再利用製程及再利用產品管理等相關事項，各中央目的事業主管機關應掌握其所轄事業特性及運作情形，爰定明應負輔導改善及產品推廣之權責。"},{"bill":"202110209830000","text":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業依前條第一項第二款規定，應進行再利用產品或再利用製程之驗證者，其生產之再利用產品應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n第一項再利用產品之指定、再利用產品品質規範、標示、使用限制、警語、供料履歷，及前項驗證機構與認證機關（構）資格、驗證與認證程序、驗證與認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n中央目的事業主管機關應輔導再利用事業進行生產之改善及推廣再利用產品，並得委託或委辦其他機關（構）、法人或團體辦理。","note":"一、本條新增。\n二、定明再利用產品應符合品質規範，並應標示使用限制、警語及供料履歷。指定產品須經認可機構驗證後始得出廠，並由目的事業主管機關辦理產品推廣。"},{"bill":"202110209810000","text":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業依前條第一項第二款規定，應進行再利用產品或再利用製程之驗證者，其生產之再利用產品應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n第一項再利用產品之指定、再利用產品品質規範、標示、使用限制、警語、供料履歷，及前項驗證機構與認證機關（構）資格、驗證與認證程序、驗證與認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n中央目的事業主管機關應輔導再利用事業進行生產之改善及推廣再利用產品，並得委託或委辦其他機關（構）、法人或團體辦理。","note":"一、本條新增。\n二、第一項定明經指定之再利用產品應符合品質規範及標示義務。\n三、第二項定明經指定之再利用產品或再利用製程應通過驗證。\n四、第三項授權中央主管機關訂定再利用產品品質、標示、驗證、認證等相關事項之辦法。\n五、第四項考量再利用事業生產再利 使用階段，涉及事業廢棄物產源、再利用製程及再利用產品管理等相關事項，各中央目的事業主管機關應掌握其所轄事業特性及運作情形，爰定明應負輔導改善及產品推廣之權責。"}],"changed":true,"final":"再利用事業生產經中央主管機關指定之再利用產品，應符合產品品質規範，並於產品或其包裝、容器、銷售相關文件明顯處，標示使用限制、警語及供料履歷。\n再利用事業依前條第一項第二款規定，應進行再利用產品或再利用製程之驗證者，其生產之再利用產品應經中央主管機關認可之驗證機構或認證機關（構）認證之驗證機構驗證後，始得出廠（場）。\n第一項再利用產品之指定、再利用產品品質規範、標示、使用限制、警語、供料履歷，及前項驗證機構與認證機關（構）資格、驗證與認證程序、驗證與認證事項、廢止、管理及其他應遵行事項之辦法，由中央主管機關定之。\n中央目的事業主管機關應輔導再利用事業進行生產之改善及推廣再利用產品，並得委託或委辦其他機關（構）、法人或團體辦理。","finalWhy":"","review":null},{"no":"第三十九條之四","current":null,"versions":[{"bill":"202110179890000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、逾期完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於指定期限內完成修復。\n三、再利用產品貯存量超過指定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕配合廢棄物再利用運作查核，或拒絕提供再利用運作有關資料及說明。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依事業廢棄物清理計畫書之再利用檢核進行再利用。\n二、廠（場）內未依規定設置設備。\n三、未依規定進行再利用產品檢測。\n四、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、再利用產品不符合品質規範或銷售對象不符合規定。\n二、提供不實之檢測報告或驗證證明文件。\n三、再利用產品使用者未依規定使用。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）、改善證明文件、核准、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項規範主管機關得令再利用事業停止進廠（場）情形，各款說明如下：\n(一)增訂第一款，無法於期限完成廢棄物再利用作業者，足徵其再利用量能或去化能力出現落差。\n(二)增訂第二款，再利用設備故障或異常，且於指定期限仍無法完成修復，足認喪失基本再利用條件。\n(三)增訂第三款，再利用產品貯存超量，顯示去化能力不足。\n(四)增訂第四款，業者不配合查核作業或拒絕提供資料或說明，無法確認營運情形。\n(五)增訂第五款，賦予主管機關依個案實際情形判斷之概括條款。\n三、第二項規範主管機關得令再利用事業停止再利用運作情形，各款說明如下：\n(一)增訂第一款，確保再利用事業依事業廢棄物清理計畫書之再利用檢核進行再利用。\n(二)增訂第二款，確保再利用事業設置應有之設備。\n(三)增訂第三款，確保再利用事業依規定進行再利用產品檢測。\n(四)增訂第四款，理由同說明二(四)、(五)。\n四、第三項規範主管機關得令再利用事業停止銷售或運送再利用產品出廠（場）情形，各款說明如下：\n(一)增訂第一款，再利用產品若未符合品質規範及銷售對象規定，有污染環境之虞。\n(二)增訂第二款，若提供不實相關文件，產出之再利用產品有損害公眾或使用者權益之虞。\n(三)增訂第三款，再利用產品定有使用規範者，若使用者違規使用，有污染環境之虞。\n(四)增訂第四款，理由同說明二(四)、(五)。\n五、第四項規定再利用事業改善完成恢復再利用之程序。\n六、第五項授權中央主管機關訂定停止、恢復再利用行為有關事項之辦法。"},{"bill":"202110204880000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項規範主管機關得令再利用事業停止進廠（場）情形：\n(一)第一款係因未於一定期限完成廢棄物再利用作業者，足徵其再利用量能或去化能力出現落差。\n(二)第二款係因再利用設備故障或異常，且於一定期限仍無法完成修復，足認喪失基本再利用條件。\n(三)第三款係因再利用產品貯存超量，顯示去化能力不足。\n(四)第四款係因業者不配合查核作業或拒絕提供資料或說明，無法確認營運情形。\n(五)第五款賦予主管機關依個案實際情形判斷之概括條款。\n三、第二項規範主管機關得令再利用事業停止再利用運作情形：\n(一)第一款在確保再利用事業依規定進行再利用。\n(二)第二款在確保再利用事業依規定進行再利用產品或製程驗證。\n(三)第三款在確保再利用事業依規定進行再利用產品檢測。\n(四)第四款在確保再利用事業設置應有之設備。\n(五)第五款理由同說明二(四)、(五)。\n四、第三項規範主管機關得令再利用事業停止銷售或運送再利用產品出廠（場）情形：\n(一)第一款係考量再利用產品若未符合品質規範及銷售對象規定，有污染環境之虞。\n(二)第二款係考量若提供不實相關文件，產出之再利用產品有損害公眾或使用者權益之虞。\n(三)第三款係考量指定之再利用產品經中央主管機關依修正條文第三十九條之二第一項第五款規定限制使用用途或方式者，再利用事業明知使用者違規使用，仍持續銷售或運送，恐生環境風險，有污染環境之虞。\n(四)第四款理由同說明二(四)、(五)。\n五、第四項規定再利用事業改善完成恢復再利用相關行為之程序。\n六、第五項授權中央主管機關訂定停止、恢復再利用行為等相關事項之辦法。"},{"bill":"202110207050000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項規範主管機關得令再利用事業停止進廠（場）情形：\n(一)第一款係因未於一定期限完成廢 三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、授權主管機關針對違規業者（如再利用量能不足、設備故障、規避檢查）得令其停止收受廢棄物、停止再利用運作或停止銷售產品，並明定恢復程序。"},{"bill":"202110209810000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項規範主管機關得令再利用事業停止進廠（場）情形：\n(一)第一款係因未於一定期限完成廢棄物再利用作業者，足徵其再利用量能或去化能力出現落差。\n(二)第二款係因再利用設備故障或異常，且於一定期限仍無法完成修復，足認喪失基本再利用條件。\n(三)第三款係因再利用產品貯存超量，顯示去化能力不足。\n(四)第四款係因業者不配合查核作業或拒絕提供資料或說明，無法確認營運情形。\n(五)第五款賦予主管機關依個案實際情形判斷之概括條款。\n三、第二項規範主管機關得令再利用事業停止再利用運作情形：\n(一)第一款在確保再利用事業依規定進行再利用。\n(二)第二款在確保再利用事業依規定進行再利用產品或製程驗證。\n(三)第三款在確保再利用事業依規定進行再利用產品檢測。\n(四)第四款在確保再利用事業設置應有之設備。\n(五)第五款理由同說明二(四)、(五)。\n四、第三項規範主管機關得令再利用事業停止銷售或運送再利用產品出廠（場）情形：\n(一)第一款係考量再利用產品若未符合品質規範及銷售對象規定，有污染環境之虞。\n(二)第二款係考量若提供不實相關文件，產出之再利用產品有損害公眾或使用者權益之虞。\n(三)第三款係考量指定之再利用產品經中央主管機關依修正條文第三十九條之二第一項第五款規定限制使用用途或方式者，再利用事業明知使用者違規使用，仍持續銷售或運送，恐生環境風險，有污染環境之虞。\n(四)第四款理由同說明二(四)、(五)。\n五、第四項規定再利用事業改善完成恢復再利用相關行為之程序。\n六、第五項授權中央主管機關訂定停止、恢復再利用行為等相關事項之辦法。"},{"bill":"202110209180000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項明定主管機關得命再利用事業停止進廠（場），包括：未依限完成再利用、設備故障未修復、產品貯存超量、拒絕查核或提供資料，以及其他經認定有必要之情形。\n三、第二項明定得命停止再利用運作，包括：未依規定辦理再利用、驗證或檢測，未設置必要設備，或拒絕查核等情形。\n四、第三項明定得命停止再利用產品之銷售或運送，包括：產品不符品質或銷售規範、提供不實文件、明知違規使用仍銷售，或拒絕查核等情形。\n五、第四項明定改善完成後得申請恢復再利用行為之程序。\n六、第五項授權中央主管機關訂定停止及恢復作業等相關辦法。"},{"bill":"202110209760000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項規範主管機關得令再利用事業停止進廠（場）情形：\n(一)第一款係因未於一定期限完成廢棄物再利用作業者，足徵其再利用量能或去化能力出現落差。\n(二)第二款係因再利用設備故障或異常，且於一定期限仍無法完成修復，足認喪失基本再利用條件。\n(三)第三款係因再利用產品貯存超量，顯示去化能力不足。\n(四)第四款係因業者不配合查核作業或拒絕提供資料或說明，無法確認營運情形。\n(五)第五款賦予主管機關依個案實際情形判斷之概括條款。\n三、第二項規範主管機關得令再利用事業停止再利用運作情形：\n(一)第一款在確保再利用事業依規定進行再利用。\n(二)第二款在確保再利用事業依規定進行再利用產品或製程驗證。\n(三)第三款在確保再利用事業依規定進行再利用產品檢測。\n(四)第四款在確保再利用事業設置應有之設備。\n(五)第五款理由同說明二(四)、(五)。\n四、第三項規範主管機關得令再利用事業停止銷售或運送再利用產品出廠（場）情形：\n(一)第一款係考量再利用產品若未符合品質規範及銷售對象規定，有污染環境之虞。\n(二)第二款係考量若提供不實相關文件，產出之再利用產品有損害公眾或使用者權益之虞。\n(三)第三款係考量指定之再利用產品經中央主管機關依修正條文第三十九條之二第一項第五款規定限制使用用途或方式者，再利用事業明知使用者違規使用，仍持續銷售或運送，恐生環境風險，有污染環境之虞。\n(四)第四款理由同說明二(四)、(五)。\n五、第四項規定再利用事業改善完成恢復再利用相關行為之程序。\n六、第五項授權中央主管機關訂定停止、恢復再利用行為等相關事項之辦法。"},{"bill":"202110211360000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項規範主管機關得令再利用事業停止進廠（場）情形：\n(一)第一款係因未於一定期限完成廢棄物再利用作業者，足徵其再利用量能或去化能力出現落差。\n(二)第二款係因再利用設備故障或異常，且於一定期限仍無法完成修復，足認喪失基本再利用條件。\n(三)第三款係因再利用產品貯存超量，顯示去化能力不足。\n(四)第四款係因業者不配合查核作業或拒絕提供資料或說明，無法確認營運情形。\n(五)第五款賦予主管機關依個案實際情形判斷之概括條款。\n三、第二項規範主管機關得令再利用事業停止再利用運作情形：\n(一)第一款在確保再利用事業依規定進行再利用。\n(二)第二款在確保再利用事業依規定進行再利用產品或製程驗證。\n(三)第三款在確保再利用事業依規定進行再利用產品檢測。\n(四)第四款在確保再利用事業設置應有之設備。\n(五)第五款理由同說明二(四)、(五)。\n四、第三項規範主管機關得令再利用事業停止銷售或運送再利用產品出廠（場）情形：\n(一)第一款係考量再利用產品若未符合品質規範及銷售對象規定，有污染環境之虞。\n(二)第二款係考量若提供不實相關文件，產出之再利用產品有損害公眾或使用者權益之虞。\n(三)第三款係考量指定之再利用產品經中央主管機關依修正條文第三十九條之二第一項第五款規定限制使用用途或方式者，再利用事業明知使用者違規使用，仍持續銷售或運送，恐生環境風險，有污染環境之虞。\n(四)第四款理由同說明二(四)、(五)。\n五、第四項規定再利用事業改善完成恢復再利用相關行為之程序。\n六、第五項授權中央主管機關訂定停止、恢復再利用行為等相關事項之辦法。"},{"bill":"202110211860000","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製 五項授權中央主管機關訂定停止、恢復再利用行為等相關事項之辦法。"},{"bill":"201110206460001","text":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項規範主管機關得令再利用事業停止進廠（場）情形：\n(一)第一款係因未於一定期限完成廢棄物再利用作業者，足徵其再利用量能或去化能力出現落差。\n(二)第二款係因再利用設備故障或異常，且於一定期限仍無法完成修復，足認喪失基本再利用條件。\n(三)第三款係因再利用產品貯存超量，顯示去化能力不足。\n(四)第四款係因業者不配合查核作業或拒絕提供資料或說明，無法確認營運情形。\n(五)第五款賦予主管機關依個案實際情形判斷之概括條款。\n三、第二項規範主管機關得令再利用事業停止再利用運作情形：\n(一)第一款在確保再利用事業依規定進行再利用。\n(二)第二款在確保再利用事業依規定進行再利用產品或製程驗證。\n(三)第三款在確保再利用事業依規定進行再利用產品檢測。\n(四)第四款在確保再利用事業設置應有之設備。\n(五)第五款理由同說明二(四)、(五)。\n四、第三項規範主管機關得令再利用事業停止銷售或運送再利用產品出廠（場）情形：\n(一)第一款係考量再利用產品若未符合品質規範及銷售對象規定，有污染環境之虞。\n(二)第二款係考量若提供不實相關文件，產出之再利用產品有損害公眾或使用者權益之虞。\n(三)第三款係考量指定之再利用產品經中央主管機關依修正條文第三十九條之二第一項第五款規定限制使用用途或方式者，再利用事業明知使用者違規使用，仍持續銷售或運送，恐生環境風險，有污染環境之虞。\n(四)第四款理由同說明二(四)、(五)。\n五、第四項規定再利用事業改善完成恢復再利用相關行為之程序。\n六、第五項授權中央主管機關訂定停止、恢復再利用行為等相關事項之辦法。"}],"changed":true,"final":"再利用事業有下列情形之一者，主管機關得令其停止收受事業廢棄物進廠（場）：\n一、未於一定期限內完成廢棄物再利用作業。\n二、再利用設備故障或異常，未能於一定期限內完成修復。\n三、再利用產品貯存量超過一定期間之累積產出量或銷售量。\n四、規避、妨礙、拒絕主管機關依第九條第一項規定之檢查或提供再利用有關資料。\n五、其他經主管機關認定與再利用行為相關之違法情形。\n再利用事業有下列情形之一者，主管機關得令其停止再利用運作：\n一、未依第三十九條第一項所定方式進行再利用。\n二、未依第三十九條之二第一項第二款規定進行再利用產品或製程驗證。\n三、未依第三十九條之二第一項第三款規定進行再利用產品檢測。\n四、未依第三十九條之二第一項第六款規定設置中央主管機關指定之設備。\n五、有前項第四款或第五款規定情形。\n再利用事業有下列情形之一者，主管機關得令其停止銷售或運送再利用產品出廠（場）：\n一、未依第三十九條之二第一項第四款規定銷售再利用產品；或生產第三十九條之三第一項所定再利用產品，不符合產品品質規範。\n二、提供不實之再利用產品檢測報告或驗證證明文件。\n三、明知再利用產品之使用者未依第三十九條之二第一項第五款規定使用再利用產品，仍繼續銷售或運送。\n四、有第一項第四款或第五款規定情形。\n經主管機關作成前三項處分，再利用事業應檢具改善證明文件報請主管機關核准後，始得恢復再利用相關行為。\n第一項之一定期限及期間、前四項停止收受廢棄物進廠（場）、停止再利用運作、停止銷售或運送再利用產品出廠（場）之情形、改善證明文件應記載事項、核准之申請及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"","review":null},{"no":"第三十九條之五","current":null,"versions":[{"bill":"202110179890000","text":"加工再製經中央主管機關指定之再利用產品者（以下簡稱加工再製事業），應依第三十一條第一項第一款、第二項及第三項規定，於事業廢棄物清理計畫書載明加工再製流程，送直轄市、縣（市）主管機關或中央主管機關委託之機關審查核准後，始得為之。\n加工再製事業記錄、申報加工再製之再利用產品及產品品質規範、標示事項、驗證、採取之管理措施、專業技術人員設置與停止加工再製運作、銷售、運送及恢復加工再製相關行為，準用第三十九條第四項、第五項、第三十九條之二至前條規定。\n經中央主管機關指定加工再製之再利用產品，其使用者記錄、申報、使用證明保存、檢具環境監測報告書及提送環境監測結果報告，準用第三十九條之一規定。","note":"一、本條新增。\n二、為強化管理指定再利用產品之加工再製行為，爰於第一項定明加工再製事業之事業廢棄物清理計畫書須經審核機關審查核准，始得從事加工再製行為。\n三、考量指定再利用產品之加工再製及後續加工再製之再利用產品使用，應有與再利用事業相同之管理規範，爰於第二項、第三項定明準用第三十九條第四項、第五項及第三十九條之一至前條規定，以完善事業廢棄物再利用運作之全程管理。"},{"bill":"202110204880000","text":"加工再製中央主管機關指定之再利用產品者（以下簡稱加工再製事業），應依第三十一條第一項至第三項規定，於事業廢棄物清理計畫書載明加工再製流程，送直轄市、縣（市）主管機關或中央主管機關委託之機關審查核准後，始得為之。\n加工再製事業記錄、申報加工再製之再利用產品及產品品質規範、標示事項、驗證、專業技術人員設置與停止加工再製運作、銷售、運送與恢復加工再製相關行為及中央主管機關得對其採取之管理措施，準用第三十九條第三項、第四項、第三十九條之二至前條規定。\n經中央主管機關指定加工再製之再利用產品，其使用者記錄、申報、使用證明保存、檢具環境監測報告書申請核准及環境監測結果報告之備查，準用第三十九條之一規定。","note":"一、本條新增。\n二、為強化管理指定再利用產品之加工再製行為，爰於第一項定明加工再製事業之事業廢棄物清理計畫書須經審核機關審查核准，始得從事加工再製行為。\n三、考量指定再利用產品之加工再製及後續加工再製之再利用產品使用，應有與再利用事業相同之管理規範，爰於第二項、第三項定明準用第三十九條第三項、第四項及第三十九條之一至前條規定，以完善事業廢棄物再利用運作之全程管理。"},{"bill":"202110207050000","text":"加工再製中央主管機關指定之再利用產品者（以下簡稱加工再製事業），應依第三十一條第一項至第三項規定，於事業廢棄物清理計畫書載明加工再製流程，送直轄市、縣（市）主管機關或中央主管機關委託之機關審查核准後，始得為之。\n加工再製事業記錄、申報加工再製之再利用產品及產品品質規範、標示事項、驗證、專業技術人員設置與停止加工再製運作、銷售、運送與恢復加工再製相關行為及中央主管機關得對其採取之管理措施，準用第三十九條第三項、第四項、第三十九條之二至前條規定。\n經中央主管機關指定加工再製之再利用產品，其使用者記錄、申報、使用證明保存、檢具環境監測報告書申請核准及環境監測結果報告之備查，準用第三十九條之一規定。","note":"一、本條新增。\n二、為強化管理指定再利用產品之加工再製行為，爰於第一項定明加工再製事業之事業廢棄物清理計畫書須經審核機關審查核准，始得從事加工再製行為。\n三、考量指定再利用產品之加工再製及後續加工再製之再利用產品使用，應有與再利用事業相同之管理規範，爰於第二項、第三項定明準用第三十九條第三項、第四項及第三十九條之一至前條規定，以完善事業廢棄物再利用運作之全程管理。"},{"bill":"202110207590000","text":"加工再製中央主管機關指定之再利用產品者（以下簡稱加工再製事業），應依第三十一條第一項至第三項規定，於事業廢棄物清理計畫書載明加工再製流程，送直轄市、縣（市）主管機關或中央主管機關委託之機關審查 補正或完成改善者，按日連續處罰；情節重大者，得處一個月以上一年以下停工或停業處分；必要時，予以歇業處分：\n一、製造業或輸入業違反第十一條第一項指定應遵行事項之一或第二項公告事項者。","versions":[{"bill":"201110206460000","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。"},{"bill":"201110206460001","text":"有下列情形之一者，由中央主管機關處新臺幣一萬元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第二十一條第二項所定辦法有關循環標誌之核准事項、使用與標示之管理、變更、查核、抽樣檢驗之規定。\n二、違反第二十一條第三項規定，擅自使用、變造或不當使用循環標誌。\n三、指定物品或其包裝、容器之製造、輸入或販賣業者，未依第二十二條第一項所定期限揭露或標示資訊，或違反依同條第三項所定辦法有關揭露或標示內容、方式之規定。\n四、違反依第二十三條第三項所定辦法有關環保標章之標示、使用、管理、變更、查核、抽樣檢驗、資料提報之規定。\n五、有第二十四條各款所定行為之一。","note":"一、配合修正條文第二十一條至第二十四條關於循環標誌、產品數位資訊揭露、環保標章之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第一款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反循環標誌、揭露及環保標章規定尚無造成實質性危害，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。"}],"changed":false,"final":"事業於貯存、清除或處理事業廢棄物，危害人體健康或農、漁業時，主管機關應立即命其改善，並採取緊急措施。必要時，得命其停工或停業。","finalWhy":null,"review":null},{"no":"第四十一條","current":"從事廢棄物清除、處理業務者，應向直轄市、縣（市）主管機關或中央主管機關委託之機關申請核發公民營廢棄物清除處理機構許可文件後，始得受託清除、處理廢棄物業務。但有下列情形之一者，不在此限：\n一、執行機關依第五條第二項、第六項、第十二條第一項辦理一般廢棄物之回收、清除、處理、再利用。\n二、依第八條規定緊急清理廢棄物所指定之設施或設備。\n三、依第十四條第二項規定依中央主管機關公告或核准之方式清除、處理一般廢棄物。\n四、依第十八條第一項規定回收、貯存、清除、處理一般廢棄物。\n五、第二十八條第一項第二款、第三款第二目至第五目、第四款之清除機具、處理設施或設備。\n六、目的事業主管機關依第三十三條、第三十四條規定自行或輔導設置之處理設施。\n七、中央主管機關會同中央目的事業主管機關依第三十五條第一項設置之設施。\n八、其他經中央主管機關公告者。\n前項公民營廢棄物清除處理機構許可文件之核發，應副知中央主管機關。","versions":[{"bill":"202110179890000","text":"從事廢棄物清除、處理業務者，應向直轄市、縣（市）主管機關或中央主管機關委託之機關申請核發公民營廢棄物清除處理機構許可文件後，始得受託清除、處理廢棄物業務。但有下列情形之一者，不在此限：\n一、執行機關依第五條第二項、第六項、第十二條第一項辦理一般廢棄物之回收、清除、處理、再利用。\n二、依第八條規定緊急清理廢棄物所指定之設施或設備。\n三、依第十四條第二項規定依中央主管機關公告或核准之方式清除、處理一般廢棄物。\n四、依第十八條第一項規定回收、貯存、清除、處理廢棄物。\n五、第二十八條第一項第二款、第三款 七條第一項所定公告有關減量目標、方式、期限之規定，或違反依同條第二項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n三、製造、運輸業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定；輸入業者違反同條第三項規定。\n四、製造、輸入業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、配合修正條文第十六條、第十七條、第十九條及第二十條關於指定物品、包裝或容器重複使用、減量、延長使用之管理規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第三款修正移列為第三款。\n二、配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則；另基於違反物品或其包裝、容器重複使用規定未致環境污染之實害，爰刪除情節重大規定得停工、停業或歇業規定，並酌作文字修正。\n三、基於鼓勵業者自願配合包裝容器重複使用，第一款僅限於處罰違反強制實施重複使用規定之業者。"},{"bill":"201110206460000","text":"從事廢棄物清除、處理業務者，應向直轄市、縣（市）主管機關或中央主管機關委託之機關申請核發公民營廢棄物清除處理機構許可文件後，始得受託清除、處理廢棄物業務。但有下列情形之一者，不在此限：\n一、執行機關依第五條第二項、第六項、第十二條第一項辦理一般廢棄物之回收、清除、處理、再利用。\n二、依第八條規定緊急清理廢棄物所指定之設施或設備。\n三、依第十四條第二項規定依中央主管機關公告或核准之方式清除、處理一般廢棄物。\n四、依第十八條第一項所定標準回收、貯存、清除、處理廢棄物。\n五、第二十八條第一項第二款、第三款第二目至第五目、第四款之清除機具、處理設施或設備。\n六、目的事業主管機關依第三十三條、第三十四條規定自行或輔導設置之處理設施。\n七、中央主管機關會同中央目的事業主管機關依第三十五條第一項設置之設施。\n八、其他經中央主管機關公告者。\n前項公民營廢棄物清除處理機構許可文件之核發，應副知中央主管機關。","note":"一、第一項第四款配合修正條文第十五條公告應回收廢棄物之範疇，不受限於一般廢棄物，及配合修正條文第十八條第一項規定，酌作文字修正。\n二、第二項未修正。"},{"bill":"202110209830000","text":"從事廢棄物清除、處理業務者，應向直轄市、縣（市）主管機關或中央主管機關委託之機關申請核發公民營廢棄物清除處理機構許可文件後，始得受託清除、處理廢棄物業務。但有下列情形之一者，不在此限：\n一、執行機關依第五條第二項、第六項、第十二條第一項辦理一般廢棄物之回收、清除、處理、再利用。\n二、依第八條規定緊急清理廢棄物所指定之設施或設備。\n三、依第十四條第二項規定依中央主管機關公告或核准之方式清除、處理一般廢棄物。\n四、依第十八條第一項所定標準回收、貯存、清除、處理廢棄物。\n五、第二十八條第一項第二款、第三款第二目至第五目、第四款之清除機具、處理設施或設備。\n六、目的事業主管機關依第三十三條、第三十四條規定自行或輔導設置之處理設施。\n七、中央主管機關會同中央目的事業主管機關依第三十五條第一項設置之設施。\n八、其他經中央主管機關公告者。\n前項公民營廢棄物清除處理機構許可文件之核發，應副知中央主管機關。","note":"配合第十五條修正，將應回收廢棄物之回收、處理納入許可豁免範圍，並酌作文字修正。"},{"bill":"202110209810000","text":"從事廢棄物清除、處理業務者，應向直轄市、縣（市）主管機關或中央主管機關委託之機關申請核發公民營廢棄物清除處理機構許可文件後，始得受託清除、處理廢棄物業務。但有下列情形之一者，不在此限：\n一、執行機關依第五條第二項、第六項、第十二條第一項辦理一般廢棄物之回收、清除、處理、再利用。\n二、依第八條規定緊急清理廢棄物所指定之設施或設備。\n三、依第十四條第二項規定依中央主管機關公告或核准之方式清除、處理一般廢棄物。\n四、依第十八條第一項所定標準回收、貯存、清除、處理廢棄物。\n五、第二十八條第一項第二款、第三款第二目至第五目、第四款之清除機具、處理設施或設備。\n六、目的事業主管機關依第三十三條、第三十四條規定自行或輔導設置之處理設施。\n七、中央主管機關會同中央目的事業主管機關依第三十五條第一項設置之設施。\n八、其他經中央主管機關公告者。\n前項公民營廢棄物清除處理機構許可文件之核發，應副知中央主管機關。","note":"一、第一項第四款配合修正條文第十五條公告應回收 託清除、處理廢棄物業務。但有下列情形之一者，不在此限：\n一、執行機關依第五條第二項、第六項、第十二條第一項辦理一般廢棄物之回收、清除、處理、再利用。\n二、依第八條規定緊急清理廢棄物所指定之設施或設備。\n三、依第十四條第二項規定依中央主管機關公告或核准之方式清除、處理一般廢棄物。\n四、依第十八條第一項所定標準回收、貯存、清除、處理廢棄物。\n五、第二十八條第一項第二款、第三款第二目至第五目、第四款之清除機具、處理設施或設備。\n六、目的事業主管機關依第三十三條、第三十四條規定自行或輔導設置之處理設施。\n七、中央主管機關會同中央目的事業主管機關依第三十五條第一項設置之設施。\n八、其他經中央主管機關公告者。\n前項公民營廢棄物清除處理機構許可文件之核發，應副知中央主管機關。","note":"一、第一項第四款配合修正條文第十五條公告應回收廢棄物之範疇，不受限於一般廢棄物，及配合修正條文第十八條第一項規定，酌作文字修正。\n二、第二項未修正。"}],"changed":true,"final":"從事廢棄物清除、處理業務者，應向直轄市、縣（市）主管機關或中央主管機關委託之機關申請核發公民營廢棄物清除處理機構許可文件後，始得受託清除、處理廢棄物業務。但有下列情形之一者，不在此限：\n一、執行機關依第五條第二項、第六項、第十二條第一項辦理一般廢棄物之回收、清除、處理、再利用。\n二、依第八條規定緊急清理廢棄物所指定之設施或設備。\n三、依第十四條第二項規定依中央主管機關公告或核准之方式清除、處理一般廢棄物。\n四、依第十八條第一項所定標準回收、貯存、清除、處理廢棄物。\n五、第二十八條第一項第二款、第三款第二目至第五目、第四款之清除機具、處理設施或設備。\n六、目的事業主管機關依第三十三條、第三十四條規定自行或輔導設置之處理設施。\n七、中央主管機關會同中央目的事業主管機關依第三十五條第一項設置之設施。\n八、其他經中央主管機關公告者。\n前項公民營廢棄物清除處理機構許可文件之核發，應副知中央主管機關。","finalWhy":"一、第一項第四款配合修正條文第十五條公告應回收廢棄物之範疇，不受限於一般廢棄物，及配合修正條文第十八條第一項規定，酌作文字修正。\n二、第二項未修正。","review":null},{"no":"第四十二條","current":null,"versions":[{"bill":"201110206460000","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十六條第三項辦法之處罰規定，俾資周妥。"},{"bill":"201110206460001","text":"違反依第三十六條第三項所定辦法有關核准事項、變更、管理、執行成果提送期限或備查之規定，由中央主管機關處新臺幣六千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰。","note":"一、本條新增。\n二、為確保經中央主管機關核准之資源循環創新實驗計畫依據核准事項確實執行，並維護計畫管理之秩序與成效，爰定明違反第三十六條第三項辦法之處罰規定，俾資周妥。"}],"changed":false,"final":"前條第一項規定之公民營廢棄物清除處理機構應具備之條件、自有設施、分級、專業技術人員設置、許可、許可期限、廢止許可、停工、停業、歇業、復業及其他應遵行事項之管理辦法，由中央主管機關定之。","finalWhy":null,"review":null},{"no":"第四十三條","current":"檢驗測定機構應取得中央主管機關核發許可證，始得辦理本法規定之檢驗。\n前項檢驗測定機構之條件、設施、檢驗測定人員學經歷、許可證之申請、審查、核（換）發、廢止、停業、復業、歇業、查核、評鑑等程序及其他應遵行事項之管理辦法，由中央主管機關定之。","versions":[{"bill":"202110179890000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟如有檢驗測定機構尚未取得許可而須進行本相關檢驗測定或其他必要之情形，故參考水污染防治法第二十三條第一項規定，增加得經中央主管機關核准執行本法相關檢驗測定之規定，爰修正第一項。\n二、現行條文針對檢驗測定機構管理辦法授權之條文內容較為簡略，故參氣候變遷因應法第四十一條第二項規定，修正部分文字以增加完整性，爰修正第二項。"},{"bill":"202110204880000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定或其他必要之情形，爰參考水污染防治法第二十三條第一項規定，於第一項增訂得經中央主管機關核准執行本法相關檢驗測定之規定，並酌作文字修正。\n二、為期明確，並因應實務運作需求，爰參考氣候變遷因應法第四十一條第二項規定，修正第二項之授權事項。"},{"bill":"202110207050000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定或其他必要之情形，爰參考水污染防治法第二十三條第一項規定，於第一項增訂得經中央主管機關核准執行本法相關檢驗測定之規定，並酌作文字修正。\n二、為期明確，並因應實務運作需求，爰參考氣候變遷因應法第四十一條第二項規定，修正第二項之授權事項。"},{"bill":"202110207590000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定或其他必要之情形，爰參考水污染防治法第二十三條第一項規定，於第一項增訂得經中央主管機關核准執行本法相關檢驗測定之規定，並酌作文字修正。\n二、為期明確，並因應實務運作需求，爰參考氣候變遷因應法第四十一條第二項規定，修正第二項之授權事項。"},{"bill":"201110206460000","text":"有下列情形之一者，處新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、指定物品或其包裝、容器之販賣業者違反依第十六條第一項所定公告有關重複使用目標、方式、期限之規定，或違反依同條第三項所定辦法有關核准事項、管理、變更或執行成果備查之規定。\n二、販賣業者違反依第十九條第一項所定公告有關包裝減量目標、空間比例、層數、使用材質種類、數量之規定，或違反依同條第二項所定公告有關減量成果報告提報方式、期限、應記載事項之規定。\n三、販賣業者違反依第二十條第一項所定公告有關延長使用目標、方式之規定，或違反依同條第二項所定辦法有關必要設施設置方式、物品延長使用執行成果備查之規定。","note":"一、本條新增。\n二、考量販賣業者多屬小規模事業，爰針對該等業者違反修正條文第十六條、第十九條及第二十條指定物品、包裝或容器重複使用、減量、延長使用之管理規定，另增訂相關處罰規定，以符合責罰相當原則。"},{"bill":"201110206460000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定或其他必要之情形，爰參考水污染防治法第二十三條第一項規定，於第一項增訂得經中央主管機關核准執行本法相關檢驗測定之規定，並酌作文字修正。\n二、為期明確，並因應實務運作需求，爰參考氣候變遷因應法第四十一條第二項規定，修正第二項之授權事項。"},{"bill":"202110209830000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"增訂檢驗測定機構未取得許可時，得經中央主管機關核准後執行特定檢驗之規定，並修正許可證管理相關授權事項。"},{"bill":"202110209810000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定或其他必要之情形，爰參考水污染防治法第二十三條第一項規定，於第一項增訂得經中央主管機關核准執行本法相關檢驗測定之規定，並酌作文字修正。\n二、為期明確，並因應實務運作需求，爰參考氣候變遷因應法第四十一條第二項規定，修正第二項之授權事項。"},{"bill":"202110209180000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、原則上由經中央主管機關許可之檢驗測定機構辦理，惟考量實務需求，增訂經核准者亦得執行相關檢驗測定，並酌修文字。\n二、配合實務運作，修正第二項授權事項。"},{"bill":"202110209760000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定或其他必要之情形，爰參考水污染防治法第二十三條第一項規定，於第一項增訂得經中央主管機關核准執行本法相關檢驗測定之規定，並酌作文字修正。\n二、為期明確，並因應實務運作需求，爰參考氣候變遷因應法第四十一條第二項規定，修正第二項之授權事項。"},{"bill":"202110211360000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定或其他必要之情形，爰參考水污染防治法第二十三條第一項規定，於第一項增訂得經中央主管機關核准執行本法相關檢驗測定之規定，並酌作文字修正。\n二、為期明確，並因應實務運作需求，爰參考氣候變遷因應法第四十一條第二項規定，修正第二項之授權事項。"},{"bill":"202110211860000","text":"廢棄物之檢驗測定，除經中央主管機關核准外，應由取得中央主管機關核發許可證之檢驗測定機構辦理。\n前項檢驗測定機構應具備之條件、設施、檢驗測定人員資格限制、許可證之申請、審查程序、許可事項、廢止、許可證核（換）發、停業、復業、查核、評鑑程序、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本法相關檢驗測定，原則上應由取得中央主管機關核發許可之檢驗測定機構辦理，惟考量有檢驗測定機構尚未取得許可而須進行本法相關檢驗測定 權益，增訂違反行為之處罰規定。\n三、考量業者係自願採取相關措施，允宜與強制性業者違反規定行為，區分不同法定罰鍰上、下限額度，俾使罰責相當。"},{"bill":"201110206460001","text":"第二十八條第二項至第五項、第三十九條之二第一項第七款、第三十九條之五第二項、第四十二條所定專業技術人員之資格、合格證書取得、廢止、訓練、執行業務、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第三十九條之二第一項第七款、第三十九條之五第二項訂有專業技術人員設置事項，爰納入增訂相關條文，並修正授權事項，以期明確。\n二、為與空氣污染防制法等環境保護法律立法體例一致，爰刪除「會同中央目的事業主管機關」文字。"}],"changed":true,"final":"第二十八條第二項至第五項、第三十九條之二第一項第七款、第三十九條之五第二項、第四十二條所定專業技術人員之資格、合格證書取得、廢止、訓練、執行業務、管理及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、配合修正條文第三十九條之二第一項第七款、第三十九條之五第二項定有專業技術人員設置事項，爰納入增訂相關條文，並修正授權事項，以期明確。\n二、為與空氣污染防制法等環境保護法律立法體例一致，爰刪除「會同中央目的事業主管機關」文字。","review":null},{"no":"第四十五條","current":"前條所稱情節重大，係指有下列情形之一者：\n一、違反本法同一規定，一年內經二次限期改善，仍繼續違反本法規定者。\n二、未依規定回收再利用再生資源，嚴重污染環境者。\n三、申請、申報及記錄之文件虛偽不實者。\n四、其他經主管機關認定者。","versions":[{"bill":"201110206460000","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"},{"bill":"201110206460001","text":"第三十九條所稱情節重大，指有下列情形之一者：\n一、違反第八條第一項、第二十五條第二項、第四項、第二十七條第二項或第二十八條規定，一年內經二次限期改善，仍繼續違反同一規定。\n二、未依第二十五條第二項或第四項規定循環利用再生資源，嚴重污染環境。\n三、申請、申報或記錄之文件虛偽不實。\n四、其他經主管機關或目的事業主管機關認定情形。","note":"一、條次變更。\n二、配合現行第二十六條移列修正條文第三十九條，酌作文字修正。"}],"changed":false,"final":"違反第十二條、第十八條第一項、第二十八條第一項、第七項、第三十六條第一項、第三十八條第一項、第三十九條或第四十一條第一項規定，因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣三千萬元以下罰金；致重傷者，處三年以上十年以下有期徒刑，得併科新臺幣二千五百萬元以下罰金；致危害人體健康導致疾病者，處一年以上七年以下有期徒刑，得併科新臺幣二千萬元以下罰金。\n偽造、變造第二十四條第三項收費證明標誌者，處二年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n販賣前項收費證明標誌者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。","finalWhy":null,"review":null},{"no":"第四十六條","current":"有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，致污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第四十一條第一項規定領有廢棄物清除、處理許可文件，從事廢棄物貯存、清除、處理，或未依廢棄物清除、處理許可文件內容貯存、清除、處理廢棄物。\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。","versions":[{"bill":"202110036230000","text":"有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，致污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第四十一條第一項規定領有廢棄物清除、處理許可文件，從事廢棄物貯存、清除、處理，或未依廢棄物清除、處理許可文件內容貯存、清除、處理廢棄物。\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。\n意圖營利而有前項第一款行為者，處一年以上七年以下有期徒刑，得併科新臺幣三千萬元以下罰金。","note":"一、現行廢棄物清理法第四十六條第一項第一款規定：「任意棄置有害事業廢棄物，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金。」任意棄置有害事業廢棄物已然可惡，以傾倒有害事業廢棄物為營利者更是罪大惡極。\n二、雖條文已明文規定任意棄置有害事業廢棄物之處罰，然近來非法傾倒之情形不減反增，許多不法廠商藉此營利，大量傾倒有害廢棄物於農地、山區、溪邊，非法所得高達千萬，不但造成環境的負擔，亦造成附近居民身體不適；環境復原的成本動輒上百億，恢復時間亦須花上數十年，廠商獲利，成本卻由全民買單。\n三、有鑑於此，為有效遏止現行以傾倒有害事業廢棄物為營利之犯罪行為，爰擬具「廢棄物清理法第四十六條條文修正草案」，針對以營利為目的、惡意棄置有害廢棄物之廠商加重罰則並提高罰金額度，以儆效尤。"},{"bill":"202110128350000","text":"有下列情形之一者，處三年以上七年以下有期徒刑，得併科新臺幣三千萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，致污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第四十一條第一項規定領有廢棄物清除、處理許可文件，從事廢棄物貯存、清除、處理，或未依廢棄物清除、處理許可文件內容貯存、清除、處理廢棄物。\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。","note":"一、現行廢棄物清理法第四十六條第一項規定：「有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金。」然而任意棄置廢棄物造成之汙染卻由民眾共同承擔，尤其本條文第一項第一款所述之「有害事業廢棄物」對環境影響更甚嚴重，不肖業者為求獲利，任意棄置農田、魚塭、水域所造成的危害更是難以估計，導致業者取得高額營利，但危害卻由人民共同承擔的惡果。\n二、為遏止本條文第一項所列之違法情形再對環境造成傷害，遂提高刑期與罰鍰金額，以期強化處罰及達到嚇阻效果。"},{"bill":"202110164950000","text":"有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，致污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第四十一條第一項規定領有廢棄物清除、處理許可文件，從事廢棄物貯存、清除、處理，或未依廢棄物清除、處理許可文件內容貯存、清除、處理廢棄物。\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。\n七、從事廢棄物運輸之駕駛或相關人員，明知或可得而知所運輸之廢棄物將遭非法棄置、回填、堆置或處理，而仍執行運輸者。","note":"一、補足法律漏洞：現行第第四十六條雖已規範非法棄置、回填、無證清理等行為，但未明確納入「運輸駕駛」之刑責，導致實務上責任多集中於業者與承攬人，司機常以受僱或不知情之理由規避。\n二、確保責任鏈完整：將駕駛及相關運輸人員明文納入，形成「委託人－業者－駕駛」完整責任鏈。\n三、提高嚇阻效果：建立刑責威嚇，避免駕駛成為不法行為的關鍵破口，減少棄置事件發生。"},{"bill":"202110167170000","text":"有下列情形之一者，處三年以上七年以下有期徒刑，得併科新臺幣三千萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，致污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第四十一條第一項規定領有廢棄物清除、處理許可文件，從事廢棄物貯存、清除、處理，或未依廢棄物清除、處理許可文件內容貯存、清除、處理廢棄物。\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。","note":"一、依過去實務案例，許多不肖業者為求獲利，任意棄置廢棄物於農田、魚塭、水域等地，對環境影響更甚嚴重，爰增加嚇阻效果。\n二、為有效遏止不法行為，參酌水土保持法、水利法罰則加重刑期及罰金，以任意丟棄廢棄物情事發生。"},{"bill":"202110179890000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第二項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第二項規定再利用方式未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於農地或中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，得加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正除由主管機關及營建剩餘土石方主管機關合作建立全方位廢棄物管理機制之外，並參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law, (EU) 2024/1203）即對環境犯罪加重刑事處罰。\n三、修正第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰，說明如次：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責污染結果與污染行為之因果關聯的舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明文將未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列新增第五款，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)現行第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，說明如次：\n(一)考量農地或環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考森林法第五十一條第三項規定，定明得加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)所稱「農地」，指農業發展條例第三條第十款、第十一款之「農業用地」及「耕地」；並授權中央主管機關以公告納入其他極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件。"},{"bill":"202110204880000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"202110207110000","text":"有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，致污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第四十一條第一項規定領有廢棄物清除、處理許可文件，從事廢棄物貯存、清除、處理，或未依廢棄物清除、處理許可文件內容貯存、清除、處理廢棄物。\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。\n意圖營利而有前項第一款行為者，處一年以上七年以下有期徒刑，得併科新臺幣三千萬元以下罰金。","note":"一、現行廢棄物清理法第四十六條第一項第一款規定：「任意棄置有害事業廢棄物，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金。」非法隨意棄置有害事業廢棄物之行徑固屬惡劣，然若進一步以此作為營利手段，其對社會之危害程度實屬重大。\n二、縱使條文已明定相關刑責與罰金，惟近年非法傾倒案件仍層出不窮，諸多不肖業者為牟取暴利，於農地、山林及溪流大量堆置有害廢棄物，其非法利得往往超過一千萬元。此舉不僅重創自然生態，更危害鄰近居民之健康；後續環境復原費用動輒高達百億元，修復時間更需耗費數十年，形成私人廠商獲取厚利、復原成本卻由納稅人概括承受之極度不公現象。\n三、有鑑於此，為強化對營利型有害廢棄物犯罪行為之打擊，針對營利目的、惡意棄置有害廢棄物之廠商，加重其法律責任並調高罰金額度，以收嚇阻之效。"},{"bill":"202110207050000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"202110207590000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"201110206460000","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十七條第一項、第四十條、第四十二條及第四十四條違反產品綠色設計、產品數位資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。"},{"bill":"201110206460000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例 處罰。以歐盟為例，其於西元二0二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"202110209180000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、近年環境犯罪中，違反廢棄物清理法占比近九成，本條違規尤為主要來源，顯示強化刑責以遏止非法棄置刻不容緩。\n二、參考國際趨勢（如2024年歐盟《刑事保護環境指令》），本次修正加重刑事處罰，以提升嚇阻效果。\n三、修正現行條文為第一項，重點如下：\n(一)提高最高刑度至七年。\n(二)將「致污染環境」修正為「足以生污染環境」，引入「適性犯」概念，降低舉證負擔並強化執法。\n(三)明確納入未經許可或違反許可從事再利用之行為，並區分不同犯罪型態。\n(四)刪除重複規定，提升條文明確性。\n四、增訂第二項加重處罰：\n(一)於環境敏感地區犯罪者，加重其刑至二分之一。\n(二)授權中央主管機關公告環境敏感地區，以強化保護與執法依據。"},{"bill":"202110209760000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"202110211360000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣二千萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"202110211710000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，致污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第四十一條第一項規定領有廢棄物清除、處理許可文件，從事廢棄物貯存、清除、處理，或未依廢棄物清除、處理許可文件內容貯存、清除、處理廢棄物。\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。\n於中央主管機關公告之生態、資源環境敏感及原住民族地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、第一項有期徒刑刑度由五年提高為七年。此因原住民族地區多位於山區或生態保護區域，常因巡查不易淪為非法棄置熱區，大幅提升刑度對該類地區犯罪行為之嚇阻力。\n二、新增第二項，採適性犯認定：司法機關無須證明污染結果，僅需依個案行為屬性（如棄置規模、環境地質敏感度）判定是否具備特定危險性質即可處罰，有助於實務偵辦。且依照內政部國土管理署公告之環境敏感程度地區、原住民族地區範圍，一旦土壤受損，將造成不可逆或長期之實質損害，故參考《野生動物保育法》第四十一條、第四十二條規定增訂加重其刑至二分之一之規定，以有效維護環境。"},{"bill":"202110211860000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法占比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/ 1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"202110214910000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第二項第二款、第三款或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定方式、第二項取得之許可文件內容或第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"202110214090000","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/ 1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"},{"bill":"201110206460001","text":"本法所定之處罰，除另有規定外，由直轄市或縣（市）主管機關為之。","note":"一、條次變更。\n二、考量修正條文第八條已定明行政檢查權責，爰刪除第一項規定。\n三、本法之處罰機關，除修正條文第三十九條違反行政檢查、再生資源運作管理規定，由主管機關或目的事業主管機關裁處，與第三十七條第一項、第四十條、第四十二條及第四十四條違反產品綠色設計、產品數位資訊揭露、環保標章及資源循環創新實驗計畫之管理規定，已定明由中央主管機關裁處外，由直轄市或縣（市）主管機關處罰，爰修正第二項規定，並移列為本條文。"},{"bill":"201110206460001","text":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第二款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","note":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法佔比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/ 1203）即對環境犯罪加重刑事處罰。\n三、現行條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量現行第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。"}],"changed":true,"final":"有下列情形之一者，處一年以上七年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、任意棄置有害事業廢棄物。\n二、事業負責人或相關人員未依本法規定之方式貯存、清除、處理或再利用廢棄物，足以生污染環境。\n三、未經主管機關許可，提供土地回填、堆置廢棄物。\n四、未依第三十九條第一項第四款第二目或第四十一條第一項規定取得許可文件，從事廢棄物清除、處理或再利用。\n五、未依第三十九條第一項所定再利用方式或未依第四十一條第一項取得之廢棄物清除、處理許可文件內容貯存、清除、處理或再利用，足以生污染環境。\n於中央主管機關公告之生態、資源利用環境敏感地區內，犯前項之罪者，加重其刑至二分之一。","finalWhy":"一、據統計近年來我國環境犯罪案件，違反廢棄物清理法占比幾近九成，其中違反本條規定尤為大宗，足見遏止廢棄物非法棄置、防堵廢棄物相關環境犯罪至關重要。\n二、本次修正參考國際立法趨勢加重本條刑事處罰。以歐盟為例，其於西元二○二四年四月三十日公布「刑事保護環境指令」（the protection of the environment through criminal law,（EU）2024/ 1203）即對環境犯罪加重刑事處罰。\n三、原條文修正列為第一項，將最高刑度提高為七年，並明文「適性犯」之犯罪類型、將違法再利用之樣態明文納入刑事處罰如下：\n(一)第一款、第三款未修正。\n(二)為符合罪刑相當原則及比例原則，相較具體危險犯之「致污染環境」規定，須證明因果關係；而抽象危險犯則有刑罰過度擴大適用之質疑，因此德國發展出緩和措施，其中德國「適性犯」（Eignungsdelikte）之立法模式即為其中最具代表性之刑事立法選擇。爰修正第二款構成要件，將原「致污染環境」之具體危險犯修正為「足以生污染環境」之適性犯。\n(三)適性犯係藉由「適性（Geeignetheit）」之行為特性論述，嘗試以描述規範之構成要件要素，呈現行為必須存在有規範所要求之特定危險性質，在個案中司法機關不需要如具體危險犯，負責就污染結果與污染行為之因果關聯舉證，只要行為滿足構成要件所描述之危險條件，即可加以處罰。亦即經由「足以生」之構成要件，由司法機關針對個案行為屬性判斷是否成罪。例如：實務上可就具體個案棄置規模、對環境之影響描述、污染存續時間、採樣檢測數據等證據資料，認定是否該當「足以生污染環境」構成要件，併予敘明。\n(四)考量原第四款前、後段之犯罪型態不同，爰分列二款。前段於第四款規範未依規定取得許可而從事廢棄物清除、處理或再利用，並明定未取得許可再利用之刑罰規定，以符處罰明確性原則；後段移列增訂第五款規範，將未依規定或未依許可文件內容再利用明確納入處罰構成要件，新增「足以生污染環境」之構成要件，引入適性犯之犯罪類型，俾與行政罰有所區別，符合罪刑相當原則，並酌作文字修正。\n(五)第五款、第六款已於修正條文第四十六條之一明文，爰予刪除。\n四、增訂第二項加重處罰規定，理由如下：\n(一)考量環境敏感程度較高應予特別保護之地區，行為人如於該等區域內犯前項之罪，將對環境或人體健康造成極大風險或不可逆轉或長期性之實質損害，參考國際立法趨勢，有加重處罰必要，爰參考野生動物保育法第四十一條第二項規定，定明加重其刑至二分之一，以收嚇阻作用，有效維護環境及國民健康。\n(二)授權中央主管機關公告生態、資源利用環境敏感地區，以納入極易受到人為不當開發活動影響而產生環境負面效應，其生態環境及資源應予特別保護之地區，補充刑罰構成要件；中央主管機關將評估實務執行情形並綜合考量生物多樣性、環境品質及資源之永續利用等應保護之環境法益後，妥為公告。","review":null},{"no":"第四十六條之一","current":"第五款及第六款\n有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n五、執行機關之人員委託未取得許可文件之業者，清除、處理一般廢棄物者；或明知受託人非法清除、處理而仍委託。\n六、公民營廢棄物處理機構負責人或相關人員、或執行機關之人員未處理廢棄物，開具虛偽證明。","versions":[{"bill":"202110179890000","text":"有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條新增。\n二、考量現行第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列至本條明文，基於罪刑相當原則，維持最高刑度為五年及調整罰金刑；並納入再利用及其他處理機構及處理設施，以求周延。"},{"bill":"202110204880000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條新增。\n二、本條由第四十六條第五款、第六款修正移列。\n三、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"202110207050000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"202110207590000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"201110206460000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"202110209830000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、針對執行機關人員委託非法業者或開具虛偽證明行為調整刑責，以符罪刑相當原則。"},{"bill":"202110209810000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"202110209180000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條新增，係由現行第四十六條第五款、第六款移列修正。\n二、考量該等違規行為之性質與可責性不同於第四十六條其他款次，爰另列專條規範。\n三、修正重點如下：\n(一)依罪刑相當原則，參考刑法體例，維持最高刑度五年，並調整最低刑度及罰金。\n(二)配合實務，將委託清理行為之規範範圍，擴及再利用行為、再利用機構及其他處理機構或設施，以完備犯罪態樣。"},{"bill":"202110209760000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條新增。\n二、本條由第四十六條第五款、第六款修正移列。\n三、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"202110211360000","text":"有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一千五百萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條新增。\n二、本條由第四十六條第五款、第六款修正移列。\n三、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"202110211860000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"202110214910000","text":"有下列情形之一者，處一年以上五年以下有期徒刑，得併科新臺幣一百萬元以上、一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"202110214090000","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"},{"bill":"201110206460001","text":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","note":"一、本條由第四十六條第五款、第六款修正移列。\n二、考量第四十六條第五款、第六款之違規行為態樣及可責性，與同條第一款至第四款有所差異，爰移列本條規範，並修正如下：\n(一)基於罪刑相當原則，參考刑法第一百八十五條之四等刑罰級距體例，維持最高法定刑五年，調整最低法定刑及罰金刑。\n(二)考量第十四條、第二十八條、第三十九條等規定委託清理廢棄物之行為及委託對象，除清除、處理行為及取得廢棄物清除、處理文件之機構外，尚包括再利用行為、再利用機構及其他處理機構、處理設施，爰於第一款及第二款配合增訂其他犯罪態樣，以求周延。"}],"changed":true,"final":"有下列情形之一者，處六月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金：\n一、執行機關之人員委託非法清除、處理或再利用業者，清除、處理或再利用廢棄物；或明知受託人非法清除、處理或再利用而仍委託。\n二、公民營廢棄物處理機構、共同處理機構、再利用機構或第二十八條第一項第三款第三目至第六目之處理設施負責人或相關人員、執行機關之人員未處理或再利用廢棄物，開具虛偽證明。","finalWhy":"","review":null},{"no":"第四十七條","current":"法人之負責人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務犯前二條之罪者，除處罰其行為人外，對該法人或自然人亦科以各該條之罰金。","versions":[{"bill":"202110164950000","text":"法人之負責人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務犯前二條之罪者，除處罰其行為人外，對該法人或自然人亦科以各該條之罰金。\n前項所稱受僱人或從業人員，包括承攬或僱用之運輸駕駛。","note":"一、釐清人員範圍：現行第四十七條僅以「法人之負責人、代理人、受僱人或其他從業人員」概括規範，實務上運輸駕駛多以承攬或僱傭形式受雇，因角色模糊而難以追究責任。\n二、補足責任漏洞：增列「包括承攬或僱用之運輸駕駛」，使駕駛人明確被納入「從業人員」範疇，避免不法業者以「外包運輸」作為規避責任的手段。"},{"bill":"201110206460000","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"},{"bill":"201110206460001","text":"依本法所定罰鍰裁罰基準等相關事項之準則，由中央主管機關定之。","note":"一、本條新增。\n二、為適切裁罰，定明中央主管機關訂定裁罰準則之授權依據。"}],"changed":false,"final":"法人之負責人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務犯前二條之罪者，除處罰其行為人外，對該法人或自然人亦科以各該條之罰金。","finalWhy":null,"review":null},{"no":"第四十七條之一","current":null,"versions":[{"bill":"202110164950000","text":"從事廢棄物運輸之業者，應確保運輸車輛裝設全球定位系統（GPS）及監測設備，並保存運輸紀錄，供主管機關查核。但遭遇不可抗力因素致無法啟動並紀錄者除外。\n違反前項規定者，處新臺幣二十萬元以上一百萬元以下罰鍰，並得吊銷其運輸許可。","note":"一、本條新增。\n二、補強運輸過程監管：現行法對廢棄物「處理端」規範較完整，但「運輸端」缺乏科技監管，導致追蹤困難。\n三、科技取締：要求運輸車輛強制裝設GPS及監測設備，並保存紀錄，便於主管機關即時稽查與事後追溯，杜絕黑車趁機偷倒。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十八條","current":null,"versions":[{"bill":"201110206460000","text":"主管機關或目的事業主管機關依本法規定受理各項申請之審查，應收取審查費或證書費等規費。\n前項收費標準，由中央主管機關或中央目的事業主管機關定之。","note":"一、本條新增。\n二、配合本次修法新增之申請項目，第一項增訂收取費用規定。\n三、增訂第二項授權由中央主管機關或中央目的事業主管機關訂定收費標準（如修正條文第二十五條第五項再生資源項目之申請）。"},{"bill":"201110206460001","text":"主管機關或目的事業主管機關依本法規定受理各項申請之審查，應收取審查費或證書費等規費。\n前項收費標準，由中央主管機關或中央目的事業主管機關定之。","note":"一、本條新增。\n二、配合本次修法新增之申請項目，第一項增訂收取費用規定。\n三、增訂第二項授權由中央主管機關或中央目的事業主管機關訂定收費標準（如修正條文第二十五條第五項再生資源項目之申請）。"}],"changed":false,"final":"依本法規定有申報義務，明知為不實之事項而申報不實或於業務上作成之文書為虛偽記載者，處三年以下有期徒刑、拘役或科或併科新臺幣一千萬元以下罰金。","finalWhy":null,"review":null},{"no":"第四十九條","current":null,"versions":[{"bill":"201110206460000","text":"有第三十七條、第三十八條、第三十九條第二款、第四款、第四十條第一款至第三款、第五款、第四十一條、第四十三條所定情形之一者，主管機關得於中央主管機關指定之網站，公開違規業者之名稱、地址及違法情形。","note":"一、本條新增。\n二、為督促業者確實遵守法令，保障消費大眾權益避免遭受損害，及維護社會大眾知之權益，爰定明公開違規業者資訊之機制。"},{"bill":"201110206460001","text":"有第三十七條、第三十八條、第三十九條第二款、第四款、第四十條第一款至第三款、第五款、第四十一條、第四十三條所定情形之一者，主管機關得於中央主管機關指定之網站，公開違規業者之名稱、地址及違法情形。","note":"一、本條新增。\n二、為督促業者確實遵守法令，保障消費大眾權益避免遭受損害，及維護社會大眾知之權益，爰定明公開違規業者資訊之機制。"}],"changed":false,"final":"有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰，並得沒入清除機具、處理設施或設備：\n一、清除機具、處理設施或設備之所有人或使用人未於主管機關依第九條第二項所定期限內清除處理其廢棄物、剩餘土石方。\n二、清除廢棄物、剩餘土石方者，未隨車持有載明一般廢棄物、一般事業廢棄物、剩餘土石方產生源及處理地點之證明文件。\n三、清除有害事業廢棄物者，未隨車持有載明有害事業廢棄物產生源及處理地點之證明文件。","finalWhy":null,"review":null},{"no":"第四十九條之一","current":null,"versions":[{"bill":"202110179890000","text":"有下列情形之一者，由營建剩餘土石方直轄市、縣（市）主管機關處新臺幣六千元以上三十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，並得處三個月以上一年以下停工或停業處分：\n一、未依第十條之一第二項第一款規定取得營建剩餘土石方處理計畫核准逕行清運或再利用，或違反依同條第三項所定辦法有關核准事項、變更或管理之規定。\n二、違反依第十條之一第三項所定辦法有關網路申報方式、即時追蹤系統規格、審驗、運作、管理之規定。\n三、違反依第十條之一第三項所定辦法有關收容處理場所設置條件、設施或管理之規定。\n無正當理由規避、妨礙或拒絕接受第十條之一第四項之攔檢、檢查、採樣或命提供有關資料者，由營建剩餘土石方直轄市、縣（市）主管機關處新臺幣三萬元以上五百萬元以下罰鍰。\n施工廠商、清運業者、收容處理場所違反本法應處罰鍰額度之裁罰準則；改善完成及情節重大之認定、查驗方式及其他有關事項之準則，由營建剩餘土石方中央主管機關定之。","note":"一、本條新增。\n二、配合修正條文新增第十條之一規範營建剩餘土石方全流向管理機制，增訂違反其相關管理規定之處罰依據。另考量營建剩餘土石方性質與廢棄物尚有所區別，違反修正條文第十條之一規定之行為人優先依本條處罰，不適用本法其他罰則規定。且營建剩餘土石方中央主管機關及工程主辦機關無裁處權，須將違規案件移由營建剩餘土石方直轄市、縣（市）主管機關裁處。\n三、第一項定明違反營建剩餘土石方全流向管理規定之處罰機關及罰鍰額度上下限，依現行制度，由營建剩餘土石方直轄市、縣（市）主管機關裁罰之，如營建剩餘土石方中央主管機關查獲違規事實，亦移請其裁罰。並就不同違反態樣行為分款規定，且得就違反情節重大者予停工或停業處分。\n四、第二項規定規避、妨礙或拒絕營建剩餘土石方行政檢查之處罰。\n五、第三項授權營建剩餘土石方中央主管機關訂定有關本條罰鍰額度、改善完成、情節重大認定及查驗方式等事項之準則。\n六、另營建剩餘土石方如有非法棄置情形，依現行實務認定仍有第四十六條刑罰適用，併予說明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十條","current":"有下列情形之一者，處新臺幣一千二百元以上六千元以下罰鍰。經限期改善，屆期仍未完成改善者，按日連續處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反第十二條之規定。\n三、為第二十七條各款行為之一。","versions":[{"bill":"202110179890000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備及再利用之規定，或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n機動車輛駕駛人、乘客有前項各款情形之一，車輛所有人未於裁處前檢附相關證據及應歸責人相關證明文件告知處罰機關，以車輛所有人為受處罰人。但客運業於載客時已盡告知義務，乘客仍違反規定者，不適用之。","note":"一、第一項修正理由如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元，依本法第六十三條之一第一項規定，由中央主管機關依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。第一款及第三款未修正。\n二、為有效清除廢棄物及改善環境衛生，考量需藉由檢舉或攝錄影響查證之一般廢棄物違規案件，如係於機動車輛行駛或停車狀態中，駕駛或乘客有相關違規情事，考量車輛所有人通常為管領使用之人，得推斷車輛所有人為應歸責之人，且相關事證係處於車輛所有人得以支配範圍，爰參考道路交通管理處罰條例第八十五條規定，增訂第二項，定明以機動車輛所有人為處罰對象；並考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考該條例第三十一條第二項，增訂但書除外規定，乘客就其違規行為自負其責。其但書所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"},{"bill":"202110187440000","text":"有下列情形之一者，處新臺幣一千二百元以上六千元以下罰鍰。經限期改善，屆期仍未完成改善者，按日連續處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反第十二條之規定。\n三、為第二十七條各款行為之一。\n前項第二款、第三款之處罰對象為行為人。但使用汽機車輛違反第十二條、第二十七條第一款、第二款、第六款至第八款或第十款規定者，車輛所有人未於裁處前檢附相關證據及應歸責人相關證明文件告知處罰機關，以車輛所有人為受處罰人。","note":"因應使用汽機車輛違反衛生環境事件眾多且反覆發生，常見為運用汽機車輛代步並丟棄垃圾於路邊，檢舉或舉發時常衍生駕駛人非丟棄者而無法可罰，故考量車輛所有人為管領使用之人，參考道路交通管理處罰條例第八十五條規定，車輛所有人為應歸責之人，若有乘客有亂丟棄垃圾之行為，駕駛人應有監督、管理之責任，增訂第二項明定車輛所有人未於裁處前檢證告知其他應歸責人，即以之為處罰對象。"},{"bill":"202110204880000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影像，尚未能逕以影像資料直接查知確認違反第二十七條各款行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人者，應以該應歸責之人為處罰對象。\n(二)另考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考道路交通管理處罰條例第三十一條第二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"},{"bill":"202110207050000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影像，尚未能逕以影像資料直接查知確認違反第二十七條各款行為人身分等情形，考量在一般情形，車輛所有人為管領使用車輛之人，如有應處罰之違規事件，應可推斷車輛所有人為應歸責之人，爰將車輛所有人亦納入為受處罰人；如實際另有應歸責之人，參考道路交通管理處罰條例第八十五條第一項規定，於但書增訂舉證責任轉換之規定，車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人者，應以該應歸責之人為處罰對象。\n(二)另考量客運業者因無法強制管理乘客，為避免引發糾紛，爰參考道路交通管理處罰條例第三十一條第二項，將客運業於載客時已盡告知義務之情形亦納入但書規範。其所指客運業者，為汽車運輸業管理規則第二條第一項第一款至第四款之四類客運業者。"},{"bill":"202110207590000","text":"有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。","note":"一、現行條文列為第一項，並修正如下：\n(一)考量一般廢棄物違規情節輕重程度不一，現行法定罰鍰上限過低，不符環境維護目的之需，難收嚇阻之效，為有效遏止違法行為發生，參考日本、新加坡等國之立法例，將法定罰鍰上限提高為新臺幣十萬元；中央主管機關將依第六十三條之一第一項規定，依污染程度、特性及危害程度等，訂定一般性裁量準則，供為執行機關裁處之依循。\n(二)序文之按日連續處罰修正為按次處罰，以與其他環保法律體例相符，並酌作文字修正。\n(三)修正第二款，明確應處罰之相關規定事項。\n二、增訂第二項，理由如下：\n(一)行政罰係以處罰行為人為原則，基於現行實務屢有民眾檢舉或執行機關攝錄動力車輛行駛或停車狀態中之違規影
