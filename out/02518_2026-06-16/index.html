再生能源發電設備業者繳納回收清除處理費之義務與其費率及計費基礎，並定明再生能源設備責任業者得申請退費之條件。\n四、第二項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n五、第三項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n六、第四項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"},{"bill":"202110211360000","text":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。上開責任業者於妥善清理應回收廢棄物後，得檢附相關紀錄及證明文件向中央主管機關申請退費。\n前項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依第一項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項及前條第一項費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告。","note":"一、本條新增。\n二、本條由第十六條第一項、第四項、第五項修正移列。\n三、第一項增訂再生能源發電設備業者繳納回收清除處理費之義務與其費率及計費基礎，並定明再生能源設備責任業者得申請退費之條件。\n四、第二項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n五、第三項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n六、第四項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"},{"bill":"202110211860000","text":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。上開責任業者於妥善清理應回收廢棄物後，得檢附相關紀錄及證明文件向中央主管機關申請退費。\n前項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依第一項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項及前條第一項費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告。","note":"一、本條由第十六條第一項、第四項、第五項修正移列。\n二、第一項增訂再生能源發電設備業者繳納回收清除處理費之義務與其費率及計費基礎，並定明再生能源設備責任業者得申請退費之條件。\n三、第二項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n四、第三項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、第四項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"},{"bill":"202110214910000","text":"前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依前條規定辦理登記、申報之頻率、期限與方式，應申報之運作情形與運作量計量方式，回收清除處理費之費率或浮動費率公式、繳費頻率、方式、流程、期限、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n前條第一項費率或浮動費率公式，應反映回收清除處理成本（含回收獎勵金數額）與稽徵成本，並得依責任物材質、容積、重量、對環境之影響、再利用價值、回收清除處理率、基金財務狀況及其他相關因素，經中央主管機關所設之資源回收費率審議會審議後酌作調整，送中央主管機關核定公告。","note":"一、本條由第十六條第一項、第四項、第五項修正移列。\n二、第一項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n三、第二項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、第三項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"},{"bill":"202110214090000","text":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。上開責任業者於妥善清理應回收廢棄物後，得檢附相關紀錄及證明文件向中央主管機關申請退費。\n前項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n再生能源發電設備運轉年限到期前，向中央主管機關提出除役實施計畫，並載明設備設置基本資料、停止運轉後拆除、清除處理期程與規劃、重大天災應變清理預案及其他經中央主管機關指定事項。\n責任業者依第一項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、退費、前項規定除役實施計畫提出事項、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項及前條第一項費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告。","note":"一、本條由第十六條第一項、第四項、第五項修正移列。\n二、第一項增訂再生能源發電設備業者繳納回收清除處理費之義務與其費率及計費基礎，並定明再生能源設備責任業者得申請退費之條件。\n三、第二項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n四、鑑於我國自民國八十九年起推動風力發電開發應用，隨相關設備陸續屆滿使用年限，預計至民國一百十九年將有高達二百四十九座風力機組退役；另自民國一百二十一年後，退役太陽光電板數量亦將逐年增加，預估每年可達一萬公噸以上。再生能源發電設備除役後所衍生之廢棄物清除、處理、再利用及流向管理，已成為我國推動能源轉型與循環經濟過程中不可忽視之重要環境議題。爰增訂第三項，確保風力發電及太陽光電等再生能源設備於除役階段仍符合環境保護及資源循環原則，避免大量廢棄設備任意堆置、處理不當或流向不明，明定再生能源發電業者應於設備運轉年限屆滿前，向主管機關提出除役實施計畫，並載明設備種類、預定停止運轉時程、拆除期程、清除處理方式、再利用方式、流向管理機制及其他經中央主管機關指定事項，以利主管機關事前掌握、審查及追蹤管理。另考量不同再生能源設備之材料組成、除役程序、回收再利用技術及環境風險各有差異，爰於第二項授權中央主管機關就除役實施計畫之提出期限、應載事項、審查程序、拆除清除處理、再利用、流向追蹤及其他相關管理事項，訂定相關辦法，以建立完整之再生能源設備除役管理制度，落實循環經濟及永續發展目標。\n五、第四項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n六、第五項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"},{"bill":"201110206460001","text":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。上開責任業者於妥善清理應回收廢棄物後，得檢附相關紀錄及證明文件向中央主管機關申請退費。\n前項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依第一項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項及前條第一項費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，並送中央主管機關核定公告。","note":"一、本條由第十六條第一項、第四項、第五項修正移列。\n二、第一項增訂再生能源發電設備業者繳納回收清除處理費之義務與其費率及計費基礎，並定明再生能源設備責任業者得申請退費之條件。\n三、第二項由現行第十六條第一項後段移列修正，並依現行實務增訂回收清除處理費納入資源回收基金按比例撥入信託基金及非營業基金之規定，及定明撥入之一定比例授權中央主管機關訂定辦法規範。\n四、第三項由現行第十六條第四項移列修正，授權中央主管機關訂定責任業者相關管理規定之依據，另考量「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、第四項由現行第十六條第五項移列修正，配合現行法制體例，將費率審議委員會修正為「費率審議會」，並刪除後段有關訂定設置辦法之授權規定。"}],"changed":true,"final":"第十五條第一項第二款應回收廢棄物之責任業者，應向中央主管機關辦理登記；設備設置者應按當期購買量，製造業應按當期營業量扣抵設備設置者之購買量，輸入業應按向海關申報進口量扣抵當期設備設置者之購買量後，依中央主管機關核定之費率，繳納回收清除處理費。\n經目的事業主管機關全部或部分廢止同意備案或設備登記文件之再生能源發電設備設置者，應向中央主管機關提出回收計畫，並載明採自建回收鏈或依第十八條第四項規定申請補貼，經中央主管機關核准後據以執行；該設備設置者，於妥善清除處理應回收廢棄物後，得檢具相關紀錄及證明文件，向中央主管機關申請退費或補貼。\n第一項及前條第一項之回收清除處理費，應納入資源回收管理基金，委託金融機構收支保管，並按一定比例分別撥入信託基金及非營業基金；其一定比例與信託基金之收支、保管及運用之辦法，由中央主管機關定之。\n責任業者依第一項、第二項及前條規定辦理登記、申報、扣抵與回收清除處理費之繳費方式、流程、期限、回收計畫應記載事項、退費、管理及其他應遵行事項之辦法，由中央主管機關定之。\n第一項及前條第一項費率，由中央主管機關所設之資源回收費率審議會依材質、容積、重量、對環境之影響、再利用價值、回收清除處理成本、回收清除處理率、稽徵成本、基金財務狀況、回收獎勵金數額及其他相關因素審議，送中央主管機關核定公告；中央主管機關得訂定費率公式，依市場價格、物價變動指數及其他經資源回收費率審議會審定之相關因素，適時檢討費率並核定公告。","finalWhy":"","review":null},{"no":"第十七條","current":"前條第一項之資源回收管理基金，應使用於下列用途：\n一、支付回收清除處理補貼。\n二、補助獎勵回收系統、再生利用。\n三、執行機關代清理費用。\n四、經中央主管機關評選委託之公正稽核認證團體，其執行稽核認證費用。\n五、其他經中央主管機關同意，與一般廢棄物資源回收有關之用途。","versions":[{"bill":"202110179890000","text":"資源回收管理基金，應使用於下列用途：\n一、回收清除處理補貼。\n二、補助獎勵回收系統。\n三、執行機關代清理費用。\n四、經中央主管機關評選委託之公正稽核認證團體，其執行稽核認證費用。\n五、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、配合新增第十六條之一擴大回收清除處理費課徵對象範疇，新增相關基金來源，爰修正序文。\n二、第一款酌作文字修正。\n三、回收系統已可包含再生利用，為避免名詞混淆，爰刪除第二款再生利用之文字。\n四、第三款及第四款未修正。\n五、配合第十五條修正應回收廢棄物公告範疇不限於一般廢棄物，爰修正第五款基金用途文字。"},{"bill":"202110204880000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將現行第一款移列第一項，列為信託基金用途。\n二、現行第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。"},{"bill":"202110207050000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將現行第一款移列第一項，列為信託基金用途。\n二、現行第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。"},{"bill":"202110207590000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將現行第一款移列第一項，列為信託基金用途。\n二、現行第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品或其包裝、容器減量目標及方式，指定事業應於公告所定期限檢具減量計畫申請中央主管機關核准，並應提送執行成果報中央主管機關備查。\n前項減量計畫應記載事項、申請應備文件、審查、核准事項、管理、變更、廢止、執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進事業減少一次性物品或其包裝、容器之使用，爰於第一項授權中央主管機關得指定公告特定事業應強制性實施特定物品或其包裝、容器之減量措施，例如量販店、旅宿業一次性物品減量，機關、學校減少免洗餐具及飲用瓶裝水；經指定公告特定事業，應依指定公告目標、方式及期限提出減量計畫及提送執行成果。\n三、第二項授權中央主管機關訂定減量計畫核准、執行成果備查等相關事項之辦法。"},{"bill":"201110206460000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將現行第一款移列第一項，列為信託基金用途。\n二、現行第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。"},{"bill":"202110209830000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"明確區分資源回收管理基金之信託基金與非營業基金用途。將稽核認證費用列入非營業基金，並擴大基金用途至所有應回收廢棄物。"},{"bill":"202110209810000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將現行第一款移列第一項，列為信託基金用途。\n二、現行第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。"},{"bill":"202110209180000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為區分資源回收管理基金之信託基金及非營業基金用途，將現行第一款移列為第一項，作為信託基金用途。\n二、現行第二款至第五款移列為第二項，作為非營業基金用途，並修正如下：\n(一)原第二款移列第一款，刪除「再生利用」文字；原第三款移列第二款，內容未修正。\n(二)原第四款移列第三款，並明定稽核認證費用之法源依據。\n(三)原第五款移列第四款，配合第十五條擴大應回收廢棄物範疇，修正基金用途文字。"},{"bill":"202110209760000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將現行第一款移列第一項，列為信託基金用途。\n二、現行第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。"},{"bill":"202110211360000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","note":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將現行第一款移列第一項，列為信託基金用途。\n二、現行第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。"},{"bill":"202110211860000","text":"資源回收管理基金信託基金，應使用於回收清除處理補貼用途。\n 管理基金信託基金，應使用於回收清除處理補貼用途。\n資源回收管理基金非營業基金，應使用於下列用途：\n一、補助獎勵回收系統。\n二、執行機關代清理費用。\n三、依第十八條第五項執行稽核認證費用。\n四、其他經中央主管機關同意，與廢棄物資源回收有關之用途。","finalWhy":"一、為明確區分資源回收管理基金信託基金及非營業基金之用途，爰將原第一款移列第一項，列為信託基金用途。\n二、原第二款至第五款移列第二項，列為非營業基金用途，並修正如下：\n(一)第二款移列為第一款，因回收系統已可包含再生利用，為避免名詞混淆，爰刪除再生利用文字；第三款移列為第二款，內容未修正。\n(二)第四款移列為第三款，明列稽核認證費用之執行依據條項次。\n(三)第五款移列為第四款，並配合修正條文第十五條所定應回收廢棄物範疇不限於一般廢棄物，爰修正基金用途文字。","review":null},{"no":"第十八條","current":"依第十五條第二項公告之物品或其包裝、容器，經食用或使用後產生之一般廢棄物（以下簡稱應回收廢棄物），其回收、貯存、清除、處理，應符合中央主管機關之規定；其回收、貯存、清除、處理方法及設施標準，由中央主管機關定之。\n稽核認證團體應依稽核認證作業辦法之規定，辦理應回收廢棄物之回收處理量稽核認證；其稽核認證作業辦法，由中央主管機關定之。\n經中央主管機關指定公告一定規模以上應回收廢棄物之回收、處理業，應向主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之規模、登記、註銷、申報及其他相關應遵行事項之管理辦法，由中央主管機關定之。\n責任業者及回收、處理業，得向資源回收管理基金申請前條第一款之回收清除處理補貼，經資源回收管理基金審核符合第一項設施標準及第二項作業辦法之規定後，予以補貼。\n前項回收清除處理補貼之申請、審核管理辦法，由中央主管機關定之。","versions":[{"bill":"202110179890000","text":"依第十五條第二項公告之物品或其包裝、容器及依第十六條之一第二項公告之再生能源發電設備，經食用或使用後產生之廢棄物（以下簡稱應回收廢棄物），其回收、貯存、清除、處理，應符合中央主管機關之規定；其回收、貯存、清除、處理方法及設施標準，由中央主管機關定之。\n稽核認證團體應依應回收廢棄物稽核認證作業辦法之規定，辦理回收處理量稽核認證；其稽核認證作業之辦法，由中央主管機關定之。\n經中央主管機關指定公告一定規模以上應回收廢棄物之回收、處理業，應向主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及回收、處理業，得向資源回收管理基金申請前條第一款之回收清除處理補貼，經資源回收管理基金審核符合第一項設施標準及第二項作業辦法之規定後，予以補貼。\n前項回收清除處理補貼之申請、審核、廢止、追償、管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、配合第十五條及第十六條之一公告應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第二項酌作文字修正。\n三、第三項及第五項未修正。\n四、第四項授權條文配合法制體例酌修文字。\n五、第六項因應實務作業有廢止、追償之規定，爰明定授權事項。"},{"bill":"202110201390000","text":"依第十五條第二項公告之物品或其包裝、容器，經食用或使用後產生之一般廢棄物（以下簡稱應回收廢棄物），其回收、貯存、清除、處理，應符合中央主管機關之規定；其回收、貯存、清除、處理方法及設施標準，由中央主管機關定之。\n前項之應回收廢棄物中，屬動力型電動車電池、大型儲能電池或其他經公告具高能量密度及易燃性質之物品，其貯存、清除、處理方法及設施標準，中央主管機關應會同內政部定之。\n稽核認證團體應依稽核認證作業辦法之規定，辦理應回收廢棄物之回收處理量稽核認證；其稽核認證作業辦法，由中央主管機關定之。\n經中央主管機關指定公告一定規模以上應回收廢棄物之回收、處理業，應向主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之規模、登記、註銷、申報及其他相關應遵行事項之管理辦法，由中央主管機關定之。\n責任業者及回收、處理業，得向資源回收管理基金申請前條第一款之回收清除處理補貼，經資源回收管理基金審核符合第一項設施標準及第二項作業辦法之規定後，予以補貼。\n前項回收清除處理補貼之申請、審核管理辦法，由中央主管機關定之。","note":"要求其貯存、處理之設施標準，必須由環境部「會同內政部消防署」訂之，全國統一適用規格之消防與監控標準。"},{"bill":"202110204880000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"},{"bill":"202110207050000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"},{"bill":"202110207590000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"},{"bill":"201110206460000","text":"物品或其包裝、容器有下列情形之一者，中央主管機關得禁止或限制製造、輸入、販賣、使用；經限制製造、輸入、販賣或使用者，其製造、輸入、販賣或使用業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器禁止、限制之方式與範圍、各款所定情形之認定、資料備查及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，訂定較前項公告更加嚴格之自治法規或管制措施，報請中央主管機關核定。\n物品或其包裝、容器不符合第二項公告、前項自治法規或管制措施，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)為瞭解限制製造、輸入、販賣、使用之實際執行情形，於序文規範業者應提送產品產銷過程相關資料報中央主管機關備查。\n(二)於各款定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系效率或效益。\n三、第二項授權中央主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n四、增訂第三項，除禁用規定外，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，就特定事項擬訂加嚴管制自治法規或管制措施，報請中央主管機關核定。\n五、增訂第四項，為強化實務作為，定明直轄市、縣（市）主管機關得就不符合第二項、第三項規定之物品或其包裝、容器作成令業者為產品下架等處分。以現行實務運作為例，乾電池限制重金屬含量超標下架作業，由核發確認文件之地方主管機關命製造、輸入業者下架回收。"},{"bill":"201110206460000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"},{"bill":"202110209830000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條擴大應回收廢棄物範疇。\n二、明定回收處理業向地方主管機關登記之義務，並明確稽核認證作業之辦理、評鑑與考核機制。"},{"bill":"202110209810000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"},{"bill":"202110209180000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合第十五條擴大應回收廢棄物範圍，不限於一般廢棄物，修正第一項。\n二、原第三項移列第二項，並明定向各直轄市、縣（市）主管機關辦理登記。\n三、原第四項移列第三項，並配合法制體例酌修文字。\n四、原第五項移列第四項，明定申請回收清除處理補貼之條件。\n五、原第二項移列第五項，規範中央主管機關得委託稽核認證團體辦理回收處理量之稽核認證，並進行評鑑考核，及授權訂定相關辦法。\n六、修正第六項，明定廢止、追償等事項之授權訂定。"},{"bill":"202110209760000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄 \n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"},{"bill":"202110214090000","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"},{"bill":"201110206460001","text":"物品或其包裝、容器有下列情形之一者，中央主管機關得禁止或限制製造、輸入、販賣、使用；經限制製造、輸入、販賣或使用者，其製造、輸入、販賣或使用業者應提送營業量、生產量、進口量、銷售量及銷售對象、使用量、原料供應來源相關資料，報中央主管機關備查：\n一、過度耗用能資源。\n二、含長期不易腐化之成分。\n三、含有害物質之成分。\n四、有回收困難或干擾回收體系之虞。\n五、有嚴重污染環境之虞。\n前項物品或其包裝、容器禁止、限制之方式與範圍、各款所定情形之認定、資料備查及其他應遵行事項，由中央主管機關公告之。\n直轄市、縣（市）主管機關得視環境治理條件差異，就限制製造、輸入、販賣、使用物品或其包裝、容器之管制對象、項目、期限、減量、限制使用方式，訂定較前項公告更加嚴格之自治法規或管制措施，報請中央主管機關核定。\n物品或其包裝、容器不符合第二項公告、前項自治法規或管制措施，直轄市、縣（市）主管機關得令產品之製造、輸入、販賣及使用業者，將產品下架、銷毀、退運或為其他適當處置。","note":"一、條次變更。\n二、參考廢棄物清理法第二十一條物品或其包裝、容器公告禁用或限制製造、輸入、販賣、使用規定及同法第十五條物品或其包裝、容器性質規定，修正第一項，說明如下：\n(一)為瞭解限制製造、輸入、販賣、使用之實際執行情形，於序文規範業者應提送產品產銷過程相關資料報中央主管機關備查。\n(二)於各款定明物品或其包裝、容器具備特定條件時，得禁止或限制其製造、輸入、販賣、使用。\n(三)第四款所稱干擾回收體系，係指因某些物品之材質或成分破壞、妨礙或降低整體回收體系效率或效益。\n三、第二項授權中央主管機關公告禁止或限制製造、輸入、販賣、使用之物品或其包裝、容器、業者範圍、資料備查之相關管理規定。\n四、增訂第三項，除禁用規定外，定明直轄市、（縣）市主管機關得考量環境治理條件差異等因素，就特定事項擬訂加嚴管制自治法規或管制措施，報請中央主管機關核定。\n五、增訂第四項，為強化實務作為，定明直轄市、縣（市）主管機關得就不符合第二項、第三項規定之物品或其包裝、容器作成令業者為產品下架等處分。以現行實務運作為例，乾電池限制重金屬含量超標下架作業，由核發確認文件之地方主管機關命製造、輸入業者下架回收。"},{"bill":"201110206460001","text":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。"}],"changed":true,"final":"應回收廢棄物之回收、貯存、清除、處理方法及設施標準，由中央主管機關依其種類定之。\n應回收廢棄物之回收、處理業達一定規模者，應向直轄市、縣（市）主管機關辦理登記，並申報其回收、處理量及相關作業情形。\n前項回收、處理業之一定規模、登記、註銷、申報、管理及其他應遵行事項之辦法，由中央主管機關定之。\n責任業者及第二項回收、處理業符合第一項所定標準，且應回收廢棄物之回收處理量經中央主管機關稽核認證者，得向資源回收管理基金申請前條第一項之回收清除處理補貼。\n中央主管機關得委託法人（以下簡稱稽核認證團體）辦理前項稽核認證作業，並應定期對稽核認證團體進行作業成效之評鑑及考核；稽核認證作業之辦理方式、評鑑、考核及其他相關事項之辦法，由中央主管機關定之。\n第四項回收清除處理補貼之申請、審核、廢止、追償、管理及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、配合修正條文第十五條所定應回收廢棄物之範圍擴增，不受限於一般廢棄物，爰修正第一項。\n二、第三項移列為第二項，並依實務現況，明定應向各直轄市、縣（市）主管機關辦理登記。\n三、第四項移列為第三項，並配合法制體例酌修文字。\n四、第五項移列為第四項，並定明申請回收清除處理補貼應符合之條件。\n五、第二項移列為第五項，明確規範中央主管機關得委託稽核認證團體辦理應回收廢棄物之回收處理量稽核認證作業及對稽核認證團體進行評鑑及考核，並授權中央主管機關訂定稽核認證作業之辦法。\n六、因應實務作業，修正第六項，明定廢止、追償等授權訂定辦法之事項。","review":null},{"no":"第十九條","current":"中央主管機關指定公告責任業者，應於物品或其包裝、容器上標示回收相關標誌；其業者範圍、標誌圖樣大小、位置及其他應遵行事項，由中央主管機關定之。\n經中央主管機關指定公告之物品或其包裝、容器之販賣業者，應依中央主管機關之規定，設置資源回收設施，並執行回收工作；其業者範圍、設施設置、規格及其他應遵行事項，由中央主管機關定之。","versions":[{"bill":"202110201390000","text":"中央主管機關指定公告責任業者，應於物品或其包裝、容器上標示回收相關標誌；其業者範圍、標誌圖樣大小、位置及其他應遵行事項，由中央主管機關定之。\n經中央主管機關指定公告之物品或其包裝、容器之販賣業者，應依中央主管機關之規定，設置資源回收設施，並執行回收工作；其業者範圍、設施設置、規格及其他應遵行事項，由中央主管機關定之。\n經中央主管機關公告之高能量密度電池，其回收、貯存、清除及處理，應建立數位化全程追蹤機制；其申報、監測及管理事項之辦法，由中央主管機關定之。","note":"針對高風險、高價值的電池廢棄物，建立數位化全程追蹤機制，確保電池從退役到再利用的流向完全透明。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。"},{"bill":"201110206460001","text":"中央主管機關得指定公告物品之運輸或販賣包裝之減量目標、空間比例、層數、使用材質之種類及數量，其製造、運輸、販賣業者應依公告事項辦理。\n前項業者應將辦理減量成果報告報中央主管機關備查；其備查程序、減量成果報告提報方式、期限、應記載事項及其他應遵行事項，由中央主管機關公告之。\n輸入業者輸入第一項指定公告物品者，其於銷售該物品時之包裝應符合該項公告之規定。","note":"一、條次變更。\n二、為減少廢棄物產生，減輕環境負荷，物品之運輸包裝及販賣包裝，應避免過度之情形，例如禮盒包裝、產品組合或非組合包裝等，爰修正第一項規定，授權中央主管機關得指定公告特定物品應實施包裝減量，並酌作文字修正。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n三、為利中央主管機關瞭解包裝減量之執行情形，課予業者提送減量成果報告備查之義務，爰增訂第二項，並授權中央主管機關公告包裝減量成果報告報備查程序等事項之規定。\n四、第二項移列為第三項，為區別輸入業者之買賣行為，爰修正原販賣文字為銷售，並要求輸入業者於銷售時須符合第一項物品包裝規定。另基於法律明確性，刪除「或與其效能相同或相似之產品」之文字。"}],"changed":false,"final":"中央主管機關指定公告責任業者，應於物品或其包裝、容器上標示回收相關標誌；其業者範圍、標誌圖樣大小、位置及其他應遵行事項，由中央主管機關定之。\n經中央主管機關指定公告之物品或其包裝、容器之販賣業者，應依中央主管機關之規定，設置資源回收設施，並執行回收工作；其業者範圍、設施設置、規格及其他應遵行事項，由中央主管機關定之。","finalWhy":null,"review":null},{"no":"第二十條","current":"主管機關得派員或委託專業人員攜帶證明文件進入依第十六條第一項、前條指定公告責任業者、販賣業者之場所及依第十八條第三項指定公告回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器之銷售對象、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料；必要時，並得請稅捐稽徵主管機關協助查核。","versions":[{"bill":"202110179890000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及依第十八條第三項指定公告回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料；必要時，並得請求有關機關、法人、團體協助或提供必要之資料。","note":"一、配合新增第十六條之一，擴大納入本條之查核對象及查核事項範圍，且該條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、另依現行實務需求，協助查核對象不限於稅捐稽徵主管機關，爰修正本條後段規定。"},{"bill":"202110204880000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"202110207050000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"202110207590000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"201110206460000","text":"中央主管機關得指定公告物品之延長使用目標及方式，其製造、輸入或販賣該物品之業者，應以下列指定方式辦理，並設置必要設施；其執行成果應報中央主管機關備查：\n一、提供使用過之物品回收服務。\n二、重複填充。\n三、提供租賃、押金回收或回購服務。\n四、提供維修服務及設置維修站點。\n五、提供一定保固年限。\n六、其他經中央主管機關認可之方式。\n前項必要設施設置方式、物品延長使用執行成果備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為延長物品使用壽命，提升資源使用效率，爰為第一項授權中央主管機關得指定公告物品延伸生產者責任，規範業者提供維修、租賃、延長保固、回購等方式，或以重複填充內容物再製造為產品方式進行物品循環，並應提報其執行成果；所稱必要設施，例如蒐集設施。\n三、第二項授權中央主管機關訂定物品延長使用之必要設施設置、執行成果備查等相關事項之辦法。"},{"bill":"201110206460000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"202110209830000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"擴大查核對象至再生能源設備責任業者與販賣業者。查核事項涵蓋營業量、銷售對象及原料來源等，並配合第十條之一修正協助查核之法源。"},{"bill":"202110209810000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"202110209180000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合第十五條第一項及第十六條之一修正，擴大查核對象及事項範圍，並以「責任業者」統稱，免逐一列舉，爰酌修文字。\n二、因第十條之一第二項已規範得請求相關機關（構）、法人或團體協助及提供資料，爰刪除重複規定。"},{"bill":"202110209760000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"202110211360000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"202110211860000","text":"主管機關得派員或委託專業人員攜帶證明文件進入責任業者、販賣業者之場所及第十八條第二項所定回收、處理業之回收、貯存、清除、處理場所，查核其營業量或進口量、物品或其包裝、容器及再生能源發電設備之銷售對象、銷售或購買量、原料供應來源、回收相關標誌、應回收廢棄物回收處理量，並索取進貨、生產、銷貨、存貨憑證、帳冊、相關報表及其他產銷營運或輸出入之相關資料。","note":"一、配合修正條文第十五條第一項及第十六條之一，擴大納入本條之查核對象及查核事項範圍，且第十五條第四項已簡稱責任業者，無須逐一臚列業者範圍，爰酌修文字。\n二、考量修正條文第十條之一第二項已規範「就本法規定事項所實施之檢查、查核、採樣及查證，得請求有關機關（構）、法人、團體協助或提供必要之資料」，爰配合刪除後段規定，以免重覆。"},{"bill":"202110214910000","text":"主管機關得派員或委託專 以公告禁用或限制製造、輸入、販賣、使用。","versions":[{"bill":"202110179890000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110204880000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110207050000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110207590000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"201110206460000","text":"製造、輸入、販賣、提供下列產品、服務之業者，得向中央主管機關申請核准使用循環標誌，並應依核准事項使用循環標誌於其產品、包裝或服務場所：\n一、循環產品：使用易於資源循環材質、一定比率再生材料或符合綠色設計準則等促進資源循環特性之產品。\n二、循環服務：提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務。\n前項循環標誌使用之申請條件、應備文件、審查、核准事項、使用與標示之管理、變更、查核、抽樣檢驗、廢止及其他應遵行事項之辦法，由中央主管機關定之。\n未經中央主管機關核准使用循環標誌之產品或服務，其產品製造、輸入、販賣或服務提供業者，不得擅自使用、變造或不當使用第一項之循環標誌。","note":"一、本條新增。\n二、為提升循環產品或循環服務之市場普及率及競爭力，並避免漂綠行為發生，以達到資源循環推動目的，爰增訂循環標誌核准使用及審查機制。\n三、第一項定明由循環產品或循環服務之相關業者得申請使用循環標誌；其標示方式得以數位化方式為之。第一款所定循環產品，例如：符合綠色設計準則產品、回收海洋廢棄物再製手機殼、蚵殼拖鞋等各種產品及二手品等；第二款所定循環服務，例如：協助從事提供包裝、容器租借及清洗、物品維修、交換等有利於提升資源共享及延長物品、包裝、容器使用壽命等。\n四、第二項授權由中央主管機關訂定有關循環標誌申請使用、標示等管理事項之辦法，以健全管理機制。\n五、第三項定明禁止使用循環標誌之情形。"},{"bill":"201110206460000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110209830000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110209810000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110209180000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110209760000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110211360000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110211860000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110214910000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"202110214090000","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"},{"bill":"201110206460001","text":"製造、輸入、販賣、提供下列產品、服務之業者，得向中央主管機關申請核准使用循環標誌，並應依核准事項使用循環標誌於其產品、包裝或服務場所：\n一、循環產品：使用易於資源循環材質、一定比率再生材料或符合綠色設計準則等促進資源循環特性之產品。\n二、循環服務：提供物品或其包裝、容器重複或延長使用等促進資源循環方式之服務。\n前項循環標誌使用之申請條件、應備文件、審查、核准事項、使用與標示之管理、變更、查核、抽樣檢驗、廢止及其他應遵行事項之辦法，由中央主管機關定之。\n未經中央主管機關核准使用循環標誌之產品或服務，其產品製造、輸入、販賣或服務提供業者，不得擅自使用、變造或不當使用第一項之循環標誌。","note":"一、本條新增。\n二、為提升循環產品或循環服務之市場普及率及競爭力，並避免漂綠行為發生，以達到資源循環推動目的，爰增訂循環標誌核准使用及審查機制。\n三、第一項定明由循環產品或循環服務之相關業者得申請使用循環標誌；其標示方式得以數位化方式為之。第一款所定循環產品，例如：符合綠色設計準則產品、回收海洋廢棄物再製手機殼、蚵殼拖鞋等各種產品及二手品等；第二款所定循環服務，例如：協助從事提供包裝、容器租借及清洗、物品維修、交換等有利於提升資源共享及延長物品、包裝、容器使用壽命等。\n四、第二項授權由中央主管機關訂定有關循環標誌申請使用、標示等管理事項之辦法，以健全管理機制。\n五、第三項定明禁止使用循環標誌之情形。"},{"bill":"201110206460001","text":"（刪除）","note":"一、本條刪除。\n二、現行禁限用規定，整合納入資源循環推動法，爰予刪除。"}],"changed":true,"final":"（刪除）","finalWhy":"一、本條刪除。\n二、原禁限用規定，整合納入資源循環推動法，爰予刪除。","review":null},{"no":"第二十二條","current":"事業經中央主管機關公告指定後，應自指定期限起，遵行經指定之下列事項：\n一、回收再生資源之種類及回收方式。\n二、產品標示使用之材質及再生資源比例。\n三、產品標示分類回收標誌。\n四、其他經中央主管機關會商中央目的事業主管機關指定之事項。\n前項事業之業別、指定期限及其他應遵行事項等，由中央主管機關會商中央目的事業主管機關定之。\n輸入業者輸入與第一項業別生產製造之效能相同或相似之產品，於販賣時應依第一項規定辦理。","versions":[{"bill":"201110206460000","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰刪除第一款。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。"},{"bill":"201110206460001","text":"中央主管機關得指定公告物品或其包裝、容器，其製造、輸入或販賣業者應依公告所定期限、方式揭露及標示下列資訊：\n一、使用之材質及再生粒（材）料比率。\n二、包裝材質及重量。\n三、可維修性、耐用性及維修方式。\n四、回收、拆解及再利用方式。\n五、分類回收標誌。\n六、其他經中央主管機關指定之事項。\n非屬前項指定公告之物品或其包裝、容器，其製造、輸入或販賣業者，得自願揭露及標示前項各款資訊。\n前二項物品或其包裝、容器資訊之計算方式、可維修性、耐用性評估方式、分類回收標誌圖樣、揭露與標示內容、方式及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、為促進消費者選購充分揭露資訊及利於維修或材料回收循環之產品，爰修正第一項，課予業者應以指定方式（參酌歐盟永續產品生態設計規範（ESPR）之產品數位護照制度納入數位化方式）揭露及標示其產品資訊之義務，說明如下：\n(一)考量現行實務無指定事業回收再生資源之種類及回收方式強制性規範樣態，尚需視回收再生資源之經濟效益及技術可行性進行評估，且其性質與本條係為規範資訊揭露及標示之義務不同，爰刪除第一款。\n(二)第二款移列第一款，並酌修文字。\n(三)增訂第二款，規範揭露及標示包裝材質及重量，以利後續查核。\n(四)增訂第三款，規範業者需依可維修性、耐用性計算方式計算及揭露結果，並公開維修方式等資訊，提升物品耐用性。\n(五)增訂第四款，規範揭露回收、拆解及再利用方式，以利材料回收循環。\n(六)第三款移列為第五款，並酌修文字。\n(七)第四款移列修正為第六款；另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。本款所定其他經中央主管機關指定之事項，例如參考歐盟電池法要求揭露多氯三聯苯、氯乙烯、苯、石綿纖維（Asbestos fiber）等十七項有害或需關注物質成分及比率，併予說明。\n三、為使自願實施產品數位化資訊揭露之業者有所依循，爰增訂第二項。\n四、第二項修正移列第三項，授權中央主管機關訂定揭露及標示等相關事項之辦法。另「會商中央目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n五、考量第一項已納入輸入業者，無需就輸入產品另為規範，爰刪除第三項。"}],"changed":false,"final":"中央主管機關得指定公告以回收獎勵金方式，回收應回收廢棄物之種類及其回收獎勵金數額。\n販賣業應依公告之回收獎勵金數額支付消費者，不得拒絕。","finalWhy":null,"review":null},{"no":"第二十三條","current":null,"versions":[{"bill":"201110206460000","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請條件、應備文件、審查、分類、標示、使用、管理、變更、查核、抽樣檢驗、廢止、資料提報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由製造、輸入、販賣產品或提供服務業者得自願申請環保標章使用權，經審查通過後，即應標示環保標章。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之申請、使用、管理等相關事項之辦法，以健全管理機制。"},{"bill":"201110206460001","text":"製造、輸入、販賣產品或提供服務業者得向中央主管機關申請環保標章使用權；經中央主管機關審查通過並發給證書者，應將環保標章標示於產品、包裝或服務場所。\n依前項規定取得環保標章使用權之業者，應提送環保標章使用情形、產品產量、銷售量等資料，報中央主管機關備查；必要時，中央主管機關得抽樣檢驗產品。\n前二項環保標章使用權之申請條件、應備文件、審查、分類、標示、使用、管理、變更、查核、抽樣檢驗、廢止、資料提報及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、環保標章為綠色產業轉型之重要里程之一，為建構完備之審核機制，將現行環保標章制度自行政規則提升至法律位階明文。\n三、第一項定明由製造、輸入、販賣產品或提供服務業者得自願申請環保標章使用權，經審查通過後，即應標示環保標章。\n四、第二項定明取得標章使用權者之提送義務，以強化標章使用管理及透過產量填報進行產品資料勾稽，並授權中央主管機關得抽樣檢驗產品，以確保環保標章公信力。\n五、第三項授權由中央主管機關訂定環保標章之申請、使用、管理等相關事項之辦法，以健全管理機制。"}],"changed":false,"final":"中華民國八十六年三月二十八日前，由責任業者組成之共同回收清除處理組織及依相關法規成立之基金會賸餘回收清除相關費用，應移撥資源回收管理基金，依規定運用。","finalWhy":null,"review":null},{"no":"第二十四條","current":null,"versions":[{"bill":"201110206460000","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於修正條文第四十條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"},{"bill":"201110206460001","text":"未取得環保標章使用權之製造、輸入、販賣或提供服務業者，不得有下列行為：\n一、擅自使用環保標章於產品、包裝或其他消費者能取得之文件或資訊。\n二、擅自使用環保標章、證書、證號或文字進行標示、宣傳、廣告或其他對外之表示。\n三、變造環保標章使用證書或標章圖示。\n四、其他經中央主管機關認定不當使用環保標章之情形。","note":"一、本條新增。\n二、參考現行實務環保標章常見違規樣態，定明禁止事項，並於修正條文第四十條增訂罰則，以嚇阻不法，避免消費者混淆誤判。"}],"changed":false,"final":"直轄市、縣（市）主管機關為執行一般廢棄物之清除、處理，應依清除處理成本，向指定清除地區內家戶及其他非事業徵收費用。\n前項費用之徵收方式、計算方式、繳費流程、繳納期限及其他應遵行事項之徵收辦法，由中央主管機關定之。\n直轄市、縣（市）主管機關得衡酌實際作業需要，增訂前項以外之費用徵收相關規定及收費證明標誌。\n第一項徵收費用之數額，由直轄市、縣（市）主管機關訂定公告之。\n第三項所增訂費用徵收相關規定，應報中央主管機關備查。","finalWhy":null,"review":null},{"no":"第二十五條","current":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄及其他應遵行事項之管理辦法，由中央主管機關會商中央目的事業主管機關、再使用用途目的事業主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄及其他應遵行事項之管理辦法，由中央目的事業主管機關會商中央主管機關、再生利用用途目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書格式及內容，分別由中央主管機關或中央目的事業主管機關定之。","versions":[{"bill":"201110206460000","text":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄、管理及其他應遵行事項之辦法，由中央主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄、管理及其他應遵行事項之辦法，由中央目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書應載明事項，分別由中央主管機關或中央目的事業主管機關公告之。","note":"一、條次變更。\n二、第二項「會商中央目的事業主管機關、再使用用途目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除，並酌作文字修正。\n三、第四項修正刪除「會商中央主管機關、再生利用用途目的事業主管機關」，理由同說明二。\n四、第一項、第三項及第五項未修正。\n五、第六項所定「格式」屬細節性規範，可由主管機關依職權定之；所定「內容」修正為「應載明事項」；另依實務運作修正為「公告之」。"},{"bill":"201110206460000","text":"","note":"一、本條刪除。\n二、為落實本法推動資源循環之立法目的，對於明知為不實之事項而申報不實或於業務上作成之文書為虛偽記載之行為，允宜適用普通刑法偽造文書罪章相關規定，本法無庸特別規範，爰予刪除。"},{"bill":"201110206460001","text":"得再使用之再生資源項目，由中央主管機關公告之。\n再生資源再使用之清運、貯存方法、設施規範、再使用規範、紀錄、管理及其他應遵行事項之辦法，由中央主管機關定之。\n得再生利用之再生資源項目，由中央目的事業主管機關公告之。\n再生資源再生利用之清運、貯存方法、設施規範、再生利用規範、紀錄、管理及其他應遵行事項之辦法，由中央目的事業主管機關定之。\n未經公告為再生資源項目者，事業得檢具再使用、再生利用計畫，分別向中央主管機關或中央目的事業主管機關申請核准為再生資源項目。\n前項再使用、再生利用計畫書應載明事項，分別由中央主管機關或中央目的事業主管機關公告之。","note":"一、條次變更。\n二、第二項「會商中央目的事業主管機關、再使用用途目的事業主管機關」屬法規訂修之行政作業程序，無須明文，爰予刪除，並酌作文字修正。\n三、第四項修正刪除「會商中央主管機關、再生利用用途目的事業主管機關」，理由同說明二。\n四、第一項、第三項及第五項未修正。\n五、第六項所定「格式」屬細節性規範，可由主管機關依職權定之；所定「內容」修正為「應載明事項」；另依實務運作修正為「公告之」。"},{"bill":"201110206460001","text":"","note":"一、本條刪除。\n二、為落實本法推動資源循環之立法目的，對於明知為不實之事項而申報不實或於業務上作成之文書為虛偽記載之行為，允宜適用普通刑法偽造文書罪章相關規定，本法無庸特別規範，爰予刪除。"}],"changed":false,"final":"前條第一項之一般廢棄物清除處理成本，包括一般廢棄物清除、處理業務之管理成本、人工成本、處理場（廠）土地使用成本、回饋金與各項清除處理機具或設備、設施之操作維護成本及依使用年限每年平均應負擔之購置成本、復育成本，並扣除代清除、處理一般事業廢棄物及其他收入。","finalWhy":null,"review":null},{"no":"第二十六條","current":"再生資源、再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關會商中央主管機關公告其標準。\n再生資源、再生產品不符合前項標準者，不適用本法第四章輔導獎勵措施之規定。","versions":[{"bill":"201110206460000","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、考量修正條文第二十五條第二項、第四項已授權訂定「再生資源」再使用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。另配合章次調整，修正第二項引述之章次，並酌修文字。\n三、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"201110206460001","text":"再生產品應符合國家標準；無國家標準者，得由中央目的事業主管機關公告其標準。\n再生產品不符合前項標準者，不適用第五章輔導獎勵措施之規定。","note":"一、條次變更。\n二、考量修正條文第二十五條第二項、第四項已授權訂定「再生資源」再使用、再生利用相關管理規定之辦法，其中已可含括標準規範事項，爰刪除本條「再生資源」文字，避免重複規定。另配合章次調整，修正第二項引述之章次，並酌修文字。\n三、第一項「會商中央主管關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"}],"changed":false,"final":"前條之一般廢棄物清除處理成本，應依實際成本收費。但機具、設備、設施、復育成本，自中華民國九十年起分年徵收。\n直轄市、縣（市）主管機關針對民有民營一般廢棄物焚化廠之每公噸建設成本、復育成本，應自中華民國九十年起分年徵收。\n第一項之機具、設備、設施、復育成本及前項之建設成本，直轄市、縣（市）主管機關應自中華民國九十年起專款專儲，並於中華民國九十一年成立一般廢棄物清除處理基金。中華民國九十年專儲之清除處理費，應於基金成立後轉存。\n前項基金之設置運用及管理辦法，由直轄市、縣（市）主管機關定之。\n第三項設置之基金，應專款專用於一般廢棄物清除處理機具或設備、設施之重置及一般廢棄物處理場（廠）之復育。","finalWhy":null,"review":null},{"no":"第二十七條","current":"為有效回收再利用國內再生資源，中央主管機關得會商中央目的事業主管機關限制或禁止再生資源之輸入或輸出。\n前項再生資源之輸入或輸出之限制、禁止及其管理辦法，由中央主管機關會商有關機關定之。","versions":[{"bill":"201110206460000","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出；經限制輸入或輸出者，應申請直轄市、縣（市）主管機關許可後，始得輸入或輸出。\n前項再生資源輸入或輸出之限制、禁止、申請許可之資格、應備文件、審查、許可事項、許可期限、廢止及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字，並定明經中央主管機關限制輸入或輸出之再生資源，欲為輸入或輸出者，應取得許可後，始得為之。另「會商中央目的事業主管機關」屬行政作業程序，無須明文，爰予刪除。\n三、第二項明列授權訂定辦法之事項，以資明確。另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"201110206460001","text":"為有效循環利用國內再生資源，中央主管機關得限制或禁止再生資源之輸入或輸出；經限制輸入或輸出者，應申請直轄市、縣（市）主管機關許可後，始得輸入或輸出。\n前項再生資源輸入或輸出之限制、禁止、申請許可之資格、應備文件、審查、許可事項、許可期限、廢止及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字，並定明經中央主管機關限制輸入或輸出之再生資源，欲為輸入或輸出者，應取得許可後，始得為之。另「會商中央目的事業主管機關」屬行政作業程序，無須明文，爰予刪除。\n三、第二項明列授權訂定辦法之事項，以資明確。另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。"}],"changed":false,"final":"在指定清除地區內嚴禁有下列行為：\n一、隨地吐痰、檳榔汁、檳榔渣，拋棄紙屑、煙蒂、口香糖、瓜果或其皮、核、汁、渣或其他一般廢棄物。\n二、污染地面、池溏、水溝、牆壁、樑柱、電桿、樹木、道路、橋樑或其他土地定著物。\n三、於路旁、屋外或屋頂曝晒、堆置有礙衛生整潔之物。\n四、自廢棄物清除、處理及貯存工具、設備或處所中搜揀經廢棄之物。但搜揀依第五條第六項所定回收項目之一般廢棄物，不在此限。\n五、拋置熱灰燼、危險化學物品或爆炸性物品於廢棄物貯存設備。\n六、棄置動物屍體於廢棄物貯存設備以外處所。\n七、隨地便溺。\n八、於水溝棄置雜物。\n九、飼養禽、畜有礙附近環境衛生。\n十、張貼或噴漆廣告污染定著物。\n十一、其他經主管機關公告之污染環境行為。","finalWhy":null,"review":null},{"no":"第二十八條","current":"經中央主管機關公告指定之事業，應依中央主管機關規定之格式、項目、內容、頻率，以網路傳輸方式，向中央主管機關申報其再生資源之產出、貯存、清運、再使用、再生利用、輸入、輸出、過境或轉口情形。但經中央主管機關同意者，得以網路傳輸以外之方式申報。","versions":[{"bill":"201110206460000","text":"經中央主管機關指定公告之事業，應依中央主管機關規定之格式、項目、內容、頻率，以網路傳輸方式，向中央主管機關申報其再生資源之產出、貯存、清運、再使用、再生利用、輸入、輸出、過境或轉口情形。但經中央主管機關同意者，得以網路傳輸以外之方式申報。","note":"條次變更，並酌作文字修正。"},{"bill":"201110206460000","text":"","note":"一、本條刪除。\n二、公法上金錢給付義務之強制執行程序，依行政執行法相關規定辦理，無明文必要，爰予刪除。"},{"bill":"202110214910000","text":"事業廢棄物之清理，除再利用方式外，應以下列方式為之：\n一、自行清除、處理。\n二、共同清除、處理：由事業向目的事業主管機關申請許可設立清除、處理該類廢棄物之共同清除處理機構清除、處理。\n三、委託清除、處理：\n(一)委託經主管機關許可清除、處理該類廢棄物之公民營廢棄物清除處理機構清除、處理。\n(二)經執行機關同意，委託其清除、處理。\n(三)委託目的事業主管機關自行或輔導設置之廢棄物清除處理設施清除、處理。\n(四)委託主管機關指定之公營事業設置之廢棄物清除處理設施清除、處理。\n(五)委託依促進民間參與公共建設法與主辦機關簽訂投資契約之民間機構設置之廢棄物清除處理設施清除、處理。\n(六)委託依第二十九條第二項所訂管理辦法許可之事業之廢棄物處理設施處理。\n四、其他經中央主管機關許可之方式。\n經中央主管機關指定公告之事業，應置專業技術人員，其採自行清除、處理事業廢棄物之事業，其清除機具及處理設施或設備應具備之條件、許可、許可期限、廢止及其他應遵行事項之管理辦法，由中央主管機關會同中央目的事業主管機關定之。\n第一項第二款共同清除處理機構應具備之條件、分級、許可、許可期限、廢止、專業技術人員設置、營運、操作紀錄與其他應遵行事項之管理辦法，由中央目的事業主管機關會同中央主管機關定之。\n第一項第三款第三目所輔導設置之廢棄物清除處理設施應具備之專業技術人員設置、營運、操作紀錄與其他應遵行事項之管理辦法，由中央目的事業主管機關會商相關機關定之。\n第一項第三款第四目及第五目所設置之廢棄物清除處理設施應具備之專業技術人員設置、營運、操作紀錄與其他應遵行事項之管理辦法，由中央主管機關會商相關機關定之。\n第一項第三款第二目執行機關受託清除處理一般事業廢棄物，應依直轄市、縣（市）主管機關所定事業廢棄物代清除處理收費標準收費，並配合該事業依第三十一條第一項第二款規定辦理申報。\n一般廢棄物或一般事業廢棄物之清除處理設施，不得合併清除、處理有害事業廢棄物。\n第一項第三款第二目執行機關及第五目與直轄市、縣（市）主管機關簽訂契約之民間機構設置之廢棄物處理設施受託處理一般事業廢棄物，應於處理下列一般廢棄物後仍有餘裕量能，並向中央主管機關確認第一項第三款第一目、第三目、第四目及第六目之運轉中廢棄物處理設施之餘裕量能平均低於一成五，且取得中央主管機關同意後，始得為之；其得收受一般事業廢棄物種類範圍，由中央主管機關定之：\n一、屬指定清除地區內者。\n二、屬依第七條及地方制度法第二十四條之一規定之區域性聯合及跨區域合作處理者。\n三、屬中央主管機關統一調度者。\n中央主管機關於不影響執行機關及與直轄市、縣（市）主管機關簽訂契約之民間機構設置之廢棄物處理設施處理前項第一款及第二款一般廢棄物情形下，於發生天然災害、不可抗力事故、現有廢棄物處理設施無法運作、或因地形、大氣擴散或其他環境生態敏感條件致處理設施不足或欠缺，致有直轄市、縣（市）之一般廢棄物堆置數量相當於半年以上一般廢棄物須處理量時，得統一調度使用現有廢棄物處理設施，並得令有下列情形之一者按其被調度設施量能繳納每噸三千元以上促進設施共用協助金，由中央主管機關專款專用於處理設施調度及獎勵配合調度者；拒繳前述協助金者由中央主管機關於下年度統籌分配稅款中直接扣取：\n一、被調度者拒絕配合調度。\n二、執行機關及與直轄市、縣（市）主管機關簽訂契約之民間機構設置之廢棄物處理設施受託處理一般事業廢棄物未依前項規定取得中央主管機關同意。\n三、執行機關及與直轄市、縣（市）主管機關簽訂契約之民間機構設置之廢棄物處理設施收受轄外一般廢棄物之處理費超出其轄內一般廢棄物處理費之一點五倍。\n四、執行機關及與直轄市、縣（市）主管機關簽訂契約之民間機構設置之廢棄物處理設施代處理轄外一般廢棄物，以回運達代處理量四分之一以上之衍生廢棄物為交換條件。\n五、以其他方式抗拒處理設施調度者。\n前項統一調度之方式、費用、促進設施共用協助金之繳納及其他應遵循事項之辦法，由中央主管機關定之。","note":"一、本條原第六項廢棄物處理設施收受廢棄物來源的優先順序與原第八項設施調度的授權，自十年前（106年）訂定以來從未發生效果，部份縣市垃圾堆置問題依然嚴重。這不僅是因為各縣市以廢棄物處理是地方自治事項為由，拒絕配合中央調度，更是不同角色爭相追逐利益的結果。須從此根源找尋解方，否則相關機制形同虛設。\n二、爰各縣市焚化廠收受事業廢棄物的處理費用，相較於民營的事業廢棄物焚化廠便宜，令許多事業單位趨之若騖，致民營事業廢棄物焚化廠處理量能大幅閒置，此有監察院2021年調查報告為證；相對地，事業單位願意支付處理費相較於各焚化廠營運成本為高，不僅被各焚化廠代操業者視為金雞母，也被各縣市政府當作轉嫁垃圾處理成本的對象：其於代操契約中容許代操業者收受一定比例的事業廢棄物，做為讓清潔隊收運垃圾享有廉價處理費的交換條件。此不僅不利於垃圾減量，也讓事業廢棄物佔了各焚化廠四分之一的量能。簡言之，無焚化廠縣市垃圾堆置問題嚴重，非我國廢棄物處理設施量能不足，而是這些焚化廠成了營利工具，喪失為處理民生垃圾的公共建設本質。\n三、爰將第六項執行機關收受廢棄物的來源優先順序，移列第八項，並要求執行機關與BOO/BOT廢棄物處理設施，受託處理一般事業廢棄物，除應依前述順序優先處理轄內與區域合作或統一調度垃圾之外，並應向中央主管機關確認民營事業廢棄物處理設施之餘裕量能平均低於一成五，且取得中央主管機關同意後，始得為之。\n四、原第八項、第九項配合移列為第九項、第十項。其中修正後第九項基於實務上被調度者正大光明拒絕調度之事實，刪除被調度者不得拒絕之規定，但規定被調度者若有拒絕、妨礙調度之情形，或未依照修正後第八項收受廢棄物來源之優先順序及未經中央主管機關同意及受託處理一般事業廢棄物，應按其被調度設施量能繳納每噸三千元以上促進設施共用協助金，拒繳者由中央主管機關由下年度統籌分配稅款中直接扣取。如此讓各縣市能有錢出錢有設施出設施，合作解決垃圾危機，並提昇各縣市廢棄物處理設施的公共性。"},{"bill":"201110206460001","text":"經中央主管機關指定公告之事業，應依中央主管機關規定之格式、項目、內容、頻率，以網路傳輸方式，向中央主管機關申報其再生資源之產出、貯存、清運、再使用、再生利用、輸入、輸出、過境或轉口情形。但經中央主管機關同意者，得以網路傳輸以外之方式申報。","note":"條次變更，並酌作文字修正。"},{"bill":"201110206460001","text":"","note":"一、本條刪除。\n二、公法上金錢給付義務之強制執行程序，依行政執行法相關規定辦理，無明文必要，爰予刪除。"}],"changed":true,"final":"事業廢棄物之清理，除再利用方式外，應以下列方式為之：\n一、自行清除、處理。\n二、共同清除、處理：由事業向目的事業主管機關申請許可設立清除、處理該類廢棄物之共同清除處理機構清除、處理。\n三、委託清除、處理：\n(一)委託經主管機關許可清除、處理該類廢棄物之公民營廢棄物清除處理機構清除、處理。\n(二)經執行機關同意，委託其清除、處理。\n(三)委託目的事業主管機關自行或輔導設置之廢棄物清除處理設施清除、處理。\n(四)委託主管機關指定之公營事業設置之廢棄物清除處理設施清除、處理。\n(五)委託依促進民間參與公共建設法與主辦機關簽訂投資契約之民間機構設置之廢棄物清除處理設施清除、處理。\n(六)委託依第二十九條第二項所訂管理辦法許可之事業之廢棄物處理設施處理。\n四、其他經中央主管機關許可之方式。\n經中央主管機關指定公告之事業，應置專業技術人員，其採自行清除、處理事業廢棄物之事業，其清除機具及處理設施或設備應具備之條件、許可、許可期限、廢止及其他應遵行事項之管理辦法，由中央主管機關會同中央目的事業主管機關定之。\n第一項第二款共同清除處理機構應具備之條件、分級、許可、許可期限、廢止、專業技術人員設置、營運、操作紀錄與其他應遵行事項之管理辦法，由中央目的事業主管機關會同中央主管機關定之。\n第一項第三款第三目所輔導設置之廢棄物清除處理設施應具備之專業技術人員設置、營運、操作紀錄與其他應遵行事項之管理辦法，由中央目的事業主管機關會商相關機關定之。\n第一項第三款第四目及第五目所設置之廢棄物清除處理設施應具備之專業技術人員設置、營運、操作紀錄與其他應遵行事項之管理辦法，由中央主管機關會商相關機關定之。\n第一項第三款第二目執行機關受託清除處理一般事業廢棄物，應於處理下列一般廢棄物後，仍有餘裕處理能量，始得為之，並依直轄市、縣（市）主管機關所定事業廢棄物代清除處理收費標準收費，並配合該事業依第三十一條第一項第二款規定辦理申報：\n一、屬指定清除地區內者。\n二、屬依第七條及地方制度法第二十四條之一規定之區域性聯合及跨區域合作處理者。\n三、屬中央主管機關統一調度者。\n一般廢棄物或一般事業廢棄物之清除處理設施，不得合併清除、處理有害事業廢棄物。\n中央主管機關於不影響執行機關處理第六項第一款及第二款一般廢棄物情形下，於必要時得統一調度使用現有廢棄物清除處理設施，被調度者不得拒絕。\n直轄市、縣（市）主管機關或執行機關受中央主管機關補助及依促進民間參與公共建設法興建、營運之廢棄物處理設施，經中央主管機關指定者，其受補助對象及主辦機關、民間機構應保留一定比例之餘裕處理量，供中央主管機關統籌調度，並納入委託操作及投資相關契約明定之。\n前二項統一調度之條件、方式、費用、指定之廢棄物處理設施、一定比例之餘裕處理量及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"一、增訂第九項地方廢棄物處理設施保留一定比例餘裕量供中央主管機關統籌調度之規定，理由如下：\n(一)中央主管機關為督導直轄市、縣（市）主管機關及執行機關確實優先處理轄內一般廢棄物，並保留予中央主管機關使用處理設施之調度量能，因應於天然災害、重大事故、特定區域處理設施量能不足或其他特殊情形下，中央主管機關除依現行第八項統一調度外，亦得先行釋出保留之處理設施量能，及時清理廢棄物，爰明定直轄市、縣（市）主管機關或執行機關受中央主管機關補助及依促進民間參與公共建設法興建、營運之處理設施，於中央主管機關指定情形下，應保留一定比例之餘裕處理量，供中央主管機關統籌調度，並將調度量能納入委託操作及投資相關契約中，要求契約當事人履行義務。\n(二)針對公有掩埋場及中央或直轄市、縣 (市) 政府興建或補助興建之運轉中焚化廠，中央主管機關已就得進場（廠）之廢棄物範圍、流向管控及資料提交等事項，定有相關管理規範，受補助及依促進民間參與公共建設法興建、營運之處理設施如為前揭掩埋場、焚化廠，本應遵循該等規範。未來將配合實務執行需求，提升至依本法第十二條、第三十六條授權訂定之法規命令位階明文，公開相關資訊。\n二、配合第九項之增訂，原第九項遞移為第十項，並增訂指定之廢棄物處理設施、一定比例之餘裕處理量等相關事項，授權由中央主管機關定之。","review":null},{"no":"第二十九條","current":"再生資源未依規定回收再利用者，視為廢棄物，應依廢棄物清理法規定回收、清除、處理。\n再生資源無法再使用、再生利用時，應依廢棄物清理法規定清除、處理。","versions":[{"bill":"201110206460000","text":"再生資源未依規定循環利用者，視為廢棄物，應依廢棄物清理法規定回收、清除、處理。\n再生資源無法再使用、再生利用時，應依廢棄物清理法規定清除、處理。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字。\n三、第二項未修正。"},{"bill":"201110206460001","text":"再生資源未依規定循環利用者，視為廢棄物，應依廢棄物清理法規定回收、清除、處理。\n再生資源無法再使用、再生利用時，應依廢棄物清理法規定清除、處理。","note":"一、條次變更。\n二、第一項配合本法名詞定義修正，酌修文字。\n三、第二項未修正。"}],"changed":false,"final":"事業之廢棄物處理設施之處理容量有餘裕時，得經處理設施所在地主管機關許可，提供其他事業使用，不受第三十一條第一項第一款、第四十一條之限制。\n前項餘裕處理量之提供條件、許可程序、許可期限及其他應遵行事項之管理辦法，由中央主管機關會商中央目的事業主管機關定之。","finalWhy":null,"review":null},{"no":"第三十條","current":"依廢棄物清理法公告之應回收廢棄物，且屬本法公告之再生資源者，其回收、貯存及回收清除處理費用之收支、保管及運用，依廢棄物清理法之規定。","versions":[{"bill":"201110206460000","text":"再生資源屬依廢棄物清理法公告之應回收廢棄物者，其回收、貯存及回收清除處理費用之繳納，依廢棄物清理法之規定辦理。","note":"條次變更，並酌作文字修正。"},{"bill":"201110206460001","text":"再生資源屬依廢棄物清理法公告之應回收廢棄物者，其回收、貯存及回收清除處理費用之繳納，依廢棄物清理法之規定辦理。","note":"條次變更，並酌作文字修正。"}],"changed":false,"final":"事業委託清理其廢棄物，應與受託人就該廢棄物負連帶清理責任。如受託者未妥善清理，且委託事業未盡相當注意義務者，委託事業應與受託者就該廢棄物負連帶清理及環境改善責任。\n前項委託事業之相當注意義務之認定要件、注意事項、管理措施及其他相關事項之準則，由中央主管機關定之。","finalWhy":null,"review":null},{"no":"第三十一條","current":"為促進資源回收再利用，政府機關、公立學校、公營事業或機構、軍事機關之採購，應優先採購政府認可之環境保護產品、本國境內產生之再生資源或以一定比例以上再生資源為原料製成之再生產品。\n前項應優先採購之環境保護產品、再生資源或再生產品應含再生資源之一定比例，由中央主管機關會商有關機關定之。\n主管機關及各目的事業主管機關應自行或委託專業機構或事業，辦理再生技術及再生資源、再生產品、環境保護產品相關之教育推廣及銷售促進活動。","versions":[{"bill":"201110206460000","text":"政府機關、公立學校、公營事業或機構、軍事機關、行政法人應優先採購下列產品或服務，並由中央主管機關辦理績效評核：\n一、環保標章產品。\n二、依第二十一條核准使用循環標誌之循環產品或循環服務。\n三、其他環境保護產品及具綠色意涵之產品或服務。\n前項應優先採購之產品或服務種類、績效評核作業及其他有關事項之辦法，由中央主管機關定之。\n主管機關及各目的事業主管機關應辦理促進產品回收及延長使用技術、優先採購第一項之產品或服務相關之教育推廣活動。\n民間企業或團體優先採購第一項之產品或服務，績效優良者，中央主管機關得予獎勵。","note":"一、條次變更。\n二、參考歐盟二○二四年永續產品生態設計規範（ESPR）及綠色公共採購（GPP）標準等國際以公部門帶領私部門採購生態永續產品，作為引導產業發展循環經濟及提升產品耐用性誘因，推動我國公部門綠色採購，優先採購範疇包含環保標章產品、循環產品、循環服務、其他環境保護產品以及具減量、可重複使用、再利用、低污染、省能源、省資源或對環境友善等綠色意涵之產品或服務，爰修正第一項，並增訂由中央主管機關辦理績效評核之規定。現行第一項「以一定比例以上再生資源為原料製成之再生產品」與第二項「再生資源或再生產品應含再生資源之一定比例」，已納入第三款之其他環境保護產品範疇（如經濟部產業發展署資源再生綠色產品），爰予刪除。\n三、為配合第一項推動優先採購及規範優先採購績效評核作業方法，於第二項增訂授權中央主管機關訂定辦法之事項，以符授權明確性原則；另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、配合第一項修正，修正第三項主管機關及各目的事業主管機關應辦理之活動範圍。\n五、為鼓勵民間企業或團體參與優先採購，增訂第四項規範民間企業或團體優先採購第一項產品或服務，中央主管機關得予獎勵。"},{"bill":"201110206460001","text":"政府機關、公立學校、公營事業或機構、軍事機關、行政法人應優先採購下列產品或服務，並由中央主管機關辦理績效評核：\n一、環保標章產品。\n二、依第二十一條核准使用循環標誌之循環產品或循環服務。\n三、其他環境保護產品及具綠色意涵之產品或服務。\n前項應優先採購之產品或服務種類、績效評核作業及其他有關事項之辦法，由中央主管機關定之。\n主管機關及各目的事業主管機關應辦理促進產品回收及延長使用技術、優先採購第一項之產品或服務相關之教育推廣活動。\n民間企業或團體優先採購第一項之產品或服務，績效優良者，中央主管機關得予獎勵。","note":"一、條次變更。\n二、參考歐盟二○二四年永續產品生態設計規範（ESPR）及綠色公共採購（GPP）標準等國際以公部門帶領私部門採購生態永續產品，作為引導產業發展循環經濟及提升產品耐用性誘因，推動我國公部門綠色採購，優先採購範疇包含環保標章產品、循環產品、循環服務、其他環境保護產品以及具減量、可重複使用、再利用、低污染、省能源、省資源或對環境友善等綠色意涵之產品或服務，爰修正第一項，並增訂由中央主管機關辦理績效評核之規定。現行第一項「以一定比例以上再生資源為原料製成之再生產品」與第二項「再生資源或再生產品應含再生資源之一定比例」，已納入第三款之其他環境保護產品範疇（如經濟部產業發展署資源再生綠色產品），爰予刪除。\n三、為配合第一項推動優先採購及規範優先採購績效評核作業方法，於第二項增訂授權中央主管機關訂定辦法之事項，以符授權明確性原則；另「會商有關機關」屬法規訂修之行政作業程序，無須明文，爰予刪除。\n四、配合第一項修正，修正第三項主管機關及各目的事業主管機關應辦理之活動範圍。\n五、為鼓勵民間企業或團體參與優先採購，增訂第四項規範民間企業或團體優先採購第一項產品或服務，中央主管機關得予獎勵。"}],"changed":false,"final":"經中央主管機關指定公告一定規模之事業，應於公告之一定期限辦理下列事項：\n一、檢具事業廢棄物清理計畫書，送直轄市、縣（市）主管機關或中央主管機關委託之機關審查核准後，始得營運；與事業廢棄物產生、清理有關事項變更時，亦同。\n二、依中央主管機關規定之格式、項目、內容、頻率，以網路傳輸方式，向直轄市、縣（市）主管機關申報其廢棄物之產出、貯存、清除、處理、再利用、輸出、輸入、過境或轉口情形。但中央主管機關另有規定以書面申報者，不在此限。\n三、中央主管機關指定公告之事業廢棄物清運機具，應依中央主管機關所定之規格，裝置即時追蹤系統並維持正常運作。\n前項第一款事業廢棄物清理計畫書之格式及應載明事項，由中央主管機關會商中央目的事業主管機關定之。\n第一項第一款事業廢棄物清理計畫書核准之審查作業、變更、撤銷、廢止及其他應遵行事項之辦法，由中央主管機關定之。\n第一項事業依規定應實施環境影響評估者，於提報環境影響評估相關文件時，得一併檢具事業廢棄物清理計畫書，送直轄市、縣（市）主管機關審查。俟環境影響評估審查通過後，由直轄市、縣（市）主管機關逕予核准。\n清除、處理第一項指定公告之事業所產生之事業廢棄物者，應依第一項第二款規定辦理申報。","finalWhy":null,"review":null},{"no":"第三十二條","current":null,"versions":[{"bill":"201110206460000","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"},{"bill":"201110206460001","text":"為促進資源循環，事業自願提供物品或其包裝、容器重複、延長使用或其他有利資源循環服務，績效優良者，中央主管機關得予獎勵或補助。","note":"一、本條新增。\n二、為促進循環服務產業之發展並給予其中績優者相關獎勵、補助，爰增訂本條。如屬修正條文第十六條第一項指定公告物品或其包裝、容器之製造、輸入或販賣業者，或屬修正條文第二十條第一項指定公告物品之製造、輸入、販賣業者，已納入行政管制範疇，不適用本條獎勵補助措施。"}],"changed":false,"final":"新設工業區及科學園區之目的事業主管機關、開發單位或管理單位，應於區內或區外規劃設置事業廢棄物處理設施；並於事業廢棄物處理設施設置完成後，該工業區及科學園區始得營運。\n現有工業區及科學園區之目的事業主管機關、開發單位或管理單位，應於本法修正通過後六個月內，規劃完成事業廢棄物之處理設施，經中央目的事業主管機關核准後，最遲於中華民國九十三年十二月三十一日完成設置。","finalWhy":null,"review":null},{"no":"第三十三條","current":"中央主管機關應依實際再使用、再生利用技術產生之效益，自行或委託、委辦相關機關或機構定期辦理再使用、再生利用技術開發優良及實際再使用、再生利用績優選拔，並給與獎勵；其獎金、獎助及表揚之辦法，由中央主管機關會商有關機關定之。\n從事資源回收再利用之事業，其投資於回收再利用之研究、設施、機具、設備等之費用，應予財稅減免，其財稅投資抵減項目、額度及相關應遵行事項，由中央財稅主管機關會同中央目的事業主管機關、中央主管機關定之。","versions":[{"bill":"201110206460000","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，現行第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第三項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第三項。"},{"bill":"201110206460001","text":"事業或個人辦理綠色設計、源頭減量、永續消費、再使用、再生利用之相關技術開發、人才培訓、實際運用執行與管理，績效優良者，中央主管機關得予獎勵或補助。\n為促進資源循環產業發展，事業投資於循環利用及循環永續管理之研究發展、人才培育及設備購置支出金額，得依有關稅法、產業創新條例或其他法律規定減免稅捐。\n第一項、第三十一條第四項及前條獎勵或補助之條件、方式、審查程序、廢止及其他有關事項之辦法，由中央主管機關定之。","note":"一、條次變更。\n二、對於辦理第三章循環永續管理專章之綠色設計、源頭減量及永續消費相關之技術開發、實際運用執行與管理績效優良者，增訂第一項定明中央主管機關得予獎勵或補助。\n三、配合修正條文第七條，現行第一項前段有關委任（託）及委辦規定已無規範必要；有關獎勵及後段中央主管機關訂定獎勵、獎助辦法，第三項已有相關規範，爰刪除本項。\n四、事業對於資源循環之相關投資，得依其他有關規定減免之，爰予修正，並刪除第二項授權中央財稅主管機關訂定財稅減免規定之依據。\n五、為定明中央主管機關訂定獎勵或補助辦法之授權依據，爰增訂第三項。"}],"changed":false,"final":"事業無法自行處理其所產生之事業廢棄物，亦無事業廢棄物處理機構可供委託處理時，事業應妥善貯存其所產生之事業廢棄物。必要時，目的事業主管機關得向事業收取費用，自行或輔導設置事業廢棄物處理設施處理或暫時貯存之。","finalWhy":null,"review":null},{"no":"第三十四條","current":null,"versions":[{"bill":"201110206460000","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"},{"bill":"201110206460001","text":"中央主管機關得協調有關機關、金融機構及信用保證機構，針對事業投資於本法資源循環各項措施，優先給予融資管道及信用保證。","note":"一、本條新增。\n二、為促進資源循環產業之發展，定明中央主管機關得協助業者取得資金及提供信用保證。所稱本法資源循環各項措施，指事業實施綠色設計、源頭減量、永續消費、再生資源運作管理及資源循環推動事項相關措施。"}],"changed":false,"final":"事業無法自行清理其所產生之事業廢棄物，亦無事業廢棄物處理機構可供委託處理時，中央目的事業主管機關得會商中央主管機關，指定公告特定地區之事業，應將其事業廢棄物，送至中央目的事業主管機關自行或輔導設置之事業廢棄物處理設施處理。","finalWhy":null,"review":null},{"no":"第三十五條","current":"為促進再生資源回收再利用，引進高級再生資源回收再利用技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區再生資源事業之土地需求，規劃設置環保科技或再生資源回收再利用專用區。\n前項專用區及環保科技或再生資源回收再利用之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用變更者，主管機關應依區域計畫法及非都市土地使用管制規則規定辦理變更。\n前項專用區及用地依法變更編定完成後，屬公有土地者，得辦理撥用或出租予興辦人，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或再生資源回收再利用之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、區域計畫主管機關將土地回復原編定或變更為其他適當之編定。\n工業區規劃開發時，主管機關得依該地區興辦再生資源回收再利用之土地需求，要求工業區開發單位應預留再生資源回收再利用用地。","versions":[{"bill":"201110206460000","text":"為促進資源循環，引進技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區資源循環產業之土地需求，規劃設置環保科技或資源循環專用區。\n前項專用區及環保科技或資源循環之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用者，主管機關應依國土計畫法、區域計畫法相關規定辦理。\n前項專用區及用地經都市計畫、國土計畫或區域計畫主管機關同意變更或使用後，屬公有土地者，得辦理撥用或出租予興辦人，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或資源循環之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、國土計畫、區域計畫主管機關，依都市計畫法、國土計畫法、區域計畫法相關規定辦理。\n產業園區規劃開發時，主管機關得依該地區興辦資源循環之土地需求，要求產業園區開發單位應預留資源循環用地。","note":"一、條次變更。\n二、配合本法由原再生資源回收再利用擴及整體資源循環，其用地需求亦同步擴充涵蓋整體資源循環產業，爰修正第一項、第二項、第四項及第五項，將「再生資源回收再利用」、「再生資源事業」文字修正為「資源循環」、「資源循環產業」，並刪除「高級再生資源回收再利用」文字。\n三、配合國土計畫法相關規定，修正第二項至第四項土地變更、使用有關規定。\n四、工業區已更名為產業園區，爰修正第五項工業區文字。"},{"bill":"201110206460001","text":"為促進資源循環，引進技術及人才，激勵國內環保產業技術之研究創新與發展，主管機關或目的事業主管機關得依各地區資源循環產業之土地需求，規劃設置環保科技或資源循環專用區。\n前項專用區及環保科技或資源循環之用地，涉及都市計畫變更者，主管機關得擬具可行性規劃報告，會同都市計畫主管機關，依都市計畫法第二十七條規定辦理變更；涉及非都市土地使用者，主管機關應依國土計畫法、區域計畫法相關規定辦理。\n前項專用區及用地經都市計畫、國土計畫或區域計畫主管機關同意變更或使用後，屬公有土地者，得辦理撥用或出租予興辦人，不受土地法第二十五條規定之限制。\n第二項專用區及用地，如不為環保科技或資源循環之用途者，主管機關或目的事業主管機關得通知土地主管機關終止租約，並通知都市計畫、國土計畫、區域計畫主管機關，依都市計畫法、國土計畫法、區域計畫法相關規定辦理。\n產業園區規劃開發時，主管機關得依該地區興辦資源循環之土地需求，要求產業園區開發單位應預留資源循環用地。","note":"一、條次變更。\n二、配合本法由原再生資源回收再利用擴及整體資源循環，其用地需求亦同步擴充涵蓋整體資源循環產業，爰修正第一項、第二項、第四項及第五項，將「再生資源回收再利用」、「再生資源事業」文字修正為「資源循環」、「資源循環產業」，並刪除「高級再生資源回收再利用」文字。\n三、配合國土計畫法相關規定，修正第二項至第四項土地變更、使用有關規定。\n四、工業區已更名為產業園區，爰修正第五項工業區文字。"}],"changed":false,"final":"中央主管機關，對於需經特殊技術處理之有害事業廢棄物，得會同中央目的事業主管機關，設置適當設施，代為貯存、清除或處理，並收取必要費用。\n前項有害事業廢棄物，由中央主管機關會同中央目的事業主管機關公告之。","finalWhy":null,"review":null},{"no":"第三十六條","current":null,"versions":[{"bill":"201110206460000","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。"},{"bill":"201110206460001","text":"事業得檢具資源循環創新實驗計畫，向中央主管機關申請核准辦理資源循環創新實驗，並應提送執行成果報中央主管機關備查。\n中央主管機關依前項規定核准創新實驗計畫時，應載明於創新實驗期間內得排除下列法律全部或一部之適用：\n一、第二十五條至第二十九條。\n二、廢棄物清理法第十二條、第十四條、第十八條第一項、第三十一條第一項、第三十六條、第三十八條第一項、第三十九條第一項、第四十一條第一項。\n三、其他因資源循環技術之研究發展及應用須排除適用之環境保護法律。但不包括民事、刑事責任規定。\n第一項資源循環創新實驗計畫之申請、審查、核准事項、變更、廢止、管理、執行成果提送期限、備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為促進回收、清除、處理及再利用等資源循環技術或數位科技治理之發展，賦予事業提出創新實驗計畫申請之權利，俟獲核准後，即得據以辦理資源循環創新實驗，爰為第一項規定；其創新實驗計畫之研究客體，包括天然資源、再生資源及廢棄物。\n三、為避免申請人於實驗期間可能違反相關環保法規，而有受處罰之虞，或已知相關規定於資源循環實驗無從適用，爰參考無人載具科技創新實驗條例第二十二條規定，於第二項定明於實驗期間得不適用之法律規定。\n四、第三項授權中央主管機關訂定資源循環創新實驗計畫有關事項之辦法。"}],"changed":false,"final":"事業廢棄物之貯存、清除或處理方法及設施，應符合中央主管機關之規定。\n前項事業廢棄物之貯存、清除、處理方法及設施標準，由中央主管機關定之。","finalWhy":null,"review":null},{"no":"第三十七條","current":null,"versions":[{"bill":"201110206460000","text":"有下列情形之一者，由中央主管機關處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第十四條第一項公告所定期限申請核定產品符合綠色設計準則。\n二、指定產品之製造、輸入業者，違反依第十四條第四項所定辦法有關核定事項、變更、查核、抽樣檢驗或資料備查之規定。\n營建工程之工程主辦機關或起造人違反依第十五條第一項所定公告有關綠色設計準則指定項目之規定者，處新臺幣六萬元以上三十萬元以下罰鍰；其尚未施工者，並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行者，按次處罰；必要時，得令其停工。","note":"一、本條新增。\n二、配合修正條文第十四條及第十五條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、基於鼓勵業者自願符合綠色設計，第一項第一款僅限於處罰違反強制實施綠色設計規定之業者。\n四、考量營建工程於規劃設計階段若違反第十五條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項針對尚未施工者定明通知限期提出改善計畫之情形。另考量營建工程之施作必須依其規劃設計內容進行施工，故對於屆期未依改善計畫執行者，按次處罰；另於必要時，得令其停工。"},{"bill":"201110206460001","text":"有下列情形之一者，由中央主管機關處新臺幣六千元以上三十萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、未依第十四條第一項公告所定期限申請核定產品符合綠色設計準則。\n二、指定產品之製造、輸入業者，違反依第十四條第四項所定辦法有關核定事項、變更、查核、抽樣檢驗或資料備查之規定。\n營建工程之工程主辦機關或起造人違反依第十五條第一項所定公告有關綠色設計準則指定項目之規定者，處新臺幣六萬元以上三十萬元以下罰鍰；其尚未施工者，並通知限期提出改善計畫，屆期未依改善計畫核定期程、內容執行者，按次處罰；必要時，得令其停工。","note":"一、本條新增。\n二、配合修正條文第十四條及第十五條新增產品及營建工程綠色設計管理規定，爰增訂相關違反行為態樣之處罰規定。\n三、基於鼓勵業者自願符合綠色設計，第一項第一款僅限於處罰違反強制實施綠色設計規定之業者。\n四、考量營建工程於規劃設計階段若違反第十五條第一項有關綠色設計準則之指定項目規定，仍可於規劃設計文件改善後，據以施工，爰於第二項針對尚未施工者定明通知限期提出改善計畫之情形。另考量營建工程之施作必須依其規劃設計內容進行施工，故對於屆期未依改善計畫執行者，按次處罰；另於必要時，得令其停工。"}],"changed":false,"final":"事業對於有害事業廢棄物貯存、清除、處理之操作及檢測，應作成紀錄妥善保存三年以上，以供查核。\n前項檢測之項目、方法、頻率及其他應遵行事項之管理辦法，由中央主管機關定之。","finalWhy":null,"review":null},{"no":"第三十八條","current":"第一項第二款\n有下列情形之一者，主管機關或目的事業主管機關得處新臺幣三萬元以上十五萬元以下罰鍰。經通知限期補正或改善，屆期仍未補正或完成改善者，按日連續處罰；情節重大者，得處一個月以上一年以下停工或停業處分；必要時，予以歇業處分：\n二、違反中央主管機關依第十三條所定之物品、包裝、容器與其材質、規格及限制或禁止使用方式者。","versions":[{"bill":"201110206460000","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明。"},{"bill":"201110206460001","text":"有下列情形之一者，處製造、輸入業者新臺幣六萬元以上三十萬元以下罰鍰，處販賣、使用業者新臺幣一千二百元以上六萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰：\n一、違反依第十八條第二項所定公告有關禁止或限制方式、範圍或資料備查之規定。\n二、違反第十八條第三項有關直轄市、縣（市）主管機關所定加嚴自治法規或管制措施規定。\n三、不遵行直轄市、縣（市）主管機關依第十八條第四項規定所為之處置。","note":"一、配合修正條文第十八條物品或其包裝、容器禁止或限制製造、輸入、販賣、使用之管制規定，增訂相關違反行為之處罰規定，並將第二十六條第一項第二款修正移列為第一款。\n二、考量業者規模不同，序文就處罰對象依製造、輸入業者或販賣、使用業者，區分不同法定罰鍰上、下限額度。另修正條文第十八條第四項就違反禁限用規定得以下架等方式處理，爰刪除情節重大得停工、停業或歇業規定，並酌作文字修正。\n三、違反第十八條第三項如同時涉及自治條例之處罰規定者，依行政罰法第二十四條意旨從一重裁處，併予敘明。"}],"changed":false,"final":"事業廢棄物之輸入、輸出、過境、轉口，應向直轄市、縣（市）主管機關申請核發許可文件，始得為之；其屬有害事業廢棄物者，並應先經中央主管機關之同意。但經中央主管機關會商目的事業主管機關公告屬產業用料需求者，不在此限。\n有害事業廢棄物應以國內處理或再利用為原則，並僅限輸出至經濟合作暨發展組織會員國、依據國際公約與我國簽署有害廢棄物越境轉移雙邊協定國家或其他經中央主管機關公告之國家、地區，且接受國處理機構應具有妥善處理及再利用能力。\n前二項之事業廢棄物輸入、輸出、過境、轉口之申請資格、文件、審查、許可、許可期限、廢止及其他應遵行事項之管理辦法，由中央主管機關定之。\n事業廢棄物有下列情形之一者，禁止輸入；其種類，由中央主管機關會商中央目的事業主管機關公告之：\n一、有嚴重危害人體健康或生活環境之事實。\n二、於國內無適當處理技術及設備。\n三、直接固化處理、掩埋、焚化或海拋。\n四、於國內無法妥善清理。\n五、對國內廢棄物處理有妨礙。\n屬國際公約列管之一般廢棄物之輸入、輸出、過境、轉口，準用前四項規定辦理。\n第二項規定自中華民國一百零六年五月二十六日修正之條文公布後一年施行。但修正公布前，已取得第一項許可文件者，其有效期限至原核准許可期限屆至為止。","finalWhy":null,"review":null},{"no":"第三十九條","current":"事業廢棄物之再利用，應依中央目的事業主管機關或中央主管機關規定辦理，不受第二十八條、第四十一條之限制。\n前項再利用之事業廢棄物種類、數量、許可、許可期限、廢止、紀錄、申報、再利用產品之標示及其他應遵行事項之管理辦法，由中央目的事業主管機關會商中央主管機關、再利用用途目的事業主管機關定之。但涉及二個以上目的事業共通性再利用之事業廢棄物，經中央主管機關認定有統一訂定再利用種類及管理方式之必要者，其管理辦法由中央主管機關定之。","versions":[{"bill":"202110179890000","text":"事業廢棄物之再利用，應依中央主管機關規定辦理，不受第二十八條、第四十一條之限制。\n從事事業廢棄物再利用之事業（以下簡稱再利用事業），其再利用方式如下：\n一、事業自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內依中央主管機關指定之再利用種類及管理方式進行再利用。\n(三)屬第三十一條第一項第一款指定公告事業，送至同一法人之其他分廠（場），依前目規定進行再利用。\n二、再利用機構再利用：\n(一)中央主管機關得依事業廢棄物性質、再利用技術、再利用用途等因素，指定事業廢棄物再利用種類及管理方式者，再利用機構向直轄市、縣（市）主管機關申請檢核通過後得逕行再利用。\n(二)前目以外之事業廢棄物再利用者，再利用機構應向中央主管機關申請再利用許可，並依許可文件內容進行再利用。\n屬第三十一條第一項第一款指定公告事業，依前項方式進行再利用者，應檢具事業廢棄物清理計畫書送直轄市、縣（市）主管機關或中央主管機關委託之機關審查核准。\n第二項再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；其再利用產品經中央主管機關指定者，並應記錄及申報使用情形。\n第二項再利用種類、管理方式、再利用檢核申請及再利用之許可審查、許可事項、廢止、前項記錄及申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。\n二、新增第二項，定明事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一法人之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取兩種再利用方式，第一目為依中央主管機關指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n三、新增第三項，定明再利用事業於進行再利用前，應檢具事業廢棄物清理計畫書報准。\n四、新增第四項，明定再利用事業應辦理事業廢棄物再利用營運情形及再利用產品紀錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定再利用產品之使用情形，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等相關資料，以完備再利用流向管理。\n五、現行第二項移列至修正條文第五項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第二項不同再利用方式，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110204880000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110207050000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110207590000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"201110206460000","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣一萬二千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則。\n(三)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十條第三款明文，爰予刪除。\n(四)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(五)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(六)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(七)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"201110206460000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110209830000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"為強化再利用管理並確保產品品質，將再利用管理事權統一由中央主管機關統籌。分列事業自行再利用與再利用機構收受再利用（含檢核與許可制）二種方式，並課予申報流向與數量之義務。"},{"bill":"202110209810000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110209180000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理，修正第一項並刪除現行第二項但書，統一由中央主管機關統籌規範；另配合法制調整，刪除與第二十八條重複規定，並將不受第四十一條限制之規定移列。再利用方式如下：\n(一)事業自行於原廠（場）或分廠（場）再利用。\n(二)再利用機構辦理再利用，分為：經中央指定者得檢核後逕行再利用；未經指定者應取得許可後始得辦理。\n二、增訂第二項，明定符合第三十一條第一項之事業，應於再利用前提報清理計畫書報准。\n三、增訂第三項，規範再利用事業應辦理營運及產品流向之記錄與申報，以強化管理。\n四、原第二項移列第四項，配合事權統一及制度調整，修正授權內容及訂定機關，並刪除「會商」規定。"},{"bill":"202110209760000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110211360000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110211860000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110214910000","text":"事業廢棄物之再利用，應以下列方式為之，不適用第四十一條規定：\n一、自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）進行再利用。\n二、委託從事事業廢棄物再利用之廠（場）或以移動式設施至產源事業廠（場）內從事再利用之機構（以上兩者簡稱再利用機構）進行再利用。\n依前項方式進行再利用之事業及再利用機構（以下合稱再利用事業），應依下列規定申請再利用檢核或許可並審查通過後，始得再利用：\n一、再利用之廢棄物為經中央主管機關指定再利用種類及管理方式者，應檢具事業廢棄物清理計畫書向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n二、前項第一款第一目送回原生產製程當作原料自行再利用者，應檢具事業廢棄物清理計畫書說明其再利用可行性，送直轄市、縣（市）主管機關審查並取得許可後，進行再利用。\n三、前二款以外之事業廢棄物，應向中央主管機關申請取得專案再利用許可並登載於事業廢棄物清理計畫書中後，依許可文件內容進行再利用。\n再利用事業應依第三十一條第一項至第三項規定，就其廢棄物之產出、貯存、清除、處理、再利用、輸出、輸入、過境或轉口情形，檢具事業廢棄物清理計畫書送審、辦理申報與裝設即時追蹤系統，另應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第二項事業廢棄物再利用種類、管理方式之指定、再利用檢核、自行或專案再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；另本法雖未明確定義處理之意涵，但從相關條文及其實務應用上指涉的行為，可涵蓋再利用，兩者並非可一刀分，而第四十一條限制規定並未明確排除再利用，故仍須於本條第一項排除其適用，避免和本條規範相衝突。\n二、修正後第一項另明定事業廢棄物自行再利用與委託再利用之方式，其中第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式；第二款定明得委託從事再利用之廠（場）或具有移動式設施、得將其設施移至產源事業廠（場）內從事再利用的再利用機構。\n三、修正後第二項明定從事再利用之事業或機構須依其廢棄物種類、相對應的再利用管理方式及自行或委託再利用的規劃，先申請再利用檢核或許可並審查通過後始得再利用的三款情形。其中第一款為經中央主管機關公告再利用管理方式的廢棄物種類，再利用機構應檢具事業廢棄物清理計畫書申請再利用檢核；第二款為送回原製程當原料的自行再利用方式，則應檢具事業廢棄物清理計畫書說明其再利用可行性並取得許可；前兩款以外廢棄物之再利用，則應先取得專案再利用許可並登載於事業廢棄物清理計畫書後始得進行再利用。\n四、增訂第三項，定明再利用事業為屬第三十一條第一項所定事業，於進行再利用前應依該條第一項至第三項規定，就其廢棄物之產出、貯存、清除、處理、再利用、輸出、輸入、過境或轉口情形檢具事業廢棄物清理計畫書報准。同時規定再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n五、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110214090000","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"201110206460001","text":"有下列情形之一者，由主管機關或目的事業主管機關處新臺幣一萬二千元以上十五萬元以下罰鍰，並通知限期改善，屆期仍未完成改善者，按次處罰；情節重大者，得處一個月以上一年以下停工或停業處分：\n一、規避、妨礙或拒絕主管機關或目的事業主管機關依第八條第一項所為之檢查或要求提供資料之命令。\n二、違反依第二十五條第二項或第四項所定辦法有關清運、貯存方法、設施規範、再使用或再生利用規範、紀錄或管理之規定。\n三、違反依第二十七條第二項所定辦法有關限制、禁止、許可事項或許可期限之規定。\n四、違反第二十八條申報規定。","note":"一、條次變更。\n二、修正第一項處罰規定如下，並列為本條文：\n(一)序文「按日連續處罰」修正為「按次處罰」，以與其他環保法律體例相符，並酌作文字修正。\n(二)配合本條各款違規情形，序文酌予調整罰鍰下限額度，以符合責罰相當原則。\n(三)第一款違反條次已修正移列為第二十二條，其處罰已於修正條文第四十條第三款明文，爰予刪除。\n(四)第二款違反條次已修正移列為第十八條，其處罰已於修正條文第三十八條明文，爰予刪除。\n(五)第三款違反條次已修正移列為第十九條，其處罰已於修正條文第四十一條第三款明文，爰予刪除。\n(六)第七款移列為第一款，並配合修正違反條次及酌作文字修正。\n(七)第四款至第六款移列為第二款至第四款，並酌作文字修正。\n三、刪除第一項後段及第二項歇業處分規定，回歸各中央目的事業主管機關依其主管法規辦理。"},{"bill":"201110206460001","text":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內或送至同一事業之其他分廠（場）依中央主管機關指定之再利用種類及管理方式進行再利用。\n二、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可後，依許可文件內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除現行第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第二款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可後始得進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"}],"changed":true,"final":"事業廢棄物之再利用，應以下列方式為之：\n一、事業依規定自行再利用：\n(一)送回原生產製程當作原料。\n(二)於原廠（場）內。\n(三)送至同一事業之其他分廠（場）。\n二、前款各目依中央主管機關指定之再利用種類及管理方式，事業應依第三十一條第一項規定，檢具事業廢棄物清理計畫書，送直轄市、縣（市）主管機關審查核准後，進行再利用。但前款第一目與原生產製程原料之特性、性質相符者，得逕行再利用。\n三、第一款第一目非屬前款情形，事業應檢具事業廢棄物清理計畫書，送直轄市、縣（市）主管機關審查核准後，進行再利用。\n四、由收受事業廢棄物再利用之廠（場）（以下簡稱再利用機構）依規定進行再利用，不適用第四十一條規定：\n(一)經中央主管機關指定再利用種類及管理方式之事業廢棄物，再利用機構應向直轄市、縣（市）主管機關申請檢核通過後，進行再利用。\n(二)前目以外之事業廢棄物，再利用機構應向中央主管機關申請取得再利用許可及向直轄市、縣（市）主管機關申請檢核通過後，依許可文件及檢核內容進行再利用。\n依前項規定進行再利用之事業及再利用機構（以下合稱再利用事業），屬第三十一條第一項所定事業者，就其廢棄物之產出、貯存、清除、處理、再利用、輸出、輸入、過境或轉口情形，應依該條第一項至第三項規定辦理。\n再利用事業應記錄及申報再利用營運情形、再利用產品流向、數量；並應就中央主管機關指定之再利用產品，記錄及申報其使用情形。\n第一項事業廢棄物再利用種類、管理方式之指定、事業廢棄物清理計畫書之提送、審查、核准、再利用檢核之申請、再利用許可之申請、審查、許可事項、廢止、前項再利用產品之指定、記錄與申報之事項、頻率、管理及其他應遵行事項之辦法，由中央主管機關定之。","finalWhy":"一、為強化事業廢棄物再利用管理、確保再利用程序符合規定及再利用產品妥善使用，爰修正第一項規定及刪除原第二項但書規定，再利用管理事權統一由中央主管機關統籌規範。另因第二十八條有關事業廢棄物之清理，已排除再利用方式，爰刪除第一項不受第二十八條限制之規定；不受第四十一條限制規定移列至第一項第四款。事業廢棄物再利用之方式，說明如下：\n(一)第一款定明事業對於原廠（場）或同一事業之其他分廠（場）所產生之事業廢棄物自行再利用之方式。\n(二)第二款定明依前款方式及符合中央主管機關規定自行再利用且屬第三十一條第一項所定事業者，於進行自行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准；並於但書規定得逕行再利用之樣態。製程產出物與原料之特性、性質相異者，仍應檢具事業廢棄物清理計畫書報准，始得自行再利用，俾符實務運作與管理需求。\n(三)第三款定明依第一款第一目自行再利用方式者，如不符合前款所定管理方式，仍應檢具事業廢棄物清理計畫書報准，始得自行再利用。\n(四)第四款定明再利用機構收受事業廢棄物後，考量再利用實務運作及管理需求，採取二種再利用方式，第一目為經中央主管機關依事業廢棄物性質、再利用技術、再利用用途等因素，指定之再利用種類及管理方式者，再利用機構經再利用檢核通過後得依規定逕行再利用；第二目則針對非屬前開經中央主管機關指定者，再利用機構應取得許可及經再利用檢核通過後，始得進行再利用。其再利用機構之再利用設施（備），得置於所設之固定廠（場）址為再利用，亦得將之移動至事業廠（場）內進行再利用。\n二、增訂第二項，定明依前項方式進行再利用且屬第三十一條第一項所定事業者，於進行再利用前應依該條第一項至第三項規定，檢具事業廢棄物清理計畫書報准。\n三、增訂第三項，定明再利用事業應辦理事業廢棄物再利用營運情形及其所生產再利用產品之記錄及申報。其中再利用營運情形包括再利用之日期、種類、數量、再利用用途、事業名稱、剩餘廢棄物處理情形及其他與再利用運作相關資料；經中央主管機關指定之再利用產品，再利用事業應進一步記錄、申報實際使用地點、產品標示及取得驗證等使用情形相關資料，以完備再利用流向管理。\n四、第二項移列為第四項，並配合第一項事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正相關辦法之訂定機關，及配合第一項不同再利用方式及第三項規定，修正授權事項。另「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。","review":null},{"no":"第三十九條之一","current":"再利用產品有下列情形之一，經中央主管機關指定公告者，由中央目的事業主管機關負責其流向追蹤管理，必要時並實施環境監測：\n一、用於填海或填築土地者。\n二、有不當利用、污染環境或危害人體健康之虞者。\n三、其他經中央主管機關認定需加強管制者。\n前項環境監測之監測項目、採樣頻率、樣品採樣方法、檢測方法與程序及其他應遵行事項之辦法，由中央目的事業主管機關會商中央主管機關、再利用用途目的事業主管機關定之。","versions":[{"bill":"202110179890000","text":"經中央主管機關指定之再利用產品，其使用者應記錄及申報再利用產品流向、數量及實際使用地點；有下列情形之一者，並應實施環境監測，保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定需加強管制。\n前項實施環境監測之再利用產品使用者應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，其採樣情形及監測結果應作成紀錄，並提送環境監測結果報告。\n第一項再利用產品記錄及申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、提報、審查、核准、採樣監測紀錄與環境監測結果報告提送、管理及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、新增第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關之義務。\n三、現行第二項移列至修正條文第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110204880000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、增訂第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110207050000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三、其他經中央主管機關認定須加強管制。\n前項應實施環境監測之再利用產品使用者，應檢具環境監測計畫書報直轄市、縣（市）主管機關核准，並應將其採樣情形及監測結果作成紀錄，檢具環境監測結果報告報直轄市、縣（市）主管機關備查。\n第一項再利用產品之指定、記錄與申報之項目、頻率及使用證明保存、前項環境監測計畫書應記載事項、申請、審查、核准、採樣與監測結果紀錄、環境監測結果報告之備查及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、配合事業廢棄物再利用管理之事權統一由中央主管機關統籌規範，修正第一項，刪除中央目的事業主管機關追蹤責任，定明再利用產品使用者之記錄、申報及監測義務，以完備再利用流向管理，確保再利用產品使用無虞。\n二、增訂第二項，定明指定再利用產品之使用者實施環境監測前檢具環境監測計畫書報准、依計畫書進行採樣與監測、監測結果作成報告提送直轄市、縣（市）主管機關備查之義務。\n三、第二項移列為第三項，修正中央主管機關訂定辦法之授權範圍，並考量「會商」屬法規訂修之行政作業程序，無須明文，爰予刪除。"},{"bill":"202110207590000","text":"經中央主管機關指定之再利用產品，其使用者應記錄與申報再利用產品流向、數量及實際使用地點；有下列情形之一者，必要時，應實施環境監測，並保存使用證明以供查核：\n一、用於填海或填築土地。\n二、有不當利用、污染環境或危害人體健康之虞。\n三
