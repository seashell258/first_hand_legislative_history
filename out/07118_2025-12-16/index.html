<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>電信管理法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110162910000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者。處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110163110000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行 為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟 海域及大陸礁層法第十八條第三項規定，增訂第六項，明定相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。\n二、沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等 用途。\n三、第一項至第五項未修正。\n四、現行第六項移列為第七項，內容未修正。"},{"bill":"202110163470000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、近年屢有不法行為人蓄意或違規破壞我國通訊海纜，不僅影響國內對外及離島通信，更對國家安全造成威脅。為有效嚇阻此類行為，爰參考《土石採取法》第三十六條第三項及《中華民國專屬經濟海域及大陸礁層法》第十八條第三項之規定，增訂第六項，明定相關犯罪所使用之工具、船舶或其他機械設備，應予沒收並規範其處置方式。\n二、依實務運作，沒收物若具經濟價值，通常以拍賣或變價方式處理。然而，實務上常見作為犯罪工具之船舶，往往噸數龐大、難以保管，或因屬外籍船舶而缺乏登記資料，致拍賣不易執行。為解決此類問題，爰授權地方檢察署、高等檢察署及其分署，得依個案性質、保管條件與場地狀況，專案報准後，以下列方式妥速處置：\n(一)沒收物適於公務使用者，得無償留供原機關或其他機關公用。\n(二)經衡酌保管成本與價值，確無拍賣或變價實益者，得予以廢棄。\n(三)採取其他適當處置方式，如捐作公益或教學用途。\n三、第一項至第五項條文未修正；現行第六項則移列為第七項，內容亦未作變更。"},{"bill":"202110165320000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、因近年來發生權宜輪破壞我國通訊海纜，危害台灣聯外通訊之情事，爰增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收，並可於沒收後拍賣、變賣、無償留供公用、廢棄或為其他適當之處置。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項。"},{"bill":"202110164180000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣四千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億五千萬元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣一億元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰提高第一項至第三項罰金刑之上限，以生嚇阻效果。\n二、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n三、第四項及第五項未修正。\n四、現行第六項移列為第七項，內容未修正。"},{"bill":"202110164020000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n有前項應沒收船舶之情形者，其犯罪航次之全部收益，不問屬於犯罪行為人與否，沒收之。但於全部或一部不能沒收時，追徵其價額。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、為因應近年懸掛權宜旗之船舶（權宜輪）頻繁破壞我國通訊海纜，對我國對外及離島通訊造成衝擊，甚至危害國家安全，本次修法旨在建立有效的嚇阻機制。參考土石採取法及中華民國專屬經濟海域及大陸礁層法相關規定，增訂第六項，明確規範犯罪所用之船舶、工具等設備的沒收與處置程序。考量到此類犯罪所用船舶常因噸位龐大、保管困難，或因外國籍身份致使拍賣不易，新法特別賦予檢察機關在個案上更大的處置彈性。經專案報准後，得不採傳統拍賣方式，改以「無償留供公用」、「廢棄」（若不具經濟效益）或「為其他適當處置」（如捐作公益或教學之用）等方式。\n二、媒體報導，中華電信曾指出，近年海纜遭破壞主要原因除被少數漁撈作業及大型貨商油船停泊下錨損傷外，大部分障礙是被中國盜砂船在馬祖南竿至西莒間海域作業所傷。參酌美國海洋哺乳動物保護法（Marine Mammal Protection Act, MMPA），16 U. S. C. § 1376「以任何方式用於非法捕撈海洋哺乳動物，其全部貨物或其貨幣價值應予以扣押和沒收。」增訂第七項，若船舶有「毀損海纜」及「船舶被沒收」的情形，其犯罪航次收益，例如非法砂石、非法漁獲，將被視為毀損海纜此犯罪航次之收益而沒收之。若犯罪航次收益已經變賣脫手，亦可追徵其價額。"},{"bill":"202110164910000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、增訂第六項，參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110166340000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准妥速處置沒收物。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110166800000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以下有期徒刑、拘役或科新臺幣三百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、中華民國刑法第十二條第二項明定，過失行為之處罰，以有特別規定者為限。由於過失犯幾乎係以結果犯之態樣出現，其刑責自然以發生發生外在損害事件為前提；惟本條第四項過失犯之犯罪構成要件，其所包含之「以其他非法方法危害」，並不以造成實質損害為前提，恐與憲法罪責原則有違，故刪除之。另考量海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心遭毀壞之結果，將對社會造成極大之影響，爰提高過失犯罪之刑責及罰金額度上限，併此敘明。\n二、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n三、第一項至第三項及第五項未修正。\n四、現行第六項移列為第七項，內容未修正。"},{"bill":"202110166900000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110167050000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、近年來多起船舶違規作業導致我國海底通信纜線受損，嚴重影響國際及離島間通訊安全，甚至危及國家安全。為強化對故意破壞行為的防制與處罰，參考《土石採取法》第三十六條第三項及《專屬經濟海域及大陸礁層法》第十八條第三項規定，增訂對犯罪工具（如船舶、機械設備等）之沒收及處置規範。\n二、現行條文雖已對故意及過失損害海纜設施者分別規範刑責，但未及於犯罪工具之後續管理與處理，造成實務上無法有效保管或拍賣非我國籍船舶之困難，爰增訂條文第六項，授權司法機關視情形報准採行拍賣、變賣、留供公用或廢棄等多元處置方式，以兼顧公用效率與執法可行性。\n三、第一項至第五項未修正。\n四、原第六項移列為第七項，內容未修正。"},{"bill":"202110168510000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110167280000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪所用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其所有權或其他權利，於沒收裁判確定時移轉為國家所有，並得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、有鑑於近年來屢次發生權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全之情形，為有效嚇阻此類不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項沒收之規定，明定相關犯罪用之工具、船舶或其他機械設備之沒收及處置，並於沒收裁判確定時，移轉沒收物之所有權或其他權利為國家所有。又沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110168080000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、海底電纜為重要通訊基礎建設，專用於國際間傳輸資料，係為我國連接國際之重要橋樑，亦是重要民生建設。\n二、審計部二零二三年中央政府總決算審核報告指出，二零一九年至二零二三年間，我國海底電纜發生外力破壞或推擠受損案件計有三十六件，年平均故障約七件。近年更屢傳出受到中國侵擾，二零二五年一月至二月間於基隆外海的「橫太平洋快速海纜系統」及台澎三號分別遭中國權宜輪拖斷，嚴重影響我國通訊安全。\n三、增訂第六項，參酌《中華民國專屬經濟海域及大陸礁層法》第十八條第三項之規定，增訂相關犯罪用之工具、船舶或其他機械設備之沒收與處置規定，以嚇阻破壞海底電纜之不法行為，提升我國數位韌性。\n四、其餘項次未修正。"},{"bill":"202110169620000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來時常發生權宜輪違規破壞我國通訊海纜之情事，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：\n(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。\n(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。\n(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110169940000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n供第一項及第二項犯罪用之船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經判決沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項及第二項之未遂犯罰之。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、現行條文僅著眼於行為人刑責，卻未明文規範「沒收犯罪工具」，以致破壞行為所涉之船舶、機具仍可能重複使用，影響執法成效。\n二、增訂第五項規定，明定犯罪工具（含船舶、機具等）一律沒收，以期全面提升防護韌性，確保民生服務不中斷，維護國家安全與社會安定。"},{"bill":"202110170670000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑑於近年來迭有權宜輪違規破壞我國通訊海纜 大陸礁層法》第十八條第三項的立法例，增訂第六項，明確規範犯罪所使用之工具、船舶或其他機械設備的沒收與後續處理方式。考量沒收物的性質與保管成本差異極大，條文授權地方檢察署、高等檢察署及其分署，得依個案情形專案報准後，妥速處理。處理方式包括：若有公務用途，得無償留供原機關或其他機關公用；若保管成本高而拍賣價值有限，得予廢棄；或視情況採取其他適當方式，例如捐作公益、教育或教學使用等。讓實務機關有更明確且可行的執行依據，兼顧效率與妥適性，確保通訊安全及司法程序的順暢運作。"},{"bill":"202110172690000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、增訂第六項，第一項至第五項未修正。現行第六項移列為第七項，內容未修正。\n二、近年多次發生權宜輪違規事件，造成我國通訊海纜受損，不僅影響國內外及離島間的通信聯繫，更對國家安全構成威脅。為強化嚇阻與處罰效果，本次修法參考《土石採取法》第三十六條第三項及《中華民國專屬經濟海域及大陸礁層法》第十八條第三項之規定，明定對於犯罪所使用之工具、船舶或其他機械設備，得予沒收及處置。\n三、實務上，對具有經濟價值之沒收物通常採拍賣或變價方式處理。然而，本條所涉之犯罪工具（例如大型作業船舶）多因噸位龐大、保管不易，或因屬外國籍船舶而缺乏船籍資料，致拍賣程序難以進行。為使執行機關能因應不同情形，迅速且妥當地處理沒收物，爰授權地方檢察署、高等檢察署及其分署得依個案性質與保管條件，報准後依下列方式辦理：\n(一)如沒收物具公用價值，得無償留供原機關或其他政府機關使用。\n(二)若衡酌保管成本與沒收物價值後，認定拍賣或變價無實益者，得逕予廢棄。\n(三)其他適當之處理方式，例如捐作公益、教育或教學用途等。"},{"bill":"202110174040000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、增訂第六項。\n二、因近年來屢發生權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信狀況，為有效嚇阻該等不法行為，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權相關機關得視具體個案沒收物性質與保管方式及處所等情節，專案報准依公用、廢氣或其他適當方式處置沒收物。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110173870000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","note":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、現行第六項移列為第七項，內容未修正。"},{"bill":"202110175060000","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金，並自負民事責任；行為人有二人以上者，連帶負民事責任。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金，並自負民事責任；行為人有二人以上者，連帶負民事責任。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要訂定資格限制條件拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。\n在中華民國領域外犯本條之罪者，亦適用之。","note":"一、參考聯合國海洋法公約第一百一十三條規定，爰修正第一項及第四項，對損害海纜管線進行民事責任追究，反映國際社會考量經濟發展與公共利益之平衡，使我國與國際接軌。\n二、鑒於近年來迭有權宜輪違規破壞我國海纜，影響海嘯及地震預警時效，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署並為防止沒收後拍賣的船隻或很有可能藉由人頭又被原船東購回，由原船東得標購回，有關拍賣或變賣投標的資格限制應限制條件，採取嚴謹審慎限制，以杜絕原船東或相關人員購回，再次危害氣象設施或設備功能正常運作之可能性，且得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，例如捐作公益及教學使用等用途。\n三、增訂第八項中華民國領域外適用的規定，確保破壞行為無論發生在領海、毗連區、專屬經濟區或公海，只要危害到我國海纜，皆能依法追訴、處罰。填補在領海外無法處罰的漏洞，實現對我國海纜管線的全面法律保護。"}],"changed":true,"final":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。","finalWhy":"一、鑒於近年來迭有權宜輪違規破壞我國通訊海纜，衝擊我國聯外與離島間通信，甚至危及國家安全，為有效嚇阻該等不法行為，爰參考土石採取法第三十六條第三項及中華民國專屬經濟海域及大陸礁層法第十八條第三項規定，增訂第六項，定明相關犯罪用之工具、船舶或其他機械設備之沒收及處置規定。沒收物有經濟價值者，實務一般係採拍賣或變價方式執行，惟審酌供第一項至第三項及第五項犯罪用之工具（如船舶）往往具有噸數鉅大或其他原因難以保管，或因非我國籍船舶欠缺船籍資料而不易拍賣等特性，爰授權地方檢察署、高等檢察署及其分署得視具體個案沒收物性質與保管方式及處所等情節，專案報准依下列方式之一妥速處置沒收物，俾利實務運作：(一)沒收物有利公務使用者，得無償留供原機關或其他機關公用。(二)衡酌保管費用與沒收物價值後，認無拍賣或變價實益者，得予廢棄。(三)其他適當處置方式，如捐作公益及教學使用等用途。\n二、第一項至第五項未修正。\n三、原第六項移列為第七項，內容未修正。","review":{"note":"照行政院提案通過","text":"以竊取、毀壞或其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖危害國家安全或社會安定，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金。\n前二項情形致釀成災害者，加重其刑至二分之一；因而致人於死者，處無期徒刑或七年以上有期徒刑，得併科新臺幣一億元以下罰金；致重傷者，處五年以上十二年以下有期徒刑，得併科新臺幣八千萬元以下罰金。\n因過失毀壞或以其他非法方法危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者，處六月以下有期徒刑、拘役或科新臺幣二百萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n供第一項至第三項及前項犯罪用之工具、船舶或其他機械設備，不問屬於犯罪行為人與否，沒收之；其經裁判沒收確定者，得視個案情節需要拍賣或變賣，或專案報准依下列方式之一處置之：\n一、無償留供公用。\n二、廢棄。\n三、為其他適當之處置。\n第一項所稱纜線，指海纜登陸站與機房向海一側之纜線，及海纜登陸站與內陸介接站間之纜線。"}},{"no":"第七十二條之二","current":null,"versions":[{"bill":"202110163300000","text":"凡在中華民國領域外犯前二條之罪者，亦適用之。","note":"一、本條新增。\n二、2023年我國進行若干法律的修法，加重處罰對國家關鍵基礎設施等重要設施的實體破壞及虛擬侵害等行為。將海纜列為關鍵基礎設施並推動《電信管理法》修法，以加重對虛擬和實體破壞的懲罰，是提升防護層級和補足法律漏洞的必要步驟。近年，我國曾遭遇幾起海纜疑遭蓄意破壞之事件。經查，「宏泰」號貨輪曾在臺灣南部外海下錨滯留多日，下錨並放任貨船以未定錨狀態在該區域徘徊，致使電纜斷裂，後該貨輪船長亦依《電信管理法》第七十二條起訴判刑。然而，在我國十二海浬領海外破壞海纜的行為，同樣將達成破壞效果並危及我國國安，卻可能存在追訴及處罰漏洞，無法有效處罰破壞我國海纜或相關設備者。如未例外擴張刑法效力範圍，僅能處理法定最輕本刑三年以上的犯罪行為，而未能處理本法第七十二條第一項、第四項，以及第七十二條之一第一項於域外危害重要電信設備核心資通系統之情形。為填補處罰漏洞，爰增訂條文第七十二條之二，凡在中華民國領域外「危害海纜登陸站、機房或與其連接之纜線、國際交換機房或衛星通信中心之功能正常運作者」以及「危害海纜登陸站、機房、國際交換機房、衛星通信中心或其設備之核心資通系統功能正常運作者」，皆同應依刑事處罰論處。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}}],"stages":[{"date":"2025-09-30","stage":"一讀","code":"院會-11-4-2","bill":"201110161340000","gazref":"114卷078期5371號 4-4頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110162910000","gazref":"114卷079期5372號一冊 5-5頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110163110000","gazref":"114卷079期5372號一冊 7-7頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110163300000","gazref":"114卷079期5372號一冊 7-7頁"},{"date":"2025-10-14","stage":"一讀","code":"院會-11-4-4","bill":"202110163470000","gazref":"114卷079期5372號一冊 8-8頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110165320000","gazref":"114卷080期5373號一冊 16-17頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110164180000","gazref":"114卷080期5373號一冊 19-19頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110164020000","gazref":"114卷080期5373號一冊 21-21頁"},{"date":"2025-10-17","stage":"一讀","code":"院會-11-4-5","bill":"202110164910000","gazref":"114卷080期5373號一冊 22-22頁"},{"date":"2025-10-28","stage":"一讀","code":"院會-11-4-6","bill":"202110166340000","gazref":"114卷083期5376號一冊 3-3頁"},{"date":"2025-10-28","stage":"一讀","code":"院會-11-4-6","bill":"202110166800000","gazref":"114卷083期5376號一冊 6-6頁"},{"date":"2025-10-28","stage":"一讀","code":"院會-11-4-6","bill":"202110166900000","gazref":"114卷083期5376號一冊 7-7頁"},{"date":"2025-10-28","stage":"一讀","code":"院會-11-4-6","bill":"202110167050000","gazref":"114卷083期5376號一冊 11-11頁"},{"date":"2025-10-31","stage":"一讀","code":"院會-11-4-7","bill":"202110168510000","gazref":"114卷08 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');

const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);

function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;

}

function copyHere(id) {

function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {

  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      const pa = PARTY[normName(t.s)];
      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});
      d.dataset.fp = fp(t.s + '|' + (t.b.find(x => typeof x === 'string') || '').slice(0, 30));
      here.addEventListener('click', () => copyHere(d.id + '-' + d.dataset.fp));
      who.append(here);
      d.append(who);
      if (!chair && !first.has(t.s)) first.set(t.s, d);

      if (typeof b === 'string') into.append(para(b));

        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});

        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));

  });

const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});

let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);

  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();

  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
