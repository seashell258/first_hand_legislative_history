<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>丹娜絲颱風及七二八豪雨災後復原重建特別條例制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

律規定較本條例更有利於災後復原重建者，適用最有利之法律。","note":"一、第一項定明本條例之立法目的。\n二、第二項定明本條例與其他法律之適用關係。"},{"bill":"202110155290000","text":"為有效、迅速推動丹娜絲颱風及七二六至七二八豪雨災後之災區復原重建工作，特制定本條例。\n本條例未規定者，適用災害防救法及其他相關法律之規定。但其他法律規定較本條例更有利於災後復原重建者，適用最有利之法律。","note":"一、第一項定明本條例之立法目的。\n二、第二項定明本條例與其他法律之適用關係。"},{"bill":"202110155300000","text":"為安全、有效、迅速推動丹娜絲颱風及七二八豪雨之災後復原重建工作及災民救助，落實專款專用並強化監督，特制定本條例。\n本條例未規定者，依災害防救法及其他相關法律之規定辦理。但其他法律規定較本條例更有利於災後復原及災民重建者，適用最有利之法律。","note":"一、第一項定明本條例之立法目的。\n二、第二項定明本條例與其他法律之適用關係。"},{"bill":"202110155310000","text":"為有效、迅速推動丹娜絲颱風及七二八豪雨災後之災區復原重建工作，特制定本條例。\n本條例未規定者，適用災害防救法及其他相關法律之規定。但其他法律規定較本條例更有利於災後復原重建者，適用最有利之法律。","note":"一、第一項定明本條例之立法目的。\n二、第二項定明本條例與其他法律之適用關係。"},{"bill":"202110155320000","text":"為有效、迅速推動丹娜絲颱風及七二八豪雨之災區災後復原重建工作，特制定本條例。\n本條例未規定者，依災害防救法及其他相關法律之規定辦理。但其他法律規定較本條例更有利於災後重建者，適用最有利之法律。重建地區位於原住民族地區者，應依原住民族基本法相關規定辦理。","note":"本條例之立法目的及與其他法律之適用順序。"},{"bill":"202110155390000","text":"為有效、迅速推動丹娜絲颱風及七二八豪雨災後之災區復原重建工作，特制定本條例。\n本條例未規定者，適用災害防救法及其他相關法律之規定。但其他法律規定較本條例更有利於災後復原重建者，適用最有利之法律。","note":"一、第一項定明本條例之立法目的。\n二、第二項定明本條例與其他法律之適用關係。"},{"bill":"202110155340000","text":"為有效、迅速推動丹娜絲颱風及七二八豪雨災後之災區復原重建工作，特制定本條例。\n本條例未規定者，適用災害防救法及其他相關法律之規定。但其他法律規定較本條例更有利於災後復原重建者，適用最有利之法律。","note":"一、第一項定明本條例之立法目的。\n二、第二項定明本條例與其他法律之適用關係。"},{"bill":"202110155330000","text":"為有效、迅速推動丹娜絲颱風及七二八豪雨災後之災區復原重建工作，特制定本條例。\n本條例未規定者，適用災害防救法及其他相關法律之規定。但其他法律規定較本條例更有利於災後復原重建者，適用最有利之法律。","note":"一、第一項定明本條例之立法目的。\n二、第二項定明本條例與其他法律之適用關係。"},{"bill":"202110155360000","text":"為有效、迅速推動丹娜絲颱風及七二八豪雨災後之災區復原重建工作，特制定本條例。\n本條例未規定者，適用災害防救法及其他相關法律之規定。但其他法律規定較本條例更有利於災後重建者，適用最有利之法律。","note":"一、鑒於中度颱風丹娜絲一百十四年七月六日於嘉義布袋登陸，瞬間強風造成建築物、電力及電信系統等毀損，夾帶之豪雨導致淹水、積水狀況，使多數地區電力、通訊中斷，對居住於溪北地區之國民造成生命、身體、財產等諸多嚴重影響。後續又自一百十四年七月二十八日起連續數日在臺南市等地區降下豪雨、大豪雨使道路、水利設施、農牧業等受損嚴重，爰制定本條例。\n二、本條定明本條例之立法目的及與其他法律之適用順序。"},{"bill":"202110155350000","text":"為有效、迅速推動丹娜絲颱風及七二八豪雨災後之災區復原重建工作，特制定本條例。\n本條例未規定者，適用災害防救法及其他相關法律之規定。但其他法律規定較本條例更有利於災後復原重建者，適用最有利之法律。","note":"一、第一項說明本條例制定的目的，主要在於因應災後復原重建之需要。\n二、第二項說明本條例與其他法律之相關適用關係。"}],"changed":true,"final":"為安全、有效、迅速推動丹娜絲颱風及七二八豪雨之災後復原重建工作及災民救助，落實專款專用並強化監督，特制定本條例。\n本條例未規定者，依災害防救法及其他相關法律之規定辦理。但其他法律規定較本條例更有利於災後復原及災民重建者，適用最有利之法律。","finalWhy":"一、第一項定明本條例之立法目的。\n二、第二項定明本條例與其他法律之適用關係。","review":null},{"no":"第二條","current":null,"versions":[{"bill":"201110155270000","text":"本條例所定災區，為因丹娜絲颱風及七二八豪雨災後之受創地區，其範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於臺南市、高雄市、嘉義縣（市）及屏東縣等縣（市）發生之豪雨、大豪雨而致災之地區；以及臺中市、彰化縣、南投縣及雲林縣等縣（市）有因此致災之地區，其範圍由行政院公告。"},{"bill":"202110155290000","text":"本條例所定災區，為因丹娜絲颱風及七二六至七二八豪雨災後之受創地區，其範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於臺南市、高雄市、嘉義縣（市）及屏東縣等縣（市）發生之豪雨、大豪雨而致災之地區；以及臺中市全區、彰化縣、南投縣及雲林縣、花蓮縣、台東縣、苗栗縣等縣（市）有因此致災之地區，其範圍由行政院公告。"},{"bill":"202110155300000","text":"本條例所定災區，係指因丹娜絲颱風及七二八豪雨致災受創之地區，包括因發生連續豪雨、大豪雨而致災之臺南市、高雄市、嘉義縣市、屏東縣、臺中市、彰化縣、南投縣、雲林縣及台東縣等縣（市），其各該縣市內之具體範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於臺南市、高雄市、嘉義縣市及屏東縣等縣（市）發生之豪雨、大豪雨而致災之地區；以及臺中市、彰化縣、南投縣、雲林縣及台東縣等縣（市）有因此致災之地區其範圍由行政院公告。"},{"bill":"202110155310000","text":"本條例所定災區，為因丹娜絲颱風及七二八豪雨災後之受創地區，其範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於臺南市、高雄市、嘉義縣（市）及屏東縣等縣（市）發生之豪雨、大豪雨而致災之地區，其範圍由行政院公告。"},{"bill":"202110155320000","text":"本條例所稱災區，指因丹娜絲颱風及七二八豪雨造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登政府公報。","note":"本條例所定災區，包括丹娜絲颱風災後及七二八豪雨所致災之地區，由行政院明定災區範圍，公告並刊登政府公報。"},{"bill":"202110155390000","text":"本條例所定災區，為因丹娜絲颱風及七二八豪雨災後之受創地區，其範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於臺南市、高雄市、嘉義縣（市）及屏東縣等縣（市）發生之豪雨、大豪雨而致災之地區，其範圍由行政院公告。"},{"bill":"202110155340000","text":"本條例所定災區，為因丹娜絲颱風及七二八豪雨災後之受創地區，其範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於臺南市、高雄市、嘉義縣（市）及屏東縣等縣（市）發生之豪雨、大豪雨而致災之地區，其範圍由行政院公告。"},{"bill":"202110155330000","text":"本條例所定災區，為因丹娜絲颱風及七二八豪雨災後之受創地區，其範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及2025年7月28日起連續數日，於台南市、高雄市、嘉義縣（市）及屏東縣等縣（市）發生之豪雨、大豪雨而致災之地區；以及台中市、彰化縣、南投縣雲林縣、及台東縣等縣（市）有因此致災之地區，其範圍由行政院公告。"},{"bill":"202110155360000","text":"本條例所定災區，指因丹娜絲颱風及七二八豪雨災後之受創地區，其範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於臺南市、高雄市、嘉義縣（市）、屏東縣（市）以及臺中市、彰化縣、南投縣及雲林縣等縣（市）部分地區發生之豪雨、大豪雨而致災之地區，其範圍由行政院公告。"},{"bill":"202110155350000","text":"本條例所定災區，為因丹娜絲颱風及七二八豪雨災後之受創地區，其範圍由行政院公告之。","note":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於台灣南部地區所發生之豪雨致災之地區，其範圍由行政院公告並刊登政府公報。"}],"changed":true,"final":"本條例所定災區，為因丹娜絲颱風及七二八豪雨災後之受創地區，其範圍由行政院公告之。","finalWhy":"本條例所定災區，包括丹娜絲颱風災後及一百十四年七月二十八日起連續數日，於臺南市、高雄市、嘉義縣（市）及屏東縣等縣（市）發生之豪雨、大豪雨而致災之地區；以及臺中市、彰化縣、南投縣、雲林縣、苗栗縣、花蓮縣及臺東縣等縣（市）有因此致災之地區，其範圍由行政院公告。","review":null},{"no":"第三條","current":null,"versions":[{"bill":"201110155270000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。"},{"bill":"202110155290000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。"},{"bill":"202110155300000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。"},{"bill":"202110155310000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。"},{"bill":"202110155320000","text":"本條例之主管機關為行政院公共工程委員會；中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府。\n各執行機關執行本條例、災害防救法及其他相關法律規定之事項，得委任或委託其他機關（構）、法人或團體辦理。","note":"明定本條例主管機關、執行機關；各執行機關並得委任或委託其他機關（構）、法人或團體辦理本條例、災害防救法及其他相關法律規定之執行事項。"},{"bill":"202110155390000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。"},{"bill":"202110155340000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。"},{"bill":"202110155330000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。"},{"bill":"202110155360000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。"},{"bill":"202110155350000","text":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","note":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關，包含中央執行機關及地方執行機關。"}],"changed":true,"final":"本條例之主管機關為行政院公共工程委員會。\n本條例之中央執行機關為中央各目的事業主管機關；地方執行機關為直轄市政府、縣（市）政府及鄉（鎮、市）、直轄市山地原住民區公所。","finalWhy":"一、第一項定明本條例之主管機關。\n二、第二項定明本條例之執行機關。","review":null},{"no":"第四條","current":null,"versions":[{"bill":"201110155270000","text":"本條例辦理之災區復原重建項目如下：\n一、農業設施：\n(一)農路、林道及農業運輸設施。\n(二)溫室、網室、倉儲、畜舍、禽舍、化製場、堆肥場、資材室及農機具室。\n(三)農作物補植與種苗等設施及設備。\n(四)農業機具及設備。\n(五)漁港、漁船及養殖設施。\n二、電力系統：\n(一)變電所及特高壓以上輸電線路。\n(二)配電網防災韌性。\n(三)路燈及公共照明設施。\n(四)緊急備用電力系統、移動式電源、自發自用電源及儲能等微電網設施。\n三、電信系統及有線廣播電視系統：\n(一)公眾電信網路。\n(二)行動通信基地臺車。\n(三)衛星通信備援設施。\n(四)有線廣播電視系統。\n四、自來水、瓦斯及燃氣設施：\n(一)自來水及簡易自來水設備。\n(二)瓦斯及燃氣管線。\n五、家園及公共設施：\n(一)災損住宅拆除、修繕補助及租金補貼。\n(二)公共建築、學校及政府機關（構）設施。\n(三)文化資產與原住民族文化健康站之緊急搶修及修復。\n六、水利設施：\n(一)河川、排水上中下游系統性治理、農田水利灌排系統及海岸防護設施。\n(二)雨污水下水道及道路排水。\n(三)山坡地整治及土石流防治。\n(四)逕流分擔、出流管制及在地滯洪措施。\n(五)縣（市）管河川、排水設施災後復原重建工程及跨越中央管河川、排水瓶頸段橋梁改建。\n七、道路及交通：\n(一)道路、橋梁及隧道。\n(二)道路邊坡防護及護岸工程。\n(三)交通號誌、標誌與護欄等附屬工程及設施。\n八、環境衛生復原：\n(一)災後廢棄物清理、環保設施修復及環境復原。\n(二)災後疾病防治。\n九、社會復原及產業促進：\n(一)災害救助、心理輔導及社會支持。\n(二)振興地方產業及企業災後低利貸款等復原措施。\n(三)文化觀光旅遊振興。\n(四)農業天然災害現金救助及低利貸款利息補貼等復原措施。\n(五)商家援助、生產設備汰換及產業設施復原。\n十、其他經各中央執行機關認定有復原重建必要之項目。\n辦理前項復原重建項目發給津貼、補助、救助、慰助金及其他給與之資格條件、基準、金額、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由各中央執行機關定之。","note":"一、第一項定明本條例辦理之災區復原重建項目。\n二、為利辦理第一項復原重建項目有發給津貼、補助、救助、慰助金及其他給與等事項之執行，於第二項授權由各中央執行機關另定辦法規範。"},{"bill":"202110155290000","text":"本條例辦理之災區復原重建項目如下：\n一、農業設施：\n(一)農路、林道及農業運輸設施。\n(二)溫室、網室、倉儲、畜舍、禽舍、化製場、堆肥場、資材室及農機具室。\n(三)農作物補植與種苗等設施及設備。\n(四)農業機具及設備。\n(五)漁港、漁船及養殖設施。\n二、電力系統：\n(一)變電所及特高壓以上輸電線路。\n(二)配電網防災韌性。\n(三)路燈及公共照明設施。\n(四)緊急備用電力系統、移動式電源、自發自用電源及儲能等微電網設施。\n三、電信系統及有線廣播電視系統：\n(一)公眾電信網路。\n(二)行動通信基地臺車。\n(三)衛星通信備援設施。\n(四)有線廣播電視系統。\n四、自來水、瓦斯及燃氣設施：\n(一)自來水及簡易自來水設備。\n(二)瓦斯及燃氣管線。\n五、家園及公共設施：\n(一)災損住宅拆除、修繕補助及租金補貼。\n(二)公共建築、學校及政府機關（構）設施。\n(三)文化資產與原住民族文化健康站之緊急搶修及修復。\n六、水利設施：\n(一)河川、排水上中下游系統性治理、農田水利灌排系統及海岸防護設施。\n(二)雨污水下水道及道路排水。\n(三)山坡地整治及土石流防治。\n(四)逕流分擔、出流管制及在地滯洪措施。\n(五)縣（市）管河川、排水設施災後復原重建工程及跨越中央管河川、排水瓶頸段橋梁改建。\n七、道路及交通：\n(一)道路、橋梁及隧道。\n(二)道路邊坡防護及護岸工程。\n(三)交通號誌、標誌與護欄等附屬工程及設施。\n八、環境衛生復原：\n(一)災後廢棄物清理、環保設施修復及環境復原。\n(二)災後疾病防治。\n九、社會復原及產業促進：\n(一)災害救助、心理輔導及社會支持。\n(二)振興地方產業及企業災後低利貸款等復原措施。\n(三)文化觀光旅遊振興。\n(四)農業天然災害現金救助及低利貸款利息補貼等復原措施。\n(五)商家援助、生產設備汰換及產業設施復原。\n十、其他經各中央執行機關認定有復原重建必要之項目。\n辦理前項復原重建項目發給津貼、補助、救助、慰助金、工資及其他給與之資格條件、基準、金額、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由各中央執行機關定之。","note":"一、第一項定明本條例辦理之災區復原重建項目。\n二、為利辦理第一項復原重建項目有發給津貼、補助、救助、慰助金、工資及其他給與等事項之執行，於第二項授權由各中央執行機關另定辦法規範。"},{"bill":"202110155300000","text":"本條例辦理之災區復原重建項目如下：\n一、農業設施：\n(一)農路、林道及農業運輸設施。\n(二)溫室、網室、倉儲、畜舍、禽舍、化製場、堆肥場、資材室及農機具室。\n(三)農作物補植與種苗等設施及設備。\n(四)農業機具及設備。\n(五)漁港、漁船及養殖設施。\n二、電力系統：\n(一)變電所及特高壓以上輸電線路。\n(二)配電網防災韌性。\n(三)路燈及公共照明設施。\n(四)緊急備用電力系統、移動式電源、自發自用電源及儲能等微電網設施。\n三、電信系統及有線廣播電視系統：\n(一)公眾電信網路。\n(二)行動通信基地臺車。\n(三)衛星通信備援設施。\n(四)有線廣播電視系統。\n四、自來水、瓦斯及燃氣設施：\n(一)自來水及簡易自來水設備。\n(二)瓦斯及燃氣管線。\n五、家園及公共設施：\n(一)災損住宅拆除、修繕補助及租金補貼。\n(二)公共建築、學校及政府機關（構）設施。\n(三)文化資產與原住民族文化健康站之緊急搶修及修復。\n六、水利設施：\n(一)河川、排水上中下游系統性治理、農田水利灌排系統及海岸防護設施。\n(二)雨污水下水道及道路排水。\n(三)山坡地整治及土石流防治。\n(四)逕流分擔、出流管制及在地滯洪措施。\n(五)縣（市）管河川、排水設施災後復原重建工程及跨越中央管河川、排水瓶頸段橋梁改建。\n七、道路及交通：\n(一)道路、橋梁及隧道。\n(二)道路邊坡防護及護岸工程。\n(三)交通號誌、標誌與護欄等附屬工程及設施。\n八、環境衛生復原：\n(一)災後廢棄物清理、環保設施修復及環境復原。\n(二)災後疾病防治。\n九、社會復原及產業促進：\n(一)災害救助、心理輔導及社會支持。\n(二)振興地方產業及企業災後低利貸款等復原措施。\n(三)文化觀光旅遊振興。\n(四)農業天然災害現金救助及低利貸款利息補貼等復原措施。\n(五)商家援助、生產設備汰換及產業設施復原。\n十、其他經各中央執行機關認定有復原重建必要之項目。\n辦理前項復原重建項目發給津貼、補助、救助、慰助金及其他給與之資格條件、基準、金額、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由各中央執行機關定之。","note":"一、第一項定明本條例辦理之災區復原重建項目。\n二、為利辦理第一項復原重建項目有發給津貼、補助、救助、慰助金及其他給與等事項之執行，於第二項授權由各中央執行機關另定辦法規範。"},{"bill":"202110155310000","text":"本條例辦理之災區復原重建項目如下：\n一、農業設施：\n(一)農路、林道及農業運輸設施。\n(二)溫室、網室、倉儲、畜舍、禽舍、化製場、堆肥場、資材室及農機具室。\n(三)農作物補植與種苗等設施及設備。\n(四)農業機具及設備。\n(五)漁港、漁船及養殖設施。\n二、電力系統：\n(一)變電所及特高壓以上輸電線路。\n(二)配電網防災韌性。\n(三)路燈及公共照明設施。\n(四)緊急備用電力系統、移動式電源、自發自用電源及儲能等微電網設施。\n三、電信系統及有線廣播電視系統：\n(一)公眾電信網路。\n(二)行動通信基地臺車。\n(三)衛星通信備援設施。\n(四)有線廣播電視系統。\n四、自來水、瓦斯及燃氣設施：\n(一)自來水及簡易自來水設備。\n(二)瓦斯及燃氣管線。\n五、家園及公共設施：\n(一)災損住宅拆除、修繕補助及租金補貼。\n(二)公共建築、學校及政府機關（構）設施。\n(三)文化資產與原住民族文化健康站之緊急搶修及修復。\n六、水利設施：\n(一)河川、排水上中下游系統性治理、農田水利灌排系統及海岸防護設施。\ 三)農作物補植與種苗等設施及設備。\n(四)農業機具及設備。\n(五)漁港、漁船及養殖設施。\n二、電力系統：\n(一)變電所及特高壓以上輸電線路。\n(二)配電網防災韌性。\n(三)路燈及公共照明設施。\n(四)緊急備用電力系統、移動式電源、自發自用電源及儲能等微電網設施。\n三、電信系統及有線廣播電視系統：\n(一)公眾電信網路。\n(二)行動通信基地臺車。\n(三)衛星通信備援設施。\n(四)有線廣播電視系統。\n四、自來水、瓦斯及然氣設施：\n(一)自來水及簡易自來水設備。\n(二)瓦斯及燃氣管線。\n五、家園及公共設施：\n(一)災損住宅拆除、修繕補助及租金補貼。\n(二)公共建築、學校及政府機關（構）設施。\n(三)文化資產與原住民族文化健康站之緊急搶修及修復。\n六、水利設施：\n(一)河川、排水上中下游系統性治理、農田水利灌排系統及海岸防護設施。\n(二)雨污水下水道及道路排水。\n(三)山坡地整治及土石流防治。\n(四)逕流分擔、出流管制及在地滯洪措施。\n(五)縣（市）管河川、排水設施災後復原重建工程及跨越中央管河川、排水瓶頸段橋梁改建。\n七、道路及交通：\n(一)道路、橋梁及隧道。\n(二)道路邊坡防護及護岸工程。\n(三)交通號誌、標誌與護欄等附屬工程及設施。\n八、環境衛生復原：\n(一)災後廢棄物清理、環保設施修復及環境復原。\n(二)災後疾病防治。\n九、社會復原及產業促進：\n(一)災害救助、心理輔導及社會支持。\n(二)振興地方產業及企業災後低利貸款等復原措施。\n(三)文化觀光旅遊振興。\n(四)農業天然災害現金救助及低利貸款利息補貼等復原措施。\n(五)商家援助、生產設備汰換及產業設施復原。\n(六)災區民眾社會保險之保險費支應。\n十、其他經中央執行機關認定有復原重建必要之項目。\n辦理前項復原重建項目發給津貼、補助、救助、慰助金及其他給與之資格條件、基準、金額、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由各中央執行機關定之。\n辦理第一項第二款第一目變電所及特高壓以上輸電線路之復原重建，應優先考量主幹線之地下化，其地區、執行方式、經費補助原則及相關辦法，由經濟部會商內政部及交通部定之。","note":"一、第一項定明本條例辦理之災區復原重建項目。\n二、為利辦理第一項復原重建項目有發給津貼、補助、救助、慰助金及其他給與等事項之執行於第二項授權由各中央執行機關另定辦法規範。\n三、鑒於一百十四年七月間，丹娜絲颱風造成嘉南沿海地區嚴重災損，目前統計強風導致電線桿毀損逾三千五百支，民生用電受到嚴峻挑戰。為避免相同情形再次發生，爰於第三項規定辦理變電所及特高壓以上輸電線路之復原重建，應優先考量主幹線之地下化，並授權主管機關訂定相關辦法，以確保民生用電運行無虞。"},{"bill":"202110155350000","text":"依本條例編列預算之中央執行機關，負責災區災後重建之規劃、預算編列及推動。","note":"明確規定由中央執行機關負責災後重建的整體規劃、經費預算之編列，以及各項重建工作的推動與執行。"}],"changed":true,"final":"本條例辦理之災區復原重建項目如下：\n一、農業設施：\n(一)農路、林道及農業運輸設施。\n(二)溫室、網室、倉儲、畜舍、禽舍、化製場、堆肥場、資材室及農機具室。\n(三)農作物補植與種苗等設施及設備。\n(四)農業機具及設備。\n(五)漁港、漁船及養殖設施。\n二、電力系統：\n(一)變電所及特高壓以上輸電線路。\n(二)配電網防災韌性。\n(三)路燈及公共照明設施。\n(四)緊急備用電力系統、移動式電源、自發自用電源及儲能等微電網設施。\n三、電信系統及有線廣播電視系統：\n(一)公眾電信網路。\n(二)行動通信基地臺車。\n(三)衛星通信備援設施。\n(四)有線廣播電視系統。\n四、自來水、瓦斯及燃氣設施：\n(一)自來水及簡易自來水設備。\n(二)瓦斯及燃氣管線。\n五、家園及公共設施：\n(一)災損住宅拆除、修繕補助及租金補貼。\n(二)公共建築、學校及政府機關（構）設施。\n(三)文化資產與原住民族文化健康站之緊急搶修及修復。\n六、水利設施：\n(一)河川、排水上中下游系統性治理、農田水利灌排系統、海岸防護設施、疏濬、清淤及土方清運處理。\n(二)雨污水下水道及道路排水。\n(三)山坡地整治及土石流防治。\n(四)逕流分擔、出流管制及在地滯洪措施。\n(五)縣（市）管河川、排水設施災後復原重建工程及跨越中央管河川、排水瓶頸段橋梁改建。\n七、道路及交通：\n(一)道路、橋梁及隧道。\n(二)道路邊坡防護及護岸工程。\n(三)交通號誌、標誌與護欄等附屬工程及設施。\n八、環境衛生復原：\n(一)災後廢棄物清理、環保設施修復及環境復原。\n(二)災後疾病防治。\n九、社會復原及產業促進：\n(一)災害救助、心理輔導及社會支持。\n(二)振興地方產業及企業災後低利貸款等復原措施。\n(三)文化觀光旅遊振興。\n(四)農業天然災害現金救助及低利貸款利息補貼等復原措施。\n(五)商家援助、生產設備汰換及產業設施復原。\n十、其他經各中央執行機關認定有復原重建必要之項目。\n辦理前項復原重建項目發給津貼、補助、救助、慰助金、工資及其他給與之資格條件、基準、金額、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由各中央執行機關定之。","finalWhy":"一、第一項定明本條例辦理之災區復原重建項目。\n二、為利辦理第一項復原重建項目有發給津貼、補助、救助、慰助金及其他給與等事項之執行，於第二項授權由各中央執行機關另定辦法規範。\n三、第二項所稱工資，係指行政院核定計畫補助第一項第五款第一目含工帶料及上工津貼等施工獎勵金。","review":null},{"no":"第五條","current":null,"versions":[{"bill":"201110155270000","text":"本條例所需經費上限為新臺幣五百六十億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。","note":"一、第一項定明本條例所需經費上限及採特別預算方式編列。另為使預算編列及執行保持彈性，並定明預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項前段定明第一項所需經費來源之移用原則與其年度舉債額度不受公共債務法第五條第七項規定限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定管控機制，爰併定明第二項後段規定。\n三、第三項定明本條例施行期間，中央政府舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。\n四、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n五、因應各項災區復原重建工作之緊急需要，於第五項定明中央執行機關於報經行政院同意後，得於第一項特別預算案未完成法定程序前，先行支付其一部分。"},{"bill":"202110155290000","text":"本條例所需經費上限為新臺幣六百億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。","note":"一、第一項定明本條例所需經費上限及採特別預算方式編列。另為使預算編列及執行保持彈性，並定明預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項前段定明第一項所需經費來源之移用原則與其年度舉債額度不受公共債務法第五條第七項規定限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定管控機制，爰併定明第二項後段規定。\n三、第三項定明本條例施行期間，中央政府舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。\n四、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n五、因應各項災區復原重建工作之緊急需要，於第五項定明中央執行機關於報經行政院同意後，得於第一項特別預算案未完成法定程序前，先行支付其一部分。"},{"bill":"202110155300000","text":"本條例所需經費上限為新臺幣五百六十億元，得視情勢變化擬定相關計畫，分期編列特別預算；其預算編制與執行不受預算法第二十三條之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府應覈實給予補助，中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分，並送立法院備查。\n中央政府補助地方執行機關之經費，地方執行機關應依補助之目的及項目支用，不得移作他用。","note":"一、明定本法之經費來源，以特別預算之方式編列、審議及執行。\n二、為避免本條例所定，用於災害復原及重建之經費，另定明預算編製及執行不受預算法第二十三條，不得充經常支出規定限制。\n三、所需經費來源之移用原則，與其年度舉債額度，不受公共債務法第五條第七項規定限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定管控機制。\n四、本條例施行期間，中央政府舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。\n五、中央政府應覈實給予地方執行機關，辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府，以代收代付方式執行。另仍為避免本條例所定，用於災害復原及重建之經費，遭挪用為其他用途，有關中央支給地方經費，仍應依據財政收支劃分法第三十條及第三十七條辦理。並為強化限制，參考經濟部水利署辦理一般性補助款疏濬清淤工程執行作業要點第三點，與內政部國土管理署辦理一般性補助款雨水下水道疏濬清淤工程作業要點第四點之規定，提升為法律位階，明定補助經費專款專用，不得移作他用。\n六、因應各災區復原重建工作之緊急需要，並兼顧尊重立法院之預算審議權，定明特別預算案立法程序尚未完成前，中央執行機關得於報經行政院同意後，先行支付一部分，惟須同時送立法院備查。"},{"bill":"202110155310000","text":"前條因水災致住戶淹水之救助，以實際受災戶數為救助對象，不受一門牌一戶之限制，其救助按淹水達五十公分以上者，每戶最高發給新臺幣三萬元；淹水達二十公分至五十公分者，每戶最高發給新臺幣一萬元；另由財團法人賑災基金會再發放救助金新臺幣二萬元。","note":"一、依據2009年《莫拉克颱風災後重建特別條例》第八條規定，住家若淹水達50公分以上，中央政府將發放2萬元救助金。然而，該標準訂定至今已超過16年，當年消費者物價指數（CPI）為89.07，2025年6月的CPI則已上升至109.19，漲幅超過20%。在物價、人工與建材成本大幅上漲的情況下，若補助金額仍停留在2萬元，恐無法實際協助災民完成基本的家屋修繕與生活重建。\n二、另實務上不論淹水深度為20公分或50公分，家具與家電往往都已損毀，家庭經濟因此受到嚴重衝擊。以16年前的2萬元來看，當時能夠購買的修繕與生活用品，如今金額早已不足以支應，導致補助效果大打折扣。為反映物價變動與實際生活成本，發揮政府救助的真正效益，協助災民盡快重建家園，應依近年物價變動調整淹水救助之金額。"},{"bill":"202110155320000","text":"本條例所定災區災後重建計畫之項目如下：\n一、公共設施之修復、重建及強化。\n二、電力、自來水、電信、油料、氣體等公用事業設施之修復及強化。\n三、受災民眾之安置、民宅受損拆除與重建之補助、受災民眾之救助金與災後輔導。\n四、災區產業與觀光振興及受災企業紓困方案。\n五、農業災損之救助、農業設施重建補助、生產環境與農村生態之復原重建。\n六、受災區域之災後環境衛生復原。\n七、文化資產修復、地方藝文團體紓困與補助、在地文化生活圈重建。\n八、其他經行政院核可之災區復原重建相關事項。","note":"本條例所定事項涉及行政院各部會等相關機關之職掌，爰於本條例明定各部會應負責事項如下：\n一、第一款及第二款規定包含政府機構、公共建築、學校、水利設施、觀光設施、交通設施及道路與原住民文化健康站等公共設施重建復原工作。\n二、第二款規定，其電力設施包含變電所及特高壓以上輸電線路、配電網防災韌性、路燈及公共照明設施、緊急備用電源、移動式電源、自發自用電源及儲能微電網設施；電信系統包括公眾電信網路、行動通信基地臺車、衛星通信備援設施以及有線廣播電視系統；其他公用事業設施包括自來水設施以及瓦斯及燃氣管線等公用事業設施復原重建。\n三、第三款規定包含災害慰問金、賑助金、受災戶租金補貼、受災戶旅宿安置、安遷賑助及修繕補助、受災戶住宅貸款利息補貼、災損住宅拆除、受災居民得申請債務展延期間免繳息、各項社會保險及稅費減免、融資紓困、就業協助措施及創業貸款戶之貸款利息補貼等。\n四、第四款規定包含提供中小企業災後低利貸款、夜市商圈復原振興、災區文化旅遊觀光振興以及商家援助、生產設備汰換及產業設施復原等。\n五、第五款規定包含農、漁、林、畜牧業天然災害現金救助以及無息貸款、休閒農產業交通受阻期間經營協助、協助農產品行銷以及農業設施復原重建，其農業設施包括農路、林道及農業運輸設施、溫室、網室、倉儲、畜舍、禽舍、化製場、堆肥場、資材室、農機具室、農作物補植與種苗等設施、農業機具、漁港、漁船及養殖設施等。\n六、第六款規定包含災後廢棄物清理、環保設施修復、環境復原以及災後疾病防治。\n七、第七款規定包含災區文化資產修復以及振興災區地方藝文團體。\n八、第八款考量上述災後復原政策可能掛一漏萬，為使行政院及相關主管機關制定及執行政策有足夠彈性空間，爰列第八款規定。"},{"bill":"202110155390000","text":"本條例所需經費上限為新臺幣五百六十億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。","note":"一、第一項定明本條例所需經費上限及採特別預算方式編列。另為使預算編列及執行保持彈性，並定明預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項前段定明第一項所需經費來源之移用原則與其年度舉債額度不受公共債務法第五條第七項規定限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定管控機制，爰併定明第二項後段規定。\n三、第三項定明本條例施行期間，中央政府舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。\n四、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n五、因應各項災區復原重建工作之緊急需要，於第五項定明中央執行機關於報經行政院同意後，得於第一項特別預算案未完成法定程序前，先行支付其一部分。"},{"bill":"202110155340000","text":"本條例所需經費上限為新臺幣五百六十億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。","note":"一、第一項定明本條例所需經費上限及採特別預算方式編列。另為使預算編列及執行保持彈性，並定明預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項前段定明第一項所需經費來源之移用原則與其年度舉債額度不受公共債務法第五條第七項規定限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定管控機制，爰併定明第二項後段規定。\n三、第三項定明本條例施行期間，中央政府舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。\n四、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n五、因應各項災區復原重建工作之緊急需要，於第五項定明中央執行機關於報經行政院同意後，得於第一項特別預算案未完成法定程序前，先行支付其一部分。"},{"bill":"202110155330000","text":"本條例所需經費上限為新臺幣五百六十億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規民之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。","note":"一、第一項定明本條例所需經費上限及採特別預算方式編列。另為使預算編列及執行保持彈性，並定明預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n四、因應各項災區復原重建工作之緊急需要，於第五項定明中央執行機關於報經行政院同意後，得於第一項特別預算案未完成法定程序前，先行支付其一部分。"},{"bill":"202110155360000","text":"本條例所需經費上限為新臺幣五百六十億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。","note":"一、第一項定明本條例所需經費上限及採特別預算方式編列。另為使預算編列及執行保持彈性，並定明預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項前段定明第一項所需經費來源之移用原則與其年度舉債額度不受公共債務法第五條第七項規定限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定管控機制，爰併定明第二項後段規定。\n三、第三項定明本條例施行期間，中央政府舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。\n四、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n五、因應各項災區復原重建工作之緊急需要，於第五項定明中央執行機關於報經行政院同意後，得於第一項特別預算案未完成法定程序前，先行支付其一部分。"},{"bill":"202110155350000","text":"本條例辦理之災區復原重建項目如下：\n一、農業設施：\n(一)農路、林道及農業運輸設施。\n(二)溫室、網室、倉儲、畜舍、禽舍、化製場、堆肥場、資材室及農機具室。\n(三)農作物補植與種苗等設施及設備。\n(四)農業機具及設備。\n(五)漁港、漁船及養殖設施。\n二、電力系統：\n(一)變電所及特高壓以上輸電線路。\n(二)配電網防災韌性。\n(三)路燈及公共照明設施。\n(四)緊急備用電力系統、移動式電源、自發自用電源及儲能等微電網設施。\n三、電信系統及有線廣播電視系統：\n(一)公眾電信網路。\n(二)行動通信基地臺車。\n(三)衛星通信備援設施。\n(四)有線廣播電視系統。\n四、自來水、瓦斯及燃氣設施：\n(一)自來水及簡易自來水設備。\n(二)瓦斯及燃氣管線。\n五、家園及公共設施：\n(一)災損住宅拆除、修繕補助及租金補貼。\n(二)公共建築、學校及政府機關（構）設施。\n(三)文化資產與原住民族文化健康站之緊急搶修及修復。\n(四)安全堪虞災區遷居、遷村。\n六、水利設施：\n(一)河川、排水上中下游系統性治理、農田水利灌排系統及海岸防護設施。\n(二)雨污水下水道及道路排水。\n(三)山坡地整治及土石流防治。\n(四)逕流分擔、出流管制及在地滯洪措施。\n(五)縣（市）管河川、排水設施災後復原重建工程及跨越中央管河川、排水瓶頸段橋梁改建。\n七、道路及交通：\n(一)道路、橋梁及隧道。\n(二)道路邊坡防護及護岸工程。\n(三)交通號誌、標誌與護欄等附屬工程及設施。\n八、環境衛生復原：\n(一)災後廢棄物清理、環保設施修復及環境復原。\n(二)災後疾病防治。\n九、社會復原及產業促進：\n(一)災害救助、心理輔導及社會支持。\n(二)振興地方產業及企業災後低利貸款等復原措施。\n(三)文化觀光旅遊振興。\n(四)農業天然災害現金救助及低利貸款利息補貼等復原措施。\n(五)商家援助、生產設備汰換及產業設施復原。\n十、其他經各中央執行機關認定有復原重建必要之項目。\n辦理前項復原重建項目發給津貼、補助、救助、慰助金及其他給與之資格條件、基準、金額、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由各中央執行機關定之。","note":"一、第一項定明本條例辦理之災區復原重建項目，包含農業設施、電力系統、電信系統及有線廣播電視系統、自來水、瓦斯及燃氣設施、家園及公共設施、水利設施、道路及交通、環境衛生復原、社會復原及產業促進等。\n二、為順利執行第一項所定之復原重建項目中，涉及發放津貼、補助、救助、慰助金及其他給與之相關事項，第二項授權由各中央執行機關另行訂定辦法，以資規範。"}],"changed":true,"final":"本條例所需經費上限為新臺幣六百億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分，並送立法院備查。\n中央政府補助地方執行機關之經費，地方執行機關應依補助之目的及項目支用，不得移作他用。","finalWhy":"一、第一項定明本條例所需經費上限及採特別預算方式編列。另為使預算編列及執行保持彈性，並定明預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項前段定明第一項所需經費來源之移用原則與其年度舉債額度不受公共債務法第五條第七項規定限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定管控機制，爰併定明第二項後段規定。\n三、第三項定明本條例施行期間，中央政府舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。\n四、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n五、因應各災區復原重建工作之緊急需要，並兼顧尊重立法院之預算審議權，定明特別預算案立法程序尚未完成前，中央執行機關得於報經行政院同意後，先行支付一部分，惟須同時送立法院備查。\n六、中央政府應覈實給予地方執行機關，辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府，以代收代付方式執行。另仍為避免本條例所定，用於災害復原及重建之經費，遭挪用為其他用途，有關中央支給地方經費，仍應依據財政收支劃分法第三十條及第三十七條辦理。並為強化限制，參考經濟部水利署辦理一般性補助款疏濬清淤工程執行作業要點第三點，與內政部國土管理署辦理一般性補助款雨水下水道疏濬清淤工程作業要點第四點之規定，提升為法律位階，明定補助經費專款專用，不得移作他用。","review":null},{"no":"第六條","current":null,"versions":[{"bill":"201110155270000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155290000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155300000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155310000","text":"各級政府執行因此次災害致水利設施毀損之改建或修護，得逕行變更其水道治理計畫線、堤防預定線，並設置相關設施，不受水利法第八十二條規定之限制。\n各級政府得依前項設施之範圍，修正公告河川區域，並得就河川區域外洪氾可能所及之範圍，劃定公告洪氾區，限制或禁止洪氾區內土地之使用；其限制或禁止事項、管制程度、拆除或剷除違反限制或禁止事項之設施與其補償及其他應遵行事項之辦法，由經濟部定之。","note":"為加速復原重建因此次災害毀損之水利設施，放寬各級政府之改建或修護以及洪氾可能所及之範圍之管制法規。"},{"bill":"202110155320000","text":"前條各款復原重建項目發給津貼、補助、救助、慰助金及其他給與之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各執行機關定之。","note":"有關第五條各款復原重建項目發給津貼、補助、救助、慰助金及其他給與之執行方式期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法，以利執行。"},{"bill":"202110155390000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155340000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155330000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155360000","text":"本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155350000","text":"中央政府、直轄市政府、縣（市）政府得就安全堪虞災區，依國土計畫法劃定為國土復育促進地區，並辦理遷居、遷村。\n前項遷居或遷村所需土地，得徵收或申請撥用。取得公有土地後之處理，不受國有財產法第二十八條、土地法第二十五條及地方公產管理法規之限制。\n第一項措施之辦理方式、安置用地勘選、變更、利用、遷建房地之計價、分配、繳款及其他應遵行事項之辦法，由內政部定之。","note":"有鑑於莫拉克風災後，高雄市、屏東縣原住民族鄉、鎮、區內少數部落（如高雄市茂林區萬山部落、屏東縣滿州鄉分水嶺部落、春日鄉士文部落、三地門鄉德文部落等）重複致災嚴重，現居地區已經審定為安全堪虞地區，遭逢本次丹娜絲颱風及0728豪雨災情，加遽居民災害危險，惟地方政府囿於無法規配套，長期未能解決遷居用地問題，爰參考莫拉克颱風災後重建特別條例及國土計畫法之規定，俾利地方政府加速辦理遷居、遷村事宜。"}],"changed":true,"final":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","finalWhy":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。","review":null},{"no":"第七條","current":null,"versions":[{"bill":"201110155270000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之津貼、補助、救助、慰助金及其他給與，係為減輕人民負擔，並為有效、迅速推動丹娜絲颱風及七二八豪雨災後災區復原重建之目的，如就所領取之津貼、補助、救助、慰助金及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110155290000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金、工資及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金、工資及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之津貼、補助、救助、慰助金、工資及其他給與，係為減輕人民負擔，並為有效、迅速推動丹娜絲颱風及七二八豪雨災後災區復原重建之目的，如就所領取之津貼、補助、救助、慰助金、工資及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110155300000","text":"因水災致住戶淹水之救助，以一門牌一戶計算，淹水達五十公分以上者，除依現有法規發放救助外，依本條例每戶發給新臺幣二萬元；具低收入戶或中低收入戶資格者，每戶發給新臺幣三萬元。\n前項發給辦法，由主管機關定之。","note":"因水災致住戶淹水達五十公分以上者，除依現有法規發放救助外，每戶發給救助金新臺幣二萬元；具低收入戶或中低收入戶資格者，每戶發給新臺幣三萬元。"},{"bill":"202110155310000","text":"各級政府機關執行災區交通及其他公共工程之重建或輸電線路之重建、興建、保護工程，得於河川區域內施設跨河之便橋、便道，或改建、修復、拆除既有跨、穿越水道、水利設施底部建築物或疏導河道，得簡化水利法規有關河川區域使用之行政程序。\n前項簡化程序、審查原則及其他應遵行事項之辦法，由經濟部會商交通部定之。","note":"為加速復原重建因此次災害毀損之交通、其他公共工程及輸電線路，放寬、簡化各級政府之重建、興建、保護工程之管制法規。"},{"bill":"202110155320000","text":"本條例所需經費上限為新臺幣六百億元，得視情勢變化擬定相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。\n第一項特別預算之使用，限於本條例所定之災區推動第五條所列復原重建事項，不得為其他使用。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理。\n四、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n五、因應各項災區復原重建工作之緊急需要，於第五項定明中央執行機關於報經行政院同意後，得於第一項特別預算案未完成法定程序前，先行支付其一部分。\n六、第六項明定該特別預算之使用範圍，僅限於復原重建事項。"},{"bill":"202110155390000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之津貼、補助、救助、慰助金及其他給與，係為減輕人民負擔，並為有效、迅速推動丹娜絲颱風及七二八豪雨災後災區復原重建之目的，如就所領取之津貼、補助、救助、慰助金及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110155340000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之津貼、補助、救助、慰助金及其他給與，係為減輕人民負擔，並為有效、迅速推動丹娜絲颱風及七二八豪雨災後災區復原重建之目的，如就所領取之津貼、補助、救助、慰助金及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110155330000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕災民負擔、重建災區經濟、扶持災區產業等目的，如就所領取之補助及其他給與仍予課稅或得業為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110155360000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之津貼、補助、救助、慰助金及其他給與，係為減輕人民負擔，並為有效、迅速推動丹娜絲颱風及七二八豪雨災後災區復原重建之目的，如就所領取之津貼、補助、救助、慰助金及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110155350000","text":"辦理災區災民遷居、遷村所需土地，合於取代環境影響說明書之環境保育對策，於一定規模以下，經土地使用、地質、環境影響評估、水土保持及水利等機關會勘認定安全無虞者，有關土地變更、開發事項，不受區域計畫法、都市計畫法、國家公園法、環境影響評估法、水土保持法及其他相關法規規定之限制；其環境保育對策、一定規模、安全無虞之認定原則、不受有關法規限制之範圍及其他應遵行事項之辦法，由內政部會商相關機關定之。","note":"為使安置災民所需土地順利取得，爰規定辦理災民遷居、遷村所需土地，其土地變更事項，得有條件不受相關法規限制，並授權主管機關訂定辦法處理。"}],"changed":true,"final":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金、工資及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金、工資及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","finalWhy":"一、考量依本條例規定自政府領取之津貼、補助、救助、慰助金、工資及其他給與，係為減輕人民負擔，並為有效、迅速推動丹娜絲颱風及七二八豪雨災後災區復原重建之目的，如就所領取之津貼、補助、救助、慰助金、工資及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。\n二、所稱工資，係同本條例第四條之立法說明三。","review":null},{"no":"第八條","current":null,"versions":[{"bill":"201110155270000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十六年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長施行期間。"},{"bill":"202110155290000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十五年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長施行期間。"},{"bill":"202110155300000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之津貼、補助、救助、慰助金及其他給與，係為減輕人民負擔，並為有效、迅速推動丹娜絲颱風及七二八豪雨災後災區復原重建之目的，如就所領取之津貼、補助、救助、慰助金及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110155310000","text":"因此次災害受損須進行輸電線路或自來水管線之興建、架設及交通重建，得依既有或規劃路線先行使用土地及進行重建工程；其因塔基、管線、路基流失或短期無法復建完成者，得移位重建，不受國有財產法第五十條及電業法第五十條、第五十一條規定之限制；其工程用地之取得，不受都市計畫法第五十二條及土地法第二十五條規定之限制。\n辦理前項重建工程，依水土保持法第十二條及第十四條規定應先擬具水土保持計畫者，得以簡易水土保持申報書代替水土保持計畫，由各該目的事業主管機關審核及監督。\n若需用土地機關因情況緊急，如遲延使用公、私有土地或土地改良物，公共利益有受重大危害之虞時，得先行徵得土地所有權人同意使用後，再依土地徵收條例、土地法及國有財產法規定補辦程序。","note":"為加速復原重建因此次災害毀損之輸電線路或自來水管線，放寬、簡化各級政府之興建、架設及交通重建之管制法規。"},{"bill":"202110155320000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155390000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十六年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長施行期間。"},{"bill":"202110155340000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十六年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長施行期間。"},{"bill":"202110155330000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十六年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長施行期間。"},{"bill":"202110155360000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十六年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長施行期間。"},{"bill":"202110155350000","text":"本條例所需經費上限為新臺幣六百億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。","note":"一、第一項明定本條例所需經費之上限，並採特別預算方式編列。為確保預算執行具備彈性，並明確排除適用預算法第二十三條（不得充經常支出）、第六十二條（不得流用不同機關、政事及業務科目）及第六十三條（流用比率限制）之規定。\n二、第二項前段規範第一項所需經費得以移用前年度歲計賸餘或舉借債務支應，並明定其年度舉債額度不受公共債務法第五條第七項限制；為落實財政紀律法第十四條第二項之精神，後段進一步設有舉債比率之控管規定。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額之預算數，仍應依公共債務法第五條第一項辦理，以符財政紀律法第十四條第三項之要求。\n四、第四項規定，地方執行機關辦理本條例事項及災害防救法相關業務所需經費，中央政府得覈實補助，並得同意地方政府以代收代付方式辦理，以利行政執行。\n五、第五項為因應災區復原重建之急迫需求，明定在特別預算尚未完成法定程序前，中央執行機關得報經行政院同意後，先行撥付部分經費，以確保即時應變與救助得以展開。"}],"changed":true,"final":"依本條例編列預算之中央各部會，應於本條例施行後兩個月內提出災後復原重建計畫。\n本條例編列預算之中央各部會，應將預算之工作計畫實施內容概述及預計實施進度，按季送立法院備查。","finalWhy":"一、規定本條例復原及重建計畫之提出、實施與公開。\n二、為強化本條例特別預算之國會監督之機制，加強民主控制，原先現行預算法第六十一條，即規定執行預算之機關，應定期向立法院提送重要事項考核報告。基於特別預算內容、範圍，相較於年度預算，更加清楚明確，因此延伸預算法第六十一條之精神，直接於法律中規定，各類詳細與預算執行有關之文件，應按季送立法院，爰定於本條。\n三、承上，自強化國會監督之觀點，本次制定有關預算執行提送國會，不侷限於備查，立法院對相關預算執行情形有審議權。","review":null},{"no":"第九條","current":null,"versions":[{"bill":"202110155300000","text":"依本條例編列預算之中央各部會，應於本條例施行後兩個月內提出災後復原重建計畫。\n本條例編列預算之中央各部會，應將預算執行情形之工作計畫實施成果概述、計畫提要及分支計畫概況表，並說明實施進度及預算執行數額，按季送立法院審議。","note":"一、規定本條例復原及重建計畫之提出、實施與公開。\n二、為強化本條例特別預算之國會監督之機制，加強民主控制，原先現行預算法第六十一條，即規定執行預算之機關，應定期向立法院提送重要事項考核報告。基於特別預算內容、範圍，相較於年度預算，更加清楚明確，因此延伸預算法第六十一條之精神，直接於法律中規定，各類詳細與預算執行有關之文件，應按季送立法院，爰定於本條。\n三、承上，自強化國會監督之觀點，本次制定有關預算執行提送國會，不侷限於備查，立法院對相關預算執行情形有審議權。"},{"bill":"202110155310000","text":"各級政府因此次災害辦理或經其核准辦理之災害防救緊急性與重建工程、計畫或處理災害之土石、河川淤泥所需之緊急清理方法、設施及處所，不受環境影響評估法規定之限制。\n因此次災害致現有廢棄物貯存、回收、清除、處理設施能量不足，而有污染環境或影響人體健康之虞時，中央環境保護主管機關得免會同其他中央執行機關、有關機關及報請行政院核准之程序，逕依廢棄物清理法第八條規定指定廢棄物緊急清理方法、設施及處所，或允許在不增加該處所設備及原核准容量之情形下，增加其月處理量。\n環境污染防治設施因此次災害所造成損害致影響正常運作，未能符合環境保護法規者，得自本條例施行之日起三個月內，檢具證明文件，並提出改善計畫，申請環境保護主管機關核定改善期限，改善期限最長不得逾六個月，必要時得申請延長，並以一次為限；改善期間免予處罰。\n前項改善期間，免依環境保護法規規定辦理檢測申報；土壤及地下水污染整治法第九條指定公告之事業，因此次災害所造成損害致停業、歇業者，免依該條規定辦理。","note":"為加速復原重建，放寬、簡化各級政府辦理相關計畫之環境管制及廢棄物清理管制法規。"},{"bill":"202110155320000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕災民負擔、重建災區經濟、扶持災區產業等目的，如就所領取之補助及其他給與仍予課稅或得業為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110155350000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、《災害防救法》第四十二條至第五十條已針對災區提供多項復原重建措施，包括：借款償還期限展延與免收利息、購屋貸款利息補貼、產業與企業紓困、社會保險保費由政府負擔，以及農業設施擔保品毀損由金融機構承擔等。依同法第五十一條規定，「災區」係指因災害造成嚴重人命傷亡或建物毀損等情形之地區，其範圍由行政院公告並刊登於政府公報。\n二、惟本條例所定災區範圍，未必與依《災害防救法》第五十一條所公告者完全一致。考量本次自丹娜絲颱風期間起，接續出現強降雨與七月二十八日起連續豪雨，造成災情廣泛而嚴重，為使未被列入《災害防救法》災區公告範圍內之地區，亦得適用該法有關災區之各項復原重建措施，爰設本條，以保障受災地區均能獲得必要支援與協助。"}],"changed":true,"final":"主管機關應設置資訊網站專區，提供便於搜尋、得以理解之完整資訊，主動按月定期公開本條例下列執行進度及內容：\n一、第二條所定災區之公告。\n二、第四條第二項由各中央執行機關訂定之辦法。\n三、前條所定之內容。","finalWhy":"明定本法之監督機制，包含資訊網站公開，及明定主管機關應設置資訊網站專區，詳列應主動定期公開之本條例執行進度及內容。","review":null},{"no":"第十條","current":null,"versions":[{"bill":"202110155300000","text":"主管機關應設置資訊網站專區，提供便於搜尋、得以理解之完整資訊，主動按月定期公開本條例下列執行進度及成果：\n一、第二條所定災區之公告。\n二、第四條第二項及第七條第一項，由主管機關及各中央執行機關訂定之各類給與辦法。\n三、前條所定之內容。","note":"明定本法之監督機制，包含資訊網站公開，及明定主管機關應設置資訊網站專區，詳列應主動定期公開之本條例執行進度及成果。"},{"bill":"202110155310000","text":"本條例所需經費上限為新臺幣五百六十億元，得視情勢變化擬訂相關計畫，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n地方執行機關辦理本條例及災害防救法規定事項所需經費，中央政府得覈實給予補助。中央執行機關並得同意受補助之地方政府以代收代付方式執行。\n為因應各項災區救災及復原重建工作之緊急需要，中央執行機關得報經行政院同意後，於第一項特別預算案未完成法定程序前，先行支付其一部分。","note":"一、第一項定明本條例所需經費上限及採特別預算方式編列。另為使預算編列及執行保持彈性，並定明預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項前段定明第一項所需經費來源之移用原則與其年度舉債額度不受公共債務法第五條第七項規定限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定管控機制，爰併定明第二項後段規定。\n三、第三項定明本條例施行期間，中央政府舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。\n四、第四項明定中央政府得覈實給予地方執行機關辦理本條例及災害防救法規定事項所需經費，並得同意受補助之地方政府以代收代付方式執行。\n五、因應各項災區復原重建工作之緊急需要，於第五項定明中央執行機關於報經行政院同意後，得於第一項特別預算案未完成法定程序前，先行支付其一部分。"},{"bill":"202110155320000","text":"本條例施行期間，自中華民國一百十四年七月六日起至一百十六年十二月三十一日止。\n本條例施行期間屆滿，得經立法院同意延長之。","note":"明定本條例之施行期間。"},{"bill":"202110155350000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定由政府發給之津貼、補助、救助、慰助金及其他給與，係為協助災民減輕生活與經濟負擔，並有效且迅速推動丹娜絲颱風及七二八豪雨災後之復原重建工作，若就上述款項仍課徵所得稅，或允其作為抵銷、扣押、擔保或強制執行之標的，將有違原本發給之公益目的，並可能削弱救助效果。"}],"changed":true,"final":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十五年十二月三十一日止。但第四條第一項第二款、第三款及第六款施行至中華民國一百十六年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","finalWhy":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長施行期間。","review":null},{"no":"第十一條","current":null,"versions":[{"bill":"202110155300000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十五年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長。"},{"bill":"202110155310000","text":"本條例所定災區，不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建準用該法有關災區之規定。","note":"一、災害防救法第四十二條至第五十條針對災區定有借款償還期限展延及利息免收、購屋貸款利息補貼、產業企業紓困、社會保險保費由政府負擔、農業設施擔保品毀損由金融機構承受等復原重建措施，而上開規定所稱災區，依同法第五十一條規定，指因災害造成嚴重人命傷亡或建物毀損等之受創地區，其範圍由行政院公告並刊登公報。\n二、本條例所定災區範圍與依災害防救法第五十一條規定公告之災區未必相同，考量於丹娜絲颱風期間及後續接續不斷之強降雨，以及自一百十四年七月二十八日起連續數日豪雨、大豪雨致受災嚴重，為能使本條例所定災區不在依災害防救法第五十一條規定公告之災區範圍者，其復原重建亦能依災害防救法災區相關規定辦理，爰為本條規定。"},{"bill":"202110155350000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十六年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項明定本條例及其所依據編列之特別預算的施行期間，以確保災後復原重建工作有明確的執行時程。\n二、考量復原重建工作內容繁重且具延續性，為確保執行彈性，避免本條例及特別預算施行期間屆滿時仍有未竟事項無法處理，第二項規定得經立法院同意後延長施行期間，以符實務需要。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十二條","current":null,"versions":[{"bill":"202110155310000","text":"依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，免納所得稅。\n依本條例規定自各執行機關領取之津貼、補助、救助、慰助金及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之津貼、補助、救助、慰助金及其他給與，係為減輕人民負擔，並為有效、迅速推動丹娜絲颱風及七二八豪雨災後災區復原重建之目的，如就所領取之津貼、補助、救助、慰助金及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十三條","current":null,"versions":[{"bill":"202110155310000","text":"本條例及其特別預算施行期間，自公布日施行至中華民國一百十六年十二月三十一日止。\n本條例及其特別預算施行期間屆滿，得經立法院同意延長之。","note":"一、第一項規定本條例及其特別預算之施行期間。\n二、為利彈性執行復原重建工作，避免本條例及其特別預算施行期間屆滿仍有繼續適用之必要，爰於第二項明定得經立法院同意延長施行期間。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2025-08-08","stage":"一讀","code":"院會-11-3-24","bill":"201110155270000","gazref":"114卷070期5363號一冊 33-33頁"},{"date":"2025-08-08","stage":"一讀","code":"院會-11-3-24","bill":"202110155290000","gazref":"114卷070期5363號一冊 33-33頁"},{"date":"2025-08-08","stage":"一讀","code":"院會-11-3-24","bill":"202110155300000","gazref":"114卷070期5363號一冊 33-33頁"},{"date":"2025-08-08","stage":"一讀","code":"院會-11-3-24","bill":"202110155310000","gazref":"114卷070期5363號一冊 33-33頁"},{"date":"2025-08-08","stage":"一讀","code":"院會-11-3-24","bill":"202110155320000","gazref":"114卷070期5363號一冊 33-33頁"},{"date":"2025-08-13","code":"黨團協商-2025081267","title":"立法院朝野黨團協商","gazref":"114卷070期5363號二冊 97-244頁","stage":"黨團協商","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2025081267/details?meetingDate=114/08/13","full":["https://ivod.ly.gov.tw/Play/Full/1M/16864"],"pdf":[],"clips":[],"props":[],"tr":null,"note":null,"mixed ,"陳玉珍":"國民黨","陳秀寳":"民進黨","陳亭妃":"民進黨","陳俊宇":"民進黨","陳冠廷":"民進黨","陳超明":"無黨籍","陳瑩":"民進黨","傅崐萁":"國民黨","黃仁":"國民黨","黃秀芳":"民進黨","黃建賓":"國民黨","黃捷":"民進黨","楊曜":"民進黨","楊瓊瓔":"國民黨","葉元之":"國民黨","廖先翔":"國民黨","廖偉翔":"國民黨","劉建國":"民進黨","蔡其昌":"民進黨","蔡易餘":"民進黨","鄭正鈐":"國民黨","賴士葆":"國民黨","賴瑞隆":"民進黨","謝龍介":"國民黨","鍾佳濱":"民進黨","韓國瑜":"國民黨","顏寬恒":"國民黨","羅廷瑋":"國民黨","羅明才":"國民黨","羅智強":"國民黨","蘇巧慧":"民進黨","蘇清泉":"國民黨","呂玉玲":"國民黨","李坤城":"民進黨","洪毓祥":"民眾黨","蔡春綢":"民眾黨","王安祥":"民眾黨","邱慧洳":"民眾黨","翁曉玲":"國民黨","王育敏":"國民黨","沈伯洋":"民進黨","沈發惠":"民進黨","林沛祥":"國民黨","林楚茵":"民進黨","張雅琳":"民進黨","陳菁徽":"國民黨","鄭天財":"國民黨","盧縣一":"國民黨","羅美玲":"民進黨","王正旭":"民進黨","王義川":"民進黨","劉書彬":"民眾黨","李彥秀":"國民黨","林月琴":"民進黨","林倩綺":"國民黨","許宇甄":"國民黨","郭昱晴":"民進黨","陳培瑜":"民進黨","葛如鈞":"國民黨","賴惠員":"民進黨","謝衣鳯":"國民黨","許忠信":"民眾黨"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);

  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });

const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
