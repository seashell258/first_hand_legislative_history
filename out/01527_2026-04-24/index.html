<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>娛樂稅法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

條"]},{"id":"202110105230000","who":"委員陳培瑜等18人","date":"2025-04-18","name":"「娛樂稅法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110105230000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/08/LCEWA01_110308_00081.pdf","proposers":["陳培瑜"],"ncosign":17,"people":[["陳培瑜","民進黨","提案"],["陳俊宇","民進黨","連署"],["郭昱晴","民進黨","連署"],["林月琴","民進黨","連署"],["沈發惠","民進黨","連署"],["許智傑","民進黨","連署"],["王美惠","民進黨","連署"],["賴惠員","民進黨","連署"],["陳素月","民進黨","連署"],["吳思瑤","民進黨","連署"],["吳沛憶","民進黨","連署"],["王義川","民進黨","連署"],["徐富癸","民進黨","連署"],["邱志偉","民進黨","連署"],["王正旭","民進黨","連署"],["陳冠廷","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["陳秀寳","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員陳培瑜等18人，有鑑於娛樂稅法於1980年修正時係針對特定娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之予以徵收，課徵之目的係為藉此提高奢侈性消費之成本，以達提倡節儉之政策目的。然我國近年大力支持並發展藝文產業，各項競技運動及全民運動之推廣亦為我國重大政策發展方針，顯已與當初立法目的相違背。爰為支持與發展藝文及運動產業，擬具「娛樂稅法部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第五條","第六條","第十條","第十七條"]},{"id":"202110181040000","who":"委員李彥秀等18人","date":"2025-12-26","name":"「娛樂稅法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110181040000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/15/LCEWA01_110415_00049.pdf","proposers":["李彥秀","羅廷瑋","黃健豪","廖偉翔"],"ncosign":14,"people":[["李彥秀","國民黨","提案"],["羅廷瑋","國民黨","提案"],["黃健豪","國民黨","提案"],["廖偉翔","國民黨","提案"],["蘇清泉","國民黨","連署"],["黃仁","國民黨","連署"],["張智倫","國民黨","連署"],["羅明才","國民黨","連署"],["顏寬恒","國民黨","連署"],["林德福","國民黨","連署"],["陳玉珍","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["魯明哲","國民黨","連署"],["陳雪生","國民黨","連署"],["萬美玲","國民黨","連署"],["呂玉玲","國民黨","連署"],["陳菁徽","國民黨","連署"],["邱鎮軍","國民黨","連署"]],"party":[["國民黨",18]],"reason":"本院委員李彥秀、羅廷瑋、黃健豪、廖偉翔等18人，鑑於娛樂稅為地方自治重要財源，為使各直轄市及縣（市）政府保有財政自主空間，並得配合娛樂消費行為變化，兼顧地方政府產業發展，視其產業發展、政策需要及財政狀況等特定合理政策目的停徵娛樂稅，爰擬具「娛樂稅法部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第五條","第六條","第十條","第十七條"]}],"arts":[{"no":"第二條","current":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場及其他提供娛樂設施供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","versions":[{"bill":"202110012080000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、舞廳或舞場。\n二、夜總會之表演及其他提供娛樂設施供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、刪除本條第一項第一至四款，及第六款中的高爾夫球場刪除，並將第四、五款改為第一、二款。\n二、娛樂稅法前身為筵席及娛樂稅法，在民國40年代將筵席、撞球等活動視為奢侈之活動，並予以課稅，以達到寓禁於徵之效果。然隨著社會風氣的改變，於民國44年將筵席從娛樂稅中排除；在民國80年代立法院已將撞球、保齡球等活動從娛樂稅中刪除。但條文中還是將藝文活動跟夜總會、舞廳視為同一種活動，並且要課徵娛樂稅，顯然不合時宜。\n三、在現代，過去視為奢侈性之電影、舞蹈、競技比賽、卡啦OK、高爾夫等活動，也已轉變成為普及大眾之休閒活動或文化及體育活動，亦成為國家重點投入資源推動之項目，若花費大量資源投入，又以課稅來增加民眾參與的誘因實屬矛盾。"},{"bill":"202110012940000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、其他提供娛樂設施供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、娛樂稅最初課徵之目的係為藉此提高奢侈性消費之成本，以達提倡節儉之政策目的。然而時過境遷，電影、舞蹈、戲劇、競技比賽等藝文與運動產業實屬目前一般民眾的日常性消費，已非昔日的奢侈性消費。\n二、且文化部為了推動我國文化產業，發展文化產業，陸續投入大量資源挹注，試圖壯大藝文消費市場；教育部亦大力推動運動競技，意圖使運動產業蓬勃發展，皆與娛樂稅原先制定之目的大相逕庭。且政府推動政策不應互相扞格，大量挹注資源推動產業；同時卻又課徵娛樂稅增加民眾負擔；爰刪除第一項第一款、第二款前段、第三款至第四款、第六款前段之藝文及運動產業之相關活動，免為娛樂稅之課徵項目。\n三、第二項未修正。"},{"bill":"202110016590000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、其他提供娛樂設施供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、刪除原條文第一項第一、三、四款，並刪除第二、六款前段，後做款次調整。\n二、今時過境遷，娛樂稅法制定背景與立法理由已不合時宜。娛樂稅的課稅客體，諸如電影、戲劇、舞蹈、音樂演奏、體育競賽等，已不再是奢侈活動，允宜刪除。\n三、參酌2004年監察院對高爾夫球運動者課徵娛樂稅案，向財政部提出糾正案，刪除第六款高爾夫球場。"},{"bill":"202110029180000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、高爾夫球場，但應於尋得替代財源後、或於中華民國一百十五年一月一日起停止徵收。\n四、其他提供娛樂設施供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、鑑於娛樂稅法前身為筵席及娛樂稅法，係針對奢侈之活動予以課稅，以達到寓禁於徵之效果。然條文中還是將藝文活動跟夜總會、舞廳視為同一種活動，並且要課徵娛樂稅，顯然不合時宜，故刪除原條文第一項第一款、第三款、第四款，並刪除第二款前段，後做款次調整。\n二、另就高爾夫球雖屬體育項目，惟環保團體時有耗費環境資源之議，國際上亦有對其課徵類似特種消費稅之例，但就環境資源爭議而言，宜以綠色稅制改革，以對環境的影響規劃稅率，方為妥適，故仍應於尋得替代財源後、或於中華民國一百十五年一月一日起停止徵收。"},{"bill":"202110037300000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會各種表演。\n二、舞廳或舞場。\n三、高爾夫球場及其他提供娛樂設施供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、刪除原條文第一項第一款、第三款、第四款。\n二、修正原條文第二款，並調整款次順序。\n三、娛樂稅法於40年代為提倡戰時簡約所設，如今時過境遷，社會環境與立法理由已多有不合時宜。娛樂稅的課稅客體，諸如電影、歌唱、戲劇、舞蹈、音樂演奏、競技比賽等，多已普及至大眾不再是奢侈活動，部分更是國家政策積極推廣之藝文及體育產業。\n四、隨著娛樂型態轉變，實體課稅、虛擬免徵亦有違租稅公平原則。娛樂稅課徵標的實有調整必要，以使賦稅法規與時俱進。"},{"bill":"202110037310000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、其他娛樂場所、娛樂設施或娛樂活動，直轄市及縣（市）政府認定具奢侈性或政策節制必要者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、修正第一項：\n(一)鑒於娛樂稅原始課徵目的在於提高奢侈性消費成本，提倡節約風氣，而電影、歌唱、舞蹈、戲劇、音樂演奏等藝文產業，皆為文化部基於發展我國文化內容而扶植及補助的項目，與娛樂稅以抑制奢侈消費之徵收目的大異其趣，爰此刪除現行條文第一項第一款、第二款及第三款。\n(二)又查關於競技運動係為教育部體育運動政策白皮書推動之政策之一，透過鼓勵民眾觀看或參與各種競技比賽，提升我國體育運動水準，以及培養更多優秀體育運動人才，此亦與娛樂稅之課徵目的迥異，爰此刪除現行條文第一項第四款、及第六款高爾夫運動。\n(三)現行條文第二款\"夜總會之各種表演\"改列為修正條文第一款；現行條文第五款\"舞廳或舞場\"改列為修正條文第二款。\n(四)修正條文第三款係新增：配合修正條文第一款與第二款之修正，明定娛樂稅屬於特種消費稅性質，應以奢侈性及政策節制目的之活動為主。又根據財政收支劃分法娛樂稅屬於地方稅，則奢侈性或政策節制目的之娛樂則授予直轄市及縣（市）政府認定之。\n二、第二項未修正。"},{"bill":"202110043640000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、其他提供娛樂設施供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅","note":"一、「娛樂稅法」之原立法原旨具「寓禁於徵」之目的，然今日其所規定課徵之場所、設施或活動，現多已為民眾日常之娛樂休閒。於2004年監察院亦對高爾夫球為其課徵對象，對財政部提出糾正案。且於「文化藝術獎助及促進條例」中，亦將包含電影、音樂、視覺藝術與表演藝術等多項帶有娛樂與文化性質之活動，列為可申請減免娛樂稅之獎助與推廣對象。\n二、爰提案刪除本條文第一項第一款、第三款、第四款，及修正第二款、第六款相關文字，並將第五款改為第二款，及修正後之第二款與第六款，分別改為第一款與第三款後做款次調整。"},{"bill":"202110053890000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會各種表演。\n二、舞廳或舞場。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、刪除現行法條文第一項第一款、第三款、第四款及第六款。\n二、修正現行條文第二款，並調整款次順序。\n三、娛樂稅立法始意在於當年提倡生活簡約、工作勤奮思維，與現今社會經濟發展、促進文化、鼓勵正當休閒娛樂大相逕庭。現行法課稅標的，如電影、歌唱、戲劇、舞蹈、音樂演奏、競技比賽等，多已成為現代積極鼓勵民眾參與的文化、體育活動，邊課稅邊鼓勵，成為政策矛盾的典型案例。另如高爾夫球，往昔視為貴族活動予以課稅，但高爾夫亦為體育活動的一種，政策上亦同予鼓勵，課稅的不合理顯而易見。"},{"bill":"202110067880000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、修正第一項第六款之規定，將「其他提供娛樂設施供人娛樂者」，移列為第七款，並增訂娛樂場所及娛樂活動；另為使各直轄市及縣（市）政府之課稅項目一致，定明該款課稅項目應由財政部公告之。\n二、娛樂稅為地方自治重要財源，為確保地方政府財政自主並配合現今產業環境及消費行為之變化，增訂第三項，授權直轄市及縣（市）政府得依其需要，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅，並依納稅者權利保護法第六條第一項規定，定明實施期限並以達成合理之政策目的為限。又直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。"},{"bill":"201110067560000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、依財政收支劃分法第十二條第一項第六款及第五項規定，娛樂稅為直轄市及縣（市）稅，縣應以在鄉（鎮、市）徵起娛樂稅之收入全部給該鄉（鎮、市），以支應地方各項建設及公共服務。鑑於娛樂稅為地方自治重要財源，為保留地方政府財政自主空間，並配合經濟環境之變遷及娛樂消費行為之變化，兼顧地方政府視產業發展、政策需要及財政狀況，得停徵部分課稅項目娛樂稅之需求，爰增訂第三項，授權直轄市及縣（市）政府得視其產業發展、特定政策目的需要，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅，並應依納稅者權利保護法第六條第一項規定，定明實施期限並以達成合理之政策目的為限。又直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。\n二、第一項第六款所定「其他提供娛樂設施供人娛樂者」，移列為第七款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依第七款規定課稅之項目一致，定明該款課稅項目應由財政部公告之。\n三、第二項未修正。"},{"bill":"202110068350000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n第一項第一款至第四款規定課稅項目之娛樂稅，直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，定明停徵實施期限，並報財政部備查。","note":"一、依財政收支劃分法第十二條第一項第六款及第五項規定，娛樂稅為直轄市及縣（市）稅，縣應以在鄉（鎮、市）徵起娛樂稅之收入全部給該鄉（鎮、市），以支應地方各項建設及公共服務。\n二、文化藝術獎助及促進條例第三十一條規定，經認可之文化藝術事業，得減免營業稅及娛樂稅。考量本條第一項第一款至第四款與文化藝術事業活動有關，宜可授權地方政府，即直轄市及縣（市）政府得視產業發展、政策需要及財政狀況停徵上述部分課稅項目。\n三、現行第一項第六款後段其他提供娛樂設施供人娛樂者，移列第七款，並增訂娛樂場所及娛樂活動；為使各直轄市及縣（市）政府課稅之項目一致性，該款課稅項目應由財政部公告之。\n四、增訂第三項，授權直轄市及縣（市）政府得視其產業發展需要、特定政策目的，衡酌地方財政情形，就第一項第一款至第四款規定之課稅項目停徵娛樂稅，並依納稅者權利保護法規定，定明實施期限並以達成合理之政策目的為限。"},{"bill":"202110068360000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、鑒於娛樂稅原始課徵目的在於提高奢侈性消費成本，提倡節約風氣，而電影、歌唱、舞蹈、戲劇、音樂演奏等藝文產業，皆為文化部基於發展我國文化內容而扶植及補助的項目，與娛樂稅以抑制奢侈消費之徵收目的大異其趣，爰此刪除現行條文第一項第一款、第二款前段及第三款、第四款及第六款。\n二、現行第一項第六款後段其他提供娛樂設施供人娛樂者，移列第三款，並增訂娛樂場所及娛樂活動。\n三、第二項未修正。"},{"bill":"202110069080000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈、口頭演說之喜劇等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經直轄市及縣（市）議會通過，報財政部備查。","note":"一、依財政收支劃分法刪規定，娛樂稅為直轄市及縣（市）稅，以支應地方各項建設及公共服務。鑑於娛樂稅為地方自治重要財源，為保留地方政府財政自主空間並配合經濟環境之變遷及娛樂消費行為之變化，兼顧地方政府視產業發展、政策需要及財政狀況，得停徵部分課稅項目娛樂稅之需求，爰增訂第三項，授權直轄市及縣（市）政府得視其產業發展、特定政策目的需要，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅。\n二、目前脫口秀等相關產業於我國快速發展，然娛樂稅卻無相應稅法得以稽徵，致娛樂活動受到課稅卻無相關項目，故增列項目以為稅捐稽徵依據。\n三、第一項第六款所定「其他提供娛樂設施供人娛樂者」，移列為第七款，並增訂娛樂場所及娛樂，定明該項目經由財政部公告。"},{"bill":"202110069310000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款及第六款規定課稅項目之娛樂稅；其停徵應定明實施期限並以達成合理之政策目的為限，提經地方立法機關通過，並報財政部備查。","note":"一、高爾夫球早年雖被視為奢侈性活動，然而社會經濟環境變遷，現今早已視為一般休閒活動及運動，而非奢侈性娛樂行為，實無單獨對之課稅之理，爰參照本條96年修正時刪除撞球場、保齡球館之意，刪除第一項第六款之高爾夫球場。另其他娛樂設施部分，增訂娛樂場所及娛樂活動，且其項目應經財政部公告。\n二、增訂第三項，授權地方政府得視其政策目標、產業發展需求，於考量財務狀況後，得停徵第一項第一款至第四款及第六款規定項目之娛樂稅，其應明定實施期限，經地方立法機關通過，並報財政部備查。"},{"bill":"202110069980000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅；其停徵應定明實施期限並以達成合理之政策目的為限，提經當地民意機關通過，並報財政部備查。","note":"有鑑於財政部一百十三年七月十日邀集各地方政府及相關部會開會討論，地方政府均不同意廢除娛樂稅，絕大多數地方政府尚不反對授權其視產業發展、政策需要及財政狀況，得停徵部分課稅項目之娛樂稅，爰修正如下：\n(一)現行第一項第六款後段其他提供娛樂設施供人娛樂者，移列第七款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依第七款規定課稅之項目一致，定明該款課稅項目應由財政部公告。\n(二)增訂第三項，授權直轄市及縣（市）政府得視其產業發展需要、特定政策目的，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅。又直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。"},{"bill":"202110070300000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額達一定金額者徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n第一項娛樂稅起徵之票價或收費金額，由財政部定之。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、娛樂稅之前身為「筵席及娛樂稅」，查其立法目的係因過去政府財政困窘，為充裕國庫稅收，並提倡戰時簡約生活風氣，而制定《筵席及娛樂稅法》；另2007年修法時刪除撞球場及保齡球館，目的係考量撞球場已非青少年聚集滋事場所，且隨社會環境改變，其與保齡球館皆已成為一般性的休閒活動，因此認為不宜再課娛樂稅。由此觀之，娛樂稅過去課徵之目的係欲藉由寓禁於徵以抑制奢侈行為及特定不良社會風氣。\n二、惟考量時空背景及社會環境變遷，本法第二條第一項各款活動已難謂當然奢侈或不良。再者，政府不應對社會風氣之善惡進行價值判斷，亦不宜以此作為立法理由引導民間消費活動。然而，為落實量能課稅原則及促進社會公平分配，仍得以租稅手段加重高所得者財務負擔。故娛樂稅法應回歸其抑制奢侈、強化所得重分配之立法初衷，改以金額作為判斷是否課徵娛樂稅之依據較適當。爰修正娛樂稅法第二條第一項規定，明文票價或收費額達一定金額以上者始課徵娛樂稅。\n三、新增本條第三項規定，授權財政部得視市場發展情形訂定娛樂稅起徵之票價或收費金額。\n四、直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。"},{"bill":"202110071000000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、調整第一項各款之款次，並增列經財政部公告之娛樂場所活動等文字。\n二、給予地方政府權限，得視產業發展、政策需要停徵娛樂稅。"},{"bill":"202110072140000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、《娛樂稅法》之制定脈絡，始於第二次中日戰爭期間，為因應戰時需求以徵反奢，厲行節制奢侈浪費，乃創行「行為取締稅」，後為統一各地徵收標準，乃於1942年頒行「筵席及娛樂稅法」。據此可知，開徵此稅目的，極富時代特殊性。值此台灣文化產業、運動產業，力求變革以追趕全球市場之際，宜鼓勵國人消費，無另立課稅項目之正當性。爰將電影、戲劇、音樂、各種競技比賽等文化、運動相關部會扶植項目，排除於本法課稅範疇之外。\n二、原條文第一項第六款所定「其他提供娛樂設施供人娛樂者」，移列為第三款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依第三款規定課稅之項目一致，定明該款課稅項目應由財政部公告之。"},{"bill":"202110073130000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、修正調整原條文第一項第六款中「其他提供娛樂設施供人娛樂者」移列為第七款，並增加「娛樂場所及娛樂活動」等文字，以更具體涵蓋各種娛樂項目。此外，為確保各直轄市及縣（市）政府對第七款中涉及課稅的娛樂場所、設施、活動有一致性，明確規定相關課稅項目應由財政部公告，以提升規範的一致性與執行效益。\n二、娛樂稅為地方政府的重要財政來源之一，鑒於因應產業環境及消費行為的改變，並提升地方政府的財政自主權，增訂第三項條文，授權各直轄市及縣（市）政府根據產業發展與政策需求，考量地方財政狀況，對於第一項第一款至第四款規定的藝文活動或競技比賽之課稅項目可選擇停徵娛樂稅。停徵應依照《納稅者權利保護法》第六條第一項規定，定明實施期限並以達成合理之政策目的違憲。又直轄市及縣（市）政府停徵娛樂稅，應遵循《財政紀律法》第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。"},{"bill":"202110073230000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、依財政收支劃分法第十二條第一項第六款及第五項規定，娛樂稅為直轄市及縣（市）稅，縣應以在鄉（鎮、市）徵起娛樂稅之收入全部給該鄉（鎮、市），以支應地方各項建設及公共服務。鑑於娛樂稅為地方自治重要財源，為保留地方政府財政自主空間，並配合經濟環境之變遷及娛樂消費行為之變化，兼顧地方政府視產業發展、政策需要及財政狀況，得停徵部分課稅項目娛樂稅之需求，爰增訂第三項，授權直轄市及縣（市）政府得視其產業發展、特定政策目的需要，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅，並應依納稅者權利保護法第六條第一項規定，明定實施期限並以達成合理之政策目的為限。又直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。\n二、第一項第六款所定「其他提供娛樂設施供人娛樂者」，移列為第七款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依第七款規定課稅之項目一致，定明該款課稅項目應由財政部公告之。\n三、第二項未修正。"},{"bill":"202110073750000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n二、舞廳或舞場。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況等原因，停徵第一項第一款、第二款之規定課稅項目之娛樂稅；其停徵應定明實施期限並以達成合理之政策目的為限，提經當地民意機關通過，並報財政部備查。","note":"一、考量娛樂稅之徵收係基於我國戒嚴時期為避免人民耽溺娛樂「寓禁於徵」之立法，與我國當前社會風氣並不相符；又部分過去屬娛樂之項目如電影、戲劇、競技比賽、高爾夫球等，多有政府經費補助推廣，再徵收此部分之娛樂稅形同政府透過稅收娛樂稅之方式收為補助款，與政府扶植文化、運動產業之意旨不符，爰提案刪除。\n二、又增訂第三項授權直轄市、縣（市）政府得視各第之產業發展特性，衡酌地方財政狀況，就第一項第一、二款規定之娛樂活動課稅項目廷徵營業稅，並依納稅者權利保護法第六條第一項規定，定明實施期限並已達成合理之政策目的為限。又直轄市及縣市政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。"},{"bill":"202110077140000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、依財政收支劃分法第十二條第一項第六款及第五項規定，娛樂稅為直轄市及縣（市）稅，縣應以在鄉（鎮、市）徵起娛樂稅之收入全部給該鄉（鎮、市），以支應地方各項建設及公共服務。鑑於娛樂稅為地方自治重要財源，為保留地方政府財政自主空間，並配合經濟環境之變遷及娛樂消費行為之變化，兼顧地方政府視產業發展、政策需要及財政狀況，得停徵部分課稅項目娛樂稅之需求，爰增訂第三項，授權直轄市及縣（市）政府得視其產業發展、特定政策目的需要，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅，並應依納稅者權利保護法第六條第一項規定，定明實施期限並以達成合理之政策目的為限。又直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。\n二、第一項第六款所定「其他提供娛樂設施供人娛樂者」，移列為第七款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依第七款規定課稅之項目一致，定明該款課稅項目應由財政部公告之。\n三、第二項未修正。"},{"bill":"202110079180000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、其他娛樂場所、娛樂設施或娛樂活動，直轄市及縣（市）政府認定具奢侈性或政策節制必要者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、修正第一項：\n(一)電影、歌唱、舞蹈、戲劇、音樂演奏等藝文活動，現皆為文化部發展我國文化內容扶植及補助之項目，與娛樂稅抑制奢侈性消費風氣之政策節制之課徵目的相異，爰此刪除現行條文第一款、第二款及第三款。\n(二)各項競技運動及全民運動之推廣為我國重大政策發展方針，係為教育部體育運動政策白皮書推動之政策之一，為培養各項體育運動人才、提升我國競技運動之競爭力，爰刪除第四款。\n(三)又高爾夫球現既為亞奧運之運動項目之一，亦是國家重點發展運動，使其成為唯一需要課徵娛樂稅的運動項目，恐與政府推動全民運動之政策相違背，爰刪除第六款。\n(四)修正條文第三款係新增，配合修正條文第一款與第二款之修正。\n(五)修正條文第三款，娛樂稅屬特種消費稅，應以奢侈性及政策節制目的之活動為主。又《財政收支劃分法》娛樂稅屬地方稅，奢侈性或政策節制目的之娛樂則授予直轄市及縣（市）政府認定之。\n二、第二項未修正。"},{"bill":"202110079130000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款與第七款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、依財政收支劃分法第十二條第一項第六款及第五項規定，娛樂稅為直轄市及縣（市）稅，縣應以在鄉（鎮、市）徵起娛樂稅之收入全部給該鄉（鎮、市），以支應地方各項建設及公共服務。鑑於娛樂稅為地方自治重要財源，為保留地方政府財政自主空間，並配合經濟環境之變遷及娛樂消費行為之變化，兼顧地方政府視產業發展、政策需要及財政狀況，得停徵部分課稅項目娛樂稅之需求，爰增訂第三項，授權直轄市及縣（市）政府得視其產業發展、特定政策目的需要，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅，並應依納稅者權利保護法第六條第一項規定，定明實施期限並以達成合理之政策目的為限。又直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。\n二、第一項第六款所定「其他提供娛樂設施供人娛樂者」，移列為第七款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依第七款規定課稅之項目一致，定明該款課稅項目應由財政部公告之。\n三、第二項未修正。"},{"bill":"202110082130000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅；其停徵應定明實施期限並以達成合理之政策目的為限，並報財政部備查。","note":"一、現行第一項第六款後段其他提供娛樂設施供人娛樂者，移列第七款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依第七款規定課稅之項目一致，定明該款課稅項目應由財政部公告。\n二、鑑於娛樂稅為地方自治重要財源，為保留地方政府財政自主空間，並配合經濟環境之變遷及娛樂消費行為之變化，兼顧地方政府視產業發展、政策需要及財政狀況，得停徵部分課稅項目娛樂稅之需求，爰增訂第三項，授權直轄市及縣（市）政府得視其產業發展、特定政策目的需要，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅。"},{"bill":"202110098700000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項第一款至第四款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","note":"一、依財政收支劃分法第十二條第一項第六款及第五項規定，娛樂稅為直轄市及縣（市）稅，縣應以在鄉（鎮、市）徵起娛樂稅之收入全部給該鄉（鎮、市），以支應地方各項建設及公共服務。鑑於娛樂稅為地方自治重要財源，為保留地方政府財政自主空間，並配合經濟環境之變遷及娛樂消費行為之變化，兼顧地方政府視產業發展、政策需要及財政狀況，得停徵部分課稅項目娛樂稅之需求，爰增訂第三項，授權直轄市及縣（市）政府得視其產業發展、特定政策目的需要，衡酌地方財政情形，就第一項第一款至第四款規定之藝文活動或競技比賽課稅項目停徵娛樂稅，並應依納稅者權利保護法第六條第一項規定，定明實施期限並以達成合理之政策目的為限。又直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，併予敘明。\n二、第一項第六款所定「其他提供娛樂設施供人娛樂者」，移列為第七款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依第七款規定課稅之項目一致，定明該款課稅項目應由財政部公告之。\n三、第二項未修正。"},{"bill":"202110099050000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要、民眾需求及財政狀況，經當地民意機關通過後，定明第一項第一款至第四款及第六款規定課稅項目之娛樂稅之停徵施行期限，並報財政部備查。","note":"一、現行法令所規定課徵之場所、設施或活動，多已是民眾日常之娛樂休閒，非全然為奢侈或費用高之活動。包含高爾夫球運動，監察院也於2004年對其為課徵對象，對財政部提出糾正案。另於「文化藝術獎助及促進條例」中，亦將包含電影、音樂、視覺藝術與表演藝術等多項帶有娛樂與文化性質之活動，列為可申請減免娛樂稅之獎助與推廣對象。故為兼顧地方財政及民眾需求，亦應由直轄市及縣（市）政府，自行擬定需課徵之項目及細則。\n二、爰提案修正本條文第一項第六款部分文字，並新增第七款。\n三、新增第三項，授權直轄市及縣（市）政府，自行擬定需課徵之項目及細則。"},{"bill":"202110105230000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、夜總會之各種表演。\n二、舞廳或舞場。\n三、其他提供娛樂設施供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。","note":"一、電影、歌唱、舞蹈、馬戲、魔術、技藝表演皆為我國文化藝術產業重要發展項目，除文化部許多政策支持上述項目，我國亦有許多創作者及表演單位於國內外藝文競賽中屢屢獲獎。現行風氣顯已與娛樂稅抑制奢侈性消費風氣之政策節制之課徵目的相異，爰此刪除現行條文第一款、第二款及第三款。\n二、各項競技運動及全民運動之推廣為我國重大政策發展方針，係為教育部體育運動政策白皮書推動之政策之一，為培養各項體育運動人才、提升我國競技運動之競爭力，爰刪除第四款。\n三、高爾夫球現既為亞奧運之運動項目之一，亦是國家重點發展運動，時空背景環境已與早期截然不同，恐與政府推動全民運動之政策相違背，爰刪除第六款。"},{"bill":"202110181040000","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、電影。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演。\n四、各種競技比賽。\n五、舞廳或舞場。\n六、高爾夫球場。\n七、其他提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項各款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查。","note":"一、原第一項第六款所定「其他提供娛樂設施供人娛樂者」，移列為第七款，並增訂娛樂場所及娛樂活動。又為使各直轄市及縣（市）政府保有財政自主空間，而得配合娛樂消費行為變化，兼顧地方政府產業發展，直轄市及縣（市）政府得依地方稅法通則規定，因地制宜擬具第七款規定之課稅項目，併予敘明。\n二、鑑於娛樂稅為地方自治重要財源，爰增訂第三項，授權直轄市及縣（市）政府得視其產業發展、特定政策目的需要，衡酌地方財政情形，就各娛樂稅課稅項目停徵娛樂稅。又直轄市及縣（市）政府停徵娛樂稅，應依納稅者權利保護法第六條第一項、財政紀律法第五條第二項準用同條第一項及第六條第四項等規定辦理，自屬當然。"}],"changed":true,"final":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、舞廳或舞場。\n二、高爾夫球場。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項各款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。","finalWhy":"一、修正第一項：\n(一)娛樂稅自三十一年施行迄今，現行課稅項目允宜配合經濟社會環境改變予以檢討及調整，復為發展藝文活動及競技比賽，爰刪除原第一款至第四款，期使娛樂稅課稅項目趨於合理。\n(二)原第五款所定「舞廳或舞場」及第六款所定「高爾夫球場」，分別移為第一款及第二款。\n(三)原第六款所定「其他提供娛樂設施供人娛樂者」，移為第三款，並增訂娛樂場所及娛樂活動；又為使各直轄市及縣（市）政府依該款規定課稅之項目一致，定明該款課稅項目應由財政部公告之。\n二、依財政收支劃分法第十二條第一項第六款及第五項規定，娛樂稅為直轄市及縣（市）稅，縣應以在鄉（鎮、市）徵起娛樂稅之收入全部給該鄉（鎮、市），以支應地方各項建設及公共服務。為保留地方政府財政自主空間，並兼顧地方政府視產業發展、政策需要及財政狀況，爰增訂第三項，授權直轄市及縣（市）政府得就第一項各款規定之課稅項目停徵娛樂稅，並應依納稅者權利保護法第六條第一項規定，定明實施期限並以達成合理之政策目的為限。又直轄市及縣（市）政府停徵娛樂稅，應併依財政紀律法第五條第二項準用同條第一項及第六條第四項規定辦理，準此，經地方政府視轄內產業發展、政策需要及稽徵成本評估停徵部分娛樂稅課稅項目，其整體效益大於停徵項目之稅收，符合財政健全要求，無須中央政府彌補稅收損失，併予敘明。\n三、第二項未修正。","review":{"note":"照行政院提案修正通過","text":"娛樂稅，就下列娛樂場所、娛樂設施或娛樂活動所收票價或收費額徵收之：\n一、舞廳或舞場。\n二、高爾夫球場。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者。\n前項各種娛樂場所、娛樂設施或娛樂活動不售票券，另以其他飲料品或娛樂設施供應娛樂人者，按其收費額課徵娛樂稅。\n直轄市及縣（市）政府得視產業發展、政策需要及財政狀況，停徵第一項各款規定課稅項目之娛樂稅，提經當地民意機關通過，報財政部備查；其停徵應定明實施期限並以達成合理之政策目的為限。"}},{"no":"第四條","current":"凡合於左列規定之一者，免徵娛樂稅：\n一、教育、文化、公益、慈善機關、團體，合於民法總則公益社團或財團之組織，或依其他關係法令經向主管機關登記或立案者，所舉辦之各種娛樂，其全部收入作為本事業之用者。\n二、以全部收入，減除必要開支外，作為救災或勞軍用之各種娛樂。\n三、機關、團體、公私事業或學校及其他組織，對內舉辦之臨時性文康活動，不以任何方式收取費用者。\n前項第二款准予減除之必要開支，最高不得超過全部收入百分之二十。","versions":[{"bill":"202110053890000","text":"凡合於下列規定之一者，免徵娛樂稅：\n一、教育、文化、公益、慈善機關、團體，合於民法總則公益社團或財團之組織，或依其他關係法令經向主管機關登記或立案者，所舉辦之各種娛樂，其全部收入作為本事業之用者。\n二、以全部收入，減除必要開支外，作為救災、賑濟、勞軍及公益勸募用途之各種娛樂。\n三、機關、團體、公私事業或學校及其他組織，對內舉辦之臨時性文康活動。\n前項第二款准予減除之必要開支，最高不得超過全部收入百分之二十。","note":"一、現行法本條第二款之公益性質娛樂活動，僅限於救災或勞軍，公益性質之娛樂活動更應包括如賑濟及公益勸募用途之各種娛樂，爰予修正。\n二、現行法第三款，對於機關、團體、公私事業或學校及其他組織，內部舉辦之臨時性文康活動，限於不以任何方式收取費用者，始得免徵娛樂稅，此與修正案鼓勵正當娛樂活動意旨相違，爰均列為免徵娛樂稅範圍。"},{"bill":"202110069310000","text":"凡合於下列規定之一者，免徵娛樂稅：\n一、教育、文化、公益、慈善機關、團體，合於民法總則公益社團或財團之組織，或依其他關係法令經向主管機關登記或立案者，所舉辦之各種娛樂，其全部收入作為本事業之用者。\n二、以全部收入，減除必要開支外，作為救災或勞軍用之各種娛樂。\n三、機關、團體、公私事業或學校及其他組織，對內舉辦之臨時性文康活動。\n前項第二款准予減除之必要開支，最高不得超過全部收入百分之二十。","note":"因社會經濟環境變遷，政府政策目標早已從提倡簡約、遏制娛樂活動，轉為提倡文康活動、寓教於樂，第一項第三款對於對內舉辦之臨時姓文康活動規定「不以任何方式收取費用者」為限，始得免徵娛樂稅，要件顯然過苛，不符鼓勵正當娛樂之精神，爰刪除其限制。"}],"changed":false,"final":"凡合於左列規定之一者，免徵娛樂稅：\n一、教育、文化、公益、慈善機關、團體，合於民法總則公益社團或財團之組織，或依其他關係法令經向主管機關登記或立案者，所舉辦之各種娛樂，其全部收入作為本事業之用者。\n二、以全部收入，減除必要開支外，作為救災或勞軍用之各種娛樂。\n三、機關、團體、公私事業或學校及其他組織，對內舉辦之臨時性文康活動，不以任何方式收取費用者。\n前項第二款准予減除之必要開支，最高不得超過全部收入百分之二十。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第五條","current":"娛樂稅，照所收票價或收費額，依左列稅率計徵之：\n一、電影，最高不得超過百分之六十。本國語言片最高不得超過百分之三十。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之三十。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之五。\n四、各種競技比賽，最高不得超過百分之十。\n五、舞廳或舞場，最高不得超過百分之一百。\n六、撞球場，最高不得超過百分之五十；保齡球館，最高不得超過百分之三十；高爾夫球場，最高不得超過百分之二十；其他提供娛樂設施供人娛樂者，最高不得超過百分之五十。","versions":[{"bill":"202110012080000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、舞廳或舞場，最高不得超過百分之一百。\n二、夜總會之各種表演，最高不得超過百分之三十。\n三、其他提供娛樂設施供人娛樂者，最高不得超過百分之五十。","note":"一、配合第二條修正，將本條第一項第一、三、四款刪除，第六款中的撞球場、保齡球館、高爾夫球場刪除，第二款保留夜總會，並將第五、六款改為第一、三款。\n二、由於修正後將停止向部分租稅客體徵稅，遂將其稅率廢除。"},{"bill":"202110012940000","text":"娛樂稅，照所收票價或收費額，依左列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之三十。\n二、舞廳或舞場，最高不得超過百分之一百。\n三、其他提供娛樂設施供人娛樂者，最高不得超過百分之五十。","note":"配合修正條文第二條，將免於課徵娛樂稅之項目稅率一併刪除。"},{"bill":"202110016590000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之三十。\n二、舞廳或舞場，最高不得超過百分之一百。\n三、其他提供娛樂設施供人娛樂者，最高不得超過百分之五十。","note":"刪除原條文第一項第一、三、四款，並刪除第二、六款前段，後做款次調整。"},{"bill":"202110029180000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之三十。\n二、舞廳或舞場，最高不得超過百分之一百。\n三、高爾夫球場，最高不得超過百分之二十。\n四、其他提供娛樂設施供人娛樂者，最高不得超過百分之五十。","note":"刪除原條文第一項第一款、第三款、第四款，並刪除第二款前段，後做款次調整。"},{"bill":"202110037300000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之三十。\n二、舞廳或舞場，最高不得超過百分之一百。\n三、高爾夫球場，最高不得超過百分之二十；其他提供娛樂設施供人娛樂者，最高不得超過百分之五十。","note":"配合第二條修正，保留夜總會表演、舞廳、舞場及高爾夫球場之稅率，並將款次修正。"},{"bill":"202110037310000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之三十。\n二、舞廳或舞場，最高不得超過百分之一百。\n三、其他娛樂場所、娛樂設施或娛樂活動，經直轄市及縣（市）政府認定具奢侈性或政策節制必要者，其稅率由該直轄市及縣（市）政府定之。","note":"配合修正條文第二條作修正：\n(一)刪除現行條文第一款、第二款前段、第三款、第四款及第六款。\n(二)現行條文第二款後段改列修正條文第一款；現行條文第五款改列修正條文第二款，文字均未修正。\n(三)修正條文第三款係新增，理由同修正條文第二條。"},{"bill":"202110043640000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之三十。\n二、舞廳或舞場，最高不得超過百分之一百。\n三、其他提供娛樂設施供人娛樂者，最高不得超過百分之五十。","note":"一、對應第二條之修正。\n二、爰提案刪除本條文第一款、第三款、第四款，並修正第二款與第六款之部分文字，並將第五款改為第二款，及修正後之第二款與第六款，分別改為第一款與第三款。"},{"bill":"202110053890000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之三十。\n二、舞廳或舞場，最高不得超過百分之一百。","note":"配合第二條修正，修正本條課稅稅率規定。"},{"bill":"202110067880000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合法制體例，序文酌作文字修正。\n二、配合修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正各款稅率。"},{"bill":"201110067560000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合法制體例，序文酌作文字修正。\n二、配合修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正各款稅率如下：\n(一)第一款刪除「本國語言片最高不得超過百分之三十」之規定，並將稅率調降為最高不得超過百分之十五。\n(二)第二款至第五款規定稅率分別調降為最高不得超過百分之十五、百分之二、百分之五及百分之五十。\n(三)第六款規定之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n(四)第六款後段其他提供娛樂設施供人娛樂者，移列為第七款，並配合修正條文第二條第一項第七款作文字修正；稅率並調降為最高不得超過百分之二十五。"},{"bill":"202110068350000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十。本國語言片最高不得超過百分之五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之三十。","note":"一、配合法制體例，序文酌作文字修正。\n二、財政部一百十二年公告目前各縣市現行對娛樂稅徵收率介於千分之五至百分之二十五區間，地方政府自行訂定，顯示本條文相關範圍項目及課徵稅率有偏高情形，應參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，酌予修正本項各款部分課稅項目稅率。\n四、第六款規定前段之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n五、第六款後段其他提供娛樂設施供人娛樂者，移列第七款，並配合修正條文第二條第一項第七款作文字修正，稅率並調降為最高不得超過百分之三十。"},{"bill":"202110068360000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之十五。\n二、舞廳或舞場，最高不得超過百分之五十。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合修正條文第二條，修正各款稅率如下：\n(一)刪除現行條文第一款、第二款前段、第三款、第四款及第六款。\n(二)現行條文第二款後段改列修正條文第一款；現行條文第五款改列修正條文第二款，並將稅率調降為最高不得超過百分之十五及百分之五十。\n(三)現行第六款後段其他提供娛樂設施供人娛樂者，移列第三款，並配合修正條文第二條第一項第三款作文字修正，稅率並調降為最高不得超過百分之二十五。"},{"bill":"202110069310000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十。","note":"一、撞球場、保齡球館已非現行娛樂稅課徵項目，另配合修正第二條刪除高爾夫球場，爰刪除第六款前段稅率規定，後段配合第二條規定為文字修正，並調降其最高稅率為百分之二十。\n二、有鑑於時空背景不同，娛樂稅稅率上限規定早已不合時宜，參酌當前地方政府所定娛樂稅課徵率，調降各款稅率上限"},{"bill":"202110069980000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之二十。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之二十。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之五。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正各款稅率如下：\n(一)第一款刪除現行「本國語言片最高不得超過百分之三十」之規定，並將稅率調降為最高不得超過百分之二十。\n(二)第二款、第四款、第五款規定稅率分別調降為最高不得超過百分之二十、百分之五、百分之五十。\n(三)現行第六款規定之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n(四)現行第六款後段其他提供娛樂設施供人娛樂者，移列第七款，並配合修正條文第二條第一項第七款作文字修正，稅率並調降為最高不得超過百分之二十五。"},{"bill":"202110070300000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之三十。本國語言片最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之五十。","note":"一、為符合條文架構，爰對本條第一項作文字修正。\n二、鑒於撞球場、保齡球館已不再課徵娛樂稅，並配合本法第二條之修正，爰刪除本條第六款關於撞球場、保齡球館之規定，僅保留高爾夫球場，並將其他娛樂設施移列至第七款。\n三、配合修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率。"},{"bill":"202110071000000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"為鼓勵文化、運動等產業之發展，爰將娛樂稅之最高稅率予以調降。"},{"bill":"202110072140000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之十五。\n二、舞廳或舞場，最高不得超過百分之五十。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合修正條文第二條，刪除第一項第一款、第二款前段、第三款、第四款、第六款。\n二、配合修正條文第二條，修正各款稅率如下：現行條文第二款刪除前段後，移列修正條文第一款，並調整稅率為最高不得超過百分之十五；現行條文第五款，移列修正條文第二款，並調整稅率為最高不得超過百分之五十。\n三、配合修正條文第二條，本條第一項第三款為文字修正，並調整稅率為最高不得超過百分之二十五。"},{"bill":"202110073130000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之二。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合法制體例，序文酌作文字修正。\n二、配合修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正各款稅率，以增進文化、娛樂、運動產業之發展。"},{"bill":"202110073230000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之三。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合法制體例，序文酌作文字修正。\n二、配合修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正各款稅率如下：\n(一)第一款刪除「本國語言片最高不得超過百分之三十」之規定，並將稅率調降為最高不得超過百分之十五。\n(二)第二款至第五款規定稅率分別調降為最高不得超過百分之十五、百分之二、百分之三及百分之五十。\n(三)第六款規定之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n(四)第六款後段其他提供娛樂設施供人娛樂者，移列為第七款，並配合修正條文第二條第一項第七款作文字修正；稅率並調降為最高不得超過百分之二十五。"},{"bill":"202110073750000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十。\n二、舞廳或舞場，最高不得超過百分之五十。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之十。","note":"一、配合法治體例，於序文酌作修正。\n二、配合第二條第一項各款娛樂稅項目之調整，酌作稅率之修正如修正條文。"},{"bill":"202110077140000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合法制體例，序文酌作文字修正。\n二、配合修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正各款稅率如下：\n(一)第一款刪除「本國語言片最高不得超過百分之三十」之規定，並將稅率調降為最高不得超過百分之十五。\n(二)第二款至第五款規定稅率分別調降為最高不得超過百分之十五、百分之二、百分之五及百分之五十。\n(三)第六款規定之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n(四)第六款後段其他提供娛樂設施供人娛樂者，移列為第七款，並配合修正條文第二條第一項第七款作文字修正；稅率並調降為最高不得超過百分之二十五。"},{"bill":"202110079180000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之三十。\n二、舞廳或舞場，最高不得超過百分之一百。\n三、其他娛樂場所、娛樂設施或娛樂活動，直轄市及縣（市）政府認定具奢侈性或政策節制必要者，其稅率由該直轄縣市及縣（市）政府定之。","note":"配合修正條文第二條修正：\n一、刪除現行條文第一款、第二款前段、第三款、第四款及第六款。\n二、現行條文第二款後段改列修正條文第一款；現行條文第五款改列修正條文第二款，文字均未修正。\n三、修正條文新增第三款，理由同修正條文第二條。"},{"bill":"202110079130000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合法制體例，序文酌作文字修正。\n二、配合修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正各款稅率如下：\n(一)第一款刪除「本國語言片最高不得超過百分之三十」之規定，並將稅率調降為最高不得超過百分之十五。\n(二)第二款至第五款規定稅率分別調降為最高不得超過百分之十五、百分之二、百分之五及百分之五十。\n(三)第六款規定之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n(四)第六款後段其他提供娛樂設施供人娛樂者，移列為第七款，並配合修正條文第二條第一項第七款作文字修正；稅率並調降為最高不得超過百分之二十五。"},{"bill":"202110082130000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之二十。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之二十。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之五。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"參酌現行地方政府規定之徵收率，並鼓勵參與藝文活動及競技比賽，調降課稅項目之法定稅率上限，修正各款稅率如下：\n(一)第一款刪除現行「本國語言片最高不得超過百分之三十」之規定，並將稅率調降為最高不得超過百分之二十。\n(二)第二款、第四款、第五款規定稅率分別調降為最高不得超過百分之二十、百分之五、百分之五十。\n(三)現行第六款規定之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n(四)現行第六款後段其他提供娛樂設施供人娛樂者，移列第七款，並配合修正條文第二條第一項第七款作文字修正，稅率並調降為最高不得超過百分之二十五。"},{"bill":"202110098700000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之十五。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n四、各種競技比賽，最高不得超過百分之五。\n五、舞廳或舞場，最高不得超過百分之五十。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、配合法制體例，序文酌作文字修正。\n二、配合修正條文第二條第一項規定課稅項目，並參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正各款稅率如下：\n(一)第一款刪除「本國語言片最高不得超過百分之三十」之規定，並將稅率調降為最高不得超過百分之十五。\n(二)第二款至第五款規定稅率分別調降為最高不得超過百分之十五、百分之二、百分之五及百分之五十。\n(三)第六款規定之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n(四)第六款後段其他提供娛樂設施供人娛樂者，移列為第七款，並配合修正條文第二條第一項第七款作文字修正；稅率並調降為最高不得超過百分之二十五。"},{"bill":"202110099050000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之十。本國語言片最高不得超過百分之五。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演，最高不得超過百分之十。\n三、夜總會之各種表演，最高不得超過百分之二十。\n四、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之二。\n五、各種競技比賽，最高不得超過百分之五。\n六、舞廳或舞場，最高不得超過百分之五十。\n七、高爾夫球場，最高不得超過百分之十五。\n八、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","note":"一、調整相關項目之娛樂稅額，爰提案修正本條第一款、第二款　部分文字\n二、將原第二款部分文字，移列為第三款。\n三、原第四款、第五款及第六款，移列為第五款、第六款及第七款，並修正部分文字。\n四、將原第六款後段文字，移新增為第八款"},{"bill":"202110105230000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、夜總會之各種表演，最高不得超過百分之十五。\n二、舞廳或舞場，最高不得超過百分之五十。\n三、其他提供娛樂設施供人娛樂者，最高不得超過百分之二十五。","note":"一、配合修正條文第二條，將免於課徵娛樂稅之項目稅率一併刪除。\n二、修正本條各款稅率。"},{"bill":"202110181040000","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、電影，最高不得超過百分之六十。本國語言片最高不得超過百分之三十。\n二、職業性歌唱、說書、舞蹈、馬戲、魔術、技藝表演及夜總會之各種表演，最高不得超過百分之三十。\n三、戲劇、音樂演奏及非職業性歌唱、舞蹈等表演，最高不得超過百分之五。\n四、各種競技比賽，最高不得超過百分之十。\n五、舞廳或舞場，最高不得超過百分之一百。\n六、高爾夫球場，最高不得超過百分之二十。\n七、其他提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之五十。","note":"一、配合法制體例，序文酌作文字修正。\n二、配合修正條文第二條第一項規定課稅項目，因原第六款規定之撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。原第六款後段其他提供娛樂設施供人娛樂者，則移列至第七款，並配合修正條文第二條第一項第七款修正文字。"}],"changed":true,"final":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、舞廳或舞場，最高不得超過百分之五十。\n二、高爾夫球場，最高不得超過百分之二十。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。","finalWhy":"一、配合法制體例，序文酌作文字修正。\n二、鑑於修正條文第二條第一項業刪除原第一款至第四款課稅項目，原第一款至第四款法定稅率上限稅率已無訂定必要，爰配合刪除。另參酌現行直轄市及縣（市）政府所定娛樂稅徵收率，修正如下：\n(一)原第五款移為第一款，稅率調降為最高不得超過百分之五十。\n(二)原第六款移為第二款，撞球場及保齡球館已非現行娛樂稅課徵項目，爰刪除其稅率之規定。\n(三)原第六款後段所定其他提供娛樂設施供人娛樂者，移為第三款，並配合修正條文第二條第一項第三款酌作文字修正；稅率並調降為最高不得超過百分之二十五。","review":{"note":"照行政案提案修正通過","text":"娛樂稅，照所收票價或收費額，依下列稅率計徵之：\n一、舞廳或舞場，最高不得超過百分之五十。\n二、高爾夫球場，最高不得超過百分之二十。\n三、其他經財政部公告屬提供娛樂場所、娛樂設施或娛樂活動供人娛樂者，最高不得超過百分之二十五。"}},{"no":"第六條","current":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經直轄市及縣（市）民意機關通過，報請或層轉財政部核備。","versions":[{"bill":"202110037310000","text":"直轄市及縣（市）政府得視地方實際情形及前條規定娛樂稅徵收率或予以停徵，提經直轄市及縣（市）民意機關通過，報請或層轉財政部核備。","note":"配合修正條文第二條及第五條之修正，蓋根據財政收支劃分法第十二條規定娛樂稅屬於地方稅，本應授予地方政府較多權限，且本條文規定地方政府規定稅率後，尚須民意機關通過及報請財政部核備，對民眾之財產權已具相當把關機制；另外，娛樂稅率僅訂有上限並無下限，地方若定稅率為零等於停徵，綜上增列「或予以停徵」等字，以符實際。"},{"bill":"202110067880000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報請或層轉財政部備查。","note":"配合地方制度法第二條第五款之規定，酌做文字修正。"},{"bill":"201110067560000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110068360000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110069310000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經地方立法機關通過，報請財政部核備。","note":"參照地方制度法用詞，酌為文字修正。"},{"bill":"202110069980000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"依據地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110070300000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法規定用詞及現行備查程序，作文字修正。爰修正本條。"},{"bill":"202110071000000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報請或層轉財政部備查。","note":"將地方政府規定稅率之程序由核備改為備查。"},{"bill":"202110072140000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合《地方制度法》第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110073130000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定，並符合現行的備查程序，將地方政府規定娛樂稅稅率的程序由「核備」改為「備查」。"},{"bill":"202110073230000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110073750000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110077140000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110079180000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，規定娛樂稅徵收率，或予以停徵，提經直轄市及縣（市）民意機關通過，報財政部備查。","note":"一、根據《財政收支劃分法》第十二條規定娛樂稅屬於地方稅，其課徵範圍理應賦予地方政府一定權限，又娛樂稅率僅訂有上限並無下限，地方若定稅率為零等於停徵，綜上增列「或予以停徵」等字，以符實際。\n二、配合《地方制度法》第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110079130000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110082130000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"依據地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110098700000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110099050000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過後，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞，爰修正部分文字。"},{"bill":"202110105230000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"},{"bill":"202110181040000","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","note":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。"}],"changed":true,"final":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。","finalWhy":"配合地方制度法第二條第五款規定用詞及現行備查程序，酌作文字修正。","review":{"note":"照行政院提案通過","text":"直轄市及縣（市）政府得視地方實際情形，在前條規定稅率範圍內，分別規定娛樂稅徵收率，提經當地民意機關通過，報財政部備查。"}},{"no":"第八條","current":"凡臨時舉辦娛樂活動，對外售票、收取費用者，應於舉辦前向主管稽徵機關辦理登記及娛樂稅徵免手續。\n臨時舉辦之娛樂活動不以任何方式收取費用者，應於舉辦前向主管稽徵機關報備。","versions":[{"bill":"202110053890000","text":"（刪除）","note":"一、本條刪除。\n二、配合修正現行法第四條第三款，機關、團體、公私事業或學校及其他組織，內部舉辦之臨時性文康活動，均列為免徵娛樂稅範圍，本條已無適用餘地，爰予刪除。"}],"changed":false,"final":"凡臨時舉辦娛樂活動，對外售票、收取費用者，應於舉辦前向主管稽徵機關辦理登記及娛樂稅徵免手續。\n臨時舉辦之娛樂活動不以任何方式收取費用者，應於舉辦前向主管稽徵機關報備。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第九條","current":"娛樂稅代徵人每月代徵之稅款，應於次月十日前填用自動報繳書繳納。但經營方式特殊或營業規模狹小經主管稽徵機關查定課徵者，由稽徵機關填發繳款書，限於送達後十日內繳納。\n臨時舉辦之有價娛樂活動，主管稽徵機關應每五天核算代徵稅款一次，並填發繳款書，限於送達後十日內繳納。","versions":[{"bill":"202110053890000","text":"娛樂稅代徵人每月代徵之稅款，應於次月十日前填用自動報繳書繳納。但經營方式特殊或營業規模狹小經主管稽徵機關查定課徵者，由稽徵機關填發繳款書，限於送達後十日內繳納。","note":"配合第四條之修正予以修正。"}],"changed":false,"final":"娛樂稅代徵人每月代徵之稅款，應於次月十日前填用自動報繳書繳納。但經營方式特殊或營業規模狹小經主管稽徵機關查定課徵者，由稽徵機關填發繳款書，限於送達後十日內繳納。\n臨時舉辦之有價娛樂活動，主管稽徵機關應每五天核算代徵稅款一次，並填發繳款書，限於送達後十日內繳納。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第十條","current":"娛樂稅代徵人應於代徵時發給娛樂票作為憑證，並於娛樂人持用入場時撕斷，否則以不為代徵論處。但依第九條第一項但書規定查定課徵者，得免用娛樂票。\n前項娛樂票，由主管稽徵機關統一印製編號驗印者，按照工本費發售各娛樂業使用。但臨時舉辦之娛樂活動售票者，應由負責人於舉辦前將票編號，標明價格，申請主管稽徵機關驗印，並辦妥納稅保證手續，如期報繳代徵稅款。","versions":[{"bill":"201110067560000","text":"娛樂稅代徵人應於代徵時發給娛樂票作為憑證，並於娛樂人持用入場時撕斷，否則以不為代徵論處。但依第九條第一項但書規定查定課徵者，得免用娛樂票。\n前項娛樂票，由主管稽徵機關核驗後使用。但臨時舉辦之娛樂活動售票者，應由負責人於舉辦前將票編號，標明價格，申請主管稽徵機關驗印，並辦妥納稅保證手續，如期報繳代徵稅款。","note":"一、第一項未修正。\n二、現行地方稅稽徵機關已無印製娛樂票發售各娛樂業使用，爰修正第二項文字。"},{"bill":"202110068350000","te function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增

  const lines = base ? diffLines(base, text) : null;

}

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;

    cur = (i + hits.length) % hits.length;

    prev.hidden = next.hidden = !hits.length;

    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
