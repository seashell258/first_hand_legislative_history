<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貨物稅條例 2024 年修正歷程（復康巴士免稅延長）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

s://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/06/LCEWA01_110206_00229.pdf","proposers":["陳菁徽","羅廷瑋","廖偉翔"],"ncosign":13,"people":[["陳菁徽","國民黨","提案"],["羅廷瑋","國民黨","提案"],["廖偉翔","國民黨","提案"],["楊瓊瓔","國民黨","連署"],["盧縣一","國民黨","連署"],["林思銘","國民黨","連署"],["廖先翔","國民黨","連署"],["林沛祥","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["黃建賓","國民黨","連署"],["顏寬恒","國民黨","連署"],["牛煦庭","國民黨","連署"],["鄭正鈐","國民黨","連署"],["陳雪生","國民黨","連署"],["魯明哲","國民黨","連署"],["柯志恩","國民黨","連署"]],"party":[["國民黨",16]],"reason":"本院委員陳菁徽、羅廷瑋、廖偉翔等16人，鑑於現行《貨物稅條例》有關復康巴士、載運輪椅車輛免徵貨物稅的政策，將在今（113）年底落日。「社會福利國」為我國憲法核心價值，政府應扶助並照顧經濟上弱勢之人民，而《身心障礙者權利公約》也要求締約國「應確保身心障礙者在與其他人平等基礎上，無障礙地進出物理環境，使用交通工具」，復康巴士免徵貨物稅推行以來，載運輪椅使用者之車輛顯著提升，良善、對民眾有利的政策就應該被延續，為了持續強化無障礙運輸服務，建構更友善的乘車環境，爰擬具「貨物稅條例第十二條條文修正草案」，將身心障礙者復康巴士免徵貨物稅之期限延長至民國118年12月31日止。是否有當？敬請公決。","arts":["第十二條"]},{"id":"202110073720000","who":"委員賴惠員等18人","date":"2024-11-01","name":"「貨物稅條例第十二條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110073720000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/07/LCEWA01_110207_00057.pdf","proposers":["賴惠員","林月琴"],"ncosign":16,"people":[["賴惠員","民進黨","提案"],["林月琴","民進黨","提案"],["陳亭妃","民進黨","連署"],["邱志偉","民進黨","連署"],["王美惠","民進黨","連署"],["蔡易餘","民進黨","連署"],["郭昱晴","民進黨","連署"],["吳秉叡","民進黨","連署"],["陳培瑜","民進黨","連署"],["黃捷","民進黨","連署"],["吳思瑤","民進黨","連署"],["王正旭","民進黨","連署"],["沈發惠","民進黨","連署"],["賴瑞隆","民進黨","連署"],["鍾佳濱","民進黨","連署"],["吳琪銘","民進黨","連署"],["林俊憲","民進黨","連署"],["陳秀寳","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員賴惠員、林月琴等18人，鑑於政府已將兩公約及身心障礙者權利公約納入我國內國法、且我國憲法增修條文亦將身心障礙者權益促進納入重要基本國策，故研擬延長業者、民眾購置低底盤公車、復康巴士等有利障礙者使用之交通運輸工具免稅優惠。又鑑於政府為達成2050淨零碳排之目標，持續鼓勵民眾搭乘大眾運輸工具、及大眾運輸工具改採用純電動車或油電混和車以達節能減碳之政策目的。故研擬針對上述兩類車輛免徵貨物稅優惠期限，由現行之民國113年12月31日延長7年至民國120年12月31日，以促成身障者權益保障及能源轉型的目標，爰擬具「貨物稅條例第十二條條文修正草案」。是否有當？敬請公決。","arts":["第十二條"]},{"id":"201110074550000","who":"行政院","date":"2024-11-01","name":"「貨物稅條例第十二條條文修正草案」案。","url":"https://ppg.ly.gov.tw/ppg/bills/201110074550000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/07/LCEWA01_110207_00132.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"行政院函請審議「貨物稅條例第十二條條文修正草案」案。","arts":["第十二條"]}],"arts":[{"no":"第十二條","current":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤及車身、牽引車及拖車均屬之。\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之。\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。但自中華民國一百零三年六月五日起至一百十三年十二月三十一日止購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車、電動公共汽車、身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之標準者為限。\n自中華民國一百零四年二月六日起至一百十三年十二月三十一日止購買符合載運輪椅使用者車輛規定安全檢測基準之車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","versions":[{"bill":"202110029080000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤及車身、牽引車及拖車均屬之。\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之。\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。但自中華民國一百零三年六月五日起至一百十九年十二月三十一日止購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車、電動公共汽車、身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之標準者為限。\n自中華民國一百零四年二月六日起至一百十三年十二月三十一日止購買符合載運輪椅使用者車輛規定安全檢測基準之車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、為建構無障礙友善乘車環境，照顧行動不便者行的需求，促進大眾運輸利用效能，同時配合行政院2030年客運車輛電動化推動計畫，協助國內客運車輛電動化，打造綠色公共運輸環境；爰修正條文，以提供業者汰換老舊車輛時，優先選購無障礙化、電動化車輛的誘因。\n二、為延長購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車、電動公共汽車、身心障礙者復康巴士並完成新領牌照登記者免徵貨物稅期限至一百十九年十二月三十一日止；爰提案修正「貨物稅條例第十二條」第一項第一款第二目但書規定。"},{"bill":"202110044750000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤及車身、牽引車及拖車均屬之。\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之。\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。但自中華民國一百零三年六月五日起至一百十九年十二月三十一日止購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車、電動公共汽車、氫能公共汽車、身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之標準者為限。\n自中華民國一百零四年二月六日起至一百十九年十二月三十一日止購買符合載運輪椅使用者車輛規定安全檢測基準之車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。\n自本條文生效日起五年內，報廢出廠十五年以上之大客車，於報廢前、後六個月內購買新大客車且完成新領牌照登記者，該新大客車免徵貨物稅。\n前項免徵年限屆期前半年，行政院得視實際推展情況決定是否延長免徵年限。","note":"一、有鑑於行政院已於112年核定「2030年客運車輛電動化推動計畫（113年至119年）」，預計7年期程總計編列六百四十三億元經費，除補助客運業者購車，亦納入建置維修保養體系、載客營運補助及路網優化等配套經費，盼降低客運業者購車負擔外，並在維修及營運上提供業者更多協助。\n二、惟查有關各類公共汽車及無障礙車輛之貨物稅免徵優惠，將於一百十三年底屆期，爰以2030年客運車輛電動化目標，將優惠期限延至一百十九年底，並新增氫能公共汽車免貨物稅，以推廣非石化能源車輛。\n三、另有鑑於老舊遊覽車重大事故頻傳，為鼓勵加速汰換，維繫國人生命安全及觀光品質，爰依據《納稅者權利保護法》第六條第一項規定，增訂本條第七項規定，明定自本條文生效日起，實施免徵大客車貨物稅五年。並增訂第八項規定，授權行政院得視實際推展情況決定是否延長免徵年限。"},{"bill":"202110068130000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤及車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)自中華民國一百零三年六月五日起至一百二十一年十二月三十一日止購買身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車，免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之標準者為限。\n自中華民國一百零四年二月六日起至一百二十一年十二月三十一日止購買符合載運輪椅使用者車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、交通部與環境部刻正在推動「二○三○年客運車輛電動化推動計畫」，以達成「臺灣二○五○淨零排放路徑及策略」之目標，鼓勵客運業者汰換購買電動大客車，由於目前的電動公共汽車已具提供低底盤無障礙運輸服務，所以，原第一項第二款規定之低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車已無繼續免徵貨物稅之必要，另電動公共汽車現行第十二條之三已有規範，爰併刪除。\n二、考量我國將邁入超高齡社會，身心障礙者人數逐年漸增至一百十二年已達一百二十一萬餘人，超過總人口比例百分五，為落實建構無障礙友善乘車環境及照顧身心障礙者之政策目標，對購買身心障礙者復康巴士免徵貨物稅期限延長至一百二十一年十二月三十一日止。\n三、為落實建構無障礙友善乘車環境，促進身心障礙者及行動不便者之自立生活，照顧渠等行的需求，爰修正第五項，將購買符合載運輪椅使用者車輛免徵貨物稅期限延長至一百二十一年十二月三十一日止。另車輛安全檢測基準規範事項及內容，已修正發布車輛型式安全審驗管理辦法第十四條，並廢止車輛安全檢測基準，且「載運輪椅使用者車輛」之定義已定明於貨物稅稽徵規則第七條第五項，爰酌修正。"},{"bill":"202110067740000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤與車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車、電動公共汽車、身心障礙者復康巴士並完成新領牌照登記者，自中華民國一百零三年六月五日起至一百十八年十二月三十一日止，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車，免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之標準者為限。\n自中華民國一百零四年二月六日起至一百十八年十二月三十一日止購買載運輪椅使用者之車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、修正第一項：\n(一)第一款序文、第一款第一目序文、第三款，略作文字及標點符號修正。\n(二)第一款第二目之但書移列至第三目，其餘文字未修正。\n(三)增訂第一款第三目，係由前目但書所移列，並將「購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車、電動公共汽車、身心障礙者復康巴士」之免徵貨物稅期間自中華民國103年6月5日起至113年12月31日止，延長至119年12月31日止：蓋購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車、電動公共汽車、身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅規定，即將於今年年底（113.12.21）到期，然而當前電動公車占比未到20%，中央及地方政府仍持續執行『2030年市區公車全面電動化』計畫，是以該免徵貨物稅期間理應配合政府推動零碳排政策期程，適時延長之。\n另外，我國即將邁入超高齡社會，而根據衛生福利部最近統計，截至中華民國111年12月底止全國復康巴士有2,257輛，而須使用復康巴士協助交通接送之中度以上肢體障礙者（乘坐輪椅者）有17萬3,699人，復康巴士之需求仍大，為建構無障礙友善乘車環境，仍需繼續透過免徵復康巴士貨物稅之政策引導，使各縣市政府及社會福利團體機構等單位，可以較優惠之價格購得復康巴士，提高復康巴士營運單位購買或民眾捐贈意願，爰此延長無障礙巴士免徵貨物稅亦有其必要，而增訂第三目。\n二、修正第五項：配合修正條文第一項增訂第三目，將身心障礙者復康巴士減免貨物稅期間延長至119年12月31日，針對如無障礙計程車等之「購買載運輪椅使用者之車輛，且完成新領牌照登記者」情況，其免徵期間亦應一同調整，使兩者一致：蓋根據交通部公路局最近統計，載運輪椅使用者之通用小客車（無障礙計程車），截至民國112年1月底總共有7,396輛（營業1,236輛、自有4,348輛），面對超高齡社會即將來臨，未來全國五人中有一人就是65歲以上長者，再加上仍有身障者，以及偏鄉長者等，他們對載運輪椅小客車的需求量將會持續增加，顯見目前無障礙小客車數量仍無法滿足現實需求，綜上，現行無障礙公共運輸仍須持續推廣，通用無障礙計程車車輛供給仍少於實際上的需求量，載運輪椅使用者之小客車免徵貨物稅之期限亦應一併延長。\n三、第二項未修正、第四項及第六項未修正。第三項序文酌均作文字修正。"},{"bill":"202110067870000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤與車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)中華民國一百零三年六月五日起至一百十八年十二月三十一日止購買身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全、公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車，免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全、公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之基準者為限。\n自中華民國一百零四年二月六日起至一百十八年十二月三十一日止購買符合載運輪椅使用者車輛規定安全檢測基準之車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、修正第一項第一款序文、第一目序文及第四項，依法制體例酌作文字及標點符號修正。\n二、現行第一項第一款第二目但書並修正如下：\n(一)依據「臺灣二○五○淨零排放路徑及策略」之運具電動化及無碳化之目標，並考量交通不予環境部之「二○三○年客運車輛電動化推動計畫」，現行政策以鼓勵業者汰換購買電動大客車為目標，為維持政策一致性，購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車等免徵貨物稅之實施期間不再予延長。電動公共汽車部分，則以適用現行第十二條之三規定免徵貨物稅。\n(二)因應整體環境需求應建構高齡長者及身心障礙者之無障礙友善環境，並促進其自立生活，延長購買身心障礙者復康巴士及符合載運輪椅使用者車輛規定安全檢測基準之車輛免徵貨物稅之實施期間至一百十八年十二月三十一日。\n(三)另身心障礙者復康巴士包含原條文第一項第一款第一目規定之小客車及同款第二目規定之大客車改裝之車種，爰將相關規定，增列之第三目酌作文字修正。\n三、修正第一項第三款及第三項文字，將公共安全及公共衛生分別敘述。\n四、修正第五項將購買符合載運輪椅使用者車輛規定安全檢測基準之車輛免徵貨物稅期限延長至一百十八年十二月三十一日止。\n五、第二項及第六項未修正。"},{"bill":"202110068480000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤及車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)自中華民國一百零三年六月五日起至一百十八年十二月三十一日止購買身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車，免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之標準者為限。\n自中華民國一百零四年二月六日起至一百十八年十二月三十一日止購買符合載運輪椅使用者車輛規定安全檢測基準之車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、聯合國政府間氣候變化專門委員會2022年公布之第六次報告指出，全球暖化將在近20年內升溫至攝氏1.5度，全球皆無法避免多種氣候危害的增加，衝擊各國水資源、能源等。故而聯合國呼籲各國應採取行動，將碳排放量在2030年前減半，達成2050年淨零碳牌的目標。\n二、為達成「臺灣2050淨零排放路徑及策略」之運具電動化及無碳化政策目標，政府推動「2030年客運車輛電動化推動計畫」鼓勵業者將燃油公車汰換成電動公車，且現行電動公共汽車已可提供低底盤無障礙運輸服務，所以購買低底盤公共汽車、天然氣公共汽車、油電混合動力等公共汽車已無繼續免徵貨物稅之必要，令電動公共汽車得適用同條例第十二條之三第二項，購買完全以電能為動力之電動車輛並完成登記者，免徵貨物稅，無需再另行規定。\n三、為照顧身心障礙、行動不便者，且使國內復康巴士更加普及，爰將復康巴士移列至第一項第一款第三目，延長免徵貨物稅實施期間至一百十八年十二月三十一日。\n四、為友善高齡長者乘車環境，落實建構無障礙乘車空間，照顧其對行之需求，將購買符合載運輪椅使用者車輛規定安全檢測基準之車輛免徵貨物稅期限延長至一百十八年十二月三十一日止。"},{"bill":"202110069290000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤與車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)自中華民國一百零三年六月五日起至一百十八年十二月三十一日止購買身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之標準者為限。\n自中華民國一百零四年二月六日起至一百十八年十二月三十一日止購買載運輪椅使用者車輛並完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、為符合法制體例，酌為文字、標點符號之修正。\n二、為達成2050淨零排放目標，行政院推動「2030客運車輛電動化推動計畫」，鼓勵客運業者汰換購買電動大客車，相關車輛自103年起免徵貨物稅，經交通部評估購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車已無繼續免徵貨物稅之必要，而電動公共汽車可適用本法第十二條之三規定免徵貨物稅，無須另予規定，爰予刪除。\n三、我國即將於114年進入超高齡社會，為建構無障礙友善乘車環境，照顧行動不便者行的需求，復康巴士免徵貨物稅期限延長至118年12月31日，爰將第一項第一款第二目但書移列為第三目，並酌為文字修正。\n四、承說明三之意旨，為促進身心障礙者及行動不便者自立生活，照顧其行的需求，將購買載運輪椅使用者車輛免徵貨物稅期限延長至一百十八年十二月三十一日止，並參照現行實務運作現況，酌為文字修正。"},{"bill":"202110072590000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤與車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)自中華民國一百零三年六月五日起至一百十八年十二月三十一日止購買身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車，免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之基準者為限。\n自中華民國一百零四年二月六日起至一百十八年十二月三十一日止購買載運輪椅使用者車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、為推動二○二○年國發會公布「二○五○淨零排放路徑及策略」項下之「運具電動化及無碳化」關鍵戰略目標，且根據交通部之評估，現行電動公共汽車已可提供低底盤無障礙運輸服務，故低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車已無免徵貨物稅之必要，爰予刪除。\n二、鑑於電動公共汽車可適用現行第十二條之三規定免徵貨物稅，無需另予規定，爰予刪除。\n三、為促進身心障礙者及行動不便者的自立生活，並打造無障礙友善的乘車環境，爰修正本條第五項，延長購置符合輪椅使用者車輛安全檢測規範的免徵貨物稅優惠期限，至民國一百十八年十二月三十一日止。\n四、基於車輛安全檢測基準規範事項及內容已納入一百十一年四月二十八日修正發布車輛型式安全審驗管理辦法增訂之第十四條附表，並自同年八月十二日施行，廢止車輛安全檢測基準，且載運輪椅使用者之定義以定明於貨物稅稽徵規則第七條第五項，爰修正本條第五項。"},{"bill":"202110073720000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤及車身、牽引車及拖車均屬之。\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之。\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。但自中華民國一百零三年六月五日起至一百二十年十二月三十一日止購買低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車、電動公共汽車、身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全及公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之標準者為限。\n自中華民國一百零四年二月六日起至一百二十年十二月三十一日止購買符合載運輪椅使用者車輛規定安全檢測基準之車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、鑑於政府鼓勵民眾搭乘大眾運輸工具及大眾運輸工具改採用純電動車或油電混和車以達節能減碳之政策目的。故研擬針對購買油電混和或天然氣之公共運輸車輛之貨物稅優惠期限，延長7年至民國120年12月31日，以促進業者達到能源轉型的目標。\n二、又鑑於我國已將兩公約及身心障礙者權利公約等納入我國內國法、及我國憲法保障社會弱勢團體之基本國策，故針對更有利於身障者使用之低底盤公共汽車、身心障礙者復康巴士、符合載運輪椅使用者車輛等車輛之優惠稅率，一併由113年延長至120年，以鼓勵業者逐步完成車輛汰換。"},{"bill":"201110074550000","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤與車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)自中華民國一百十四年一月一日起至一百十八年十二月三十一日止購買身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車，免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之基準者為限。\n自中華民國一百零四年二月六日起至一百十八年十二月三十一日止購買載運輪椅使用者車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","note":"一、第一項第一款序文、第一目序文、第三款、第三項序文及第四項依法制體例酌作文字及標點符號修正；第一項第一款第二目但書並修正如下：\n(一)為達成「臺灣二○五○淨零排放路徑及策略」之運具電動化及無碳化政策目標，交通部與環境部刻正推動「二○三○年客運車輛電動化推動計畫」，鼓勵客運業者汰換購買電動大客車，且現行電動公共汽車已可提供低底盤無障礙運輸服務，低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車已無繼續免徵貨物稅之必要，電動公共汽車則依現行第十二條之三規定免徵貨物稅，爰予刪除該等公共汽車免徵貨物稅規定。\n(二)考量我國將邁入超高齡社會，為落實建構無障礙友善乘車環境及照顧身心障礙者之政策目標，爰修正延長購買身心障礙者復康巴士免徵貨物稅期限自一百十四年一月一日起至一百十八年十二月三十一日止。另考量身心障礙者復康巴士，包含以第一項第一款第一目規定之小客車，或同款第二目規定之大客車改裝之車種，爰將第一項第一款第二目但書施行期間規定移列為同款第三目，並酌作文字修正。\n二、為落實建構無障礙友善乘車環境，促進身心障礙者及行動不便者之自立生活，照顧渠等行的需求，爰修正第五項，將購買符合載運輪椅使用者車輛規定安全檢測基準之車輛免徵貨物稅期限延長至一百十八年十二月三十一日止。另鑑於車輛安全檢測基準規範事項及內容已納入一百十一年四月二十八日修正發布車輛型式安全審驗管理辦法第十四條附表，自同年八月十二日施行，並廢止車輛安全檢測基準，自同日生效，且「載運輪椅使用者車輛」之定義已定明於貨物稅稽徵規則第七條第五項，爰酌作文字修正。\n三、第二項及第六項未修正。"}],"changed":true,"final":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤與車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)自中華民國一百十四年一月一日起至一百十八年十二月三十一日止購買身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車，免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之基準者為限。\n自中華民國一百零四年二月六日起至一百十八年十二月三十一日止購買載運輪椅使用者車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。","finalWhy":"一、第一項第一款序文、第一目序文、第三款、第三項序文及第四項依法制體例酌作文字及標點符號修正；第一項第一款第二目但書並修正如下：\n(一)為達成「臺灣二○五○淨零排放路徑及策略」之運具電動化及無碳化政策目標，交通部與環境部刻正推動「二○三○年客運車輛電動化推動計畫」，鼓勵客運業者汰換購買電動大客車，且現行電動公共汽車已可提供低底盤無障礙運輸服務，低底盤公共汽車、天然氣公共汽車、油電混合動力公共汽車已無繼續免徵貨物稅之必要，電動公共汽車則依現行第十二條之三規定免徵貨物稅，爰予刪除該等公共汽車免徵貨物稅規定。\n(二)考量我國將邁入超高齡社會，為落實建構無障礙友善乘車環境及照顧身心障礙者之政策目標，爰修正延長購買身心障礙者復康巴士免徵貨物稅期限自一百十四年一月一日起至一百十八年十二月三十一日止。另考量身心障礙者復康巴士，包含以第一項第一款第一目規定之小客車，或同款第二目規定之大客車改裝之車種，爰將第一項第一款第二目但書施行期間規定移列為同款第三目，並酌作文字修正。\n二、為落實建構無障礙友善乘車環境，促進身心障礙者及行動不便者之自立生活，照顧渠等行的需求，爰修正第五項，將購買符合載運輪椅使用者車輛規定安全檢測基準之車輛免徵貨物稅期限延長至一百十八年十二月三十一日止。另鑑於車輛安全檢測基準規範事項及內容已納入一百十一年四月二十八日修正發布車輛型式安全審驗管理辦法第十四條附表，自同年八月十二日施行，並廢止車輛安全檢測基準，自同日生效，且「載運輪椅使用者車輛」之定義已定明於貨物稅稽徵規則第七條第五項，爰酌作文字修正。\n三、第二項及第六項未修正。","review":{"note":"照行政院提案通過","text":"車輛類之課稅項目及稅率如下：\n一、汽車：凡各種機動車輛、各種機動車輛之底盤與車身、牽引車及拖車均屬之：\n(一)小客車：凡包括駕駛人座位在內，座位在九座以下之載人汽車均屬之：\n1.汽缸排氣量在二千立方公分以下者，從價徵收百分之二十五。\n2.汽缸排氣量在二千零一立方公分以上者，從價徵收百分之三十。\n(二)貨車、大客車及其他車輛，從價徵收百分之十五。\n(三)自中華民國一百十四年一月一日起至一百十八年十二月三十一日止購買身心障礙者復康巴士並完成新領牌照登記者，免徵貨物稅。\n二、機車：凡機器腳踏車、機動腳踏兩用車及腳踏車裝有輔助原動機者均屬之，從價徵收百分之十七。\n三、供研究發展用之進口車輛、附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛、郵政供郵件運送之車輛、裝有農業工具之牽引車、符合政府規定規格之農地搬運車及不行駛公共道路之各種工程車，免徵貨物稅。\n前項第三款所稱供研究發展用之進口車輛，指供新車種之開發設計、功能系統分析、測試或為安全性能、節約能源、防制污染等之改進及零組件開發設計等之進口汽車。\n第一項第三款所稱附有特殊裝置專供公共安全與公共衛生目的使用之特種車輛如下：\n一、專供公共安全使用之警備車、偵查勘驗用車、追捕提解人犯車、消防車及工程救險車等。\n二、專供公共衛生使用之救護車、診療車、到宅沐浴車、灑水車、水肥車、垃圾車、消毒車、掃街車、溝泥車、沖溝車、捕犬車及空氣污染測定車等。\n電動車輛及油電混合動力車輛，按第一項第一款及第二款稅率減半徵收。但油電混合動力車輛以符合財政部公告之基準者為限。\n自中華民國一百零四年二月六日起至一百十八年十二月三十一日止購買載運輪椅使用者車輛，且完成新領牌照登記者，免徵貨物稅。\n前項免徵貨物稅之車輛，於完成新領牌照登記五年內，汽車所有人變更拆除載運輪椅使用者設備時，應補繳原免徵之貨物稅。"}},{"no":"第十二條之三","current":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","versions":[{"bill":"202110068480000","text":"第十二條第一項第一款第一目之2所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十八年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","note":"一、延長實施期間至一百十八年十二月三十一日。\n二、為鼓勵民眾購買電動車，減少二氧化碳排放量，達成臺灣2030年碳排減半、2050年淨零碳排之目標，爰延續電動車免徵貨物稅。"}],"changed":false,"final":"第十二條第一項第一款第一目之1所定汽缸排氣量在二千立方公分以下之小客車，包括馬達最大馬力在二百零八．七英制馬力以下或二百十一．八公制馬力以下完全以電能為動力之電動小客車；同目之2所定汽缸排氣量在二千零一立方公分以上之小客車，包括馬達最大馬力在二百零八．八英制馬力以上或二百十一．九公制馬力以上完全以電能為動力之電動小客車。\n自中華民國一百零六年一月二十八日起至一百十年十二月三十一日止，購買完全以電能為動力之電動車輛並完成登記者，免徵該等車輛應徵之貨物稅。但電動小客車免徵金額以完稅價格新臺幣一百四十萬元計算之稅額為限，超過部分，不予免徵。\n前項減免年限屆期前半年，行政院得視實際推展情況決定是否延長減免年限。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第十二條之六","current":"為防制老舊大型柴油車污染，改善空氣品質，自中華民國一百零六年八月十八日起至一百十五年十二月三十一日止，報廢符合下列規定之大客車、大貨車、大客貨兩用車、代用大客車、大型特種車，並購買上開車輛新車且完成新領牌照登記者，該等新車應徵之貨物稅每輛減徵新臺幣四十萬元。但應徵稅額未達新臺幣四十萬元者，減徵稅額以應徵稅額為限：\n一、於中華民國九十五年九月三十日以前出廠。\n二、於中華民國九十五年十月一日至同年十二月三十一日出廠，且於九十五年九月三十日以前取得行政院環境保護署依八十八年七月一日或九十三年一月一日施行之交通工具空氣污染物排放標準核發之汽車車型排氣審驗合格證明。\n前項減徵貨物稅案件之申請期限、程序、應檢附證明文件及其他相關事項之辦法，由財政部會同行政院環境保護署定之。","versions":[{"bill":"202110069290000","text":"為防制老舊大型柴油車污染，改善空氣品質，自中華民國一百零六年八月十八日起至一百十五年十二月三十一日止，報廢符合下列規定之大客車、大貨車、大客貨兩用車、代用大客車、大型特種車，並購買上開車輛新車且完成新領牌照登記者，該等新車應徵之貨物稅每輛減徵新臺幣四十萬元。但應徵稅額未達新臺幣四十萬元者，減徵稅額以應徵稅額為限：\n一、於中華民國一百年十二月三十一日以前出廠。\n二、於中華民國九十五年十月一日至同年十二月三十一日出廠，且取得環境部依八十八年七月一日或九十三年一月一日施行之移動污染源空氣污染物排放標準核發之汽車車型排氣審驗合格證明。\n三、於中華民國一百零一年一月一日至同年十二月三十一日出廠，且取得環境部依九十五年十月一日施行之移動污染源空氣污染物排放標準核發之汽車車型排氣審驗合格證明。\n前項減徵貨物稅案件之申請期限、程序、應檢附證明文件及其他相關事項之辦法，由財政部會同環境部定之。","note":"為防制老舊大型柴油車污染，改善空氣品質，本法於106年及108年陸續納入一至三期大型柴油車輛。而四期環保車輛營運至今車齡已達12-17年，其污染源為最新六期環保標準之8.33倍，為減輕空氣污染，並提高行車安全，爰將四期環保標準之大型柴油車輛納入換購減徵範圍。"}],"changed":false,"final":"為防制老舊大型柴油車污染，改善空氣品質，自中華民國一百零六年八月十八日起至一百十五年十二月三十一日止，報廢符合下列規定之大客車、大貨車、大客貨兩用車、代用大客車、大型特種車，並購買上開車輛新車且完成新領牌照登記者，該等新車應徵之貨物稅每輛減徵新臺幣四十萬元。但應徵稅額未達新臺幣四十萬元者，減徵稅額以應徵稅額為限：\n一、於中華民國九十五年九月三十日以前出廠。\n二、於中華民國九十五年十月一日至同年十二月三十一日出廠，且於九十五年九月三十日以前取得行政院環境保護署依八十八年七月一日或九十三年一月一日施行之交通工具空氣污染物排放標準核發之汽車車型排氣審驗合格證明。\n前項減徵貨物稅案件之申請期限、程序、應檢附證明文件及其他相關事項之辦法，由財政部會同行政院環境保護署定之。","finalWhy":null,"review":{"note":"維持現行條文","text":""}}],"stages":[{"date":"2024-04-12","stage":"一讀","code":"院會-11-1-9","bill":"202110029080000","gazref":"113卷025期5207號 2-2頁"},{"date":"2024-05-10","stage":"一讀","code":"院會-11-1-13","bill":"202110044750000","gazref":"113卷040期5222號一冊 14-14頁"},{"date":"2024-09-27","stage":"一讀","code":"院會-11-2-2","bill":"202110068130000","gazref":"113卷076期5258號 3-3頁"},{"date":"2024-09-27","stage":"一讀","code":"院會-11-2-2","bill":"202110067740000","gazref":"113卷076期5258號 4-4頁"},{"date":"2024-09-27","stage":"一讀","code":"院會-11-2-2","bill":"202110067870000","gazref":"113卷076期5258號 5-5頁"},{"date":"2024-10-04","stage":"一讀","code":"院會-11-2-3","bill":"202110067800000","gazref":"113卷077期5259號 10-10頁"},{"date":"2024-10-04","stage":"一讀","code":"院會-11-2-3","bill" <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;

const VERB = ENACT ? '訂定' : '修正';

  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);
  fillBench($('bench'), a);
}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }
  const bench = el('div', {class: 'bench'});
  panel.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  fillBench(bench, a);
}
D.arts.forEach(a => {

function finder(turns) {   // 在這場逐字稿裡找字

  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;

    if (!hits.length) return;

      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
