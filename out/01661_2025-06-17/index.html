<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>運動彩券發行條例修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

/download/agenda1/02/pdf/11/03/09/LCEWA01_110309_00143.pdf","proposers":["劉書彬","黃國昌","張啓楷","陳昭姿"],"ncosign":0,"people":[["劉書彬","民眾黨","提案"],["黃國昌","民眾黨","提案"],["張啓楷","民眾黨","提案"],["陳昭姿","民眾黨","提案"]],"party":[["民眾黨",4]],"reason":"本院台灣民眾黨黨團，鑒於運動部成立，且運動賽事之發展，應基於運動賽事之公平及球員之競技安全保障，為健全運動產業之發展，維護運動競技賽事之公平進行，爰擬具「運動彩券發行條例第二條、第二十一條及第二十一條之一條文修正草案」，修正主管機關並增訂妨害運動競技賽事之公平者之樣態及加重處罰之態樣，以完善職業與業餘運動業防賭機制。是否有當？敬請公決。","arts":["第二條","第二十一條","第二十一條之一"]},{"id":"202110111230000","who":"委員葉元之等20人","date":"2025-05-02","name":"「運動彩券發行條例第二十一條及第二十一條之一條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110111230000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/10/LCEWA01_110310_00007.pdf","proposers":["葉元之","林沛祥"],"ncosign":18,"people":[["葉元之","國民黨","提案"],["林沛祥","國民黨","提案"],["黃仁","國民黨","連署"],["馬文君","國民黨","連署"],["羅智強","國民黨","連署"],["呂玉玲","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["黃建賓","國民黨","連署"],["謝龍介","國民黨","連署"],["王鴻薇","國民黨","連署"],["林德福","國民黨","連署"],["廖偉翔","國民黨","連署"],["林倩綺","國民黨","連署"],["黃健豪","國民黨","連署"],["陳雪生","國民黨","連署"],["盧縣一","國民黨","連署"],["廖先翔","國民黨","連署"],["陳玉珍","國民黨","連署"],["蘇清泉","國民黨","連署"],["涂權吉","國民黨","連署"]],"party":[["國民黨",20]],"reason":"本院委員葉元之、林沛祥等20人，基於競技運動之公平性為國家整體運動產業發展之基石，而現行法規對以非法手段干預比賽公正性之刑責尚未臻完備，《運動產業發展條例》第七條之三已明確規範妨害競技公平之行為，亦針對強暴、脅迫、詐術、利誘、三人以上之共犯結構提高刑責。鑑於運動彩券同屬於運動產業的一環，為確保相關法規之刑責一致，並維持法安定性。爰擬具「運動彩券發行條例第二十一條及第二十一條之一條文修正草案」，杜絕人為操控運動競技賽事，確保比賽公平性。是否有當？敬請公決。","arts":["第二十一條","第二十一條之一"]},{"id":"202110124740000","who":"委員李柏毅等17人","date":"2025-05-16","name":"「運動彩券發行條例第二十一條及第二十一條之一條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110124740000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/12/LCEWA01_110312_00011.pdf","proposers":["李柏毅"],"ncosign":16,"people":[["李柏毅","民進黨","提案"],["李昆澤","民進黨","連署"],["林宜瑾","民進黨","連署"],["蔡易餘","民進黨","連署"],["吳沛憶","民進黨","連署"],["陳秀寳","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["徐富癸","民進黨","連署"],["范雲","民進黨","連署"],["沈伯洋","民進黨","連署"],["賴惠員","民進黨","連署"],["王義川","民進黨","連署"],["陳俊宇","民進黨","連署"],["鍾佳濱","民進黨","連署"],["郭國文","民進黨","連署"],["吳思瑤","民進黨","連署"],["林月琴","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員李柏毅等17人，我國運動競技賽事過去曾多次受到簽賭集團介入，以威脅、利誘等不同形式影響賽事公平性，甚至有為操控比賽成立球團之紀錄。為健全運動彩券發行，並維護運動彩券投注標的運動競技賽事之公平性，爰擬具「運動彩券發行條例第二十一條及第二十一條之一條文修正草案」。是否有當？敬請公決。","arts":["第二十一條","第二十一條之一"]}],"arts":[{"no":"第一條","current":"為振興體育，並籌資以發掘、培訓及照顧運動人才，協助國際體育交流，健全運動彩券發行、管理及盈餘運用，並促進社會公益，特制定本條例。","versions":[{"bill":"202110105620000","text":"為振興體育，並籌資以發掘、培訓及照顧運動人才，協助國際體育交流，健全運動彩券發行、管理及盈餘運用，並促進社會公益，特制定本條例。\n本條例由主管機關統籌推動運動產業及體育發展政策之執行。","note":"一、現行條文僅揭示彩券制度之公益及財務目的，尚未具體反映主管機關在運動產業及政策發展上之主導角色。\n二、隨體育署升格為運動部，主管機關已肩負更全面的運動產業發展與政策統整任務，爰增列條文強化法源依據，使未來政策執行、命令制定、資源統籌更具法律正當性。"}],"changed":false,"final":"為振興體育，並籌資以發掘、培訓及照顧運動人才，協助國際體育交流，健全運動彩券發行、管理及盈餘運用，並促進社會公益，特制定本條例。","finalWhy":null,"review":null},{"no":"第二條","current":"本條例之主管機關為教育部。","versions":[{"bill":"202110083640000","text":"本條例之主管機關為運動部。","note":"一、配合中央行政機關組織基準法第二十九條條文修正，配合運動部之成立，運動彩卷發行條例之主管機關改為運動部，爰修正條文。\n二、本條施行日期，由行政院公告之。"},{"bill":"202110085860000","text":"本條例之主管機關為運動部。","note":"一、配合中央行政機關組織基準法第二十九條條文修正，配合運動部之成立，運動彩卷發行條例之主管機關改為運動部，爰修正條文。\n二、本條施行日期，由行政院公告之。"},{"bill":"202110094880000","text":"本條例之主管機關為運動部。","note":"中央行政機關組織基準法第二十九條條文規定：「基本政策或功能相近之業務，應集中由同一部擔任」為因應運動部成立，將本條例之主管機關改為運動部。"},{"bill":"202110097570000","text":"本條例之主管機關為運動部。","note":"修正本條例之主管機關為運動部：鑒於運動部組織法業已三讀通過，且為全國運動及體育業務之最高行政機關，而運動彩券發行之盈餘依法需全數專供發展體育運動之用（本條例第八條），是以運動彩券發行條例之主管機關應配合該組織法由教育部移至運動部。"},{"bill":"202110099410000","text":"本條例之主管機關為運動部。","note":"配合《中央行政機關組織基準法》第二十九條修正，配合運動部成立，運動彩券發行條例之主管機關改為運動部，爰修正條文。"},{"bill":"202110100320000","text":"本條例之主管機關為運動部。","note":"配合我國推廣各式運動政策，設立運動部，將本法主管機關由原教育部體育署改為運動部。"},{"bill":"202110098840000","text":"本條例之主管機關為運動部。","note":"配合運動部組織法通過，修正本法之主管機關。"},{"bill":"202110105620000","text":"本條例之主管機關為運動部。","note":"因應行政院組織改造，原隸屬教育部之體育署已升格為「運動部」，負責統籌全國運動政策、產業推動與法制規劃。爰修正本條例第二條，將主管機關明定為「運動部」，以符合法治體系與機關實際職掌。"},{"bill":"202110107440000","text":"本條例之主管機關為運動部。","note":"配合立法院已三讀通過成立運動部有關的七案組織法案，爰將原隸屬於教育部體育署之運動彩券業務主管機關改為運動部，以配合新成立之運動部之業務範圍，待運動部掛牌成立後，再由行政院公告本條之施行日期。"},{"bill":"202110102180000","text":"本條例之主管機關為運動部。","note":"二○二五年一月二十四日公布《運動部組織法》，為促進全民運動，發展運動相關事項，形塑運動文化並落實多元平權，因此設立運動部。運動相關事項主管機關應移轉至運動部。"},{"bill":"202110102260000","text":"本條例之主管機關為運動部。","note":"配合中央行政機關組織基準法第二十九條條文修正，運動部成立後，運動相關法規與運動彩券發行條例之主管機關改為運動部。"},{"bill":"202110102490000","text":"本條例之主管機關為運動部。","note":"為配合行政院組織改造，且立法院已三讀通過成立運動部，原由教育部體育署專責之全台運動及體育發展相關事務，將全數轉移至運動部執掌，爰修正此條，待運動部正式成立後，由行政院公告本條施行日期。"},{"bill":"202110111180000","text":"本條例之主管機關為運動部。","note":"配合我國運動部之設立，將本法主管機關由原教育部體育署改為運動部。"}],"changed":false,"final":"本條例之主管機關為教育部。","finalWhy":null,"review":null},{"no":"第二十一條","current":"以強暴、脅迫、詐術或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n結夥三人以上犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應主動配合檢察及司法警察機關調查第一項、第二項所列行為，其有隱匿或抗拒，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰。","versions":[{"bill":"202110083640000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或結夥三人以上犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應主動配合檢察及司法警察機關調查第一項、第二項所列行為，其有隱匿或抗拒，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰。","note":"一、健全運動產業之發展，維護運動競技賽事之公平，給予球員安全之競技環境，並回應國人之期待，對於妨害運動競技賽事之公平者，有給予刑事處罰之必要，將「利誘」明訂為類型態樣，以符合罪刑法定主義及罪刑明確性。\n二、配合運動產業發展條例增訂之第七條之三，將意圖營利之要件納入運動彩券發行條例第二十一條第二項，以符合整體法秩序。"},{"bill":"202110094880000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或結夥三人以上犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應主動配合檢察及司法警察機關調查第一項、第二項所列行為，其有隱匿或抗拒，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰。","note":"配合運動產業發展條例增訂第七條之三同步修正，將「利誘」納入處罰態樣，並將「意圖營利」納入加重處罰要件，以維持整體法秩序。"},{"bill":"202110097650000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行機制，確保運動彩券投注標的運動競技賽事之公平性，並配合實務運作中可能影響競技公平性之行為態樣，參照《運動產業發展條例》第七條之三第二項規定，增訂以利誘方式妨害投注標的運動競技賽事公平者之刑責，處一年以上七年以下有期徒刑，並得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利而犯前項所列之犯罪行為，具有加重處罰之必要，參照《運動產業發展條例》第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰，並將「結夥三人以上」修正為三人以上「共同」，以涵蓋共同正犯之情形。\n三、參照《運動產業發展條例》第七條之三第三項規定，增訂因第一項行為致生加重結果者，依其所生結果加重刑責。\n四、原第三項條文移列為第四項，並酌修文字表述，以確保條文之嚴謹性與完整性。\n五、現行第四項關於應主動配合調查之規定，考量《刑事訴訟法》已設有相關強制處分規範，且隱匿或抗拒行為亦受《刑法》第一百三十五條、第一百六十五條及第一百六十八條等規範約束，涉及抗拒公務執行、隱匿關係他人刑事案件證據及偽證罪等行為，均有相應刑事處罰規範可資適用。基於一事不二罰原則，應適當區分刑事處罰與行政處罰，爰刪除該規定。"},{"bill":"202110097570000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應主動配合檢察及司法警察機關調查第一項、第二項所列行為，其有隱匿或抗拒，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰。","note":"一、修正第一項：目前本條第一項雖已明定以強暴、脅迫或詐術等不法方式影響運動彩券投注標的競技賽事之公平性之刑罰，惟考量影響運動彩券投注標的競技賽事公平性之行為態樣尚包括「利誘」，參考甫修正運動產業發展條例第七條之三第二項之規定，增訂「利誘」二字。\n二、修正第二項：參考參考甫修正運動產業發展條例第七條之三第四項就意圖營利及加重結果犯之不法行為處罰之立法例，本項增訂「意圖營利或三人以上共同」之受處罰的行為態樣。\n三、第三項及第四項未修正。"},{"bill":"202110097280000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者處五年以上十二年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事之公平性，並配合實務運作中意圖影響運動競技賽事公平者之行為樣態，爰參考運動產業發展條例第七條之三第二項規定，於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，亦應併同處罰。\n二、考量意圖營利犯第一項所定之罪者，有予以加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。並修正法制用語，將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n三、增訂第三項明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、第三項移列為第四項，並酌作文字修正。\n五、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用，隱匿或抗拒部分，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用，基於一事不二罰原則，宜適切區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110097690000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為有效遏止人為因素介入運動彩券發行，健全運動彩券交易之公信力，維護運動彩券投注標的運動競技賽事之公平性，並考量意圖影響運動競技賽事公平者之違法行為樣態，爰參考運動產業發展條例第七條之三規定，於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、參考運動產業發展條例第七條之三規定，於第二項增列意圖營利犯第一項之罪者，加重其刑責；另將同項所定「結夥三人以上」修正為「三人以上共同」，以含括共謀共同正犯之情形。\n三、參考運動產業發展條例第七條之三規定，增訂第三項明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用；隱匿或抗拒部分，已有刑法相關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用。基於一事不二罰原則，適切區分刑事處罰及行政處罰，爰予以刪除。\n五、現行第三項移列為第四項，並酌作文字修正。"},{"bill":"202110097270000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、運動競技賽事之公平性攸關運動彩券發行之公信力，近年政府及運動團體莫不致力於建立防賭機制，以實務現況言，利誘實為當今最常見之手段之一，爰參考運動產業發展條例第七條之三規定，將「利誘」手段明文納入規範。\n二、意圖營利而妨害投注標的賽事公平者，其惡性更為重大，實有加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列「意圖營利」之情形。另，參酌刑法之文字，將結夥三人修正為「三人以上共同」，以包含共謀共同正犯之情形。\n三、增訂第三項，參考運動產業發展條例第七條之三第三項規定，增訂加重結果犯之規定。\n四、第三項移列為第四項，並酌為文字修正。\n五、考量刑事訴訟法已有強制處分相關規定，刑法亦有妨害公務、湮滅證據、偽證罪之規定，基於一事不二罰原則，應區分行政處罰與刑事處罰，爰刪除第四項規定。"},{"bill":"201110096440000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事之公平性，並配合實務運作中意圖影響運動競技賽事公平者之行為樣態，爰參考運動產業發展條例第七條之三第二項規定，於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，亦應處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利犯第一項所定之罪者，有予以加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。另將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n三、參考運動產業發展條例第七條之三第三項規定，增訂第三項明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、第三項移列為第四項，並酌作文字修正。\n五、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用，隱匿或抗拒部分，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用，基於一事不二罰原則，宜適切區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110099410000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或結夥三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、修正第一項、第二項、新增第三項及第四項。\n二、為健全運動產業之發展，維護運動競技賽事之公平，建構運動選手於安全環境競技。對於妨害運動競技賽事之公平者，有必要處以刑事處罰。爰將「利誘」明確訂定犯罪類型，以符合罪刑法定主義及罪刑明確性原則。\n三、配合《運動產業發展條例》增訂之第七條之三，將「意圖營利」之要件納入本條文第二項，以符合法規體系之一致性。另將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n四、現行第四項所訂「應主動配合調查」規定部分之規定，考量目前已有《刑事訴訟法》相關強制處分規範可運用，且針對隱匿或抗拒，現行並已有《刑法》第一百三十五條、第一百六十五條及第一百六十八條，已就有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可運用，基於一事不二罰之原則，應區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110100320000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為使整體運動競技賽事產業健全發展，任何以非法手段妨害運動競技賽事公平性者，都將依法追究刑責。\n二、「運動產業發展條例第七條之三」已於114年1月3日增訂，其中「利誘」已納入該條，「意圖營利」犯第一項之罪者有加重處罰之必要。此乃為深化運動產業之防賭機制，維護更優質之運動產業環境。\n三、運動彩券為運動產業的重要一環，故本條例第一項條文同樣增列「利誘」為其類型與態樣，第二項條文加重「意圖營利」者之刑責，使罰則之構成要件及刑度一致。\n四、承上，「運動產業發展條例第七條之三」之第三項規定，針對破壞運動彩券產業者而嚴重侵害他人身體及生命法益者，加重其刑。\n五、將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n六、刪除本條對運動團隊經營者等未主動配合調查處以罰鍰之規定，改依《刑事訴訟法》及《刑法》相關規定辦理，以提高辦案效率。"},{"bill":"202110097360000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應主動配合檢察及司法警察機關調查第一項、第二項所列行為，其有隱匿或抗拒，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事之公平性，並配合實務運作中意圖影響運動競技賽事公平者所各式行為，故參考運動產業發展條例第七條之三第二項規定，於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，亦應處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利犯第一項所定之罪者，有予以加重處罰之必要，故參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。\n另將「結夥三人以上」修正為「三人以上共同」，以包含同謀共同正犯之情形。\n三、參考運動產業發展條例第七條之三第三項規定，增訂第三項明定因第一項行為而生加重結果者，依結果加重其刑責。\n四、第三項移列為第五項，並酌作文字修正。"},{"bill":"202110098840000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應依法配合檢察及司法警察機關調查第一項、第二項所列行為，其有隱匿或抗拒致生妨害公務、藏匿人犯或湮滅證據之行為者依法處罰之。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。","note":"一、配合一一四年三讀通過之運動產業發展條例第七條之三，於第一項增列利誘之樣態，於第二項加入意圖營利之樣態。\n二、第四項、第五項原為行政罰，修正為依刑罰。對調查之配合義務則依照刑事訴訟法處理。"},{"bill":"202110097670000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事之公平性，並配合實務運作中意圖影響運動競技賽事公平者之行為樣態，爰參考運動產業發展條例第七條之三第二項體例，於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，亦應處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利項所定之罪者，有予以加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。另將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n三、參考運動產業發展條例第七條之三第三項規定，增訂第三項明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、第三項移列為第四項，並酌作文字修正。\n五、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用，隱匿或抗拒部分，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用，基於一事不二罰原則，宜適切區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110098580000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事公平性、遏止人為因素介入彩券發行及建立完善職業與業餘運動業之防賭機制，並配合實務運作中意圖影響運動競技賽事公平者之行為樣態，爰參考運動產業發展條例第七條之三第二項規定，於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，亦應處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利犯第一項所定之罪者，有予以加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。另將「結夥三人以上」修正為「三人以上共同」，以含括共謀共同正犯之情形。\n三、參考運動產業發展條例第七條之三第三項規定，增訂第三項加重結果犯之樣態，明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、第三項移列為第四項，並酌作文字修正。\n五、現行第四項所定應主動配合調查規定之部分，考量已有刑事訴訟法相關強制處分規範可資運用，隱匿或抗拒部分，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用，基於一事不二罰原則，宜適切區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110098770000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、修正第一項。參酌運動產業發展條例第七條之三第二項規定，增訂以「利誘」方式妨害投注標的運動競技賽事之公平者，亦處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、修正第二項。參酌運動產業發展條例第七條之三第四項規定，增訂「意圖營利」、及修正「三人以上共同」犯第一項之罪者，加重刑罰。\n三、增訂第三項。參酌運動產業發展條例第七條之三第三項規定，因犯第一項之罪而致人於死、致重傷者，加重其刑責。\n四、爰第三項移至第四項，並酌修文字。\n五、原第四項所定之行為，基於一事不二罰原則，回歸由刑事訴訟法及刑法辦理，故予以刪除。"},{"bill":"202110099110000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為完善運動彩券發行機制，確保作為投注標的的運動競技賽事公平進行，並配合實務上影響賽事公正性的各種行為模式，爰參酌運動產業發展條例第七條之三第二項，於本條第一項增列以利誘方式妨害運動競技賽事公平性的行為，並規範其刑責。若有違反，將面臨一年以上、七年以下的有期徒刑，並可併科新臺幣一千萬元至三千萬元的罰金。\n二、考量到若犯罪行為是基於營利目的，應加重處罰，爰參酌運動產業發展條例第七條之三第四項，於本條第二項增列對意圖營利而犯第一項罪行者的加重刑罰。此外，將「結夥三人以上」修正為「三人以上共同」，以涵蓋共謀及共同正犯的情形。\n三、參酌運動產業發展條例第七條之三第三項，增訂本條第三項，明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、第三項移列為第四項，並酌作文字修正。\n五、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用，隱匿或抗拒部分，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用，基於一事不二罰原則，宜適切區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110104560000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事之公平性，並配合實務運作中意圖影響運動競技賽事公平者之行為樣態，爰參考運動產業發展條例第七條之三第二項規定，於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，亦應處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利犯第一項所定之罪者，有予以加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。另將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n三、參考運動產業發展條例第七條之三第三項規定，增訂第三項明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、第三項移列為第四項，並酌作文字修正。\n五、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用，隱匿或抗拒部分，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用，基於一事不二罰原則，宜適切區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110105420000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，不法所得，沒收之，並得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，不法所得，沒收之，並得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、運動彩券之發行，除應維護其投注標的之相關運動競技賽事公平性，並進而推動相關運動之發展外，對於以非法之方法，影響賽事公平進行，並從而獲取不法利益，甚至危及他人生命安全者，皆應加重與完備相關之刑責。故為健全運動彩券發行機制，確保運動彩券投注標的運動競技賽事之公平性，並防堵任何不法之操作，參照《運動產業發展條例》第七條之三第二項規定，增訂以利誘方式妨害投注標的運動競技賽事公平者之刑責，並沒收相關之不法所得。爰提案修正本條第一項部分文字。\n二、另考量意圖營利而犯前項所列之犯罪行為，具有加重處罰之必要，參照《運動產業發展條例》第七條之三第四項規定，增列意圖營利犯第一項之罪者之加重刑罰，並將「結夥三人以上」修正為三人以上「共同」，以涵蓋共同正犯之情形。爰提案修正本條第二項部分文字。\n三、參照《運動產業發展條例》第七條之三第三項規定，增訂第三項，因犯第一項行為，依其所生結果加重刑責。\n四、原第三項條文移列為第四項，並酌修文字表述。\n五、現行第四項關於應主動配合調查之規定，考量《刑事訴訟法》已設有相關強制處分規範，且隱匿或抗拒行為亦受《刑法》第一百三十五條、第一百六十五條及第一百六十八條等規範約束，涉及抗拒公務執行、隱匿關係他人刑事案件證據及偽證罪等行為，均有相應刑事處罰規範可資適用。基於一事不二罰原則，應適當區分刑事處罰與行政處罰，爰刪除該規定。"},{"bill":"202110105460000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、修正第一項、第二項，原條文第三項移列至第四項，並酌作文字修正。\n二、為完善職業與業餘運動業之防賭機制，已於114年1月3日增訂公布運動產業發展條例第七條之三。為同步立法體例，遏止人為介入彩券交易，維護運動競技賽事公平，爰參考運動產業發展條例第七條之三第二項規定，於第一項增列以利誘之方法，妨害投注標的運動競技賽事公平者之刑罰。\n三、為遏止意圖營利犯第一項所定之罪者，有加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。另將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n四、參考運動產業發展條例第七條之三第三項規定，爰增訂第三項，明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n五、現行第四項所定應主動配合調查規定部，考量已有刑事訴訟法相關強制處分規範，亦有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑罰規範可資運用。基於一事不二罰原則，宜適切區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110105620000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項或第二項之罪，致人重傷、死亡者，處七年以上有期徒刑，得併科前項罰金。\n前三項之未遂犯亦罰之。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應主動配合檢察及司法警察機關調查第一項至第三項所列行為，其有隱匿或抗拒，經查證屬實者，依法追究刑責。","note":"一、增列「利誘」為構成要件行為態樣。現行條文雖已涵蓋強暴、脅迫、詐術等直接侵害手段，惟對於以提供利益誘因方式（例如收買選手、教練等）影響賽事結果之行為，尚欠缺明確法律依據。爰增列「利誘」為明確違法態樣，以補足現行規範漏洞，強化對運動競技賽事公平性之保障。公平性之保護。\n二、增訂「意圖營利或三人以上共同犯」為加重犯。針對具組織性、營利動機之操控行為（如跨境賭盤、職業性操盤等），增設構成要件並提升刑度與罰金額度，以與一般犯區別，增強打擊力與嚇阻效果。用語採「或」連結，涵蓋營利動機及多人共同行為兩種高度危險態樣，與刑法體系中對加重結果犯之處罰邏輯一致。\n三、增設「加重結果犯」規定。對因操控賽事而導致人員重傷或死亡者，明文處以七年以上有期徒刑，以強化對重大結果之反應，並與《刑法》相關結果犯規定體系相互銜接。\n四、統一規範未遂犯處罰現行條文慬明定前二項未遂之處罰，修正條文擴及第三項，明定「前三項之未遂犯亦罰之」，完整建立責任體系，避免爭議。\n五、刪除行政罰鍰規定，改以刑事責任處理。原條文針對不配合檢調機關調查者處以新臺幣二百萬元以上一千萬元以下罰鍰，惟該行為本質屬刑事偵查義務違反，與《刑事訴訟法》規範重疊，恐生適用衝突。爰刪除該行政罰規定，統一回歸刑事責任處理，以符合法律保留原則及體系整合原則，並強化責任嚴肅性。"},{"bill":"202110107440000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、配合運動產業發展條例新增第七條之三規定，將利誘與意圖營利納入妨害運動競技賽事公平者之違法行為態樣，爰同將利誘與意圖營利納入本條規定之行為態樣中，並對具營利之不法意圖者加重處罰，以維護運動彩券投注標的競技賽事之公平性。\n二、將原條文第二項「結夥」三人以上之文字改為三人以上「共同」犯之，以含括共謀共同正犯之型態。\n三、新增第三項加重結果犯之規定，針對破壞運動彩券投注標的競技賽事公平性且因此嚴重侵害民眾身體及生命法益者進行加重處罰之設計，以符合比例原則。\n四、配合新增第三項規定，將原第三項規定移為第四項，並酌予修正其文字。\n五、現行第四項規定有關主動配合調查之部分，鑒於已有刑事訴訟法規定相關強制處分之手段；而隱匿或處以罰鍰之部分則有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可供運用，爰刪除本項規定，將本項規定之行為回歸刑事處罰，以明確區分刑事處罰及行政處罰，貫徹一事不二罰原則。"},{"bill":"202110107450000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應主動配合檢察及司法警察機關調查第一項、第二項所列行為；其有隱匿、抗拒或提供虛偽資料，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰，並得沒收因犯罪所得之財物。\n犯本條之罪，其犯罪所得財物，不問屬於犯人與否，應予追徵或沒收；若全部或一部無法追徵時，得命其賠償等值財產。","note":"一、新增「利誘」作為犯罪手法，強調不僅是透過暴力或詐欺，連以利益引誘他人操縱比賽結果也構成犯罪，使規範更周延。\n二、「意圖營利或三人以上共同犯」，擴大適用範圍，使單純以營利為目的的個人行為也能受到更嚴格的規範。\n三、將「因犯罪導致死亡或重傷」的情況也納入未遂犯處罰範圍，提高法律適用的完整性。\n四、要求不得「提供虛偽資料」，並明確規定若違反則將受罰，提升調查效力。\n五、不論犯罪所得是否屬於行為人本人，都應追徵或沒收，並可命令賠償等值財產，避免犯罪者透過轉移財產規避罰則，提高經濟制裁力。\n六、運動彩券市場的利益龐大，若無有效的刑事與行政處罰並進，將難以有效遏止不法行為。透過高額罰鍰、沒收犯罪所得與刑事責任並存，不僅能提高違法成本，也能強化監管與自律機制，確保運動競技的公平性與彩券市場的健全發展。"},{"bill":"202110102180000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。","note":"一、修正第一項，為健全運動發展環境，維護運動彩券投注標的運動競技賽事之公平性，促進運動產業發展，爰參酌《運動產業發展條例》第七條之三第二項之規定，於第一項增列以利誘之方式妨害投注標的運動競技賽事之公平者態樣。\n二、修正第二項，參酌《運動產業發展條例》第七條之三第四項之規定，增訂意圖營利之態樣；並將結夥修正為共同犯罪，以包含同謀共同正犯之情形。\n三、第三項未修正。\n四、修正第四項，參酌《運動產業發展條例》第七條之三第三項之規定，明定有第一項之行為造成加重結果者，亦應加重刑責。\n五、考量《刑法》第一百三十五條、第一百六十五條及第一百六十八條已訂有抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽造罪等罰則，爰刪除原條文第四項之規定。"},{"bill":"202110102260000","text":"以強暴、脅迫、詐術等威逼利誘手段或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或結夥三人以上犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n擁有運動團隊經營權之法人、團體及其代表人、管理人與相關從業人員，應主動配合檢察及司法警察機關調查第一項、第二項所列行為，其有隱匿或抗拒，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰。\n第一項及第二項未遂犯罰之。","note":"一、為協助運動產業之完善發展，並維護運動競技安全與運動彩券公平性，針對妨害運動競技賽事者，應訂定相關規範並給予刑事處罰。明訂加上「威逼利誘手段」以明確規範之非法手段，確保法條規範內容。\n二、將「意圖營利」納入運動彩券發行條例第二十一條第二項，以完整法條所規範之對象。\n三、增訂第三項。參酌運動產業發產條例第七條之三第三項中規定，因犯第一項之罪而致人於死、致人重傷者，加重其刑責。"},{"bill":"202110102490000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者處五年以上十二年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事之公平性，並配合運動產業發展條例第七條之三第二項規定，擬將以利誘方式妨害投注標的運動競技賽事之公平者，應處與以強暴、脅迫、詐術或其他非法之方法，妨害投注標的運動競技賽事之公平者相當之處罰，以維護賽事公平。\n二、針對意圖營利犯第一項所定之罪者，有必要予以加重處罰，因此於第二項增列意圖營利犯第一項之罪者之加重刑罰。此外將「結夥三人以上」修改為「三人以上共同」。\n三、新增訂第三項明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、配合新增第三項，將原第三項移列為第四項，並酌作文字修正。\n五、現行第四項所定應主動配合調查規定部分，有鑑於已有刑事訴訟法相關強制處分規範可資運用，隱匿或抗拒部分，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可運用，因此刪除本項規定，以配合一事不二罰原則。"},{"bill":"202110111180000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動產業之發展，維護運動競技賽事之公平，給予球員安全之競技環境，對於妨害運動競技賽事公平者，有給予刑事處罰之必要，爰參考運動產業發展條例第七條之三第二項規定，於第一項增列利誘方式妨害投注標的運動競技賽事之公平者，亦應處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利犯第一項所定之罪者，有予以加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。另將「結夥三人以上」修正為「三人以上共同」，以遏止集團化、組織化之犯罪情形。\n三、參考運動產業發展條例第七條之三第三項規定，增訂第三項明定因第一項行為而生生命侵害者，依所生結果加重其刑責。\n四、第三項移列為第四項。\n五、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法及刑法等刑事處罰規範，予以刪除。"},{"bill":"202110111230000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、基於《運動產業發展條例》第七條之三已針對妨害競技公平的行為訂立明確非法態樣，為確保裁量依據與刑罰標準一致，參照《運動產業發展條例》第七條之三第二項規定，增訂以利誘方式妨害投注標的運動競技賽事公平者之刑責，處一年以上七年以下有期徒刑，並得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、有鑒於意圖營利而犯前項所列之犯罪行為有加重處罰之必要，依《運動產業發展條例》第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰，並將「結夥三人以上」修正為三人以上「共同」，以涵蓋共同正犯之情形。\n三、參照《運動產業發展條例》第七條之三第三項規定，增訂因第一項行為致生加重結果者，依其所生結果加重刑責。\n四、原第三項條文後移至第四項，並酌修文字，確保條文之嚴謹性與流暢性。\n五、現行第四項有關應主動配合調查之規定，有鑒於《刑事訴訟法》已設有相關強制處分規範，且隱匿或抗拒行為亦受《刑法》第一百三十五條、第一百六十五條及第一百六十八條等規範約束，涉及抗拒公務執行、隱匿關係他人刑事案件證據及偽證罪等行為，均有相應刑事處罰規範可資適用。基於一事不二罰原則，應當區分刑事處罰與行政處罰，刪除該規定。"},{"bill":"202110124740000","text":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","note":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事之公平性，並配合實務運作中意圖影響運動競技賽事公平者之行為樣態，爰參考運動產業發展條例第七條之三第二項規定於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，亦應處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利犯第一項所定之罪者，有予以加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定於第二項增列意圖營利犯第一項之罪者之加重刑罰。另將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n三、參考運動產業發展條例第七條之三第三項與刑法相關規定，增訂第三項明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、第三項移列為第四項，並酌作文字修正。\n五、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用，基於一事不二罰原則予以刪除。"}],"changed":true,"final":"以強暴、脅迫、詐術、利誘或其他非法之方法，妨害投注標的運動競技賽事之公平者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n意圖營利或三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣二千萬元以上五千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑，各得併科新臺幣二千萬元以上五千萬元以下罰金。\n第一項及第二項之未遂犯罰之。","finalWhy":"一、為健全運動彩券發行，並為維護運動彩券投注標的運動競技賽事之公平性，並配合實務運作中意圖影響運動競技賽事公平者之行為樣態，爰參考運動產業發展條例第七條之三第二項規定，於第一項增列以利誘方式妨害投注標的運動競技賽事之公平者，亦應處一年以上七年以下有期徒刑，且得併科新臺幣一千萬元以上三千萬元以下罰金。\n二、考量意圖營利犯第一項所定之罪者，有予以加重處罰之必要，爰參考運動產業發展條例第七條之三第四項規定，於第二項增列意圖營利犯第一項之罪者之加重刑罰。另將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n三、參考運動產業發展條例第七條之三第三項規定，增訂第三項明定因第一項行為而生加重結果者，依所生結果加重其刑責。\n四、第三項移列為第四項，並酌作文字修正。\n五、原第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用，隱匿或抗拒部分，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用，基於一事不二罰原則，宜適切區分刑事處罰及行政處罰，爰予以刪除。","review":null},{"no":"第二十一條之一","current":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n結夥三人以上犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n發行機構、受委託機構及其員工，應主動配合檢察及司法警察機關調查前三項所列行為，其有隱匿或抗拒，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰。","versions":[{"bill":"202110097650000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前兩項之未遂犯罰之。","note":"一、第一項及第三項未修正。\n二、第二項所定結夥三人以上修正為三人以上「共同」，理由同修正條文第二十一條說明二後段。\n三、現行第四項刪除，理由同修正條文第二十一條說明五。"},{"bill":"202110097280000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、第二項所定「結夥三人以上」修正為「三以上共同」，理由同修正條文第二十一條說明二後段。\n二、現行第四項刪除，理由同修正條文第二十一條說明五。"},{"bill":"202110097690000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、第二項所定「結夥三人以上」修正為「三人以上共同」，以含括共謀共同正犯之情形。\n二、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法相關強制處分規範可資運用；隱匿或抗拒部分，已有刑法有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可資運用。基於一事不二罰原則，適切區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110097270000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、參酌刑法文字，將第二項「結夥三人以上」修正為「三人以上共同」，用以含括共謀共同正犯之情形。\n二、刪除第四項規定，理由同修正條文第二十一條說明五。"},{"bill":"201110096440000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、第一項及第三項未修正。\n二、第二項所定「結夥三人以上」修正為「三人以上共同」，理由同修正條文第二十一條說明二後段。\n三、現行第四項刪除，理由同修正條文第二十一條說明五。"},{"bill":"202110099410000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、第二項所定「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n二、刪除現行第四項。現行第四項所訂應主動配合調查規定部分，考量目前已有刑事訴訟法相關強制處分規範可運用，隱匿或抗拒，並已有刑法第一百三十五條、第一百六十五條及第一百六十八條有關抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽證罪等刑事處罰規範可運用，基於一事不二罰之原則，應區分刑事處罰及行政處罰，爰予以刪除。"},{"bill":"202110100320000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、將「結夥三人以上」修正為「三人以上共同」，以含括同謀共同正犯之情形。\n二、刪除本條對發行機構及受委託機構等未主動配合調查處以罰鍰之規定，改依《刑事訴訟法》及《刑法》相關規定辦理，以提高辦案效率。"},{"bill":"202110097360000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n發行機構、受委託機構及其員工，應主動配合檢察及司法警察機關調查前三項所列行為，其有隱匿或抗拒，經查證屬實者，處新臺幣二百萬元以上一千萬元以下罰鍰。","note":"一、第一項及第三、第四項未修正。\n二、第二項所定「結夥三人以上」修正為「三人以上共同」，理由同修正條文第二十一條說明二後段。"},{"bill":"202110098840000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。\n發行機構、受委託機構及其員工，應依法配合檢察及司法警察機關調查前三項所列行為。其有隱匿或抗拒，致生妨害公務、藏匿人犯或湮滅證據之行為者依法處罰之。","note":"修正理由同第二十一條修正理由之第二點。"},{"bill":"202110097670000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、第一項及第三項未修正。\n二、第二項所定「結夥三人以上」修正為「三人以上共同」，理由同修正條文第二十一條說明二後段。\n三、現行第四項刪除，理由同修正條文第二十一條說明五。"},{"bill":"202110098580000","text" 下罰金。\n前二項之未遂犯亦罰之。","note":"一、維持原條文之刑事責任結構。本條旨在處理發行機構或受委託機構員工因職務故意違法圖利自己或損害公司利益之行為，原已明確規範基本刑責、加重情節（結夥）及未遂處罰，修正條文僅微調文字，使與第二十一條加重規定一致（採「三人以上共同犯」），未變動其法律適用範圍。\n二、刪除第四項行政罰鍰條文。現行條文第四項處以行政罰鍰於未配合調查者，然該義務性行為已可透過刑事程序強制調查或處理。為避免刑事責任與行政責任重疊，以及簡化執法實務，爰刪除行政罰鍰條文，回歸刑事體系統一處理，強化法律適用之明確性與一致性。"},{"bill":"202110107440000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、第一項及第三項未予更動。\n二、將原條文第二項「結夥」三人以上之文字改為三人以上「共同」犯之，以含括共謀共同正犯之型態。\n三、刪除現行第四項條文，理由同第二十一條修正條文說明五。"},{"bill":"202110102180000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、修正第二項，將結夥修正為共同犯罪，以包含同謀共同正犯之情形。\n二、考量《刑法》第一百三十五條、第一百六十五條及第一百六十八條已訂有抗拒公務執行、隱匿關係他人刑事被告案件之證據及偽造罪等罰則，爰刪除原條文第四項之規定。"},{"bill":"202110102490000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、第一項及第三項未更動。\n二、將第二項「結夥三人以上」修改為「三人以上共同」犯前項之罪者。\n三、現行第四項刪除，理由同修正條文第二十一條說明五。"},{"bill":"202110111180000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、將「結夥三人以上」修正為「三人以上共同」，以遏止集團化、組織化之犯罪情形。\n二、現行第四項所定應主動配合調查規定部分，考量已有刑事訴訟法及刑法等刑事處罰規範，予以刪除。"},{"bill":"202110111230000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣二千萬元以上五千萬元以下罰金。\n前二項之未遂犯罰之。","note":"一、第一項及第三項未修正。\n二、第二項所定結夥三人以上修正為三人以上「共同」，理由同修正條文第二十一條說明二後段。\n三、現行第四項刪除，理由同修正條文第二十一條說明五。"},{"bill":"202110124740000","text":"發行機構及受委託機構員工，意圖為自己或第三人不法之利益，或損害發行機構或受委託機構利益，而為違背其職務之行為，致生損害於發行機構或受委託機構財產或其他利益者，處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以上三千萬元以下罰金。\n三人以上共同犯前項之罪者 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;

const VERB = ENACT ? '訂定' : '修正';

  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;

const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],

  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);
  fillBench($('bench'), a);
}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }
  const bench = el('div', {class: 'bench'});
  panel.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  fillBench(bench, a);
}
D.arts.forEach(a => {
  const btn = el('button', {type: 'button', 'data-no': a.no, class: 'chip' + (a.changed ? ' passed' : ''), text: a.no});
  btn.addEventListener('click', () => { current = a.no; showArticle(); });
  $('artnav').append(btn);
});
showArticle();

/* ---------- 提案版本 ---------- */
const partyLine = p => p.party.map(([n]) => n).join('、');
function people(p, role, label) {   // 一列名單：姓名後面標黨籍
  const list = (p.people || []).filter(x => x[2] === role);
  if (!list.length) return null;
  const box = el('div', {class: 'people'});
  list.forEach(([n, pt]) => box.append(el('span', {class: 'person'}, n, el('small', {text: pt}))));
  const peek = role === '提案' ? list.map(x => x[0]).join('、') : null;   // 只有提案人收合時預覽姓名
  return fold(label + ' ' + list.length + ' 位', box, peek);
}
function fold(label, content, peek) {   // 點開才看全文；有 peek 時收合狀態露一行預覽
  const s = el('summary', null, el('b', {text: label}));
  if (peek) s.append(el('span', {class: 'peek', text: peek}));
  return el('details', {class: 'fold'}, s, content);
}
const dlg = el('dialog', {class: 'artdlg', 'aria-labelledby': 'dlgt'});
document.body.append(dlg);
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openArticleDialog(p, no) {   // 獨立視窗看某一條的各版本，可在該提案動到的條文間切換
  dlg.textContent = '';
  const close = el('button', {type: 'button', class: 'chip', text: '關閉 ✕'});
  close.addEventListener('click', () => dlg.close());
  const nav = el('div', {class: 'chips'});
  p.arts.forEach(n => {
    const art = D.arts.find(x => x.no === n);
    const b = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-pressed': String(n === no), text: n});
    b.addEventListener('click', () => openArticleDialog(p, n));
    nav.append(b);
  });
  const body = el('div', {class: 'dlgbody'});
  const a = D.arts.find(x => x.no === no);
  if (a) {
    const bench = el('div', {class: 'bench'});
    fillBench(bench, a);
    body.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  } else body.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'}));
  dlg.append(el('div', {class: 'dlghead'}, el('div', {class: 'dlgtitle'}, el('h3', {id: 'dlgt', text: shortWho(p) + ' 提案　逐條對照'}), close), nav), body);
  if (!dlg.open) dlg.showModal();
}
function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照
  const c = el('div', {class: 'pdetail'});
  c.append(el('div', {class: 'line', text: p.date + ' 提案　' + partyLine(p)}));
  const a = people(p, '提案', '提案人'), b = people(p, '連署', '連署人');
  if (a) c.append(a);
  if (b) c.append(b);
  if (p.reason) { const r = p.reason.replace(/\n/g, ' '); c.append(fold('修法目的', el('p', {class: 'reason', text: r}))); }
  const chips = el('div', {class: 'sub'}, (ENACT ? '條文' : '修正條文' + (inProps ? '' : '（按鈕若是紅色代表真的修正了）')) + '：');
  const panel = el('div', {class: 'inbench', hidden: ''});
  let shown = null;
  p.arts.forEach(no => {
    const art = D.arts.find(x => x.no === no);
    const btn = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-expanded': 'false', text: no});
    btn.addEventListener('click', () => {
      if (inProps) { openArticleDialog(p, no); return; }
      const closing = shown === no;
      chips.querySelectorAll('button').forEach(x => x.setAttribute('aria-expanded', 'false'));
      panel.textContent = ''; panel.hidden = closing; shown = closing ? null : no;
      if (!closing) { btn.setAttribute('aria-expanded', 'true'); inlineBench(panel, no); }
    });
    chips.append(btn);
  });
  c.append(chips, panel);
  const ref = el('div', {class: 'ref'}, link(p.url, '議事網提案頁'));
  if (p.pdf) ref.append('、', link(p.pdf, '關係文書 PDF'));
  c.append(fold('資料出處', ref));
  return c;
}
D.props.forEach(p => {
  const c = el('article', {class: 'prop', id: 'prop-' + p.id});
  c.append(el('h3', {text: shortWho(p)}), propDetail(p, true));

/* ---------- 歷程與逐字稿 ---------- */
const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
function renderTranscript(box, data, s) {
  box.textContent = '';
  const clip = {}; s.clips.forEach(c => { clip[normName(c.n) + '|' + c.t] = c.u; (clip[normName(c.n)] = clip[normName(c.n)] || c.u); });
  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      d.append(who);
      if (!chair && !first.has(t.s)) first.set(t.s, d);
    }
    const put = (into, b) => {
      if (typeof b === 'string') into.append(el('p', {text: b}));
      else if (b.fold) {   // 照登的文件（提案條文全文、審查報告、機關書面報告）：收成一行
        const inner = el('div', {class: 'readout'});
        b.b.forEach(x => put(inner, x));
        into.append(fold(b.fold, inner));
        const p = b.bill && propById[b.bill];
        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});
          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));
          into.append(el('div', {class: 'readnote'}, btn));
        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));
    turns.append(d);
  });
  const idx = el('div', {class: 'idx'}, el('span', {text: '跳到發言者（' + first.size + ' 位）'}));
  const chips = el('div', {class: 'chips'});
  first.forEach((node, name) => { const b = el('button', {type: 'button', class: 'chip', text: name}); b.addEventListener('click', () => { turns.scrollTop = node.offsetTop - turns.offsetTop; }); chips.append(b); });
  idx.append(chips);
  box.append(idx, turns);
}
/* 一讀、二讀、三讀標籤的說明小框：滑鼠停留 1 秒或點一下就浮出 */
const READING = {
  '一讀': {t: '一讀會', sub: '朗讀標題、交付審查', what: '議案送進立法院後，在院會中由主席宣付朗讀議案名稱。', pts: [
    '朗讀標題後，通常會將法案交付給相關的委員會進行詳細的實質審查（例如：教育及文化委員會、司法及法制委員會等）。',
    '如果有立委提案並經 20 人以上連署、表決通過，也可以選擇「逕付二讀」（跳過委員會審查）。',
    '如果有異議，可以退回程序委員會或不予審議。']},
  '逕付二讀': {t: '逕付二讀', sub: '跳過委員會審查，直接排進院會二讀', what: '院會決定這個提案不交委員會審查（或從委員會抽出），直接進入二讀。', pts: [
    '通常在一讀報告事項時由黨團提議，院會無異議或表決通過。',
    '逕付二讀的提案多半會交黨團協商，或與已經審查完的相關提案併案處理。',
    '這一天只有主席宣告的幾句話，沒有實質討論。']},
  '二讀': {t: '二讀會', sub: '實質討論、逐條審議，最關鍵的階段', what: '委員會審查完畢，或是經逕付二讀後，將法案送到院會進行全體討論與表決。', pts: [
    '這是法案通過與否最關鍵、辯論最激烈的階段。',
    '進行廣泛討論以及逐條討論、修正。',
    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');

    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      btn.addEventListener('click', async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      });
      acts.append(btn);
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

(function () {

      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));

    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();
