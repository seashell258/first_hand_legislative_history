團再販售取得之非法性影像、圖畫或語音等進行販售，牟取不法暴利，嚴重侵害兒少權益，爰調高刑責。\n三、其餘項次未修正。"},{"bill":"202110040850000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣七百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、鑒於數位發展快速，實務上出現網路論壇與偷拍集團合作，利用性誘拐、詐騙、網路約會、性交易等方式使兒童及少年發生性行為，取得自拍或偷拍而來的非自願外流性私密影像，再放上論壇。\n二、為強化兒童及少年之保護，健全其身心發展，並保護兒童及少年之性隱私，故提高最輕本刑，以確保兒童及少年免於遭受任何形式之性剝削，保護其身心健全發展。\n三、本法所稱與性相關而客觀上足以引起性慾或羞恥之圖畫，自應排除虛擬兒童色情之產物，惟利用生成式人工智慧製造之兒童或少年色情仿真圖畫、擬真之兒童或少年色情圖畫，以及以真實存在之兒童或少年為創作背景之色情圖畫，因有侵害個人法益之虞，影響特定兒童或少年之名譽或隱私，仍有處罰之必要，是故，本法所稱之圖畫，應以生成式人工智慧製造、擬真繪製或以真實存在之兒童或少年為創作背景之色情圖畫為限，於此範圍外之虛擬兒童色情創作產物，則應採取明確可行之防護措施，限制兒童及少年接觸、瀏覽，以確保其身心得以健全發展。"},{"bill":"202110043530000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上七年以下有期徒刑，得併科新臺幣二百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"為有效嚇阻犯行、加強對兒少之保護，爰修正第一項之罰則，以達阻嚇之效。"},{"bill":"202110044920000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣八百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"本條修正理由參照修正條文第三十五條之說明，提升最輕本刑及罰金金額，加重對拍攝者之罰責。"}],"changed":true,"final":"拍攝、製造、無故重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造、無故重製性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造、無故重製性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造、無故重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","finalWhy":"考量行為人無故重製兒童或少年之性影像者，所造成之侵害程度不亞於拍攝、製造兒童或少年性影像之行為，爰參酌刑法第三百十九條之三第一項規定，於第一項至第三項、第七項增訂無故重製之行為，將其納入犯罪行為予以處罰，並定明第一項罰金下限。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第三十八條","current":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處一年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","versions":[{"bill":"202110033060000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處三年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、對於未成年兒童性剝削絕對是零容忍，這些受害孩子們的人生所受的影響是要長期活在被窺探、騷擾，甚至是被威脅的恐懼中，應比照《中華民國刑法》第二百七十七條以傷害罪角度切入討論刑期，以重傷害的角度，刑責應提高至3年以上10年以下有期徒刑。\n二、修正本條第一項，將現行刑度由一年以上七年以下有期徒刑，提高至三年以上十年以下有期徒刑。\n三、修正本條第二項，將現行刑度由六月以上五年以下有期徒刑，提高至三年以上五年以下有期徒刑。"},{"bill":"202110033180000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收並於案件判決確定後銷毀之。","note":"一、針對散佈未成年性影像者提高刑責與刑度。\n二、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110034540000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金，並公布姓名及照片。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金，並公布姓名及照片。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收並於案件判決確定後銷毀之。","note":"一、針對散布未成年性影像者提高刑責與刑度，為遏止犯罪，公布其姓名及照片。\n二、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110034200000","text":"散布、播送、交付、購買、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處一年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、修正第一項之犯罪行為客體。\n二、考量行為人雖未為散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之行為，然一有購買上述性影像或物品則有流傳可能性，且會導致其他行為人增加散布、播送、交付之行為，其侵害之程度應與散布、播送或公然陳列行為等視，故將購買納入第一項犯罪行為類型予以處罰，以保護兒童或少年被害人。"},{"bill":"202110034150000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、考量散布兒少性影像之犯罪行為，對兒少身心創傷極為嚴重，目前量刑最低本刑一年以上，可獲緩起訴處分，易造成行為人有僥倖心態。\n二、修正第一項，加重罰則至三年以上十年以下有期徒刑，以達嚇阻犯罪之效果。\n三、併同修正第二項意圖散布之罰則為一年以上七年以下有期徒刑，提高嚇阻與懲戒力度。"},{"bill":"202110034580000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、散布及販售兒童及少年性影像，諸多先進國家已將最高刑期提高到五年、甚至超過十年，如美國、德國、澳洲等國，且世界各國皆有提高刑期、重視兒少保護之趨勢於，顯見此條例之犯行在許多國家已被認定為嚴重傷害兒少之重大犯罪，為了遏止相關犯行，應提高刑罰。\n二、為促使國人重視兒童及少年保護之重要性，並符合國際趨勢，爰修正本條第一項之刑度為七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。"},{"bill":"202110033760000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處一年六個月以上七年以下有期徒刑，得併科新臺幣七百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上五年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"第一項處罰刑度由一年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金改為一年六個月以上七年以下有期徒刑，得併科新臺幣七百萬元以下罰金。\n第二項處罰刑度由六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金改為一年以上五年以下有期徒刑，得併科新臺幣五百萬元以下罰金。"},{"bill":"202110033910000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，將使不特定人共見共聞並難以消除相關物品存在之軌跡，將對受害人造成重大影響。\n二、為嚴格打擊兒童性影像的傳播與共享行為，應加重對此類犯罪行為之制裁。\n三、爰提案修正，提高本條第一項及第二項之刑度。"},{"bill":"202110034400000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處三年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"理由同修正條文第三十二條說明，加重對散布者之處罰。"},{"bill":"202110036130000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上十年以下有期徒刑，得併科新臺幣七百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、理由同三十二條之說明一，加重刑罰。\n二、理由同三十二條之說明二，加重散佈、播送及公然陳列者刑罰。"},{"bill":"202110034280000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處五年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處五年以上十二年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"為保障未成年權益，防止未成年受性剝削之害，目前刑度不足以因應社會變遷以及實務需求，針對有期徒刑予以加重：\n一、第一項之有期徒刑，由「一年以上七年以下」修正為「五年以上」。\n二、第二項之有期徒刑，由「六月以上五年以下」修正為「五年以上十二年以下」。"},{"bill":"202110036480000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處一年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金，同時公布姓名及照片，並依性侵害犯罪防治法第三十一條之規定接受身心治療、輔導或教育。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金，同時公布姓名及照片，並依性侵害犯罪防治法第三十一條之規定接受身心治療、輔導或教育。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、修正第一項及第二項。\n二、參照「性侵害犯罪防治法」，對於引誘拍攝、強迫拍攝兒少性影像或無正當理由持有兒少之性影像等新興數位犯罪行為施以身心治療、輔導或教育；同時參考美國梅根法案，為遏止犯罪，對兒少進行影像等新興數位犯罪者，應公布姓名及照片。"},{"bill":"202110036570000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"近年網路平台或論壇，出現以金錢或其他性影像之對價方式，以取得兒少之性影像之交易模式，基於人性所趨、有需求就有供給之誘因下，讓此購買行為樣態較單純持有更加嚴重，除提供拍攝、製造兒少性影像之行為人金錢來源外，也使兒少性剝削犯罪組織化，形成地下產業鏈。爰修正本法第三十六條、第三十八條、新增以購買或對價關係取得兒童或少年之性影像行為人之處罰，藉以杜絕兒少性剝削產業鏈。"},{"bill":"202110036660000","text":"重製、散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖重製、散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣、支付對價而持有或觀覽前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n犯本條之罪，而違反個人資料保護法，如洩露被害人個人資料、姓名、出生年月日、住居所、學校、職場及其他足資識別其身分之資料者，加重其刑至二分之一。","note":"一、鑑於南韓N號房、臺版N號房事件，顯見兒少性剝削影像從製造、散布，到觀覽、下載，已成犯罪鏈，且隨數位技術發展，受害範圍持續擴大。兒少若遭侵害，恐產生長達一生的身心創傷；且若未有效遏止，恐導致兒少性剝削犯行合理化、普遍化，致更多兒少於風險中。\n二、鑑於112年刑法修正，訂定未經他人同意，無故重製、散布、播送、交付、公然陳列，或以他法供人觀覽其性影像者，將處五年以下有期徒刑，得併科五十萬元以下罰金。重製性影像無疑是性剝削的一環，在本條卻未有規範，爰參酌刑法第三一九條之三，將「重製」兒少性影像納入第一項及第二項，以完善犯罪類型。\n三、參照國際經驗，美國、德國、澳洲等國，已將兒少性剝削最高刑期提高到五年，甚至十年以上，且世界各國多有提高刑期。爰修正第一項，提高刑期已達阻嚇之效。\n四、支付對價購買、觀覽兒少性影像者，無疑是強化犯罪鏈之共犯結構，為阻斷金流、自源頭遏止兒少性剝削之犯罪，爰修正第三項，將支付對價而持有或觀覽入法。\n五、性影像犯罪，常有洩露被害人個人資料之情況，對被害人造成更嚴重的侵害，爰修正第四項前段，完善犯罪樣態，對於此種性影像犯罪加重其刑至二分之一。"},{"bill":"202110036730000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金，並公布姓名與相片於主管機關網站，並供民眾查詢。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三十萬以上三百萬元以下罰金，並公布姓名與相片於主管機關網站，並供民眾查詢。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、鑒於兒少性剝削之犯行亦常因非法之散布、播送、交付、公然陳列等犯行，造成被害者更嚴重之廣泛傷害，爰參考美國「性犯罪者資訊公開法」（俗稱梅根法案）之相關規定，故為遏止犯行者一再犯罪，應將犯行者之姓名及照片，公布於主管機關網站，並供民眾查詢。\n二、除公開犯行者之姓名及照片，亦應提高刑期與罰金額度，加強防範相關犯行。\n三、爰提案修正與增訂本條第一項第二項相關文字。\n四、第三項、第四項及第五項未修正。"},{"bill":"202110037450000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、考量透過營利手段賺取暴利，相較散布、播送或公然陳列相關物品者，其侵害被害人權益較重，有加重處罰之必要。\n二、為嚴格打擊兒童或少年性影像之拍攝與製造，提高此類犯罪行為之最低刑度，爰提案修正，提高本條第一項及第二項之刑度。"},{"bill":"202110037590000","text":"散布、播送、交付、購買、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處兩年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、增列「購買」為構成兒童或少年性剝削行為之要件。\n二、原規定散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處一年以上七年以下有期徒刑，加重為兩年以上七年以下有期徒刑。"},{"bill":"202110039310000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"為嚇阻散布等將兒少性影像及性物品擴散之犯罪，提高使他人觀賞兒少性影像之刑責。"},{"bill":"202110039410000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收並於案件判決確定後銷毀之。","note":"一、同第二條第一項第三款文字修正。\n二、針對散佈未成年性影像者提高刑責與刑度。\n三、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110039990000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、修正第一項、第二項，其餘未修正。\n二、有鑑於散布行為得使特定或不特定多數人隨時瀏覽該兒少性剝削之影像、圖畫或語音等相關記錄，進而造成二度傷害。尤其數位科技發展、犯罪集團猖獗，散布者容易成為不法社群或平台的來源提供途徑之一。為嚇阻潛在犯罪、瓦解共犯結構，爰提高刑度以符合罪刑相當原則：\n(一)修正第一項，將刑度由一年以上七年以下有期徒刑提高至三年以上七年以下有期徒刑。\n(二)修正第二項，將刑度由六月以上五年以下有期徒刑提高至一年以上五年以下有期徒刑。"},{"bill":"202110040890000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、兒少性影像、圖畫或語音於網路流傳猖獗，一旦有散布之狀況，影像難以於短時間內完全自網路下架清除，長時間造成兒少權益受損，並嚴重影響兒少身心健康發展，爰調高本項犯罪行為刑責。\n二、第二項配合第一項修正，酌予調高相關犯罪行為刑責。\n三、其餘項次未修正。"},{"bill":"202110041390000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起、刺激或滿足性慾而無藝術性、醫學性或教育性價值而令一般人感覺不堪呈現於眾或不能忍受而排拒之圖畫、語音或其他物品者，處一年以上七年以下有期徒刑，併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起、刺激或滿足性慾而無藝術性、醫學性或教育性價值而令一般人感覺不堪呈現於眾或不能忍受而排拒之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、有鑒於販賣兒少性影像之行為罪愆深重，我國應以最強烈手段遏止該行為再次發生。故本法販賣兒少性影像之規定，允宜予以適度加嚴。\n二、參酌司法院大法官釋字第六一七號解釋，擴張第一項及第三項「引起性慾」至「引起、刺激或滿足」性慾，並避免使用「羞恥」此一較不確定之概念，而改採釋字第六一七號解釋解釋文中所明確定義之「無藝術性、醫學性或教育性價值而令一般人感覺不堪呈現於中或不能忍受而排拒」。\n三、為嚴禁此類行為之發生，允宜適度加重本條之懲罰規定，爰修正第一項及第二項，取消得加罰罰金之規定，改為「併科」。"},{"bill":"202110040850000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處三年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、鑒於數位發展快速，實務上出現網路論壇與偷拍集團合作，利用性誘拐、詐騙、網路約會、性交易等方式使兒童及少年發生性行為，取得自拍或偷拍而來的非自願外流性私密影像，再放上論壇。\n二、為強化兒童及少年之保護，健全其身心發展，並保護兒童及少年之性隱私，故提高最輕本刑，以確保兒童及少年免於遭受任何形式之性剝削，保護其身心健全發展。\n三、本法所稱與性相關而客觀上足以引起性慾或羞恥之圖畫，自應排除虛擬兒童色情之產物，惟利用生成式人工智慧製造之兒童或少年色情仿真圖畫、擬真之兒童或少年色情圖畫，以及以真實存在之兒童或少年為創作背景之色情圖畫，因有侵害個人法益之虞，影響特定兒童或少年之名譽或隱私，仍有處罰之必要，是故，本法所稱之圖畫，應以生成式人工智慧製造、擬真繪製或以真實存在之兒童或少年為創作背景之色情圖畫為限，於此範圍外之虛擬兒童色情創作產物，則應採取明確可行之防護措施，限制兒童及少年接觸、瀏覽，以確保其身心得以健全發展。"},{"bill":"202110043530000","text":"重製、散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖重製、散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣、支付對價而持有或觀覽前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n犯本條之罪，而違反個人資料保護法，如洩露被害人個人資料、姓名、出生年月日、住居所、學校、職場及其他足資識別其身分之資料者，加重其刑至二分之一。","note":"一、兒少性剝削影像從製造、散布，到觀覽、下載，已成犯罪鏈，且隨數位技術發展，受害範圍持續擴大。刑法歷經112年修正，明定未經他人同意，無故重製、散布、播送、交付、公然陳列，或以他法供人觀覽其性影像者，將處五年以下有期徒刑，得併科五十萬元以下罰金，爰參酌刑法第三一九條之三，將「重製」兒少性影像納入第一項及第二項，以完善犯罪類型，並提高刑度。\n二、支付對價購買、觀覽兒少性影像者，為強化犯罪鏈之共犯結構，為阻斷金流、自源頭遏止兒少性剝削之犯罪，爰修正第三項，明定支付對價而持有或觀覽行為須受本法規範。\n三、性影像犯罪，常有洩露被害人個人資料之情況，對被害人造成更嚴重的侵害，爰修正第四項前段，完善犯罪樣態，對於此種性影像犯罪加重其刑至二分之一。"},{"bill":"202110044920000","text":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處三年以上七年以下有期徒刑，得併科新臺幣六百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"本條修正理由參照修正條文第三十五條之說明，提升最輕本刑及罰金金額，加重對散布者之罰責。"}],"changed":false,"final":"散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處一年以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖散布、播送、交付或公然陳列而持有前項物品者，處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。販賣前二項性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，亦同。\n第一項及第三項之未遂犯罰之。\n查獲之第一項至第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","finalWhy":null,"review":{"note":"保留，送黨團協商","text":""}},{"no":"第三十九條","current":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","versions":[{"bill":"202110031720000","text":"無正當理由持有兒童或少年之性影像，處二年以下有期徒刑，得併科新臺幣三萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、南韓於「N號房」事件爆發後，對持有未經同意所拍攝之成年人性私密影像設有處三年以下有期徒刑之規範。惟考量兒童及少年色情產品為對受害人虐待之永久紀錄，足以對其未來造成持續性傷害，應加強遏止持有之行為，爰將刑度由一年以下有期徒刑改為處兩年以下有期徒刑，並將最高罰金調升為一百萬，以增嚇阻效果。\n二、配合第五十一條第一項之修正，刪除第二項接受輔導教育之規定，持有兒少性影像應接受輔導教育或身心治療。\n三、其餘未修正。"},{"bill":"202110031740000","text":"無正當理由持有、購買兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上有期徒刑，得併科新臺幣一百萬元以上罰金。\n犯前項之罪者應令其接受十二小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n查獲第一項之圖畫、語音、其他物品及其附著物，不問屬於犯罪行為人與否，沒收之。","note":"一、原條文針對持有性影像部分有罰則，其餘與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，則分第一次查獲及第二次查獲有不同罰則。\n二、為加強保護兒童及少年，應不論持有物是否為影像，屬性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品亦同。\n三、為減少影響兒童或少年身心發展及受性剝削之可能，沒有買賣即無傷害，故增加購買之罰則，購買者與持有者同罰。\n四、原條文僅處一年以下有期徒刑，致使犯罪行為人有緩刑之可能，遠不可及受害者之身心受創，因此提高處三年以上有期徒刑，同時科以高額罰金，以彌受害者之身心修復之可能。\n五、原條文第一次被查獲持有者，得令其接受二小時以上十小時以下之輔導教育，為加強持有、購買者之輔導、性平教育，應於犯罪行為查獲時即接受輔導、性平教育。"},{"bill":"202110032630000","text":"無正當理由持有兒童或少年之性影像，處五年以下有期徒刑、拘役或科或併科新臺幣三十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣五萬元以上三十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣十萬元以上五十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、台灣近年來有高達數千名兒少成為性剝削受害者，自2018年衛福部接獲通報人數突破千人，2022年已高達2,266人，四年間已從千人受害突破超過兩千人，該犯罪行為不但侵害兒少身體隱私，導致兒少身心嚴重受創，兒少受虐的影像在網路上被持續散播，帶給被害人一輩子的夢魘及傷害。現行法令對於製造、散布兒少性剝削影像的行為處罰過輕，社會各界對於持有兒少性剝削影像者認為只處以罰鍰及輔導教育，難以嚇阻。網路誘拐兒少的案件占當前性剝削案件的大宗，犯罪手法包括向兒少索取私密裸露照片、逼迫兒少性交、利用網路遊戲點數或寶物誘騙兒少拍攝私密照，兒少網路失蹤、網路逃家往往是性剝削案件的前身，應提高相關犯罪的刑罰，以保護未成年免於性剝削。遏阻這些對未成年性剝削的犯罪者。\n二、第一、二、三項提高罰則。"},{"bill":"202110032200000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣十萬元以上五十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣三十萬元以上一百五十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、修正第一項之法定自由刑上限自有期徒刑一年提高至三年，得併科罰金之金額自3萬元以上30萬元以下提高至100萬元以下，且不得處以拘役或單科處罰金以生嚇阻之效。\n二、修正第二項第一次被查獲持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之行為之罰鍰自1萬元以上10萬元以下提高為10萬元以上50萬元以下，以生嚇阻之效。\n三、修正第三項第二次以上被查獲持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之行為之罰鍰自2萬元以上20萬元以下提高為30萬元以上150萬元以下，以生嚇阻之效。\n四、第四項未修正。"},{"bill":"202110033060000","text":"無正當理由持有及購買兒童或少年之性影像，處三年以上十年以下有期徒刑、拘役或科或併科新臺幣三十萬元以上三百萬元以下罰金。\n無正當理由持有及購買兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、現行針對無正當理由持有兒少性剝削影像者，本條刑罰與受害人遭受的長期心理傷害相比，無法比擬，顯示其對兒少保護認知皆顯有不足，且有需求就會有供給，導致性剝削製品供需關係得以存續。為降低持有機會，有效嚇阻犯罪行為發生，以減少後續可能對兒少帶來傷害之風險。\n二、爰修正現行規定，針對性影像持有人過購買人，以《中華民國刑法》第三十條幫助他人實行犯罪行為者，為幫助犯的方式作處理，增加刑罰強度，刑責提高至3年以上10年以下有期徒刑，並提高相關罰金，以遏止及剷除這種犯罪產業鏈。"},{"bill":"202110033090000","text":"無正當理由持有兒童或少年之性影像，處一年以上三年以下有期徒刑，得併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、本條所欲規範者，並非侵害特定兒童或少年個人利益之行為，而係避免不特定兒童及少年之個人利益受侵害之危險，以達成防制、消弭以兒童或少年為性剝削對象之國家重大公益目的。爰參酌德國刑法第一百八十四條對於單純持有兒童或少年色情刊物處三年以下有期徒刑；奧地利刑法亦同，爰修正第一項之法定刑度，以符合罪刑相當原則。\n二、第二、三、四項均未修正。"},{"bill":"202110033180000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役，並併科新臺幣三十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣五萬元以上三十萬元以下罰鍰，並得令其接受十小時之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣十萬元以上一百萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收並於判決確定後銷毀之。","note":"一、無正當理由持有兒少性影像者，取消單純科罰金之處罰，改為最輕為拘役，且併科之罰金提高。\n二、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110034540000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役，併科新臺幣三十萬元以上三百萬元以下罰金，並公布姓名及照片。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣五萬元以上五十萬元以下罰鍰，並得令其接受五小時以上十五小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之，並公布姓名及照片。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣十萬元以上一百萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收並於判決確定後銷毀之。","note":"一、無正當理由持有兒少性影像者，提高刑度及取消單純科罰金之處罰，改為最輕為拘役，且併科之罰金提高，同時公布其姓名及照片。\n二、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110033790000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n購買兒童或少年之性影像或與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n查獲之第一項、第三項及第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、增訂第四項規定，將購買兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者與單純無正當理由持有者區別，由於購買之行為惡性重大，故比照同法第三十六條拍攝、製造之刑度為一年以上七年以下有期徒刑，並得併科新台幣一百萬元以下罰金。\n二、非法色情平台經常係由平台經營者、拍攝製造之內容提供者及購買性影像之會員三方組成產業鏈，三者缺一不可，若無購買行為，內容提供者既無利潤亦無動機繼續拍攝製造，足顯購買之行為對於性影像傳播舉足輕重，惡性並未較拍攝製造之行為輕微。爰提案修正獨列購買行為之刑度，並比照拍攝製造刑度。"},{"bill":"202110034030000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"修正第三十九條對於無正當持有兒童或少年之性影像，自原先處一年以下有期徒刑，增加至處三年以下有期徒刑，另現行對於所處拘役或科或併科罰金之規定則不變更。"},{"bill":"202110034460000","text":"無正當理由持有兒童或少年之性影像，處一年以上五年以下有期徒刑、拘役或科或併科新臺幣三十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣五萬元以上三十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣十萬元以上五十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"有鑑於網路兒少性剝削事件頻傳，現行法刑責嚇阻效果不足，爰提高本條持有兒童或少年之性影像之法定刑度，期提升嚇阻效果，以收杜絕兒少性犯罪之效果。"},{"bill":"202110034190000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並令其接受十小時以上二十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"為強化對兒少的保護，杜絕國人無正當理由持有兒童或少年之性影像，爰修正本條第二項，強制要求無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品持有者，均需接受輔導教育，並將接受輔導教育時間增加為十小時以上二十小時以下，以強化輔導教育之功效。"},{"bill":"202110034150000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n支付對價犯第一項及第二項之罪者，依各該條項之規定，加重其刑至二分之一。","note":"考量市場供需為促使兒少性影像市場之主因，目前針對以對價關係取得兒少性影像之行為人，並未訂定相對應之罰則，輕忽購買者促成兒少性影像市場之狀況，爰新增本條第五項之規定，明定支付對價取得兒少性影像或與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之行為人，加重其刑至二分之一。"},{"bill":"202110034580000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役，得併科新臺幣十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、觀諸各國立法，德國法上之持有行為可處三年以下有期徒刑；美國法可處十年以下有期徒刑，我國現行法僅一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金之規定顯然過低。\n二、爰修正本條規定，無正當理由持有者，處三年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。"},{"bill":"202110034000000","text":"無正當理由持有兒童或少年之性影像，處二年以下有期徒刑、拘役或科或併科新臺幣六萬元以上六十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣二萬元以上二十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣三萬元以上三十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、實務上，兒童或少年心智尚未成熟，易一時自行拍攝、製造性影像或猥褻行為之語音等，並誤信他人而予以對外傳送，造成此類資訊在網路流傳，倘若無正當理由持有該性影像、語音，都將對兒童或少年被害人造成巨大的身心傷害。為強化兒童及少年之保護，健全其身心發展，並保護兒童及少年之性隱私，爰調高無正當理由持有兒童或少年性影像之刑度為二年以下有期徒刑，並調高罰金額度為新臺幣六萬元以上六十萬元以下；無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，第一次被查獲，處新臺幣二萬元以上二十萬元以下罰鍰，第二次以上被查獲，處新臺幣三萬元以上三十萬元以下罰金。\n二、查本法2023年之修正，將兒童或少年色情圖畫含括漫畫、繪畫等虛擬兒童色情產物，並假設持有虛擬兒童色情圖畫對慾望之刺激具關聯性，觀看後可能採取實際行動傷害兒童或少年之行為；惟此假設欠缺實證研究，未考慮單純持有者卻未犯下相關犯行之人，亦欠缺對少數文化族群言論表現或資訊流通之保障，顯有未當，且本法立法之意旨，係為防制真實存在之兒童或少年遭受任何形式之性剝削，保護其身心健全發展，故以刑罰處罰之範圍，仍應以實際受侵害之兒童或少年為限。\n三、爰此，本法所稱與性相關而客觀上足以引起性慾或羞恥之圖畫，自應排除虛擬兒童色情之產物，惟利用生成式人工智慧製造之兒童或少年色情仿真圖畫、擬真之兒童或少年色情圖畫，以及以真實存在之兒童或少年為創作背景之色情圖畫，因有侵害個人法益之虞，影響特定兒童或少年之名譽或隱私，仍有處罰之必要，是故，本法所稱之圖畫，應以生成式人工智慧製造、擬真繪製或以真實存在之兒童或少年為創作背景之色情圖畫為限，於此範圍外之虛擬兒童色情創作產物，則應採取明確可行之防護措施，限制兒童及少年接觸、瀏覽，以確保其身心得以健全發展。"},{"bill":"202110033910000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n以對價取得存取上開物品電磁紀錄之權利者，以持有論。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、新增第四項規定，因應科技發達和資訊傳遞的發展，色情產業之營運模式，以對價取得存取兒童或少年性影像及相類物品電磁紀錄之權利者，以持有論之。\n二、原第四項規定，因新增第四項規定，修正為第五項。"},{"bill":"202110034400000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"理由同修正條文第三十二條說明，惟考量無故持有之行為態樣繁多，僅提高最重本刑，以加重對散布者之處罰。"},{"bill":"202110034490000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"性剝削加害人經常透過交換已持之違法兒少影像，取得更多違法製品，促使性剝削製品之供需關係持續，對被害人造成多次之傷害，故針對無正當理由持有兒童或少年之性影像之犯行，提高其刑度，以增加嚇阻犯罪之效果。"},{"bill":"202110034280000","text":"無正當理由持有兒童或少年之性影像，處三年以上十年以下有期徒刑，得併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"為保障未成年權益，防止未成年受性剝削之害，目前刑度不足以因應社會變遷以及實務需求，針對有期徒刑予以加重，第一項之有期徒刑，由「一年以下」修正為「三年以上十年以下」。"},{"bill":"202110034230000","text":"無正當理由持有兒童或少年之性影像，處二年以下有期徒刑、拘役或科或併科新臺幣十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處一年以下有期徒刑、拘役或科或併科新臺幣六萬元以上六十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、鑒於近來網路偷拍論壇販售予會員未成年性影像等類似事件頻傳，購買非法性影像之人，無異於加害人，無形中促成兒少性剝削之惡劣犯行，倘未加以重罰，難以遏止性剝削產業鏈之形成。\n二、無正當理由持有兒童或少年之性影像或與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，其惡行均已難謂輕微，且除德國於109年7月修法時將最低刑期自6個月提高至1年，最高刑期則提升至15年外，在美國，對單純持有的初犯，已可10年以下徒刑，累犯則應加重刑罰，顯見我國對於此類犯罪行為之刑事處罰猶嫌過輕，難收遏阻之效。為此，爰就無正當理由持有兒童或少年之性影像或猥褻物品之犯罪行為，分別加重本條之刑事處罰，以遏止數位性犯罪犯罪產業鏈之形成，並預防加害者重複犯罪。"},{"bill":"202110036030000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n以金錢或對價關係取得兒童或少年之性影像者，處五年以下徒刑，併科新臺幣二百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、新增第二項。\n二、鑑於近年網路上出現部分網站或論壇，要求行為人以金錢或其他性影像之對價方式，始得取得其他兒童或少年之性影像，而以金錢或其他對價方式取得兒童或少年之性影像之行為樣態較單純持有更為嚴重，提供相關拍攝、製造兒童或少年之性影像之行為人金錢來源，使其犯罪規模擴大，造成更多兒童或少年受害，爰增列處罰以金錢或對價關係取得兒童或少年之性影像行為人，藉以杜絕性剝削產業鏈，減少兒童或少年受害。"},{"bill":"202110036480000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金，同時公布姓名及照片，並依性侵害犯罪防治法第三十一條之規定接受身心治療、輔導或教育。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，其附著物、圖畫及物品不問屬於持有人與否，沒入之，同時公布姓名及照片，並依性侵害犯罪防治法第三十一條之規定接受身心治療、輔導或教育。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金，並依性侵害犯罪防治法第三十一條之規定接受身心治療、輔導或教育。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、修正第一項至第三項。\n二、參照「性侵害犯罪防治法」，對於引誘拍攝、強迫拍攝兒少性影像或無正當理由持有兒少之性影像等新興數位犯罪行為施以身心治療、輔導或教育；同時參考美國梅根法案，為遏止犯罪，對兒少進行影像等新興數位犯罪者，應公布姓名及照片。\n三、因參照「性侵害犯罪防治法」施以身心治療、輔導或教育，爰刪除並得令其接受二小時以上十小時以下之輔導教育等規定。"},{"bill":"202110036570000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n以金錢或對價關係取得兒童或少年之性影像者，處五年以下有期徒刑，併科新臺幣二百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、新增第二項。\n二、鑑於近年網路平台或論壇，出現以金錢或其他性影像之對價方式，以取得兒少之性影像之交易模式，而此購買行為樣態較單純持有更加嚴重，除提供拍攝、製造兒少性影像之行為人金錢來源，也使兒少性剝削組織犯罪化，爰增列以購買或對價關係取得兒童或少年之性影像行為人，藉以杜絕兒少性剝削產業鏈。"},{"bill":"202110036660000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"無正當理由持有兒少性剝削影像者，顯示其對兒少保護、尊重他人、被害人處遇、性別平等意識等方面皆顯有不足，更無視兒少性影像對兒少造成之傷害，故無論被查獲之次數為何，皆已實際成為兒少性剝削過程中的一環，爰修正本條，提高罰則。"},{"bill":"202110036720000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"因應近期我國「創意私房論壇」以組織性及會員制方式，販售大量未成年人性影像，故針對持有兒童或少年性影像，現有刑度恐無法給予加害人相對應之懲罰，參酌德國《刑法》、韓國《性暴力犯罪處罰特別法》規定，爰修正第一項為三年以下有期徒刑，以提高刑罰嚇阻力。"},{"bill":"202110036730000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣三十萬元以上三百萬元以下罰金，並公布姓名與相片於主管機關網站，並供民眾查詢。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣三萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之，並公布姓名與相片於主管機關網站，並供民眾查詢。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣六萬元以上三十萬元以下罰金，並得令其接受四小時以上十小時以下之輔導教育。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、無正當理由持有兒童或少年之性影像，亦為此類犯行之催化劑，故參考美國「性犯罪者資訊公開法」（俗稱梅根法案）之相關規定，故為遏止犯行者一再犯罪，應將犯行者之姓名及照片，公布於主管機關網站，並供民眾查詢。\n二、除公開犯行者之姓名及照片，亦應提高刑期與罰金額度，加強防範相關犯行。\n三、爰提案修正與增訂本條第一項、第二項及第三項相關文字。\n四、第四項未修正。"},{"bill":"202110037440000","text":"無正當理由持有兒童或少年之性影像，處一年以上三年以下有期徒刑、拘役或科或併科新臺幣十萬元以上五十萬元以下罰金。\n無正當理由，故意下載兒童或少年之性影像，處一年以上三年以下有期徒刑、拘役或科或併科新臺幣十萬元以上五十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣三萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣五萬元以上五十萬元以下罰金。\n查獲之第一項、第二項及第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、提高第一項刑度及罰金至一年以上三年以下有期徒刑、十萬元以上五十萬元以下。\n二、現行法規並未對下載兒少性影像有明確刑罰及罰金，參照《中華民國刑法》第十三條「故意」之刑法概念，當檢察或警察機關執法發現其有下載情事兒少性影像，應有刑罰，爰增訂第二項。\n三、鑒於網路下載樣態多元，故以無正當理由、明知內容且下載作為行為要件，刑度與罰金與第一項同。\n四、提高第三項罰鍰，第一次查獲處新台幣三萬以上至十萬以下罰鍰。\n五、提高第四項罰鍰，第二次以上查獲處五萬元以上五十萬元以下罰金。\n六、因項次調整而增修第五項文字。"},{"bill":"202110037550000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑，得併科新臺幣三萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、南韓於「N號房」事件爆發後，對持有未經同意所拍攝之成年人性私密影像設有處三年以下有期徒刑之規範。針對兒少性剝削內容，並另訂有《兒童及少年性保護法》第十一條第五項規定，針對購買或明知為兒少性剝削內容而持有者，處一年以上有期徒刑。此外，德國刑法第一百八十四條對於單純持有兒童或少年色情刊物則處三年以下有期徒刑，奧地利刑法亦同。\n二、綜上，考量兒童及少年性剝削製品，於網路空間之流竄散布容易，且持有者常藉此進一步為誘拐兒少之行為，具擴大兒少性自主法益之危害，且加害者間亦常見交換獲取更多相關製品之行為，相關紀錄之留存對受害人往往造成精神烙印，足以對其未來造成持續性傷害，應加強遏止持有之行為，爰將刑度由一年以下有期徒刑改為處三年以下有期徒刑，並將最高罰金調升為一百萬，以增嚇阻效果。\n三、其餘未修正。"},{"bill":"202110037450000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣九萬元以上九十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣六萬元以上六十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"為嚴格打擊兒童或少年性影像之拍攝與製造，提高此類犯罪行為之最低刑度及罰金，爰提案修正，提高本條第一項、第二項及第三項之刑度。"},{"bill":"202110038820000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n明知性影像有第三十三條第一項、第三十四條第一項至第二項、第三十五條第一項至第二項、第三十六條第二項至第三項、第三十八條第三項之情形而支付對價犯前項之罪者，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n明知性影像有第三十七條之情形而支付對價犯前項之罪者，加重其刑二分之一。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、對本條所規範之犯罪樣態，查過往實務上有因朋友轉傳之類被動取得遭裁罰之情形，爰在第一項之外增列第二項及第三項，就明知涉及性剝削犯罪且付費購買之狀況另定處罰。\n二、爰增訂第二項，就：1.明知所持有之性影像之拍攝製成有外力介入，包括經人引誘、媒介或強迫脅迫而製成：如於影片標題或網頁之說明上載明影片為真實拍攝之性侵害影像以誘使人購買下載。2.付費購買：因購買之行為會提供利益為誘因，助長性剝削犯罪發生。3.所持有性影像所涉及之性剝削犯罪在本條例已加重處罰：性剝削犯罪也有輕重之別。故對持有更嚴重性剝削犯罪之性影像加重處罰。\n三、付費購買有助長兒少性剝削犯罪之虞。故第二項之刑度參照本條例第四十條。\n四、舉例而言，當網站以文字標註所提供之兒少性影像為真實且包括強制性交、關押虐待、以藥物致喪失神智等狀況，行為人仍付費購買而持有時，依第二項加重處罰之。\n五、為杜絕付費購買性影像之行為助長使兒童死亡、重傷犯罪之發生，爰增訂第三項。"},{"bill":"202110039310000","text":"無正當理由持有或觀覽兒童或少年之性影像，處二年以下有期徒刑、拘役或科或併科新臺幣六萬元以上六十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣二萬元以上二十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有或觀覽兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣三萬元以上三十萬元以下罰金。\n支付對價持有第一項至第三項性影像、圖畫、語音或其他物品者，加重其刑二分之一。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、如色情網站僅提供會員單次線上觀賞，是否適用「持有」兒少性影像之定義，認定不明。故明定「觀賞」樣態入法。\n二、無正當理由持有及觀賞兒少性影像，即是加入犯罪結構，參酌各國法制皆嚴懲不貸，如美國最高可處十年有期徒刑。我國現行法規刑度不足，故修正提高，以達嚇阻犯罪之效。\n三、購買兒少性影像、其他足以引起性慾之圖畫語音或其他物品，等同資助拍攝製作犯罪者，促使犯罪產業持續壯大，惡性更重，故修法加重其刑。"},{"bill":"202110039410000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役，並併科新臺幣三十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品，第一次被查獲者，處新臺幣五萬元以上三十萬元以下罰鍰，並得令其接受十小時之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品第二次以上被查獲者，處新臺幣十萬元以上一百萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之並於判決確定後銷毀。","note":"一、同第二條第一項第三款文字修正。\n二、無正當理由持有兒少性影像者，取消單純科罰金之處罰，改為最輕為拘役，且併科之罰金提高。\n三、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110039970000","text":"無正當理由持有兒童或少年之性影像，處二年以下有期徒刑，得併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、本條於民國一百一十二年修正時，已參酌日本、德國、奧地利之立法例，惟最終係採刑度最輕之日本法之規定。參酌關於打擊兒童性虐待、性剝削和兒童色情製品的歐盟指令2011/93第五條第二項之規定，獲取或持有兒童或少年之色情製品者，最重應得處以至少一年之有期徒刑，尚高於我國現行規定。\n二、按持有兒童色情物品係考量觀看後可能採取實際行動傷害兒童，故為避免提高對兒童及少年之性剝削犯罪之危險性，爰參考法國刑法第二百二十七條之二十三第四項，對習慣性近用或於線上通訊服務以付費方式換取或以其他任何方式獲取或持有十五歲以下（即該國得同意性行為之年齡）之未成年色情製品，處五年以下有期徒刑，併科七萬五千歐元罰金。此刑度與同條第一項關於意圖散布而錄製或傳輸未成年色情製品，以及第二項以任何方式提供、公然陳列或散布或進出口此類製品，皆科以相同刑責。甚至於該條第三項，於以電子通訊網路散布給不特定之公眾時，加重其刑為七年下有期徒刑，併科十萬歐元罰金。而於第五項於組織犯罪之情形，處十年以下有期徒刑，併科五十萬歐元罰金。\n三、承上，並配合本法第三十八條之刑度，爰將持有兒童色情製品之刑度調高至二年以下有期徒刑，並刪除拘役及單純科以罰金之處罰。"},{"bill":"202110039980000","text":"無正當理由支付對價而持有兒童或少年之性影像，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役，得併科新臺幣六萬元以上六十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項、第二項及第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、考量行為人無正當理由支付對價持有兒童或少年性影像，間接促進此類以營利為目的拍攝、製造、散布兒少性影像之情形，嚴重侵害兒少被害人身心創傷，主觀惡性更重。再者，本條例修正條文第三十六條已增訂重製兒少性影像罪，爰參酌韓國兒童與青少年性保護法第十一條規定，增訂第一項規定，無正當理由支付對價而持有兒童或少年之性影像，處一年以上七年以下有期徒刑，得併科新臺幣十萬以上一百萬元以下罰金。\n二、現行第一項移列第二項，性剝削加害人常透過其持有之兒童或少年性剝削製品誘拐兒童或少年，使更多兒童及少年受害，另性剝削加害人間也常透過交換已持有之性剝削製品以獲得更多相關違法製品，同時促使性剝削製品之供需關係存續。二○○○年聯合國訂立之「關於買賣兒童、兒童賣淫和兒童色情製品問題之兒童權利公約任擇議定書」第三條（c）款即明確要求締約國將「製作、分銷、傳送、進口、出口、出售、銷售或擁有第二條所界定之兒童色情製品」納入刑法規範。參酌各國立法例，例如德國刑法第一百八十四條對於單純持有兒童或少年色情刊物處三年以下有期徒刑；奧地利刑法亦同，爰修正第一項，刪除單科罰金刑，並提高刑責及罰金。"},{"bill":"202110039990000","text":"無正當理由持有兒童或少年之性影像，處一年以上三年以下有期徒刑，得併科新臺幣五萬元以上五十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、修正第一項、第二項，其餘未修正。\n二、持有兒少性剝削影像之行為，使特定或不特定多數人得以保存該兒少色情，惟兒少性剝削之記錄將導致被害兒少創傷，亦不利其身心健全發展。持有兒少性影像及相關製品之現象所在多有，顯見現行法之罰則與兒少保護之意旨難以相符。\n三、配合第三十八條刑度之修正，爰將無正當理由持有兒童或少年之性影像之刑度由一年以下有期徒刑提高至兩年以下有期徒刑，並得併科最高新臺幣一百萬元之罰金。\n四、另配合第五十一條第一項之修正，刪除第二項有關「接受輔導教育」之規定，明定持有兒少性相關圖畫、語音或其他物品之行為人，除課予行政罰以外，亦須接受輔導教育或身心治療。"},{"bill":"202110040750000","text":"無正當理由支付對價而持有兒童或少年之性影像，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役，得併科新臺幣六萬元以上六十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項、第二項及第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、考量行為人無正當理由支付對價持有兒童或少年性影像，間接促進此類以營利為目的拍攝、製造、散布兒少性影像之情形，嚴重侵害兒少被害人身心創傷，主觀惡性更重。再者，修正條文第三十六條已增訂重製兒少性影像罪，爰參酌韓國兒童與青少年性保護法第十一條規定，增訂第一項規定，無正當理由支付對價而持有兒童或少年之性影像，處一年以上七年以下有期徒刑，得併科新臺幣十萬以上一百萬元以下罰金，並定明第一項罰金下限。\n二、現行第一項移列第二項，性剝削加害人常透過其持有之兒童或少年性剝削製品誘拐兒童或少年，使更多兒童及少年受害，另性剝削加害人間也常透過交換已持有之性剝削製品以獲得更多相關違法製品，同時促使性剝削製品之供需關係存續。二○○○年聯合國訂立之「關於買賣兒童、兒童賣淫和兒童色情製品問題之兒童權利公約任擇議定書」第三條（c）款即明確要求締約國將「製作、分銷、傳送、進口、出口、出售、銷售或擁有第二條所界定之兒童色情製品」納入刑法規範。參酌各國立法例，例如德國刑法第一百八十四條對於單純持有兒童或少年色情刊物處三年以下有期徒刑；奧地利刑法亦同，爰修正第一項，刪除單科罰金刑，並提高刑責及罰金。"},{"bill":"202110040880000","text":"無正當理由持有兒童或少年之性影像，處二年以下有期徒刑，得併科新臺幣五萬元以上五十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n支付對價而持有兒童或少年性影像者處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、處罰持有兒童或少年性影像之行為係防制兒少色情相關犯罪之核心內涵，為強化兒童及少年之保護，爰提高無正當理由持有兒童或少年性影像之刑度為二年以下有期徒刑，並提高罰金為新臺幣十萬元以上五十萬元以下。\n二、支付對價而持有兒少性影像者，無疑是提高兒少性犯罪的供給意願，為阻斷供需達到遏止兒少性剝削之犯罪，爰增訂第四項。"},{"bill":"202110040950000","text":"無正當理由持有兒童或少年之性影像，處二年以下有期徒刑，得併科新臺幣六萬元以上六十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣二萬元以上二十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣三萬元以上三十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、性剝削加害人常透過其持有之兒童或少年性剝削製品誘拐兒童或少年，使更多兒童及少年受害，另性剝削加害人間也常透過交換已持有之性剝削製品以獲得更多相關違法製品，同時促使性剝削製品之供需關係存續。二○○○年聯合國訂立之「關於買賣兒童、兒童賣淫和兒童色情製品問題之兒童權利公約任擇議定書」第三條（c）款即明確要求締約國將「製作、分銷、傳送、進口、出口、出售、銷售或擁有第二條所界定之兒童色情製品」納入刑法規範。衡酌本條例處罰持有兒童色情物品之立法理由係考量兒童色情圖片對慾望之刺激具關聯性，觀看後可能採取實際行動傷害兒童，為避免兒童及少年遭受任何形式之性剝削，避免觀看兒童或少年性影像之人採取實際行動侵害兒童或少年，提高犯罪之危險性，爰本條所欲規範者，並非侵害特定兒童或少年個人利益之行為，而係避免不特定兒童及少年之個人利益受侵害之危險，以達成防制、消弭以兒童或少年為性剝削對象之國家重大公益目的。爰參酌各國立法例，例如日本對於持有兒童或少年色情物品行為處一年以下有期徒刑；德國刑法第一百八十四條對於單純持有兒童或少年色情刊物處三年以下有期徒刑；奧地利刑法亦同，爰提高無正當理由持有兒童或少年之性影像之刑度為二年以下，並提高罰金額度為新臺幣六萬元以上六十萬元以下。\n二、第一項與第二項移列為第二項及第三項。有關無正當理由持有兒童或少年性交或猥褻行為之圖畫、語音或其他物品者，考量實務上多有因朋友轉傳而誤觸法令遭裁罰之情形，為避免逕處刑罰過苛，並考量觀看、聽聞此類圖晝、語音或其他物品後，仍有進一步侵害兒童或少年之可能，爰於第二項定明無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥行為之圖畫、語音或其他物品，第一次被查獲者，處新臺幣二萬元以上二十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物及物品不問屬於持有人與否，沒入之。至於第二次以上被查獲，已非誤觸法令之情形，爰於第二項定明予以刑事罰。\n三、考量，特定社會情境下，持有兒童色情物品之必要性，例如實務上網際網路防護機構因受理民眾檢舉網路上兒童或少年性影像，因而持有該性影像用以請網路業者移除、下架情形，參考加拿大與荷蘭相關立法例，以科學、教育（如學術研究）、醫療（執行性治療）為正當持有之理由，爰第一項至第三項排除上述正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥行為之圖畫、語音或其他物品之情形。\n四、參酌刑法第二百三十五條第三項規定，將第二項後段有關沒收規定移列為第四項，並修正為第一項及第三項之附著物及物品，不問屬於犯罪行為人與否，沒收之。"},{"bill":"202110040890000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣六萬元以上六十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、修正第一項，為保障我國兒少身心健康發展，避免兒少遭受任何形式之性剝削，任何人皆不得無正當理由持有兒少之性影像。惟近日屢傳出兒少遭犯罪集團誘騙、威脅拍攝性影像，並於網路群組販售被害兒少之性影像；甚至販售被害兒少個人資料，行徑令人髮指。為杜絕可能使兒少遭受性剝削之惡意，調高本項刑責。\n二、第二項及第三項配合第一項修正，酌予調高相關刑責，以落實保障兒少遭受任何形式之性剝削。\n三、第四項未修正。"},{"bill":"202110041390000","text":"無正當理由持有兒童或少年之性影像，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起、刺激或滿足性慾而無藝術性、醫學性或教育性價值而令一般人感覺不堪呈現於眾或不能忍受而排拒之圖畫、語音或其他物品，第一次被查獲者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起、刺激或滿足性慾而無藝術性、醫學性或教育性價值而令一般人感覺不堪呈現於眾或不能忍受而排拒之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣五萬元以上五十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、參酌大法官釋字第六一七號解釋所提供之定義，修正第二項及第三項「羞恥」之定義。\n二、有鑒於兒少性剝削罪愆深重，允宜適度加重罰則，爰修正第二項及第三項規定，加重罰鍰額度。"},{"bill":"202110040850000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、鑒於數位發展快速，實務上出現網路論壇與偷拍集團合作，利用性誘拐、詐騙、網路約會、性交易等方式使兒童及少年發生性行為，取得自拍或偷拍而來的非自願外流性私密影像，再放上論壇。\n二、為強化兒童及少年之保護，健全其身心發展，並保護兒童及少年之性隱私，故提高最輕本刑，以確保兒童及少年免於遭受任何形式之性剝削，保護其身心健全發展。\n三、本法所稱與性相關而客觀上足以引起性慾或羞恥之圖畫，自應排除虛擬兒童色情之產物，惟利用生成式人工智慧製造之兒童或少年色情仿真圖畫、擬真之兒童或少年色情圖畫，以及以真實存在之兒童或少年為創作背景之色情圖畫，因有侵害個人法益之虞，影響特定兒童或少年之名譽或隱私，仍有處罰之必要，是故，本法所稱之圖畫，應以生成式人工智慧製造、擬真繪製或以真實存在之兒童或少年為創作背景之色情圖畫為限，於此範圍外之虛擬兒童色情創作產物，則應採取明確可行之防護措施，限制兒童及少年接觸、瀏覽，以確保其身心得以健全發展。"},{"bill":"202110043530000","text":"無正當理由持有兒童或少年之性影像，處一年以上三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n無正當理由，故意下載兒童或少年之性影像，處一年以上三年以下有期徒刑、拘役或科或併科新臺幣十萬元以上五十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣三萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣五萬元以上五十萬元以下罰金。\n查獲之第一項、第二項及第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"無正當理由持有兒少性剝削影像者，亦屬兒少性剝削過程中的一環，故無論被查獲之次數為何，皆應受相等處罰，爰修正本條，提高罰則。"},{"bill":"202110044920000","text":"無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上五十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"本條修正理由參照修正條文第三十五條之說明，提升最輕本刑及罰金金額，加重對無正當理由持有性影像者之罰責。"}],"changed":true,"final":"無正當理由支付對價而持有兒童或少年之性影像，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。\n無正當理由持有兒童或少年之性影像，處三年以下有期徒刑、拘役，得併科新臺幣六萬元以上六十萬元以下罰金。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由持有兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項、第二項及第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","finalWhy":"一、增訂第一項，參酌韓國兒童與青少年性保護法第十一條規定，將無正當理由支付對價而持有兒童或少年之性影像納入犯罪行為並予以處罰，以減少此類犯罪產業與行為，強化被害人保護。\n二、第二項項次調整，由原第一項移列。另參酌德國及奧地利刑法單純持有兒童或少年色情刊物處三年以下有期徒刑，為利嚇阻及防範該類行為，爰修正刪除單科罰金刑，並提高刑責及罰金。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第三十九條之一","current":null,"versions":[{"bill":"202110033900000","text":"無正當理由購買兒童或少年之性影像，處七年六月以下有期徒刑、拘役或科或併科新臺幣七十五萬元以下罰金。\n無正當理由購買兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，第一次被查獲者，處新臺幣一萬元以上十萬元以下罰鍰，並得令其接受二小時以上十小時以下之輔導教育，其附著物、圖畫及物品不問屬於持有人與否，沒入之。\n無正當理由購買兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品第二次以上被查獲者，處新臺幣二萬元以上二十萬元以下罰金。\n查獲之第一項及第三項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、本條新增。\n二、兒少作為集體，於經濟、知識、社會經驗等多面向皆處弱勢。是故，有心人往往利用與兒少間的權力不對等關係，向其祭出威脅、利誘、欺騙等手段以逞私慾，甚或是購買兒少性影像，致使兒少惶惶不可終日，陷入遭性剝削之恐懼循環。\n三、在資訊如此發達的年代裡，利用網路隱匿性花錢購買、鼓勵製作兒少性影像之不肖人士，所創造傷害乃「快速且廣泛」的。透過網路，兒少性影像很輕易便能夠一次又一次遭轉傳，共犯結構龐大複雜。\n四、是故，購買兒少性影像者，應援引《刑法》第三百四十九條「故買贓物」之罪責罰之，同時考量本法所定購買兒少性影像之犯罪態樣，攸關人之自由、安全與尊嚴等基本權利之減損，爰以「處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金」為基礎，參照本法第三十八條規定，加重其刑至二分之一。\n五、為杜絕兒少性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品遭販售與流傳之歪風，除於本法第三十八條設置對販賣端之懲處機制外，促成兒少性剝削產業鏈得以運轉的買方，亦應有相應罰則。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第四十條","current":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n意圖營利而犯前項之罪者，處五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","versions":[{"bill":"202110033180000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利而犯前項之罪者，處七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。","note":"提高刑責與刑度，增加嚇阻與懲罰力度，意圖營利者因有營利且集團化的趨向，惡行更為重大，因此提高所受本刑七年以上，加重處罰。"},{"bill":"202110034540000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利而犯前項之罪者，處七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。","note":"提高刑責與刑度，增加嚇阻與懲罰力度，針對營利集團化之惡行，加重處罰。"},{"bill":"202110033760000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處一年以上三年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利而犯前項之罪者，處一年以上五年以下有期徒刑，得併科新臺幣五百萬元以下罰金。","note":"提高散布、刊登、傳送或張貼足以使兒童及少年進入危險情境的訊息的處罰，加強對兒童及少年在網路及其他環境中的保護。"},{"bill":"202110036130000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n意圖營利而犯前項之罪者，處五年以下有期徒刑，併科三百萬元以下罰金。","note":"理由同理由同三十二條之說明二，加重營利者刑罰。"},{"bill":"202110034280000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處六月以上五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n意圖營利而犯前項之罪者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","note":"為保障未成年權益，防止未成年受性剝削之害，目前刑度不足以因應社會變遷以及實務需求，針對有期徒刑予以加重：\n一、第一項之有期徒刑，由「三年以下」修正為「六月以上五年以下」。\n二、第二項之有期徒刑，由「五年以下」修正為「一年以上七年以下」。"},{"bill":"202110036660000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以誘拐、引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款、非對價性交或猥褻行為之虞之訊息者，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n意圖營利而犯前項之罪者，處五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","note":"一、網路誘拐指透過網路或其他數位科技與兒少建立關係的過程，促使網路上和現實中和兒少發生性接觸。\n二、參酌網路誘拐的國際模範法，明確指出應將網路誘拐視為一種有別於性剝削的獨立犯罪，並確實將網路誘拐的過程與意圖入罪。積極關注事前預防，將任何傷害扼殺在尚未發生之前。將所有的誘拐行為定為犯罪，以防止對兒少的傷害及剝削，爰修正第一項。"},{"bill":"202110039410000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利而犯前項之罪者，處七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。","note":"提高刑責與刑度，增加嚇阻與懲罰力度，意圖營利者因有營利且集團化的趨向，惡行更為重大，因此提高所受本刑七年以上，加重處罰。"},{"bill":"202110040890000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處一年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利而犯前項之罪者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。","note":"一、修正第一項，為避免兒少遭受任何形式之性剝削，本條第一項規定不得以任何手段散步、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒少遭受本法第二條第一項第一至三款之虞之訊息，為保障兒少權益，爰提高本項刑責。\n二、修正第二項，意圖營利為第一項之行為者，惡性更為重大，亦應調高刑責。"},{"bill":"202110041390000","text":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處三年以下有期徒刑，併科新臺幣三百萬元以下罰金。\n意圖營利而犯前項之罪者，處五年以下有期徒刑，得併科新臺幣五百萬元以下罰金。","note":"為嚴格禁止兒少性剝削事件，並對任何違反本法規定者採取加重罰則之立場，爰拉高第一項及第二項之罰金額度。"}],"changed":false,"final":"以宣傳品、出版品、廣播、電視、電信、網際網路或其他方法，散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n意圖營利而犯前項之罪者，處五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","finalWhy":null,"review":{"note":"保留，送黨團協商","text":""}},{"no":"第四十條之一","current":null,"versions":[{"bill":"202110036660000","text":"十八歲以上之人，透過通訊服務，傳送、散布具性意涵或旨在鼓勵做出具性意涵之訊息予十六歲以下之人，處兩年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n前項所稱具性意涵之訊息包括文字、圖畫、照片、影片、影帶、光碟、電子訊號等材料。","note":"一、本條新增。\n二、為強化本法對網路誘拐兒少，進而對兒少進行性剝削之保護，爰新增本條。\n三、網路誘拐指透過網路或利用電信通訊服務（包含社群媒體）的誘拐行為。誘拐者可能在網路上隨機接觸兒少或刻意挑選符合自己偏好的兒少，透過各種手段降低兒少警戒，進一步取得其信任。待性剝削的目的達成後，誘拐者可能用責罵、威脅、恐嚇、情緒勒索等方式逼迫兒少答應其他要求或持續保持關係。\n四、本條所指具性意涵之訊息包括：訊息的任何一部分與性交、猥褻行為有關；在任何情況下，不管任何人的目的，一個自然人會將之視為具性意涵的內容。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第四十一條之一","current":null,"versions":[{"bill":"202110034040000","text":"以組織形式犯本條例之罪，依各該條項之規定，加重其刑至二分之一。","note":"一、有鑑於不肖人士如欲對兒童及少年行性剝削之罪行，已因相關技術與網路通訊軟、硬體之技術進步，從而極易發展具備串聯及分工性質之組織。\n二、查近年知名國外案例如韓國N號房，以及臺灣如臉書Risu多個社團、創意私房等犯罪情形，皆屬透過組織分工方式，在具備聯絡管理、販售管道管理、對價交付不法內容管理等，所進一步產生對弱勢族群的性私密侵害事實，且過程中透過組織分工的方式，更多有受害者眾多，及不法傳播面向廣泛之嚴重後果。\n三、是以，考量以組織形式所犯對兒童及少年的任何性剝削罪行，其主觀惡性及犯罪影響乃為重大，爰新增兒童及少年性剝削防制條例增訂第四十一條之一條文草案，規範以組織形式犯本條例之罪，依各該條項之規定，加重其刑至二分之一，以期發揮嚇阻之效。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"保留，送黨團協商","text":""}},{"no":"第四十三條","current":"父母對其子女犯本條例之罪，因自白或自首，而查獲第三十二條至第三十八條、第三十九條第一項、第三項之犯罪者，減輕或免除其刑。\n犯第三十一條之罪自白或自首，因而查獲第三十二條至第三十八條、第三十九條第一項、第三項之犯罪者，減輕或免除其刑。","versions":[{"bill":"202110033790000","text":"父母對其子女犯本條例之罪，因自白或自首，而查獲第三十二條至第三十八條、第三十九條第一項、第三項、第四項之犯罪者，減輕或免除其刑。\n犯第三十一條之罪自白或自首，因而查獲第三十二條至第三十八條、第三十九條第一項、第三項、第四項之犯罪者，減輕或免除其刑。","note":"配合第三十九條新增第四項修正。"},{"bill":"202110034280000","text":"父母對其子女犯本條例之罪，因自白或自首，而查獲第三十二條至第三十八條、第三十九條第一項、第三項之犯罪者，得減輕其刑。\n犯第三十一條之罪自白或自首，因而查獲第三十二條至第三十八條、第三十九條第一項、第三項之犯罪者，得減輕其刑。","note":"為保障未成年權益，防止未成年受性剝削之害，目前刑度不足以因應社會變遷以及實務需求，故刪除免除其刑責。"},{"bill":"202110037440000","text":"父母對其子女犯本條例之罪，因自白或自首，而查獲第三十二條至第三十八條、第三十九條第一項、第二項、第四項之犯罪者，減輕或免除其刑。\n犯第三十一條之罪自白或自首，因而查獲第三十二條至第三十八條、第三十九條第一項、第三項之犯罪者，減輕或免除其刑。","note":"配合第三十九條項次調整並酌修文字。"},{"bill":"202110038820000","text":"父母對其子女犯本條例之罪，因自白或自首，而查獲第三十二條至第三十八條、第三十九條第一項、第三項之犯罪者，減輕或免除其刑。\n犯第三十一條之罪自白或自首，因而查獲第三十二條至第三十八條、第三十九條第一項至第三項、第五項之犯罪者，減輕或免除其刑。","note":"配合第三十九條之修訂，酌予調整文字。"}],"changed":true,"final":"父母對其子女犯本條例之罪，因自白或自首，而查獲第三十二條至第三十八條、第三十九條第一項、第二項、第四項之犯罪者，減輕或免除其刑。\n犯第三十一條之罪自白或自首，因而查獲第三十二條至第三十八條、第三十九條第一項、第二項、第四項之犯罪者，減輕或免除其刑。","finalWhy":"配合第三十九條修正，酌修第一項及第二項有關援引該條次之項次文字。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第四十四條","current":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。","versions":[{"bill":"202110032200000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","note":"修正法定自由刑上限自有期徒刑一年提高至五年，得併科罰金之金額自3萬元以上30萬元以下提高至100萬元以下，且不得處以拘役或單科處罰金以生嚇阻之效。"},{"bill":"202110033090000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為，或兒童或少年之性影像者，處一年以上三年以下有期徒刑，得併科新臺幣三萬元以上三十萬元以下罰金。\n支付對價購買前項觀覽服務或性影像，或取得其會員資格者，亦同。","note":"一、鑒於實務上有透過線上直播、串流或買斷等方式收取費用供人觀看兒童或少年為性交、猥褻行為，或其性影像，爰對於此類行為提高法定刑度，以符合罪刑相當原則，並加強保護兒童及少年免於遭受任何形式之性剝削，維護其身心健全發展，爰修正本條規定。\n二、原第一項缺漏購買之其他行為態樣或情狀，由於購買或付費取得資格得以觀覽兒童或少年為性交或猥褻之行為，或其性影像等服務，無異鼓勵與金援兒少性剝削產業鏈之形成與發展，爰增訂本條第二項規定。"},{"bill":"202110033180000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處六個月以上五年以下有期徒刑、拘役或科或併科新臺幣十萬元以上五十萬元以下罰金。","note":"購買兒少性影像者提高刑責刑度、罰金提高至十萬元以上五十萬元以下。"},{"bill":"202110034540000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處六個月以上五年以下有期徒刑、拘役或科或併科新臺幣二十萬元以上二百萬元以下罰金。","note":"提高購買兒少性影像者刑責刑度、罰金金額。"},{"bill":"202110034030000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為或持有兒童及少年之性影像者，處三年以上十年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金。","note":"一、雖現行法對於持有兒童或少年之性影像，具備有處罰條項依據，然對於透過支付對價所持有兒童或少年之性影像之惡行，亦應獨立再受較重之罰則之評價，以杜絕該等共犯結構擴大以及加大對兒童及少年性剝削之影響。\n二、爰修正第四十四條，規範包含支付對價觀覽兒童或少年為性交或猥褻之行為，以及支付對價持有兒童或少年性影像之行為，皆一併受修正後可處三年以上、十年以下有期徒刑、拘役或科或併科一百萬元罰金。"},{"bill":"202110034630000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為、性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。因而持有者，加重其刑至二分之一。","note":"一、現行本條文針對支付對價觀覽兒童或少年為性交或猥褻之行為者，僅處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金，罰則過輕且定義不明，並讓不肖人士認為有利可圖，故購買者應視為共犯加重處罰。\n二、修正本條文，增訂支付對價觀覽兒童或少年性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者亦屬違反本條之規定。\n三、加重本條之處罰規定，並針對對價持有前述物品者，加重其刑至二分之一。"},{"bill":"202110034400000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處三年以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n支付對價而持有兒童或少年之性影像者，依前項之規定處斷。\n查獲前項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、理由同修正條文第三十二條說明，原條文處罰過輕，考量支付對價恐助長論壇繼續散布非法性影像之惡性，故對於支付對價觀覽之論壇參與者加重處罰。\n二、另於第二項增訂「支付對價而持有兒童或少年之性影像」者，比照第一項觀覽行為處斷，藉此與本法第三十九條之單純持有處罰規定區分，以凸顯支付對價後恐助長論壇繼續散布非法性影像之惡性。\n三、另參酌本法第三十九條第四項，增訂沒收規定。"},{"bill":"202110034280000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處三年以上十年以下有期徒刑，得併科新臺幣三萬元以上三十萬元以下罰金。","note":"為保障未成年權益，防止未成年受性剝削之害，目前刑度不足以因應社會變遷以及實務需求，針對有期徒刑予以加重，由「一年以下」修正為「三年以上十年以下」。"},{"bill":"202110036660000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。","note":"支付對價觀覽兒童或少年為性交、猥褻之行為而支付對價者，不僅在兒少保護、尊重他人、被害人處遇、性別平等意識等方面皆顯有不足，更已實際成為兒少性剝削過程中的一環，爰修正，本條提高罰則。"},{"bill":"202110036720000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","note":"因應近期「創意私房論壇」事件，該論壇以會員付費制度販售未成年性影像，現行刑期恐無法有效遏止加害人，爰比照本條第三十六條及第三十八條之規定，調整為一年以上七年以下之刑度，並得併科一百萬元以下罰金，以求提高刑罰嚇阻力。"},{"bill":"202110037440000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處一年以上三年以下有期徒刑、拘役或科或併科新臺幣十萬元以上五十萬元以下罰金。","note":"配合第三十九條條文修正，使刑度與罰金一致。"},{"bill":"202110037550000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處三年以下有期徒刑，得併科新臺幣三萬元以上一百萬元以下罰金。\n無正當理由故買取得違反第四章規定之網際網路內容提供者之會員資格並有事實足認支付對價取得兒童或少年之性影像者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。","note":"一、鑒於國內線上直播觀看影音方式已屬普遍，而以收取費用供人觀看兒童或少年為性交、猥褻行為，與持有兒少性剝削影像行為相類似，爰對於此類行為，亦隨本法第三十九條修正，調整刑度為三年以下，並將最高罰金調升為一百萬，以提高嚇阻效果，保護兒童及少年免於遭受任何形式之性剝削，及其身心健全發展。\n二、另考量部分業者以付費會員方式，經營販賣兒童及少年性剝削影像製品，有擴大兒少性剝削犯罪之高度危險，付費取得會員資格者，雖未參與本條例之犯罪行為，惟該故意購買行為，已有助長該網站業者集團性犯罪之資力，同時強化性剝削製品之供需關係存續，為避免兒童及少年進一步受侵害之高度危險，且兒童及少年之個人性自主法益亦有特別保護之必要，爰增訂第二項，將故買取得違反第四章規定之網際網路內容提供者之會員資格，於有事實足認支付對價取得兒童或少年之性影像者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。"},{"bill":"202110037450000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處三年以下有期徒刑、拘役或科或併科新臺幣九萬元以上九十萬元以下罰金。\n支付對價而持有兒童及少年之性影像者，依前項之規定處斷。","note":"為確保兒童及少年免於任何形式之性剝削，保護其身心健全發展，增加以支付對價持有影像者為規範對象。"},{"bill":"202110038820000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。\n明知所觀覽之性交或猥褻行為有第三十三條第一項、第三十四條第一項至第二項、第三十五條第一項至第二項、第三十六條第二項至第三項、第三十八條第三項之情形而支付對價犯前項之罪者，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n明知所觀覽之性交或猥褻行為有第三十七條之情形犯前項之罪者，加重其刑二分之一。","note":"一、增訂第二項，就花錢觀覽兒少性交猥褻且明知涉及其他性剝削犯罪時加重處罰。\n二、第二項之要件與罰則依據與第三十九條同。\n三、為杜絕付費觀覽兒少性交猥褻行為助長使兒童死亡、重傷犯罪之發生，爰增訂第三項。"},{"bill":"202110039310000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處三年以下有期徒刑、拘役或科或併科新臺幣九萬元以上九十萬元以下罰金。","note":"付費觀覽兒少性行為，物化兒少以滿足性慾，侵犯性別平等及兒少保護甚巨，故加重其刑。"},{"bill":"202110039410000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處六月以上五年以下有期徒刑、拘役或科或併科新臺幣十萬元以上五十萬元以下罰金。","note":"購買兒少性影像者提高刑責刑度、罰金提高至十萬元以上五十萬元以下。"},{"bill":"202110039970000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處二年以下有期徒刑，得併科新臺幣三萬元以上三十萬元以下罰金。","note":"參酌關於打擊兒童性虐待、性剝削和兒童色情製品的歐盟指令2011/93第四條第四項之規定，故意觀覽兒童色情表演應處最高刑度至少二年之有期徒刑，或於已達兒童同意性行為之年齡時，處至少一年之有期徒刑。按支付對價行為係對兒童及青少年性剝削嚴重之商業行為，且實務上多是透過線上直播方式，參與人數眾多。故系爭行為不僅對受剝削者造成嚴重影響，亦是對相關行為之不當促進與鼓勵。參考同法第三十一條以下規定之刑度，爰調高刑度為二年以下有期徒刑，並刪除拘役及單純科以罰金之處罰。"},{"bill":"202110039980000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為或其性影像者，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。","note":"鑒於數位發展快速，實務上除實體支付對價觀覽兒童或少年為性交或猥褻之行為、透過線上直播方式支付對價觀覽兒童或少年為性交、猥褻行為，考量尚有支付對價觀覽兒少性影像此類行為應予以規範，爰增訂此類行為納入刑事罰，提高刑責與修正條文第三十九條刑責相同，並刪除單科罰金刑。"},{"bill":"202110039990000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，或兒童或少年之性影像者，處三年以下有期徒刑，得併科新臺幣五萬元以上五十萬元以下罰金。","note":"一、付費觀看兒少性行為或性影像，等同鼓勵、間接促成兒少性剝削影像供需市場。\n二、現行條文僅規範付費觀看兒少性行為，未納入付費觀看兒少性影像，若涉及購買觀看性影像之行為，恐無法以本條類推適用。爰明定付費觀看兒少性行為及性影像者，處三年以下有期徒刑，並得併科新臺幣五萬元以上五十萬元以下罰金。"},{"bill":"202110040750000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為或其性影像者，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。","note":"鑒於數位發展快速，實務上除實體支付對價觀覽兒童或少年為性交或猥褻之行為、透過線上直播方式支付對價觀覽兒童或少年為性交、猥褻行為，考量尚有支付對價觀覽兒少性影像此類行為應予以規範，爰增訂此類行為納入刑事罰，提高刑責與修正條文第三十九條刑責相同，並刪除單科罰金刑。"},{"bill":"202110040770000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。支付對價觀覽兒童或少年之性影像者亦同。","note":"增列後段規定，將付費觀看兒童或少年之性影像行為入法處罰。"},{"bill":"202110040880000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處六月以上三年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。\n支付對價觀覽兒童或少年性影像者，處三年以下有期徒刑，得併科新臺幣一百萬元以下罰金。","note":"一、提供觀覽兒少性行為者，已是兒少性剝削過程中的一環，支付對價無疑是提高兒少性犯罪的供給意願，為強化對兒童及少年之保護，爰提高支付對價觀覽兒童或少年為性交或猥褻之行為之刑度為六月以上三年以下有期徒刑，並提高罰金為新臺幣十萬元以上一百萬元以下。\n二、現行處罰支付對價而觀覽兒童或少年為性交、猥褻之行為，僅處罰現場觀看以及直播觀看等行為，未規範支付對價觀看性影像，爰增訂第二項。"},{"bill":"202110040950000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處二年以下有期徒刑，得併科新臺幣六萬元以上六十萬元以下罰金。\n無正當理由取得違反第四章規定之網際網路內容提供者之會員資格，並有事實足認支付對價取得兒童或少年之性影像者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。","note":"一、國內線上直播觀看影音方式已屬普遍，而以收取費用供人觀看兒童或少年為性交、猥褻行為，與持有兒少性剝削影像行為相類似，爰對於此類行為，亦隨本法第三十九條修正，調整刑度為二年以下，並將最高罰金調升為六十萬，以提高嚇阻效果，保護兒童及少年免於遭受任何形式之性剝削，及其身心健全發展。\n二、另「創意私房」以付費會員制度及韓國「N號房事件」以經營聊天室方式播觀兒少性剝削影像之行為樣態，對無正當理由取得之付費及非付費之會員資格者，雖未參與本條例之犯罪行為，惟該故意申請成為會員之行為，卻有助長該網站業者集團性犯罪，有擴大兒少性剝削犯罪之高度危險及強化性剝削製品之供需關係，為杜絕兒童及少年進一步受侵害之高度危險，且兒童及少年之個人性自主法益亦有特別保護之必要，爰增訂第二項，違反第四章規定之網際網路內容提供者之會員資格，於有事實足認支付對價取得兒童或少年之性影像者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。"},{"bill":"202110040890000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處一年以上五年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。","note":"支付對價觀覽兒少性影像，助長兒少遭性剝削之風險，爰調高本條罰則。"},{"bill":"202110041390000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處一年以下有期徒刑，併科新臺幣五萬元以上五十萬元以下罰金。","note":"為嚴格禁止兒少性剝削事件，並對任何違反本法規定者採取加重罰則之立場，爰提高本條刑度為不得拘役或科罰金，並拉高罰金額度。"},{"bill":"202110040850000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處三年以上五年以下有期徒刑、得併科新臺幣三百萬元以下罰金。\n支付對價而持有兒童或少年之性影像者，依前項之規定處斷。\n查獲前項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。","note":"一、鑒於數位發展快速，實務上出現網路論壇與偷拍集團合作，利用性誘拐、詐騙、網路約會、性交易等方式使兒童及少年發生性行為，取得自拍或偷拍而來的非自願外流性私密影像，再放上論壇。\n二、為強化兒童及少年之保護，健全其身心發展，並保護兒童及少年之性隱私，故提高最輕本刑，以確保兒童及少年免於遭受任何形式之性剝削，保護其身心健全發展。\n三、本法所稱與性相關而客觀上足以引起性慾或羞恥之圖畫，自應排除虛擬兒童色情之產物，惟利用生成式人工智慧製造之兒童或少年色情仿真圖畫、擬真之兒童或少年色情圖畫，以及以真實存在之兒童或少年為創作背景之色情圖畫，因有侵害個人法益之虞，影響特定兒童或少年之名譽或隱私，仍有處罰之必要，是故，本法所稱之圖畫，應以生成式人工智慧製造、擬真繪製或以真實存在之兒童或少年為創作背景之色情圖畫為限，於此範圍外之虛擬兒童色情創作產物，則應採取明確可行之防護措施，限制兒童及少年接觸、瀏覽，以確保其身心得以健全發展。"},{"bill":"202110043530000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處一年以上三年以下有期徒刑、拘役或科或併科新臺幣十萬元以上五十萬元以下罰金。","note":"支付對價觀覽兒童或少年為性交、猥褻之行為而支付對價者，不僅在兒少保護、尊重他人、被害人處遇、性別平等意識等方面皆顯有不足，更已實際成為兒少性剝削過程中的一環，爰修正，本條提高罰則。"},{"bill":"202110044920000","text":"支付對價觀覽兒童或少年為性交或猥褻之行為者，處三年以下有期徒刑、拘役或科或併科新臺幣三萬元以上五十萬元以下罰金。","note":"本條修正理由參照修正條文第三十五條之說明，提升最輕本刑及罰金金額，加重對支付對價觀覽兒童或少年為性交或猥褻之行為者之罰責。"}],"changed":true,"final":"支付對價觀覽兒童或少年為性交或猥褻之行為或其性影像者，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。","finalWhy":"鑒於數位發展快速，實務上除實體透過線上直播方式支付對價觀覽兒童或少年為性交或猥褻之行為之外，尚有支付對價觀覽兒少性影像行為，爰增訂納入此類犯罪行為處罰樣態，並參酌第三十九條修正提高刑責，同時刪除單科罰金刑。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第四十四條之一","current":null,"versions":[{"bill":"202110037440000","text":"無正當理由，故意觀覽兒童或少年為性交或猥褻之行為或性影像者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。","note":"一、本條新增。\n二、查第四十四條立法理由，係為因應網路直播兒少猥褻或性交行為並供人付費觀覽而訂，然未規範於線上觀覽兒少性影像行為。\n三、現行法規對於無對價關係觀覽兒少性影像並未有規範。為杜絕網路觀覽兒少觀覽行為，健全兒少身心發展，並參考《中華民國刑法》第十三條故意之刑法概念，特立此法。"},{"bill":"202110043530000","text":"無正當理由，故意觀覽兒童或少年為性交或猥褻之行為或性影像者，處一年以下有期徒刑、拘役或科或併科新臺幣三萬元以上三十萬元以下罰金。","note":"一、本條新增。\n二、查第四十四條立法理由，係為因應網路直播兒少猥褻或性交行為並供人付費觀覽而訂。\n三、現行法規對於無對價關係觀覽兒少性影像並未有規範。為杜絕網路觀覽兒少觀覽行為，健全兒少身心發展，並參考《中華民國刑法》第十三條故意之刑法概念，特增訂立本條。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第四十五條","current":"使兒童或少年從事坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處新臺幣二十萬元以上二百萬元以下罰鍰，並令其限期改善；屆期未改善者，由直轄市、縣（市）主管機關移請目的事業主管機關令其停業一個月以上一年以下。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處一年以下有期徒刑，得併科新臺幣三十萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處三年以上五年以下有期徒刑，得併科新臺幣一百五十萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","versions":[{"bill":"202110033180000","text":"使兒童或少年從事坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處新臺幣一百萬元以上五百萬元以下罰鍰，並令其一個月內限期改善；屆期未改善者，由直轄市、縣（市）主管機關移請目的事業主管機關依法勒令停業。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處三年以上十年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處五年以上十二年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","note":"一、提高刑責刑度，兒少若涉及色情伴遊、陪酒等，限期一個月內改善，並新增逾期不改善者直接勒令停業，遏止利用未成年兒童陪酒坐檯之歪風。\n二、以強暴、脅迫等違反本人意願之行為，加重至五年以上十二年以下，且併科三百萬元罰金。"},{"bill":"202110034540000","text":"使兒童或少年從事坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處新臺幣五十萬元以上五百萬元以下罰鍰，並令其限期改善；屆期未改善者，由直轄市、縣（市）主管機關移請目的事業主管機關依法令其勒令停業。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處三年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處五年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","note":"一、提高刑責刑度，並新增逾期不改善者直接勒令停業，遏止利用未成年兒童陪酒坐檯之歪風。\n二、以強暴、脅迫等違反本人意願之行為，加重其刑，得併科三百萬元罰金。"},{"bill":"202110036130000","text":"使兒童或少年從事坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處新臺幣二十萬元以上二百萬元以下罰鍰，並令其限期改善；屆期未改善者，由直轄市、縣（市）主管機關移請目的事業主管機關令其停業一個月以上一年以下。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處五年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","note":"一、為使相關行為得到更加有效遏制及嚇阻，爰此加重相關行為罰則，以確保全體兒少身心狀況發展健全。\n二、由於第二項之行為比起第一項更加嚴重，相關罰則不應低於第一項，爰此修正。"},{"bill":"202110034280000","text":"使兒童或少年從事坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處新臺幣二十萬元以上二百萬元以下罰鍰，並令其限期改善；屆期未改善者，由直轄市、縣（市）主管機關移請目的事業主管機關令其停業一個月以上一年以下。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處一年以上七年以下有期徒刑，得併科新臺幣三十萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處五年以上十二年以下有期徒刑，得併科新臺幣一百五十萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","note":"為保障未成年權益，防止未成年受性剝削之害，目前刑度不足以因應社會變遷以及實務需求，針對有期徒刑予以加重：\n一、第二項之有期徒刑，由「一年以下」修正為「一年以上七年以下」。\n二、第三項之有期徒刑，由「三年以上五年以下」修正為「五年以上十二年以下」。"},{"bill":"202110039410000","text":"使兒童或少年從事坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處新臺幣一百萬元以上五百萬元以下罰鍰，並令其一個月內限期改善；屆期未改善者，由直轄市、縣（市）主管機關移請目的事業主管機關依法勒令停業。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處三年以上十年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處五年以上十二年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","note":"一、提高刑責刑度，兒少若涉及色情伴遊、陪酒等，限期一個月內改善，並新增逾期不改善者直接勒令停業，遏止利用未成年兒童陪酒坐檯之歪風。\n二、以強暴、脅迫等違反本人意願之行為，加重至五年以上十二年以下，且併科三百萬元罰金。"}],"changed":false,"final":"使兒童或少年從事坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處新臺幣二十萬元以上二百萬元以下罰鍰，並令其限期改善；屆期未改善者，由直轄市、縣（市）主管機關移請目的事業主管機關令其停業一個月以上一年以下。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處一年以下有期徒刑，得併科新臺幣三十萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為者，處三年以上五年以下有期徒刑，得併科新臺幣一百五十萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","finalWhy":null,"review":{"note":"保留，送黨團協商","text":""}},{"no":"第四十五條之二","current":null,"versions":[{"bill":"202110039990000","text":"違反本法經判決有罪確定者，主管機關應公布其姓名、照片、判決日期、判決字號及判決主文。","note":"一、本條新增。\n二、現有《兒童及少年權利保障法》及《性侵害犯罪防治法》均有針對加害人蒐集建立資料庫之相關法源，惟目前尚無針對兒少性剝削犯罪者建立資料庫，僅得於司法院判決書系統公開查閱之。\n三、爰明定違反本法經判決有罪確定者，主管機關得依法公布其姓名、照片及違法事實，統一建立專屬搜尋系統，以利加強犯罪之嚇阻，並防止他人再度受害之可能。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十七條","current":"有下列情形之一，而無正當理由者，由目的事業主管機關處新臺幣六萬元以上六十萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第八條第一項規定，未先行限制瀏覽、移除。\n二、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。","versions":[{"bill":"202110031740000","text":"有下列情形之一，而無正當理由者，由目的事業主管機關處新臺幣一百萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第八條第一項規定，未先行移除。\n二、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。","note":"一、提高原條文第一項罰則。\n二、應即時刪除不當內容，才能防止兒童及少年不當影音所造成之損害再透過網路傳遞擴大。"},{"bill":"202110034460000","text":"有下列情形之一，而無正當理由者，由目的事業主管機關處新臺幣六萬元以上六十萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第八條第一項規定，未先行限制瀏覽、移除。\n二、違反第八條第二項規定，未保留資料一年，或未將資料提供司法或警察機關調查。","note":"第一項第二款配合第八條第二項修正。"},{"bill":"202110033760000","text":"有下列情形之一，而無正當理由者，由目的事業主管機關處新臺幣二十萬元以上五百萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第八條第一項規定，未先行限制瀏覽、移除。\n二、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。","note":"強化網際網路平臺提供者、應用服務提供者及接取服務提供者的責任，要求其積極配合法律規定，對於發現的兒童及少年性剝削內容進行限制瀏覽或移除，並保留資料配合司法或警察機關的調查。"},{"bill":"202110037550000","text":"有下列情形之一，而無正當理由者，由主管機關處新臺幣六萬元以上六十萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第八條第一項規定，未先行限制瀏覽、移除。\n二、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。\n除前項情形外，認網頁資料有第四章之犯罪嫌疑情事，非立即移除該資訊或限制其接取或採取適當之流量管理措施者，他人利益將遭受難以回復之重大損害，或有急迫必要性，為阻止犯罪、危害之發生或避免急迫危險，主管機關得先令限制接取或採取適當之流量管理措施，並於三日內向法院聲請緊急資訊限制令。法院認為不應准許者，應於二十四小時內撤銷之。","note":"一、考量網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者之網頁資料如有本條例第四章之犯罪嫌疑情事，為防範該內容流通擴大對兒童或少年利益危害，或有急迫必要性，為阻止犯罪危害之發生、或避免急迫危險，免處置上緩不濟急，爰參考刑事訴訟法第一百三十三條之二第四項之逕行扣押規定及英國二○二三年通過之線上安全法第一四七條「暫時限制接取令」（interim access restriction orders）規定，於第二項前段明定主管機關得先令限制接取或採取適當之流量管理措施。\n二、為避免行政機關濫用限制接取或流量管理措施，對人民權利造成不必要之侵害，自應於採取相關措施時，依比例原則予以適當之限制，並課以陳報法院進行事後審查之義務，以維程序正義。爰參考本刑事訴訟法第一百三十三條之二第四項之規定，增訂本條第二項後段。\n三、至有關本項增訂之緊急資訊限制令之聲請、准駁、撤銷、救濟及其他相關程序事項，另於本條例施行細則定之，特予敘明。"},{"bill":"202110037450000","text":"有下列情形之一，而無正當理由者，由目的事業主管機關處新臺幣二十萬元以上一百萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第八條第一項規定，未先行移除。\n二、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。","note":"一、第八條規範網際網路業者於知有犯罪嫌疑情事，應先行限制瀏覽或移除網頁資料，並通知警察機關之義務。\n二、本條提高網路平臺業者之責任，應配合即時處置，防止兒少損害再透過網路傳遞擴大。"},{"bill":"202110039980000","text":"有下列情形之一，而無正當理由者，由主管機關處新臺幣六萬元以上六十萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第三條之二第二項規定，拒絕、妨礙或規避。\n二、違反第八條第一項規定，未先行限制瀏覽、移除。\n三、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。","note":"一、考量兒童及少年性剝削犯罪案件與性侵害犯罪案件類似，倘網路業者無正當理由不願配合先行限制瀏覽、移除、下架犯罪網頁資訊，恐造成兒童及少年被害人極大身心傷害，為簡化行政流程，爰第一項修正為由主管機關依法裁處。\n二、考量網路業者倘拒絕、妨礙或規避司法警察、檢察官巡查，會嚴重影響兒童或少年性影像案件司法偵查，爰增訂第二項，定明網路業者無正當理由者拒絕、妨礙或規避時，處以行政裁罰，並得按次處罰、令其限制接取該網站。"},{"bill":"202110040750000","text":"有下列情形之一，而無正當理由者，由主管機關處新臺幣六萬元以上六十萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第三條第七項規定，拒絕、妨礙或規避。\n二、違反第八條第一項規定，未先行限制瀏覽、移除。\n三、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。","note":"一、考量兒童及少年性剝削犯罪案件與性侵害犯罪案件類似，倘網路業者無正當理由不願配合先行限制瀏覽、移除、下架犯罪網頁資訊，恐造成兒童及少年被害人極大身心傷害，為簡化行政流程，爰將裁罰機關修正為主管機關。\n二、考量網路業者倘拒絕、妨礙或規避司法警察、檢察官巡查，會嚴重影響兒童或少年性影像案件司法偵查，爰增訂第一款，定明網路業者無正當理由者拒絕、妨礙或規避時，處以行政裁罰，並得按次處罰、令其限制接取該網站。"}],"changed":true,"final":"有下列情形之一，而無正當理由者，由主管機關處新臺幣六萬元以上六十萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第三條第七項規定，拒絕、妨礙或規避。\n二、違反第八條第一項規定，未限制瀏覽、移除。\n三、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。","finalWhy":"一、為簡化行政流程，加強兒童及少年性剝削案件整體處理效能，修正本條第一項，將裁罰機關修正為主管機關。\n二、為避免網路業者倘拒絕、妨礙或規避網路巡查，嚴重影響兒童或少年性影像案件限制瀏覽或移除，增訂本條第一款，將網路業者無正當理由者拒絕、妨礙或規避者納入裁罰。\n三、第一項第二款「違反第八條第一項規定，未先行限制瀏覽、移除」，為配合第八條第一項已刪除「先行」，故將文字修正為：「違反第八條第一項規定，未限制瀏覽、移除。」。","review":{"note":"修正通過","text":"有下列情形之一，而無正當理由者，由主管機關處新臺幣六萬元以上六十萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次處罰，並得令其限制接取：\n一、違反第三條第七項規定，拒絕、妨礙或規避。\n二、違反第八條第一項規定，未先行限制瀏覽、移除。\n三、違反第八條第二項規定，未保留資料一百八十日，或未將資料提供司法或警察機關調查。"}},{"no":"第五十條","current":"宣傳品、出版品、廣播、電視、網際網路或其他媒體，為他人散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，由各目的事業主管機關處新臺幣五萬元以上六十萬元以下罰鍰。\n各目的事業主管機關對於違反前項規定之媒體，應發布新聞並公開之。\n第一項網際網路或其他媒體若已善盡防止任何人散布、傳送、刊登或張貼使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，經各目的事業主管機關邀集兒童或少年福利團體與專家學者代表審議同意後，得減輕或免除其罰鍰。","versions":[{"bill":"202110033910000","text":"宣傳品、出版品、廣播、電視、網際網路或其他媒體，為他人散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，由各目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n各目的事業主管機關對於違反前項規定之媒體，應發布新聞並公開之。\n第一項網際網路或其他媒體若已善盡防止任何人散布、傳送、刊登或張貼使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，經各目的事業主管機關邀集兒童或少年福利團體與專家學者代表審議同意後，得減輕或免除其罰鍰。","note":"一、媒體具促進社會進步、提供正確資訊之義務，並在資訊傳播上在具社會影響力，在兒童及少年的保護上位於重要的角色，更應善盡保護責任。\n二、為保護兒童及少年身心健康發展及權益，免於性剝削造成之心理嚴重創傷，亦避免鼓勵他人從事對兒童之性剝削行為，爰提案修正，提高本條第一項之刑罰，敦促媒體善盡社會責任。"},{"bill":"202110036730000","text":"宣傳品、出版品、廣播、電視、網際網路或其他媒體，為他人散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，由各目的事業主管機關處新臺幣十萬元以上一百萬元以下罰鍰。\n各目的事業主管機關對於違反前項規定之媒體，應發布新聞並公開之。\n第一項網際網路或其他媒體若已善盡防止任何人散布、傳送、刊登或張貼使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，經各目的事業主管機關邀集兒童及少年福利團體與專家學者代表審議同意後，得減輕或免除其罰鍰。","note":"一、提升罰鍰以加強防治網際網路或其他媒體，進行散布、傳送、刊登或張貼，各種非法兒少性影像、圖畫、語音等物品。\n二、爰提案修正本條第一項相關文字。\n三、第二項及第三項未修正。"}],"changed":false,"final":"宣傳品、出版品、廣播、電視、網際網路或其他媒體，為他人散布、傳送、刊登或張貼足以引誘、媒介、暗示或其他使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，由各目的事業主管機關處新臺幣五萬元以上六十萬元以下罰鍰。\n各目的事業主管機關對於違反前項規定之媒體，應發布新聞並公開之。\n第一項網際網路或其他媒體若已善盡防止任何人散布、傳送、刊登或張貼使兒童或少年有遭受第二條第一項第一款至第三款之虞之訊息者，經各目的事業主管機關邀集兒童及少年福利團體與專家學者代表審議同意後，得減輕或免除其罰鍰。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第五十一條","current":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","versions":[{"bill":"202110031720000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項至第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育或七十二小時之身心治療。\n前項輔導教育或身心治療屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得延長之。輔導教育延長不得逾二十小時，身心治療不得逾二十四小時。\n第一項輔導教育及身心治療之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項之輔導教育或身心治療，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。\n第一項輔導教育及身心治療之內容、程序、期間及其他相關事項，由中央主管機關定之。","note":"一、鑑於兒童及少年性剝削行為人輔導教育辦法中所謂輔導教育，僅為觀念或知識的認知教育，為減少再犯可能性、維護兒少福祉，爰比照性侵害犯罪防制法修正第一項，針對較為嚴重之加害人應接受身心治療。\n二、為落實輔導教育或身心治療之成效，增訂第二項，輔導教育或身心治療屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得經評估後延長輔導教育至多二十小時或身心治療至多二十四小時。\n三、第三項略微修正文字。\n四、增訂第五項有關緩起訴者接受輔導教育及身心治療之相關辦法，由中央主管機關定之。"},{"bill":"202110033790000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項、第四項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"配合第三十九條新增第四項修正。"},{"bill":"202110034190000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施十小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並按次處罰。","note":"為強化對兒少之保護，爰修正輔導教育時間由四小時以上延長為十小時以上，以強化輔導教育之功效。"},{"bill":"202110034630000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第二項、第三十九條第一項、第三項、第四十條或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施八小時以上一百小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"一、於本條增訂犯第三十八條第二項及第四十條之罪，經判決有罪獲緩起訴處分確定者，亦應施以輔導教育。\n二、提高本條輔導教育時數，以確實達到輔導教育導正之效。"},{"bill":"202110033910000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上六萬元以下罰鍰，並得按次處罰。\n犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項至第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，經評估認有施以身心治療之必要者，直轄市、縣（市）主管機關應令其接受身心治療。\n無正當理由不接前項之身心治療者，處新臺幣一萬元以上八萬元以下罰鍰，並得按次處罰。","note":"一、犯本法特定之罪並經判決有罪緩起訴處分確定者，為矯正行為人異常之人格行為及偏差心理，使其接受適當之處遇，爰增訂身心治療之規定。\n二、無正當理由不接受輔導教育或身心治療者，提高罰鍰，以敦促行為人接受相應處遇。"},{"bill":"202110036030000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，經評估認有施以身心治療、輔導或教育之必要者，直轄市、縣（市）主管機關應令其接受身心治療、輔導或教育。\n前項規定，對於犯罪後經驅逐或限令出境者，不適用之。\n第一項之執行期間為三年以下。執行期間屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得延長之，最長不得逾一年；其無繼續執行之必要者，得停止其處分之執行。\n前項經評估認無繼續執行之必要者，於其登記、報到期間，經評估認有施以身心治療、輔導或教育之必要，直轄市、縣（市）主管機關應令其再接受身心治療、輔導或教育；其執行期間應予併計，且不得逾前項執行期間之規定。","note":"一、修正第一項文字。\n二、刪除第二項及第三項。\n三、新增第二項、第三項及第四項。\n四、原先條文僅規範經判決有罪或緩起訴處分確定者應接受四小時以上五十小時以下之輔導教育，然部分行為人可能是因先天性認知失調，僅對兒童或少年產生性慾，即俗稱的「戀童癖」，面對這樣的心理疾病，僅接受輔導教育是無法從根本上阻止行為人再犯，無法從根本上解決對兒童或少年之性犯罪。\n五、爰參考「性侵害犯罪防治法」第三十一條之規定，增列經評估得施以身心治療、輔導或教育，以減少行為人再犯之可能性。"},{"bill":"202110036570000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定，並經評估認有施以身心治療、輔導或教育之必要者，直轄市、縣（市）主管機關應令其接受身心治療、輔導或教育。\n前項規定，對於犯罪後經驅逐或限令出境者，不適用之。\n第一項之執行期間為三年以下。執行期間屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得延長之，最長不得逾一年；其無繼續執行之必要者，得停止其處分之執行。\n前項經評估認無繼續執行之必要者，於其登記、報到期間，經評估認有施以身心治療、輔導或教育之必要，直轄市、縣（市）主管機關應令其再接受身心治療、輔導或教育；其執行期間應予併計，且不得逾前項執行期間之規定。","note":"兒少性犯罪之行為人可能因先天性認知失調，對兒童或少年產生性慾，即俗稱的「戀童癖」，面對此樣態之性犯罪，國外研究顯示再犯率較其他類型犯罪更高，若僅接受輔導教育將無法阻止行為人再犯，爰參考「性侵害犯罪防治法」第三十一條之規定，增列經評估得施以身心治療、輔導或教育，以減少行為人再犯之可能性。"},{"bill":"202110036660000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施八小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰至其參加為止。","note":"考量兒少性剝削防制之根本在於相關教育之落實，爰提高輔導教育之最低時數，並對無正當理由不接受或拒不完成之者，明定可按次處罰「至其參加為止」。"},{"bill":"202110036720000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育，或經直轄市、縣（市）主管機關評估小組評估認有施以身心治療之必要，應令其接受身心治療。\n前項輔導教育、身心治療之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育、身心治療，或拒不完成輔導教育之時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"一、考量針對兒少所為之特定性犯罪，可能出自心理障礙所為，如：戀童傾向。惟現行輔導教育恐無法有效導正行為人，故參酌《性侵害犯罪防治法》有關身心治療之規定，爰修正第一項，新增經地方主管機關評估後，有必要者應令其接受身心治療之規定，以心理層面之輔導及治療措施，改善加害人行為。\n二、修正第二項及第三項，增訂身心治療之規定。"},{"bill":"202110036730000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施八小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育，或拒不完成其時數者，處新臺幣三萬元以上十萬元以下罰鍰，並得按次處罰。","note":"一、對犯行者之輔導教育，亦為防範未來相關犯罪之再發生，是為重要的一環。故應加強並提高輔導教育之時數，且若無正當理由而不接受輔導教育者，亦應提高其罰鍰並得按次處罰。\n二、爰提案修正本條第一項及第三項相關文字。\n三、第二項未修正。"},{"bill":"202110037440000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第二項、第四項、第四十四條或第四十四條之一之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育，必要時並得公布其姓名或名稱。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第三項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"一、配合第三十九條項次調整並酌修文字。\n二、因新增第四十四條之一酌修文字。\n三、參照《兒童及少年福利與權益保障法》第四十九條第一項第十五款及同法第九十七條，對兒少為犯罪之行為者，主管機關於必要時得公布其姓名及名稱，爰於此條第一項修訂公布姓名規定。"},{"bill":"202110037550000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育或七十二小時之身心治療。\n前項輔導教育或身心治療屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得延長之。輔導教育延長不得逾二十小時，身心治療不得逾二十四小時。\n第一項輔導教育及身心治療之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項之輔導教育或身心治療，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。\n第一項輔導教育及身心治療之內容、程序、期間及其他相關事項，由中央主管機關定之。","note":"一、鑑於兒童及少年性剝削行為人輔導教育辦法中所謂輔導教育，僅為觀念或知識的認知教育，為減少再犯可能性、維護兒少福祉，爰比照性侵害犯罪防制法修正第一項，針對較為嚴重之加害人應接受身心治療。\n二、為落實輔導教育或身心治療之成效，增訂第二項，輔導教育或身心治療屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得經評估後延長輔導教育至多二十小時或身心治療至多二十四小時。\n三、第三項及第四項略修正文字。\n四、增訂第五項有關緩起訴者接受輔導教育及身心治療之相關辦法，由中央主管機關定之。"},{"bill":"202110038820000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項至第三項、第五項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第四項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"配合第三十九條之修訂，酌予調整文字。"},{"bill":"202110039310000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施六小時以上七十二小時以下之輔導教育或身心治療。\n前項輔導教育及身心治療之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育或身心治療，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。\n第一項輔導教育及身心治療之內容、程序、期間及其他相關事項，由中央主管機關定之。","note":"依心理學及精神醫學研究，部分兒少性剝削犯罪者可能存在性癖好畸常、性慾疾患、人格障礙等問題，影響其心理狀態和認知能力，故僅進行輔導教育恐難以完整達到教化之效。故參考性侵害犯罪防制法，將身心治療納入處遇選項，並提高教育及治療時數，以期減少再犯可能性。"},{"bill":"202110039370000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪確定者，直轄市、縣（市）主管機關應令其接受輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。\n第一項之輔導教育執行期間為三年以下。執行期間屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得延長之，最長不得逾一年；其無繼續執行之必要者，得停止其處分之執行。","note":"一、因新增有罪判決確定者需接受身心治療或強制治療等相關規定，爰將緩起訴之處遇相關規定移置新增之第五十一條之三。\n二、原規定犯本條所列之罪者，主管機關應對其實施四小時以上五十小時以下之輔導教育，考量輔導教育之目的係為改善受教育者之行為，以降低受教育者之再犯性，維護與提昇個人與社會安全性，故通常須有較長時間觀察與評估，以確定教育成效，故參酌性侵害犯罪防治法相關規定，由教育時數改為執行三年以下之輔導教育，以確保得有效降低受教育者之再犯性，但實際教育時數仍不得低於現行法之四小時。"},{"bill":"202110039970000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育；並得令其接受身心治療及心理輔導。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育、身心治療及心理輔導，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"一、按依本條應接受輔導教育之行為，有部分行為人係基於其身心疾病而可能有再犯之危險。而現行法所規定之輔導教育僅涉及性剝削教育課程或教育宣導內容，對上述行為人難以達到犯罪防治之目的。故參酌性侵害犯罪防治法第三十一條關於身心治療、輔導或教育之規定，爰增訂於主管機關認定有施以身心治療及心理輔導之必要時，應令其接受之，爰修正第一項。\n二、按第一項增訂身心治療與心理輔導二種態樣，若無正當理由而不接受時，亦應處以罰鍰，爰修正第三項。"},{"bill":"202110039980000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第二項、第四項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第三項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"考量修正條文第三十九條已增訂無正當理由支付對價持有兒童或少年性影像犯罪類型，爰配合修正條文第三十九條酌修援引該條之項次。"},{"bill":"202110039990000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項至第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施八小時以上五十小時以下之輔導教育或七十二小時之身心治療。\n前項輔導教育或身心治療之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第二項之輔導教育或身心治療，或拒不完成其時數者，處新臺幣一萬元以上十萬元以下罰鍰，並得按次處罰。","note":"一、修正第一項至第三項。\n二、根據《性侵害犯罪防治法》第三十一條規定加害人具特定情形且經評估認有施以身心治療、輔導或教育之必要者，直轄市、縣（市）主管機關應令其接受身心治療、輔導或教育。\n三、另參考《性侵害犯罪加害人身心治療輔導及教育辦法》第三條針對身心治療及輔導教育之定義，身心治療包含精神治療、心理治療或其他必要之治療；輔導包含心理輔導、行為調整或其他必要之輔導；教育包含認知教育、特殊教育或其他必要之教育。\n四、基於「再犯預防」的思維模式，透過專業工作者企圖改變性犯罪者的認知、行為甚至人格狀態，藉以提升「自我控制」的程度，而達到「防止再犯」為終極性的價值目的。爰修正本條第一項至第三項，明定對犯行者實施輔導教育或身心治療，另針對不接受及拒不完成時數者，罰鍰由新臺幣六千元以上三萬元以下提高至一萬元以上十萬元以下。"},{"bill":"202110040750000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第二項、第四項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第三項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"考量修正條文第三十九條已增訂無正當理由支付對價持有兒童或少年性影像犯罪類型，爰配合修正條文第三十九條酌修援引該條之項次。"},{"bill":"202110040950000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第三項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育或七十二小時之身心認知治療。\n前項輔導教育或身心認知治療屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得延長之，輔導教育最長不得逾二十四小時，身心認知治療不得逾九週。\n第一項輔導教育及身心認知治療之執行，主管機關得協調矯正機關成立評估小組，於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項之輔導教育或身心認知治療，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。\n第一項輔導教育及身心認知治療之評估小組，其組成與評估內容、程序、期間及其他相關事項，由中央主管機關定之。","note":"一、兒童及少年性剝削行為人輔導教育辦法中所謂輔導教育，僅為觀念或知識的認知教育，為減少再犯可能性、維護兒少福祉，爰比照性侵害犯罪防制法修正第一項，針對較為嚴重之加害人應接受身心認知治療。\n二、為落實輔導教育或身心治療之成效，增訂第二項，輔導教育或身心治療屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得經評估後延長輔導教育至多二十四小時。且參酌瑞典社會對兒少性剝削之探討經驗，卡羅林斯卡醫學院（Karolinska Institute）成立線上心理治療計畫，進行九週心理認知治療，協助犯罪行為人了解，學習控制自己的想法與行為，以免傷害孩童。\n三、第三項及第四項略修正文字。\n四、增訂第五項有關緩起訴者接受輔導教育及身心治療之相關辦法，並增訂本條文明定評估小組之相關規定，由中央主管機關定之。"},{"bill":"202110043530000","text":"犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第二項、第四項、第四十四條或第四十四條之一之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施四小時以上五十小時以下之輔導教育，必要時並得公布其姓名或名稱。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第一項或第三十九條第三項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","note":"一、配合第三十九條項次調整並酌修文字。\n二、因新增第四十四條之一酌修文字。\n三、參照《兒童及少年福利與權益保障法》第四十九條第一項第十五款及同法第九十七條，對兒少為犯罪之行為者，主管機關於必要時得公布其姓名及名稱，爰於此條第一項修訂公布姓名規定。"}],"changed":true,"final":"犯第三十六條第三項之罪，經判決有罪確定者，準用性侵害犯罪防治法第三十一條、第三十三條至第三十五條、第四十二條、第四十三條、第五十條及第五十一條規定。\n犯第三十一條第二項、第三十六條第一項、第三十八條第一項、第三十九條第一項、第二項、第四項或第四十四條之罪，經判決有罪或緩起訴處分確定者，直轄市、縣（市）主管機關應對其實施八小時以上五十小時以下之輔導教育。\n前項輔導教育之執行，主管機關得協調矯正機關於犯罪行為人服刑期間辦理，矯正機關應提供場地及必要之協助。\n無正當理由不接受第二項或第三十九條第三項之輔導教育，或拒不完成其時數者，處新臺幣六千元以上三萬元以下罰鍰，並得按次處罰。","finalWhy":"一、衡酌刑法第三百十九條之二第一項之罪以強暴脅迫手段拍攝性影像者已納入準用性侵害犯罪防治法加害人身心治療、輔導或教育、加害人登記報到、查訪及查閱之規定，爰參酌性侵害犯罪防治法第七條第一項規定，增訂第一項，明定對兒童或少年犯第三十六條第三項之罪，經判決有罪確定者，準用性侵害犯罪防治法第三十一條、第三十三條至第三十五條、第四十二條、第四十三條、第五十條及第五十一條規定。\n二、考量修正條文第三十九條增訂第一項無正當理由支付對價持有兒童或少年性影像犯罪類型，並移列項次，爰配合該條修正，酌修援引之項次文字。另修正輔導教育時數由四小時修正為八小時，以收實效。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第五十一條之一","current":null,"versions":[{"bill":"202110033790000","text":"前條輔導教育實施完畢後，經評估認有施以身心治療之必要者，直轄市、縣（市）主管機關應令其接受身心治療。\n前項之執行期間為三年以下。執行期間屆滿前，經評估認有繼續執行之必要者，直轄市、縣（市）主管機關得延長之，最長不得逾一年；其無繼續執行之必要者，得停止其處分之執行。\n加害人於徒刑執行期滿前，接受身心治療或輔導教育後，經評估認有再犯之風險者，準用性侵害犯罪防治法有關強制治療規定。\n前三項之評估，準用性侵害犯罪防治法第三十三條成立評估小組辦理。","note":"一、本條新增。\n二、本法就犯罪行為人之處遇僅有輔導教育，相比性侵害犯罪防治法除輔導教育外，尚有身心治療、必要時甚至得施以強制治療，爰比照性侵害犯罪防治法增訂身心治療、強制治療之處分。\n三、第四項之評估，依照性侵害犯罪防治法第三十三條規定，由直轄市、縣（市）主管機關成立評估小組辦理。但服徒刑之成年受刑人由監獄、少年受刑人及受感化教育少年由少年矯正學校成立評估小組辦理。評估小組之組成與其辦理評估之內容、基準、程序與身心治療、輔導或教育之內容、程序、期間及其他相關事項之辦法，依照性侵害犯罪防治法規定，由中央主管機關會同法務主管機關定之。"},{"bill":"202110034580000","text":"犯第三十六條、第三十八條、第三十九條條文之罪，供出性剝削影片來源，因而查獲其他正犯或共犯者，得減輕或免除其刑。\n犯第三十六條、第三十八條、第三十九條之罪於偵查及歷次審判中均自白者，得減輕其刑。","note":"一、本條為新增條文。\n二、修正本條例第三十六條、第三十八條、第三十九條條文之修正，乃勢所當行。然則，除重罰以嚇阻潛在犯罪者外。鑒於創意私房即使於未成年性剝削事件爆發後仍在營運狀態，顯然單純重罰並不能嚇阻性剝削犯罪行為之上游。為徹底根絕上游，爰建議於加重法定本刑之同時，一併增列「偵查與審判中自白者得減其刑」、「供出性剝削影片來源，因而查獲其他正犯或共犯者」兩項「分別」與「獨立」得減刑事由。"},{"bill":"202110036720000","text":"前條之評估，由直轄市、縣（市）主管機關成立評估小組辦理。但服徒刑之成年受刑人由監獄、少年受刑人及受感化教育少年由少年矯正學校成立評估小組辦理。\n前項評估小組之組成與其評估之內容、基準、程序與身心治療之內容、程序、期間及其他相關事項之辦法，由中央主管機關會同法務主管機關定之。","note":"一、本條新增。\n二、參酌《性侵害犯罪防治法》有關身心治療之規定，增訂本條文明定身心治療評估小組之相關規定。"},{"bill":"202110039370000","text":"前條輔導教育期間，直轄市、縣（市）主管機關應評估受教育者是否有施以身心治療之必要，經評估認有施以身心治療之必要者，應令其接受身心治療。\n無正當理由不接受第一項身心治療或拒不完成其時數者，處新臺幣一萬元以上五萬元以下罰鍰，並令其限期履行。\n依前項規定令其限期履行，屆期仍不履行者，處一年以下有期徒刑、拘役或科或併科新臺幣十萬元以下罰金。\n受前二項處分者於執行完畢後，仍應依第一項規定辦理。","note":"一、本條新增。\n二、輔導教育期間改為最長四年，主管機關自可於期間內詳細評估受教育者是否已有明顯改善，故參酌性侵害犯罪防治法之規定，由主管機關評估受教育者是否須進行進一步之身心治療。\n三、若無正當理由不進行治療或時數不足者，則比照性侵害防治法之規定，處以罰鍰，若經主管機關限期履行治療仍不履行者，科處一年以下有期徒刑。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第五十一條之二","current":null,"versions":[{"bill":"202110039370000","text":"前條接受身心治療者，直轄市、縣（市）主管機關評估認有再犯風險者，得檢具相關評估報告，送請檢察官依刑法第九十一條之一規定，聲請強制治療；不適用刑法第九十一條之一規定者，由直轄市、縣（市）主管機關檢具相關評估報告，聲請法院裁定命其進入醫療機構或其他指定處所，施以強制治療。\n前項強制治療之執行期間為五年以下；其執行期間屆滿前，經評估認其再犯風險未顯著降低，而有繼續強制治療之必要者，檢察官或直轄市、縣（市）主管機關得向法院聲請許可延長之，第一次延長期間為三年以下，第二次以後每次延長期間為一年以下。但執行中，檢察官或直轄市、縣（市）主管機關認無繼續執行之必要者，得向法院聲請裁定停止強制治療。\n停止強制治療之執行後有第一項情形者，法院得令入相當處所，繼續施以強制治療。\n前項強制治療之期間，應與停止強制治療前已執行之期間合併計算。\n前三項執行或延長期間內，應每年至少評估一次有無繼續強制治療之必要。\n強制治療處所應於第一項之執行或延長期間屆滿前三個月，檢具治療、評估等結果通知強制治療受處分人及檢察官或直轄市、縣（市）主管機關。\n強制治療受處分人於收受前項通知後，得自行向法院聲請裁定停止強制治療之執行。\n直轄市、縣（市）主管機關於收受第六項通知後，認強制治療受處分人無繼續強制治療之必要，或收受第二項但書或前項停止強制治療執行之裁定後，應召開轉銜會議，安排強制治療受處分人身心治療、輔導或教育及登記、報到事宜，並提供就學、就業、家庭支持及其他照顧服務。","note":"一、本條新增。\n二、參酌性侵害犯罪防治法之相關規定，犯第五十一條所列之罪者，於接受身心治療期間，如經主管機關評估仍有再犯風險，考量係基於受治療者之身心因素，雖經身心治療仍未能降低再犯風險，則改以強制治療以矯正行為人異常人格及行為，使其習得自我控制以達到再犯預防為目的。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十一條之三","current":null,"versions":[{"bill":"202110039370000","text":"犯第五十一條第一項所列之罪經緩起訴處分確定者，準用第五十一條及第五十一條之一規定。","note":"一、本條新增。\n二、犯第五十一條所列之罪者，若經緩起訴確定，依現行法僅得進行四到五十小時之輔導教育，然查長期觀看或持有兒童及少年之性行為影像者，可能係有身心上之問題，故宜比照有罪確定者進行三年以下之輔導教育及評估是否須身心治療，惟輔導教育期間雖訂為三年以下，但實際教育時數仍不應低於原規定之四小時。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十二條之二","current":null,"versions":[{"bill":"202110041390000","text":"行為人應接受司法警察機關對其照相、採取指紋及採樣去氧核醣核酸，不得拒絕。\n中央警政主管機關應建立行為人之相片、指紋、去氧核糖核算紀錄及個人基本資料之資料庫。\n前項資料應予保密，非依法律規定，不得提供。\n第一項照相、採取指紋、採樣去氧核醣核酸之方式與第二項資料之內容、管理及其他相關事項之辦法，由中央警政主管機關定之。","note":"一、本條新增。\n二、鑑於兒少性剝削犯罪為本國社會所不能容忍之罪愆，故我國應建立起一定資料庫，將已知有此類行為之人納入政府社會安全網中；除避免再犯外，亦係為確保我國社會之安定，並確保社會中之成員得以了解兒少性犯罪者，以資避免。\n三、參酌性侵害犯罪防治法第二十九條之規定，授權中央警政主管機關蒐集行為人資訊，以建立我國兒少性犯罪者資料庫。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十二條之三","current":null,"versions":[{"bill":"202110041390000","text":"中央警政主管機關應運用前條第二項所定之行為人資料庫內容，建立全國兒童及少年性剝削行為人之檔案資料庫。\n前項資料庫之內容，應包含行為人姓名、最新照片、身體特徵、被害人數、被害人類型、犯罪記錄以及其他足資識別該行為人且中央主管機關認有必要公布之檔案，但不得洩漏任何被害人之資料。\n前項所定資料庫內容，於行為人依本條例第三十一條至第四十條、第四十五條所定之罪為有罪判決確定，或受緩起訴處分時，應予以公開供民眾查閱。\n第一項檔案資料庫之建立及作業管理辦法，第二項所應包含之資料項目、內容、管理及其他相關事項之辦法，及第三項之公告方式、媒介、民眾查詢方式及其他應遵行事項之辦法，由中央警政主管機關會商中央主管機關後定之。","note":"一、本條新增。\n二、配合第五十二條之二修正，於第一項明定中央警政主管機關有建立我國兒童及少年性剝削行為人檔案資料庫之義務。\n三、有鑒於該資料庫係為使社區得以知悉兒少性剝削犯罪行為人之個人資訊，但非為使行為人無法在社會中繼續生存，或鼓勵民眾惡意滋擾行為人以致影響行為人之生活或工作。該資料庫之目的僅為提供資訊以供社會公眾知悉，爰於第二項明定該資料庫所應包含之資訊，且不得包含任何足以洩漏被害人之資料，以免對被害人再次造成傷害。\n四、本條所定資料庫其目的便係為告知社會成員兒少性剝削行為人之資料，爰於第三項授權主管機關將相關資訊公開予民眾查閱。\n五、本資料庫建置時所應注意事項、應包含之必要項目以及民眾查閱之相關應遵行事項之辦法，於第四項授權中央警政主管機關會商中央主管機關後定之。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十二條之四","current":null,"versions":[{"bill":"202110041390000","text":"行為人經評估認有施以身心治療之必要者，其相關處遇，準用性侵害犯罪防治法第三十一條至第四十條規定。","note":"一、本條新增。\n二、有鑒於兒少性剝削犯罪者或有需身心治療或強制治療之必要者，爰就身心治療或強制治療相關規定，準用性侵害防治法。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第五十二條之五","current":null,"versions":[{"bill":"202110041390000","text":"行為人犯本條例第三十一條至第四十條、第四十五條之罪經有罪判決確定者，法院應指定其住居且實施科技設備監控終身，並應定期向警察機關辦理身分、就學、工作、車籍之異動或其他相關資料之登記、報到。\n行為人依前項規定經緩起訴處分確定者，亦適用前項之規定；其限制住居、實施科技設備監控、應進行登記、報到之期間為十五年。\n前二項規定，對於犯罪後經驅逐或限令出境者，不適用之。\n第一項、第二項行為人於登記、報到期間應定期或不定期接受警察機關查訪；其登記內容有變更者，應於變更之七日內辦理資料異動。\n第一項、第二項行為人於遷入法官所指定之居所前七日，中央警政主管機關應將行為人之姓名、長相、車籍等相關資料告知指定住居之地方主管機關。\n實施科技設備監控之行為人，故意拆除、損壞、隱匿、阻斷科技監控設備，經檢察署通報警察機關，司法警察官或司法警察得強制其到檢察署或檢察官指定之處所，由檢察署派員回復科技監控設備正常運作，相關機關並依法令規定為後續處理。\n犯本法所定之罪，經外國、大陸地區、香港或澳門法院有罪判決確定後，於未經我國法院重新判決確定前，準用第四項查訪規定。","note":"一、本條新增。\n二、本次修正係為加強對行為人之相關禁止規定，並參酌美國潔西卡法案之精神，對於犯本法所定之罪經有罪判
