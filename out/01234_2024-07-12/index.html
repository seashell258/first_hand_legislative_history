<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>兒童及少年性剝削防制條例修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

"]},{"id":"202110046490000","who":"委員羅智強等16人","date":"2024-05-17","name":"「兒童及少年性剝削防制條例第四條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110046490000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00500.pdf","proposers":["羅智強","鄭天財Sra Kacaw"],"ncosign":14,"people":[["羅智強","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","提案"],["鄭正鈐","國民黨","連署"],["吳宗憲","國民黨","連署"],["林思銘","國民黨","連署"],["黃健豪","國民黨","連署"],["王鴻薇","國民黨","連署"],["翁曉玲","國民黨","連署"],["謝龍介","國民黨","連署"],["游顥","國民黨","連署"],["林國成","民眾黨","連署"],["洪孟楷","國民黨","連署"],["魯明哲","國民黨","連署"],["陳雪生","國民黨","連署"],["廖先翔","國民黨","連署"],["邱若華","國民黨","連署"]],"party":[["國民黨",15],["民眾黨",1]],"reason":"本院委員羅智強、鄭天財Sra Kacaw等16人，有鑒於我國高度資訊化發展，新世代被稱為「數位原生代」，每日所接觸各類型平台之數位化服務多元、變化速度極快，惟處於啟蒙時期的兒少族群易深陷網路危機，就現行規範宣導課程時數之不足，爰擬具「兒童及少年性剝削防制條例第四條條文修正草案」。是否有當？敬請公決。","arts":["第四條"]},{"id":"202110044920000","who":"委員張宏陸等19人","date":"2024-05-17","name":"「兒童及少年性剝削防制條例部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110044920000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00501.pdf","proposers":["張宏陸"],"ncosign":18,"people":[["張宏陸","民進黨","提案"],["蘇巧慧","民進黨","連署"],["黃捷","民進黨","連署"],["李柏毅","民進黨","連署"],["陳培瑜","民進黨","連署"],["徐富癸","民進黨","連署"],["王美惠","民進黨","連署"],["吳琪銘","民進黨","連署"],["陳素月","民進黨","連署"],["邱志偉","民進黨","連署"],["陳俊宇","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["李坤城","民進黨","連署"],["羅美玲","民進黨","連署"],["范雲","民進黨","連署"],["吳沛憶","民進黨","連署"],["陳秀寳","民進黨","連署"],["蔡易餘","民進黨","連署"],["林俊憲","民進黨","連署"]],"party":[["民進黨",19]],"reason":"本院委員張宏陸等19人，鑒於我國兒童及少年性剝削通報被害人人數逐年增加，被害人亦有年輕化趨勢（被害人為未滿12歲者，自民國108年迄今，已成長3%），又近期發生「台灣N號房」社會事件，加害網站之結構，竟已形成性犯罪產業鏈，實屬社會不樂見之事。為遏止兒少性剝削狀態愈發嚴重，爰提升拍攝者、散布者及無正當理由持有兒少性影像之罰責，以避免助長此類犯罪之增生，保障兒少身心健全發展。爰擬具「兒童及少年性剝削防制條例部分條文修正草案」。是否有當？敬請公決。","arts":["第八條","第三十五條","第三十六條","第三十八條","第三十九條","第四十四條"]}],"arts":[{"no":"第二條","current":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、公然陳列或販賣兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","versions":[{"bill":"202110032200000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、公然陳列、販賣或持有兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"一、第一項第三款修正新增「持有」兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之行為為性剝削之違法態樣，以強化主管機關重視近期此類型之違法行為氾濫且危害甚鉅之狀況，並提出相關防治與輔導等作為。\n二、第一項其餘項次及第二項未修正。"},{"bill":"202110034200000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、購買、公然陳列或販賣兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"配合第三十八條將購買列為處罰樣態，爰將其納入第一項第三款定義，以擴大第二項之保護對象即被害人範疇。"},{"bill":"202110033910000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、公然陳列、販賣、非基於正當目的持有兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。以對價取得存取上開物品電磁紀錄之權利者，亦同。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"一、配合本法第三十九條第二項規定，將非基於正當目的持有兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之行為，列入性剝削之定義。\n二、因應科技發達和資訊傳遞的發展，產生新型態之色情產業營運模式，以對價取得存取上開物品電磁紀錄之權利者列入性剝削之定義。"},{"bill":"202110036130000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、公然陳列或買賣兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"由於現行規定之販賣行為，無法完全約束相關交易行為，購買一方仍構成針對兒少之性剝削，也須承擔刑責，爰此修正。"},{"bill":"202110036720000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、公然陳列、販賣或無正當理由持有兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"增訂無正當理由持有兒少性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品為性剝削之行為態樣，爰修正第一項第三款。"},{"bill":"202110037590000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、購買、公然陳列或販賣兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"一、增列「購買」為構成兒童或少年性剝削行為之要件。\n二、行為人雖未為散布、播送、交付、公然陳列或以他法供人觀覽、聽聞兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之行為，然購買上述性影像或物品亦會導致該類物品增加拍攝、製造等相關行為之可能性，其侵害之程度應與拍攝、製造、散布、播送、交付、公然陳列或販賣等視，故將購買納入第一項犯罪行為類型予以處罰，以保護兒童或少年被害人。"},{"bill":"202110039410000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、公然陳列或販賣兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"一、經查，現行《兒童及少年性剝削防制條例》於民國112年修正，其立法宗旨應為保護真實兒童及少年免於性剝削、性虐待、性交易等不良影響，維護其身心健康發展，並加強對於兒童及少年性剝削問題的預防、查緝及處置，促進兒童及少年之健全發展與幸福成長。\n二、惟觀其立法理由「兒童色情圖片對慾望刺激有關聯性的，觀看後可能會採取實際行動傷害兒童。」等相關定義於真人圖片及虛構作品之間過於模糊，且目前並無實證研究與在地經驗支持其觀看色情兒少動漫會對真人兒少採取實際行動之論點。\n三、又司法院大法官釋字617號解釋揭示：「為貫徹憲法第十一條保障人民言論及出版自由之本旨，除為維護社會多數共通之性價值秩序所必要而得以法律加以限制者外，仍應對少數性文化族群依其性道德感情與對社會風化之認知而形諸為性言論表現或性資訊流通者，予以保障。\n四、為避免動漫繪圖等相關創作產業族群權益受損，本法所稱之圖畫，應聚焦管理真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫，爰修正第二條第一項第三款，拍攝、製造、散布、播送、交付、公然陳列或販賣兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品。"},{"bill":"202110039980000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、重製、持有、散布、播送、交付、公然陳列、販賣或支付對價觀覽兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"一、新增第一項第三款文字。\n二、考量重製、持有或支付對價觀覽於修正條文第三十六條、第三十九條、第四十四條皆已列為處罰樣態，爰將其納入第一項第三款定義，以擴大第二項之保護對象即被害人範疇。\n三、現行第一項第三款兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫，包含兒童或少年色情圖畫（如漫畫、繪畫等虛擬兒童色情產物），倘持有虛擬兒童色情圖畫對慾望之刺激具關聯性，觀看後可能採取實際行動傷害兒童或少年之行為。為防制真實存在之兒童或少年遭受任何形式之性剝削，保護其身心健全發展，第一項第三款所稱與性相關而客觀上足以引起性慾或羞恥之圖畫，爰參酌日本「兒童買春、兒童色情關係行為等規制及處罰並兒童保護等相關法律」，針對利用生成式人工智慧製造之兒童或少年色情仿真圖畫、擬真之兒童或少年色情圖畫，及以真實存在之兒童或少年為創作背景之色情圖畫，因有侵害個人法益之虞，嚴重侵害兒童或少年隱私權及名譽權，有處罰之必要。爰此，第一項第三款所稱圖畫，以生成式人工智慧製造、擬真繪製或以真實存在之兒童或少年為創作背景之色情圖畫為限，其餘兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫除仍有刑法第二百三十五條規定外，應依兒童及少年福利與權益保障法第四十六條規定，採取明確可行之防護措施，限制兒童及少年接取、瀏覽，以確保其身心得以健全發展。"},{"bill":"202110040750000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、重製、持有、散布、播送、交付、公然陳列、販賣或支付對價觀覽兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"一、於第一項第三款增列行為態樣文字。\n二、考量重製、持有或支付對價觀覽於修正條文第三十六條、第三十九條、第四十四條皆已列為處罰樣態，爰將其納入第一項第三款定義，以擴大第二項之保護對象即被害人範疇。\n三、現行第一項第三款兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫，包含兒童或少年色情圖畫（如漫畫、繪畫等虛擬兒童色情產物），倘持有虛擬兒童色情圖畫對慾望之刺激具關聯性，觀看後可能採取實際行動傷害兒童或少年之行為。為防制真實存在之兒童或少年遭受任何形式之性剝削，保護其身心健全發展，第一項第三款所稱與性相關而客觀上足以引起性慾或羞恥之圖畫，爰參酌日本「兒童買春、兒童色情關係行為等規制及處罰並兒童保護等相關法律」，針對利用生成式人工智慧製造之兒童或少年色情仿真圖畫、擬真之兒童或少年色情圖畫，及以真實存在之兒童或少年為創作背景之色情圖畫，因有侵害個人法益之虞，嚴重侵害兒童或少年隱私權及名譽權，有處罰之必要。爰此，第一項第三款所稱圖畫，以生成式人工智慧製造、擬真繪製或以真實存在之兒童或少年為創作背景之色情圖畫為限，其餘兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫除仍有刑法第二百三十五條規定外，應依兒童及少年福利與權益保障法第四十六條規定，採取明確可行之防護措施，限制兒童及少年接取、瀏覽，以確保其身心得以健全發展，併此補充說明。"},{"bill":"202110040890000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、公然陳列、販賣或無正當理由持有兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","note":"一、修正第二項第三款，參酌本條例第三十九條之規定，增訂「無正當理由持有兒少性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品」亦為兒童及少年性剝削之樣態，使兒少免於性剝削之保護機制更臻完善。\n二、其餘項次未修正。"},{"bill":"202110041390000","text":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、散布、播送、交付、公然陳列或販賣兒童或少年之性影像、與性相關而客觀上足以引起、刺激或滿足性慾而無藝術性、醫學性或教育性價值而令一般人感覺不堪呈現於眾或不能忍受而排拒之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。\n本條例所稱行為人，指行為滿足第一項各款行為者。","note":"一、有鑒於現行所定「羞恥」之定義或有歧異，尚屬非十分明確之用詞。為使本法所稱「引起性慾或羞恥」之定義得以更為明確，爰參酌司法院大法官釋字第六一七號解釋，就此處之定義略微修正。\n二、為強化本法對兒少性剝削犯罪之嚇阻力，爰於本次修正增訂依本法規定而受有罪判決確定或經緩起訴處分確定者之處遇。惟經緩起訴處分確定者，因未經法院判決確定，似不宜稱其為犯罪者：復考量本法中對「觀看」行為本身已訂有禁止規定，惟觀看行為本身雖於道德上有十足可責難性，然或難謂法律上之「加害人」，故於本法將以行為人稱之。\n三、增訂第三項，明確定義「行為人」。"}],"changed":true,"final":"本條例所稱兒童或少年性剝削，指下列行為之一者：\n一、使兒童或少年為有對價之性交或猥褻行為。\n二、利用兒童或少年為性交或猥褻之行為，以供人觀覽。\n三、拍攝、製造、重製、持有、散布、播送、交付、公然陳列、販賣或支付對價觀覽兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品。\n四、使兒童或少年坐檯陪酒或涉及色情之伴遊、伴唱、伴舞或其他類似行為。\n本條例所稱被害人，指遭受性剝削或疑似遭受性剝削之兒童或少年。","finalWhy":"一、考量本條例第三十六條、第三十九條、第四十四條皆已將重製、持有或支付對價觀覽列為處罰樣態，爰於第一項第三款增列行為樣態，以擴大保護對象範疇。\n二、為防制真實存在之兒童或少年遭受任何形式之性剝削，保護其身心健全發展，並利具體認定，有關第一項第三款所稱與性相關而客觀上足以引起性慾或羞恥之圖畫，參酌日本「兒童買春、兒童色情關係行為等規制及處罰並兒童保護等相關法律」，係以生成式人工智慧製造、擬真繪製或以真實存在之兒童或少年為創作背景之色情圖畫為限。至其餘兒童或少年與性相關而客觀上足以引起性慾或羞恥之圖畫除有刑法第二百三十五條規定之適用外，應依兒童及少年福利與權益保障法第四十六條規定，採取明確可行之防護措施，限制接取、瀏覽，以求周妥。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第三條","current":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期公布並檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","versions":[{"bill":"202110033180000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關，並邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，每年至少召開一次會議，定期公布檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效，並建立犯罪資料庫，跨部會整合各單位通報紀錄並同步訊息。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"一、原條文並未規定開會頻率及會議結論之公開或串聯。為使兒童及少年性剝削防制條例徹底落實，並且納入專家學者之意見，除了定期召開會議檢討我國有關兒少性剝削相關議題，更應對社會大眾說明預防成果與犯法嚴重性。\n二、新增跨部會整合系統，由內政、法務、教育、國防、文化、經濟、勞動、交通、衛環及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，可同時更新資料庫，將被通報之嫌疑人或有犯罪紀錄者之資料快速更新，使跨部會依職權調查或進行預防時，得以更準確的執法標的與人物。"},{"bill":"202110034540000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通、數位發展及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期公布並檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"為建立兒少性剝削資料庫，並防制境外網路犯罪，將數位發展部納入主管機關。"},{"bill":"202110034460000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效，並每半年公布工作會議記錄與工作成效。\n主管機關應統籌建立、管理兒童及少年性剝削電子資料庫，供法官、檢察官、警察、醫師、護理人員、心理師、社會工作人員及其他政府機關使用，並對被害人之身分予以保密。\n主管機關應定期邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。\n第四項規定電子資料庫之建立、管理及使用辦法，由中央主管機關定之。","note":"一、為敦促行政機關檢討兒少保護政策符合社會現實並廣納各界意見，第三項增訂要求每半年公布成效之規定，以供社會檢視。\n二、有鑑於兒少性犯罪手法日新月異，為提升偵查人員搜集、整理、分析數位資料與跡證之能力，參考《家庭暴力防治法》設置家庭暴力個案資料庫之立法例，增訂第四項，要求主管機關建立跨部會之兒童及少年性剝削電子資料庫，期有效壓制兒少性犯罪之發生。\n三、為符憲法第二十二條保障人民資訊隱私權之意旨，增訂第七項，要求及授權主管機關就規定電子資料庫之建立、使用、管理暨相關組織上及程序上之監督防護機制等重要事項進行規範。"},{"bill":"202110034150000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通、數位發展及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期公布並檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢、推動及檢討兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"一、據iWIN網路內容防護機構統計，2022年達到381件，突顯兒少私密影像外流問題非常嚴重。\n二、兒童及少年性剝削防制條例制定時，行政院尚未設置數位發展之主管機關，惟兒少私密影像於網際網路持續擴散，與通訊資源管理及數位犯罪息息相關，兒少性剝削防制業務實有納入數位發展部之必要。\n三、為敦促行政機關定期檢視目前兒少性剝削防制政策之成效，明定每年應至少召開一次會議。"},{"bill":"202110036130000","text":"本條例所稱主管機關：在中央為衛生福利部及；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通、數位發展及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期公布並檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"鑒於現今社會數位發展快速，利用社群網路、網路交友軟體等進行性誘拐、詐騙、性交易等方式，使兒童及少年發生性行為，取得自拍或偷拍非自願外流性私密影像。現今相關行為多以網路為媒介，數位發展部應負起防制、宣導之責任，爰此修正。"},{"bill":"202110036480000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通、數位發展及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期公布並檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"一、修正第二項。\n二、為建立兒少性剝削資料庫，並防制境外網路犯罪，爰將數位發展部納入主管機關。\n三、根據本法第八條規定，對於網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者已要求限制瀏覽或移除內容，並保留一百八十天犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料等，然越來越多犯罪平臺屬於境外網站，現行法規面臨無法可管的窘境，而境外網際網路平臺的管理問題不僅是兒少性剝削議題，舉凡金融、詐騙等議題亦往往牽涉境外網站，爰將數位發展部納入兒少性剝削防制業務之主管機關，並應提出相關遏止境外平臺犯罪之具體對策。"},{"bill":"202110036730000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通、數位發展及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期公布並檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"一、除為建立兒少性剝削資料庫，並防制境外網路犯罪，，現兒少性剝削多亦透過網際網路犯行建議，故應將數位發展部納入為相關主管機關之一。\n二、爰提案增訂本條第二項相關文字。\n三、第一項、第三項、第四項及第五項未修正。"},{"bill":"202110037550000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關執行應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n主管機關及目的事業主管機關均應辦理兒童及少年性剝削防制業務；其權責劃分如下：\n一、主管機關：主管兒童及少年性剝削防制政策之規劃、推動及監督等相關事宜。\n二、社政主管機關：被害人保護、安置、庇護、扶助與定期公布性剝削相關統計資料及其他相關事宜。\n三、衛生主管機關：被害人驗傷、心理輔導、身心治療與加害人身心治療、輔導或教育及其他相關事宜。\n四、教育主管機關：各級學校、幼兒園性剝削防制教育課程、宣導、被害人就學權益之維護及其他相關事宜。\n五、勞動主管機關：被害人職業訓練、就業服務、勞動權益維護、自立生活及其他相關事宜。\n六、警政主管機關：被害人身分識別、人身安全之維護、兒童及少年性剝削犯罪調查、資料統計、加害人登記、報到、查訪、查閱及其他相關事宜。\n七、法務主管機關：兒童及少年性剝削犯罪偵查、矯正、徒刑執行期間治療及其他相關事宜。\n八、移民主管機關：臺灣地區無戶籍國民、外國人、無國籍人民、大陸地區人民、香港或澳門居民之兒童或少年因遭受性剝削或疑似遭受性剝削致逾期停留、居留者，協助其在臺居留或定居權益維護，配合協助辦理後續送返事宜；加害人為臺灣地區無戶籍國民、外國人、大陸地區人民、香港或澳門居民，配合協助辦理後續遣返及其他相關事宜。\n九、通訊傳播主管機關：廣播、電視、電信事業及其他由該機關依法管理之媒體違反本法規定之處理及其他相關事宜。\n十、數位事務主管機關：協助主管機關執行限制接取、流量管理及其他相關事宜。\n十一、其他性剝削防制措施，由相關目的事業主管機關依其權責辦理。\n前項目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育及宣導。\n主管機關應會同前項相關機關定期公布並檢討教育及宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"一、為明定本條例主管機關及目的事業主管機關權責，爰參考《性侵害犯罪防治法》第四條及《兒童及少年福利與權益保障法》第七條，修正第二項。\n二、鑒於教育與宣導為不同之概念，爰修正第三項及第四項文字，將教育與宣導區隔。"},{"bill":"202110040750000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期公布並檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策；其中學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。\n為協助被害人限制瀏覽或移除兒童或少年之性影像，中央主管機關得自行或委由民間團體成立性影像處理中心，並設專職人員辦理下列事項：\n一、受理性影像申訴、諮詢、查察。\n二、通知網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者（以下併稱網路業者）限制瀏覽或移除兒童或少年之性影像。\n三、其他性影像防制相關業務。\n司法警察、檢察官得運用科技技術方式，於網路巡查涉兒童或少年性影像犯罪嫌疑情事。\n網路業者對於前項巡查，不得拒絕、妨礙或規避。","note":"一、參考性侵害犯罪防治法第五條規定，將第五項代表人數比例移列第四項併予規定。\n二、新增第五項，考量被害人有全國單一求助平臺受理民眾或被害人申訴限制瀏覽或移除下架性影像之需求，爰明定中央主管機關得自行或委由民間團體成立性影像處理中心，並設專職人員辦理性影項申訴、諮詢、查察、通知網路業者限制瀏覽或移除性影像，以及其他性影像防制相關業務。\n三、考量檢警於偵辦兒童或少年性影像案件時，有運用科技技術方式之需求，爰增訂第六項，定明司法警察、檢察官得運用科技技術方式，於網路巡查涉兒童或少年性影像犯罪嫌疑情事。\n四、另為避免網路業者對於司法警察、檢察官運用科技技術方式巡查涉兒童或少年性影像犯罪嫌疑情事時有所阻礙，爰增訂第七項，定明網路業者對於前項巡查，不得拒絕、妨礙或規避。"},{"bill":"202110040950000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通、通訊傳播及數位發展等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應每年至少一次邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"一、第二項新增數位發展，111年1月19日公布之數位發展部組織法第一條規定「行政院為促進全國通訊、資訊、資通安全、網路與傳播等數位產業發展、統籌數位治理與數位基礎建設及協助公私部門數位轉型等相關業務，特設數位發展部」，故數位發展部應納入本法相關目的事業主管機關之範疇。\n二、第三項新增「每年至少一次」文字，俾督促主管機關定期邀集討論。"},{"bill":"202110046480000","text":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n內政、法務、教育、國防、文化、經濟、勞動、交通及通訊傳播等相關目的事業主管機關涉及兒童及少年性剝削防制業務時，應全力配合並辦理防制教育宣導。\n主管機關應會同前項相關機關定期公布並檢討教育宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策，中央主管機關應制定「防制剝削兒童國家策略」，每兩年檢討並重新公告。\n前項學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。","note":"新增中央主管機關應比照美國制定《防制剝削兒童國家策略》，並依防制成效與社會發展之變遷進行檢討與公告。"}],"changed":true,"final":"本條例所稱主管機關：在中央為衛生福利部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。主管機關應獨立編列預算，並置專職人員辦理兒童及少年性剝削防制業務。\n本條例所定事項，主管機關及目的事業主管機關權責事項如下：\n一、主管機關：兒童及少年性剝削防制政策規劃、推動、監督及其他相關事宜；被害人保護扶助、行政裁處、行為人輔導教育、定期公布兒童及少年性剝削相關統計資料及其他相關事宜。\n二、衛生主管機關：被害人驗傷、採證、行為人身心治療及其他相關事宜。\n三、教育主管機關：各級學校、幼兒園兒童及少年性剝削防制教育、被害人就學權益之維護、中途學校及其他相關事宜。\n四、勞動主管機關：被害人職業訓練、就業服務及其他相關事宜。\n五、警政主管機關：兒童及少年性剝削犯罪預防及調查、資料統計、行為人登記、報到、查訪、查閱及其他相關事宜。\n六、法務主管機關：兒童及少年性剝削犯罪偵查、矯正及其他相關事宜。\n七、移民主管機關：臺灣地區無戶籍國民、外國人、無國籍人民、大陸地區人民、香港或澳門居民因遭受兒童及少年性剝削致逾期停留或居留者，協助維護其在臺灣地區停留或居留權益，並配合協助辦理後續送返事宜；加害人為臺灣地區無戶籍國民、外國人、大陸地區人民、香港或澳門居民者，配合協助辦理後續遣返及其他相關事宜。\n八、文化主管機關：出版品違反本條例規定之處理及其他相關事宜。\n九、通訊傳播主管機關：廣播、電視及其他由該機關依法管理之媒體違反本條例規定之處理及其他相關事宜。\n十、數位發展主管機關：兒童或少年性影像犯罪防制情事之技術支援相關事宜。\n十一、經濟主管機關：特定行業營業場所違反本條例規定之處理及其他相關事宜。\n十二、戶政主管機關：提供被害人身分、戶籍資料及其他相關事宜。\n十三、其他兒童及少年性剝削及性影像防制措施，由相關目的事業主管機關依其權責辦理。\n主管機關應會同前項相關機關定期公布並檢討教育、宣導、救援及保護、加害者處罰、安置及服務等工作成效。\n主管機關應邀集相關學者或專家、民間相關機構、團體代表及目的事業主管機關代表，協調、研究、審議、諮詢及推動兒童及少年性剝削防制政策；其中學者、專家及民間相關機構、團體代表不得少於二分之一，任一性別不得少於三分之一。\n為協助被害人處理性影像限制瀏覽或移除，中央主管機關得自行或委託民間團體成立性影像處理中心，並設專職人員辦理下列事項：\n一、受理性影像申訴、諮詢、查察。\n二、通知網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者（以下併稱網路業者）限制瀏覽或移除兒童或少年之性影像。\n三、其他性影像防制相關業務。\n中央主管機關得運用科技技術方式，於網路主動巡查涉兒童或少年性影像犯罪嫌疑情事，數位發展主管機關依法提供相關技術協助。\n網路業者對於前項巡查，不得拒絕、妨礙或規避。","finalWhy":"一、參酌性侵害犯罪防治法第四條規定，修正第二項，明定各目的事業主管機關權責。\n二、參考性侵害犯罪防治法第五條規定，將原第五項代表人數比例移列第四項併予規定。\n三、考量性影像犯罪具網路跨域及快速散布特性，實有設置全國單一窗口受理申訴及處理之需求，爰增訂第五項，明定中央主管機關得自行或委託民間團體成立性影像處理中心，並設專職人員辦理性影像申訴、諮詢、查察、通知網路業者限制瀏覽或移除性影像，以及其他性影像防制相關業務。\n四、為利中央主管機關網路主動巡查作業，增訂第六項，定明中央主管機關得運用科技技術方式，於網路主動巡查涉兒童或少年性影像犯罪嫌疑情事，數位發展主管機關依法提供相關技術協助。\n五、為增進中央主管機關運用科技技術方式於網路主動巡查涉兒童或少年性影像犯罪嫌疑情事之作為，增訂第七項，定明網路業者對於該巡查，不得拒絕、妨礙或規避。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第三條之一","current":null,"versions":[{"bill":"202110039980000","text":"為協助被害人限制瀏覽或移除兒童或少年之性影像，中央主管機關得自行或委由民間團體成立性影像處理中心，並設專職人員辦理下列事項：\n一、受理性影像申訴、諮詢、查察。\n二、通知網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者（以下併稱網路業者）限制瀏覽或移除兒童或少年之性影像。\n三、其他性影像防制相關業務。","note":"一、本條新增。\n二、考量被害人有全國單一求助平臺受理民眾或被害人申訴限制瀏覽或移除下架性影像之需求，爰增訂第一項，明定中央主管機關得自行或委由民間團體成立性影像處理中心，並設專職人員辦理性影項申訴、諮詢、查察、通知網路業者限制瀏覽或移除性影像，以及其他性影像防制相關業務。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三條之二","current":null,"versions":[{"bill":"202110039980000","text":"司法警察、檢察官得運用科技技術方式於網際網路巡查涉兒童或少年性影像犯罪嫌疑情事。\n網路業者不得拒絕、妨礙或規避。","note":"一、本條新增。\n二、考量檢警於偵辦兒童或少年性影像案件時，有運用科技技術方式之需求，爰於第一項定明司法警察、檢察官得運用科技技術方式於網際網路巡查涉兒童或少年性影像犯罪嫌疑情事。\n三、另為避免網路業者對於司法警察、檢察官運用科技技術方式巡查涉兒童或少年性影像犯罪嫌疑情事時有所阻礙，爰於第二項定明網路業者不得拒絕、妨礙或規避。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四條","current":"高級中等以下學校每學年應辦理兒童及少年性剝削防制教育課程或教育宣導。\n前項兒童及少年性剝削教育課程或教育宣導內容如下：\n一、性不得作為交易對象之宣導。\n二、性剝削犯罪之認識。\n三、遭受性剝削之處境。\n四、網路安全及正確使用網路之知識。\n五、其他有關性剝削防制事項。","versions":[{"bill":"202110034150000","text":"高級中等以下學校每學期應辦理兒童及少年性剝削防制教育課程，至少二小時。\n前項兒童及少年性剝削教育課程內容如下：\n一、性不得作為交易對象之宣導。\n二、性剝削犯罪之認識。\n三、遭受性剝削之處境。\n四、網路安全及正確使用網路之知識。\n五、其他有關性剝削防制事項。\n幼兒園應實施兒童及少年性剝削防制教育宣導。","note":"一、據衛福部統計我國2020年透過網路施行兒少性剝削犯罪案件數為1,239件，2022年則上升至1,628件，此類影像於網際網路持續擴散，嚴重傷害兒少身心發展。\n二、本法並未明定兒少性剝削防制教育課程之時數及頻率，難以發揮增加兒少防範犯罪意識之效，爰比照性侵害犯罪防治法之立法例，明定兒少性剝削防制教育課程之時數及頻率。"},{"bill":"202110046490000","text":"高級中等以下學校每學期應辦理兒童及少年性剝削防制教育課程或教育宣導。\n前項兒童及少年性剝削教育課程或教育宣導內容如下：\n一、性不得作為交易對象之宣導。\n二、性剝削犯罪之認識。\n三、遭受性剝削之處境。\n四、網路安全及正確使用網路之知識。\n五、其他有關性剝削防制事項。","note":"原條文規定，每學年應辦理教育宣導，改為每學期應辦理之。"}],"changed":true,"final":"高級中等以下學校每學期應辦理兒童及少年性剝削防制教育課程，至少二小時。\n前項兒童及少年性剝削教育課程內容如下：\n一、性不得作為交易對象之宣導。\n二、性剝削犯罪之認識。\n三、遭受性剝削之處境。\n四、網路安全及正確使用網路之知識。\n五、其他有關性剝削防制事項。\n各級學校、幼兒園應對教職員工及教保相關人員實施兒童及少年性剝削防制教育及宣導。","finalWhy":"一、為增加兒童及少年性剝削犯罪防制意識，爰比照「性侵害犯罪防治法」之立法例，於本條第一項定明兒少性剝削防制教育課程之時數及頻率。\n二、依據「性別平等教育法」第十八條規定，國民中小學除應將性別平等教育融入課程外，每學期應實施性別平等教育相關課程或活動至少四小時，高級中等學校及專科學校五年制前三年應將性別平等教育融入課程。另依據「性侵害犯罪防治法」第九條規定，高級中等以下學校每學期應實施性侵害防治教育課程，至少二小時。為符合「十二年國民基本教育課程綱要總綱」及校訂課程精神，爰由高級中等以下學校每學期結合性別平教育法、性侵害犯罪防治法所規範之時數內，配合進行二小時兒童及少年性剝削防制主題相關學習內容。\n三、為利本條第一項課程之實施，增訂本條第三項，定明各級學校及幼兒園應對其教職員工及教保相關人員實施兒童及少年性剝削防制教育及宣導；另考量幼兒尚處於性別認同階段，爰幼兒將透過教保服務人員於教保活動課程設計，建立幼兒正確防制觀念。","review":{"note":"修正通過","text":"高級中等以下學校每學期應辦理兒童及少年性剝削防制教育課程，至少二小時。\n前項兒童及少年性剝削教育課程內容如下：\n一、性不得作為交易對象之宣導。\n二、性剝削犯罪之認識。\n三、遭受性剝削之處境。\n四、網路安全及正確使用網路之知識。\n五、其他有關性剝削防制事項。\n各級學校、幼兒園應對教職員工及教保相關人員實施兒童及少年性剝削防制教育及宣導。"}},{"no":"第五條","current":"中央法務主管機關及內政主管機關應分別指定所屬機關專責指揮督導各地方檢察署、警察機關辦理有關本條例犯罪偵查工作；各地方檢察署、警察機關應指定經專業訓練之專責人員辦理本條例事件。","versions":[{"bill":"202110034540000","text":"中央法務主管機關及內政主管機關應分別指定所屬機關專責指揮督導各地方檢察署、警察機關辦理有關本條例犯罪偵查工作，以及被害人安全維護、犯罪調查、資料統計、加害人登記、報到、查訪、查閱及其他相關事宜；各地方檢察署、警察機關應指定經專業訓練之專責人員辦理本條例事件。","note":"比照「性侵害犯罪防治法」，要求警政單位應執行兒少性剝削被害人安全維護、犯罪調查、資料統計，以及加害人登記、報到、查訪、查閱及其他相關事宜。"},{"bill":"202110034460000","text":"中央法務主管機關及內政主管機關應分別指定所屬機關專責指揮督導各地方檢察署、警察機關辦理有關本條例犯罪偵查工作；各地方檢察署、警察機關應指定經專業訓練之專責人員辦理本條例事件。\n發生重大兒童及少年性剝削或性犯罪事件或有發生之虞，中央主管機關應儘速會同相關目的事業主管機關組成跨部會專案小組進行調查。\n前項專案小組之組織與運作、調查程序、報告及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、重大兒童性剝削案件重大犯罪通常具有較高的複雜性，往往涉及跨地區、跨領域因素，亟需各部會提供相應的專業知識和技術支持，並透過專案小組協調一致、實現資訊共享，以加快犯罪偵查和證據收集的速度。\n二、第二項授權主管機關就專案小組組成之細節以辦法訂之。"},{"bill":"202110033760000","text":"中央法務主管機關及內政主管機關應分別指定所屬機關專責指揮督導各地方檢察署、警察機關辦理有關本條例犯罪偵查工作；各地方檢察署、警察機關應指定經專業訓練之專責人員辦理本條例事件。\n為有效預防及打擊兒童及少年性剝削犯罪，中央法務主管機關應建立兒童及少年性剝削犯罪資料庫，提供司法及警察機關使用。","note":"建立兒童及少年性剝削犯罪資料庫，提供司法與警察機關使用，預防性剝削犯罪的發生。"},{"bill":"202110036480000","text":"中央法務主管機關及內政主管機關應分別指定所屬機關專責指揮督導各地方檢察署、警察機關辦理有關本條例犯罪偵查工作，以及被害人安全維護、性侵害犯罪調查、資料統計、加害人登記、報到、查訪、查閱及其他相關事宜；各地方檢察署、警察機關應指定經專業訓練之專責人員辦理本條例事件。","note":"因應建立兒少性剝削資料庫，參照「性侵害防制法」，要求警政單位應執行被害人安全維護、性侵害犯罪調查、資料統計、加害人登記、報到、查訪、查閱及其他相關事宜。"},{"bill":"202110036730000","text":"中央法務主管機關及內政主管機關應分別指定所屬機關專責指揮督導各地方檢察署、警察機關辦理有關本條例犯罪偵查工作，以及被害人安全維護、資料統計、加害人登記、報到、查訪、查閱及其他相關事宜；各地方檢察署、警察機關應指定經專業訓練之專責人員辦理本條例事件。","note":"一、於「性侵害防制法」中，已規定中央主管機關及各直轄市、縣（市）主管機關位應就輕侵害防治部分，執行被害人之安全維護、資料統計，以及加害人登記、報到、查訪、查閱及其他相關事宜。兒少性剝削之辦理，亦應有相同之執行要求。\n二、爰提案增訂本條文第一項部分文字。"},{"bill":"202110037550000","text":"中央法務主管機關及內政主管機關應分別指定所屬機關專責指揮督導各地方檢察署、警察機關辦理有關本條例犯罪偵查工作；各地方檢察署、警察機關應指定經專業訓練之專責人員辦理本條例事件。\n為辦理本法第二條第一項第三款性剝削行為之被害人身分識別、犯罪偵查，警政主管機關應指定或設立專責單位辦理下列事項：\n一、建立被害人性影像資料庫系統，針對身分未知之被害人性影像進行辨識，並利用性影像資料庫協助犯罪偵查。\n二、依法院、檢察官或司法警察機關請求，提供資料庫相關資料進行被害人識別、犯罪偵查及審判程序。\n三、其他與被害人性影像有關之事項。\n有關第二項性影像資料庫之資料儲存、管理、使用、提供辦法，由主管機關會同內政部定之。","note":"一、目前由衛生福利部成立之「性影像處理中心」，為提供民眾有關性影像移除之諮詢、申訴與下架協助服務。\n二、惟實務上，偵辦性影像案件，查扣物存有大量性影像，其中部分係犯嫌下載、購買、交換取得，且部分性影像係犯嫌個人製作或以不法方式產出，為聚焦偵查重點，可透過資料庫比對排除方式，針對已經查知犯嫌之性影像加以排除，協助偵查人員快速辨識其他可能由犯嫌個人產出之性影像。\n三、此外，案件偵辦時常發生查獲犯嫌卻找不到性影像被害人以及被害人報案，未能查獲犯嫌之情況，爰新增第二項及第三項，明定性影像資料庫之設立依據與管理辦法之授權依據，以期透過資料庫之成立及分析應用，改善偵查實務之困境。\n四、另，資料庫並非以性影像檔案進行保存，係將性影像透過轉碼成hash值加以儲存，且該hash值特性，無法回推還原成性影像。性影像原檔案經後製後可能影響hash值而致比對結果不同，惟依據偵辦經驗，性影像持有者不可能將其持有之所有性影像逐一後製，成立資料庫系統以分析應用仍有其必要性，特予敘明。"}],"changed":true,"final":"中央法務主管機關及中央警政主管機關應分別指定所屬機關專責指揮督導各地方檢察署、警察機關辦理有關本條例犯罪偵查工作；各地方檢察署、警察機關應指定經專業訓練之專責人員辦理本條例事件。\n為辦理本條例第二條第一項第三款性剝削行為之犯罪偵查，警察機關應指定或設立專責單位建立被害人性影像數位鑑識資料庫。\n前項資料庫之內容、儲存、管理及使用之辦法，由中央警政主管機關定之。\n中央警政主管機關、中央法務主管機關及司法院應適時辦理兒童及少年性剝削防制教育訓練，以充實調查、偵查或審理兒童及少年性剝削案件之司法警察、司法警察官、檢察事務官、檢察官或法官之辦案專業素養。","finalWhy":"一、第一項內政主管機關修正為中央警政主管機關，以利明確。\n二、增訂第二項，定明建立被害人性影像數位鑑識資料庫，將查獲之性影像轉碼為雜湊值，與過去曾查獲之性影像進行比對，找出是否有未經變造完全相同之性影像，據以確認查獲之性影像是否屬於前案被害人，俾利於犯罪偵查階段，達到被害人減述之效果。\n三、增訂第三項，定明第二項資料庫之內容、儲存、管理及使用之辦法，授權由中央警政主管機關定之。\n四、增訂第四項，參酌性侵害犯罪防治法第十條第三項規定，定明中央警政主管機關、中央法務主管機關及司法院應適時辦理兒童及少年性剝削防制教育訓練，以充實調查、偵查或審理兒童及少年性剝削案件之司法警察、司法警察官、檢察事務官、檢察官或法官之辦案專業素養，以保障兒童及少年性剝削被害人之司法權益。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第八條","current":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關，知有第四章之犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","versions":[{"bill":"202110031740000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關，知有第四章之犯罪嫌疑情事，應先行移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","note":"原條文先行限制瀏覽或移除機制，修正即時刪除機制，才能防止兒童及少年不當影音所造成之損害再透過網路傳遞擴大。"},{"bill":"202110033180000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關，知有第四章之犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留三百六十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","note":"延長相關資料保留時長，以利後續調查行為及本法第三條之資料庫建立使用。"},{"bill":"202110034460000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關，知有第四章之犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一年，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","note":"網路性犯罪具有隱蔽性高，犯罪持續時間長等特性，為便利檢警利用資料庫充分進行犯罪調查與追訴，爰修正第二項，犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料至一年。"},{"bill":"202110036660000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，接獲網路內容防護機構、主管機關、警察機關或其他機關通知，知有第四章之犯罪嫌疑情事，應於二十四小時內先行限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項網頁犯罪情節重大或曾遭限制接取者，為阻止犯罪、危害之發生或避免急迫危險，而有即時處置之必要時，主管機關得即時強制限制接取。\n第一項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。\n網際網路平臺提供者、網際網路應用服務提供者及電信事業應設置相關被害人申訴管道，並公開揭示之。\n如網際網路平臺提供者、網際網路應用服務提供者及電信事業位於境外，警察機關仍應積極協助被害者，聯繫相關平臺及業者訴請移除第四章之犯罪嫌疑情事相關資訊；必要時，得請求法務主管機關協助，透過國際刑事司法互助，向外國政府、機構或國際組織協助請求。","note":"一、為即時保護兒少被害人、儘速移除其被性剝削影像，參酌本法施行細則第五條規定目的事業主管機關收受第一項通知後，應立即以書面令網路業者於二十四小時內，限制瀏覽或移除與犯罪有關之網頁資料，明定於第一項。\n二、為強化主管機關限制接取侵害兒少之犯罪網頁，參酌行政執行法及本法施行細則第七條，增訂第二項，強化主管機關權責。\n三、為利被害人求助，爰明定網際網路平臺提供者、網際網路應用服務提供者及電信事業應設置相關被害人申訴管道。\n四、鑑於許多性剝削影像遭未經同意散布之網路通訊業者位於境外，致使被害兒少求助嚴重受阻，爰明定警察機關之積極協助職責，以及必要時得申請法務主管機關協助國際刑事司法互助之進行。"},{"bill":"202110036730000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關，知有第四章之犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料，並應通報主管機關或第五條所定機關或人員，至遲不得超過四十八小時。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","note":"一、因現兒少性剝削之犯行多透過網際網路平臺，故除要求相關網路平臺提供或是服務者，需應先行限制瀏覽或移除相關可能犯罪之網頁資料外，亦應主動通報相關主管單位，以讓犯行之遏止與調查，皆能更為提早進行。\n二、爰提案增訂本條第一項相關文字，網路平臺提供或是服務者，應於四十八小時內主動通報。\n三、第二項及第三項未修正。"},{"bill":"202110037550000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過主管機關，知有第四章之犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","note":"鑒於實務上出現各機關皆有通知權責但卻皆未履行之情形，為利權責分明，爰修訂第一項，明定僅由主管機關為通知之權責。"},{"bill":"202110038820000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關，知有第四章之犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料、交易資訊及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","note":"為考量性剝削之行為人或嫌疑人可能有支付對價之行為。爰於本條第二項增訂需保留與嫌疑人之交易資訊，使購買項目、交易金流、帳號資訊等資訊得以保存，以利犯罪查緝。"},{"bill":"202110039980000","text":"網路業者透過網路內容防護機構、性影像處理中心、主管機關、警察機關或其他機關，知有第四章犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網路業者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","note":"一、第一項及第三項配合第三條之一酌修文字，將網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，併稱為網路業者。\n二、配合修正條文第三條之一及第八條之二規定，性影像中心於接獲民眾申訴時，需通知網路業者限制瀏覽或移除與第四章犯罪有關網頁資料，爰第一項增列性影像處理中心。"},{"bill":"202110040750000","text":"網路業者透過網路內容防護機構、性影像處理中心、主管機關、警察機關或其他機關，知有第四章犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網路業者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。\n性影像處理中心得知網頁資料涉有兒童或少年之性影像犯罪嫌疑情事者，應通知網路業者、警察機關及中央主管機關。\n前項通知，應記載下列事項：\n一、足以識別犯罪嫌疑情事之網站名稱與網址及性影像之網址。\n二、行為人網路平臺帳號或網際網路協定位置。\n三、通知之國家、機關、聯絡人姓名、電話及電子郵件。\n中央主管機關收受第一項通知後，應即令網路業者於二十四小時內，依前條第一項規定，限制瀏覽或移除與犯罪有關之網頁資料。\n前項處分內容，應記載下列事項：\n一、足以識別犯罪嫌疑情事之網站名稱與網址及性影像之網址。\n二、行為人網路平臺帳號或網際網路協定位置。\n三、通知之國家、機關、聯絡人姓名、電話及電子郵件。\n四、網路業者網站名稱、網址、網際網路協定位置或其他足資辨別指涉之該網路業者特徵。\n五、主旨、事實、理由及其法令依據。\n六、有附款者，附款之內容。\n七、處分機關及其首長署名、蓋章，該機關有代理人或受任人者，須同時於其下簽名。但以自動機器作成之大量行政處分，得不經署名，以蓋章為之。\n八、發文字號及年、月、日。\n九、表明其為行政處分之意旨及不服行政處分之救濟方法、期間及其受理機關。","note":"一、第一項及第三項配合第三條之一酌修文字，將網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，併稱為網路業者。\n二、配合修正條文第三條之一及第八條之二規定，性影像中心於接獲民眾申訴時，需通知網路業者限制瀏覽或移除與第四章犯罪有關網頁資料，爰第一項增列性影像處理中心。\n三、增訂第四項，為解決過去遭受性影像散播威脅之被害人，無單一求助管道之困境，爰由中央主管機關成立單一求助平臺受理民眾申訴限制瀏覽或移除下架性影像之需求，定明性影像處理中心得知網頁資料涉有兒童或少年之性影像犯罪嫌疑情事者，應通知網路業者、警察機關及中央主管機關。\n四、為利網路業者可明確知悉網頁資料涉有兒童或少年之性影像犯罪嫌疑情事，以利其辦理限制瀏覽或移除下架事宜，爰增訂第五項，規範第四項之通知應明確記載與第四章犯罪嫌疑有關之資料，包含足以識別犯罪嫌疑情事之網站名稱與網址及性影像之網址、行為人網路平臺帳號（如ID）或網際網路協定位置（如IP位址）。另為利網路業者可與該通知單位聯繫確認網頁資料細節，並應記載通知之國家、機關、聯絡人姓名、電話及電子郵件。\n五、因第四項之通知非為行政處分，係觀念通知性質，仍應由中央主管機關作成行政處分要求網路業者限制瀏覽或移除，爰增訂第六項，定明中央主管機關收受第四項通知後，應即令網路業者於二十四小時內，依第一項規定限制瀏覽或移除與第四章犯罪有關之網頁資料。\n六、考量行政處分係行政機關就公法上具體事件所為之決定或其他公權力措施而對外直接發生法律效果之單方行政行為，爰增訂第五項，定明第六項書面內容，應包括第五項各款項目及其他行政處分所應記載事項，以利網路業者據以依限限制瀏覽或移除該犯罪嫌疑情事之網頁資料，及保留第二項犯罪網頁資料一百八十日。"},{"bill":"202110043530000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關通知，知有第四章之犯罪嫌疑情事，應於二十四小時內限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項網頁犯罪情節重大或曾遭限制接取者，為阻止犯罪、危害之發生或避免急迫危險，而有即時處置之必要時，主管機關得即時強制限制接取。\n第一項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。\n網際網路平臺提供者、網際網路應用服務提供者及電信事業應設置相關被害人申訴管道，並公開揭示之。\n如網際網路平臺提供者、網際網路應用服務提供者及電信事業位於境外，警察機關仍應積極協助被害者，聯繫相關平臺及業者訴請移除第四章之犯罪嫌疑情事相關資訊；必要時，得請求法務主管機關協助，透過國際刑事司法互助，向外國政府、機構或國際組織協助請求。","note":"一、為即時保護及協助兒少被害者，參酌本法施行細則第五條規定目的事業主管機關收受第一項通知後，應立即以書面令網路業者於二十四小時內，限制瀏覽或移除與犯罪有關之網頁資料，明定於第一項。\n二、為強化主管機關限制接取侵害兒少之犯罪網頁，參酌行政執行法及本法施行細則第七條，增訂第二項，強化主管機關權責。\n三、為利被害人求助，爰增訂第五項，網際網路平臺提供者、網際網路應用服務提供者及電信事業應設置相關被害人申訴管道。\n四、鑑於許多性剝削影像遭未經同意散布之網路通訊業者位於境外，致使被害兒少求助嚴重受阻，爰增訂第六項警察機關之積極協助職責，以及必要時得申請法務主管機關協助國際刑事司法互助之進行。"},{"bill":"202110044920000","text":"網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關，知有第四章之犯罪嫌疑情事，應於二十四小時內限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。","note":"鑒於科技進步，網路之影響無遠弗屆，為盡速改正本法犯罪態樣，爰明定網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，應於二十四小時內限制瀏覽或移除與第四章犯罪有關之網頁資料。以最迅速減少犯罪所生之損害，保障兒童及少年權益。"}],"changed":true,"final":"網路業者透過主管機關或其他機關，知有第四章犯罪嫌疑情事，應於二十四小時內限制瀏覽或移除與第四章犯罪有關之網頁資料。\n前項犯罪網頁資料與嫌疑人之個人資料及網路使用紀錄資料，應保留一百八十日，以提供司法及警察機關調查。\n直轄市、縣（市）主管機關得協助被害人於偵查中向檢察官、審理中向法院請求重製扣案之被害人性影像。第一項之網路業者於技術可行下，應依直轄市、縣（市）主管機關通知比對、移除或下架被害人之性影像。\n性影像處理中心得知網頁資料涉有兒童或少年之性影像犯罪嫌疑情事者，應通知網路業者、警察機關及中央主管機關。\n前項通知，應記載下列事項：\n一、足以識別犯罪嫌疑情事之網站名稱與網址及性影像之網址。\n二、行為人網路平臺帳號或網際網路協定位置。\n三、通知之國家、機關、聯絡人姓名、電話及電子郵件。\n中央主管機關收受第四項通知後，應即令網路業者依第一項規定，限制瀏覽或移除與犯罪有關之網頁資料。\n前項處分內容，應記載下列事項：\n一、第五項各款事項。\n二、網路業者網站名稱、網址、網際網路協定位置或其他足資辨別指涉之該網路業者特徵。\n三、主旨、事實、理由及其法令依據。\n四、有附款者，附款之內容。\n五、處分機關及其首長署名、蓋章，該機關有代理人或受任人者，須同時於其下簽名。但以自動機器作成之大量行政處分，得不經署名，以蓋章為之。\n六、發文字號及年、月、日。\n七、表明其為行政處分之意旨及不服行政處分之救濟方法、期間及其受理機關。","finalWhy":"一、配合第三條條文，酌修第一項及第三項文字，將網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，併稱為網路業者，並於第一項明定網路業者限制瀏覽或移除與第四章犯罪有關之網頁資料時限。\n二、增訂第四項，明定性影像處理中心得知網頁資料涉有兒童或少年之性影像犯罪嫌疑情事者之處理方式。\n三、增訂第五項，定明第四項之通知應明確記載與第四章犯罪嫌疑有關之資料，包含足以識別犯罪嫌疑情事之網站名稱與網址及性影像之網址、行為人網路平臺帳號（如ID）或網際網路協定位置（如IP位址）。另為利網路業者與該通知單位之聯繫，並應記載通知之國家、機關、聯絡人姓名、電話及電子郵件。\n四、增訂第六項，定明中央主管機關收受第四項通知後，應即令網路業者於二十四小時內，依第一項規定限制瀏覽或移除與第四章犯罪有關之網頁資料等行政處分；與第四項之觀念通知性質有別。\n五、增訂第七項，定明第六項書面處分內容，應包括第五項各款項目及其他行政處分所應記載事項，以利網路業者依限限制瀏覽或移除該犯罪嫌疑情事之網頁資料，及保留第二項犯罪網頁資料一百八十日。","review":{"note":"保留，送黨團協商","text":""}},{"no":"第八條之一","current":null,"versions":[{"bill":"202110034150000","text":"主管機關得知網頁資料有第四章之犯罪嫌疑情事，認有阻止犯罪、危害之發生或避免急迫危險，須即時處置之必要時，得通知目的事業主管機關及網路內容防護機構，比對、移除或下架被害人之性影像，或停止解析與犯罪有關之網域名稱。","note":"一、本條新增。\n二、部分架設於國外之兒少性剝削犯罪網站，衛福部難以下達行政命令要求其刪除或下架兒少性影像。\n三、數位發展部可透過停止解析網域名稱，制止性影像持續擴散，惟目前主管機關僅能在無從知悉網路業者聯絡資訊前提下，才能強制執行，整體效率過慢。\n四、新增本條，明定主管機關認有阻止犯罪危害之發生，或避免急迫危險可主動刪除下架兒少性影像。"},{"bill":"202110039980000","text":"性影像處理中心得知網頁資料涉有兒童或少年之性影像犯罪嫌疑情事者，應通知網路業者、警察機關及中央主管機關。\n前項通知，應記載下列事項：\n一、足以識別犯罪嫌疑情事之網站名稱與網址及性影像之網址。\n二、行為人網路平臺帳號或網際網路協定位置。\n三、通知之國家、機關、聯絡人姓名、電話及電子郵件。\n中央主管機關收受第一項通知後，應即令網路業者於二十四小時內，依前條第一項規定，限制瀏覽或移除與犯罪有關之網頁資料。\n前項處分內容，應記載下列事項：\n一、足以識別犯罪嫌疑情事之網站名稱與網址及性影像之網址。\n二、行為人網路平臺帳號或網際網路協定位置。\n三、通知之國家、機關、聯絡人姓名、電話及電子郵件。\n四、網路業者網站名稱、網址、網際網路協定位置或其他足資辨別指涉之該網路業者特徵。\n五、主旨、事實、理由及其法令依據。\n六、有附款者，附款之內容。\n七、處分機關及其首長署名、蓋章，該機關有代理人或受任人者，須同時於其下簽名。但以自動機器作成之大量行政處分，得不經署名，以蓋章為之。\n八、發文字號及年、月、日。\n九、表明其為行政處分之意旨及不服行政處分之救濟方法、期間及其受理機關。","note":"一、本條新增。\n二、第一項定明，為解決過去遭受性影像散播威脅的被害人，無單一求助管道之困境，爰由衛生福利部成立單一求助平臺受理民眾申訴限制瀏覽或移除下架性影像之需求，於得知網頁資料涉有本條例第四章所定犯罪嫌疑情事者應通知網路業者、警察機關及中央主管機關。\n三、為利網路業者可明確知悉網頁資料涉有兒童或少年之性影像犯罪嫌疑情事，以利其辦理限制瀏覽或移除下架事宜，爰於第二項定明，規範第一項之通知應明確記載與第四章犯罪嫌疑有關之資料，包含足以識別犯罪嫌疑情事之網站名稱與網址及性影像之網址、行為人網路平臺帳號（如ID）或網際網路協定位置（如IP位址）。另為利網路業者可與該通知單位聯繫確認網頁資料細節，並應記載通知之國家、機關、聯絡人姓名、電話及電子郵件。\n四、因第一項之通知非為行政處分性質，係觀念通知性質，仍應由中央主管機關作成行政處分要求網路業者限制瀏覽或移除，爰於第三項定明，中央主管機關收受第一項通知後，應即令網路業者於二十四小時內，依本條例第八條第一項規定限制瀏覽或移除與第四章犯罪有關之網頁資料。\n五、考量行政處分係行政機關就公法上具體事件所為之決定或其他公權力措施而對外直接發生法律效果之單方行政行為，爰於第四項定明，第三項書面內容，應包括第二項各款項目、本條例第八條第二項犯罪網頁資料保留一百八十日之起訖日期及其他行政處分所應記載事項，以利網路業者據以依限限制瀏覽或移除該犯罪嫌疑情事之網頁資料，及保留本條例第八條第二項犯罪網頁資料一百八十日。"},{"bill":"202110040750000","text":"主管機關對網路業者依前條及第四十七條作成之行政處分，得以電子文件利用網際網路之方式，傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單，以為送達。\n前項電子文件，由主管機關傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日，發生依法送達、通知或使其知悉之效力。但有下列情形之一者，不在此限：\n一、電子文件已傳送而未進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單。\n二、電子文件已進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日，網路業者釋明其無法閱讀。\n三、網路業者證明電子文件於較早或較晚之時點進入其公開揭示、指定或網域註冊之電子郵件、電子表單。\n前項但書第一款情形有爭議時，由主管機關證明；主管機關不能證明者，應另以適當之方式重行送達、通知或使其知悉。\n第二項但書第二款情形，主管機關應另以適當之方式重行送達、通知或使其知悉。\n第二項但書第三款情形，依網路業者證明較早或較晚之時點，發生依法送達、通知或使其知悉之效力。\n有下列情形之一者，主管機關得為限制接取：\n一、無從知悉網路業者聯絡資訊，致無法為第一項之送達者。\n二、認網頁資料所涉犯罪嫌疑情節重大，為避免犯罪、危害擴大或避免急迫危險，而有即時處置之必要時。\n主管機關為執行前項及第四十七條之限制接取，數位發展部、教育部、國家通訊傳播委員會、法務部、內政部警政署、網際網路接取服務提供者應協助執行。","note":"一、本條新增。\n二、鑒於現行網路無國界，為避免兒童或少年性影像於網路上一再供人觀覽、散布，倘以書面行政處分，透過郵寄之送達程序，恐因送達時程冗長，致該兒童或少年性影像不斷遭散布，除緩不濟急外，亦無法達到第八條所欲達到快速限制瀏覽或移除性影像之立法目的。為求其慎重及確保文書得以長期保存，並可作為證據方法據以確認並證明行為人之真意，達到避免爭議之功能。因此，若以電子文件取代書面，亦應審慎確保行為人之真實性，以及文件內容之完整、真實正確及穩定安全，並於長時間經過後仍可檢視並驗證其內容，始得認為與書面形式具有相當性。又依據行政程序法第六十八條第二項規定，行政機關之文書依法規以電報交換、電傳文件、傳真或其他電子文件行之者，視為自行送達。爰參考該條第二項，於本條第一項定明主管機關依前條及第四十七條作成之行政處分，得以電子文件利用網際網路之方式，傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單或其他電子方式，以為送達。另電子郵件為email、e-mail，電子表單則如美商科高國際有限公司Google所使用Google表單、台灣臉書有限公司設置資訊系統電子表單。\n三、行政文書之依法送達、通知或使其知悉，與行政機關對人民之行政行為或行政程序行為發生效力之時點息息相關，為避免對於電子文件是否已送達、通知或使其知悉及其時點有爭議，以致影響法律秩序之安定性，宜就電子文件之送達、通知或使其知悉之時點予以規範。依一般電子作業程序，理論上至遲於傳送電子文件後一個工作日，即可視為已送達、通知或使其知悉，爰於第二項定明電子文件以主管機關傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單或其他電子方式後一工作日，發生依法送達、通知或使其知悉之效力。然而，若行政機關已傳送電子文件，惟電子文件並未進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單；或自電子文件進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日內，網路業者向主管機關釋明其無法閱讀該電子文件；或網路業者證明電子文件於較早或較晚之時點進入其指定之電子郵件、電子表單，有上開三種情形時，則不以第二項本文所定之時點發生送達效力，故將之明列於第二項但書。第二項所定「工作日」指處分機關所在地之工作日。\n四、主管機關如已傳送電子文件，而電子文件有無進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單，屬事實認定之問題，若認定有爭議時，基於消極事實難以被證明，自無法期待網路業者得證明該電子文件並未進入其公開揭示、指定或網域註冊之電子郵件、電子表單，故參酌德國聯邦行政程序法第四十一條第二項規定，於第三項定明由主管機關負舉證責任，如行政機關不能證明者，則應另以適當之方式重行送達、通知或使其知悉。所謂「適當之方式」，包含以書面方式重行送達，或排除技術障礙後，再次以電子方式重行送達、通知或使其知悉。\n五、主管機關傳送電子文件時，可能因新舊軟體版本差異或其他科技技術問題，致發生網路業者無法閱讀該電子文件之情形；考量網路業者既已公開揭示或指定收受電子文件之電子郵件、電子表單，應可認為其有於行政程序中收受電子文件之意願及準備，倘發生無法閱讀電子文件之情形，網路業者自應於電子文件進入其公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日內，向主管機關釋明其無法閱讀，此時主管機關即應另以適當之方式重行送達、通知或使其知悉，爰參酌德國聯邦行政程序法第三條之一第三項規定，於本條第四項定明之。所謂「適當之方式」，與第三項之規定相同，包含以書面方式重行送達、通知或使其知悉，或排除技術障礙後，再次以電子方式重行送達、通知或使其知悉。\n六、第二項雖定明電子文件以主管機關傳送至網路業者公開揭示或指定之電子郵件、電子表單後一工作日，發生依法送達、通知或使其知悉之效力。惟網路業者若證明主管機關傳送之電子文件於較早或較晚之時點進入其指定之電子郵件、電子表單者，則以網路業者證明之時點，發生依法送達、通知或使其知悉之效力，爰為第五項規定。又本項僅賦予網路業者證明之權利，於主管機關則無適用，併此敘明。\n七、考量實務上境外網路業者部分網站未公開揭示或網域註冊商查無可收受前條電子文件之電子郵件、電子表單，或收受第七條書面文件之聯絡資訊者，無法送達令其限制瀏覽或移除犯罪網頁資料之行政處分，導致無法遏止兒童或少年性影像一再遭散布之情形，爰參酌行政執行法第三十六條即時強制之規定，增訂第六項第一款，主管機關無從知悉網路業者聯絡資訊，得為限制接取該網路平臺。\n八、衡酌實務上，有境外網路業者架設網站放置大量兒童或少年性影像，其網頁資料若經由通知再限制瀏覽或移除該性影像，對於遏止性影像一再遭散布恐緩不濟急。又倘該網頁資料涉犯罪嫌疑情節重大（如該網站具大量兒少性影像或兒少色情網站），恐造成兒少被害人嚴重侵害、有急迫危險，爰增訂第六項第二款，主管機關認網頁資料所涉犯罪嫌疑情節重大，為避免犯罪、危害擴大或避免急迫危險，而有即時處置之必要時，得為限制接取。\n九、考量即時強制、限制接取或刑事訴訟法所為之域名扣押，多採取域名停止解析（DNS RPZ）方式，實務上係由主管機關依法通知或檢察官依法院判決通知網際網路接取服務提供者、學術網路專線擁有者，及財團法人台灣網路資訊中心（TWNIC），爰增訂第七項，主管機關為執行前項及第四十七條之限制接取，數位發展部（財團法人台灣網路資訊中心主管機關）、教育部（學術網路主管機關）、國家通訊傳播委員會（登記為電信事業之網際網路接取服務提供者主管機關）、法務部、內政部警政署及網際網路接取服務提供者應協助執行。"},{"bill":"202110040770000","text":"中央主管機關得主動蒐集網際網路具第四章之犯罪嫌疑資料，及時通知網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者依前條辦理。","note":"本條係新增：根據本法第八條第一項規定「網際網路平臺提供者、網際網路應用服務提供者及網際網路接取服務提供者，透過網路內容防護機構、主管機關、警察機關或其他機關，知有第四章之犯罪嫌疑情事，應先行限制瀏覽或移除與第四章犯罪有關之網頁資料。」可知目前處理不法性影像主要是透過受害人申訴，防制兒童或少年性剝削效果有限，為使中央主管機關衛生福利部可普遍巡網，主動蒐集網際網路上之犯罪嫌疑資料，及時通知網際網路業者，而新增本條之規定。"}],"changed":true,"final":"主管機關對網路業者依前條及第四十七條作成之行政處分，得以電子文件利用網際網路之方式，傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單，以為送達。\n前項電子文件，由主管機關傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日，發生依法送達、通知或使其知悉之效力。但有下列情形之一者，不在此限：\n一、電子文件已傳送而未進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單。\n二、電子文件已進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日，網路業者釋明其無法閱讀。\n三、網路業者證明電子文件於較早或較晚之時點進入其公開揭示、指定或網域註冊之電子郵件、電子表單。\n前項但書第一款情形有爭議時，由主管機關證明；主管機關不能證明者，應另以適當之方式重行送達、通知或使其知悉。\n第二項但書第二款情形，主管機關應另以適當之方式重行送達、通知或使其知悉。\n第二項但書第三款情形，依網路業者證明較早或較晚之時點，發生依法送達、通知或使其知悉之效力。\n有下列情形之一者，主管機關得為限制接取：\n一、無從知悉網路業者聯絡資訊，致無法為第一項之送達。\n二、認網頁資料所涉犯罪嫌疑情節重大，為避免犯罪、危害擴大或避免急迫危險，而有即時處置之必要時。\n三、網路業者經限制接取後，更換網域名稱或其他方法疑有第四章犯罪嫌疑情事。\n主管機關為執行前項及第四十七條之限制接取，數位發展主管機關、教育主管機關、通訊傳播主管機關、法務主管機關、警政主管機關、網際網路接取服務提供者應依法協助執行。","finalWhy":"一、本條新增。\n二、鑒於網路傳播迅速、無國界等性質，為避免、降低兒童或少年性影像於網路遭侵害之情事，以達本條例第八條快速限制瀏覽或移除性影像之立法目的，參考行政程序法第六十八條第二項規定，於本條第一項定明主管機關依本條例第八條及第四十七條作成之行政處分，得以電子文件送達及其方式。\n三、為利法律秩序之安定性，依一般電子作業程序，於本條第二項定明行政處分以電子文件送達、通知或使其知悉之時點、效力，及例外情形。本條第二項所定「工作日」指處分機關所在地之工作日。\n四、為處理主管機關電子文件送達之例外情形與爭議等證明，參酌德國聯邦行政程序法第四十一條第二項、第三條之一第三項規定規定，於本條第三項至第五項定明各該情形之舉證責任、不能證明時之處理方式，及重行送達、通知或使網路業者知悉等方式。本條第三項及第四項所稱「適當之方式」，包含以書面方式重行送達，或排除技術障礙後，再次以電子方式重行送達、通知或使其知悉。又本條第五項規定僅賦予網路業者證明之權利，主管機關尚無適用。\n五、參酌行政執行法第三十六條即時強制規定，並為迅速遏止兒童及少年性影像遭散布、避免網頁資料所涉犯罪情節重大（如具大量兒童及少性影像之網頁、兒童及少年色情網站）所致之嚴重侵害與急迫危險，同時因應網路業者遭主管機關限制接取後，以更換網域名稱或其他方法再行本條例所涉犯罪嫌疑等情事，於本條第六項定明主管機關得為強制接取之情形。\n六、考量現行即時強制、限制接取或刑事訴訟法所為之域名扣押，多採取域名停止解析（DNS RPZ）方式，實務上係由主管機關依法通知或檢察官依法院判決通知網際網路接取服務提供者、學術網路專線擁有者，及財團法人台灣網路資訊中心（TWNIC）辦理，涉及各目的事業主管機關權責，爰於本條第七項定明，主管機關為執行本條第六項及第四十七條之限制接取，數位發展主管機關（財團法人台灣網路資訊中心主管機關）、教育主管機關（學術網路主管機關）、通訊傳播主管機關（登記為電信事業之網際網路接取服務提供者主管機關）、法務主管機關、警政主管機關及網際網路接取服務提供者應依法協助執行。","review":{"note":"修正通過","text":"主管機關對網路業者依前條及第四十七條作成之行政處分，得以電子文件利用網際網路之方式，傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單，以為送達。\n前項電子文件，由主管機關傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日，發生依法送達、通知或使其知悉之效力。但有下列情形之一者，不在此限：\n一、電子文件已傳送而未進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單。\n二、電子文件已進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日，網路業者釋明其無法閱讀。\n三、網路業者證明電子文件於較早或較晚之時點進入其公開揭示、指定或網域註冊之電子郵件、電子表單。\n前項但書第一款情形有爭議時，由主管機關證明；主管機關不能證明者，應另以適當之方式重行送達、通知或使其知悉。\n第二項但書第二款情形，主管機關應另以適當之方式重行送達、通知或使其知悉。\n第二項但書第三款情形，依網路業者證明較早或較晚之時點，發生依法送達、通知或使其知悉之效力。\n有下列情形之一者，主管機關得為限制接取：\n一、無從知悉網路業者聯絡資訊，致無法為第一項之送達。\n二、認網頁資料所涉犯罪嫌疑情節重大，為避免犯罪、危害擴大或避免急迫危險，而有即時處置之必要時。\n三、網路業者經限制接取後，更換網域名稱或其他方法疑有第四章犯罪嫌疑情事。\n主管機關為執行前項及第四十七條之限制接取，數位發展主管機關、教育主管機關、通訊傳播主管機關、法務主管機關、警政主管機關、網際網路接取服務提供者應依法協助執行。"}},{"no":"第八條之二","current":null,"versions":[{"bill":"202110039980000","text":"中央主管機關對網路業者依前條及本條例第四十七條作成之行政處分，得以電子文件利用網際網路之方式，傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單，以為送達。\n前項電子文件，由中央主管機關傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日，發生依法送達、通知或使其知悉之效力。但有下列情形之一者，不在此限：\n一、電子文件已傳送而未進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單。\n二、電子文件已進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日，網路業者釋明其無法閱讀。\n三、網路業者證明電子文件於較早或較晚之時點進入其公開揭示、指定或網域註冊之電子郵件、電子表單。\n前項但書第一款情形有爭議時，由中央主管機關證明；中央主管機關不能證明者，應另以適當之方式重行送達、通知或使其知悉。\n第二項但書第二款情形，中央主管機關應另以適當之方式重行送達、通知或使其知悉。\n第二項但書第三款情形，依網路業者證明較早或較晚之時點，發生依法送達、通知或使其知悉之效力。","note":"一、本條新增。\n二、鑒於現行網路無國界，為避免兒童或少年性影像於網路上一再供人觀覽、散布，倘以書面行政處分，透過郵寄之送達程序，恐因送達時程冗長，致該兒童或少年性影像不斷遭散布，除緩不濟急外，亦無法達到本條例第八條所欲達到快速限制瀏覽或移除性影像之立法目的。為求其慎重及確保文書得以長期保存，並可作為證據方法據以確認並證明行為人之真意，達到避免爭議之功能。因此，若以電子文件取代書面，亦應審慎確保行為人之真實性，以及文件內容之完整、真實正確及穩定安全，並於長時間經過後仍可檢視並驗證其內容，始得認為與書面形式具有相當性。又依據行政程序法第六十八條第二項規定，行政機關之文書依法規以電報交換、電傳文件、傳真或其他電子文件行之者，視為自行送達。爰參考行政程序法第六十八條第二項，於第一項定明中央主管機關依前條及本條例第四十七條作成之行政處分，得以電子文件利用網際網路之方式，傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單或其他電子方式，以為送達。另電子郵件為email、e-mail，電子表單則如美商科高國際有限公司Google所使用Google表單、台灣臉書有限公司設置資訊系統電子表單。\n三、行政文書之依法送達、通知或使其知悉，與行政機關對人民之行政行為或行政程序行為發生效力之時點息息相關，為避免對於電子文件是否已送達、通知或使其知悉及其時點有爭議，以致影響法律秩序之安定性，宜就電子文件之送達、通知或使其知悉之時點予以規範。依一般電子作業程序，理論上至遲於傳送電子文件後一個工作日，即可視為已送達、通知或使其知悉，爰於第二項定明電子文件以中央主管機關傳送至網路業者公開揭示、指定或網域註冊之電子郵件、電子表單或其他電子方式後一工作日，發生依法送達、通知或使其知悉之效力。然而，若行政機關已傳送電子文件，惟電子文件並未進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單；或自電子文件進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日內，網路業者向中央主管機關釋明其無法閱讀該電子文件；或網路業者證明電子文件於較早或較晚之時點進入其指定之電子郵件、電子表單，有上開三種情形時，則不以第二項本文所定之時點發生送達效力，故將之明列於第二項但書。本條第二項所定「工作日」指處分機關所在地之工作日。\n四、中央主管機關如已傳送電子文件，而電子文件有無進入網路業者公開揭示、指定或網域註冊之電子郵件、電子表單，屬事實認定之問題，若認定有爭議時，基於消極事實難以被證明，自無法期待網路業者得證明該電子文件並未進入其公開揭示、指定或網域註冊之電子郵件、電子表單，故參酌德國聯邦行政程序法第四十一條第二項規定，於第三項定明由中央主管機關負舉證責任，如行政機關不能證明者，則應另以適當之方式重行送達、通知或使其知悉。所謂「適當之方式」，包含以書面方式重行送達，或排除技術障礙後，再次以電子方式重行送達、通知或使其知悉。\n五、中央主管機關傳送電子文件時，可能因新舊軟體版本差異或其他科技技術問題，致發生網路業者無法閱讀該電子文件之情形；考量網路業者既已公開揭示或指定收受電子文件之電子郵件、電子表單，應可認為其有於行政程序中收受電子文件之意願及準備，倘發生無法閱讀電子文件之情形，網路業者自應於電子文件進入其公開揭示、指定或網域註冊之電子郵件、電子表單後一工作日內，向中央主管機關釋明其無法閱讀，此時中央主管機關即應另以適當之方式重行送達、通知或使其知悉，爰參酌德國聯邦行政程序法第三條之一第三項規定，於第四項定明之。所謂「適當之方式」，與第三項之規定相同，包含以書面方式重行送達、通知或使其知悉，或排除技術障礙後，再次以電子方式重行送達、通知或使其知悉。\n六、第二項雖定明電子文件以中央主管機關傳送至網路業者公開揭示或指定之電子郵件、電子表單後一工作日，發生依法送達、通知或使其知悉之效力。惟網路業者若證明中央主管機關傳送之電子文件於較早或較晚之時點進入其指定之電子郵件、電子表單者，則以網路業者證明之時點，發生依法送達、通知或使其知悉之效力，爰為第五項規定。又本項僅賦予網路業者證明之權利，於中央主管機關則無適用，併此敘明。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第八條之三","current":null,"versions":[{"bill":"202110039980000","text":"中央主管機關無從知悉網路業者聯絡資訊，致無法為前條之送達者，得為限制接取。\n中央主管機關認網頁資料所涉犯罪嫌疑情節重大，為避免犯罪、危害擴大或避免急迫危險，而有即時處置之必要時，得為限制接取。\n中央主管機關為執行前二項及第四十七條之限制接取，數位發展部、教育部、國家通訊傳播委員會、法務部、內政部警政署、網際網路接取服務提供者應協助執行。","note":"一、本條新增。\n二、考量實務上境外網路業者部分網站未公開揭示或網域註冊商查無可收受前條電子文件之電子郵件、電子表單，或收受第七條書面文件之聯絡資訊者，無法送達令其限制瀏覽或移除犯罪網頁資料之行政處分，導致無法遏止兒童或少年性影像一再遭散布之情形，爰參酌行政執行法第三十六條即時強制之規定，定明第一項，中央主管機關無從知悉網路業者聯絡資訊，得為限制接取該網路平臺。\n三、衡酌實務上，有境外網路業者架設網站放置大量兒童或少年性影像，其網頁資料若經由通知再限制瀏覽或移除該性影像，對於遏止性影像一再遭散布恐緩不濟急。又倘該網頁資料涉犯罪嫌疑情節重大（如該網站具大量兒少性影像或兒少色情網站），為避免因中央主管機關所為限制接取，致司法警察或檢察官於偵查中不利其犯罪證據保全，恐造成損害兒少被害人司法權益，爰定明第二項，中央主管機關認網頁資料所涉犯罪嫌疑情節重大，為避免犯罪、危害擴大或避免急迫危險，而有即時處置之必要時，得為限制接取。\n四、考量即時強制、限制接取或刑事訴訟法所為之域名扣押，多採取域名停止解析（DNS RPZ）方式，實務上係由主管機關依法通知或檢察官依法院判決通知網際網路接取服務提供者、學術網路專線擁有者，及財團法人台灣網路資訊中心（TWNIC），爰定明第四項，中央主管機關為執行前二項及第四十七條之限制接取，數位發展部（財團法人台灣網路資訊中心主管機關）、教育部（學術網路主管機關）、國家通訊傳播委員會（登記為電信事業之網際網路接取服務提供者主管機關）、法務部、內政部警政署、網際網路接取服務提供者及財團法人台灣網路資訊中心應協助執行。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第十五條","current":"檢察官、司法警察官及司法警察查獲及救援被害人後，應於二十四小時內將被害人交由當地直轄市、縣（市）主管機關處理。\n前項直轄市、縣（市）主管機關應即評估被害人就學、就業、生活適應、人身安全及其家庭保護教養功能，經列為保護個案者，為下列處置：\n一、通知父母、監護人或親屬帶回，並為適當之保護及教養。\n二、送交適當場所緊急安置、保護及提供服務。\n三、其他必要之保護及協助。\n前項被害人未列為保護個案者，直轄市、縣（市）主管機關得視其需求，轉介相關服務資源協助。\n前二項規定於直轄市、縣（市）主管機關接獲報告、自行發現或被害人自行求助者，亦同。","versions":[{"bill":"202110033180000","text":"檢察官、司法警察官及司法警察查獲及救援被害人後，應於二十四小時內將被害人交由當地直轄市、縣（市）主管機關處理。\n前項直轄市、縣（市）主管機關應即評估被害人就學、就業、生活適應、人身安全及其家庭保護教養功能，經列為保護個案者，為下列處置：\n一、通知父母、監護人或親屬帶回，並為適當之保護及教養。\n二、送交適當場所緊急安置、保護及提供服務，並提供心理諮詢與輔導課程至少十八小時。\n三、其他必要之保護及協助。\n前項被害人未列為保護個案者，直轄市、縣（市）主管機關得視其需求，轉介相關服務資源協助。\n前二項規定於直轄市、縣（市）主管機關接獲報告、自行發現或被害人自行求助者，亦同。","note":"未成年人遭受到迫害，除轉換場所外，應給予積極性的心理層面輔導，避免產生怪罪自己的情緒，或是遭到同儕異樣眼光看待等情事發生，產生負面循環。"}],"changed":false,"final":"檢察官、司法警察官及司法警察查獲及救援被害人後，應於二十四小時內將被害人交由當地直轄市、縣（市）主管機關處理。\n前項直轄市、縣（市）主管機關應即評估被害人就學、就業、生活適應、人身安全及其家庭保護教養功能，經列為保護個案者，為下列處置：\n一、通知父母、監護人或親屬帶回，並為適當之保護及教養。\n二、送交適當場所緊急安置、保護及提供服務。\n三、其他必要之保護及協助。\n前項被害人未列為保護個案者，直轄市、縣（市）主管機關得視其需求，轉介相關服務資源協助。\n前二項規定於直轄市、 護人犯第三十二條至第三十八條、第三十九條第二項、第四項之罪者，被害人、檢察官、被害人最近尊親屬、直轄市、縣（市）主管機關、兒童及少年福利機構或其他利害關係人，得向法院聲請停止其行使、負擔父母對於被害人之權利義務，另行選定監護人。對於養父母，並得請求法院宣告終止其收養關係。\n法院依前項規定選定或改定監護人時，得指定直轄市、縣（市）主管機關、兒童及少年福利機構或其他適當之人為被害人之監護人，並得指定監護方法、命其父母、原監護人或其他扶養義務人交付子女、支付選定或改定監護人相當之扶養費用及報酬、命為其他必要處分或訂定必要事項。\n前項裁定，得為執行名義。"}},{"no":"第三十條","current":"直轄市、縣（市）主管機關應對有下列情形之一之被害人進行輔導處遇及追蹤，並提供就學、就業、自立生活或其他必要之協助，其期間至少一年或至其年滿二十歲止：\n一、經依第十五條第二項第一款及第三款規定處遇者。\n二、經依第十六條第一項、第二項規定不付安置之處遇者。\n三、經依第十六條第二項規定安置於兒童及少年福利機構、寄養家庭或其他適當之醫療、教育機構，屆期返家者。\n四、經依第十六條第三項規定裁定停止安置，並交由被害人之父母、監護人或其他適當之人保護及教養者。\n五、經依第十九條第一項第二款規定之安置期滿。\n六、經依第二十一條規定裁定安置期滿或停止安置。\n前項輔導處遇及追蹤，教育、勞動、衛生、警察等單位，應全力配合。","versions":[{"bill":"202110034020000","text":"直轄市、縣（市）主管機關應對有下列情形之一之被害人進行輔導處遇及追蹤，並提供就學、就業、自立生活或其他必要之協助，其期間至少三年或至其年滿二十歲止：\n一、經依第十五條第二項第一款及第三款規定處遇者。\n二、經依第十六條第一項、第二項規定不付安置之處遇者。\n三、經依第十六條第二項規定安置於兒童及少年福利機構、寄養家庭或其他適當之醫療、教育機構，屆期返家者。\n四、經依第十六條第三項規定裁定停止安置，並交由被害人之父母、監護人或其他適當之人保護及教養者。\n五、經依第十九條第一項第二款規定之安置期滿。\n六、經依第二十一條規定裁定安置期滿或停止安置。\n前項輔導處遇及追蹤，教育、勞動、衛生、警察等單位，應全力配合。\n地方主管機關依第一項辦理提供就學、就業、自立生活或其他必要之協助，中央主管機關應予補助所需之經費。","note":"一、本於遭受性剝削兒少受害族群，所應受之支持服務需再予強化之認知，並為了有效把關受害兒少身心穩定發展、深化兒少所處環境之追蹤與預防保護，因此將現行直轄市、縣（市）主管機關應對被害人進行輔導處遇及追蹤，並提供就學、就業、自立生活或其他必要協助之時限，自至少一年時間長度，特修正至至少三年時間長度。\n二、新增第三項，地方主管機關辦理提供被害人之就學、就業、自立生活或其他必要之協助所需之經費，應由中央主管機關補助之。"}],"changed":false,"final":"直轄市、縣（市）主管機關應對有下列情形之一之被害人進行輔導處遇及追蹤，並提供就學、就業、自立生活或其他必要之協助，其期間至少一年或至其年滿二十歲止：\n一、經依第十五條第二項第一款及第三款規定處遇者。\n二、經依第十六條第一項、第二項規定不付安置之處遇者。\n三、經依第十六條第二項規定安置於兒童及少年福利機構、寄養家庭或其他適當之醫療、教育機構，屆期返家者。\n四、經依第十六條第三項規定裁定停止安置，並交由被害人之父母、監護人或其他適當之人保護及教養者。\n五、經依第十九條第一項第二款規定之安置期滿。\n六、經依第二十一條規定裁定安置期滿或停止安置。\n前項輔導處遇及追蹤，教育、勞動、衛生、警察等單位，應全力配合。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第三十一條","current":"與未滿十六歲之人為有對價之性交或猥褻行為者，依刑法之規定處罰之。\n十八歲以上之人與十六歲以上未滿十八歲之人為有對價之性交或猥褻行為者，處三年以下有期徒刑、拘役或新臺幣十萬元以下罰金。","versions":[{"bill":"202110033180000","text":"與未滿十六歲之人為有對價之性交或猥褻行為者，依刑法之規定處罰之。\n十八歲以上之人與十六歲以上未滿十八歲之人為有對價之性交或猥褻行為者，處五年以下有期徒刑、拘役或新臺幣五十萬元以下罰金。","note":"提高刑責與刑度，增加嚇阻與懲罰力度。"},{"bill":"202110039410000","text":"與未滿十六歲之人為有對價之性交或猥褻行為者，依刑法之規定處罰之。\n十八歲以上之人與十六歲以上未滿十八歲之人為有對價之性交或猥褻行為者，處五年以下有期徒刑、拘役或新臺幣五十萬元以下罰金。","note":"提高刑責與刑度，增加嚇阻與懲罰力度。"}],"changed":false,"final":"與未滿十六歲之人為有對價之性交或猥褻行為者，依刑法之規定處罰之。\n十八歲以上之人與十六歲以上未滿十八歲之人為有對價之性交或猥褻行為者，處三年以下有期徒刑、拘役或新臺幣十萬元以下罰金。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第三十二條","current":"引誘、容留、招募、媒介、協助或以他法，使兒童或少年為有對價之性交或猥褻行為者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。以詐術犯之者，亦同。\n意圖營利而犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣五百萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","versions":[{"bill":"202110033180000","text":"引誘、容留、招募、媒介、協助或以他法，使兒童或少年為有對價之性交或猥褻行為者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。以詐術犯之者，亦同。\n意圖營利而犯前項之罪者，處五年以上十二年以下有期徒刑，併科新臺幣五百萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","note":"提高刑責與刑度，增加嚇阻與懲罰力度，意圖營利者因有營利且集團化的趨向，惡行更為重大，因此提高所受本刑五年以上，加重處罰。"},{"bill":"202110034400000","text":"引誘、容留、招募、媒介、協助或以他法，使兒童或少年為有對價之性交或猥褻行為者，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。以詐術犯之者，亦同。\n意圖營利而犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣五百萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","note":"鑒於數位發展快速，實務上出現網路論壇與偷拍集團合作，利用性誘拐、詐騙、網路約會、性交易等方式使兒童及少年發生性行為，取得自拍或偷拍而來的非自願外流性私密影像，再放上論壇販售。且該類論壇參與人數眾多，兒少性影像遭散布之風險升高，受害者不計其數、更因此二次傷害，故提高最輕本刑，以確保兒童及少年免於遭受任何形式之性剝削，保護其身心健全發展。"},{"bill":"202110036130000","text":"引誘、容留、招募、媒介、協助或以他法，使兒童或少年為有對價之性交或猥褻行為者，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。以詐術犯之者，亦同。\n意圖營利而犯前項之罪者，處五年以上十二年以下有期徒刑，併科新臺幣七百萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","note":"一、現今出現性誘拐、詐騙、網路約會、性交易等方式使兒童及少年發生性行為，取得自拍或偷拍而來之非自願外流性私密影像，並於社群媒體傳播，更甚者放上論壇販售。而相關社群或營利論壇參與人數眾多，散佈效應廣泛且快速，致使受害者不計其數，更因此造成二次剝削傷害。故提高刑度，以達有效嚇阻效果，確保兒童及少年免於遭受任何形式之性剝削，保護其身心健全發展，爰此修正刑度。\n二、由於相關散佈、播送、公然陳列及營利行為往往規模巨大，牽連被害者甚眾。考量其造成嚴重影響，且為自身之金錢或網路流量利益枉顧被害者身心不利影響乃至其身心嚴重受創，爰此加重其所有刑罰。"},{"bill":"202110034280000","text":"引誘、容留、招募、媒介、協助或以他法，使兒童或少年為有對價之性交或猥褻行為者，處五年以上有期徒刑，得併科新臺幣三百萬元以下罰金。以詐術犯之者，亦同。\n意圖營利而犯前項之罪者，處七年以上有期徒刑，併科新臺幣五百萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處五年以上有期徒刑，得併科新臺幣三百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","note":"為保障未成年權益，防止未成年受性剝削之害，目前刑度不足以因應社會變遷以及實務需求，針對有期徒刑予以加重：\n一、第一項之有期徒刑，由「一年以上七年以下」修正為「五年以上」。\n二、第二項之有期徒刑，由「三年以上十年以下」修正為「七年以上」。\n三、第三項之有期徒刑，由「一年以上七年以下」修正為「五年以上」。"},{"bill":"202110039410000","text":"引誘、容留、招募、媒介、協助或以他法，使兒童或少年為有對價之性交或猥褻行為者，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。以詐術犯之者，亦同。\n意圖營利而犯前項之罪者，處五年以上十二年以下有期徒刑，併科新臺幣五百萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","note":"提高刑責與刑度，增加嚇阻與懲罰力度，意圖營利者因有營利且集團化的趨向，惡行更為重大，因此提高所受本刑五年以上，加重處罰。"},{"bill":"202110040850000","text":"引誘、容留、招募、媒介、協助或以他法，使兒童或少年為有對價之性交或猥褻行為者，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。以詐術犯之者，亦同。\n意圖營利而犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣五百萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","note":"一、鑒於數位發展快速，實務上出現網路論壇與偷拍集團合作，利用性誘拐、詐騙、網路約會、性交易等方式使兒童及少年發生性行為，取得自拍或偷拍而來的非自願外流性私密影像，再放上論壇。\n二、為強化兒童及少年之保護，健全其身心發展，並保護兒童及少年之性隱私，故提高最輕本刑，以確保兒童及少年免於遭受任何形式之性剝削，保護其身心健全發展。"}],"changed":false,"final":"引誘、容留、招募、媒介、協助或以他法，使兒童或少年為有對價之性交或猥褻行為者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。以詐術犯之者，亦同。\n意圖營利而犯前項之罪者，處三年以上十年以下有期徒刑，併科新臺幣五百萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","finalWhy":null,"review":{"note":"保留，送黨團協商","text":""}},{"no":"第三十三條","current":"以強暴、脅迫、恐嚇、監控、藥劑、催眠術或其他違反本人意願之方法，使兒童或少年為有對價之性交或猥褻行為者，處七年以上有期徒刑，得併科新臺幣七百萬元以下罰金。\n意圖營利而犯前項之罪者，處十年以上有期徒刑，併科新臺幣一千萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","versions":[{"bill":"202110033180000","text":"以強暴、脅迫、恐嚇、監控、藥劑、催眠術或其他違反本人意願之方法，使兒童或少年為有對價之性交或猥褻行為者，處十年以上有期徒刑，得併科新臺幣七百萬元以下罰金。\n意圖營利而犯前項之罪者，處十年以上有期徒刑或無期徒刑，併科新臺幣一千萬元以下罰金。\n媒介、交付、收受、運送、藏匿前二項被害人或使之隱避者，處五年以上十二年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n前項交付、收受、運送、藏匿行為之媒介者，亦同。\n前四項之未遂犯罰之。","note":"提高刑責與刑度，增加嚇阻與懲罰力度，意圖營利者因有營利且集團化的趨向，且涉犯本條所規範之犯罪型態為強暴、脅迫暴力行為者，刑度提高至十年以上，意圖營利者增加無期徒刑。"},{"bill":"202110036130000","text":"以強暴、脅迫、恐嚇、監控、藥劑、催眠術或其他違反本人意願之方法，使兒童或少年為有對價之性交或猥褻行為者，處十年以上有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖營利而犯前項之罪者，處十二年以上有期徒刑，併科新臺幣一千二百萬元以下罰金。\n 行為，以供人觀覽者，處十年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","note":"為保障未成年權益，防止未成年受性剝削之害，而現行實務多以網路直播方式供人觀覽，目前刑度不足以因應社會變遷以及實務需求，針對有期徒刑予以加重：\n一、第一項之有期徒刑，由「三年以上十年以下」修正為「七年以上」。\n二、第二項之有期徒刑，由「七年以上」修正為「十年以上」。"},{"bill":"202110039410000","text":"招募、引誘、容留、媒介、協助、利用或以他法，使兒童或少年為性交或猥褻之行為，以供人觀覽者，處五年以上十二年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年為性交或猥褻之行為，以供人觀覽者，處十年以上有期徒刑或無期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","note":"提高刑責與刑度，增加嚇阻與懲罰力度，意圖營利者因有營利且集團化的趨向，惡行更為重大，因此提高所受本刑至五年以上，加重處罰。"},{"bill":"202110044920000","text":"招募、引誘、容留、媒介、協助、利用或以他法，使兒童或少年為性交或猥褻之行為，以供人觀覽者，處三年以上十年以下有期徒刑，得併科新臺幣六百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年為性交或猥褻之行為，以供人觀覽者，處七年以上有期徒刑，得併科新臺幣八百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","note":"一、依據衛生福利部保護服務司之「兒童及少年性剝削通報被害人概況」統計，兒童及少年性剝削通報被害人人數，民國108年為1,211人，111年已成長至2,280人，其中被害人係未滿12歲者，漲幅更達3%。\n二、又近期我國發生「台版N號房」社會事件，某網站存有超過20萬部不雅影像，亦有會員制度，以購買會費金額之高低，區分明確等級，高級付費會員甚至得解鎖觀覽未成年人之性交、猥褻及被脅迫吞食分泌物等不雅影像，實為法所不容，嚴重影響兒少身心權益之發展。若會員提供原創影片，得直升高級會員，減省近新台幣30萬元之會費。\n三、綜上所述，鑒於我國兒童及少年性剝削通報被害人人數逐年增加，且加害網站之結構，竟已形成性犯罪產業鏈，屬社會不樂見之事。為遏止兒少性剝削狀態愈發嚴重，爰提升罰金金額，避免助長此類犯罪之增生，保障兒少身心健全發展。"}],"changed":false,"final":"招募、引誘、容留、媒介、協助、利用或以他法，使兒童或少年為性交或猥褻之行為，以供人觀覽者，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年為性交或猥褻之行為，以供人觀覽者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前二項之罪者，依各該條項之規定，加重其刑至二分之一。\n前三項之未遂犯罰之。","finalWhy":null,"review":{"note":"保留，送黨團協商","text":""}},{"no":"第三十六條","current":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","versions":[{"bill":"202110031720000","text":"拍攝、製造、重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣二百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、依據著作權法第三條第一項第五款，重製指以印刷、複印、錄音、錄影、攝影、筆錄或其他方法直接、間接、永久或暫時之重複製作。考量網路下載、檔案傳輸等重製行為皆是目前私密影片外流之重要管道。然現行法僅規範「拍攝與製造」、「散布供人觀賞」、「持有」三種主要樣態。事實上，單純持有與主動上網下載甚至是付費下載應視為不同樣態，後者之主觀犯意應較前者更為強烈，亦將助長兒少性剝削，如不加以課責，與本法宗旨「防制兒童及少年遭受任何形式之性剝削」有違。爰修正第一項文字，重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣兩百萬元以下罰金。\n二、其餘未修正。"},{"bill":"202110033180000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處五年以上十二年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十年以上有期徒刑或無期徒刑，並併科新臺幣七百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之並於判決確定後銷毀。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、提高刑責與刑度，增加嚇阻與懲罰力度，以暴力、脅迫等方式製作兒少相關性影像者增加無期徒刑。\n二、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110034540000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金，並公布姓名及照片。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處五年以上十二年以下有期徒刑，得併科新臺幣五百萬元以下罰金，並公布姓名及照片。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十年以上有期徒刑，得併科新臺幣七百萬元以下罰金，並公布姓名及照片。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收並於判決確定後銷毀之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、提高刑責與刑度，增加嚇阻與懲罰力度，為遏止犯罪，公布其姓名及照片。\n二、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110034580000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處十年以上有期徒刑，得併科新臺幣二百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處十二年以上有期徒刑，得併科新臺幣六百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十五年以上有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、根據衛生福利部最新「兒童及少年性剝削案件辦理情形」之統計，本條犯罪案件數量佔近年兒童及少年性剝削案件皆超越80%以上，有必要加重刑罰以為嚇阻。\n二、本條之犯行嚴重侵害兒童及少年身體隱私，並經常導致被害者憂心其性影像遭後續散布、為不特定他人觀覽，使其身心長期備受煎熬。\n三、為有效嚇阻犯行，爰提案修正本條例第一項之刑度為十年以上有期徒刑，得併科新臺幣二百萬元以下罰金；第二項為十二年以上有期徒刑，得併科新臺幣六百萬元以下罰金；違反兒童及青少年意願並侵害其自由之相關行為，應對行為人加重處罰，加重第三項為十五年以上有期徒刑，得併科新臺幣一千萬元以下罰金。"},{"bill":"202110033760000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年六個月以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處五年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十年以上有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"第一項處罰刑度由一年以上七年以下有期徒刑，得併科新臺幣一百萬元以下罰金改為一年六個月以上七年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n第二項處罰刑度由三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金改為五年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n第三項處罰刑度由七年以上有期徒刑，得併科新臺幣五百萬元以下罰金改為十年以上有期徒刑，得併科新臺幣一千萬元以下罰金。"},{"bill":"202110033910000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣二百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處五年以上十二年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品為對被害人身心健全發育極具破壞性之行為樣態。\n二、為嚴格打擊兒童或少年性影像及其他相類之物品的拍攝與製造，應加重對此類犯罪行為之制裁。\n三、爰提案修正，提高本條第一項及第二項之刑度。"},{"bill":"202110034400000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣七百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"理由同修正條文第三十二條說明，加重對拍攝者之處罰。"},{"bill":"202110036130000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處五年以上十二年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十年以上有期徒刑，得併科新臺幣一千萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、理由同三十二條之說明一，加重刑罰。\n二、理由同三十五條之說明一，加重刑罰。"},{"bill":"202110034280000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處五年以上有期徒刑，得併科新臺幣一百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處七年以上有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"為保障未成年權益，防止未成年受性剝削之害。另實務上兒童或少年心智尚未成熟，容易一時自行拍攝、製造性影像、性交或猥褻行為之圖畫、語音等，並且誤信他人而予以對外傳送，造成此類資訊在網路流傳。目前刑度不足以因應社會變遷以及實務需求，故加重本條刑責。\n一、第一項之有期徒刑，由「一年以上七年以下」修正為「五年以上」。\n二、第二項之有期徒刑，由「三年以上十年以下」修正為「七年以上」。\n三、第三項之有期徒刑，由「七年以上」修正為「十年以上」。"},{"bill":"202110036480000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以下罰金，同時公布姓名及照片，並依性侵害犯罪防治法第三十一條之規定接受身心治療、輔導或教育。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金，同時公布姓名及照片，並依性侵害犯罪防治法第三十一條之規定接受身心治療、輔導或教育。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金，同時公布姓名及照片，並依性侵害犯罪防治法第三十一條之規定接受身心治療、輔導或教育。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、修正第一項至第三項。\n二、參照「性侵害犯罪防治法」，對於引誘拍攝、強迫拍攝兒少性影像或無正當理由持有兒少之性影像等新興數位犯罪行為施以身心治療、輔導或教育；同時參考美國梅根法案，為遏止犯罪，對兒少進行影像等新興數位犯罪者，應公布姓名及照片。"},{"bill":"202110036570000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣二百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"近年網路平台或論壇，出現以金錢或其他性影像之對價方式，以取得兒少之性影像之交易模式，基於人性所趨、有需求就有供給之誘因下，讓此購買行為樣態較單純持有更加嚴重，除提供拍攝、製造兒少性影像之行為人金錢來源外，也使兒少性剝削犯罪組織化，形成地下產業鏈。爰修正本法第三十六條、第三十八條、新增以購買或對價關係取得兒童或少年之性影像行為人之處罰，藉以杜絕兒少性剝削產業鏈。"},{"bill":"202110036660000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上七年以下有期徒刑，得併科新臺幣二百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"根據衛生福利部「兒童及少年性剝削案件辦理情形」之統計，本條犯罪案件數量為近年兒少性剝削案件之大宗，且數量持續飆高不下。本條之犯行不僅嚴重侵害兒少身體隱私，並常導致被害人憂慮此影像或物品遭後續散布、為他人觀覽，使其身心備受憂苦。為有效嚇阻犯行、加強對兒少之保護，爰修正第一項之罰則，以達阻嚇之效。"},{"bill":"202110036730000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣一百萬元以上三百萬元以下罰金，並公布姓名與相片於主管機關網站，並供民眾查詢。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣一百萬元以上三百萬元以下罰金，並公布姓名與相片於主管機關網站，並供民眾查詢。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十年以上有期徒刑，得併科新臺幣一百萬以上五百萬元以下罰金，並公布姓名與相片於主管機關網站，並供民眾查詢。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n以第一項至第三項之圖畫、語音、影像或其他物品，恐嚇他人生命、身體、自由、名譽或財產，致生危害於安全者，依各該條項之規定，加重其刑至三分之二。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、鑒於兒少性剝削之犯行日漸猖狂，於參考美國「性犯罪者資訊公開法」（俗稱梅根法案）之相關規定，故為遏止犯行者一再犯罪，應將犯行者之姓名及照片，公布於主管機關網站，並供民眾查詢。\n二、除公開犯行者之姓名及照片，亦應提高刑期與罰金額度，加強防範相關犯行。\n三、另外，犯行者亦多再使用，非法取得之兒少性圖畫、語音、影像或其他物品行恐嚇他人之犯行，故應將此一嚴重犯行，列入懲處，並加重其刑。\n四、爰提案修正與增訂本條第一項、第二項及第三項相關文字，並增列第七項文字。\n五、第四項及第五項及第六項未修正。\n六、原第七項移為第八項，文字未修正。"},{"bill":"202110037550000","text":"拍攝、製造、重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣二百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、依據著作權法第三條第一項第五款，重製係指以印刷、複印、錄音、錄影、攝影、筆錄或其他方法直接、間接、永久或暫時之重複製作。\n二、考量網路下載、檔案傳輸等重製行為皆是目前國內私密影片外流與散布之重要管道。然現行法僅規範「拍攝與製造」、「散布供人觀賞」、「持有」三種主要樣態。事實上，單純持有與主動上網下載甚至是付費下載應視為不同樣態，後者之主觀犯意應較前者更為強烈，亦將助長兒少性剝削，如不加以課責，與本法宗旨「防制兒童及少年遭受任何形式之性剝削」有違。爰修正第一項文字，重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣二百萬元以下罰金。\n三、其餘未修正。"},{"bill":"202110037450000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上七年以下有期徒刑，得併科新臺幣二百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處五年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處十年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"為嚴格打擊兒童或少年性影像之拍攝與製造，提高此類犯罪行為之最低刑度及罰金，爰提案修正，提高本條第一項、第二項及第三項之刑度。"},{"bill":"202110039310000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處二年以上七年以下有期徒刑，得併科新臺幣一百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"兒童及少年之心智發展未臻成熟，其性影像之產生，若非強迫、偷拍，即是利用兒少對性隱私認知之不足及性發育之好奇心引誘，對兒少權益侵害甚鉅，重違反《兒童權利公約》及《關於買賣兒童、兒童賣淫和兒童色情問題之兒童權利公約任擇議定書》。故提高其刑，以嚇阻犯罪。"},{"bill":"202110039410000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品，處五年以上十二年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品者，處十年以上有期徒刑或無期徒刑，並併科新臺幣七百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之並於判決確定後銷毀。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥以真人所繪製之色情圖畫及電磁紀錄生成之擬真色情圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、同第二條第一項第三款文字修正。\n二、提高刑責與刑度，增加嚇阻與懲罰力度，以暴力、脅迫等方式製作兒少相關性影像者增加無期徒刑。\n三、相關性影像應在法院做成確定判決後儘速銷毀，避免流出造成當事人二次傷害。"},{"bill":"202110039980000","text":"拍攝、製造、重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造、重製性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造、重製性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造、重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"參酌刑法第三百十九條之三第一項規定，增列重製態樣，爰修正第一項至第三項、第七項。"},{"bill":"202110039990000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處五年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣八百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、修正第一項、第二項及第三項，其餘未修正。\n二、兒少對於自我性隱私或者性方面的健康尚處於缺乏充分認知的階段，受限於判斷能力而無法對於性相關行為表示有效同意。爰此，即使經其同意，對之為拍攝、製造兒少色情之行為亦侵害其隱私權及性自主權，更造成兒少身心創傷。\n三、有鑑於拍攝、製造性剝削影像等不法行為仍層出不窮、難以根除，現行刑罰嚇阻力仍有提高之必要。為加強防制兒少遭性剝削、遏止兒少性影像散布等犯罪行為：\n(一)修正第一項。將刑度由一年以上七年以下有期徒刑提高至三年以上七年以下有期徒刑；罰金由新臺幣一百萬元以下提高至三百萬元以下。\n(二)修正第二項。將刑度由三年以上十年以下有期徒刑提高至五年以上十年以下有期徒刑；罰金由新臺幣三百萬元以下提高至五百萬元以下。\n(三)修正第三項。罰金由新臺幣五百萬元以下提高至八百萬元以下。"},{"bill":"202110040750000","text":"拍攝、製造、重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處一年以上七年以下有期徒刑，得併科新臺幣十萬元以上一百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造、重製性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣三百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造、重製性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣五百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造、重製兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"參酌刑法第三百十九條之三第一項規定，增列重製態樣，爰修正第一項至第三項、第七項，並定明第一項罰金下限。"},{"bill":"202110040890000","text":"拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n招募、引誘、容留、媒介、協助或以他法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品，處三年以上十年以下有期徒刑，得併科新臺幣五百萬元以下罰金。\n以強暴、脅迫、藥劑、詐術、催眠術或其他違反本人意願之方法，使兒童或少年被拍攝、自行拍攝、製造性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品者，處七年以上有期徒刑，得併科新臺幣七百萬元以下罰金。\n意圖營利犯前三項之罪者，依各該條項之規定，加重其刑至二分之一。\n前四項之未遂犯罰之。\n第一項至第四項之附著物、圖畫及物品，不問屬於犯罪行為人與否，沒收之。\n拍攝、製造兒童或少年之性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之工具或設備，不問屬於犯罪行為人與否，沒收之。但屬於被害人者，不在此限。","note":"一、修正第一項，近日兒少遭性剝削影像、圖畫或語音於網路流傳猖獗，更有犯罪集團建立會員分級制度，高級會員可以指定兒少性影片之內容，嚴重侵害兒少權益。為避免兒少遭受任何形式之性剝削，爰調高拍攝及製造兒少性影像、與性相關而客觀上足以引起性慾或羞恥之圖畫、語音或其他物品之刑責。\n二、修正第二項及第三項，犯罪集團多以俗稱「PUA」（Pick Up Artist）之手段接近被害兒少，並以引誘、脅迫等手段使兒少一步一步落入犯罪集團陷阱，犯罪集
