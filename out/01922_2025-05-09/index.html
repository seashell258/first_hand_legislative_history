<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>電業法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

</div>

":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/09/LCEWA01_110209_00075.pdf","proposers":["邱志偉","林俊憲","陳亭妃","賴瑞隆"],"ncosign":16,"people":[["邱志偉","民進黨","提案"],["林俊憲","民進黨","提案"],["陳亭妃","民進黨","提案"],["賴瑞隆","民進黨","提案"],["吳琪銘","民進黨","連署"],["鍾佳濱","民進黨","連署"],["林楚茵","民進黨","連署"],["蔡易餘","民進黨","連署"],["黃秀芳","民進黨","連署"],["許智傑","民進黨","連署"],["陳培瑜","民進黨","連署"],["邱議瑩","民進黨","連署"],["張雅琳","民進黨","連署"],["王美惠","民進黨","連署"],["黃捷","民進黨","連署"],["李柏毅","民進黨","連署"],["陳秀寳","民進黨","連署"],["莊瑞雄","民進黨","連署"],["王世堅","民進黨","連署"],["吳沛憶","民進黨","連署"]],"party":[["民進黨",20]],"reason":"本院委員邱志偉、林俊憲、陳亭妃、賴瑞隆等20人，為達成2050年淨零排放目標，各國積極推動再生能源並活絡綠電交易市場。隨著電力市場結構與交易模式演變，穩定電網需求提升，非傳統電力供應方式也逐步發展。為配合市場需求與法規更新，各國正進行電業法的檢討與修訂。我國自106年起已透過電業法修正推動綠電政策，逐步實現電業自由化，並營造多元且公平的綠電供應環境。為因應電力結構及市場轉型趨勢，並兼顧效率與競爭，持續推動綠電交易、落實淨零目標，電力市場監管機制需與時俱進，故新增電業管制機關應依電力市場之發展情況，檢討電力交易平台之運作模式及成效，並要求電力交易平台設置者採取強化中立性運作之相關措施，另放寬綠電交易對象，以及導入非傳統電力供應方式進入電力交易市場之管理監督機制，將設置儲能設備及執行需量反應措施等予以納管。同時，考量近年受國際地緣政治與全球疫情影響，能源價格劇烈波動，迫切需要有效的電價調節措施，確保能源安全與供電韌性，並維持社會穩定。同時，各類電源與電網建設需大量資金投入，需求管理及組織整合亦至關重要。國營電業應有效整合發電、輸配電及售電資源，以強化電網韌性與穩定供電，爰擬具「電業法部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第六條","第十一條","第十五條","第十九條","第二十四條","第三十五條","第四十七條","第七十四條","第七十五條","第八十條"]},{"id":"202110080960000","who":"委員鄭正鈐等19人","date":"2024-12-06","name":"「電業法第七十四條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110080960000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/12/LCEWA01_110212_00021.pdf","proposers":["鄭正鈐","鄭天財Sra Kacaw"],"ncosign":17,"people":[["鄭正鈐","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","提案"],["盧縣一","國民黨","連署"],["許宇甄","國民黨","連署"],["羅智強","國民黨","連署"],["黃仁","國民黨","連署"],["陳菁徽","國民黨","連署"],["黃健豪","國民黨","連署"],["魯明哲","國民黨","連署"],["賴士葆","國民黨","連署"],["黃建賓","國民黨","連署"],["徐巧芯","國民黨","連署"],["洪孟楷","國民黨","連署"],["張智倫","國民黨","連署"],["牛煦庭","國民黨","連署"],["林倩綺","國民黨","連署"],["萬美玲","國民黨","連署"],["陳玉珍","國民黨","連署"],["羅廷瑋","國民黨","連署"]],"party":[["國民黨",19]],"reason":"本院委員鄭正鈐、鄭天財Sra Kacaw等19人，有鑑於國際淨零排放及碳邊境稅趨勢，國際大廠紛紛宣示企業淨零排放目標期程，並要求供應鏈廠商配合加強減碳。因應國際碳管制挑戰，政府應積極規劃在能源轉型基礎上逐步朝向淨零轉型邁進，減少化石燃料的使用，增加低碳能源供給，提供充足且低碳的電力供應來源。綜上，為有效督促公用售電業者應依國家願景積極改善電業結構，並應符合電業法公告之電力排碳目標，爰擬具「電業法第七十四條條文修正草案」。是否有當？敬請公決。","arts":["第七十四條"]},{"id":"201110086510000","who":"行政院","date":"2025-01-17","name":"「電業法部分條文修正草案」案。","url":"https://ppg.ly.gov.tw/ppg/bills/201110086510000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/18/LCEWA01_110218_00082.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"行政院函請審議「電業法部分條文修正草案」案。","arts":["第二條","第六條","第十一條","第十五條","第十九條","第二十四條","第三十五條","第四十七條","第七十四條","第七十五條","第七十八條之一","第八十條"]}],"arts":[{"no":"第二條","current":"本法用詞，定義如下：\n一、電業：指依本法核准之發電業、輸配電業及售電業。\n二、發電業：指設置主要發電設備，以生產、銷售電能之非公用事業，包含再生能源發電業。\n三、再生能源發電業：指設置再生能源發展條例第三條所定再生能源發電設備，以銷售電能之發電業。\n四、輸配電業：指於全國設置電力網，以轉供電能之公用事業。\n五、售電業：指公用售電業及再生能源售電業。\n六、公用售電業：指購買電能，以銷售予用戶之公用事業。\n七、再生能源售電業：指購買再生能源發電設備生產之電能，以銷售予用戶之非公用事業。\n八、電業設備：指經營發電及輸配電業務所需用之設備。\n九、主要發電設備：指原動機、發電機或其他必備之能源轉換裝置。\n十、自用發電設備：指電業以外之其他事業、團體或自然人，為供自用所設置之主要發電設備。\n十一、再生能源：指再生能源發展條例第三條所定再生能源，或其他經中央主管機關認定可永續利用之能源。\n十二、用戶用電設備：指用戶為接收電能所裝置之導線、變壓器、開關等設備。\n十三、再生能源發電設備：指依再生能源發展條例第三條所定，取得中央主管機關核發認定文件之發電設備。\n十四、電力網：指聯結主要發電設備與輸配電業之分界點至用戶間，屬於同一組合之導線本身、支持設施及變電設備，以輸送電能之系統。\n十五、電源線：指聯結主要發電設備至該設備與輸配電業之分界點或用戶間，屬於同一組合之導線本身、支持設施及變電設備。\n十六、線路：指依本法設置之電力網及電源線。\n十七、用戶：指除電業外之最終電能使用者。\n十八、電器承裝業：指經營與電業設備及用戶用電設備相關承裝事項之事業。\n十九、用電設備檢驗維護業：指經營與用戶用電設備相關之檢驗、維護事項之事業。\n二十、需量反應：指因應電力系統狀況而為電力使用行為之改變。\n二十一、輔助服務：為完成電力傳輸並確保電力系統安全及穩定所需採行之服務措施。\n二十二、電力排碳係數：電力生產過程中，每單位發電量所產生之二氧化碳排放量。\n二十三、直供：指再生能源發電業，設置電源線，直接聯結用戶，並供電予用戶。\n二十四、轉供：指輸配電業，設置電力網，傳輸電能之行為。","versions":[{"bill":"202110077260000","text":"本法用詞，定義如下：\n一、電業：指依本法核准之發電業、輸配電業、售電業及特定電力供應業。\n二、發電業：指設置主要發電設備，以生產、銷售電能之非公用事業，包含再生能源發電業。\n三、再生能源發電業：指設置再生能源發展條例第三條所定再生能源發電設備，以銷售電能之發電業。\n四、輸配電業：指於全國設置電力網，以轉供電能之公用事業。\n五、售電業：指公用售電業及再生能源售電業。\n六、公用售電業：指購買電能，以銷售予用戶之公用事業。\n七、再生能源售電業：指購買再生能源發電設備生產之電能，並予以銷售之非公用事業。\n八、特定電力供應業：指以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台之非公用事業。\n九、電業設備：指經營發電及輸配電業務所需用之設備。\n十、主要發電設備：指原動機、發電機或其他必備之能源轉換裝置。\n十一、自用發電設備：指電業以外之其他事業、團體或自然人，為供自用所設置之主要發電設備。\n十二、儲能設備：指儲存電能並穩定電力系統之設備，包含儲能組件、電力轉換及電能管理系統等。\n十三、再生能源：指再生能源發展條例第三條所定再生能源，或其他經中央主管機關認定可永續利用之能源。\n十四、用戶用電設備：指用戶為接收電能所裝置之導線、變壓器、開關等設備。\n十五、再生能源發電設備：指依再生能源發展條例第三條所定，取得中央主管機關核發認定文件之發電設備。\n十六、電力網：指聯結主要發電設備與輸配電業之分界點至用戶間，屬於同一組合之導線本身、支持設施及變電設備，以輸送電能之系統。\n十七、電源線：指聯結主要發電設備至該設備與輸配電業之分界點或用戶間，屬於同一組合之導線本身、支持設施及變電設備。\n十八、線路：指依本法設置之電力網及電源線。\n十九、用戶：指除電業外之最終電能使用者。\n二十、電器承裝業：指經營與電業設備及用戶用電設備相關承裝事項之事業。\n二十一、用電設備檢驗維護業：指經營與用戶用電設備相關之檢驗、維護事項之事業。\n二十二、需量反應：指因應電力系統狀況而為電力使用行為之改變。\n二十三、輔助服務：為完成電力傳輸並確保電力系統安全及穩定所需採行之服務措施。\n二十四、電力排碳係數：電力生產過程中，每單位發電量所產生之二氧化碳排放量。\n二十五、直供：指再生能源發電業，設置電源線，直接聯結用戶，並供電予用戶。\n二十六、轉供：指輸配電業，設置電力網，傳輸電能之行為。","note":"一、第一款修正，並增訂第八款、第十二款：\n(一)為推動二○五○淨零轉型，我國亟需持續建置再生能源；隨著再生能源占比提升，以執行需量反應措施、設置儲能設備及電動車充電站等有別於傳統形式之電力供應方式，已成為世界各國維持電網穩定與供電彈性之發展策略及措施。\n(二)因應前述電力供應方式改變及投入規模逐漸增加，爰參考日本及韓國之立法例，新增第八款「特定電力供應業」及第十二款「儲能設備」之定義，凡以前述非傳統形式之電力供應方式參與電力交易平台者，後續須依法取得特定電力供應業之資格；並修正第一款，將特定電力供應業納入電業範疇，俾利電力市場之有序運作及監督管理。\n二、第七款修正。因應綠電市場發展，檢討再生能源售電業之定位，爰將「銷售予用戶」修正為「並予以銷售」，使再生能源售電業不僅可將電能銷售予用戶，也可以銷售予其他再生能源售電業，以活絡綠電交易市場。\n三、配合第八款及第十二款規定新增，現行條文第八款至第十款規定移列至第九款至第十一款，現行條文第十一款至第二十四款移列至第十三款至第二十六款。\n四、又，參酌本條所為各種電業之定義，台灣電力股份有限公司（以下簡稱台電公司）於廠網分工規定刪除後，將同時經營發電業、輸配電業、公用售電業及再生能源售電業等不同業別。由於輸配電業及公用售電業為公用事業之性質，故台電公司如從事該二項業別之相關經營活動時，應規劃、興建與維護全國之電力網，負責執行電力調度業務，並負有供電義務，而其電價亦應受到管制。反之，台電公司如從事發電業或再生能源售電業等相關經營活動，因該部分不具有公用事業性質，無須受公用事業相關規定之限制，併予說明。"},{"bill":"201110086510000","text":"本法用詞，定義如下：\n一、電業：指依本法核准之發電業、輸配電業、售電業及特定電力供應業。\n二、發電業：指設置主要發電設備，以生產、銷售電能之非公用事業，包含再生能源發電業。\n三、再生能源發電業：指設置再生能源發展條例第三條所定再生能源發電設備，以銷售電能之發電業。\n四、輸配電業：指於全國設置電力網，以轉供電能之公用事業。\n五、售電業：指公用售電業及再生能源售電業。\n六、公用售電業：指購買電能，以銷售予用戶之公用事業。\n七、再生能源售電業：指購買再生能源發電設備生產之電能，並予以銷售之非公用事業。\n八、特定電力供應業：指以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台之非公用事業。\n九、電業設備：指經營發電及輸配電業務所需用之設備。\n十、主要發電設備：指原動機、發電機或其他必備之能源轉換裝置。\n十一、自用發電設備：指電業以外之其他事業、團體或自然人，為供自用所設置之主要發電設備。\n十二、儲能設備：指儲存電能並穩定電力系統之設備，包含儲能組件、電力轉換及電能管理系統等。\n十三、再生能源：指再生能源發展條例第三條所定再生能源，或其他經中央主管機關認定可永續利用之能源。\n十四、用戶用電設備：指用戶為接收電能所裝置之導線、變壓器、開關等設備。\n十五、再生能源發電設備：指依再生能源發展條例第三條所定，取得主管機關核發認定文件之發電設備。\n十六、電力網：指聯結主要發電設備與輸配電業之分界點至用戶間，屬於同一組合之導線本身、支持設施及變電設備，以輸送電能之系統。\n十七、電源線：指聯結主要發電設備至該設備與輸配電業之分界點或用戶間，屬於同一組合之導線本身、支持設施及變電設備。\n十八、線路：指依本法設置之電力網及電源線。\n十九、用戶：指除電業外之最終電能使用者。\n二十、電器承裝業：指經營與電業設備及用戶用電設備相關承裝事項之事業。\n二十一、用電設備檢驗維護業：指經營與用戶用電設備相關之檢驗、維護事項之事業。\n二十二、需量反應：指因應電力系統狀況而為電力使用行為之改變。\n二十三、輔助服務：為完成電力傳輸並確保電力系統安全及穩定所需採行之服務措施。\n二十四、電力排碳係數：電力生產過程中，每單位發電量所產生之二氧化碳排放量。\n二十五、直供：指再生能源發電業，設置電源線，直接聯結用戶，並供電予用戶。\n二十六、轉供：指輸配電業，設置電力網，傳輸電能之行為。","note":"一、修正第一款，並增訂第八款、第十二款，理由如下：\n(一)為推動二○五○淨零轉型，我國亟需持續建置再生能源；隨著再生能源占比提升，以執行需量反應措施、設置儲能設備及電動車充電站等有別於傳統形式之電力供應方式，已成為世界各國維持電網穩定與供電彈性之發展策略及措施。\n(二)因應前述電力供應方式改變及投入規模逐漸增加，爰參考日本及韓國之立法例，新增第八款「特定電力供應業」及第十二款「儲能設備」之定義，凡以前述非傳統形式之電力供應方式參與電力交易平台者，後續須依法取得特定電力供應業之資格；並修正第一款，將特定電力供應業納入電業範疇，俾利電力市場之有序運作及監督管理。\n二、因應綠電市場發展，檢討第七款所定再生能源售電業之定位，將「銷售予用戶」修正為「並予以銷售」，使再生能源售電業不僅得將電能銷售予用戶，亦得銷售予其他再生能源售電業，以活絡綠電交易市場。\n三、第十三款所定再生能源發電設備之定義，配合一百零八年五月一日修正公布之再生能源發展條例第三條第一項第十一款規定，業因應中央或直轄市、縣（市）主管機關辦理再生能源發電設備認定之權限劃分，修正為由主管機關認定，爰將「中央主管機關」修正為「主管機關」，並移列為第十五款。\n四、配合新增第八款及第十二款，現行第八款至第十款移列為第九款至第十一款，現行第十一款及第十二款移列為第十三款及第十四款，現行第十四款至第二十四款移列為第十六款至第二十六款，內容均未修正。\n五、參酌本條電業之定義，台灣電力股份有限公司（以下簡稱台電公司）於本次修正刪除第六條有關廠網分工之規定後，將同時經營發電業、輸配電業、公用售電業及再生能源售電業等不同業別。由於輸配電業及公用售電業為公用事業之性質，故台電公司如從事該二項業別之相關經營活動時，應規劃、興建與維護全國之電力網，負責執行電力調度業務，並負有供電義務，而其電價亦應受到管制。反之，台電公司如從事發電業或再生能源售電業等相關經營活動，因該部分不具有公用事業性質，無須受公用事業相關規定之限制，併予說明。\n六、另按第二款、第十一款規定，主要發電設備係由發電業或自用發電設備設置者所設置，再生能源售電業因非發電業或自用發電設備設置者，依法不得設置自用或主要發電設備。惟本法並未禁止電業相互兼營，故再生能源售電業倘另行取得再生能源發電業執照，則得以再生能源發電業身分，設置主要發電設備；或依規定於辦理申請自用發電設備登記後，進行自用發電設備之設置，併予說明。"}],"changed":true,"final":"本法用詞，定義如下：\n一、電業：指依本法核准之發電業、輸配電業、售電業及特定電力供應業。\n二、發電業：指設置主要發電設備，以生產、銷售電能之非公用事業，包含再生能源發電業。\n三、再生能源發電業：指設置再生能源發展條例第三條所定再生能源發電設備，以銷售電能之發電業。\n四、輸配電業：指於全國設置電力網，以轉供電能之公用事業。\n五、售電業：指公用售電業及再生能源售電業。\n六、公用售電業：指購買電能，以銷售予用戶之公用事業。\n七、再生能源售電業：指購買再生能源發電設備生產之電能，並予以銷售之非公用事業。\n八、特定電力供應業：指以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台之非公用事業。\n九、電業設備：指經營發電及輸配電業務所需用之設備。\n十、主要發電設備：指原動機、發電機或其他必備之能源轉換裝置。\n十一、自用發電設備：指電業以外之其他事業、團體或自然人，為供自用所設置之主要發電設備。\n十二、儲能設備：指儲存電能並穩定電力系統之設備，包含儲能組件、電力轉換及電能管理系統等。\n十三、再生能源：指再生能源發展條例第三條所定再生能源，或其他經中央主管機關認定可永續利用之能源。\n十四、用戶用電設備：指用戶為接收電能所裝置之導線、變壓器、開關等設備。\n十五、再生能源發電設備：指依再生能源發展條例第三條所定，取得主管機關核發認定文件之發電設備。\n十六、電力網：指聯結主要發電設備與輸配電業之分界點至用戶間，屬於同一組合之導線本身、支持設施及變電設備，以輸送電能之系統。\n十七、電源線：指聯結主要發電設備至該設備與輸配電業之分界點或用戶間，屬於同一組合之導線本身、支持設施及變電設備。\n十八、線路：指依本法設置之電力網及電源線。\n十九、用戶：指除電業外之最終電能使用者。\n二十、電器承裝業：指經營與電業設備及用戶用電設備相關承裝事項之事業。\n二十一、用電設備檢驗維護業：指經營與用戶用電設備相關之檢驗、維護事項之事業。\n二十二、需量反應：指因應電力系統狀況而為電力使用行為之改變。\n二十三、輔助服務：為完成電力傳輸並確保電力系統安全及穩定所需採行之服務措施。\n二十四、電力排碳係數：電力生產過程中，每單位發電量所產生之二氧化碳排放量。\n二十五、直供：指再生能源發電業，設置電源線，直接聯結用戶，並供電予用戶。\n二十六、轉供：指輸配電業，設置電力網，傳輸電能之行為。","finalWhy":"一、修正第一款，並增訂第八款、第十二款，理由如下：\n(一)為推動二○五○淨零轉型，我國亟需持續建置再生能源；隨著再生能源占比提升，以執行需量反應措施、設置儲能設備及電動車充電站等有別於傳統形式之電力供應方式，已成為世界各國維持電網穩定與供電彈性之發展策略及措施。\n(二)因應前述電力供應方式改變及投入規模逐漸增加，爰參考日本及韓國之立法例，新增第八款「特定電力供應業」及第十二款「儲能設備」之定義，凡以前述非傳統形式之電力供應方式參與電力交易平台者，後續須依法取得特定電力供應業之資格；並修正第一款，將特定電力供應業納入電業範疇，俾利電力市場之有序運作及監督管理。\n二、因應綠電市場發展，檢討第七款所定再生能源售電業之定位，將「銷售予用戶」修正為「並予以銷售」，使再生能源售電業不僅得將電能銷售予用戶，亦得銷售予其他再生能源售電業，以活絡綠電交易市場。\n三、第十三款所定再生能源發電設備之定義，配合一百零八年五月一日修正公布之再生能源發展條例第三條第一項第十一款規定，業因應中央或直轄市、縣（市）主管機關辦理再生能源發電設備認定之權限劃分，修正為由主管機關認定，爰將「中央主管機關」修正為「主管機關」，並移列為第十五款。\n四、配合新增第八款及第十二款，原第八款至第十款移列為第九款至第十一款，原第十一款及第十二款移列為第十三款及第十四款，原第十四款至第二十四款移列為第十六款至第二十六款，內容均未修正。\n五、參酌本條電業之定義，台灣電力股份有限公司（以下簡稱台電公司）於本次修正刪除第六條有關廠網分工之規定後，將同時經營發電業、輸配電業、公用售電業及再生能源售電業等不同業別。由於輸配電業及公用售電業為公用事業之性質，故台電公司如從事該二項業別之相關經營活動時，應規劃、興建與維護全國之電力網，負責執行電力調度業務，並負有供電義務，而其電價亦應受到管制。反之，台電公司如從事發電業或再生能源售電業等相關經營活動，因該部分不具有公用事業性質，無須受公用事業相關規定之限制，併予說明。\n六、另按第二款、第十一款規定，主要發電設備係由發電業或自用發電設備設置者所設置，再生能源售電業因非發電業或自用發電設備設置者，依法不得設置自用或主要發電設備。惟本法並未禁止電業相互兼營，故再生能源售電業倘另行取得再生能源發電業執照，則得以再生能源發電業身分，設置主要發電設備；或依規定於辦理申請自用發電設備登記後，進行自用發電設備之設置，併予說明。","review":{"note":"照行政院提案通過","text":"本法用詞，定義如下：\n一、電業：指依本法核准之發電業、輸配電業、售電業及特定電力供應業。\n二、發電業：指設置主要發電設備，以生產、銷售電能之非公用事業，包含再生能源發電業。\n三、再生能源發電業：指設置再生能源發展條例第三條所定再生能源發電設備，以銷售電能之發電業。\n四、輸配電業：指於全國設置電力網，以轉供電能之公用事業。\n五、售電業：指公用售電業及再生能源售電業。\n六、公用售電業：指購買電能，以銷售予用戶之公用事業。\n七、再生能源售電業：指購買再生能源發電設備生產之電能，並予以銷售之非公用事業。\n八、特定電力供應業：指以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台之非公用事業。\n九、電業設備：指經營發電及輸配電業務所需用之設備。\n十、主要發電設備：指原動機、發電機或其他必備之能源轉換裝置。\n十一、自用發電設備：指電業以外之其他事業、團體或自然人，為供自用所設置之主要發電設備。\n十二、儲能設備：指儲存電能並穩定電力系統之設備，包含儲能組件、電力轉換及電能管理系統等。\n十三、再生能源：指再生能源發展條例第三條所定再生能源，或其他經中央主管機關認定可永續利用之能源。\n十四、用戶用電設備：指用戶為接收電能所裝置之導線、變壓器、開關等設備。\n十五、再生能源發電設備：指依再生能源發展條例第三條所定，取得主管機關核發認定文件之發電設備。\n十六、電力網：指聯結主要發電設備與輸配電業之分界點至用戶間，屬於同一組合之導線本身、支持設施及變電設備，以輸送電能之系統。\n十七、電源線：指聯結主要發電設備至該設備與輸配電業之分界點或用戶間，屬於同一組合之導線本身、支持設施及變電設備。\n十八、線路：指依本法設置之電力網及電源線。\n十九、用戶：指除電業外之最終電能使用者。\n二十、電器承裝業：指經營與電業設備及用戶用電設備相關承裝事項之事業。\n二十一、用電設備檢驗維護業：指經營與用戶用電設備相關之檢驗、維護事項之事業。\n二十二、需量反應：指因應電力系統狀況而為電力使用行為之改變。\n二十三、輔助服務：為完成電力傳輸並確保電力系統安全及穩定所需採行之服務措施。\n二十四、電力排碳係數：電力生產過程中，每單位發電量所產生之二氧化碳排放量。\n二十五、直供：指再生能源發電業，設置電源線，直接聯結用戶，並供電予用戶。\n二十六、轉供：指輸配電業，設置電力網，傳輸電能之行為。"}},{"no":"第六條","current":"輸配電業不得兼營發電業或售電業，且與發電業及售電業不得交叉持股。但經電業管制機關核准者，輸配電業得兼營公用售電業。\n輸配電業兼營電業以外之其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。\n輸配電業應建立依經營類別分別計算盈虧之會計制度，不得交叉補貼。\n輸配電業會計分離制度、會計處理之方法、程序與原則、會計之監督與管理及其他應遵行事項之準則，由電業管制機關定之。\n為達成穩定供電目標，台灣電力股份有限公司之發電業及輸配電業專業分工後，轉型為控股母公司，其下成立發電及輸配售電公司。\n第一項規定，自本法中華民國一百零六年一月十一日修正之條文公布後六年施行。但經電業管制機關審酌電力市場發展狀況，得報由行政院延後定其施行日期，延後以二次為限，第一次以二年為限；第二次以一年為限。","versions":[{"bill":"202110055370000","text":"輸配電業兼營發電業、售電業及以外之其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。\n輸配電業應建立依經營類別分別計算盈虧之會計制度，不得交叉補貼。\n輸配電業會計分離制度、會計處理之方法、程序與原則、會計之監督與管理及其他應遵行事項之準則，由電業管制機關定之。","note":"一、經通盤檢討，透過發電業、輸配電業及售電業之整合協調，有助於淨零路徑中，維持安全且強韌的電力系統。\n二、惟輸配電業兼營發電業、輸配電業及其他事業仍應以不影響業務經營及不妨礙公平競爭為原則，故將此作為申請兼營之准駁條件之一。\n三、綜合上述，爰將第一、五、六項條文予以刪除，第二項修正移至第一項，並修正為輸配電業可以兼營發電業及售電業，第三項移至第二項，第四項移至第三項。"},{"bill":"202110061970000","text":"輸配電業兼營發電業、售電業及電業以外之其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。\n輸配電業應建立依經營類別分別計算盈虧之會計制度，不得交叉補貼。\n輸配電業會計分離制度、會計處理之方法、程序與原則、會計之監督與管理及其他應遵行事項之準則，由電業管制機關定之。","note":"據《電業法》規定，台電須在2025年底完成廠網分離，並拆分成發電、輸配電、售電等三家公司，但因大環境丕變，為確保國家能源安全並跟進國際趨勢，應修正《電業法》第六條，讓台電維持綜合電業型態。"},{"bill":"202110073770000","text":"輸配電業兼營發電業、售電業及電業以外之其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。\n輸配電業應建立依經營類別分別計算盈虧之會計制度，不得交叉補貼。\n輸配電業會計分離制度、會計處理之方法、程序與原則、會計之監督與管理及其他應遵行事項之準則，由電業管制機關定之。","note":"一、經通盤檢討，透過發電業、輸配電業及售電業之整合協調，有助於淨零路徑中，維持安全且強韌的電力系統。\n二、惟輸配電業兼營發電業、輸配電業及其他事業仍應以不影響業務經營及不妨礙公平競爭為原則，故將此作為申請兼營之准駁條件之一。"},{"bill":"202110077260000","text":"輸配電業應建立依經營類別分別計算盈虧之會計制度，不得交叉補貼。\n輸配電業兼營電業或其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。\n輸配電業會計分離制度、會計處理之方法、程序與原則、會計之監督與管理及其他應遵行事項之準則，由電業管制機關定之。","note":"一、第一項、第五項及第六項刪除。\n(一)因應國際趨勢之轉變，電力市場刻正面臨不同挑戰，而有必要檢討修正現有監管機制之適當性及必要性。例如，因應國際地緣政治影響，能源價格產生劇烈波動，亟須有效之電價波動調節措施，並確保能源安全。又如，為符合國際間「淨零轉型」之趨勢及目標，國內電源結構、電網操作、負載面管理之既有思維及作法宜有突破性變革，而各項電源及電網建設不僅仰賴龐大資金挹注，更將注重需求面管理及組織面有效整合。\n(二)值此關鍵階段，有賴國營事業透過其發電、輸配電及售電等資源之有效整合及推動，以強化電網韌性及供電穩定，重新檢討廠網分工之可行性及必要性，爰刪除現行條文有關輸配電業不得兼營發電業或售電業及台電公司廠網分工相關規定。\n二、第二項修正。依第二條第四款規定，輸配電業具有公用事業之性質，為確保其事業經營之健全性及穩定性，爰明定輸配電業兼營電業或以外之其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。是以，台電公司現階段已依法報准經營之電業及其他事業，得繼續經營，而無須重新報請核准；後續如擬新增其他電業或事業時，則須依本項規定辦理。\n三、依第五條規定，輸配電業應為國營，以一家為限，其業務範圍涵蓋全國，應公正、透明運營電力網，此原則不因刪除第一項調整其得兼營事業之範圍而受影響，爰保留第三項文字，並移列第一項，明定其應落實會計分離制度，並不得交叉補貼，以確保電力市場之公平性。\n四、現行條文第四項移列至第三項。"},{"bill":"201110086510000","text":"輸配電業應建立依經營類別分別計算盈虧之會計制度，不得交叉補貼。\n輸配電業兼營電業或其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。\n輸配電業會計分離制度、會計處理之方法、程序與原則、會計之監督與管理及其他應遵行事項之準則，由電業管制機關定之。","note":"一、第一項、第五項及第六項刪除，理由如下：\n(一)因應國際趨勢之轉變，電力市場刻正面臨不同挑戰，而有必要檢討修正現有監管機制之適當性及必要性。例如，因應國際地緣政治影響，能源價格產生劇烈波動，亟須有效之電價波動調節措施，並確保能源安全。又例如，為符合國際間「淨零轉型」之趨勢及目標，國內電源結構、電網操作、負載面管理之既有思維及作法宜有突破性變革，而各項電源及電網建設不僅仰賴龐大資金挹注，更將注重需求面管理及組織面有效整合。\n(二)值此關鍵階段，有賴國營事業透過其發電、輸配電及售電等資源之有效整合及推動，以強化電網韌性及供電穩定，重新檢討廠網分工之可行性及必要性，爰刪除有關輸配電業不得兼營發電業或售電業及台電公司廠網分工相關規定。\n二、依第五條規定，輸配電業應為國營，以一家為限，其業務範圍涵蓋全國，應公正、透明運營電力網，此原則不因刪除第一項調整其得兼營事業之範圍而受影響，爰為確保電力市場之公平性，將第三項有關應落實會計分離制度，並不得交叉補貼之規定移列為第一項。\n三、依第二條第四款規定，輸配電業具有公用事業之性質，為確保其事業經營之健全性及穩定性，爰修正第二項，明定輸配電業應經電業管制機關核准且不影響業務經營及不妨害公平競爭，始得兼營電業或其他事業。至台電公司現階段已依法報准經營之電業及其他事業，得繼續經營，而無須重新報請核准；後續如擬新增其他電業或事業時，則須依本項規定辦理。\n四、第四項移列至第三項，內容未修正。"}],"changed":true,"final":"輸配電業應建立依經營類別分別計算盈虧之會計制度，不得交叉補貼。\n輸配電業兼營電業或其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。\n輸配電業會計分離制度、會計處理之方法、程序與原則、會計之監督與管理及其他應遵行事項之準則，由電業管制機關定之。","finalWhy":"一、第一項、第五項及第六項刪除，理由如下：\n(一)因應國際趨勢之轉變，電力市場刻正面臨不同挑戰，而有必要檢討修正現有監管機制之適當性及必要性。例如，因應國際地緣政治影響，能源價格產生劇烈波動，亟須有效之電價波動調節措施，並確保能源安全。又例如，為符合國際間「淨零轉型」之趨勢及目標，國內電源結構、電網操作、負載面管理之既有思維及作法宜有突破性變革，而各項電源及電網建設不僅仰賴龐大資金挹注，更將注重需求面管理及組織面有效整合。\n(二)值此關鍵階段，有賴國營事業透過其發電、輸配電及售電等資源之有效整合及推動，以強化電網韌性及供電穩定，重新檢討廠網分工之可行性及必要性，爰刪除有關輸配電業不得兼營發電業或售電業及台電公司廠網分工相關規定。\n二、依第五條規定，輸配電業應為國營，以一家為限，其業務範圍涵蓋全國，應公正、透明運營電力網，此原則不因刪除第一項調整其得兼營事業之範圍而受影響，爰為確保電力市場之公平性，將第三項有關應落實會計分離制度，並不得交叉補貼之規定移列為第一項。\n三、依第二條第四款規定，輸配電業具有公用事業之性質，為確保其事業經營之健全性及穩定性，爰修正第二項，明定輸配電業應經電業管制機關核准且不影響業務經營及不妨害公平競爭，始得兼營電業或其他事業。至台電公司現階段已依法報准經營之電業及其他事業，得繼續經營，而無須重新報請核准；後續如擬新增其他電業或事業時，則須依本項規定辦理。\n四、第四項移列至第三項，內容未修正。","review":{"note":"照行政院提案通過","text":"輸配電業應建立依經營類別分別計算盈虧之會計制度，不得交叉補貼。\n輸配電業兼營電業或其他事業，應以不影響其業務經營及不妨害公平競爭，並經電業管制機關核准者為限。\n輸配電業會計分離制度、會計處理之方法、程序與原則、會計之監督與管理及其他應遵行事項之準則，由電業管制機關定之。"}},{"no":"第十一條","current":"輸配電業為電力市場發展之需要，經電業管制機關許可，應於廠網分工後設立公開透明之電力交易平台。\n電力交易平台應充分揭露交易資訊，以達調節電力供需及電業間公平競爭、合理經營之目標。\n第一項電力交易平台之成員、組織、時程、交易管理及其他應遵行事項之規則，由電業管制機關定之。","versions":[{"bill":"202110077260000","text":"輸配電業為電力市場發展之需要，經電業管制機關許可，得設立公開透明之電力交易平台。\n電力交易平台應充分揭露交易資訊，以達調節電力供需及電業間公平競爭、合理經營之目標。\n電業管制機關應視電力市場之發展情況，檢討電力交易平台之運作模式及成效，並得要求電力交易平台設置者採取強化中立性運作之相關措施。\n第一項電力交易平台之成員、組織、時程、交易管理及其他應遵行事項之規則，由電業管制機關定之。","note":"一、第一項修正。因應台電公司廠網分工規定之刪除，現行條文有關電力交易平台之設立時點無須再予規定，爰將「應於廠網分工後」修改為「得」，後續由電業管制機關依據電力市場發展之情況及需求檢討修正電力交易平台之設立模式、交易類型及監督管理等政策，以提升運作效益。\n二、第二項未修正。\n三、新增第三項。為使電力交易平台隨著市場發展而發揮自由競爭之功效，明定電業管制機關應檢討其運作模式及成效，評估於輸配電業外部設具獨立性之交易單位，並為能有效監督市場公平、公正運作，明定電業管制機關得要求電力交易平台設置者強化中立性運作措施（例如組織、預算、人事及資訊存取控管等措施），以強化監督管理之力道。\n四、第三項移列為第四項。"},{"bill":"201110086510000","text":"輸配電業為電力市場發展之需要，經電業管制機關許可，得設立公開透明之電力交易平台。\n電力交易平台應充分揭露交易資訊，以達調節電力供需及電業間公平競爭、合理經營之目標。\n電業管制機關應視電力市場之發展情況，檢討電力交易平台之運作模式及成效，並得設立具獨立性交易單位，或要求電力交易平台設置者採取強化中立性運作之相關措施。\n第一項及第三項電力交易平台之成員、組織、時程、交易管理、中立性運作措施之內容及其他應遵行事項之規則，由電業管制機關定之。","note":"一、因應第六條有關台電公司廠網分工規定之刪除，現行條文有關電力交易平台之設立時點無須再予規定，爰將第一項所定「應於廠網分工後」修正為「得」，後續由電業管制機關依據電力市場發展之情況及需求檢討修正電力交易平台設立模式、交易類型及監督管理等政策，以提升運作效益。\n二、第二項未修正。\n三、為使電力交易平台隨著市場發展而發揮自由競爭之功效，爰新增第三項，明定電業管制機關應檢討其運作模式及成效，並得於輸配電業外部設立具獨立性之交易單位，或要求電力交易平台設置者採取強化中立性運作措施。\n四、第三項移列為第四項，為能有效監督市場公平、公正運作，並強化電力交易平台之獨立性及中立性，爰將「中立性運作措施之內容」納入授權訂定規則之事項，由電業管制機關據以訂定人事管理、資訊存取控管、資訊公開等中立性運作措施之規範。"}],"changed":true,"final":"輸配電業為電力市場發展之需要，經電業管制機關許可，得設立公開透明之電力交易平台。\n電力交易平台應充分揭露交易資訊，以達調節電力供需及電業間公平競爭、合理經營之目標。\n電業管制機關應視電力市場之發展情況，檢討電力交易平台之運作模式及成效，並得設立具獨立性交易單位，或要求電力交易平台設置者採取強化中立性運作之相關措施。\n第一項及第三項電力交易平台之成員、組織、時程、交易管理、中立性運作措施之內容及其他應遵行事項之規則，由電業管制機關定之。","finalWhy":"一、因應第六條有關台電公司廠網分工規定之刪除，原條文有關電力交易平台之設立時點無須再予規定，爰將第一項所定「應於廠網分工後」修正為「得」，後續由電業管制機關依據電力市場發展之情況及需求檢討修正電力交易平台設立模式、交易類型及監督管理等政策，以提升運作效益。\n二、第二項未修正。\n三、為使電力交易平台隨著市場發展而發揮自由競爭之功效，爰新增第三項，明定電業管制機關應檢討其運作模式及成效，並得於輸配電業外部設立具獨立性之交易單位，或要求電力交易平台設置者採取強化中立性運作措施。\n四、第三項移列為第四項，為能有效監督市場公平、公正運作，並強化電力交易平台之獨立性及中立性，爰將「中立性運作措施之內容」納入授權訂定規則之事項，由電業管制機關據以訂定人事管理、資訊存取控管、資訊公開等中立性運作措施之規範。","review":{"note":"照行政院提案通過","text":"輸配電業為電力市場發展之需要，經電業管制機關許可，得設立公開透明之電力交易平台。\n電力交易平台應充分揭露交易資訊，以達調節電力供需及電業間公平競爭、合理經營之目標。\n電業管制機關應視電力市場之發展情況，檢討電力交易平台之運作模式及成效，並得設立具獨立性交易單位，或要求電力交易平台設置者採取強化中立性運作之相關措施。\n第一項及第三項電力交易平台之成員、組織、時程、交易管理、中立性運作措施之內容及其他應遵行事項之規則，由電業管制機關定之。"}},{"no":"第十五條","current":"發電業及輸配電業應於籌設或擴建許可期間內，取得電業管制機關核發之工作許可證，開始施工，並應於工作許可證有效期間內，施工完竣。\n前項工作許可證有效期間為五年。但有正當理由經電業管制機關核准延展者，不在此限。\n發電業及輸配電業應於施工完竣後三十日內，備齊相關說明文件，報經事業所屬機關或直轄市、縣（市）主管機關核轉電業管制機關申請核發或換發電業執照。\n前項申請，應經電業管制機關派員查驗合格，並取得核發或換發之電業執照後，始得營業。\n售電業應填具申請書，向電業管制機關申請核發電業執照後，始得營業。","versions":[{"bill":"202110077260000","text":"發電業及輸配電業應於籌設或擴建許可期間內，取得電業管制機關核發之工作許可證，開始施工，並應於工作許可證有效期間內，施工完竣。\n前項工作許可證有效期間為五年。但有正當理由經電業管制機關核准延展者，不在此限。\n發電業及輸配電業應於施工完竣後三十日內，備齊相關說明文件，報經事業所屬機關或直轄市、縣（市）主管機關核轉電業管制機關申請核發或換發電業執照。\n前項申請，應經電業管制機關派員查驗合格，並取得核發或換發之電業執照後，始得營業。\n售電業及特定電力供應業應填具申請書，向電業管制機關申請核發電業執照後，始得營業。\n本法中華民國○年○月○日修正之條文施行前，已以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台者，應於修正施行後一年內，申請核發電業執照；屆期未申請或已申請但未取得電業執照者，不得參與電力交易平台之交易。","note":"一、第一項至第四項未修正。\n二、第五項配合特定電力供應業之新增，明定特定電力供應業應填具申請書，向電業管制機關申請核發電業執照後，始得營業。\n三、第六項新增。配合第五項之新增，為落實電業登記及管理，並避免影響本次修正前已以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台者之權益，爰明定其自本次修正條文公布後一年內申請核發特定電力供應業之執照，屆期未辦理或已申請但未取得電業執照者，將因不具特定電力供應業資格，不得參與電力交易平台之交易。"},{"bill":"201110086510000","text":"發電業及輸配電業應於籌設或擴建許可期間內，取得電業管制機關核發之工作許可證，開始施工，並應於工作許可證有效期間內，施工完竣。\n前項工作許可證有效期間為五年。但有正當理由經電業管制機關核准延展者，不在此限。\n發電業及輸配電業應於施工完竣後三十日內，備齊相關說明文件，報經事業所屬機關或直轄市、縣（市）主管機關核轉電業管制機關申請核發或換發電業執照。\n前項申請，應經電業管制機關派員查驗合格，並取得核發或換發之電業執照後，始得營業。\n特定電力供應業以設置儲能設備或其他設備之方式進行電力供應者，應於設置前向電業管制機關申請同意備案，並於完成設置後申請核發電業執照。\n售電業及特定電力供應業應填具申請書，向電業管制機關申請核發電業執照後，始得營業。\n本法中華民國○年○月○日修正之條文施行前，已以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台者，應於修正施行之日起算一年內，取得電業執照；屆期未取得者，不得營業。","note":"一、第一項至第四項未修正。\n二、配合電業之範圍新增特定電力供應業，並考量特定電力供應業之型態差異，如以設置儲能設備或其他設備之方式進行電力供應者，應於設置前向電業管制機關申請同意備案，並於完成設置後申請核發電業執照，爰新增第五項，明定其程序，以資明確。\n三、第五項移列為第六項，新增特定電力供應業應於取得電業執照後，始得營業。\n四、配合第五項之新增，為落實電業登記及管理，並避免影響本次修正前已以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台者之權益，爰新增第七項，明定其應自本次修正條文施行之日起算一年之緩衝期內取得特定電力供應業執照，屆期未取得者，不得營業。"}],"changed":true,"final":"發電業及輸配電業應於籌設或擴建許可期間內，取得電業管制機關核發之工作許可證，開始施工，並應於工作許可證有效期間內，施工完竣。\n前項工作許可證有效期間為五年。但有正當理由經電業管制機關核准延展者，不在此限。\n發電業及輸配電業應於施工完竣後三十日內，備齊相關說明文件，報經事業所屬機關或直轄市、縣（市）主管機關核轉電業管制機關申請核發或換發電業執照。\n前項申請，應經電業管制機關派員查驗合格，並取得核發或換發之電業執照後，始得營業。\n特定電力供應業以設置儲能設備或其他設備之方式進行電力供應者，應於設置前向電業管制機關申請同意備案，並於完成設置後申請核發電業執照。\n售電業及特定電力供應業應填具申請書，向電業管制機關申請核發電業執照後，始得營業。\n本法中華民國一百十四年五月九日修正之條文施行前，已以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台者，應於修正施行之日起算一年內，取得電業執照；屆期未取得者，不得營業。","finalWhy":"一、第一項至第四項未修正。\n二、配合電業之範圍新增特定電力供應業，並考量特定電力供應業之型態差異，如以設置儲能設備或其他設備之方式進行電力供應者，應於設置前向電業管制機關申請同意備案，並於完成設置後申請核發電業執照，爰新增第五項，明定其程序，以資明確。\n三、第五項移列為第六項，新增特定電力供應業應於取得電業執照後，始得營業。\n四、配合第五項之新增，為落實電業登記及管理，並避免影響本次修正前已以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台者之權益，爰新增第七項，明定其應自本次修正條文施行之日起算一年之緩衝期內取得特定電力供應業執照，屆期未取得者，不得營業。","review":{"note":"照行政院提案通過","text":"發電業及輸配電業應於籌設或擴建許可期間內，取得電業管制機關核發之工作許可證，開始施工，並應於工作許可證有效期間內，施工完竣。\n前項工作許可證有效期間為五年。但有正當理由經電業管制機關核准延展者，不在此限。\n發電業及輸配電業應於施工完竣後三十日內，備齊相關說明文件，報經事業所屬機關或直轄市、縣（市）主管機關核轉電業管制機關申請核發或換發電業執照。\n前項申請，應經電業管制機關派員查驗合格，並取得核發或換發之電業執照後，始得營業。\n特定電力供應業以設置儲能設備或其他設備之方式進行電力供應者，應於設置前向電業管制機關申請同意備案，並於完成設置後申請核發電業執照。\n售電業及特定電力供應業應填具申請書，向電業管制機關申請核發電業執照後，始得營業。\n本法中華民國○年○月○日修正之條文施行前，已以執行需量反應措施、設置儲能設備或其他電力供應方式參與電力交易平台者，應於修正施行之日起算一年內，取得電業執照；屆期未取得者，不得營業。"}},{"no":"第十九條","current":"電業不得擅自停業或歇業。但發電業及再生能源售電業經電業管制機關核准者，不在此限。\n發電業及再生能源售電業應於停業前，檢具停業計畫，向電業管制機關申請核准，停業期間並不得超過一年。\n電業應於歇業前，檢具歇業計畫，向電業管制機關申請核准，並於歇業之日起算十五日內，將電業執照報繳電業管制機關註銷；屆期未報繳者，電業管制機關得逕行註銷。","versions":[{"bill":"202110077260000","text":"輸配電業及公用售電業不得停業或歇業。\n發電業、再生能源售電業及特定電力供應業之停業或歇業，應依下列規定辦理：\n一、於停業前，應檢具停業計畫，向電業管制機關申請核准，停業期間不得超過一年。\n二、於歇業前，應檢具歇業計畫，向電業管制機關申請核准，並於歇業之日起算十五日內，將電業執照報繳電業管制機關註銷；屆期未報繳者，電業管制機關得逕行註銷。","note":"一、第一項修正。因輸配電業及公用售電業之經營攸關電力穩定供應及國人用電權益，爰修正規定其不得停業或歇業。\n二、第一項但書、第二項及第三項修正。配合特定電力供應業之新增，明定特定電力供應業之停業或歇業應事先報准；另現行條文第一項但書、第二項及第三項整併為第二項，並分款明定發電業、再生能源售電業及特定電力供應業之停業或歇業之申請程序。"},{"bill":"201110086510000","text":"輸配電業及公用售電業不得停業或歇業。\n發電業、再生能源售電業及特定電力供應業之停業或歇業，應依下列規定辦理：\n一、於停業前，應檢具停業計畫，向電業管制機關申請核准，停業期間不得超過一年。\n二、於歇業前，應檢具歇業計畫，向電業管制機關申請核准，並於歇業之日起算十五日內，將電業執照報繳電業管制機關註銷；屆期未報繳者，電業管制機關得逕行註銷。","note":"一、因輸配電業及公用售電業之經營攸關電力穩定供應及國人用電權益，爰修正第一項規定其不得停業或歇業。\n二、第一項但書、第二項及第三項有關發電業、再生能源售電業停業、歇業之申請核准程序整併為第二項，分二款明定停業及歇業程序，並將特定電力供應業納入規範。"}],"changed":true,"final":"輸配電業及公用售電業不得停業或歇業。\n發電業、再生能源售電業及特定電力供應業之停業或歇業，應依下列規定辦理：\n一、於停業前，應檢具停業計畫，向電業管制機關申請核准，停業期間不得超過一年。\n二、於歇業前，應檢具歇業計畫，向電業管制機關申請核准，並於歇業之日起算十五日內，將電業執照報繳電業管制機關註銷；屆期未報繳者，電業管制機關得逕行註銷。","finalWhy":"一、因輸配電業及公用售電業之經營攸關電力穩定供應及國人用電權益，爰修正第一項規定其不得停業或歇業。\n二、第一項但書、第二項及第三項有關發電業、再生能源售電業停業、歇業之申請核准程序整併為第二項，分二款明定停業及歇業程序，並將特定電力供應業納入規範。","review":{"note":"照行政院提案通過","text":"輸配電業及公用售電業不得停業或歇業。\n發電業、再生能源售電業及特定電力供應業之停業或歇業，應依下列規定辦理：\n一、於停業前，應檢具停業計畫，向電業管制機關申請核准，停業期間不得超過一年。\n二、於歇業前，應檢具歇業計畫，向電業管制機關申請核准，並於歇業之日起算十五日內，將電業執照報繳電業管制機關註銷；屆期未報繳者，電業管制機關得逕行註銷。"}},{"no":"第二十四條","current":"電業籌設、擴建之許可、工作許可證、執照之核發、換發、應載事項、延展、發電設備之變更與停業、歇業、併購等事項之申請程序、應備書件及審查原則之規則，由電業管制機關定之。","versions":[{"bill":"202110077260000","text":"電業籌設、擴建之許可、工作許可證、同意備案、執照之核發、換發、應載事項、延展、發電設備之變更與停業、歇業、併購等事項之申請程序、應備書件及審查原則之規則，由電業管制機關定之。","note":"配合特定電力供應業之新增，檢討修正其登記程序。例如，特定電力供應業以設置儲能設備或其他設備（如電動車充電站）之方式進行電力供應者，應於設置前向電業管制機關申請同意備案，俟於設置完成後再檢具文件申請核發電業執照。相關細節性事項將於本條規定授權訂定之電業登記規則中明定。"},{"bill":"201110086510000","text":"電業籌設、擴建之許可、工作許可證、同意備案、執照之核發、換發、應載事項、延展、發電設備之變更與停業、歇業、併購等事項之申請程序、應備書件及審查原則之規則，由電業管制機關定之。","note":"配合修正條文第十五條第五項、第六項明定特定電力供應業以設置儲能設備或其他設備（如電動車充電站）之方式進行電力供應者，應於設置前向電業管制機關申請同意備案，並於完成設置檢具申請書申請核發電業執照等規定，爰增訂「同意備案」事項，將於本條授權訂定之電業登記規則中明定。"}],"changed":true,"final":"電業籌設、擴建之許可、工作許可證、同意備案、執照之核發、換發、應載事項、延展、發電設備之變更與停業、歇業、併購等事項之申請程序、應備書件及審查原則之規則，由電業管制機關定之。","finalWhy":"配合修正條文第十五條第五項、第六項明定特定電力供應業以設置儲能設備或其他設備（如電動車充電站）之方式進行電力供應者，應於設置前向電業管制機關申請同意備案，並於完成設置檢具申請書申請核發電業執照等規定，爰增訂「同意備案」事項，將於本條授權訂定之電業登記規則中明定。","review":{"note":"照行政院提案通過","text":"電業籌設、擴建之許可、工作許可證、同意備案、執照之核發、換發、應載事項、延展、發電設備之變更與停業、歇業、併購等事項之申請程序、應備書件及審查原則之規則，由電業管制機關定之。"}},{"no":"第三十五條","current":"發電業及輸配電業發生各類災害、緊急事故或有前條所定情形時，應依中央主管機關所定應通報事項、時限、方式及程序之標準通報各級主管機關。","versions":[{"bill":"202110077260000","text":"發電業、輸配電業及特定電力供應業發生各類災害、緊急事故或有前條所定情形時，應依中央主管機關所定應通報事項、時限、方式及程序之標準通報各級主管機關。","note":"配合特定電力供應業之新增，修正本條適用範疇，要求特定電力供應業發生各類災害或緊急事故時，須依規定辦理事故通報程序。"},{"bill":"201110086510000","text":"發電業、輸配電業及特定電力供應業發生各類災害、緊急事故或有前條所定情形時，應依中央主管機關所定應通報事項、時限、方式及程序之標準通報各級主管機關。","note":"新增特定電力供應業發生各類災害或緊急事故，及其電業設備附近發生火災或其他非常災害時，應通報各級主管機關之規定。"}],"changed":true,"final":"發電業、輸配電業及特定電力供應業發生各類災害、緊急事故或有前條所定情形時，應依中央主管機關所定應通報事項、時限、方式及程序之標準通報各級主管機關。","finalWhy":"新增特定電力供應業發生各類災害或緊急事故，及其電業設備附近發生火災或其他非常災害時，應通報各級主管機關之規定。","review":{"note":"照行政院提案通過","text":"發電業、輸配電業及特定電力供應業發生各類災害、緊急事故或有前條所定情形時，應依中央主管機關所定應通報事項、時限、方式及程序之標準通報各級主管機關。"}},{"no":"第四十七條","current":"公用售電業為銷售電能予用戶，得向發電業或自用發電設備設置者購買電能，不得設置主要發電設備。\n再生能源售電業為銷售電能予用戶，得購買再生能源發電設備生產之電能，不得設置主要發電設備。\n公用售電業對於用戶申請供電，非有正當理由，並經電業管制機關核准，不得拒絕。\n為落實節能減碳政策，售電業應每年訂定鼓勵及協助用戶節約用電計畫，送電業管制機關備查。電業管制機關應就售電業訂定之計畫，公布年度節約用電及減碳成果，以符合國家節能減碳目標。","versions":[{"bill":"202110077260000","text":"公用售電業對於用戶申請供電，非有正當理由，並經電業管制機關核准，不得拒絕。\n為落實節能減碳政策，售電業應每年訂定鼓勵及協助用戶節約用電計畫，送電業管制機關備查。電業管制機關應就售電業訂定之計畫，公布年度節約用電及減碳成果，以符合國家節能減碳目標。","note":"一、第一項及第二項刪除。主要發電設備係由發電業或自用發電設備設置者所設置，此於修正條文第二條第二款及第十一款已有明確規定，為避免重覆規定而致生疑義，爰刪除現行條文第一項及第二項。\n二、現行條文第三項及第四項移列至第一項及第二項。"},{"bill":"201110086510000","text":"公用售電業對於用戶申請供電，非有正當理由，並經電業管制機關核准，不得拒絕。\n為落實節能減碳政策，售電業應每年訂定鼓勵及協助用戶節約用電計畫，送電業管制機關備查。電業管制機關應就售電業訂定之計畫，公布年度節約用電及減碳成果，以符合國家節能減碳目標。","note":"一、主要發電設備係由發電業或自用發電設備設置者所設置，其電能得銷售予公用售電業，以及再生能源售電業得購買再生能源發電設備生產之電能，此於修正條文第二條第二款、第七款、第十一款及第六十九條已有明確規定，爰刪除第一項及第二項。售電業如擅自設置主要發電設備，可能因該主要發電設備之用途（對外銷售電能或自發自用）不同，而分別依第七十二條或第八十二條規定處罰之。此外，售電業如擬兼營發電業而取得發電業籌設許可，惟尚未取得施工許可前，即施工設置主要發電設備，則依第七十五條規定處罰之。爰此，售電業如擬設置主要或自用發電設備，應另行取得發電業或自用發電設備登記，違反者將依第七十二條、第七十五條或第八十二條等規定論處，併予說明。\n二、第三項及第四項移列至第一項及第二項，內容未修正。"}],"changed":true,"final":"公用售電業對於用戶申請供電，非有正當理由，並經電業管制機關核准，不得拒絕。\n為落實節能減碳政策，售電業應每年訂定鼓勵及協助用戶節約用電計畫，送電業管制機關備查。電業管制機關應就售電業訂定之計畫，公布年度節約用電及減碳成果，以符合國家節能減碳目標。","finalWhy":"一、主要發電設備係由發電業或自用發電設備設置者所設置，其電能得銷售予公用售電業，以及再生能源售電業得購買再生能源發電設備生產之電能，此於修正條文第二條第二款、第七款、第十一款及第六十九條已有明確規定，爰刪除第一項及第二項。售電業如擅自設置主要發電設備，可能因該主要發電設備之用途（對外銷售電能或自發自用）不同，而分別依第七十二條或第八十二條規定處罰之。此外，售電業如擬兼營發電業而取得發電業籌設許可，惟尚未取得施工許可前，即施工設置主要發電設備，則依第七十五條規定處罰之。爰此，售電業如擬設置主要或自用發電設備，應另行取得發電業或自用發電設備登記，違反者將依第七十二條、第七十五條或第八十二條等規定論處，併予說明。\n二、第三項及第四項移列至第一項及第二項，內容未修正。","review":{"note":"照行政院提案通過","text":"公用售電業對於用戶申請供電，非有正當理由，並經電業管制機關核准，不得拒絕。\n為落實節能減碳政策，售電業應每年訂定鼓勵及協助用戶節約用電計畫，送電業管制機關備查。電業管制機關應就售電業訂定之計畫，公布年度節約用電及減碳成果，以符合國家節能減碳目標。"}},{"no":"第七十四條","current":"電業有下列情形之一者，由電業管制機關處新臺幣一百五十萬元以上一千五百萬元以下罰鍰，並得限期改善；屆期未改善者，得按次處罰：\n一、無正當理由未依第九條第一項規定提供必要之輔助服務。\n二、違反第十八條規定，拒絕電力網互聯之要求。\n三、違反第十九條第一項規定，未經核准而擅自停業或歇業。\n四、違反第二十一條規定，未經同意而進行併購。\n五、未依第二十七條第一項規定準備適當備用供電容量。\n六、未依第二十八條第一項規定符合公告之電力排碳係數基準。\n七、違反第四十五條第三項規定，未經核准而設置電源線直接供電予用戶。\n八、違反第四十六條第一項規定，未規劃、興建或維護全國之電力網。\n九、違反第四十六條第二項規定，拒絕設置由電力網聯結至用戶之線路。\n十、違反第四十六條第三項規定，對特定對象有不當之差別待遇或未經許可而拒絕將電力網提供電業使用。\n十一、違反第四十七條第一項及第二項規定，設置主要發電設備。\n十二、違反第四十七條第三項規定，拒絕用戶之供電請求。\n十三、未依第五十四條規定之時間供電。\n十四、違反第五十七條規定，拒絕政府機關要求緊急供電。\n十五、違反第六十四條第一項規定，未提撥相當數額，作為加強機組運轉維護與投資降低污染排放之設備及再生能源發展之用。\n有前項第二款、第七款至第十五款情形之一經電業管制機關處罰，且依前項規定按次處罰達二次者，並得勒令停止營業三個月至六個月、撤換負責人或廢止其電業執照。","versions":[{"bill":"202110017290000","text":"電業有下列情形之一者，由電業管制機關處新臺幣一百五十萬元以上一千五百萬元以下罰鍰，並得限期改善；屆期未改善者，得按次處罰：\n一、無正當理由未依第九條第一項規定提供必要之輔助服務。\n二、違反第十八條規定，拒絕電力網互聯之要求。\n三、違反第十九條第一項規定，未經核准而擅自停業或歇業。\n四、違反第二十一條規定，未經同意而進行併購。\n五、未依第二十七條第一項規定準備適當備用供電容量。\n六、違反第四十五條第三項規定，未經核准而設置電源線直接供電予用戶。\n七、違反第四十六條第一項規定，未規劃、興建或維護全國之電力網。\n八、違反第四十六條第二項規定，拒絕設置由電力網聯結至用戶之線路。\n九、違反第四十六條第三項規定，對特定對象有不當之差別待遇或未經許可而拒絕將電力網提供電業使用。\n十、違反第四十七條第一項及第二項規定，設置主要發電設備。\n十一、違反第四十七條第三項規定，拒絕用戶之供電請求。\n十二、未依第五十四條規定之時間供電。\n十三、違反第五十七條規定，拒絕政府機關要求緊急供電。\n十四、違反第六十四條第一項規定，未提撥相當數額，作為加強機組運轉維護與投資降低污染排放之設備及再生能源發展之用。\n有前項第二款、第六款至第十四款情形之一經電業管制機關處罰，且依前項規定按次處罰達二次者，並得勒令停止營業三個月至六個月、撤換負責人或廢止其電業執照。\n電業未依第二十八條第一項規定符合公告之電力排碳係數基準，其罰緩裁罰公式如下：\n（實際電力排碳係數─公告電力排碳係數）× 售電度數 × 每公斤碳費=罰鍰金額。\n前項碳費之排放量計算方法依據氣候變遷因應法第二十八條規定訂定之。","note":"一、考量包括國內產業重大投資、車輛電動化政策推動及國際經貿情勢變化、疫情管制措施等影響社經條件下，預估112～117年用電需求年均成長約2.3%、尖峰負載年均成長約2.5%。\n二、配合能源轉型及淨零排放政策之展綠、減煤方向，依前述各項電源規劃，加強擴大再生能源設置及監督各項能源供給設施推動進度，同時加強減少空污排放，未來將在確保供電穩定前提下，逐步朝向低碳低空污排放的能源供應體系。"},{"bill":"202110077260000","text":"電業有下列情形之一者，由電業管制機關處新臺幣一百五十萬元以上一千五百萬元以下罰鍰，並得限期改善；屆期未改善者，得按次處罰：\n一、無正當理由未依第九條第一項規定提供必要之輔助服務。\n二、違反第十八條規定，拒絕電力網互聯之要求。\n三、違反第十九條第一項規定，停業或歇業，或違反第十九條第二項規定，未經核准擅自停業或歇業。\n四、違反第二十一條規定，未經同意而進行併購。\n五、未依第二十七條第一項規定準備適當備用供電容量。\n六、未依第二十八條第一項規定符合公告之電力排碳係數基準。\n七、違反第四十五條第三項規定，未經核准而設置電源線直接供電予用戶。\n八、違反第四十六條第一項規定，未規劃、興建或維護全國之電力網。\n九、違反第四十六條第二項規定，拒絕設置由電力網聯結至用戶之線路。\n十、違反第四十六條第三項規定，對特定對象有不當之差別待遇或未經許可而拒絕將電力網提供電業使用。\n十一、違反第四十七條第一項規定，拒絕用戶之供電請求。\n十二、未依第五十四條規定之時間供電。\n十三、違反第五十七條規定，拒絕政府機關要求緊急供電。\n十四、違反第六十四條第一項規定，未提撥相當數額，作為加強機組運轉維護與投資降低污染排放之設備及再生能源發展之用。\n有前項第二款、第七款至第十四款情形之一經電業管制機關處罰，且依前項規定按次處罰達二次者，並得勒令停止營業三個月至六個月、撤換負責人或廢止其電業執照。","note":"一、第一項修正。\n(一)配合第十九條修正，修正第三款罰則對應之項次。\n(二)配合第四十七條第一項、第二項刪除及第三項調整項次，刪除現行條文第十一款並修正第十二款罰則條文之對應條次，其餘款次併依序遞移。\n二、第二項修正。配合第一項由十五款修正為十四款，修正對應款次。"},{"bill":"202110080960000","text":"電業有下列情形之一者，由電業管制機關處新臺幣一百五十萬元以上一千五百萬元以下罰鍰，並得限期改善；屆期未改善者，得按次處罰：\n一、無正當理由未依第九條第一項規定提供必要之輔助服務。\n二、違反第十八條規定，拒絕電力網互聯之要求。\n三、違反第十九條第一項規定，未經核准而擅自停業或歇業。\n四、違反第二十一條規定，未經同意而進行併購。\n五、未依第二十七條第一項規定準備適當備用供電容量。\n六、違反第四十五條第三項規定，未經核准而設置電源線直接供電予用戶。\n七、違反第四十六條第一項規定，未規劃、興建或維護全國之電力網。\n八、違反第四十六條第二項規定，拒絕設置由電力網聯結至用戶之線路。\n九、違反第四十六條第三項規定，對特定對象有不當之差別待遇或未經許可而拒絕將電力網提供電業使用。\n十、違反第四十七條第一項及第二項規定，設置主要發電設備。\n十一、違反第四十七條第三項規定，拒絕用戶之供電請求。\n十二、未依第五十四條規定之時間供電。\n十三、違反第五十七條規定，拒絕政府機關要求緊急供電。\n十四、違反第六十四條第一項規定，未提撥相當數額，作為加強機組運轉維護與投資降低污染排放之設備及再生能源發展之用。\n有前項第二款、第六款至第十四款情形之一經電業管制機關處罰，且依前項規定按次處罰達二次者，並得勒令停止營業三個月至六個月、撤換負責人或廢止其電業執照。\n電業未依第二十八條第一項規定符合公告之電力排碳係數基準，其罰鍰計算公式如下：\n〔（實際電力排碳係數－公告電力排碳係數）〕×售電度數×每公斤碳費=裁罰金額。\n前項碳費之排放量計算方法依據氣候變遷因應法第二十八條規定訂定之。","note":"一、在考量包括國內產業重大投資、車輛電動化政策推動及國際經貿情勢變化、疫情管制措施等影響社經條件下，預估111~117年用電需求年均成長約2.3%、尖峰負載年均成長約2.5%。\n二、在配合能源轉型及淨零排放政策之展綠、減煤方向，依前述各項電源規劃，加強擴大再生能源設置及監督各項能源供給設施推動進度，同時加強減少空污排放，未來將在確保供電穩定前提下，逐步朝向低碳低空污排放的能源供應體系。"},{"bill":"201110086510000","text":"電業有下列情形之一者，由電業管制機關處新臺幣一百五十萬元以上一千五百萬元以下罰鍰，並得限期改善；屆期未改善者，按次處罰：\n一、無正當理由未依第九條第一項規定提供必要之輔助服務。\n二、違反第十八條規定，拒絕電力網互聯之要求。\n三、違反 。"}},{"no":"第七十五條","current":"電業有下列情形之一者，由電業管制機關處新臺幣一百萬元以上一千萬元以下罰鍰，並得限期改善；屆期未改善者，得按次處罰：\n一、未依第四條第二項規定設置獨立董事。\n二、違反第六條第一項規定兼營其他電業、第二項規定未經核准而兼營其他事業、第三項規定未建立分別計算盈虧之會計制度或交叉補貼；或違反第四項所定準則中有關會計分離制度、會計處理之方法、程序與原則或會計監督及管理之規定，且情節重大。\n三、違反第十五條第一項規定，未取得工作許可證而施工。\n四、違反第十六條第一項規定，未經核准而變更其主要發電設備之能源種類、裝置容量或廠址且施工。\n五、違反第二十七條第三項所定辦法中有關備用供電容量之申報程序及期間、管理之規定，且情節重大。","versions":[{"bill":"202110077260000","text":"電業有下列情形之一者，由電業管制機關處新臺幣一百萬元以上一千萬元以下罰鍰，並得限期改善；屆期未改善者，得按次處罰：\n一、未依第四條第二項規定設置獨立董事。\n二、違反第六條第一項規定未建立分別計算盈虧之會計制度或交叉補貼、第二項規定未經核准而兼營其他事業；或違反第三項所定準則中有關會計分離制度、會計處理之方法、程序與原則或會計監督及管理之規定，且情節重大。\n三、違反第十五條第一項規定，未取得工作許可證而施工。\n四、違反第十六條第一項規定，未經核准而變更其主要發電設備之能源種類、裝置容量或廠址且施工。\n五、違反第二十七條第三項所定辦法中有關備用供電容量之申報程序及期間、管理之規定，且情節重大。","note":"第二款修正。配合第六條第一項之修正，刪除對應罰則，並配合修正其他對應項次。"},{"bill":"201110086510000","text":"電業有下列情形之一者，由電業管制機關處新臺幣一百萬元以上一千萬元以下罰鍰，並得限期改善；屆期未改善者，按次處罰：\n一、未依第四條第二項規定設置獨立董事。\n二、違反第六條第一項規定未建立分別計算盈虧之會計制度或進行交叉補貼、第二項規定未經核准而兼營電業或其他事業；或違反第三項所定準則中有關會計分離制度、會計處理之方法、程序與原則或會計監督及管理之規定，且情節重大。\n三、違反第十五條第一項規定，未取得工作許可證而施工。\n四、違反第十六條第一項規定，未經核准而變更其主要發電設備之能源種類、裝置容量或廠址且施工。\n五、違反第二十七條第三項所定辦法中有關備用供電容量之申報程序及期間、管理之規定，且情節重大。","note":"序文文字酌修，並配合修正條文第六條項次調整，修正第二款違反該條所對應之項次及內容。"}],"changed":true,"final":"電業有下列情形之一者，由電業管制機關處新臺幣一百萬元以上一千萬元以下罰鍰，並得限期改善；屆期未改善者，按次處罰：\n一、未依第四條第二項規定設置獨立董事。\n二、違反第六條第一項規定未建立分別計算盈虧之會計制度或進行交叉補貼、第二項規定未經核准而兼營電業或其他事業；或違反第三項所定準則中有關會計分離制度、會計處理之方法、程序與原則或會計監督及管理之規定，且情節重大。\n三、違反第十五條第一項規定，未取得工作許可證而施工。\n四、違反第十六條第一項規定，未經核准而變更其主要發電設備之能源種類、裝置容量或廠址且施工。\n五、違反第二十七條第三項所定辦法中有關備用供電容量之申報程序及期間、管理之規定，且情節重大。","finalWhy":"序文文字酌修，並配合修正條文第六條項次調整，修正第二款違反該條所對應之項次及內容。","review":{"note":"照行政院提案通過","text":"電業有下列情形之一者，由電業管制機關處新臺幣一百萬元以上一千萬元以下罰鍰，並得限期改善；屆期未改善者，按次處罰：\n一、未依第四條第二項規定設置獨立董事。\n二、違反第六條第一項規定未建立分別計算盈虧之會計制度或進行交叉補貼、第二項規定未經核准而兼營電業或其他事業；或違反第三項所定準則中有關會計分離制度、會計處理之方法、程序與原則或會計監督及管理之規定，且情節重大。\n三、違反第十五條第一項規定，未取得工作許可證而施工。\n四、違反第十六條第一項規定，未經核准而變更其主要發電設備之能源種類、裝置容量或廠址且施工。\n五、違反第二十七條第三項所定辦法中有關備用供電容量之申報程序及期間、管理之規定，且情節重大。"}},{"no":"第七十八條之一","current":null,"versions":[{"bill":"201110086510000","text":"電力交易平台設置者未依電業管制機關依第十一條第三項規定之要求採取強化中立性運作之相關措施，電 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }

}

  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;

function finder(turns) {   // 在這場逐字稿裡找字

    prev.hidden = next.hidden = !hits.length;

    '朗讀標題後，通常會將法案交付給相關的委員會進行詳細的實質審查（例如：教育及文化委員會、司法及法制委員會等）。',
    '如果有立委提案並經 20 人以上連署、表決通過，也可以選擇「逕付二讀」（跳過委員會審查）。',
    '如果有異議，可以退回程序委員會或不予審議。']},
  '逕付二讀': {t: '逕付二讀', sub: '跳過委員會審查，直接排進院會二讀', what: '院會決定這個提案不交委員會審查（或從委員會抽出），直接進入二讀。', pts: [
    '通常在一讀報告事項時由黨團提議，院會無異議或表決通過。',
    '逕付二讀的提案多半會交黨團協商，或與已經審查完的相關提案併案處理。',
    '這一天只有主席宣告的幾句話，沒有實質討論。']},
  '二讀': {t: '二讀會', sub: '實質討論、逐條審議，最關鍵的階段', what: '委員會審查完畢，或是經逕付二讀後，將法案送到院會進行全體討論與表決。', pts: [
    '這是法案通過與否最關鍵、辯論最激烈的階段。',
    '進行廣泛討論以及逐條討論、修正。',
    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
Object.assign(READING, {
  '復議': {t: '復議', sub: '要求把已經表決的案子重新討論', what: '議案表決之後，當初投贊成的一方可以提出復議，要求重新討論、重新表決。', pts: [
    '復議被否決之後，同一個案子不能再提復議，決議就此確定。',
    '實務上常見多數方自己提出復議、再自己否決，目的是讓剛通過的條文確定下來。']},
  '重付表決': {t: '重付表決', sub: '對表決結果有異議，再表決一次', what: '出席委員對表決結果有異議時，經 15 人以上連署或附議，可以要求重新表決。', pts: ['以一次為限。']},
  '修正動議': {t: '修正動議', sub: '在院會對條文提出的修改案', what: '委員或黨團在二讀（或三讀）時，對討論中的條文提出另一個版本的文字，交院會表決。', pts: ['需要 10 人以上連署或附議。']},
  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
