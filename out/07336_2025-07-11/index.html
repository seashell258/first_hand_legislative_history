<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>因應國際情勢強化經濟社會及民生國安韌性特別條例制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

灣電力股份有限公司、全民健康保險基金與勞工保險基金、加強照顧弱勢族群及提供關懷服務、強化國土防衛能量、提升資通作業環境及設備、促進全體國民健康、提升藝文產業發展等面向，減緩國際情勢變動對我國之影響。為求儘速確實執行，爰擬具「因應國際情勢強化經濟社會及國土安全韌性特別條例草案」。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條"]},{"id":"202110128790000","who":"委員賴瑞隆等17人","date":"2025-06-03","name":"「因應國際情勢強化經濟社會及國土安全韌性特別條例草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110128790000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/19/LCEWA01_110319_00132.pdf","proposers":["賴瑞隆","邱志偉","陳素月"],"ncosign":14,"people":[["賴瑞隆","民進黨","提案"],["邱志偉","民進黨","提案"],["陳素月","民進黨","提案"],["陳秀寳","民進黨","連署"],["郭國文","民進黨","連署"],["邱議瑩","民進黨","連署"],["蔡其昌","民進黨","連署"],["蔡易餘","民進黨","連署"],["李昆澤","民進黨","連署"],["陳俊宇","民進黨","連署"],["黃捷","民進黨","連署"],["沈伯洋","民進黨","連署"],["鍾佳濱","民進黨","連署"],["徐富癸","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["林宜瑾","民進黨","連署"],["王定宇","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員賴瑞隆、邱志偉、陳素月等17人，鑒於當前國際情勢急遽變化，尤其美國近期調整關稅政策，對我國產業出口、民生物價及就業市場造成重大衝擊，並考量國土安全面臨之風險日益升高，為即時強化我國經濟、社會及國土安全之韌性，減輕人民負擔、穩定物價與經濟發展，促進產業升級轉型，並維持我國在全球供應鏈中之關鍵地位，爰擬具「因應國際情勢強化經濟社會及國土安全韌性特別條例草案」，以明定推動各項強化措施之法源依據、預算機制及執行原則。是否有當？敬請公決。","arts":["第一條","第二條","第三條","第四條","第五條","第六條","第七條","第八條","第九條"]}],"arts":[{"no":"第一條","current":null,"versions":[{"bill":"201110113870000","text":"為因應國際情勢變化對我國經濟、產業及國土防衛之影響，以強化經濟、社會及國土安全韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，特制定本條例。","note":"一、本條例之立法目的。\n二、美國於一百十四年二月十日宣布對全球所有輸美之鋼鋁材及其製品徵收百分之二十五關稅，並於同年三月十二日正式實施，對我國工業出口造成影響；嗣同年四月間再宣布擬對全球約一百八十個國家輸美貨品課徵整體一致性百分之十之關稅；另對五十七個國家加徵百分之十一至五十不一之對等關稅，對我國之稅率高達百分之三十二。美國雖於同年四月十日宣布暫緩前述對等關稅之課徵九十日，惟對各國銷美產品加徵百分之十之關稅已於同年四月五日生效，對等關稅之課徵於九十日後重啟之可能性亦仍然存在。此關稅變革對我國產業、出口結構及整體就業市場將造成衝擊，另對社會民生及物價亦將造成影響，政府亟須即時規劃強化經濟及社會韌性之措施，以減輕人民負擔、穩定民生物價及減緩已發生與可能持續擴大之市場波動；同時，改善投資環境及促進產業升級轉型，協助企業立足臺灣，布局全球，俾利企業在全球貿易秩序重組之際仍能穩健經營，以確保臺灣經濟競爭力及穩定成長。\n三、另面對近一年來複雜之國際地緣政治動態與國際情勢變化，再加上美國上述關稅變革使國際情勢更為嚴峻複雜，強化國土安全韌性措施亦有其必要及急迫性，爰為本條規定。"},{"bill":"202110120210000","text":"為因應國際情勢變化對我國經濟、產業及國土防衛之影響，以強化經濟、社會及國土安全韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，特制定本條例。","note":"一、本條例之立法目的。\n二、美國於一百十四年二月十日宣布對全球所有輸美之鋼鋁材及其製品徵收百分之二十五關稅，並於同年三月十二日正式實施，對我國工業出口造成影響；嗣同年四月間再宣布擬對全球約一百八十個國家輸美貨品課徵整體一致性百分之十之關稅；另對五十七個國家加徵百分之十一至五十不一之對等關稅，對我國之稅率高達百分之三十二。美國雖於同年四月十日宣布暫緩前述對等關稅之課徵九十日，惟對各國銷美產品加徵百分之十之關稅已於同年四月五日生效，對等關稅之課徵於九十日後重啟之可能性亦仍然存在。此關稅變革對我國產業、出口結構及整體就業市場將造成衝擊，另對社會民生及物價亦將造成影響，政府亟須即時規劃強化經濟及社會韌性之措施，以減輕人民負擔、穩定民生物價及減緩已發生與可能持續擴大之市場波動；同時，改善投資環境及促進產業升級轉型，協助企業立足臺灣，布局全球，俾利企業在全球貿易秩序重組之際仍能穩健經營，以確保臺灣經濟競爭力及穩定成長。\n三、另面對近一年來複雜之國際地緣政治動態與國際情勢變化，再加上美國上述關稅變革使國際情勢更為嚴峻複雜，強化國土安全韌性措施亦有其必要及急迫性，爰為本條規定。"},{"bill":"202110123950000","text":"為因應國際情勢變化對我國經濟、產業及民眾消費韌性之影響，以強化經濟、社會及民眾消費韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及擴大內需，特制定本條例。","note":"一、本條例之立法目的。\n二、美國於一百十四年二月十日宣布對全球所有輸美之鋼鋁材及其製品徵收百分之二十五關稅，並於同年三月十二日正式實施，對我國工業出口造成影響；嗣同年四月間再宣布擬對全球約一百八十個國家輸美貨品課徵整體一致性百分之十之關稅；另對五十七個國家加徵百分之十一至五十不一之對等關稅，對我國之稅率高達百分之三十二。美國雖於同年四月十日宣布暫緩前述對等關稅之課徵九十日，惟對各國銷美產品加徵百分之十之關稅已於同年四月五日生效，對等關稅之課徵於九十日後重啟之可能性亦仍然存在。此關稅變革對我國產業、出口結構及整體就業市場將造成衝擊，另對社會民生及物價亦將造成影響，政府亟須即時規劃強化經濟及社會韌性之措施，以減輕人民負擔、穩定民生物價及減緩已發生與可能持續擴大之市場波動；同時，改善投資環境及促進產業升級轉型，協助企業立足臺灣，布局全球，俾利企業在全球貿易秩序重組之際仍能穩健經營，以確保臺灣經濟競爭力及穩定成長，爰為本條規定。"},{"bill":"202110123800000","text":"因應美國對等關稅政策及國際情勢衝擊之國家經濟重大變故，並強化經濟及社會韌性，特制定本條例。","note":"一、本條例之立法目的。\n二、美國於一百十四年四月二日宣布擬對全球約一百八十個國家輸美貨品課徵百分之十之關稅；另對五十七個國家加徵百分之十一至五十一之對等關稅，對我國課徵稅率高達百分之三十二。美國雖於同年四月十日宣布暫緩前述對等關稅之課徵九十日，惟對各國銷美產品加徵百分之十之關稅已於同年四月五日生效，對等關稅之課徵仍可能於九十日後重啟，該關稅政策對我國經濟環境及物價亦造成重大影響，爰為本條規定。"},{"bill":"202110124770000","text":"為因應國際情勢變化對我國經濟、產業之影響，以強化經濟、社會韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型，特制定本條例。","note":"明定本條例之立法目的。"},{"bill":"202110125540000","text":"為因應國際情勢變化對我國經濟、產業及國土防衛之影響，以強化經濟、社會及國土安全韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，特制定本條例。","note":"一、本條例之立法目的。\n二、有鑑於美國雖於四月十日宣布暫緩課徵全球對等關稅，但針對各國課徵之10%關稅業已生效，且對等關稅於90天後繼續上路之可能性仍然存在，為保障我國社會、經濟、產業之穩定，減輕人民負擔，並因應地緣政治及國際情勢之不斷變化，國土安全韌性之強化實有必要，爰為本條規定。"},{"bill":"202110126810000","text":"為因應國際情勢變化對我國經濟、產業及民生社會之影響，以強化經濟產業及民生紓困措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及擴大內需，特制定本條例。","note":"一、本條例之立法目的。\n二、自民國一百十四年二月起，美國政府對全球各國陸續提高關稅，包括對輸美之鋼鋁材及其製品徵收百分之二十五關稅，影響我國工業出口；另對貨品課徵一致性百分之十之關稅，亦對我國課徵高達百分之三十二之對等關稅。縱然美國政府於同年四月十日宣布暫緩系爭對等關稅之課徵九十日，惟銷美產品於同年四月五日後，仍須加徵百分之十之關稅，且對等關稅於九十日後亦有重啟之可能。按美國之關稅變革勢必對我國產業、出口結構及整體就業市場造成衝擊，亦恐影響社會民生及物價，故政府亟須即時規劃強化經濟產業及民生紓困措施，以減緩已發生與可能持續擴大之市場波動，並減輕人民負擔、穩定民生物價；同時，改善投資環境及促進產業升級轉型，協助企業立足臺灣，布局全球，俾利企業在全球貿易秩序重組之際仍能穩健經營，以確保臺灣經濟競爭力及穩定成長，爰訂定本條。"},{"bill":"202110126750000","text":"為因應國際情勢變化對我國經濟、產業及民眾消費韌性之影響，以強化經濟、社會及民眾消費韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及擴大內需，特制定本條例。","note":"一、本條例之立法目的。\n二、美國於一百十四年二月十日宣布，對全球所有輸美之鋼鐵、鋁材及其製品課徵百分之二十五關稅，並自同年三月十二日起實施，對我國工業出口造成直接衝擊。嗣後，同年四月間美國進一步宣布，擬對全球約一百八十個國家輸美產品課徵一致性百分之十之關稅；另對五十七個國家加徵百分之十一至百分之五十不等之對等關稅，對我國課徵稅率高達百分之三十二。雖美國於同年四月十日宣布暫緩對等關稅課徵九十日，惟百分之十之關稅已自同年四月五日起生效，且對等關稅於九十日後重啟之可能性仍高。此一關稅政策變革，對我國產業、出口結構及整體就業市場恐將造成重大衝擊，亦對社會民生及物價穩定帶來不利影響。為減輕人民負擔、穩定民生物價、降低外部衝擊所引發之市場波動，政府有必要立即規劃並推動強化經濟及社會韌性之措施；同時應改善投資環境、促進產業升級轉型，協助企業立足臺灣、布局全球，以確保我國在全球貿易秩序重組之際，仍具備穩健經營與持續成長之能量，維持國家經濟競爭力。爰此，制定本條以為依據。"},{"bill":"202110126730000","text":"為因應國際情勢變化對我國經濟、產業及民生之影響，以強化經濟、社會韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及擴大內需，特制定本條例。","note":"一、本條例之立法目的。\n二、美國於一百十四年二月十日宣布對全球所有輸美之鋼鋁材及其製品徵收百分之二十五關稅，並於同年三月十二日正式實施，對我國工業出口造成影響；嗣同年四月間再宣布擬對全球約一百八十個國家輸美貨品課徵整體一致性百分之十之關稅；另對五十七個國家加徵百分之十一至五十不一之對等關稅，對我國之稅率高達百分之三十二。美國雖於同年四月十日宣布暫緩前述對等關稅之課徵九十日，惟對各國銷美產品加徵百分之十之關稅已於同年四月五日生效，對等關稅之課徵於九十日後重啟之可能性亦仍然存在。此關稅變革對我國產業、出口結構及整體就業市場將造成衝擊，另對社會民生及物價亦將造成影響，政府亟須即時規劃強化經濟及社會韌性之措施，以減輕人民負擔、穩定民生物價及減緩已發生與可能持續擴大之市場波動；同時，改善投資環境及促進產業升級轉型，協助企業立足臺灣，布局全球，俾利企業在全球貿易秩序重組之際仍能穩健經營，以確保臺灣經濟競爭力及穩定成長。"},{"bill":"202110127880000","text":"為因應國際情勢變化對我國經濟、產業及國土防衛之影響，以強化經濟、社會、國土安全及國民健康與文化發展韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，特制定本條例。","note":"一、本條例之立法目的。\n二、美國於一百十四年二月十日宣布對全球所有輸美之鋼鋁材及其製品徵收百分之二十五關稅，並於同年三月十二日正式實施，對我國工業出口造成影響；嗣同年四月間再宣布擬對全球約一百八十個國家輸美貨品課徵整體一致性百分之十之關稅；另對五十七個國家加徵百分之十一至五十不一之對等關稅，對我國之稅率高達百分之三十二。美國雖於同年四月十日宣布暫緩前述對等關稅之課徵九十日，惟對各國銷美產品加徵百分之十之關稅已於同年四月五日生效，對等關稅之課徵於九十日後重啟之可能性亦仍然存在。此關稅變革對我國產業、出口結構及整體就業市場將造成衝擊，另對社會民生及物價及國民健康與文化亦將造成影響，政府亟須即時規劃強化經濟、社會及國民健康與文化發展韌性之措施，以減輕人民負擔、穩定民生物價及減緩已發生與可能持續擴大之市場波動；同時，改善投資環境及促進產業升級轉型，協助企業立足臺灣，布局全球，俾利企業在全球貿易秩序重組之際仍能穩健經營，以確保臺灣經濟競爭力及穩定成長。\n三、另面對近一年來複雜之國際地緣政治動態與國際情勢變化，再加上美國上述關稅變革使國際情勢更為嚴峻複雜，強化國土安全韌性措施亦有其必要及急迫性，爰為本條規定。"},{"bill":"202110128790000","text":"為因應國際情勢變化對我國經濟、產業及國土防衛之影響，以強化經濟、社會及國土安全韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，特制定本條例。","note":"一、本條例之立法目的。\n二、美國於一百十四年二月十日宣布對全球輸美鋼鋁及其製品課徵百分之二十五關稅，並於三月十二日實施，對我國工業出口造成衝擊。四月再擬對一百八十國輸美貨品課徵一致性百分之十關稅，並對五十七國加徵百分之十一至五十不等的對等關稅，其中對我國課徵達百分之三十二。雖美國於四月十日宣布暫緩對等關稅九十日，惟百分之十之關稅已自四月五日生效，未來重啟徵收風險仍在。此波關稅變革將衝擊我國產業、出口與就業，並影響物價與民生。政府須即時強化經濟及社會韌性，以減輕民眾負擔、穩定物價、因應市場波動；並促進產業升級、改善投資環境，協助企業因應全球貿易重組，維持台灣競爭力與經濟穩定。\n三、面對近年國際情勢與地緣政治變化，加上美國關稅調整，國際局勢更趨嚴峻，強化國土安全韌性具必要性與急迫性，爰為本條規定。"}],"changed":true,"final":"為因應國際情勢變化對我國經濟、產業、民生及國土防衛之影響，以強化經濟、社會、民眾消費及國土安全韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型、擴大內需及防護國家安全，特制定本條例。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"所有提案及修正動議1案均保留，送院會處理","text":""}},{"no":"第二條","current":null,"versions":[{"bill":"201110113870000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會與國土安全韌性措施之規劃、預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、教育部、衛生福利部、內政部、國防部及海洋委員會等相關機關之職掌，爰於第二項明定各部會應負責事項。"},{"bill":"202110120210000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會與國土安全韌性措施之規劃、預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、教育部、衛生福利部、內政部、國防部及海洋委員會等相關機關之職掌，爰於第二項明定各部會應負責事項。"},{"bill":"202110123950000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會與民眾消費韌性措施之規劃、預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、教育部、衛生福利部、內政部等相關機關之職掌，爰於第二項明定各部會應負責事項。"},{"bill":"202110123800000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟社會韌性項目預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、衛生福利部、內政部、交通部等相關機關之職掌，爰於第二項明定各部會應負責事項。"},{"bill":"202110124770000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會韌性措施之規劃、預算編列及推動。","note":"一、第一項明定本條例之主管機關。\n二、第二項明定經濟部、財政部、勞動部、農業部、教育部、衛生福利部及原住民族委員會等相關機關之職掌及應負責事項。"},{"bill":"202110125540000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會與國土安全韌性措施之規劃、預算編列及推動。","note":"一、第一項：明訂本法主管機關。\n二、第二項：本條例所定事項涉及經濟、財政、勞動、農業、教育、衛生福利、內政、國防及海洋事務等相關中央主管機關之職掌，爰明定各部會應負責事項。"},{"bill":"202110126810000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟產業及民生紓困之規劃、預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、衛生福利部、內政部等相關機關之職掌，爰於第二項明定各部會應負責事項。"},{"bill":"202110126750000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會與民眾消費韌性措施之規劃、預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、教育部、衛生福利部、內政部等相關機關之職掌，爰於第二項明定各部會應負責事項。"},{"bill":"202110126730000","text":"本條例之主管機關為國家發展委員會。\n依本條例編列預算之中央各部會，負責強化經濟、社會韌性措施之規劃、預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、教育部、衛生福利部、內政部及國家發展委員會等相關機關之職掌，爰於第二項明定各部會應負責事項。"},{"bill":"202110127880000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會、國土安全及國民健康與文化發展韌性措施之規劃、預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、教育部、衛生福利部、內政部、國防部、海洋委員會及文化部等相關機關之職掌，爰於第二項明定各部會應負責事項。"},{"bill":"202110128790000","text":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會與國土安全韌性措施之規劃、預算編列及推動。","note":"一、第一項定明本條例之主管機關。\n二、本條例所定事項涉及經濟部、財政部、勞動部、農業部、教育部、衛生福利部、內政部、國防部及海洋委員會等相關機關之職掌，爰於第二項明定各部會應負責事項。"}],"changed":true,"final":"本條例之主管機關為經濟部。\n依本條例編列預算之中央各部會，負責強化經濟、社會、民眾消費及國土安全韌性措施之規劃、預算編列及推動。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"所有提案及修正動議1案均保留，送院會處理","text":""}},{"no":"第三條","current":null,"versions":[{"bill":"201110113870000","text":"本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農業金融支持、提升產業競爭力及協助開拓多元市場。\n六、強化高等教育人才培育。\n七、挹注台灣電力股份有限公司、全民健康保險基金及勞工保險基金。\n八、加強照顧弱勢族群及提供關懷服務。\n九、強化國土防衛能量。\n十、提升資通作業環境及設備。","note":"為因應國際情勢變化對我國經濟、產業及國土防衛之影響，政府應透過強化經濟、社會及國土安全韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，爰明定本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力及協助開拓多元市場。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款規定強化高等教育人才培育，以因應當前國際化與產業快速變遷之趨勢，培養能符應未來社會及國家發展所需用之人才。\n七、第七款規定挹注台灣電力股份有限公司，以調節能源價格等方式穩定民生物價，舒緩國際物價波動對民生、產業及經濟造成之影響；另增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n八、第八款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n九、第九款規定強化國土防衛能量，如改善、增設海岸巡防及其他包括無人載具等重要防衛設施與設備。\n十、第十款規定提升資通作業環境及設備，以強化其運作效率及備援韌性。"},{"bill":"202110120210000","text":"本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農業金融支持、提升產業競爭力及協助開拓多元市場。\n六、加速推動農漁產品外銷媒合、農業國際展，並強化農業基礎設施，照顧農漁民權益。\n七、強化高等教育人才培育。\n八、挹注台灣電力股份有限公司、台灣自來水股份有限公司、全民健康保險基金及勞工保險基金。\n九、加強照顧弱勢族群及提供關懷服務。\n十、強化國土防衛能量。\n十一、提升資通作業環境及設備。\n十二、穩定國內公共工程品質進度。\n十三、其他經行政院核可之強化經濟社會及國土安全韌性有關事項。","note":"為因應國際情勢變化對我國經濟、產業及國土防衛之影響，政府應透過強化經濟、社會及國土安全韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，爰明定本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力及協助開拓多元市場。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款加速我國農漁產業對國際客戶的整體曝光與競爭力，並提升農漁民基礎設施，以應對對等關稅的衝擊，鞏固台灣農漁業在國際市場的競爭地位。\n七、第七款規定強化高等教育人才培育，以因應當前國際化與產業快速變遷之趨勢，培養能符應未來社會及國家發展所需用之人才。\n八、第八款規定挹注台灣電力股份有限公司、台灣自來水股份有限公司，以調節能源及水費價格等方式穩定民生物價，舒緩國際物價波動對民生、產業及經濟造成之影響；另增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n九、第九款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n十、第十款規定強化國土防衛能量，如改善、增設海岸巡防及其他包括無人載具等重要防衛設施與設備。\n十一、第十一款規定提升資通作業環境及設備，以強化其運作效率及備援韌性。\n十二、為確保工程如期如質推動，降低美國關稅及國際物價波動等外部環境變化對公共建設所造成之衝擊，於第十二款明定穩定國內公共工程品質進度。\n十三、另為因應經濟、國土安全實際需求，於第十三款明定其他經行政院核可之強化經濟社會及國土安全韌性有關事項。"},{"bill":"202110123950000","text":"本條例所定強化經濟、社會及民眾消費韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農業金融支持、提升產業競爭力及協助開拓多元市場。\n六、強化高等教育人才培育。\n七、挹注全民健康保險基金及勞工保險基金。\n八、加強照顧弱勢族群及提供關懷服務。\n九、減緩民生壓力，並達到振興經濟效益，以發放現金新臺幣壹萬元方式強化民眾消費韌性，擴大內需。","note":"為因應國際情勢變化對我國經濟、產業及民眾消費力之影響，政府應透過強化經濟、社會及民眾消費韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型，爰明定本條例所定強化經濟、社會及民眾消費韌性措施之項目如下：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力及協助開拓多元市場。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款規定強化高等教育人才培育，以因應當前國際化與產業快速變遷之趨勢，培養能符應未來社會及國家發展所需用之人才。\n七、第七款增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n八、第八款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n九、第九款規定以發放現金新臺幣壹萬元方式強化民眾消費韌性，擴大內需，減緩民生壓力，並達到振興經濟效益。"},{"bill":"202110123800000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應。但執行期間尚有以前年度歲計賸餘可供移用時，應優先支應，不得舉借債務。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110124770000","text":"本條例所定強化經濟、社會韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農業金融支持、提升產業競爭力、協助開拓多元市場及輔助農民。\n六、強化高等教育人才培育。\n七、挹注全民健康保險基金及勞工保險基金。\n八、挹注原住民族綜合發展基金。\n九、加強照顧低收入戶、中低收入戶、身心障礙者及原住民等弱勢族群及提供關懷服務。\n十、減緩民生壓力，並達到振興經濟效益，以發放現金新臺幣一萬元方式強化民眾消費韌性，擴大內需。","note":"為因應國際情勢變化對我國經濟、產業之影響，明定政府應透過強化經濟、社會韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型之項目如下：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力、協助開拓多元市場及輔助農民。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款規定強化高等教育人才培育，以因應當前國際化與產業快速變遷之趨勢，培養能符應未來社會及國家發展所需用之人才。\n七、第七款規定增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n八、第八款規定挹注原住民族綜合發展基金，係基於落實現行《原住民族基本法》第十八條規定。查原住民族綜合發展基金，主要任務係提供原住民個人、原住民依法組成之農民團體及企業組織發展經濟之貸款，辦理原住民經濟產業、建購及修繕住宅貸款信用保證，以解決原住民無法提供等值擔保品抵押融資之問題。次查行政院歷年編製「原住民族綜合發展基金預算書」時，均明定本基金係依《預算法》第四條第一項第二款第四目所定，「凡付出仍可收回」之特種基金，例如經濟事業貸款，基金貸放後可收回本金及利息，而行政院違反《原住民族基本法》及《預算法》，挪用該基金支應原住民保留地禁伐補償金，迄今卻已累積高達53億9,954萬6千元，以致至114年底預計數累積短絀為負67億6,623萬7千元，基金財源已嚴重不足，立法院第九屆第二會期第十七次會議審查預算案決議應編列預算返還已挪用之經費，但行政院均未編列公務預算返還挪用之經費，爰編列特別預算返還54億元。\n九、第九款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n十、第十款以發放現金新臺幣壹萬元方式強化民眾消費韌性，擴大內需，減緩民生壓力，並達到振興經濟效益。"},{"bill":"202110125540000","text":"本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、提供企業金融支持。\n二、推動產業及中小企業升級轉型、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持及促進勞工安定就業、強化勞工職能培訓。\n五、強化農業金融支持、提升產業競爭力及協助開拓多元市場。\n六、強化高等教育人才培育。\n七、挹注台灣電力股份有限公司、全民健康保險基金及勞工保險基金。\n八、加強照顧弱勢族群、提供支持及關懷服務。\n九、強化國土防衛能量。\n十、提升公、私部門資通作業環境及設備。","note":"為因應國際情勢變化對我國經濟產業及國土防衛之影響，政府應透過強化經濟、社會及國土安全韌性措施，減輕人民負擔、穩定民生物價，國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，爰明定本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助；信用保證及保證手續費減免等融資協處措施。\n二、第二款規定推動產業及中小企業升級轉型、提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用製造業及高科技產業之優勢，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範，實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級，設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持及促進勞工安定就業、強化勞工職能培訓。如協助企業穩定僱用並強化勞工職能培訓，協助勞工再就業，並促進初次就業青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力及協助開拓多元市場。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款規定強化高等教育人才培育，以因應當前國際化與產業快速變遷之趨勢，培養能符應未來社會及國家發展所需用之人才。\n七、第七款規定挹注台灣電力股份有限公司，以調節能源價格等方式穩定民生物價，舒緩國際物價波動對民生、產業及經濟造成之影響；另增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n八、第八款規定加強照顧弱勢族群、提供支持及關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n九、第九款規定強化國土防衛能量。如改善增設海岸巡防及其他，包括無人載具等重要防衛設施與設備。\n十、第十款規定提升公、私部門資通作業環境及設備，以強化其運作效率及備援韌性。"},{"bill":"202110126810000","text":"本條例所定強化經濟產業及民生紓困措施之項目如下：\n一、提供企業、農業及地方產業之金融支持。\n二、提升產業競爭力及強化產業人才培育。\n三、協助產業開拓多元市場。\n四、支持勞工安定就業。\n五、挹注全民健康保險基金及勞工保險基金。\n六、加強照顧弱勢族群及提供關懷服務。\n七、減緩民生壓力，並達到振興經濟效益，以發放現金新臺幣壹萬元方式強化民眾消費能力，擴大內需。\n前項第一款至第四款編列之預算總額不得低於新臺幣一千三百億元。","note":"為因應國際情勢變化對我國經濟、產業及民眾消費力之影響，政府應透過強化經濟產業及民生紓困措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型，爰明定本條例所定強化經濟產業及民生紓困措施之項目如下：\n一、第一款規定提供三個面向的金融支持：對企業，如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施；對農業，如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動，以提升產業競爭力及協助開拓多元市場；對地方產業，如就各地區產業之特性，尤其是傳統產業，就各該地區之供應鏈整體考量，與地方政府會商與協力以提供對策。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。又為因應當前國際化與產業快速變遷之趨勢，應同時強化產業人才培育，以配合產業升級與轉型。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n六、第六款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n七、第七款規定以發放我國國民每人現金新臺幣壹萬元之方式強化民眾消費能力，擴大內需，減緩民生壓力，並達到振興經濟效益。\n八、又為確保本條例確實達到強化產業經濟環境和協助產業發展之目的，規範產業補助經費之範圍不得低於新臺幣一千三百億元，爰訂定第二項。"},{"bill":"202110126750000","text":"本條例所定強化經濟、社會及民眾消費韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農、漁業金融支持、提升產業競爭力及協助開拓多元市場，其經費不得低於總經費百分之六。\n六、強化高等教育人才培育。\n七、挹注全民健康保險基金及勞工保險基金。\n八、加強照顧弱勢族群及提供關懷服務。\n九、減緩民生壓力，並達到振興經濟效益，以發放現金新臺幣壹萬元方式強化民眾消費韌性，擴大內需。","note":"為因應國際情勢變化對我國經濟、產業及民眾消費力所帶來之影響，政府應透過多面向之強化經濟、社會及民眾消費韌性措施，以減輕人民負擔、穩定民生物價、維持國家經濟與就業市場穩定，並改善投資環境、促進產業升級轉型。爰此，特明定本條例所定強化經濟、社會及民眾消費韌性措施之各項目如下：\n一、第一款規定提供企業金融支持，包括提供貿易融資利息減碼及輸出保險費用減免，以強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協助措施。\n二、第二款規定提升產業競爭力，包括優化投資環境、協助企業根留臺灣，並利用半導體等科技優勢推動應用產業發展及產業升級轉型。透過法人或學校建置產業共通軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，培育數位及人工智慧應用人才，並輔導及補助業者技術升級、設備汰舊換新、創新數位研發與新創應用，開發高階產品、強化數位行銷，爭取國際訂單與產品認驗證，加速多元市場布局，降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場，包括協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；並深化與美國等友盟國家產業投資與技術合作，進行供應鏈重組。\n四、第四款規定支持勞工安定就業，包括協助企業穩定僱用、強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農、漁業金融支持、提升農漁產業競爭力及協助開拓多元市場，包括提供農、漁業貸款利息補貼、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證、擴大國內外行銷活動等措施，以強化農、漁業經營體質與國際市場競爭力。另為確保農、漁業政策之落實與資源挹注，明定其經費不得低於特別預算總額百分之六，保障農、漁業發展所需經費之最低比例。\n六、第六款規定強化高等教育人才培育，以因應國際化及產業快速變遷之趨勢，培養符合未來社會及國家發展所需之人才。\n七、第七款規定增加撥補全民健康保險基金及勞工保險基金財務，以減輕勞健保基金財務壓力。\n八、第八款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，降低國際情勢造成之衝擊。\n九、第九款規定透過發放新臺幣壹萬元現金之方式，強化民眾消費韌性、擴大內需、減輕民生壓力，並促進經濟振興。"},{"bill":"202110126730000","text":"本條例所定強化經濟、社會韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農業金融支持、提升產業競爭力及協助開拓多元市場。\n六、強化高等教育人才培育。\n七、挹注全民健康保險基金及勞工保險基金。\n八、加強照顧弱勢族群及提供關懷服務。\n九、辦理全民普發現金，共享經濟成果。","note":"為因應國際情勢變化對我國經濟、產業及民生之影響，政府應透過強化經濟、社會韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，爰明定本條例所定強化經濟、社會韌性措施之項目如下：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力及協助開拓多元市場。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款規定強化高等教育人才培育，以因應當前國際化與產業快速變遷之趨勢，培養能符應未來社會及國家發展所需用之人才。\n七、第七款規定增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n八、第八款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n九、第九款規定全民普發現金，能夠有效舒緩國際物價波動對民生、產業及經濟造成之影響。"},{"bill":"202110127880000","text":"本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農業金融支持、提升產業競爭力及協助開拓多元市場。\n六、強化高等教育人才培育。\n七、挹注台灣電力股份有限公司、全民健康保險基金及勞工保險基金。\n八、加強照顧弱勢族群及提供關懷服務。\n九、強化國土防衛能量。\n十、提升資通作業環境及設備。\n十一、促進全體國民健康。\n十二、提升藝文產業發展。\n十三、其他經行政院核可之強化經濟社會及國土安全韌性有關事項。","note":"為因應國際情勢變化對我國經濟、產業及國土防衛之影響，政府應透過強化經濟、社會及國土安全韌性措施，減輕人民負擔、穩定民生物價、國家經濟與就業市場、改善投資環境、促進產業升級轉型及防護國家安全，爰明定本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力及協助開拓多元市場。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款規定強化高等教育人才培育，以因應當前國際化與產業快速變遷之趨勢，培養能符應未來社會及國家發展所需用之人才。\n七、第七款規定挹注台灣電力股份有限公司，以調節能源價格等方式穩定民生物價，舒緩國際物價波動對民生、產業及經濟造成之影響；另增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n八、第八款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n九、第九款規定強化國土防衛能量，如改善、增設海岸巡防及其他包括無人載具等重要防衛設施與設備。\n十、第十款規定提升資通作業環境及設備，以強化其運作效率及備援韌性。\n十一、第十一款規定促進全體國民健康，主要係考量我國醫療環境面對國際衝擊，諸如藥品及醫療器材之供需價格變化，以及生技醫藥產業之發展，都會影響我國整體醫療環境之穩定，僅透過健保處理，恐難以全面應對國際變化。因此，為降低國際情勢對我國整體醫療環境之衝擊，強化我國健康促進政策，提高我國健康投資占比，除全民健康保險之撥補外，宜再增加對於全體國民健康促進相關規劃，以降低國際情勢對我國醫藥環境衝擊。\n十二、第十二款提升藝文產業發展，主要係考量美國於五月四日宣布，將針對所有在美國以外製作並進口至美國之電影，課徵百分之一百的關稅，此項政策亦恐衝擊我國藝文產業之發展，為維護我國文化主體性，保障我國藝文產業發展空間，宜增加對於強化我國藝文產業發展之相關協助措施。\n十三、第十三款係為因應本次國際衝擊之具體規模與程度，尚需考量美國關稅等相關政策變化、世界各國之因應措施、以及相關國家關稅和貿易談判後續結果，為使行政院編列相關因應計畫和預算時，保有足夠彈性以面對國際情勢之快速變化，宜增加第十三款規定。"},{"bill":"202110128790000","text":"本條例所定強化經濟、社會及國土安全韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農業金融支持、提升產業競爭力、協助開拓多元市場及糧食安全。\n六、強化高等教育人才培育。\n七、挹注台灣電力股份有限公司、全民健康保險基金及勞工保險基金。\n八、加強照顧弱勢族群及提供關懷服務。\n九、強化國土防衛能量。\n十、提升資通作業環境及設備。\n十一、強化關鍵供應鏈韌性。\n十二、提升能源自主與備援能力。","note":"因應國際情勢變化對我國經濟、產業及國土安全之影響，政府應強化經濟、社會及國土安全韌性，以減輕民眾負擔、穩定物價與就業、促進產業升級、改善投資環境並維護國安，爰明定本條例相關措施項目如下為：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力及協助開拓多元市場。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款規定強化高等教育人才培育，以因應當前國際化與產業快速變遷之趨勢，培養能符應未來社會及國家發展所需用之人才。\n七、第七款規定挹注台灣電力股份有限公司，以調節能源價格等方式穩定民生物價，舒緩國際物價波動對民生、產業及經濟造成之影響；另增加撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n八、第八款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n九、第九款規定強化國土防衛能量，如改善、增設海岸巡防及其他包括無人載具等重要防衛設施與設備。\n十、第十款規定提升資通作業環境及設備，以強化其運作效率及備援韌性。\n十一、第十一款規定提升關鍵供應鏈韌性，以強化經濟安全。\n十二、第十二款規定提升能源自主與備援能力，以強化能源安全。"}],"changed":true,"final":"本條例所定強化經濟、社會、民眾消費及國土安全韌性措施之項目如下：\n一、提供企業金融支持。\n二、提升產業競爭力。\n三、協助企業開拓多元市場。\n四、支持勞工安定就業。\n五、強化農業金融支持、提升產業競爭力及協助開拓多元市場。\n六、強化高等教育人才培育。\n七、挹注全民健康保險基金及勞工保險基金。\n八、加強照顧弱勢族群及提供關懷服務。\n九、強化國土防衛能量。\n十、提升資通作業環境及設備。\n十一、發放現金每人新臺幣一萬元，強化民眾消費韌性，擴大內需，提振經濟效益。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"所有提案及修正動議2案均保留，送院會處理","text":""}},{"no":"第四條","current":null,"versions":[{"bill":"201110113870000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","note":"有關第三條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定，以利執行。"},{"bill":"202110120210000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","note":"有關第三條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定，以利執行。"},{"bill":"202110123950000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","note":"有關第三條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定，以利執行。"},{"bill":"202110123800000","text":"本條例所定強化經濟社會韌性之項目如下：\n一、提供企業金融支持，其經費不得低於新臺幣二百五十億元。\n二、提升產業競爭力，其經費不得低於新臺幣二百五十億元。\n三、協助企業開拓多元市場，其經費不得低於新臺幣二百億元。\n四、支持勞工安定就業，其經費不得低於新臺幣三百五十億元。\n五、強化農業金融支持、提升產業競爭力及協助開拓多元市場，其經費不得低於新臺幣三百億元。\n六、普發現金，其經費依第六條所定標準編列。\n七、挹注全民健康保險基金，其經費不得低於新臺幣三百七十億元。挹注勞工保險基金，其經費不得低於四百億元。\n八、加強照顧弱勢族群及提供關懷服務，其經費不得低於新臺幣一百二十億元。\n九、增加債務還本，其經費不得低於新臺幣二百五十億元。\n十、降低生活成本支出補助，其經費不得低於新臺幣一百八十億元。","note":"為因應國際情勢衝擊對我國經濟及各產業之影響，爰明定本條例所定強化經濟社會韌性之項目如下：\n一、第一款規定提供企業金融支持。如提供貿易融資利息減碼及輸出保險費用減免，強化廠商出口競爭力；辦理企業政策性貸款利息減碼補助、信用保證及保證手續費減免等融資協處措施。\n二、第二款規定提升產業競爭力。優化投資環境，協助企業根留臺灣，並利用半導體等科技領域之優勢，發展各種應用產業，帶動整體產業升級轉型。如透過法人、學校建置產業共通性之軟硬體設備，搭配人工智慧技術，建立示範、實作或訓練場域，及培育數位與人工智慧應用人才，並輔導及補助業者，進行技術升級、設備汰舊換新、創新數位研發與新創運用，開發更高規格產品，強化數位行銷，切入國外重要供應鏈或利基市場，取得海外訂單或產品認驗證等，加速全球市場多元布局，並降低單一市場依賴風險。\n三、第三款規定協助企業開拓多元市場。如協助企業布建海外通路、洽邀買主、共同品牌海外行銷、協助廠商及公協會參展拓銷等措施，爭取海外訂單；深化與美國等友盟國家產業投資與技術合作，進行供應鏈新布局。\n四、第四款規定支持勞工安定就業。如協助企業穩定僱用並強化勞工職能培訓、協助勞工再就業、促進青年接軌職場。\n五、第五款規定強化農業金融支持、提升產業競爭力及協助開拓多元市場。如提供農業貸款利息補助、強化外銷冷鏈體系、加速產業加值轉型、協助取得國內外標章或認驗證及擴大國內外行銷活動。\n六、第六款規定普發現金。為因應近年通膨及美國關稅政策所造成之經濟環境變動，並考量113年度中央政府總預算實際歲入稅收大幅超越預算歲入，爰於第六款規定普發現金，以減輕民眾之負擔。\n七、第七款規定挹注撥補全民健康保險基金、勞工保險基金財務，減輕勞健保基金財務壓力。\n八、第八款規定加強照顧弱勢族群及提供關懷服務，以減輕人民負擔，減緩國際情勢造成之衝擊。\n九、第九款規定增加債務還本。114年度中央政府總預算案支應債務還本原列1,415億元，為考量近年特別預算大幅舉債，又中央政府僅償還公共債務法之法定下限，使總負債規模不斷成長，為健全國家財政，符合世代正義、避免債留子孫，爰於第九款規定增加債務還本，不得低於250億元，使114年度中央政府支應債務還本增加至1,665億元。\n十、第十款規定降低生活成本支出補助。為持續鼓勵民眾多加利用大眾運輸工具，爰於第十款規定增加TPASS公共運輸補貼，減輕通勤族群交通負擔。\n十一、本條例所需之主要經費來源，為113年度中央政府總預算稅課收入預計高於預算數扣除債務還本後剩餘，以及立法院審議通過114年度總預算案歲出刪減總數。"},{"bill":"202110124770000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","note":"明定前條各款項目之執行相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定。"},{"bill":"202110125540000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","note":"有關第三條各款項目之執行方式期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法，報行政院核定後執行之。"},{"bill":"202110126810000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定，並送立法院備查。","note":"有關第三條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定，以利執行，並送立法院備查，以利監督。"},{"bill":"202110126750000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","note":"有關第三條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定，以利執行。"},{"bill":"202110126730000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","note":"有關第三條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定，以利執行。"},{"bill":"202110127880000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","note":"有關第三條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定，以利執行。"},{"bill":"202110128790000","text":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。\n主管機關得彙整統一相關執行準則，必要時得另訂子法以施行本條例。","note":"第三條各款項目之執行方式、期間、金額、資格等相關事項，由編列預算之中央各部會擬訂辦法報行政院核定，以利執行。"}],"changed":true,"final":"前條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。","finalWhy":"有關第三條各款項目之執行方式、期間、基準、金額、資格條件、應檢附文件、得委任、委託或委辦事項及其他相關事項之具體內容，授權編列預算之中央各部會擬訂辦法報行政院核定，以利執行。","review":{"note":"所有提案及修正動議1案均保留，送院會處理","text":""}},{"no":"第五條","current":null,"versions":[{"bill":"201110113870000","text":"第三條第九款及第十款項目之採購，得採限制性招標，委由國內依法設立之法人、機構或團體辦理，不受政府採購法第十九條及第二十二條第一項規定之限制。","note":"為期第三條第九款及第十款強化國土防衛能量、提升資通作業環境及設備採購項目之快速獲得，爰明定該二款項目之採購得採限制性招標，委由國內依法設立之法人、機構或團體辦理，並參考產業創新條例第九條之一第三項，不受政府採購法第十九條及第二十二條第一項有關公開招標及限制性招標規定之限制。至我國締結之條約或協定另有規定者，仍應從其規定，併予敘明。"},{"bill":"202110120210000","text":"第三條第九款及第十款項目之採購，得採限制性招標，委由國內依法設立之法人、機構或團體辦理，不受政府採購法第十九條及第二十二條第一項規定之限制。","note":"為期第三條第九款及第十款強化國土防衛能量、提升資通作業環境及設備採購項目之快速獲得，爰明定該二款項目之採購得採限制性招標，委由國內依法設立之法人、機構或團體辦理，並參考產業創新條例第九條之一第三項，不受政府採購法第十九條及第二十二條第一項有關公開招標及限制性招標規定之限制。至我國締結之條約或協定另有規定者，仍應從其規定，併予敘明。"},{"bill":"202110123950000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110123800000","text":"前條各款項目之執行方式、得委託或委辦事項、期間、基準、金額、資格條件、應檢附文件及其他相關事項之辦法，由編列預算之中央各部會擬訂，報請行政院核定。\n前條第六款普發現金之發放相關業務，得不適用政府採購法招標、決標之規定。\n依本條例規定自政府領取之現金、補貼、補助及其他給與，免納所得稅。\n依本條例規定自政府領取之現金、補貼、補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"一、有關第四條各款項目之執行方式、得委託或委辦事項、期間、基準、金額、資格條件、應檢附文件及其他相關事項之具體內容，於第一項編列預算之中央各部會擬訂辦法報行政院核定，以利執行。\n二、為使辦理第四條第六款普發現金之發放相關業務執行保持彈性，於第二項明定得不適用政府採購法招標、決標之規定。\n三、考量依本條例規定自政府領取之現金、補貼、補助及其他給與，係為減輕人民負擔，如就所領取之現金、補貼、補助及其他給與仍予課稅或移作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為第三項及第四項規定。"},{"bill":"202110124770000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110125540000","text":"第三條第九款及第十款項目之採購，得採限制性招標，委由國內依法設立之法人，機構或團體辦理，不受政府採購法第十九條及第二十二條第一項規定之限制。","note":"一、為期第三條第九款及第十款強化國土防衛能量、提升公、私部門資通作業環境及設備採購項目之快速獲得，爰明定該二款項目之採購得採限制性招標，委由國內依法設立之法人、機構或團體辦理，並參考產業創新條例第九條之一第三項，不受政府採購法第十九條及第二十二條第一項有關公開招標及限制性招標規定之限制。\n二、我國締結之條約或協定另有規定者，仍應從其規定，併予敘明。"},{"bill":"202110126810000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110126750000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限，並採特別預算方式編列。為確保預算編列與執行之彈性，亦明定預算之編製及執行，不受預算法第二十三條關於不得充經常支出之限制、第六十二條關於各機關、各政事及計畫或業務科目間不得流用之限制及第六十三條有關流用比率限制之規定所拘束。\n二、第二項明定辦理本條例所需經費之來源，得移用以前年度歲計賸餘或以舉借債務支應，且不受公共債務法第五條第七項有關年度舉債額度之流量限制。另為符合財政紀律法第十四條第二項之規定意旨，對於舉債比率仍應設有一定之控管機制，以維持財政紀律。\n三、第三項明定於本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符合財政紀律法第十四條第三項之規定意旨。"},{"bill":"202110126730000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110127880000","text":"第三條第九款及第十款項目之採購，得採限制性招標，委由國內依法設立之法人、機構或團體辦理，不受政府採購法第十九條及第二十二條第一項規定之限制。","note":"為期第三條第九款及第十款強化國土防衛能量、提升資通作業環境及設備採購項目之快速獲得，爰明定該二款項目之採購得採限制性招標，委由國內依法設立之法人、機構或團體辦理，並參考產業創新條例第九條之一第三項，不受政府採購法第十九條及第二十二條第一項有關公開招標及限制性招標規定之限制。至我國締結之條約或協定另有規定者，仍應從其規定，併予敘明。"},{"bill":"202110128790000","text":"第三條第九款及第十款項目之採購，得採限制性招標，委由國內依法設立之法人、機構或團體辦理，不受政府採購法第十九條及第二十二條第一項規定之限制。但應於不洩漏商業機密範圍內，揭露採購標的類型及得標對象。\n前項規定於我國已締結之條約或協定另有規定者，依其規定辦理。","note":"為加速第三條第九款及第十款所定強化國土防衛能量、提升資通作業環境及設備採購之推動，特明定相關採購得採限制性招標方式，並得委由國內依法設立之法人、機構或團體辦理。此規定參照「產業創新條例」第九條之一第三項，明確排除「政府採購法」第十九條及第二十二條第一項關於公開招標及限制性招標之限制。惟若我國已締結之條約或協定另有規定者，仍應依其辦理，併予明定。"}],"changed":true,"final":"第三條第九款及第十款項目之採購，得採限制性招標，委由國內依法設立之法人、機構或團體辦理，不受政府採購法第十九條及第二十二條第一項規定之限制。\n第三條第十一款現金發放相關業務，得不適用政府採購法招標、決標之規定。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"所有提案及修正動議1案均保留，送院會處理","text":""}},{"no":"第六條","current":null,"versions":[{"bill":"201110113870000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110120210000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110123950000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110123800000","text":"於本條例公布施行前，符合下列各款資格之一者，得依本條例領取新臺幣六千元：\n一、於國內現有戶籍之國民。\n二、各級政府機關因公派駐國外於國內現無戶籍之人員及其具有我國國籍之眷屬。\n三、取得臺灣地區居留許可之無戶籍國民。\n四、大陸地區人民為國內現有戶籍國民之配偶，且取得臺灣地區依親居留、長期居留許可。\n五、外國人為國內現有戶籍國民之配偶，且取得居留許可。\n六、香港或澳門居民為臺灣地區人民之配偶，且取得居留許可。\n七、前三款大陸地區人民、外國人、香港或澳門居民離婚或配偶死亡，其居留許可未廢止。\n八、第三款至前款之人取得定居許可，尚未設戶籍。\n九、取得我國永久居留許可之外國人。\n本條例公布施行日起算二個月內，在國內出生並領有出生證明之國民，且其生母或生父符合前項各款資格之一者，亦得領取新臺幣六千元。","note":"明定普發現金之基準、金額、資格與認定時間，另各款之得領取資格主要係參考《因應嚴重特殊傳染性肺炎振興五倍券發放辦法》第四條規定及《全民共享經濟成果普發現金辦法》第三條規定。"},{"bill":"202110124770000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110125540000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另，為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間。中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110126810000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟社會之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110126750000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110126730000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110127880000","text":"本條例所需經費上限為新臺幣四千一百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"},{"bill":"202110128790000","text":"本條例所需經費上限為新臺幣四千五百億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。\n本條例所編列特別預算不得用於常態性人事費用或行政管理支出。","note":"一、第一項明定本條例所需之經費上限及採特別預算方式編列。另為使預算編列與執行保持彈性，並明定預算編製及執行不受預算法第二十三條不得充經常支出規定、第六十二條各機關、各政事及計畫或業務科目間不得流用、第六十三條有關流用比率之限制。\n二、第二項明定辦理本條例所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應，不受公共債務法第五條第七項每年度舉債額度之流量限制，並為符合財政紀律法第十四條第二項規定意旨，舉債比率仍應有一定控管機制。\n三、第三項明定本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，仍應依公共債務法第五條第一項規定辦理，以符財政紀律法第十四條第三項規定意旨。"}],"changed":true,"final":"本條例所需經費上限為新臺幣五千四百五十億元，得視國際情勢變化，分期編列特別預算；其預算編製與執行不受預算法第二十三條、第六十二條及第六十三條規定之限制。\n前項所需經費來源，得以移用以前年度歲計賸餘或舉借債務支應；其每年度舉借債務之額度，不受公共債務法第五條第七項規定之限制。中央政府總預算及特別預算於本條例施行期間之舉債額度合計數，不得超過該期間總預算及特別預算歲出總額度合計數之百分之十五。\n本條例施行期間，中央政府所舉借之一年以上公共債務未償餘額預算數，應依公共債務法第五條第一項規定辦理。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"保留，送院會處理","text":""}},{"no":"第七條","current":null,"versions":[{"bill":"201110113870000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110120210000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110123950000","text":"依本條例編列預算之中央各部會應專案列管及考核第三條各款所定項目之執行。","note":"為利本條例之相關計畫管制作業有所依循，並有效落實第三條各款所定項目之執行，爰為本條管考規定。"},{"bill":"202110123800000","text":"依本條例編列預算之中央各部會，應將預算執行情形之工作計畫實施成果概述、計畫提要及分支計畫概況表，並說明實施進度及預算執行數額，按季送立法院備查。","note":"為求特別預算之執行期間仍應接受立法院之監督，爰訂定本條。"},{"bill":"202110124770000","text":"依本條例編列預算之中央各部會應專案列管及考核第三條各款所定項目之執行。","note":"為有效落實第三條各款所定項目之執行，爰為本條管考規定。"},{"bill":"202110125540000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110126810000","text":"依本條例編列預算之中央各部會應專案列管及考核第三條各款所定項目之執行；並應將預算執行情形及工作計畫成果概述，按季送立法院備查。\n本條例施行滿一年後，行政院院長每年須向立法院就相關預算執行提出專案報告。","note":"一、為利本條例之相關計畫管制作業有所依循，並有效落實與監督第三條各款所定項目之執行，爰為本條第一項各部會管考及按季送交執行情形與成果概述至立法院備查之規定。\n二、本條例係為因應特殊國際情勢而制定，爰於第二項規定行政院院長每年應向立法院就相關預算執行提出專案報告。"},{"bill":"202110126750000","text":"依本條例編列預算之中央各部會應專案列管及考核第三條各款所定項目之執行。","note":"為利本條例之相關計畫管制作業有所依循，並有效落實第三條各款所定項目之執行，爰為本條管考規定。"},{"bill":"202110126730000","text":"依本條例編列預算之中央各部會應專案列管及考核第三條各款所定項目之執行。","note":"為利本條例之相關計畫管制作業有所依循，並有效落實第三條各款所定項目之執行，爰為本條管考規定。"},{"bill":"202110127880000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","note":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。"},{"bill":"202110128790000","text":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。但法律另有規定者，從其規定。","note":"考量依本條例規定自政府領取之補助及其他給與，係為強化經濟及社會韌性，目的在於減輕人民負擔、穩定經濟與就業、改善投資環境及促進產業升級轉型，若仍就該等補助課稅，或作為抵銷、扣押、擔保或強制執行之標的，將違背原設補助之立法目的，爰明定本條規定，以確保政策效益。"}],"changed":true,"final":"依本條例規定自政府領取之補助及其他給與，免納所得稅。\n依本條例規定自政府領取之補助及其他給與，不得作為抵銷、扣押、供擔保或強制執行之標的。","finalWhy":"考量依本條例規定自政府領取之補助及其他給與，係為減輕人民負擔、穩定國家經濟與就業市場、改善投資環境及促進產業升級轉型等強化經濟及社會韌性之目的，如就所領取之補助及其他給與仍予課稅或得作為抵銷、扣押、供擔保或強制執行之標的，將喪失原發給之目的，爰為本條規定。","review":{"note":"保留，送院會處理","text":""}},{"no":"第八條","current":null,"versions":[{"bill":"201110113870000","text":"依本條例編列預算之中央各部會應專案列管及考核第三條各款所定項目之執行。","note":"為利本條例之相關計畫管制作業有所依循，並有效落實第三條各款所定項目之 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;

      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
