<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>專科學校法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

務之實踐：依據《憲法增修條文》第十條第一項及第十二條規定，國家應積極維護發展原住民族教育文化，並扶助其發展。鑒於原住民族學生因歷史、地理、社會結構及經濟體制等外部因素，在教育資源之取得上往往面臨更深層之不利處境。為貫徹平等原則之實質正義（實質平等），相關就學貸款等助學措施（如家庭所得門檻之認定、補助額度及審查條件等）應採取從優、從寬認定標準，以發揮實質扶助之功能。且有關原住民學生之就學貸款條件、額度、權利義務等辦法，涉及原住民族特殊文化脈絡、部落經濟型態與身分認定，非單一教育行政機關所能周延涵蓋。爰明定應由教育部會同中央原住民族主管機關（原住民族委員會）共同定之，以確保政策制定能精準對接原住民族學生之實質需求，提供兼具文化敏感度與最大化之權益保障，爰擬具「專科學校法第四十四條及第四十九條條文修正草案」。是否有當？敬請公決。","arts":["第四十四條","第四十九條"]},{"id":"202110218290000","who":"委員吳沛憶等21人","date":"2026-06-05","name":"「專科學校法第四十四條及第四十九條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110218290000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/05/23/LCEWA01_110523_00264.pdf","proposers":["吳沛憶","伍麗華Saidhai‧Tahovecahe","黃捷","陳素月","沈伯洋"],"ncosign":16,"people":[["吳沛憶","民進黨","提案"],["伍麗華Saidhai‧Tahovecahe","民進黨","提案"],["黃捷","民進黨","提案"],["陳素月","民進黨","提案"],["沈伯洋","民進黨","提案"],["許智傑","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳俊宇","民進黨","連署"],["林月琴","民進黨","連署"],["郭國文","民進黨","連署"],["林宜瑾","民進黨","連署"],["陳秀寳","民進黨","連署"],["郭昱晴","民進黨","連署"],["王正旭","民進黨","連署"],["王美惠","民進黨","連署"],["王義川","民進黨","連署"],["吳思瑤","民進黨","連署"],["張雅琳","民進黨","連署"],["徐富癸","民進黨","連署"],["羅美玲","民進黨","連署"],["賴瑞隆","民進黨","連署"]],"party":[["民進黨",21]],"reason":"本院委員吳沛憶、伍麗華Saidhai Tahovecahe、黃捷、陳素月、沈伯洋等21人，為為協助青年發展，減輕學生負擔，爰擬具「專科學校法第四十四條及第四十九條條文修正草案」。是否有當？敬請公決。","arts":["第四十四條","第四十九條"]},{"id":"202110218230000","who":"委員張雅琳等18人","date":"2026-06-05","name":"「專科學校法第四十四條及第四十九條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110218230000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/05/23/LCEWA01_110523_00265.pdf","proposers":["張雅琳"],"ncosign":17,"people":[["張雅琳","民進黨","提案"],["陳素月","民進黨","連署"],["林淑芬","民進黨","連署"],["王正旭","民進黨","連署"],["黃捷","民進黨","連署"],["李坤城","民進黨","連署"],["林楚茵","民進黨","連署"],["黃秀芳","民進黨","連署"],["徐富癸","民進黨","連署"],["李柏毅","民進黨","連署"],["陳瑩","民進黨","連署"],["陳俊宇","民進黨","連署"],["陳冠廷","民進黨","連署"],["陳秀寳","民進黨","連署"],["林月琴","民進黨","連署"],["王義川","民進黨","連署"],["郭國文","民進黨","連署"],["賴瑞隆","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員張雅琳等18人，為使專科學校學生之就學貸款規範更 學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","versions":[{"bill":"202110006120000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n專科學校五年制後二年學生，家庭所得淨額適用稅率百分之十二以內者，免納學費。但未具有中華民國國籍者，不適用之。\n前二項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、增訂第二項。為打破「貧窮世襲」的惡性循環，落實社會正義，促成社會流動，針對就讀五專後二年，並具中華民國國籍之經濟弱勢學生，其家庭所得淨額適用稅率百分之十二以內者，免納學費。\n二、修正第三項。針對第二項免納學費之經費來源，由教育部編列預算補助。"},{"bill":"202110030590000","text":"專科學校五年制前三年學生，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款之利息，由主管機關編列預算負擔，其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。\n第四項得辦理學生就學貸款之資格，須包含下列對象，並以第四項之辦法定之：\n一、家庭年所得總額為新臺幣一百五十萬元以下。\n二、家庭年所得總額超過新臺幣一百五十萬元，且學生有兄弟姊妹或子女有未成年、就學或其他類似情形。\n三、其他特殊情況。","note":"一、修正第一項，修正第四項後段，增訂第六項。\n二、教育部業已於113年2月起，推行所有具有中華民國國籍的高級中等學校學生（不分公私立、高中或高職，專科學校五年制者，包含前三年）免納學費，惟本條仍規定「依一定條件」。為推動青年政策，減輕青年就學負擔，本次修正將現行行政措施入法，凡具中華民國國籍之學生，一律免學費。\n三、為推動青年政策，減輕青年就學負擔，本次修正就學貸款應免繳利息，由主管機關編列預算負擔之，並放寬現行得辦理學生就學貸款資格之家庭年所得總額標準。詳言之，目前依據「高級中等以上學校學生就學貸款辦法」第七條第一項，得申請就學貸款者，有家庭年所得總額新臺幣一百二十萬元以下、受傳染病疫情影響、其他特殊情況，或雖家庭年所得總額超過一百二十萬元，但家庭中有未成年子女或有人就學等情形。本次修正特將新臺幣一百二十萬元之標準，放寬為一百五十萬元，讓更多學子能辦理就學貸款，特修正第四項、增訂第六項。"},{"bill":"202110037630000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n專科學校五年制後二年學生，其家庭所得五等分最低百分之二十者，免納學費。但未具有中華民國國籍者，不適用之。\n前二項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、新增第二項。針對家庭所得五等分，最低百分之二十的所得者免繳納學費。\n二、規範免納學費之經費來源及請撥方式。"},{"bill":"202110201660000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n前項就學貸款，自貸款日起至償還期起算日前之利息，由各該主管機關按年編列預算負擔。\n教育部應定期檢討第四項就學貸款之申請資格及家庭年所得標準，並衡酌物價變動、居住成本及家庭扶養負擔調整之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、第一項至第三項未修正。現行第一項至第三項係規範專科學校五年制前三年免納學費制度及其相關收費事項，與本次就學貸款制度修正目的不同，爰予維持。現行第四十四條條文結構亦確為前三項處理免學費，第四項始為就學貸款授權，第五項為違規收費效果。\n二、增訂第五項。現行學生就學貸款自貸款日起至償還期起算日前之利息，依申請人家庭年所得及兄弟姊妹、子女人數等條件，分由主管機關或借款學生負擔；其中主管機關應負擔之利息，現行辦法已明定由各該主管機關按年編列預算負擔。為減輕學生在學期間及畢業初期之財務壓力，並使母法與現行子法用語一致，爰明定該期間之利息，由各該主管機關按年編列預算負擔。\n三、增訂第六項。考量物價、租屋及生活成本持續變動，若申請資格與家庭年所得標準長期未調整，恐與實際青年求學負擔脫節。為維持制度之公平性及合理性，爰明定教育部應定期檢討，並衡酌相關經濟因素動態調整之法定義務。\n四、現行第五項順延為第七項，內容未修正。"},{"bill":"202110199170000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n前項就學貸款之利息，由教育部編列預算全額補助學生，相關辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、政府每年負擔學貸利息補助已經從最高41億元（民國96年），負擔支出已經降至113年20多億元，申請人次也從81萬到目前33萬，未來負擔可望持續減少，政府也得以負擔。\n二、媒體報導個案因為欠就學貸款而被銀行聲請強制執行，有薪資入帳，就會被扣掉三分之一拿去還債，根據人力資源網站（yes123）民間調查，造成青年勞工負債的主因，學貸（45.3%）為最主要原因，為降低青年負擔與生活成本以及就學負擔，爰提案修法。"},{"bill":"202110206710000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；貸款利息由政府編列預算全額補貼；貸款學生應自學業完成、服義務兵役、參加教育實習或其他事實完成日後滿二年之次日起，依年金法按月攤還本金；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、就學貸款制度係國家協助學生接受教育、落實教育平權之重要措施，惟現行制度對貸款利息負擔及本金償還期限之規範，對學生就學及畢業初期之經濟支持尚有不足，實有檢討修正之必要。\n二、近年物價上升，青年畢業後普遍面臨生活成本及就業初期待遇壓力，現行就學貸款制度未能充分減輕其還款負擔，對青年生涯發展影響甚鉅。\n三、為實質減輕青年負擔，強化國家對教育及青年發展之支持，爰修正專科學校法第四十四條第四項，明定學生就學貸款利息由政府編列預算全額補貼，並延長本金償還起算期間，以落實教育平權。"},{"bill":"202110206660000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n專科學校五年制後二年學生，家庭綜合所得淨額適用稅率百分之十二以內者，免納學費。但未具有中華民國國籍者，不適用之。\n前二項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n前項就學貸款之利息，由教育部編列預算全額補助學生，相關辦法，由教育部定之。\n專科學校違反第一項、第二項或第四項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、鑒於就學貸款衍生之還款壓力，已成為青年就學與就業之沉重負擔。依據司法院及教育部資料顯示，因積欠學貸而衍生之支付命令案件已近八萬筆，遭銀行申請強制執行者亦達兩萬多筆。為實質減輕弱勢學生與家庭經濟負擔、縮短貧富差距，爰增訂第二項，明定就讀五年制專科學校後二年，其家庭綜合所得淨額適用稅率在百分之十二以內之我國籍學生，免納學費。\n二、配合前項免納學費之規定，確保財源無虞並明確行政作業，爰修正現行條文第二項並移列為第三項，明定相關經費由教育部編列預算全額補助及後續請撥程序。\n三、現行條文第三項及第四項未修正，配合項次變更，移列為第四項及第五項。\n四、鑒於受少子女化影響，政府負擔之就學貸款利息補貼預算，已由民國九十六年最高約四十一億元，大幅下降至一百十三年約二十多億元；申請人次亦由約八十一萬人次降至三十三萬人次，顯示政府整體財政負擔已較以往減輕。為進一步降低青年就學及還款壓力，爰增訂第六項，明定就學貸款之利息由教育部編列預算全額補助，並授權教育部訂定相關辦法。\n五、現行條文第五項配合項次變更移列為第七項，並連動修正援引之項次。"},{"bill":"202110207310000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；貸款利息由政府編列預算全額補貼；貸款學生應自學業完成、服義務兵役、參加教育實習或其他事實完成日後滿二年之次日起，依年金法按月攤還本金；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、修正本條文第四項。\n二、就學貸款制度係國家促進社會流動、落實教育平權的重要措施。然現行《高級中等以上學校學生就學貸款辦法》針對利息補貼，設有家庭年所得級距限制，未能全面涵蓋所有具經濟壓力的申貸者，且還款寬限期多僅為事實完成日後滿一年之次日。鑑於近年來消費者物價指數持續上漲，初入職場青年面臨薪資結構調整緩慢與高昂生活成本等困境，學貸債務已成為青年成家、生育及職涯發展的沉重負擔。\n三、為實質減輕青年負擔，爰修正本法第四十四條條文，新增就學貸款利息由政府編列預算全額補貼，將寬限期由現行「一年」延長為「二年」，即貸款學生自《高級中等以上學校學生就學貸款辦法》第十一條所列之學業完成、服義務兵役、參加教育實習，以及退學、休學等事實完成後，第三年起（滿二年之次日）方需依年金法攤還本金。"},{"bill":"202110206880000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n政府為促進公平就學，應拉近公私立專科學校學雜費差距，針對私立專科學校學生提供學雜費定額減免；並針對不分公私立專科學校特定弱勢及經濟弱勢學生，另外提供學雜費定額減免或全免、助學金及住宿補貼等配套補助。其各項實施辦法由教育部定之。\n前項所需經費，由教育部編列預算支應，針對補助對象及補助金額應每年定期檢討。各項減免、補助及補貼額度不得低於前一年度。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、增列第五項，為促進公平就學，特將行政院「拉近公私立學校學雜費差距及其配套措施方案」入法，提升至法律位階。鑑於政府業自113年2月起全面實施「拉近公私立學校學雜費差距」方案，凡符合資格的私立大專校院本國籍學生，每學年自動減免3.5萬元學雜費，此外，並對不分公私立大專校院之經濟弱勢學生再加碼補助1.5萬至2萬元，每年投入逾兩百億元。為使國家教育政策穩定及資源永續，避免政策因政府執政黨或總統更迭而變動，特將上開政策入法，提升至法律位階，各項實施辦法授權由教育部訂定。\n二、增列第六項，規定經費來源由教育部編列預算支應，並應每年定期檢討補助對象及補助額度，並規定各項減免、補助及補貼額度，不得低於前一年度。"},{"bill":"202110209330000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n前項就學貸款，自貸款日起至償還期起算日前之利息，由各該主管機關按年編列預算負擔。\n教育部應定期檢討第四項就學貸款之申請資格及家庭年所得標準，並衡酌物價變動、居住成本及家庭扶養負擔調整之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、現行《專科學校法》第四十四條為專科學校學生就學貸款制度之授權依據，《高級中等以上學校學生就學貸款辦法》亦係依《大學法》第三十五條第二項、《專科學校法》第四十四條第四項及《高級中等教育法》第五十八條訂定。惟無論母法或子法，對於申請資格及未屆還款期前之利息負擔等關鍵事項，均未建立定期檢討機制，整體規範尚屬不足，致制度運作重心過度仰賴子法，欠缺法律位階上之穩定性與周延性。\n二、依立法院預算中心「教育部112年度單位預算評估報告」指出，信保基金辦理就學貸款信用保證業務，因借款人逾期而代償之件數及金額，自105年底約33.3萬件、47.3億元，增加至108年底約40.3萬件、51.32億元；迄111年8月底，雖代償餘額降至約47.6億元，惟代償件數仍上升至約43.7萬件，顯示部分借款人於貸款屆期後仍無力償還，償還壓力問題未見根本改善。\n三、再據司法院判決書查詢系統資料顯示，自就學貸款制度實施以來，已有逾五萬件因積欠學貸而遭金融機構聲請強制執行之案件，顯示相當比例之畢業生面臨償還困境。\n四、綜上，為減輕青年學貸負擔、強化教育機會平等，並建立制度性之檢討與調整機制，爰增訂第四十四條第五項及第六項，明定就學貸款利息於在學期間由政府全額補助，並就申請資格及未屆還款期前之利息負擔等關鍵事項，建立定期檢討機制，以提升制度之公平性與可持續性。"},{"bill":"202110209540000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款利息由教育部編列預算全額補助；其貸款條件、額度、權利義務、利息補助及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"修正第四項後段，其貸款利息由教育部編列預算全額補助，以及利息補助之辦法，由教育部定之。"},{"bill":"202110209450000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；貸款利息由政府編列預算全額補貼；貸款學生應自學業完成、服義務兵役、參加教育實習或其他事實完成日後滿二年之次日起，依年金法按月攤還本金；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、修正本條文第四項。\n二、就學貸款制度乃國家為落實教育得以促進社會階級流動之本意、以及落實教育平等之重要政策。然專科學校學費貸款補助依據《高級以上中等學校學雜費收取辦法》第三條第二項第二款及同法第七條之規定，利息補貼，設有家庭年所得級距限制，未能全面涵蓋所有具經濟壓力的申貸者，且還款寬限期多僅為事實完成日後滿一年之次日。根據行政院主計總處公布之消費者物價指數，近五年來相較於以往呈現連年升高之趨勢，國人實質薪資卻沒有隨著消費者物價指數升高而呈現正相關，薪資水準停滯不前，學貸債務儼然成為青年成家、生育的沉重負擔。\n三、為有效減輕有就學子女國人之經濟負擔、兼顧社會正義以及為避免學貸問題成為青年無法安心成家之阻礙，爰修正本法第四十四條條文，新增就學貸款利息由政府編列預算全額補貼，將寬限期由現行「一年」延長為「二年」，即貸款學生自《高級中等以上學校學生就學貸款辦法》第十一條所列之學業完成、服義務兵役、參加教育實習，以及退學、休學……等事實完成後，第三年起（滿二年之次日）方需依年金法攤還本金。"},{"bill":"202110211760000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費；專科學校五年制後二年學生，其家庭所得五等分最低百分之二十者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條　件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款之利息，由主管機關編列預算負擔，貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、為落實就學平權，減輕經濟弱勢學生之就學負擔，並配合《大學法》修正草案，明定五年制後二年學生其家庭所得五等分最低百分之二十者，免納學費。\n二、鑑於少子化趨勢，就學貸款整體申請人數相較以往已趨減，由民國103年約30萬下降至113年約17萬，且教育部115年度編列相關利息補貼預算較前一年度減少100萬元，顯示財政負擔具一定可控性，具備擴大補助之可行條件。透過利息全額補貼，有助降低我國學子財務負擔並維護信用，強化政策實益，減輕學生就學及畢業後之還款負擔，免於利息累積及物價指數飛漲雙重壓力，故修訂第四項，由主管機關編列預算全額負擔就學貸款之利息。"},{"bill":"202110211290000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n前項就學貸款免繳本金寬限二年，其間之利息，應自其最後教育階段學業完成日或服完義務兵役後滿二年翌日起，開始償還。本貸款自貸款日起至償還期起算之前一日止應負擔之利息，由中央主管機關按年編列預算。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、鑒於政府為培育優秀人才，促進教育機會均等，協助高級中等以上在學學生順利完成學業，於六十五年九月開辦助學貸款，其後於八十三年更名為就學貸款。\n二、依教育部資料，歷年高級中等以上學校學生就學貸款統計以九十八學年度申貸人次最多八十一萬餘人次、申貸金額三百零二億元，至一百十三學年度已大幅降至三十三萬餘人次、金額一百十四億元，其中大專校院部分就學貸款金額占比約百分之九十八．六九，以目前就學貸款利率百分之一．七七五推估政府每年負擔利息約二億元。\n三、考量學生於教育階段學業或服完義務兵役完成後，初期就業尚未穩定、薪資偏低或協助家計等因素，透過延長寬限期二年措施，讓貸款人減輕還款壓力與改善家庭生活經濟，爰增訂第五項，及其緩繳期間應負擔之利息，由中央主管機關按年編列預算負擔。"},{"bill":"202110211730000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n前項就學貸款之利息，由教育部編列預算全額補助學生，相關辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、新增第五項。\n二、近年政府就學貸款利息補貼支出呈現明顯下降趨勢，由民國96年高峰約41億元，至民國113年已降至20多億元；同期間申請人次亦由約81萬人縮減至約33萬人。整體觀察，未來財政負擔具持續緩和空間，政府具備相當承擔能力。\n三、實務上已有案例顯示，因無力償還就學貸款而遭金融機構聲請強制執行，一旦有薪資收入即可能被依法扣取1/3用以清償債務。另依民間人力資源平台之調查結果，青年勞工負債來源中，以學貸占比最高（45.3%），顯示其對青年經濟壓力影響甚鉅。為減輕青年族群之財務負擔與生活成本，並降低就學期間所形成之長期壓力，爰增訂第五項，由教育部編列預算全額補助學生就學貸款之利息。\n四、原第五項移列為第六項。"},{"bill":"202110214920000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費；專科學校五年制後二年學生，其家庭所得分配最低五等分位者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款之利息，由主管機關編列預算全額負擔；貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、現行條文第一項僅對「前三年」學生設有免學費規定，五年制後二年學生若家庭所得屬最低五等分位者，仍須繳納學費，形成同一學制內之保障落差。爰修正第一項，明定後二年學生中，家庭所得分配最低五等分位（即所得最低20%）者，一律免納學費，擴大保障範圍，落實教育機會均等。\n二、配合《大學法》修正草案之政策方向，修正第四項，將就學貸款利息由「辦法授權規定」提升為「主管機關法定義務」，明定利息應由主管機關編列預算全額負擔，使利息補貼不再取決於年度預算彈性，強化制度保障強度，降低學生因利息累積造成之長期財務壓力。\n三、就學貸款申請人數雖由103年約30萬人降至113年約17萬人，且教育部115年度相關利息補貼預算已較前年度減少約100萬元，財政負擔具一定可控性，具備擴大補助之可行條件。透過利息全額補貼，有助降低學子財務負擔並維護信用，強化政策實益，減輕學生就業及畢業後之還款壓力。\n四、第二項、第三項及第五項文字維持現行規定，未予修正，以維持條文穩定性。"},{"bill":"202110218150000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之。\n政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、現行就學貸款項目未明確涵蓋數位學習所需之資訊設備及網路通訊支出，惟在教學數位化趨勢下，相關費用已屬學生基本且必要之學習成本。為反映教育現場實際需求，並避免因法規未明致生適用疑義，爰於第四項明定納入「電腦及網路通訊使用費」，以提升制度之完整性。\n二、考量部分學生於畢業後進入職場初期，收入尚未穩定，易形成還款壓力，影響其經濟發展及生活穩定。爰於第四項增列「還款協助措施」，明確授權教育部訂定相關機制，以建構更彈性的貸款制度支持青年。\n三、為落實憲法保障人民受教育權及教育機會均等原則，並回應社會經濟變遷所帶來之所得差距問題，爰增訂第五項，明定政府應針對經濟不利處境學生提供助學措施。其範圍除家庭所得外，並納入突發經濟變故等情形，以擴大制度涵蓋面，強化政策彈性。\n四、有關助學措施之具體條件、補助額度、權利義務及相關執行細節，涉及專業判斷及實務運作，且須隨社會經濟情勢適時調整，爰授權教育部訂定辦法，以確保制度運作之彈性與即時性，並提升政策執行效能。"},{"bill":"202110217950000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之；涉及原住民部分，由教育部會同中央原住民族主管機關定之。\n政府應依學生家庭所得或其他突發經濟部利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之；涉及原住民部分，由教育部會同中央原住民族主管機關定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、修正第四項、增列第五項、原第五項移列至第六項。\n二、為落實憲法保障人民受教育權之精神，並積極實踐教育機會均等原則，明定政府應依學生家庭所得或其他經濟情況，提供經濟不利處境學生就學貸款等助學措施（如就助學金、學雜費減免等），以減輕其就學經濟負擔，確保不因經濟因素阻礙其高等教育之發展。\n三、特別針對具原住民身分之學生採取「從優保障」與「多元文化尊重」原則：國家憲法義務之實踐：依據《憲法增修條文》第十條第一項及第十二條規定，國家應積極維護發展原住民族教育文化，並扶助其發展。鑒於原住民族學生因歷史、地理、社會結構及經濟體制等外部因素，在教育資源之取得上往往面臨更深層之不利處境。為貫徹平等原則之實質正義（實質平等），相關就學貸款或助學措施（如家庭所得門檻之認定、補助額度及審查條件等）應採取從優、從寬認定標準，以發揮實質扶助之功能。且有關原住民學生之就學貸款條件、額度、權利義務等辦法，涉及原住民族特殊文化脈絡、部落經濟型態與身分認定，非單一教育行政機關所能周延涵蓋。爰明定應由教育部會同中央原住民族主管機關（原住民族委員會）共同定之，以確保政策制定能精準對接原住民族學生之實質需求，提供兼具文化敏感度與最大化之權益保障。"},{"bill":"202110218290000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之。\n政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、修正第四項，於學生就學貸款貸款項目增訂「電腦及網路通訊使用費」，政府應提供還款協助措施。\n二、增訂第五項規範，明定政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施。為保持政策之彈性調整空間，爰授權相關事項以辦法訂之。"},{"bill":"202110218230000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之。\n政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、為使規範更加明確並符合學生實際貸款需求，爰修正第四項，增訂「電腦及網路通訊使用費」。\n二、明定已開始償還就學貸款之學生，政府提供還款協助措施，減輕貸款人還款之壓力，以資明確。\n三、增訂第五項規範：為落實教育平權、保障學生受教權，明定政府應針對家庭所得較低或突發經濟困境之學生提供助學措施；其助學條件、額度及作業細節，由教育部另訂辦法執行。"},{"bill":"202110218310000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之。\n政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、為使規範更加明確並符合學生實際貸款需求，爰修正第四項，增訂「電腦及網路通訊使用費」，並明定已開始償還就學貸款之學生，政府提供還款協助措施，減輕貸款人還款之壓力，以資明確。\n二、為落實教育平權，避免學生因家庭所得、突發變故或其他經濟不利條件影響其受教權，爰增訂第五項規範，明定政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施。同時由教育部針對助學條件、額度、權利義務等技術性、細節性、作業性事項，另訂辦法據以執行，以即時因應國內家庭所得狀況，以及各種突發經濟不利情境，保障學生受教權。"},{"bill":"202110218820000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之。\n政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、為使規範更加明確並符合學生實際貸款需求，爰修正第四項，增訂「電腦及網路通訊使用費」，並明定已開始償還就學貸款之學生，政府提供還款協助措施，減輕貸款人還款之壓力，以資明確。\n二、為落實教育平權，避免學生因家庭所得、突發變故或其他經濟不利條件影響其受教權，爰增訂第五項規範，明定政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施。同時由教育部針對助學條件、額度、權利義務等技術性、細節性、作業性事項，另訂辦法據以執行，以即時因應國內家庭所得狀況，以及各種突發經濟不利情境，保障學生受教權。"},{"bill":"202110220000000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之。\n政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、第一項未修正。\n二、為使法律文字更臻明確並符合學生實際貸款需求，爰修正第四項，增訂「電腦及網路通訊使用費」，並增訂政府就已開始償還就學貸款之學生提供還款協助措施之法律依據，減輕貸款人還款之壓力。\n三、增訂第五項，為落實教育平權，避免學生受家庭經濟因素或其他突發經濟不利情況影響其受教權，明定政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施。另授權教育部針對助學條件、額度、權利義務及其他應遵行等技術性、細節性及作業性事項，訂定辦法以利執行；俾利即時因應我國學生家庭所得狀況，以及各種突發經濟不利情境，保障學生受教權。"},{"bill":"202110219520000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費、電腦及網路通訊使用費及主管機關核可之相關費用。\n主管機關應依據學生家庭經濟狀況、國家經濟情勢、就業市場狀況或緊急特殊狀況，減免就學貸款之本息或提供協助還款措施，其經費由中央主管機關編列預算支應。\n前二項之貸款條件、額度、權利義務、減免之要件及額度、協助還款措施及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、第一項至第三項未修正。\n二、為因應數位時代之數位學習模式，電腦及網路已成為學生學習之必要工具，爰將電腦及網路通訊使用費納入就學貸款項目。另考量社會經濟變化迅速，且各學門間差異不小，助學貸款之項目應有彈性，凡主管機關核可之項目均可使用就學貸款，爰修正第四項。\n三、增訂第五項，為協助弱勢學生或因應社會經濟重大變化，參考國外之作法，主管機關得考量財政狀況、經濟情勢及就業市場狀況，減免就學貸款之本息或提供協助還款措施。\n四、現行條文第四項後段移列為第六項，並配合文字修正。\n五、現行條文第五項移為第七項，不修正。"},{"bill":"202110218710000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、為使規範更加明確並符合學生實際貸款需求，爰修正第四項，增訂「電腦及網路通訊使用費」，並明定已開始償還就學貸款之學生，政府提供還款協助措施，減輕貸款人還款之壓力，以資明確。\n二、為落實教育平權，避免學生因家庭所得、突發變故或其他經濟不利條件影響其受教權，爰增訂第五項規範，明定政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施。同時由教育部針對助學條件、額度、權利義務等技術性、細節性、作業性事項，另訂辦法據以執行，以即時因應國內家庭所得狀況，以及各種突發經濟不利情境，保障學生受教權。"},{"bill":"202110221930000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費；專科學校五年制後兩年學生，其家庭所得五等分最低百分之二十者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款，並編列預算，全額補助貸款之利息；貸款項目包括學雜費、實習費、書籍費、住宿費、電腦及網路通訊使用費、生活費、學生團體保險費及海外研修費等相關費用；其貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、鑒於近年來因消費者物價指數高漲，學生畢業後之薪資往往僅夠日常所須，再查司法院判決系統，因償還不起學貸遭銀行申請強制執行之件高達8.5萬餘件，凸顯學生貸款已成為學生畢業後沉重之債務負擔，甚對經濟弱勢之學生，更是無法承擔之重。\n二、此外，教育部數據指出，近十年來，向教育部申請「緩繳本金」之學生人數，自104年3萬3,246人至114年達到4萬8,389人，增長1萬5,143人；另自107年起，教育部新增之「只繳息不還本」政策，申請人數也自107年4,155人，增加至114年9,023人，增加4,868人，顯見許多學生畢業後一年之薪資不足以承擔學生貸款。\n三、再者，近年來數位發展快速，強化數位能力為當前學生必要之功課，然現行就學貸款之項目卻未有學生之電腦及網路通訊費，恐使城鄉之數位落差進一步擴大，實有檢討之必要。\n四、綜上所述，爰於本條第一項增訂專科學校五年制後兩年學生，其家庭所得五等分最低百分之二十者，免納學費；另於第四項規定由政府編列預算，全額補助就學貸款利息，並於貸款項目增訂電腦及網路通訊使用費。"},{"bill":"202110224590000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費；專科學校五年制後二年學生，其家庭所得五等分最低百分之二十者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條　件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款之利息，由主管機關編列預算負擔，貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、為落實教育平權，並減輕經濟弱勢學生就學負擔，爰修正相關條文，明定五專部後二年學生若家庭所得位於最低百分之二十級距者，免納學費，以落實高等教育資源之公平分配，並配合《大學法》修正草案。\n二、鑑於少子化影響，就學貸款申貸人數已由民國103年約30萬人降至113年約17萬人，且相關利息補貼預算逐年減少，財政負擔具備可控性。鑑於逾七成申貸者為私立大專學生，且逾期保證比率攀升，反映學生還款負擔沉重。為減輕學子利息負擔並保障其信用。"},{"bill":"202110224740000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之。\n政府應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，其助學條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、為減少青年學貸負擔及減輕家長的重擔，完善專科學校學生就學貸款制度，並強化對經濟不利處境學生之支持機制。\n二、修正第四項，於學生就學貸款貸款項目增訂「電腦及網路通訊使用費」，政府應提供還款協助措施。\n三、增訂第五項規範，明定教育部應依學生家庭所得或其他突發經濟不利情況，提供經濟不利處境學生助學措施，授權相關事項以辦法訂之。"},{"bill":"202110223720000","text":"專科學校五年制前三年學生，符合一定條件者，免納學費；專科學校五年制後二年學生，其家庭所得五等分位屬最低百分之二十者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n前項免納之學費，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費。\n除第一項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費及海外研修費等相關費用；其貸款之利息，由中央主管機關編列預算全額補助。貸款條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","note":"一、修正第一項條文，因專科五年制前三年目前已有學費減免政策，為完整技職人才之培育體系，爰增訂五年制後二年（大專階段）之學生，其家庭所得五等分位屬於最低百分之二十之經濟弱勢者，免納學費，縮減受教機會落差。\n二、修正第四項條文，為減輕青年初入職場之經濟壓力，明定就學貸款之利息改由中央主管機關編列預算全額補助，排除家庭年所得級距之限制，建構技職青年求學支持政策。\n三、第二項、第三項及第五項條文未修正。"}],"changed":true,"final":"專科學校五年制前三年學生，符合一定條件者，免納學費。但未具有中華民國國籍、重讀同一教育階段者，不適用之。\n就讀專科學校五年制後二年及二年制之經濟不利處境學生，經政府參考其家庭所得五等分最低百分之二十及其他財政查調等經濟情形後，免納學費。但未具有中華民國國籍及戶籍者，不適用之。\n前二項免納之學費或政府提供經濟不利處境學生之助學措施，由教育部編列預算補助學生。公立專科學校學生，由各校於註冊時逕免繳納；私立專科學校學生，由各校於註冊時免予繳納後，造具清冊函報教育部請撥經費，其條件、額度、權利義務及其他應遵行事項之辦法，由教育部定之。\n除第一項及第二項免納學費規定外，專科學校得向學生收取費用；其免納學費之一定條件與補助、收費項目、用途、數額、減免、退費及其他相關事項之辦法，由教育部定之。\n政府為協助學生就讀專科學校，應辦理學生就學貸款；貸款項目包括學雜費、實習費、書籍費、住宿費、生活費、學生團體保險費、電腦及網路通訊使用費及海外研修費等相關費用；其貸款條件、額度、權利義務、還款協助措施及其他應遵行事項之辦法，由教育部定之。\n專科學校違反第一項或第三項所定辦法規定向學生收取費用者，依下列規定辦理：\n一、公立學校：由學校核予相關人員行政懲處；教育部、直轄市政府得扣減補助款或招生名額，並令其限期改善；屆期未改善者，得按次處罰至改善為止。\n二、私立學校：依私立學校法第五十五條規定辦理。","finalWhy":"一、配合大學法修正，針對家庭所得五等分最低百分之二十及其他財政查調等經濟情形，免繳納學費，爰增訂第二項，對具有中華民國國籍及戶籍之專科學校五年制後二年與二年制經濟不利處境學生，比照享有免學費。\n二、原第二項條次遞移至第三項，並授權教育部訂定免之學費及提供助學措施之經費來源、請撥方式及其他應遵行事項之辦法。\n三、原第三項條次遞移至第四項，並配合修正文字。\n四、為使規範更加明確並符合學生實際貸款需求，爰修正第五項，增訂「電腦及網路通訊使用費」，並明定政府提供還款協助措施，減輕貸款人還款之壓力，以資明確。\n五、原第五項條次遞移至第六項。","review":{"note":"保留，送院會處理","text":""}},{"no":"第四十九條","current":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。","versions":[{"bill":"202110218150000","text":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。\n中華民國○年○月○日修正之第四十四條第四項及第五項自公布日施行。","note":"考量本次修正第四十四條第四項係擴充貸款項目並增訂還款協助措施，第五項則為新增經濟不利處境學生助學規定，均屬保障學生權益及強化支持措施之重要制度，具即時施行之必要性。爰增訂第二項，明定本次修正條文自公布日施行，以利政策儘速落實，及早發揮減輕學生負擔與保障受教權之效果。"},{"bill":"202110217950000","text":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。\n中華民國○年○月○日修正之第四十四條第四項及第五項自公布日施行。","note":"一、增訂第二項。\n二、本次修法的施行日期是自本法公布日時施行。"},{"bill":"202110218290000","text":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。\n中華民國○年○月○日修正之第四十四條第四項及第五項自公布日施行。","note":"本次修正之第四十四條第四項及第五項自公布日施行。"},{"bill":"202110218230000","text":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。\n中華民國○年○月○日修正之第四十四條第四項及第五項自公布日施行。","note":"考量第四十四條第四項增訂就學貸款項目及還款協助措施，並增訂第五項政府應提供經濟不利處境學生助學措施等規定，爰本條增訂第二項，明定本次修正之第四十四條第四項及第五項條文自公布日施行。"},{"bill":"202110218310000","text":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。\n中華民國○年○月○日修正之第四十四條第四項及第五項自公布日施行。","note":"考量第四十四條第四項增訂就學貸款項目及還款協助措施，並增訂第五項政府應提供經濟不利處境學生助學措施等規定，爰本條增訂第二項，明定本次修正之第四十四條第四項及第五項條文自公布日施行。"},{"bill":"202110218820000","text":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。\n中華民國○年○月○日修正之第四十四條第四項及第五項自公布日施行。","note":"考量第四十四條第四項增訂就學貸款項目及還款協助措施，並增訂第五項政府應提供經濟不利處境學生助學措施等規定，爰本條增訂第二項，明定本次修正之第四十四條第四項及第五項條文自公布日施行。"},{"bill":"202110220000000","text":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。\n中華民國○年○月○日修正之第四十四條第四項及第五項自公布日施行。","note":"明定本次修正之第四十四條第四項及第五項條文自公布日施行。"},{"bill":"202110219520000","text":"本法除第四十四條自中華民國一百零三年八月一日施行外，自公布日施行。\n中華民國○年○月○日修正之第四十四條第四項至第六項，自公布日施行。","note":"本次修正之第四十四條第四項至第六項自公布日施行。"},{"bill":"202110218710000","text":"本法除第四十四條自中華民國一百零 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

/* ---------- 歷程與逐字稿 ---------- */
const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
const PARTY = D.parties || {};
const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));
  return p;
}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = el('div', {class: 'toast', role: 'status', text: msg});
  document.body.append(t); setTimeout(() => t.remove(), 4500);
}
function copyHere(id) {
  const url = location.href.split('#')[0] + '#' + id;
  const ok = () => toast('已複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言，可以往前往後讀。');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, () => prompt('複製這個連結', url));
  else prompt('複製這個連結', url);
  history.replaceState(null, '', '#' + id);
}
function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {
  box.textContent = '';

  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      const pa = PARTY[normName(t.s)];
      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});
      d.dataset.fp = fp(t.s + '|' + (t.b.find(x => typeof x === 'string') || '').slice(0, 30));

        const p = b.bill && propById[b.bill];
        if (p && p.arts.length) {
          const btn = el('button', {type: 'button', class: 'chip', text: ENACT ? '看這個提案的條文' : '看這個提案和現行條文的對照'});
          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));
          into.append(el('div', {class: 'readnote'}, btn));
        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));

  });

  const chips = el('div', {class: 'chips'});

  idx.append(chips);
  box.append(idx, finder(turns), turns);
}

    '這是法案通過與否最關鍵、辯論最激烈的階段。',

    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
Object.assign(READING, {
  '復議': {t: '復議', sub: '要求把已經表決的案子重新討論', what: '議案表決之後，當初投贊成的一方可以提出復議，要求重新討論、重新表決。', pts: [
    '復議被否決之後，同一個案子不能再提復議，決議就此確定。',
    '實務上常見多數方自己提出復議、再自己否決，目的是讓剛通過的條文確定下來。']},
  '重付表決': {t: '重付表決', sub: '對表決結果有異議，再表決一次', what: '出席委員對表決結果有異議時，經 15 人以上連署或附議，可以要求重新表決。', pts: ['以一次為限。']},
  '修正動議': {t: '修正動議', sub: '在院會對條文提出的修改案', what: '委員或黨團在二讀（或三讀）時，對討論中的條文提出另一個版本的文字，交院會表決。', pts: ['需要 10 人以上連署或附議。']},
  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
