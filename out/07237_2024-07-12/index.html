110014110000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知無法送達時，得以公告方式為之。\n調查機關（構）、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人，遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償條件、補償基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，參酌《區域計畫法》第十四條、《都市計畫法》第二十九條及《野生動物保育法》第十二條等，明定主管機關或受託機關（構）、團體必要時得派員進入公、私有土地、處所或海域進行調查。"},{"bill":"202110017340000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十二條及第十三條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110017770000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第八條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第九條第三項，應經審議會審議之規定。"},{"bill":"202110018570000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，進行調查或實施各項保育措施，應恪遵正當法律程序，以符合比例原則之方式為之，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人、漁業人、漁業從業人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110018550000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知無法送達時，得以公告方式為之。\n調查機關（構）、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人，遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償條件、補償基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110024910000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110025230000","text":"海洋庇護區之緩衝區內，禁止從事下列行為：\n一、水產養殖。\n二、營利性採捕海洋生物。\n三、破壞性漁撈。\n四、開挖、濬深航道或施作海洋工程。\n五、鋪設電纜、管道、設施或結構。\n六、從事探礦或採礦。\n七、排放有害物質。\n八、其他經中央主管機關公告禁止行為。\n前項第一款及第二款所列禁止行為，得依最佳可得科學資訊，考量生態系統途徑、累積效應，並出具生態補償及友善開發生態資料，經主管機關會同漁業主管機關許可者，不在此限；同項第四款至第八款所列禁止行為，經中央主管機關會同目的事業主管機關許可者，不在此限。\n前項之許可，經許可者應主動提供相關監測資料，主管機關應定期監測海域開放利用之情形，並公開相關資訊，如造成海域生態之具體危害，或可預見有危害之發生，必要時，主管機關應強制禁止該許可行為，或得廢棄該許可。\n第一項之水產養殖、營利性採捕海洋生物之處分，得由中央主管機關會同漁業主管機關公告一定種類、數量、方式、範圍或期間等條件代之。\n第一項所稱之破壞性漁撈項目及類型，由中央主管機關會同漁業主管機關公告之。","note":"一、緩衝區除用以隔離外界與核心區，用以減少外在環境對核心區之影響，亦有可能具有高度價值爰第一項明定禁止從事之行為。\n二、我國海洋基本法第十三條規定：「政府應本生態系統為基礎之方法，優先保護自然海岸、景觀、重要海洋生物棲息地、特殊與瀕危物種、脆弱敏感區域、水下文化資產等，保全海洋生物多樣性，訂定相關保存、保育、保護政策與計畫，採取衝擊減輕措施、生態補償或其他開發替代方案，劃設海洋保護區，致力復原海洋生態系統及自然關聯脈絡，並保障原有海域使用者權益。」，爰規定緩衝區內經主管機關許可，仍基於不影響保護目標下，得從事一定必要之活動，包括水產養殖、營利性採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為，爰以第二項明定開發前提。\n三、為確保海洋資源利用符合永續原則，經許可應主動提供相關資料，作為科學研究，另數據之使用應符合個人資料保護法相關使用原則。\n四、第四項及第五項明定有關主管機關許可水產養殖、營利性採捕海洋生物、破壞性漁撈之定義及處分，得以公告代之，俾利實務運作。\n五、限定例外許可須檢具合理之生態補償措施及配套機制，始得報請中央主管機關及目的事業主管機關許可，又許可後若致生危害之虞，主管機關得變更、廢棄許可。"},{"bill":"202110027040000","text":"原住民族基於其傳統文化、祭儀或自用需要，於海洋庇護區內，有採捕或利用海洋生物之必要者，不受第十一條至第十二條之限制。\n前項採捕或利用海洋生物之物種、數量、期間、核准程序，由主管機關會同原住民族主管機關及漁業主管機關定之。","note":"一、為平衡相關保育措施對於原住民族傳統文化、祭典之尊重及海洋保育，參酌原住民族基本法第十九條規定意旨，第一項規定於緩衝區與永續利用區內有例外規定。\n二、有關採補或利用海洋生物之種類、數量或期間，須經主管機關核准，使得為之。"},{"bill":"202110027520000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110032170000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110033380000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110033420000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"}],"changed":true,"final":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第八條第二項規定。","finalWhy":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第六條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。例如休閒採捕海洋生物，可針對其使用採捕方法、採捕物種、體長、數量之限制、禁止或其他應遵行事項，予以公告，以保育海洋生物資源。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第八條第二項應經審議會審議之規定。","review":{"note":"修正通過","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，進行調查或實施各項保育措施，應恪遵正當法律程序，以符合比例原則之方式為之，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第十五條","current":null,"versions":[{"bill":"201110005120000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110006490000","text":"海洋庇護區之永續發展區內，原則禁止從事下列行為：\n一、破壞性漁撈。\n二、開挖、濬深航道或施作海洋工程。\n三、鋪設電纜、管道、設施或結構。\n四、從事探礦或採礦。\n五、其他經中央主管機關公告禁止行為。\n前項第二款至第五款所列禁止行為，經中央主管機關會同目的事業主管機關許可者，不在此限。\n前項之許可，主管機關應定期監測海域開放利用之情形，如造成海域生態之具體危害，或可預見有危害之發生，必要時，主管機關應強制禁止該許可行為，或得廢止該許可。\n第一項所稱之破壞性漁撈項目及類型，由中央主管機關會同漁業主管機關公告之。","note":"一、海域之永續發展並非僅以特定海域為之，應以全體公民生存發展為目標，盡可能擴大劃設。\n二、為維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆，區域內容許較大限度之環境開發活動。惟可能具有環境永久負面影響之開發行為仍應由中央主管機關許可，始得為之。"},{"bill":"202110010660000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110012210000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110012640000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、第一項明定主管機關得指派海洋保育觀察員，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n二、第二項明定，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得不得規避、妨礙或拒絕海洋保育觀察員之觀察、監測及蒐集資料等任務。\n三、第三項明定海洋保育觀察員執行任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項授權主管機關訂定觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法。"},{"bill":"202110013050000","text":"海洋庇護區之永續發展區內，原則禁止從事下列行為：\n一、破壞性漁撈。\n二、開挖、濬深航道或施作海洋工程。\n三、鋪設電纜、管道、設施或結構。\n四、從事探礦或採礦。\n五、其他經中央主管機關公告禁止行為。\n前項第二款至第五款所列禁止行為，經中央主管機關會同目的事業主管機關許可者，不在此限。\n前項之許可，主管機關應定期監測海域開放利用之情形，如造成海域生態之具體危害，或可預見有危害之發生，必要時，主管機關應強制禁止該許可行為，或得廢棄該許可。\n第一項所稱之破壞性漁撈項目及類型，由中央主管機關會同漁業主管機關公告之。","note":"一、海域之永續發展並非僅以特定海域為之，應以全體公民生存發展為目標，盡可能擴大劃設。\n二、為維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展，對於人為活動之限制，相對於緩衝區較為寬鬆，區域內容許較大限度之環境開發活動，就可能具有環境永久負面影響之開發行為仍應由中央主管機關許可，始得為之。"},{"bill":"202110014110000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、第一項明定主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項明定船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、第三項明定得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供海洋保育觀察員執行任務之往返交通工具。\n四、第四項明定海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110017340000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第九條第二項應經審議會審議之規定。"},{"bill":"202110017770000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110018570000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110018550000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110024910000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110025230000","text":"海洋庇護區之永續發展區內，原則禁止從事下列行為：\n一、破壞性漁撈。\n二、開挖、濬深航道或施作海洋工程。\n三、鋪設電纜、管道、設施或結構。\n四、從事探礦或採礦。\n五、其他經中央主管機關公告禁止行為。\n前項第二款至第五款所列禁止行為，經中央主管機關會同目的事業主管機關許可者，不在此限。\n前項之許可，主管機關應定期監測海域開放利用之情形，如造成海域生態之具體危害，或可預見有危害之發生，必要時，主管機關應強制禁止該許可行為，或得廢棄該許可。\n第一項所稱之破壞性漁撈項目及類型，由中央主管機關會同漁業主管機關公告之。","note":"一、海域之永續發展並非僅以特定海域為之，應以全體公民生存發展為目標，儘可能擴大劃設。\n二、我國海洋基本法第十三條規定：「政府應本生態系統為基礎之方法，優先保護自然海岸、景觀、重要海洋生物棲息地、特殊與瀕危物種、脆弱敏感區域、水下文化資產等，保全海洋生物多樣性，訂定相關保存、保育、保護政策與計畫，採取衝擊減輕措施、生態補償或其他開發替代方案，劃設海洋保護區，致力復原海洋生態系統及自然關聯脈絡，並保障原有海域使用者權益。」為維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展，對於人為活動之限制，相對於緩衝區較為寬鬆，區域內容許較大限度之環境開發活動。惟可能具有環境永久負面影響之開發行為仍應由中央主管機關許可，始得為之。"},{"bill":"202110027040000","text":"為保育海洋生物，主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或應遵行事項。\n二、船舶海上航行、活動、作業之限制、禁止或應遵行事項。\n三、於海洋使用採捕器具、方法、區域及時間之限制、禁止或應遵行事項。\n四、生物放流之限制、禁止或應遵行事項。\n五、其他人為活動之限制、禁止或應遵行事項。\n前項公告，主管機關應於三十日前預告，並應登載於政府公報、新聞紙及網際網路，或以其他適當方法廣泛周知；並得依職權或人民申請，提供利害關係人陳述意見機會，必要時，得舉行公聽會。\n直轄市、縣（市）主管機關於其海洋資源區，為第一項規定之公告者，應報請中央主管機關核定後為之。","note":"一、海洋遊憩、休閒、船舶航行，及於海洋使用採捕器具等人為活動均可能影響海洋生物，為使中央或地方主管機關得因地制宜，加強保育海洋生物，爰於第一項明定主管機關得公告相關限制、禁止或應遵行事項。另為避免發生與其他機關管轄權限競合或衝突，公告前必須會商其他中央或地方目的事業主管機關，如交通部、農業部漁業署、國防部等，以利海洋生物保育措施之順利推動。\n二、第二項規定主管機關公告前，對於一定範圍內之漁業活動、休閒產業等人類活動造成一定限制，要求主管機關踐行相關預告程序及其例外規定，並要求主管機關須具體回覆人民之意見，以減少事後紛爭，裨益政策推動。\n三、第三項參考漁業法第四十四條規定，明定直轄市、縣（市）主管機關辦理公告之程序。"},{"bill":"202110027520000","text":"為保育海洋生物，中央主管機關應會同原住民族中央主管機關及其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，因此，要求中央主管機關必須會同原住民族中央主管機關及其他目的事業主管機關，才能依據現況做最適宜的調整。以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"},{"bill":"202110032170000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110033380000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110033420000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"}],"changed":true,"final":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，進行調查或實施各項保育措施，應恪遵正當法律程序，以符合比例原則之方式為之，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"一、為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。\n二、另為提醒行政調查之機關（構）、法人、團體或保育人員，爰於第四項定明調查或實施各項保育措施時，應恪遵正當法律程序，以符合比例原則之方式為之。","review":{"note":"照行政院提案通過","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第十六條","current":null,"versions":[{"bill":"201110005120000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110006490000","text":"主管機關應考量國際一般性建議標準、海洋使用累積效應及生態系統途徑，使海洋庇護區生態系統維持最高持續生產產量之水準，訂定前條所定之許可條件、作業程序、擬定相關監測等配套措施及其他應遵行事項之辦法及收費標準。\n海洋庇護區內經中央主關機關許可的例外開發行為，開發商應擬定生態補償計畫、並進行環境、社會、文化影響評估，經主管機關核可後始得進行。","note":"一、基於法律保留原則，第十一條及第十二條所定海洋庇護區之緩衝區或永續發展區之許可條件、作業程序及其他應遵行事項之辦法及收費標準，授權中央主管機關訂定之。\n二、相關規範參考「野生動物保育法」及「環境影響評估法」訂定。"},{"bill":"202110010660000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110012210000","text":"執法人員、民眾或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110012640000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"本條明定參與或協助取締、舉發本法違法事件者，得予以獎勵，其獎勵辦法授權主管機關定之。"},{"bill":"202110013050000","text":"主管機關應考量國際一般性建議標準、海洋使用累積效應及生態系統途徑，使海洋庇護區生態系統維持最高持續生產產量之水準，訂定前條所定之許可條件、作業程序、擬定相關監測等配套措施及其他應遵行事項之辦法及收費標準。\n海洋庇護區內經中央主管機關許可的例外開發行為，開發商應擬定生態補償計畫、並進行環境、社會、文化影響評估，經主管機關核可後始得進行。","note":"參酌「野生動物保育法」第八條第二項、第三項、「環境影響評估法」第七條、第八條。基於法律保留原則，並為符合規費法第十條規定，本法第十一條及第十二條所定海洋庇護區之緩衝區或永續發展區之許可條件、作業程序及其他應遵行事項之辦法及收費標準，授權中央主管機關訂定之。"},{"bill":"202110014110000","text":"執法人員、民眾或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"一、第一項明定主管機關得予執法人員、民眾或團體主動參與或協助主管機關取締、舉發違法事件之獎勵。\n二、第二項定明主管機關之保密義務。\n三、第三項明定獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110017340000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110017770000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110018570000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110018550000","text":"執法人員、民眾或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110024910000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110025230000","text":"主管機關應考量國際一般性建議標準、海洋使用累積效應及生態系統途徑，使海洋庇護區生態系統維持最高持續生產產量之水準，訂定前條所定之許可條件、作業程序、擬定相關監測等配套措施及其他應遵行事項之辦法及收費標準。\n海洋庇護區內經中央主管機關許可的例外開發行為，開發商應擬定生態補償計畫、並進行環境、社會、文化影響評估，經主管機關核可後始得進行。","note":"一、基於法律保留原則，並為符合規費法第十條規定，本法第十一條及第十二條所定海洋庇護區之緩衝區或永續發展區之許可條件、作業程序及其他應遵行事項之辦法及收費標準，授權中央主管機關訂定之。\n二、相關規範參考「野生動物保育法」第八條第二項、第三項、「環境影響評估法」第七條、第八條。\n三、海洋或海岸之開發行為環境、社會、文化影響評估，應納入生態系變化所造成的碳匯變化成本，做為考慮開發案的因素之一。"},{"bill":"202110027040000","text":"為執行海洋生物資源調查、實施海洋庇護區保育計畫或因應海洋保育有關之緊急情況，主管機關或受託機關、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施。\n公、私有土地所有人、使用人或管理人，或海域之使用人與管理人，除涉及軍事機密者，應會同該管軍事機關為之外，不得規避、拒絕或妨礙。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地所有人、使用人或管理人；通知無法送達時，得以公告方式為之。\n調查機關或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地所有人、使用人或海域之使用人，遭受特別犧牲受有損失者，應予補償。補償金額依協議為之；協議不成，報請上級主管機關核定之。\n進行第一項調查或實施各項保育措施之辦法，由中央主管機關定之。","note":"為調查全國海洋生物資源現況或實施海洋庇護區保育計畫，主管機關或受託機關、團體必要時得派員進入公、私有土地、處所或海域進行調查，爰參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條及都市計畫法第二十九條等規定，以為規範。"},{"bill":"202110027520000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110032170000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110033380000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110033420000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"}],"changed":true,"final":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。","review":{"note":"照行政院提案通過","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第十七條","current":null,"versions":[{"bill":"201110005120000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110006490000","text":"為保育海洋生物，主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或應遵行事項。\n二、船舶海上航行、活動、作業之限制、禁止或應遵行事項。\n三、於海洋使用採捕器具、方法、區域及時間之限制、禁止或應遵行事項。\n四、生物放流之限制、禁止或應遵行事項。\n五、其他人為活動之限制、禁止或應遵行事項。\n主管機關依前項規定公告前，應踐行預告程序。但有急迫情事，非立即公告海洋生物保育事項，將發生難以回復之損害者，不在此限。\n預告期間內，主管機關得依職權或依申請，給予利害關係人或團體陳述意見之機會，主管機關應具體回覆。涉及多數不同利益之人或多數不同行政機關權限者，應經公開及聽證程序。\n直轄市、縣（市）主管機關於其海洋資源區，為第一項規定之公告者，應報請中央主管機關核定後為之。","note":"一、為使中央或地方主管機關得因地制宜，加強保育海洋生物，爰於第一項明定主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前必須會商其他中央或地方目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、第一項三款除器具外，亦須規範方法、區域及時間等限制，方能完善海洋生態保育。\n三、第二項規定主管機關公告前，應踐行預告程序及其例外規定，並要求主管機關須具提回覆人民之意見。\n四、為擴大人民參與海洋生物保育，第三項規定預告期間內，主管機關給予利害關係人或團體陳述意見之機會，涉及複雜情況時，應有公開及聽證程序，以符合程序正義。\n五、第四項參照漁業法，明定直轄市、縣（市）主管機關辦理公告之程序。"},{"bill":"202110010660000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110012210000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110012640000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"本條明定主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110013050000","text":"為保育海洋生物，主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或應遵行事項。\n二、船舶海上航行、活動、作業之限制、禁止或應遵行事項。\n三、於海洋使用採捕器具、方法、區域及時間之限制、禁止或應遵行事項。\n四、生物放流之限制、禁止或應遵行事項。\n五、其他人為活動之限制、禁止或應遵行事項。\n主管機關依前項規定公告前，應踐行預告程序。但有急迫情事，非立即公告海洋生物保育事項，將發生難以回復之損害者，不在此限。\n預告期間內，主管機關得依職權或依申請，給予利害關係人或團體陳述意見之機會，主管機關應具體回覆。涉及多數不同利益之人或多數不同行政機關權限者，應經公開及聽證程序。\n直轄市、縣（市）主管機關於其海洋資源區，為第一項規定之公告者，應報請中央主管機關核定後為之。","note":"一、海洋遊憩、休閒、船舶航行，及於海洋使用採捕器具等人為活動均可能影響海洋生物，為使中央或地方主管機關得因地制宜，加強保育海洋生物，爰於第一項明定主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前必須會商其他中央或地方目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、第一項三款除器具外，也須規範方法、區域及時間等限制，方能完善保育海洋生態之目的。\n三、第二項規定主管機關公告前，應踐行預告程序及其例外規定，並要求主管機關須具提回覆人民之意見。\n四、為擴大人民參與海洋生物保育，第三項規定預告期間內，主管機關給予利害關係人或團體陳述意見之機會，涉及複雜情況時，應有公開及聽證程序，以符合程序正義原則。\n五、第四項參照漁業法第四十四條規定體例，明定直轄市、縣（市）主管機關辦理公告之程序。"},{"bill":"202110014110000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"明定主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110017340000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110017770000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110018570000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110018550000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110024910000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110025230000","text":"為保育海洋生物，主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或應遵行事項。\n二、船舶海上航行、活動、作業之限制、禁止或應遵行事項。\n三、於海洋採捕，所使用器具、方法、區域及時間之限制、禁止或應遵行事項。\n四、生物放流之限制、禁止或應遵行事項。\n五、其他人為活動之限制、禁止事項。\n主管機關依前項規定公告前，應踐行預告程序。倘具急迫性，非立即公告海洋生物保育事項，將發生難以回復之損害者，不在此限。\n預告期間內，主管機關得依職權或依申請，給予利害關係人或團體陳述意見之機會，主管機關應具體回覆。涉及多數不同利益之人或多數不同行政機關權限者，應經公開及聽證程序。\n直轄市、縣（市）主管機關於其海洋資源區，為第一項規定之公告者，應報請中央主管機關核定後為之。","note":"一、海洋遊憩、休閒、船舶航行，及於海洋使用採捕器具等人為活動均可能影響海洋生物，為使中央或地方主管機關得因地制宜，加強保育海洋生物，爰於第一項明定主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前必須會商其他中央或地方目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、第一項第三款除器具外，也須規範方法、區域及時間等限制，方能完善保育海洋生態之目的。\n三、第二項規定主管機關公告前，應踐行預告程序及其例外規定，並要求主管機關須具提回覆人民之意見。\n四、為擴大人民參與海洋生物保育，第三項規定預告期間內，主管機關給予利害關係人或團體陳述意見之機會，涉及複雜情況時，應有公開及聽證程序，以符合程序正義原則。\n五、第四項參照漁業法第四十四條規定體例，明定直轄市、縣（市）主管機關辦理公告之程序。"},{"bill":"202110027040000","text":"主管機關、受託機關或團體得設置海洋保育觀察員，指派在船舶、海洋設施、海洋工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項船舶、海洋設施或海洋工程之所有人、使用人或管理人，除涉及軍事機密者，應會同軍事機關為之外，不得規避、拒絕或妨礙。\n海洋保育觀察員執行觀察、監測及蒐集資料時，得由船舶、海洋設施、海洋工程之所有人、使用人提供往返交通工具。\n本條海洋保育觀察員之資格取得與管理辦法，由中央主管機關定之。","note":"一、保育海洋生物，第一項明定主管機關或受託機關、團體得設置海洋保育觀察員，以及其工作項目。\n二、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰第三項明定得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n三、第四項明定海洋保育觀察員資格之取得與管理辦法授權主管機關定之。"},{"bill":"202110027520000","text":"主管機關得指派海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前項情形，船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、妨礙或拒絕。\n海洋保育觀察員執行觀察、監測及蒐集資料等任務時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育觀察員之資格取得、訓練、管理、廢止資格及其他相關事項之辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項定明主管機關得指派海洋保育觀察員，以及其工作項目；必要時，並得請求海岸巡防機關或警察機關協助。\n二、第二項定明船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、妨礙或拒絕。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰於第三項定明得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項定明海洋保育觀察員資格取得、訓練、管理、廢止資格及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110032170000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110033380000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110033420000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"}],"changed":true,"final":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。","review":{"note":"照行政院提案通過","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。"}},{"no":"第十八條","current":null,"versions":[{"bill":"201110005120000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110006490000","text":"為執行海洋生物資源調查、海洋庇護區保育計畫或因應海洋保育有關之緊急情況，主管機關或受託機關、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施。\n公、私有土地所有人、使用人或管理人，或海域之使用人與管理人，除涉及軍事機密者，應會同該管軍事機關為之外，不得規避、拒絕或妨礙。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地所有人、使用人或管理人；通知無法送達時，得以公告方式為之。\n調查機關或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地所有人、使用人或海域之使用人，遭受特別犧牲受有損失者，應予補償。補償金額依協議為之；協議不成，報請上級主管機關核定之。\n進行第一項調查或實施各項保育措施之辦法，由中央主管機關定之。","note":"參考日本海洋生物資源保存及管理法、我國區域計畫法及都市計畫法，訂定第十八條規範為調查全國海洋生物資源現況或實施海洋庇護區保育計畫，主管機關或受託機關、團體必要時得派員進入公、私有土地、處所或海域進行調查。"},{"bill":"202110010660000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110012210000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110012640000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"本條明定主管機關得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助，以促進海洋保育、海洋生物多樣性保護及永續利用。"},{"bill":"202110013050000","text":"為執行海洋生物資源調查、海洋庇護區保育計畫或因應海洋保育有關之緊急情況，主管機關或受託機關、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施。\n公、私有土地所有人、使用人或管理人，或海域之使用人與管理人，除涉及軍事機密者，應會同該管軍事機關為之外，不得規避、拒絕或妨礙。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地所有人、使用人或管理人；通知無法送達時，得以公告方式為之。\n調查機關或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地所有人、使用人或海域之使用人，遭受特別犧牲受有損失者，應予補償。補償金額依協議為之；協議不成，報請上級主管機關核定之。\n進行第一項調查或實施各項保育措施之辦法，由中央主管機關定之。","note":"為調查全國海洋生物資源現況或實施海洋庇護區保育計畫，主管機關或受託機關、團體必要時得派員進入公、私有土地、處所或海域進行調查，爰參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條及都市計畫法第二十九條等規定，以為規範。"},{"bill":"202110014110000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"明定為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110017340000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110017770000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110018570000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110018550000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110024910000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110025230000","text":"開發及觀光行為，對海洋保育類動植物不得有騷擾，中斷遷徙、培育、繁殖，或餵養等行為，相關辦法由中央主管機關定之。\n中央主管機關應定期調查海洋保育類動植物，並制定保育、復育計畫。\n海洋保育類動植物之緊急搶救、復育及相關運送事務，得由中央主管機關委託學術團體或民間專業團體協助辦理。","note":"一、美國已有《瀕危物種法》《海洋哺乳類動物保護法》，明定對海洋瀕危物種及海洋哺乳類動物之特別保護。\n二、近年海岸及海域開發行為眾多、觀賞鯨豚、海龜等保育類動物之觀光活動盛行，卻可能造成騷擾，特要求中央主管機關訂定相關辦法。\n三、我國海洋基本法第十三條規定：「政府應本生態系統為基礎之方法、優先保護自然海岸、景觀、重要海洋生物棲息地、特殊與瀕危物種、脆弱敏感區域、水下文化資產等，保全海洋生物多樣性……致力復原海洋生態系統及自然關聯脈絡」爰明定對海洋保育類動物之特別保護。\n四、我國極度瀕危物種台灣白海豚，為少數近岸型鯨豚，生活在水深不超過30公尺、離岸5公里內海域，極易受海岸漁場、風場等開發影響，目前僅剩約70隻。2008年8月國際自然保育聯盟（IUCN）就率先將台灣白海豚列為瀕危物種、2018年美國國家海洋暨大氣總署（NOAA），也正式將台灣白海豚列為瀕危物種法（ESA）中的瀕危物種。為我國海洋瀕危物種指標案例。\n五、近年時有虐待綠蠵龜、白海豚等瀕危物種之事件發生，為增進救援時效性，爰引進民間量能，規定搶救、復育及運送事務，得由中央主管機關委託學術團體或民間專業團體協助辦理。\n六、農委會主管之《野生動物保育法》第十六條已規定：「保育類野生動物，除本法或其他法令另有規定外，不得騷擾、虐待、獵捕、宰殺、買賣、陳列、展示、持有、輸入、輸出或飼養、繁殖。」然因「騷擾」定義不清，常造成實際執法困難及主管機關不作為，爰要求主管機關明定相關辦法，應明確化騷擾等定義，並定期公告處罰案件。"},{"bill":"202110027040000","text":"執法人員、民眾或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予以獎勵。\n前項獎勵辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾或團體主動參與或協助主管機關取締、舉發違法事件，爰依行政程序法第一百五十條規定，於第一項明定，並於第二項明定獎勵辦法授權由中央主管機關定之。"},{"bill":"202110027520000","text":"執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發本法違法事件者，主管機關得予獎勵。\n主管機關對於前項主動參與或協助主管機關取締、舉發之人身分應予保密。\n第一項獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾、法人或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項定明主管機關得予獎勵；第二項定明主管機關之保密義務；另第三項定明獎勵對象、基準、範圍及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110032170000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110033380000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110033420000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"}],"changed":true,"final":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","finalWhy":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。","review":{"note":"修正通過","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民、民間團體、原住民各族參與國際交流活動，給予獎勵或補助。"}},{"no":"第十九條","current":null,"versions":[{"bill":"201110005120000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110006490000","text":"主管機關應設立海洋保育警察，負責海洋保育執法業務。並得設立海洋保育巡查員，協助辦理監測、調查及其他海洋保育相關業務。\n主管機關得指派具一定資格之海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前二項船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、拒絕或妨礙。\n海洋保育觀察員執行觀察、監測及蒐集資料時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育巡查員及第二項海洋保育觀察員之資格取得與管理辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項明定主管機關應設立海洋保育警察，並得指派海洋保育巡查員、海洋保育觀察員，以及其工作項目。\n二、第二項明定船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、拒絕或妨礙。\n三、由於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰第三項明定得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項明定海洋保育觀察員資格之取得與管理辦法授權由主管機關定之。\n五、本法主管機關海洋委員會下轄海巡機關具備執法權限，應基於海洋保育執法目標創設或規劃海洋保育警察組別，方能加強保育相關執法之專業及力度。\n六、海洋保育署已有海洋保育巡查員，創設海洋保育巡查員符合依法行政之目的。"},{"bill":"202110010660000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110012210000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110012640000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、第一項明定明定為執行海洋生物復育，主管機關或中央目的事業主管機關得自行或委託其他機關（構）、法人或團體，執行各款之措施。\n二、第二項明定第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施，應經主管機關同意。\n三、第三項授權中央主管機關會商目的事業主管機關訂定海洋生物復育措施辦理原則。"},{"bill":"202110013050000","text":"主管機關應設立海洋保育警察，負責海洋保育執法業務。並得設立海洋保育巡查員，協助辦理監測、調查及其他海洋保育相關業務。\n主管機關得指派具一定資格之海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前二項船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、拒絕或妨礙。\n海洋保育觀察員執行觀察、監測及蒐集資料時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育巡查員及第二項海洋保育觀察員之資格取得與管理辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項明定主管機關應設立海洋保育警察，並得指派海洋保育巡查員、海洋保育觀察員，以及其工作項目。\n二、第二項明定船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、拒絕或妨礙。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰第三項明定得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第四項明定海洋保育觀察員資格之取得與管理辦法授權由主管機關定之。\n五、本法主管機關海洋委員會下轄海巡機關具備執法權限，應基於海洋保育執法目標創設或規劃海洋保育警察組別（類似於警察體系之行政／交通／刑事等），方能加強保育相關執法之專業及力度，解決長久遭人詬病之執法效能。\n六、海洋保育署已有海洋保育巡查員，創設海洋保育巡查員符合依法行政之目的。"},{"bill":"202110014110000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、第一項明定主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、第二項明定第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、明定第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110017340000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110017770000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110018570000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人、漁會或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人、漁會或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人、漁會或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110018550000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110024910000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110025230000","text":"為執行海洋生物資源調查、海洋庇護區保育計畫或因應海洋保育有關之緊急情況，主管機關或受託機關、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施。\n公、私有土地所有人、使用人或管理人，或海域之使用人與管理人，除涉及軍事機密者，應會同該管軍事機關為之外，不得規避、拒絕或妨礙。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地所有人、使用人或管理人；通知無法送達時，得以公告方式為之。\n調查機關或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地所有人、使用人或海域之使用人，遭受特別犧牲之損失者，應予補償。補償金額依協議為之；協議不成，報請上級主管機關核定之。\n進行第一項調查或實施各項保育措施之辦法，由中央主管機關定之。","note":"為調查全國海洋生物資源現況或實施海洋庇護區保育計畫，主管機關或受託機關、團體必要時得派員進入公、私有土地、處所或海域進行調查，爰參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條及都市計畫法第二十九條等規定，以為規範。"},{"bill":"202110027040000","text":"主管機關為促進海洋保育、海洋生物多樣性保護、永續利用、相關知識人才培育，得對人民或團體參與國際交流活動、傳遞海洋知識等，給予獎勵或補助。\n前項獎勵或補助辦法，由中央主管機關定之。","note":"參酌聯合國生物多樣性公約第十三條、第十八條及日本生物多樣性基本法第二十三條、第二十四條、第二十六條有關生物多樣性教育推廣及國際交流與合作之規定，為鼓勵相關事項推動，授權主管機關訂定對於民間參與海洋保育、教育推廣、國際交流合作給予獎勵或補助。"},{"bill":"202110027520000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條有關生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110032170000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110033380000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110033420000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"}],"changed":true,"final":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民、民間團體、原住民各族參與國際交流活動，給予獎勵或補助。","finalWhy":"照委員提案修正通過。,,,","review":{"note":"修正通過","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人、漁會或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會同中央漁業主管機關定之。"}},{"no":"第二十條","current":null,"versions":[{"bill":"201110005120000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110006490000","text":"執法人員、人民或團體主動參與或協助主管機關取締、舉發、或敘明事實或檢具證據資料檢舉本法違法事件者，主管機關得予以獎勵。\n前項獎勵辦法，由中央主管機關定之。","note":"為鼓勵執法人員、民眾或團體主動參與或協助主管機關取締、舉發違法事件，爰於第一項明定主管機關得予以獎勵，並於第二項明定獎勵辦法授權由中央主管機關定之。"},{"bill":"202110010660000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110012210000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110012640000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"本條明定未依本法規定進入核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。"},{"bill":"202110013050000","text":"執法人員、人民或團體主動參與或協助主管機關取締、舉發、或敘明事實或檢具證據資料檢舉本法違法事件者，主管機關得予以獎勵。\n前項獎勵辦法，由中央主管機關定之。","note":"一、為鼓勵執法人員、民眾或團體主動參與或協助主管機關取締、舉發違法事件，爰依行政程序法第一百五十條規定，於第一項明定，並於第二項明定獎勵辦法授權由中央主管機關定之。\n二、參考「溫室氣體減量及管理法」第二十七條、「空氣汙染防制法」第九十四條、「道路交通管理處罰條例」第九十一條、「野生動物保育法」第三十三(二)條。"},{"bill":"202110014110000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，明定違反第九條第一項規定，進入海洋庇護區之核心區者之罰則。"},{"bill":"202110017340000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110017770000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110018570000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣五萬元以上五十萬元以下罰鍰。\n漁業從業人誤入海洋庇護區之核心區者，且無重大違規情事，經勸導駛離者，不處罰。","note":"一、為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。\n二、漁業從業人長期於海上作業，海上無圍欄，可能誤入海洋庇護區之核心區，明定無重大違規情事，經勸導後駛離者，不處罰。"},{"bill":"202110018550000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110024910000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110025230000","text":"主管機關應設立海洋保育警察，負責海洋保育執法業務。並得設立海洋保育巡查員，協助辦理監測、調查及其他海洋保育相關業務。\n主管機關得指派具一定資格之海洋保育觀察員，在船舶、海洋設施、海域工程或其周圍，從事觀察、監測及蒐集資料等任務；必要時，得請求海岸巡防機關或警察機關協助。\n前兩項船舶、海洋設施或海域工程之所有人、使用人或管理人，不得規避、拒絕或妨礙。\n海洋保育觀察員執行觀察、監測及蒐集資料時，得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n第一項海洋保育警察、海洋保育巡查員及第二項海洋保育觀察員之任用、資格取得與管理辦法，由中央主管機關定之。","note":"一、為保育海洋生物，第一項、第二項明定主管機關應設立海洋保育警察，並得指派海洋保育巡查員、海洋保育觀察員，以及其工作項目。\n二、第三項明定船舶、海洋設施或海域工程之所有人、使用人或管理人對於海洋保育觀察員之觀察、監測及蒐集資料等行為，不得規避、拒絕或妨礙。\n三、囿於海上執行觀察、監測及蒐集資料困難，且水上交通工具取得不易，爰第四項明定得由船舶、海洋設施或海域工程之所有人、使用人或管理人提供往返交通工具。\n四、第五項明定海洋保育警察、海洋保育巡查員及海洋保育觀察員資格之取得與管理辦法授權由主管機關定之。\n五、本法主管機關海洋委員會下轄海巡機關具備執法權限，應基於海洋保育執法目標創設或規劃海洋保育警察組別（類似於警察體系之行政／交通／刑事等），方能加強保育相關執法之專業及力度，解決長久遭人詬病之執法效能。\n六、海洋保育署已有海洋保育巡查員，創設海洋保育巡查員符合依法行政之目的。\n七、海洋保育工作成功與否，在地社區合作至關重要，爰明定海洋保育警察、海洋保育巡查員及海洋保育觀察員，若符合專業知能、技能之一定資格後，應優先考量當地居民。另主管機關亦應加強當地居民專業技能培訓，提升當地居民專業知能，加強海洋保育工作與在地社區連結、增進當地人在地參與、創造在地工作機會，期與當地搭建巡守機制，裨益海保工作成效。"},{"bill":"202110027040000","text":"為執行海洋生物復育，各級主管機關或目的事業主管機關得依據國家海洋保育綱領或海洋庇護區保育計畫，提出下列復育措施，報請中央主管機關核定後實施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施及復育計畫。","note":"為執行海洋生態復育，明定主管機關進行復育措施時，應依據國家海洋保育綱領或海洋庇護區保育計畫，提出海洋復育計畫，並經中央主管機關核准、實施。"},{"bill":"202110027520000","text":"主管機關為促進海洋保育、海洋生物多樣性保護及永續利用，得自行或透過國際組織、原住民各族進行國際合作，並對人民、民間團體、原住民各族參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流及合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110032170000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣五十萬元以上二百五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110033380000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110033420000","text":"違反第九條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"}],"changed":true,"final":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人、漁會或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會同中央漁業主管機關定之。","finalWhy":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人、漁會或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，涉及漁業資源復育與管理，由中央主管機關會同中央漁業主管機關訂定，俾利管理。","review":{"note":"修正通過","text":"違反第十條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣五萬元以上五十萬元以下罰鍰。\n誤入海洋庇護區之核心區，經勸導駛離者，不罰。但其為最近二年內經勸導又再違反者，不在此限。"}},{"no":"第二十一條","current":null,"versions":[{"bill":"201110005120000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"},{"bill":"202110006490000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約及日本生物多樣性基本法等規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110010660000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"},{"bill":"202110012210000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項各款所定禁止行為者，處新臺幣十萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項各款所定禁止行為者，加以處罰。"},{"bill":"202110012640000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"本條明定未依本法規定於緩衝區內未經許可從事禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。"},{"bill":"202110013050000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條生物多樣性教育推廣等規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110014110000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項各款所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"明定違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項各款所定禁止行為者之罰則。"},{"bill":"202110017340000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，由中央主管機關會商中央目的事業主管機關訂定，俾利管理。"},{"bill":"202110017770000","text":"違反第十條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第十條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110018570000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣三萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"},{"bill":"202110018550000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項各款所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項各款所定禁止行為者，加以處罰。"},{"bill":"202110024910000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"},{"bill":"202110025230000","text":"執法人員、人民或團體主動參與或協助主管機關取締、舉發、或敘明事實或檢具證據資料檢舉本法違法事件者，主管機關得予以獎勵。\n主管機關對於前項主動參與或協助取締、舉發者應予以保密。\n前項獎勵辦法，由中央主管機關定之。","note":"一、為鼓勵執法人員、民眾或團體主動參與或協助主管機關取締、舉發違法事件，爰依行政程序法第一百五十條規定，於第一項明定，並於第二項明定獎勵辦法授權由中央主管機關定之。\n二、參考「溫室氣體減量及管理法」第二十七條、「空氣污染防制法」第九十四條、「道路交通管理處罰條例」第九十一條、「野生動物保育法」第二十二條。"},{"bill":"202110027040000","text":"人民或團體自行辦理復育措施前，應提出復育計畫，報請主管機關許可。\n前項人民或團體復育計畫之申請辦法，由中央主管機關定之。","note":"為有效整合民間復育海洋生態資源，且符合專業評估復育措施，明定民間團體自行辦理復育措施時，應提出復育計畫，並經主管機關許可後實施。"},{"bill":"202110027520000","text":"為執行海洋生物復育，主管機關或中央目的事業主管機關得依海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理下列復育措施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依前項海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。\n第一項海洋生物復育措施辦理原則，由中央主管機關會同原住民族中央主管機關及其他中央目的事業主管機關定之。","note":"一、為執行海洋生物復育，第一項定明主管機關或中央目的事業主管機關得依據海洋生物復育措施辦理原則，自行或委託其他機關（構）、法人或團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，第二項定明第一項以外之機關（構）、自然人、法人或團體自行辦理復育措施前，應依據海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。\n三、第一項所定海洋生物復育措施辦理原則，考量原住民族有上千年的海洋保育智慧。因此，會同原住民族中央主管機關以及中央目的事業主管機關訂定，俾利管理與符合現況。"},{"bill":"202110032170000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"},{"bill":"202110033380000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"},{"bill":"202110033420000","text":"違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"}],"changed":true,"final":"違反第十條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣五萬元以上五十萬元以下罰鍰。\n誤入海洋庇護區之核心區，經勸導駛離者，不罰。但其為最近二年內經勸導又再違反者，不在此限。","finalWhy":"一、為加強保護海洋庇護區之核心區，對於違反第十條第一項規定，進入海洋庇護區之核心區者，加以處罰，爰為第一項規定。\n二、考量海上界線認定不易，對於誤入海洋庇護區核心區者，如經勸導駛離者，不予處罰。但對於最近二年內經勸導後又再違反者，應予處罰，以達保護海洋庇護區核心區之目的，特於第二項定明。","review":{"note":"修正通過","text":"違反第十一條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣三萬元以上三十萬元以下罰鍰。但原住民基於傳統文化、祭儀、生活所需之利用的行為，不在此限。"}},{"no":"第二十二條","current":null,"versions":[{"bill":"201110005120000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110006490000","text":"主管機關為促進海洋保育、海洋生物多樣性保護和永續利用，得透過他國、國際官方或民間組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約及日本生物多樣性基本法之規定，鼓勵主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110010660000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110012210000","text":"有下列情形之一者，處新臺幣五萬元以上三十萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條各款所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條各款所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110012640000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"本條明定於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。或違反第十三條第一項之禁止事項，處新臺幣三萬元以上十五萬元以下罰鍰。"},{"bill":"202110013050000","text":"主管機關為促進海洋保育、海洋生物多樣性保護和永續利用，得透過他國、國際官方或民間組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。","note":"參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流與合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。"},{"bill":"202110014110000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條各款所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款明定於海洋庇護區之永續利用區內，未經許可從事第十一條各款所定禁止行為者之罰則。\n二、第二款明定違反第十三條第一項公告事項者之罰則。"},{"bill":"202110017340000","text":"違反第十一條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第十一條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110017770000","text":"違反第十一條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十一條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"},{"bill":"202110018570000","text":"有下列情形之一者，處新臺幣一萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110018550000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條各款所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條各款所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110024910000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110025230000","text":"主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程，以提升民眾對於海洋生物多樣性之認識。","note":"參酌生物多樣性公約第十三條及日本生物多樣性基本法第二十三條、第二十四條生物多樣性教育推廣之規定，主管機關應培養具備海洋保育及生物多樣性專業知識人才，並推廣海洋保育及生物多樣性教育課程。"},{"bill":"202110027040000","text":"違反第十條規定，進入海洋庇護區之核心區並從事活動者，處新臺幣十萬元以上五十萬元以下罰鍰，經通知禁止而未改善者，得按日連續處罰之。","note":"為加強落實海洋庇護區內海洋生物保育，且為符合處罰明確性原則，明定對於違反第十條第一項海洋庇護區禁止事項之一者，特科以刑罰。"},{"bill":"202110027520000","text":"違反第十一條第一項規定，進入海洋庇護區之核心區者，處行為人、海陸域交通工具駕駛人或船長新臺幣十萬元以上五十萬元以下罰鍰。","note":"為加強保護海洋庇護區之核心區，對於違反第九條第一項規定，進入海洋庇護區之核心區者，加以處罰。"},{"bill":"202110032170000","text":"有下列情形之一者，處新臺幣六萬元以上三十萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110033380000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110033420000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十一條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十三條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"}],"changed":true,"final":"違反第十一條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣三萬元以上三十萬元以下罰鍰。但原住民基於傳統文化、祭儀、生活所需之利用的行為，不在此限。","finalWhy":"為加強保護海洋庇護區之緩衝區，對於違反第十一條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。但原住民基於傳統文化、祭儀、生活所需之利用的行為，依原住民族基本法，應予尊重、維護、保存與傳承其傳統用海文化，爰於本條但書規定此種情形不在此限。","review":{"note":"修正通過","text":"有下列情形之一者，處新臺幣一萬元以上十五萬元以下罰鍰：\n一、違反第十二條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十四條第一項公告事項。"}},{"no":"第二十三條","current":null,"versions":[{"bill":"201110005120000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110006490000","text":"為執行海洋生物復育，各級主管機關或目的事業主管機關得依據國家海洋保育綱領，提出下列復育計畫，並諮議專家學者及民間團體後經中央主管機關同意後實施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項海洋生物復育措施，各級主管機關得委託其他機關、個人或民間團體辦理。並應提供生態復育監測計畫、監測復育情況並定期將辦理情形報請中央主管機關備查。","note":"一、為執行海洋生物復育，第一項明定主管機關得自行或委託其他機關、團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的，防治海洋生物外來種入侵，爰第二項規範地方主管機關辦理復育措施時，應提出復育計畫，並經中央主管機關核准。\n三、復育措施應加入公民參與及專家諮詢機制。"},{"bill":"202110010660000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110012210000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110012640000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"本條明定無正當理由規避、妨礙或拒絕，海洋生物資源調查或海洋庇護區保育計畫實施或海洋保育觀察員執行觀察、監測或蒐集資料。處新臺幣二萬元以上十萬元以下罰鍰。"},{"bill":"202110013050000","text":"為執行海洋生物復育，各級主管機關或目的事業主管機關得依據國家海洋保育綱領，提出下列復育計畫，並諮議專家學者及民間團體後經中央主管機關同意後實施：\n一、人工復育設施之投放。\n二、海洋動物之培育或野放。\n三、海洋植物之栽植。\n四、其他復育之必要措施。\n前項海洋生物復育措施，各級主管機關得委託其他機關、個人或民間團體辦理。並應提供生態復育監測計畫、監測復育情況並定期將辦理情形報請中央主管機關備查。","note":"一、為執行海洋生物復育，第一項明定主管機關得自行或委託其他機關、團體辦理相關海洋生態復育措施。\n二、為有效達成海洋生物復育目的，防治海洋生物外來種入侵，爰第二項規範地方主管機關辦理復育措施時，應提出復育計畫，並經中央主管機關核准。\n三、復育措施應加入公民參與及專家諮詢機制。"},{"bill":"202110014110000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款明定違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者之罰則。\n二、第二款明定對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者之罰則。"},{"bill":"202110017340000","text":"違反第十二條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十二條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。"},{"bill":"202110017770000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十二條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十四條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十二條所定禁止行為者，加以處罰。\n二、第二款定明違反第十四條第一項公告事項者，加以處罰。"},{"bill":"202110018570000","text":"有下列情形之一者，處新臺幣一萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110018550000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110024910000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110025230000","text":"主管機關為促進海洋保育、海洋生物多樣性保護和永續發展，得自行或透過國際組織、學術研究機構進行國際合作，並對人民或民間團體參與國際交流活動，給予獎勵或補助。\n主管機關對於我國管轄以外海域之生物多樣性維護與永續發展應與各國或國際組織應進行合作，並鼓勵人民及民間團體參與。","note":"一、參酌生物多樣性公約第十八條及日本生物多樣性基本法第二十六條國際交流與合作之規定，為鼓勵國內積極與國際海洋保育事務接軌，主管機關可自行或與國際組織、學術研究機構合作，並對於民間參與海洋保育國際交流合作給予獎勵或補助。\n二、我國雖然非聯合國會員國但應持續關注並積極爭取我國權益，乃參酌聯合國海洋法公約有關國家管轄範圍外區域海洋生物多樣性的養護與永續發展之相關決議與討論訂定第二項規定。並參考BBNJ草案第六條及第十一條，說明我國可與其他國國際合作之面向，及國家管轄範圍以外區域海洋資源之惠益分享。\n三、海洋廢棄物治理為當前國際環保重要議題之一，海洋面積佔地表面積超過7成，海廢受洋流、季風四處飄移，影響跨越國界。我國離島之金門縣、連江縣商港常見大量來自中國之海漂垃圾，造成台灣港務公司及金門縣、連江縣政府之經費負擔，顯示海洋事務之國際合作不可或缺。根據海委會海保署資料，截至2021年5月底，我國除與日本簽有海洋事務交流合作計畫外，與其他國家均尚無簽署正式國際協定共同處理海廢議題。"},{"bill":"202110027040000","text":"有下列情形之一，處新臺幣六萬元以上三十萬元以下罰鍰，經通知禁止而未改善者，得按日連續處罰之：\n一、違反第十一條各款規定，未經許可擅自從事特定行為者。\n二、違反第十五條第一項各款規定公告事項之一者。","note":"一、本條第一款規定，對於違反第十一條各款規定，未經許可於海洋庇護區之緩衝區內，擅自從事特定行為者，加以處罰。\n二、本條第二款規定，對於違反第十五條第一項公告限制、禁止事項之處罰。"},{"bill":"202110027520000","text":"違反第十二條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，處新臺幣六萬元以上三十萬元以下罰鍰。但原住民基於傳統文化、祭儀、生活所需之利用的行為，不在此限。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區內，未經許可從事該項所定禁止行為者，加以處罰。惟因原基法第十九條有賦予原住民採集海洋資源的權利。據此此，增加例外規定，原住民基於原基法的行為不受限制。"},{"bill":"202110032170000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110033380000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110033420000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"}],"changed":true,"final":"有下列情形之一者，處新臺幣一萬元以上十五萬元以下罰鍰：\n一、違反第十二條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十四條第一項公告事項。","finalWhy":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十二條所定禁止行為者，加以處罰。\n二、第二款定明違反第十四條第一項公告事項者，加以處罰。","review":{"note":"照行政院提案通過","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十六條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。"}},{"no":"第二十四條","current":null,"versions":[{"bill":"201110005120000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110006490000","text":"人民、其他機關（構）、法人或團體自行辦理復育措施前，應依據前條海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。","note":"為有效達成海洋生物復育目的，本條明定人民、其他機關（構）、法人或團體自行辦理復育措施前，應依據前條海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。"},{"bill":"202110010660000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110012210000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110012640000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"本條明定未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。"},{"bill":"202110013050000","text":"人民、其他機關（構）、法人或團體自行辦理復育措施前，應依據前條海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意後，始得為之。","note":"為有效達成海洋生物復育目的、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，本條明定人民、其他機關（構）、法人或團體自行辦理復育措施前，應依據前條海洋生物復育措施辦理原則，提出復育計畫，報經主管機關同意。"},{"bill":"202110014110000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰明定其處罰。"},{"bill":"202110017340000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十三條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十五條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十三條所定禁止行為者，加以處罰。\n二、第二款定明違反第十五條第一項公告事項者，加以處罰。"},{"bill":"202110017770000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十六條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十六條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110018570000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110018550000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110024910000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110025230000","text":"為執行海洋生態復育，各級主管機關或目的事業主管機關得自行或委託其他機關、個人或民間團體，或由人民、機關（構）、法人、團體，依據國家海洋保育綱領，提出包含下列復育措施之海洋生態復育計畫，並經中央主管機關諮議專家學者及民間團體同意後實施：\n一、人工復育設施之投放。\n二、海洋動物之培育或流放。\n三、海洋植物之培育或栽植。\n四、其他復育之必要措施。\n各級主管機關或目的事業主管機關辦理前項海洋生態復育計畫，應提供生態復育監測計畫、監測復育情況，定期將辦理情形報送中央主管機關備查。","note":"一、為執行海洋生態復育、防治海洋生物外來種入侵、促進海洋藍碳之發展，與整合海洋生物復育政府及民間資源，爰第一項規定主管機關或目的事業主管機關得自行或委託其他機關、個人或民間團體，或由人民、機關（構）、法人、團體，提出海洋生態復育計畫，經公民參與及專家諮詢機制後，由中央主管機關核准實施。\n二、為有效達成海洋生物復育目的，第二項明定各級主管機關或目的事業主管機關，應將生態復育監測計畫、監測復育情況，定期送交中央主管機關備查。"},{"bill":"202110027040000","text":"有下列情形之一，處新臺幣二萬元以上十萬元以下罰鍰，經通知禁止而未改善者，得按日連續處罰之：\n一、違反第十條規定，未經許可進入海洋庇護區之核心區者。\n二、違反第十二條各款規定，未經許可擅自從事特定行為者。\n三、違反第十三條第一項規定，未保存資料，或規避、妨礙或拒絕提供資料，或提供不實之資料。\n四、違反第十六條第二項規定，規避、拒絕或妨害海洋生物資源調查或海洋庇護區保育計畫實施者。\n五、違反第十七條第二項規定，規避、拒絕或妨害海洋生物資源調查或海洋庇護區保育計畫實施者。\n六、違反第二十一條規定，未報經主管機關許可者，自行辦理復育措施。","note":"一、為加強對於海洋庇護區核心區保護，本條第一款規定，對於違反第十條規定，未經許可進入海洋庇護區之核心區者，加以處罰。\n二、為加強海洋庇護區之緩衝區之保護，本條第二款規定，對於違反第十二條各款規定，未經許可擅自從事特定行為者，加以處罰。\n三、為確保相關機關依十一條至第十二條許可取得者，依要求蒐集、提供資料，以利主管機關有效掌握例外許可後之海洋環境，對於違反相關要求者，加以處罰。\n四、為執行海洋生物資源調查或海洋庇護區保育計畫及海洋保育觀察員從事觀察、監測及蒐集資料，對於無正當理由規避、拒絕或妨害者，第四款及第五款明定處罰之。\n五、為避免人民、機關、法人或團體未經主管機關同意自行辦理復育措施，未按照科學原則辦理之復育措施，不僅效益有限更可能造成海洋生態浩劫，爰加以處罰。"},{"bill":"202110027520000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第十三條規定，於海洋庇護區之永續利用區內，未經許可從事該條所定禁止行為。\n二、違反第十五條第一項公告事項。","note":"一、第一款定明於海洋庇護區之永續利用區內，未經許可從事第十一條所定禁止行為者，加以處罰。\n二、第二款定明違反第十三條第一項公告事項者，加以處罰。"},{"bill":"202110032170000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣二萬元以上十萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110033380000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110033420000","text":"違反第十九條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"}],"changed":true,"final":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十六條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","finalWhy":"一、第一款定明違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十六條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。","review":{"note":"修正通過","text":"違反第二十條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣五萬元以上十五萬元以下罰鍰。但原住民基於傳統文化、祭儀、生活所需之保育行為，不在此限。"}},{"no":"第二十五條","current":null,"versions":[{"bill":"201110005120000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110006490000","text":"主管機關應建立並定期更新整體海域生態、資源利用及物理環境之即時調查資料庫，並以適當方式及指定網站主動公開，除法律另有規定者，依其規定。\n有關第十三條至第十五條之許可行為，及第二十三條生態復育措施及庇護區外之資源及海域利用相關管制監測，亦為前項應公開之資訊，如涉及其他目的事業主管機關之權責，應會商之。\n依本法舉行公聽會及聽證會等相關會議資訊及通知，及前兩項相關公開資訊揭露方式、內容及指定網站等相關事項由中央主管機關訂定之。","note":"一、為有效達成海洋生物復育目的，防治海洋生物外來種入侵，及整合海洋生物復育政府與民間資源，人民、其他機關（構）、法人或團體自行辦理復育措施前，應提出復育計畫，報經主管機關同意。\n二、課予政府建立海洋資料庫及揭露海域使用者除個資法保障外各類資訊之資訊公開義務。"},{"bill":"202110010660000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110012210000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110012640000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、第一項明定未依本法規定進入核心區、未依本法規定於緩衝區內未經許可從事禁止行為、於永續利用區內未經許可從事該條所定禁止行為、第十三條禁止事項，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n二、第二項明定拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，得按次處罰至其接受講習或補足時數為止。\n三、第三項授權主管機關訂定海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法。"},{"bill":"202110013050000","text":"主管機關應建立並定期更新整體海域生態、資源利用及物理環境之即時調查資料庫，並以適當方式及指定網站主動公開，除法律另有規定者，依其規定。\n有關第十三條至第十五條之許可行為，及第二十三條生態復育措施及庇護區外之資源及海域利用相關管制監測，亦為前項應公開之資訊，如涉及其他目的事業主管機關之權責，應會商之。\n依本法舉行公聽會及聽證會等相關會議資訊及通知，及前兩項相關公開資訊揭露方式、內容及指定網站等相關事項由中央主管機關訂定之。","note":"一、為有效達成海洋生物復育目的，防治海洋生物外來種入侵，及整合海洋生物復育政府與民間資源，人民、其他機關（構）、法人或團體自行辦理復育措施前，應提出復育計畫，報經主管機關同意。\n二、課予政府建立海洋資料庫及揭露海域使用者除個資法保障外各類資訊之資訊公開義務。"},{"bill":"202110014110000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、明定違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌《身心障礙者權益保障法》第九十五條第三項、《兒童及少年福利與權益保障法》第一百零二條第三項，於第二項明定拒不接受海洋保育講習課程或時數不足者之罰則，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項明定海洋保育講習課程之內容、實施方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110017340000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十六條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十七條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十六條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十七條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110017770000","text":"違反第二十條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110018570000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110018550000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110024910000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110025230000","text":"主管機關應建立並定期更新海洋基礎資料庫及即時監測資料庫，內容至少應包含整體海域生態、藍碳生態系、保育類物種、海洋污染、資源利用、物理環境、離岸風機及船隻海上作業，並於指定網站主動公開，作為民眾參與海洋治理及海洋保護區劃設基礎，法律另有規定者，依其規定。\n有關第十三條至第十五條之許可行為，及第二十五條生態復育措施及庇護區外之資源及海域利用相關管制監測，亦為前項應公開之資訊，如涉及其他目的事業主管機關之權責，應會商之。\n依本法舉行公聽會及聽證會等相關會議資訊及通知，及前兩項相關公開資訊揭露方式、內容及指定網站等相關事項由中央主管機關訂定之。","note":"政府應依科學為基礎，建立海洋資料庫並落實海域使用除個資法保障外各類資訊之資訊公開義務。"},{"bill":"202110027040000","text":"違反第二十二條至第二十四條規定者，且致海洋生態受損害，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應負賠償責任。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。\n第一項包括當事人、相關經理人及營運人。","note":"一、對於海洋生態環境之破壞與海洋生物之侵害，參考民法侵權行為損害賠償規定及國家公園法第二十七條立法例，以回復原狀為原則、金錢賠償為例外。\n二、為避免衍生調查回復原狀所生必要費用由何者負擔之爭議，爰第二項並明定調查回復原狀所支出之必要費用，由義務人負擔。\n三、為避免相關單位規避責任，參酌海洋污染防治法第三十三條規定，明定處罰規定及於單位相關負責人等。"},{"bill":"202110027520000","text":"有下列情形之一者，處新臺幣二萬元以上十萬元以下罰鍰：\n一、違反第十六條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施。\n二、違反第十七條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料。","note":"一、第一款定明違反第十四條第二項規定，無正當理由規避、妨礙或拒絕海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、第二款定明對於違反第十五條第二項規定，無正當理由規避、妨礙或拒絕海洋保育觀察員執行觀察、監測或蒐集資料者，加以處罰。"},{"bill":"202110032170000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣一萬元以上五萬元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110033380000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110033420000","text":"違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第九條第一項、第十條第一項、第十一條規定或第十三條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"}],"changed":true,"final":"違反第二十條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣五萬元以上十五萬元以下罰鍰。但原住民基於傳統文化、祭儀、生活所需之保育行為，不在此限。","finalWhy":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。但原住民基於傳統文化、祭儀、生活所需之保育行為，依原住民族基本法，應予尊重、維護、保存與傳承其傳統文化，爰於本條但書規定此種情形不在此限。","review":{"note":"修正通過","text":"違反第十條第一項、第十一條第一項、第十二條規定或第十四條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n前項海洋保育講習課程，應包含原住民族知識以及原住民族生物多樣性課程。\n拒不接受第一項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第二十六條","current":null,"versions":[{"bill":"201110005120000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110006490000","text":"違反第十三條、第十四條於海洋庇護區之禁止行為，因而有害於生態系統之虞者，處二年以下有期徒刑、拘役或科或併科新臺幣三十萬元以上一百五十萬元以下罰金。\n但違反第十三條之情形者，已經相當之注意仍無法避免者，得減輕或免罰之。","note":"一、為加強保護海洋庇護區，對於進入海洋庇護區並從事活動者，加以處罰。\n二、為避免本法實施初期或因特殊因素導致無法避免之條件下，增設減輕或免罰條款。"},{"bill":"202110010660000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110012210000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110012640000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"本條明定違反本法規定，損害部分應回復原狀，不能恢復或回復顯有重大困難者，應賠償損害。"},{"bill":"202110013050000","text":"違反第十三條、第十四條於海洋庇護區之禁止行為，因而有害於生態系統之虞者，處二年以下有期徒刑、拘役或科或併科新臺幣三十萬元以上一百五十萬元以下罰金。\n但違反第十三條之情形者，已經相當之注意仍無法避免者，得減輕或免罰之。","note":"一、為加強保護海洋庇護區之核心區，對於違反第九條規定，進入海洋庇護區之核心區並從事活動者，加以處罰。\n二、棲地破壞可能造成整體生態浩劫，不僅對大量生物造成危害，更間皆造成重要保育類生物族群縮減甚至消失，因此參考野生動物保育法增列行政刑罰及提高罰款金額。\n三、為避免本法實施初期或因特殊因素導致無法避免之條件下，增設減輕或免罰條款。"},{"bill":"202110014110000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌《國家公園法》第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項明定該費用由賠償義務人負擔。"},{"bill":"202110017340000","text":"違反第二十一條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。"},{"bill":"202110017
