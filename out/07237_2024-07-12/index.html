<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海洋保育法 2024 年制定歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

"text":"為保護海洋生態環境，保育海洋生物多樣性，協調並促進海洋保護區之規劃及執行，特制定本法。","note":"本法之立法目的。"},{"bill":"202110017340000","text":"為確保海洋生態永續環境，保育海洋生物多樣性，協調並促進海洋保護區之規劃及執行，及推動海洋保育教育，特制定本法。","note":"本法之立法目的。"},{"bill":"202110017770000","text":"為保護海洋生態環境，保育海洋生物多樣性，協調並促進海洋保護區之規劃及執行，特制定本法。","note":"本法之立法目的。"},{"bill":"202110018570000","text":"為保護海洋生態環境，保育海洋生物多樣性，合理利用海洋生物資源，協調並促進海洋保護區之規劃及執行，特制定本法。","note":"明定本法之立法目的。"},{"bill":"202110018550000","text":"為保護海洋生態環境、促進海洋生物多樣性之保育及復育，協調並促進海洋保護區之規劃及執行，推動海洋保育教育，特制定本法。","note":"本法之立法目的。"},{"bill":"202110024910000","text":"為保護海洋生態環境，保育海洋生物多樣性，協調並促進海洋保護區之規劃及執行，特制定本法。","note":"本法之立法目的。"},{"bill":"202110025230000","text":"為保護海洋生態環境，保育與復育海洋生物多樣性、確保海洋生態系統健康、促進海洋保護區以生態系統為基礎之整合規劃與執行、達成以自然為本的氣候變遷解決方案，及推動海洋保育教育，特制定本法。","note":"一、揭櫫本法之立法目的。\n二、我國海洋基本法第十三條規定：「政府應本生態系統為基礎之方法，優先保護自然海岸、景觀、重要海洋生物棲息地、特殊與瀕危物種、脆弱敏感區域、水下文化資產等，保全海洋生物多樣性，訂定相關保存、保育、保護政策與計畫，採取衝擊減輕措施、生態補償或其他開發替代方案，劃設海洋保護區，致力復原海洋生態系統及自然關聯脈絡，並保障原有海域使用者權益。」爰明定本法立法目的。\n三、2021年第26屆聯合國氣候變遷大會（COP26）《格拉斯哥氣候盟約》（Glasgow Climate Pact）已承認以自然為本的解決方案（NbS, Nature-based solution）是復育自然的重要手段。海洋藍碳面對氣候變遷，更具有勝過陸地的強大減量、調適潛力。我國海洋基本法第八條也規定：「政府應整合、善用國內資源，訂定海洋污染防治對策，由源頭減污，強化污染防治能量，有效因應氣候變遷，審慎推動國土規劃，加強海洋災害防護，加速推動海洋復育工作，積極推動區域及國際合作，以保護海洋環境。」顯見我國已漸漸重視海洋與氣候變遷的互動關係，爰將氣候變遷自然為本的解決方案，納入本法立法目的。"},{"bill":"202110027040000","text":"為保護海洋生態環境，增進海洋生物多樣性及其保育與復育，促進海洋保護區之整合規劃與執行，以及推動海洋保育教育，特制定本法。","note":"明訂本法之立法目的及願景。"},{"bill":"202110027520000","text":"為保護海洋生態環境，保育與復育海洋生物多樣性，促進海洋保護區域之整合規劃及執行，並推動海岸保育教育工作，特制定本法。","note":"本法之立法目的。"},{"bill":"202110032170000","text":"為保護海洋生態環境，保育海洋生物多樣性，協調並促進海洋保護區之規劃及執行，特制定本法。","note":"本法之立法目的。"},{"bill":"202110033380000","text":"為保護海洋生態環境，保育海洋生物多樣性，協調並促進海洋保護區之規劃及執行，特制定本法。","note":"本法之立法目的。"},{"bill":"202110033420000","text":"為保護海洋生態環境，保育海洋生物多樣性，協調並促進海洋保護區之規劃及執行，特制定本法。","note":"本法之立法目的。"}],"changed":true,"final":"為保護海洋生態環境，保育海洋生物多樣性，合理利用海洋生物資源，協調並促進海洋保護區之規劃及執行，推動海洋保育教育，特制定本法。","finalWhy":"修正通過。,,,","review":{"note":"修正通過","text":"為保護海洋生態環境，保育海洋生物多樣性，合理利用海洋生物資源，協調並促進海洋保護區之規劃及執行，推動海洋保育教育，特制定本法。"}},{"no":"第二條","current":null,"versions":[{"bill":"201110005120000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。"},{"bill":"202110006490000","text":"國家海洋保育目標為中華民國一百十九年前保護至少百分之三十的海域。\n前項海域指中華民國專屬經濟海域及大陸礁層法以內範圍。","note":"一、為了恢復海洋生物多樣性，確保中華民國的海洋保護區策略與全球接軌，本法納入政府間組織High Ambition Coalition目標，承諾在2030年前保護30%的海洋。\n二、本條所指海域範圍，依據中華民國專屬經濟海域及大陸礁層法之範圍作認定。"},{"bill":"202110010660000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。"},{"bill":"202110012210000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰由中央主管機關公告其管轄範圍。"},{"bill":"202110012640000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"本法之主管機關。"},{"bill":"202110013050000","text":"國家海洋保育目標為中華民國一百十九年保護至少三分之一的海域。\n前項海域指中華民國領海外界線以內水域面積及金門、馬祖與太平島禁、限制水域。","note":"一、為了恢復海洋生物多樣性，第十五屆聯合國生物多樣性公約（COP15）通過決議「30x30」目標，即2030年前保護全球30%陸地及水域，另全球已有上百個國家加入政府間組織High Ambition Coalition，承諾在2030年前保護30%的海洋。\n二、本條海域範圍係依我國海洋保護區《漁業法》、《國家公園法》、《野生動物保育法》、《文化資產保存法》及《發展觀光條例》等相關法規劃設範圍，盡可能涵蓋完整海域。"},{"bill":"202110014110000","text":"本法所稱主管機關，在中央為海洋委員會，在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、明定本法之主管機關。\n二、明定地方主管機關辦理海洋保育業務權責及其管轄範圍，得由中央主管機關公告之。"},{"bill":"202110017340000","text":"中央主管機關應明定我國海洋保育目標及期程，並定期檢討之。\n海洋保護區之劃設及管轄，以中華民國領海、鄰接區、禁止水域、限制水域、專屬經濟海域及大陸礁層之海域為範圍。","note":"一、第十五屆聯合國生物多樣性公約（COP15）通過決議「30x30」目標，即2030年前保護全球30%陸地及水域，然參酌各國劃設海洋庇護區之期程及考量我國政策執行實務，爰於第一項要求中央主管機關應根據實務狀況與執行量能，明定我國海洋保育目標及期程，並應根據後續執行狀況定期檢討。\n二、為全面創造健康海洋環境及促進資源永續，明定我國海洋保護區之劃設與管轄應及於中華民國具管轄權之所有海域，範圍參酌中華民國領海及鄰接區法、中華民國專屬經濟海域及大陸礁層法及臺灣地區與大陸地區人民關係條例第二十九條所規範之水體、海床及其底土。"},{"bill":"202110017770000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。"},{"bill":"202110018570000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，授權中央主管機關公告其管轄範圍。"},{"bill":"202110018550000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦法本主管機關辦法本所定海洋保育業務權責，爰由中央主管機關公告其管轄範圍。"},{"bill":"202110024910000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。"},{"bill":"202110025230000","text":"國家海洋保育目標為中華民國一百十九年前保護至少百分之三十的海域。\n前項所稱海域適用範圍為中華民國領海及中華民國「專屬經濟海域及大陸礁層法」第二條所維護之範圍。","note":"一、明定本法推動之關鍵績效指標，最終應於2030年前保護30%的海洋的目標。\n二、本條所指海域範圍，依據中華民國專屬經濟海域及大陸礁層法之範圍作認定，盡可能涵蓋完整海域。"},{"bill":"202110027040000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關另行公告之。","note":"一、列明本法各層級之主管機關，以明權責。\n二、各直轄市、縣（市）政府辦理本法所定之海洋保育、復育業務，其管轄範圍由中央主管機關海洋委員會另行公告之。"},{"bill":"202110027520000","text":"為符合國際海洋保護趨勢，促進海洋永續利用，政府應將國家海洋保育目標設定為中華民國一百十九年前保護至少百分之三十的海域。\n前項海域指中華民國專屬經濟海域及大陸礁層法以內範圍。","note":"一、2023年3月3日聯合國通「聯合國海洋法公約下國家管轄外區域海洋生物多樣性保育及永續利用協定」（Agreement under the United Nations Convention on the Law of the Sea on the conservation and sustainable use of marine biological diversity of areas beyond national jurisdiction），要求各國履行海洋法公約與相關的國際合作，確保公海與區域的海洋生物資源能長期的保育與永續利用，以達成第十五屆聯合國生物多樣性公約（COP15）通過決議「30x30」目標，即2030年前保護全球30%的陸地及水域。\n二、為敦促我國的海洋保護區策略與全球接軌，本法納入其目標以符合國際主流規範。\n三、本條所指海域範圍，依據中華民國專屬經濟海域及大陸礁層法之範圍作認定，儘可能涵蓋完整海域。"},{"bill":"202110032170000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。"},{"bill":"202110033380000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。"},{"bill":"202110033420000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。"}],"changed":true,"final":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","finalWhy":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。","review":{"note":"照行政院提案通過","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。"}},{"no":"第三條","current":null,"versions":[{"bill":"201110005120000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas, MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（Canada National Marine Conservation Areas Act）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰於第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110006490000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，以各直轄市、縣（市）國土計畫法海洋資源地區為範圍。","note":"一、明定本法各層級之主管機關。\n二、為利直轄市、縣（市）政府辦理本法所定海洋保育業務，爰以國土計畫法海洋資源地區為範圍。"},{"bill":"202110010660000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas, MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（Canada National Marine Conservation Areas Act）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰於第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110012210000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas, MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三○一條、加拿大國家海洋保護區法（Canada National Marine Conservation Areas Act）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110012640000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"本法用詞定義。"},{"bill":"202110013050000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，以各直轄市、縣（市）國土計畫法海洋資源地區為範圍。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰由各直轄市、縣（市）國土計畫法海洋資源地區公告其管轄範圍。"},{"bill":"202110014110000","text":"本法用詞定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、明定本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、第二款明定海洋生物多樣性之定義。\n四、第三款明定本法保育之定義。\n五、第四款明定海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、第五款明定海洋庇護區為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、第六款至第八款規範海洋庇護區之分區及管理原則。"},{"bill":"202110017340000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，由中央主管機關公告之。","note":"一、第一項定明本法之主管機關。\n二、為明直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項授權由中央主管機關公告其管轄範圍。"},{"bill":"202110017770000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological  Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas,  MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三○一條、加拿大國家海洋保護區法（Canada National Marine  Conservation Areas Act）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110018570000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。\n九、漁業人：指漁業權人、入漁權人或其他依漁業法經營漁業之人。\n十、漁業從業人：指漁船船員及其他為漁業人採捕或養殖水產動植物之人。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas,MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（Canada National Marine Conservation AreasAct）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰於第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110018550000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas,MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三○一條、加拿大國家海洋保護區法（Canada National Marine Conservation AreasAct）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110024910000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指基於海洋生態系統具生物多樣性價值而有特別保護之必要，依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas,MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（Canada National Marine Conservation AreasAct）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰於第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110025230000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，以各直轄市、縣（市）國土計畫法第三條海洋資源地區為管轄範圍。","note":"一、明定本法各層級之主管機關，以明權責。\n二、明定直轄市、縣（市）主管機關辦理本法所定海洋保育業務權責，爰於第二項適用國土計劃法其管轄範圍。"},{"bill":"202110027040000","text":"本法用詞定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指海洋範圍內活的海洋生物體中之變異性，包括物種內、物種之間和生態系統的多樣性。\n三、保育：指基於海洋生物多樣性與自然生態平衡之原則，對於海洋生物所為保護、復育及管理之行為。\n四、海洋保護區：指各目的事業主管機關依本法或其他法律劃定之海域與其毗鄰之陸域，以達到保護生物多樣性、特殊自然景觀或永續利用之生態資源。\n五、海洋庇護區：係指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護並限制開發利用行為與人員進入所劃設之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動有所管理、限制以保護核心區，可作為研究發展之區域。其他具有生態潛力區域亦得獨立劃設。\n八、永續利用區：於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、天然資源之有限利用，以獲取其文化、教育、學術、經濟等效益。所劃分之地區，並永續管理及發展此區資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌聯合國生物多樣性公約第二條第一款有關生物多樣性之意義，爰於第二款明文本法海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，明定本法之保育定義。\n五、為統整現行國內海洋保護區之意義，第三款參酌聯合國生物多樣性公約第二條、美國海洋庇護區（National Maine  Sancturay Act）第301條（a）(4)、加拿大國家海洋保護區法（Canada National Marine Conservation Areas Act）第四條予以規範。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰第四款明定海洋庇護區為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋保護區分為核心區、緩衝區與永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性並符合實際需求。另現行野生動物保育法施行細則第十二條亦採用相同分區標準，本法為明確規範海洋庇護區分區管理規範，爰於第五款至第七款明文規範。"},{"bill":"202110027520000","text":"本法所稱主管機關：在中央為海洋委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n前項直轄市、縣（市）主管機關之管轄範圍，以各直轄市、縣（市）國土計畫法海洋資源地區為範圍。","note":"一、明定本法各層級之主管機關，以明權責。\n二、為利直轄市、縣（市）政府辦理本法所定海洋保育業務，爰以國土計畫法海洋資源地區為範圍。"},{"bill":"202110032170000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas,MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（Canada National Marine Conservation AreasAct）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰於第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110033380000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas, MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（Canada National Marine Conservation Areas Act）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰於第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110033420000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas,MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（C 行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。"}},{"no":"第四條","current":null,"versions":[{"bill":"201110005120000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110006490000","text":"本法用詞，定義如下：\n一、海洋生物：係指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：係指海洋生物體中之變異性，包括物種內、物種之間和生態系統的多樣性。\n三、海洋保護區：係指由各目的事業主管機關依本法或其他法律劃定之海域或包含陸地組成部分之海域，以達到長期保護自然及其相關生態系統或文化價值之目的。\n四、海洋庇護區：係指依本法劃定之海域或包含陸地組成部分之海域，其海洋生態系統具生物多樣性價值而有特別保護之必要，應劃設核心區、緩衝區及永續發展區進行分區管理。\n五、核心區：係指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，限制所有開發利用行為與人員進入所劃設之區域。\n六、緩衝區：係指鄰接或環繞於核心區，針對人為活動有所管理、限制以保護核心區，可作為研究發展之區域。其他具有生態潛力區域亦得獨立劃設。\n七、永續發展區：係指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、天然資源之有限利用，以獲取其文化、教育、學術、經濟等效益。所劃分之地區，並永續管理及發展此區資源。\n八、海洋保育突發事件：係指事件發生當時狀況無法事先預知且對海洋生態系統有造成不利之影響之虞。\n九、生態系統途徑：應用適當的科學方法論，注重生物組成之層級，涵蓋生物及其環境之間之必要進程、功能及交互作用。為土地、水體和生物資源之綜合管理策略，以公平之方式促進保育及永續發展。\n十、累積效應：指人為和自然壓力兩者對環境造成之直接性和間接性綜合影響，海洋生態系統受到各式海洋相關活動之影響。\n十一、預警原則：若預見會有危害環境之情況發生，應事先進行相關之防範措施。\n十二、最佳可得科學資訊原則：指相關措施應植基於充分的科學證據，該證據係由蒐集而獲得之資料以及相關科學研究所生之成果，具有相當之專業性可以信賴。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約第二條有關生物多樣性之意義，爰於第二款明定海洋生物多樣性之定義。\n四、第三款參考美國白宮簽署之「第13158號行政命令」及國際自然保育聯盟（IUCN）於2008年提出之保護區定義，爰於第三款明定海洋保護區之定義。\n五、第四款參考美國「國家海洋庇護法」，明定海洋庇護區之定義。\n六、參酌國際上保護區分區使用劃分，將海洋保護區分為核心區、緩衝區與永續利用區三種，以達到各分區適用管理強度不同之規範。為明確規範海洋庇護區分區管理規範，爰於第五款至第七款明文規範。\n七、為使實務上得以創設無核心區但有緩衝區及永續發展區類型之海洋庇護區方式存在，可使保護區之管理策略更具彈性並符合實際需求。\n八、第八款係針對突發事件完整解釋，避免與國防安全、非法走私或其他非關海洋保育事務之突發事件。\n九、第九款至第十二款為科學相關名詞解釋，係為明確指出本法應以科學為基礎論點，並以此列原則為海洋利用之前提。"},{"bill":"202110010660000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110012210000","text":"為達成海洋生物多樣性及因應氣候變遷之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"一、參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。\n二、氣候變遷對環境、經濟及社會造成之影響與衝擊日益嚴重，海洋作為世界上最大的活性碳匯，是減緩氣候變遷最佳、以自然為本的解決方案，亦提供了重要的調適機會，故將因應氣候變遷納入海洋保育目標。"},{"bill":"202110012640000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"本條明定為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110013050000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、海洋保護區：指由各目的事業主管機關依本法或其他法律劃定之海域或包含陸地組成部分之海域，以達到長期保護自然及其相關生態系統或文化價值之目的。\n四、海洋庇護區：係指依本法劃定之海域或包含陸地組成部分之海域，其海洋生態系統具生物多樣性價值而有特別保護之必要，應劃設核心區、緩衝區及永續利用區進行分區管理。\n五、核心區：係指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，限制所有開發利用行為與人員進入所劃設之區域。\n六、緩衝區：係指鄰接或環繞於核心區，針對人為活動有所管理、限制以保護核心區，可作為研究發展之區域。其他具有生態潛力區域亦得獨立劃設。\n七、永續發展區：係指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、天然資源之有限利用，以獲取其文化、教育、學術、經濟等效益。所劃分之地區，並永續管理及發展此區資源。\n八、海洋保育突發事件：係指事件發生當時狀況無法事先預知且對海洋生態系統有造成不利之影響之虞。\n九、生態系統途徑：應用適當的科學方法論，注重生物組成之層級，涵蓋生物及其環境之間之必要進程、功能及交互作用。為土地、水體和生物資源之綜合管理策略，以公平之方式促進保育及永續發展。\n十、累積效應：指人為和自然壓力兩者對環境造成之直接性和間接性綜合影響，海洋生態系統受到各式海洋相關活動之影響。\n十一、預警原則：若預見會有危害環境之情況發生，應事先進行相關之防範措施。\n十二、最佳可得科學資訊原則：指相關措施應植基於充分的科學證據，該證據係由蒐集而獲得之資料以及相關科學研究所生之成果，具有相當之專業性可以信賴。","note":"一、闡明本法用詞定義。\n二、參考美國白宮簽署之「第13158號行政命令」第2款（a）針對海洋保護區之定義為：「海洋環境中任何已被聯邦、州、領地或地方法令或規章列入保護，為其中部分或全部自然及文化資源提供永久性保護之區域。」\n三、參考美國「國家海洋庇護法」針對海洋庇護區之定義為：「因下列事項而具有特殊國家重要性之區域：（a）具有保育、休閒、生態、歷史、科學、文化、考古、教育或美學特質；（b）保護海洋生物資源群落；或（c）其資源或人類利用價值」。\n四、參考IUCN於2008年提出之保護區定義：「一個清楚界定的地理空間受到認可、投入及管理，並透過法令或其他有效手段，以達成自然及其相關生態系統服務與文化價值之長期保護」。\n五、海洋委員會版本條文為永續利用，此詞源於海洋基本法，惟現行法無詳細解釋，故改採環境基本法已定義用詞「永續發展」為原則。\n六、為讓實務在操作上得存在只有緩衝區及永續發展區此類型的海洋庇護區，因此調整第六款文字可使保護區之管理更符合實際需求。\n七、第八款係避免與國防安全、非法走私或其他非關海洋保育事務之突發事件。\n八、第九款至第十二款以此列原則為海洋利用之前提，明確指出本法應以科學為基礎論點。"},{"bill":"202110014110000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"明定主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110017340000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas, MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（Canada National Marine Conservation Areas Act）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰於第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110017770000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110018570000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。\n前項海洋保護區之整合規劃及執行，由主管機關會同有關主管機關定之。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110018550000","text":"為達成海洋生物多樣性之目標，主管機關應依照國家海洋政策白皮書，提供海洋保育整合規劃，以作為海洋保育等治理策略之依據，並採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110024910000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110025230000","text":"本法用詞，定義如下：\n一、海洋生物：係指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：係指海洋生物體中之變異性，包括物種內、物種之間和生態系統的多樣性。\n三、海洋保護區：係指由各目的事業主管機關依本法或其他法律劃定之海域或包含陸地組成部分之海域，以達到長期保護自然及其相關生態系統或文化價值之目的。\n四、海洋庇護區：係指依本法劃定之海域或包含陸地組成部分之海域，其海洋生態系統具生物多樣性價值而有特別保護之必要，應劃設核心區、緩衝區及永續發展區進行分區管理。\n五、核心區：係指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，限制所有開發利用行為與人員進入所劃設之區域。\n六、緩衝區：係指鄰接或環繞於核心區，針對人為活動有所管理、限制以保護核心區，可作為研究發展之區域。其他具有生態潛力區域亦得獨立劃設。\n七、永續發展區：係指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、天然資源之有限利用，以獲取其文化、教育、學術、經濟等效益。所劃分之地區，並永續管理及發展此區資源。\n八、海洋保育突發事件：係指事件發生時無法預知、非屬循環性且對海洋生態系統有不利影響之虞。\n九、生態系統途徑：應用適當的科學方法論，注重生物組成之層級，涵蓋生物及其環境之間之必要進程、功能及交互作用。為土地、水體和生物資源之綜合管理策略，以公平之方式促進保育及永續發展。\n十、累積效應：指人為和自然壓力兩者對環境造成之直接性和間接性綜合影響，海洋生態系統受到各式海洋相關活動之影響。\n十一、預警原則：若預見會有危害環境之情況發生，應事先進行相關之防範措施。\n十二、最佳可得科學資訊原則：指相關措施應植基於充分的科學證據，該證據係由蒐集而獲得之資料以及相關科學研究所生之成果，具有相當之專業性可以信賴。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約第二條有關生物多樣性之意義，爰於第二款明文本法海洋生物多樣性之定義。\n四、第三款參考美國白宮簽署之「第13158號行政命令」第二款（a）針對海洋保護區之定義：「海洋環境中任何已被聯邦、州、領地或地方法令或規章列入保護，為其中部分或全部自然及文化資源提供永久性保護之區域。」另參考國際自然保育聯盟（IUCN）於2008年提出之保護區定義：「一清楚界定的地理空間受到認可、投入及管理，並透過法令或其他有效手段，以達成自然及其相關生態系統服務與文化價值之長期保護」\n五、第四款參考美國「國家海洋庇護法」針對海洋庇護區之定義：「因下列事項而具有特殊國家重要性之區域：（a）具有保育、休閒、生態、歷史、科學、文化、考古、教育或美學特質；（b）保護海洋生物資源群落；或（c）其資源或人類利用價值」\n六、參酌國際上保護區分區使用劃分，將海洋保護區分為核心區、緩衝區與永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性並符合實際需求。另現行野生動物保育法施行細則第十二條亦採用相同分區標準，本法為明確規範海洋庇護區分區管理規範，爰於第五款至第七款明文規範。唯環境基本法第二條第二款已定義用詞「永續發展」，「永續利用」一詞仍無完整定義，為免後續名詞定義爭議，爰修正為永續發展區。\n七、為使實務操作上得以創設無核心區但有緩衝區及永續發展區類型之海洋庇護區方式存在，可使保護區之管理策略更具彈性並符合實際需求。\n八、第八款係針對突發事件完整解釋，避免與國防安全、非法走私或其他非關海洋保育事務之突發事件。\n九、第九款至第十二款為科學相關名詞解釋，系為明確指出本法應以科學為基礎論點，並以此列原則為海洋利用之前提。"},{"bill":"202110027040000","text":"中央主管機關應訂定國家海洋保育綱領，總體計畫與推動海洋保育策略與機制，報請行政院核定後實施。\n前項國家海洋保育綱領應每五年檢討一次。","note":"一、依據海洋基本法第十五條規定政府應發布國家海洋政策白皮書，為落實國家海洋保育政策，乃參照濕地保育法第十三條之規定，於第一項明定中央主管機關為總體規劃與推動海洋保育策略與機制，應訂定國家海洋保育綱領，俾利各級政府海洋保育、海洋治理及規劃之依據。\n二、參照濕地保育法第十三條，及韓國《海洋生態計法해양생태계법》第九條第一項有關《基本計畫》之規定，於第二項明定檢討時機。"},{"bill":"202110027520000","text":"本法用詞，定義如下：\n一、海洋生物：指海洋動物、海洋植物及海洋其他生物。\n二、海洋生物多樣性：指所有海洋範圍內活的生物體中之變異性，包括物種內、物種之間及生態系統之多樣性。\n三、保育：指基於海洋生物多樣性及自然生態平衡之原則，對於海洋生物所為保護、復育、管理之行為。\n四、海洋保護區：指一處海域或該海域與其毗連之陸域具有生物多樣性、特殊自然景觀、文化資產或永續利用之生態資源等，依本法或其他法律所劃定進行保護之區域。\n五、海洋庇護區：指依本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n六、核心區：指為長期保護海洋生物、生態環境、生物多樣性，並提供學術研究，應嚴格保護，且限制人員進入及所有開發利用行為所劃定之區域。\n七、緩衝區：指鄰接或環繞於核心區，針對人為活動進行管理、限制以保護核心區，可作為研究發展所劃定之區域。\n八、永續利用區：指於核心區、緩衝區之外圍，在無礙海洋自然生態平衡之前提下，容許海洋生物、生態環境、生物多樣性及天然資源之利用，以獲取其文化、教育、學術、經濟等效益所劃定之區域，並永續管理及發展其資源。","note":"一、闡明本法用詞定義。\n二、第一款海洋生物定義包括海洋動物、海洋植物及海洋其他生物，以涵括所有海洋物種。\n三、參酌生物多樣性公約（Convention on Biological Diversity）第二條有關生物多樣性（biological diversity）之定義，於第二款定明海洋生物多樣性之定義。\n四、參酌野生動物保育法第三條第八款有關保育用詞定義，於第三款定明本法保育（conservation）之定義。\n五、為統整現行國內海洋保護區（Marine Protected Areas,MPAs）之意涵，第四款參酌生物多樣性公約第二條、美國海洋庇護區法（美國法典，National Marine Sanctuary Act）第三百零一條、加拿大國家海洋保護區法（Canada National Marine Conservation Areas Act）第四條予以規範；海洋保護區除依本法劃定外，尚包含依其他法律所劃定進行保護之區域，並以原劃設機關之認定為準，以彰顯本法協調並促進海洋保護區之規劃及執行之立法目的。\n六、為彰顯海洋庇護區與海洋保護區二者用詞定義之關係，爰於第五款定明海洋庇護區（Marine Sanctuary）為本法所劃定之海洋保護區，並得以核心區、緩衝區及永續利用區進行分區管理者。\n七、參酌國際上保護區分區使用劃分，將海洋庇護區分為核心區、緩衝區及永續利用區三種，以達到各分區適用管理強度不同之規範，可使保護區之管理策略更具彈性，並符合實際需求。\n八、另野生動物保育法施行細則第十二條第一項亦採用相同分區基準，本法為明確規範海洋庇護區分區管理規範，爰於第六款至第八款規範其分區及管理原則。"},{"bill":"202110032170000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110033380000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110033420000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"}],"changed":true,"final":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","finalWhy":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","review":{"note":"照行政院提案通過","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"}},{"no":"第五條","current":null,"versions":[{"bill":"201110005120000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal Global Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective area-based Conservation Measures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110006490000","text":"為達成海洋生物多樣性、永續發展及因應氣候變遷之目標，中央主管機關應召開國家海洋保育審議會，訂定國家海洋保育綱領，明定海洋保（復）育整體規劃原則及推動海洋保（復）育等治理策略與機制，報請行政院核定後實施。作為各級政府海洋保（復）育、海洋治理及規劃之依據。\n前項國家海洋保育綱領應每五年至少檢討一次。國家海洋保育綱領之訂定及檢討，應公開展覽三十日及舉行聽證會。","note":"一、依據海洋基本法第十五條規定政府應發布國家海洋政策白皮書，為落實國家海洋保育政策，參照濕地保育法之規定，於第一項明定中央主管機關為總體規劃與推動海洋保育策略與機制，應訂定國家海洋保育綱領，俾資遵循。\n二、國家保育綱領應與時俱進，爰於第二項明訂實施後之檢討時機與機制。"},{"bill":"202110010660000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（KunminG-Montreal Global Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective areA-based Conservation Measures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110012210000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一款至第十款例示海洋保護區之類型。\n二、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示，「其他有效地區保育措施（Other Effectivearea-based Conservation Measures, OECM）」的定義係指「除保護區外之特定地理空間範圍內，透過不同方式進行治理及管理，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續影響，並具有文化層面、精神層面、社會經濟層面及其他與在地相關之價值。」為因應國際海洋保育趨勢，除呼應國際潮流，亦期引發各機關共同檢視所轄範圍是否有海域具OECM之條件。例如：發電廠出入水口、離岸風場、工業港等設施，以期增加對海域生態之保護，爰納入OECM概念，於第十一款定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110012640000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、第一項明定海洋保育區包含各款之類型，另考量未來新增其他類型之可能性，故於第十一款依其他法律規定劃設之保護區之概括條款。\n二、第二項明定中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。"},{"bill":"202110013050000","text":"為達成海洋生物多樣性、永續發展及因應氣候變遷之目標，中央主管機關應召開國家海洋保育審議會，訂定國家海洋保育綱領，明訂海洋保（復）育整體規劃原則及推動海洋保（復）育等治理策略與機制，報請行政院核定後實施。作為各級政府海洋保（復）育、海洋治理及規劃之依據。\n前項國家海洋保育綱領應每五年至少檢討一次。國家海洋保育綱領之訂定及檢討，應公開展覽三十日及舉行聽證會。","note":"一、依據海洋基本法第十五條規定政府應發布國家海洋政策白皮書，為落實國家海洋保育政策，乃參照濕地保育法第十三條之規定，於第一項明定中央主管機關為總體規劃與推動海洋保育策略與機制，應訂定國家海洋保育綱領，俾資遵循。\n二、依聯合國政府間氣候變遷專家委員會（Intergovernmental Panel on Climate Change）研究，如果全球無法將升溫控制在攝氏1.5度內，地球將面臨關鍵性的轉變。海洋作為世界上最大的活性碳匯，是減緩氣候變遷最佳解決方案，同時提供了地球自然調適之機會，故將因應氣候變遷納入海洋保育目標。\n三、國家海洋保育綱領參照國土計畫納入公民參與機制，並明訂戰略計畫、實施後之檢討時機與機制等。"},{"bill":"202110014110000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設或經中央主管機關認定有效保育措施之區域。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、於本條第一款至第十一款明文例示海洋保護區之類型。\n二、為因應國際海洋保育趨勢，呼應國際潮流，於第十一款納入「經中央主管機關認定有效保育措施之區域」。\n三、第二項明定中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並得訂定子法加以規範。"},{"bill":"202110017340000","text":"國家應致力海洋保育工作，推廣正確海洋保育知識，促使國民積極落實海洋保育措施。\n為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"一、為使國民亦能參與並落實海洋保育觀念，爰於第一項明定國家有責任促使國民積極參與海洋保育行動。\n二、參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，爰於第二項定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110017770000","text":"中央主管機關應訂定國家海洋保育綱領，明定總體規劃與推動海洋保育策略與機制，報請行政院核定後實施。\n前項國家海洋保育綱領應每五年至少檢討一次。","note":"一、依據海洋基本法第十五條規定政府應發布國家海洋政策白皮書，為落實國家海洋保育政策，於第一項明定中央主管機關為總體規劃與推動海洋保育策略與機制，應訂定國家海洋保育綱領，俾資遵循。\n二、國家保育綱領應與時俱進，爰於第二項明訂實施後之檢討時機與機制。"},{"bill":"202110018570000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal GlobalBiodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective area-based ConservationMeasures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。"},{"bill":"202110018550000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、其他經中央主管機關認定有效保育措施之區域。","note":"一、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一款至第十款例示海洋保護區之類型。\n二、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示，「其他有效地區保育措施（Other Effectivearea-based Conservation Measures, OECM）」的定義係指「除保護區外之特定地理空間範圍內，透過不同方式進行治理及管理，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續影響，並具有文化層面、精神層面、社會經濟層面及其他與在地相關之價值。」為因應國際海洋保育趨勢，除呼應國際潮流，亦期引發各機關共同檢視所轄範圍是否有海域具OECM之條件。例如：發電廠出入水口、離岸風場、工業港等設施，以期增加對海域生態之保護，爰納入OECM概念，於第十一款定明「其他經中央主管機關認定有效保育措施之區域」。"},{"bill":"202110024910000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal Global Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective area-based Conservation Measures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110025230000","text":"為達成海洋生物多樣性、永續發展及因應氣候變遷之目標，中央主管機關應召開國家海洋保育審議會，並制定國家海洋保育綱領，其內容應包括海洋保（復）育整體規劃原則、推動海洋保（復）育等治理策略與機制、海洋保護區每年劃設目標及海洋保育類動植物保育復育目標，報請行政院核定後實施，作為各級政府海洋保（復）育、海洋治理及規劃之依據。\n前項國家海洋保育綱領應每五年至少檢討一次。國家海洋保育綱領之訂定及檢討，應公開展覽三十日及舉行聽證會。\n中央主管機關每年應編寫海洋保育成果報告書，內容應依科學數據為基礎，至少包含前一年海洋保育類動植物保育復育成果、目標達成情形，及海洋保護區劃設目標達成情形，報請行政院核定後公開上網。\n未能達成每年保育復育及海洋保護區劃設目標，行政院應命中央主管機關，於三個月內提報改善計畫予行政院核定。\n改善計畫應蒐集學者專家、民間團體及公眾意見，作為檢討修正參考。\n第一項審議會之委員為無給職，其設置辦法由中央主管機關訂定之。其中專家學者、民間保育團體及原住民等不具官方身分之代表，不得少於委員總人數三分之二。\n第一項委員之組成、選任、海洋保育綱領之具體審議程序、第二項檢討及聽證程序等相關辦法，由中央主管機關訂定，報請行政院核定後實施。","note":"一、依據海洋基本法第十五條規定政府應發布國家海洋政策白皮書，為落實國家海洋保育政策，乃參照濕地保育法第十三條之規定，於第一項明定中央主管機關為總體規劃與推動海洋保育策略與機制，應訂定國家海洋保育綱領，俾資遵循。\n二、氣候變遷對環境、經濟及社會造成之影響與衝擊日益嚴重，根據聯合國政府間氣候變遷專家委員會（Intergovernmental　Panel on Climate Change）研究，若要控制全球升溫於攝氏1.5℃內，全球必須在2050年前減少75%至90%的碳排放量。海洋作為世界上最大的活性碳匯，是減緩氣候變遷最佳、以自然為本的解決方案，亦提供了重要的調適機會，故將因應氣候變遷納入海洋保育目標。\n三、極端氣候嚴峻，海洋作為碳匯最大來源，應負起氣候責任，考量海洋生態系減碳、碳吸收儲存、海洋調適能力、減緩海水暖化等功能，將氣候變遷作為海洋保育目標之一，有利於達成2050淨零碳排。\n四、國家海洋保育綱領屬重大戰略方向訂定此類最高指導原則時納入民間參與尤為重要，爰參照國土計畫納入公民參與機制，並明定戰略計畫相關內容。\n五、國家保育綱領應與時俱進，爰於第二項明定實施後之檢討時機與機制。\n六、為利海洋保育成效管考，要求中央主管機關每年編寫海洋保育成果報告書，若未達成目標行政院永續會應命中央主管機關提改善計畫，並納入公民參與機制。"},{"bill":"202110027040000","text":"主管機關應採取各種海洋保育措施，保護海洋生物棲息環境及劃定海洋保護區時，應考量海洋生物多樣性，以確保海洋生物物種及生態系之多樣性。","note":"參考聯合國生物多樣性公約之精神，宣示主管機關採取各種海洋保育措施、保護海洋生物棲息環境及劃定海洋保護區時，應考量生物多樣性。"},{"bill":"202110027520000","text":"為達成海洋生物多樣性之目標，主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。","note":"參酌生物多樣性公約之精神，為達成海洋生物多樣性之目標，定明主管機關應採取各種海洋保育措施，以保護海洋生物棲息環境，協調並促進海洋保護區之整合規劃及執行。"},{"bill":"202110032170000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal Global Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（OtherEffective area-based Conservation Measures,OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110033380000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal Global  Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective area-based Conservation Measures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110033420000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal Global Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective area-based Conservation Measures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"}],"changed":true,"final":"海洋庇護區之劃定、變更或廢止及海洋庇護區保育計畫之擬訂前，涉及原住民族土地及海域部分，中央主管機關應會同中央原住民族主管機關，並依原住民族基本法及海洋基本法之規定辦理。","finalWhy":"一、依原住民族基本法第十九條至第二十一條及第二十三條規定，政府依法限制原住民族利用土地及自然資源時，應與原住民族、部落諮商，並取得其同意，以保障原有海域使用者之相關權益。另依海洋基本法第十條及第十三條規定，政府應建立合宜機制，尊重、維護、保存傳統用海智慧等海洋文化資產，保障與傳承原住民族傳統用海文化及權益，並兼顧漁業科學管理，訂定相關保存、保育、保護政策與計畫，採取衝擊減輕措施、生態補償或其他開發替代方案，劃設海洋保護區，致力復原海洋生態系統及自然關聯脈絡，並保障原有海域使用者權益。\n二、為兼顧海洋保育與尊重原住民族海域使用的傳統，定明海洋庇護區之劃定、變更或廢止及海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應會同中央原住民族主管機關，並依原住民族基本法及海洋基本法之規定辦理；又所定原住民族海域，指中央原住民族主管機關依原住民族基本法第十九條所公告之海域。","review":{"note":"照行政院提案通過","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。"}},{"no":"第六條","current":null,"versions":[{"bill":"201110005120000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for Conservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110006490000","text":"主管機關採取各種海洋保育措施、保護海洋生物棲息環境及劃定海洋保護區時，應考量對海洋保育有益之原則包含生態系統途徑、累積效應、預警原則、最佳可得科學資訊等有利於海洋保育之原則。\n整體海洋之利用應遵守永續利用之精神。","note":"一、保護區及保育措施的劃設、訂定，須建立在科學調查及監測的數據基礎上，並應遵循對海洋保育有益之原則。\n二、在資料尚不足以確認利用行為之危害程度等生態負面成本時，應採取對海洋生態保育之最佳政策。"},{"bill":"202110010660000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for Conservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110012210000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次，並於規劃及檢討階段，提供必要資訊後召開公聽會納入相關利害關係人、專家學者、公民團體之意見，主管機關應具體回覆。涉及多數不同利益之人或多數不同行政機關權限者，應經公開及聽證程序。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for Conservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國海洋庇護區法（美國法典）第三○九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110012640000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、第一項明定中央政府之訂定整體海洋保護區之權責。\n二、第二項明定海洋保護區之政策包含政策目標、海洋保護區之分級、海洋保護區之規劃及管理、海洋保護區之監測、海洋保護區之檢討及成效評估、其他與海洋保護區管理有關之事項。\n三、第三項明定整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n四、第四項明定依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n五、第五項明定整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。"},{"bill":"202110013050000","text":"主管機關採取各種海洋保育措施、保護海洋生物棲息環境及劃定海洋保護區時，應考量對海洋保育有益之原則包含生態系統途徑、累積效應、預警原則、最佳可得科學資訊等有利於海洋保育之原則。\n整體海洋之利用應遵守永續利用之精神。","note":"一、保護區及保育措施劃設與訂定需建立在科學調查及監測數據，並應遵循海洋保育有益之各項原則。\n二、在尚不足以確認利用行為之危害程度等造成生態負面成本時，應採取對海洋生態保育最佳之政策為原則。"},{"bill":"202110014110000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針，應尊重、維護、保存傳統用海智慧等海洋文化資產，保障與傳承原住民族傳統用海文化及權益。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行《海洋基本法》第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰於第一項明定整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項明定整體海洋保護區管理政策方針內容應包括之事項：國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n三、參酌《原住民族基本法》第二十條，政府承認原住民族土地及自然資源權利、《海洋基本法》第十條明定政府應保障與傳承原住民族傳統用海文化及權益，以及同法第十三條明定政府應保障原有海域使用者權益之精神，爰於第三項明定，整體海洋保護區管理政策方針，應尊重、維護、保存傳統用海智慧海洋文化資產，保障與傳承原住民族傳統用海文化及權益。\n四、整體海洋保護區管理政策方針應與時俱進，參酌《濕地保育法》第十九條及《水下文化資產保護區劃設及管理辦法》第十三條第三項等，於第四項明定檢討時機。\n五、參酌《海岸管理法》第十三條第二項，於第五項明定依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項。\n六、參酌《海岸管理法》第四十三條，於第六項明定整體海洋保護區管理政策方針執行有疑義時之協調機制。"},{"bill":"202110017340000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal Global Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective area-based Conservation Measures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110017770000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」，設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」或「其他有效保育措施之區域」，而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110018570000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、海洋保護區原漁業人、漁業從業人之照顧。\n七、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針及原漁業人、漁業從業人之照顧應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union forConservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110018550000","text":"中央主管機關應依國家海洋政策白皮書，並會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。\n中央主管機關於訂定第二項第二款、第三款及第五款時，應邀請專家學者、有關機關代表、相關民間團體代表相關法人代表及其他適當相關人員召開公聽會，並製作會議紀錄及公開之。\n辦理前項業務之相關事項辦法，由中央主管機關定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union forConservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國海洋庇護區法（美國法典）第三○九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨域機關整合事務，爰參酌海岸管理法第四十三條，定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保域業務順利推動。\n六、為強化整體海洋保護區管理政策方針之民間參與機制，爰於第六項規範下列事項：\n(一)中央主管機關訂定第二項第二款、第三款及第五款事項時，應於提供必要資訊後召開公聽會。\n(二)公聽會應邀請專家學者、有關機關代表、相關民間團體代表、相關法人代表及其他適當人員出席，相關民間團體代表應包括但不限於從事海洋保育之民間團體、相關法人代表應包括但不限於全國漁會；中央主管機關於邀請上述人員時，應兼顧各方之代表性及均衡性。\n(三)公聽會應作成紀錄，載明公聽會之進行程序及參與人員之發言要旨後公開之；其公開之方式及限制，適用政府資訊公開法。"},{"bill":"202110024910000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for Conservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110025230000","text":"主管機關及各目的事業主管機關之海洋或海岸利用行為、開發許可程序、各種海洋保育措施、保護海洋生物棲息環境及劃定海洋保護區時，應考量生態系統途徑、以自然為本的解決方案、累積效應、預警原則、最佳可得科學資訊等有利於海洋保育之原則。\n前項開發行為之環境影響評估或環境、社會、文化影響評估，應納入藍碳生態系之氣候變遷風險評估。","note":"一、保護區及保育措施的劃設、訂定須建立在科學調查及監測的數據上，並應遵循對海洋保育有益之各原則。\n二、任何計劃在海域進行的開發活動，如果預見會有危害環境的情況發生，應事先進行相關防範措施和評估，取代事後補救及究責。\n三、海洋或海岸開發案環境影響評估，應納入生態系變化所造成碳匯變化之氣候變遷風險評估。\n四、在資料尚不足以確認利用行為之危害程度等生態負面成本時，應採對海洋生態保育最佳之政策。"},{"bill":"202110027040000","text":"海洋保護區之類型，包括下列地區：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、其他經中央主管機關或中央目的事業主管機關指定以保育目的劃設之區域。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"現行由各主管機關劃設海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰第一款至第十款明文例示海洋保護區之類型。"},{"bill":"202110027520000","text":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","note":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal Global Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective area-based Conservation Measures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。"},{"bill":"202110032170000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union forConservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110033380000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for  Conservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110033420000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少通盤檢討一次。\n中央主管機關於訂定第二項第三款及第五款事項時，應提供必要資訊後邀請專家學者、有關機關代表、相關民間團體代表、相關法人代表及其他適當人員召開公聽會，並應作成會議紀錄及公開之。辦理前項業務之相關事項辦法，由中央主管機關定之。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for Conservation of Nature , IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、為強化整體海洋保護區管理政策方針之民間參與機制，爰於第四項規範下列事項：\n(一)中央主管機關訂定第二項第三款及第五款事項時，應於提供必要資訊後召開公聽會。\n(二)公聽會應邀請專家學者、有關機關代表、相關民間團體代表、相關法人代表及其他適當人員出席，相關民間團體代表應包括但不限於從事海洋保育之民間團體、相關法人代表應包括但不限於全國漁會；中央主管機關於邀請上述人員時，應兼顧各方之代表性及均衡性。\n(三)公聽會應作成紀錄，載明公聽會之進行程序及參與人員之發言要旨後公開之；其公開之方式及限制，適用政府資訊公開法。\n五、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n六、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"}],"changed":true,"final":"本法所定海洋保護區之類型，包括下列地區之海域或該海域與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園及國家自然公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、依其他法律規定劃設之保護區。\n中央主管機關得認定海洋保護區以外其他有效保育措施之區域；其認定標準，由中央主管機關定之。","finalWhy":"一、二○二二年生物多樣性公約第十五次締約方大會通過「昆明─蒙特婁全球生物多樣性框架」（Kunming-Montreal Global Biodiversity Framework），設定四項長期目標及二十三個階段性行動目標。其中階段性行動目標第二項及第三項建議各國致力於二○三○年以前實現至少百分之三十之陸地、內陸水域、沿海及海洋區域（特別是對生物多樣性與生態系統功能及服務特別重要之區域），透過劃設或認定具生態代表性、良好連結以及公平治理之「保護區」（Protect Areas, PAs）或「其他有效保育措施之區域」（Other Effective area-based Conservation Measures, OECMs），而受到有效之保育及管理；以及百分之三十之生態系統退化區域得到有效復育，以增進生物多樣性、生態系統功能服務與生態系完整性及連結性。並能妥適融合原住民傳統領域於廣泛地景、海景及海洋中，確保在有效保育情況下永續利用，以及尊重原住民族及地方社區之權利。\n二、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一項第一款至第十款例示海洋保護區之類型。另考量未來依其他法律劃設保護區之可能性，爰訂定第十一款概括規定。\n三、二○一八年生物多樣性公約第十四次締約方大會決議十四/八揭示其他有效保育措施之區域（OECMs）之定義，係指「非屬於保護區之特定地區內，透過治理及管理方式，對當地之生物多樣性與相關生態系功能及服務具有正向及長期永續成效，並可能兼具文化、精神、社會經濟層面及其他在地相關之價值」。為因應國際海洋保育趨勢，爰於第二項定明中央主管機關得認定海洋保護區以外其他有效保育措施之區域，並授權中央主管機關訂定其認定標準，俾利達成「昆明─蒙特婁全球生物多樣性框架」所設定之階段性行動目標。","review":{"note":"修正通過","text":"中央主管機關應會同各中央目的事業主管機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分類及分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。"}},{"no":"第七條","current":null,"versions":[{"bill":"201110005120000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設
