為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者及民間團體代表人數不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體（包括海洋產業利害關係之團體等）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110006490000","text":"海洋保護區之類型，包括下列地區：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、其他經目的事業主管機關指定以保育目的劃設之區域。","note":"一、「海洋保護區」是一個整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法等，為減輕實務上認定之困難，爰第一款至第十款明文例示海洋保護區類型。\n二、另因應國際海洋保育趨勢，納入「其他有效地區保育措施（Other Effective area-based Conservation Measures, OECM）」概念，爰第十一款規定「其他經目的事業主管機關指定以保育目的劃設之區域」以資概括。"},{"bill":"202110010660000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者、民間團體代表及原住民等不具官方身分之代表人數不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體（包括海洋產業利害關係之團體等）及原住民代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110012210000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者及民間團體代表人數不得少於委員總人數三分之二。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參照聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式。為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體（包括海洋產業利害關係之團體等）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110012640000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者及民間團體代表人數不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、第一項明定中央主管機關基於特別保護之必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、第二項明定中央主管機關為劃定海洋庇護區，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者及民間團體代表人數不得少於委員總人數二分之一。\n三、第三項明定海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。"},{"bill":"202110013050000","text":"海洋保護區之類型，包括下列地區：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、其他經目的事業主管機關指定以保育目的劃設之區域。","note":"一、海洋保護區為整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰於第一款至第十款例示海洋保護區之類型。\n二、依據2018年生物多樣性公約第十四次締約方大會決議十四/八揭示，「其他有效地區保育措施（Other Effective  area-based Conservation Measures, OECM）」；為因應國際海洋保育趨勢，除呼應國際潮流，亦期引發各機關共同檢視所轄範圍是否有海域具OECM之條件。爰納入OECM概念，於第十一款定明「其他經目的事業主管機關指定以保育目的劃設之區域」。"},{"bill":"202110014110000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者及民間團體代表人數不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止與其程序及其他相關事項之辦法，應由中央主管機關會商農業主管機關及原住民族主管機關定之。","note":"一、第一項明定中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、第二項參酌《文化資產保存法》、《水下文化資產保存法》、《國家公園法》、《都市計畫法》、《濕地保育法》等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，明定審議委員選任之外部專家學者、民間團體代表比例，減少審議爭議。\n三、。爰於第三項明定海洋庇護區之劃定基準、變更、廢止與其程序及其他相關事項之辦法，授權由中央主管機關會商農業主管機關及原住民族主管機關定之。"},{"bill":"202110017340000","text":"中央主管機關應定期會同有關機關進行水資源環境、海洋生態等基礎調查，建置海洋保護資料庫與專屬網頁，並公開之。資料庫與專屬網頁應定期更新。","note":"中央主管機關與有關機關為推動海洋保育工作並傳達正確海洋保育知識，應建立並定期調查海洋保護區之自然基礎資料，作為計畫執行與推廣知識之基礎。"},{"bill":"202110017770000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for  Conservation of Nature , IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110018570000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、漁會、漁民代表、民間團體及有關機關代表組成，其中專家學者、漁會、漁民代表、及民間團體代表人數不得少於委員總人數三分之二。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性、公正性、及照顧弱勢，定明審議委員選任之外部專家學者、漁會、漁民代表、民間團體（包括海洋產業利害關係之團體等）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110018550000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，應經審議會審議，劃定為海洋庇護區。\n前項審議會之委員為無給職，其設置辦法由中央主管機關訂之。其中專家學者、民間團體、法人、原住民及在地居民等不具官方身分之代表，其不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與審議會之組成、職掌、利益迴避及其他相關事項之辦理，由中央主管機關定之。","note":"一、參照聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等規定，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式。為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，爰參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等規定，於第一項規範中央主管機關得就海洋生態系統有特別保護必要者，劃定為海洋庇護區。\n二、為強化民間參與及落實公開審議功能，並廣納各方之意見，爰中央主管機關劃定海洋庇護區前，應經審議會審議，以利海洋生物保育措施之順利推動。\n三、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。\n四、審議委員選任應兼顧各方之代表性及均衡性，其中相關民間團體代表應包括但不限於從事海洋保育之民間團體、相關法人代表應包括但不限於全國漁會及相關區漁會；復以，海洋庇護區之劃設與在地居民切身相關，為確保在地居民意見得以充分表述，審議會應包括在地居民在內，以提升海洋庇護區發展實效。\n五、為確保審議會運作之獨立性及公正性，爰於第二項後段定明審議委員選任不具官方身份代表之比例，以減少審議爭議。\n六、第三項授權中央主管機關訂海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110024910000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者、民間團體代表及原住民等人數不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體（包括海洋產業利害關係之團體等）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110025230000","text":"海洋保護區之類型，包括下列地區與其毗連之陸域：\n一、野生動物保護區。\n二、野生動物重要棲息環境。\n三、國家公園。\n四、國家風景特定區海域資源保護區。\n五、水產動植物繁殖保育區。\n六、水下文化資產保護區。\n七、自然保留區。\n八、地質公園。\n九、重要濕地。\n十、海洋庇護區。\n十一、其他經目的事業主管機關指定以保育目的劃設之區域。","note":"一、按「海洋保護區」是一個整體性之上位概念，現行規範海洋保護區之法律包括野生動物保育法、國家公園法、都市計畫法、發展觀光條例、漁業法、水下文化資產保存法、文化資產保存法、濕地保育法等，為減輕實務上認定之困擾，爰第一款至第十款明文例示海洋保護區之類型。\n二、另因應國際海洋保育趨勢，納入「其他有效地區保育措施（Other Effective area-based Conservation Measures, OECM）」概念，爰第十一款規定「其他經目的事業主管機關指定以保育目的劃設之區域」以資概括。"},{"bill":"202110027040000","text":"中央主管機關依國家海洋保育綱領應會商有關機關訂定國家海洋保護區管理計畫，報請行政院核定後實施；其變更時，亦同。\n前項計畫內容應包括下列事項：\n一、計畫範圍。\n二、計畫目標。\n三、海洋保護區之分類及分級。\n四、海洋保護區之規劃及管理措施。\n五、海洋生態保（復）育整體規劃措施。\n六、整體海洋調查、管理及監測。\n七、海洋保護區相關措施對利害關係人影響。\n八、海洋保護區之檢討及成效評估。\n九、其他與海洋保護區管理有關之事項。\n直轄市、縣（市）政府，依國家海洋保育綱領，得就前項第一款至第五款，提出直轄市、縣（市）海洋保護區管理計畫，經中央主管機關審議、核定後，納入國家海洋保護區管理計畫。\n海洋保護區橫跨直轄市、縣（市）轄區者，由各該直轄市、縣（市）主管機關協商擬訂，報中央主管機關核定；必要時，由中央主管機關協調各相關直轄市、縣（市）主管機關共同擬訂，或指定由其中一直轄市、縣（市）主管機關擬訂。計畫產生競合時，應報由中央主管機關協調；協調不成時，得報請行政院決定之。\n第一項整體海洋保護區管理計畫，應每五年至少檢討一次。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定「政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務。」爰第一項明定整體海洋保護區管理計畫應由中央主管機關應會商有關機關訂定，報請行政院核定後實施，並規範計畫內容應包括之事項。\n二、為強化已設立之海洋保護區成效，爰參酌美國海洋庇護區法（美國法典）第三○九條、日本生物多樣性基本法第二十二條、韓國海洋生態計法第十一條至第十三條及、第二十九條等規定，明定第一項第六款海洋保護區之監測與第八款海洋保護區之檢討及成效評估。\n三、為強化海洋保護區的劃設管理不僅有利於環境生態本身，以能發揮造福鄰近社區聚落，參考韓國海洋生態計法第二十八條第一項第三及第四款規定，明定第一項第七款，須定期檢視海洋保護區相關措施對於鄰近居民的影響與利益，以利保育政策亦能符合人民需要。\n四、地方政府得就其管轄範圍內，提出包括：海洋保護區劃設範圍、分類及分級、規劃及管理措施之地方海洋保護區管理計畫，並經中央主管機關核定後，納入國家海洋保護區管理計畫。\n五、渉及跨域範圍者，參酌濕地保育法第十四條及國土計畫法第七條，明定得由各地方機關協商擬定，由中央主管機關協調，或由中央主管機關指派其中一地方主管機關擬定，以及計畫產生競合時之協調機制。\n六、參考加拿大國家海洋保護區法第九條、韓國生態計法第二十八條第一項，爰於第四項明定實施後之檢討時機。"},{"bill":"202110027520000","text":"中央主管機關應會同原住民族中央主管機關及其他有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會同有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、又，宜花東屏地區的部分原民部落有利用海洋資源的習慣，海洋保護區管理政策方針的制訂將影響族人的權利。因此，特別要求要會同原住民族中央主管機關原民會，才能夠確保原住民的權利。\n三、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for Conservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n四、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n五、四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n六、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110032170000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者及民間團體代表人數不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體（包括海洋產業利害關係之團體等）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110033380000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者及民間團體代表人數不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體（包括海洋產業利害關係之團體等）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110033420000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者及民間團體代表人數不得少於委員總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體（包括海洋產業利害關係之團體等）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"}],"changed":true,"final":"中央主管機關應會同各中央目的事業主管機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分類及分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","finalWhy":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會同各中央目的事業主管機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分類及分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for Conservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分類及分級管理方式，爰於第二款將海洋保護區分類及分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。","review":{"note":"修正通過","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、原住民、漁民團體、保育團體等民間團體及有關機關代表組成，其中不具官方身分之代表人數不得少於委員總人數二分之一，原住民及漁民團體之代表總人數，不得少於委員總人數三分之一。\n審議會之決議，以委員過半數之出席，出席委員超過三分之二同意行之。\n海洋庇護區之核心區劃定，致該區域之既有使用人遭受特別犧牲之損失者，應予補償。\n第一項海洋庇護區之劃定基準、變更、廢止程序、第二項審議會之設置、組成、運作與前項補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第八條","current":null,"versions":[{"bill":"201110005120000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110006490000","text":"中央主管機關，依國家海洋保育綱領，應會商有關機關訂定國家整體海洋保護區管理計畫，報請行政院核定後實施，其計畫內容應包括下列事項：\n一、計畫範圍。\n二、計畫目標。\n三、海洋保護區分類及分級。\n四、整體海域定期性及因應海洋保育突發事件之臨時性調查項目與方式。\n五、海洋保護區之規劃及管理措施。\n六、海洋生態保（復）育整體規劃措施。\n七、海洋保護區之管理監測。\n八、海洋保護區之檢討及成效評估。\n九、其他與海洋保護區管理有關之事項。\n前項整體海洋保護區管理計畫，應每五年通盤檢討整體海域，並於計畫規劃及檢討階段，提供必要資訊後召開公聽會納入相關利害關係人、專家學者、公民團體之意見，主管機關應具體回覆。涉及多數不同利益之人或多數不同行政機關權限者，應經公開及聽證程序。\n整體海洋保護區管理計畫涉及相關機關執行有疑義時，得由主管機關協調；協調不成，由主管機關報請上級機關決定之。\n本條第一項之國家整體海洋保護區管理計畫之具體審議及檢討程序、第二項之公民參與及聽證辦理等相關辦法，由中央主管機關訂定，報請行政院核定後實施。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定「政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務。」爰第一項明定整體海洋保護區管理計畫應由中央主管機關應會商有關機關訂定，報請行政院核定後實施，並規範計畫內容應包括之事項。\n二、現行海洋保護區係由不同法律之主管機關所劃設，為避免海域規劃闕漏，爰於第四款針對整體海域進行完整調查。\n三、為強化已設立之海洋保護區成效，參酌美國海洋庇護區法、日本生物多樣性基本法，明定第一項第七款海洋保護區之監測與第八款海洋保護區之檢討及成效評估。\n四、整體海洋保護區管理計畫應與時俱進，參酌加拿大國家海洋保護區法、我國濕地保育法及水下文化資產保護區劃設及管理辦法等規定，於第二項明定實施後之檢討時機，並於計畫規劃及檢討階段納入民間參與機制，確保保護區發展實效。"},{"bill":"202110010660000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110012210000","text":"中央主管機關劃定海洋庇護區，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽及公聽會之日期及地點，應登載於政府公報、新聞紙，並以網際網路或其他適當方法廣泛周知。人民或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙，並以網際網路或其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理。","note":"一、海洋保護區劃設應有公告程序，外國立法例如紐西蘭海洋保護區法第五條、美國海洋庇護區法（美國法典）第三○四條，均規範海洋保護區之公告程序。為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n二、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110012640000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、第一項明定中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n二、第二項明定公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n三、第三項明定中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n四、尊重原住民族海域使用的傳統，第四項明定洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。"},{"bill":"202110013050000","text":"中央主管機關，依國家海洋保育綱領，應會商有關機關訂定國家整體海洋保護區管理計畫，報請行政院核定後實施，其計畫內容應包括下列事項：\n一、計畫範圍。\n二、計畫目標。\n三、海洋保護區分類及分級。\n四、整體海域定期性及因應海洋保育突發事件之臨時性調查項目與方式。\n五、海洋保護區之規劃及管理措施。\n六、海洋生態保（復）育整體規劃措施。\n七、海洋保護區之管理監測。\n八、海洋保護區之檢討及成效評估。\n九、其他與海洋保護區管理有關之事項。\n前項整體海洋保護區管理計畫，應每五年通盤檢討整體海域，並於計畫規劃及檢討階段，提供必要資訊後召開公聽會納入相關利害關係人、專家學者、公民團體之意見，主管機關應具體回覆。涉及多數不同利益之人或多數不同行政機關權限者，應經公開及聽證程序。\n整體海洋保護區管理計畫涉及相關機關執行有疑義時，得由主管機關協調；協調不成，由主管機關報請上級機關決定之。\n本條第一項之國家整體海洋保護區管理計畫之具體審議及檢討程序、第二項之公民參與及聽證辦理等相關辦法，由中央主管機關訂定，報請行政院核定後實施。","note":"一、依據海洋基本法第四條第一項之規定「政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務。」爰第一項明定整體海洋保護區管理計畫由中央主管機關應會商有關機關訂定，報請行政院核定後實施，並規範計畫內容應包括之相關事項。\n二、現行海洋保護區係由不同法律之主管機關所劃設，尚待整合規劃與執行，為避免海域規劃有所疏漏，爰於第一項第四款納入整體海域之相關調查。\n三、參酌美國海洋庇護區法（美國法典）第三○九條、日本生物多樣性基本法第二十二條等相關規定，明定第一項第七款海洋保護區之管理監測與第八款海洋保護區之檢討及成效評估，以強化已設立之海洋保護區成效。\n四、參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等相關規定，明定第二項實施後之檢討時機；海洋保護工作與在地居民切身相關，為確保利害關係人意見得以充分表述，爰於規劃、檢討階段納入民間參與機制，確保保護區發展實效。"},{"bill":"202110014110000","text":"中央主管機關劃定海洋庇護區，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽及公聽會之日期及地點，應登載於政府公報、新聞紙，並以網際網路或其他適當方法廣泛周知。人民或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙，並以網際網路或其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應會商原住民族主管機關擬訂；涉及限制原住民族利用原住民族土地、海域及自然資源時，審議前擬訂機關應與當地原住民族或部落諮商，並取得其同意。","note":"一、參酌《海岸管理法》第十六條第一項，於第一項及第二項明定海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌《海岸管理法》第十六條第三項及《濕地保育法》第十八條，於第三項明定計畫公告實施後之資訊公開程序，俾資周妥。\n二、參酌《海岸管理法》第十條第三項、《濕地保育法》第七條第四項、《國土計畫法》第十一條第二項及第二十三條第三項等規定，為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項明定海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應會商原住民族主管機關擬訂；涉及限制原住民族利用原住民族土地、海域及自然資源時，審議前擬訂機關應與當地原住民族或部落諮商，並取得其同意。又所定原住民族海域，指《原住民族基本法》第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110017340000","text":"中央主管機關應會商有關機關訂定整體海洋保護區管理政策方針，報請行政院核定後實施；其變更時，亦同。\n前項整體海洋保護區管理政策方針內容，應包括下列事項：\n一、政策目標。\n二、海洋保護區之分級。\n三、海洋保護區之規劃及管理。\n四、海洋保護區之監測。\n五、海洋保護區之檢討及成效評估。\n六、其他與海洋保護區管理有關之事項。\n第一項整體海洋保護區管理政策方針實施後，中央主管機關應每五年至少檢討一次。\n依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部。\n整體海洋保護區管理政策方針涉及相關機關執行有疑義時，得由中央主管機關協調；協調不成者，報請行政院決定之。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定，政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務，爰第一項定明整體海洋保護區管理政策方針應由中央主管機關會商有關機關訂定，報請行政院核定後實施；其變更時，亦同。\n二、第二項規範整體海洋保護區管理政策方針內容應包括之事項：\n(一)為落實海洋保護區之分級有效管理，且更符合明智用海之精神，將系統性歸納不同作用法所劃設之保護區功能或強度等級，參考國際自然保育聯盟（International Union for Conservation of Nature, IUCN）或國際相關管理分級標準，訂定我國海洋保護區之分級管理方式，爰於第二款將海洋保護區分級納入整體海洋保護區管理政策方針內容。\n(二)現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃及執行，為強化依法劃設之海洋保護區成效，參酌美國國家海洋庇護區法第三百零九條、日本生物多樣性基本法第二十二條等規定，爰於第四款定明海洋保護區之監測與第五款定明海洋保護區之檢討及成效評估。\n三、整體海洋保護區管理政策方針應與時俱進，參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等，爰於第三項定明實施後之檢討時機。\n四、參酌海岸管理法第十三條第二項，於第四項定明依其他法律規定劃設之海洋保護區，其保護區名稱、內容、劃設程序、辦理機關及管理事項從其規定，納入整體海洋保護區管理政策方針之一部，以提升海洋保育效能。\n五、考量整體海洋保護區業務多涉跨域及跨機關整合事務，參酌海岸管理法第四十三條，於第五項定明整體海洋保護區管理政策方針執行有疑義時之協調機制，促使海洋保育業務順利推動。"},{"bill":"202110017770000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、相關民間組織團體、相關適當人員、相關法人代表及有關機關代表組成，其中專家學者、相關民間組織團體、相關適當人員及相關法人代表人數不得少於委員總人數三分之二。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式。為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者比例；為確保審議會兼顧各方代表性及均衡性，其外部專家應包括專家學者、民間組織團體、相關法人代表、相關適當人員，其中相關適當人員應包括但不僅限於相關地區居民代表，納入多元意見通盤考量以減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。"},{"bill":"202110018570000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關及漁會，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、中華民國全國漁會刊物、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110018550000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推定各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110024910000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110025230000","text":"中央主管機關，依國家海洋保育綱領，應會商有關機關訂定國家整體海洋保護區管理計畫，報請行政院核定後實施，其計畫內容應包括下列事項：\n一、計畫範圍。\n二、計畫目標。\n三、海洋保護區分類及分級。\n四、整體海域定期性及因應海洋保育突發事件之臨時性調查項目與方式。\n五、海洋保護區之規劃及管理措施。\n六、海洋生態保（復）育整體規劃措施。\n七、海洋保護區之管理監測。\n八、海洋保護區之檢討及成效評估。\n九、其他與海洋保護區管理有關之事項。\n前項整體海洋保護區管理計畫，應每五年通盤檢討之，並於計畫規劃及檢討階段，提供必要資訊後召開公聽會納入相關利害關係人、專家學者、公民團體之意見，主管機關應具體回覆。涉及多數不同利益之人或多數不同行政機關權限者，應經公開及聽證程序。\n整體海洋保護區管理計畫涉及相關機關執行有疑義時，得由主管機關協調；協調不成，由主管機關報請上級機關決定之。\n本條第一項之國家整體海洋保護區管理計畫之具體審議及檢討程序、第二項之公民參與及聽證辦理等相關辦法，由中央主管機關訂定，報請行政院核定後實施。","note":"一、按現行海洋保護區部分涉及其他有關機關權限，依海洋基本法第四條第一項規定「政府應統籌整合各目的事業主管機關涉海之權責，共同推展海洋事務。」爰第一項明定整體海洋保護區管理計畫應由中央主管機關應會商有關機關訂定，報請行政院核定後實施，並規範計畫內容應包括之事項。\n二、現行海洋保護區係由不同法律之主管機關所劃設，亟需整合規劃與執行，為避免海域規劃闕漏，爰於第四款針對整體海域進行完整調查。\n三、為強化已設立之海洋保護區成效，爰參酌美國海洋庇護區法（美國法典）第三○九條、日本生物多樣性基本法第二十二條等規定，明定第一項第七款海洋保護區之監測與第八款海洋保護區之檢討及成效評估。\n四、整體海洋保護區管理計畫應與時俱進，爰第二項參酌加拿大國家海洋保護區法第九條、我國濕地保育法第十九條及水下文化資產保護區劃設及管理辦法第十三條第三項等規定，明定實施後之檢討時機，海洋保護工作與在地居民切身相關，為確保利害關係人意見得以充分表述，爰於計畫規劃及檢討階段納入民間參與機制，確保保護區發展實效。"},{"bill":"202110027040000","text":"主管機關得依具下列情形之一，而有特別保存必要之一處海域或與其毗鄰之陸域，劃定為海洋庇護區，並得區分為核心區、緩衝區及永續利用區：\n一、海洋生態系統具原始性，或具生物多樣性，而有保存或供學術研究必要者。\n二、具有特殊之地形、地質現象或生態之海域。\n三、對特定生物數量、生命階段或棲地具特殊重要性之海域。\n四、具維持或促進海洋生態系統之碳匯功能者。\n五、其他符合保存目的者。","note":"一、參照聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等規定，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式。為加強保護海洋生物，爰參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法（Marine Reserves Act）第三條等規定，於第一項規範主管機關得就海洋生態系統有特別保護必要者，劃定為海洋庇護區。\n二、第一項亦參考國際自然保育組織（Internationl Union  for Conservatoin of Nature）建議，將海洋保護區分為「核心區、緩衝區與永續利用區」三種分區，以達到個分區適用之差異嚴格程度之規範，可使保護區的管理策略與相關人類活動更符合實際需要。\n三、第一項規定，參考《國家公園法》第八條、《文化資產保存法》第三條、韓國海洋生態法第二十五條等規定。"},{"bill":"202110027520000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設中央審議會，由專家學者、民間團體及有關機關代表組成，其中專家學者、民間團體及原住民等不具官方身分之代表，不得少於委員總人數三分之二。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，應由中央主管機關會同農業主管機關及原住民族主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體（包括海洋產業利害關係之團體等）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。又，原住民在這座島嶼已超過六千年以上，已經發展最適合臺灣的海洋保育跟利用模式，自當是最瞭解臺灣海養保育生態的專家學者。因此，明定原住民為審議會的當然委員，並且明定非官方身分的委員的總人數比例增加，確保其獨立性。\n四、海洋庇護區之劃定，勢必會影響目前漁業與當地原住民的權益。因此，要求相關要會同相關機關制訂相關規範。"},{"bill":"202110032170000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110033380000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110033420000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"}],"changed":true,"final":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、原住民、漁民團體、保育團體等民間團體及有關機關代表組成，其中不具官方身分之代表人數不得少於委員總人數二分之一，原住民及漁民團體之代表總人數，不得少於委員總人數三分之一。\n審議會之決議，以委員過半數之出席，出席委員超過三分之二同意行之。\n海洋庇護區之核心區劃定，致該區域之既有使用人遭受特別犧牲之損失者，應予補償。\n第一項海洋庇護區之劃定基準、變更、廢止程序、第二項審議會之設置、組成、運作與前項補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作能兼顧原住民、漁民團體、保育團體等民間團體（包括海洋產業利害關係之團體等）之權益，以及決策之專業性、獨立性及公正性，定明審議委員選任之專家學者、與團體代表比例。\n三、為使審議會之決議，周延慮及所有利害關係者之權益，爰於第三項定明審議會之決議方式為三分之二多數決。\n四、海洋庇護區劃設目標在於豐裕海洋資源量，惟倘因海洋庇護區之核心區劃定之限制影響既有使用人，遭受特別犧牲之損失時，仍能獲得補償，爰於第四項定明補償之法源。\n五、第五項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項，以及因海洋庇護區核心區劃定受有特別犧牲補償之辦法。此外，為落實公民參與，審議會授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為落實對原住民族權益之保障及配合國家性別平等政策，應於審議會設置辦法納入具原住民身分之成員或機關代表，及任一性別委員之比例，俾資周妥。","review":{"note":"修正通過","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。"}},{"no":"第九條","current":null,"versions":[{"bill":"201110005120000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110006490000","text":"具有下列情形之一者，主管機關應依最佳可得科學資訊原則及預警原則，劃設海洋庇護區：\n一、海洋生態系統有特別保護必要。\n二、具碳匯功能之海洋或沿岸生態系統。\n三、具國家或地方上獨特性或稀少性自然資源之海域。\n四、對物種之生命階段具特殊重要性之海域。\n五、對遭遇威脅、瀕危或衰退之物種具重要性之海域。\n六、物種或棲地具易受損性、脆弱性、敏感性或復原緩慢之海域。\n主管機關應定期普查，或接受個人、團體提報，符合前項之海域或包含陸地組成部分之海域。\n第一項海洋庇護區之劃設基準、變更、廢止與其程序及前項其他相關事項之辦法，由中央主管機關定之。","note":"一、參照聯合國海洋法公約及生物多樣性公約等規定，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式。為加強保護海洋生物，爰參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法等規定，於第一項規範主管機關得就海洋生態系統有特別保護必要者，劃定為海洋庇護區。\n二、參考「文化資產保護法」第七十九條；「海岸管理法」第十條、第十二條；「水下文化資產保護法」第十三條；CBD COP9第20號決議之附件一「識別公海水域及深海棲地中具有重要生態或生物意義之海域之科學準則」（https：//www.cbd.int/doc/decisions/cop-09/cop-09-dec-20-zh.pdf），明定第一項各款規範。\n三、主管機關應定期普查海域資訊，未免政府量能不足，加入公民提報程序，以利於蒐集完整海域資料。\n四、第三項明定海洋庇護區之劃設基準、變更、廢止與其程序及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110010660000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110012210000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國防安全及軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存及管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測及調查等活動。\n前項第四款申請同意之程序、應檢附之文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國防安全及軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存及管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測及調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110012640000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、基於核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，任何人及海陸域交通工具禁止進入海洋庇護區之核心區，但基於該項各款之事由，不在此限。\n二、第二項明定，以中央主管機關同意之科學研究、監測或調查等活動申請進入海洋庇護區之核心區者，其申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。"},{"bill":"202110013050000","text":"具有下列情形之一者，主管機關應依最佳可得科學資訊原則及預警原則，劃設海洋庇護區：\n一、海洋生態系統有特別保護必要。\n二、具碳匯功能之海洋或沿岸生態系統。\n三、具國家或地方上獨特性或稀少性自然資源之海域。\n四、對物種之生命階段具特殊重要性之海域。\n五、對遭遇威脅、瀕危或衰退之物種具重要性之海域。\n六、物種或棲地具易受損性、脆弱性、敏感性或復原緩慢之海域。\n主管機關應定期普查，或接受個人、團體提報，符合前項之海域或包含陸地組成部分之海域。\n第一項海洋庇護區之劃設基準、變更、廢止與其程序及前項其他相關事項之辦法，由中央主管機關定之。","note":"一、依據聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等相關規定，海洋保護區之劃設，係目前海洋環境保護、生物資源保育等重要可行方式。爰參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等規定，於第一項規範主管機關得就海洋生態系統有特別保護必要者，劃定為海洋庇護區，加強保護海洋生物。\n二、第一項各款參考「文化資產保護法」第七十九條；「海岸管理法」第十條、第十二條；「水下文化資產保護法」第十三條；CBD COP9第20號決議之附件一「識別公海水域及深海棲地中具有重要生態或生物意義之海域之科學準則」\n三、主管機關應定期普查海域資訊，為了避免政府量能不足，加入公民提報程序，有助於蒐集完整海域資料，建立完整海洋保護網。\n四、第三項明定海洋庇護區之劃設基準、變更、廢止與其程序及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110014110000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國防安全及軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存及管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測及調查等活動。\n前項第四款申請同意之程序、應檢附之文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、第一項明定海洋庇護區之核心區，除國防安全及軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存及管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測及調查等活動外，禁止進入。\n二、第二項授權由中央主管機關會商有關機關訂定辦法規範中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動。"},{"bill":"202110017340000","text":"中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區；涉及原住民族土地及海域者，應會同中央原住民族主管機關定之。\n中央主管機關為辦理前項業務，應設審議會，由專家學者、民間團體、與該庇護區所在海域有利害關係之團體及有關機關代表組成，其中專家學者、民間團體及與該庇護區所在水域有利害關係之團體等不具官方身分之代表人數不得少於委員總人數二分之一；涉及原住民族土地及海域者，原住民族代表不得少於前述不具官方身分之代表總人數二分之一。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，由中央主管機關定之。","note":"一、參酌聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式；且海洋生態具有連續性，難以縣市行政轄區切割，綜觀國際海洋保育發展趨勢，已由「物種保育」發展為以跨區域乃至跨國界之生態系統管理為基礎之「棲地保育」，為加強保護海洋生物，並考量海洋庇護區之劃設係就海洋生態系統有特別保護必要者為限，統由中央主管機關劃定為宜，且為減少法規規範競合之情形，參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等，爰於第一項定明中央主管機關得就海洋生態系統有特別保護必要，且未經其他主管機關劃設為海洋保護區者，劃定為海洋庇護區。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，俾確保劃定海洋庇護區之嚴謹及公正。另為確保審議會運作之獨立性及公正性，定明審議委員選任之外部專家學者、民間團體、有利害關係之團體（如漁會或原住民）代表比例，減少審議爭議。\n三、第三項授權中央主管機關訂定海洋庇護區之劃定基準、變更、廢止程序與審議會之設置、組成、運作及其他相關事項之辦法。為落實公民參與，授權辦法並將規範海洋庇護區審議之結果、陳情意見參採情形及其他有關資訊，得以網際網路或其他適當方法廣泛周知。另為配合國家性別平等政策，應於審議會設置辦法納入任一性別委員之比例，俾資周妥。"},{"bill":"202110017770000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110018570000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110018550000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國防安全及軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存及管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測及調查等活動。\n前項第四款申請同意之程序、應檢附之文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國防安全及軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存及管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測及調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110024910000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110025230000","text":"具有下列情形之一者，主管機關應依最佳可得科學資訊原則及預警原則，劃設海洋庇護區：\n一、海洋生態系統有特別保護必要。\n二、具碳匯功能之海洋或沿岸生態系統。\n三、具國家或地方上獨特性或稀少性自然資源之海域。\n四、對物種之生命階段具特殊重要性之海域。\n五、對遭遇威脅、瀕危或衰退之物種具重要性之海域。\n六、物種或棲地具易受損性、脆弱性、敏感性或復原緩慢之海域。\n主管機關應定期普查，或接受個人、團體提報，符合前項之海域或包含陸地組成部分之海域。\n第一項海洋庇護區之劃設基準、變更、廢止與其程序及前項其他相關事項之辦法，中央主管機關應每五年召開會議檢討之。","note":"一、參照聯合國海洋法公約第六十一條、第六十二條、第六十五條及生物多樣性公約第八條等規定，海洋保護區之劃設，目前咸認為係海洋環境保護、生物資源保育等重要可行方式。為加強保護海洋生物，爰參酌美國海洋庇護區法、加拿大國家海洋保護區法第四條、紐西蘭海洋保護區法第三條等規定，於第一項規範主管機關得就海洋生態系統有特別保護必要者，劃定為海洋庇護區。\n二、第一項各款參考「文化資產保護法」第七十九條；「海岸管理法」第十條、第十二條；「水下文化資產保護法」第十三條；CBD COP9第20號決議之附件一「識別公海水域及深海棲地中具有重要生態或生物意義之海域之科學準則」。\n三、因應極端氣候嚴峻，海洋藍碳作為最大碳匯，應同時肩負氣候變遷減緩及調適功能，故將第二項納入海洋庇護區，以保育及復育藍碳生態系。並賦予主管機關建立藍碳資源地圖義務，以作為海洋保護區劃設基礎。\n四、主管機關應定期普查海域資訊，為免政府量能不足，加入公民提報程序，有助於蒐集完整海域資料，建立完整海洋保護網。\n五、第三項明定海洋庇護區之劃設基準、變更、廢止與其程序及其他相關事項之辦法，中央主管機關應每定期召開會議檢討並做出調整。"},{"bill":"202110027040000","text":"主管機關公告劃定海洋庇護區前，應擬定計畫，公開展覽三十日及當地舉行公聽會；管理計畫應包含以下事項：\n一、劃定之分區範圍。\n二、劃定之目標、理由。\n三、計畫範圍海域之生態現況、調查。\n四、分區管理及保育措施。\n五、受計畫影響之利害關係人意見、人類活動與使用狀態及因應。\n六、相關機關、學界意見。\n七、其他有關事項。\n前項海洋庇護區之劃設計畫與公聽會之程序及前項相關事項之辦法，由中央主管機關定之。\n由地方主管機關劃定之海洋庇護區，報請中央主管機關核定後公告實施；由主管機關為之者，於核定後公告實施。\n中央主管機關應定期接受個人、團體提報，符合第一項之海域或與其毗鄰陸域。\n第一項海洋庇護區之設置涉及原住民族傳統利用者，主管機關應依原住民族基本法第十九條及二十一條諮商取得同意。\n海洋庇護區之變更或廢止之計畫、流程、提報等，適用第一項至第三項、第五項之規定。","note":"一、參酌美國海洋庇護區法第304條（a）、韓國海洋生態法第二十六條等規定，海洋庇護區之劃定、變更、廢止等應包含計畫之目標設定、監測、調查及成效評估。爰列舉應包含事項。\n二、第二項規定，參考濕地保育法第十條、韓國海洋生態法第二十六條規定。\n三、第三項、第四項規定加入地方主管機關、公民提報程序，有助於蒐集完整海域資料，建立完整海洋保護網，爰參酌濕地保育法第十四條、文化資產保存法第十四條與第十七條等規定。\n四、第五項規定要求劃定海洋庇護區，涉及原住民族者，主管機關應依原住民族基本法相關法規辦理。\n五、第六項規定海洋庇護區之變更（包含擴大或縮小）或廢止之流程適用相關規定。"},{"bill":"202110027520000","text":"地方主管機關就管轄範圍內為辦理前項業務，應設地方審議會，由地方政府首長或由委員互推一人兼任之，其中專家學者、民間團體及原住民等不具官方身分之代表，不得少於委員總人數三分之二。\n地方主管機關管轄範圍涉及當地原住民族海域範圍者，其原住民身分委員應由當地部落會議主席兼任之，但該部落尚未成立部落會議或部落會議主席出缺者，得由地方主管機關參照部落傳統慣俗指定適當人員擔任之。\n第一項海洋庇護區之劃定基準、變更、廢止程序與前項審議會之設置、組成、運作及其他相關事項之辦法，應由地方主管機關會同農業主管機關及原住民族主管機關定之。","note":"一、地方政府勢必比中央主管機關瞭解當地的海洋生態。據此，海洋庇護區範圍僅於一縣（市）行政範圍內或鄰近2縣（市）行政範圍內時，可由地方政府成立審議會，自行劃定當地的海洋庇護區最符合當地現況。\n二、又，在宜花東地區的原住民有上千年的海洋保育跟利用的智慧。據此，要求當地原住民為當然委員，並且要求該名委員必須是與當地部落有所聯結，才能夠清楚知悉當地海洋生態與保育措施，爰制訂本條。"},{"bill":"202110032170000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110033380000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110033420000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"}],"changed":true,"final":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。","finalWhy":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第八條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。","review":{"note":"照行政院提案通過","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。"}},{"no":"第十條","current":null,"versions":[{"bill":"201110005120000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110006490000","text":"中央主管機關應設立海洋庇護區審議委員會，應考量生態系統途徑及海洋永續發展，劃定海洋庇護區及擬訂海洋庇護區管理計畫等相關事項。\n海洋庇護區規劃階段，鄰近開發行為如有侵害海洋生態系統之虞，中央主管機關應命該行為暫緩執行。\n前項委員會之委員為無給職，其設置辦法由中央主管機關訂定之。其中專家學者、民間保育團體及原住民等不具官方身分之代表，不得少於委員總人數三分之二。\n第一項委員之組成、選任、海洋庇護區之劃定、及管理計畫之審議程序、公民陳述意見、回覆及聽證程序等相關辦法，由中央主管機關訂定之。","note":"一、第一項參考「水下文化資產保存法」及「野生動物保育法」設立海洋庇護區審議會。\n二、基於海洋增設海洋庇護區規劃階段時可能已有相關開發案，為及時保全應受保護海域，爰制定暫緩措施，避免海洋庇護區設立時目標保護之生態系統已然消滅。\n三、為確保審議委員會獨立性及公正性，爰於第三項明定審議委員選任應充分落實官方、民間代表比例均等，另於第四項明定審議委員會工作項目及程序。"},{"bill":"202110010660000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110012210000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。\n第一項之許可，經許可者應主動提供相關監測資料，主管機關應定期監測海域開放利用之情形，並公開相關資訊，如造成海域生態之具體危害，或可預見有危害之發生，必要時，主管機關應強制禁止該許可行為，或得廢棄該許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。\n三、定明許可後若致生危害之虞，主管機關得變更、廢棄許可。又為求海洋資訊公開，以加強風險評估，爰要求經許可者及主管機關應定期監測海域，並公開相關資訊。"},{"bill":"202110012640000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、第一項明定海洋庇護區之緩衝區內，禁止本項各款之行為，但符合第九條第一款或第二款之情形，不在此限。\n二、第二項明定第一項第一款或第二款，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。"},{"bill":"202110013050000","text":"中央主管機關應設立海洋庇護區審議委員會，應考量生態系統途徑及海洋永續發展，劃定海洋庇護區及擬訂海洋庇護區管理計畫等相關事項。\n海洋庇護區規劃階段，鄰近開發行為如有侵害海洋生態系統之虞，中央主管機關應命該行為暫緩執行。\n前項委員會之委員為無給職，其設置辦法由中央主管機關訂定之。其中專家學者、民間保育團體及原住民等不具官方身分之代表，不得少於委員總人數三分之二。\n第一項委員之組成、選任、海洋庇護區之劃定、及管理計畫之審議程序、公民陳述意見、回覆及聽證程序等相關辦法，由中央主管機關訂定之。","note":"一、第一項參考「水下文化資產保存法」第八條、「野生動物保育法」第五條設立海洋庇護區審議會，確保劃設之公正。\n二、基於海洋增設海洋庇護區規劃階段時或可有相關開發案，為及時保全應受保護海域，爰制定暫緩措施，避免海洋庇護區設立時欲保護之生態系統已然消滅。\n三、審議委員會為確保獨立及公正，減少其爭議，爰於第三項明定審議委員選任應充分落實官方、民間代表比例均等，並於第四項明定審議委員會工作項目、程序。"},{"bill":"202110014110000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、第一項明定非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項但書明定如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、於第二項明定水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。"},{"bill":"202110017340000","text":"中央主管機關劃定海洋庇護區後，應會商有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項海洋庇護區保育計畫，應載明下列事項：\n一、計畫範圍、目標及規劃圖。\n二、水資源系統、生態資源系統與環境之基礎調查及分析。\n三、分區規劃及維護管理之規定或措施。\n四、財務與人力實施計畫。\n五、其他相關事項。\n本條第一項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法之規定辦理。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第九條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。\n二、參酌濕地保育法與農委會野生動物保護區計畫規定，明定海洋庇護區保育計畫應載明之事項。\n三、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n四、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域，併予敘明。"},{"bill":"202110017770000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國防安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國防安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110018570000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110018550000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為減少漁民之困擾，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110024910000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110025230000","text":"中央主管機關應設立海洋庇護區審議委員會，應考量生態系統途徑及海洋永續發展，劃定海洋庇護區及擬訂海洋庇護區管理計畫等相關事項。\n海洋庇護區規劃階段，鄰近開發行為如有侵害海洋生態系統之虞，中央主管機關得令其暫緩執行。\n第一項委員會之委員為無給職，其設置辦法由中央主管機關訂定之。其中專家學者、民間保育團體及原住民等不具官方身分之代表，不得少於委員總人數三分之二。\n第一項委員之組成、選任、海洋庇護區之劃定、及管理計畫之審議程序、公民陳述意見、回覆及聽證程序等相關辦法，由中央主管機關訂定之。","note":"一、第一項參考「水下文化資產保存法」第八條、「野生動物保育法」第五條設立海洋庇護區審議會，確保劃設公正性。\n二、基於海洋增設海洋庇護區規劃階段時可能已有相關開發案，為及時保全應受保護海域，爰制定暫緩措施，避免海洋庇護區設立時目標保護之生態系統已然消滅。\n三、審議委員會為確保獨立性及公正性，爰於第三項明定審議委員選任應充分落實官方、民間代表比例均等，減少審議爭議，另於第四項明定審議委員會工作項目及程序。"},{"bill":"202110027040000","text":"任何人、海陸域交通工具禁止進入海洋庇護區之核心區並從事活動。但有下列情形之一者，不在此限：\n一、國防安全及軍事目的。\n二、海域海岸巡防、因應重大公共安全、犯罪查緝、漁業巡護、緊急污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存及管理等公務目的。\n三、外國船舶依中華民國領海及鄰接區法第七條第一項第五款規定。\n四、其他經中央主管機關同意之科學研究、監測及調查等活動。","note":"為保育海洋生物、維持海洋生物多樣性、有效分區規範海洋庇護區，明文規範海洋庇護區內原則禁止從事活動；另參酌海洋污染防制法第十四條、水下文化資產保存法第三十一條，為避免妨礙國防或公共安全需要，或允許船舶自由無害航行，經相關經機關許可認定有學術研究必要等活動，爰明確列舉不受限制之項目。"},{"bill":"202110027520000","text":"中央主管機關劃定海洋庇護區後，應會同原住民族中央主管機關及其他有關機關，擬訂海洋庇護區保育計畫，並公開展覽三十日及舉行公聽會；其變更或廢止時，亦同。\n前項公開展覽與公聽會之日期及地點，應登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。人民、法人或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向中央主管機關提出意見。\n中央主管機關應於公告實施海洋庇護區保育計畫後，將計畫登載於政府公報、新聞紙、網際網路或以其他適當方法廣泛周知。\n第一項海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應會同原住民族主管機關擬訂；涉及限制原住民族利用原住民族土地、海域及自然資源時，審議前擬訂機關應與當地原住民族或部落諮商，並取得其同意。\n因劃定海洋庇護區而當地原住民族受限制所生之損失，應由中央主管機關寬列預算補償。\n前項之補償機制及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、為透過採取各種海洋保育措施，達成海洋生態系平衡及生物多樣性之目標，中央主管機關依第七條劃定海洋庇護區後，即應按照個別海洋庇護區之條件，擬訂保育計畫，並循公開展覽、舉行公聽會及公告實施等程序，俾落實各該庇護區之管理及推動各項保育措施。並且海洋庇護區保育計畫的制訂，同樣也會影響到當地人民的權利。因此，要求會同各相關部會，才能依據現況做最適宜的調整。\n二、為強化民眾參與機制，參酌海岸管理法第十六條第一項，於第一項及第二項定明海洋庇護區保育計畫擬訂之公開展覽、舉行公聽會及資訊公開等程序，並參酌海岸管理法第十六條第三項及濕地保育法第十八條，於第三項定明計畫公告實施後之資訊公開程序，俾資周妥。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，於第四項定明海洋庇護區保育計畫之擬訂，涉及原住民族土地及海域者，中央主管機關應依原住民族基本法規定辦理；又所定原住民族海域，指原住民族基本法第十九條第一項序文及第二項所定經中央原住民族主管機關公告之海域。\n四、為確保海洋委員會會遵照原基法的要求，保障原住民族的權利。因此，將遵守原基法的條文跟程序列明：(1)相關計畫擬定，要會同原民會。(2)涉及原民土地海域權利，要諮商取得同意。(3)原住民族受限制所生之損失，必須要由海洋委員會先編列預算跟規範補償模式。併予敘明。"},{"bill":"202110032170000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110033380000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110033420000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"}],"changed":true,"final":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","finalWhy":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。","review":{"note":"照行政院提案通過","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。"}},{"no":"第十一條","current":null,"versions":[{"bill":"201110005120000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110006490000","text":"主管機關劃定海洋庇護區、擬訂海洋庇護區管理計畫，應召開海洋庇護區審議會，並公開展覽三十日及舉行聽證會；海洋庇護區之變更或廢止，亦同。\n前項公開展覽及聽證會之日期及地點，登載於政府公報、新聞紙及網際網路，或以其他適當方法廣泛周知；任何人民或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向主管機關提出意見，主管機關應具體回覆。\n海洋庇護區之劃定、變更或廢止由地方主管機關為之者，應報請中央主管機關核定後公告實施；由中央主管機關為之者，於核定後公告實施。\n第一項海洋庇護區管理計畫之擬訂，涉及限制原住民族或部落傳統利用者，應於計畫規劃階段，邀集相關原住民族或部落代表參與擬訂，會同原住民族主管機關公告之。","note":"一、參考紐西蘭海洋保護區法及美國海洋庇護區法，明定海洋保護區之公告程序。\n二、為強化民眾參與機制及落實公開審議功能，爰參考「水下文化資產保存法」設水下文化資產審議會、「濕地保育法」設審議小組、「野生動物保育法」設野生動物保育諮詢委員會，就各該法規所設保護區之劃設皆設置相關委員會、審議小組審酌劃設範圍、劃設範圍等。本法所規範海洋庇護區劃設後基於保育目的勢必影響原在該海域的活動，是以就海洋庇護區之劃設應設立審議會匯集有關機關意見劃設之。另公開展覽30日乃參考都市計畫法。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，第四項明定海洋庇護區保育計畫涉及限制原住民族利用者，應保障原住民族權益。"},{"bill":"202110010660000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110012210000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。\n前項之許可，主管機關應定期監測海域開放利用之情形，如造成海域生態之具體危害，或可預見有危害之發生，必要時，主管機關應強制禁止該許可行為，或得廢棄該許可。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110012640000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"本條明定海洋庇護區之永續利用區內，禁止本項各款之行為。但但符合第九條第一項但書第一款或第二款情形者，不在此限。"},{"bill":"202110013050000","text":"主管機關劃定海洋庇護區、擬訂海洋庇護區管理計畫，應召開海洋庇護區審議會，並公開展覽三十日及舉行聽證會；海洋庇護區之變更或廢止，亦同。\n前項公開展覽及聽證會之日期及地點，登載於政府公報、新聞紙及網際網路，或以其他適當方法廣泛周知；任何人民或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向主管機關提出意見，主管機關應具體回覆。\n海洋庇護區之劃定、變更或廢止由地方主管機關為之者，應報請中央主管機關核定後公告實施；由中央主管機關為之者，於核定後公告實施。\n第一項海洋庇護區管理計畫之擬訂，涉及限制原住民族或部落傳統利用者，應於計畫規劃階段，邀集相關原住民族或部落代表參與擬訂，會同原住民族主管機關公告之。","note":"一、海洋保護區設立應有公告程序，參考紐西蘭海洋保護區法第五條、美國海洋庇護區法（美國法典）第三○四條，均規範海洋保護區之公告程序。\n二、為強化民眾參與機制及落實公開審議功能，爰參考「水下文化資產保存法」設水下文化資產審議會、「濕地保育法」設審議小組、「野生動物保育法」設野生動物保育諮詢委員會，就各該法規所設保護區之劃設皆設置相關委員會、審議小組審酌劃設範圍等。本法所規範海洋庇護區劃設後基於保育目的勢必影響原在該海域的活動，是以就海洋庇護區之劃設應設立審議會匯集有關機關意見劃設之。另公開展覽30日乃參考都市計畫法。\n三、原住民族目前傳統領域尚未公告實施，為避免法案尚未通過導致傳統領域遭受侵犯，應充分知會原住民族主管機關並實質參與討論，爰於第四項明定海洋庇護區保育計畫涉及限制原住民族利用者，應保障原住民族權益。"},{"bill":"202110014110000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"明定於海洋永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於但書明定如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110017340000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n五、臺灣原住民族基於其傳統文化、祭儀，已於該海域獵捕、宰殺或利用海洋生物之事實。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會商有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，經中央主管機關同意之科學研究、監測或調查等活動，或臺灣原住民族基於其傳統文化、祭儀等理由從事相關非營利型為外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，爰於第二項授權由中央主管機關會商有關機關訂定辦法規範。"},{"bill":"202110017770000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n六、能量或物質排放。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物、開挖、濬深航道或施作海洋工程，以及物質排放等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110018570000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110018550000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110024910000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110025230000","text":"主管機關劃定海洋庇護區、擬訂海洋庇護區管理計畫，應召開海洋庇護區審議會，並公開展覽三十日及舉行聽證會；海洋庇護區之變更或廢止，亦同。\n前項公開展覽及聽證會之日期及地點，登載於政府公報、新聞紙及網際網路，或以其他適當方法廣泛周知；任何人民或團體得於公開展覽期間內，以書面載明姓名或名稱及地址，向主管機關提出意見，主管機關應限期回覆。\n海洋庇護區之劃定、變更或廢止由地方主管機關為之者，應報請中央主管機關核定後公告實施；由中央主管機關為之者，於核定後公告實施。\n第一項海洋庇護區管理計畫之擬訂，涉及限制原住民族或部落傳統利用者，應於計畫規劃階段，邀集相關原住民族或部落代表參與擬訂，應包含共同管理機制，會同原住民族主管機關公告之。","note":"一、海洋保護區設立應有公告程序，參考紐西蘭海洋保護區法第五條、美國海洋庇護區法（美國法典）第三○四條，均規範海洋保護區之公告程序。\n二、為強化民眾參與機制及落實公開審議功能，爰參考「水下文化資產保存法」設水下文化資產審議會、「濕地保育法」設審議小組、「野生動物保育法」設野生動物保育諮詢委員會，就各該法規所設保護區之劃設皆設置相關委員會、審議小組審酌劃設範圍等。本法所規範海洋庇護區劃設後基於保育目的勢必影響原在該海域的活動，是以就海洋庇護區之劃設應設立審議會匯集有關機關意見劃設之。另公開展覽30日乃參考都市計畫法。\n三、為兼顧海洋保育與尊重原住民族海域使用的傳統，第四項明定海洋庇護區保育計畫涉及限制原住民族利用者，應保障原住民族權益。原住民族目前傳統領域尚未公告實施，為避免法案尚未通過導致傳統領域遭受侵犯，應充分知會原住民族主管機關並實質參與討論。"},{"bill":"202110027040000","text":"海洋庇護區之緩衝區內，禁止從事下列行為及活動：\n一、水產養殖。\n二、營利性採捕海洋生物。\n三、觀光休閒活動。\n四、開挖、濬深航道或施作海洋工程。\n五、鋪設電纜、管道、設施或結構。\n六、從事探礦或採礦。\n七、其他經中央主管機關公告禁止行為。\n前項第一款及第二款行為，經主管機關會同漁業主管機關許可者，不在此限；前項第三款至第七款，經主管機關會同目的事業主管機關許可者，不在此限。\n第一項第一款及第二款行為，得由主管機關會同漁業主管機關公告一定種類、數量、方式、範圍或期間等條件代之。","note":"一、緩衝區位於核心區外圍，隔離外界與核心區，以減少外在環境對於核心區之影響。明列禁止，以減少人為活動對緩衝區及核心區之影響。\n二、為提高緩衝區管理之彈性，以適應各地區實際情形，在不影響環境保護目標下，爰明定第二項、第三項主管機關得會同相關機關，建立相關調適機制。"},{"bill":"202110027520000","text":"任何人及海陸域交通工具禁止進入海洋庇護區之核心區。但有下列情形之一者，不在此限：\n一、國家安全或軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的。\n三、船舶連續不停迅速通過，且未從事航行以外之活動。\n四、經中央主管機關同意之科學研究、監測或調查等活動。\n前項第四款申請同意之程序、應檢附文件、審議作業、廢止同意及其他相關事項之辦法，由中央主管機關會同原住民族中央主管機關及其他有關機關定之。","note":"一、核心區為受保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰於第一項定明海洋庇護區之核心區，除國家安全或軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、水下文化資產之保存或管理等公務目的、船舶連續不停迅速通過且未從事航行以外之活動，或經中央主管機關同意之科學研究、監測或調查等活動外，禁止進入。\n二、為利中央主管機關審查依第一項第四款申請科學研究、監測及調查等活動，並考量原住民族有上千年的海洋保育智慧。因此，相關區域的劃定，有利於精確劃設區域範圍。爰於第二項授權由中央主管機關會同原住民族中央主管機關及有關機關訂定辦法規範。"},{"bill":"202110032170000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110033380000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110033420000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"}],"changed":true,"final":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","finalWhy":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第十條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。","review":{"note":"照行政院提案通過","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第十條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。"}},{"no":"第十二條","current":null,"versions":[{"bill":"201110005120000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110006490000","text":"海洋庇護區管理計畫應於海洋庇護區公告前制定完成，其計畫內容應包括下列事項：\n一、計畫範圍。\n二、計畫目標。\n三、海域現況調查。\n四、分區規劃及保（復）育措施。\n五、海洋庇護區之監測。\n六、海洋庇護區之檢討及成效評估。\n七、其他與海洋庇護區管理有關之事項。\n前項海洋庇護區管理計畫，應每五年至少檢討一次，並作必要之變更。","note":"參酌美國海洋庇護區法訂定第一項，海洋庇護區管理計畫應包含完整之計畫目標設定、監測、調查及成效評估，並明確列舉應包括事項。"},{"bill":"202110010660000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110012210000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110012640000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"本條明定第十條與第十一條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。"},{"bill":"202110013050000","text":"海洋庇護區管理計畫應於海洋庇護區公告前制定完成，其計畫內容應包括下列事項：\n一、計畫範圍。\n二、計畫目標。\n三、海域現況調查。\n四、分區規劃及保（復）育措施。\n五、海洋庇護區之監測。\n六、海洋庇護區之檢討及成效評估。\n七、其他與海洋庇護區管理有關之事項。\n前項海洋庇護區管理計畫，應每五年至少檢討一次，並作必要之變更。","note":"依據美國海洋庇護區法第三○四條（a），海洋庇護區管理計畫應包含完整之計畫目標設定、監測、調查及成效評估。為確保海洋庇護區管理計畫之成效符合保育目標，因此明確列舉應包括事項。"},{"bill":"202110014110000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"明定第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110017340000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款、第二款或第五款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第十一條第一項但書第一款、第二款或第五款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110017770000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第十二條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110018570000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110018550000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110024910000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110025230000","text":"海洋庇護區管理計畫應於海洋庇護區公告前制定完成，其計畫內容應包括下列事項：\n一、計畫範圍。\n二、計畫目標。\n三、海域現況調查。\n四、分區規劃及保（復）育措施。\n五、海洋庇護區之監測。\n六、海洋庇護區之檢討及成效評估。\n七、其他與海洋庇護區管理有關之事項。\n前項海洋庇護區管理計畫，應每五年至少檢討一次，並作必要之變更。","note":"一、參酌美國海洋庇護區法第三○四條（a），海洋庇護區管理計畫應包含完整之計畫目標設定、監測、調查及成效評估。為確保海洋庇護區管理計畫之成效符合保育目標，因此明確列舉應包括事項。\n二、另參酌美國海洋庇護區法第三○九條，明定第一項第五款海洋庇護區之監測與第六款海洋庇護區之檢討及成效評估。"},{"bill":"202110027040000","text":"海洋庇護區之永續利用區內，禁止從事下列行為：\n一、破壞性漁撈。\n二、開挖、濬深航道或施作海洋工程。\n三、鋪設電纜、管道、設施或結構。\n四、從事探礦或採礦。\n五、其他經中央主管機關公告禁止之行為。\n前項第一款破壞性漁撈之項目及類型，由中央主管機關會同漁業主管機關公告之；前項第二款至第五款所列禁止行為，經中央主管機關會同目的事業主管機關許可者，不在此限。","note":"一、永續利用區位於緩衝區外圍，用以維護保育對象之生存與繁衍，並促進鄰近地區之居民之生存發展。因此，對於人類活動之限制，相對緩衝區較為寬鬆，爰將禁止活動，明列於第一項。\n二、為提高緩衝區管理之彈性，以適應各地區實際情形，在不影響環境保護目標下，爰明定第二項，主管機關得會同相關機關，建立相關調適機制。"},{"bill":"202110027520000","text":"海洋庇護區之緩衝區內，非經中央主管機關許可，禁止從事下列行為。但符合前條第一項但書第一款或第二款情形者，不在此限：\n一、水產養殖。\n二、採捕海洋生物。\n三、開挖、濬深航道或施作海洋工程。\n四、鋪設電纜、管道、設施或結構。\n五、從事探礦或採礦。\n從事前項第一款或第二款行為，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可。","note":"一、緩衝區隔離外界與核心區，用以減少外在環境對核心區之影響，爰於第一項定明非經中央主管機關許可，禁止從事水產養殖、採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為；惟為期明確並符合實際需要，第一項序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。\n二、為簡政便民，爰於第二項定明水產養殖、採捕海洋生物，符合中央主管機關公告之一定種類、數量、方式、範圍或期間等條件者，免申請許可，俾利實務運作。"},{"bill":"202110032170000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110033380000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110033420000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"}],"changed":true,"final":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第十條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","finalWhy":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第十條第一項但書第一款或第二款所列情形者，不在禁止之列。","review":{"note":"照行政院提案通過","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第十三條","current":null,"versions":[{"bill":"201110005120000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"},{"bill":"202110006490000","text":"海洋庇護區之核心區禁止進入並從事活動。但有下列情形之一者，不在此限：\n一、國防安全及軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、外來種移除、水下文化資產之保存及管理等公務目的。\n三、外國船舶依中華民國領海及鄰接區法第七條規定無害通過我國領海。\n四、經中央主管機關同意之科學研究、監測、調查等活動。","note":"一、核心區相關規範參酌IUCN類別（Ia）嚴格自然保留區。\n二、為保護核心區海洋生物不任意受到人為外力影響或干擾，爰明定海洋庇護區之核心區，除國防安全及軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、海洋保育、水下文化資產之保存及管理等公務目的，外國船舶無害通過或經中央主管機關同意之科學研究、監測與調查等活動外，禁止進入並從事活動。\n三、核心區內雖不應人為干擾，但遭受外來種入侵可能造成生態浩劫，移除外來種有助於原生生態存續。"},{"bill":"202110010660000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"},{"bill":"202110012210000","text":"為保育海洋生物，主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物，為使中央及直轄市、縣（市）主管機關得因地制宜，加強保育海洋生物，爰於第一項定明主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"},{"bill":"202110012640000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、第一項明定為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告本項各款之事項。\n二、第二項明定中央主管機關辦理第一項業務，準用第七條第二項規定。"},{"bill":"202110013050000","text":"海洋庇護區之核心區禁止進入並從事活動。但有下列情形之一者，不在此限：\n一、國防安全及軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、外來種移除、水下文化資產之保存及管理等公務目的。\n三、外國船舶依中華民國領海及鄰接區法第七條規定無害通過我國領海。\n四、經中央主管機關同意之科學研究、監測、調查等活動。","note":"一、核心區相關規範參酌IUCN類別（Ia）嚴格自然保留區。\n二、為保護之海洋生物主要生存、棲息、繁衍及族群最集中區域，為保護核心區海洋生物不任意受到人為外力影響或干擾，爰明定海洋庇護區之核心區，除國防安全及軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、海洋保育、水下文化資產之保存及管理等公務目的，外國船舶無害通過或經中央主管機關同意之科學研究、監測與調查等活動外，禁止進入並從事活動。\n三、核心區內雖不應人為干擾，但遭受外來種入侵仍可能持續造成生態浩劫，移除外來種將有助於原生生態存續。"},{"bill":"202110014110000","text":"為保育海洋生物，主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物，爰於第一項明定主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、第二項明定中央主管機關辦理第一項業務，準用第七條之審議程序，以確保獨立性及公正性。"},{"bill":"202110017340000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第十一條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110017770000","text":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","note":"基於法律保留原則，第十條及第十一條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。"},{"bill":"202110018570000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"},{"bill":"202110018550000","text":"為保育海洋生物，主管機關應會商目的事業主管機關，並經審議會審議，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n前項審議會之委員為無給職，其設置辦法由中央主管機關訂之。其中專家學者、民間團體、法人及原住民等不具官方身分之代表，不得少於委員總人數二分之一。\n第一項審議會之職掌、組成、利益迴避等相關事項之辦法，由中央主管機關定之。\n直轄市、縣（市）主管機關依第一項規定公告前，應報請中央主管機關核定之。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物，為使中央及直轄市、縣（市）主管機關得因地制宜，加強保育海洋生物，爰於第一項定明主管機關得公告相關限制、禁止或應遵行事項。為強化民間參與及落實公開審議功能，並廣納各方之意見，爰公告前，主管機關應經審議會審議，以利海洋生物保育措施之順利推動。\n二、參酌文化資產保存法第六條第一項、水下文化資產保存法第八條第一項、國家公園法第四條、都市計畫法第七十四條、濕地保育法第七條等有關主管機關成立相關審議會或審議小組審議劃設保護區之機制，於第二項定明中央主管機關應設立審議會審議，確保公告事項之嚴謹及公正。\n三、審議委員選任應兼顧各方之代表性及均衡性，其中相關民間團體代表應包括但不限於從事海洋保育之民間團體、相關法人代表應包括但不限於全國漁會及相關區漁會。\n四、為確保審議會運作之獨立性及公正性，爰於第二項後段定明審議委員選任不具官方身份代表之比例，以減少審議爭議。\n五、第四項參照漁業法第四十四條規定，定明直轄市、縣（市）主管機關辦理公告前應踐行之程序。"},{"bill":"202110024910000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"},{"bill":"202110025230000","text":"海洋庇護區之核心區禁止進入。但有下列情形之一者，不在此限：\n一、國防安全及軍事目的。\n二、海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、航路標識設置管理、海洋保育、外來種移除、水下文化資產之保存及管理等公務目的。\n三、外國船舶依中華民國領海及鄰接區法第七條規定無害通過我國領海。\n四、經中央主管機關同意之科學研究、監測、調查等活動。","note":"一、核心區相關規範參酌IUCN類別（Ia）嚴格自然保留區。\n二、為保護核心區海洋生物不受人為外力影響或干擾，爰明定海洋庇護區之核心區，除國防安全及軍事目的，海域巡防、犯罪查緝、漁業巡護、污染防治、海難救助、海洋保育、水下文化資產之保存及管理等公務目的，外國船舶無害通過或經中央主管機關同意之科學研究、監測與調查等活動外，禁止進入並從事活動。\n三、核心區內雖不應人為干擾，但遭受外來種入侵仍可能持續造成生態浩劫，移除外來種將有助於原生生態存續。"},{"bill":"202110027040000","text":"第十一條及第十二條許可取得者，應依規定蒐集、建置、保存及公佈海洋相關資料，主管機關認有破壞海洋之虞，得隨時查核或調閱資料；相關人員不得妨礙、拒絕或規避；必要時，主管機關得變更、廢止該許可。\n前項處理資料之方式，由中央主管機關定之。\n第十一條至第十二條許可取得之條件、程序、收費標準及相關事項，由中央主管機關定之。","note":"一、為有效管理於緩衝區、永續利用區，經許可、進入相關分區之人為活動能遵守永續原則，並確保相關活動產生無法預期對環境影響，明定第一項相關規定，另明定主管機關得變更、廢止例外許可。\n二、第二項授權中央主管機關訂定相關許可取得之程序及配套。"},{"bill":"202110027520000","text":"海洋庇護區之永續利用區內，非經中央主管機關許可，禁止從事下列行為。但符合第九條第一項但書第一款或第二款情形者，不在此限：\n一、開挖、濬深航道或施作海洋工程。\n二、鋪設電纜、管道、設施或結構。\n三、從事探礦或採礦。","note":"一、永續利用區用以維護保育對象之生存、繁衍，並促進鄰近地區居民之生存發展。因此，對於人為活動之限制，相對於緩衝區較為寬鬆。\n二、考量海洋生物資源永續利用，永續利用區內容許較大限度之環境開發活動，惟開挖、濬深航道或施作海洋工程，鋪設電纜、管道、設施或結構，以及從事探礦或採礦等行為，仍應經中央主管機關許可，始得為之；另為期明確並符合實際需要，於序文但書定明如該行為符合第九條第一項但書第一款或第二款所列情形者，不在禁止之列。"},{"bill":"202110032170000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"},{"bill":"202110033380000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"},{"bill":"202110033420000","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第七條第二項規定。","note":"一、海洋遊憩、休閒活動、船舶航行及於海洋使用採捕器具等人為活動，均可能影響海洋生物。考量本法朝向以區域及生態系為基礎之「棲地保育」，強化規範形塑生態廊道或減緩人為衝擊，與第五條各類海洋保護區及其他有效保育措施之區域串連形成生態網絡，擴大海洋生物保育等；且以生態系統為考量之海洋保育禁限制事項，其空間往往涵蓋數直轄市、縣（市）毗鄰海域，宜由中央主管機關統合規範，爰為加強保育海洋生物，於第一項定明中央主管機關得公告相關限制、禁止或應遵行事項。惟為避免發生與其他機關管轄權限競合或衝突，公告前應會商其他目的事業主管機關，以利海洋生物保育措施之順利推動。\n二、為確保獨立性及公正性，於第二項定明中央主管機關辦理第一項業務，準用第七條第二項應經審議會審議之規定。"}],"changed":true,"final":"前二條申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"基於法律保留原則，第十一條及第十二條所定海洋庇護區之緩衝區及永續利用區之申請許可之條件、作業程序、廢止許可及其他相關事項之辦法，授權中央主管機關定之。","review":{"note":"照行政院提案通過","text":"為保育海洋生物，中央主管機關應會商其他目的事業主管機關，公告下列事項：\n一、海洋遊憩或休閒活動之限制、禁止或其他應遵行事項。\n二、船舶海上航行、活動或作業之限制、禁止或其他應遵行事項。\n三、於海洋使用採捕器具之限制、禁止或其他應遵行事項。\n四、其他與保育海洋生物有關之人為活動之限制、禁止或其他應遵行事項。\n中央主管機關辦理前項業務，準用第八條第二項規定。"}},{"no":"第十四條","current":null,"versions":[{"bill":"201110005120000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110006490000","text":"海洋庇護區之緩衝區內，禁止從事下列行為：\n一、水產養殖。\n二、營利性採捕海洋生物。\n三、破壞性漁撈。\n四、開挖、濬深航道或施作海洋工程。\n五、鋪設電纜、管道、設施或結構。\n六、從事探礦或採礦。\n七、能量或物質排放。\n八、其他經中央主管機關公告禁止行為。\n前項第一款及第二款所列禁止行為，得依最佳可得科學資訊，考量生態系統途徑、累積效應，並出具生態補償及友善開發生態資料，經主管機關會同漁業主管機關許可者，不在此限；同項第四款至第八款所列禁止行為，經中央主管機關會同目的事業主管機關許可者，不在此限。\n前項之許可，經許可者應主動提供相關監測資料，主管機關應定期監測海域開放利用之情形，並公開相關資訊，如造成海域生態之具體危害，或可預見有危害之發生，必要時，主管機關應強制禁止該許可行為，或得廢止該許可。\n第一項之水產養殖、營利性採捕海洋生物之處分，得由中央主管機關會同漁業主管機關公告一定種類、數量、方式、範圍或期間等條件代之。\n第一項所稱之破壞性漁撈項目及類型，由中央主管機關會同漁業主管機關公告之。","note":"一、緩衝區除用以隔離外界與核心區，用以減少外在環境對核心區之影響，亦有可能具有高度價值，爰第一項明定禁止從事之行為。\n二、第一項第二款「營利」一詞，參照教育部重編國語辭典修訂本之釋義為「謀求利潤」，依其反面解釋，倘非以營利為目的而從事採捕海洋生物，僅供自用或餽贈親友等情形，不在禁止之列。\n三、緩衝區內經主管機關許可，仍基於不影響保護目標下，得從事一定必要之活動，包括水產養殖、營利性採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為，爰以第二項明定開發前提。\n四、為確保海洋資源利用符合永續原則，經許可應主動提供相關資料，作為科學研究，另數據之使用應符合個人資料保護法相關使用原則。\n五、第四項及第五項明定有關主管機關許可水產養殖、營利性採捕海洋生物、破壞性漁撈之定義及處分，得以公告代之，俾利實務運作。\n六、限定例外許可須檢具合理之生態補償措施及配套機制，使得報請中央主管機關及目的事業主管機關許可，又許可後若致生危害之虞，主管機關得變更、廢止許可。"},{"bill":"202110010660000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知未能送達時，得以公告方式為之。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110012210000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先通知公、私有土地、處所或海域之所有人、使用人或管理人；通知無法送達時，得以公告方式為之。\n調查機關（構）、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保育措施，致公、私有土地、處所或海域之所有人、使用人，遭受特別犧牲之損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償條件、補償基準及其他相關事項之辦法，由中央主管機關定之。","note":"為執行海洋生物保育措施或海洋庇護區保育計畫，主管機關或受託機關（構）、團體必要時得派員進入公、私有土地、處所或海域進行調查，參酌日本海洋生物資源保存及管理法第十八條、我國區域計畫法第十四條、都市計畫法第二十九條及野生動物保育法第十二條等，訂定第一項至第六項，以為規範。"},{"bill":"202110012640000","text":"為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人、團體得派員出示證明文件，進入公、私有土地、處所或海域進行調查及實施保育措施；其涉及軍事機密者，應會同該管軍事機關為之。\n前項情形，公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕。\n進行第一項調查或實施各項保育措施，遇設有圍障之土地或實施各項保育措施時，主管機關應事先將通知書送達公、私有土地、處所或海域之所有人、使用人或管理人。\n調查機關（構）、法人、團體或保育人員，對於受檢之工商軍事秘密，應予保密。\n為進行第一項調查或實施各項保措施，致公、私有土地、處所或海域之所有人、使用人遭受損失者，應予補償。\n進行第一項調查或實施各項保育措施之方式、通知、補償之條件、基準及其他相關事項之辦法，由中央主管機關定之。","note":"本條明定為執行海洋生物資源調查或海洋庇護區保育計畫，主管機關或受託機關（構）、法人，進入公、私有土地、處所或海域。其他各項明定進行執行調查或執行庇護計畫之方式，包含公、私有土地、處所或海域之所有人、使用人或管理人不得規避、妨礙或拒絕；進行執行調查或執行庇護計畫，應先通知。通知未能送達時，得以公告方式為之；對於受檢之工商軍事秘密，應予保密；對公、私有土地、處所或海域之所有人、使用人遭受損失者，應予補償；執行調查或執行庇護計畫之方式、通知、補償之條件、基準及其他相關事項，由中央主管機關定之。"},{"bill":"202110013050000","text":"海洋庇護區之緩衝區內，禁止從事下列行為：\n一、水產養殖。\n二、營利性採捕海洋生物。\n三、破壞性漁撈。\n四、開挖、濬深航道或施作海洋工程。\n五、鋪設電纜、管道、設施或結構。\n六、從事探礦或採礦。\n七、能量或物質排放。\n八、其他經中央主管機關公告禁止行為。\n前項第一款及第二款所列禁止行為，得依最佳可得科學資訊，考量生態系統途徑、累積效應，並出具生態補償及友善開發生態資料，經主管機關會同漁業主管機關許可者，不在此限；同項第四款至第八款所列禁止行為，經中央主管機關會同目的事業主管機關許可者，不在此限。\n前項之許可，經許可者應主動提供相關監測資料，主管機關應定期監測海域開放利用之情形，並公開相關資訊，如造成海域生態之具體危害，或可預見有危害之發生，必要時，主管機關應強制禁止該許可行為，或得廢棄該許可。\n第一項之水產養殖、營利性採捕海洋生物之處分，得由中央主管機關會同漁業主管機關公告一定種類、數量、方式、範圍或期間等條件代之。\n第一項所稱之破壞性漁撈項目及類型，由中央主管機關會同漁業主管機關公告之。","note":"一、緩衝區除用以隔離外界與核心區、減少外在環境對核心區之影響，亦有可能具有高度價值，爰於第一項明定禁止從事之行為。\n二、第一項第二款「營利」一詞，參照教育部重編國語辭典修訂本之釋義為「謀求利潤」，依其反面解釋，倘非以營利為目的而從事採捕海洋生物，僅供自用或餽贈親友等情形，不在禁止之列。\n三、依據我國海洋基本法第十三條：「政府應本生態系統為基礎之方法，優先保護自然海岸、景觀、重要海洋生物棲息地、特殊與瀕危物種、脆弱敏感區域、水下文化資產等，保全海洋生物多樣性，訂定相關保存、保育、保護政策與計畫，採取衝擊減輕措施、生態補償或其他開發替代方案，劃設海洋保護區，致力復原海洋生態系統及自然關聯脈絡，並保障原有海域使用者權益。」爰規定緩衝區內經主管機關許可，仍基於不影響保護目標下，得從事一定必要之活動，包括水產養殖、營利性採捕海洋生物，以及開挖、濬深航道或施作海洋工程等有限度之開發利用行為，爰以第二項明定開發前提。\n四、為確保海洋資源利用符合永續原則，經許可應主動提供相關資料，作為科學研究，另數據之使用應符合個人資料保護法相關使用原則。\n五、第四項及第五項明定有關主管機關許可水產養殖、營利性採捕海洋生物、破壞性漁撈之定義及處分，得以公告代之，俾利實務運作。\n六、限定例外許可須檢具合理之生態補償措施及配套機制，使得報請中央主管機關及目的事業主管機關許可，又許可後若致生危害之虞，主管機關得變更、廢棄許可。"},{"bill":"202
