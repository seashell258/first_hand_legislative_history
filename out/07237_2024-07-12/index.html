770000","text":"違反第第十條第一項、第十一條第一項、第十二條規定或第十四條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第十條第一項、第十一條第一項、第十二條規定或第十四條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110018570000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項前段規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110018550000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110024910000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110025230000","text":"主管機關審查或參與有關機關諮詢、審查海岸或海域開發案時，應主動要求相關部會及業者落實社區知情權。\n前項所稱社區知情權，相關辦法由中央主管機關定之，並應至少包含下列事項：\n一、前期選址階段。\n二、中期規劃及環評階段。\n三、通知到家戶方式。\n四、選址規劃及審查程序資訊公開上網。\n五、相關文件調閱權。\n六、其他承諾事項。\n如遇開發爭議，中央主管機關得自行或報請行政院設置溝通協調平台，邀集目的事業主管機關、地方政府、開發業者、漁民或漁民團體、社區民眾、民間團體，共同會商妥適之解決方案，以符合公正轉型原則。必要時，中央主管機關得以海洋發展基金支付相關費用。","note":"一、憲法保障「言論自由」、「生存權」、「免於恐懼自由」等基本權利，其中「知的權利」，更應落實在公共政策中保障權益的作法，不只是資訊公開，更應該主動促進社區知情，鼓勵民眾參與決策。\n二、歐洲將社區知情權視為電業開發過程中重要一環，例如英國透過「漁業聯絡制度」，納入政府、風電商、漁民三方溝通管道，早期選址階段即開啟對話、資訊共享；過程中持續溝通修正，確保資訊充分交流，並承諾諮詢特定利害關係人，例如漁業、航運、環保組織及沿海居民，以確保開發流程順暢，兼顧多方利益。\n三、我國政府近年來大力發展再生能源，卻屢因政府、廠商、農漁民及當地居民溝通不足，導致社區抗爭不斷。社區知情權的程序正義預先防止衝突發生、促進整體開發效率。\n四、為加速我國再生能源轉型，避免居民「事前不知情、事後無救濟」之情況，參照國外社區知情權，要求海岸或海域開發案前期選址階段中期規劃及環評過程，均須主動納入利害關係人（尤其是當地漁民、居民、環保團體）。主管機關應明定社區知情權相關具體作法之程序及內容，包含通知到家戶、資訊主動公開上網、許可程序相關文件調閱權等。\n五、環境基本法第三十三條規定中央應建立提供環境糾紛處理機制，並建立損害賠償、補償及救濟制度。因應海洋之離岸風電、漁業、觀光多目標利用，主管機關如遇開發爭議，得自行或報請行政院設置溝通協調平台，邀集目的事業主關機關、地方政府、開發業者、漁民或漁民團體、社區民眾、民間團體，共商妥適解決方案，並得以海洋發展基金支付相關費用，以符合公正轉型原則。"},{"bill":"202110027040000","text":"違反本法第十條至第十二條禁止規定及第十五條海洋生物保育事項者，主管機關得命其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經再通知仍不接受者，得按次處罰至其參加為止。\n海洋保育講習課程之施行辦法，由中央主管機關定之。","note":"一、對於嚴重違反海洋庇護區禁止等本法規範禁止之行為人，為提升其海洋保育觀念與知識，除受刑事處罰或行政罰鍰處分外，應接受一定時數之海洋保育講習課程，如：海洋生物多樣性、海洋生物保育與淨灘課程等。\n二、第二項參考身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則規定，對不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受者，得按次處罰至其參加為止。"},{"bill":"202110027520000","text":"違反第二十一條第二項規定，未經主管機關同意自行辦理復育措施者，處新臺幣一萬元以上五萬元以下罰鍰。但原住民基於傳統文化、祭儀、生活所需之保育行為，不在此限。","note":"為避免機關（構）、自然人、法人或團體未經主管機關同意自行辦理復育措施，影響海洋生態，爰定明其處罰。惟因原住民族有上千年的海洋保育的經驗，限制原住民從事有利海洋保育的行為相關不合理，因此，新增例外規定，給予原住民一定的權利。"},{"bill":"202110032170000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110033380000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110033420000","text":"違反本法規定，經依第二十條至第二十二條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十條至第二十二條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"}],"changed":true,"final":"違反第十條第一項、第十一條第一項、第十二條規定或第十四條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n前項海洋保育講習課程，應包含原住民族知識以及原住民族生物多樣性課程。\n拒不接受第一項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"一、對於違反第十條第一項、第十一條第一項、第十二條規定或第十四條第一項公告事項者之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、臺灣原住民族擁有豐厚且歷史悠久的自然資源利用與生物多樣性智慧，爰於第二項納入原住民族知識以及原住民族生物多樣性課程。\n三、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第三項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n四、第四項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。","review":{"note":"照行政院提案通過","text":"違反本法規定，經依第二十一條至第二十三條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。"}},{"no":"第二十七條","current":null,"versions":[{"bill":"201110005120000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110006490000","text":"違反第十三條規定，處新臺幣三十萬元以上一百五十萬元以下罰鍰。經限期改善而未改善者，得按日連續處罰之。但已經相當之注意仍無法避免者，得減輕或免罰之。","note":"為加強保護海洋庇護區之核心區，對於海洋庇護區之核心區，擅自從事各款所定禁止行為者，加以處罰。"},{"bill":"202110010660000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110012210000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向行政法院提起訴訟，請求判令其執行。\n行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，參酌海洋污染防治法第五十九條第一項與第二項、空氣污染防制法第九十三條第一項與第二項及環境影響評估法第二十三條第八項至第十項等公民訴訟條款之體例，於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110012640000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、第一項明定若主管機關疏於職責，受害人民或公益團體，得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n二、第二項明定高等行政法院為第一項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。"},{"bill":"202110013050000","text":"違反第十三條規定，處新臺幣三十萬元以上一百五十萬元以下罰鍰。經限期改善而未改善者，得按日連續處罰之。但已經相當之注意仍無法避免者，得減輕或免罰之。","note":"為加強保護海洋庇護區之緩衝區，對於違反第十條第一項規定，於海洋庇護區之緩衝區，擅自從事各款所定禁止行為者，加以處罰。"},{"bill":"202110014110000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，參酌《海洋污染防治法》第五十九條第一項與第二項、《空氣污染防制法》第九十三條第一項與第二項及《環境影響評估法》第二十三條第八項至第十項等公民訴訟條款之體例，於第一項明定對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據《行政訴訟法》第九條提起公民訴訟。\n二、第二項明定行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110017340000","text":"違反第十一條第一項、第十二條第一項、第十三條規定或第十五條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第十一條第一項、第十二條第一項、第十三條規定或第十五條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n三、第三項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110017770000","text":"違反本法規定，經依第二十一條至第二十三條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十一條至第二十三條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110018570000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110018550000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向行政法院提起訴訟，請求判令其執行。\n行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，參酌海洋污染防治法第五十九條第一項與第二項、空氣污染防制法第九十三條第一項與第二項及環境影響評估法第二十三條第八項至第十項等公民訴訟條款之體例，於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110024910000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110025230000","text":"違反第十三條規定，進入海洋庇護區之核心區域者，處行為人、海陸域交通工具駕駛人或船長一年以下有期徒刑，得併科新臺幣五十萬元以上二百萬元以下罰金。\n因過失犯前項之規定者，得減輕其刑。","note":"一、為加強保護海洋庇護區，對於違反第十三條規定，進入海洋庇護區之核心區加以處罰。\n二、為避免本法實施初期或因特殊因素導致無法避免之條件下，增設減輕條款。"},{"bill":"202110027040000","text":"行為人違反本法或依本法授權訂定相關命令之情事，而各級主管機關怠於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知各級主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向行政法院提起訴訟，請求判令其執行。\n行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，參照海洋污染防治法第五十九條、空氣污染防制法第九十三條、環境影響評估法第二十三條等公民訴訟條款之體例，爰第一項規定對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，依據行政訴訟法第九條提起公民訴訟。\n二、為減輕人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項規範法院可依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110027520000","text":"違反第十一條第一項、第十二條第一項、第十三條規定或第十五條第一項公告事項者，主管機關應令其接受二小時以上十二小時以下之海洋保育講習課程。\n前項海洋保育講習課程，應包含原住民族知識以及原住民族生物多樣性課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知令其限期接受講習或補足時數仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n第一項海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、對於違反第十一條第一項、第十二條第一項、第十三條規定或第十五條第一項公告事項之行為人，為提升其海洋保育觀念及知識，除處以行政罰外，並應令其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育及淨灘課程等。\n二、原住民族有上千年的海洋保育智慧，在本法制定前就有相關保育的經驗。因此，主管機關的相關海洋保育講習課程，要求應包含原住民族知識以及原住民族生物多樣性課程。如此一來，也可以讓大眾瞭解符合我國現況的海洋保育知識，爰規範第二項列入相關課程。\n三、參酌身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則，第二項定明拒不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受或未補足時數者，得按次處罰至其接受講習或補足時數為止。\n四、第四項定明海洋保育講習課程之內容、實施之對象、方式及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110032170000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110033380000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110033420000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"}],"changed":true,"final":"違反本法規定，經依第二十一條至第二十三條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","finalWhy":"一、經依第二十一條至第二十三條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。","review":{"note":"修正通過","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。\n第一項之書面告知格式，由中央主管機關會商有關機關公告之。"}},{"no":"第二十八條","current":null,"versions":[{"bill":"201110005120000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110006490000","text":"違反第十四條至第十五條之規定，於海洋庇護區之緩衝區及永續發展區，未經許可從事各款所定禁止行為者，處新臺幣二十五萬元以上一百二十萬元以下罰鍰。經限期改善而未改善者，得按日連續處罰之。","note":"為維持海洋庇護區外圍生態健康，本條規定違反第十四及第十五條各款公告限制、禁止或應遵行事項者，加以處罰。"},{"bill":"202110010660000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110012210000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。但其繼續從事核准行為，可預見造成海洋生態具體危害，或持續造成具體危害之擴大者，中央主管機關應廢棄該許可，並得給予合理之補償。","note":"一、中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。\n二、惟依據信賴保護原則所訂定之過渡條款，應納入預警原則，賦予主管機關為防止海洋生態遭受危害時廢棄許可之權限，爰定明但書之例外規定。對於人民因為法規或行政處分的變動，進而影響人民享有的利益、遭受預期之外的損害，國家應給予補救措施。"},{"bill":"202110012640000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"本條明定已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。"},{"bill":"202110013050000","text":"違反第十四條至第十五條及第十七條第一項之規定，於海洋庇護區之緩衝區及永續發展區，未經許可從事各款所定禁止行為者，處新臺幣二十五萬元以上一百二十萬元以下罰鍰。經限期改善而未改善者，得按日連續處罰之。","note":"為維持海洋庇護區外圍生態健康，本條規定違反第十四及第十五條及第十七條第一項各款公告限制、禁止或應遵行事項者，加以處罰。"},{"bill":"202110014110000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"明定中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110017340000","text":"違反本法規定，經依第二十二條至第二十四條規定處罰者，其損害部分應於規定期間內回復原狀；未能於規定期間內回復原狀者，依第二十二條至第二十四條規定連續罰之；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n發生破壞海洋保育重大緊急事件時，中央主管機關得採取相關緊急應變措施。\n為調查回復原狀所支出、及前項緊急應變措施之必要費用，由賠償義務人負擔。","note":"一、經依第二十二條至第二十四條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十七條第一項規定，應以回復原狀為原則，金錢賠償為例外；又，為避免消極、怠惰等情事造成海洋環境遲遲無法恢復原狀，應針對上開情事予以連續處罰之處分，爰為第一項規定。\n二、為避免重大緊急事件造成不可挽回之損害，中央主管機關得採取緊急應變措施。\n三、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第三項定明該費用由賠償義務人負擔。"},{"bill":"202110017770000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，參酌海洋污染防治法第六十六條第一項與第二項、空氣污染防制法第九十三條第一項與第二項及環境影響評估法第二十三條第八項至第十項等公民訴訟條款之體例，於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110018570000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110018550000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110024910000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110025230000","text":"違反第十四條及第十五條之規定，於海洋庇護區之緩衝區及永續發展區，未經許可從事各款所定禁止行為者，處新臺幣二十五萬元以上一百二十萬元以下罰鍰。經限期改善而未改善者，得按日連續處罰之。","note":"為維持海洋庇護區外圍生態健康，本條規定違反第十四及第十五條各款公告限制、禁止或應遵行事項者，加以處罰。"},{"bill":"202110027040000","text":"本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。","note":"依據海洋基本法第十四條立法意旨，明定本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。"},{"bill":"202110027520000","text":"違反本法規定，經依第二十二條至第二十四條規定處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、經依第二十二條至第二十四條規定處罰者，其對於海洋生態環境之破壞與海洋生物之侵害，參酌國家公園法第二十九條第一項規定，應以回復原狀為原則，金錢賠償為例外，爰為第一項規定。\n二、為避免衍生調查回復原狀所支出必要費用由何者負擔之爭議，爰於第二項定明該費用由賠償義務人負擔。"},{"bill":"202110032170000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110033380000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110033420000","text":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第九條至第十一條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第七條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"}],"changed":true,"final":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。\n第一項之書面告知格式，由中央主管機關會商有關機關公告之。","finalWhy":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。\n三、為便利公益訴訟之提起，使人民不因格式錯誤而受不利益，爰於第三項定明由中央主管機關會商有關機關後，公告書面告知格式。","review":{"note":"照行政院提案通過","text":"中央主管機關依第八條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第十條至第十二條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。"}},{"no":"第二十九條","current":null,"versions":[{"bill":"201110005120000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110006490000","text":"有下列情形之一，處新臺幣十萬元以上一百萬元以下罰鍰，經限期改善而未改善者，得按日連續處罰之：\n一、違反第十八條第二項規定，規避、拒絕或妨害海洋生物資源調查或海洋庇護區保育計畫實施者。\n二、違反第十九條第一項及第二項規定，規避、拒絕或妨害海洋保育巡查員或觀察員執行觀察、監測及蒐集資料者。","note":"一、本條第一款規定，對於違反第十八條第二項規定，無正當理由規避、拒絕或妨害海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、本條第二款規定，對於違反第十九條第一項及第二項規定，無正當理由規避、拒絕或妨害海洋保育觀察員執行觀察、監測及蒐集資料者，加以處罰。"},{"bill":"202110010660000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110012210000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110012640000","text":"本法施行細則，由中央主管機關定之。","note":"本條明定本法施行細則，由中央主管機關定之。"},{"bill":"202110013050000","text":"有下列情形之一，處新臺幣十萬元以上一百萬元以下罰鍰，經限期改善而未改善者，得按日連續處罰之：\n一、違反第十八條第二項規定，規避、拒絕或妨害海洋生物資源調查或海洋庇護區保育計畫實施者。\n二、違反第十九條第一項及第二項規定，規避、拒絕或妨害海洋保育巡查員或觀察員執行觀察、監測及蒐集資料者。","note":"一、本條第一款規定，對於違反第十四條第二項規定，無正當理由規避、拒絕或妨害海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n二、本條第二款規定，對於違反第十九條第一項及第二項規定，無正當理由規避、拒絕或妨害海洋保育觀察員執行觀察、監測及蒐集資料者，加以處罰。"},{"bill":"202110014110000","text":"本法施行細則，由中央主管機關定之。","note":"明文授權由中央主管機關訂定本法施行細則。"},{"bill":"202110017340000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110017770000","text":"本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。","note":"依據海洋基本法第十四條立法原由，明定海洋保育罰鍰收入，納入中央主管機關之海洋發展管理，以支付復育以及推廣所需費用。"},{"bill":"202110018570000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110018550000","text":"本法罰鍰收入，納入中央主管機關之海洋發展基金管理運用。","note":"依據海洋基本法第十四條立法意旨，明定本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用，以順遂各項海洋保育事務推動。"},{"bill":"202110024910000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110025230000","text":"有下列情形之一，處新臺幣十萬元以上一百萬元以下罰鍰，經限期改善而未改善者，得按日連續處罰之：\n一、違反第十八條第一項規定。\n二、違反第十九條第二項規定，規避、拒絕或妨礙海洋生物資源調查或海洋庇護區保育計畫實施者。\n三、違反第二十條第三項規定，規避、拒絕或妨礙海洋保育巡查員或觀察員執行觀察、監測及蒐集資料者。","note":"一、本條第一款規定，開發及觀光行為違反第十八條第一項規定者，應予處罰。\n二、本條第二款規定，對於違反第二十條第二項規定，無正當理由規避、拒絕或妨礙海洋生物資源調查或海洋庇護區保育計畫實施者，加以處罰。\n三、本條第三款規定，對於違反第二十條第三項規定，無正當理由規避、拒絕或妨礙海洋保育巡查員或觀察員執行觀察、監測及蒐集資料者，加以處罰。"},{"bill":"202110027040000","text":"本法施行細則，由中央主管機關定之。","note":"明定本法施行細則之訂定。"},{"bill":"202110027520000","text":"行為人違反本法或依本法授權訂定之法規命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向高等行政法院提起訴訟，請求判令其執行。\n高等行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，爰於第一項定明對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，得依據行政訴訟法第九條提起公民訴訟。\n二、為減輕受害人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項定明高等行政法院得依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。"},{"bill":"202110032170000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110033380000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110033420000","text":"本法罰鍰收入，納入中央主管機關之海洋發展基金管理運用。","note":"依據海洋基本法第十四條立法意旨，明定本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用，以順遂各項海洋保育事務推動。"}],"changed":true,"final":"中央主管機關依第八條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第十條至第十二條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","finalWhy":"中央主管機關依第八條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。","review":{"note":"照行政院提案通過","text":"本法施行細則，由中央主管機關定之。"}},{"no":"第三十條","current":null,"versions":[{"bill":"201110005120000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110006490000","text":"違反第二十四條規定，自行辦理復育措施，未報經主管機關同意者，處新臺幣十萬元以上一百萬元以下罰鍰，經限期改善而未改善者，得按日連續處罰之。","note":"為避免人民、機關、法人或團體未經主管機關同意自行辦理復育措施，未按照科學原則辦理之復育措施，不僅效益有限更可能造成海洋生態浩劫，參考「野生動物保育法」加以處罰。"},{"bill":"202110010660000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110012210000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110012640000","text":"本法施行日期，由行政院定之。","note":"本條明定法施行日期，由行政院定之。"},{"bill":"202110013050000","text":"違反第二十四條規定，自行辦理復育措施，未報經主管機關同意者，處新臺幣十萬元以上一百萬元以下罰鍰，經限期改善而未改善者，得按日連續處罰之。","note":"參考「野生動物保育法」第四十九條，為避免人民、機關、法人或團體未經主管機關同意自行辦理復育措施，未按照科學原則辦理之復育措施，不僅效益有限更可能造成海洋生態浩劫，爰加以處罰。"},{"bill":"202110014110000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰明定本法施行日期，由行政院定之。"},{"bill":"202110017340000","text":"中央主管機關依第九條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第十一條至第十三條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。\n中央主管機關依第九條規定劃定海洋庇護區前，臺灣原住民族基於其傳統文化、祭儀，已於該海域獵捕、宰殺或利用海洋生物之事實，不受第十條至第十三條規定之限制，其獵捕方式、獵捕海洋生物之種類、數量、獵捕期間、區域及其他應遵循事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、中央主管機關依第九條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。\n二、為保障原住民族使用土地及自然資源之既存權利，應在不影響海洋生態資源之永續發展為前提下，准許原住民從事相關非營利行為。"},{"bill":"202110017770000","text":"中央主管機關依第八條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第十條至第十二條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第八條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110018570000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110018550000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110024910000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110025230000","text":"違反第二十四條規定，未報經主管機關同意，自行辦理復育措施，未報經主管機關同意者，處新臺幣十萬元以上一百萬元以下罰鍰，經限期改善而未改善者，得按日連續處罰之。","note":"一、參考「野生動物保育法」第四十九條。\n二、為避免人民、機關、法人或團體未經主管機關同意自行辦理復育措施，未按照科學原則辦理之復育措施，不僅效益有限更可能造成海洋生態浩劫，爰加以處罰。"},{"bill":"202110027040000","text":"第二十二條至第二十四條相關罰則於各海洋庇護區公告後半年生效。\n海洋庇護區公告前，已取得目的事業主管機關許可，並從事受本法禁止事項者，不受第十條至第十二條之規定之限制，得從事核准行為至有效期限屆滿為止；必要時，中央主關機關得會同目的事業主管機關，變更、廢止該許可，並給予合理之補償。","note":"一、為避免本法施行初期及海洋庇護區公告後等因素導致無法避免違反，爰明定庇護區公告後有半年緩衝期，以減緩衝擊。\n二、規定本法施行前，於海洋庇護區已合法取得目的事業主管機關同意之事項者，參酌海洋污染防治法第五十八條，得繼續從事核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110027520000","text":"中央主管機關依第八條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，不受第十一條至第十三條規定之限制，得繼續從事許可或核准行為至有效期限屆滿為止。","note":"中央主管機關依第八條規定劃定海洋庇護區前，已於該海域合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構、從事探礦或採礦或其他經許可或核准之行為者，得繼續從事許可或核准行為至有效期限屆滿為止，以為過渡。"},{"bill":"202110032170000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110033380000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110033420000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"}],"changed":true,"final":"本法施行細則，由中央主管機關定之。","finalWhy":"授權由中央主管機關訂定本法施行細則。","review":{"note":"照行政院提案通過","text":"本法施行日期，由行政院定之。"}},{"no":"第三十一條","current":null,"versions":[{"bill":"202110006490000","text":"違反本法規定，經依第二十六條至第二十八條規定受處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、對於海洋生態環境之破壞與海洋生物之侵害，參考民法侵權行為損害賠償規定及國家公園法第二十七條立法例，以回復原狀為原則、金錢賠償為例外。\n二、於第二項明定調查回復原狀所支出之必要費用，由義務人負擔。"},{"bill":"202110013050000","text":"違反本法規定，經依第二十六條至第二十八條規定受處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、對於海洋生態環境之破壞與海洋生物之侵害，參考民法侵權行為損害賠償規定及國家公園法第二十七條立法例，以回復原狀為原則、金錢賠償為例外。\n二、為避免衍生調查回復原狀所生必要費用由何者負擔之爭議，爰第二項並明定調查回復原狀所支出之必要費用，由義務人負擔。"},{"bill":"202110017340000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110017770000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110018550000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110025230000","text":"違反本法規定，經依第二十七條及第二十八條規定受處罰者，其損害部分應回復原狀；不能回復原狀或回復顯有重大困難者，應賠償其損害。\n為調查回復原狀所支出之必要費用，由賠償義務人負擔。","note":"一、對於海洋生態環境之破壞與海洋生物之侵害，參考民法侵權行為損害賠償規定及國家公園法第二十七條立法例，以回復原狀為原則、金錢賠償為例外。\n二、為避免衍生調查回復原狀所生必要費用由何者負擔之爭議，爰第二項並明定調查回復原狀所支出之必要費用，由義務人負擔。"},{"bill":"202110027040000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110027520000","text":"本法施行細則，由中央主管機關定之。","note":"授權由中央主管機關訂定本法施行細則。"},{"bill":"202110033420000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"}],"changed":true,"final":"本法施行日期，由行政院定之。","finalWhy":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。","review":null},{"no":"第三十二條","current":null,"versions":[{"bill":"202110006490000","text":"違反第十三條至第十五條海洋庇護區禁止規定，除依本法規定處罰外，並應接受六小時以上二十四小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知仍不到場者，得按次處罰至其到場為止。\n海洋保育講習課程之施行辦法，由中央主管機關定之。","note":"一、對於違反海洋庇護區分區禁止規定及第十三條海洋生物保育事項之行為人，為提升其海洋保育觀念與知識，除科處行政罰外，並應命其接受一定時數之海洋保育講習課程。\n二、第二項對於不接受海洋保育講習課程或時數不足者處以罰鍰，經再通知仍不接受者，得按次處罰至其參加為止。\n三、第三項明定海洋保育講習課程之施行辦法授權由主管機關定之。"},{"bill":"202110013050000","text":"違反第十三條至第十五條海洋庇護區禁止規定或第十七條第一項公告事項者，除依本法規定處罰外，並應接受六小時以上二十四小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知仍不到場者，得按次處罰至其到場為止。\n海洋保育講習課程之施行辦法，由中央主管機關定之。","note":"一、參考「濕地保育法」第三十九條。\n二、對於違反海洋庇護區分區禁止規定及第十三條海洋生物保育事項之行為人，為提升其海洋保育觀念與知識，除科處行政罰外，並應命其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育與淨灘課程等。\n三、第二項參考身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則規定，對不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受者，得按次處罰至其參加為止。\n四、第三項明定海洋保育講習課程之施行辦法授權由主管機關定之。"},{"bill":"202110017340000","text":"本法自公布日起二年施行。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，自公布日起二年施行。"},{"bill":"202110017770000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"},{"bill":"202110025230000","text":"違反第十三條至第十五條海洋庇護區禁止規定，除依本法規定處罰外，並應接受六小時以上二十四小時以下之海洋保育講習課程。\n拒不接受前項海洋保育講習課程或時數不足者，處新臺幣三千元以上一萬五千元以下罰鍰，經通知仍不到場者，得按次處罰至其到場為止。\n海洋保育講習課程之施行辦法，由中央主管機關定之。","note":"一、參考「濕地保育法」第三十九條。\n二、對於違反海洋庇護區分區禁止規定及第十三條海洋生物保育事項之行為人，為提升其海洋保育觀念與知識，除科處行政罰外，並應命其接受一定時數之海洋保育講習課程，例如海洋生物多樣性、海洋生物保育與淨灘課程等。\n三、第二項參考身心障礙者權益保障法第九十五條第三項、兒童及少年福利與權益保障法第一百零二條第三項之罰則規定，對不接受海洋保育講習課程或時數不足者處以罰鍰，且經再通知仍不接受者，得按次處罰至其參加為止。\n四、第三項明定海洋保育講習課程之施行辦法授權由主管機關定之。"},{"bill":"202110027520000","text":"本法施行日期，由行政院定之。","note":"考量本法所定海洋保護事項之推動，需時準備以資因應，爰定明本法施行日期，由行政院定之。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十三條","current":null,"versions":[{"bill":"202110006490000","text":"各級主管機關怠於執行本法之行政義務，或行為人違反本法或依本法授權訂定之相關命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知各級主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向行政法院提起訴訟，請求判令其執行。\n行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。\n第一項之書面告知格式，由中央主管機關定之。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，參照海洋污染防治法第五十九條、空氣污染防制法第九十三條、環境影響評估法第二十三條等公民訴訟條款之體例，爰第一項規定對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，依據行政訴訟法第九條提起公民訴訟。\n二、為減輕人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項規範法院可依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。\n三、第三項明定書面告知格式，由中央主管機關定之。"},{"bill":"202110013050000","text":"各級主管機關怠於執行本法之行政義務，或行為人違反本法或依本法授權訂定之相關命令而主管機關疏於執行時，受害人民或公益團體得敘明疏於執行之具體內容，以書面告知各級主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，受害人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向行政法院提起訴訟，請求判令其執行。\n行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。\n第一項之書面告知格式，由中央主管機關定之。","note":"一、參考「空氣汙染防制法」第九十三條、「海洋汙染防治法」第五十九條。\n二、為鼓勵一般人民與公益團體參與海洋保育規範之落實，參照海洋污染防治法第五十九條、空氣污染防制法第九十三條、環境影響評估法第二十三條等公民訴訟條款之體例，爰第一項規定對於主管機關怠於執行本法時，受害人民或公益團體得先以書面告知主管機關，仍怠於執行者，依據行政訴訟法第九條提起公民訴訟。\n三、為減輕人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項規範法院可依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。\n四、第三項明定書面告知格式，由中央主管機關定之。"},{"bill":"202110025230000","text":"違反本法規定，經依第二十七條至第三十條規定受處罰者，中央主管機關應定期於網站公告處罰案件，普及民眾海洋保育知識觀念及素養。","note":"明定違反本法相關規定受處罰者，主管機關應定期公告案件內容，作為海洋保育教育素材，提升民眾海洋保育知識觀念及素養。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予採納","text":""}},{"no":"第三十四條","current":null,"versions":[{"bill":"202110006490000","text":"本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。","note":"依據海洋基本法第十四條立法意旨，明定本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。"},{"bill":"202110013050000","text":"本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。","note":"依據海洋基本法第十四條之立法意旨，明定本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。"},{"bill":"202110025230000","text":"各級主管機關怠於執行本法之行政義務，或行為人違反本法或依本法授權訂定之相關命令而主管機關疏於執行時，人民或公益團體得敘明疏於執行之具體內容，以書面告知各級主管機關。主管機關於書面告知送達之日起六十日內仍未依法執行者，人民或公益團體得以該主管機關為被告，對其怠於執行職務之行為，直接向行政法院提起訴訟，請求判令其執行。\n行政法院為前項判決時，得依職權判命被告機關支付適當律師費用、鑑定費用或其他訴訟費用予對維護海洋保育有具體貢獻之原告。\n第一項之書面告知格式，由中央主管機關定之。","note":"一、為鼓勵一般人民與公益團體參與海洋保育規範之落實，參照環境基本法第三十四條、環境影響評估法第二十三條、海洋污染防治法第五十九條、空氣污染防制法第九十三條等公民訴訟條款之體例，爰第一項規定對於主管機關怠於執行本法時，人民或公益團體得先以書面告知主管機關，仍怠於執行者，依據行政訴訟法第九條提起公民訴訟。\n二、為減輕人民或公益團體後續進行行政訴訟所需花費之訴訟成本，爰於第二項規範法院可依職權命被告機關支付對維護海洋保育有具體貢獻之原告適當律師費用、鑑定費用或其他訴訟費用。\n三、第三項明定書面告知格式，由中央主管機關定之。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十五條","current":null,"versions":[{"bill":"202110006490000","text":"本法施行細則，由中央主管機關定之。","note":"明定本法施行細則之訂定。"},{"bill":"202110013050000","text":"本法施行細則，由中央主管機關定之。","note":"明定本法施行細則之訂定。"},{"bill":"202110025230000","text":"本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。","note":"依據海洋基本法第十四條立法意旨，明定本法罰鍰部分收入，納入中央主管機關之海洋發展基金管理運用。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十六條","current":null,"versions":[{"bill":"202110006490000","text":"本法施行前，已於海洋庇護區合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構或從事探礦或採礦者，不受第十三條至第十四條規定之限制，得繼續從事核准行為至有效期限屆滿為止。但其繼續從事核准行為，可預見造成海洋生態具體危害，或持續造成具體危害之擴大者，中央主管機關應廢止該許可，並得給予合理之補償。\n中央主管機關認為有必要時應採行改善措施，以維護海洋生態系統之健全。","note":"本法施行前，於海洋庇護區已合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構或從事探礦或採礦者，得繼續從事核准行為至有效期限屆滿為止，以為過渡，另賦予主管機關因防止海洋生態危害時廢止許可之權限。"},{"bill":"202110013050000","text":"本法施行前，已於海洋庇護區合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構或從事探礦或採礦者，不受第十三條至第十四條規定之限制，得繼續從事核准行為至有效期限屆滿為止。但其繼續從事核准行為，可預見造成海洋生態具體危害，或持續造成具體危害之擴大者，中央主管機關應廢棄該許可，並得給予合理之補償。\n中央主管機關認為有必要時應採行改善措施，以維護海洋生態系統之健全。","note":"一、參考「海洋汙染防治法」第五十八條、「海岸管理法」第七條第五款之規定。\n二、規定本法施行前，於海洋庇護區已合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構或從事探礦或採礦者，得繼續從事核准行為至有效期限屆滿為止，以為過渡。\n三、賦予主管機關因防止海洋生態危害時廢棄許可之權限。"},{"bill":"202110025230000","text":"本法施行細則，由中央主管機關定之。","note":"明定本法施行細則之訂定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十七條","current":null,"versions":[{"bill":"202110006490000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110013050000","text":"本法自公布日施行。","note":"明定本法施行日期。"},{"bill":"202110025230000","text":"本法施行前，已於海洋庇護區合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構或從事探礦或採礦者，不受第十三條及第十四條規定之限制，得繼續從事核准行為至有效期限屆滿為止。但其繼續從事核准行為，可預見造成海洋生態具體危害，或持續造成具體危害之擴大者，中央主管機關應廢棄該許可，並得給予合理之補償。\n中央主管機關認為有必要時應採行改善措施，以維護海洋生態系統之健全。","note":"一、參考「海洋污染防治法」第五十八條、「海岸管理法」第七條第五款。\n二、規定本法施行前，於海洋庇護區已合法取得目的事業主管機關同意鋪設電纜、管道、設施、結構或從事探礦或採礦者，得繼續從事核准行為至有效期限屆滿為止，以為過渡，並賦予主管機關因防止海洋生態危害時廢棄許可之權限。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十八條","current":null,"versions":[{"bill":"202110025230000","text":"本法自公布日施行。","note":"明定本法施行日期。"}],"changed":false,"final":null,"finalWhy":null,"review":null}],"stages":[{"date":"2024-02-23","stage":"一讀","code":"院會-11-1-2","bill":"201110005120000","gazref":"113卷004期5186號 267-267頁"},{"date":"2024-03-01","stage":"一讀","code":"院會-11-1-3","bill":"202110006490000","gazref":"113卷005期5187號 6-6頁"},{"date":"2024-03-08","stage":"一讀","code":"院會-11-1-4","bill":"202110010660000","gazref":"113卷006期5188號 5-5頁"},{"date":"2024-03-13","code":"委員會-11-1-15-6","title":"第11屆第1會期內政委員會第6次全體委員會議","gazref":"113卷011期5193號 233-233,235-351頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024030849/details?meetingDate=113/03/13","full":["https://ivod.ly.gov.tw/Play/Full/1M/15720"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/11/LCIDC01_1131101_00004.pdf","p1":233,"p2":352}],"clips":[{"n":"徐欣瑩","t":"09:05","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149731"},{"n":"楊瓊瓔","t":"09:13","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149732"},{"n":"麥玉珍","t":"09:41","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149777"},{"n":"張宏陸","t":"09:51","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149778"},{"n":"牛煦庭","t":"10:00","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149779"},{"n":"黃建賓","t":"10:10","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149780"},{"n":"黃捷","t":"10:19","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149781"},{"n":"王美惠","t":"10:27","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149782"},{"n":"吳琪銘","t":"10:37","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149783"},{"n":"徐欣瑩","t":"10:46","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149784"},{"n":"許宇甄","t":"10:58","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149785"},{"n":"鄭天財Sra Kacaw","t":"11:21","u":"https://ivod.ly.gov.tw/Play/Clip/1M/149808"},{"n":"洪孟楷","t":"11:29","u":"https://ivod.ly.gov.tw/Play/Clip/1M/14980 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;

  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
