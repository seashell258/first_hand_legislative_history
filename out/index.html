:root{

:root[data-theme="dark"]{

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}

p{margin:0}
.top{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.find{display:flex;flex-direction:column;gap:6px}
.find label{font-size:13px;color:var(--muted)}

.count{font-size:13px;color:var(--muted)}
.laws{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.law{border-bottom:1px solid var(--line)}
.law a{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:16px 0;color:inherit;text-decoration:none}
.law a:hover h2{color:var(--accent);text-decoration:underline;text-underline-offset:4px}

.body{min-width:0;display:flex;flex-direction:column;gap:4px}

.none{color:var(--muted);padding:16px 0}
.foot{font-size:12px;color:var(--muted)}

    <h1>立法歷程整理</h1>
    <p class="lede">立法委員工作的紀錄散落在各處，我將其整理起來，並盡量刪減無資訊量的程序性公文。取而代之，我留下了較為生動有趣的，立法委員們的對話。希望民眾能單純透過閱讀委員們的逐字稿發言，去了解自己投票選出的委員，究竟如何影響自己的生活。</p>

<script>
const L = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const rows = L.laws.map(x => {
  const li = el('li', 'law'), a = el('a');
  a.href = x.key + '/index.html';
  const body = el('div', 'body');
  body.append(el('h2', '', x.title));
  if (x.summary) body.append(el('p', '', x.summary));
  if (x.changed.length) body.append(el('div', 'arts', '修正 ' + x.changed.join('、')));
  body.append(el('div', 'meta', x.nprops + ' 個提案　' + x.nmeets + ' 場會議　' + x.ntr + ' 份逐字稿' + (x.reviewed === false ? '　尚未人工整理' : '')));
  a.append(el('div', 'when', x.date + ' 三讀'), body);
  li.append(a); $('laws').append(li);
  return {li, hay: [x.law, x.title, x.summary, x.date, x.changed.join(' '), x.who.join(' ')].join(' ').toLowerCase()};
});
function filter() {
  const terms = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let n = 0;
  rows.forEach(r => { const ok = terms.every(t => r.hay.includes(t)); r.li.hidden = !ok; if (ok) n++; });
  $('none').hidden = n > 0;
  $('count').textContent = terms.length ? '符合 ' + n + ' 筆，共 ' + rows.length + ' 筆' : '目前收錄 ' + rows.length + ' 筆';
}
$('q').addEventListener('input', filter);
filter();
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得。最後更新 ' + L.built + '。正式內容以公報為準。';
</script>
