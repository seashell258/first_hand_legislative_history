<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>國土計畫法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

":"202110077590000","who":"委員劉建國等17人","date":"2024-11-15","name":"「國土計畫法第八條及第四十五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110077590000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/09/LCEWA01_110209_00120.pdf","proposers":["劉建國"],"ncosign":16,"people":[["劉建國","民進黨","提案"],["陳瑩","民進黨","連署"],["郭昱晴","民進黨","連署"],["李柏毅","民進黨","連署"],["何欣純","民進黨","連署"],["沈發惠","民進黨","連署"],["吳沛憶","民進黨","連署"],["范雲","民進黨","連署"],["陳培瑜","民進黨","連署"],["王正旭","民進黨","連署"],["陳素月","民進黨","連署"],["王世堅","民進黨","連署"],["黃捷","民進黨","連署"],["陳秀寳","民進黨","連署"],["林月琴","民進黨","連署"],["陳俊宇","民進黨","連署"],["林楚茵","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員劉建國等17人，鑒於國土計畫法將於114年4月30日實施，已依國土計法規定劃設完成各直轄市、縣（市）國土功能分區及分類（草案），並陸續送請各該縣市國土計畫審議會審議，而多有縣市政府未能如期繳交國土功能分區圖，產生爭議，造成諸多民眾誤解且以訛傳訛。為保障民眾權益，且使國土計畫應於妥善溝通後、各縣市之方案規劃完善且無爭議後方實施之。爰擬具「國土計畫法第八條及第四十五條條文修正草案」，將現行之國土功能分區公告時程，再延長四年，並將鄉村地區整體規畫入法，以利各縣市進行規劃、未來定期檢討時有足夠彈性空間，是否有當？敬請公決。","arts":["第八條","第四十五條"]},{"id":"202110079410000","who":"委員陳菁徽等16人","date":"2024-11-22","name":"「國土計畫法第四十五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110079410000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00200.pdf","proposers":["陳菁徽","林沛祥","張嘉郡"],"ncosign":6,"people":[["陳菁徽","國民黨","提案"],["林沛祥","國民黨","提案"],["張嘉郡","國民黨","提案"],["陳超明","無黨籍","連署"],["黃健豪","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["牛煦庭","國民黨","連署"],["魯明哲","國民黨","連署"],["盧縣一","國民黨","連署"]],"party":[["國民黨",8],["無黨籍",1]],"reason":"本院委員陳菁徽、林沛祥、張嘉郡等16人，為落實國土計畫法定事項如促進資源與產業合理配置，強化國土整合管理機制，並追求國家永續發展。是以，所認當前離114年4月實施僅剩數月之際，中央政府於施政作業上尚有13部會共計52部法律應配合修正，以及國土計畫法主管機關內政部亦尚有9項子法未完成頒定，連帶相關前置作業包含如與地方政府、民間團體等妥適溝通亦有不足，最終容有在實施之際將產生諸多法遵爭議之可能。爰擬具「國土計畫法第四十五條條文修正草案」，修正國土分區圖公告作業時效，藉以滿足中央政府執行政命令溝通業務之急切所需。是否有當？敬請公決。","arts":["第四十五條"]},{"id":"202110079810000","who":"委員陳素月等17人","date":"2024-11-29","name":"「國土計畫法第四十五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110079810000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00196.pdf","proposers":["陳素月","許智傑","邱議瑩"],"ncosign":6,"people":[["陳素月","民進黨","提案"],["許智傑","民進黨","提案"],["邱議瑩","民進黨","提案"],["林月琴","民進黨","連署"],["郭昱晴","民進黨","連署"],["徐富癸","民進黨","連署"],["沈伯洋","民進黨","連署"],["陳亭妃","民進黨","連署"],["賴惠員","民進黨","連署"]],"party":[["民進黨",9]],"reason":"本院委員陳素月、許智傑、邱議瑩等17人，有鑑於國土計畫法將於2025年四月公告國土功能分區圖，惟截至今年九月仍有地方政府尚未提交國土功能分區圖，且社會各界就分區劃設仍未達成共識，若按原定時程施行恐造成人民強烈反彈，爰擬具「國土計畫法第四十五條條文修正草案」。是否有當？敬請公決。","arts":["第四十五條"]},{"id":"202110079830000","who":"委員陳亭妃等17人","date":"2024-11-29","name":"「國土計畫法第四十五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110079830000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00197.pdf","proposers":["陳亭妃","蔡易餘"],"ncosign":7,"people":[["陳亭妃","民進黨","提案"],["蔡易餘","民進黨","提案"],["王美惠","民進黨","連署"],["陳素月","民進黨","連署"],["陳秀寳","民進黨","連署"],["劉建國","民進黨","連署"],["林月琴","民進黨","連署"],["陳冠廷","民進黨","連署"],["李柏毅","民進黨","連署"]],"party":[["民進黨",9]],"reason":"本院委員陳亭妃、蔡易餘等17人，鑑於國土計畫法將於民國114年4月30日正式施行，惟仍有部分直轄市、縣市政府因地方意見分歧，難以凝聚共識，尚未提交國土功能分區圖，且許多民眾對於分區劃設亦有眾多疑義，倉促上路恐使人民權益受損。故中央政府應與各地方政府及民眾持續溝通、廣納意見，以利各地方區域平衡發展，爰擬具「國土計畫法第四十五條條文修正草案」。是否有當？敬請公決。","arts":["第四十五條"]},{"id":"202110080340000","who":"委員盧縣一等18人","date":"2024-11-29","name":"「國土計畫法第七條、第三十五條及第四十五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110080340000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00198.pdf","proposers":["盧縣一","黃仁","蘇清泉"],"ncosign":7,"people":[["盧縣一","國民黨","提案"],["黃仁","國民黨","提案"],["蘇清泉","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","連署"],["林沛祥","國民黨","連署"],["黃建賓","國民黨","連署"],["林倩綺","國民黨","連署"],["廖先翔","國民黨","連署"],["謝龍介","國民黨","連署"],["游顥","國民黨","連署"]],"party":[["國民黨",10]],"reason":"本院委員盧縣一、黃仁、蘇清泉等18人，鑑於《國土計畫法》先前雖已修法予以展延，依法本應在民國一百一十四年四月三十日上路實施，但因過於倉促，各直轄市及地方縣市提出包括配套不足、圖資未更新、宣導不足等問題，另外《國土計畫法》上路實施後，勢必嚴重影響原住民族土地權益，因此為強化保障原住民族土地權益，爰擬具「國土計畫法第七條、第三十五條及第四十五條條文修正草案」。是否有當？敬請公決。","arts":["第七條","第三十五條","第四十五條"]},{"id":"202110080500000","who":"委員許宇甄等24人","date":"2024-11-29","name":"「國土計畫法增訂第三十二條之一條文草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110080500000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00199.pdf","proposers":["許宇甄","張嘉郡","丁學忠"],"ncosign":9,"people":[["許宇甄","國民黨","提案"],["張嘉郡","國民黨","提案"],["丁學忠","國民黨","提案"],["楊瓊瓔","國民黨","連署"],["涂權吉","國民黨","連署"],["盧縣一","國民黨","連署"],["陳菁徽","國民黨","連署"],["徐欣瑩","國民黨","連署"],["牛煦庭","國民黨","連署"],["徐巧芯","國民黨","連署"],["顏寬恒","國民黨","連署"],["翁曉玲","國民黨","連署"]],"party":[["國民黨",12]],"reason":"本院委員許宇甄、張嘉郡、丁學忠、馬文君、蘇清泉等24人，鑑於國土計畫法施行在即，承擔維持全國糧食安全之農業發展地區劃設集中於部分縣市，使得該些土地無法發展以非農業使用為目的之高經濟產業，顯得在發展上處於不公平的弱勢，民眾之財產權為維持糧食安全而有利用不公義的受限，其之犧牲應有特別補償，為平衡國土規劃需求與農業永續發展，爰擬具「國土計畫法增訂第三十二條之一條文草案」，在現行法規中增列有關農業權益補償的具體條文，以保障農民和農地的永續發展。是否有當？敬請公決。","arts":["第三十二條之一"]}],"arts":[{"no":"第七條","current":"行政院應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫核定之審議。\n二、部門計畫與國土計畫競合之協調、決定。\n中央主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫擬訂或變更之審議。\n二、直轄市、縣（市）國土計畫核定之審議。\n三、直轄市、縣（市）國土計畫之復議。\n四、國土保育地區及海洋資源地區之使用許可、許可變更及廢止之審議。\n直轄市、縣（市）主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、直轄市、縣（市）國土計畫擬訂或變更之審議。\n二、農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之審議。","versions":[{"bill":"202110046510000","text":"行政院應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫核定之審議。\n二、部門計畫與國土計畫競合之協調、決定。\n中央主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫擬訂或變更之審議。\n二、直轄市、縣（市）國土計畫核定之審議。\n三、直轄市、縣（市）國土計畫之復議。\n四、國土保育地區、海洋資源地區及第二十四條第三項但書規定之使用許可、許可變更及廢止之審議。\n五、中央主管機關許可造地施工計畫之審議。\n直轄市、縣（市）主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、直轄市、縣（市）國土計畫擬訂或變更之審議。\n二、農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之審議。\n三、直轄市、縣（市）主管機關許可造地施工計畫之審議。\n前二項審議事項，涉及原住民族土地、部落及部落周邊一定範圍者，應有原住民族代表一人。","note":"一、第一項未修正。\n二、依內政部審議都市計畫、區域計畫、非都市土地開發許可等相關案件通案處理原則，許可案件均應提報各該管委員會經合議方式審議，以徵詢專家、學者及有關機關委員意見，俾計畫內容更臻妥適，且透過公開審議過程，以避免黑箱作業之疑慮。第二十四條第三項但書規定之使用許可案件因屬跨二個直轄市、縣（市）行政區以上或跨二個國土功能分區以上，為避免分由不同主管機關審議，除可能造成審議時程冗長外，更可能導致使用許可計畫內容無法具有完整性及一致性；另填海造地案件則因係屬國土空間結構、土地使用管制重大變革，故應由中央主管機關召開國土計畫審議會審議較為妥適。參考區域計畫非都市土地開發許可作法，跨二個直轄市、縣（市）行政區以上或填海造地案件均由中央主管機關提報區域計畫委員會合議審查，爰修正第二項第四款，增列依第二十四條第三項但書規定之使用許可案件，應由中央主管機關召開國土計畫審議會審議。\n三、依第三十條第一項及第二項規定，申請填海造地案件取得使用許可後，申請人應於規定期限內提出造地施工計畫，涉及國防或經中央主管機關認定其公共安全影響範圍跨直轄市、縣（市），由中央主管機關許可，未涉及者，則由直轄市、縣（市）主管機關許可。考量造地施工計畫涉及陸側鄰近地區國土保育及海洋資源地區環境資源之影響，各級主管機關為造地施工計畫許可前，由各該國土計畫審議會審議更為綜觀嚴謹，爰增訂第二項第五款及第三項第三款。\n四、針對原住民族土地之國土計畫，為尊重原住民族與土地之關係，對於國土計畫中涉及原住民族保留地、原住民族傳統領域、部落範圍土地、部落周邊一定範圍之公有土地時，應有原住民族代表參與，以維護原住民族應有之權利。"},{"bill":"202110080340000","text":"行政院應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫核定之審議。\n二、部門計畫與國土計畫競合之協調、決定。\n中央主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫擬訂或變更之審議。\n二、直轄市、縣（市）國土計畫核定之審議。\n三、直轄市、縣（市）國土計畫之復議。\n四、國土保育地區及海洋資源地區之使用許可、許可變更及廢止之審議。\n直轄市、縣（市）主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、直轄市、縣（市）國土計畫擬訂或變更之審議。\n二、農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之審議。\n前二項審議事項，涉及原住民族土地，應有原住民族代表一人。","note":"依《原住民族基本法》第二十一條第一項規定：「政府或私人於原住民族土地或部落及其周邊一定範圍內之公有土地從事土地開發、資源利用、生態保育及學術研究，應諮商並取得原住民族或部落同意或參與，原住民得分享相關利益。」另外，原住民族委員會研擬「原住民族土地使用規則（草案）」，其適用對象為原住民及原住民族土地，另外依《原住民族基本法》第二條規定：「……原住民族土地係指原住民族傳統領域土地及既有原住民保留地，法令適用範圍皆涵蓋部落及部落周邊一定範圍之土地。」綜上，爰新增第四項規定：「前二項審議事項，涉及原住民族土地，應有原住民族代表一人。」"}],"changed":true,"final":"行政院應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫核定之審議。\n二、部門計畫與國土計畫競合之協調、決定。\n中央主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫擬訂或變更之審議。\n二、直轄市、縣（市）國土計畫核定之審議。\n三、直轄市、縣（市）國土計畫之復議。\n四、國土保育地區及海洋資源地區及第二十四條第三項但書規定之使用許可、許可變更及廢止之審議。\n五、中央主管機關許可造地施工計畫之審議。\n直轄市、縣（市）主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、直轄市、縣（市）國土計畫擬訂或變更之審議。\n二、農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之審議。\n三、直轄市、縣（市）主管機關許可造地施工計畫之審議。\n前二項審議事項，涉及原住民族土地者，應有原住民族代表參與。","finalWhy":"修正通過。,","review":{"note":"修正通過","text":"行政院應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫核定之審議。\n二、部門計畫與國土計畫競合之協調、決定。\n中央主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、全國國土計畫擬訂或變更之審議。\n二、直轄市、縣（市）國土計畫核定之審議。\n三、直轄市、縣（市）國土計畫之復議。\n四、國土保育地區及海洋資源地區及第二十四條第三項但書規定之使用許可、許可變更及廢止之審議。\n五、中央主管機關許可造地施工計畫之審議。\n直轄市、縣（市）主管機關應遴聘（派）學者、專家、民間團體及有關機關代表，召開國土計畫審議會，以合議方式辦理下列事項：\n一、直轄市、縣（市）國土計畫擬訂或變更之審議。\n二、農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之審議。\n三、直轄市、縣（市）主管機關許可造地施工計畫之審議。\n前二項審議事項，涉及原住民族土地者，應有原住民族代表參與。"}},{"no":"第八條","current":"國土計畫之種類如下：\n一、全國國土計畫。\n二、直轄市、縣（市）國土計畫。\n中央主管機關擬訂全國國土計畫時，得會商有關機關就都會區域或特定區域範圍研擬相關計畫內容；直轄市、縣（市）政府亦得就都會區域或特定區域範圍，共同研擬相關計畫內容，報中央主管機關審議後，納入全國國土計畫。\n直轄市、縣（市）國土計畫，應遵循全國國土計畫。\n國家公園計畫、都市計畫及各目的事業主管機關擬訂之部門計畫，應遵循國土計畫。","versions":[{"bill":"202110077590000","text":"國土計畫之種類如下：\n一、全國國土計畫。\n二、直轄市、縣（市）國土計畫。\n中央主管機關擬訂全國國土計畫時，得會商有關機關就都會區域或特定區域範圍研擬相關計畫內容；直轄市、縣（市）政府亦得就都會區域或特定區域範圍，共同研擬相關計畫內容，報中央主管機關審議後，納入全國國土計畫。\n直轄市、縣（市）主管機關擬訂直轄市、縣（市）國土計畫時，應辦理鄉村地區整體規劃，並就聚落及其周邊範圍研擬鄉村地區計畫，納入直轄市、縣（市）國土計畫。\n直轄市、縣（市）國土計畫，應遵循全國國土計畫。\n國家公園計畫、都市計畫及各目的事業主管機關擬訂之部門計畫，應遵循國土計畫。","note":"一、依國土計畫法施行細則第六條規定，鄉村地區整體規劃為直轄市、縣（市）國土計畫應載明內容之一，惟考量直轄市、縣（市）國土計畫依本法第四十五條規定，應於一○九年四月三十日前公告實施，經評估作業能量無法於前開期限內完成全部規劃作業，故第一版直轄市、縣（市）國土計畫應先行指認優先規劃地區，並於直轄市、縣（市）國土計畫公告實施後，就鄉（鎮、市、區）或其他適當範圍辦理鄉村地區整體規劃，並視需要依本法第十五條第三項規定變更各該直轄市、縣（市）國土計畫，或將辦理聚落規劃之鄉村地區計畫納入該國土計畫。\n二、為明定辦理鄉村地區整體規劃之法律授權依據及法定計畫名稱，爰增訂第三項，其後項次遞移。"}],"changed":true,"final":"國土計畫之種類如下：\n一、全國國土計畫。\n二、直轄市、縣（市）國土計畫。\n中央主管機關擬訂全國國土計畫時，得會商有關機關就都會區域或特定區域範圍研擬相關計畫內容；直轄市、縣（市）政府亦得就都會區域或特定區域範圍，共同研擬相關計畫內容，報中央主管機關審議後，納入全國國土計畫。\n直轄市、縣（市）主管機關擬訂直轄市、縣（市）國土計畫時，得辦理鄉村地區整體規劃，並視實際需要研擬鄉村地區計畫，納入直轄市、縣（市）國土計畫，並得另以附冊方式定之。\n直轄市、縣（市）國土計畫，應遵循全國國土計畫。\n國家公園計畫、都市計畫及各目的事業主管機關擬訂之部門計畫，應遵循國土計畫。","finalWhy":"照民進黨黨團、國民黨黨團再修正動議條文通過。","review":{"note":"保留","text":""}},{"no":"第二十三條","current":"國土保育地區以外之其他國土功能分區，如有符合國土保育地區之劃設原則者，除應依據各該國土功能分區之使用原則進行管制外，並應按其資源、生態、景觀或災害特性及程度，予以禁止或限制使用。\n國土功能分區及其分類之使用地類別編定、變更、規模、可建築用地及其強度、應經申請同意使用項目、條件、程序、免經申請同意使用項目、禁止或限制使用及其他應遵行之土地使用管制事項之規則，由中央主管機關定之。但屬實施都市計畫或國家公園計畫者，仍依都市計畫法、國家公園法及其相關法規實施管制。\n前項規則中涉及原住民族土地及海域之使用管制者，應依原住民族基本法第二十一條規定辦理，並由中央主管機關會同中央原住民族主管機關訂定。\n直轄市、縣（市）主管機關得視地方實際需要，依全國國土計畫土地使用指導事項，由該管主管機關另訂管制規則，並報請中央主管機關核定。\n國防、重大之公共設施或公用事業計畫，得於各國土功能分區申請使用。","versions":[{"bill":"202110029300000","text":"國土保育地區以外之其他國土功能分區，如有符合國土保育地區之劃設原則者，除應依據各該國土功能分區之使用原則進行管制外，並應按其資源、生態、景觀或災害特性及程度，予以禁止或限制使用。\n國土功能分區及其分類之使用地類別編定、變更、規模、可建築用地及其強度、應經申請同意使用項目、條件、程序、免經申請同意使用項目、禁止或限制使用及其他應遵行之土地使用管制事項之規則，由中央主管機關定之。但屬實施都市計畫或國家公園計畫者，仍依都市計畫法、國家公園法及其相關法規實施管制。\n前項規則中涉及原住民族土地、海域、部落及部落周邊一定範圍之使用管制者，應依原住民族基本法第二十一條規定辦理，並由中央主管機關會同中央原住民族主管機關訂定。\n直轄市、縣（市）主管機關得視地方實際需要，依全國國土計畫土地使用指導事項，由該管主管機關另訂管制規則，並報請中央主管機關核定。\n國防、重大之公共設施或公用事業計畫，得於各國土功能分區申請使用。","note":"一、修正第三項。\n二、按《原住民族基本法》第二條第五款，原住民族土地係指原住民族傳統領域土地及既有原住民保留地。同法第二十一條第一項規定，政府或私人於原住民族土地或部落及其周邊一定範圍內之公有土地從事土地開發……。同條第二項規定，政府或法令限制原住民族利用前項土地及自然資源時，應與原住民族、部落或原住民諮商，並取得其同意。政府對於原住民保留地、原住民族傳統領域、部落及部落周邊一定範圍之土地，進行開發利用或限制時，需踐行之諮商同意參予等義務，上開條文皆定有明文。\n三、次按《國土計畫法》第二十三條第三項，「前項規則中涉及原住民族土地及海域之使用管制者，應依原住民族基本法第二十一條規定辦理，並由中央主管機關會同中央原住民族主管機關訂定」與《原住民族基本法》之規範有別，為避免認事用法爭議，爰參酌《原住民族基本法》第二十一條規定為文字修正。"}],"changed":true,"final":"國土保育地區以外之其他國土功能分區，如有符合國土保育地區之劃設原則者，除應依據各該國土功能分區之使用原則進行管制外，並應按其資源、生態、景觀或災害特性及程度，予以禁止或限制使用。\n國土功能分區及其分類之使用地類別編定、變更、規模、可建築用地及其強度、應經申請同意使用項目、條件、程序、免經申請同意使用項目、禁止或限制使用及其他應遵行之土地使用管制事項之規則，由中央主管機關定之。但屬實施都市計畫或國家公園計畫者，仍依都市計畫法、國家公園法及其相關法規實施管制。\n前項規則中涉及原住民族土地、海域及部落之使用管制者，應依原住民族基本法第二十一條規定辦理，並由中央主管機關會同中央原住民族主管機關訂定。\n直轄市、縣（市）主管機關得視地方實際需要，依全國國土計畫土地使用指導事項，由該管主管機關另訂管制規則，並報請中央主管機關核定。\n國防及重大之公共設施或公用事業計畫，得於各國土功能分區申請使用。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"修正通過","text":"國土保育地區以外之其他國土功能分區，如有符合國土保育地區之劃設原則者，除應依據各該國土功能分區之使用原則進行管制外，並應按其資源、生態、景觀或災害特性及程度，予以禁止或限制使用。\n國土功能分區及其分類之使用地類別編定、變更、規模、可建築用地及其強度、應經申請同意使用項目、條件、程序、免經申請同意使用項目、禁止或限制使用及其他應遵行之土地使用管制事項之規則，由中央主管機關定之。但屬實施都市計畫或國家公園計畫者，仍依都市計畫法、國家公園法及其相關法規實施管制。\n前項規則中涉及原住民族土地及部落之使用管制者，應依原住民族基本法第二十一條規定辦理，並由中央主管機關會同中央原住民族主管機關訂定。\n直轄市、縣（市）主管機關得視地方實際需要，依全國國土計畫土地使用指導事項，由該管主管機關另訂管制規則，並報請中央主管機關核定。\n國防、重大之公共設施或公用事業計畫，得於各國土功能分區申請使用。"}},{"no":"第三十二條之一","current":null,"versions":[{"bill":"202110080500000","text":"中央主管機關對於因國土功能分區，劃入農業發展地區之人民，依其不同分區種類及其限制強度，應予合理之補償。\n前項補償，應由中央主管機關編列預算補償。對於中央主管機關核撥之補償相關經費，直轄市及縣（市）政府、鄉（鎮、市、區）公所應專款專用。\n前項補償用途、範圍、對象、公式及設立特別基金之辦法，由中央主管機關定之。\n農地發展權轉移制度之辦法，由中央有關主管機關定之。","note":"一、本條新增。\n二、有別於古典法律明文規定的徵收，也就是狹義的法定徵收，「應給予補償的」財產權內容－限制之法律規定類型主要有：1.一旦人民因財產權內容－限制的法律規定超出財產權的社會義務性之界限，則應對其予以補償，否則「無應給予補償的」財產權內容－限制之法律規定是違憲的，其行政執行是違法的。2.「違法－有責或無責的」類似徵收侵害以及「合法的」具有徵收效力之侵害係非真正的徵收，被錯誤地稱為「徵收」之用語，應該是「財產權的公益犧牲補償請求權」始為正確。3.非財產權損失的公益犧牲以及類似公益犧牲請求權亦為一種使人民因非財產權之受損，得以補償的思想。因此，就財產權之特別犧牲，應予以補償之意旨及參考德國特別犧牲補償之法理，爰於第一項增訂合理補償之規定。\n三、農業發展地區管制過高，一旦其劃設農地確實會影響地方稅收，故應對地方政府有更合理調配之財政劃分。於各縣市的土地有被劃到農業發展地區者，其農地有全國貢獻同時也受有特別犧牲的限制，應由全體人民共同承擔，故應有國家補償經費挹注。因此，為推動法定補償制度及農地發展權，爰增訂第二項中央主管機關應充分提供資源，編列預算並合理調配財政收支劃分及支持農地特別犧牲，應合理補償。\n四、當國土計畫法以及財政收支劃分法無明定土地特別犧牲的補償機制時，將造成法律違憲之重大疑慮。由於人民財產權（農地使用權）被法律設下超出合理容忍程度的限制使用，因此須要設立特別基金來補償農地的特別犧牲，並用於農地農用的經濟價值之改善。因此，為規定補償用途、範圍、對象、補償公式及設立特別基金等，應符合授權明確性之要求及確保辦法之合法性，爰增訂第三項作為授權依據。\n五、農地發展權概念最早由英國提出，後來逐漸演變為開發許可制的依據。農地發展權移轉（transfer development rights, TDR）在美國被廣泛應用並立法化，且有用來做為農地保育的案例，如馬里蘭州蒙哥馬利郡、卡爾弗特郡和紐澤西州切斯特菲德鎮透過設定農地發展權移出基地（農地）的分配率、接收基地的獎勵容積（建地）、農地發展權價格，兼顧農地所有權人權益以達到保育農地的目的。對此，要求農地保留額度應依據各縣（市）人口數乘以全國每人平均應負擔的農地作為應保留農地的數額，此種分配額度始為公平。是以，無農地之縣市應到農業縣「租地」、「來買農地發展權」。因此，為規定農地發展權轉移制度，應符合授權明確性之要求及確保辦法之合法性，爰增訂第四項作為授權規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十五條","current":"下列地區得由目的事業主管機關劃定為國土復育促進地區，進行復育工作：\n一、土石流高潛勢地區。\n二、嚴重山崩、地滑地區。\n三、嚴重地層下陷地區。\n四、流域有生態環境劣化或安全之虞地區。\n五、生態環境已嚴重破壞退化地區。\n六、其他地質敏感或對國土保育有嚴重影響之地區。\n前項國土復育促進地區之劃定、公告及廢止之辦法，由中央主管機關會商相關目的事業主管機關定之。\n國土復育促進地區之劃定機關，由中央主管機關協調有關機關決定，協調不成，報行政院決定之。","versions":[{"bill":"202110046510000","text":"下列地區得由目的事業主管機關劃定為國土復育促進地區，進行復育工作：\n一、土石流高潛勢地區。\n二、嚴重山崩、地滑地區。\n三、嚴重地層下陷地區。\n四、流域有生態環境劣化或安全之虞地區。\n五、生態環境已嚴重破壞退化地區。\n六、其他地質敏感或對國土保育有嚴重影響之地區。\n前項國土復育促進地區之劃定、公告及廢止之辦法，由中央主管機關會商中央目的事業主管機關定之。\n國土復育促進地區之劃定機關，由中央主管機關協調有關機關決定，協調不成，報行政院決定之。\n第一項國土復育促進地區之劃定涉及原住民族土地或部落者，應經中央原住民族主管機關同意，始得劃定。","note":"一、第一項及第三項未修正。\n二、第二項授權訂定之辦法，旨在規範國土復育促進地區劃定、公告、廢止之程序及劃定機關協調機制，涉及中央、地方主管機關與目的事業主管機關權責分工及協調，立法原意係授權由中央主管機關訂定該辦法，配合中央主管機關公告實施之全國國土計畫國土復育促進地區相關內容，以實質指導目的事業主管機關依環境復育需求劃定國土復育促進地區，爰修正第二項文字以符立法原意。\n三、對於國土地復育促進區之畫設，現行法即已規定須與有關機關協調，故未確認相關目的事業主管機關之意見，故明訂中央主管機須會商各機目的事業主管機關。另針國土復育促進地於原住民族土地或部落之情形，原住民族土地之主管機關為原住民族委員會，並且尊重原住民族與土地之連結，故於第四項明訂須經中央原住民族主管機關同意。"},{"bill":"202110080340000","text":"下列地區得由目的事業主管機關劃定為國土復育促進地區，進行復育工作：\n一、土石流高潛勢地區。\n二、嚴重山崩、地滑地區。\n三、嚴重地層下陷地區。\n四、流域有生態環境劣化或安全之虞地區。\n五、生態環境已嚴重破壞退化地區。\n六、其他地質敏感或對國土保育有嚴重影響之地區。\n前項國土復育促進地區之劃定、公告及廢止之辦法，由中央主管機關會商相關目的事業主管機關定之。\n國土復育促進地區之劃定機關，由中央主管機關協調有關機關決定，協調不成，報行政院決定之。\n第一項國土復育促進地區之劃定涉及原住民族土地，應經部落同意，始得劃定。","note":"參考《原住民族基本法》第二十一條第二項：「……政府或法令限制原住民族利用前項土地及自然資源時，應與原住民族、部落或原住民諮商，並取得其同意；受限制所生之損失，應由該主管機關寬列預算補償之。」因此爰新增第四項規定「第一項國土復育促進地區之劃定涉及原住民族土地，應經部落同意，始得劃定。」"}],"changed":true,"final":"下列地區得由目的事業主管機關劃定為國土復育促進地區，進行復育工作，涉及原住民族土地或部落者，應經中央原住民族主管機關同意：\n一、土石流高潛勢地區。\n二、嚴重山崩、地滑地區。\n三、嚴重地層下陷地區。\n四、流域有生態環境劣化或安全之虞地區。\n五、生態環境已嚴重破壞退化地區。\n六、其他地質敏感或對國土保育有嚴重影響之地區。\n前項國土復育促進地區之劃定、公告及廢止之辦法，由中央主管機關會商相關目的事業主管機關定之。\n國土復育促進地區之劃定機關，由中央主管機關協調有關機關決定，協調不成，報行政院決定之。","finalWhy":"修正通過。,","review":{"note":"修正通過","text":"下列地區得由目的事業主管機關劃定為國土復育促進地區，進行復育工作，涉及原住民族土地或部落者，應經中央原住民族主管機關同意：\n一、土石流高潛勢地區。\n二、嚴重山崩、地滑地區。\n三、嚴重地層下陷地區。\n四、流域有生態環境劣化或安全之虞地區。\n五、生態環境已嚴重破壞退化地區。\n六、其他地質敏感或對國土保育有嚴重影響之地區。\n前項國土復育促進地區之劃定、公告及廢止之辦法，由中央主管機關會商相關目的事業主管機關定之。\n國土復育促進地區之劃定機關，由中央主管機關協調有關機關決定，協調不成，報行政院決定之。"}},{"no":"第四十條","current":"直轄市、縣（市）主管機關對土地違規使用應加強稽查，並由依第三十八條規定所處罰鍰中提撥一定比率，供民眾檢舉獎勵使用。\n前項檢舉土地違規使用獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","versions":[{"bill":"202110072980000","text":"直轄市、縣（市）主管機關對土地違規使用應加強稽查。","note":"一、鑒於本法有關民眾檢舉提供一定比例之獎金之制度，恐造成民眾間之紛爭、猜忌或對立，顯與鼓勵人民互相關懷而非互相監控之和諧社會氛圍有別。且綜觀現行國內之衛星影像通報系統等相關技術業已發展成熟，其執法成效及精確度應更優於一般民眾之浮濫檢舉。爰刪除第一項依本法第三十八條規定所處罰鍰中提撥一定比率，供民眾檢舉獎勵使用之規定。\n二、另本條第二項原規定，檢舉土地違規使用獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關訂定「檢舉國土計畫土地違規使用獎勵辦法」，於本條修正通過刪除相關規定後，亦應一併停止研擬相關辦法，併此敘明。"},{"bill":"202110077360000","text":"直轄市、縣（市）主管機關對土地違規使用得透過預算撥補人力，或透過衛星、航照圖及運用科技空拍機之方式加強稽查。","note":"一、原條文規定透過檢舉獎勵方式，以提高社會大眾監督國土計畫土地使用之意願，惟此規定將造成人民互相監控之亂象，故刪除國土計畫法第四十條規定之檢舉獎勵制度文字並修正。\n二、第二項文字刪除。"}],"changed":false,"final":"直轄市、縣（市）主管機關對土地違規使用應加強稽查，並由依第三十八條規定所處罰鍰中提撥一定比率，供民眾檢舉獎勵使用。\n前項檢舉土地違規使用獎勵之對象、基準、範圍及其他相關事項之辦法，由中央主管機關定之。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第四十五條","current":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後四年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","versions":[{"bill":"202110016770000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"為保障民眾權益，在國土功能分區及分類審議的過程中應透過多元管道持續與民眾溝通，不能忽視民意逕為審議通過據以實施，爰修正國土功能分區圖作業期程再延長二年，即該期限為「六年」。"},{"bill":"202110024770000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、南投縣境內有73.91%的土地位在國土保育地區範圍內，農業發展區為23.17%，能作為城鄉發展區土地不到3%，不僅限制南投縣的發展，也對民眾的財產權有不利影響。再者，全國縣市政府在執行國土功能分區劃設均造成許多民眾疑慮及陳情，且民眾對國土計畫的疑慮及陳情案件多未獲妥適解決。\n二、各縣市政府在辦理國土功能分區圖劃設，是依據各目的事業主管機關提供的圖資作為劃設的依據，惟大部份目的事業主管機關所掌握的圖資年度已久亦未更新，成圖時間不一，精度也不一致，直接用這些圖資直接套繪到現行環境及條件上，已造成民眾恐慌。\n三、然「國土計畫法」第四十五條規定，各縣市國土計畫公告實施後四年內，一併公告國土功能分區圖，亦即民國114年4月各縣市功能分區圖公告之日起，區域計畫不再適用，國土計畫正式全面上路。\n四、惟各目的事業主管機關所掌握的圖資年度已久，真實反映現狀尚未解決，中央一再強調國土計畫將保障既有合法權利，但對於民眾財產權的損失也未曾提及，顯然國土功能分區明年上路，過於倉促，且礙難於法定期限內完成，對於大部分是山坡地的南投縣影響甚鉅，民眾居住或耕作權受損，未來南投整體發展受限。\n五、爰擬具「國土計畫法第四十五條條文修正草案」，將各直轄市、縣（市）主管機關應於全國國土計畫公告實施後，應公布實施及公告之直轄市、縣（市）國土計畫期限由四年延長至六年，給予直轄市、縣（市）政府充裕且具體的時程調整，並一併適當放寬國土功能分區圖之年限，使國土計畫更臻周延完備。"},{"bill":"202110033320000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫除是為保障國土資源的永續利用外，也是為了達成城鄉區域發展的均衡，更與人民的財產權益，有高度密切的關係。因此需要給予直轄市、縣（市）主管機關，更充分的時間去進行調查，與提出長期合理的規劃，並同時能充份的與民眾溝通，以取得雙贏的最終目的。\n二、爰提案修正本條第二項部分文字，延長國土功能分區圖公告作業期程。\n三、第一項與第三項未修正。"},{"bill":"202110037380000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、直轄市、縣（市）國土計畫係屬實質空間發展計畫，涉及直轄市、縣（市）及中央目的事業主管機關之政策方向。且國土功能分區之劃設影響土地使用實質管制界線及管制內容，攸關人民財產權益，須給予直轄市、縣（市）主管機關充分調查及合理規劃期程，俾內容更為完善。\n二、農業發展地區係依照內政部及農業部所討論之通案性劃設條件劃設，再由縣市政府農業單位檢視劃設成果；惟查部分縣市依照通案性劃設條件，劃設大量第一類、第二類農業發展地區，除縣市政府認為會影響該縣市長遠發展，過程中亦多有接獲民眾陳情，認為農業發展地區與現況農業使用範圍有所出入，且農地管制政策影響廣大農民權益，迄今不少民眾遭以「未農地農用」告發，包括興建圍牆、道路、曬穀場等，顯示民眾對國土計畫的陳情及疑慮多未獲妥適處置。\n三、國土保育地區之劃設條件係參考既有目的事業法規所劃設之保護（育）區域，例如保安林、國有林事業區、河川區域、飲用水水源水質保護區等環境敏感圖資，惟縣市政府於繪製及審議過程持續接獲民眾陳情，部分圖資因精度不一且年代久遠與現況不符；此外，民眾不了解國土保育地區得否繼續從事經營農業或建築使用，擔心國土計畫一旦正式實施，既有合法權益將受損，以致人心惶惶。\n四、因此，為完善我國國土使用分區及自然環境保育，減少我國民間團體與民眾之疑慮，爰擬具「國土計畫法第四十五條條文修正草案」，將各直轄市、縣（市）主管機關應於全國國土計畫公告實施後，應公布實施及公告之直轄市、縣（市）國土計畫期限由四年延長至六年。"},{"bill":"202110041420000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫法按照原訂期程，將於114年4月30日正式公告實施，惟各直轄市、縣（市）「國土功能分區」劃定造成民眾異議，亦有限縮地方土地轉型之質疑，恐影響後續產業發展，致使多數縣市無法於6月底前完成「國土功能分區圖」，並提報至內政部國審會審議。\n二、依據國土計畫法第二十條規定，全國將劃分為保育地區、海洋資源地區、農業發展地區、城鄉發展地區，並細分12種分類，依據各分區特性及功能，訂立不同使用項目，以達土地適用目的。惟國科會、國發會先後於桃園推動「龍科三期」、「桃竹苗大矽谷」等擴大產業政策，與內政部國審會於2021年核定桃園國土計畫已有顯著落差，致使地方重大建設與國土計畫原則相違悖之情事。\n三、爰此，為保障各縣市發展選擇空間，及減緩民眾疑慮，將各直轄市、縣（市）主管機關應於全國國土計畫公告實施後，應公布實施及公告「國土功能分區圖」之期限由四年延長至六年，以維護地方發展權益，完善國土規劃與管理權責。"},{"bill":"202110040860000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後四年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n中央主管機關應配合本法修正財政收支劃分法，檢討中央統籌分配款依一定比例，優先分配於劃設國土保育區、農業發展區限制開發區域之直轄市、縣（市）及鄉（鎮、市），平衡本法劃設限制開發土地，造成直轄市、縣（市）及鄉（鎮、市）區域整體發展受限，以達公平性原則。\n前項未完成修法前，本法暫緩實施。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、新增第三項、第四項。\n二、原第三項移列第五項。\n三、為了提升為提升鄉村地區競爭力、維持地方資產價值及供水穩定原則，中央政府與地方政府需攜手合作，但有鑑於「農業發展區」及「國土保育區」縣市的地方稅收不足，又加上全國國土計畫劃設農業發展地區影響限制地方發展，所以普通統籌分配款應優先分配給土地發展受影響的縣市，使地方發展是可帶動的，以免造成強者恆強弱者恆弱的現象。國土計畫法上路前，需先完善財政收支分配之公平性，以利穩定發展。\n四、國土計畫法應配合財政收支劃分法，檢討中央統籌分配款依一定比例，優先分配於劃設國土保育地區、農業發展地區限制開發區域之直轄市、縣（市）及鄉（鎮、市），確保國家應保留農地及國土保育面積和品質，在中央未修正統籌分配款，使其達成公平性原則時，國土計畫法暫緩實施。"},{"bill":"202110042220000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"為保障民眾權益，於國土功能分區及分類審議過程中，政府應透過多元管道持續與民眾溝通，不可忽視民意逕為審議通過據以實施。爰修正第二項，將國土功能分區圖作業期程延長二年，即該期限修正為「六年」，以使國土計畫更臻周延完備。"},{"bill":"202110046510000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，完成直轄市、縣（市）國土計畫之擬訂及審議作業，依中央主管機關指定之日期一併公告實施；並於直轄市、縣（市）國土計畫公告實施後五年內，依中央主管機關指定之日期一併公告。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、原條文列為第一項，內容未修正。\n二、為因應全國直轄市、縣（市）個別情況與條件不同，國土計畫與國土功能分區圖公告期程應適當予以放寬，使國土規畫較為複雜之地方縣市有更充裕的時間進行處理，故延長目前直轄市、縣（市）國土計畫及國土功能分區圖之期程，爰修正第二項為五年內。"},{"bill":"202110046540000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫法實施後之「土地使用管制規則」仍未定案，致使各項法制進度未臻完備。\n二、各地方政府依「國土計畫使用許可公開展覽與公聽會及陳述意見處理辦法」需向民眾召開公聽會，然因各項措施尚未完備，民眾提出諸多疑義，與法條差異甚大，也使地方政府對於「土地功能分區圖」之規劃進度落後，鑒於國土計畫法實施後影響之民眾影響甚廣，為保障民眾權益，相關配套措施未明確下，應延長實施之期程。\n三、目前定於114年4月30日起正式實施顯已太過倉促。爰擬具「國土計畫法第四十五條條文修正草案」，將各直轄市、縣（市）主管機關應於全國國土計畫公告實施後，應公布實施及公告之直轄市、縣（市）國土計畫期限由四年延長至六年，使國土計畫更臻完備。"},{"bill":"202110048720000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫法實施後之「土地使用管制規則」尚未定案公布，致使即便依「國土計畫使用許可公開展覽與公聽會及陳述意見處理辦法」向民眾召開公聽會，但由於缺乏土地使用管制規則之明確規範，實難以向民眾說明，民眾亦無所適從。\n二、鑒於國土計畫法實施後對受影響之民眾影響甚鉅，為保障民眾權益應於相關配套措施明確後，再行向民眾召開公聽會。\n三、目前定於114年4月30日起正式實施顯已太過倉促。爰擬具「國土計畫法第四十五條條文修正草案」，將各直轄市、縣（市）主管機關應於全國國土計畫公告實施後，應公布實施及公告之直轄市、縣（市）國土計畫期限由四年延長至六年，使國土計畫更臻完備。"},{"bill":"202110067840000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫除是為保障國土資源的永續利用外，也是為了達成城鄉區域發展的均衡，更與人民的財產權益，有高度密切的關係。因此需要給予直轄市、縣（市）主管機關，更充分的時間去進行調查，與提出長期合理的規劃，並同時能充份的與民眾溝通，以取得雙贏的最終目的。\n二、修正第二項部分文字，延長國土功能分區圖公告作業期程。\n三、第一項與第三項未修正。"},{"bill":"202110068550000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、有鑑於國土計畫將於明（114）年5月正式啟動，相關影響效應與紛擾漸次顯現。國土分區有序運用的理想與實務，自105年1月6日總統公布國土計畫法立法以來，中央主管機關致力於推動事宜，但對於各界、各縣市政府乃至相關人民意見與訴求鮮少梳理微調。\n二、值茲正式執行前，相關意見、資訊與未來執行方案，中央主管機關均應系統性與地方政府、相關學界、公民團體、利害關係人等再予溝通、聽取意見。\n三、為使未來國土計畫執行減少衝擊與民怨，爰擬具「國土計畫第四十五條條文修正草案」，將國土功能分區圖公告作業期程由四年延長至六年。"},{"bill":"202110068980000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、修正第二項。\n二、《國土計畫法》將於一百十四年四月三十日正式上路，然至今仍有縣市政府尚待與地方民意溝通，未能於期限內遞交「國土功能分區圖」至中央主管機關；此外，目前《國土計畫法》相關子法配套不足，又因中央與地方事權不一，以致地方無所適從，倉促上路恐影響民眾財產權益。為確保城鄉發展均衡、資源與產業合理配置、保障民眾權益，延長國土功能分區圖公告作業期程至六年。"},{"bill":"202110070040000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、各地方政府依「國土計畫使用許可公開展覽與公聽會及陳述意見處理辦法」需向民眾召開公聽會，然因各項溝通與措施尚未完備，各地民眾仍有諸多疑義，意見與法條內容差異甚大，也使地方政府對於「土地功能分區圖」之規劃進度落後。鑒於《國土計畫法》實施後影響民眾甚鉅，為保障民眾權益，應考量相關配套措施未明確下，延長實施之期程。\n二、近為保障民眾權益，在國土功能分區及分類審議的過程中，政府應透過多元管道持續與民眾溝通，不可逕為審議通過據以實施，爰修正國土功能分區圖作業期程延長二年，即該期限修正為「六年」，以使國土計畫更臻周延完備。"},{"bill":"202110069340000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後八年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"依國土計畫法第四十五條規定，國土計畫公告實施後四年內，中央主管機關應指定日期公告國土功能分區圖，並於公告國土功能分區圖之日起，區域計畫法不再適用。相關時程具體實踐後之效果，即為民國一百十四年四月三十日起國土計畫法將全面實施。然而迄一百十三年九月，仍有地方政府尚未向中央提交國土功能分區圖之草案，顯於依法於一百十四年四月實行有困難。此外，社會各界亦對全面施行國土計畫法未達高度共識，若按原定時施行恐造成社會對立與民眾反彈，爰提案將相關時程再延長四年。"},{"bill":"202110069910000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫法原定於2024年6月30日前遞交「國土功能分區圖」草案予中央主管機關，將國土劃分為國土保育、海洋資源、農業發展及城鄉發展等4大功能分區，以國土性質區分使用管制程度。並於2025年4月公告後正式上路。\n二、考量我國農地多集中特地縣市，一旦劃入農業發展區後，將導致農地利用空間受限，對地方發展衝擊巨大，更有造成城鄉差距擴大之風險。目前包括新北市、桃園市、苗栗縣、台中市、彰化縣、南投縣、雲林縣、嘉義市、台東市等9個縣市政府尚未繳交功能分區圖，且有部分縣市仍持續向中央政府提出修正意見，顯見目前國土計畫法仍有窒礙難行之處。\n三、修正本條第二項，將公告國土功能分區圖之日期，由原本四年改為六年，以增加中央政府與縣市政府及受衝擊族群溝通之時間。"},{"bill":"202110070520000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"《國土計畫法》預定明年4月30日上路，惟依據內政部統計資料顯示（截至113年7月），相關9項子法的完成比率僅為60.87%，此外，13部會中仍有52部法律仍需修正，另農地畫設標準不一、民眾對政策不了解及子法未完成之情形下，使《國土法》實施已面臨窒礙難行之窘境，爰修正第二項，將期限由原有四年延長至六年，以臻完備。"},{"bill":"202110072450000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後四年內，依中央主管機關指定之日期，一併公告國土功能分區圖。但情形特殊者，得於期限屆至前三個月向中央主管機關申請展延，經主管機關核准後展延一次，每次展延最長一年，且不得超過二次。\n直轄市、縣（市）主管機關依第二項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫法的核心是「成長管理」，因此為了落實成長管理，政府必須運用各種管理工具以規範實質發展的區位、地理型態、密度、品質與成長速率，利用法令、公共政策等方式執行，引導都市與區域的成長並控制發展，使資源有效的利用、都市永續發展，維持生活品質，而並非阻止成長及反對成長。\n二、近期國土計畫法各界紛爭不斷，主因在於國土保育區及農業發展區各類土地於未來地方主管機關公布國土功能分區圖後進行之使用管制，不僅對權利人土地利用強度限制外，更存有土地價值減損之問題，唯至今相關限制補償措施之各目的事業主管機關未有明確方向，再加上農民接獲各種訊息誤導其認知方向，反加深對國土計畫法功能分區的不信任，如此一來不僅無法有效引導農業發展區的成長，更遑論達成優化臺灣農業發展、維護農地完整之目標。\n三、國土計畫法之本意在於有效促進國土利用，並非阻止地方發展。為弭平各界的爭議，強化對民眾的說明，降低土地權利人對國土計畫法之疑義，爰參考礦業法之規定，增訂直轄市、縣（市）主管機關有特殊情況者，得向中央主管機關申請展延，每次展延期限最長一年且二次為限。"},{"bill":"202110072700000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"有鑑於國土計畫法係為建立國土空間合理利用，維繫土地資源永續發展，惟越接近國土計畫全面施行（114年4月30日），地方反彈聲浪越見增大。為使未來國土計畫執行減少衝擊與民怨，爰擬具「國土計畫法第四十五條條文修正草案」，延長國土功能分區圖公告作業期程，待完善配套措施與充分溝通後再行上路。"},{"bill":"202110072320000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後八年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫法之實施攸關人民重大權益，且有許多民眾對於國土計畫法的相關法規規定及分區劃設亦有疑義，倉促上路恐造成民眾權益受損。\n二、部分直轄市、縣市政府未提交國土功能分區圖，應給予更多充裕時間討論，以利各地方區域發展。\n三、綜上所述，為達成國土永續發展和保障人民權益，爰修正第二項，將國土功能分區圖之公告時程再延長四年，即為八年。"},{"bill":"202110075190000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、鑒於國土計畫法將於明（114）年5月正式上路，國土分區有序運用的理想與實務乃本法推動之目的，對於我國地方縣（市）政府與民眾，在土地利用與規劃上影響甚深，自105年1月6日總統公布國土計畫法以來，中央主管機關致力於推動事宜，惟各縣（市）政府，甚或是民眾等建議，鮮少被中央主管機關採納。\n二、值茲正式執行前，中央主管機關應多與縣（市）政府、民眾溝通，並蒐集相關學者、公民團體、利害關係人等建議，將所蒐集資訊、建議進行系統性梳理，研擬相關配套方案、施行細則等。\n三、為使未來國土計畫推行順利，降低縣（市）政府及民眾反彈，爰擬具「國土計畫法第四十五條條文修正草案」，將國土功能分區圖公告作業期程由四年延長至六年。"},{"bill":"202110076780000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫法實施後之「土地使用管制規則」尚未定案公布，致使即便依「國土計畫使用許可公開展覽與公聽會及陳述意見處理辦法」向民眾召開公聽會，但由於缺乏土地使用管制規則之明確規範，實難以向民眾說明，民眾亦無所適從。\n二、各地方政府依「國土計畫使用許可公開展覽與公聽會及陳述意見處理辦法」需向民眾召開公聽會，然因各項措施尚未完備，民眾提出諸多疑義，與法條差異甚大，也使地方政府對於「土地功能分區圖」之規劃進度落後，鑒於國土計畫法實施後影響之民眾影響甚廣，為保障民眾權益，相關配套措施未明確下，應延長實施之期程。"},{"bill":"202110077590000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後八年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"為保障民眾權益，在國土功能分區及分類審議的過程中應透過多元管道持續與民眾溝通，不能忽視民意逕為審議通過據以實施，爰修正國土功能分區圖作業期程再延長四年，即該期限為「八年」。"},{"bill":"202110079410000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"修正國土分區圖公告作業時效自原定四年改為六年，藉以滿足中央政府執行政令溝通業務之急切所需。"},{"bill":"202110079810000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後八年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、依現行國土計畫法第四十五條規定，國土計畫公告實施後四年內，中央主管機關應指定日期公告國土功能分區圖，並於公告國土功能分區圖之日起，區域計畫法不再適用，即表示2025年4月30日起國土計畫法將全面實施。然而迄2024年9月，仍有地方政府尚未向中央提交國土功能分區圖之草案，顯於依法於2025年4月實行有困難。\n二、另就目前已送件的縣市政府國土計畫草案而言，除了農一農二劃設面積總和比估計少、各縣市劃設標準不一致等問題外，亦有縣市僅用圖資套繪、無實際現勘等方式，顯示不僅社會各界，連同各縣市政府間，亦對全面施行國土計畫法未達高度共識與認知，若按原定時施行恐造成社會對立與民眾反彈，爰提案將相關時程再延長四年。"},{"bill":"202110079830000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後八年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"為保障民眾權益，在國土功能分區及分類審議的過程中應透過多元管道持續與民眾溝通，不應忽視民意逕為審議通過據以實施，爰修正國土功能分區圖作業期程再延長四年，即該期限為「八年」，方為妥適。"},{"bill":"202110080340000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後五年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"一、國土計畫乃為保障國土資源永續利用，並達成城鄉區域發展均衡，更與原住民族人之土地權益，有高度相關，因此需要給予直轄市、縣（市）主管機關與原住民族人，有更充分時間進行協商，以期雙方有充分溝通時間，取得雙贏。\n二、因此，爰修正第二項部分文字，延長國土功能分區圖公告作業期程。\n三、第一項與第三項未修正。"},{"bill":"202110056790000","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後六年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法不再適用。","note":"為保障民眾權益，在國土功能分區及分類審議的過程中應透過多元管道持續與民眾溝通，不能忽視民意逕為審議通過據以實施，爰修正國土功能分區圖作業期程再延長二年，即該期限為「六年」。"}],"changed":true,"final":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後十年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法停止適用。","finalWhy":"照國民黨黨團再修正動議條文通過。","review":{"note":"保留","text":""}}],"stages":[{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110016770000","gazref":"113卷014期5196號 6-6頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110024770000","gazref":"113卷018期5200號 16-16頁"},{"date":"2024-04-12","stage":"一讀","code":"院會-11-1-9","bill":"202110029300000","gazref":"113卷025期5207號 4-4頁"},{"date":"2024-04-19","stage":"一讀","code":"院會-11-1-10","bill":"202110033320000","gazref":"113卷028期5210號 9-9頁"},{"date":"2024-04-26","stage":"一讀","code":"院會-11-1-11","bill":"202110037380000","gazref":"113卷031期5213號 12-12頁"},{"date":"2024-05-03","stage":"一讀","code":"院會-11-1-12","bill":"202110041420000","gazref":"113卷035期5 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();

  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
</html>
