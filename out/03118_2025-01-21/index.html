<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>野生動物保育法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

會同原民會定之，顯已違反原住民族基本法的立法精神與意旨。鑒於非營利自用部分，原住民傳統慣俗中，並非僅於祭儀期間才會進行相關狩獵或宰殺野生動物之行為，非營利自用部分亦係體現原住民族生活傳統的重要元素之一。故於本條文第二項增訂，原住民於原住民族地區基於非營利目的而少量自用者得排除該辦法之適用，且可採備查程序以及部落自主管理之方式予以辦理，以尊重原住民族傳統文化。再者，依野生動物保育法第四條第一項規定，第二十一條之一第一項及第二項所定野生動物，包括「一般類」及「保育類」野生動物，惟現行規定僅對原住民族違反第二十一條之一第二項規定，未經主管機關許可，獵捕、宰殺或利用「一般類野生動物」處以行政罰。爰為平衡對原住民族傳統文化、祭儀之尊重及野生動物之保育，此次特將「保育類野生動物」納入規範，爰修正序文，明定其適用於「野生動物」。且為符處罰明確性原則，配合修正同法條文第二十一條之一第二項規定，於序文明定處罰構成要件，並審酌保育類與一般類野生動物在管理上之差異及違法獵捕、宰殺或利用行為之責難程度不同，分列二款，分別定其罰則。但屬保育類動物，原住民首次違反獵捕、宰殺或利用行為者，不罰。爰擬具「野生動物保育法部分條文修正草案」。是否有當？敬請公決。","arts":["第十九條","第二十一條","第二十一條之一","第五十一條之一"]},{"id":"202110030620000","who":"委員伍麗華Saidhai Tahovecahe等17人","date":"2024-04-12","name":"「野生動物保育法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110030620000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00543.pdf","proposers":["伍麗華Saidhai‧Tahovecahe"],"ncosign":16,"people":[["伍麗華Saidhai‧Tahovecahe","民進黨","提案"],["陳秀寳","民進黨","連署"],["王美惠","民進黨","連署"],["徐富癸","民進黨","連署"],["陳瑩","民進黨","連署"],["林俊憲","民進黨","連署"],["何欣純","民進黨","連署"],["沈伯洋","民進黨","連署"],["黃捷","民進黨","連署"],["羅美玲","民進黨","連署"],["李柏毅","民進黨","連署"],["黃秀芳","民進黨","連署"],["賴瑞隆","民進黨","連署"],["劉建國","民進黨","連署"],["鍾佳濱","民進黨","連署"],["林宜瑾","民進黨","連署"],["陳培瑜","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員伍麗華Saidhai Tahovecahe等17人，為落實司法院大法官釋字第803號解釋關於原住民狩獵案之意旨，及關於112年3月六福村動物園狒狒逃脫、圍捕而後狒狒中槍死亡事件，應完善保育類野生動物逸失通報及圍捕等處理機制，爰擬具「野生動物保育法部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第十九條","第二十一條","第二十一條之一","第三十七條","第五十條之一","第五十一條","第五十一條之一","第五十二條"]},{"id":"202110030460000","who":"委員陳素月等18人","date":"2024-04-12","name":"「野生動物保育法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110030460000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00544.pdf","proposers":["陳素月","蔡易餘","陳秀寳"],"ncosign":15,"people":[["陳素月","民進黨","提案"],["蔡易餘","民進黨","提案"],["陳秀寳","民進黨","提案"],["林月琴","民進黨","連署"],["邱志偉","民進黨","連署"],["李坤城","民進黨","連署"],["鍾佳濱","民進黨","連署"],["何欣純","民進黨","連署"],["黃捷","民進黨","連署"],["徐富癸","民進黨","連署"],["王美惠","民進黨","連 15,"people":[["洪孟楷","國民黨","提案"],["楊瓊瓔","國民黨","提案"],["謝龍介","國民黨","提案"],["廖先翔","國民黨","連署"],["黃仁","國民黨","連署"],["陳雪生","國民黨","連署"],["涂權吉","國民黨","連署"],["賴士葆","國民黨","連署"],["陳玉珍","國民黨","連署"],["葛如鈞","國民黨","連署"],["林倩綺","國民黨","連署"],["林沛祥","國民黨","連署"],["顏寬恒","國民黨","連署"],["林思銘","國民黨","連署"],["羅廷瑋","國民黨","連署"],["羅智強","國民黨","連署"],["廖偉翔","國民黨","連署"],["邱鎮軍","國民黨","連署"]],"party":[["國民黨",18]],"reason":"本院委員洪孟楷、楊瓊瓔、謝龍介等18人，有鑑於生態保育相關研究日新月異，野生動物保育議題日益複雜難解，惟本法未隨時代更迭而與時俱進，實有通盤檢討之必要。又我國近年發生動物逃脫之圍捕事件，引發社會關注及責任歸屬等問題，圍捕過程亦可能造成民眾恐慌、影響他人生命財產安全。為維護物種多樣性與自然生態之平衡，杜絕使用不當之獵捕工具致野生動物傷殘，落實人道對待動物之普世價值；並完善保育類野生動物逸失通報及圍捕等處理機制，爰擬具「野生動物保育法部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第十九條","第二十一條","第二十一條之一","第二十五條","第三十七條","第五十條之一"]}],"arts":[{"no":"第二條","current":"本法所稱主管機關：在中央為行政院農業委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","versions":[{"bill":"202110006020000","text":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。","note":"一、修正本條之主管機關並增訂但書。\n二、行政院農業委員會已於112年8月1日改制為農業部，爰配合修正中央主管機關名稱。\n三、鑒於海洋委員會業於107年4月28日成立，本法有關海洋野生動物保育，中央業已改由海洋委員會為管轄機關，爰增訂但書，以明確本法事權。"},{"bill":"201110005110000","text":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。","note":"一、農業部組織法業於一百十二年八月一日施行，行政院農業委員會已改制為農業部，爰修正中央主管機關名稱。\n二、鑒於一百零七年四月二十八日海洋委員會成立，本法有關海洋野生動物保育之中央主管機關掌理事項，業已改由海洋委員會管轄，爰增訂但書規定，以明事權。"},{"bill":"202110010670000","text":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。","note":"一、農業部組織法業於一百十二年八月一日施行，行政院農業委員會已改制為農業部，爰修正中央主管機關名稱。\n二、鑒於一百零七年四月二十八日海洋委員會成立，本法有關海洋野生動物保育之中央主管機關掌理事項，業已改由海洋委員會管轄，爰增訂但書規定，以明事權。"},{"bill":"202110022260000","text":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。","note":"一、農業部組織法業於一百十二年八月一日施行，行政院農業委員會已改制為農業部，爰修正中央主管機關名稱。\n二、鑒於一百零七年四月二十八日海洋委員會成立，本法有關海洋野生動物保育之中央主管機關掌理事項，業已改由海洋委員會管轄，爰增訂但書規定，以明事權。"},{"bill":"202110030620000","text":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。","note":"一、農業部組織法業於一百十二年八月一日施行，行政院農業委員會已改制為農業部，爰修正中央主管機關名稱。\n二、鑒於一百零七年四月二十八日海洋委員會成立，本法有關海洋野生動物保育之中央主管機關掌理事項，業已改由海洋委員會管轄，爰增訂但書規定，以明事權。"},{"bill":"202110030460000","text":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。","note":"一、農業部組織法業於一百十二年八月一日施行，行政院農業委員會已改制為農業部，爰修正中央主管機關名稱。\n二、鑒於一百零七年四月二十八日海洋委員會成立，本法有關海洋野生動物保育之中央主管機關掌理事項，已改由海洋委員會管轄，爰增訂但書規定，以明事權。"},{"bill":"202110072950000","text":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。","note":"一、農業部組織法業於一百十二年八月一日施行，行政院農業委員會已改制為農業部，爰修正中央主管機關名稱。\n二、鑒於一百零七年四月二十八日海洋委員會成立，本法有關海洋野生動物保育之中央主管機關掌理事項，業已改由海洋委員會管轄，爰增訂但書規定，以明事權。"}],"changed":true,"final":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。","finalWhy":"一、農業部組織法業於一百十二年八月一日施行，行政院農業委員會已改制為農業部，爰修正中央主管機關名稱。\n二、鑒於一百零七年四月二十八日海洋委員會成立，本法有關海洋野生動物保育之中央主管機關掌理事項，業已改由海洋委員會管轄，爰增訂但書規定，以明事權。","review":{"note":"照行政院提案通過","text":"本法所稱主管機關：在中央為農業部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。但海域野生動物保育之中央主管機關為海洋委員會。"}},{"no":"第四條","current":"野生動物區分為下列二類：\n一、保育類：指瀕臨絕種、珍貴稀有及其他應予保育之野生動物。\n二、一般類：指保育類以外之野生動物。\n前項第一款保育類野生動物，由野生動物保育諮詢委員會評估分類，中央主管機關指定公告，並製作名錄。","versions":[{"bill":"202110010890000","text":"野生動物區分為下列二類：\n一、保育類：指瀕臨絕種、珍貴稀有及其他應予保育之野生動物。\n二、一般類：指保育類以外之野生動物。\n前項第一款保育類野生動物，由野生動物保育諮詢委員會評估分類，中央主管機關指定公告，製作名錄，並每年更新一次。","note":"野生動物保育工作應隨環境變遷不斷調整，名錄與保育等級每年重新審視更新，更加有利於物種族群存續。"},{"bill":"202110030460000","text":"野生動物區分為下列二類：\n一、保育類：指瀕臨絕種、珍貴稀有及其他應予保育之野生動物。\n二、一般類：指保育類以外之野生動物。\n前項第一款保育類野生動物，由野生動物保育諮詢委員會評估分類，中央主管機關指定公告，製作名錄，並每年更新一次。","note":"保育野生動物的腳步刻不容緩，因應環境快速變遷，未定期更新名錄恐致名錄與現實生態情況有所差距，應定期更新保育類動物名錄，以利野生動物族群存續。"}],"changed":false,"final":"野生動物區分為下列二類：\n一、保育類：指瀕臨絕種、珍貴稀有及其他應予保育之野生動物。\n二、一般類：指保育類以外之野生動物。\n前項第一款保育類野生動物，由野生動物保育諮詢委員會評估分類，中央主管機關指定公告，並製作名錄。","finalWhy":null,"review":{"note":"不予通過，維持現行法條文","text":""}},{"no":"第十九條","current":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱、獸鋏或特殊獵捕工具。\n七、其他經主管機關公告禁止之方法。\n未經許可擅自設置網具、陷阱、獸鋏或其他獵具，主管機關得逕予拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","versions":[{"bill":"202110006020000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏。\n八、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、修正第一項第六款，增訂第七款；修正第二項。\n二、為杜絕野生動物因獸鋏使用不當致斷腿傷殘等情形發生，應全面禁止使用獸鋏，其使用應與陷阱、特殊獵捕工具之規範不同，爰將第一項第六款不得使用獸鋏之規定，移列第七款單獨規範，現行第七款「其他經主管機關公告禁止之方法」遞移至第八款，均全面禁止使用；第二項亦配合修正，並增訂主管機關得逕予排除之規定。\n三、《動物保護法》施行細則第二條之一條規定，獸鋏係指具強力彈簧之頜顎型或齒夾型結構，並以夾鉗方式捕捉動物之鋏狀器械。至於原住民族所用傳統獵具，與前開定義之型式不同者，非屬獸鋏範圍，併予敘明。"},{"bill":"201110005110000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏。\n八、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、為杜絕野生動物因獸鋏使用不當致斷腿傷殘等情形發生，全面禁止使用獸鋏，其使用應與陷阱、特殊獵捕工具之規範不同，爰將第一項第六款不得使用獸鋏之規定，移列第七款單獨規範，現行第七款「其他經主管機關公告禁止之方法」遞移至第八款，均全面禁止使用；第二項亦配合修正，並增訂主管機關得逕予排除之規定。\n二、依動物保護法施行細則第二條之一規定，獸鋏係指具強力彈簧之頜顎型或齒夾型結構，並以夾鉗方式捕捉動物之鋏狀器械。至於原住民族所用傳統獵具，與前開定義之型式不同者，非屬獸鋏範圍，併予敘明。"},{"bill":"202110006280000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏、金屬套索等易造成目標以外野生動物永久傷殘、死亡之工具。\n八、其他經主管機關公告禁止之方法。\n使用或設置前項各款之物品、網具、陷阱、獸鋏或其他獵具者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、獸鋏禁用之爭議由來已久，其使用之主要爭議在於強大殺傷力及因無差別性導致高誤殺傷率。如在僅需要驅趕野生動物情況下使用獸鋏，易造成動物不必要的死亡或傷殘，如使用在獵捕特定動物，又容易造成誤殺傷目標以外動物之情況，甚至常有保育類野生動物受害情形。\n二、除獸鋏外，與其具有相同爭議之狩獵工具如俗稱山豬吊的含金屬材質套索，皆屬於無差別高殺傷力陷阱，此類工具應全面禁止使用，爰授權主管機關以行政命令補充。\n三、參考動物保護法第十四條之一第二項規定，增訂主管機關得逕予排除之規定。"},{"bill":"202110006930000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏。\n八、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"為徹底杜絕野生動物因獸鋏使用不當致傷殘、死亡等情形，全面禁止使用獸鋏，其使用應與其他獵捕規範不同，爰將第一項第六款不得使用獸鋏之規定，移列第七款單獨規範，現行第七款「其他經主管機關公告禁止之方法」遞移至第八款，均全面禁止使用；第二項則配合修正，增訂主管機關得逕予排除之規定。"},{"bill":"202110010670000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱、獸鋏或特殊獵捕工具。\n七、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"明定使用法不容許方法獵捕野生動物者，主管機關得逕以排除或拆除並銷毀。"},{"bill":"202110010890000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏、金屬製吊索等易致目標以外動物死亡、受傷之無差別式獵具。\n八、其他經主管機關公告禁止之方法。\n使用或設置前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、獸鋏與金屬製吊索等獵具，其高殺傷力與無差別傷害之特性，已對野生動物生存造成極大威脅，應全面禁止。\n二、將獸鋏等獵具，由第六款獨立移列至第七款，以配合第二十一條例外之修訂。\n三、原第七款「其他經主管機關公告禁止之方法」移至第八款。\n四、參考動物保護法第十四條之一第二項規定，並增訂主關機關得逕予排除之規定。"},{"bill":"202110014230000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱、獸鋏或特殊獵捕工具。\n七、設置金屬材質之套索陷阱。\n八、其他經主管機關公告禁止之方法。\n未經許可擅自設置網具、陷阱、獸鋏、金屬材質之套索陷阱或其他獵具，主管機關得逕予拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"俗稱山豬吊的金屬套索，是以彈簧裝置束綁之陷阱，當動物無端觸碰，恐遭致肢體傷害，當動物基於生存本能嘗試掙扎逃脫，時常發生肢體受傷、殘缺案例，因身陷陷阱而遭活活餓死、渴死亦屢見不鮮，所受痛苦往往難以癒合，實在有違尊重生命及人道捕獵之國際趨勢。"},{"bill":"202110022260000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏。\n八、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、過去新聞報載時有發生因獸鋏使用不當導致造成野生動物斷腿傷殘等情形發生，但因情況不同。常有爭議產生。因此，現行規範全面禁止使用獸鋏，其使用應與陷阱、特殊獵捕工具之規範不同，爰將第一項第六款不得使用獸鋏之規定，以第七款單獨規範進行表列，現行第七款則遞移至第八款，均全面禁止使用。\n二、參考動物保護法第十四條之一第二項規定，增訂主管機關得逕予排除之規定。"},{"bill":"202110029160000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。但排除原住民族所用傳統獵具，如腳踏索、陷落器或中央主管機關會商中央原住民族主管機關認定之傳統獵具。\n七、使用獸鋏、鋼製吊索。\n八、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、為杜絕野生動物因獸鋏使用不當致斷腿傷殘等情形發生，全面禁止使用獸鋏，其使用應與陷阱、特殊獵捕工具之規範不同，爰將第一項第六款不得使用獸鋏之規定，移列第七款單獨規範，現行第七款「其他經主管機關公告禁止之方法」遞移至第八款，均全面禁止使用。\n二、依動物保護法施行細則第二條之一規定，獸鋏係指具強力彈簧之頜顎型或齒夾型結構，並以夾鉗方式捕捉動物之鋏狀器械。至於原住民族所用傳統獵具，與前開定義之型式不同者，非屬獸鋏範圍，併予敘明。\n三、原住民基於傳統文化、祭儀而有獵捕野生動物之必要者，其所使用之傳統獵具不受第十九第一項各款規定之限制。並明定傳統獵具之認定，須經中央主管機關會商中央原住民族主管機關討論後認定之。"},{"bill":"202110030620000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏。\n八、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"明定使用法不容許方法獵捕野生動物者，主管機關得逕以排除或拆除並銷毀。"},{"bill":"202110030460000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏、金屬製吊索等易致目標以外動物死亡、受傷之無差別式獵具。\n八、其他經主管機關公告禁止之方法。\n使用或設置前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、因獸鋏使用不當而造成的無差別性以及強大殺傷力已造成野生動物斷腿傷殘等情形頻繁發生，除獸鋏之外，與其有相同爭議之金屬製吊索（俗稱山豬吊）等無差別式獵具也應全面禁止，故修訂第七款之規定。\n二、原第七款「其他經主管機關公告禁止之方法」移至第八款。\n三、參考動物保護法第十四條之一第二項規定，酌作文字之修訂，並增訂主關機關得逕予排除之規定。"},{"bill":"202110053830000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏。\n八、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、本法雖有原則上不得使用獸鋏以獵捕野生動物之規定，但於危及公共安全或人類性命之虞等情形或原住民族基於其傳統文化、祭儀，而有獵捕、宰殺或利用野生動物之必要者，允許例外得使用獸鋏。惟近來因獸鋏使用不當致野生動物斷腿傷殘等案件時有所聞，廣受關注，為澈底防杜獸鋏之不當傷害，爰將現行獸鋏管理強度提高至全面禁止使用，爰將第一項第六款不得使用獸鋏之規定，以第七款單獨規範進行表列，現行第七款則遞移至第八款，均全面禁止使用，以杜絕使用不當致野生動物傷殘，維護人道對待動物之普世價值。\n二、爰參照《動物保護法》第十四條之一第二項之規定，增訂主管機關得逕予排除之規定。"},{"bill":"202110072950000","text":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用腐蝕性物質。\n六、使用獵槍以外之其他種類槍械。\n七、使用陷阱或特殊獵捕工具。\n八、使用獸鋏、金屬製吊索等易致目標以外動物死亡、受傷之無差別式獵具。\n九、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","note":"一、為落實杜絕使用不當之獵捕工具致野生動物傷殘，維護人道對待動物之普世價值，並避免本法與動物保護法規定之適用爭議及落實處罰明確性原則，爰參酌動物保護法第十四條之一第一項規定，將腐蝕性物質列入本法第一項各款之禁用範圍，其餘款次依序移列。\n二、為杜絕野生動物因獸鋏使用不當致斷腿傷殘等情形發生，全面禁止使用獸鋏，其使用應與陷阱、特殊獵捕工具之規範不同，爰將第一項第六款不得使用獸鋏之規定，並增訂金屬製吊索等導致動物傷亡之無差別獵具等文字，共同移列第八款單獨規範。\n三、第二項配合修正，增訂主管機關得逕予排除之規定。"}],"changed":true,"final":"獵捕野生動物，不得以下列方法為之：\n一、使用炸藥或其他爆裂物。\n二、使用毒物。\n三、使用電氣、麻醉物或麻痺之方法。\n四、架設網具。\n五、使用獵槍以外之其他種類槍械。\n六、使用陷阱或特殊獵捕工具。\n七、使用獸鋏。\n八、其他經主管機關公告禁止之方法。\n使用前項各款所定方法獵捕野生動物者，主管機關得逕予排除或拆除並銷毀之。土地所有人、使用人或管理人不得規避、拒絕或妨礙。","finalWhy":"一、為杜絕野生動物因獸鋏使用不當致斷腿傷殘等情形發生，全面禁止使用獸鋏，其使用應與陷阱、特殊獵捕工具之規範不同，爰將第一項第六款不得使用獸鋏之規定，移列第七款單獨規範，原第七款「其他經主管機關公告禁止之方法」遞移至第八款，均全面禁止使用；第二項亦配合修正，並增訂主管機關得逕予排除之規定。\n二、依動物保護法施行細則第二條之一規定，獸鋏係指具強力彈簧之頜顎型或齒夾型結構，並以夾鉗方式捕捉動物之鋏狀器械。至於原住民族所用傳統獵具，與前開定義之型式不同者，非屬獸鋏範圍，併予敘明。","review":{"note":"所有提案及修正動議2案均保留，送院會處理","text":""}},{"no":"第二十一條","current":"野生動物有下列情形之一，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項各款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞者。\n二、危害農林作物、家禽、家畜或水產養殖者。\n三、傳播疾病或病蟲害者。\n四、有妨礙航空安全之虞者。\n五、（刪除）。\n六、其他經主管機關核准者。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","versions":[{"bill":"202110006020000","text":"野生動物有下列情形之一者，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞。\n二、危害農林作物、家禽、家畜或水產養殖。\n三、傳播疾病或病蟲害。\n四、有妨礙航空安全之虞。\n五、其他經主管機關核准之情形。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"一、修正第一項。\n二、因獸鋏使用不當傷害野生動物案件嚴重影響我國動物保護形象，為防杜獸鋏不當傷害野生動物案件，有將現行獸鋏管理強度提高至全面禁止使用之必要，爰將現行得使用獸鋏之例外規定予以刪除。又配合修正條文第十九條第一項第八款及第二項已明文禁止以其他經主管機關公告禁止之方法獵捕野生動物，即不宜有例外得使用之情形，爰修正第一項序文；另酌作文字修正，各款並配合刪除「者」字。\n三、現行第一項第五款業於93年2月4日修正刪除，無保留款次必要，爰予刪除，另配合將第六款款次移列為第五款。"},{"bill":"201110005110000","text":"野生動物有下列情形之一者，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞。\n二、危害農林作物、家禽、家畜或水產養殖。\n三、傳播疾病或病蟲害。\n四、有妨礙航空安全之虞。\n五、其他經主管機關核准之情形。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"一、因獸鋏使用不當傷害野生動物案件嚴重影響我國動物保護形象，為澈底防杜獸鋏不當傷害野生動物案件，有將現行獸鋏管理強度提高至全面禁止使用之必要，現行得使用獸鋏之例外規定宜予刪除；又配合修正條文第十九條第一項第八款及第二項已明文禁止以其他經主管機關公告禁止之方法獵捕野生動物，即不宜有例外得使用之情形，爰修正第一項序文；另酌作文字修正，各款並配合刪除「者」字。\n二、現行第一項第五款業於九十三年二月四日修正刪除，無保留款次必要，爰予刪除，另配合將第六款款次移列為第五款。\n三、第二項未修正。"},{"bill":"202110006280000","text":"野生動物有下列情形之一，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞者。\n二、危害農林作物、家禽、家畜或水產養殖者。\n三、傳播疾病或病蟲害者。\n四、有妨礙航空安全之虞者。\n五、其他經主管機關核准者。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"一、為避免誤傷保育類野生動物、減少因不人道獵捕行為致目標以外野生動物死亡傷殘等案件影響民眾觀感及我國形象，全面禁用使用獸鋏有其必要，同理，其他具有強大殺傷力及高誤傷率之工具亦應全面禁止，爰修正本條，第十九條第一項第七款不得為例外使用。\n二、現行第一項第五款已於2004年修正刪除，無保留之必要，爰將第六款移列至第五款。"},{"bill":"202110010670000","text":"野生動物有下列情形之一者，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項各款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞者。\n二、危害農林作物、家禽、家畜或水產養殖者。\n三、傳播疾病或病蟲害者。\n四、有妨礙航空安全之虞者。\n五、其他經主管機關核准之情形。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"第一項酌作文字及項次的調整。"},{"bill":"202110010890000","text":"野生動物有下列情形之一，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第三款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞者。\n二、危害農林作物、家禽、家畜或水產養殖者。\n三、傳播疾病或病蟲害者。\n四、有妨礙航空安全之虞者。\n五、其他經主管機關核准者。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"一、炸藥與爆裂物、毒物、獸鋏、金屬製吊索等，皆為高殺傷力無差別傷害之獵補方式，手段目的顯不符比例原則，與其他主管機關已公告禁止之方法皆不應成為例外。\n二、現行第一項第五款已修正刪除，無保留款次必要，並配合將第六款款次移列為第五款。"},{"bill":"202110014230000","text":"野生動物有下列情形之一，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第三款至第五款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞者。\n二、危害農林作物、家禽、家畜或水產養殖者。\n三、傳播疾病或病蟲害者。\n四、有妨礙航空安全之虞者。\n五、（刪除）。\n六、其他經主管機關核准者。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"野生動物有危害農漁牧業發展及人類生命之虞，在維護自然生態之權衡下，允許人道方式捕獵，惟針對野生動物防治，採取模式應避免過激手段，故將緊急情況下捕獵野生動物方式，限制在現行第十九條第一項第三款至第五款較具人道精神之獵捕規定。"},{"bill":"202110022260000","text":"野生動物有下列情形之一者，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞。\n二、危害農林作物、家禽、家畜或水產養殖。\n三、傳播疾病或病蟲害。\n四、有妨礙航空安全之虞。\n五、其他經主管機關核准之情形。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"一、因獸鋏使用不當導致傷害野生動物案件嚴重影響我國動物保護形象，為澈底防杜獸鋏不當傷害野生動物案件，有將現行獸鋏管理強度提高至全面禁止使用之必要，現行得使用獸鋏之例外規定宜予刪除\n二、配合修正條文，調整款項次。"},{"bill":"202110029160000","text":"野生動物有下列情形之一，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞者。\n二、危害農林作物、家禽、家畜或水產養殖者。\n三、傳播疾病或病蟲害者。\n四、有妨礙航空安全之虞者。\n五、其他經主管機關核准者。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"一、因獸鋏使用不當傷害野生動物案件嚴重影響我國動物保護形象，為澈底防杜獸鋏不當傷害野生動物案件，有將現行獸鋏管理強度提高至全面禁止使用之必要，現行得使用獸鋏之例外規定宜予刪除；又配合修正條文第十九條第一項第八款及第二項已明文禁止以其他經主管機關公告禁止之方法獵捕野生動物，即不宜有例外得使用之情形，爰修正第一項序文。\n二、現行第一項第五款業於九十三年二月四日修正刪除，無保留款次必要，爰予刪除，另配合將第六款款次移列為第五款。"},{"bill":"202110030620000","text":"野生動物有下列情形之一者，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞者。\n二、危害農林作物、家禽、家畜或水產養殖者。\n三、傳播疾病或病蟲害者。\n四、有妨礙航空安全之虞者。\n五、其他經主管機關核准之情形。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"第一項酌作文字及項次的調整。"},{"bill":"202110030460000","text":"野生動物有下列情形之一，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞者。\n二、危害農林作物、家禽、家畜或水產養殖者。\n三、傳播疾病或病蟲害者。\n四、有妨礙航空安全之虞者。\n五、其他經主管機關核准者。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"一、使用獸鋏等無差別獵具致動物死傷案件已經嚴重影響我國動物保護形象，為澈底杜絕獸鋏不當傷害野生動物案件，應全面禁止獸鋏等無差別獵具之使用，且對於業經主管機關公告禁止之方法，亦不得成為例外。\n二、現行第一項第五款業於九十三年二月四日修正刪除，無保留款次必要，爰予刪除，另配合將第六款款次移列為第五款。"},{"bill":"202110072950000","text":"野生動物有下列情形之一者，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第七款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞。\n二、危害農林作物、家禽、家畜或水產養殖。\n三、傳播疾病或病蟲害。\n四、有妨礙航空安全之虞。\n五、其他經主管機關核准之情形。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","note":"一、因獸鋏使用不當傷害野生動物案件嚴重影響我國動物保護形象，為澈底防杜獸鋏不當傷害野生動物案件，有將現行獸鋏管理強度提高至全面禁止使用之必要，現行得使用獸鋏之例外規定宜予刪除；又配合修正條文第十九條第一項第九款及第二項已明文禁止以其他經主管機關公告禁止之方法獵捕野生動物，即不宜有例外得使用之情形，爰修正第一項序文；另酌作文字修正，各款並配合刪除「者」字。\n二、現行第一項第五款業於九十三年二月四日修正刪除，無保留款次必要，爰予刪除，另配合將第六款款次移列為第五款。\n三、第二項未修正。"}],"changed":true,"final":"野生動物有下列情形之一者，得予以獵捕或宰殺，不受第十七條第一項、第十八條第一項及第十九條第一項第二款至第六款規定之限制。但保育類野生動物除情況緊急外，應先報請主管機關處理：\n一、有危及公共安全或人類性命之虞。\n二、危害農林作物、家禽、家畜或水產養殖。\n三、傳播疾病或病蟲害。\n四、有妨礙航空安全之虞。\n五、其他經主管機關核准之情形。\n保育類野生動物有危害農林作物、家禽、家畜或水產養殖，在緊急情況下，未及報請主管機關處理者，得以主管機關核定之人道方式予以獵捕或宰殺以防治危害。","finalWhy":"一、因第十九條第一項第一款所定炸藥或其他爆裂物及第七款所定獸鋏等使用不當傷害野生動物案件嚴重影響我國動物保護形象，為澈底防杜使用殺傷力強大之方法，傷害野生動物案件一再發生，有將原炸藥、爆裂物及獸鋏等管理強度，提高至全面禁止使用之必要性，原得例外使用炸藥或其他爆裂物及獸鋏之規定宜予刪除；又配合修正條文第十九條第一項第八款及第二項已明文禁止以其他經主管機關公告禁止之方法獵捕野生動物，即不宜有例外得使用之情形，爰修正第一項序文；另酌作文字修正，各款並配合刪除「者」字。\n二、原第一項第五款業於九十三年二月四日修正刪除，無保留款次必要，爰予刪除，另配合將第六款款次移列為第五款。\n三、第二項未修正。","review":{"note":"所有提案及修正動議1案均保留，送院會處理","text":""}},{"no":"第二十一條之一","current":"台灣原住民族基於其傳統文化、祭儀，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項各款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准，其申請程序、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域及其他應遵循事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","versions":[{"bill":"202110006020000","text":"臺灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關備查，其得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵行事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、修正第一項及第二項。\n二、按司法院大法官釋字第803號解釋，第一項所稱「傳統文化」，應包含原住民依其所屬部落族群所傳承之飲食與生活文化，而以自行獵獲之野生動物供自己、家人或部落親友食用或作為工具器物之非營利性自用之情形；立法者對原住民基於傳統文化下非營利性自用而獵捕、宰殺或利用野生動物之行為予以規範，或授權主管機關訂定管制規範時，除有特殊例外，其得獵捕、宰殺或利用之野生動物，應不包括保育類野生動物；第二項前段規定所採之事前申請核准之管制手段，尚不違反憲法比例原則，惟主管機關就第二項授權辦法有關原住民非定期性獵捕活動提出之狩獵申請，應依該解釋意旨就具體個案情形為多元彈性措施。\n三、次按《原住民族基本法》第十九條第一項第一款、第三項規定，原住民得在原住民族地區及經中央原住民族主管機關公告之海域依法從事非營利之獵捕野生動物行為，並以傳統文化、祭儀或自用為限。因此，修正第一項，將「非營利自用」，增列為原住民族獵捕、宰殺或利用野生動物合法、必要行為之要件。\n四、原住民族之傳統文化、祭儀依法應受保護與尊重，惟獸鋏及其他經主管機關公告禁止之方法，其使用易對野生動物造成極大傷害，且獵捕野生動物仍可使用其他傳統獵具及方法，因此，禁用獸鋏及其他經主管機關公告禁止之方法，應無礙原住民族傳統狩獵文化之傳承。為符合原住民族基本法之規定，平衡對原住民族傳統文化之尊重與人道對待動物之普世價值，爰修正第一項不受相關規定限制之範圍，使修正條文第十九條第一項第七款及第八款所定獸鋏及其他經主管機關公告禁止之方法，均不得例外使用。\n五、為落實前揭大法官解釋意旨，修正第二項刪除現行之事前申請核准制，以免牴觸原住民族傳統狩獵禁忌及實務面窒礙難行之處，並將第二項前段修正採「備查」制，並將得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件及管理等應遵行事項，納入第二項後段授權訂定辦法之項目，以符前揭司法院解釋意旨及法律授權明確性原則。"},{"bill":"201110005110000","text":"臺灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查；其申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵行事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、依司法院釋字第八○三號解釋，第一項所稱「傳統文化」，應包含原住民依其所屬部落族群所傳承之飲食與生活文化，而以自行獵獲之野生動物供自己、家人或部落親友食用或作為工具器物之非營利性自用之情形；立法者對原住民基於傳統文化下非營利性自用而獵捕、宰殺或利用野生動物之行為予以規範，或授權主管機關訂定管制規範時，除有特殊例外，其得獵捕、宰殺或利用之野生動物，應不包括保育類野生動物；第二項前段規定所採之事前申請核准之管制手段，尚不違反憲法比例原則，惟主管機關就第二項授權辦法有關原住民非定期性獵捕活動提出之狩獵申請，應依該解釋意旨就具體個案情形為多元彈性措施。\n二、依原住民族基本法第十九條第一項第一款、第三項規定，原住民得在原住民族地區及經中央原住民族主管機關公告之海域依法從事非營利之獵捕野生動物行為，並以傳統文化、祭儀或自用為限；又原住民族委員會與前行政院農業委員會於一百零六年六月八日會銜核釋本條第一項所定「臺灣原住民族基於其傳統文化、祭儀，而有獵捕、宰殺或利用野生動物之必要者」，包括依原住民族基本法第十九條規定之「非營利自用」行為，爰修正第一項，增列「非營利自用」之要件，納入原住民族非營利自用而獵捕、宰殺或利用野生動物之行為，並酌作文字修正。\n三、原住民族之傳統文化、祭儀依法應受保護與尊重，惟獸鋏及其他經主管機關公告禁止之方法，其使用易對野生動物造成極大傷害，且獵捕野生動物仍可使用其他傳統獵具及方法，因此，禁用獸鋏及其他經主管機關公告禁止之方法，應無礙原住民族傳統狩獵文化之傳承。為符合原住民族基本法之規定，平衡對原住民族傳統文化之尊重與人道對待動物之普世價值，爰修正第一項不受相關規定限制之範圍，使修正條文第十九條第一項第七款及第八款所定獸鋏及其他經主管機關公告禁止之方法，均不得例外使用。\n四、為因應司法院釋字第八○三號解釋意旨，並考量現行第二項規定一律採事前申請核准，除與原住民族傳統狩獵禁忌牴觸外，部分情形在實務上亦窒礙難行，例如除喪儀式，因喪期無法預知，從而無法事先申請核准，爰於第二項前段增列「或備查」之規定，並將申請核准或備查之情形，納入後段授權訂定辦法之事項，以符實際。另前揭司法院解釋理由書略以原住民因非營利自用之需而申請獵捕、宰殺或利用保育類野生動物，應採特別嚴格之管制手段，僅於特殊例外始得予許可，爰將得獵捕、宰殺或利用保育類野生動物之必要情形及應檢附文件等，亦納入第二項後段授權訂定辦法之事項，以符法律授權明確性原則。"},{"bill":"202110006280000","text":"台灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查，其申請或備查之應檢附文件、程序，及其獵捕方式、傳統獵具、獵捕動物之種類、數量、獵捕期間、區域及其他應遵循事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、根據司法院大法官釋字第803號解釋意旨，對原住民族之傳統文化保障，應包括部落族群所傳承之飲食與生活習慣，應允許原住民自行獵捕「非保育類」野生動物供自己、家人或部落親友食用或做為工具器物之非營利性自用情形，爰增訂非營利自用獵捕、宰殺或利用或利用野生動物之情形。\n二、為進一步鬆綁對原住民之獵捕、宰殺或利用野生動物之限制，除原本規定之事前申請主管機關核准之許可制外，增訂開放事後報備之備查制。\n三、原住民族使用傳統獵具應不在第十九條規範範圍內，其傳統獵具之定義、種類，應授權由主管機關與原住民族主管機關會商定之。"},{"bill":"202110010670000","text":"台灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項各款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查，其申請或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、程序、應檢附文件、獵捕方式、原住民族傳統獵具（含獸鋏）、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵循事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、為原住民族基本法第十九條第一項第一款、第三項規定，原住民得在原住民族地區及經中央原住民族主管機關公告之海域依法從事非營利之獵捕野生動物行為，並以傳統文化、祭儀或自用為限，爰修正第一項，增列「非營利自用」之要件，納入原住民族非營利自用而獵捕、宰殺或利用野生動物之行為，並酌作文字修正。\n二、為因應司法院釋字第八○三號解釋意旨，並考量現行第二項規定一律採事前申請核准，除與原住民族傳統狩獵禁忌牴觸外，部分情形在實務上亦窒礙難行，例如除喪儀式，因喪期無法預知，從而無法事先申請核准，爰於第二項前段增列「或備查」之規定，並將申請核准或備查之情形，納入後段授權訂定辦法之事項，以符實際。另前揭司法院解釋理由書略以原住民因非營利自用之需而申請獵捕、宰殺或利用保育類野生動物，應採特別嚴格之管制手段，僅於特殊例外始得予許可，爰將得獵捕、宰殺或利用保育類野生動物之必要情形及應檢附文件等，亦納入第二項後段授權訂定辦法之事項，以符法律授權明確性原則。"},{"bill":"202110010890000","text":"臺灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第三款至第六款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查；其申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵行事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、為符合原住民族基本法第十九條之規範，且據司法院釋字第八○三號解釋，修正第一項，增列要件「非營利自用」。\n二、無差別式傷害之獵具與獵捕方式與其他經主管機關公告禁止之方法，易造成目標之外動物嚴重傷害。原住民族傳統文化依法受保護尊重，惟傳統獵具及方法並不在禁止之列，故應無阻礙原住民族文化傳承之虞。\n三、現行第二項規定一律採事前申請核准，實務上窒礙難行。增列「或備查」之規定，以符司法院釋字精神與實際情形。"},{"bill":"202110014230000","text":"台灣原住民族基於其傳統文化、祭儀，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第三款至第五款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准，其申請程序、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域及其他應遵循事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"基於尊重原住民傳統狩獵文化，林務局根據本法訂定「原住民族基於傳統文化及祭儀需要獵捕宰殺利用野生動物管理辦法」，惟應避免非人道之行徑，故將捕獵方式限制在現行第十九條第一項第三款至第五款，以兼顧原住民族文化傳承與對生命之敬重。"},{"bill":"202110022260000","text":"臺灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查；其申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵行事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、依司法院釋字第八○三號解釋，第一項所稱「傳統文化」，應包含原住民依其所屬部落族群所傳承之飲食與生活文化，而以自行獵獲之野生動物供自己、家人或部落親友食用或作為工具器物之非營利性自用之情形；立法者對原住民基於傳統文化下非營利性自用而獵捕、宰殺或利用野生動物之行為予以規範，或授權主管機關訂定管制規範時，除有特殊例外，其得獵捕、宰殺或利用之野生動物，應不包括保育類野生動物；第二項前段規定所採之事前申請核准之管制手段，尚不違反憲法比例原則，惟主管機關就第二項授權辦法有關原住民非定期性獵捕活動提出之狩獵申請，應依該解釋意旨就具體個案情形為多元彈性措施。\n二、依原住民族基本法第十九條第一項第一款、第三項規定，原住民得在原住民族地區及經中央原住民族主管機關公告之海域依法從事非營利之獵捕野生動物行為，並以傳統文化、祭儀或自用為限；又原住民族委員會與前行政院農業委員會於一百零六年六月八日會銜核釋本條第一項所定「臺灣原住民族基於其傳統文化、祭儀，而有獵捕、宰殺或利用野生動物之必要者」，包括依原住民族基本法第十九條規定之「非營利自用」行為，爰修正第一項，增列「非營利自用」之要件，納入原住民族非營利自用而獵捕、宰殺或利用野生動物之行為，並酌作文字修正。\n三、原住民族之傳統文化、祭儀依法應受保護與尊重，惟獸鋏及其他經主管機關公告禁止之方法，其使用易對野生動物造成極大傷害，且獵捕野生動物仍可使用其他傳統獵具及方法，因此，禁用獸鋏及其他經主管機關公告禁止之方法，應無礙原住民族傳統狩獵文化之傳承。為符合原住民族基本法之規定，平衡對原住民族傳統文化之尊重與人道對待動物之普世價值，爰修正第一項不受相關規定限制之範圍，使修正條文第十九條第一項第七款及第八款所定獸鋏及其他經主管機關公告禁止之方法，均不得例外使用。\n四、為因應司法院釋字第八○三號解釋意旨，並考量現行第二項規定一律採事前申請核准，除與原住民族傳統狩獵禁忌牴觸外，部分情形在實務上亦窒礙難行，例如除喪儀式，因喪期無法預知，從而無法事先申請核准，爰於第二項前段增列「或備查」之規定，並將申請核准或備查之情形，納入後段授權訂定辦法之事項，以符實際。另前揭司法院解釋理由書略以原住民因非營利自用之需而申請獵捕、宰殺或利用保育類野生動物，應採特別嚴格之管制手段，僅於特殊例外始得予許可，爰將得獵捕、宰殺或利用保育類野生動物之必要情形及應檢附文件等，亦納入第二項後段授權訂定辦法之事項，以符法律授權明確性原則。"},{"bill":"202110029160000","text":"台灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項各款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查，其申請核准或備查之情形、部落自主管理之方式、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、應備文件及其他應遵循事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、查原住民族獵捕、宰殺或利用野生動物之行為並不單純以傳統文化、祭儀為主，其中還包含為自己或族人狩獵自用之文化習慣，且原住民族基本法第十九條第二項亦規定，獵捕野生動物以傳統文化、祭儀或自用為限。爰於第一項增列「非營利自用」文字，以符法制並合乎實際民情。\n二、原住民族基本法第十九條明文規定原住民得在原住民族地區依法從事非營利之獵捕野生動物，然本法卻規定獵捕行為應經農業部核准，且相關獵捕辦法亦規定由農業部會同原民會定之，顯已違反原住民族基本法的立法精神與意旨。有鑒於非營利自用部分，原住民傳統慣俗中，並非僅於祭儀期間才會進行相關狩獵或宰殺野生動物之行為，自用部分亦係體現原住民族生活傳統的重要元素之一。故於本條文第二項增定，原住民於原住民族地區基於非營利目的而少量自用者得排除該辦法之適用，且可採備查程序，以及部落自主管理之方式予以辦理，以尊重原住民族傳統文化。"},{"bill":"202110030620000","text":"臺灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查；其申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵行事項之辦法，由中央主管機關會同中央原住民族主管機關定之。\n因第一項情形而使用獸鋏，於本法中華民國○年○月○日修正後二年內向中央主管機關自動報繳，免受其處罰，其期間必要時得延長一次，不得超過一年，中央主管機關應輔導其取得所需之改良式獵具。","note":"一、為原住民族基本法第十九條第一項第一款、第三項規定，原住民得在原住民族地區及經中央原住民族主管機關公告之海域依法從事非營利之獵捕野生動物行為，並以傳統文化、祭儀或自用為限，爰修正第一項，增列「非營利自用」之要件，納入原住民族非營利自用而獵捕、宰殺或利用野生動物之行為，並酌作文字修正。\n二、為因應司法院釋字第八○三號解釋意旨，並考量現行第二項規定一律採事前申請核准，除與原住民族傳統狩獵禁忌牴觸外，部分情形在實務上亦窒礙難行，例如除喪儀式，因喪期無法預知，從而無法事先申請核准，爰於第二項前段增列「或備查」之規定，並將申請核准或備查之情形，納入後段授權訂定辦法之事項，以符實際。另前揭司法院解釋理由書略以原住民因非營利自用之需而申請獵捕、宰殺或利用保育類野生動物，應採特別嚴格之管制手段，僅於特殊例外始得予許可，爰將得獵捕、宰殺或利用保育類野生動物之必要情形及應檢附文件等，亦納入第二項後段授權訂定辦法之事項，以符法律授權明確性原則。"},{"bill":"202110030460000","text":"臺灣原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第六款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查；其申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵行事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、依司法院釋字第八○三號解釋，第一項所稱「傳統文化」包含非營利自用，但狩獵對象基於野生動物保育與自然生態平衡的考量，除非有特殊例外，應不包括保育類野生動物。爰修正第一項，增列「非營利自用」之要件，納入原住民族非營利自用而獵捕、宰殺或利用野生動物之行為，並酌作文字修正。\n二、原住民族之傳統文化、祭儀依法應受保護與尊重，惟獸鋏、無差別式獵具及其他經主管機關公告禁止之方法，易造成目標之外動物斷肢、死亡等極大之傷害，且獵捕野生動物仍可使用其他傳統獵具及方法，因此，禁用獸鋏、無差別式獵具及其他經主管機關公告禁止之方法，應無礙原住民族傳統狩獵文化之傳承。\n三、為因應司法院釋字第八○三號解釋意旨，並考量現行第二項規定一律採事前申請核准，除與原住民族傳統狩獵禁忌牴觸外，部分情形在實務上亦窒礙難行，例如除喪儀式，因喪期無法預知，從而無法事先申請核准，爰於前段增列「或備查」之規定，並將申請核准或備查之情形，納入後段授權訂定辦法之事項，以符實際。"},{"bill":"202110072950000","text":"臺灣原住民族基於其傳統文化、祭儀或自用之非營利目的，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第一款至第七款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查；其申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵行事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","note":"一、依原住民族基本法第十九條第一項及第三項規定，不論傳統文化、祭儀或自用均應限於非營利目的，並非僅將自用限於非營利，爰於第一項前段用語明定為「傳統文化、祭儀或自用之非營利目的」。\n二、依司法院釋字第八○三號解釋，對原住民基於傳統文化下非營利性自用而獵捕、宰殺或利用野生動物之行為予以規範，或授權主管機關訂定管制規範時，除有特殊例外，其得獵捕、宰殺或利用之野生動物，應不包括保育類野生動物；第二項前段規定所採之事前申請核准之管制手段，尚不違反憲法比例原則。\n三、原住民族之傳統文化、祭儀依法應受保護與尊重，惟獸鋏及其他經主管機關公告禁止之方法，其使用易對野生動物造成極大傷害，且獵捕野生動物仍可使用其他傳統獵具及方法，因此，禁用獸鋏及其他經主管機關公告禁止之方法，應無礙原住民族傳統狩獵文化之傳承。為符合原住民族基本法之規定，平衡對原住民族傳統文化之尊重與人道對待動物之普世價值，爰修正第一項，使修正條文第十九條第一項第八款及第九款所定獸鋏、金屬製吊索及其他經主管機關公告禁止之方法，均不得例外使用。\n四、考量現行第二項規定一律採事前申請核准，除與原住民族傳統狩獵禁忌牴觸外，部分情形在實務上亦窒礙難行，例如除喪儀式，因喪期無法預知，從而無法事先申請核准，爰於第二項前段增列「或備查」之規定，並將申請核准或備查之情形，納入後段授權訂定辦法之事項，以符實際。另司法院釋字第八○三號解釋理由書略以原住民因非營利自用之需而申請獵捕、宰殺或利用保育類野生動物，應採特別嚴格之管制手段，僅於特殊例外始得予許可，爰將得獵捕、宰殺或利用保育類野生動物之必要情形及應檢附文件等，亦納入第二項後段授權訂定辦法之事項，以符法律授權明確性原則。"}],"changed":true,"final":"原住民族基於其傳統文化、祭儀或非營利自用，而有獵捕、宰殺或利用野生動物之必要者，不受第十七條第一項、第十八條第一項及第十九條第一項第二款至第六款規定之限制。\n前項獵捕、宰殺或利用野生動物之行為應經主管機關核准或備查；其申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、申請程序、應檢附文件、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域、管理及其他應遵行事項之辦法，由中央主管機關會同中央原住民族主管機關定之。","finalWhy":"","review":{"note":"所有提案及修正動議1案均保留，送院會處理","text":""}},{"no":"第二十五條","current":"學術研究機構、大專校院、公立或政府立案之私立動物園、博物館或展示野生動物者，輸入或輸出保育類野生動物或其產製品，應經中央主管機關同意。","versions":[{"bill":"202110072950000","text":"學術研究機構、大專校院、公立或政府立案之私立動物園、博物館或展示野生動物者，輸入或輸出保育類野生動物或其產製品，應具環境教育機構之資格，並經中央主管機關同意。","note":"一、1992年世界各國在里約地球高峰會議簽署「生物多樣性公約」（Convention on Biological Diversity, CBD）所揚櫫的「保育生物多樣性」、「永續利用其組成」及「公平合理的分享利用生物多樣性遺傳資源所產生的利益」三大目標，促使我國致力於國內及全球生物多樣性保育工作。\n二、另根據世界動物園暨水族館協會（WAZA）在《為保育而做的社會變革：世界動物園暨水族館教育方略》提及動物園和水族館等機構設立之目的應帶來轉變，例如建立民眾對物種、自然的知識和理解；鼓勵支持親環境行為及行動；促進對物種、自然的敬畏及啟發等有關推動全民保育教育之使命。\n三、參考國際保育發展之趨勢，爰修正本條所規範之展示野生動物者，輸入或輸出保育類野生動物或其產製品，應具備環境教育機構之資格。"}],"changed":false,"final":"學術研究機構、大專校院、公立或政府立案之私立動物園、博物館或展示野生動物者，輸入或輸出保育類野生動物或其產製品，應經中央主管機關同意。","finalWhy":null,"review":null},{"no":"第三十一條","current":"於中央主管機關指定公告前，飼養或繁殖保育類及有害生態環境、人畜安全之虞之原非我國原生種野生動物或持有中央主管機關指定公告之保育類野生動物產製品，其所有人或占有人應填具資料卡，於規定期限內，報請當地直轄市、縣（市）主管機關登記備查；變更時，亦同。\n於中央主管機關指定公告後，因核准輸入、轉讓或其他合法方式取得前項所列之野生動物或產製品者，所有人或占有人應於規定期限內，持證明文件向直轄市、縣（市）主管機關登記備查；變更時，亦同。\n依前二項之規定辦理者，始得繼續飼養或持有，非基於教育或學術研究目的，並經主管機關同意，不得再行繁殖。\n本法修正公布施行前已飼養或繁殖之第一項所列之野生動物，主管機關應於本法修正公布施行之日起三年內輔導業者停止飼養及轉業，並得視情況予以收購。\n前項收購之野生動物，主管機關應為妥善之安置及管理，並得分送國內外教育、學術機構及動物園或委託主管機關評鑑合格之管理單位代為收容、暫養。\n主管機關認為必要時，得自行或委託有關機關、團體對第一項、第二項所列之野生動物或產製品實施註記；並得定期或不定期查核，所有人或占有人不得規避、拒絕或妨礙。\n前項需註記之野生動物及產製品之種類，由中央主管機關公告之。","versions":[{"bill":"202110022260000","text":"於中央主管機關指定公告前，飼養或繁殖保育類及有害生態環境、人畜安全之虞之原非我國原生種野生動物或持有中央主管機關指定公告之保育類野生動物產製品，其所有人或占有人應填具資料卡，於規定期限內，報請當地直轄市、縣（市）主管機關登記備查或審查；變更時，亦同。\n於中央主管機關指定公告後，因核准輸入、轉讓或其他合法方式取得前項所列之野生動物或產製品者，所有人或占有人應於規定期限內，持證明文件向直轄市、縣（市）主管機關登記備查或審查；變更時，亦同。\n依前二項之規定辦理者，始得繼續飼養或持有，非基於教育或學術研究目的，並經主管機關同意，不得再行繁殖。\n中央主管機關針對第一項、第二項登記備查或審查之野生動物及其製品，應公告相關程序、種類及其他應遵行辦理事項。\n依第一項、第二項之規定辦理者，始得繼續飼養或持有，非基於教育或學術研究目的，並經主管機關同意，不得再行繁殖。\n本法修正公布施行前已飼養或繁殖之第一項所列之野生動物，主管機關應於本法修正公布施行之日起三年內輔導業者停止飼養及轉業，並得視情況予以收購。\n前項收購之野生動物，主管機關應為妥善之安置及管理，並得分送國內外教育、學術機構及動物園或委託主管機關評鑑合格之管理單位代為收容、暫養。\n主管機關認為必要時，得自行或委託有關機關、團體對第一項、第二項所列之野生動物或產製品實施註記；並得定期或不定期查核，所有人或占有人不得規避、拒絕或妨礙。\n前項需註記之野生動物及產製品之種類，由中央主管機關公告之。","note":"一、新增第四項，原第四項遞移並作文字修正。\n二、第一項及第二項酌修文字。鑒於目前市面上所可飼養或繁殖之野生動物物種繁多，其危險性各有不同，若機關或飼育者欲飼養較危險之物種，現行只有向主管機關登記備查，恐有管理過於寬鬆之虞。故增訂部分物種應向主管機關備齊相關計畫提出審查之規範。\n三、另鑒於大型或肉食性野生動物逸失後可能造成嚴重災損，故主管機關應優先以相關類型之野生動物物種制定為危險野生動物名錄。同時機關或飼育者提出申請時應提供動物逸失圍捕計畫及管理方式等資料以供審查。故增訂第四項之規範。"}],"changed":false,"final":"於中央主管機關指定公告前，飼養或繁殖保育類及有害生態環境、人畜安全之虞之原非我國原生種野生動物或持有中央主管機關指定公告之保育類野生動物產製品，其所有人或占有人應填具資料卡，於規定期限內，報請當地直轄市、縣（市）主管機關登記備查；變更時，亦同。\n於中央主管機關指定公告後，因核准輸入、轉讓或其他合法方式取得前項所列之野生動物或產製品者，所有人或占有人應於規定期限內，持證明文件向直轄市、縣（市）主管機關登記備查；變更時，亦同。\n依前二項之規定辦理者，始得繼續飼養或持有，非基於教育或學術研究目的，並經主管機關同意，不得再行繁殖。\n本法修正公布施行前已飼養或繁殖之第一項所列之野生動物，主管機關應於本法修正公布施行之日起三年內輔導業者停止飼養及轉業，並得視情況予以收購。\n前項收購之野生動物，主管機關應為妥善之安置及管理，並得分送國內外教育、學術機構及動物園或委託主管機關評鑑合格之管理單位代為收容、暫養。\n主管機關認為必要時，得自行或委託有關機關、團體對第一項、第二項所列之野生動物或產製品實施註記；並得定期或不定期查核，所有人或占有人不得規避、拒絕或妨礙。\n前項需註記之野生動物及產製品之種類，由中央主管機關公告之。","finalWhy":null,"review":{"note":"不予通過，維持現行法條文","text":""}},{"no":"第三十七條","current":"瀕臨絕種及珍貴稀有野生動物於飼養繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應自行或報請當地主管機關協助圍捕。","versions":[{"bill":"202110006020000","text":"保育類野生動物於飼養或繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行積極圍捕；並得報請該直轄市、縣（市）主管機關協助圍捕，協助圍捕所需相關費用，由所有人或占有人負擔。\n逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，得由所有人或占有人負擔。","note":"一、修正第一項並增訂第二項。\n二、本法將野生動物區分為一般類及保育類野生動物，以規範不同之管理密度。保育類野生動物因其於棲息環境之族群量降低，生存已面臨危機，需加強保護，爰除本法或其他法令另有規定外，不得飼養或繁殖保育類野生動物，針對例外飼養或繁殖保育類野生動物之所有人或占有人，有加強其管理義務之必要，且保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚至影響他人生命財產安全，有必要加重其所有人或占有人通報及積極圍捕之義務。至野生之脊椎動物如受人為飼養或管領，亦屬動物保護法所稱動物，其飼主之飼養管理義務，適用動物保護法相關規範，例如應提供妥善照護、不得棄養等。\n三、依第四條第一項第一款規定，保育類野生動物指瀕臨絕種、珍貴稀有及其他應予保育之野生動物，惟現行條文僅規範瀕臨絕種及珍貴稀有野生動物，未及於其他應予保育之野生動物，爰將其他應予保育之野生動物納入規範，以符合上述保育類野生動物範圍及其飼養繁殖管理之一致性。\n四、倘所有人或占有人無法自行圍捕時，亦得報請直轄市、縣（市）主管機關協助圍捕；鑒於協助圍捕可能造成國家社會資源之耗費，基於使用者付費原則，爰於後段增訂協助圍捕所需相關費用，由所有人或占有人負擔。\n五、增訂第二項，明定直轄市、縣（市）主管機關必要時亦得主動圍捕逸失之保育類野生動物，以維護民眾生命財產安全；另在查明其所有人或占有人前，需將該等動物進行暫時安置、收容，除圍捕所需相關費用外，收容及暫養所需相關費用，亦得由所有人或占有人負擔。"},{"bill":"201110005110000","text":"保育類野生動物於飼養或繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行積極圍捕；並得報請該直轄市、縣（市）主管機關協助圍捕，協助圍捕所需相關費用，由所有人或占有人負擔。\n逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，得由所有人或占有人負擔。","note":"一、現行條文列為第一項，並修正如下：\n(一)本法將野生動物區分為一般類及保育類野生動物，以規範不同之管理密度。保育類野生動物因其於棲息環境之族群量降低，生存已面臨危機，需加強保護，爰除本法或其他法令另有規定外，不得飼養或繁殖保育類野生動物，針對例外飼養或繁殖保育類野生動物之所有人或占有人，有加強其管理義務之必要，且保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚至影響他人生命財產安全，有必要加重其所有人或占有人通報及積極圍捕之義務。至野生之脊椎動物如受人為飼養或管領，亦屬動物保護法所稱動物，其飼主之飼養管理義務，適用動物保護法相關規範，例如應提供妥善照護、不得棄養等，併予敘明。\n(二)依第四條第一項第一款規定，保育類野生動物指瀕臨絕種、珍貴稀有及其他應予保育之野生動物，惟現行條文僅規範瀕臨絕種及珍貴稀有野生動物，未及於其他應予保育之野生動物，爰將其他應予保育之野生動物納入規範，以符合上述保育類野生動物範圍及其飼養繁殖管理之一致性。\n(三)又所有人或占有人倘無法自行圍捕，亦得報請直轄市、縣（市）主管機關協助圍捕；鑒於協助圍捕可能造成國家社會資源之耗費，基於使用者付費原則，爰於後段增訂協助圍捕所需相關費用，由所有人或占有人負擔。\n二、直轄市、縣（市）主管機關必要時亦得主動圍捕逸失之保育類野生動物，以維護民眾生命財產安全；另在查明其所有人或占有人前，需將該等動物進行暫時安置、收容，除圍捕所需相關費用外，收容及暫養所需相關費用，亦得由所有人或占有人負擔，爰增訂第二項規定。"},{"bill":"202110010670000","text":"保育類野生動物於飼養或繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行積極圍捕；並得報請該直轄市機關協助圍捕，協助圍捕所需相關費用，由所有人或占有人負擔。\n逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，應由所有人或占有人負擔。","note":"一、現行條文列為第一項，配合本法第四條第一項第一款對於所謂保育類野生動物指瀕臨絕種、珍貴稀有及其他應予保育之野生動物，爰將其他應予保育之野生動物納入規範，以符合上述保育類野生動物範圍及其飼養繁殖管理之一致性。\n二、又，保育類野生動所有人或占有應妥為管理，如有逸失而所有人或占有人倘無法自行圍捕，亦得報請直轄市、縣（市）主管機關協助圍捕，基於使用者付費原則，爰於第一項後段增訂協助圍捕所需相關費用，由所有人或占有人負擔。\n三、為維護民眾生命財產安全，直轄市、縣（市）主管機關必要時亦得主動圍捕逸失之保育類野生動物，並在查明其所有人或占有人前，將該等動物進行暫時安置、收容，其圍捕或收容及暫養所需相關費用亦應由所有人或占有人負擔，爰增訂第二項規定。"},{"bill":"202110022260000","text":"保育類野生動物於飼養或繁殖瀕臨絕種及珍貴稀有野生動物中依本法第三十一條規定辦理登記審查，應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行邀集專業人士協助圍捕；並得報請該直轄市、縣（市）主管機關協助圍捕，協助圍捕所需相關費用，由所有人或占有人負擔。\n中央主管機關應公告圍捕執行流程供直轄市、縣（市）主管機關遵行。逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，得由所有人或占有人負擔。","note":"一、修正本條文並新增第二項。\n二、遇危險野生動物逸失時，所有人應盡積極圍捕之責任，為確保民眾及動物安全，應委請專業人員協助圍捕。倘若所有人或占有人無法自行圍捕，亦得報請直轄市、縣（市）主管機關協助圍捕；鑒於協助圍捕可能造成國家社會資源浪費，基於使用者付費原則，於後段增訂協助圍捕所需相關費用，由所有人或占有人負擔。\n三、動物逸失後，圍捕時應確保人員及動物之安全，就執行流程應有詳盡之細部規範，參酌海洋保育類野生動物救援通報案件處理流程明訂相關圍捕執行流程並請直轄市、縣（市）主管機關遵行。並且應協助蒐集並提供專業人士名錄供未來使用。"},{"bill":"202110030620000","text":"保育類野生動物於飼養或繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行積極圍捕；並得報請該直轄市機關協助圍捕，協助圍捕所需相關費用，由所有人或占有人負擔。\n逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，應由所有人或占有人負擔。","note":"一、現行條文列為第一項，配合本法第四條第一項第一款對於所謂保育類野生動物指瀕臨絕種、珍貴稀有及其他應予保育之野生動物，爰將其他應予保育之野生動物納入規範，以符合上述保育類野生動物範圍及其飼養繁殖管理之一致性。\n二、又，保育類野生動所有人或占有應妥為管理，如有逸失而所有人或占有人倘無法自行圍捕，亦得報請直轄市、縣（市）主管機關協助圍捕，基於使用者付費原則，爰於第一項後段增訂協助圍捕所需相關費用，由所有人或占有人負擔。\n三、為維護民眾生命財產安全，直轄市、縣（市）主管機關必要時亦得主動圍捕逸失之保育類野生動物，並在查明其所有人或占有人前，將該等動物進行暫時安置、收容，其圍捕或收容及暫養所需相關費用亦應由所有人或占有人負擔，爰增訂第二項規定。"},{"bill":"202110030460000","text":"保育類野生動物於飼養或繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行積極圍捕；並得報請該直轄市、縣（市）主管機關協助圍捕，協助圍捕所需相關費用，由所有人或占有人負擔。\n逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，得由所有人或占有人負擔。","note":"一、現行條文列為第一項，並修正如下：\n(一)本法將野生動物區分為一般類及保育類野生動物，以規範不同之管理密度。保育類野生動物因其於棲息環境之族群量降低，生存已面臨危機，需加強保護，爰除本法或其他法令另有規定外，不得飼養或繁殖保育類野生動物，針對例外飼養或繁殖保育類野生動物之所有人或占有人，有加強其管理義務之必要，且保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚至影響他人生命財產安全，有必要加重其所有人或占有人通報及積極圍捕之義務。\n(二)日前發生某樂園狒狒逃跑後遭槍殺之情事，以至野生脊椎動物如受人為飼養或管領，類推適用動物保護法所稱動物之定義，其飼主應負飼養管理義務，類推適用動物保護法相關規範，例如應提供妥善照護、不得棄養等，併予敘明。\n(三)依第四條第一項第一款規定，保育類野生動物指瀕臨絕種、珍貴稀有及其他應予保育之野生動物，惟現行條文僅規範瀕臨絕種及珍貴稀有野生動物，未及於其他應予保育之野生動物，爰將其他應予保育之野生動物納入規範，以符合上述保育類野生動物範圍及其飼養繁殖管理之一致性。\n(四)又所有人或占有人倘無法自行圍捕，亦得報請直轄市、縣（市）主管機關協助圍捕；鑒於協助圍捕可能造成國家社會資源之耗費，基於使用者付費原則，爰於後段增訂協助圍捕所需相關費用，由所有人或占有人負擔。\n二、直轄市、縣（市）主管機關必要時亦得主動圍捕逸失之保育類野生動物，以維護民眾生命財產安全；另在查明其所有人或占有人前，需將該等動物進行暫時安置、收容，除圍捕所需相關費用外，收容及暫養所需相關費用，亦得由所有人或占有人負擔，爰增訂第二項規定。"},{"bill":"202110072950000","text":"保育類野生動物於飼養或繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行會同專業人士協助圍捕；或得報請該直轄市、縣（市）主管機關協助圍捕。協助圍捕所需相關費用，由所有人或占有人負擔。\n前項圍捕作業應注意事項、各級政府之分工指引及作業流程，應由中央主管機關會同本法第五條所設之野生動物保育諮詢委員會共同訂定並公告之。\n逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，得由所有人或占有人負擔。","note":"一、保育類野生動物因其於棲息環境之族群量降低，生存已面臨危機，需加強保護。針對例外飼養或繁殖保育類野生動物之所有人或占有人，有加強其管理義務之必要，且保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚至影響他人生命財產安全，有必要加重其所有人或占有人通報及積極會同專業人士協助圍捕之義務。\n二、又所有人或占有人倘無法自行圍捕，亦得報請直轄市、縣（市）主管機關協助圍捕；鑒於協助圍捕可能造成國家社會資源之耗費，基於使用者付費原則，爰於後段增訂協助圍捕所需相關費用，由所有人或占有人負擔。\n三、我國於2023年所發生之「東非狒狒脫逃事件」，凸顯中央及地方主管機關在共同進行圍捕作業時，因欠缺明確之圍捕作業應注意事項、各級政府之分工指引及作業流程等，進而造成行政量能虛耗、引發社會紛擾，以及不當圍捕之爭議等，爰增訂第二項。\n四、直轄市、縣（市）主管機關必要時亦得主動圍捕逸失之保育類野生動物，以維護民眾生命財產安全；另在查明其所有人或占有人前，需將該等動物進行暫時安置、收容，除圍捕所需相關費用外，收容及暫養所需相關費用，亦得由所有人或占有人負擔，爰增訂第三項規定。"}],"changed":true,"final":"保育類野生動物於飼養或繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行積極圍捕；並得報請該直轄市、縣（市）主管機關協助圍捕，協助圍捕所需相關費用，由所有人或占有人負擔。\n逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，得由所有人或占有人負擔。","finalWhy":"一、原條文列為第一項，並修正如下：\n(一)本法將野生動物區分為一般類及保育類野生動物，以規範不同之管理密度。保育類野生動物因其於棲息環境之族群量降低，生存已面臨危機，需加強保護，爰除本法或其他法令另有規定外，不得飼養或繁殖保育類野生動物，針對例外飼養或繁殖保育類野生動物之所有人或占有人，有加強其管理義務之必要，且保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚至影響他人生命財產安全，有必要加重其所有人或占有人通報及積極圍捕之義務。至野生之脊椎動物如受人為飼養或管領，亦屬動物保護法所稱動物，其飼主之飼養管理義務，適用動物保護法相關規範，例如應提供妥善照護、不得棄養等，併予敘明。\n(二)依第四條第一項第一款規定，保育類野生動物指瀕臨絕種、珍貴稀有及其他應予保育之野生動物，惟原條文僅規範瀕臨絕種及珍貴稀有野生動物，未及於其他應予保育之野生動物，爰將其他應予保育之野生動物納入規範，以符合上述保育類野生動物範圍及其飼養繁殖管理之一致性。\n(三)又所有人或占有人倘無法自行圍捕，亦得報請直轄市、縣（市）主管機關協助圍捕；鑒於協助圍捕可能造成國家社會資源之耗費，基於使用者付費原則，爰於後段增訂協助圍捕所需相關費用，由所有人或占有人負擔。\n二、直轄市、縣（市）主管機關必要時亦得主動圍捕逸失之保育類野生動物，以維護民眾生命財產安全；另在查明其所有人或占有人前，需將該等動物進行暫時安置、收容，除圍捕所需相關費用外，收容及暫養所需相關費用，亦得由所有人或占有人負擔，爰增訂第二項規定。","review":{"note":"照行政院提案通過","text":"保育類野生動物於飼養或繁殖中應妥為管理，不得逸失。如有逸失時，所有人或占有人應通報當地直轄市、縣（市）主管機關及自行積極圍捕；並得報請該直轄市、縣（市）主管機關協助圍捕，協助圍捕所需相關費用，由所有人或占有人負擔。\n逸失之保育類野生動物，直轄市、縣（市）主管機關必要時得主動圍捕，其圍捕、收容及暫養所需相關費用，得由所有人或占有人負擔。"}},{"no":"第五十條之一","current":null,"versions":[{"bill":"202110006020000","text":"保育類野生動物之所有人或占有人違反第三十七條第一項規定，於保育類野生動物逸失時，未通報當地直轄市、縣（市）主管機關，或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、本條新增。\n二、保育類野生動物之逸失，可能引發民眾不安及恐慌，甚至影響他人生命財產安全，修正條文第三十七條課以其所有人或占有人通報及積極圍捕之義務，現行第五十一條第八款所定違反第三十七條規定之罰鍰額度顯有不足，爰增訂本條罰則。"},{"bill":"201110005110000","text":"保育類野生動物之所有人或占有人違反第三十七條第一項規定，於保育類野生動物逸失時，未通報當地直轄市、縣（市）主管機關，或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、本條新增。\n二、保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚至影響他人生命財產安全，修正條文第三十七條課以其所有人或占有人通報及積極圍捕之義務，現行第五十一條第八款所定違反第三十七條規定之罰鍰額度已有不足，爰增訂本條罰則，以遏止類案一再發生。"},{"bill":"202110010670000","text":"保育類野生動物之所有人或占有人違反第三十七第一項規定，於保育類野生動物逸失時，未通報當地直轄市、縣（市）主管機關，或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、本條新增。\n二、保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚或危及他人生命財產安全，特修正第三十七條課以其所有人或占有人通報及積極圍捕之義務，並增訂本條罰則，以遏止類案一再發生。"},{"bill":"202110022260000","text":"保育類野生動物之所有人或占有人違反第三十七條第一項規定，於保育類野生動物逸失時，未通報當地直轄市、縣（市）主管機關，或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、本條新增。\n二、保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚至影響他人生命財產安全，修正條文第三十七條課以其所有人或占有人通報及積極圍捕之義務，現行第五十一條第八款所定違反第三十七條規定之罰鍰額度已有不足，爰增訂本條罰則，以遏止類案一再發生。"},{"bill":"202110030620000","text":"保育類野生動物之所有人或占有人違反第三十七第一項規定，於保育類野生動物逸失時，未通報當地直轄市、縣（市）主管機關，或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、本條新增。\n二、保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚或危及他人生命財產安全，特修正第三十七條課以其所有人或占有人通報及積極圍捕之義務，並增訂本條罰則，以遏止類案一再發生。"},{"bill":"202110030460000","text":"保育類野生動物之所有人或占有人違反第三十七條第一項規定，於保育類野生動物逸失時，未通報當地直轄市、縣（市）主管機關，或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、本條新增。\n二、保育類野生動物逸失時，可能引發社會及民眾之不安、恐慌，甚至影響他人生命財產安全，修正條文第三十七條課以其所有人或占有人通報及積極圍捕之義務，現行第五十一條第八款所定違反第三十七條規定之罰鍰額度已有不足，爰增訂本條罰則，以遏止類案一再發生。"},{"bill":"202110072950000","text":"保育類野生動物之所有人或占有人違反第三十七條第一項規定，於保育類野生動物逸失時，未通報或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。","note":"一、本條新增。\n二、有鑑於修正條文第三十七條課以所有人或占有人通報及積極圍捕之義務，爰增訂本條罰則，以遏止保育類野生動物逸失之情事發生，亦避免影響社會安定及人民安全。"}],"changed":true,"final":"保育類野生動物之所有人或占有人違反第三十七條第一項規定，於保育類野生動物逸失時，未通報當地直轄市、縣（市）主管機關，或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。","finalWhy":"","review":{"note":"照行政院提案通過","text":"保育類野生動物之所有人或占有人違反第三十七條第一項規定，於保育類野生動物逸失時，未通報當地直轄市、縣（市）主管機關，或未積極圍捕者，處新臺幣三萬元以上十五萬元以下罰鍰。"}},{"no":"第五十一條","current":"有下列情形之一，處新臺幣一萬元以上五萬元以下罰鍰：\n一、違反第十二條第一項規定，無正當理由規避、拒絕或妨礙野生動物資源調查或保育計畫實施者。\n二、違反第二十條第一項規定者。\n三、違反第二十四條第一項規定，未經中央主管機關之同意，輸入或輸出一般類野生動物者。\n四、（刪除）。\n五、違反第二十八條規定者。\n六、違反第三十一條第一項、第二項、第三項或第六項規定者。\n七、違反第三十五條第一項規定，非意圖販賣而未經主管機關之同意，在公共場所陳列或展示保育類野生動物、瀕臨絕種或珍貴稀有野生動物產製品者。\n八、違反第三十七條規定者。\n九、違反第三十八條規定者。\n十、所有人或占有人拒絕依第三十九條規定出售野生動物之屍體者。","versions":[{"bill":"202110006020000","text":"有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰：\n一、違反第十二條第一項規定，無正當理由規避、拒絕或妨礙野生動物資源調查或保育計畫實施。\n二、違反第二十條第一項規定，未經登記，進入第十七條劃定區獵捕一般類野生動物或主管機關劃定之垂釣區，或離開時，未報明獲取野生動物之種類、數量。\n三、違反第二十四條第一項規定，未經中央主管機關之同意，輸入或輸出一般類野生動物之活體。\n四、違反第二十八條規定，未於輸入、輸出保育類野生動物或其產製品之日起一年內，向中央主管機關提出相關報告，或提出之報告內容不實。\n五、違反第三十一條第一項規定，於中央主管機關指定公告前，飼養、繁殖保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物，或持有保育類野生動物產製品，其所有人或占有人未依限報請當地直轄市、縣（市）主管機關登記備查，或登記備查之內容不實。\n六、違反第三十一條第二項規定，於中央主管機關指定公告後，輸入、轉讓、取得保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物，或保育類野生動物產製品，其所有人或占有人未依限向直轄市、縣（市）主管機關登記備查，或登記備查之內容不實。\n七、違反第三十一條第三項規定，未經主管機關同意，繁殖保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物。\n八、違反第三十一條第六項規定，無正當理由規避、拒絕或妨礙主管機關或其委託之機關、團體實施註記或查核。\n九、違反第三十五條第一項規定，非意圖販賣而未經主管機關之同意，在公共場所陳列或展示保育類野生動物或其產製品。\n十、違反第三十八條規定，於瀕臨絕種或珍貴稀有野生動物死亡時，所有人或占有人未依限將死亡解剖書或死亡證明書送交直轄市、縣（市）主管機關備查。\n十一、所有人或占有人拒絕依第三十九條規定出售野生動物之屍體。","note":"一、序文酌作文字修正，各款並配合刪除「者」之文字。\n二、為符合處罰明確性原則，爰修正第二款及第三款文字，明定其處罰構成要件。\n三、現行第四款業於96年7月11日修正刪除，已無保留款次必要，爰予刪除。\n四、第五款移列第四款，並明定其處罰構成要件。\n五、第六款分別移列第五款至第八款，並明定其處罰構成要件。\n六、第七款移列第九款，並酌作文字修正。\n七、違反第三十七條規定之罰則已明定於修正條文第五十條之一，爰刪除第八款之規定。\n八、第九款移列第十款，並明定其處罰構成要件。\n九、第十款移列第十一款，並酌作文字修正。"},{"bill":"201110005110000","text":"有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰：\n一、違反第十二條第一項規定，無正當理由規避、拒絕或妨礙野生動物資源調查或保育計畫實施。\n二、違反第二十條第一項規定，未經登記，進入第十七條劃定區獵捕一般類野生動物或主管機關劃定之垂釣區，或離開時，未報明獲取野生動物之種類、數量。\n三、違反第二十四條第一項規定，未經中央主管機關之同意，輸入或輸出一般類野生動物之活體。\n四、違反第二十八條規定，未於輸入、輸出保育類野生動物或其產製品之日起一年內，向中央主管機關提出相關報告，或提出之報告內容不實。\n五、違反第三十一條第一項規定，於中央主管機關指定公告前，飼養、繁殖保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物，或持有保育類野生動物產製品，其所有人或占有人未依限報請當地直轄市、縣（市）主管機關登記備查，或登記備查之內容不實。\n六、違反第三十一條第二項規定，於中央主管機關指定公告後，輸入、轉讓、取得保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物，或保育類野生動物產製品，其所有人或占有人未依限向直轄市、縣（市）主管機關登記備查，或登記備查之內容不實。\n七、違反第三十一條第三項規定，未經主管機關同意，繁殖保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物。\n八、違反第三十一條第六項規定，無正當理由規避、拒絕或妨礙主管機關或其委託之機關、團體實施註記或查核。\n九、 三、違反第二十四條第一項規定，未經中央主管機關之同意，輸入或輸出一般類野生動物之活體。\n四、違反第二十八條規定，未於輸入、輸出保育類野生動物或其產製品之日起一年內，向中央主管機關提出相關報告，或提出之報告內容不實。\n五、違反第三十一條第一項規定，於中央主管機關指定公告前，飼養、繁殖保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物，或持有保育類野生動物產製品，其所有人或占有人未依限報請當地直轄市、縣（市）主管機關登記備查，或登記備查之內容不實。\n六、違反第三十一條第二項規定，於中央主管機關指定公告後，輸入、轉讓、取得保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物，或保育類野生動物產製品，其所有人或占有人未依限向直轄市、縣（市）主管機關登記備查，或登記備查之內容不實。\n七、違反第三十一條第三項規定，未經主管機關同意，繁殖保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物。\n八、違反第三十一條第六項規定，無正當理由規避、拒絕或妨礙主管機關或其委託之機關、團體實施註記或查核。\n九、違反第三十五條第一項規定，非意圖販賣而未經主管機關之同意，在公共場所陳列或展示保育類野生動物或其產製品。\n十、違反第三十八條規定，於瀕臨絕種或珍貴稀有野生動物死亡時，所有人或占有人未依限將死亡解剖書或死亡證明書送交直轄市、縣（市）主管機關備查。\n十一、所有人或占有人拒絕依第三十九條規定出售野生動物之屍體。","finalWhy":"一、序文酌作文字修正，各款並配合刪除「者」字。\n二、為符合處罰明確性原則，爰修正第二款及第三款文字，明定其處罰構成要件。\n三、原第四款業於九十六年七月十一日修正刪除，已無保留款次必要，爰予刪除。\n四、第五款移列為第四款，並明定其處罰構成要件。\n五、第六款分別移列為第五款至第八款，並明定其處罰構成要件。\n六、第七款移列為第九款，並酌作文字修正。\n七、違反第三十七條規定之罰則已明定於修正條文第五十條之一，爰刪除第八款規定。\n八、第九款移列為第十款，並明定其處罰構成要件。\n九、第十款移列為第十一款，並酌作文字修正。","review":{"note":"照行政院提案通過","text":"有下列情形之一者，處新臺幣一萬元以上五萬元以下罰鍰：\n一、違反第十二條第一項規定，無正當理由規避、拒絕或妨礙野生動物資源調查或保育計畫實施。\n二、違反第二十條第一項規定，未經登記，進入第十七條劃定區獵捕一般類野生動物或主管機關劃定之垂釣區，或離開時，未報明獲取野生動物之種類、數量。\n三、違反第二十四條第一項規定，未經中央主管機關之同意，輸入或輸出一般類野生動物之活體。\n四、違反第二十八條規定，未於輸入、輸出保育類野生動物或其產製品之日起一年內，向中央主管機關提出相關報告，或提出之報告內容不實。\n五、違反第三十一條第一項規定，於中央主管機關指定公告前，飼養、繁殖保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物，或持有保育類野生動物產製品，其所有人或占有人未依限報請當地直轄市、縣（市）主管機關登記備查，或登記備查之內容不實。\n六、違反第三十一條第二項規定，於中央主管機關指定公告後，輸入、轉讓、取得保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物，或保育類野生動物產製品，其所有人或占有人未依限向直轄市、縣（市）主管機關登記備查，或登記備查之內容不實。\n七、違反第三十一條第三項規定，未經主管機關同意，繁殖保育類或有害生態環境、人畜安全之虞之原非我國原生種野生動物。\n八、違反第三十一條第六項規定，無正當理由規避、拒絕或妨礙主管機關或其委託之機關、團體實施註記或查核。\n九、違反第三十五條第一項規定，非意圖販賣而未經主管機關之同意，在公共場所陳列或展示保育類野生動物或其產製品。\n十、違反第三十八條規定，於瀕臨絕種或珍貴稀有野生動物死亡時，所有人或占有人未依限將死亡解剖書或死亡證明書送交直轄市、縣（市）主管機關備查。\n十一、所有人或占有人拒絕依第三十九條規定出售野生動物之屍體。"}},{"no":"第五十一條之一","current":"原住民族違反第二十一條之一第二項規定，未經主管機關許可，獵捕、宰殺或利用一般類野生動物，供傳統文化、祭儀之用或非為買賣者，處新臺幣一千元以上一萬元以下罰鍰，但首次違反者，不罰。","versions":[{"bill":"202110006020000","text":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，違反依第二十一條之一第二項所定辦法中有關申請備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，處新臺幣一千元以上一萬元以下罰鍰，但首次違反者，不罰。","note":"依本法第四條第一項規定，第二十一條之一第一項及第二項所定野生動物，包括「一般類」及「保育類」野生動物。惟現行規定僅對原住民族違反第二十一條之一第二項規定，未經主管機關許可，獵捕、宰殺或利用「一般類野生動物」處以行政罰，為平衡對原住民族傳統文化、祭儀之尊重及野生動物之保育，特將「保育類野生動物」納入規範，爰修正明定其適用於「野生動物」。"},{"bill":"201110005110000","text":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，違反依第二十一條之一第二項所定辦法中有關申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，依下列規定處罰：\n一、屬保育類野生動物，處新臺幣二萬元以上十萬元以下罰鍰。\n二、屬一般類野生動物，處新臺幣一千元以上一萬元以下罰鍰。","note":"一、依本法第四條第一項規定，第二十一條之一第一項及第二項所定野生動物，包括「一般類」及「保育類」野生動物，惟現行規定僅對原住民族違反第二十一條之一第二項規定，未經主管機關許可，獵捕、宰殺或利用「一般類野生動物」處以行政罰，為平衡對原住民族傳統文化、祭儀之尊重及野生動物之保育，將「保育類野生動物」納入規範，爰修正序文，明定其適用於「野生動物」。\n二、為符處罰明確性原則，配合修正條文第二十一條之一第二項規定，於序文明定處罰構成要件，並審酌保育類與一般類野生動物在管理上之差異及違法獵捕、宰殺或利用行為之責難程度不同，分列二款，分別定其罰責。\n三、有關得減輕或免除行政罰之情形，宜回歸適用行政罰法之規定。另因本法已施行多年，原住民族可透過各種媒體及資訊管道知悉本法規定，已無首次違反不罰之必要，爰刪除現行但書規定。\n四、又原住民族倘為營利目的而獵捕、宰殺或利用保育類野生動物，並非修正條文第二十一條之一規定範圍，應依本法第四十一條規定論處，併予敘明。"},{"bill":"202110006280000","text":"原住民族違反第二十一條之一第二項規定，獵捕、宰殺或利用野生動物，違反依第二十一條之一第二項所定辦法中有關申請核准或備查之應檢附文件、程序，及其獵捕方式、傳統獵具、獵捕動物之種類、數量、獵捕期間、區域及其他應遵循事項之規定者，依下列規定處罰：\n一、屬保育類野生動物，處新臺幣二萬元以上十萬元以下罰鍰。\n二、屬一般類野生動物，處新臺幣一千元以上一萬元以下罰鍰。","note":"一、本法第四條明確將野生動物之保育，區分出「一般類」與「保育類」，並就此二類做出不同程度之保護規定，合先敘明。\n二、現行條文僅對原住民族違反第二十一條之一就原住民族未經許可獵捕、宰殺或利用「一般類野生動物」之行為處理行政罰，為平衡保育野生動物、尊重原住民族傳統文化、祭儀，爰將「保育類野生動物」納入規範，並就其行為之可責難性程度不同，分二款予以不同處罰。\n三、行政罰法已有減輕或免除之規定。"},{"bill":"202110010670000","text":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，有違反第二十一條之一第二項所定辦法中有關申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，處新臺幣一千元以上一萬元以下罰鍰，但首次違反者，不罰。","note":"為符處罰明確性原則，配合修正條文第二十一條之一第二項規定，明定處罰構成要件。"},{"bill":"202110010890000","text":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，違反依第二十一條之一第二項所定辦法中有關申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，依下列規定處罰：\n一、屬保育類野生動物，處新臺幣二萬元以上十萬元以下罰鍰。\n二、屬一般類野生動物，處新臺幣一千元以上一萬元以下罰鍰。","note":"一、本法第四條第一項所定野生動物，包括「一般類」及「保育類」野生動物。現行規定僅對原住民族違反第二十一條之一第二項規定，未經主管機關許可，獵捕、宰殺或利用「一般類野生動物」處以行政罰，實為邏輯瑕疵，應將「保育類野生動物」也納入規範。\n二、為符處罰明確性原則，並審酌保育類與一般類野生動物管理上之差異及違法獵捕、宰殺或利用行為之責難程度不同，分列二款，分別定其罰責。\n三、有關得減輕或免除行政罰之情形，宜回歸適用行政罰法之規定，爰刪除現行但書規定。"},{"bill":"202110022260000","text":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，違反依第二十一條之一第二項所定辦法中有關申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，依下列規定處罰：\n一、屬保育類野生動物，處新臺幣二萬元以上十萬元以下罰鍰。\n二、屬一般類野生動物，處新臺幣一千元以上一萬元以下罰鍰。","note":"一、依本法第四條第一項規定，第二十一條之一第一項及第二項所定野生動物，包括「一般類」及「保育類」野生動物，惟現行規定僅對原住民族違反第二十一條之一第二項規定，未經主管機關許可，獵捕、宰殺或利用「一般類野生動物」處以行政罰，為平衡對原住民族傳統文化、祭儀之尊重及野生動物之保育，將「保育類野生動物」納入規範，爰修正序文，明定其適用於「野生動物」。\n二、為符處罰明確性原則，配合修正條文第二十一條之一第二項規定，於序文明定處罰構成要件，並審酌保育類與一般類野生動物在管理上之差異及違法獵捕、宰殺或利用行為之責難程度不同，分列二款，分別定其罰責。\n三、有關得減輕或免除行政罰之情形，宜回歸適用行政罰法之規定。另因本法已施行多年，原住民族可透過各種媒體及資訊管道知悉本法規定，已無首次違反不罰之必要，爰刪除現行但書規定。\n四、又原住民族倘為營利目的而獵捕、宰殺或利用保育類野生動物，並非修正條文第二十一條之一規定範圍，應依本法第四十一條規定論處，併予敘明。"},{"bill":"202110029160000","text":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，違反依第二十一條之一第二項所定辦法中有關申請核准或備查之情形、部落自主管理之方式、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，依下列規定處罰：\n一、屬保育類野生動物，處新臺幣二萬元以上十萬元以下罰鍰。但首次違反者，不罰。\n二、屬一般類野生動物，處新臺幣一千元以上一萬元以下罰鍰。","note":"一、依本法第四條第一項規定，第二十一條之一第一項及第二項所定野生動物，包括「一般類」及「保育類」野生動物，惟現行規定僅對原住民族違反第二十一條之一第二項規定，未經主管機關許可，獵捕、宰殺或利用「一般類野生動物」處以行政罰，為平衡對原住民族傳統文化、祭儀之尊重及野生動物之保育，將「保育類野生動物」納入規範，爰修正序文，明定其適用於「野生動物」。\n二、為符處罰明確性原則，配合修正條文第二十一條之一第二項規定，於序文明定處罰構成要件，並審酌保育類與一般類野生動物在管理上之差異及違法獵捕、宰殺或利用行為之責難程度不同，分列二款，分別定其罰則。但屬保育類動物，原住民首次違反獵捕、宰殺或利用行為者，不罰。\n三、又原住民族倘為營利目的而獵捕、宰殺或利用保育類野生動物，並非修正條文第二十一條之一規定範圍，應依本法第四十一條規定論處，併予敘明。"},{"bill":"202110030620000","text":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，有違反第二十一條之一第二項所定辦法中有關申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，處新臺幣一千元以上一萬元以下罰鍰，但首次違反者，不罰。","note":"為符處罰明確性原則，配合修正條文第二十一條之一第二項規定，明定處罰構成要件。"},{"bill":"202110030460000","text":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，違反依第二十一條之一第二項所定辦法中有關申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，依下列規定處罰：\n一、屬保育類野生動物，處新臺幣二萬元以上十萬元以下罰鍰。\n二、屬一般類野生動物，處新臺幣一千元以上一萬元以下罰鍰。","note":"一、依本法第四條第一項所定野生動物，包括「一般類」及「保育類」野生動物，惟現行規定僅對原住民族違反第二十一條之一第二項規定，未經主管機關許可，獵捕、宰殺或利用「一般類野生動物」，處以行政罰，為平衡對原住民族傳統文化、祭儀之尊重及野生動物之保育，將「保育類野生動物」納入規範，爰修正序文，明定其適用於「野生動物」。\n二、為符處罰明確性原則，並審酌保育類與一般類野生動物在管理上之差異及違法獵捕、宰殺或利用行為之責難程度不同，分列二款，分別定其罰責。\n三、有關得減輕或免除行政罰之情形，宜回歸適用行政罰法之規定，爰刪除現行但書規定。"}],"changed":true,"final":"原住民族基於其傳統文化、祭儀或非營利自用獵捕、宰殺或利用野生動物，使用第十九條第一項第一款、第七款或第八款所定禁止之方式，或違反第二十一條之一第二項所定辦法中有關申請核准或備查之情形、得獵捕、宰殺或利用保育類野生動物之必要情形、獵捕方式、獵捕動物之種類、數量、獵捕期間、區域或管理之規定者，依下列規定處罰。但首次違反者，不罰：\n一、屬保育類野生動物，處新臺幣二萬元以上十萬元以下罰鍰，不適用第四十一條規定。\n二、屬一般類野生動物，處新臺幣一千元以上一萬元以下罰鍰，不適用第四十九條第一項第二款規定。","finalWhy":"","review":{"note":"所有提案及修正動議1案均保留，送院會處理","text":""}},{"no":"第五十二條","current":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物得沒收之；查獲之保育類野生動物產製品及供犯罪所用之獵具、藥品、器具，沒收之。\n違反本法之規定，除前項規定者外，查獲之保育類野生動物與其產製品及供違規所用之獵具、藥品、器具得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝單位，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","versions":[{"bill":"202110006020000","text":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物與其產製品及供犯罪所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於犯罪行為人與否，得沒收之。\n違反本法之規定，除前項規定者外，查獲之野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於何人所有，得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝機關，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","note":"一、修正本條第一項、第二項及第四項。\n二、依《中華民國刑法施行法》第十條之三第二項規定，105年7月1日前施行之其他法律關於沒收之規定，不再適用，其立法意旨在回歸刑法一體適用；惟經檢視仍應為特別規定者，依《刑法》第十一條但書規定特別法優先於普通法之原則，仍宜定明。\n三、查實務上犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪所用之物，不限於獵具、藥品、器具，尚包括工作物、施工材料及機具等，應予增訂列為得沒收之物之範疇，並考量前開供犯罪所用之物之沒收，如回歸適用105年7月1日施行之《刑法》第三十八條第三項規定，其如屬第三人所有者，沒收時尚須確認是否有無正當理由提供或取得之情形，增加檢調機關、法院偵審時之舉證、認定程序之困難，有礙野生動物保育案件之查察，並易導致犯罪行為人之僥倖心理，爰修正第一項，並保留實務執行之審酌空間，規範查獲之保育類野生動物與其產製品及供犯罪所用之獵具等，不問屬於犯罪行為人與否，得沒收之，以為《刑法》第三十八條之特別規定。\n四、依《行政罰法》第二十一條規定，沒入之物，除該法或其他法律另有規定者外，以屬於受處罰者為限。野生動物為全民共有、共享之資源，對於違反本法規定而得沒入之範圍，不應僅限於保育類野生動物，實應包含一般類野生動物與其產製品；另違規行為人使用之工作物、施工材料及機具，亦應納入沒入範疇，且為利查察及避免違規行為人之僥倖心理，不問屬於何人所有，均得沒入之，爰修正第二項，以為《行政罰法》第二十一條之特別規定。\n五、第四項酌為文字修正。"},{"bill":"201110005110000","text":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物與其產製品及供犯罪所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於犯罪行為人與否，得沒收之。\n違反本法之規定，除前項規定者外，查獲之野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於何人所有，得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝機關，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","note":"一、依中華民國刑法施行法第十條之三第二項規定，一百零五年七月一日前施行之其他法律關於沒收之規定，不再適用，其立法意旨在回歸刑法一體適用；惟經檢視仍應為特別規定者，依刑法第十一條但書規定特別法優先於普通法之原則，仍宜定明。\n二、實務上犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪所用之物，不限於獵具、藥品、器具，尚包括工作物、施工材料及機具等，應予增訂列為得沒收之物之範疇，並考量前開供犯罪所用之物之沒收，如回歸適用一百零五年七月一日施行之刑法第三十八條第三項規定，其如屬第三人所有者，沒收時尚須確認是否有無正當理由提供或取得之情形，增加檢調機關、法院偵審時之舉證、認定程序，有礙野生動物保育案件之查察，並易導致犯罪行為人之僥倖心理，爰修正第一項，並保留實務執行之審酌空間，規範查獲之保育類野生動物與其產製品及供犯罪所用之獵具等，不問屬於犯罪行為人與否，得沒收之，以為刑法第三十八條之特別規定。\n三、依行政罰法第二十一條規定，沒入之物，除該法或其他法律另有規定者外，以屬於受處罰者為限。野生動物為全民共有、共享之資源，對於違反本法規定而得沒入之範圍，不應僅限於保育類野生動物，實應包含一般類野生動物與其產製品；另違規行為人使用之工作物、施工材料及機具，亦應納入沒入範疇，且為利查察及避免違規行為人之僥倖心理，不問屬於何人所有，均得沒入之，爰修正第二項，以為行政罰法第二十一條之特別規定。\n四、第三項未修正；第四項酌作文字修正。"},{"bill":"202110006280000","text":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物得沒收之；查獲之保育類野生動物與其產製品及供犯罪所用之獵具、藥品、器具、工作物、施工材料及所使用之器械工具，不問屬於何人所有，得沒收之。\n違反本法之規定，除前項規定者外，查獲之保育類野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之器械工具，不問屬於何人所有，得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝單位，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","note":"一、根據中華民國刑法第十一條規定，刑法總則有關沒收之規定，於其他法律亦適用之，「但其他法律有特別規定者，不在此限。」亦即特別法優先原則，本法得為沒收之特別規定。\n二、現行實務上違反第四十條至第四十二條、第四十三條第三項之罪，行為人所使用之物不限於獵具、藥品、器具，還包括工作物、施工材料、器械工具等，應納入得沒收之物範圍。此外，實務上常有行為人透過租借方式取得犯罪工具，倘若屬於第三人所有，且在明知或可得而知為幫助犯罪的情況下，仍租借給當事人使用者，亦應承擔沒收之則，惟具體仍應依個案情況判斷，爰修正為「得」沒收。\n三、同前項說明，對查獲保育類野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之器械工具之行政罰沒入，比照沒收規定修正。"},{"bill":"202110010670000","text":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物，與其產製品及供犯罪所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於犯罪行為人與否，沒收之。\n違反本法之規定，除前項規定者外，查獲之保育類野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於何人所有，得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝機關，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","note":"一、修正第一項、第二項規定：\n(一)配合中華民國刑法施行法第十條之三第二項及刑法第十一條但書、第三十八條、行政罰法第二十一條之規定，爰修正第一項、第二項以為沒收制度之特別規定。\n(二)於實務上犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪所用之物，不限於獵具、藥品、器具，爰修正第一項、第二項，將工作物、施工材料及機具等，應予增訂列為得沒收之物之範疇。\n二、第三項未修正。\n三、第四項酌作文字修正。"},{"bill":"202110010890000","text":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物與其產製品及供犯罪所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於犯罪行為人與否，得沒收之。\n違反本法之規定，除前項規定者外，查獲之野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於何人所有，得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝機關，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","note":"一、實務上相關犯罪所用之物不限於獵具、藥品、器具，尚包括工作物、施工材料及機具等，應增訂列為得沒收之物。\n二、為避免舉證、認定程序之困難，有礙野生動物保育案件之查察，以及增加第三人租借與他人機具負擔被沒收風險，犯罪器具不問是否屬犯罪行為人所有，得沒收之。\n三、違法被沒入之物，不應限於保育類野生動物，應包含一般類野生動物與其產製品。違規行為人使用工作物、施工材料及機具，亦應納入沒入範疇，阻絕僥倖心理。"},{"bill":"202110022260000","text":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物與其產製品及供犯罪所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於犯罪行為人與否，得沒收之。\n違反本法之規定，除前項規定者外，查獲之野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於何人所有，得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝機關，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","note":"一、依中華民國刑法施行法第十條之三第二項規定，一百零五年七月一日前施行之其他法律關於沒收之規定，不再適用，其立法意旨在回歸刑法一體適用；惟經檢視仍應為特別規定者，依刑法第十一條但書規定特別法優先於普通法之原則，仍宜定明。\n二、實務上犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪所用之物，不限於獵具、藥品、器具，尚包括工作物、施工材料及機具等，應予增訂列為得沒收之物之範疇，並考量前開供犯罪所用之物之沒收，如回歸適用一百零五年七月一日施行之刑法第三十八條第三項規定，其如屬第三人所有者，沒收時尚須確認是否有無正當理由提供或取得之情形，增加檢調機關、法院偵審時之舉證、認定程序，有礙野生動物保育案件之查察，並易導致犯罪行為人之僥倖心理，爰修正第一項，並保留實務執行之審酌空間，規範查獲之保育類野生動物與其產製品及供犯罪所用之獵具等，不問屬於犯罪行為人與否，得沒收之，以為刑法第三十八條之特別規定。\n三、依行政罰法第二十一條規定，沒入之物，除該法或其他法律另有規定者外，以屬於受處罰者為限。野生動物為全民共有、共享之資源，對於違反本法規定而得沒入之範圍，不應僅限於保育類野生動物，實應包含一般類野生動物與其產製品；另違規行為人使用之工作物、施工材料及機具，亦應納入沒入範疇，且為利查察及避免違規行為人之僥倖心理，不問屬於何人所有，均得沒入之，爰修正第二項，以為行政罰法第二十一條之特別規定。\n四、第三項未修正；第四項酌作文字修正。"},{"bill":"202110030620000","text":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物，與其產製品及供犯罪所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於犯罪行為人與否，沒收之。\n違反本法之規定，除前項規定者外，查獲之保育類野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於何人所有，得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝機關，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","note":"一、修正第一項、第二項規定：\n(一)配合中華民國刑法施行法第十條之三第二項及刑法第十一條但書、第三十八條、行政罰法第二十一條之規定，爰修正第一項、第二項以為沒收制度之特別規定。\n(二)於實務上犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪所用之物，不限於獵具、藥品、器具，爰修正第一項、第二項，將工作物、施工材料及機具等，應予增訂列為得沒收之物之範疇。\n二、第三項未修正。\n三、第四項酌作文字修正。"}],"changed":true,"final":"犯第四十條、第四十一條、第四十二條或第四十三條第三項之罪，查獲之保育類野生動物與其產製品及供犯罪所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於犯罪行為人與否，得沒收之。\n違反本法之規定，除前項規定者外，查獲之野生動物與其產製品及供違規所用之獵具、藥品、器具、工作物、施工材料及所使用之機具，不問屬於何人所有，得沒入之。\n前項經沒入之物，必要時，主管機關得公開放生、遣返、典藏或銷毀之。其所需費用，得向違規之行為人收取。\n海關或其他查緝機關，對於依法沒入或處理之保育類野生動物及其產製品，得委由主管機關依前項規定處理。","finalWhy":"一、依中華民國刑法施行法第十條之三第二項規定，一百零       const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      btn.addEventListener('click', async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      });
      acts.append(btn);
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
</html>
