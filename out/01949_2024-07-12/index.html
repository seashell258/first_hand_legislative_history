<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中小企業發展條例 2024 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"中小企業發展條例","version":"01949:2024-07-12-修正","date":"2024-07-12","action":"修正","title":"中小企業發展條例　2024 年 7 月修正","lede":"原本的規定是：經濟景氣指數達一定情形時，中小企業增僱員工可以把薪資的 130%（24 歲以下員工 150%）從營利事業所得額減除，加薪的部分也是 130%；這些優惠和研發投資抵減都只施行到 2024 年 5 月 19 日。這次修正拿掉景氣指數的條件，增僱 24 歲以下或 65 歲以上的本國籍基層員工改為 200%，替本國籍基層員工加薪改為 175%，施行期間從 2024 年 1 月 1 日到 2033 年 12 月 31 日。另外把有限合夥納入中小企業的範圍，並規定最近三年違反環保、勞工或食品安全衛生法律且情節重大的企業不能申請租稅優惠。行政院、國民黨黨團、台灣民眾黨黨團和多位委員共提出 19 案，其中 11 案在 2024 年 5 月 2 日由經濟委員會審查，其餘逕付二讀。經過黨團協商，7 月 12 日院會逐條照審查會條文或協商條文通過，沒有表決。","summary":"中小企業增僱 24 歲以下或 65 歲以上基層員工，薪資可按 200% 從所得額減除；替基層員工加薪可按 175% 減除，不再以經濟景氣指數為啟動條件。研發投資抵減和這項優惠都延到 2033 年底。","key":"01949_2024-07-12","props":[{"id":"202110006150000","who":"委員柯志恩等17人","date":"2024-03-01","name":"「中小企業發展條例第三十六條之二條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110006150000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/03/LCEWA01_110103_00012.pdf","proposers":["柯志恩","廖偉翔","呂玉玲","羅廷瑋","葛如鈞","顏寬恒"],"ncosign":11,"people":[["柯志恩","國民黨","提案"],["廖偉翔","國民黨","提案"],["呂玉玲","國民黨","提案"],["羅廷瑋","國民黨","提案"],["葛如鈞","國民黨","提案"],["顏寬恒","國民黨","提案"],["林倩綺","國民黨","連署"],["賴士葆","國民黨","連署"],["王育敏","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["李彥秀","國民黨","連署"],["羅明才","國民黨","連署"],["林沛祥","國民黨","連署"],["邱若華","國民黨","連署"],["黃健豪","國民黨","連署"],["陳永康","國民黨","連署"],["許宇甄","國民黨","連署"]],"party":[["國民黨",17]],"reason":"本院委員柯志恩、廖偉翔、呂玉玲、羅廷瑋、葛如鈞、顏寬恒等17人，鑒於我國勞動者在經濟成長果實的分享比重愈益萎縮，勞動生產力指數從1980至2021年上升近六倍，但同時期實質薪資卻於2000年開始近乎停滯，甚至還出現倒退。中小企業就業人數占全國就業人數維持8成以上，但中小企業因規模較小，不論資金、技術，市場行銷等方面皆不如大型企業，導致薪資普遍低落。為有效解決低薪問題，爰擬具「中小企業發展條例第三十六條之二條文修正草案」，規範目前中小企業加薪可扣抵當年營利事業所得的額度，由目前的130%提高到200%，為青年加薪可扣抵稅額的年齡，從24歲以下放寬到30歲以下，可扣抵當年營利事業所得額，由目前的150%，提高到220%，以增進企業為員工加薪的誘因。是否有當？敬請公決。","arts":["第三十六條之二"]},{"id":"202110016480000","who":"委員賴士葆等19人","date":"2024-03-22","name":"「中小企業發展條例第三十六條之二條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110016480000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/06/LCEWA01_110106_00029.pdf","proposer .tw/ppg/download/agenda1/02/pdf/11/01/07/LCEWA01_110107_00151.pdf","proposers":["張智倫","羅廷瑋","廖偉翔"],"ncosign":16,"people":[["張智倫","國民黨","提案"],["羅廷瑋","國民黨","提案"],["廖偉翔","國民黨","提案"],["林沛祥","國民黨","連署"],["王鴻薇","國民黨","連署"],["葛如鈞","國民黨","連署"],["許宇甄","國民黨","連署"],["邱若華","國民黨","連署"],["洪孟楷","國民黨","連署"],["黃建賓","國民黨","連署"],["呂玉玲","國民黨","連署"],["張嘉郡","國民黨","連署"],["黃健豪","國民黨","連署"],["游顥","國民黨","連署"],["牛煦庭","國民黨","連署"],["陳菁徽","國民黨","連署"],["李彥秀","國民黨","連署"],["廖先翔","國民黨","連署"],["謝龍介","國民黨","連署"]],"party":[["國民黨",19]],"reason":"本院委員張智倫、羅廷瑋、廖偉翔等19人，為因應國際經貿情勢變動及產業發展趨勢，中小企業仍面臨升級轉型之挑戰；然我國經濟情勢於過去十年間經歷顯著變化，評估於景氣反轉階段鼓勵企業增僱加薪之租稅優惠已達成階段性任務。惟近年全球產業快速變遷與轉型，中小企業人才需求趨於多元，且國內少子女化及高齡化已成趨勢，為持續提升中小企業延攬青年，並提高僱用中高齡者及高齡者意願，同時為協助中小企業留用人才及提高基層員工薪資，故修法優化本條例加薪租稅優惠措施，期盼促進中小企業增僱多元人才及提升薪資水準。為延續以稅制上經濟誘因鼓勵中小企業升級轉型，增加聘僱中高齡及高齡人才，並促進基層員工薪資增長，爰擬具「中小企業發展條例第三十五條、第三十六條之二及第四十條條文修正草案」。是否有當？敬請公決。","arts":["第三十五條","第三十六條之二","第四十條"]},{"id":"202110027200000","who":"委員王世堅等16人","date":"2024-04-09","name":"「中小企業發展條例第三十五條、第三十六條之二及第四十條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110027200000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/08/LCEWA01_110108_00071.pdf","proposers":["王世堅","陳冠廷","郭國文"],"ncosign":13,"people":[["王世堅","民進黨","提案"],["陳冠廷","民進黨","提案"],["郭國文","民進黨","提案"],["王美惠","民進黨","連署"],["蔡易餘","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["林淑芬","民進黨","連署"],["林月琴","民進黨","連署"],["范雲","民進黨","連署"],["王正旭","民進黨","連署"],["李坤城","民進黨","連署"],["莊瑞雄","民進黨","連署"],["黃捷","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳秀寳","民進黨","連署"],["賴惠員","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員王世堅、陳冠廷、郭國文等16人，鑒於近年貧富差距擴大，而受僱人員報酬占GDP比率更創新低，台灣的GDP在2021年達到6.53%，為近10年來新高，但受僱人員報酬卻僅占GDP比例為43.03%，較往年平均低；顯見我國總體經濟營運成果並未能與員工分享，爰擬具「中小企業發展條例第三十五條、第三十六條之二及第四十條條文修正草案」。是否有當？敬請公決。","arts":["第三十五條","第三十六條之二","第四十條"]},{"id":"202110033800000","who":"委員郭國文等19人","date":"2024-04-19","name":"「中小企業發展條例第三十六條之二條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110033800000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/10/LCEWA 6元相較，僅成長988元。另根據統計，2022年未滿25歲之勞工，全年總薪資中位數為36.2萬元；30歲以下就業者之薪資中位數為48.8萬元，與全體受僱員工總薪資中位數為55.2萬元尚有一段差距，因此亟需提升30歲以下者薪資。爰擬具「中小企業發展條例第三十六條之二條文修正草案」，將目前中小企業加薪可扣抵當年營利事業所得的額度，提高到200%。原本規定中小企業為青年加薪可扣抵稅額的年齡，放寬到30歲以下，可扣抵當年營利事業所得額，提高到230%，以增進中小企業為員工加薪的誘因，改善勞工低薪現狀。是否有當？敬請公決。","arts":["第三十六條之二"]},{"id":"202110040940000","who":"委員賴瑞隆等17人","date":"2024-05-03","name":"「中小企業發展條例部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110040940000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/12/LCEWA01_110112_00079.pdf","proposers":["賴瑞隆"],"ncosign":16,"people":[["賴瑞隆","民進黨","提案"],["郭昱晴","民進黨","連署"],["林楚茵","民進黨","連署"],["張宏陸","民進黨","連署"],["李柏毅","民進黨","連署"],["沈伯洋","民進黨","連署"],["林月琴","民進黨","連署"],["陳秀寳","民進黨","連署"],["許智傑","民進黨","連署"],["陳俊宇","民進黨","連署"],["吳思瑤","民進黨","連署"],["陳瑩","民進黨","連署"],["王美惠","民進黨","連署"],["賴惠員","民進黨","連署"],["范雲","民進黨","連署"],["林宜瑾","民進黨","連署"],["王世堅","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員賴瑞隆等17人，有鑑於我國近年雖經濟成長率表現亮眼，卻難讓廣大基層勞工分享，加諸因國際地緣政治局勢紛擾，世界各國面臨通貨膨脹、紛紛採取政策手段協助調漲勞工薪資，我國近年也面臨勞工薪資成長幅度難以跟上物價波動問題，不僅影響基層勞工生活，亦不利爭取優秀外國人才來台，應採取適當措施改善勞工薪資，獎勵民間企業改善基層勞工待遇，此外，有限合夥法自104年立法迄今，經濟部已將有限合夥此公司型態劃歸為中小企業，亦應修法適用，爰擬具「中小企業發展條例部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第三十五條","第三十六條之二","第三十六條之三","第三十九條","第四十條"]},{"id":"202110044710000","who":"委員鄭天財Sra Kacaw等17人","date":"2024-05-10","name":"「中小企業發展條例部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110044710000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/14/LCEWA01_110114_00293.pdf","proposers":["鄭天財Sra Kacaw"],"ncosign":16,"people":[["鄭天財Sra Kacaw","國民黨","提案"],["賴士葆","國民黨","連署"],["林倩綺","國民黨","連署"],["馬文君","國民黨","連署"],["黃健豪","國民黨","連署"],["邱若華","國民黨","連署"],["林沛祥","國民黨","連署"],["黃建賓","國民黨","連署"],["陳超明","無黨籍","連署"],["張嘉郡","國民黨","連署"],["陳雪生","國民黨","連署"],["羅智強","國民黨","連署"],["萬美玲","國民黨","連署"],["林思銘","國民黨","連署"],["鄭正鈐","國民黨","連署"],["呂玉玲","國民黨","連署"],["盧縣一","國民黨","連署"]],"party":[["國民黨",16],["無黨籍",1]],"reason":"本院委員鄭天財Sra Kacaw等17人，為協助中小企業改善經營環境，促進中小企業之健全發展，中小企業發展條例（以下簡稱本條例）自八十年二月四日公布施行，歷經八次修正，最近一次修正公布日期為一百零五年一月六日。為因應國際經貿情勢變動及產業發展趨勢，中小企業仍面臨升級轉型之挑戰，有持續提供租稅優惠措施，以促進中小企業投入創新研發及作價流通智慧財產權之必要性。再者，現行有關薪資費用加成減除租稅優惠之增僱員工優惠措施曾啟動二次，員工加薪薪資費用加成減除僅曾啟動一次，我國經濟情勢於過去十年間經歷顯著變化，經評估於景氣反轉階段鼓勵企業增僱或加薪之租稅優惠已達成階段性任務；近年全球產業快速變遷與轉型，中小企業人才需求趨於多元，且國內少子女化及高齡化已成趨勢，為持續提升中小企業延攬青年，並提高中小企業僱用中高齡者及高齡者意願，及協助中小企業留用人才及提高基層員工薪資，有檢討修正增僱及加薪租稅優惠措施之必要。另鑑於現行第三十五條、第三十五條之一及第三十六條之二租稅優惠措施施行期間至一百十三年五月十九日止，有延續前開措施以稅制上經濟誘因鼓勵中小企業升級轉型，增加聘僱中高齡及高齡人才，並促進基層員工薪資增長；及納入有限合夥為研究發展支出投資抵減租稅優惠之適用對象，配合修正中小企業定義之必要，爰擬具「中小企業發展條例部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第三十五條","第三十六條之二","第三十六條之三","第三十九條","第四十條"]},{"id":"202110047820000","who":"委員牛煦庭等20人","date":"2024-05-17","name":"「中小企業發展條例部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110047820000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/14/LCEWA01_110114_00068.pdf","proposers":["牛煦庭","黃建賓","吳宗憲","游顥","洪孟楷","廖偉翔","林沛祥"],"ncosign":13,"people":[["牛煦庭","國民黨","提案"],["黃建賓","國民黨","提案"],["吳宗憲","國民黨","提案"],["游顥","國民黨","提案"],["洪孟楷","國民黨","提案"],["廖偉翔","國民黨","提案"],["林沛祥","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","連署"],["馬文君","國民黨","連署"],["李彥秀","國民黨","連署"],["柯志恩","國民黨","連署"],["陳玉珍","國民黨","連署"],["陳永康","國民黨","連署"],["羅智強","國民黨","連署"],["邱鎮軍","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["謝龍介","國民黨","連署"],["吳春城","民眾黨","連署"],["羅明才","國民黨","連署"],["涂權吉","國民黨","連署"]],"party":[["國民黨",19],["民眾黨",1]],"reason":"本院委員牛煦庭、黃建賓、吳宗憲、游顥、洪孟楷、廖偉翔、林沛祥等20人，鑑於近年國際經貿情勢變動及產業發展趨勢，中小企業仍面臨升級轉型之挑戰，然現行中小企業發展條例相關租稅優惠措施將於民國一百十三年五月十九日截止，因而有持續提供租稅優惠措施之必要；面對產業迅速變遷，中小企業人才需求多元化，且我國少子女化及高齡化已成趨勢，為提高中小企業聘僱青年、中高齡者及高齡者之意願，以及提升整體本國籍基層員工薪資，俾協助中小企業留才久用，爰擬具「中小企業發展條例部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第三十五條","第三十六條之二","第三十六條之三","第三十九條","第四十條"]},{"id":"202110049420000","who":"委員徐巧芯等19人","date":"2024-05-24","name":"「中小企業發展條例第三十六條之二條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110049420000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00492.pdf","proposers":["徐巧芯","游顥","翁曉玲","廖偉翔"],"ncosign":15,"people":[["徐巧芯","國民黨","提案"],["游顥","國民黨","提案"],["翁曉玲","國民黨","提案"],["廖偉翔","國民黨","提案"],["洪孟楷","國民黨","連署"],["傅崐萁","國民黨","連署"],["林思銘","國民黨","連署"],["陳永康","國民黨","連署"],["張智倫","國民黨","連署"],["陳菁徽","國民黨","連署"],["陳超明","無黨籍","連署"],["羅明才","國民黨","連署"],["陳雪生","國民黨","連署"],["謝龍介","國民黨","連署"],["王鴻薇","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["羅智強","國民黨","連署"],["牛煦庭","國民黨","連署"],["廖先翔","國民黨","連署"]],"party":[["國民黨",18],["無黨籍",1]],"reason":"本院委員徐巧芯、游顥、翁曉玲、廖偉翔等19人，鑑於中小企業僱用大量基層員工，然企業盈餘分配不均成為低薪關鍵一環。我國勞動者在經濟成長果實的分享比重愈益萎縮的情形下，政府應鼓勵中小企業加薪，並給予稅賦優惠。且我國中小企業就業人數占全國就業人數維持8成以上，惟因中小企業因規模關係，在資金、行銷、生產上無法與大型企業相提並論，進而造成中小企業薪資普遍低落。為解決低薪問題，爰擬具「中小企業發展條例第三十六條之二條文修正草案」，規範目前中小企業加薪可扣抵當年營利事業所得的額度，由目前的130%提高至180%，為青年加薪可扣抵稅額的年齡，從24歲以下放寬到35歲以下，可扣抵當年營利事業所得額，由目前的150%，提高到180%，以增進企業為員工加薪的誘因。是否有當？敬請公決。","arts":["第三十六條之二"]},{"id":"202110048740000","who":"委員陳亭妃等16人","date":"2024-05-24","name":"「中小企業發展條例部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110048740000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00493.pdf","proposers":["陳亭妃"],"ncosign":15,"people":[["陳亭妃","民進黨","提案"],["王美惠","民進黨","連署"],["陳素月","民進黨","連署"],["林楚茵","民進黨","連署"],["蘇巧慧","民進黨","連署"],["陳冠廷","民進黨","連署"],["黃秀芳","民進黨","連署"],["張宏陸","民進黨","連署"],["李坤城","民進黨","連署"],["林淑芬","民進黨","連署"],["王正旭","民進黨","連署"],["張雅琳","民進黨","連署"],["林岱樺","民進黨","連署"],["黃捷","民進黨","連署"],["邱議瑩","民進黨","連署"],["沈伯洋","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員陳亭妃等16人，為因應國際經貿情勢變動及產業發展趨勢，中小企業仍面臨升級轉型之挑戰，有持續提供租稅優惠措施，以促進中小企業投入創新研發及作價流通智慧財產權之必要。另，現行有關薪資費用加成減除租稅優惠之增僱員工優惠措施曾啟動二次，員工加薪薪資費用加成減除僅曾啟動一次。鑒於我國經濟情勢於過去十年間經歷顯著變化，經評估於景氣反轉階段鼓勵企業增僱或加薪之租稅優惠已達成階段性任務；近年全球產業快速變遷與轉型，中小企業人才需求趨於多元，且國內少子女化及高齡化已成趨勢，為持續提升中小企業延攬青年，並提高中小企業僱用中高齡者及高齡者意願，及協助中小企業留用人才及提高基層員工薪資，應一併檢討修正增僱及加薪租稅優惠之措施。爰擬具「中小企業發展條例部分條文修正草案」。是否有當？敬請公決。","arts":["第二條","第三十五條","第三十六條之二","第三十六條之三","第三十九條","第四十條"]},{"id":"202110058790000","who":"委員顏寬恒等17人","date":"2024-06-28","name":"「中小企業發展條例第三十六條之二條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110058790000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00494.pdf","proposers":["顏寬恒","林沛祥","羅廷瑋","陳超明","謝龍介","蘇清泉"],"ncosign":11,"people":[["顏寬恒","國民黨","提案"],["林沛祥","國民黨","提案"],["羅廷瑋","國民黨","提案"],["陳超明","無黨籍","提案"],["謝龍介","國民黨","提案"],["蘇清泉","國民黨","提案"],["馬文君","國民黨","連署"],["林德福","國民黨","連署"],["黃仁","國民黨","連署"],["翁曉玲","國民黨","連署"],["牛煦庭","國民黨","連署"],["邱鎮軍","國民黨","連署"],["黃建賓","國民黨","連署"],["黃健豪","國民黨","連署"],["陳菁徽","國民黨","連署"],["邱若華","國民黨","連署"],["徐巧芯","國民黨","連署"]],"party":[["國民黨",16],["無黨籍",1]],"reason":"本院委員顏寬恒、林沛祥、羅廷瑋、陳超明、謝龍介、蘇清泉等17人，鑒於中小企業為我國經濟基石，且中小企業發展條例部分條文已於今年5月19日落日，考量中小企業人才需求及國內就業人口結構，且納入45歲員工亦能享有租稅優惠，並把減除率提高一體適用的150%，爰擬具「中小企業發展條例第三十六條之二條文修正草案」。是否有當？敬請公決。","arts":["第三十六條之二"]}],"arts":[{"no":"第一條","current":"為協助中小企業改善經營環境，推動相互合作，並輔導其自立成長，以促進中小企業之健全發展，特制定本條例；本條例未規定者，適用其他有關法律之規定。","versions":[{"bill":"202110018320000","text":"為協助中小企業改善經營環境，推動相互合作，並輔導其自立成長及升級轉型，以促進中小企業之健全發展，特制定本條例；本條例未規定者，適用其他有關法律之規定。","note":"因應淨零碳排，數位科技轉型，提升中小企業競爭力。台灣中小企業需政府輔導升級轉型，促進前瞻性、健全發展，爰將升級轉型納入本條立法目的。"}],"changed":true,"final":"為協助中小企業改善經營環境，推動相互合作，並輔導其自立成長及升級轉型，以促進中小企業之健全發展，特制定本條例；本條例未規定者，適用其他有關法律之規定。","finalWhy":"因應淨零碳排，數位科技轉型，提升中小企業競爭力。台灣中小企業需政府輔導升級轉型，促進前瞻性、健全發展，爰將升級轉型納入本條立法目的。","review":{"note":"照台灣民眾黨黨團提案通過","text":"為協助中小企業改善經營環境，推動相互合作，並輔導其自立成長及升級轉型，以促進中小企業之健全發展，特制定本條例；本條例未規定者，適用其他有關法律之規定。"}},{"no":"第二條","current":"本條例所稱中小企業，係指依法辦理公司或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按事業種類、資本額、營業額、經常僱用員工數等擬訂，定期報請行政院核定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。","versions":[{"bill":"202110037360000","text":"本條例所稱中小企業，指依法辦理公司、有限合夥或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按資本額、經常僱用員工數等定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。","note":"一、有限合夥法已於一百零四年六月二十四日制定公布，並自同年十一月三十日施行。經濟部業於一百零五年一月三十日以經企字第一○五○四六○○四四○號令闡明有限合夥亦屬中小企業範疇，為資明確，爰修正第一項，明定本條例所稱中小企業包含依法辦理有限合夥登記，合於中小企業認定標準之事業。\n二、考量事業組織模式漸趨多樣化，簡化認定，並為利彈性調整中小企業認定標準，爰修正第二項，刪除現行事業別及營業額之認定要件，並修正中小企業認定標準由中央主管機關定之。\n三、第三項未修正。"},{"bill":"201110037170000","text":"本條例所稱中小企業，指依法辦理公司、有限合夥或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按資本額、經常僱用員工數等定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。","note":"一、有限合夥法已於一百零四年六月二十四日制定公布，並自同年十一月三十日施行。經濟部業於一百零五年一月三十日以經企字第一○五○四六○○四四○號令闡明有限合夥亦屬中小企業範疇，為資明確，爰修正第一項，明定本條例所稱中小企業包含依法辦理有限合夥登記，合於中小企業認定標準之事業。\n二、考量事業組織模式漸趨多樣化，簡化認定，並為利彈性調整中小企業認定標準，爰修正第二項，刪除現行事業別及營業額之認定要件，並修正中小企業認定標準由中央主管機關定之。\n三、第三項未修正。"},{"bill":"202110040940000","text":"本條例所稱中小企業，指依法辦理公司、有限合夥或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按資本額、經常僱用員工數等定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。","note":"一、有限合夥法已於一百零四年施行。經濟部業以經企字第一○五○四六○○四四○號令闡明有限合夥屬中小企業範疇，爰修正第一項，明定有限合夥屬於本條例所稱中小企業。\n二、修正第二項，刪除現行事業別及營業額之認定要件，並修正中小企業認定標準由中央主管機關定之。\n三、第三項未修正。"},{"bill":"202110044710000","text":"本條例所稱中小企業，指依法辦理公司、有限合夥或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按資本額、經常僱用員工數等定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。","note":"一、有限合夥法已於一百零四年六月二十四日制定公布，並自同年十一月三十日施行。經濟部業於一百零五年一月三十日以經企字第一○五○四六○○四四○號令闡明有限合夥亦屬中小企業範疇，為資明確，爰修正第一項，明定本條例所稱中小企業包含依法辦理有限合夥登記，合於中小企業認定標準之事業。\n二、考量事業組織模式漸趨多樣化，簡化認定，並為利彈性調整中小企業認定標準，爰修正第二項，刪除現行事業別及營業額之認定要件，並修正中小企業認定標準由中央主管機關定之。\n三、第三項未修正。"},{"bill":"202110047820000","text":"本條例所稱中小企業，指依法辦理公司、有限合夥或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按資本額、經常僱用員工數等定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。","note":"一、有限合夥法已於一百零四年六月二十四日制定公布，並自同年十一月三十日施行。經濟部業於一百零五年一月三十日以經企字第一○五○四六○○四四○號令闡明有限合夥亦屬中小企業範疇，為資明確，爰修正第一項，明定本條例所稱中小企業包含依法辦理有限合夥登記，合於中小企業認定標準之事業。\n二、考量事業組織模式漸趨多樣化，簡化認定，並為利彈性調整中小企業認定標準，爰修正第二項，刪除現行事業別及營業額之認定要件，並修正中小企業認定標準由中央主管機關定之。\n三、第三項未修正。"},{"bill":"202110048740000","text":"本條例所稱中小企業，指依法辦理公司、有限合夥或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按資本額、經常僱用員工數等定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。","note":"一、有限合夥法已於一百零四年六月二十四日制定公布，並自同年十一月三十日施行。經濟部業於一百零五年一月三十日以經企字第一○五○四六○○四四○號令闡明有限合夥亦屬中小企業範疇，為資明確，爰修正第一項，明定本條例所稱中小企業包含依法辦理有限合夥登記，合於中小企業認定標準之事業。\n二、考量事業組織模式漸趨多樣化，簡化認定，並為利彈性調整中小企業認定標準，爰修正第二項，刪除現行事業別及營業額之認定要件，並修正中小企業認定標準由中央主管機關定之。\n三、第三項未修正。"}],"changed":true,"final":"本條例所稱中小企業，指依法辦理公司、有限合夥或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按資本額、經常僱用員工數等定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。","finalWhy":"一、有限合夥法已於一百零四年六月二十四日制定公布，並自同年十一月三十日施行。經濟部業於一百零五年一月三十日以經企字第一○五○四六○○四四○號令闡明有限合夥亦屬中小企業範疇，為資明確，爰修正第一項，明定本條例所稱中小企業包含依法辦理有限合夥登記，合於中小企業認定標準之事業。\n二、考量事業組織模式漸趨多樣化，簡化認定，並為利彈性調整中小企業認定標準，爰修正第二項，刪除原事業別及營業額之認定要件，並修正中小企業認定標準由中央主管機關定之。\n三、第三項未修正。","review":{"note":"照行政院及委員邱議瑩等人提案通過","text":"本條例所稱中小企業，指依法辦理公司、有限合夥或商業登記，合於中小企業認定標準之事業。\n前項認定標準，由中央主管機關按資本額、經常僱用員工數等定之。\n其他機關為辦理中小企業輔導業務，得就業務需要，另定標準，放寬輔導對象。"}},{"no":"第七條之一","current":null,"versions":[{"bill":"202110018320000","text":"為推動中小企業升級轉型，強化其經濟韌性及競爭力，經濟部應推動下列措施：\n一、升級轉型。\n二、人才培訓。\n三、基礎設施優化。\n四、資金協助。\n五、其他協助措施。\n前項第一款所定升級轉型措施如下：\n一、協助中小企業推動低碳化、智慧化。\n二、拓展商圈、街區店家、中小企業商機之優化措施。\n三、協助中小企業運用低碳化與智慧化出口拓銷及推動會展產業節能減碳。\n四、推動列管市場及夜市之優化措施。\n前二項措施，經濟部得擇定以獎勵、補助、利息補貼、輔導或協助貸款方式為之，並得視個別產業發展及受景氣影響情形，擇定特定產業提供優先或其他客製化優惠輔導或補助。為推動中小企業升級轉型，經濟部應訂定中小企業升級轉型辦法。","note":"一、本條新增。\n二、經濟部依據疫後強化經濟與社會韌性及全民共享經濟成果特別條例第四條第一項授權，就推動產業及中小企業升級轉型相關事項，訂定「經濟部推動產業及中小企業升級轉型辦法」，本條係該辦法第四條之規定，爰予提升為法律位階。\n三、目前國內中小企業面臨轉型動能不足之問題，特別需要政府持續提供體質調整及轉型資源，特別是資金的協助取得。爰於第一項明定經濟部得推動之協助措施。\n四、第三項前段明定經濟部得以獎勵、補助、利息補貼、輔導或協助貸款等方式提供前二項協助措施。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第三十五條","current":"為促進中小企業研發創新，中小企業投資於研究發展之支出，得選擇以下列方式抵減應納營利事業所得稅額，並以不超過該公司當年度應納營利事業所得稅額百分之三十為限；一經擇定，不得變更：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，抵減自當年度起三年內各年度應納營利事業所得稅額。\n供研究發展、實驗或品質檢驗用之儀器設備，其耐用年數在二年以上者，准按所得稅法固定資產耐用年數表所載年數，縮短二分之一計算折舊；縮短後餘數不滿一年者，不予計算。\n第一項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由行政院定之。","versions":[{"bill":"202110024880000","text":"為促進中小企業研發創新，中小企業投資於研究發展之支出，得選擇以下列方式抵減應納營利事業所得稅額，並以不超過該公司或有限合夥當年度應納營利事業所得稅額百分之三十為限；一經擇定，不得變更：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，抵減自當年度起三年內各年度應納營利事業所得稅額。\n供研究發展、實驗或品質檢驗用之儀器設備，其耐用年數在二年以上者，准按所得稅法固定資產耐用年數表所載年數，縮短二分之一計算折舊；縮短後餘數不滿一年者，不予計算。\n第一項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由行政院定之。","note":"一、配合有限合夥法一百零四年六月二十四日制定公布，並參考產業創新條例第十條，適用對象納入有限合夥事業，爰修正第一項。\n二、第二項至第三項未修正。"},{"bill":"202110027200000","text":"為促進中小企業研發創新，中小企業投資於研究發展之支出，得選擇以下列方式抵減應納營利事業所得稅額，並以不超過該公司或有限合夥當年度應納營利事業所得稅額百分之三十為限；一經擇定，不得變更：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，抵減自當年度起三年內各年度應納營利事業所得稅額。\n供研究發展、實驗或品質檢驗用之儀器設備，其耐用年數在二年以上者，准按所得稅法固定資產耐用年數表所載年數，縮短二分之一計算折舊；縮短後餘數不滿一年者，不予計算。\n第一項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由行政院定之。","note":"一、配合有限合夥法一百零四年六月二十四日制定公布，並參考產業創新條例第十條，適用對象納入有限合夥事業，爰修正第一項。\n二、第二項至第三項未修正。"},{"bill":"202110037360000","text":"為促進中小企業研發創新，中小企業投資於研究發展之支出，得選擇以下列方式抵減應納營利事業所得稅額，並以不超過該公司或有限合夥當年度應納營利事業所得稅額百分之三十為限；一經擇定，不得變更：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，抵減自當年度起三年內各年度應納營利事業所得稅額。\n供研究發展、實驗或品質檢驗用之儀器設備，其耐用年數在二年以上者，准按所得稅法固定資產耐用年數表所載年數，縮短二分之一計算折舊；縮短後餘數不滿一年者，不予計算。\n第一項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、配合修正條文第二條第一項將有限合夥納入為中小企業範圍，並參考產業創新條例第十條第一項規定，爰修正第一項，將適用對象納入有限合夥事業。\n二、第二項未修正。\n三、參酌產業創新條例第十條第二項、生技醫藥產業發展條例第五條第三項有關研究發展支出租稅優惠規定之授權辦法，與現行第三十六條之二有關增僱員工及加薪租稅優惠之授權辦法，均係由中央主管機關會同財政部定之，爰修正第三項，授權由中央主管機關會同財政部定之。"},{"bill":"201110037170000","text":"為促進中小企業研發創新，中小企業投資於研究發展之支出，得選擇以下列方式抵減應納營利事業所得稅額，並以不超過該公司或有限合夥當年度應納營利事業所得稅額百分之三十為限；一經擇定，不得變更：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，抵減自當年度起三年內各年度應納營利事業所得稅額。\n供研究發展、實驗或品質檢驗用之儀器設備，其耐用年數在二年以上者，准按所得稅法固定資產耐用年數表所載年數，縮短二分之一計算折舊；縮短後餘數不滿一年者，不予計算。\n第一項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、配合修正條文第二條第一項將有限合夥納入為中小企業範圍，並參考產業創新條例第十條第一項規定，爰修正第一項，將適用對象納入有限合夥事業。\n二、第二項未修正。\n三、參酌產業創新條例第十條第二項、生技醫藥產業發展條例第五條第三項有關研究發展支出租稅優惠規定之授權辦法，與現行第三十六條之二有關增僱員工及加薪租稅優惠之授權辦法，均係由中央主管機關會同財政部定之，爰修正第三項，授權由中央主管機關會同財政部定之。"},{"bill":"202110040940000","text":"為促進中小企業研發創新，中小企業投資於研究發展之支出，得選擇以下列方式抵減應納營利事業所得稅額，並以不超過該公司或有限合夥當年度應納營利事業所得稅額百分之三十為限；一經擇定，不得變更：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，抵減自當年度起三年內各年度應納營利事業所得稅額。\n供研究發展、實驗或品質檢驗用之儀器設備，其耐用年數在二年以上者，准按所得稅法固定資產耐用年數表所載年數，縮短二分之一計算折舊；縮短後餘數不滿一年者，不予計算。\n第一項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、配合修正條文第二條第一項將有限合夥納入為中小企業範圍，並參考產業創新條例第十條第一項規定，爰修正第一項，將適用對象納入有限合夥事業。\n二、第二項未修正。\n三、參酌產業創新條例第十條第二項、生技醫藥產業發展條例第五條第三項有關研究發展支出租稅優惠規定之授權辦法，與現行第三十六條之二有關增僱員工及加薪租稅優惠之授權辦法，均係由中央主管機關會同財政部定之，爰修正第三項，授權由中央主管機關會同財政部定之。"},{"bill":"202110044710000","text":"為促進中小企業研發創新，中小企業投資於研究發展之支出，得選擇以下列方式抵減應納營利事業所得稅額，並以不超過該公司或有限合夥當年度應納營利事業所得稅額百分之三十為限；一經擇定，不得變更：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，抵減自當年度起三年內各年度應納營利事業所得稅額。\n供研究發展、實驗或品質檢驗用之儀器設備，其耐用年數在二年以上者，准按所得稅法固定資產耐用年數表所載年數，縮短二分之一計算折舊；縮短後餘數不滿一年者，不予計算。\n第一項 業研發創新，中小企業投資於研究發展之支出，得選擇以下列方式抵減應納營利事業所得稅額，並以不超過該公司或有限合夥當年度應納營利事業所得稅額百分之三十為限；一經擇定，不得變更：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，抵減自當年度起三年內各年度應納營利事業所得稅額。\n供研究發展、實驗或品質檢驗用之儀器設備，其耐用年數在二年以上者，准按所得稅法固定資產耐用年數表所載年數，縮短二分之一計算折舊；縮短後餘數不滿一年者，不予計算。\n第一項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。"}},{"no":"第三十六條之二","current":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，經濟景氣指數達一定情形下，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之一百三十限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在二十四歲以下者，得就每年增僱本國籍員工支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業於經濟景氣指數達一定情形下，調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百三十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n中小企業於本條適用期間，不符合前三項要件，自不符合要件之年度起，依所得稅法規定計算其營利事業所得額及應納稅額。\n第一項、第二項及第三項所定經濟景氣指數達一定情形、適用期間、投資額、增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百零四年十二月十八日修正之第二項、第三項、第四項及第五項規定，自一百零五年一月一日施行至一百十三年五月十九日止，不適用第四十條但書之規定。","versions":[{"bill":"202110006150000","text":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，經濟景氣指數達一定情形下，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之二百限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在三十歲以下者，得就每年增僱本國籍員工支付薪資金額之百分之二百二十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業於經濟景氣指數達一定情形下，調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之二百限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n中小企業於本條適用期間，不符合前三項要件，自不符合要件之年度起，依所得稅法規定計算其營利事業所得額及應納稅額。\n第一項、第二項及第三項所定經濟景氣指數達一定情形、適用期間、投資額、增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百零四年十二月十八日修正之第二項、第三項、第四項及第五項規定，自一百零五年一月一日施行至一百十三年五月十九日止，不適用第四十條但書之規定。","note":"一、我國受僱人員報酬占GDP的比率，1990年超過五成（51.04%），之後規模不斷縮小，至2021年僅剩下43.1%。相對的，企業的營業盈餘不但金額大幅成長，占GDP的比重也呈現攀升的趨勢，1990年為29.8%，至2021年已達到36.4%。顯示勞動者在經濟成長果實的分享比重愈益萎縮。\n二、我國勞動生產力指數從1980至2021年上升近六倍，但同時期實質薪資卻於2000年開始近乎停滯，甚至還出現倒退。2022年我國受僱員工每月經常性薪資為44,417元，但扣除通貨膨脹後，僅剩41,356元，年減0.15%，創近十年最大減幅，與2001年的40,346元相較，僅成長約一千元。\n三、中小企業是我國經濟發展的基石，目前臺灣中小企業家數占全體企業達98%以上；就業人數占全國就業人數維持8成以上。但中小企業因規模較小，不論資金、技術，市場行銷等方面皆不如大型企業，導致薪資普遍低落。據統計，2021年中小企業員工平均月收入為3.92萬元，還不到大企業每月4.95萬元的八成。\n四、根據統計，2022年未滿25歲之勞工，全年總薪資中位數為36.2萬元；30歲以下就業者之薪資中位數為48.8萬元，與全體受雇員工總薪資中位數為55.2萬元尚有一段差距，因此如何提升30歲以下者之薪資即是關鍵。\n五、由於長期實質薪資成長有限，造成臺灣就業環境不佳，人才外流形成國安問題。根據統計，2005年赴海外就業的臺灣民眾為34萬人，到了2013年已經突破了70萬人，2019年則達到73.9萬人，創歷史新高。\n六、為有效解決低薪問題，目前中小企業加薪可扣抵當年營利事業所得的額度，應由目前的130%，提高到200%。原本規定中小企業為青年加薪可扣抵稅額的年齡，從24歲以下，放寬到30歲以下，可扣抵當年營利事業所得額，由目前的150%，提高到220%，以增進企業為員工加薪的誘因。"},{"bill":"202110016480000","text":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，經濟景氣指數達一定情形下，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之二百限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在二十四歲以下者，得就每年增僱本國籍員工支付薪資金額之百分之二百二十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業於經濟景氣指數達一定情形下，調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之二百限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n中小企業於本條適用期間，不符合前三項要件，自不符合要件之年度起，依所得稅法規定計算其營利事業所得額及應納稅額。\n第一項、第二項及第三項所定經濟景氣指數達一定情形、適用期間、投資額、增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百十三年○月○日修正之第二項、第三項、第四項及第五項規定，自一百十三年一月一日施行至一百二十年五月十九日止，不適用第四十條但書之規定。","note":"一、由於中小企業相對大企業而言，因經營規模與特性，較無法享受政府相關租稅優惠措施，基於改善就業率與提高薪資水準同為當前社會關切課題，且現行本條文第一項所規範之促進企業為員工加薪仍屬間接誘因，為因應嚴峻之國際經濟情勢，鼓勵中小企業提高基層員工薪資水準，我國前於一百零四年十二月十八日修法增訂本條文第二項。惟鑒於中小企業近年來受全球疫情及景氣低迷影響，企業為員工加薪仍亟待間接誘因支持，為此爰就企業每年增僱本國籍員工所支付薪資金額，得自其增僱當年度營利事業所得額中減除之比例，自百分之一百三十提高至百分之二百。另員工年齡在二十四歲以下者，得就每年增僱本國籍員工支付薪資金額限度則自百分之一百五十提高至百分之二百二十，以回應社會對於「基本薪資調整」未如理想、基層或新進年輕員工的薪資所得偏低現象不滿之改革期待。\n二、從公平與效益面談加薪減稅政策，宜參考新加坡加薪補貼計畫之作法，明定實施的期限，惟參酌我國中小企業現況，原條文所定僅施行至一百十三年五月十九日止期限顯然不足繼續提供企業為員工加薪之誘因，是為兼顧短期試行的方式，並視實施的效果再決定是否延長實施，爰修訂本條文第四項，延長施行期間為自一百十三年一月一日施行至一百二十年五月十九日止，至修正施行前，則仍適用原條文規定。"},{"bill":"202110017680000","text":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，經濟景氣指數達一定情形下，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之二百限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在二十九歲以下者，得就每年增僱本國籍員工支付薪資金額之百分之二百二十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業於經濟景氣指數達一定情形下，調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之二百限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n中小企業於本條適用期間，不符合前三項要件，自不符合要件之年度起，依所得稅法規定計算其營利事業所得額及應納稅額。\n第一項、第二項及第三項所定經濟景氣指數達一定情形、適用期間、投資額、增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百零四年十二月十八日修正之第二項、第三項、第四項及第五項規定，自一百零五年一月一日施行至一百十三年五月十九日止，不適用第四十條但書之規定。","note":"一、我國受僱人員報酬占GDP的比率，1990年為51.04%，之後規模不斷縮小，至2021年僅剩下43.1%。相對的，企業的營業盈餘不但金額大幅成長，占GDP的比重也呈現攀升的趨勢，1990年為29.8%，至2021年已達到36.4%。顯示勞動者在經濟成長果實的分享比重愈益萎縮。\n二、為有效解決低薪問題，中小企業加薪可扣抵當年營利事業所得的額度應提高，且原本規定中小企業為青年加薪可扣抵稅額的年齡，從二十四歲以下，應放寬到二十九歲以下，並提高扣抵當年營利事業所得額，以增進企業為員工加薪的誘因。\n三、根據行政院主計總處失業率資料，從失業勞工之年齡結構可知，年齡在二十四歲以下者失業率最高，其次為年齡區間二十五至二十九歲者，為有效降低年輕勞工之失業率，鼓勵企業增加雇用年輕勞工之因，宜給較用其他年齡層失業勞工更優惠之租稅滅免。"},{"bill":"202110018320000","text":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之二百限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在二十四歲以下與四十五歲以上者，得就每年增僱本國籍員工支付薪資金額之百分之二百二十限度內，自其增僱當年度營利事業所得額中減除。\n第一項員工年齡於六十五歲以上者，得就每年增僱本國籍員工支付薪資金額之百分之二百五十限度內，自其增僱當年度營利事業所得額中減除。\n調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之二百限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n第一項及第二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、增加企業其每年增僱本國籍員工所支付薪資金額之百分之二百限度的減稅額度，增加企業加薪已達成減稅之誘因。\n二、刪除啟動條款。\n三、為因應目前長年化之社會結構轉換，為鼓勵企業雇傭較年長之勞工，納入四十五歲以上、六十五歲以上之雇傭員工薪資，作為扣除之依據。"},{"bill":"202110024800000","text":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，經濟景氣指數達一定情形下，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之二百限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在三十歲以下者，得就每年增僱本國籍員工支付薪資金額之百分之二百二十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業於經濟景氣指數達一定情形下，調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之二百限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n中小企業於本條適用期間，不符合前三項要件，自不符合要件之年度起，依所得稅法規定計算其營利事業所得額及應納稅額。\n第一項、第二項及第三項所定經濟景氣指數達一定情形、適用期間、投資額、增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百零四年十二月十八日修正之第二項、第三項、第四項及第五項規定，自一百零五年一月一日施行至一百十三年五月十九日止，不適用第四十條但書之規定。","note":"一、我國受僱人員報酬占GDP的比率，1990年超過五成（51.04%），之後規模不斷縮小，至2021年僅剩下43.07%，2022年雖有緩升，惟長期仍呈下滑趨勢。相對的，企業的營業盈餘不但金額大幅成長，占GDP的比重也呈現攀升的趨勢，1990年為29.8%，至2021年已達到36.41%，2022年雖微幅下滑，但長期整體仍呈上長趨勢。顯示勞動者在經濟成長果實的分享比重益愈萎縮。\n二、我國勞動生產力指數從1980至2021年上升近六倍，但同時期實質薪資卻於2000年開始近乎停滯，以後年度增幅微小。2023年我國受僱員工每月經常性薪資為45,496元，但剔除物價因素後，僅剩41,334元，年減0.05%，實質經常性薪資原地踏步，與2001年的40,346元相較，僅成長988元。\n三、中小企業是我國經濟發展的基石，目前臺灣中小企業家數占全體企業達98%以上；就業人數占全國就業人數維持8成以上。但中小企業因規模較小，不論資金、技術，市場行銷等方面皆不如大型企業，導致薪資普遍低落。據「2023年中小企業白皮書」統計，2022年中小企業員工平均月收入為3.91萬元，還不到大企業每月4.98萬元的八成。\n四、根據統計，2022年未滿25歲之勞工，全年總薪資中位數為36.2萬元；30歲以下就業者之薪資中位數為48.8萬元，與全體受僱員工總薪資中位數為55.2萬元尚有一段差距，因此如何提升30歲以下者之薪資即是關鍵。\n五、由於長期實質薪資成長有限，造成臺灣就業環境不佳，人才外流形成國安問題。根據統計，2005年赴海外就業的臺灣民眾為34萬人，到了2013年已經突破了70萬人，2019年則達到73.9萬人，創歷史新高。之後雖因疫情致赴海外工作人數減少，惟隨疫情影響弱化，2022年赴海工作人數計47.3萬人，較2021年增加15.4萬人，增幅達48.4%\n六、為有效解決低薪問題，目前中小企業加薪可扣抵當年營利事業所得的額度，應由目前的130%，提高到200%。原本規定中小企業為青年加薪可扣抵稅額的年齡，從24歲以下，放寬到30歲以下，可扣抵當年營利事業所得額，由目前的150%，提高到220%，以增進企業為員工加薪的誘因。"},{"bill":"202110024880000","text":"中小企業增僱一定人數之二十四歲以下或四十五歲以上本國籍員工，且提高該企業整體薪資給付總額時，得就其每年增僱該員工所支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百五十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。\n第一項及第二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、修正第一項並刪除第二項，說明如下：\n(一)現行條文係為因應國際經濟情勢變化，鼓勵中小企業於經濟不景氣時，擴大投資並創造就業，爰規定於經濟景氣達一定情形下，中小企業如在臺投資達一定金額且增僱一定人數之本國籍員工，得享有薪資費用加成減除之租稅優惠。惟本措施於施行十年來，增僱員工薪資費用加成減除曾啟動過二次，員工加薪薪資費用加成減除僅啟動過一次，且目前經濟情勢與當年已有差異，評估現行條文鼓勵企業於景氣反轉階段增僱加薪之目的，已完成階段性任務，爰刪除第一項前段規定，使中小企業增僱特定對象員工可常態化適用本項租稅優惠措施。\n(二)近年我國人口結構呈現少子女化及高齡化情形，依據勞動部調查，一百零五年後十五歲至六十四歲工作年齡人口逐年減少，中高齡及高齡以上勞動參與亦逐年下降，因此活化中高齡者及高齡者勞動力將有助於緩解未來勞動力短缺課題。配合政府促進青年、中高齡者及高齡者就業，並因應全球產業快速變遷與轉型，中小企業人才才意願，明定中小企業增僱二十四歲以下及四十五歲以上員工之薪資費用加成減除率為百分之一百五十，爰修正第一項後段及刪除第二項規定。\n二、第三項移列至第二項，修正說明如下：\n(一)審酌現行條文關於經濟景氣指數達一定情形之要件已完成前述階段性任務，並為照顧基層員工，提高中小企業加薪意願，使其得依據經營獲利情況調高薪資給付，並利中小企業制定加薪規劃，爰刪除該要件，使加薪減除措施常態化適用。\n(二)為鼓勵中小企業為員工加薪，協助中小企業留用人才，爰提高支付薪資金額加成減除率為百分之一百五十。\n三、配合刪除現行條文第一項至第三項經濟景氣指數達一定情形之啟動門檻要件，本條租稅優惠已屬常態化措施，中小企業倘不符租稅優惠申請適用之要件，本應回歸所得稅法相關規定申報營利事業所得額及應納稅額，爰刪除第四項規定。\n四、現行條文第五項移列第三項，並酌作文字修正。\n五、配合施行期間延長，爰需求趨於多元，為協助中小企業人力資源規劃及提升延攬青年、中高齡及高齡人刪除第六項，本條施行期間一併於第四十條敘明。"},{"bill":"202110027200000","text":"中小企業增僱一定人數之二十四歲以下或四十五歲以上本國籍員工，因而提高該企業整體薪資給付總額時，得就其每年增僱該員工所支付薪資金額之百分之一百七十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百七十限度內，自其增加薪資當年度營利事業所得額中減除。\n中小企業調高本國籍薪資未達主計總處公布之新年度全時受僱員工經常性薪資平均數員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之二百限度內，自其增加薪資當年度營利事業所得額中減除。\n因第一項、第二項及第三項所增加之薪資給付金額不得重複計入。\n第一項、第二項及第三項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行條文規定於經濟景氣達一定情形下，中小企業增僱一定人數之本國籍員工、替基層員工加薪，得享有薪資費用加成減除之租稅優惠。\n二、惟原條文要件必須是失業率連續數月高於百分之三點七八，致使本措施於施行十年來，增僱員工薪資費用加成減除僅啟動過二次；員工加薪薪資費用加成減除只啟動一次，且實施家數非常少故刪除景氣要件，以利加薪減稅措施能常態性適用。\n三、配合政府促進青年、中高齡者及高齡者就業，並因應全球產業快速變遷與轉型，中小企業人才需求趨於多元，為協助中小企業人力資源規劃及提升延攬青年、中高齡及高齡人才意願，明定中小企業增僱二十四歲以下及四十五歲以上員工之薪資費用加成減除率為百分之一百七十，爰修正第一項後段及刪除第二項規定。\n四、為鼓勵中小企業為員工加薪，協助中小企業留用人才，爰提高支付薪資金額加成減除率為百分之一百七十至二百。"},{"bill":"202110033800000","text":"中小企業增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在二十四歲以下或四十五歲以上者，得就每年增僱本國籍員工支付薪資金額之百分之二百限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百五十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n前三項所定增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百十三年○月○日修正之規定，自一百十三年一月一日施行至一百二十二年十二月三十一日止，不適用第四十條但書之規定。","note":"一、現行條文與經濟情勢、失業率掛勾，導致施行十年來成效有限，160餘萬家中小企業僅千家申請，未能達到當初立法之目的，爰修正第一項，取消失業率等之要件，並將減除比率上限提高為百分之一百五十。\n二、因應高齡化及少子化現象，我國業已制訂「中高齡者及高齡者就業促進法」，為提高中小企業聘僱中高齡勞工，爰修正第二項，將四十五歲以上員工納入，並將其得減除上限提高至百分之二百。\n三、為鼓勵中小企業為本國籍員工加薪，爰修正第三項，刪除經濟景氣指數之要件，使加薪減除措施常態化，並將減除率上限提高為百分之一百五十。\n四、配合前三項之修正，第四項酌為文字修正。\n五、為落實鼓勵中小企業增聘員工及為員工加薪之政策目標，延長新措施十年至一百二十二年底，為方便中小企業租稅作業週期，並將適用期間回溯自一百十三年一月一日開始施行。"},{"bill":"202110037360000","text":"中小企業增僱一定人數之二十四歲以下或四十五歲以上本國籍員工，且提高該企業整體薪資給付總額時，得就其增僱該員工所支付薪資金額之百分之一百七十五限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百七十五限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。\n前二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、目前經濟情勢與當年已有差異，評估現行條文鼓勵企業於景氣反轉階段增僱或加薪之目的，已完成階段性任務，爰刪除有關經濟景氣指數達一定情形之相關規定。\n二、現行第一項及第二項整併修正為第一項：\n(一)為鼓勵中小企業延攬青年，提升中高齡及高齡人力資源規劃意願，爰明定中小企業增僱一定人數之二十四歲以下及四十五歲以上本國籍員工之薪資費用加成減除率為百分之一百七十五。\n(二)另現行第一項規定增僱員工薪資加成費用自其增僱「當年度」營利事業所得額中減除，已表明有符合要件之增僱事實即得於增僱當年度申報結算所得稅時提出租稅抵減適用之意涵，為避免誤解除增僱年度外，往後「每年」仍可適用租稅優惠，爰刪除「每年」之文字，以資辨明。\n三、第三項修正移列為第二項：\n(一)配合最低工資法一百十二年十二月二十七日制定公布，並自一百十三年一月一日施行，爰將基本工資修正為最低工資；又為鼓勵中小企業替員工加薪，協助其留用人才，爰將現行支付薪資金額加成減除率百分之一百三十修正提高為百分之一百七十五。\n(二)刪除「每年」之文字，理由同說明二、(二)。\n四、中小企業倘不符租稅優惠申請適用之要件，本應回歸所得稅法相關規定申報營利事業所得額及應納稅額，爰刪除第四項。\n五、第五項移列為第三項，並酌作文字修正。\n六、第六項移列修正條文第四十條第三項，爰予刪除。"},{"bill":"201110037170000","text":"中小企業增僱一定人數之二十四歲以下或四十五歲以上本國籍員工，且提高該企業整體薪資給付總額時，得就其增僱該員工所支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百五十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。\n前二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行條文係為因應國際經濟情勢變化，鼓勵中小企業於經濟不景氣時，擴大投資並創造就業及調高基層員工薪資，爰規定於經濟景氣指數達一定情形下，得享有薪資費用加成減除之租稅優惠。惟本措施施行十年來，增僱員工薪資費用加成減除曾啟動二次，員工加薪薪資費用加成減除僅曾啟動一次，且目前經濟情勢與當年已有差異，評估現行條文鼓勵企業於景氣反轉階段增僱或加薪之目的，已完成階段性任務，爰刪除有關經濟景氣指數達一定情形之相關規定。\n二、現行第一項及第二項整併修正為第一項：\n(一)近年我國人口結構呈現少子女化情形，且中高齡及高齡以上勞動參與率雖已漸次提升，但仍不及鄰近國家。考量全球產業快速變遷與轉型，中小企業人才需求逐漸多元，及配合政府促進青年、中高齡者及高齡者就業政策，活化中高齡者及高齡者勞動力將有助於緩解未來勞動力短缺課題，為鼓勵中小企業延攬青年，提升中高齡及高齡人力資源規劃意願，爰明定中小企業增僱一定人數之二十四歲以下及四十五歲以上本國籍員工之薪資費用加成減除率為百分之一百五十。\n(二)另現行第一項規定增僱員工薪資加成費用自其增僱「當年度」營利事業所得額中減除，已表明有符合要件之增僱事實即得於增僱當年度申報結算所得稅時提出租稅抵減適用之意涵，為避免誤解除增僱年度外，往後「每年」仍可適用租稅優惠，爰刪除「每年」之文字，以資辨明。\n三、第三項修正移列為第二項：\n(一)配合最低工資法一百十二年十二月二十七日制定公布，並自一百十三年一月一日施行，爰將基本工資修正為最低工資；又為鼓勵中小企業替員工加薪，協助其留用人才，爰將現行支付薪資金額加成減除率百分之一百三十修正提高為百分之一百五十。\n(二)刪除「每年」之文字，理由同說明二、(二)。\n四、中小企業倘不符租稅優惠申請適用之要件，本應回歸所得稅法相關規定申報營利事業所得額及應納稅額，爰刪除第四項。\n五、第五項移列為第三項，並酌作文字修正。\n六、第六項移列修正條文第四十條第三項，爰予刪除。"},{"bill":"202110039390000","text":"中小企業增僱一定人數之二十四歲以下或四十五歲以上本國籍員工，且提高該企業整體薪資給付總額時，得就其每年增僱該員工所支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除；五十五歲以上本國籍員工，且提高該企業整體薪資給付總額時，得就其每年增僱該員工所支付薪資金額之百分之一百八十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百五十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。\n第一項及第二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百十三年○月○日修正之規定，施行期間自一百十三年一月一日起至一百二十二年十二月三十一日止，不適用第四十條但書之規定。","note":"一、為鼓勵中小企業於經濟不景氣時，擴大投資並創造就業，爰規定於經濟景氣達一定情形下，中小企業如在台投資達一定金額且增僱一定人數之本國籍員工，得享有薪資費用加成減除之租稅優惠。但本措施於施行十年來，增僱員工薪資費用加成減除曾啟動過二次，員工加薪薪資費用加成減除僅啟動過一次，且目前經濟情勢與當年已有差異，評估現行條文鼓勵企業於景氣反轉階段增僱加薪之目的，已完成階段性任務，爰刪除第一項前段規定，使中小企業增僱特定對象員工可常態化適用本項租稅優惠措施。\n二、為活化中高齡者及高齡者勞動力將有助於緩解未來勞動力短缺課題。配合政府促進年輕人、中高齡者及高齡者就業，並因應全球產業快速變遷與轉型，並協助中小企業人力資源規劃及提升延攬年輕人、中高齡及高齡人才意願，明定中小企業增僱二十四歲以下及四十五歲以上員工之薪資費用加成減除率為百分之一百五十；五十五歲以上本國籍員工，則以百之百分之一百八十限度內加成減除。\n三、配合施行期間延長，本條施行期間於修正三讀立法通過後，回溯自113年1月1日施行，並排除第四十條但書之適用。"},{"bill":"202110040810000","text":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，經濟景氣指數達一定情形下，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之二百限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在三十歲以下者，得就每年增僱本國籍員工支付薪資金額之百分之二百三十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業於經濟景氣指數達一定情形下，調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之二百限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n中小企業於本條適用期間，不符合前三項要件，自不符合要件之年度起，依所得稅法規定計算其營利事業所得額及應納稅額。\n第一項、第二項及第三項所定經濟景氣指數達一定情形、適用期間、投資額、增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百零四年十二月十八日修正之第二項、第三項、第四項及第五項規定，自一百零五年一月一日施行至一百十三年五月十九日止，不適用第四十條但書之規定。","note":"基於中小企業是我國經濟發展的基石，目前臺灣中小企業家數占全體企業達98%以上；就業人數占全國就業人數維持8成以上。但根據統計，2023年我國受僱員工每月經常性薪資為45,496元，但剔除物價因素後，僅剩41,334元，年減0.05%，實質經常性薪資原地踏步，與2001年的40,346元相較，僅成長988元。另根據統計，2022年未滿25歲之勞工，全年總薪資中位數為36.2萬元；30歲以下就業者之薪資中位數為48.8萬元，與全體受僱員工總薪資中位數為55.2萬元尚有一段差距，因此亟需提升30歲以下者薪資。爰擬具「中小企業發展條例第三十六條之二條文修正草案」，將目前中小企業加薪可扣抵當年營利事業所得的額度，由目前的130%，提高到200%。原本規定中小企業為青年加薪可扣抵稅額的年齡，從24歲以下，放寬到30歲以下，可扣抵當年營利事業所得額，由目前的150%，提高到230%，以增進中小企業為員工加薪的誘因，改善勞工低薪現狀。"},{"bill":"202110040940000","text":"中小企業增僱一定人數之二十四歲以下或四十五歲以上本國籍員工，且提高該企業整體薪資給付總額時，得就其增僱該員工所支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百五十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。\n前二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部、勞動部定之。","note":"一、現行條文施行十年來，增僱員工薪資費用加成減除曾啟動二次，員工加薪薪資費用加成減除僅曾啟動一次，考量目前經濟情勢與本條文增訂之初已有差異，評估現行條文鼓勵企業於景氣反轉階段增僱或加薪之目的，已完成階段性任務，爰刪除有關經濟景氣指數達一定情形之相關規定。\n二、現行第一項及第二項整併修正為第一項：\n(一)考量全球產業快速變遷與轉型，中小企業人才需求逐漸多元，及在少子化、高齡化社會發展趨勢下，政府加強促進青年、中高齡者及高齡者就業政策，為鼓勵中小企業延攬青年，提升中高齡及高齡人力資源規劃意願，爰明定中小企業增僱一定人數之二十四歲以下及四十五歲以上本國籍員工之薪資費用加成減除率為百分之一百五十。\n(二)另現行第一項規定增僱員工薪資加成費用自其增僱「當年度」營利事業所得額中減除，為避免誤解除增僱年度外，往後「每年」仍可適用租稅優惠，爰刪除「每年」之文字，以資辨明。\n三、第三項修正移列為第二項：\n(一)配合最低工資法一百十二年十二月二十七日制定公布，並自一百十三年一月一日施行，爰將基本工資修正為最低工資；又為鼓勵中小企業替員工加薪，協助其留用人才，爰將現行支付薪資金額加成減除率百分之一百三十修正提高為百分之一百五十。\n(二)刪除「每年」之文字，理由同說明二、(二)。\n四、中小企業倘不符租稅優惠申請適用之要件，本應回歸所得稅法相關規定申報營利事業所得額及應納稅額，爰刪除第四項。\n五、第五項移列為第三項，並酌作文字修正。\n六、第六項移列修正條文第四十條第三項，爰予刪除。"},{"bill":"202110044710000","text":"中小企業增僱一定人數之二十四歲以下或五十五歲以上本國籍員工，且提高該企業整體薪資給付總額時，得就其增僱該員工所支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百五十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。\n前二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行條文係為因應國際經濟情勢變化，鼓勵中小企業於經濟不景氣時，擴大投資並創造就業及調高基層員工薪資，爰規定於經濟景氣指數達一定情形下，得享有薪資費用加成減除之租稅優惠。惟本措施施行十年來，增僱員工薪資費用加成減除曾啟動二次，員工加薪薪資費用加成減除僅曾啟動一次，且目前經濟情勢與當年已有差異，評估現行條文鼓勵企業於景氣反轉階段增僱或加薪之目的，已完成階段性任務，爰刪除有關經濟景氣指數達一定情形之相關規定。\n二、現行第一項及第二項整併修正為第一項：\n(一)近年我國人口結構呈現少子女化情形，且中高齡及高齡以上勞動參與率雖已漸次提升，但仍不及鄰近國家。考量全球產業快速變遷與轉型，中小企業人才需求逐漸多元，及配合政府促進青年、中高齡者及高齡者就業政策，活化中高齡者及高齡者勞動力將有助於緩解未來勞動力短缺課題，為鼓勵中小企業延攬青年，提升中高齡及高齡人力資源規劃意願，爰明定中小企業增僱一定人數之二十四歲以下及四十五歲以上本國籍員工之薪資費用加成減除率為百分之一百五十。\n(二)另現行第一項規定增僱員工薪資加成費用自其增僱「當年度」營利事業所得額中減除，已表明有符合要件之增僱事實即得於增僱當年度申報結算所得稅時提出租稅抵減適用之意涵，為避免誤解除增僱年度外，往後「每年」仍可適用租稅優惠，爰刪除「每年」之文字，以資辨明。\n三、第三項修正移列為第二項：\n(一)配合最低工資法一百十二年十二月二十七日制定公布，並自一百十三年一月一日施行，爰將基本工資修正為最低工資；又為鼓勵中小企業替員工加薪，協助其留用人才，爰將現行支付薪資金額加成減除率百分之一百三十修正提高為百分之一百五十。\n(二)刪除「每年」之文字，理由同說明二、(二)。\n四、中小企業倘不符租稅優惠申請適用之要件，本應回歸所得稅法相關規定申報營利事業所得額及應納稅額，爰刪除第四項。\n五、第五項移列為第三項，並酌作文字修正。\n六、第六項移列修正條文第四十條第三項，爰予刪除。"},{"bill":"202110047820000","text":"中小企業增僱一定人數之本國籍員工，且提高該企業整體薪資給付總額時，得就其增僱該員工所支付薪資金額，依下列比例，自其增僱當年度起三年內，分別於各該年度營利事業所得額中減除：\n一、增僱員工年齡在二十四歲以下或年滿四十五歲至六十五歲者：第一年為百分之一百八十，第二年為百分之一百六十，第三年為百分之一百四十。\n二、增僱員工年齡逾六十五歲者：第一年為百分之二百，第二年為百分之一百八十，第三年為百分之一百六十。\n三、前二款以外之增僱員工：第一年為百分之一百六十，第二年為百分之一百四十，第三年為百分之一百二十。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額，自其增加薪資當年度起二年內，依下列比例，於各該年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入：\n一、第一年：百分之一百五十。\n二、第二年：百分之一百三十。\n前二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之資格與要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行條文係為因應國際經濟情勢變化，鼓勵中小企業於經濟不景氣時，擴大投資並創造就業及調高基層員工薪資，爰規定於經濟景氣指數達一定情形下，得享有薪資費用加成減除之租稅優惠。惟本措施施行十年來，增僱員工薪資費用加成減除曾啟動二次，員工加薪薪資費用加成減除僅曾啟動一次，且目前經濟情勢與當年已有差異，評估現行條文鼓勵企業於景氣反轉階段增僱或加薪之目的，已完成階段性任務，爰刪除有關經濟景氣指數達一定情形之相關規定。\n二、現行第一項及第二項整併修正為第一項：\n(一)近年我國人口結構呈現少子女化情形，且中高齡及高齡以上勞動參與率雖已漸次提升，但仍不及鄰近國家。考量全球產業快速變遷與轉型，中小企業人才需求逐漸多元，及配合政府促進青年、中高齡者及高齡者就業政策，活化中高齡者及高齡者勞動力將有助於緩解未來勞動力短缺課題，為鼓勵中小企業延攬青年，提升中高齡及高齡人力資源規劃意願，爰明定中小企業增僱一定人數之二十四歲以下及四十五歲以上本國籍員工之薪資費用加成減除率，得享有更為優惠之租稅優惠。\n(二)考量現行稅捐優惠僅限增僱或加薪「當年度」享有，是為一次性租稅優惠，惟中小企業聘用員工或調薪後，該勞動契約具有繼續性，對雇主而言，每年均會持續產生非薪資之成本（包含勞工退休金及勞健保費用），若中小企業主無法把握每年均能持續獲利，則一次性稅捐優惠未必能成為增聘員工或加薪之有效誘因，且不利於留才久用，爰給予三年之遞減型租稅優惠，再依其增僱員工之年齡為不同比例之加成減除率。\n三、第三項修正移列為第二項，配合最低工資法一百十二年十二月二十七日制定公布，並自一百十三年一月一日施行，爰將基本工資修正為最低工資；又為鼓勵中小企業替員工加薪，協助其留用人才，爰配合第一項及第二項修正，給予三年之遞減型租稅優惠，另將加成減除率百分之一百三十修正提高為第一年為百分之一百五十，第二年為百分之一百三十。\n四、中小企業倘不符租稅優惠申請適用之要件，本應回歸所得稅法相關規定申報營利事業所得額及應納稅額，爰刪除第四項。\n五、第五項移列為第三項，並酌作文字修正。\n六、第六項移列修正條文第四十條第三項，爰予刪除。"},{"bill":"202110049420000","text":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，經濟景氣指數達一定情形下，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之一百八十限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在三十五歲以下者，得就每年增僱本國籍員工支付薪資金額之百分之一百八十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業於經濟景氣指數達一定情形下，調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百八十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n中小企業於本條適用期間，不符合前三項要件，自不符合要件之年度起，依所得稅法規定計算其營利事業所得額及應納稅額。\n第一項、第二項及第三項所定經濟景氣指數達一定情形、適用期間、投資額、增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百零四年十二月十八日修正之第二項、第三項、第四項及第五項規定，自一百零五年一月一日施行至一百十三年五月十九日止，不適用第四十條但書之規定。","note":"一、鑒於國際貿易局勢變化及產業發展趨勢，中小型企業正面臨升級轉型的挑戰。為鼓勵中小企業持續升級轉型，投入創新研發、鼓勵智慧財產權流通的稅務優惠措施變得迫切。另外，對於現有的薪資費用加成減免稅收政策，過去已有兩次增聘員工的優惠措施，但僅有一次啟動了薪資費用加成減免。而近年來全球產業快速轉型，國內的少子化和高齡化趨勢也不容忽視。為了幫助中小企業保留人才和提高基層員工的薪資水平，爰此優化薪資增加的稅收優惠措施，以期促進中小企業多元化人才的增聘，並提高薪資水準。\n二、根據行政院主計總處失業率資料，從失業勞工之年齡結構可知，年齡在二十四歲以下者失業率最高，其次為年齡區間二十五至二十九歲者，為有效降低年輕勞工之失業率，鼓勵企業增加僱用年輕勞工之因，宜給相較於其他年齡層失業勞工更優惠之租稅滅免。查我國青年發展政策綱領中定義青年為十五至三十五歲以下，爰此修改青年加薪可扣抵稅額的年齡，從二十四歲以下，放寬到三十五歲以下，並提高扣抵當年營利事業所得額，以增進企業為員工加薪的誘因。"},{"bill":"202110048740000","text":"中小企業增僱一定人數之二十四歲以下或四十五歲以上本國籍員工，且提高該企業整體薪資給付總額時，得就其增僱該員工所支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百五十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。\n前二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行條文係為因應國際經濟情勢變化，鼓勵中小企業於經濟不景氣時，擴大投資並創造就業及調高基層員工薪資，爰規定於經濟景氣指數達一定情形下，得享有薪資費用加成減除之租稅優惠。惟本措施施行十年來，增僱員工薪資費用加成減除曾啟動二次，員工加薪薪資費用加成減除僅曾啟動一次，且目前經濟情勢與當年已有差異，評估現行條文鼓勵企業於景氣反轉階段增僱或加薪之目的，已完成階段性任務，爰刪除有關經濟景氣指數達一定情形之相關規定。\n二、現行第一項及第二項整併修正為第一項：\n(一)近年我國人口結構呈現少子女化情形，且中高齡及高齡以上勞動參與率雖已漸次提升，但仍不及鄰近國家。考量全球產業快速變遷與轉型，中小企業人才需求逐漸多元，及配合政府促進青年、中高齡者及高齡者就業政策，活化中高齡者及高齡者勞動力將有助於緩解未來勞動力短缺課題，為鼓勵中小企業延攬青年，提升中高齡及高齡人力資源規劃意願，爰明定中小企業增僱一定人數之二十四歲以下及四十五歲以上本國籍員工之薪資費用加成減除率為百分之一百五十。\n(二)另現行第一項規定增僱員工薪資加成費用自其增僱「當年度」營利事業所得額中減除，已表明有符合要件之增僱事實即得於增僱當年度申報結算所得稅時提出租稅抵減適用之意涵，為避免誤解除增僱年度外，往後「每年」仍可適用租稅優惠，爰刪除「每年」之文字，以資辨明。\n三、第三項修正移列為第二項：\n(一)配合最低工資法一百十二年十二月二十七日制定公布，並自一百十三年一月一日施行，爰將基本工資修正為最低工資；又為鼓勵中小企業替員工加薪，協助其留用人才，爰將現行支付薪資金額加成減除率百分之一百三十修正提高為百分之一百五十。\n(二)刪除「每年」之文字，理由同說明二、(二)。\n四、中小企業倘不符租稅優惠申請適用之要件，本應回歸所得稅法相關規定申報營利事業所得額及應納稅額，爰刪除第四項。\n五、第五項移列為第三項，並酌作文字修正。\n六、第六項移列修正條文第四十條第三項，爰予刪除。"},{"bill":"202110058790000","text":"為因應國際經濟情勢變化，促進國內中小企業投資意願及提升國內就業率，經濟景氣指數達一定情形下，新投資創立或增資擴展之中小企業達一定投資額，增僱一定人數之員工且提高該企業整體薪資給付總額時，得就其每年增僱本國籍員工所支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n前項員工年齡在二十四歲以下或四十五歲以上者，得就每年增僱本國籍員工支付薪資金額之百分之一百五十限度內，自其增僱當年度營利事業所得額中減除。\n中小企業於經濟景氣指數達一定情形下，調高基層員工之平均薪資給付水準時，得就每年非因法定基本工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百五十限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前二項規定者，不得重複計入。\n中小企業於本條適用期間，不符合前三項要件，自不符合要件之年度起，依所得稅法規定計算其營利事業所得額及應納稅額。\n第一項、第二項及第三項所定經濟景氣指數達一定情形、適用期間、投資額、增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。\n本條中華民國一百零四年十二月十八日修正之第二項、第三項、第四項及第五項規定，自一百零五年一月一日施行至一百十三年五月十九日止，不適用第四十條但書之規定。","note":"一、依據世界衛生組織（WHO）統計資料顯示，法國是最早進入高齡化社會的國家，日本是最早列為超高齡社會的國家，我國內政部亦預估臺灣將於2025年正式邁入超高齡化社會，惟我國從高齡社會到超高齡社會的進程速度是世界之最，反映出我國人口老化速度的嚴重程度。國家發展委員會統計顯示臺灣於2021年早已呈現「人口負成長」，出生人數少於死亡人數，而此原因與國人平均壽命延長以及晚婚、不婚等現象密不可分。\n二、面對臺灣人口結構明顯的改變，政府亦推動各項相關政策來因應高齡社會所帶來的人口老化、退休潮、老人安養、勞動力減少與少子化等衝擊；然內政部統計我國工作年齡人口不僅逐年減少，且漸呈高齡化，依國家發展委員會推估結果，45-64歲占工作年齡人口比重預估由2022年之43%，上升至2070年之49%，遂擬將本條員工年齡修訂增加僱用45歲以上人口者亦得減除營利事業所得額，藉此增加中小企業僱用中高齡者之意願。"}],"changed":true,"final":"中小企業增僱一定人數之二十四歲以下或六十五歲以上本國籍基層員工，且提高該企業整體薪資給付總額時，得就其增僱該員工所支付薪資金額之百分之二百限度內，自其增僱當年度營利事業所得額中減除。\n中小企業調高本國籍基層員工之平均薪資給付水準時，得就非因法定最低工資調整而增加支付本國籍現職基層員工薪資金額之百分之一百七十五限度內，自其增加薪資當年度營利事業所得額中減除。但因增僱員工所致增加之薪資給付金額已適用前項規定者，不得重複計入。\n前二項增僱員工之對象及人數、企業整體薪資給付總額、基層員工範圍及平均薪資給付水準計算方式、核定機關、申請應具備之要件、申請期限、申請程序及其他相關事項之辦法，由中央主管機關會同財政部定之。","finalWhy":"照協商條文通過。,","review":null},{"no":"第三十六條之三","current":"產業創新條例中如有與本條例相同性質之租稅優惠，中小企業僅得擇一適用。","versions":[{"bill":"202110037360000","text":"中小企業已依其他法律享有租稅優惠者，不得就同一事項重複享有本條例所定之租稅優惠；就同一事項同時符合本條例所定不同租稅優惠規定者，應擇一適用，不得重複享有。\n中小企業最近三年因違反環境保護、勞工或食品安全衛生相關法律且情節重大，經各中央目的事業主管機關認定者，不得申請本條例之租稅優惠。","note":"一、現行條文列為第一項。為確保租稅優惠之衡平，避免單一企業重複享有租稅優惠，使相關中小企業均能充分運用，爰修正明定中小企業不得就同一事項重複享有本條例及其他法律或本條例所定不同之租稅優惠。\n二、為提高中小企業善盡企業社會責任之意識，督促企業遵守環境保護、勞工或食品安全衛生相關法規，並參酌現行中小企業研究發展支出適用投資抵減辦法訂有中小企業最近三年違反環境保護、勞工或食品安全衛生相關法律且情節重大者，不得申請各該項租稅優惠之相關規定，爰增訂第二項。"},{"bill":"201110037170000","text":"中小企業已依其他法律享有租稅優惠者，不得就同一事項重複享有本條例所定之租稅優惠；就同一事項同時符合本條例所定不同租稅優惠規定者，應擇一適用，不得重複享有。\n中小企業最近三年因違反環境保護、勞工或食品安全衛生相關法律且情節重大，經各中央目的事業主管機關認定者，不得申請本條例之租稅優惠。","note":"一、現行條文列為第一項。為確保租稅優惠之衡平，避免單一企業重複享有租稅優惠，使相關中小企業均能充分運用，爰修正明定中小企業不得就同一事項重複享有本條例及其他法律或本條例所定不同之租稅優惠。\n二、為提高中小企業善盡企業社會責任之意識，督促企業遵守環境保護、勞工或食品安全衛生相關法規，並參酌現行中小企業研究發展支出適用投資抵減辦法第四條第二款、中小企業增僱員工薪資費用加成減除辦法第五條第一項第八款及中小企業員工加薪薪資費用加成減除辦法第五條第一項第四款訂有中小企業最近三年違反環境保護、勞工或食品安全衛生相關法律且情節重大者，不得申請各該項租稅優惠之相關規定，爰增訂第二項。"},{"bill":"202110040940000","text":"中小企業已依其他法律享有租稅優惠者，不得就同一事項重複享有本條例所定之租稅優惠；就同一事項同時符合本條例所定不同租稅優惠規定者，應擇一適用，不得重複享有。\n中小企業最近三年因違反環境保護、勞工或食品安全衛生相關法律且情節重大，經各中央目的事業主管機關認定者，不得申請本條例之租稅優惠。","note":"一、現行條文列為第一項。為避免企業重複享有租稅優惠，爰修正明定中小企業不得就同一事項重複享有本條例及其他法律或本條例所定不同之租稅優惠。\n二、為提高中小企業善盡企業社會責任，督促企業遵守環境保護、勞工或食品安全衛生相關法規，爰參酌中小企業研究發展支出適用投資抵減辦法等規定，中小企業最近三年違反環境保護、勞工或食品安全衛生相關法律且情節重大者，不得申請各該項租稅優惠之相關規定，爰增訂第二項。"},{"bill":"202110044710000","text":"中小企業已依其他法律享有租稅優惠者，不得就同一事項重複享有本條例所定之租稅優惠；就同一事項同時符合本條例所定不同租稅優惠規定者，應擇一適用，不得重複享有。\n中小企業最近三年因違反環境保護、勞工或食品安全衛生相關法律且情節重大，經各中央目的事業主管機關認定者，不得申請本條例之租稅優惠。","note":"一、現行條文列為第一項。為確保租稅優惠之衡平，避免單一企業重複享有租稅優惠，使相關中小企業均能充分運用，爰修正明定中小企業不得就同一事項重複享有本條例及其他法律或本條例所定不同之租稅優惠。\n二、為提高中小企業善盡企業社會責任之意識，督促企業遵守環境保護、勞工或食品安全衛生相關法規，並參酌現行中小企業研究發展支出適用投資抵減辦法第四條第二款、中小企業增僱員工薪資費用加成減除辦法第五條第一項第八款及中小企業員工加薪薪資費用加成減除辦法第五條第一項第四款訂有中小企業最近三年違反環境保護、勞工或食品安全衛生相關法律且情節重大者，不得申請各該項租稅優惠之相關規定，爰增訂第二項。"},{"bill":"202110047820000","text":"中小企業已依其他法律享有租稅優惠者，不得就同一事項重複享有本條例所定之租稅優惠；就同一事項同時符合本條例所定不同租稅優惠規定者，應擇一適用，不得重複享有。\n中小企業最近三年因違反環境保護、勞工或食品安全衛生相關法律且情節重大，經各中央目的事業主管機關認定者，不得申請本條例之租稅優惠。","note":"一、現行條文列為第一項。為確保租稅優惠之衡平，避免單一企業重複享有租稅優惠，使相關中小企業均能充分運用，爰修正明定中小企業不得就同一事項重複享有本條例及其他法律或本條例所定不同之租稅優惠。\n二、為提高中小企業善盡企業社會責任之意識，督促企業遵守環境保護、勞工或食品安全衛生相關法規，並參酌現行中小企業研究發展支出適用投資抵減辦法第四條第二款、中小企業增僱員工薪資費用加成減除辦法第五條第一項第八款及中小企業員工加薪薪資費用加成減除辦法第五條第一項第四款訂有中小企業最近三年違反環境保護、勞工或食品安全衛生相關法律且情節重大者，不得申請各該項租稅優惠之相關規定，爰增訂第二項。"},{"bill":"202110048740000","text":"中小企業已依其他法律享有租稅優惠者，不得就同一事項重複享有本條例所定之租稅優惠；就同一事項同時符合本條例所定不同租稅優惠規定者，應擇一適用，不得重複享有。\n中小企業最近三年因違反環境保護、勞工或食品安全衛生相關法律且情節重大，經各中央目的事業主管機關認定者，不得申請本條例之租稅優惠。","note":"一、現行條文列為第一項。為確保租稅優惠之衡平，避免單一企業重複享有租稅優惠，使相關中小企業均能充分運用，爰修正明定中小企業不得就同一事項重複享有本條例及其他法律或本條例所定不同之租稅優惠。\n二、為提高中小企業善盡企業社會責任之意識，督促企業遵守環境保護、勞工或食品安全衛生相關法規，並參酌現行中小企業研究發展支出適用投資抵減辦法第四條第二款、中小企業增僱員工薪資費用加成減除辦法第五條第一項第八款及中小企業員工加薪薪資費用加成減除辦法第五條第一項第四款訂有中小企業最近三年違反環境保護、勞工或食品安全衛生相關法律且情節重大者，不得申請各該項租稅優惠之相關規定，爰增訂第二項。"}],"changed":true,"final":"中小企業已依其他法律享有租稅優惠者，不得就同一事項重複享有本條例所定之租稅優惠；就同一事項同時符合本條例所定不同租稅優惠規定者，應擇一適用，不得重複享有。\n中小企業最近三年因違反環境保護、勞工或食品安全衛生相關法律且情節重大，經各中央目的事業主管機關認定者，不得申請本條例之租稅優惠。","finalWhy":"一、原條文列為第一項。為確保租稅優惠之衡平，避免單一企業重複享有租稅優惠，使相關中小企業均能充分運用，爰修正明定中小企業不得就同一事項重複享有本條例及其他法律或本條例所定不同之租稅優惠。\n二、為提高中小企業善盡企業社會責任之意識，督促企業遵守環境保護、勞工或食品安全衛生相關法規，並參酌現行中小企業研究發展支出適用投資抵減辦法第四條第二款、中小企業增僱員工薪資費用加成減除辦法第五條第一項第八款及中小企業員工加薪薪資費用加成減除辦法第五條第一項第四款訂有中小企業最近三年違反環境保護、勞工或食品安全衛生相關法律且情節重大者，不得申請各該項租稅優惠之相關規定，爰增訂第二項。","review":null},{"no":"第三十六條之四","current":null,"versions":[{"bill":"202110017690000","text":"中小企業得在投資於下列用途項下支出金額百分之三十限度內，自當年度起三年內抵減各年度應納營利事業所得稅額：\n一、人才培訓。\n二、品牌發展。\n三、健全會計制度。\n中小企業當年度前項各款支出超過前二年度前項各款支出所歸屬經費平均數者，超過部分得按百分之五十抵減之。","note":"一、本條新增。\n二、企業獲利能力為企業為員工加薪的關鍵要素，為加強推動中小企業從事外部效果較高之人才培訓與品牌建立之投資，使我國逐步降低代工生產，利潤微薄之困境，爰參照本條例第三十五條有關為促進中小企業研發創新之獎勵規定，於第一項規定中小企業投資於人才培訓、品牌發展，得在投資支出金額百分之三十限度內，抵減各年度應納營利事業所得稅額；又為改善中小企業帳務處理狀況，爰將健全會計制度納入抵減項目。\n三、第二項規定中小企業當年度前項各款支出超過前二年度前項各款支出所歸屬經費平均數，超過部分得提高抵減之規定。"},{"bill":"202110018320000","text":"中小企業得在投資於下列用途項下支出金額百分之三十限度內，自當年度起三年內抵減各年度應納營利事業所得稅額：\n一、人才培訓。\n二、品牌發展。\n三、健全會計制度。\n前項各款當年度支出超過前二年度前項各款支出所歸屬經費平均數者，超過部分得按百分之五十抵減之。","note":"一、本條新增。\n二、為加強推動中小企業從事外部效果較高之人才培訓與品牌建立之投資，以逐步降低代工生產，利潤微薄之困境，特參照本條例第三十五條有關促進中小企業研發創新之獎勵規定，於第一項規定中小企業投資於人才培訓、品牌發展，得在投資支出金額百分之三十限度內，抵減各年度應納營利事業所得稅額；又為改善中小企業帳務處理狀況，爰將健全會計制度納入抵減項目。\n三、第二項規定中小企業當年度前項各款支出超過前二年度前項各款支出所歸屬經費平均數，超過部分得提高抵減之規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十九條","current":"行政院為審議中小企業發展政策，得設置中小企業政策審議委員會；其組織規程，由行政院定之。","versions":[{"bill":"202110037360000","text":"中央主管機關為審議中小企業發展政策，得邀集相關機關及學者專家組成中小企業政策審議會。","note":"依中央行政機關組織基準法第六條第一項第三款規定，委員會名稱於二級機關或獨立機關用之；鑑於現行條文規定設置之中小企業政策審議委員會，性質為任務編組，非屬二級機關或獨立機關，並考量該會審議內容及組成人員等情，爰修正其名稱，並修正由中央主管機關邀集相關機關及學者專家組成之。又該審議會組成之相關規定無須於本條例明定，爰刪除後段規定。"},{"bill":"201110037170000","text":"中央主管機關為審議中小企業發展政策，得邀集相關機關及學者專家組成中小企業政策審議會。","note":"依中央行政機關組織基準法第六條第一項第三款規定，委員會名稱於二級機關或獨立機關用之；鑑於現行條文規定設置之中小企業政策審議委員會，性質為任務編組，非屬二級機關或獨立機關，並考量該會審議內容及組成人員等情，爰修正其名稱，並修正由中央主管機關邀集相關機關及學者專家組成之。又該審議會組成之相關規定無須於本條例明定，爰刪除後段規定。"},{"bill":"202110040940000","text":"中央主管機關為審議中小企業發展政策，得邀集相關機關及學者專家組成中小企業政策審議會。","note":"鑑於現行條文規定設置之中小企業政策審議委員會，性質非屬機關為任務編組，並考量該會審議內容及組成人員等，爰修正其名稱，並修正由中央主管機關邀集相關機關及學者專家組成之。又該審議會組成之相關規定無須於本條例明定，爰刪除後段規定。"},{"bill":"202110044710000","text":"中央主管機關為審議中小企業發展政策，得邀集相關機關及學者專家組成中小企業政策審議會。","note":"依中央行政機關組織基準法第六條第一項第三款規定，委員會名稱於二級機關或獨立機關用之；鑑於現行條文規定設置之中小企業政策審議委員會，性質為任務編組，非屬二級機關或獨立機關，並考量該會審議內容及組成人員等情，爰修正其名稱，並修正由中央主管機關邀集相關機關及學者專家組成之。又該審議會組成之相關規定無須於本條例明定，爰刪除後段規定。"},{"bill":"202110047820000","text":"中央主管機關為審議中小企業發展政策，得邀集相關機關及學者專家組成中小企業政策審議會。","note":"依中央行政機關組織基準法第六條第一項第三款規定，委員會名稱於二級機關或獨立機關用之；鑑於現行條文規定設置之中小企業政策審議委員會，性質為任務編組，非屬二級機關或獨立機關，並考量該會審議內容及組成人員等情，爰修正其名稱，並修正由中央主管機關邀集相關機關及學者專家組成之。又該審議會組成之相關規定無須於本條例明定，爰刪除後段規定。"},{"bill":"202110048740000","text":"中央主管機關為審議中小企業發展政策，得邀集相關機關及學者專家組成中小企業政策審議會。","note":"依中央行政機關組織基準法第六條第一項第三款規定，委員會名稱於二級機關或獨立機關用之；鑑於現行條文規定設置之中小企業政策審議委員會，性質為任務編組，非屬二級機關或獨立機關，並考量該會審議內容及組成人員等情，爰修正其名稱，並修正由中央主管機關邀集相關機關及學者專家組成之。又該審議會組成之相關規定無須於本條例明定，爰刪除後段規定。"}],"changed":true,"final":"中央主管機關為審議中小企業發展政策，得邀集相關機關及學者專家組成中小企業政策審議會。","finalWhy":"依中央行政機關組織基準法第六條第一項第三款規定，委員會名稱於二級機關或獨立機關用之；鑑於原條文規定設置之中小企業政策審議委員會，性質為任務編組，非屬二級機關或獨立機關，並考量該會審議內容及組成人員等情，爰修正其名稱，並修正由中央主管機關邀集相關機關及學者專家組成之。又該審議會組成之相關規定無須於本條例明定，爰刪除後段規定。","review":null},{"no":"第四十條","current":"本條例自公布日施行。但第三十五條、第三十五條之一及第三十六條之二施行期間自中華民國一百零三年五月二十日起十年止。","versions":[{"bill":"202110018320000","text":"本條例自公布日施行。\n中華民國一百零三年六月四日修正公布之第三十六條之二施行期間自一百零三年五月二十日起十年止。\n本條例中華民國一百零五年一月六日修正公布之第三十六條之二第二項至第五項施行期間，自一百零五年一月一日起至一百十三年五月十九日止。\n本條例中華民國一百十三年○月○日修正之第三十六條之二施行期間，自一百十三年一月一日起至一百二十二年十二月三十一日止。","note":"一、為期明確，爰將現行規定第一項但書移列第二項，並明定本條例中華民國一百零三年六月四日修正公布之第三十六條之二所定租稅優惠措施於一百十三年五月十九日屆至，另該次修正。\n二、增訂第三項，敘明中華民國一百零五年一月六日修正有關租稅優惠措施之條文施行期間亦至一百十三年五月十九日止。\n三、為利於修正後調整中小企業稅法上負擔，俾利中小企業配合所得稅週期制申請適用租稅優惠，爰增訂第四項，敘明本次修正之第三十六條之二回溯自一百十三年一月一日起適用，施行至一百二十二年十二月三十一日止。"},{"bill":"202110024880000","text":"本條例自公布日施行。\n中華民國一百零三年六月四日修正公布之第三十五條及第三十六條之二施行期間自一百零三年五月二十日起十年止；第三十五條之一施行期間，自一百零三年五月二十日起至一百二十二年十二月三十一日止。\n本條例中華民國一百零五年一月六日修正公布之第三十六條之二第二項至第五項施行期間，自一百零五年一月一日起至一百十三年五月十九日止。\n本條例中華民國一百十三年○月○日修正之第三十五條及第三十六條之二施行期間，自一百十三年一月一日起至一百二十二年十二月三十一日止。","note":"一、為持續厚植中小企業研究發展量能，促進智慧財產權流通與應用，促進中小企業增僱加薪，相關租稅優惠措施仍為我國中小企業發展所需，故有必要予以展延。\n二、為期明確，爰將現行規定第一項但書移列第二項，並明定本條例中華民國一百零三年六月四日修正公布之第三十五條及第三十六條之二所定租稅優惠措施於一百十三年五月十九日屆至，另該次修正之第三十五條之一則延長施行期間至一百二十二年十二月三十一日止。\n三、增訂第三項，敘明中華民國一百零五年一月六日修正有關租稅優惠措施之條文施行期間亦至一百十三年五月十九日止。\n四、為利於修正後調整中小企業稅法上負擔，俾利中小企業配合所得稅週期制申請適用租稅優惠，爰增訂第四項，敘明本次修正之第三十五條及第三十六條之二回溯自一百十三年一月一日起適用，施行至一百二十二年十二月三十一日止。"},{"bill":"202110027200000","text":"本條例自公布日施行。\n中華民國一百零三年六月四日修正公布之第三十五條及第三十六條之二施行期間自一百零三年五月二十日起十年止；第三十五條之一施行期間，自一百零三年五月二十日起至一百二十二年十二月三十一日止。\n本條例中華民國一百零五年一月六日修正公布之第三十六條之二第二項至第五項施行期間，自一百零五年一月一日起至一百十三年五月十九日止。\n本條例中華民國一百十三年○月○日修正之第三十五條及第三十六條之二施行期間，自一百十三年一月一日起至一百二十二年十二月三十一日止。","note":"為持續厚植中小企業研究發展量能，促進智慧財產權流通與應用，促進中小企業增僱加薪，相關租稅優惠措施仍為我國中小企業發展所需，故有必要予以展延。"},{"bill":"202110037360000","text":"本條例自公布日施行。\n本條例中華民國一百零三年六月四日修正公布之第三十五條及第三十六條之二施行期間，自一百零三年五月二十日起至一百十三年五月十九日止；第三十五條之一施行期間，自一百零三年五月二十日起至一百二十二年十二月三十一日止。\n本條例中華民國一百零五年一月六日修正公布之第三十六條之二第二項至第五項施行期間，自一百零五年一月一日起至一百十三年五月十九日止。\n本條例中華民國一百十三年○月○日修正之第三十五條及第三十六條之二施行期間，自一百十三年一月一日起至一百二十二年十二月三十一日止。","note":"一、鑑於本條例已歷經數次修正，為使另定施行期間條文之規範明確，爰依體例將現行第四十條本文移列為第一項，內容未修正。\n二、現行第四十條但書移列為第二項，並依體例酌作文字修正；其中第三十五條之一所定租稅優惠措施本次並未修正，惟為持續促進智慧財產權流通與應用，該租稅優惠措施仍為我國中小企業發展所需，有必要予以展延其施行期間，爰於後段修正延長本條例一百零三年六月四日修正公布之第三十五條之一施行期間至一百二十二年十二月三十一日止。\n三、現行第三十六條之二第六項亦為施行期間之規定，爰移列為第三項，並依體例酌作文字修正。\n四、增訂第四項：\n(一)為持續厚植中小企業研究發展量能，促進中小企業增僱加薪，修正條文第三十五條及第三十六條之二所定租稅優惠措施為我國中小企業發展所需，故有必要展延其施行期間。\n(二)另為利修正後租稅優惠發揮經濟誘因，俾利中小企業配合所得稅申請適用租稅優惠，爰明定本條例本次修正之第三十五條及第三十六條之二施行期間自一百十三年一月一日起至一百二十二年十二月三十一日止。"},{"bill":"201110037170000","text":"本條例自公布日施行。\n本條例中華民國一百零三年六月四日修正公布之第三十五條及第三十六條之二施行期間，自一百零三年五月二十日起至一百十三年五月十九日止；第三十五條之一施行期間，自一百零三年五月二十日起至一百二十二年十二月三十一日止。\n本條例中華民國一百零五年一月六日修正公布之第三十六條之二第二項至第五項施行期間，自一百零五年一月一日起至一百十三年五月十九日止。\n本條例中華民國一百十三年○月○日修正之第三十五條及第三十六條之二施行期間，自一百十三年一月一日起至一百二十二年十二月三十一日止。","note":"一、鑑於本條例已歷經數次修正，為使另定施行期間條文之規範明確，爰依體例將現行第四十條本文移列為第一項，內容未修正。\n二、現行第四十條但書移列為第二項，並依體例酌作文字修正；其中第三十五條之一所定租稅優惠措施本次並未修正，惟為持續促進智慧財產權流通與應用，該租稅優惠措施仍為我國中小企業發展所需，有必要予以展延其施行期間，爰於後段修正延長本條例一百零三年六月四日修正公布之第三十五條之一施行期間至一百二十二年十二月三十一日止。\n三、現行第三十六條之二第六項亦為施行期間之規定，爰移列為第三項，並依體例酌作文字修正。\n四、增訂第四項：\n(一)為持續厚植中小企業研究發展量能，促進中小企 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }

  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
