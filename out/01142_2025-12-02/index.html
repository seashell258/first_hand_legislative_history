地位關係消滅後，始敢提出申訴，爰定明遭受職場霸凌勞工得於離職之日起一年內提起申訴，然考量該離職之申訴人申訴時效，爰於但書規定有利於申訴人申訴期限之規定。\n四、為利職場霸凌申訴案件後續直轄市或縣（市）主管機關之處理機制，爰參考性別平等工作法第三十二條之二第一項，於第三項定明直轄市或縣（市）主管機關對勞工申訴案件之調查，得請專業人士或民間團體協助；至該等專業人士或民間團體協助；至該等專業人士或民間團體之資格條件，後續將由中央主管機關另行規範，並適時辦理相關訓練，及視直轄市或縣（市）主管機關財政狀況予以補助。另職場霸凌行為如已涉及勞資爭議處理法所定權利事項之勞資爭議者，勞工亦得依該法所定程序處理，併予敘明。\n五、參考性別平等工作法第三十二條之二第二項，於第四項定明申訴人、被申訴人、相關人員或單位應有配合直轄市或縣（市）主管機關調查之義務；又被申訴人為主要受調查之對象，爰定明其不得規避、妨礙或拒絕，若有違反，則依修正條文第四十三條第一項第六款規定處罰，併予敘明。\n六、第五項定明有關直轄市或縣（市）主管機關受理職場霸凌申訴及最高負責人範圍、處理程序、調查方式及其他相關事項之辦法，授權由中央主管機關訂定，俾利直轄市或縣（市）主管機關依循辦理。\n七、另考量職場霸凌行為樣態多元，其亦可能涉及性騷擾，或以性別、年齡為由之就業歧視等複合式行為；基於性別平等工作法、中高齡者及高齡者就業促進法與就業服務法就性騷擾、年齡歧視及就業歧視之申訴調查或認定已有相關規定，為避免事業單位或直轄市或縣（市）主管機關於受理同一申訴事件因涉及多種行為樣態，致調查處理程序不一，後續將於本法施行細則或其他依本法授權訂定之法規命令定明該複合式之職場霸凌行為之相關處理程序，併予敘明。"},{"bill":"202110164360000","text":"勞工遭受職場霸凌，應向雇主提起申訴。但有下列情形之一者，得逕向地方主管機關提起申訴：\n一、被申訴人為最高負責人或雇主。\n二、雇主未依第二十二條之二第一項受理申訴案件或受霸凌勞工不服雇主所為之調查或懲戒結果。\n勞工依前項規定，向地方主管機關提起申訴之期限，應依下列規定辦理：\n一、自職場霸凌行為終了時起，逾三年者，不予受理。\n二、職場霸凌事件發生時勞工在職者，其得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。\n地方主管機關為調查第一項第一款及第二款之申訴案件，得委請專業人士或民間團體協助辦理。\n地方主管機關受理第一項第二款事由之申訴案件，除為事實之調查，並應為雇主有無違反第二十二條之二各款規定之調查。\n地方主管機關經調查結果認定第一項第一款、第二款申訴事由成立，得令行為人之雇主於一定期限內採取必要之處置。但情節重大者，得依據被霸凌勞工之意願提供訴訟協助。\n地方主管機關依本法規定進行調查時，申訴人、被申訴人、及受邀協助之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。\n有關地方主管機關受理職場霸凌申訴與最高負責人之範圍、申訴處理程序、調查方式、訴訟協助及其他相關事項之辦法，由中央主管機關定之。\n第一項但書所定被申訴人為政府機關（構）之最高負責人時，勞工應向其上級機關（構）提起申訴。","note":"一、本條新增。\n二、第一項本文規定勞工遭受職場霸凌，應向雇主申訴，但基於特定事由，勞工得向地方主管機關申訴，即：\n(一)第一款勞工遭受職場霸凌時，原則應循內部申訴制度向雇主提起申訴，惟霸凌之行為人為最高負責人時，其內部申訴制度能否有效運作，不無疑慮，為簡化申訴流程並兼顧勞工權益。定明勞工得逕向地方主管機關提起申訴之條件，以強化申訴人之權益；所稱最高負責人，如事業之經營負責人、法人或非法人團體之代表人或管理人等，其範圍將另於第五項授權子法予以定明。\n(二)第二款職場霸凌被申訴人若非為最高負責人，受霸凌勞工循內部申訴制度向雇主提起申訴，但是未獲雇主受理，或勞工對事業單位內部之調查結果或處置不滿意者。\n三、基於霸凌行為多具持續性，且其調查與認定複雜，爰於第二項定明向地方主管機關提起申訴之期限；第一款為參考行政罰法第二十七條第一項，行政罰之裁處權，因三年期間之經過而消滅之規定，定明該申訴之期限，以遭受霸凌行為終了三年為期限；第二款為考量勞工於在職期間可能礙於人際關係或最高負責人之權勢地位，未能於遭受霸凌後及時提起申訴，遲至離職後，工作場所權勢地位關係消滅後，始敢提出申訴，爰明定勞工得於離職之日起一年內提起申訴，然考量該離職之申訴人申訴時效，爰增訂第二款之但書有利於申訴人申訴期限之規定。\n四、為利職場霸凌申訴案件後續地方主管機關之處理機制，爰參考性別平等工作法第三十二條之二規定，於第三項定明地方主管機關對勞工申訴案件之調查，得委請專業人士或民間團體協助；至該等專業人士或民間團體之資格條件，後續將由中央主管機關另行規範，並適時辦理相關訓練，及視地方主管機關財務狀況予以補助。另霸凌行為如已涉及權利事項之勞資爭議者，勞工亦得依勞資爭議處理法所定程序辦理。另主管機關應於第二十二條之二第七項授權之準則，明定強化外部專家介入調查或申復之機制。\n五、第四項地方主管機關受理第一項第二款事由之申訴案件，除為職場霸凌之事實調查，並應為雇主有為違反第二十二條之二各款之防治、申訴、調查、保護義務規定，以完善行政處分之先備程序。\n六、第五項地方主管機關受理遭受霸凌勞工申訴，經調查確認申訴事由成立，得做出行政處分要求雇主限期採取必要措施。並且但書規定，若霸凌行為傷害申訴勞工本人之生命、身體、自由、與財產法益情節重大，有非尋求刑事、民事告訴而不能懲處不法行為，或回復勞工所遭受的損失，除依前述本文要求雇主為必要處置之外，另得協助勞工起訴。\n七、申訴人、被申訴人、及相關人員或單位應有配合地方主管機關調查之義務，爰參考性別平等工作法第三十二條之二規定，定明第六項規定；又被申訴人為主要受調查之對象，其不得規避、妨礙或拒絕，若有違反規定，可依本法第四十四條第六款規定處罰。\n八、第七項定明有關地方主管機關受理申訴與最高負責人之範圍、處理程序、調查方式及其他相關事項之辦法，授權由中央主管機關另行訂定之，俾利地方主管機關依循辦理。\n九、基於政府機關（構）之行政監督管理機制有別於私部門，就政府機關（構）之最高負責人（首長）涉及對該機關之勞工職場霸凌，其申訴案件應交由具指揮監督權限之上級機關（構）處理，爰定明第八項規定；上級機關（構）於受理該申訴案件後，應依本法第二十二條之二授權子法之調查及處理程序辦理，至後續當事人之救濟，依原服務機關人事法令及各該法令規定辦理。\n十、另考量霸凌行為樣態多元，其亦可能涉及性騷擾或性別、年齡等就業歧視之複合式行為；基於性別平等工作法、中高齡者及高齡者就業促進法與就業服務法就性騷擾及就業歧視之申訴調查或認定已有相關規定，依本法第一條規定，其他法律有特別規定者，從其規定，且為避免事業單位內部或地方主管機關於受理同一件申訴案件，其調查處理之法規競合問題，後續將於本法施行細則或其他授權子法定明該複合式之職場霸凌行為應優先適用法規之處理機制。"},{"bill":"202110164930000","text":"勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕向直轄市或縣（市）主管機關提起申訴。\n勞工依前項但書規定，向直轄市或縣（市）主管機關提起申訴之期限，應依下列規定辦理：\n一、自職場霸凌行為終了時起，逾三年者，不予受理。\n二、職場霸凌事件發生時勞工在職者，其得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。\n直轄市或縣（市）主管機關為調查第一項申訴案件，得請專業人士或民間團體協助辦理。\n直轄市或縣（市）主管機關依本法規定進行調查時，申訴人、被申訴人、受邀協助調查之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。\n前四項有關直轄市或縣（市）主管機關受理職場霸凌申訴與最高負責人之範圍、處理程序、調查方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、第一項定明勞工遭受職場霸凌時，原則應循內部申訴制度向雇主提起申訴，惟霸凌之行為人為最高負責人時，其內部申訴制度能否有效運作，不無疑慮，為簡化是類情形之申訴流程並兼顧受職場霸凌勞工權益，爰於第一項但書定明被申訴人為最高負責人時，勞工得逕向直轄市或縣（市）主管機關提起申訴，以強化申訴人之權益；所定最高負責人，如事業之經營負責人、法人或非法人團體之代表人或管理人等，其範圍依第五項規定授權訂定之辦法中定明。\n三、第二項定明向直轄市或縣（市）主管機關提起申訴之期限；第一款為衡酌相關事證取得之時效，且參考公務人員保障法第十九條第三項規定，定明該類職場霸凌申訴之期限，以職場霸凌行為終了三年為期限；第二款定明遭受職場霸凌勞工得於離職之日起一年內提起申訴，然考量該離職之申訴人申訴時效，爰於但書規定有利於申訴人申訴期限之規定。\n四、第三項定明直轄市或縣（市）主管機關對勞工申訴案件之調查，得請專業人士或民間團體協助；至該等專業人士或民間團體之資格條件，中央主管機關後續應另行規範，並適時辦理相關訓練，及視直轄市或縣（市）主管機關財政狀況予以補助。\n五、第四項定明申訴人、被申訴人、相關人員或單位應有配合直轄市或縣（市）主管機關調查之義務；又被申訴人為主要受調查之對象，爰定明其不得規避、妨礙或拒絕。\n六、第五項定明有關直轄市或縣（市）主管機關受理職場霸凌申訴及最高負責人範圍、處理程序、調查方式及其他相關事項之辦法，授權由中央主管機關訂定，俾利直轄市或縣（市）主管機關依循辦理。\n七、職場霸凌如涉及性騷擾或就業歧視等複合情形，應由施行細則或授權命令統一規範，以避免程序不一致。"},{"bill":"202110166760000","text":"勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕直轄市或縣（市）主管機關提起申訴。\n勞工依前項但書規定，向直轄市或縣（市）主管機關提起申訴之期限，應依下列規定辦理：\n一、自職場霸凌行為終了時起，逾三年者，不予受理。\n二、職場霸凌事件發生時勞工在職者，其得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。\n直轄市或縣（市）主管機關為調查第一項申訴案件，得請專業人士或民間團體協助辦理。\n直轄市或縣（市）主管機關依本法規定進行調查時，申訴人、被申訴人、受邀協助調查之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。\n前四項有關直轄市或縣（市）主管機關受理職場霸凌申訴與最高負責人之範圍、處理程序、調查方式、申復程序及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、有鑑於職場霸凌行為人可能是最高負責人或雇主本身，爰參考性別平等工作法第三十二條之一第一款，明定若行為人為最高負責人或雇主本身，被霸凌勞工得逕向直轄市或縣（市）主管機關提起申訴。\n三、第二項明定被申訴人屬最高負責人或雇主時，被霸凌勞工向直轄市或縣（市）主管機關提起申訴之期限；第一款參考行政罰法第二十七條第一項，行政罰之裁處權，因三年期間之經過而消滅之規定，明定該申訴期間以，以遭受霸凌行為結束後三年內為期限；第二款則考量勞工於在職期間可能囿於雇主權勢地位或職場人際關係等因素，而不敢在受僱期間提起申訴，直到離職後，使敢提出申訴，故明定勞工得於離職後一年內提起申訴，然考量該離職之申訴人申訴時效，爰增訂但書有利於申訴人申訴期限之規定。\n四、考量基層機關人力有限，為使調查結果維持客觀及完備，爰於第三項明定直轄市或縣（市）主管機關得委託專業人士或民間團體進行職場霸凌事件調查。\n五、第四項明定職場霸凌事件相關人，有接受調查之義務。\n六、第五項明定直轄市或縣（市）主管機關受理職場霸凌事件申訴相關程序，授權由中央主管機關訂定之。"},{"bill":"202110166930000","text":"勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕向直轄市或縣（市）主管機關提起申訴。\n勞工依前項但書規定，向直轄市或縣（市）主管機關提起申訴之期限，應依下列規定辦理：\n一、自職場霸凌行為終了時起，逾三年者，不予受理。\n二、職場霸凌事件發生時勞工在職者，其得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。\n直轄市或縣（市）主管機關為調查第一項申訴案件，得請專業人士或民間團體協助辦理。\n直轄市或縣（市）主管機關依本法規定進行調查時，申訴人、被申訴人、受邀協助調查之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。\n前四項有關直轄市或縣（市）主管機關受理職場霸凌申訴與最高負責人之範圍、處理程序、調查方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、勞工遭受職場霸凌時，原則應循內部申訴制度向雇主提起申訴，惟霸凌之行為人為最高負責人時，其內部申訴制度能否有效運作，不無疑慮，為簡化是類情形之申訴流程並兼顧受職場霸凌勞工權益，爰於第一項但書定明被申訴人為最高負責人時，勞工得逕向直轄市或縣（市）主管機關提起申訴，以強化申訴人之權益；所定最高負責人，如事業之經營負責人、法人或非法人團體之代表人或管理人等，其範圍將於依第五項規定授權訂定之辦法中定明。\n三、基於霸凌行為多具持續性，且其調查及認定複雜，爰於第二項定明向直轄市或縣（市）主管機關提起申訴之期限；第一款為衡酌相關事證取得之時效，且參考公務人員保障法第十九條第三項規定，定明該類職場霸凌申訴之期限，以職場霸凌行為終了三年為期限；第二款為考量勞工於在職期間可能礙於人際關係或最高負責人之權勢地位，未能於遭受霸凌後及時提起申訴，遲至離職或其他工作場所權勢地位關係消滅後，始敢提出申訴，爰定明遭受職場霸凌勞工得於離職之日起一年內提起申訴，然考量該離職之申訴人申訴時效，爰於但書規定有利於申訴人申訴期限之規定。\n四、為利職場霸凌申訴案件後續直轄市或縣（市）主管機關之處理機制，爰參考性別平等工作法第三十二條之二第一項，於第三項定明直轄市或縣（市）主管機關對勞工申訴案件之調查，得請專業人士或民間團體協助；至該等專業人士或民間團體之資格條件，後續將由中央主管機關另行規範，並適時辦理相關訓練，及視直轄市或縣（市）主管機關財政狀況予以補助。另職場霸凌行為如已涉及勞資爭議處理法所定權利事項之勞資爭議者，勞工亦得依該法所定程序處理，併予敘明。\n五、參考性別平等工作法第三十二條之二第二項，於第四項定明申訴人、被申訴人、相關人員或單位應有配合直轄市或縣（市）主管機關調查之義務；又被申訴人為主要受調查之對象，爰定明其不得規避、妨礙或拒絕，若有違反，則依修正條文第四十三條第一項第六款規定處罰，併予敘明。\n六、第五項定明有關直轄市或縣（市）主管機關受理職場霸凌申訴及最高負責人範圍、處理程序、調查方式及其他相關事項之辦法，授權由中央主管機關訂定，俾利直轄市或縣（市）主管機關依循辦理。\n七、另考量職場霸凌行為樣態多元，其亦可能涉及性騷擾，或以性別、年齡為由之就業歧視等複合式行為；基於性別平等工作法、中高齡者及高齡者就業促進法與就業服務法就性騷擾、年齡歧視及就業歧視之申訴調查或認定已有相關規定，為避免事業單位或直轄市或縣（市）主管機關於受理同一申訴事件因涉及多種行為樣態，致調查處理程序不一，後續將於本法施行細則或其他依本法授權訂定之法規命令定明該複合式之職場霸凌行為之相關處理程序，併予敘明。"},{"bill":"202110166940000","text":"勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕向直轄市或縣（市）主管機關提起申訴。\n勞工依前項但書規定，向直轄市或縣（市）主管機關提起申訴之期限，應依下列規定辦理：\n一、自職場霸凌行為終了時起，逾三年者，不予受理。\n二、職場霸凌事件發生時勞工在職者，其得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。\n直轄市或縣（市）主管機關為調查第一項申訴案件，得請專業人士或民間團體協助辦理。\n直轄市或縣（市）主管機關依本法規定進行調查時，申訴人、被申訴人、受邀協助調查之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。\n前四項有關直轄市或縣（市）主管機關受理職場霸凌申訴與最高負責人之範圍、處理程序、調查方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、勞工遭受職場霸凌時，原則應循內部申訴制度向雇主提起申訴，惟霸凌之行為人為最高負責人時，其內部申訴制度能否有效運作，不無疑慮，為簡化是類情形之申訴流程並兼顧受職場霸凌勞工權益，爰於第一項但書定明被申訴人為最高負責人時，勞工得逕向直轄市或縣（市）主管機關提起申訴，以強化申訴人之權益；所定最高負責人，如事業之經營負責人、法人或非法人團體之代表人或管理人等，其範圍將於依第五項規定授權訂定之辦法中定明。\n三、基於霸凌行為多具持續性，且其調查及認定複雜，爰於第二項定明向直轄市或縣（市）主管機關提起申訴之期限；第一款為衡酌相關事證取得之時效，且參考公務人員保障法第十九條第三項規定，定明該類職場霸凌申訴之期限，以職場霸凌行為終了三年為期限；第二款為考量勞工於在職期間可能礙於人際關係或最高負責人之權勢地位，未能於遭受霸凌後及時提起申訴，遲至離職或其他工作場所權勢地位關係消滅後，始敢提出申訴，爰定明遭受職場霸凌勞工得於離職之日起一年內提起申訴，然考量該離職之申訴人申訴時效，爰於但書規定有利於申訴人申訴期限之規定。\n四、為利職場霸凌申訴案件後續直轄市或縣（市）主管機關之處理機制，爰參考性別平等工作法第三十二條之二第一項，於第三項定明直轄市或縣（市）主管機關對勞工申訴案件之調查，得請專業人士或民間團體協助；至該等專業人士或民間團體協助；至該等專業人士或民間團體之資格條件，後續將由中央主管機關另行規範，並適時辦理相關訓練，及視直轄市或縣（市）主管機關財政狀況予以補助。另職場霸凌行為如已涉及勞資爭議處理法所定權利事項之勞資爭議者，勞工亦得依該法所定程序處理，併予敘明。\n五、參考性別平等工作法第三十二條之二第二項，於第四項定明申訴人、被申訴人、相關人員或單位應有配合直轄市或縣（市）主管機關調查之義務；又被申訴人為主要受調查之對象，爰定明其不得規避、妨礙或拒絕，若有違反，則依修正條文第四十三條第一項第六款規定處罰，併予敘明。\n六、第五項定明有關直轄市或縣（市）主管機關受理職場霸凌申訴及最高負責人範圍、處理程序、調查方式及其他相關事項之辦法，授權由中央主管機關訂定，俾利直轄市或縣（市）主管機關依循辦理。\n七、另考量職場霸凌行為樣態多元，其亦可能涉及性騷擾，或以性別、年齡為由之就業歧視等複合式行為；基於性別平等工作法、中高齡者及高齡者就業促進法與就業服務法就性騷擾、年齡歧視及就業歧視之申訴調查或認定已有相關規定，為避免事業單位或直轄市或縣（市）主管機關於受理同一申訴事件因涉及多種行為樣態，致調查處理程序不一，後續將於本法施行細則或其他依本法授權訂定之法規命令定明該複合式之職場霸凌行為之相關處理程序，併予敘明。"}],"changed":true,"final":"勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕向直轄市或縣（市）主管機關提起申訴。\n勞工依前項但書規定，向直轄市或縣（市）主管機關提起申訴之期限，應依下列規定辦理：\n一、自職場霸凌行為終了時起，逾三年者，不予受理。\n二、職場霸凌事件發生時勞工在職者，其得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。\n直轄市或縣（市）主管機關為調查第一項申訴案件，得請專業人士或民間團體協助辦理。\n直轄市或縣（市）主管機關依本法規定進行調查時，申訴人、被申訴人、受邀協助調查之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。\n前四項有關直轄市或縣（市）主管機關受理職場霸凌申訴與最高負責人之範圍、處理程序、調查方式及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"","review":{"note":"照行政院提案通過","text":"勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕向直轄市或縣（市）主管機關提起申訴。\n勞工依前項但書規定，向直轄市或縣（市）主管機關提起申訴之期限，應依下列規定辦理：\n一、自職場霸凌行為終了時起，逾三年者，不予受理。\n二、職場霸凌事件發生時勞工在職者，其得於離職之日起一年內申訴。但依前款規定有較長申訴期限者，從其規定。\n直轄市或縣（市）主管機關為調查第一項申訴案件，得請專業人士或民間團體協助辦理。\n直轄市或縣（市）主管機關依本法規定進行調查時，申訴人、被申訴人、受邀協助調查之個人或單位應予配合，並提供相關資料。被申訴人不得規避、妨礙或拒絕。\n前四項有關直轄市或縣（市）主管機關受理職場霸凌申訴與最高負責人之範圍、處理程序、調查方式及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第二十二條之四","current":null,"versions":[{"bill":"202110128290000","text":"職場霸凌被申訴人具權勢地位，且情節重大，於進行調查期間有先行停止或調整職務之必要時，雇主得暫時停止或調整被申訴人之職務；經調查未認定為職場霸凌者，停止職務期間之薪資，應予補發。","note":"一、本條新增。\n二、因應職場霸凌事件中被申訴人具權勢地位、情節重大時，調查期間可能影響調查公正性之情形，參酌《性別工作平等法》第十三條之一第一項規定，授權雇主得暫時停止或調整其職務，以維護調查之客觀與有效性。另為兼顧被申訴人權益，條文明定倘經調查未認定為職場霸凌者，其停止職務期間之薪資應予補發，避免對其造成不當損害。"},{"bill":"202110132410000","text":"雇主於知悉勞工遭受職場霸凌時，應採取下列立即有效之適當措施：\n一、雇主因接獲被霸凌勞工申訴而知悉時：\n(一)採行避免申訴人受職場霸凌情形再度發生之措施。\n(二)視申訴人需求及事件情節，提供相關諮詢或必要之協助及保護措施。\n(三)對申訴事件進行調查；申訴人有意願者，得予協調，如協調不成立時，應續行調查。\n(四)調查過程與結果應向申訴人充分說明。\n(五)霸凌成立應對行為人為適當之懲戒或處理。\n(六)霸凌不成立仍得審酌情形為必要處理。\n二、雇主非因前款情形而知悉時：\n(一)就相關事實進行必要之釐清。\n(二)依被霸凌勞工意願，協助其協調或提起申訴。\n(三)適度調整工作內容或工作場所。\n(四)依被霸凌勞工意願，提供相關諮詢或必要之協助及保護措施。\n雇主接獲被霸凌勞工申訴時，應於中央主管機關指定之網站登錄；事件之處理結果，亦應於該網站登錄之。\n雇主對於職場霸凌事件之調查或協調，應秉持客觀、公正、公平原則；於調查時，並應給予當事人充分陳述意見及答辯機會。\n雇主為針對霸凌事件調查，應成立調查小組，調查小組成員外聘比例不得低於二分之一，但行為人為最高負責人時，調查小組成員應全部外聘。\n調查小組認定霸凌事件不成立，申訴人仍有異議者，得向地方主管機關提出申訴，申訴人得要求雇主提供調查資料予地方主管機關，雇主不得拒絕。","note":"一、本條新增。\n二、明定雇主對於職場霸凌事件之調查或協調之處理原則，以保障當事人權益。\n三、為強化事業單位實施職場霸凌事件調查之公正客觀與程序明確化，及避免調查處理期限過久，增加申訴者之心理負擔，爰於第四項明定調查霸凌事件需成立調查小組，成員外聘比例不得低於二分之一，如果被申訴人為單位最高負責人，調查小組外聘比例應全部外聘，以確保專業性及維持公正客觀。\n四、勞工向雇主申訴職場霸凌或對事業單位內部之調查結果或處置不滿意者，可依向主管機關或勞動檢查機構提起申訴，事件相關資料應完整提供主管機關進行後續調查，雇主不得拒絕。"},{"bill":"202110166760000","text":"職場霸凌被申訴人具權勢地位，且情節重大，於進行調查期間有先行停止或調整職務之必要時，雇主得暫時停止或調整被申訴人之職務；經調查未認定為職場霸凌者，停止職務期間之薪資，應予補發。\n申訴案件經雇主或直轄市或縣（市）主管機關調查後，認定為職場霸凌，且情節重大者，雇主得於知悉該調查結果之日起三十日內，不經預告終止勞動契約。","note":"一、本條新增。\n二、有鑑於情節重大之職場霸凌事件，對於職場環境有重大影響，爰參考性別平等工作法第十三條之一，明定情節重大事件之後續處理方式。\n三、為建構友善職場環境，避免行為人對職場環境持續造成負面影響，爰於第一項明定被申訴人具權勢地位，且情節重大時，雇主得以暫時停止或調整被申訴人職務，而對於調查後確認非職場霸凌者，為避免被申訴人因無端指控而造成不可回復之傷害，應補償其停職期間之薪資損失。\n四、為避免行為人持續對職場環境造成負面影響，爰於第二項明定經調查確認為職場霸凌且情節重大者，雇主得於知悉調查結果時，立即終止職場霸凌行為人之勞動契約，而不需經過預告。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予採納","text":""}},{"no":"第二十二條之五","current":null,"versions":[{"bill":"202110128290000","text":"雇主或事業單位接獲申訴或知悉職場霸凌事件，應依各事業單位職場霸凌申訴規範，於三日內交由專責人員進行協調或調查處理。\n雇主、事業單位或主管機關處理調查事件時，得成立調查小組調查之。調查小組成員組成，任一性別不得少於三分之一，外聘委員應占成員總數二分之一以上。\n若職場霸凌事件當事人屬不同事業單位，前項調查小組成員，應有申訴人現所屬事業單位之代表。但申訴人另有要求者，不在此限。\n調查小組依本法規定進行調查時，被申訴人、申訴人及受邀協助調查之人或單位，應予配合，並提供相關資料，不得規避、妨礙或拒絕。","note":"一、本條新增。\n二、為保障受害人之權益，應建立明確之內部申訴處理機制與程序。爰新增本條，明定雇主或事業單位接獲申訴或知悉事件後，應依據各該事業單位之職場霸凌申訴處理規範，於三日內交由專責人員進行協調或調查處理，以確保事件能即時回應與妥善處理。\n三、考量職場霸凌事件多具複雜性與權勢不對等特性，處理過程應兼顧調查之公正性與專業性，爰於第二項明定雇主、事業單位或主管機關處理相關事件時，得設置調查小組，並對其成員組成設下規範。小組任一性別不得少於三分之一，係為落實性別平等原則；外聘委員須占成員總數二分之一以上，則可強化外部專業與中立性，減少內部壓力干擾，有助調查之客觀公信。\n四、基於修正條文第二條保障派遣勞工對要派單位之申訴權，實務申訴樣態將存在當事人分屬不同事業單位之案件，為確保申訴人利益能於調查中被充分反映，特於第三項規定，調查小組成員應納入申訴人所屬事業單位代表，惟考量部分個案中申訴人可能顧慮個人隱私或其他因素，爰增訂但書，尊重其不納入之選擇權。\n五、鑒於調查作業過程需仰賴當事人及相關人員或單位之協助與資料提供，否則將嚴重影響調查結果與處理效能。故第四項明定被申訴人、申訴人及受邀協助調查之人員或單位，對調查小組調查工作有配合義務，不得規避、妨礙或拒絕，以強化調查之法定性與可執行性。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十二條之六","current":null,"versions":[{"bill":"202110128290000","text":"雇主或事業單位處理職場霸凌調查案件，應於接獲申訴或知悉後二個月內完成調查。必要時，得延長一個月，並應通知申訴人及被申訴人等案件相關利害關係人。\n調查小組處理職場霸凌事件調查完成後，應將調查報告及處理建議，以書面向申訴人、被申訴人及其所屬事業單位與雇主提出報告，並依各事業單位職場霸凌懲處規範議處。\n前項之調查報告，應於調查完成後七日內，以書面通知申訴人及被申訴人。懲處措施，應於雇主或事業單位收到書面調查報告次日起十五日內，依各事業單位規範處理之。","note":"一、本條新增。\n二、為保障申訴人及相關人員之權益，參酌《性別平等教育法》第三十五條之規定新增本條，明確規範雇主、事業單位或地方主管機關處理職場霸凌案件之調查期限與程序，建立制度化流程，以避免調查程序無限拖延。\n三、第一項明定調查應於接獲申訴或知悉事件後二個月內完成，必要時得延長一個月，並應通知申訴人、被申訴人等相關利害關係人，確保程序透明及案件相關人之權益保障。\n四、第二項要求調查小組應提出調查報告及處理建議，並以書面送交申訴人、被申訴人及其所屬事業單位與雇主，確保資訊揭露及調查結果之正當性。\n五、第三項進一步明定，調查報告應於調查完成後七日內通知當事人，並要求雇主或事業單位應自收到報告次日起十五日內，依各自規範進行處理，以落實調查結果並防止怠於處置情形發生。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十二條之七","current":null,"versions":[{"bill":"202110128290000","text":"申訴人或被申訴人若對調查或懲戒結果有不服者，得依本法第二十二條之三第一項第二款規定，於收到書面通知次日起三十日內，逕行向地方主管機關提起申訴。\n地方主管機關依本法規定進行調查時，應於接獲調查申訴後七日內以書面通知申訴人是否受理。\n地方主管機關接獲調查申訴案件後，除有不受理情事外，應於七日內轉交調查小組處理，並於二個月內完成調查，必要時，得延長一個月。\n職場霸凌之被申訴人為最高負責人或雇主時，於地方主管機關調查期間，申訴人得向雇主申請調整職務或工作型態至調查結果送達雇主之日起三十日內，雇主不得拒絕。\n地方主管機關經申訴處理發現事業單位調查程序有重大瑕疵或有足以影響原調查認定之新事實、新證據時，得要求事業單位重新調查。\n地方主管機關經依第一項情形處理申訴調查發現，事業單位之處理結果，有違法或不當，必要時，得依所設調查小組之處理建議，對事業單位之處理結果，逕行改核或敘明理由交回事業單位依法處理，並追究相關人員責任。\n雇主或事業單位於接獲地方主管機關重新調查之要求時，應另組調查小組；其調查處理程序，依本法之相關規定。","note":"一、本條新增。\n二、為強化行政調查之效率與正當法律程序，參酌《性別平等教育法》第三十七條及第三十八條新增本條，建立申訴人或被申訴人對調查或懲戒結果不服時之外部救濟機制，並明確規範地方主管機關接獲申訴後之處理程序與時限。\n三、第一項明定再申訴可提起之期限，確保當事人有明確救濟途徑與合理行使時間。\n四、新增條文第二項、第三項明定地方主管機關受理及處理調查申訴案件時限，以確保申訴案件處理具時效性與可預期性。\n五、第四項為保障申訴人於調查期間之工作權益，並提升調查之實質公正性，明定當被申訴人為雇主或最高負責人時，申訴人得申請調整職務或工作型態，雇主不得拒絕。\n六、第五項授權地方主管機關於發現事業單位調查程序有重大瑕疵，或出現足以影響認定之新事實、新證據時，得要求重新調查；第六項進一步規定，必要時主管機關可逕行改核原處理結果，強化行政監督功能，保障勞工權益。\n七、第七項明定，雇主或事業單位接獲重新調查之要求時，應依本法另組調查小組辦理，確保後續程序之公正性與合法性。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十二條之八","current":null,"versions":[{"bill":"202110128290000","text":"主管機關於雇主或事業單位調查處理職場霸凌事件時，應對雇主或事業單位提供諮詢服務、輔導協助、適法監督或予以糾正。","note":"一、本條新增。\n二、為強化主管機關對職場霸凌事件處理過程之支持與監督機能，參酌《性別平等教育法》第四十條第一項新增本條，規定主管機關於雇主或事業單位處理職場霸凌事件時，應提供必要之協助與監督，包括諮詢服務、輔導協助、適法監督及糾正，促使雇主或事業單位依據法令妥適處理相關事件，保障勞工權益，建立主管機關之積極介入角色，並提升職場霸凌處理制度完整性與落實效果。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二十三條","current":"雇主應依其事業單位之規模、性質，訂定職業安全衛生管理計畫；並設置安全衛生組織、人員，實施安全衛生管理及自動檢查。\n前項之事業單位達一定規模以上或有第十五條第一項所定之工作場所者，應建置職業安全衛生管理系統。\n中央主管機關對前項職業安全衛生管理系統得實施訪查，其管理績效良好並經認可者，得公開表揚之。\n前三項之事業單位規模、性質、安全衛生組織、人員、管理、自動檢查、職業安全衛生管理系統建置、績效認可、表揚及其他應遵行事項之辦法，由中央主管機關定之。","versions":[{"bill":"202110109180000","text":"雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業身心安全衛生管理計畫，實施身心安全衛生管理及自動檢查。\n前項之事業單位達一定規模以上或有第十五條第一項所定之工作場所者，應建置職業身心安全衛生管理系統。\n中央主管機關對前項職業身心安全衛生管理系統得實施訪查，其管理績效良好並經認可者，得公開表揚之。\n第一項及第二項所定安全衛生管理，由雇主或工作場所負責人綜理，並由事業單位內各級主管依職責指揮、監督所屬人員執行。\n前四項之事業單位規模、性質、身心安全衛生組織、人員、職責、管理、自動檢查、職業身心安全衛生管理系統建置、績效認可、表揚及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、修正應以組織為概念推動身心職業安全衛生，以融入企業組織管理體系，並加強組織內不同部門間整合。\n二、現行條文中，關於心理衛生描述仍有不足，調整文字明確納入心理衛生項目。"},{"bill":"202110119990000","text":"雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業身心安全衛生管理計畫，實施身心安全衛生管理及自動檢查。\n前項之事業單位達一定規模以上或有第十五條第一項所定之工作場所者，應建置職業身心安全衛生管理系統。\n中央主管機關對前項職業身心安全衛生管理系統得實施訪查，其管理績效良好並經認可者，得公開表揚之。\n第一項及第二項所定安全衛生管理，由雇主或工作場所負責人綜理，並由事業單位內各級主管依職責指揮、監督所屬人員執行。\n前四項之事業單位規模、性質、身心安全衛生組織、人員、職責、管理、自動檢查、職業身心安全衛生管理系統建置、績效認可、表揚及其他應遵行事項之辦法，由中央主管機關定之。","note":"一、修正應以組織為概念推動身心職業安全衛生。\n二、調整文字明確納入心理衛生項目。"},{"bill":"202110161460000","text":"雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業安全衛生管理計畫，實施安全衛生管理及自動檢查。\n前項之事業單位達一定規模或有第十五條第一項所定之工作場所者，應建置職業安全衛生管理系統。\n中央主管機關對前項職業安全衛生管理系統得實施訪查，其管理績效良好得公開表揚之。\n第一項及第二項所定安全衛生管理，應由雇主、雇主代理人或工作場所負責人綜理，並由事業單位各級主管依其職責指揮、監督所屬人員執行。\n前四項之事業單位規模、性質、安全衛生組織、人員、職責、管理、自動檢查、職業安全衛生管理系統建置及其他相關事項之辦法，由中央主管機關定之。","note":"一、參考 ISO 45001、ILO 指引及各國作法，安全衛生組織與人員為事業單位推動職安的核心，爰修正第一項文字以符實務。\n二、第二項作文字及標點修正。\n三、第三項原意在鼓勵自主管理，現已有國家職安獎、金安獎等表揚制度，且符合要件無須再經績效認可，爰修正以符現況。\n四、實務上安全衛生權責常不清，致互相推諉。為明確化雇主、主管與管理人員之權責，增訂第四項規定。\n五、原第四項移列為第五項，並授權訂定相關人員職責，以資明確。"},{"bill":"201110158300000","text":"雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業安全衛生管理計畫，實施安全衛生管理及自動檢查。\n前項之事業單位達一定規模或有第十五條第一項所定之工作場所者，應建置職業安全衛生管理系統。\n中央主管機關對前項職業安全衛生管理系統得實施訪查，其管理績效良好得公開表揚之。\n第一項及第二項所定安全衛生管理，應由雇主、雇主代理人或工作場所負責人綜理，並由事業單位各級主管依其職責指揮、監督所屬人員執行。\n前四項之事業單位規模、性質、安全衛生組織、人員、職責、管理、自動檢查、職業安全衛生管理系統建置及其他相關事項之辦法，由中央主管機關定之。","note":"一、參考國際標準組織ISO 45001職業安全衛生管理系統標準、國際勞工組織（ILO）職業安全衛生管理系統指引及各先進國家作法，安全衛生組織、人員係事業單位內推動職場安全衛生管理之關鍵角色，且實務上雇主亦係透過設置安全衛生組織、人員，負責擬訂、規劃、推動及督導事業單位內安全衛生相關業務，逐步將職業安全衛生管理融入企業組織管理體系，爰第一項酌作文字修正，以符合實際。\n二、第二項酌作文字及標點符號修正。\n三、第三項立法意旨係為鼓勵事業單位積極推動職業安全衛生，落實自主管理，現行公開表揚有國家職業安全衛生獎、推行職業安全衛生優良單位及人員、優良工程金安獎等，並訂有相關要點據以實施，又考量符合評核要件無須再經績效認可，爰為第三項修正，以符合實際。\n四、鑑於事業單位內安全衛生管理之推動，實務上常有各級人員權責劃分不明確之爭，例如工地負責人與職業安全衛生管理人員職責不清，致對安全衛生管理事項之綜理、指揮、監督等職責互相推諉。查本法施行細則第三條及第三十四條規定，安全衛生管理應由雇主、雇主代理人或工作場所負責人綜理；又查職業安全衛生管理辦法第五條之一規定，工作場所負責人及各級主管職責係依其職權指揮、監督所屬執行安全衛生管理事項，並協調及指導有關人員實施，另職業安全衛生管理人員係負責擬訂、規劃、推動及督導安全衛生管理事項，為使各層級職業安全衛生職責明確化，共同推動職業安全衛生業務，爰增訂第四項規定。\n五、第四項移列為第五項，配合第四項之增訂修正所涉項次，並授權訂定上述相關人員之職責，以資明確。"},{"bill":"202110162130000","text":"雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業安全衛生管理計畫，實施安全衛生管理及自動檢查。\n前項之事業單位達一定規模或有第十五條第一項所定之工作場所者，應建置職業安全衛生管理系統。\n中央主管機關對前項職業安全衛生管理系統得實施訪查，其管理績效良好得公開表揚之。\n第一項及第二項所定安全衛生管理，應由雇主、雇主代理人或工作場所負責人綜理，並由事業單位各級主管依其職責指揮、監督所屬人員執行。\n前四項之事業單位規模、性質、安全衛生組織、人員、職責、管理、自動檢查、職業安全衛生管理系統建置及其他相關事項之辦法，由中央主管機關定之。","note":"一、參考國際標準組織ISO 45001職業安全衛生管理系統標準、國際勞工組織（ILO）職業安全衛生管理系統指引及各先進國家作法，安全衛生組織、人員係事業單位內推動職場安全衛生管理之關鍵角色，且實務上雇主亦係透過設置安全衛生組織、人員，負責擬訂、規劃、推動及督導事業單位內安全衛生相關業務，逐步將職業安全衛生管理融入企業組織管理體系，爰第一項酌作文字修正，以符合實際。\n二、第二項酌作文字及標點符號修正。\n三、第三項立法意旨係為鼓勵事業單位積極推動職業安全衛生，落實自主管理，現行公開表揚有國家職業安全衛生獎、推行職業安全衛生優良單位及人員、優良工程金安獎等，並訂有相關要點據以實施，又考量符合評核要件無須再經績效認可，爰為第三項修正，以符合實際。\n四、鑑於事業單位內安全衛生管理之推動，實務上常有各級人員權責劃分不明確之爭，例如工地負責人與職業安全衛生管理人員職責不清，致對安全衛生管理事項之綜理、指揮、監督等職責互相推諉。查本法施行細則第三條及第三十四條規定，安全衛生管理應由雇主、雇主代理人或工作場所負責人綜理；又查職業安全衛生管理辦法第五條之一規定，工作場所負責人及各級主管職責係依其職權指揮、監督所屬執行安全衛生管理事項，並協調及指導有關人員實施，另職業安全衛生管理人員係負責擬訂、規劃、推動及督導安全衛生管理事項，為使各層級職業安全衛生職責明確化，共同推動職業安全衛生業務，爰增訂第四項規定。\n五、第四項移列為第五項，配合第四項之增訂修正所涉項次，並授權訂定上述相關人員之職責，以資明確。"},{"bill":"202110162770000","text":"雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業安全衛生管理計畫，實施安全衛生管理及自動檢查。\n前項之事業單位達一定規模或有第十五條第一項所定之工作場所者，應建置職業安全衛生管理系統。\n中央主管機關對前項職業安全衛生管理系統得實施訪查，其管理績效良好得公開表揚之。\n第一項及第二項所定安全衛生管理，應由雇主、雇主代理人或工作場所負責人綜理，並由事業單位各級主管依其職責指揮、監督所屬人員執行。\n前四項之事業單位規模、性質、安全衛生組織、人員、職責、管理、自動檢查、職業安全衛生管理系統建置及其他相關事項之辦法，由中央主管機關定之。","note":"一、參考國際標準組織ISO 45001職業安全衛生管理系統標準、國際勞工組織（ILO）職業安全衛生管理系統指引及各先進國家作法，安全衛生組織、人員係事業單位內推動職場安全衛生管理之關鍵角色，且實務上雇主亦係透過設置安全衛生組織、人員，負責擬訂、規劃、推動及督導事業單位內安全衛生相關業務，逐步將職業安全衛生管理融入企業組織管理體系，爰第一項酌作文字修正，以符合實際。\n二、第二項酌作文字及標點符號修正。\n三、第三項立法意旨係為鼓勵事業單位積極推動職業安全衛生，落實自主管理，現行公開表揚有國家職業安全衛生獎、推行職業安全衛生優良單位及人員、優良工程金安獎等，並訂有相關要點據以實施，又考量符合評核要件無須再經績效認可，爰為第三項修正，以符合實際。\n四、鑑於事業單位內安全衛生管理之推動，實務上常有各級人員權責劃分不明確之爭，例如工地負責人與職業安全衛生管理人員職責不清，致對安全衛生管理事項之綜理、指揮、監督等職責互相推諉。查本法施行細則第三條及第三十四條規定，安全衛生管 理事項，為使各層級職業安全衛生職責明確化，共同推動職業安全衛生業務，爰增訂第四項規定。\n五、第四項移列為第五項，配合第四項之增訂修正所涉項次，並授權訂定上述相關人員之職責，以資明確。","review":{"note":"照行政院提案通過","text":"雇主應依其事業單位之規模、性質，設置安全衛生組織、人員；並訂定職業安全衛生管理計畫，實施安全衛生管理及自動檢查。\n前項之事業單位達一定規模或有第十五條第一項所定之工作場所者，應建置職業安全衛生管理系統。\n中央主管機關對前項職業安全衛生管理系統得實施訪查，其管理績效良好得公開表揚之。\n第一項及第二項所定安全衛生管理，應由雇主、雇主代理人或工作場所負責人綜理，並由事業單位各級主管依其職責指揮、監督所屬人員執行。\n前四項之事業單位規模、性質、安全衛生組織、人員、職責、管理、自動檢查、職業安全衛生管理系統建置及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第二十四條","current":"經中央主管機關指定具有危險性機械或設備之操作人員，雇主應僱用經中央主管機關認可之訓練或經技能檢定之合格人員充任之。","versions":[{"bill":"202110161460000","text":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。","note":"一、現行危險性機械僅限起重機、鍋爐等，但近年堆高機、高空工作車、推土機等事故增加，爰增列「其他特定機械」，並要求其操作人員須具認可訓練或技能檢定資格。\n二、增訂授權中央主管機關公告其他特定機械之種類及容量，以資明確。\n三、操作人員應具備相關知能並遵守安全衛生法規，如違規係因雇主指示，責任歸屬雇主，操作人員不予處罰。"},{"bill":"201110158300000","text":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。","note":"一、現行條文所定具有危險性機械或設備，係指本法第十六條第四項授權定之危險性機械及設備安全檢查規則所規範之固定式起重機、移動式起重機、鍋爐等機械或設備，惟近年來操作堆高機、高空工作車、推土機、平土機及鏟土機等其他非屬危險性之特定目的使用機械（以下簡稱其他特定機械）發生機械事故肇災之案件有增多之趨勢，為擴大該等機械之管理，爰將現行條文列為第一項並增列「其他特定機械」之操作人員，雇主亦應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之，並酌作文字修正。\n二、增訂第二項，授權中央主管機關公告第一項所定其他特定機械之種類及應具之容量，以資明確。\n三、為確保第一項之操作人員領有技術士技能檢定證照或已接受經認可之安全衛生教育訓練，具該等作業安全衛生相關知能，於操作該項所定機械或設備時，須負有防止造成他人傷害之義務，且操作人員應遵守第六條第一項、第二項及第三項授權訂定之安全衛生相關法規，例如起重升降機具安全規則、鍋爐及壓力容器安全規則、高壓氣體勞工安全規則、營造安全衛生設施標準及職業安全衛生設施規則等之規定，爰增訂第三項，定明該等操作人員作業時，應遵守修正條文第六條第一項、第二項及第三項授權訂定之各安全衛生設備與措施之標準及規則之規定。至如操作人員作業之錯誤、違反規定等係因受雇主指示者，屬雇主之責任，依修正條文第四十六條第三項不予處罰該操作人員，併予敘明。"},{"bill":"202110162130000","text":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。","note":"一、現行條文所定具有危險性機械或設備，係指本法第十六條第四項授權定之危險性機械及設備安全檢查規則所規範之固定式起重機、移動式起重機、鍋爐等機械或設備，惟近年來操作堆高機、高空工作車、推土機、平土機及鏟土機等其他非屬危險性之特定目的使用機械（以下簡稱其他特定機械）發生機械事故肇災之案件有增多之趨勢，為擴大該等機械之管理，爰將現行條文列為第一項並增列「其他特定機械」之操作人員，雇主亦應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之，並酌作文字修正。\n二、增訂第二項，授權中央主管機關公告第一項所定其他特定機械之種類及應具之容量，以資明確。\n三、為確保第一項之操作人員領有技術士技能檢定證照或已接受經認可之安全衛生教育訓練，具該等作業安全衛生相關知能，於操作該項所定機械或設備時，須負有防止造成他人傷害之義務，且操作人員應遵守第六條第一項、第二項及第三項授權訂定之安全衛生相關法規，例如起重升降機具安全規則、鍋爐及壓力容器安全規則、高壓氣體勞工安全規則、營造安全衛生設施標準及職業安全衛生設施規則等之規定，爰增訂第三項，定明該等操作人員作業時，應遵守修正條文第六條第一項、第二項及第三項授權訂定之各安全衛生設備與措施之標準及規則之規定。至如操作人員作業之錯誤、違反規定等係因受雇主指示者，屬雇主之責任，依修正條文第四十六條第三項不予處罰該操作人員，併予敘明。"},{"bill":"202110162770000","text":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。","note":"一、現行條文所定具有危險性機械或設備，係指本法第十六條第四項授權定之危險性機械及設備安全檢查規則所規範之固定式起重機、移動式起重機、鍋爐等機械或設備，惟近年來操作堆高機、高空工作車、推土機、平土機及鏟土機等其他非屬危險性之特定目的使用機械（以下簡稱其他特定機械）發生機械事故肇災之案件有增多之趨勢，為擴大該等機械之管理，爰將現行條文列為第一項並增列「其他特定機械」之操作人員，雇主亦應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之，並酌作文字修正。\n二、增訂第二項，授權中央主管機關公告第一項所定其他特定機械之種類及應具之容量，以資明確。\n三、為確保第一項之操作人員領有技術士技能檢定證照或已接受經認可之安全衛生教育訓練，具該等作業安全衛生相關知能，於操作該項所定機械或設備時，須負有防止造成他人傷害之義務，且操作人員應遵守第六條第一項、第二項及第三項授權訂定之安全衛生相關法規，例如起重升降機具安全規則、鍋爐及壓力容器安全規則、高壓氣體勞工安全規則、營造安全衛生設施標準及職業安全衛生設施規則等之規定，爰增訂第三項，定明該等操作人員作業時，應遵守修正條文第六條第一項、第二項及第三項授權訂定之各安全衛生設備與措施之標準及規則之規定。至如操作人員作業之錯誤、違反規定等係因受雇主指示者，屬雇主之責任，依修正條文第四十六條第三項不予處罰該操作人員，併予敘明。"},{"bill":"202110163600000","text":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。","note":"一、為預防職業災害，於第一項在危險機械外，另納入其他特定機械，以預防相關災害。\n二、增訂第二項，其他特定機械之種類、規則授權中央主管機關公告之。\n三、增訂第三項，第一項之操作人員有防止造成他人傷害之義務。"},{"bill":"202110165070000","text":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。","note":"一、現行條文所定具有危險性機械或設備，係指本法第十六條第四項授權定之危險性機械及設備安全檢查規則所規範之固定式起重機、移動式起重機、鍋爐等機械或設備，惟近年來操作堆高機、高空工作車、推土機、平土機及鏟土機等其他非屬危險性之特定目的使用機械（以下簡稱其他特定機械）發生機械事故肇災之案件有增多之趨勢，為擴大該等機械之管理，爰將現行條文列為第一項並增列「其他特定機械」之操作人員，雇主亦應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之，並酌作文字修正。\n二、增訂第二項，授權中央主管機關公告第一項所定其他特定機械之種類及應具之容量，以資明確 全衛生教育訓練，具該等作業安全衛生相關知能，於操作該項所定機械或設備時，須負有防止造成他人傷害之義務，且操作人員應遵守第六條第一項、第二項及第三項授權訂定之安全衛生相關法規，例如起重升降機具安全規則、鍋爐及壓力容器安全規則、高壓氣體勞工安全規則、營造安全衛生設施標準及職業安全衛生設施規則等之規定，爰增訂第三項，定明該等操作人員作業時，應遵守修正條文第六條第一項、第二項及第三項授權訂定之各安全衛生設備與措施之標準及規則之規定。至如操作人員作業之錯誤、違反規定等係因受雇主指示者，屬雇主之責任，依修正條文第四十六條第三項不予處罰該操作人員，併予敘明。"},{"bill":"202110166940000","text":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。","note":"一、現行條文所定具有危險性機械或設備，係指本法第十六條第四項授權定之危險性機械及設備安全檢查規則所規範之固定式起重機、移動式起重機、鍋爐等機械或設備，惟近年來操作堆高機、高空工作車、推土機、平土機及鏟土機等其他非屬危險性之特定目的使用機械（以下簡稱其他特定機械）發生機械事故肇災之案件有增多之趨勢，為擴大該等機械之管理，爰將現行條文列為第一項並增列「其他特定機械」之操作人員，雇主亦應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之，並酌作文字修正。\n二、增訂第二項，授權中央主管機關公告第一項所定其他特定機械之種類及應具之容量，以資明確。\n三、為確保第一項之操作人員領有技術士技能檢定證照或已接受經認可之安全衛生教育訓練，具該等作業安全衛生相關知能，於操作該項所定機械或設備時，須負有防止造成他人傷害之義務，且操作人員應遵守第六條第一項、第二項及第三項授權訂定之安全衛生相關法規，例如起重升降機具安全規則、鍋爐及壓力容器安全規則、高壓氣體勞工安全規則、營造安全衛生設施標準及職業安全衛生設施規則等之規定，爰增訂第三項，定明該等操作人員作業時，應遵守修正條文第六條第一項、第二項及第三項授權訂定之各安全衛生設備與措施之標準及規則之規定。至如操作人員作業之錯誤、違反規定等係因受雇主指示者，屬雇主之責任，依修正條文第四十六條第三項不予處罰該操作人員，併予敘明。"}],"changed":true,"final":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。","finalWhy":"一、現行條文所定具有危險性機械或設備，係指本法第十六條第四項授權定之危險性機械及設備安全檢查規則所規範之固定式起重機、移動式起重機、鍋爐等機械或設備，惟近年來操作堆高機、高空工作車、推土機、平土機及鏟土機等其他非屬危險性之特定目的使用機械(以下簡稱其他特定機械)發生機械事故肇災之案件有增多之趨勢，為擴大該等機械之管理，爰將原條文列為第一項並增列「其他特定機械」之操作人員，雇主亦應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之，並酌作文字修正。\n二、增訂第二項，授權中央主管機關公告第一項所定其他特定機械之種類及應具之容量，以資明確。\n三、為確保第一項之操作人員領有技術士技能檢定證照或已接受經認可之安全衛生教育訓練，具該等作業安全衛生相關知能，於操作該項所定機械或設備時，須負有防止造成他人傷害之義務，且操作人員應遵守第六條第一項、第二項及第三項授權訂定之安全衛生相關法規，例如起重升降機具安全規則、鍋爐及壓力容器安全規則、高壓氣體勞工安全規則、營造安全衛生設施標準及職業安全衛生設施規則等之規定，爰增訂第三項，定明該等操作人員作業時，應遵守第六條第一項、第二項及第三項授權訂定之各安全衛生設備與措施之標準及規則之規定。至如操作人員作業之錯誤、違反規定等係因受雇主指示者，屬雇主之責任，依修正條文第四十六條第三項不予處罰該操作人員，併予敘明。","review":{"note":"照行政院提案通過","text":"第十六條第一項所定具有危險性機械或設備，及其他特定機械之操作人員，雇主應僱用經中央主管機關認可之教育訓練或經技能檢定之合格人員充任之。\n前項其他特定機械之種類及應具之容量，由中央主管機關公告之。\n第一項操作人員作業時，應依第六條第一項、第二項及第三項授權訂定之安全衛生設備與措施之標準及規則執行職務。"}},{"no":"第二十六條","current":"事業單位以其事業之全部或一部分交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素暨本法及有關安全衛生規定應採取之措施。\n承攬人就其承攬之全部或一部分交付再承攬時，承攬人亦應依前項規定告知再承攬人。","versions":[{"bill":"202110109180000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素暨本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬之全部或部分再交付承攬時，亦應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知該人其場所、設備危害因素及安全衛生相關注意事項。","note":"一、補強再承攬職業身心安全衛生管理。\n二、新增事業單位將場所設備出租時，應善盡場所或設備操作安全規則，避免造成職業安全危害，善盡告知義務。"},{"bill":"202110119990000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素暨本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬之全部或部分再交付承攬時，亦應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知該人其場所、設備危害因素及安全衛生相關注意事項。","note":"新增事業單位將場所設備出租時，應善盡場所或設備操作安全規則，避免造成職業安全危害，善盡告知義務。"},{"bill":"202110134470000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、因現有工程層層轉包恐形成職安管理破口，無論事業單位以其事業之全部或一部分交付承攬，只要有交付承攬的動作，即應充分將工作環境、可能造成安全危害的因素以及本法相關的安衛措施進行告知。\n二、鑒於我國現行工程層層轉包情勢越加頻繁，為明確規範事業單位有將上述資訊傳達給各級承攬人之責任，爰修正第二項之規定。\n三、事業單位除應擔負將其場所、設備危害因素及安全衛生相關注意事項告知承攬人及再承攬人外，若其將工作場所或設備租借他人使用，亦須使設備、場所之承租人、使用人瞭解可能造成危害之因素。"},{"bill":"202110161460000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、刪除「全部或一部分交付承攬」文字，明定事業單位交付承攬時均應事前告知危害事項。\n二、為避免層層轉包造成責任落空，增列再承攬人及自營作業者交付再承攬時，亦負事前危害告知與防災責任。\n三、因出租或出借場所、設備肇災案例頻仍，增訂第三項，明定出租廠房屋頂、機械設備等單位應負危害告知責任，相關細節授權由施行細則規範。"},{"bill":"201110158300000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、第一項有關事業單位以其事業交付承攬時，不論是否屬其事業之全部或一部分交付承攬，該事業單位均應於事前告知承攬人相關事項，爰刪除相關文字，並酌作文字修正。\n二、依現行第二項規定，雖已規範承攬人負有危害告知責任，惟實務上多有層層轉包，出現再承攬人或自營作業者就其承攬部分交付再承攬之樣態，而現行第二項僅規定承攬人之事前危害告知責任，爰於第二項增列再承攬人為上開事前危害告知責任之主體，以資明確，並酌作文字修正。又近年自營作業者參與承攬後，將其承攬部分交付再承攬之樣態非常普遍，且常有自營作業者承攬後並未實際參與作業，而係將其承攬部分再交付他方完成，為促使是類自營作業者併負防災責任，爰於修正條文第五十一條第一項增列自營作業以其作業交付承攬時適用本條之規定，併予敘明。\n三、鑑於事業單位將其工作場所、設備出租或出借他人使用而肇災之案例時有所聞，例如太陽光電業者承租廠房屋頂設置發電設備，該出租廠房屋頂之事業單位未善盡事前危害告知責任，致他人從事相關屋頂作業時發生職業災害；又例如事業單位租用機械設備使用時，該出租機械設備之事業單位未能於事前善盡危害告知之責，致他人使用該機械設備時發生職業災害。為強化出租廠房屋頂或機械設備事業單位之事前危害告知責任，擴大防範他人使用工作場所等之作業危害風險，爰增訂第三項。該項所指之工作場所、設備屬例示規定，不以本條所定為限，例如建築物、機械、器具或車輛等；告知方式及內容等細節性、技術性事項，將於本法施行細則訂定。"},{"bill":"202110162130000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、第一項有關事業單位以其事業交付承攬時，不論是否屬其事業之全部或一部分交付承攬，該事業單位均應於事前告知承攬人相關事項，爰刪除相關文字，並酌作文字修正。\n二、依現行第二項規定，雖已規範承攬人負有危害告知責任，惟實務上多有層層轉包，出現再承攬人或自營作業者就其承攬部分交付再承攬之樣態，而現行第二項僅規定承攬人之事前危害告知責任，爰於第二項增列再承攬人為上開事前危害告知責任之主體，以資明確，並酌作文字修正。又近年自營作業者參與承攬後，將其承攬部分交付再承攬之樣態非常普遍，且常有自營作業者承攬後並未實際參與作業，而係將其承攬部分再交付他方完成，為促使是類自營作業者併負防災責任，爰於修正條文第五十一條第一項增列自營作業以其作業交付承攬時適用本條之規定，併予敘明。\n三、鑑於事業單位將其工作場所、設備出租或出借他人使用而肇災之案例時有所聞，例如太陽光電業者承租廠房屋頂設置發電設備，該出租廠房屋頂之事業單位未善盡事前危害告知責任，致他人從事相關屋頂作業時發生職業災害；又例如事業單位租用機械設備使用時，該出租機械設備之事業單位未能於事前善盡危害告知之責，致他人使用該機械設備時發生職業災害。為強化出租廠房屋頂或機械設備事業單位之事前危害告知責任，擴大防範他人使用工作場所等之作業危害風險，爰增訂第三項。該項所指之工作場所、設備屬例示規定，不以本條所定為限，例如建築物、機械、器具或車輛等；告知方式及內容等細節性、技術性事項，將於本法施行細則訂定。"},{"bill":"202110162770000","text":"事業單位以其事業交付承攬時，應於事前就交付承攬之事業實施風險評估，將有關工作環境、危害因素與應採取之安全衛生設備及措施等評估結果告知該承攬人，並於承攬期間使承攬人依評估結果確實執行。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、第一項有關事業單位以其事業交付承攬時，不論是否屬其事業之全部或一部分交付承攬，該事業單位均應於事前告知承攬人相關事項，爰刪除相關文字。另現行雖已規定事業單位負有告知承攬人危害責任，但實務運作多流於以制式表單填寫代替，欠缺風險評估機制，致使內容常與實際作業環境不符，難以發揮預防效果，於承攬人及再承攬人同時作業時，易因資訊傳遞不足與管理落差而導致事故。依第五條第一項規定，雇主應於合理可行範圍內採取必要之預防設備或措施，使勞工免於職業災害，而「合理可行」之作為即涵蓋事先風險評估與預防措施。是以，為明確事業單位之承攬管理責任，爰要求事業單位於交付承攬前應依事業特性實施風險評估，並將有關工作環境、危害因素及應採取之安全衛生設備及措施等評估結果確實告知承攬人，且於承攬期間持續督導與監督，以確保承攬人落實執行，藉以強化職災預防成效。至所稱風險評估，於第五條第二項業已定明，有關風險評估的操作方式及呈現形式，將於修正本法施行細則相關規定時，要求參照中央主管機關公告之相關指引辦理，包含說明加強協助小型、微型企業落實的方式，例如簡易評估表單等方式。\n二、依現行第二項規定，雖已規範承攬人負有危害告知責任，惟實務上多有層層轉包，出現再承攬人或自營作業者就其承攬部分交付再承攬之樣態，而現行第二項僅規定承攬人之事前危害告知責任，爰於第二項增列再承攬人為上開事前風險評估及危害告知等責任之主體，以資明確，並酌作文字修正。又近年自營作業者參與承攬後，將其承攬部分交付再承攬之樣態非常普遍，且常有自營作業者承攬後並未實際參與作業，而係將其承攬部分再交付他方完成，為促使是類自營作業者併負防災責任，爰於修正條文第五十一條第一項增列自營作業以其作業交付承攬時適用本條之規定，併予敘明。\n三、鑑於事業單位將其工作場所、設備出租或出借他人使用而肇災之案例時有所聞，例如太陽光電業者承租廠房屋頂設置發電設備，該出租廠房屋頂之事業單位未善盡事前危害告知責任，致他人從事相關屋頂作業時發生職業災害；又例如事業單位租用機械設備使用時，該出租機械設備之事業單位未能於事前善盡危害告知之責，致他人使用該機械設備時發生職業災害。為強化出租廠房屋頂或機械設備事業單位之事前危害告知責任，擴大防範他人使用工作場所等之作業危害風險，爰增訂第三項。該項所指之工作場所、設備屬例示規定，不以本條所定為限，例如建築物、機械、器具或車輛等；告知方式及內容等細節性、技術性事項，將於本法施行細則訂定。"},{"bill":"202110163600000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、酌修第一項之文字。\n二、於第二項將再承攬人納入規範。\n三、明定事業場所出借、出租工作場所、設備之風險告知義務。"},{"bill":"202110165070000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、第一項有關事業單位以其事業交付承攬時，不論是否屬其事業之全部或一部分交付承攬，該事業單位均應於事前告知承攬人相關事項，爰刪除相關文字，並酌作文字修正。\n二、依現行第二項規定，雖已規範承攬人負有危害告知責任，惟實務上多有層層轉包，出現再承攬人或自營作業者就其承攬部分交付再承攬之樣態，而現行第二項僅規定承攬人之事前危害告知責任，爰於第二項增列再承攬人為上開事前危害告知責任之主體，以資明確，並酌作文字修正。又近年自營作業者參與承攬後，將其承攬部分交付再承攬之樣態非常普遍，且常有自營作業者承攬後並未實際參與作業，而係將其承攬部分再交付他方完成，為促使是類自營作業者併負防災責任，爰於修正條文第五十一條第一項增列自營作業以其作業交付承攬時適用本條之規定，併予敘明。\n三、鑑於事業單位將其工作場所、設備出租或出借他人使用而肇災之案例時有所聞，例如太陽光電業者承租廠房屋頂設置發電設備，該出租廠房屋頂之事業單位未善盡事前危害告知責任，致他人從事相關屋頂作業時發生職業災害；又例如事業單位租用機械設備使用時，該出租機械設備之事業單位未能於事前善盡危害告知之責，致他人使用該機械設備時發生職業災害。為強化出租廠房屋頂或機械設備事業單位之事前危害告知責任，擴大防範他人使用工作場所等之作業危害風險，爰增訂第三項。該項所指之工作場所、設備屬例示規定，不以本條所定為限，例如建築物、機械、器具或車輛等；告知方式及內容等細節性、技術性事項，將於本法施行細則訂定。"},{"bill":"202110164370000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、第一項有關事業單位以其事業交付承攬時，不論是否屬其事業之全部或一部分交付承攬，該事業單位均應於事前告知承攬人相關事項，爰刪除相關文字，並酌作文字修正。\n二、依現行第二項規定，雖已規範承攬人負有危害告知責任，惟實務上多有層層轉包，出現再承攬人或自營作業者就其承攬部分交付再承攬之樣態，而現行第二項僅規定承攬人之事前危害告知責任，爰於第二項增列再承攬人為上開事前危害告知責任之主體，以資明確，並酌作文字修正。又近年自營作業者參與承攬後，將其承攬部分交付再承攬之樣態非常普遍，且常有自營作業者承攬後並未實際參與作業，而係將其承攬部分再交付他方完成，為促使是類自營作業者併負防災責任，爰於修正條文第五十一條第一項增列自營作業以其作業交付承攬時適用本條之規定，併予敘明。\n三、鑑於事業單位將其工作場所、設備出租或出借他人使用而肇災之案例時有所聞，例如太陽光電業者承租廠房屋頂設置發電設備，該出租廠房屋頂之事業單位未善盡事前危害告知責任，致他人從事相關屋頂作業時發生職業災害；又例如事業單位租用機械設備使用時，該出租機械設備之事業單位未能於事前善盡危害告知之責，致他人使用該機械設備時發生職業災害。為強化出租廠房屋頂或機械設備事業單位之事前危害告知責任，擴大防範他人使用工作場所等之作業危害風險，爰增訂第三項。該項所指之工作場所、設備屬例示規定，不以本條所定為限，例如建築物、機械、器具或車輛等；告知方式及內容等細節性、技術性事項，將於本法施行細則訂定。"},{"bill":"202110164930000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、修正第一項，刪除「全部或一部分交付承攬」文字，明定事業單位交付承攬時均應事前告知危害事項。\n二、修正第二項，為避免層層轉包造成責任落空，增列再承攬人及自營作業者交付再承攬時，亦負事前危害告知與防災責任。\n三、增訂第三項，明定出租廠房屋頂、機械設備等單位應負危害告知責任，相關細節授權由施行細則規範。"},{"bill":"202110166930000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、第一項有關事業單位以其事業交付承攬時，不論是否屬其事業之全部或一部分交付承攬，該事業單位均應於事前告知承攬人相關事項，爰刪除相關文字，並酌作文字修正。\n二、依現行第二項規定，雖已規範承攬人負有危害告知責任，惟實務上多有層層轉包，出現再承攬人或自營作業者就其承攬部分交付再承攬之樣態，而現行第二項僅規定承攬人之事前危害告知責任，爰於第二項增列再承攬人為上開事前危害告知責任之主體，以資明確，並酌作文字修正。又近年自營作業者參與承攬後，將其承攬部分交付再承攬之樣態非常普遍，且常有自營作業者承攬後並未實際參與作業，而係將其承攬部分再交付他方完成，為促使是類自營作業者併負防災責任，爰於修正條文第五十一條第一項增列自營作業以其作業交付承攬時適用本條之規定，併予敘明。\n三、鑑於事業單位將其工作場所、設備出租或出借他人使用而肇災之案例時有所聞，例如太陽光電業者承租廠房屋頂設置發電設備，該出租廠房屋頂之事業單位未善盡事前危害告知責任，致他人從事相關屋頂作業時發生職業災害；又例如事業單位租用機械設備使用時，該出租機械設備之事業單位未能於事前善盡危害告知之責，致他人使用該機械設備時發生職業災害。為強化出租廠房屋頂或機械設備事業單位之事前危害告知責任，擴大防範他人使用工作場所等之作業危害風險，爰增訂第三項。該項所指之工作場所、設備屬例示規定，不以本條所定為限，例如建築物、機械、器具或車輛等；告知方式及內容等細節性、技術性事項，將於本法施行細則訂定。"},{"bill":"202110166940000","text":"事業單位以其事業交付承攬時，應於事前告知該承攬人有關其事業工作環境、危害因素與本法及有關安全衛生規定應採取之措施。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","note":"一、第一項有關事業單位以其事業交付承攬時，不論是否屬其事業之全部或一部分交付承攬，該事業單位均應於事前告知承攬人相關事項，爰刪除相關文字，並酌作文字修正。\n二、依現行第二項規定，雖已規範承攬人負有危害告知責任，惟實務上多有層層轉包，出現再承攬人或自營作業者就其承攬部分交付再承攬之樣態，而現行第二項僅規定承攬人之事前危害告知責任，爰於第二項增列再承攬人為上開事前危害告知責任之主體，以資明確，並酌作文字修正。又近年自營作業者參與承攬後，將其承攬部分交付再承攬之樣態非常普遍，且常有自營作業者承攬後並未實際參與作業，而係將其承攬部分再交付他方完成，為促使是類自營作業者併負防災責任，爰於修正條文第五十一條第一項增列自營作業以其作業交付承攬時適用本條之規定，併予敘明。\n三、鑑於事業單位將其工作場所、設備出租或出借他人使用而肇災之案例時有所聞，例如太陽光電業者承租廠房屋頂設置發電設備，該出租廠房屋頂之事業單位未善盡事前危害告知責任，致他人從事相關屋頂作業時發生職業災害；又例如事業單位租用機械設備使用時，該出租機械設備之事業單位未能於事前善盡危害告知之責，致他人使用該機械設備時發生職業災害。為強化出租廠房屋頂或機械設備事業單位之事前危害告知責任，擴大防範他人使用工作場所等之作業危害風險，爰增訂第三項。該項所指之工作場所、設備屬例示規定，不以本條所定為限，例如建築物、機械、器具或車輛等；告知方式及內容等細節性、技術性事項，將於本法施行細則訂定。"}],"changed":true,"final":"事業單位以其事業交付承攬時，應於事前就交付承攬之事業實施風險評估，將有關工作環境、危害因素與應採取之安全衛生設備及措施等評估結果告知該承攬人，並於承攬期間使承攬人依評估結果確實執行。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。","finalWhy":"一、第一項有關事業單位以其事業交付承攬時，不論是否屬其事業之全部或一部分交付承攬，該事業單位均應於事前告知承攬人相關事項，爰刪除相關文字。另現行雖已規定事業單位負有告知承攬人危害責任，但實務運作多流於以制式表單填寫代替，欠缺風險評估機制，致使內容常與實際作業環境不符，難以發揮預防效果，於承攬人及再承攬人同時作業時，易因資訊傳遞不足與管理落差而導致事故。依第五條第一項規定，雇主應於合理可行範圍內採取必要之預防設備或措施，使勞工免於職業災害，而「合理可行」之作為即涵蓋事先風險評估與預防措施。是以，為明確事業單位之承攬管理責任，爰要求事業單位於交付承攬前應依事業特性實施風險評估，並將有關工作環境、危害因素及應採取之安全衛生設備及措施等評估結果確實告知承攬人，且於承攬期間持續督導與監督，以確保承攬人落實執行，藉以強化職災預防成效。至所稱風險評估，於第五條第二項業已定明，有關風險評估的操作方式及呈現形式，將於修正本法施行細則相關規定時，要求參照中央主管機關公告之相關指引辦理，包含協助小型、微型企業落實風險評估之方式，例如提供簡易評估表單等方式。\n二、依原第二項規定，雖已規範承攬人負有危害告知責任，惟實務上多有層層轉包，出現再承攬人或自營作業者就其承攬部分交付再承攬之樣態，而原第二項僅規定承攬人之事前危害告知責任，爰於第二項增列再承攬人為上開事前風險評估及危害告知等責任之主體，以資明確，並酌作文字修正。又近年自營作業者參與承攬後，將其承攬部分交付再承攬之樣態非常普遍，且常有自營作業者承攬後並未實際參與作業，而係將其承攬部分再交付他方完成，為促使是類自營作業者併負防災責任，爰於修正條文第五十一條第一項增列自營作業者以其作業交付承攬時適用本條之規定，併予敘明。\n三、鑑於事業單位將其工作場所、設備出租或出借他人使用而肇災之案例時有所聞，例如太陽光電業者承租廠房屋頂設置發電設備，該出租廠房屋頂之事業單位未善盡事前危害告知責任，致他人從事相關屋頂作業時發生職業災害；又例如事業單位租用機械設備使用時，該出租機械設備之事業單位未能於事前善盡危害告知之責，致他人使用該機械設備時發生職業災害。為強化出租廠房屋頂或機械設備事業單位之事前危害告知責任，擴大防範他人使用工作場所等之作業危害風險，爰增訂第三項。該項所指之工作場所、設備屬例示規定，不以本條所定為限，例如建築物、機械、器具或車輛等；告知方式及內容等細節性、技術性事項，將於本法施行細則訂定。","review":{"note":"照委員王正旭等23人提案通過","text":"事業單位以其事業交付承攬時，應於事前就交付承攬之事業實施風險評估，將有關工作環境、危害因素與應採取之安全衛生設備及措施等評估結果告知該承攬人，並於承攬期間使承攬人依評估結果確實執行。\n承攬人、再承攬人就其承攬部分交付再承攬時，應依前項規定辦理。\n事業單位將其工作場所、設備出租或出借他人使用時，應於事前告知其場所、設備危害因素及安全衛生相關注意事項。"}},{"no":"第二十七條","current":"事業單位與承攬人、再承攬人分別僱用勞工共同作業時，為防止職業災害，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫與調整。\n三、工作場所之巡視。\n四、相關承攬事業間之安全衛生教育之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。","versions":[{"bill":"202110109180000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，為防止職業災害，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫與調整。\n三、工作場所之巡視。\n四、相關承攬人及承攬事業間之安全衛生教育訓練之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分再交付承攬時，亦應依第一項第二款至第五款規定辦理。\n承攬人、再承攬人對於第一項原事業單位採取之承攬管理措施有配合辦理之義務。","note":"一、為補足再承攬管理，進行文字修正，改「分別僱用勞工」修正為「工作者」，現行事業單位與承攬人、再承攬人是否共同作業之認定，受限於是否分別僱有勞工於該場域，實務上有部分承攬人係自營作業並未僱用勞工，間接導致原事業單位承攬管理未能落實至各級承攬，為補足各級承攬人之保障，強化原事業單位之安全衛生管理責任及效能。\n二、強化承攬人、再承攬人職業安全衛生管理責任，並要求承攬人、再承攬人應配合原事業單位之規定，提升各級承攬人職安衛知能及落實防災責任。"},{"bill":"202110119990000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，為防止職業災害，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫與調整。\n三、工作場所之巡視。\n四、相關承攬人及承攬事業間之安全衛生教育訓練之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分再交付承攬時，亦應依第一項第二款至第五款規定辦理。\n承攬人、再承攬人對於第一項原事業單位採取之承攬管理措施有配合辦理之義務。","note":"一、強化原事業單位之安全衛生管理責任及效能。\n二、強化承攬人、再承攬人職業安全衛生管理責任，並要求承攬人、再承攬人應配合原事業單位之規定，提升各級承攬人職安衛知能及落實防災責任。"},{"bill":"202110134470000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第五款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。","note":"一、因實務上有出現承攬人與再承攬人即為自營工作者，未必有雇用勞工的情形，因此修正文字。\n二、為避免承攬人於承攬工作後旋即交由再承攬人承包，從中賺取利潤的同時卻未盡管理安全職則。爰要求其參與第一項與第二項防災作業。\n三、修正第一項第二款及第四款文字。\n四、除原先即有規定事業單位應辦理承攬管理事項外，新增第四項規定，要求承攬人與再承攬人有義務配合事業單位，以強化承攬人與再承攬人職災預防責任。"},{"bill":"202110161460000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第五款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。","note":"一、將「分別僱用勞工」修正為「工作者」，以落實各級承攬人之職災防止責任，強化原事業單位管理效能。\n二、第二項維持不修正。\n三、增訂第三項，明定承攬人、再承攬人再轉包時，須辦理工作連繫、巡視、教育訓練及其他必要防災事項，以避免責任落空。\n四、增訂第四項，要求承攬人、再承攬人須配合原事業單位辦理之安全衛生管理事項，以提升知能並落實責任。\n五、增訂自營作業者納入規範，參與協議組織、接受指揮監督及教育訓練等防災措施，強化自營作業者之責任。"},{"bill":"201110158300000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第五款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。","note":"一、現行事業單位與承攬人、再承攬人是否共同作業之認定，係以是否分別僱用勞工於該場域從事工作，實務上有部分承攬人係自營作業並未僱用勞工，致原事業單位承攬管理未能落實至各級承攬，為補足各級承攬人之職業災害防止責任，強化原事業單位之安全衛生管理責任及效能，爰將第一項「分別僱用勞工」修正為「工作者」，並酌作文字修正。\n二、第二項未修正。\n三、鑑於實務上承攬關係多有層層轉包，惟現行僅於第二十六條第二項規定承攬人就其承攬之全部或一部分交付再承攬時，應於事前辦理危害告知，且常見部分承攬人承攬工作項目後隨即轉包，由其他廠商代為履行，該承攬人從中獲取經濟利益卻未善盡職業安全衛生管理責任，爰增訂第三項，定明承攬人、再承攬人就其承攬部分交付再承攬時，亦應辦理工作連繫與調整、工作場所巡視、指導與協助相關承攬人安全衛生教育訓練及其他為防止職業災害之必要事項。\n四、考量承攬人、再承攬人之職業安全衛生素質不一，現行第一項規定僅要求原事業單位應辦理承攬安全衛生管理事項，未規定承攬人、再承攬人應配合原事業單位所辦理之上開事項，為有效提升各級承攬人職業安全衛生之知能及落實防災責任，爰增訂第四項。\n五、另為加強自營作業者防災責任，自營作業者參與共同作業，應配合原事業單位之承攬安全衛生管理，例如參與協議組織，接受指揮、監督及協調，或接受安全衛生教育訓練之指導及協助等防災作為，爰於修正條文第五十一條第一項增訂自營作業者獨立作業或以其作業交付承攬時，適用本條之規定，併予敘明。"},{"bill":"202110162130000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第五款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。","note":"一、現行事業單位與承攬人、再承攬人是否共同作業之認定，係以是否分別僱用勞工於該場域從事工作，實務上有部分承攬人係自營作業並未僱用勞工，致原事業單位承攬管理未能落實至各級承攬，為補足各級承攬人之職業災害防止責任，強化原事業單位之安全衛生管理責任及效能，爰將第一項「分別僱用勞工」修正為「工作者」，並酌作文字修正。\n二、第二項未修正。\n三、鑑於實務上承攬關係多有層層轉包，惟現行僅於第二十六條第二項規定承攬人就其承攬之全部或一部分交付再承攬時，應於事前辦理危害告知，且常見部分承攬人承攬工作項目後隨即轉包，由其他廠商代為履行，該承攬人從中獲取經濟利益卻未善盡職業安全衛生管理責任，爰增訂第三項，定明承攬人、再承攬人就其承攬部分交付再承攬時，亦應辦理工作連繫與調整、工作場所巡視、指導與協助相關承攬人安全衛生教育訓練及其他為防止職業災害之必要事項。\n四、考量承攬人、再承攬人之職業安全衛生素質不一，現行第一項規定僅要求原事業單位應辦理承攬安全衛生管理事項，未規定承攬人、再承攬人應配合原事業單位所辦理之上開事項，為有效提升各級承攬人職業安全衛生之知能及落實防災責任，爰增訂第四項。\n五、另為加強自營作業者防災責任，自營作業者參與共同作業，應配合原事業單位之承攬安全衛生管理，例如參與協議組織，接受指揮、監督及協調，或接受安全衛生教育訓練之指導及協助等防災作為，爰於修正條文第五十一條第一項增訂自營作業者獨立作業或以其作業交付承攬時，適用本條之規定，併予敘明。"},{"bill":"202110162770000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、機械、設備、器具及人員之進場管制。\n六、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第六款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。","note":"一、修正第一項：\n(一)現行事業單位與承攬人、再承攬人是否共同作業之認定，係以是否分別僱用勞工於該場域從事工作，實務上有部分承攬人係自營作業並未僱用勞工，致原事業單位承攬管理未能落實至各級承攬，為補足各級承攬人之職業災害防止責任，強化原事業單位之安全衛生管理責任及效能，爰將序文「分別僱用勞工」修正為「工作者」。\n(二)第二款及第四款酌作文字修正；第三款未修正。\n(三)新增第五款，考量營造工程交付承攬日益複雜，原事業單位對於工地施工安全管理往往疏於控管，常見承攬人或再承攬人為節省施工成本或追求操作便利，擅自使用未經檢查、不符合法規或老舊之機械、設備及器具，嚴重危害勞工作業安全。此外，亦有工地之承攬人或再承攬人，僱用未完成法定安全衛生教育訓練之勞工，或未經許可之外國人，因對施工安全缺乏基本認知而肇災。為強化原事業單位之管理責任，督促其確實掌握施工現場機械、設備、器具及人員之進出狀況，爰將本法施行細則第三十八條第五款及第六款有關協議進場管制事項之規定，整併移列至第五款，提升規範位階；另為維護工作場所安全，並擴大管制進場之對象包括所有人員，而不限作業人員，以要求原事業單位建立及落實工地門禁管制機制，有效防範風險、減少災害發生。原第五款遞移至第六款。\n二、第二項未修正。\n三、鑑於實務上承攬關係多有層層轉包，惟現行僅於第二十六條第二項規定承攬人就其承攬之全部或一部分交付再承攬時，應於事前辦理風險評估、危害告知，並確保再承攬人確實依評估結果執行，且常見部分承攬人承攬工作項目後隨即轉包，由其他廠商代為履行，該承攬人從中獲取經濟利益卻未善盡職業安全衛生管理責任，爰增訂第三項，定明承攬人、再承攬人就其承攬部分交付再承攬時，亦應辦理工作連繫與調整、工作場所巡視、指導與協助相關承攬人安全衛生教育訓練、有關機械、設備、器具與人員之進場管制，及其他為防止職業災害之必要事項。\n四、考量承攬人、再承攬人之職業安全衛生素質不一，現行第一項規定僅要求原事業單位應辦理承攬安全衛生管理事項，未規定承攬人、再承攬人應配合原事業單位所辦理之上開事項，為有效提升各級承攬人職業安全衛生之知能及落實防災責任，爰增訂第四項。\n五、另為加強自營作業者防災責任，自營作業者參與共同作業，應配合原事業單位之承攬安全衛生管理，例如參與協議組織，接受指揮、監督及協調，或接受安全衛生教育訓練之指導及協助等防災作為，爰於修正條文第五十一條第一項增訂自營作業者獨立作業或以其作業交付承攬時，適用本條之規定，併予敘明。"},{"bill":"202110163600000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第五款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。","note":"一、為求精確並符合工作現場實務，酌修第一項之文字。\n二、於第三項、第四項強化再承攬人之職業安全衛生責任。"},{"bill":"202110165070000","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第五款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。","note":"一、現行事業單位與承攬人、再承攬人是否共同作業之 之全部或一部分交付再承攬時，應於事前辦理危害告知，且常見部分承攬人承攬工作項目後隨即轉包，由其他廠商代為履行，該承攬人從中獲取經濟利益卻未善盡職業安全衛生管理責任，爰增訂第三項，定明承攬人、再承攬人就其承攬部分交付再承攬時，亦應辦理工作連繫與調整、工作場所巡視、指導與協助相關承攬人安全衛生教育訓練及其他為防止職業災害之必要事項。\n四、考量承攬人、再承攬人之職業安全衛生素質不一，現行第一項規定僅要求原事業單位應辦理承攬安全衛生管理事項，未規定承攬人、再承攬人應配合原事業單位所辦理之上開事項，為有效提升各級承攬人職業安全衛生之知能及落實防災責任，爰增訂第四項。\n五、另為加強自營作業者防災責任，自營作業者參與共同作業，應配合原事業單位之承攬安全衛生管理，例如參與協議組織，接受指揮、監督及協調，或接受安全衛生教育訓練之指導及協助等防災作為，爰於修正條文第五十一條第一項增訂自營作業者獨立作業或以其作業交付承攬時，適用本條之規定，併予敘明。"}],"changed":true,"final":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、機械、設備、器具及人員之進場管制。\n六、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第六款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。","finalWhy":"一、修正第一項：\n(一)現行事業單位與承攬人、再承攬人是否共同作業之認定，係以是否分別僱用勞工於該場域從事工作，實務上有部分承攬人係自營作業並未僱用勞工，致原事業單位承攬管理未能落實至各級承攬，為補足各級承攬人之職業災害防止責任，強化原事業單位之安全衛生管理責任及效能，爰將序文「分別僱用勞工」修正為「工作者」。\n(二)第二款及第四款酌作文字修正；第一款及第三款未修正。\n(三)新增第五款，考量營造工程交付承攬日益複雜，原事業單位對於工地施工安全管理往往疏於控管，常見承攬人或再承攬人為節省施工成本或追求操作便利，擅自使用未經檢查、不符合法規或老舊之機械、設備及器具，嚴重危害勞工作業安全。此外，亦有工地之承攬人或再承攬人，僱用未完成法定安全衛生教育訓練之勞工，或未經許可之外國人，因對施工安全缺乏基本認知而肇災。為強化原事業單位之管理責任，督促其確實掌握施工現場機械、設備、器具及人員之進出狀況，爰將本法施行細則第三十八條第五款及第六款有關協議進場管制事項之規定，整併移列至第五款，提升規範位階；另為維護工作場所安全，並擴大管制進場之對象包括所有人員，而不限作業人員，以要求原事業單位建立及落實工地門禁管制機制，有效防範風險、減少災害發生。原第五款遞移至第六款。\n二、第二項未修正。\n三、鑑於實務上承攬關係多有層層轉包，雖於第二十六條第二項規定承攬人、再承攬人就其承攬部分交付再承攬時，應於事前辦理風險評估、危害告知，惟常見部分承攬人、再承攬人於承攬工作項目後隨即轉包，由其他廠商代為履行，該承攬人從中獲取經濟利益卻未善盡職業安全衛生管理責任，爰增訂第三項，定明承攬人、再承攬人就其承攬部分交付再承攬時，亦應辦理工作連繫與調整、工作場所巡視、指導與協助相關承攬人安全衛生教育訓練、有關機械、設備、器具與人員之進場管制，及其他為防止職業災害之必要事項。\n四、考量承攬人、再承攬人之職業安全衛生素質不一，原第一項規定僅要求原事業單位應辦理承攬安全衛生管理事項，未規定承攬人、再承攬人應配合原事業單位所辦理之上開事項，為有效提升各級承攬人職業安全衛生之知能及落實防災責任，爰增訂第四項。\n五、另為加強自營作業者防災責任，自營作業者參與共同作業，應配合原事業單位之承攬安全衛生管理，例如參與協議組織，接受指揮、監督及協調，或接受安全衛生教育訓練之指導及協助、進場管制等防災作為，爰於修正條文第五十一條第一項增訂自營作業者獨立作業或以其作業交付承攬時，適用本條之規定，併予敘明。","review":{"note":"照委員王正旭等23人提案通過","text":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，原事業單位應採取下列必要措施：\n一、設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作。\n二、工作之連繫及調整。\n三、工作場所之巡視。\n四、相關承攬人安全衛生教育訓練之指導及協助。\n五、機械、設備、器具及人員之進場管制。\n六、其他為防止職業災害之必要事項。\n事業單位分別交付二個以上承攬人共同作業而未參與共同作業時，應指定承攬人之一負前項原事業單位之責任。\n承攬人、再承攬人就其承攬部分交付再承攬時，亦應依第一項第二款至第六款規定辦理。\n承攬人、再承攬人應配合辦理第一項所定原事業單位採取之必要措施。"}},{"no":"第二十七條之一","current":null,"versions":[{"bill":"202110161460000","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、增訂第一項：建築工程常由多個平行承攬人施工，因缺乏統合管理，易致職災。參考日本《勞動安全衛生法》及英國《工程設計及管理規則》，規定業主於一定規模以上工程交付二個以上施工者時，應指定其中一人負整體工程安全衛生統合管理責任。\n三、增訂第二項：被指定之施工者應執行統合管理事項，其所需管理費用由業主於規劃設計階段編列。\n四、增訂第三項：授權中央主管機關訂定施工者指定、統合管理內容及相關辦法，以利規範執行。"},{"bill":"201110158300000","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、增訂第一項：\n(一)目前實務上，例如建築工程業主常將建築物以分項工程方式，平行發包予土建、機電及空調工程等平行承攬人，鑑於承攬人原各已建置其安全衛生承攬管理體系，惟欠缺統合，使工作者面臨職業災害風險。\n(二)查日本「勞動安全衛生法（労働安全衛生法）」第三十條規定，工程業主將工程交付二個以上施工者於同一地點施工時，為統合各施工者之工法兼容性、施工順序及結構設備等介面問題，避免因介面衝突引起職業災害，定明發包之事業單位應指定一主要承攬人負責統合安全衛生管理之責任；另英國「工程（設計及管理）規則（The Construction〔Design and Management〕Regulations 2015）」第五條規定，工程業主於超過一個承攬人，或可合理預見任一階段有超過一個承攬人參與工程時，即應任命其中一承攬人負統合安全衛生管理之責任。\n(三)第二十七條雖規定原事業單位之承攬安全衛生管理責任，惟工作場所如有多個平行承攬之原事業單位時，現行僅能藉由契約約定統合管理責任，缺乏法律強制性，爰參考日本及英國上述規定，於第一項定明事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任，以規劃、連繫及協調整體工程之安全衛生管理事宜，防止職業災害發生。\n三、第二項定明經依第一項規定指定之施工者，應執行整體工程安全衛生統合管理事項。被指定為統合管理責任者所需之管理人員費用，第一項事業單位（即工程業主）應於規劃、設計階段妥適編列之，併予敘明。\n四、為使事業單位明瞭第一項及第二項相關規定之執行方式與整體工程安全衛生統合管理工作，包括被指定負整體工程安全衛生統合管理責任之施工者及未被指定者應辦理事項，爰於第三項定明施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110162130000","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、增訂第一項：\n(一)目前實務上，例如建築工程業主常將建築物以分項工程方式，平行發包予土建、機電及空調工程等平行承攬人，鑑於承攬人原各已建置其安全衛生承攬管理體系，惟欠缺統合，使工作者面臨職業災害風險。\n(二)查日本「勞動安全衛生法（労働安全衛生法）」第三十條規定，工程業主將工程交付二個以上施工者於同一地點施工時，為統合各施工者之工法兼容性、施工順序及結構設備等介面問題，避免因介面衝突引起職業災害，定明發包之事業單位應指定一主要承攬人負責統合安全衛生管理之責任；另英國「工程（設計及管理）規則（The Construction 〔Design and Management〕Regulations 2015）」第五條規定，工程業主於超過一個承攬人，或可合理預見任一階段有超過一個承攬人參與工程時，即應任命其中一承攬人負統合安全衛生管理之責任。\n(三)第二十七條雖規定原事業單位之承攬安全衛生管理責任，惟工作場所如有多個平行承攬之原事業單位時，現行僅能藉由契約約定統合管理責任，缺乏法律強制性，爰參考日本及英國上述規定，於第一項定明事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任，以規劃、連繫及協調整體工程之安全衛生管理事宜，防止職業災害發生。\n三、第二項定明經依第一項規定指定之施工者，應執行整體工程安全衛生統合管理事項。被指定為統合管理責任者所需之管理人員費用，第一項事業單位（即工程業主）應於規劃、設計階段妥適編列之，併予敘明。\n四、為使事業單位明瞭第一項及第二項相關規定之執行方式與整體工程安全衛生統合管理工作，包括被指定負整體工程安全衛生統合管理責任之施工者及未被指定者應辦理事項，爰於第三項定明施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110162770000","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、增訂第一項：\n(一)目前實務上，例如建築工程業主常將建築物以分項工程方式，平行發包予土建、機電及空調工程等平行承攬人，鑑於承攬人原各已建置其安全衛生承攬管理體系，惟欠缺統合，使工作者面臨職業災害風險。\n(二)查日本「勞動安全衛生法（労働安全衛生法）」第三十條規定，工程業主將工程交付二個以上施工者於同一地點施工時，為統合各施工者之工法兼容性、施工順序及結構設備等介面問題，避免因介面衝突引起職業災害，定明發包之事業單位應指定一主要承攬人負責統合安全衛生管理之責任；另英國「工程（設計及管理）規則（The Construction〔Design and Management〕Regulations 2015）」第五條規定，工程業主於超過一個承攬人，或可合理預見任一階段有超過一個承攬人參與工程時，即應任命其中一承攬人負統合安全衛生管理之責任。\n(三)第二十七條雖規定原事業單位之承攬安全衛生管理責任，惟工作場所如有多個平行承攬之原事業單位時，現行僅能藉由契約約定統合管理責任，缺乏法律強制性，爰參考日本及英國上述規定，於第一項定明事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任，以規劃、連繫及協調整體工程之安全衛生管理事宜，防止職業災害發生。\n三、第二項定明經依第一項規定指定之施工者，應執行整體工程安全衛生統合管理事項。被指定為統合管理責任者所需之管理人員費用，第一項事業單位（即工程業主）應於規劃、設計階段妥適編列之，併予敘明。\n四、為使事業單位明瞭第一項及第二項相關規定之執行方式與整體工程安全衛生統合管理工作，包括被指定負整體工程安全衛生統合管理責任之施工者及未被指定者應辦理事項，爰於第三項定明施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110163600000","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、增訂第一項及第二項，以利明確化同一工程有兩個以上施工者施工時之安全衛生責任。\n三、於第三項明定，主管機關應訂定統合管理之相關辦法。"},{"bill":"202110165070000","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、增訂第一項：\n(一)目前實務上，例如建築工程業主常將建築物以分項工程方式，平行發包予土建、機電及空調工程等平行承攬人，鑑於承攬人原各已建置其安全衛生承攬管理體系，惟欠缺統合，使工作者面臨職業災害風險。\n(二)查日本「勞動安全衛生法（労働安全衛生法）」第三十條規定，工程業主將工程交付二個以上施工者於同一地點施工時，為統合各施工者之工法兼容性、施工順序及結構設備等介面問題，避免因介面衝突引起職業災害，定明發包之事業單位應指定一主要承攬人負責統合安全衛生管理之責任；另英國「工程（設計及管理）規則（The Construction 〔Design and Management〕Regulations 2015）」第五條規定，工程業主於超過一個承攬人，或可合理預見任一階段有超過一個承攬人參與工程時，即應任命其中一承攬人負統合安全衛生管理之責任。\n(三)第二十七條雖規定原事業單位之承攬安全衛生管理責任，惟工作場所如有多個平行承攬之原事業單位時，現行僅能藉由契約約定統合管理責任，缺乏法律強制性，爰參考日本及英國上述規定，於第一項定明事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任，以規劃、連繫及協調整體工程之安全衛生管理事宜，防止職業災害發生。\n三、第二項定明經依第一項規定指定之施工者，應執行整體工程安全衛生統合管理事項。被指定為統合管理責任者所需之管理人員費用，第一項事業單位（即工程業主）應於規劃、設計階段妥適編列之，併予敘明。\n四、為使事業單位明瞭第一項及第二項相關規定之執行方式與整體工程安全衛生統合管理工作，包括被指定負整體工程安全衛生統合管理責任之施工者及未被指定者應辦理事項，爰於第三項定明施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110164370000","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、增訂第一項：\n(一)目前實務上，例如建築工程業主常將建築物以分項工程方式，平行發包予土建、機電及空調工程等平行承攬人，鑑於承攬人原各已建置其安全衛生承攬管理體系，惟欠缺統合，使工作者面臨職業災害風險。\n(二)查日本「勞動安全衛生法（労働安全衛生法）」第三十條規定，工程業主將工程交付二個以上施工者於同一地點施工時，為統合各施工者之工法兼容性、施工順序及結構設備等介面問題，避免因介面衝突引起職業災害，定明發包之事業單位應指定一主要承攬人負責統合安全衛生管理之責任；另英國「工程（設計及管理）規則（The Construction〔Design and Management〕Regulations 2015）」第五條規定，工程業主於超過一個承攬人，或可合理預見任一階段有超過一個承攬人參與工程時，即應任命其中一承攬人負統合安全衛生管理之責任。\n(三)第二十七條雖規定原事業單位之承攬安全衛生管理責任，惟工作場所如有多個平行承攬之原事業單位時，現行僅能藉由契約約定統合管理責任，缺乏法律強制性，爰參考日本及英國上述規定，於第一項定明事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任，以規劃、連繫及協調整體工程之安全衛生管理事宜，防止職業災害發生。\n三、第二項定明經依第一項規定指定之施工者，應執行整體工程安全衛生統合管理事項。被指定為統合管理責任者所需之管理人員費用，第一項事業單位（即工程業主）應於規劃、設計階段妥適編列之，併予敘明。\n四、為使事業單位明瞭第一項及第二項相關規定之執行方式與整體工程安全衛生統合管理工作，包括被指定負整體工程安全衛生統合管理責任之施工者及未被指定者應辦理事項，爰於第三項定明施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110164930000","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、增訂第一項：\n(一)目前實務上，例如 電及空調工程等平行承攬人，鑑於承攬人原各已建置其安全衛生承攬管理體系，惟欠缺統合，使工作者面臨職業災害風險。\n(二)查日本「勞動安全衛生法（労働安全衛生法）」第三十條規定，工程業主將工程交付二個以上施工者於同一地點施工時，為統合各施工者之工法兼容性、施工順序及結構設備等介面問題，避免因介面衝突引起職業災害，定明發包之事業單位應指定一主要承攬人負責統合安全衛生管理之責任；另英國「工程（設計及管理）規則（The Construction〔Design and Management〕Regulations 2015）」第五條規定，工程業主於超過一個承攬人，或可合理預見任一階段有超過一個承攬人參與工程時，即應任命其中一承攬人負統合安全衛生管理之責任。\n(三)第二十七條雖規定原事業單位之承攬安全衛生管理責任，惟工作場所如有多個平行承攬之原事業單位時，現行僅能藉由契約約定統合管理責任，缺乏法律強制性，爰參考日本及英國上述規定，於第一項定明事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任，以規劃、連繫及協調整體工程之安全衛生管理事宜，防止職業災害發生。\n三、第二項定明經依第一項規定指定之施工者，應執行整體工程安全衛生統合管理事項。被指定為統合管理責任者所需之管理人員費用，第一項事業單位（即工程業主）應於規劃、設計階段妥適編列之，併予敘明。\n四、為使事業單位明瞭第一項及第二項相關規定之執行方式與整體工程安全衛生統合管理工作，包括被指定負整體工程安全衛生統合管理責任之施工者及未被指定者應辦理事項，爰於第三項定明施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，授權由中央主管機關定之。"}],"changed":true,"final":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"","review":{"note":"照行政院提案通過","text":"事業單位將符合第十五條之一第一項所定一定規模以上之工程交付二個以上施工者施工時，應指定施工者之一負整體工程安全衛生統合管理責任。\n前項經指定之施工者，應執行整體工程安全衛生統合管理事項。\n前二項施工者之指定、整體工程安全衛生統合管理及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第三十二條","current":"雇主對勞工應施以從事工作與預防災變所必要之安全衛生教育及訓練。\n前項必要之教育及訓練事項、訓練單位之資格條件與管理及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育及訓練，有接受之義務。","versions":[{"bill":"202110109180000","text":"雇主對勞工應施以從事工作、預防災變與預防身心遭不法侵害所必要之身心安全衛生教育及訓練。\n負責人或中高階管理人員應參加由中央主管機關開設之促進職業心理衛生、健全職場環境與性別友善之必要教育及訓練，單一年度總時數不得低於十二小時。\n前二項必要之教育及訓練事項、訓練單位之資格條件與管理及其他應遵行事項之規則，由中央主管機關定之。\n第二項之教育訓練費用得由中央主管機關部分或全額負擔。\n勞工對於第一項之安全衛生教育及訓練，有接受之義務。\n雇主、中高階管理人員對於第二項之心理衛生教育及訓練，有接受之義務。","note":"一、現行條文中，關於心理衛生描述仍有不足，調整文字明確納入心理衛生項目。\n二、增加負責人或中高階管理人員應參加由中央主管機關開設之促進職場心理衛生環境及文化的教育及訓練。\n三、負責人或中高階管理人員參加促進職場心理衛生教育及訓練所需費用，應由中央主管機關部分補助或全額負擔。\n四、雇主、中高階管理人員有參與促進職場心理衛生教育及訓練之義務。"},{"bill":"202110119990000","text":"雇主對勞工應施以從事工作、預防災變與預防身心遭不法侵害所必要之身心安全衛生教育及訓練。\n負責人或中高階管理人員應參加由中央主管機關開設之促進職業心理衛生、健全職場環境與性別友善之必要教育及訓練，單一年度總時數不得低於十二小時。\n前二項必要之教育及訓練事項、訓練單位之資格條件與管理及其他應遵行事項之規則，由中央主管機關定之。\n第二項之教育訓練費用得由中央主管機關部分或全額負擔。\n勞工對於第一項之安全衛生教育及訓練，有接受之義務。\n雇主、中高階管理人員對於第二項之心理衛生教育及訓練，有接受之義務。","note":"一、調整文字明確納入心理衛生項目。\n二、增加負責人或中高階管理人員應參加由中央主管機關開設之促進職場心理衛生環境及文化的教育及訓練。\n三、負責人或中高階管理人員參加促進職場心理衛生教育及訓練所需費用，應由中央主管機關部分補助或全額負擔。\n四、雇主、中高階管理人員有參與促進職場心理衛生教育及訓練之義務。"},{"bill":"202110161460000","text":"雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。\n前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。\n前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育訓練，有接受之義務。","note":"一、第一項酌作文字修正。\n二、依《職業安全衛生教育訓練規則》第二十條，增訂第二項，明定教育訓練得由中央主管機關認可之特定訓練單位辦理。\n三、原第二項移列為第三項，並授權中央主管機關就特定訓練單位之查核、認可及評鑑等事項另訂規則。\n四、原第三項移列為第四項，並酌作文字修正。"},{"bill":"201110158300000","text":"雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。\n前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。\n前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育訓練，有接受之義務。","note":"一、第一項酌作文字修正。\n二、查職業安全衛生教育訓練規則第二十條第一項規定，安全衛生教育訓練得由經中央主管機關認可之特定訓練單位辦理，爰增訂第二項，以資明確。\n三、第二項移列為第三項，並配合第二項定明第一項之教育訓練可交由特定訓練單位辦理，爰於第三項就該等訓練單位之查核、認可及評鑑等事項授權由中央主管機關於規則訂定。\n四、第三項移列為第四項，並酌作文字修正。"},{"bill":"202110162130000","text":"雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。\n前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。\n前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育訓練，有接受之義務。","note":"一、第一項酌作文字修正。\n二、查職業安全衛生教育訓練規則第二十條第一項規定，安全衛生教育訓練得由經中央主管機關認可之特定訓練單位辦理，爰增訂第二項，以資明確。\n三、第二項移列為第三項，並配合第二項定明第一項之教育訓練可交由特定訓練單位辦理，爰於第三項就該等訓練單位之查核、認可及評鑑等事項授權由中央主管機關於規則訂定。\n四、第三項移列為第四項，並酌作文字修正。"},{"bill":"202110162770000","text":"雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。\n前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。\n前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育訓練，有接受之義務。","note":"一、第一項酌作文字修正。\n二、查職業安全衛生教育訓練規則第二十條第一項規定，安全衛生教育訓練得由經中央主管機關認可之特定訓練單位辦理，爰增訂第二項，以資明確。\n三、第二項移列為第三項，並配合第二項定明第一項之教育訓練可交由特定訓練單位辦理，爰於第三項就該等訓練單位之查核、認可及評鑑等事項授權由中央主管機關於規則訂定。\n四、第三項移列為第四項，並酌作文字修正。"},{"bill":"202110163600000","text":"雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。\n前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。\n前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育訓練，有接受之義務。","note":"一、酌修本條之文字。\n二、增訂第二項，讓辦理安全衛生教育訓練之相關規定更加明確。\n三、原第二項、第三項移列為第三項第四項。"},{"bil 對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。\n前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。\n前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育訓練，有接受之義務。","finalWhy":"一、第一項酌作文字修正。\n二、查職業安全衛生教育訓練規則第二十條第一項規定，安全衛生教育訓練得由經中央主管機關認可之特定訓練單位辦理，爰增訂第二項，以資明確。\n三、第二項移列為第三項，並配合第二項定明第一項之教育訓練可交由特定訓練單位辦理，爰於第三項就該等訓練單位之查核、認可及評鑑等事項授權由中央主管機關於規則訂定。\n四、第三項移列為第四項，並酌作文字修正。","review":{"note":"照行政院提案通過","text":"雇主對勞工應施以從事工作及預防災變所必要之安全衛生教育訓練。\n前項安全衛生教育訓練，應由雇主自行辦理或交由中央主管機關認可之機關（構）、學校、團體等訓練單位辦理。\n前二項之安全衛生教育訓練、訓練單位之資格條件與管理、查核、認可、評鑑及其他應遵行事項之規則，由中央主管機關定之。\n勞工對於第一項之安全衛生教育訓練，有接受之義務。"}},{"no":"第三十四條","current":"雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經勞動檢查機構備查後，公告實施。\n勞工對於前項安全衛生工作守則，應切實遵行。","versions":[{"bill":"202110109180000","text":"雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經勞動檢查機構備查後，公告實施。\n中央主管機關應依照本法及有關規定會同心理衛生中央主管機關訂定促進職業心理衛生、健全職場環境與性別友善之必要規範，進行公告。\n勞工對於第一項安全衛生工作守則，應切實遵行。","note":"中央主管機關應會同心理衛生中央主管機關，訂定促進職場心理衛生、建全職場環境及性別友善標準、量表或規範。"},{"bill":"202110119990000","text":"雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經勞動檢查機構備查後，公告實施。\n中央主管機關應依照本法及有關規定會同心理衛生中央主管機關訂定促進職業心理衛生、健全職場環境與性別友善之必要規範，進行公告。\n勞工對於第一項安全衛生工作守則，應切實遵行。","note":"中央主管機關應會同心理衛生中央主管機關，訂定促進職場心理衛生、建全職場環境及性別友善標準、量表或規範。"}],"changed":false,"final":"雇主應依本法及有關規定會同勞工代表訂定適合其需要之安全衛生工作守則，報經勞動檢查機構備查後，公告實施。\n勞工對於前項安全衛生工作守則，應切實遵行。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第三十五條","current":"中央主管機關得聘請勞方、資方、政府機關代表、學者專家及職業災害勞工團體，召開職業安全衛生諮詢會，研議國家職業安全衛生政策，並提出建議；其成員之任一性別不得少於三分之一。","versions":[{"bill":"202110026600000","text":"中央主管機關應聘請勞方、資方、政府機關代表、學者專家及職業災害勞工團體，每年召開職業安全衛生諮詢會，研議國家職業安全衛生政策，審議國內發生重大工安事件，並提出建議。\n前項學者專家、民間團體代表不得少於二分之一；其成員之任一性別不得少於三分之一。","note":"一、本條係規範主管機關定期召開職業安全衛生相關會議，審議國內近期發生的重大工安意見，提出具體政策建議、改善措施，以保障勞工勞動權益。尤以各式新興產業崛起，更需要政府部門能及時回應多元的職業安全衛生需求。此外，要求政府能及時反應之外，更能做出具有代表性的政策建議。\n二、另查，我國「食品安全衛生管理法」第二條之一規定，行政院食品安全會報，並職司跨部會協調食品安全風險評估及管理措施，至少每三個月開會一次，且必要時得召開臨時會議，顯見本法之強制性不足，顯有修正之必要。故參酌兒童及少年福利與權益保障法第十條第二項，將專家學者、民間團體代表比例調高至不得少於二分之一。期能透過政府部門積極作為以降低國內頻繁之工安事故。"},{"bill":"202110109180000","text":"中央主管機關得聘請勞方、資方、政府機關代表、學者專家及職業災害勞工團體，召開職業身心安全衛生諮詢會，研議國家職業身心安全衛生政策，並提出建議；其成員之任一性別不得少於三分之一。","note":"現行條文中，關於心理衛生描述仍有不足，調整文字明確納入心理衛生項目。"},{"bill":"202110119990000","text":"中央主管機關得聘請勞方、資方、政府機關代表、學者專家及職業災害勞工團體，召開職業身心安全衛生諮詢會，研議國家職業身心安全衛生政策，並提出建議；其成員之任一性別不得少於三分之一。","note":"調整文字明確納入心理衛生項目。"},{"bill":"202110127920000","text":"中央主管機關應聘請勞方、資方、政府機關代表、學者專家及職業災害勞工團體，定期召開職業安全衛生諮詢會，研議國家職業安全衛生政策，並提出建議；勞方、學者專家及職業災害勞工團體代表之人數不得少於成員總數二分之一；其成員之任一性別不得少於三分之一。","note":"一、中央主管機關應定期召開職業安全衛生相關會議，研議國家職業安全衛生政策，適時提出具體政策建議、改善措施，以保障勞工勞動權益。\n二、諮詢會宜尊重多方意見，尤應重視勞方、學者專家及職業災害勞工團體代表之聲音，爰規定勞方、學者專家及職業災害勞工團體代表人數不得少於成員總數二分之一，修正本條規定。"}],"changed":false,"final":"中央主管機關得聘請勞方、資方、政府機關代表、學者專家及職業災害勞工團體，召開職業安全衛生諮詢會，研議國家職業安全衛生政策，並提出建議；其成員之任一性別不得少於三分之一。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第三十七條","current":"事業單位工作場所發生職業災害，雇主應即採取必要之急救、搶救等措施，並會同勞工代表實施調查、分析及作成紀錄。\n事業單位勞動場所發生下列職業災害之一者，雇主應於八小時內通報勞動檢查機構：\n一、發生死亡災害。\n二、發生災害之罹災人數在三人以上。\n三、發生災害之罹災人數在一人以上，且需住院治療。\n四、其他經中央主管機關指定公告之災害。\n勞動檢查機構接獲前項報告後，應就工作場所發生死亡或重傷之災害派員檢查。\n事業單位發生第二項之災害，除必要之急救、搶救外，雇主非經司法機關或勞動檢查機構許可，不得移動或破壞現場。","versions":[{"bill":"202110109180000","text":"事業單位工作場所發生職業災害，雇主應即採取必要之急救、搶救等措施，並會同勞工代表實施調查、分析及作成紀錄。\n事業單位勞動場所發生下列職業災害之一者，雇主應於八小時內通報勞動檢查機構：\n一、發生死亡災害。\n二、發生災害之罹災人數在三人以上。\n三、發生災害之罹災人數在一人以上，且需住院治療。\n四、其他經中央主管機關指定公告之災害。\n勞動檢查機構接獲前項報告後，應就工作場所發生死亡或重傷之災害派員檢查。\n事業單位發生第二項之災害，除必要之急救、搶救外，雇主非經司法機關或勞動檢查機構許可，不得移動或破壞現場。\n事業單位工作場所發生職業災害，雇主應提供受害勞工及受影響勞工必要之心理衛生輔導，必要時應給予有薪休假。","note":"事業單位發生工作場所職災，除了緊急救助外，事後的心理復原以及受影響者的心理狀況應加以協助，爰增訂應給予必要之心理衛生輔導，必要時應給予有薪休假。"},{"bill":"202110119990000","text":"事業單位工作場所發生職業災害，雇主應即採取必要之急救、搶救等措施，並會同勞工代表實施調查、分析及作成紀錄。\n事業單位勞動場所發生下列職業災害之一者，雇主應於八小時內通報勞動檢查機構：\n一、發生死亡災害。\n二、發生災害之罹災人數在三人以上。\n三、發生災害之罹災人數在一人以上，且需住院治療。\n四、其他經中央主管機關指定公告之災害。\n勞動檢查機構接獲前項報告後，應就工作場所發生死亡或重傷之災害派員檢查。\n事業單位發生第二項之災害，除必要之急救、搶救外，雇主非經司法機關或勞動檢查機構許可，不得移動或破壞現場。\n事業單位工作場所發生職業災害，雇主應提供受害勞工及受影響勞工必要之心理衛生輔導，必要時應給予有薪休假。","note":"增訂應給予必要之心理衛生輔導，必要時應給予有薪休假。"}],"changed":false,"final":"事業單位工作場所發生職業災害，雇主應即採取必要之急救、搶救等措施，並會同勞工代表實施調查、分析及作成紀錄。\n事業單位勞動場所發生下列職業災害之一者，雇主應於八小時內通報勞動檢查機構：\n一、發生死亡災害。\n二、發生災害之罹災人數在三人以上。\n三、發生災害之罹災人數在一人以上，且需住院治療。\n四、其他經中央主管機關指定公告之災害。\n勞動檢查機構接獲前項報告後，應就工作場所發生死亡或重傷之災害派員檢查。\n事業單位發生第二項之災害，除必要之急救、搶救外，雇主非經司法機關或勞動檢查機構許可，不得移動或破壞現場。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第三十九條","current":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與。\n雇主不得對第一項申訴之工作者予以解僱、調職或其他不利之處分。","versions":[{"bill":"202110072510000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與。\n雇主不得對第一項申訴之工作者予以解僱、調職或其他不利之處分。\n主管機關或勞動檢查機構接獲第一項申訴後，應為必要之調查，並於接獲申訴六十日內將處理情形，以書面通知申訴人，但無法以書面通知者，得以其他方式為之。","note":"一、申訴之相關機制，若主管機關或勞動檢查機構未能於受理申訴案件後，相當期間內為必要之調查並通知結果，將不利於證據保全，恐生湮滅、隱匿、偽造或變造之可能，將有礙主管機關或勞動檢查機構對於相關事證之蒐集，甚或無法有效保護工作者於申訴後之相關權益。\n二、參酌勞動基準法第七十四條第四項、勞動基準法檢舉案件保密及處理辦法第五條，新增訂定六十日內就雇主違法之勞動事實進行行政調查，並以書面方式通知申訴之工作者，以資周全。"},{"bill":"202110127920000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查，並得委請專業人士或民間團體協助辦理。\n前項之調查，必要時得通知當事人或有關人員參與。\n雇主不得對第一項提起申訴或或協助他人申訴之工作者予以解僱、調職、減薪、損害其依法令、契約、習慣上所應享有之權益，或其他不利之處分與措施。","note":"一、為釐清申訴所涉違失情事，同時兼顧行政機關調查之量能與行政效率，增訂主管機關或勞動檢查機構於調查雇主依本法所應採取之相關措施時，得委請專業人士或民間團體，協助辦理並提供專業意見之規定，爰修正第二項。\n二、為保障申訴人或協助者不致因申訴及協助調查而遭受不利處分或措施，參考勞動基準法第七十四條第二項、公益揭弊者保護法第八條規定，修正第四項文字。"},{"bill":"202110128290000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認雇主依本法所應採取之相關措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得委請專業人士、民間團體或指定第三方機構協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。","note":"一、第一項未修正。\n二、第二項酌作文字修正。\n三、配合本次新增及修正條文，明列事業單位內外部申訴調查及處理機制，雇主若有違反第二十二條之一第二項後段未訂內部申訴規範，或第二十二條之二第一項第一款知悉申訴職場霸凌事件後未採適當處理措施，均得依本條規定提起申訴。\n四、為兼顧基層行政機關之處理量能與人力分配，修正第三項，增訂主管機關得委請專業人士、民間團體或指定之第三方機構處理調查，並助於提升調查公正性與專業性。\n五、配合新增條文第二十二條之二及第二十二條之三均有申訴之規定，爰修正第四項規定，具體化且列舉雇主不得對申訴人或其協助申訴者予以不利處分之內容樣態。"},{"bill":"202110132410000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得委請專業人士或民間團體協助辦理。\n第一項提起申訴或協助他人申訴之工作者身分資料，應予保密。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。","note":"一、本條新增。\n二、為強化單位內部職場霸凌防治成效，除增訂職場霸凌之防治規定外，亦須加強外部申訴制度，爰增訂本條第四項吹哨者保護條款，提起申訴之工作者身份資料應予保密，以保障吹哨者之安全。"},{"bill":"202110134470000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查，並得委請專業人士或民間團體協助辦理。\n前項之調查，必要時得通知當事人或有關人員參與。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。","note":"為確保雇主所採取之職安預防及處置措施符合本法要求，主管機關或勞動檢查機構得委請專業人士或民間團體協助進行調查，以廣納各界專業意見協助職場安全的維護。"},{"bill":"202110161460000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、本次新增職場霸凌防治規定，除明確雇主之防治責任外，並建構外部申訴制度。若被申訴人為最高負責人，或雇主未設申訴管道、未處理霸凌事件，勞工得提起申訴，由主管機關或勞檢機構調查。另為兼顧行政量能，增訂得委請專業人士或民間團體協助調查。\n二、配合申訴規定，修正第四項，明定雇主不得對申訴人或協助申訴者為不利處分，並參考《勞動基準法》第七十四條第二項修正文字。\n三、第五項及第六項參考《海洋污染防治法》及《空氣污染防制法》之規定，以加強申訴人權益保障。\n四、第一項及第二項未修正。"},{"bill":"201110158300000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主之防治責任外，並加強外部申訴制度之建構；其中除職場霸凌之被申訴人屬最高負責人時，勞工得依修正條文第二十二條之三規定申訴外，雇主若有違反修正條文第二十二條之一第二項各款規定未訂申訴管道或規範，或違反修正條文第二十二條之二第一項第一款規定於知悉申訴職場霸凌事件後未為處理或採取適當措施，均得依本條規定提起申訴，由主管機關或勞動檢查機構就雇主所採取之預防及處置措施，實施調查，併予敘明。為兼顧行政機關調查之量能及行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主是否依本法所應採取之預防及處置措施時，得請專業人士或民間團體，協助辦理並提供專業意見之規定；至有關該等案件之申訴受理程序及請專業人士或民間團體協助調查之作法，後續將另訂行政規則，提供主管機關或勞動檢查機構依循辦理。\n二、配合修正條文第二十二條之二及第二十二條之三均定有申訴之規定，爰修正第四項，明確雇主不得對申訴或其協助他人申訴之工作者予以不利處分之內容，並參考勞動基準法第七十四條第二項，酌作文字修正。\n三、第五項及第六項分別參考海洋污染防治法第四十六條第二項及第三項、空氣污染防制法第九十五條第二項及第三項增訂，以強化並確保申訴者之權益。\n四、第一項及第二項未修正。"},{"bill":"202110162130000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主之防治責任外，並加強外部申訴制度之建構；其中除職場霸凌之被申訴人屬最高負責人時，勞工得依修正條文第二十二條之三規定申訴外，雇主若有違反修正條文第二十二條之一第二項各款規定未訂申訴管道或規範，或違反修正條文第二十二條之二第一項第一款規定於知悉申訴職場霸凌事件後未為處理或採取適當措施，均得依本條規定提起申訴，由主管機關或勞動檢查機構就雇主所採取之預防及處置措施，實施調查，併予敘明。為兼顧行政機關調查之量能及行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主是否依本法所應採取之預防及處置措施時，得請專業人士或民間團體，協助辦理並提供專業意見之規定；至有關該等案件之申訴受理程序及請專業人士或民間團體協助調查之作法，後續將另訂行政規則，提供主管機關或勞動檢查機構依循辦理。\n二、配合修正條文第二十二條之二及第二十二條之三均定有申訴之規定，爰修正第四項，明確雇主不得對申訴或其協助他人申訴之工作者予以不利處分之內容，並參考勞動基準法第七十四條第二項，酌作文字修正。\n三、第五項及第六項分別參考海洋污染防治法第四十六條第二項及第三項、空氣污染防制法第九十五條第二項及第三項增訂，以強化並確保申訴者之權益。\n四、第一項及第二項未修正。"},{"bill":"202110162770000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主之防治責任外，並加強外部申訴制度之建構；其中除職場霸凌之被申訴人屬最高負責人時，勞工得依修正條文第二十二條之三規定申訴外，雇主若有違反修正條文第二十二條之一第二項各款規定未訂申訴管道或規範，或違反修正條文第二十二條之二第一項第一款規定於知悉申訴職場霸凌事件後未為處理或採取適當措施，均得依本條規定提起申訴，由主管機關或勞動檢查機構就雇主所採取之預防及處置措施，實施調查，併予敘明。為兼顧行政機關調查之量能及行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主是否依本法所應採取之預防及處置措施時，得請專業人士或民間團體，協助辦理並提供專業意見之規定；至有關該等案件之申訴受理程序及請專業人士或民間團體協助調查之作法，後續將另訂行政規則，提供主管機關或勞動檢查機構依循辦理。\n二、配合修正條文第二十二條之二及第二十二條之三均定有申訴之規定，爰修正第四項，明確雇主不得對申訴或其協助他人申訴之工作者予以不利處分之內容，並參考勞動基準法第七十四條第二項，酌作文字修正。\n三、第五項及第六項分別參考海洋污染防治法第四十六條第二項及第三項、空氣污染防制法第九十五條第二項及第三項增訂，以強化並確保申訴者之權益。\n四、第一項及第二項未修正。"},{"bill":"202110163600000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、於第三項明定民間人士與專業團體參與調查之規定。\n二、修正第四項並增列第五項、第六項，加強對申訴者與協助申訴者之保障。"},{"bill":"202110165070000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主之防治責任外，並加強外部申訴制度之建構；其中除職場霸凌之被申訴人屬最高負責人時，勞工得依修正條文第二十二條之三規定申訴外，雇主若有違反修正條文第二十二條之一第二項各款規定未訂申訴管道或規範，或違反修正條文第二十二條之二第一項第一款規定於知悉申訴職場霸凌事件後未為處理或採取適當措施，均得依本條規定提起申訴，由主管機關或勞動檢查機構就雇主所採取之預防及處置措施，實施調查，併予敘明。為兼顧行政機關調查之量能及行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主是否依本法所應採取之預防及處置措施時，得請專業人士或民間團體，協助辦理並提供專業意見之規定；至有關該等案件之申訴受理程序及請專業人士或民間團體協助調查之作法，後續將另訂行政規則，提供主管機關或勞動檢查機構依循辦理。\n二、配合修正條文第二十二條之二及第二十二條之三均定有申訴之規定，爰修正第四項，明確雇主不得對申訴或其協助他人申訴之工作者予以不利處分之內容，並參考勞動基準法第七十四條第二項，酌作文字修正。\n三、第五項及第六項分別參考海洋污染防治法第四十六條第二項及第三項、空氣污染防制法第九十五條第二項及第三項增訂，以強化並確保申訴者之權益。\n四、第一項及第二項未修正。"},{"bill":"202110164370000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，應負舉證責任。","note":"一、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主之防治責任外，並加強外部申訴制度之建構；其中除職場霸凌之被申訴人屬最高負責人時，勞工得依修正條文第二十二條之三規定申訴外，雇主若有違反修正條文第二十二條之一第二項各款規定未訂申訴管道或規範，或違反修正條文第二十二條之二第一項第一款規定於知悉申訴職場霸凌事件後未為處理或採取適當措施，均得依本條規定提起申訴，由主管機關或勞動檢查機構就雇主所採取之預防及處置措施，實施調查，併予敘明。為兼顧行政機關調查之量能及行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主是否依本法所應採取之預防及處置措施時，得請專業人士或民間團體，協助辦理並提供專業意見之規定；至有關該等案件之申訴受理程序及請專業人士或民間團體協助調查之作法，後續將另訂行政規則，提供主管機關或勞動檢查機構依循辦理。\n二、配合修正條文第二十二條之二及第二十二條之三均定有申訴之規定，爰修正第四項，明確雇主不得對申訴或其協助他人申訴之工作者予以不利處分之內容，並參考勞動基準法第七十四條第二項，酌作文字修正。\n三、第五項及第六項分別參考海洋污染防治法第四十六條第二項及第三項、空氣污染防制法第九十五條第二項及第三項增訂，以強化並確保申訴者之權益。\n四、第一項及第二項未修正。"},{"bill":"202110164360000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法、有關安全衛生或職場霸凌防治之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認雇主依本法所應採取之相關措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得委請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。","note":"一、第一項配合霸凌防治專章於申訴情形新增職場霸凌防治之規定。\n二、第二項配合第一項之規定，酌作文字修正。\n三、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主的防治責任外，並加強外部申訴制度的建構；其中除了職場霸凌之被申訴人屬最高負責人而勞工應循第二十二條之三申訴以外，雇主若有違反第二十二條之一第二項後段未訂申訴管道或規範，或第二十二條之二第一項第一款知悉申訴職場霸凌事件後未為處理或未採適當措施，均得依本條規定提起申訴；為兼顧行政機關調查之量能與行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主依本法所應採取之相關措施時，得委請專業人士或民間團體，協助辦理並提供專業意見之規定。\n四、配合新增條文第二十二條之二及第二十二條之三均有申訴之規定，爰修正第四項規定，具體化雇主不得對申訴人或其協助申訴者予以不利處分之內容，並參考勞動基準法第七十四條第二項規定，酌作文字修正。"},{"bill":"202110164930000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主之防治責任外，並加強外部申訴制度之建構；其中除職場霸凌之被申訴人屬最高負責人時，勞工得依修正條文第二十二條之三規定申訴外，雇主若有違反修正條文第二十二條之一第二項各款規定未訂申訴管道或規範，或違反修正條文第二十二條之二第一項第一款規定於知悉申訴職場霸凌事件後未為處理或採取適當措施，均得依本條規定提起申訴，由主管機關或勞動檢查機構就雇主所採取之預防及處置措施，實施調查，併予敘明。\n二、修正第三項，為兼顧行政機關調查之量能及行政效率，增訂主管機關或勞動檢查機構於調查雇主是否依本法所應採取之預防及處置措施時，得請專業人士或民間團體，協助辦理並提供專業意見之規定；至有關該等案件之申訴受理程序及請專業人士或民間團體協助調查之作法，後續將另訂行政規則，提供主管機關或勞動檢查機構依循辦理。\n三、修正第四項，配合修正條文第二十二條之二及第二十二條之三之申訴規定，爰明確雇主不得對申訴或其協助他人申訴之工作者予以不利處分之內容，並參考勞動基準法第七十四條第二項，酌作文字修正。\n四、第五項及第六項分別參考海洋污染防治法第四十六條第二項及第三項、空氣污染防制法第九十五條第二項及第三項增訂，以強化並確保申訴者之權益。\n五、第一項及第二項未修正。"},{"bill":"202110166760000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認雇主依本法所應所採取之預防及相關處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得委專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。","note":"一、第一項未修正。\n二、配合增訂職場霸凌專章，增加職場霸凌之防治相關規定，爰針對第二項文字酌作修正。\n三、為兼顧行政機關調查之量能與行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主依本法所應採取之預防及處置措施時，得委請專業人士或民間團體，協助辦理並提供專業意見之規定。\n四、配合新增條文第二十二條之二及第二十二條之三均有申訴之規定，爰修正第四項規定，具體化雇主不得對申訴人或其協助申訴者予以不利處分之內容，並參考勞動基準法第七十四條第二項規定，酌作文字修正。"},{"bill":"202110166930000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主之防治責任外，並加強外部申訴制度之建構；其中除職場霸凌之被申訴人屬最高負責人時，勞工得依修正條文第二十二條之三規定申訴外，雇主若有違反修正條文第二十二條之一第二項各款規定未訂申訴管道或規範，或違反修正條文第二十二條之二第一項第一款規定於知悉申訴職場霸凌事件後未為處理或採取適當措施，均得依本條規定提起申訴，由主管機關或勞動檢查機構就雇主所採取之預防及處置措施，實施調查，併予敘明。為兼顧行政機關調查之量能及行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主是否依本法所應採取之預防及處置措施時，得請專業人士或民間團體，協助辦理並提供專業意見之規定；至有關該等案件之申訴受理程序及請專業人士或民間團體協助調查之作法，後續將另訂行政規則，提供主管機關或勞動檢查機構依循辦理。\n二、配合修正條文第二十二條之二及第二十二條之三均定有申訴之規定，爰修正第四項，明確雇主不得對申訴或其協助他人申訴之工作者予以不利處分之內容，並參考勞動基準法第七十四條第二項，酌作文字修正。\n三、第五項及第六項分別參考海洋污染防治法第四十六條第二項及第三項、空氣污染防制法第九十五條第二項及第三項增訂，以強化並確保申訴者之權益。\n四、第一項及第二項未修正。"},{"bill":"202110166940000","text":"工作者發現下列情形之一者，得向雇主、主管機關或勞動檢查機構申訴：\n一、事業單位違反本法或有關安全衛生之規定。\n二、疑似罹患職業病。\n三、身體或精神遭受侵害。\n主管機關或勞動檢查機構為確認前項雇主所採取之預防及處置措施，得實施調查。\n前項之調查，必要時得通知當事人或有關人員參與，並得請專業人士或民間團體協助辦理。\n雇主不得對依本法提起申訴或協助他人申訴之工作者，予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項不利處分者，無效。\n工作者因第四項規定之行為受有不利處分者，雇主對於該不利處分與第四項規定行為無關之事實，負舉證責任。","note":"一、本次修正新增職場霸凌之防治規定，除明確事業單位內部雇主之防治責任外，並加強外部申訴制度之建構；其中除職場霸凌之被申訴人屬最高負責人時，勞工得依修正條文第二十二條之三規定申訴外，雇主若有違反修正條文第二十二條之一第二項各款規定未訂申訴管道或規範，或違反修正條文第二十二條之二第一項第一款規定於知悉申訴職場霸凌事件後未為處理或採取適當措施，均得依本條規定提起申訴，由主管機關或勞動檢查機構就雇主所採取之預防及處置措施，實施調查，併予敘明。為兼顧行政機關調查之量能及行政效率，爰修正第三項，增訂主管機關或勞動檢查機構於調查雇主是否依本法所應採取之預防及處置措施時，得請專業人士或民間團體，協助辦理並提供專業意見之規定；至有關該等案件之申訴受理程序及請專業人士或民間團體協助調查之作法，後續將另訂行政規則，提供主管機關或勞動檢查機構依循辦理。\n二、配合修正條文第二十二條之二及第二十二條之三均定有申訴之規定，爰修正第四項，明確雇主不得對申訴或其協助他人申訴之工作者予以不利處分之內容，並參考勞動基準法第七十四條第二項，酌作文字修正。\n三、第五項及第六項分別參考海洋污染防治法第四十六條第二項及第三項、空氣污染防制法第九十五條第二項及第三項增訂，以強化並確保申訴者之權益。\n四、第一項及第二項未修正。"}],"changed":true,"final": "note":"一、刑法第二百七十六條規定，因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。參考該條規定之有期徒刑上限，並考量職業安全衛生危害預防之落實程度，影響工作場域從業人員生命安全甚鉅，爰提高第一項有期徒刑之上限與刑法第二百七十六條齊一，即有期徒刑由「三年以下」提高至「五年以下」，並將最高罰金由新臺幣三十萬元提高至新臺幣一百五十萬元。\n二、第二項未修正。"},{"bill":"202110162130000","text":"違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第一款之災害者，處五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"一、刑法第二百七十六條規定，因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。參考該條規定之有期徒刑上限，並考量職業安全衛生危害預防之落實程度，影響工作場域從業人員生命安全甚鉅，爰提高第一項有期徒刑之上限與刑法第二百七十六條齊一，即有期徒刑由「三年以下」提高至「五年以下」，並將最高罰金由新臺幣三十萬元提高至新臺幣一百五十萬元。\n二、第二項未修正。"},{"bill":"202110162770000","text":"違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第一款之災害者，處五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"一、刑法第二百七十六條規定，因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。參考該條規定之有期徒刑上限，並考量職業安全衛生危害預防之落實程度，影響工作場域從業人員生命安全甚鉅，爰提高第一項有期徒刑之上限與刑法第二百七十六條齊一，即有期徒刑由「三年以下」提高至「五年以下」，並將最高罰金由新臺幣三十萬元提高至新臺幣一百五十萬元。\n二、第二項未修正。"},{"bill":"202110163600000","text":"違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第一款之災害者，處五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"參照刑法過失致死罪，加重未依本法第六條第一項或第十六條第一項之規定，而致生死亡災害時之罰則。"},{"bill":"202110165070000","text":"違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第一款之災害者，處五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"一、刑法第二百七十六條規定，因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。參考該條規定之有期徒刑上限，並考量職業安全衛生危害預防之落實程度，影響工作場域從業人員生命安全甚鉅，爰提高第一項有期徒刑之上限與刑法第二百七十六條齊一，即有期徒刑由「三年以下」提高至「五年以下」，並將最高罰金由新臺幣三十萬元提高至新臺幣一百五十萬元。\n二、第二項未修正。"},{"bill":"202110164370000","text":"違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第一款之災害者，處六月以上五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"有鑑於現行刑度偏低，難以發揮應有之懲治效果，應比照《空氣污染防制法》第五十一條，爰增訂最低刑期為六個月以上之規定，以達到嚇阻違法之目的。刑法第二百七十六條規定，因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。參考該條規定之有期徒刑上限，並考量職業安全衛生危害預防之落實程度，影響工作場域從業人員生命安全甚鉅，爰提高第一項有期徒刑之上限與刑法第二百七十六條齊一，即有期徒刑由「三年以下」提高至「五年以下」，並將最高罰金由新臺幣三十萬元提高至新臺幣一百五十萬元。"},{"bill":"202110164930000","text":"違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第一款之災害者，處五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"一、刑法第二百七十六條規定，因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。參考該條規定之有期徒刑上限，並考量職業安全衛生危害預防之落實程度，影響工作 十六條第一項所發停工之通知。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"一、刑法第二百八十四條規定，因過失傷害人者，處一年以下有期徒刑、拘役或十萬元以下罰金；致重傷者，處三年以下有期徒刑、拘役或三十萬元以下罰金。參考該條有期徒刑上限，將第一項有期徒刑由「一年以下」提高至「三年以下」，並將最高罰金由新臺幣十八萬元提高至新臺幣一百萬元。\n二、現行對於發生職業災害之後續現場調查，可透過科技儀器、相關人證事證等方式，進一步釐清事發原因，另考量雇主違反第三十七條第四項規定，非經司法機關或勞動檢查機構許可而移動或破壞現場，如由行政機關予以行政裁罰已可達到規範目的，爰將第一項第二款有關違反第三十七條第四項之罰責，移列至修正條文第四十三條第一項第二款規範，以行政罰裁處之。\n三、第二項未修正。"},{"bill":"202110162130000","text":"有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：\n一、違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第二款之災害。\n二、違反第十八條第一項、第二十九條第一項、第三十條第一項、第二項或第三十七條第四項之規定。\n三、違反中央主管機關或勞動檢查機構依第三十六條第一項所發停工之通知。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"一、刑法第二百八十四條規定，因過失傷害人者，處一年以下有期徒刑、拘役或十萬元以下罰金；致重傷者，處三年以下有期徒刑、拘役或三十萬元以下罰金。參考該條有期徒刑上限，將第一項有期徒刑由「一年以下」提高至「三年以下」，並將最高罰金由新臺幣十八萬元提高至新臺幣一百萬元。\n二、第二項未修正。"},{"bill":"202110162770000","text":"有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：\n一、違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第二款之災害。\n二、違反第十八條第一項、第二十九條第一項或第三十條第一項、第二項之規定。\n三、違反中央主管機關或勞動檢查機構依第三十六條第一項所發停工之通知。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"一、刑法第二百八十四條規定，因過失傷害人者，處一年以下有期徒刑、拘役或十萬元以下罰金；致重傷者，處三年以下有期徒刑、拘役或三十萬元以下罰金。參考該條有期徒刑上限，將第一項有期徒刑由「一年以下」提高至「三年以下」，並將最高罰金由新臺幣十八萬元提高至新臺幣一百萬元。\n二、現行對於發生職業災害之後續現場調查，可透過科技儀器、相關人證事證等方式，進一步釐清事發原因，另考量雇主違反第三十七條第四項規定，非經司法機關或勞動檢查機構許可而移動或破壞現場，如由行政機關予以行政裁罰已可達到規範目的，爰將第一項第二款有關違反第三十七條第四項之罰責，移列至修正條文第四十三條第一項第二款規範，以行政罰裁處之。\n三、第二項未修正。"},{"bill":"202110163600000","text":"有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：\n一、違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第二款之災害。\n二、違反第十八條第一項、第二十九條第一項或第三十條第一項、第二項之規定。\n三、違反中央主管機關或勞動檢查機構依第三十六條第一項所發停工之通知。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"參考刑法過失傷害之刑度，加重未依本法規定而致生職業災害時之罰則。"},{"bill":"202110165070000","text":"有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：\n一、違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第二款之災害。\n二、違反第十八條第一項、第二十九條第一項或第三十條第一項、第二項之規定。\n三、違反中央主管機關或勞動檢查機構依第三十六條第一項所發停工之通知。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","note":"一、刑法第二百八十四條規定，因過失傷害人者，處一年以下有期徒刑、拘役或十萬元以下罰金；致重傷者，處三年以下有期徒刑、拘役或三十萬元以下罰金。參考該條有期徒刑上限，將第一項有期徒刑由「一年以下」提高至「三年以下」，並將最高罰金由新臺幣十八萬元提高至新臺幣一百萬元。\n二、現行對於發生職業災害之後續現場調查，可透過科技儀器、相關人證事證等方式，進一步釐清事發原因，另考量雇主違反第三十七條第四項規定，非經司法機關或勞動
