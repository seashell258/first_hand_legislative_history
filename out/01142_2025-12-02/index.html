以下有期徒刑、拘役或三十萬元以下罰金。參考該條有期徒刑上限，將第一項有期徒刑由「一年以下」提高至「三年以下」，並將最高罰金由新臺幣十八萬元提高至新臺幣一百萬元。\n二、現行對於發生職業災害之後續現場調查，可透過科技儀器、相關人證事證等方式，進一步釐清事發原因，另考量雇主違反第三十七條第四項規定，非經司法機關或勞動檢查機構許可而移動或破壞現場，如由行政機關予以行政裁罰已可達到規範目的，爰將第一項第二款有關違反第三十七條第四項之罰責，移列至修正條文第四十三條第一項第二款規範，以行政罰裁處之。\n三、第二項未修正。"}],"changed":true,"final":"有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：\n一、違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第二款之災害。\n二、違反第十八條第一項、第二十九條第一項或第三十條第一項、第二項之規定。\n三、違反中央主管機關或勞動檢查機構依第三十六條第一項所發停工之通知。\n四、故意違反第三十七條第四項規定，未經許可而移動或破壞現場。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。","finalWhy":"一、刑法第二百八十四條規定，因過失傷害人者，處一年以下有期徒刑、拘役或十萬元以下罰金；致重傷者，處三年以下有期徒刑、拘役或三十萬元以下罰金。參考該條有期徒刑上限，將第一項有期徒刑由「一年以下」提高至「三年以下」，並將最高罰金由新臺幣十八萬元提高至新臺幣一百萬元。\n二、現行對於發生職業災害之後續現場調查，可透過科技儀器、相關人證事證等方式，進一步釐清事發原因，考量雇主違反第三十七條第四項規定，非經司法機關或勞動檢查機構許可而移動或破壞現場，如由行政機關予以行政裁罰，將可快速有效課予事業單位保護災害現場義務，強化嚇阻力，爰將第一項第二款有關違反第三十七條第四項之罰責，移列至修正條文第四十三條第一項第二款規範。\n三、惟針對故意移動或破壞現場之行為，因會妨害檢調單位或勞動檢查機構進行災害調查，導致無法釐清災害發生原因，仍有併留行政刑罰之必要，以強化課責事業單位保留災害發生現場之義務，爰第一項第二款有關違反第三十七條第四項之罰責，移列至第四款，定明故意違反第三十七條第四項之罰責規定。\n四、第二項未修正。","review":{"note":"照委員王育敏、陳菁徽、陳昭姿等3人所提修正動議通過","text":"有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：\n一、違反第六條第一項或第十六條第一項之規定，致發生第三十七條第二項第二款之災害。\n二、違反第十八條第一項、第二十九條第一項或第三十條第一項、第二項之規定。\n三、違反中央主管機關或勞動檢查機構依第三十六條第一項所發停工之通知。\n四、故意違反第三十七條第四項規定，未經許可而移動或破壞現場。\n法人犯前項之罪者，除處罰其負責人外，對該法人亦科以前項之罰金。"}},{"no":"第四十三條","current":"有下列情形之一者，處新臺幣三萬元以上三十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條、第三十一條第一項、第二項或第三十七條第一項、第二項之規定；違反第六條第二項致發生職業病。\n三、違反第十五條第一項、第二項之規定，並得按次處罰。\n四、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。","versions":[{"bill":"202110082400000","text":"有下列情形之一者，處新臺幣三萬元以上三十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條、第三十一條第一項、第二項或第三十七條第一項、第二項之規定；違反第六條第二項致發生職業病。\n三、違反第十五條第一項、第二項之規定，並得按次處罰。\n四、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n雇主違反地方主管機關依第六條之二第三項限期為必要處置之命令，處新臺幣三萬元以上一百萬元以下罰鍰。\n雇主違反第六條之二第五項規定，處新臺幣一萬元以上五萬元以下罰鍰。","note":"一、新增第二項及第三項。\n二、參酌《性別平等工作法》第三十八條之一規範，增訂相關罰則。\n三、為使雇主履行地方主管機關令其於一定期限採取必要處置，爰增訂第二項定明違反之處罰。\n四、配合第六條之二第五項，地方主管機關調查期間，申訴人得向雇主申請調整職務或留職停薪，雇主不得拒絕，及調查屬實應發給留職停薪期間薪資之規定，爰增訂第三項，定明雇主違反之處罰。"},{"bill":"202110108280000","text":"有下列情形之一者，處新臺幣五萬元以上三百萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條、第三十一條第一項、第二項或第三十七條第一項、第二項之規定；違反第六條第二項致發生職業病。\n三、違反第十五條第一項、第二項之規定，並得按次處罰。\n四、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。","note":"一、有關雇主違反職業安全衛生法所訂必要安全衛生措施之規定，現行相關條文雖規範雇主應確保作業環境安全，惟相關裁處規定過於寬鬆，無法達到嚇阻作用，致使部分雇主未能落實職業安全防護措施。\n二、為提升雇主法遵意識，確保勞工在安全無虞的環境中工作，並保障社會大眾生命財產安全，有效降低職災發生，保障勞工之生命財產安全，爰提高相關罰鍰金額，由現行罰鍰新臺幣三萬至三十萬元提高到五萬至三百萬元。"},{"bill":"202110128290000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條、第三十一條第一項、第二項或第三十七條第一項、第二項之規定；違反第六條第二項致發生職業病。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病或職場霸凌。\n四、違反第十五條第一項、第二項之規定，並得按次處罰。\n五、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、基於本條相關條文違反事項，係涉及影響勞工身心健康安全，為督促雇主採取積極主動預防手段，落實本法職業安全衛生防護，爰將第一項罰鍰額度上限提高至一百五十萬元，並參考《勞動基準法》第七十九條第四項規定，增列第二項規定，違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n二、考量事業單位若未依新增條文第二十二條線一第二項訂定職場霸凌防治措施，受職場霸凌或因職場霸凌而導致發生職業病之勞工，易遭遇求助無門之情況，為督促雇主及事業單位強化內部防治規範訂定，爰於第一項第三款增列違反第二十二條之一第二項後段或第二十二條之二第一項之罰則。"},{"bill":"202110132370000","text":"未依第七條第三項規定登錄或違反第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，並得按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，並得按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。"},{"bill":"202110135320000","text":"未依第七條第三項規定登錄或違反第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，並得按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，並得按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。"},{"bill":"202110161460000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)考量現行罰責不足，為督促雇主防止職災，將罰鍰上限提高至新臺幣一百五十萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條修正項次，並將違反第三十七條第四項之規定移列至第二款，以行政罰處理。\n(四)將「違反第六條第二項致發生職業病」移列為第三款，並增列職場霸凌致發生職業病之罰則，以強化雇主防治責任。\n(五)增訂第四款，明定事業單位或工程業主未依規定採取安全衛生管理、教育訓練或風險評估，致發生災害者之罰則。\n(六)第三款移列為第五款，文字修正。\n(七)第四款移列為第六款，內容不變。\n二、參考《勞動基準法》第七十九條第四項，增訂第二項，規定主管機關得依事業規模、性質或違規情節，加重罰鍰至最高額二分之一。\n三、考量本次提高罰鍰上限，將配合修正勞動部相關裁罰處理要點，供主管機關及勞檢機構執行依循。"},{"bill":"201110158300000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)鑑於本條所定違反情事，涉及影響勞工生命安全及健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣一百五十萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正修正其所引項次；另違反第三十七條第四項之處罰規定由第四十一條第一項第二款移列第二款，以行政罰裁處之，理由同修正條文第四十一條說明二。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款；事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於該款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰責規定。\n(五)事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰增訂第四款，定明違反修正條文第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並依法制體例酌予修正。\n(七)第四款移列為第六款，內容未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。"},{"bill":"202110162130000","text":"有下列情形之一者，處新臺幣十萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)鑑於本條所定違反情事，涉及影響勞工生命安全及健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，且現行罰責過低不具嚇阻作用，爰將法定罰鍰下限提高至新台幣十萬、上限提高至新臺幣一百五十萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正修正其所引項次。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款；事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於該款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰責規定。\n(五)事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰增訂第四款，定明違反修正條文第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並依法制體例酌予修正。\n(七)第四款移列為第六款，內容未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。"},{"bill":"202110162770000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項至第三項、第二十三條第一項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)鑑於本條所定違反情事，涉及影響勞工生命安全及健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣一百五十萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正修正其所引項次；另違反第三十七條第四項之處罰規定由第四十一條第一項第二款移列第二款，以行政罰裁處之，理由同修正條文第四十一條說明二。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款；事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於該款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰責規定。\n(五)事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果；以及為督促原事業單位善盡承攬管理及統合管理等防災責任，工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰增訂第四款，定明違反修正條文第十五條之一第一項至第三項、第二十三條第一項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並依法制體例酌予修正。\n(七)第四款移列為第六款，內容未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。"},{"bill":"202110163600000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、將現行條文列為第一項，並將法定罰鍰上限上修至一百五十萬元以強化嚇阻違法之作用。\n二、於第一項第二款配合其他條文修正酌修文字。\n三、增訂第四款，明定違反修正條文第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項致生死亡或多人災害時之罰則。\n四、原第三款及第四款配合移列至第五款、第六款並酌修文字。\n五、增訂第二項，主管機關得依事業規模、性質或違反情節加重處罰。"},{"bill":"202110165070000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)鑑於本條所定違反情事，涉及影響勞工生命安全及健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣一百五十萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正修正其所引項次；另違反第三十七條第四項之處罰規定由第四十一條第一項第二款移列第二款，以行政罰裁處之，理由同修正條文第四十一條說明二。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款；事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於該款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰責規定。\n(五)事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰增訂第四款，定明違反修正條文第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並依法制體例酌予修正。\n(七)第四款移列為第六款，內容未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。"},{"bill":"202110164370000","text":"有下列情形之一者，處新臺幣五萬元以上三百萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)鑑於本條所定違反情事，涉及影響勞工生命安全及健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣三百萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正修正其所引項次；另違反第三十七條第四項之處罰規定由第四十一條第一項第二款移列第二款，以行政罰裁處之，理由同修正條文第四十一條說明二。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款；事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於該款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰責規定。\n(五)事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰增訂第四款，定明違反修正條文第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並依法制體例酌予修正。\n(七)第四款移列為第六款，內容未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。"},{"bill":"202110164360000","text":"未依第七條第三項規定登錄或違反第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，並得按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，並得按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"條次變更。"},{"bill":"202110164930000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、修正第一項：\n(一)鑑於現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣一百五十萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正修正其所引項次；另違反第三十七條第四項之處罰規定由第四十一條第一項第二款移列第二款，以行政罰裁處之，理由同修正條文第四十一條說明二。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款，並增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰責規定。\n(五)增訂第四款，為使事業單位準守規定，以達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰定明違反修正條文第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並酌做文字修正。\n(七)第四款移列為第六款，內容未修正。\n二、增訂第二項，參考勞動基準法第七十九條第四項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。"},{"bill":"202110166760000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條、第三十一條第一項、第二項或第三十七條第一項、第二項之規定。\n三、違反第六條第二項、第二十二條之一第三項後段或第二十二條之二第一項規定，致發生職業病或職場霸凌。\n四、違反第十五條第一項、第二項之規定，並得按次處罰。\n五、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、有鑑於本條所定違反情事，涉及影響勞工生命安全與健康之情事，為督促雇主積極預防職業災害，並採取必要之相關措施，爰將第一項罰鍰額度上限提高至一百五十萬元。\n二、對於違反第六條第二項規定，導致勞工發生職業病之罰則移列至第三款，並配合增訂職場霸凌專章，增列違反第二十二條之一第三項後段或第二十二條之二第一項之罰則。\n三、第一項第三款及第四款進行條次變更，移列至第一項第四款及第五款。\n四、參考勞動基準法第七十九條第四項規定，增列第二項規定，對於違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110166930000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)鑑於本條所定違反情事，涉及影響勞工生命安全及健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣一百五十萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正修正其所引項次；另違反第三十七條第四項之處罰規定由第四十一條第一項第二款移列第二款，以行政罰裁處之，理由同修正條文第四十一條說明二。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款；事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於該款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰責規定。\n(五)事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰增訂第四款，定明違反修正條文第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並依法制體例酌予修正。\n(七)第四款移列為第六款，內容未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。"},{"bill":"202110166940000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)鑑於本條所定違反情事，涉及影響勞工生命安全及健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣一百五十萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正修正其所引項次；另違反第三十七條第四項之處罰規定由第四十一條第一項第二款移列第二款，以行政罰裁處之，理由同修正條文第四十一條說明二。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款；事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於該款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰責規定。\n(五)事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰增訂第四款，定明違反修正條文第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並依法制體例酌予修正。\n(七)第四款移列為第六款，內容未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。"}],"changed":true,"final":"有下列情形之一者，處新臺幣五萬元以上三百萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病或工作相關疾病。\n四、違反第十五條之一第一項至第三項、第二十三條第一項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","finalWhy":"一、原條文列為第一項：\n(一)鑑於本條所定違反情事，涉及影響勞工生命安全及健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，且原罰責過低不具嚇阻作用，爰將法定罰鍰下限提高至新臺幣五萬元，罰鍰上限提高至新臺幣三百萬元。\n(二)第一款未修正。\n(三)第二款配合第二十四條之修正，修正其所引項次；另違反第三十七條第四項之處罰規定由第四十一條第一項第二款移列第二款，以行政罰裁處之，理由同修正條文第四十一條說明二。\n(四)第二款後段「違反第六條第二項致發生職業病」移列為第三款；配合本法第二十二條增列事業單位應辦理工作相關疾病之預防，鑑於第六條第二項規定主要之意旨係預防勞工因異常工作負荷(過勞)促發腦心血管疾病、重複性作業造成肌肉骨骼傷病及遭受職場不法侵害可能造成之疾病，為具有多重致病因素，依勞工職業災害保險職業病鑑定作業實施辦法，將之歸類為工作相關疾病，除其他危害因子外，工作為相當重要因素之一；另配合職場霸凌防治專章，事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病或工作相關疾病，為促使雇主重視，強化其職場霸凌防治責任，爰於該款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病或工作相關疾病之罰責規定。\n(五)事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促原事業單位善盡承攬管理及統合管理等防災責任，並要求工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰增訂第四款，定明違反修正條文第十五條之一第一項至第三項、第二十三條第一項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條或第三十二條第一項規定，致發生第三十七條第二項災害之處罰規定。\n(六)第三款移列為第五款，並依法制體例酌予修正。\n(七)第四款移列為第六款，內容未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違反本法相關規定之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、為執行本法規定之行政罰案件，勞動部訂有違反職業安全衛生法及勞動檢查法案件處理要點，考量本次修法適度提高法定罰鍰下限及上限，爰將配合修正該要點之裁罰處理原則，俾利主管機關及勞動檢查機構依循，併予敘明。","review":{"note":"修正通過","text":"有下列情形之一者，處新臺幣五萬元以上三百萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病或工作相關疾病。\n四、違反第十五條之一第一項至第三項、第二十三條第一項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"}},{"no":"第四十三條之一","current":null,"versions":[{"bill":"202110082400000","text":"最高負責人或僱用人經地方主管機關認定有第六條第二項第三款不法侵害者，處新臺幣一萬元以上一百萬元以下罰鍰。\n被申訴人違反第六條之二第二項規定，無正當理由而規避、妨礙、拒絕調查或提供資料者，處新臺幣一萬元以上五萬元以下罰鍰，並得按次處罰。\n第一項裁處權時效，自地方主管機關收受申訴人依第六條之一第一項但書規定提起申訴之日起算。","note":"一、本條新增。\n二、參酌《性別平等工作法》第三十八條之二規範，增訂相關罰則。\n三、鑒於事業單位最高負責人或僱用人為職場不法侵害行為人應予處罰始能遏止職場霸凌或暴力行為一再發生，惟考量違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之霸凌羞辱；又最高負責人所屬事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰訂定第一項，定明罰鍰額度範圍、減輕或免除處罰規定，以符比例原則。\n四、為落實職場霸凌或職場暴力不法行為調查機制，促使事件行為人應確實配合調查或提供資料，爰訂定第二項，定明被申訴人無正當理由不配合之處罰。\n五、行政罰之裁處權，依行政罰法第二十七條規定，因三年期間之經過而消滅。惟考量實務運作情形，於本次修訂另增訂第六條之一申訴期限相關規定，爰訂定第三項，定明裁處權時效之特別規定，以地方主管機關收受申訴之日起算裁處權時效，俾落實不法侵害行為人處罰之規定。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十四條","current":"有下列情形之一者，處新臺幣三萬元以上三十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條、第三十一條第一項、第二項或第三十七條第一項、第二項之規定；違反第六條第二項致發生職業病。\n三、違反第十五條第一項、第二項之規定，並得按次處罰。\n四、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。","versions":[{"bill":"202110132370000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，並得按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。\n二、鑑於本條所定違反情事，涉及影響勞工生命安全與健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，爰將第一項罰鍰額度上限提高至一百五十萬元，並參考勞動基準法第七十九條第四項規定，增列第二項規定，違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、因第二十四條修正後之項次已變更，配合修正所引項次。\n四、配合違反第三十七條第四項之除罪化，爰將該違反規定移列至第一項第二款，以行政罰裁處之。\n五、現行第二款後段「違反第六條第二項致發生職業病」移列為第三款。\n六、事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於第一項第三款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰則規定。\n七、事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰於第一項第四款增列違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項致發生第三十七條第二項災害之罰則規定；餘款次遞移。"},{"bill":"202110135320000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條、第三十一條第一項、第二項或第三十七條第一項、第二項之規定；違反第六條第二項致發生職業病。\n三、違反第二十二條之一第二項後段或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條第一項、第二項之規定，並得按次處罰。\n五、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。\n二、鑑於本條所定違反情事，涉及影響勞工生命安全與健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，爰將第一項罰鍰額度上限提高至一百五十萬元，並參考勞動基準法第七十九條第四項規定，增列第二項規定，違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於第一項第三款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰則規定。"},{"bill":"202110161460000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項、第二項、第四項文字，第三項及第五項未修正。"},{"bill":"201110158300000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項、第二項、第四項文字，第三項及第五項未修正。"},{"bill":"202110162130000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項至第四項文字，第五項未修正。"},{"bill":"202110162770000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項、第二項、第四項文字，第三項及第五項未修正。"},{"bill":"202110163600000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"配合修正條文第九條第二項之修訂，於第一項增訂罰則。"},{"bill":"202110165070000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項至第四項文字，第五項未修正。"},{"bill":"202110164370000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項、第二項、第四項文字，第三項及第五項未修正。"},{"bill":"202110164360000","text":"有下列情形之一者，處新臺幣三萬元以上一百五十萬元以下罰鍰：\n一、違反第十條第一項、第十一條第一項、第二十三條第二項之規定，經通知限期改善，屆期未改善。\n二、違反第六條第一項、第十二條第一項、第三項、第十四條第二項、第十六條第一項、第十九條第一項、第二十四條第一項、第三十一條第一項、第二項或第三十七條第一項、第二項、第四項之規定。\n三、違反第六條第二項、第二十二條之一第二項或第二十二條之二第一項規定，致發生職業病。\n四、違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項規定致發生第三十七條第二項之災害。\n五、違反第十五條第一項、第二項之規定，並得按次處罰。\n六、規避、妨礙或拒絕本法規定之檢查、調查、抽驗、市場查驗或查核。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。\n二、鑑於本條所定違反情事，涉及影響勞工生命安全與健康，為督促雇主積極預防職業災害，設置必要安全衛生設備及採取相關措施，爰將第一項罰鍰額度上限提高至一百五十萬元，並參考勞動基準法第七十九條第四項規定，增列第二項規定，違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n三、因第二十四條修正後之項次已變更，配合修正所引項次。\n四、配合違反第三十七條第四項之除罪化，爰將該違反規定移列至第一項第二款，以行政罰裁處之。\n五、現行第二款後段「違反第六條第二項致發生職業病」移列為第三款。\n六、事業單位若未依規定採取職場霸凌之防治及相關保護措施，受霸凌勞工可能因工作壓力等負荷，致發生職業病，為促使雇主重視，強化其職場霸凌防治責任，爰於第一項第三款增列違反第二十二條之一第二項後段或第二十二條之二第一項致發生職業病之罰則規定。\n七、事業單位未依規定設置安全衛生組織、人員、訂定職業安全衛生管理計畫及實施安全衛生教育訓練等措施，致發生第三十七條第二項之災害，如仍採通知限期改善之方式，並不符比例原則，且易使違反者抱持僥倖心態，難達防災效果，以及為督促工程業主共同防止職業災害，執行交付規劃設計及施工之風險評估及採取預防作為，爰於第一項第四款增列違反第十五條之一第一項、第二項、第二十三條第一項或第三十二條第一項致發生第三十七條第二項災害之罰則規定；餘款次遞移。"},{"bill":"202110164930000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項、第二項、第四項文字，第三項及第五項未修正。"},{"bill":"202110166930000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項至第四項文字，第五項未修正。"},{"bill":"202110166940000","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","note":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項至第四項文字，第五項未修正。"}],"changed":true,"final":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。","finalWhy":"一、配合修正條文第九條第二項之修訂，於第一項增訂其罰責。\n二、依法制體例酌修第一項、第二項、第四項文字，第三項及第五項未修正。","review":{"note":"照行政院提案通過","text":"未依第七條第三項規定登錄或違反第九條第二項、第十條第二項之規定者，處新臺幣三萬元以上十五萬元以下罰鍰；經通知限期改善，屆期未改善者，按次處罰。\n違反第七條第一項、第八條第一項、第十三條第一項或第十四條第一項規定者，處新臺幣二十萬元以上二百萬元以下罰鍰，並得限期停止輸入、產製、製造或供應；屆期不停止者，按次處罰。\n未依第七條第三項規定標示或違反第九條第一項之規定者，處新臺幣三萬元以上三十萬元以下罰鍰，並得令限期回收或改正。\n未依前項規定限期回收或改正者，處新臺幣十萬元以上一百萬元以下罰鍰，按次處罰。\n違反第七條第一項、第八條第一項、第九條第一項規定之產品，或第十四條第一項規定之化學品者，得沒入、銷燬或採取其他必要措施，其執行所需之費用，由行為人負擔。"}},{"no":"第四十五條","current":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十七條、第十八條第三項、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。","versions":[{"bill":"202110109180000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第六條第二項、第三項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第三項、第二十三條第一項、第三十二條第一項、第二項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十七條、第十八條第三項、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n四、第二十二條之一第三項得按次處罰。","note":"一、新增第二十二條之一，第四項之罰則。\n二、新增第三十二條，第二項之罰則。\n三、新增第二十二條之一第四項，雇主向心理衛生專業人員索要勞工就診資料之罰則，可按次開罰。"},{"bill":"202110119990000","text":"有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰：\n一、違反第六條第二項、第六條第三項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第三項、第二十三條第一項、第三十二條第一項、第二項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十七條、第十八條第三項、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n四、第二十二條之一第三項得按次處罰。","note":"一、新增第二十二條之一，第四項之罰則。\n二、新增第三十二條，第二項之罰則。\n三、新增第二十二條之一第四項，雇主向心理衛生專業人員索要勞工就診資料之罰則，可按次開罰。"},{"bill":"202110128290000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、本條修正旨在強化雇主預防職業災害及職場霸凌之責任，並強調其應落實安全衛生管理規定，調高罰鍰額度上限為新臺幣七十五萬元，以加強對違法事業單位的處罰力度。\n二、參照《勞動基準法》第七十九條第四項的規定，新增第二項條文，規定主管機關可根據事業單位的規模、性質及違法情節的不同，將罰鍰額度提高至法定罰鍰的二分之一，進一步強化對違反本法事業單位的懲處機制。\n三、依照本法新增之職場霸凌防治條文訂定罰則。修正條文第二十二條之一第二項後段明確要求雇主應訂定職場霸凌防治措施，並將其納入本法管理措施的一部分。配合本法第二十二條之二第三項新增職場霸凌通報規定，及考量二十二條之二第一項第二款雇主知悉職場霸凌的途徑並非僅限於勞工主動申訴，若雇主未主動採取適當防範措施，應對其行為進行處罰，並設立限期改善機制，對未達改善要求的雇主進行罰鍰處罰。而對於二十二條之二第一項第款雇主由勞工主動申訴後知悉霸凌事件卻未採取後續必要措施之情形，則依據本條文第一項第二款予以直接罰鍰，確保對職場霸凌防範及處理更具透明性和責任性。"},{"bill":"202110132370000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、為督促雇主積極預防職業災害，落實安全衛生管理，爰將第一項罰鍰額度上限提高至七十五萬元，並參考勞動基準法第七十九條第四項規定，增列第二項規定，違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n二、本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及配置醫護人員辦理健康服務等事項，其罰則均為通知限期改善，屆期未改善，再予罰鍰，考量衡平性，修正條文第二十二條之一第二項後段規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項增訂職場霸凌應通報之規定，及考量二十二條之二第一項第二款雇主知悉職場霸凌之方式尚非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜提供限期改善之機制再予罰鍰，爰於第一項第一款增訂罰則規定；至雇主由被霸凌勞工申訴而知悉，卻未採取後續之相關協助或調查機制，則依第一項第二款逕予罰鍰。\n三、配合修正條文第十五條之一及第二十二條之二第一項第一款規定，於第一項第二款增訂罰則規定。"},{"bill":"202110132410000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十七條、第十八條第三項、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項及第五項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。","note":"一、為督促雇主積極預防職業災害，落實安全衛生管理，爰將第一項罰鍰額度上限提高至七十五萬元。\n二、將違反第三十九條第五項吹哨者保護條款納入罰則。"},{"bill":"202110135320000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、為督促雇主積極預防職業災害，落實安全衛生管理，爰將第一項罰鍰額度上限提高至七十五萬元，並參考勞動基準法第七十九條第四項規定，增列第二項規定，違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n二、修正條文第二十二條之一第二項後段規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項增訂職場霸凌應通報之規定，及考量二十二條之二第一項第二款雇主知悉職場霸凌之方式尚非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜提供限期改善之機制再予罰鍰，爰於第一項第一款增訂罰則規定；至雇主由被霸凌勞工申訴而知悉，卻未採取後續之相關協助或調查機制，則依第一項第二款逕予罰鍰。\n三、配合修正條文第二十二條之二第一項第一款規定，於第一項第二款增訂罰則規定。"},{"bill":"202110161460000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為強化嚇阻效果，將罰鍰上限由三十萬元提高至新臺幣七十五萬元。\n(二)職場霸凌防治措施屬安全衛生管理事項，若雇主未訂定相關措施或未依規定通報，原則採限期改善後再處罰；惟如係因被霸凌勞工申訴而知悉，卻未採取協助或調查，則逕予裁罰。\n(三)配合增訂第十五條之一、第二十七條之一及第二十二條之二第一項第一款，增列其罰則。\n(四)第三款未修正。\n二、參考《勞動基準法》第七十九條第四項，增訂第二項，規定主管機關得依事業規模、性質或違規情節，加重罰鍰至最高額二分之一。"},{"bill":"201110158300000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰。\n(三)配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款之增訂，於第二款增訂其罰則\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110162130000","text":"有下列情形之一者，處新臺幣十萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰下限提高至新台幣十萬、上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰。\n(三)配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款之增訂，於第二款增訂其罰則。\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110162770000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項至第三項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰。\n(三)配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款之增訂，於第二款增訂其罰則\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110163600000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項，並為嚇阻不法，保障勞工上修罰則。\n二、配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款，增訂相關罰則。\n三、增訂第二項，主管機關得依事業規模、性質或違反情節加重處罰。"},{"bill":"202110165070000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善，並得按次處罰。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰，並得按次處罰。\n(三)配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款之增訂，於第二款增訂其罰則。\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110164370000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰。\n(三)配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款之增訂，於第二款增訂其罰則。\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110164360000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、為督促雇主積極預防職業災害，落實安全衛生管理，爰將第一項罰鍰額度上限提高至七十五萬元，並參考勞動基準法第七十九條第四項規定，增列第二項規定，違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。\n二、本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及配置醫護人員辦理健康服務等事項，其罰則均為通知限期改善，屆期未改善，再予罰鍰，考量衡平性，修正條文第二十二條之一第二項後段規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項增訂職場霸凌應通報之規定，及考量二十二條之二第一項第二款雇主知悉職場霸凌之方式尚非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜提供限期改善之機制再予罰鍰，爰於第一項第一款增訂罰則規定；至雇主由被霸凌勞工申訴而知悉，卻未採取後續之相關協助或調查機制，則依第一項第二款逕予罰鍰。\n三、配合修正條文第十五條之一及第二十二條之二第一項第一款規定，於第一項第二款增訂罰則規定。"},{"bill":"202110164930000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰。\n(三)配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款之增訂，於第二款增訂其罰則。\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110166760000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第三項後段、第二十二條之二第一項第二款、第二項、第四項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條至第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、為督促雇主積極預防職場霸凌，採取有效之預防措施，爰將第一項罰鍰額度上限提高至七十五萬元。\n二、為督促雇主積極預防職場霸凌，及考量新增條文第二十二條之二第一項第二款雇主知悉職場霸凌之方式並非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜提供限期改善之機制再予罰鍰，爰於第一項第一款增訂罰則；至雇主由被霸凌勞工申訴而知悉，卻未採取後續協助或調查，則依第一項第二款逕予罰鍰。\n三、第一項第一款增訂罰則，對於雇主接獲職場霸凌申訴，卻未能依新增條文第二十二條之二第四項進行通報，或未依新增條文第第二十二條之二第二項於時限內積極調查申訴案件，經通知限期改善，但屆期不改善者，處新臺幣三萬元以上七十五萬元以下罰鍰。\n四、增訂第二項，對於違反前項規定行為之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110166930000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰。\n(三)配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款之增訂，於第二款增訂其罰則\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"},{"bill":"202110166940000","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項、第二項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","note":"一、現行條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰。\n(三)配合修正條文第十五條之一、第二十七條之一及第二十二條之二第一項第一款之增訂，於第二款增訂其罰則。\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"}],"changed":true,"final":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項至第三項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二項、第五項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","finalWhy":"一、原條文列為第一項：\n(一)為督促雇主積極預防職業災害，落實安全衛生管理，且現行罰責過低不具嚇阻作用，爰將法定罰鍰上限提高至新臺幣七十五萬元。\n(二)本法所定安全衛生之管理措施，例如不法侵害預防計畫、作業環境監測計畫之訂定，及依第二十二條規定辦理勞工健康保護事項等，其罰責均為通知限期改善，屆期未改善，再予罰鍰，考量處罰衡平性，修正條文第二十二條之一第二項各款規定為雇主應訂定職場霸凌防治措施，亦屬本法之管理措施；又配合修正條文第二十二條之二第三項定明發生職場霸凌申訴事件應通報之規定，及考量第二十二條之二第一項第二款雇主知悉勞工遭受職場霸凌情事之方式非由被霸凌勞工申訴，其相關作為之裁罰應與由被霸凌勞工申訴有別，宜先限期改善再予罰鍰，爰於第一款增訂上開規定之罰則；至雇主由被霸凌勞工申訴而知悉勞工遭受職場霸凌情事，卻未採取相關協助或調查機制，則依第二款規定逕予罰鍰。\n(三)配合修正條文第十五條之一、第二十七條之一、第二十二條之二第一項第一款、第二項及第五項之增訂，於第二款增訂其罰則。\n(四)第三款未修正。\n二、參考勞動基準法第七十九條第四項，增訂第二項，定明違法之事業單位，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","review":{"note":"照委員王正旭等23人提案、委員劉建國等3人及委員王育敏等4人所提修正動議修正通過","text":"有下列情形之一者，處新臺幣三萬元以上七十五萬元以下罰鍰：\n一、違反第六條第二項、第十二條第四項、第二十條第一項、第二項、第二十一條第一項、第二項、第二十二條第一項、第二十二條之一第二項後段、第二十二條之二第一項第二款、第三項、第二十三條第一項、第三十二條第一項、第三十四條第一項或第三十八條之規定，經通知限期改善，屆期未改善。\n二、違反第十五條之一第一項至第三項、第十七條、第十八條第三項、第二十二條之二第一項第一款、第二項、第五項、第二十六條、第二十七條、第二十七條之一第一項、第二項、第二十八條、第二十九條第三項、第三十三條或第三十九條第四項之規定。\n三、依第三十六條第一項之規定，應給付工資而不給付。\n有前項規定情形之一者，主管機關得依事業規模、性質或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。"}},{"no":"第四十五條之一","current":null,"versions":[{"bill":"202110132410000","text":"違反第二十二條之一、第二十二條之三第四項及第二十二條之四規定者，處新臺幣三萬元以上一百萬元以下罰鍰。\n最高負責人經認定有職場霸凌之行為者，處新臺幣十萬元以上一百五十萬元以下罰鍰。\n第二項裁處權時效，自地方主管機關收受申訴人提起申訴之日起算。","note":"一、本條新增。\n二、針對違反第二十二條之一、第二十二條之三第四項、第二十條之四之違法樣態，明定相關罰鍰。\n三、最高負責人經認定有職場霸凌之行為者，應加重懲處罰鍰，以達嚇阻之效。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第四十六條","current":"違反第二十條第六項、第三十二條第三項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。","versions":[{"bill":"202110109180000","text":"違反第二十條第六項、第三十二條第五項或第三十四條第三項之規定者，處新臺幣三千元以下罰鍰。","note":"一、條次調整，第三十二條第三項，調整為第三十二條第五項。\n二、條次調整，第三十四條第二項，調整為第三十四條第三項。"},{"bill":"202110119990000","text":"違反第二十條第六項、第三十二條第五項或第三十四條第三項之規定者，處新臺幣三千元以下罰鍰。","note":"條次調整。"},{"bill":"202110128290000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自地方主管機關收受申訴人依第二十二條之三第一項第一款但書規定提起申訴之日起算。","note":"一、鑑於最高負責人於職場內部存在優勢權力地位，若涉及職場霸凌行為，應依法處罰。本條文在制定罰則時，考慮到行為情節之差異性，職場霸凌行為可能涉及輕微的言語冒犯或嚴重的肢體霸凌、人格侮辱等行為，故本條參酌《性別平等工作法》第三十八條之二第一項規定，明定罰鍰額度範圍，旨在平衡處罰的合理性與比例原則，並適應不同事業單位的規模差異，從而確保處罰措施的公平性與適當性。\n二、依《行政罰法》第二十七條規定，行政罰之裁處時效為三年。然而，考量到實務中申訴與調查所需時間，為確保職場霸凌行為能在合理期限內受到處罰，特於第三項規定以地方主管機關收受申訴的日期為裁處時效起算點，藉此落實對職場霸凌行為之處罰規定。"},{"bill":"202110132370000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。\n二、配合第二十二條之修正，增訂罰則規定，餘配合款次變更。\n三、因第三十二條修正後之項次已變更，爰修正條文第五款配合修正所引項次。"},{"bill":"202110135320000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、訓練單位違反中央主管機關依第三十二條第二項規定所定之規則。\n五、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。"},{"bill":"202110161460000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、外界普遍認同最高負責人涉職場霸凌應處罰，但因情節輕重差異及企業規模不同，爰參考《性別平等工作法》第三十八之二，增訂第一項，明定罰鍰額度以符比例原則。\n二、操作人員違反第六條相關規定致職災者，增訂第二項，除處罰外並應接受安全衛生講習，拒不參加者按次處罰，以防重複災害。\n三、若操作人員係因雇主指示錯誤或違規而致職災，責任歸屬於雇主，增訂第三項，不予處罰操作人員。\n四、現行條文移列為第四項，並修正所引條次。\n五、增訂第五項，規範最高負責人涉霸凌案件之裁處權時效，自地方主管機關收受申訴日起算，以落實處罰。"},{"bill":"201110158300000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，以符比例原則。\n二、對於操作人員未遵守修正條文第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、現行條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。"},{"bill":"202110162130000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，以符比例原則。\n二、對於操作人員未遵守修正條文第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、現行條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。"},{"bill":"202110162770000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，以符比例原則。\n二、對於操作人員未遵守修正條文第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、現行條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。"},{"bill":"202110163600000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"增訂職場最高負責人為霸凌行為人時之處罰。"},{"bill":"202110165070000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰；情節重大者，處十萬元以上五百萬以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，並針對情節重大者調高罰鍰之下限及上線，以符比例原則。\n二、對於操作人員未遵守修正條文第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、現行條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。"},{"bill":"202110164370000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，以符比例原則。\n二、對於操作人員未遵守修正條文第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、現行條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。"},{"bill":"202110164360000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。\n二、配合第二十二條之修正，增訂罰則規定，餘配合款次變更。\n三、因第三十二條修正後之項次已變更，爰修正條文第五款配合修正所引項次。"},{"bill":"202110164930000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，以符比例原則。\n二、對於操作人員未遵守修正條文第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、現行條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。"},{"bill":"202110166760000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、有鑑於最高負責人或雇主之權勢地位，其所為之職場霸凌行為對於勞工之身心危害較大，應給予較重之處罰，惟考量個案情節之差異性，從輕微言語冒犯至嚴重之肢體霸凌等行為皆屬於職場霸凌範疇，爰參考性別平等工作法第三十八之二條第一項規定，增訂第一項有關罰鍰額度範圍，以符比例原則之規定。\n二、行政罰之裁處權，依行政罰法第二十七條規定，因三年期間之經過而消滅。惟考量實務運作情形及新增條文第二十二條之三申訴期限相關規定，爰增訂第三項，定明最高負責人裁處權時效起算之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人處罰之規定。"},{"bill":"202110166930000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，以符比例原則。\n二、對於操作人員未遵守修正條文第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、現行條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。"},{"bill":"202110166940000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，以符比例原則。\n二、對於操作人員未遵守修正條文第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、現行條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。"}],"changed":true,"final":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","finalWhy":"一、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項，增訂第一項有關最高負責人經認定有職場霸凌行為之罰鍰額度，以符比例原則。\n二、對於操作人員未遵守第六條第一項、第二項及該條第三項授權訂定之安全衛生設備與措施之標準及規則，致發生第三十七條第二項之職業災害時，增訂第二項規定，除處罰操作人員外，該操作人員並應接受中央主管機關指定之安全衛生講習，以提升肇災人員之安全衛生知能；操作人員如拒不接受安全衛生講習者，並定明按次處罰，以避免災害再次發生。\n三、對於操作人員作業如係因雇主指示錯誤、違反規定等，致發生第三十七條第二項之職業災害時，屬雇主之責任，不予處罰該操作人員，爰增訂第三項。\n四、原條文移列為第四項，並配合修正條文第三十二條之修正，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條第一項規定，因三年期間之經過而消滅，並於該條第二項至第四項定有裁處權時效起算日之規定。惟考量實務運作情形，另配合修正條文增訂第二十二條之三第二項有關申訴期限起算之規定，增訂第五項，定明職場霸凌行為人為最高負責人且向地方主管機關申訴者，其裁處權時效起算日之特別規定，以直轄市或縣（市）主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人之處罰。","review":{"note":"照行政院提案通過","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第三項規定，致發生第三十七條第二項之災害者，處新臺幣一萬元以上二十萬元以下罰鍰，並應接受中央主管機關指定之講習；拒不接受講習者，按次處罰。\n前項情形，操作人員係因雇主指示作業所致者，不予處罰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自直轄市或縣（市）主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。"}},{"no":"第四十八條","current":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、訓練單位違反中央主管機關依第三十二條第二項規定所定之規則。\n五、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","versions":[{"bill":"202110109180000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n五、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"條次調整，第三十二條第二項，調整為第三十二條第三項。"},{"bill":"202110119990000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n五、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"條次調整。"},{"bill":"202110132370000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第二項、第三項之規定者，處新臺幣一萬元以上五萬元以下罰鍰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自地方主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。\n二、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項規定，增訂第一項有關罰鍰額度範圍，以符比例原則之規定。\n三、配合修正條文第二十四條第二項及第三項規定，對於危險性機械或設備及其他特定機械之操作人員領有技術士技能檢定證照或已接受經認可之安全衛生教育訓練，具該等作業安全衛生相關知能，惟於操作該等機械或設備時，未遵守規定而造成他人傷害，且拒絕接受安全衛生講習者，為避免災害再次發生，爰訂第二項罰則規定。\n四、現行第一項移列為第三項，並配合修正條文第三十二條，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條規定，因三年期間之經過而消滅。惟考量實務運作情形，另增訂第二十二條之三申訴期限相關規定，爰增訂第四項，定明最高負責人裁處權時效起算之特別規定，以地方主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人處罰之規定。"},{"bill":"202110135320000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自地方主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。\n二、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，且事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項規定，增訂第一項有關罰鍰額度範圍，以符比例原則之規定。\n三、現行第一項移列為第二項。\n四、行政罰之裁處權，依行政罰法第二十七條規定，因三年期間之經過而消滅。惟考量實務運作情形，另增訂第二十二條之三申訴期限相關規定，爰增訂第三項，定明最高負責人裁處權時效起算之特別規定，以地方主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人處罰之規定。"},{"bill":"202110161460000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合第二十二條增列「勞工健康服務專業機構」得辦理健康保護事項，增訂相應處罰規定，並調整款次。\n二、第三十二條第一至第三款未修正；第四、五款則因新增條文移列為第五、六款，第五款並修正所引項次。"},{"bill":"201110158300000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、修正條文第三十二條第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正所引項次。"},{"bill":"202110162130000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、修正條文第三十二條第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正所引項次。"},{"bill":"202110162770000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、修正條文第三十二條第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正所引項次。"},{"bill":"202110163600000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"配合本次修正條文第二十二條第三項於第一項第四款增訂相關罰則。"},{"bill":"202110165070000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、修正條文第三十二條第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正所引項次。"},{"bill":"202110164370000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、修正條文第三十二條第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正所引項次。"},{"bill":"202110164360000","text":"最高負責人經認定有職場霸凌之行為者，處新臺幣一萬元以上一百萬元以下罰鍰。\n違反第二十四條第二項、第三項之規定者，處新臺幣一萬元以上五萬元以下罰鍰。\n違反第二十條第六項、第三十二條第四項或第三十四條第二項之規定者，處新臺幣三千元以下罰鍰。\n第一項裁處權時效，自地方主管機關收受申訴人依第二十二條之三第一項但書規定提起申訴之日起算。","note":"一、參照法制體例罰則規定順序「先罰責重，後罰責輕」，作條次變更。\n二、鑑於外界對最高負責人為職場霸凌行為人應予處罰多有共識，惟考量個案違反情節差異性大，可能為輕微之言語冒犯，使人不悅，亦可能為惡意之肢體霸凌或侮辱人格等行為；又事業單位規模差異大，有小、微型企業，亦有大型跨國企業，爰參考性別平等工作法第三十八之二條第一項規定，增訂第一項有關罰鍰額度範圍，以符比例原則之規定。\n三、配合修正條文第二十四條第二項及第三項規定，對於危險性機械或設備及其他特定機械之操作人員領有技術士技能檢定證照或已接受經認可之安全衛生教育訓練，具該等作業安全衛生相關知能，惟於操作該等機械或設備時，未遵守規定而造成他人傷害，且拒絕接受安全衛生講習者，為避免災害再次發生，爰訂第二項罰則規定。\n四、現行第一項移列為第三項，並配合修正條文第三十二條，修正所引項次。\n五、行政罰之裁處權，依行政罰法第二十七條規定，因三年期間之經過而消滅。惟考量實務運作情形，另增訂第二十二條之三申訴期限相關規定，爰增訂第四項，定明最高負責人裁處權時效起算之特別規定，以地方主管機關收受申訴之日起算裁處權時效，俾落實職場霸凌行為人處罰之規定。"},{"bill":"202110164930000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、修正條文第三十二條第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正所引項次。"},{"bill":"202110166930000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、修正條文第三十二條第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正所引項次。"},{"bill":"202110166940000","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","note":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、修正條文第三十二條第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正所引項次。"}],"changed":true,"final":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。","finalWhy":"一、配合修正條文第二十二條增列勞工健康服務專業機構得辦理勞工健康保護事項，增訂其處罰規定，餘配合款次變更。\n二、第一款至第三款未修正；第四款至第五款配合第四款之增訂移列為第五款至第六款，第五款並配合修正條文第三十二條修正所引項次。","review":{"note":"照行政院提案通過","text":"有下列情形之一者，予以警告或處新臺幣六萬元以上三十萬元以下罰鍰，並得限期令其改正；屆期未改正或情節重大者，得撤銷或廢止其認可，或定期停止其業務之全部或一部：\n一、驗證機構違反中央主管機關依第八條第五項規定所定之辦法。\n二、監測機構違反中央主管機關依第十二條第五項規定所定之辦法。\n三、醫療機構違反第二十條第四項及中央主管機關依第二十條第五項規定所定之辦法。\n四、勞工健康服務專業機構違反中央主管機關依第二十二條第三項規定所定之規則。\n五、訓練單位違反中央主管機關依第三十二條第三項規定所定之規則。\n六、顧問服務機構違反中央主管機關依第三十六條第三項規定所定之規則。"}},{"no":"第四十九條","current":"有下列情形之一者，得公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、訓練單位或顧問服務機構之名稱、負責人姓名：\n一、發生第三十七條第二項之災害。\n二、有第四十條至第四十五條、第四十七條或第四十八條之情形。\n三、發生職業病。","versions":[{"bill":"202110060960000","text":"有下列情形之一者，由直轄市、縣（市）主管機關報請中央主管機關公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、訓練單位或顧問服務機構之名稱、負責人姓名、處分期日、違反條文、罰鍰金額、職業災害類型、行業別、發生日期及罹災人數：\n一、發生第三十七條第二項之災害。\n二、有第四十條至第四十五條、第四十七條或第四十八條之情形。\n三、發生職業病。\n中央主管機關應建置網際網路查詢系統，供不特定人查詢前項公布事項。","note":"一、配合一百零九年五月二十二日修正之勞動基準法第八十條之一第一項規定新增公布「處分期日」、「違反條文」及「罰鍰金額」等事項，爰於第一項新增「、處分期日、違反條文及罰鍰金額」等文字，俾保障受雇工作者之勞動資訊獲知權益。\n二、考量勞動部現已建置「違反勞動法令事業單位（雇主）查詢系統」，因此由直轄市、縣（市）主管機關統一報請中央主管機關公布，並提供民眾一站式查詢服務較為妥適，爰修正第一項、新增第二項規定。"},{"bill":"202110072510000","text":"有下列情形之一者，應公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、訓練單位或顧問服務機構之名稱、負責人姓名，及處分金額、處分日期、違反條款與內容等其他相關資訊：\n一、發生第三十七條第二項之災害。\n二、有第四十條至第四十五條、第四十七條或第四十八條之情形。\n三、發生職業病。","note":"一、為保障勞工勞動權益，促使違法事業單位更正改善過去之缺失，且敦促與預防未來再次違反本法之規範，以排除職業環境中，安全衛生設施不良、安全衛生管理不全或安全衛生監督與檢查不周等權益保障不足之危險。\n二、為保障勞工勞動權益，提早發現或預防職業病與職災，公布事業單位之相關違反資訊，除有排除權益保障不足之危險，且同時保障社會大眾知之權利，增進社會公共利益及安全，適時開放政府資訊以避免個資保護成為違法事業單位之擋箭牌，應以予修正。\n三、此外，為昭社會之公信，除公布事業單位與相關機構之名稱與姓名外，其他處分金額、處分日期或違反條款與內容等相關資訊亦有公告之必要。主管機關得彙整其他勞動基準法、性別工作平等法或各縣市政府建置公告專區之公告格式，整合違反法令公告之內容，以齊一公告之資訊。"},{"bill":"202110127920000","text":"有下列情形之一者，應公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、訓練單位或顧問服務機構之名稱、負責人姓名、裁罰處分；發生職業災害者，並應公布職業災害類型、行業別、發生時間、地點及罹災人數：\n一、發生第三十七條第二項之災害。\n二、有第四十條至第四十五條、第四十七條或第四十八條之情形。\n三、發生職業病。","note":"一、勞動部已設置「違反勞動法令事業單位（雇主）查詢系統」供各界查詢違反職業安全衛生法之事業單位名稱、負責人等資訊，且各主管機關配合登載公布裁處資訊行之有年，現規定「得公布」修正為「應公布」，以符合實際。\n二、為加強督促不良之事業單位、雇主，且使受雇工作者得以於求職前或就業中隨時獲知事業單位或雇主有無違失紀錄，除應公布機構之名稱、負責人姓名之外，應公布裁罰處分情形；另有發生職業災害者，增加公布職業災害類型、行業別、發生時間、地點及罹災人數，爰修正第一項。"},{"bill":"202110161460000","text":"有下列情形之一者，應公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、勞工健康服務專業機構、訓練單位或顧問服務機構之名稱、負責人姓名；其經主管機關處以罰鍰者，應公布該罰鍰處分之處分期日、違反條文及罰鍰金額：\n一、發生第三十七條第二項之災害。\n二、有第四十條至第四十五條、第四十七條或第四十八條之情形。\n三、發生職業病。\n符合前項第一款或第二款情形，並應公布職業災害之發生日期、發生地及罹災人數。","note":"一、現行條文列為第一項：\n(一)勞動部已建置「違反勞動法令事業單位查詢系統」，相關資訊均已公開，爰將「得公布」修正為「應公布」，並增列勞工健康服務專業機構違規亦應公布。\n(二)增訂經主管機關裁罰者，應併公布處分期日、違反條文及罰鍰金額，以強化督促效果。\n(三)發生第三十七條第二項災害（含職業病）時，檢查確認違規者，應公布事業單位名稱及負責人姓名，併予明確化。\n二、增訂第二項，發生第三十七條第二項災害，或涉及第四十至四十五條、第四十七條或第四十八條之情形，並應公布災害日期、地點及罹災人數。"},{"bill":"201110158300000","text":"有下列情形之一者，應公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、勞工健康服務專業機構、訓練單位或顧問服務機構之名稱、負責人姓名；其經主管機關處以罰鍰者，應公布該罰鍰處分之處分期日、違反條文及罰鍰金額：\n一、發生第三十七條第二項之災害。\n二、有第四十條至第四十五條、第四十七條或第四十八條之情形。\n三、發生職業病。\n符合前項第一款或第二款情形，並應公布職業災害之發生日期、發生地及罹災人數。","note":"一、現行條文列為第一項：\n(一)勞動部已設置「違反勞動法令事業單位（雇主）查詢系統」供各界查詢違反職業安全衛生法之事業單位名稱、負責人等資訊，且各主管機關配合登載公布裁處資訊行之有年，爰修正序文「得公布」為「應公布」，以符合實際，並配合修正條文第二十二條及第四十八條之修正，於序文增訂勞工健康服務專業機構有違反所列事項者，應予公布之規定。\n(二)為加強督促不良之事業單位、雇主等，增訂經主管機關處以罰鍰者，併公布該罰鍰處分之處分期日、違反條文及罰鍰金額。\n(三)基於保障工作者安全及健康公益之必要及讓社會大眾適時獲取正確資訊，第一款所指情形，係指勞動檢查機構接獲災害通報並經派員檢查後，就事業單位違反本法相關規定致發生第三十七條第二項之災害（含職業病），即應依序文前段規定公布該事業單位之名稱、負責人姓名，併予敘明。\n二、第二項增訂發生第三十七條第二項之災害者或有第四十條至第四十五條、第四十七條或第四十八條之情形者，並應公布職業災害之發生日期、發生地及罹災人數。"},{"bill":"202110162130000","text":"有下列情形之一者，應公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、勞工健康服務專業機構、訓練單位或顧問服務機構之名稱、負責人姓名；其經主管機關處以罰鍰者，應公布該罰鍰處分之處分期日、違反條文及罰鍰金額：\n一、發生第三十七條第二項之災害。\n二、有第四十條至第四十五條、第四十七條或第四十八條之情形。\n三、發生職業病。\n符合前項第一款或第二款情形，並應公布職業災害之發生日期、發生地及罹災人數。","note":"一、現行條文列為第一項：\n(一)勞動部已設置「違反勞動法令事業單位（雇主）查詢系統」供各界查詢違反職業安全衛生法之事業單位名稱、負責人等資訊，且各主管機關配合登載公布裁處資訊行之有年，爰修正序文「得公布」為「應公布」，以符合實際，並配合修正條文第二十二條及第四十八條之修正，於序文增訂勞工健康服務專業機構有違反所列事項者，應予公布之規定。\n(二)為加強督促不良之事業單位、雇主等，增訂經主管機關處以罰鍰者，併公布該罰鍰處分之處分期日、違反條文及罰鍰金額。\n(三)基於保障工作者安全及健康公益之必要及讓社會大眾適時獲取正確資訊，第一款所指情形，係指勞動檢查機構接獲災害通報並經派員檢查後，就事業單位違反本法相關規定致發生第三十七條第二項之災害（含職業病），即應依序文前段規定公布該事業單位之名稱、負責人姓名，併予敘明。\n二、第二項增訂發生第三十七條第二項之災害者或有第四十條至第四十五條、第四十七條或第四十八條之情形者，並應公布職業災害之發生日期、發生地及罹災人數。"},{"bill":"202110162770000","text":"有下列情形之一者，應公布其事業單位、雇主、代行檢查機構、驗證機構、監測機構、醫療機構、勞工健康服務專業機構、訓練單位或顧問服務機構之名稱、負責人姓名；其經主管機關處以罰鍰者，應公布該罰鍰處分之處分期日、違反條文及罰鍰金額：\ 位及有關團體辦理之。\n直轄市與縣（市）主管機關及各目的事業主管機關應積極推動職業安全衛生業務；中央主管機關得訂定績效評核及獎勵辦法。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第五十一條","current":"自營作業者準用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條有關雇主之義務及罰則之規定。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。","versions":[{"bill":"202110134470000","text":"第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條及第二十八條規定，於自營作業者亦適用之；其違反各該規定時，適用本法罰則章規定處罰之。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。","note":"新增第一項自營工作者亦適用第二十六條、第二十七條及第二十八條規定，要求其於交付承攬業務時，應落實危害相關的告知、承攬義務，避免因資訊落差、管理責任不明確造成職場危害。"},{"bill":"202110161460000","text":"自營作業者獨立作業或以其作業交付承攬時，適用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條、第二十八條及其罰則規定。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。","note":"一、考量自營作業者亦可能再交付承攬，為確保其履行危害告知及安全衛生管理義務，於第一項增列自營作業者獨立作業或交付承攬時，適用第二十六條至第二十八條規定，並作文字修正。\n二、第二項未修正。"},{"bill":"201110158300000","text":"自營作業者獨立作業或以其作業交付承攬時，適用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條、第二十八條及其罰則規定。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。","note":"一、考量實務面自營作業者亦有以其作業交付承攬之樣態，自營作業者於以其作業交付承攬時，仍應落實危害告知及承攬安全衛生管理等義務，爰於第一項增列自營作業者獨立作業或以其作業交付承攬時適用第二十六條、第二十七條及第二十八條規定，並配合法制體例作文字修正。\n二、第二項未修正。"},{"bill":"202110162130000","text":"自營作業者獨立作業或以其作業交付承攬時，適用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條、第二十八條及其罰則規定。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。","note":"一、考量實務面自營作業者亦有以其作業交付承攬之樣態，自營作業者於以其作業交付承攬時，仍應落實危害告知及承攬安全衛生管理等義務，爰於第一項增列自營作業者獨立作業或以其作業交付承攬時適用第二十六條、第二十七條及第二十八條規定，並配合法制體例作文字修正。\n二、第二項未修正。"},{"bill":"202110162770000","text":"自營作業者獨立作業或以其作業交付承攬時，適用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條、第二十八條及其罰則規定。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。","note":"一、考量實務面自營作業者亦有以其作業交付承攬之樣態，自營作業者於以其作業交付承攬時，仍應落實危害告知及承攬安全衛生管理等義務，爰於第一項增列自營作業者獨立作業或以其作業交付承攬時適用第二十六條、第二十七條及第二十八條規定，並配合法制體例作文字修正。\n二、第二項未修正。"},{"bill":"20211016360 ":true,"final":"自營作業者獨立作業或以其作業交付承攬時，適用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條、第二十八條及其罰則規定。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。","finalWhy":"一、考量實務面自營作業者亦有以其作業交付承攬之樣態，自營作業者於以其作業交付承攬時，仍應落實危害告知及承攬安全衛生管理等義務，爰於第一項增列自營作業者獨立作業或以其作業交付承攬時適用第二十六條、第二十七條及第二十八條規定，並配合法制體例作文字修正。\n二、第二項未修正。","review":{"note":"照行政院提案通過","text":"自營作業者獨立作業或以其作業交付承攬時，適用第五條至第七條、第九條、第十條、第十四條、第十六條、第二十四條、第二十六條、第二十七條、第二十八條及其罰則規定。\n第二條第一款所定受工作場所負責人指揮或監督從事勞動之人員，於事業單位工作場所從事勞動，比照該事業單位之勞工，適用本法之規定。但第二十條之體格檢查及在職勞工健康檢查之規定，不在此限。"}},{"no":"第五十一條之一","current":null,"versions":[{"bill":"202110161460000","text":"事業單位以數位方式經營商品交易或運送，且交付無僱傭關係之個人親自履行外送作業時，適用第五條第一項、第六條、第三十二條第一項、第三十三條、第三十七條第二項及其罰則規定。","note":"一、本條新增。\n二、鑑於新興外送經濟快速發展，外送人員因限時壓力常發生災害，屬高風險族群，職安保障不足。\n三、現行《職業安全衛生設施規則》已要求提供安全帽、反光標示、危害防止計畫及合理分派工作等措施。\n四、為強化外送人員之作業危害預防與身心健康保障，爰增訂本條。"},{"bill":"201110158300000","text":"事業單位以數位方式經營商品交易或運送，且交付無僱傭關係之個人親自履行外送作業時，適用第五條第一項、第六條、第三十二條第一項、第三十三條、第三十七條第二項及其罰則規定。","note":"一、本條新增。\n二、考量商品消費之經濟模式快速發展，對從事商品運送至消費者端之個人職場安全衛生保障較缺乏，且囿於限時送交消費者之壓力，常造成災害之發生，實屬風險較高之族群。\n三、又查職業安全衛生設施規則第二百八十六條之三、第三百二十四條之七及第三百二十五條之一規定，已規範雇主使勞工從事外送作業或事業單位交付無僱傭關係之個人親自履行外送作業，應置備安全帽、反光標示等合理及必要之安全衛生防護設施、訂定外送作業危害防止計畫，以及應評估交通、天候狀況、送達件數、時間及地點等因素，採取適當措施，合理分派工作。\n四、為落實該等新經濟型態產業外送作業人員之作業危害預防及身心健康保護措施，爰增訂本條規定，以資周延。"},{"bill":"202110162130000","text":"事業單位以數位方式經營商品交易或運送，且交付無僱傭關係之個人親自履行外送作業時，適用第五條第一項、第六條、第三十二條第一項、第三十三條、第三十七條第二項及其罰則規定。","note":"一、本條新增。\n二、考量商品消費之經濟模式快速發展，對從事商品運送至消費者端之個人職場安全衛生保障較缺乏，且囿於限時送交消費者之壓力，常造成災害之發生，實屬風險較高之族群。\n三、又查職業安全衛生設施規則第二百八十六條之三、第三百二十四條之七及第三百二十五條之一規定，已規範雇主使勞工從事外送作業或事業單位交付無僱傭關係之個人親自履行外送作業，應置備安全帽、反光標示等合理及必要之安全衛生防護設施、訂定外送作業危害防止計畫，以及應評估交通、天候狀況、送達件數、時間及地點等因素，採取適當措施，合理分派工作。\n四、為落實該等新經濟型態產業外送作業人員之作業危害預防及身心健康保護措施，爰增訂本條規定，以資周延。"},{"bill":"202110162770000","text":"事業單位以數位方式經營商品交易或運送，且交付無僱傭關係之個人親自履行外送作業時，適用第五條第一項、第六條、第三十二條第一項、第三十三條、第三十七條第二項及其罰則規定。","note":"一、本條新增。\n二、考量商品消費之經濟模式快速發展，對從事商品運送至消費者端之個人職場安全衛生保障較缺乏，且囿於限時送交消費者之壓力，常造成災害之發生，實屬風險較高之族群。\n三、又查職業安全衛生設施規則第二百八十六條之三、第三百二十四條之七及第三百二十五條之一規定，已規範雇主使勞工從事外送 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照

/* ---------- 歷程與逐字稿 ---------- */
const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
const PARTY = D.parties || {};
const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));
  return p;
}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = el('div', {class: 'toast', role: 'status', text: msg});
  document.body.append(t); setTimeout(() => t.remove(), 4500);
}
function copyHere(id) {
  const url = location.href.split('#')[0] + '#' + id;
  const ok = () => toast('已複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言，可以往前往後讀。');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, () => prompt('複製這個連結', url));
  else prompt('複製這個連結', url);
  history.replaceState(null, '', '#' + id);
}
function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {
  box.textContent = '';

  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);

      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});
      d.dataset.fp = fp(t.s + '|' + (t.b.find(x => typeof x === 'string') || '').slice(0, 30));

          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));
          into.append(el('div', {class: 'readnote'}, btn));
        } else if (b.out) into.append(el('div', {class: 'readnote ref', text: '這個提案最後沒有送進院會二讀，本頁沒有收錄它的逐條對照。'}));
      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };

  });

  const chips = el('div', {class: 'chips'});

  idx.append(chips);
  box.append(idx, finder(turns), turns);
}
