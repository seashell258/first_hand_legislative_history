<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>職業安全衛生法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

</div>

與各級承攬人之安全衛生管理責任，增列工作場所、設備出租或出借者之危害告知責任，以及定明特定機械操作人員、自營作業者等防災職責，並透過提高有期徒刑、罰金及行政罰鍰上限遏止不法，以符合社會期待。又因應近期社會發生數起職場霸凌事件，引發社會關注職場霸凌防治法制不足議題，現行本法以預防職場不法侵害為重點，勞動檢查不涉及個案調查認定，對於最高負責人如為行為人，欠缺外部申訴、調查機制及對行為人之處分等疑慮，經參考各國法制並綜合各界多數專家及團體代表意見，增訂職場霸凌防治專章，強化相關法制。是否有當？敬請公決。","arts":["第九條","第十五條之一","第二十二條","第二十二條之一","第二十二條之二","第二十二條之三","第二十三條","第二十四條","第二十六條","第二十七條","第二十七條之一","第三十二條","第三十九條","第四十條","第四十一條","第四十三條","第四十四條","第四十五條","第四十六條","第四十八條","第四十九條","第五十一條","第五十一條之一"]}],"arts":[{"no":"第一條","current":"為防止職業災害，保障工作者安全及健康，特制定本法；其他法律有特別規定者，從其規定。","versions":[{"bill":"202110109180000","text":"為防止職業災害，保障工作者安全及身心健康，特制定本法；其他法律有特別規定者，從其規定。","note":"現行條文中，關於心理衛生描述仍有不足，調整文字明確納入心理衛生項目。"},{"bill":"202110119990000","text":"為防止職業災害，保障工作者安全及身心健康，特制定本法；其他法律有特別規定者，從其規定。","note":"酌修文字內容。"},{"bill":"202110164360000","text":"為防止職業災害及勞動場所發生不法侵害，保障工作者安全及健康，特制定本法；其他法律有特別規定者，從其規定。","note":"一、本條規定立法目的。\n二、配合增訂第二章之一職場霸凌之防治，爰為本條立法目的之修正。\n三、「勞動場所」採自職業安全衛生法施行細則第五條各項定義，本修正草案增訂第二條第七款擬為法律明文定義。係指規定於勞動契約存續中，由雇主所提示，使勞工履行契約提供勞務之場所、及其他受工作場所負責人指揮或監督從事勞動之人員，實際從事勞動之場所。相較於本法另行規定之工作場所、作業場所，為勞動契約履行之最大場域範圍。\n四、「不法之侵害」援引自第六條第二項第三款，意即雇主或他人違反法律規定以造成工作者身體或精神之侵害。本草案增訂第二章之一，係屬不法侵害樣態之一。因民意有專章立法以完備雇主義務、防治措施、申訴、調查及保護措施、與救濟機制。故將勞工於勞動場所執行職務，因事業單位人員利用職務或權勢關係，逾越業務上必要且合理範圍，持續以冒犯、威脅、冷落、孤立或侮辱等之言詞或行為，致其身心健康遭受危害，此特定樣態為特別之立法。"}],"changed":false,"final":"為防止職業災害，保障工作者安全及健康，特制定本法；其他法律有特別規定者，從其規定。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第二條","current":"本法用詞，定義如下：\n一、工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n二、勞工：指受僱從事工作獲致工資者。\n三、雇主：指事業主或事業之經營負責人。\n四、事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n五、職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡。","versions":[{"bill":"202110109180000","text":"本法用詞，定義如下：\n一、工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n二、勞工：指受僱從事工作獲致工資者。\n三、雇主：指事業主或事業之經營負責人。\n四、事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n五、職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動相關心理壓力事件，及其他職業上原因引起之工作者精神或身體疾病、傷害、失能或死亡。\n六、敵意環境：指利用其職權、業務權力或不對等權力關係，造成他人或勞動環境不利之影響，使他人人格尊嚴受損、心生畏怖、感受敵意、冒犯或身心壓力。","note":"一、現行條文中，關於心理衛生描述仍有不足，調整文字明確納入心理衛生項目。\n二、新增敵意環境之定義。"},{"bill":"202110119990000","text":"本法用詞，定義如下：\n一、工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n二、勞工：指受僱從事工作獲致工資者。\n三、雇主：指事業主或事業之經營負責人。\n四、事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n五、職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動相關心理壓力事件，及其他職業上原因引起之工作者精神或身體疾病、傷害、失能或死亡。\n六、敵意環境：指利用其職權、業務權力或不對等權力關係，造成他人或勞動環境不利之影響，使他人人格尊嚴受損、心生畏怖、感受敵意、冒犯或身心壓力。","note":"調整文字明確納入心理衛生項目，並新增敵意環境之定義。"},{"bill":"202110128290000","text":"本法用詞，定義如下：\n一、工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n二、勞工：指受僱從事工作獲致工資者。\n三、雇主：指事業主或事業之經營負責人。代表雇主行使管理權之人或代表雇主處理有關受僱者事務之人，視同雇主。要派單位使用派遣勞工時，視為第二十二條之一至第二十二條之八規定之雇主。\n四、事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n五、職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡。","note":"一、為明確雇主定義，符合實務現場樣態，爰於本條第一項第三款增列代表雇主行使管理權或處理勞工事務之人視同雇主，參酌《性別工作平等法》第三條，明定實際管理者應負相關責任，以強化職場霸凌事件之申訴與處理效力。\n二、另為保障派遣勞工於要派單位工作期間，如遭受職場霸凌時得向要派單位提出申訴，明定於本法新增第二十二條之一至第二十二條之八之有關職場霸凌防治規定中，應視要派單位為雇主，賦予其相應之責任與義務。"},{"bill":"202110132410000","text":"本法用詞，定義如下：\n一、工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n二、勞工：指受僱從事工作獲致工資者。\n三、雇主：指事業主或事業之經營負責人。\n四、事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n五、職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡。\n六、職場霸凌：指勞工於勞動場所執行職務，因其事業單位人員利用職務或權勢等關係，逾越業務上必要且合理範圍，以冒犯、威脅、冷落、孤立、侮辱或其他不當之言詞或行為，致其身心健康遭受危害。","note":"一、新增第一項第六款。\n二、考量職業安全衛生法內，並未明確定義職場霸凌之內涵，以及相關規範與處理程序，導致實務上職場霸凌常有內部隱瞞之狀況，法院對於職場霸凌主張亦多無具體明確之判斷與見解，導致鮮少以勞工遭職場霸凌權利受損而做成判決。\n三、考量職場霸凌對我國勞工之身心危害甚巨，爰修正本條，納入職場霸凌之定義，以利主管機關針對職場霸凌防治、規範雇主責任、事前預防、事後申訴、諮商與支持服務等事項制定相關規範。"},{"bill":"202110164360000","text":"本法用詞，定義如下：\n一、工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n二、勞工：指受僱從事工作獲致工資者。\n三、雇主：指事業主或事業之經營負責人。\n四、事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n五、事業單位人員：指雇主、各級主管、受僱勞工及其他受工作場所負責人指揮或監督從事勞動之人員，其彼此間之職務存有平行、上對下或下對上之關係。\n六、職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡。\n七、勞動場所：指於勞動契約存續中，由雇主指揮，使勞工履行契約提供勞務之場所；自營作業者實際從事勞動之場所；及其他受工作場所負責人指揮或監督從事勞動之人員，實際從事勞動之場所。\n八、工作場所：指勞動場所中，接受雇主或代理雇主指示處理有關勞工事務之人所能支配、管理之場所。\n九、作業場所：指工作場所中，從事特定工作目的之場所。","note":"一、本條規定本法用詞定義。\n二、增訂第五款事業單位人員之定義，以因應增訂第二章之一職場霸凌防治專章，明確界定職場霸凌申訴案件之關係人，以為職場霸凌案件之定性。\n三、勞動場所、工作場所、作業場所，因未有法律明文之定義規定，難以避免觀念混淆。為明確定義係將職業安全衛生法施行細則第五條各項分別列於第七款至第九款，即：\n(一)增訂第七款勞動場所，為本法第二條第一項第五款、第三十六條第一項、第三十七條第二項以為界定雇主責任場域之用詞，援引前述施行細則第五條第一項規定文字。\n(二)增訂第八款工作場所，為本法第二條第一項第一款、第十七條、第十八條第一項、第二十三條第二項、第二十七條第一項第一款、第三款、第三十七條第一項、第三項、第三十八條、第五十一條，以為界定雇主責任場域之用詞，援引前述施行細則第五條第二項規定文字。\n(三)增訂第九款作業場所，為本法第六條第一項第五款、第十二條第一項、第三項、第五項、第二十一條第一項，以為界定雇主責任場域之用詞，援引前述施行細則第五條第二項規定文字。"}],"changed":true,"final":"本法用詞，定義如下：\n一、工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n二、勞工：指受僱從事工作獲致工資者。\n三、雇主：指事業主或事業之經營負責人。\n四、事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n五、職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡。\n六、勞動場所：指於勞動契約存續中，由雇主所提示，使勞工履行契約提供勞務之場所；自營作業者實際從事勞動之場所；及其他受工作場所負責人指揮或監督從事勞動之人員，實際從事勞動之場所。\n七、工作場所：指勞動場所中，接受雇主或代理雇主指示處理有關勞工事務之人所能支配、管理之場所。\n八、作業場所：指工作場所中，從事特定工作目的之場所。","finalWhy":"考量「勞動場所」、「工作場所」及「作業場所」定義雖已於本法施行細則第五條明定，惟為提升法規可讀性，利於公眾查詢及事業單位依循，避免實務上產生名詞混淆，爰將上開定義移列至第六款至第八款明定之。","review":{"note":"照委員林月琴等21人提案修正通過","text":"本法用詞，定義如下：\n一、工作者：指勞工、自營作業者及其他受工作場所負責人指揮或監督從事勞動之人員。\n二、勞工：指受僱從事工作獲致工資者。\n三、雇主：指事業主或事業之經營負責人。\n四、事業單位：指本法適用範圍內僱用勞工從事工作之機構。\n五、職業災害：指因勞動場所之建築物、機械、設備、原料、材料、化學品、氣體、蒸氣、粉塵等或作業活動及其他職業上原因引起之工作者疾病、傷害、失能或死亡。\n六、勞動場所：指於勞動契約存續中，由雇主所提示，使勞工履行契約提供勞務之場所；自營作業者實際從事勞動之場所；及其他受工作場所負責人指揮或監督從事勞動之人員，實際從事勞動之場所。\n七、工作場所：指勞動場所中，接受雇主或代理雇主指示處理有關勞工事務之人所能支配、管理之場所。\n八、作業場所：指工作場所中，從事特定工作目的之場所。"}},{"no":"第四條","current":"本法適用於各業。但因事業規模、性質及風險等因素，中央主管機關得指定公告其適用本法之部分規定。","versions":[{"bill":"202110082400000","text":"本法適用於各業，包含公務人員、教育人員及軍職人員。但因事業規模、性質及風險等因素，中央主管機關得指定公告其適用本法之部分規定。","note":"基於國際勞工組織（ILO）所頒布之國際勞工公約是世界各會員國或非會員國如我國重要制定勞動法規之依據，因此ILO第190號2019年暴力及騷擾公約第二條第二項指出「本公約適用於所有之部門，不論是私營或公營部門，包括正式與非正式經濟領域，以及都會或農村地區」，於我國亦應視為重要立法依據。爰修正本條，將本法適用保障之對象，不應有勞工或公務員之區別，遂於本條新增公務人員、教育人員及軍職人員於適用範圍。"},{"bill":"202110134470000","text":"本法適用於各業，包含公務人員。但因事業規模、性質及風險等因素，中央主管機關得指定公告其適用本法之部分規定。","note":"職業安全衛生法之保障應同時涵蓋公、私部門人員，爰修正本條條文，使我國公務人員與一般勞工一體適用職安法。"},{"bill":"202110139920000","text":"本法適用於各業，包含各類公務員。但因事業規模、性質及風險等因素，中央主管機關得指定公告其適用本法之部分規定。","note":"一、現行「公務人員安全及衛生防護辦法」即規定各機關應組成「防護小組」防治、調查及處理員工遭受騷擾、恐嚇及威脅等事件，行政院人事行政總處雖訂有「員工職場霸凌防治與處理建議作為」及「員工職場霸凌處理標準作業流程」。然而保訓會委員職安相關專業不足，與勞動部、職安署相比下，也毫無量能與實務經驗處理，更毫無外部監督管道。\n二、職場不法侵害事件不分公私部門，也不應分職業類別，依上述精神修法《職業安全衛生法》第四條本法適用於各業，包含各類公務員，將所有職業的受僱者納入。"}],"changed":false,"final":"本法適用於各業。但因事業規模、性質及風險等因素，中央主管機關得指定公告其適用本法之部分規定。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第六條","current":"本雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防。\n四、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。","versions":[{"bill":"202110082400000","text":"本雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防，並建立申訴、調查及處理程序。\n四、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。","note":"一、雖本法於2013年進行全文修正時，有將受僱者於職場遭受主管或同事利用職務或地位上的優勢予以不當之對待，或遭受顧客、服務對象、其他相關人士之肢體攻擊、言語侮辱、恐嚇、威脅等霸凌或暴力行為，所導致的精神或身體上傷害納入雇主應提供預防的安全衛生措施範圍內，而於本條第二項修訂相關規範，勞動部並訂有「執行職務遭受不法侵害預防指引」。\n二、然而，指引僅為行政指導之內容，並無法規強制力，其內所規劃各項事後處置，如「職場不法侵害事件處理流程圖」等，僅係讓事業單位參考之用，並無拘束力，導致現行職場實務上，屢屢發生受僱者遭受職場霸凌事件，卻難以申訴救濟並獲得心理上之平復等問題。\n三、更有甚者，事業單位組成職場霸凌事件處理小組之部分成員與霸凌行為人關係密切，導致受霸凌者擔憂無法獲得或實際上無法獲得公平公正的調查及救濟，而懼怕提出霸凌救濟等狀況亦屢屢發生。\n四、綜上，爰修正本條第二項第三款之規定，參酌《性別平等工作法》有關職場性騷擾之規範，除既有雇主對於受僱者執行職務因他人行為遭受身體或精神不法侵害之預防外，增訂雇主應建立申訴、調查及處理程序規定，以增加法規範密度及強度。"},{"bill":"202110102330000","text":"雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防。\n四、職場霸凌之防範與處置。\n五、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。","note":"一、新增第二項第四款\n二、職場霸凌定義為：「發生於職場或執行業務上，由雇主、上下屬或同儕間對特定個人或團體，持續所為之行為，且該行為逾越職務或業務上合理性，並造成當事人之生理、心理損害或使其工作環境惡化。但損害情節重大者，不以持續發生為必要。」\n三、中央主管機關應於修法通過後一年內，針對職場霸凌防治，如何規範雇主之責任、事前預防、事後申訴、諮商與支持服務等事項制定相關規範。"},{"bill":"202110109180000","text":"雇主或管理人員負有確保職場友善及避免敵意環境之責任。\n雇主對下列事項應有符合規定之必要身心安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之身心安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防。\n四、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之身心安全衛生設備與措施之標準及規則，由中央主管機關定之。","note":"一、雇主或勞工直接管理人員應負有職場管理之責任，確保職場友善環境，避免敵意環境造成勞工之身心衛生安全，若直接管理人員即為造成敵意環境之因素，應由更高階管理人員或雇主負擔應有之責任。\n二、現行條文中，關於心理衛生描述仍有不足，調整文字明確納入心理衛生項目。"},{"bill":"202110119990000","text":"雇主或管理人員負有確保職場友善及避免敵意環境之責任。\n雇主對下列事項應有符合規定之必要身心安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之身心安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防。\n四、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之身心安全衛生設備與措施之標準及規則，由中央主管機關定之。","note":"一、雇主或勞工直接管理人員應負有職場管理之責任，確保職場友善環境，避免敵意環境造成勞工之身心衛生安全，若直接管理人員即為造成敵意環境之因素，應由更高階管理人員或雇主負擔應有之責任。\n二、現行條文中，關於心理衛生描述仍有不足，調整文字明確納入心理衛生項目。"},{"bill":"202110132240000","text":"雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防。\n四、避難、急救、休息或其他為保護勞工身心健康之事項。\n五、建立防制職場霸凌申訴及調查處理機制，並採取必要措施保護受害人。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。","note":"一、新增第二項第五款。\n二、近年台灣社會對於職場霸凌問題日增關注，根據勞安所調查，約有5.8%受僱勞工、42萬8962名勞工過去曾遭遇職場霸凌情形，但多數事業單位尚未建立正式處理流程。現行法律僅就身體安全防護有具體規定，對心理健康之保障不足。\n三、導入預防、通報與調查三層機制，不僅要求事後處理，更重視預防與教育訓練，以建立健康、尊重與支持的職場文化，減少勞資爭議與社會成本。"},{"bill":"202110135320000","text":"雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防。\n四、職場霸凌之防範與處置。\n五、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。","note":"一、新增第二項第四款，為有效遏止職場霸凌之發生，保護勞工身心健康，雇主對於職場霸凌之防範與處置應負責任。\n二、原第二項第四款移列為第五款。"},{"bill":"202110134470000","text":"雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防，並建立申訴、調查及處理程序。\n四、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。","note":"一、我國職場危害勞工身心健康因子有多元化趨勢，除了傳統易於認定造成職場安全危害的高危險性作業環境外，對勞工之精神、心理健康之侵害也更受到重視。但其判定更為困難、性質更為隱性、且容易在權勢結構下使弱勢勞工失去進行申訴等權益。\n二、現有勞動部「執行職務遭受不法侵害預防指引」僅提供雇主作為措施參考，缺乏強制規範效力，導致勞工遭受不法侵害時常求助無門，甚至於嘗試提起救濟時受到來自雇主方的二度傷害。\n三、故增設要求雇主承擔須建立申訴、調查及處理程序，作為員工執行職務時因他人行為遭受身體或精神不法侵害之處理與預防。"}],"changed":true,"final":"雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防，並建立申訴、調查及處理程序。\n四、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。","finalWhy":"一、鑑於近年服務業迭傳勞工遭受外部顧客或消費者（第三方）謾罵或羞辱等不當對待之事件，為強化事業單位對於外部第三方之不法侵害申訴、調查及處理機制，爰修正第二項第三款執行職務因他人行為遭受身體或精神不法侵害預防之規定，增列雇主應建立申訴、調查及處理程序之安全衛生措施，以維護勞工之安全及健康。\n二、第一項及第三項未修正。","review":{"note":"照台灣民眾黨黨團提案及委員劉建國等3人所提修正動議修正通過","text":"雇主對下列事項應有符合規定之必要安全衛生設備及措施：\n一、防止機械、設備或器具等引起之危害。\n二、防止爆炸性或發火性等物質引起之危害。\n三、防止電、熱或其他之能引起之危害。\n四、防止採石、採掘、裝卸、搬運、堆積或採伐等作業中引起之危害。\n五、防止有墜落、物體飛落或崩塌等之虞之作業場所引起之危害。\n六、防止高壓氣體引起之危害。\n七、防止原料、材料、氣體、蒸氣、粉塵、溶劑、化學品、含毒性物質或缺氧空氣等引起之危害。\n八、防止輻射、高溫、低溫、超音波、噪音、振動或異常氣壓等引起之危害。\n九、防止監視儀表或精密作業等引起之危害。\n十、防止廢氣、廢液或殘渣等廢棄物引起之危害。\n十一、防止水患、風災或火災等引起之危害。\n十二、防止動物、植物或微生物等引起之危害。\n十三、防止通道、地板或階梯等引起之危害。\n十四、防止未採取充足通風、採光、照明、保溫或防濕等引起之危害。\n雇主對下列事項，應妥為規劃及採取必要之安全衛生措施：\n一、重複性作業等促發肌肉骨骼疾病之預防。\n二、輪班、夜間工作、長時間工作等異常工作負荷促發疾病之預防。\n三、執行職務因他人行為遭受身體或精神不法侵害之預防，並建立申訴、調查及處理程序。\n四、避難、急救、休息或其他為保護勞工身心健康之事項。\n前二項必要之安全衛生設備與措施之標準及規則，由中央主管機關定之。"}},{"no":"第六條之一","current":null,"versions":[{"bill":"202110082400000","text":"受僱者遭受前條第二項第三款不法侵害，應向雇主提起申訴。但有下列情形之一者，得逕向地方主管機關提起申訴：\n一、被申訴人屬最高負責人或僱用人。\n二、雇主未處理或不服被申訴人之雇主所為調查或懲戒結果。\n受僱者依前項但書規定，向地方主管機關提起申訴之期限，應依下列規定辦理：\n一、被申訴人非具權勢地位：自知悉不法侵害時起，逾二年提起者，不予受理；自該行為終了時起，逾五年者，亦同。\n二、被申訴人具權勢地位：自知悉不法侵害時起，逾三年提起者，不予受理；自該行為終了時起，逾七年者，亦同。\n有下列情形之一者，依各款規定辦理，不受前項規定之限制。但依前項規定有較長申訴期限者，從其規定：\n一、不法侵害發生時，申訴人為未成年，得於成年之日起三年內申訴。\n二、不法侵害發生於本法施行前者，得於本法施行之日起三年內申訴。\n三、被申訴人為最高負責人或僱用人，申訴人得於離職之日起一年內申訴。但自該行為終了時起，逾十年者，不予受理。\n申訴人依第一項但書規定向地方主管機關提起申訴後，得於處分作成前，撤回申訴。撤回申訴後，不得就同一案件再提起申訴。","note":"一、本條新增。\n二、參酌《性別平等工作法》第三十二條之一，強化職場霸凌或暴力事件之雇主內部申訴制度功能，建立外部公權力申訴調查機制，讓可信賴之申訴調查程序可供被害人進行救濟。\n三、爰於第一項定明受僱者遭受職場霸凌或職場暴力之不法侵害時，原則循內部申訴制度向雇主提起申訴，然若職場霸凌或職場暴力之行為人為事業單位最高負責人或僱用人時，其內部申訴制度能否有效運作，不無疑慮。故於第一項但書第一款定明受僱者得逕向地方主管機關申訴，以強化其申訴權益。此外，對於業經雇主調查之申訴案件，申訴人如不服雇主對事件之調查或對行為人之懲戒結果時，於第一項但書第二款定明申訴人於此情形亦得逕向地方主管機關申訴。\n四、訂定第二項，定明受僱者遭遇職場霸凌或職場暴力事件之申訴期限，並依被申訴人是否具權勢地位分列二款規範：\n(一)被申訴人不具權勢地位，於第一款規定申訴期限為自知悉不法侵害行為時起二年內；但自行為終了時起，逾五年者，不得提出，以維護法安定性，並兼顧被申訴人之權益。\n(二)另考量被申訴人如具權勢地位，申訴人受限其關係，不易向外求助，恐逾越申訴時效，爰於第二款定明被申訴人如具權勢地位，申訴期限為自知悉不法侵害行為時起三年內；但自行為終了時起，逾七年者，不得提出。\n五、訂定第三項：\n(一)考量未成年之不法侵害被害人，可能因年幼不知權益受損，爰於第一款定明得於成年之日起三年內申訴之期限特別規定。\n(二)鑒於不法侵害之被害人因過往無法信任職場霸凌申訴機制或可能礙於人際關係或權勢地位而未能及時提出申訴，遲至本次新法修正後，始敢提出申訴，爰於第二款定明申訴之期限特別規定。\n(三)鑒於職場不法侵害之被害人，可能礙於人際關係或權勢地位，未能於不法侵害事件發生後及時提起申訴，遲至離職後，工作場所權勢地位關係消滅後，始敢提出申訴，爰於第三款定明申訴之期限特別規定。\n六、參酌訴願法第六十條，於第四項定明申訴人提起申訴後，得於處分作成前，撤回申訴；惟撤回申訴後，不得就同一案件再提起申訴，以維持法安定性。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六條之二","current":null,"versions":[{"bill":"202110082400000","text":"地方主管機關為調查前條第一項但書之不法侵害申訴案件，得請專業人士或團體協助；必要時，得請求警察機關協助。\n地方主管機關依本法規定進行調查時，被申訴人、申訴人及受邀協助調查之個人或單位應配合調查，並提供相關資料，不得規避、妨礙或拒絕。\n地方主管機關依前條第一項第二款受理之申訴，經認定不法侵害行為成立或原懲戒結果不當者，得令行為人之雇主於一定期限內採取必要之處置。\n前條及前三項有關地方主管機關受理工作場所不法侵害申訴之範圍、處理程序、調查方式、必要處置及其他相關事項之辦法，由中央主管機關定之。\n不法侵害之被申訴人為最高負責人或僱用人時，於地方主管機關調查期間，申訴人得向雇主申請調整職務或工作型態至調查結果送達雇主之日起三十日內，雇主不得拒絕。","note":"一、本條新增。\n二、參酌《性別平等工作法》第三十二條之二，強化職場霸凌事件之調查、必要保護處置及補救措施，以提供被職場霸凌或職場暴力等不法侵害之被害人妥適保障。\n三、爰於第一項定明地方主管機關得請專業人士或團體協助，並得請警察機關協查，讓不法侵害之調查得以完善。\n四、第二項定明被申訴人、申訴人及相關人員或單位應有配合調查之義務，不得規避、妨礙或拒絕。\n五、第三項定明地方主管機關受理不服被申訴人之雇主所為調查或懲戒結果之申訴，就認定不法侵害行為成立或原懲戒結果不當者之後續處理原則，地方主管機關得令行為人之雇主於一定期限內採取必要之處置。\n六、第四項定明地方主管機關受理職場霸凌或職場暴力等不法行為侵害申訴處理辦法，授權由中央主管機關訂定之依據。\n七、不法侵害之被申訴人為最高負責人或僱用人時，恐申訴人於原工作場所中難與其保持適當區隔，爰於第五項定明允申訴人向雇主申請調整職務或留職停薪，各該期間最長可至調查結果送達雇主之日起三十日止，雇主不得拒絕，以妥善保護申訴人；不法侵害經調查屬實者，雇主應發給申訴人留職停薪期間之薪資。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第六條之三","current":null,"versions":[{"bill":"202110082400000","text":"公務人員、教育人員或軍職人員遭受不法侵害，且行為人為最高負責人者，應向上級機關（構）、所屬主管機關或監督機關申訴。\n前項所稱最高負責人或機關（構）、公立學校、各級軍事機關（構）、部隊、行政法人及公營事業機構各級主管涉及不法侵害行為，且情節重大，於進行調查期間有先行停止或調整職務之必要時，得由其上級機關（構）、所屬主管機關、監督機關，或服務機關（構）、公立學校、各級軍事機關（構）、部隊、行政法人或公營事業機構停止或調整其職務。但其他法律別有規定者，從其規定。\n私立學校校長或各級主管涉及不法侵害行為，且情節重大，於進行調查期間有先行停止或調整職務之必要時，得由學校所屬主管機關或服務學校停止或調整其職務。\n依前二項規定停止或調整職務之人員，其案件調查結果未經認定為不法侵害，或經認定為不法侵害但未依公務人員、教育人員或其他相關法律予以停職、免職、解聘、停聘或不續聘者，得依各該法律規定申請復職，及補發停職期間之本俸（薪）、年功俸（薪）或相當之給與。\n機關政務首長、軍職人員，其停止職務由上級機關或具任免權之機關為之。","note":"一、本條新增。\n二、參酌《性別平等工作法》第三十二條之三，對於公務人員、教育人員或軍職人員遭受不法侵害時，因上下隸屬權力關係較私部門更為緊密，故另定規範以為完整保障。\n三、如第十二條第八項第一款所定最高負責人涉及對公務人員、教育人員、軍職人員職場霸凌不法行為時，該等申訴事件應交由具指揮監督權限之上級機關（構）、所屬主管機關或監督機關處理，爰訂定第一項。至該項條文所定向所屬主管機關或監督機關申訴之情形，例如：機關（構）改制為公司組織之公營事業，或機關改制為行政法人，依公務人員相關任用法律繼續任用之公務人員，如以公營事業之股份有限公司董事長為被申訴人提出申訴，應向該公司所屬之主管機關提出；如以行政法人董（理）事長為被申訴人提出申訴，則應向該行政法人之監督機關提出，併予敘明。\n四、為避免權勢之不對等關係影響職場霸凌不法侵害案件之調查與相關人員職務之執行，爰於第二項定明，第十二條第八項第一款所定最高負責人或機關（構）、公立學校、各級軍事機關（構）、部隊、行政法人及公營事業機構之各級主管涉及不法侵害行為，且情節重大者，得停止其職務或依相關法令調整職務，以利調查。惟其他法律就相關程序另有規定者，從其規定，例如法官之停職係依法官法第四十三條等規定辦理。\n五、至私立學校部分，依私立學校法規定受學校主管機關之監督，爰於第三項定明私立學校校長或各級主管，依其身分，分別由學校所屬主管機關或服務學校停止或調整其職務，以利調查。\n六、第四項定明被申訴之最高負責人及各級主管，如經調查未有不法侵害行為，或經調查成立職場霸凌不法侵害，但未依公務人員、教育人員或其他相關法律（如公務人員考績法第十八條、公務員懲戒法第五條、教師法第十四條至第十六條及第十八條等）予以停職、免職、解聘、停聘、不續聘之情形，得依規定（如公務人員保障法等）申請復職，以維護被申訴人權益。至停職期間之薪俸，參酌公務員懲戒法、公務人員俸給法、教師法、教師待遇條例等規定，補發其停職期間全部本俸（薪）、年功俸（薪）。另其他非屬本法所稱公務人員或教育人員者，應補發相當之給與（例如私立學校校長非教師法、教師待遇條例適用或準用對象，其薪資由董事會決定）。\n七、第五項明定機關政務首長、軍職人員之停職由上級機關或具任免權之機關為之（例如陸海空軍軍官士官任職條例第十三條）。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第九條","current":"製造者、輸入者、供應者或雇主，對於未經型式驗證合格之產品或型式驗證逾期者，不得使用驗證合格標章或易生混淆之類似標章揭示於產品。\n中央主管機關或勞動檢查機構，得對公告列入應實施型式驗證之產品，進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。","versions":[{"bill":"202110161460000","text":"製造者、輸入者、供應者或雇主，對於有下列情事之產品，不得使用安全標示、驗證合格標章、易生混淆之類似標示或標章揭示於產品：\n一、未完成資訊申報網站登錄。\n二、未取得型式驗證合格。\n三、資訊申報網站登錄逾期或型式驗證逾期。\n製造者或輸入者對於完成資訊申報網站登錄或取得型式驗證合格之產品，應建立及保存產銷資料。\n中央主管機關或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。\n第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。","note":"一、現行第七條及第八條均屬源頭管理規定，惟僅第八條有後端管理依據，爰增訂第七條所定特定產品亦納入後端管理，以資周延。\n二、查驗時常發現製造者或輸入者未建立產銷清冊，致流向難追蹤，爰增訂第二項，要求建立並保存產品產製日期、型式、規格、數量、出廠日期、銷售對象等資料，以落實源頭管理。\n三、配合擴大後端管理範圍，修正第三項文字，使規範更明確。\n四、為利事業單位遵循，於第四項授權中央主管機關訂定產銷資料保存年限、產品抽驗、市場查驗及其他相關辦法。"},{"bill":"201110158300000","text":"製造者、輸入者、供應者或雇主，對於有下列情事之產品，不得使用安全標示、驗證合格標章、易生混淆之類似標示或標章揭示於產品：\n一、未完成資訊申報網站登錄。\n二、未取得型式驗證合格。\n三、資訊申報網站登錄逾期或型式驗證逾期。\n製造者或輸入者對於完成資訊申報網站登錄或取得型式驗證合格之產品，應建立及保存產銷資料。\n中央主管機關或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。\n第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。","note":"一、鑑於現行第七條及第八條均為中央主管機關指定或公告之機械、設備或器具安全之源頭管理規定，現行第一項僅就第八條所定特定產品之型式驗證定有後端管理機制作為執行依據，爰增訂第七條所定特定產品之申報登錄納入本條之後端管理機制，以資周延。\n二、配合管理查驗需求，勞動檢查機構實施市場查驗專案檢查時，常發現製造者或輸入者未建立產銷清冊，致無法追蹤所管制機械、設備或器具之流向，爰增訂第二項，要求製造者及輸入者應建立與保存產銷資料（內容包含產品之產製日期、型式、規格、數量、出廠日期、銷售對象等）規定，俾利查驗經中央主管機關指定或公告之機械、設備或器具之製售歷程及流佈，落實源頭管理之目的。\n三、配合第一項擴大後端管理執行範圍，爰修正第三項文字，以資明確。\n四、為使事業單位明瞭第二項及第三項相關規定之執行方式，爰於第四項定明第二項產銷資料應包括之內容與保存年限、第三項產品抽驗、市場查驗及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110162130000","text":"製造者、輸入者、供應者或雇主，對於有下列情事之產品，不得使用安全標示、驗證合格標章、易生混淆之類似標示或標章揭示於產品：\n一、未完成資訊申報網站登錄。\n二、未取得型式驗證合格。\n三、資訊申報網站登錄逾期或型式驗證逾期。\n製造者或輸入者對於完成資訊申報網站登錄或取得型式驗證合格之產品，應建立及保存產銷資料。\n中央主管機關或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。\n第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。","note":"一、鑑於現行第七條及第八條均為中央主管機關指定或公告之機械、設備或器具安全之源頭管理規定，現行第一項僅就第八條所定特定產品之型式驗證定有後端管理機制作為執行依據，爰增訂第七條所定特定產品之申報登錄納入本條之後端管理機制，以資周延。\n二、配合管理查驗需求，勞動檢查機構實施市場查驗專案檢查時，常發現製造者或輸入者未建立產銷清冊，致無法追蹤所管制機械、設備或器具之流向，爰增訂第二項，要求製造者及輸入者應建立與保存產銷資料（內容包含產品之產製日期、型式、規格、數量、出廠日期、銷售對象等）規定，俾利查驗經中央主管機關指定或公告之機械、設備或器具之製售歷程及流佈，落實源頭管理之目的。\n三、配合第一項擴大後端管理執行範圍，爰修正第三項文字，以資明確。\n四、為使事業單位明瞭第二項及第三項相關規定之執行方式，爰於第四項定明第二項產銷資料應包括之內容與保存年限、第三項產品抽驗、市場查驗及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110162770000","text":"製造者、輸入者、供應者或雇主，對於有下列情事之產品，不得使用安全標示、驗證合格標章、易生混淆之類似標示或標章揭示於產品：\n一、未完成資訊申報網站登錄。\n二、未取得型式驗證合格。\n三、資訊申報網站登錄逾期或型式驗證逾期。\n製造者或輸入者對於完成資訊申報網站登錄或取得型式驗證合格之產品，應建立及保存產銷資料。\n中央主管機關或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。\n第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。","note":"一、鑑於現行第七條及第八條均為中央主管機關指定或公告之機械、設備或器具安全之源頭管理規定，現行第一項僅就第八條所定特定產品之型式驗證定有後端管理機制作為執行依據，爰增訂第七條所定特定產品之申報登錄納入本條之後端管理機制，以資周延。\n二、配合管理查驗需求，勞動檢查機構實施市場查驗專案檢查時，常發現製造者或輸入者未建立產銷清冊，致無法追蹤所管制機械、設備或器具之流向，爰增訂第二項，要求製造者及輸入者應建立與保存產銷資料（內容包含產品之產製日期、型式、規格、數量、出廠日期、銷售對象等）規定，俾利查驗經中央主管機關指定或公告之機械、設備或器具之製售歷程及流佈，落實源頭管理之目的。\n三、配合第一項擴大後端管理執行範圍，爰修正第三項文字，以資明確。\n四、為使事業單位明瞭第二項及第三項相關規定之執行方式，爰於第四項定明第二項產銷資料應包括之內容與保存年限、第三項產品抽驗、市場查驗及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110163600000","text":"製造者、輸入者、供應者或雇主，對於有下列情事之產品，不得使用安全標示、驗證合格標章、易生混淆之類似標示或標章揭示於產品：\n一、未完成資訊申報網站登錄。\n二、未取得型式驗證合格。\n三、資訊申報網站登錄逾期或型式驗證逾期。\n製造者或輸入者對於完成資訊申報網站登錄或取得型式驗證合格之產品，應建立及保存產銷資料。\n中央主管機關或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。\n第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。","note":"一、為加強對機械、設備或器具安全之管理，於第一項增列第七條所定中央主管機關指定產品之後端管理機制。\n二、於第二項納入製造者建立、保存產銷資料之紀錄。\n三、於第四項明定產銷資料應包括之內容。"},{"bill":"202110165070000","text":"製造者、輸入者、供應者或雇主，對於有下列情事之產品，不得使用安全標示、驗證合格標章、易生混淆之類似標示或標章揭示於產品：\n一、未完成資訊申報網站登錄。\n二、未取得型式驗證合格。\n三、資訊申報網站登錄逾期或型式驗證逾期。\n製造者或輸入者對於完成資訊申報網站登錄或取得型式驗證合格之產品，應建立及保存產銷資料。\n中央主管機關或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。\n第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。","note":"一、鑑於現行第七條及第八條均為中央主管機關指定或公告之機械、設備或器具安全之源頭管理規定，現行第一項僅就第八條所定特定產品之型式驗證定有後端管理機制作為執行依據，爰增訂第七條所定特定產品之申報登錄納入本條之後端管理機制，以資周延。\n二、配合管理查驗需求，勞動檢查機構實施市場查驗專案檢查時，常發現製造者或輸入者未建立產銷清冊，致無法追蹤所管制機械、設備或器具之流向，爰增訂第二項，要求製造者及輸入者應建立與保存產銷資料（內容包含產品之產製日期、型式、規格、數量 或勞動檢查機構，得對前項產品進行抽驗及市場查驗，業者不得規避、妨礙或拒絕。\n第二項產銷資料應包括之內容、保存年限與其他相關事項，及前項產品抽驗、市場查驗及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第十五條之一","current":null,"versions":[{"bill":"202110161460000","text":"事業單位將一定規模以上之工程交付規劃或設計時，應使該規劃者、設計者依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n前二項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、近年工程案件規模漸大，高樓層與深開挖施工風險升高，重大職業災害比例持續偏高。現行規範僅限施工階段，未將工程業主責任納入，導致風險評估不足、安全經費編列不足及監督欠缺。\n三、比較英國、新加坡、韓國等國立法例，均要求業主於工程規劃、設計、施工階段進行風險評估，並採取預防措施。我國採購法雖有相關規範，但責任與罰則仍不完整。\n四、工程業主在規劃、設計、施工決策與資源分配上具主導地位，應與規劃者、設計者、施工者共同落實源頭管理。爰規定：\n(一)第一項：工程交付規劃或設計時，規劃者、設計者須進行風險分析、編列安全費用並製作安全分析報告。\n(二)第二項：工程交付施工時，施工者應依設計風險資訊，評估施工危害並納入施工計畫，採取必要預防措施。\n(三)第三項：授權中央主管機關訂定工程規模範圍、分析方法、安全圖說與計畫內容等執行辦法。"},{"bill":"201110158300000","text":"事業單位將一定規模以上之工程交付規劃者、設計時，應使該規劃者、設計者依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n前二項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、鑑於近年工程案件有朝向大規模、高樓層及深開挖之趨勢，致施工風險增加，職業災害比例逐年攀升，現行本法雖已規範營造事業單位於施工階段採取必要之安全衛生設備及措施之規定，其適用對象未包含工程業主（例如公共工程主辦機關、興建大型建築工程之不動產開發商、興建大型廠房之製造業、或興建金融中心之金融服務業等）。\n三、此外，實務上工程業主將工程之規劃、設計或施工等交付承攬時，未於規劃及設計階段消除職業災害風險，常未能善盡防止職業災害責任，僅於契約文件要求營造事業單位落實各項安全衛生設備及措施，未合理規劃風險較低之工址、工法及工期，且安全衛生經費普遍編列不足，並缺乏監督及審核機制，以致未能有效降低職業災害風險。\n四、查英國「工作安全衛生法（Health and Safety at Work Act）」、「工程（設計及管理）規則（The Construction〔Design and Management〕Regulations 2015）」、新加坡「工作場所安全衛生法（Workplace Safety and Health Act）」、「工作場所安全衛生（安全設計）規範（Workplace Safety and Health〔Design for Safety〕Regulations 2015）」及韓國「職業安全衛生法（Occupational Safety and Health Act）」等立法例，均要求業主將一定規模之工程交付設計或施工時，其設計者或施工者應於事前實施風險評估，消除危害根源，並採行必要之職業災害預防設備及措施，另我國政府採購法第七十條之一第一項規定，機關辦理工程規劃、設計應負有分析潛在施工危險，編製符合規定之安全衛生圖說及規範，並量化編列安全衛生費用之責。\n五、第五條第二項雖定有工程之設計者或施工者於設計、施工規劃階段應實施風險評估，致力防止發生職業災害，惟其責任未及於工程業主，且該條文屬一般責任並無相應罰責。\n六、工程業主具有決定規劃者、設計者或施工者良窳之選擇權，可為整體工程之工期及經費合理分配，審查規劃者、設計者或施工者之風險評估及處理等成果，並可運用契約推動整體工程之安全衛生管理，係營造工程安全設計及管理最為關鍵之權責單位。為使工程業主、規劃者、設計者及施工者等，於工程全生命週期各階段，共同依其規模特性及可能出現之作業危害，以源頭管理之概念，分析潛在施工風險，爰於第一項定明事業單位將一定規模以上之工程交付規劃或設計時，應使該規劃者或設計者落實安全衛生管理相關事項，依工程特性分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n七、第二項定明事業單位將上述工程交付施工時，應使該施工者於事前依設計者傳遞風險資訊，落實施工風險管理事項，包括依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n八、為使事業單位明瞭第一項及第二項相關規定之執行方式，爰於第三項定明一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110162130000","text":"事業單位將一定規模以上之工程交付規劃、設計時，應使該規劃者、設計者依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n前二項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、鑑於近年工程案件有朝向大規模、高樓層及深開挖之趨勢，致施工風險增加，職業災害比例逐年攀升，現行本法雖已規範營造事業單位於施工階段採取必要之安全衛生設備及措施之規定，其適用對象未包含工程業主（例如公共工程主辦機關、興建大型建築工程之不動產開發商、興建大型廠房之製造業、或興建金融中心之金融服務業等）。\n三、實務上工程業主將工程之規劃、設計或施工等交付承攬時，未於規劃及設計階段消除職業災害風險，常未能善盡防止職業災害責任，僅於契約文件要求營造事業單位落實各項安全衛生設備及措施，未合理規劃風險較低之工址、工法及工期，且安全衛生經費普遍編列不足，並缺乏監督及審核機制，以致未能有效降低職業災害風險。\n四、查英國「工作安全衛生法（Health and Safety at Work Act）」、「工程（設計及管理）規則（The Construction 〔Design and Management〕 Regulations 2015）」、新加坡「工作場所安全衛生法（Workplace Safety and Health Act）」、「工作場所安全衛生（安全設計）規範（Workplace Safety and Health 〔Design for Safety〕 Regulations 2015）」及韓國「職業安全衛生法（Occupational Safety and Health Act）」等立法例，均要求業主將一定規模之工程交付設計或施工時，其設計者或施工者應於事前實施風險評估，消除危害根源，並採行必要之職業災害預防設備及措施，另我國政府採購法第七十條之一第一項規定，機關辦理工程規劃、設計應負有分析潛在施工危險，編製符合規定之安全衛生圖說及規範，並量化編列安全衛生費用之責。\n五、第五條第二項雖定有工程之設計者或施工者於設計、施工規劃階段應實施風險評估，致力防止發生職業災害，惟其責任未及於工程業主，且該條文屬一般責任並無相應罰責。\n六、工程業主具有決定規劃者、設計者或施工者良窳之選擇權，可為整體工程之工期及經費合理分配，審查規劃者、設計者或施工者之風險評估及處理等成果，並可運用契約推動整體工程之安全衛生管理，係營造工程安全設計及管理最為關鍵之權責單位。為使工程業主、規劃者、設計者及施工者等，於工程全生命週期各階段，共同依其規模特性及可能出現之作業危害，以源頭管理之概念，分析潛在施工風險，爰於第一項定明事業單位將一定規模以上之工程交付規劃或設計時，應使該規劃者或設計者落實安全衛生管理相關事項，依工程特性分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n七、第二項定明事業單位將上述工程交付施工時，應使該施工者於事前依設計者傳遞風險資訊，落實施工風險管理事項，包括依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n八、為使事業單位明瞭第一項及第二項相關規定之執行方式，爰於第三項定明一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110162770000","text":"事業單位將一定規模以上之工程交付規劃、設計時，應使該規劃者、設計者依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n事業單位應使前項施工者依施工計畫書確實執行，並指派人員或委託專業機構監督及查證。\n前三項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項、人員或專業機構之資格條件、監督及查證內容及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、鑑於近年工程案件有朝向大規模、高樓層及深開挖之趨勢，致施工風險增加，職業災害比例逐年攀升，現行本法雖已規範營造事業單位於施工階段採取必要之安全衛生設備及措施之規定，惟其適用對象未包含工程業主（例如公共工程主辦機關、興建大型建築工程之不動產開發商、興建大型廠房之製造業、或興建金融中心之金融服務業等）。\n三、此外，實務上工程業主將工程之規劃、設計或施工等交付承攬時，未於規劃及設計階段消除職業災害風險，常未能善盡防止職業災害責任，僅於契約文件要求營造事業單位落實各項安全衛生設備及措施，未合理規劃風險較低之工址、工法及工期，且安全衛生經費普遍編列不足，並缺乏監督及審核機制，以致未能有效降低職業災害風險。\n四、查英國「工作安全衛生法（Health and Safety at Work Act）」、「工程（設計及管理）規則（The Construction〔Design and Management〕Regulations 2015）」、新加坡「工作場所安全衛生法（Workplace Safety and Health Act）」、「工作場所安全衛生（安全設計）規範（Workplace Safety and Health〔Design for Safety〕Regulations 2015）」及韓國「職業安全衛生法（Occupational Safety and Health Act）」等立法例，均要求業主將一定規模之工程交付設計或施工時，其設計者或施工者應於事前實施風險評估，消除危害根源，並採行必要之職業災害預防設備及措施，另我國政府採購法第七十條之一第一項規定，機關辦理工程規劃、設計應負有分析潛在施工危險，編製符合規定之安全衛生圖說及規範，並量化編列安全衛生費用之責。\n五、第五條第二項雖定有工程之設計者或施工者於設計、施工規劃階段應實施風險評估，致力防止發生職業災害，惟其責任未及於工程業主，且該條文屬一般責任並無相應罰責。\n六、工程業主具有決定規劃者、設計者或施工者良窳之選擇權，可為整體工程之工期及經費合理分配，審查規劃者、設計者或施工者之風險評估及處理等成果，並可運用契約推動整體工程之安全衛生管理，係營造工程安全設計及管理最為關鍵之權責單位。為使工程業主、規劃者、設計者及施工者等，於工程全生命週期各階段，共同依其規模特性及可能出現之作業危害，以源頭管理之概念，分析潛在施工風險，爰於第一項定明事業單位將一定規模以上之工程交付規劃或設計時，應使該規劃者或設計者落實安全衛生管理相關事項，依工程特性分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n七、第二項定明事業單位將上述工程交付施工時，應使該施工者於事前依設計者傳遞風險資訊，落實施工風險管理事項，包括依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n八、第三項定明事業單位於施工期間應指派人員或委託專業機構，監督及查證施工者依施工計畫書採取必要之安全衛生預防設備及措施，善盡工程業主採購與履約管理責任。\n九、為使事業單位明瞭第一項至第三項相關規定之執行方式，爰於第四項定明一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項、人員或專業機構之資格條件、監督及查證內容及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110163600000","text":"事業單位將一定規模以上之工程交付規劃、設計時，應使該規劃者、設計者依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n前二項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、為確保營造業勞工安全，於第二項明定一定規模以上之工程施工前應進行施工危害及安全衛生分析。\n三、於第三項明定，前項分析應納入施工計畫書。\n四、於第四項明定，中央主管機關應訂定第一、第二項之相關辦法。"},{"bill":"202110165070000","text":"事業單位將一定規模以上之工程交付規劃、設計時，應使該規劃者、設計者依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n前二項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、鑑於近年工程案件有朝向大規模、高樓層及深開挖之趨勢，致施工風險增加，職業災害比例逐年攀升，現行本法雖已規範營造事業單位於施工階段採取必要之安全衛生設備及措施之規定，其適用對象未包含工程業主（例如公共工程主辦機關、興建大型建築工程之不動產開發商、興建大型廠房之製造業、或興建金融中心之金融服務業等）。\n三、此外，實務上工程業主將工程之規劃、設計或施工等交付承攬時，未於規劃及設計階段消除職業災害風險，常未能善盡防止職業災害責任，僅於契約文件要求營造事業單位落實各項安全衛生設備及措施，未合理規劃風險較低之工址、工法及工期，且安全衛生經費普遍編列不足，並缺乏監督及審核機制，以致未能有效降低職業災害風險。\n四、查英國「工作安全衛生法（Health and Safety at Work Act）」、「工程（設計及管理）規則（The Construction 〔Design and Management〕 Regulations 2015）」、新加坡「工作場所安全衛生法（Workplace Safety and Health Act）」、「工作場所安全衛生（安全設計）規範（Workplace Safety and Health 〔Design for Safety〕Regulations 2015）」及韓國「職業安全衛生法（Occupational Safety and Health Act）」等立法例，均要求業主將一定規模之工程交付設計或施工時，其設計者或施工者應於事前實施風險評估，消除危害根源，並採行必要之職業災害預防設備及措施，另我國政府採購法第七十條之一第一項規定，機關辦理工程規劃、設計應負有分析潛在施工危險，編製符合規定之安全衛生圖說及規範，並量化編列安全衛生費用之責。\n五、第五條第二項雖定有工程之設計者或施工者於設計、施工規劃階段應實施風險評估，致力防止發生職業災害，惟其責任未及於工程業主，且該條文屬一般責任並無相應罰責。\n六、工程業主具有決定規劃者、設計者或施工者良窳之選擇權，可為整體工程之工期及經費合理分配，審查規劃者、設計者或施工者之風險評估及處理等成果，並可運用契約推動整體工程之安全衛生管理，係營造工程安全設計及管理最為關鍵之權責單位。為使工程業主、規劃者、設計者及施工者等，於工程全生命週期各階段，共同依其規模特性及可能出現之作業危害，以源頭管理之概念，分析潛在施工風險，爰於第一項定明事業單位將一定規模以上之工程交付規劃或設計時，應使該規劃者或設計者落實安全衛生管理相關事項，依工程特性分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n七、第二項定明事業單位將上述工程交付施工時，應使該施工者於事前依設計者傳遞風險資訊，落實施工風險管理事項，包括依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n八、為使事業單位明瞭第一項及第二項相關規定之執行方式，爰於第三項定明一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110164370000","text":"事業單位將一定規模以上之工程交付規劃、設計時，應使該規劃者、設計者依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛 或施工者之風險評估及處理等成果，並可運用契約推動整體工程之安全衛生管理，係營造工程安全設計及管理最為關鍵之權責單位。為使工程業主、規劃者、設計者及施工者等，於工程全生命週期各階段，共同依其規模特性及可能出現之作業危害，以源頭管理之概念，分析潛在施工風險，爰於第一項定明事業單位將一定規模以上之工程交付規劃或設計時，應使該規劃者或設計者落實安全衛生管理相關事項，依工程特性分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n七、第二項定明事業單位將上述工程交付施工時，應使該施工者於事前依設計者傳遞風險資訊，落實施工風險管理事項，包括依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n八、為使事業單位明瞭第一項及第二項相關規定之執行方式，爰於第三項定明一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，授權由中央主管機關定之。"},{"bill":"202110166940000","text":"事業單位將一定規模以上之工程交付規劃者、設計時，應使該規劃者、設計者依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n前二項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，由中央主管機關定之。","note":"一、本條新增。\n二、鑑於近年工程案件有朝向大規模、高樓層及深開挖之趨勢，致施工風險增加，職業災害比例逐年攀升，現行本法雖已規範營造事業單位於施工階段採取必要之安全衛生設備及措施之規定，其適用對象未包含工程業主（例如公共工程主辦機關、興建大型建築工程之不動產開發商、興建大型廠房之製造業、或興建金融中心之金融服務業等）。\n三、此外，實務上工程業主將工程之規劃、設計或施工等交付承攬時，未於規劃及設計階段消除職業災害風險，常未能善盡防止職業災害責任，僅於契約文件要求營造事業單位落實各項安全衛生設備及措施，未合理規劃風險較低之工址、工法及工期，且安全衛生經費普遍編列不足，並缺乏監督及審核機制，以致未能有效降低職業災害風險。\n四、查英國「工作安全衛生法（Health and Safety at Work Act）」、「工程（設計及管理）規則（The Construction〔Design and Management〕Regulations 2015）」、新加坡「工作場所安全衛生法（Workplace Safety and Health Act）」、「工作場所安全衛生（安全設計）規範（Workplace Safety and Health〔Design for Safety〕Regulations 2015）」及韓國「職業安全衛生法（Occupational Safety and Health Act）」等立法例，均要求業主將一定規模之工程交付設計或施工時，其設計者或施工者應於事前實施風險評估，消除危害根源，並採行必要之職業災害預防設備及措施，另我國政府採購法第七十條之一第一項規定，機關辦理工程規劃、設計應負有分析潛在施工危險，編製符合規定之安全衛生圖說及規範，並量化編列安全衛生費用之責。\n五、第五條第二項雖定有工程之設計者或施工者於設計、施工規劃階段應實施風險評估，致力防止發生職業災害，惟其責任未及於工程業主，且該條文屬一般責任並無相應罰責。\n六、工程業主具有決定規劃者、設計者或施工者良窳之選擇權，可為整體工程之工期及經費合理分配，審查規劃者、設計者或施工者之風險評估及處理等成果，並可運用契約推動整體工程之安全衛生管理，係營造工程安全設計及管理最為關鍵之權責單位。為使工程業主、規劃者、設計者及施工者等，於工程全生命週期各階段，共同依其規模特性及可能出現之作業危害，以源頭管理之概念，分析潛在施工風險，爰於第一項定明事業單位將一定規模以上之工程交付規劃或設計時，應使該規劃者或設計者落實安全衛生管理相關事項，依工程特性分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n七、第二項定明事業單位將上述工程交付施工時，應使該施工者於事前依設計者傳遞風險資訊，落實施工風險管理事項，包括依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n八、為使事業單位明瞭第一項及第二項相關規定之執行方式，爰於第三項定明一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項及其他相關事項之辦法，授權由中央主管機關定之。"}],"changed":true,"final":"事業單位將一定規模以上之工程交付規劃、設計時，應依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n事業單位應使前項施工者依施工計畫書確實執行，並指派人員或委託專業機構監督及查證。\n前三項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項、人員或專業機構之資格條件、監督與查證內容及其他相關事項之辦法，由中央主管機關定之。","finalWhy":"","review":{"note":"修正通過","text":"事業單位將一定規模以上之工程交付規劃、設計時，應依其工程特性，分析潛在施工危害，編製安全衛生圖說及規範，量化編列安全衛生費用，並製作工程規劃設計安全分析報告。\n事業單位將前項工程交付施工時，應使該施工者於事前依工程規劃設計安全分析報告，評估施工風險，採取必要之預防設備及措施，納入施工計畫書，並確實執行。\n事業單位應使前項施工者依施工計畫書確實執行，並指派人員或委託專業機構監督及查證。\n前三項一定規模以上工程範圍、分析與評估方法、安全衛生圖說與規範之內容、工程規劃設計安全分析報告與施工計畫書內容要項、人員或專業機構之資格條件、監督與查證內容及其他相關事項之辦法，由中央主管機關定之。"}},{"no":"第二十二條","current":"事業單位勞工人數在五十人以上者，應僱用或特約醫護人員，辦理健康管理、職業病預防及健康促進等勞工健康保護事項。\n前項職業病預防事項應配合第二十三條之安全衛生人員辦理之。\n第一項事業單位之適用日期，中央主管機關得依規模、性質分階段公告。\n第一項有關從事勞工健康服務之醫護人員資格、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。","versions":[{"bill":"202110109180000","text":"事業單位勞工人數在五十人以上者，應僱用或特約醫護人員，辦理健康管理、職業病預防及健康促進等勞工健康保護事項。\n前項職業病預防事項應配合第二十三條之身心安全衛生人員辦理之。\n第一項事業單位之適用日期，中央主管機關得依規模、性質分階段公告。\n第一項有關從事勞工健康服務之醫護人員資格、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。","note":"現行條文中，關於心理衛生描述仍有不足，調整文字明確納入心理衛生項目。"},{"bill":"202110119990000","text":"事業單位勞工人數在五十人以上者，應僱用或特約醫護人員，辦理健康管理、職業病預防及健康促進等勞工健康保護事項。\n前項職業病預防事項應配合第二十三條之身心安全衛生人員辦理之。\n第一項事業單位之適用日期，中央主管機關得依規模、性質分階段公告。\n第一項有關從事勞工健康服務之醫護人員資格、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。","note":"酌修文字內容。"},{"bill":"202110161460000","text":"事業單位勞工人數在五十人以上者，應置勞工健康服務人員或委託勞工健康服務專業機構，辦理健康管理、職業病與工作相關疾病之預防及健康促進等勞工健康保護事項。\n前項職業病及工作相關疾病預防事項，應配合第二十三條之安全衛生人員辦理之。\n第一項勞工健康服務人員、專業機構之資格與管理、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。","note":"一、修正第一項：\n(一)將「醫護人員」擴大為「勞工健康服務人員」，涵蓋心理師、治療師等專業。\n(二)明定事業單位得委託勞工健康服務專業機構辦理相關事項。\n(三)勞工健康保護事項除職業病預防，並增列工作相關疾病，如肌肉骨骼疾病、腦心血管疾病及心理健康危害。\n(四)勞工健康服務人員配置及專業機構資格，授權子法規範。\n(五)其餘文字酌修。\n二、配合增列工作相關疾病預防，修正第二項文字。\n三、現行規則已要求五十人以上事業單位自111年起辦理勞工健康服務，爰刪除原條文第三項分階段施行規定。\n四、原第四項移列為第三項，並增訂健康服務人員及專業機構資格與管理之授權規定。"},{"bill":"201110158300000","text":"事業單位勞工人數在五十人以上者，應置勞工健康服務人員或委託勞工健康服務專業機構，辦理健康管理、職業病與工作相關疾病之預防及健康促進等勞工健康保護事項。\n前項職業病及工作相關疾病預防事項，應配合第二十三條之安全衛生人員辦理之。\n第一項勞工健康服務人員、專業機構之資格與管理、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。","note":"一、修正第一項：\n(一)基於實務上，勞工健康保護事項之推動除醫護人員外，尚包含其他相關專業之人員，如心理師、物理治療師或職能治療師等，爰將第一項之應僱用或特約醫護人員修正為應置勞工健康服務人員。\n(二)現行勞工健康保護規則第五條第一項規定事業單位特約醫護人員或勞工健康服務相關人員應委託特定專業機構指派符合資格之人員為之，爰增訂事業單位可委託勞工健康服務專業機構辦理勞工健康保護事項。\n(三)應辦理之勞工健康保護事項，除勞工暴露於單一或特定危害，如物理性、化學性或生物性危害等原因引起之疾病預防外，亦包括個人及工作等多重因素所促發之工作相關疾病預防，如重複性作業促發之肌肉骨骼疾病、長時間工作等異常工作負荷促發之腦心血管疾病或對心理健康造成不良影響等人因或社會心理方面之危害預防，爰增列為勞工健康保護事項，以強化事業單位對於工作相關疾病之預防及健康促進等身心健康保護事項。\n(四)勞工健康服務人員之人力配置及勞工健康服務專業機構之資格，將於第三項授權之子法定之，併予說明。\n(五)餘酌作文字修正。\n二、配合第一項增訂工作相關疾病預防事項為勞工健康保護事項，爰修正第二項，並酌作文字修正。\n三、條文第三項定明事業單位之適用日期以分階段公告之方式辦理，係考量醫護人員提供勞工健康服務之量能及對於中小企業推動勞工健康保護事項之衝擊，惟查勞工健康保護規則第四條就勞工人數在五十人以上者，應辦理勞工健康服務之事項，已於一百十一年一月一日施行，爰予刪除。\n四、第四項移列為第三項，並為配合第一項之修正，增訂勞工健康服務人員、勞工健康服務專業機構之資格及管理等事項之辦法，授權由中央主管機關定之。"},{"bill":"202110162130000","text":"事業單位勞工人數在五十人以上者，應置勞工健康服務人員或委託勞工健康服務專業機構，辦理健康管理、職業病與工作相關疾病之預防及健康促進等勞工健康保護事項。\n前項職業病及工作相關疾病預防事項，應配合第二十三條之安全衛生人員辦理之。\n第一項勞工健康服務人員、專業機構之資格與管理、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。","note":"一、修正第一項：\n(一)實務上，勞工健康保護事項之推動除醫護人員外，尚包含其他相關專業之人員，如心理師、物理治療師或職能治療師等，爰將第一項之應僱用或特約醫護人員修正為應置勞工健康服務人員。\n(二)現行勞工健康保護規則第五條第一項規定事業單位特約醫護人員或勞工健康服務相關人員應委託特定專業機構指派符合資格之人員為之，爰增訂事業單位可委託勞工健康服務專業機構辦理勞工健康保護事項。\n(三)應辦理之勞工健康保護事項，除勞工暴露於單一或特定危害，如物理性、化學性或生物性危害等原因引起之疾病預防外，亦包括個人及工作等多重因素所促發之工作相關疾病預防，如重複性作業促發之肌肉骨骼疾病、長時間工作等異常工作負荷促發之腦心血管疾病或對心理健康造成不良影響等人因或社會心理方面之危害預防，爰增列為勞工健康保護事項，以強化事業單位對於工作相關疾病之預防及健康促進等身心健康保護事項。\n(四)勞工健康服務人員之人力配置及勞工健康服務專業機構之資格，將於第三項授權之子法定之。\n(五)餘酌作文字修正。\n二、配合第一項增訂工作相關疾病預防事項為勞工健康保護事項，爰修正第二項，並酌作文字修正。\n三、條文第三項定明事業單位之適用日期以分階段公告之方式辦理，係考量醫護人員提供勞工健康服務之量能及對於中小企業推動勞工健康保護事項之衝擊，惟查勞工健康保護規則第四條就勞工人數在五十人以上者，應辦理勞工健康服務之事項，已於一百十一年一月一日施行，爰予刪除。\n四、第四項移列為第三項，並為配合第一項之修正，增訂勞工健康服務人員、勞工健康服務專業機構之資格及管理等事項之辦法，授權由中央主管機關定之。"},{"bill":"202110162770000","text":"事業單位勞工人數在五十人以上者，應置勞工健康服務人員或委託勞工健康服務專業機構，辦理健康管理、職業病與工作相關疾病之預防及健康促進等勞工健康保護事項。\n前項職業病及工作相關疾病預防事項，應配合第二十三條之安全衛生人員辦理之。\n第一項勞工健康服務人員、專業機構之資格與管理、勞工健康保護及其他應遵行事項之規則，由中央主管機關定之。","note":"一、修正第一項：\n(一)基於實務上，勞工健康保護事項之推動除醫
