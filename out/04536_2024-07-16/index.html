<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中華民國刑法 2024 年修正歷程（凌虐未滿七歲兒童加重刑責）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"中華民國刑法","version":"04536:2024-07-16-修正","date":"2024-07-16","action":"修正","title":"中華民國刑法　2024 年 7 月修正（凌虐未滿七歲兒童加重刑責）","lede":"第二百八十六條處罰凌虐未滿十八歲的人，依原條文，基本刑度是六月以上五年以下有期徒刑。這次前四項文字不變，增訂第五項：對未滿七歲的人犯前四項的罪，依各該項的規定加重其刑至二分之一。2024 年 3 月到 5 月間共有 15 個提案，其中 10 案由司法及法制委員會在 4 月 17 日併案審查，四個條文都沒有共識，全部保留送協商；另外 5 案逕付二讀，併案協商。7 月 16 日黨團協商達成結論：第二百八十六條照協商條文通過，第七十七條維持現行條文，第二百七十二條之一和第二百八十六條之一不予增訂。同一天院會照協商結論通過並完成三讀，沒有表決。","summary":"第二百八十六條增訂第五項：對未滿七歲的人犯凌虐兒少的各項罪，依各該項的規定加重其刑至二分之一。","key":"04536_2024-07-16","props":[{"id":"202110012980000","who":"委員黃健豪等20人","date":"2024-03-15","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110012980000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/05/LCEWA01_110105_00090.pdf","proposers":["黃健豪","林沛祥","陳菁徽","羅廷瑋","洪孟楷","張嘉郡"],"ncosign":14,"people":[["黃健豪","國民黨","提案"],["林沛祥","國民黨","提案"],["陳菁徽","國民黨","提案"],["羅廷瑋","國民黨","提案"],["洪孟楷","國民黨","提案"],["張嘉郡","國民黨","提案"],["張智倫","國民黨","連署"],["魯明哲","國民黨","連署"],["牛煦庭","國民黨","連署"],["廖先翔","國民黨","連署"],["鄭正鈐","國民黨","連署"],["徐巧芯","國民黨","連署"],["邱鎮軍","國民黨","連署"],["邱若華","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["林德福","國民黨","連署"],["羅智強","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["陳玉珍","國民黨","連署"],["傅崐萁","國民黨","連署"]],"party":[["國民黨",20]],"reason":"本院委員黃健豪、林沛祥、陳菁徽、羅廷瑋、洪孟楷、張嘉郡等20人，鑒於兒童遭受成年人凌虐事件時有所聞，然而情節較嚴重之對兒少長期凌虐罪刑，法定刑反而較對兒少一時傷害之刑度為低，對於妨礙兒少發育此類重大惡行，應有合理之刑度以為嚇阻。爰擬具「中華民國刑法第二百八十六條條文修正草案」，修訂妨礙兒童發育之相關刑度。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110018660000","who":"委員徐巧芯等18人","date":"2024-03-22","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110018660000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/06/LCEWA01_110106_00131.pdf","proposers":["徐巧芯","蘇清泉"],"ncosign":16,"people":[["徐巧芯","國民黨","提案"],["蘇清泉","國民黨","提案"],["廖偉翔","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["牛煦庭","國民黨","連署"],["翁曉玲","國民黨","連署"],["謝龍介","國民黨","連署"],["馬文君","國民黨","連署"],["游顥","國民黨","連署"],["黃仁","國民黨","連署"],["賴士葆","國民黨","連署"],["王鴻薇","國民黨","連署"],["張智倫","國民黨","連署"],["黃建賓","國民黨","連署"],["陳永康","國民黨","連署"],["柯志恩","國民黨","連署"],["羅明才","國民黨","連署"],["鄭正鈐","國民黨","連署"]],"party":[["國民黨",18]],"reason":"本院委員徐巧芯、蘇清泉等18人，鑒於近日保母虐童案引發社會譁然，該案已進入社會安全網保護傘下仍發生憾事，除相關單位針對行政疏漏及兒少權益精進外，爰擬具「中華民國刑法第二百八十六條條文修正草案」，以加強刑度達威嚇之用。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110018910000","who":"委員廖偉翔等19人","date":"2024-03-22","name":"「中華民國刑法第七十七條及第二百七十二條之一條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110018910000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/06/LCEWA01_110106_00135.pdf","proposers":["廖偉翔","蘇清泉"],"ncosign":17,"people":[["廖偉翔","國民黨","提案"],["蘇清泉","國民黨","提案"],["陳雪生","國民黨","連署"],["李彥秀","國民黨","連署"],["黃建賓","國民黨","連署"],["黃仁","國民黨","連署"],["黃健豪","國民黨","連署"],["林國成","民眾黨","連署"],["柯志恩","國民黨","連署"],["陳菁徽","國民黨","連署"],["王鴻薇","國民黨","連署"],["牛煦庭","國民黨","連署"],["盧縣一","國民黨","連署"],["林沛祥","國民黨","連署"],["林倩綺","國民黨","連署"],["廖先翔","國民黨","連署"],["涂權吉","國民黨","連署"],["陳玉珍","國民黨","連署"],["謝龍介","國民黨","連署"]],"party":[["國民黨",18],["民眾黨",1]],"reason":"本院委員廖偉翔、蘇清泉等19人，鑑於幼童因自我保護能力弱，且無反抗能力，常容易成為歹徒下手之對象，抑或遭不肖保母等親近之照顧者凌虐，故國家應予積極保護。近年來已不斷發生多起幼童被殺或凌虐致死之案件，然而現行刑法規範仍顯有過輕或疏漏現象，已不足以嚇阻類似犯罪行為之發生，故為保障兒童生命安全之基本權益。爰擬具「中華民國刑法第七十七條及第二百七十二條之一條文修正草案」，針對犯本法第二百八十六條妨害幼童發育罪，並受二年以上徒刑之宣告者，列為第七十七條規範所不適用有期徒刑假釋之情形；另藉新增第二百七十二條之一，增訂「殺害幼童罪」，並處無期徒刑或死刑，俱以提高嚇阻效用並遏止殺害以及凌虐兒童致死案件再次發生。是否有當？敬請公決。","arts":["第七十七條","第二百七十二條之一"]},{"id":"202110018410000","who":"委員王育敏等20人","date":"2024-03-29","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110018410000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/07/LCEWA01_110107_00007.pdf","proposers":["王育敏","洪孟楷","顏寬恒","羅智強"],"ncosign":16,"people":[["王育敏","國民黨","提案"],["洪孟楷","國民黨","提案"],["顏寬恒","國民黨","提案"],["羅智強","國民黨","提案"],["賴士葆","國民黨","連署"],["吳春城","民眾黨","連署"],["牛煦庭","國民黨","連署"],["盧縣一","國民黨","連署"],["涂權吉","國民黨","連署"],["張啓楷","民眾黨","連署"],["陳超明","無黨籍","連署"],["楊瓊瓔","國民黨","連署"],["王鴻薇","國民黨","連署"],["蘇清泉","國民黨","連署"],["黃仁","國民黨","連署"],["陳菁徽","國民黨","連署"],["陳昭姿","民眾黨","連署"],["傅崐萁","國民黨","連署"],["高金素梅","無黨籍","連署"],["陳玉珍","國民黨","連署"]],"party":[["國民黨",15],["民眾黨",3],["無黨籍",2]],"reason":"本院委員王育敏、洪孟楷、顏寬恒、羅智強等20人，有鑑於凌虐兒少案件量居高不下，尤其未滿六歲之幼童較無自我保護及求救能力，易遭凌虐甚或因而致死，實有加重刑期，以增嚇阻犯罪之效。爰擬具「中華民國刑法第二百八十六條條文修正草案」，針對於未滿六歲之幼童，施以凌虐或以他法足以妨害其身心之健全或發育者之行為者，提高其法定刑期二分之一，另針對凌虐未滿六歲之人致死者，最高可處死刑，以保障兒少之生命，伸張兒少司法正義。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110020890000","who":"委員楊瓊瓔等20人","date":"2024-03-29","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110020890000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/07/LCEWA01_110107_00032.pdf","proposers":["楊瓊瓔","顏寬恒"],"ncosign":18,"people":[["楊瓊瓔","國民黨","提案"],["顏寬恒","國民黨","提案"],["林沛祥","國民黨","連署"],["呂玉玲","國民黨","連署"],["羅智強","國民黨","連署"],["黃仁","國民黨","連署"],["張智倫","國民黨","連署"],["翁曉玲","國民黨","連署"],["林德福","國民黨","連署"],["張啓楷","民眾黨","連署"],["林倩綺","國民黨","連署"],["馬文君","國民黨","連署"],["陳玉珍","國民黨","連署"],["羅廷瑋","國民黨","連署"],["黃健豪","國民黨","連署"],["賴士葆","國民黨","連署"],["黃建賓","國民黨","連署"],["羅明才","國民黨","連署"],["洪孟楷","國民黨","連署"],["丁學忠","國民黨","連署"]],"party":[["國民黨",19],["民眾黨",1]],"reason":"本院委員楊瓊瓔、顏寬恒等20人，有鑑於近年來我國兒少受虐案件頻傳，然根據現行我國《刑法》針對虐童所定之刑責，最輕僅處以六個月以上有期徒刑，顯然無法有效嚇阻。再根據研究指出，兒少時期若遭長期虐待或不當管教，日後於自身各層面皆有長遠影響，且終其一生難以撫平，故現行法規實有調整之必要。爰擬具「中華民國刑法第二百八十六條條文修正草案」，以保障兒少身心之健全或發育。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110020900000","who":"委員蘇清泉等28人","date":"2024-03-29","name":"「中華民國刑法第二百八十六條及第二百八十六條之一條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110020900000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/07/LCEWA01_110107_00033.pdf","proposers":["蘇清泉","盧縣一","洪孟楷","傅崐萁"],"ncosign":24,"people":[["蘇清泉","國民黨","提案"],["盧縣一","國民黨","提案"],["洪孟楷","國民黨","提案"],["傅崐萁","國民黨","提案"],["葛如鈞","國民黨","連署"],["陳昭姿","民眾黨","連署"],["顏寬恒","國民黨","連署"],["林倩綺","國民黨","連署"],["黃建賓","國民黨","連署"],["邱鎮軍","國民黨","連署"],["陳菁徽","國民黨","連署"],["羅智強","國民黨","連署"],["李彥秀","國民黨","連署"],["許宇甄","國民黨","連署"],["王鴻薇","國民黨","連署"],["涂權吉","國民黨","連署"],["廖偉翔","國民黨","連署"],["謝龍介","國民黨","連署"],["徐巧芯","國民黨","連署"],["陳永康","國民黨","連署"],["游顥","國民黨","連署"],["林德福","國民黨","連署"],["高金素梅","無黨籍","連署"],["楊瓊瓔","國民黨","連署"],["徐欣瑩","國民黨","連署"],["牛煦庭","國民黨","連署"],["林思銘","國民黨","連署"],["林沛祥","國民黨","連署"]],"party":[["國民黨",26],["民眾黨",1],["無黨籍",1]],"reason":"本院委員蘇清泉、盧縣一、洪孟楷、傅崐萁等28人，有鑒於新北1歲童等待收養期間，遭兒福聯盟合作的劉姓保母姐妹凌虐致死，引發社會輿論質疑目前虐童刑責過輕。近年來我國兒少受虐案件頻傳，然目前我國刑法針對虐童所定之刑責，最輕僅處以六個月以上有期徒刑，考量其惡害程度之嚴重程度，現行法規明顯不足以嚇阻。並針對父母、監護人或實際照顧之人犯罪特別加重規定。爰擬具「中華民國刑法第二百八十六條及第二百八十六條之一條文修正草案」。是否有當？敬請公決。","arts":["第二百八十六條","第二百八十六條之一"]},{"id":"202110021120000","who":"國民黨黨團","date":"2024-03-29","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110021120000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/07/LCEWA01_110107_00040.pdf","proposers":["傅崐萁","洪孟楷","林思銘"],"ncosign":0,"people":[["傅崐萁","國民黨","提案"],["洪孟楷","國民黨","提案"],["林思銘","國民黨","提案"]],"party":[["國民黨",3]],"reason":"本院國民黨黨團，有鑑於中華民國刑法第二百八十六條曾於108年5月10日修法，加重虐童致死之刑責，以遏止虐童案發生，然近年虐童致死案件仍頻繁發生，足見現行法律無法嚇阻虐童案之發生，有加重其刑之必要。爰擬具「中華民國刑法第二百八十六條條文修正草案」，針對未滿六歲之幼童，施以凌虐或以他法足以妨害其身心之健全或發育者之行為者，其本刑提高為七年以上，致死者最高可處死刑，以達嚇阻效果。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110022280000","who":"委員柯志恩等19人","date":"2024-03-29","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110022280000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/07/LCEWA01_110107_00114.pdf","proposers":["柯志恩","羅廷瑋","洪孟楷","蘇清泉","黃健豪"],"ncosign":14,"people":[["柯志恩","國民黨","提案"],["羅廷瑋","國民黨","提案"],["洪孟楷","國民黨","提案"],["蘇清泉","國民黨","提案"],["黃健豪","國民黨","提案"],["傅崐萁","國民黨","連署"],["林思銘","國民黨","連署"],["廖先翔","國民黨","連署"],["邱鎮軍","國民黨","連署"],["陳永康","國民黨","連署"],["翁曉玲","國民黨","連署"],["謝龍介","國民黨","連署"],["謝衣鳯","國民黨","連署"],["林沛祥","國民黨","連署"],["賴士葆","國民黨","連署"],["徐欣瑩","國民黨","連署"],["高金素梅","無黨籍","連署"],["邱若華","國民黨","連署"],["羅智強","國民黨","連署"]],"party":[["國民黨",18],["無黨籍",1]],"reason":"本院委員柯志恩、羅廷瑋、洪孟楷、蘇清泉、黃健豪等19人，鑒於中華民國刑法對凌虐兒少所定之刑責，最輕僅處六個月以上有期徒刑，致死處無期徒刑或十年以上有期徒刑。但臺灣兒少受虐人數每年高達一萬餘人，且幼童凌虐致死案頻傳，現行刑度顯不足以嚇阻，應提高刑度、增加凌虐致死處以死刑，同時對凌虐七歲以下幼兒，加重其刑至二分之一。另成年人對兒童犯傷害罪，刑期加重後可達七年六月，但「對兒少長期凌虐」法定刑只處五年，致使情節重大的「對兒少長期凌虐」法定刑，反而比「對兒少一時傷害」為低的不合理現象。爰擬具「中華民國刑法第二百八十六條條文修正草案」，俾能充分保障幼 details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00578.pdf","proposers":["許宇甄","丁學忠"],"ncosign":20,"people":[["許宇甄","國民黨","提案"],["丁學忠","國民黨","提案"],["洪孟楷","國民黨","連署"],["鄭正鈐","國民黨","連署"],["葉元之","國民黨","連署"],["張嘉郡","國民黨","連署"],["黃仁","國民黨","連署"],["林德福","國民黨","連署"],["王育敏","國民黨","連署"],["羅智強","國民黨","連署"],["廖先翔","國民黨","連署"],["張智倫","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["陳超明","無黨籍","連署"],["王鴻薇","國民黨","連署"],["游顥","國民黨","連署"],["葛如鈞","國民黨","連署"],["馬文君","國民黨","連署"],["黃健豪","國民黨","連署"],["廖偉翔","國民黨","連署"],["黃建賓","國民黨","連署"],["邱若華","國民黨","連署"]],"party":[["國民黨",21],["無黨籍",1]],"reason":"本院委員許宇甄、丁學忠等22人，有鑒於近年虐童致死案件仍頻繁發生，引發民眾恐慌及憤怒；根據研究指出，兒少時期若遭長期虐待或不當管教，日後於自身各層面皆有長遠影響，且終其一生難以撫平，故現行法規實有調整之必要，以避免兒童於成長時期遭受虐待。爰擬具「中華民國刑法第二百八十六條條文修正草案」，針對未滿六歲之幼童，施以凌虐或以他法足以妨害其身心之健全或發育者之行為者，加重其刑，及針對凌虐未滿六歲之人致死者，最高可處死刑，以保障兒少之生命，伸張兒少司法正義。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110034250000","who":"委員賴士葆等17人","date":"2024-04-26","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110034250000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00575.pdf","proposers":["賴士葆","蘇清泉","顏寬恒"],"ncosign":14,"people":[["賴士葆","國民黨","提案"],["蘇清泉","國民黨","提案"],["顏寬恒","國民黨","提案"],["林德福","國民黨","連署"],["廖偉翔","國民黨","連署"],["羅明才","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["鄭正鈐","國民黨","連署"],["李彥秀","國民黨","連署"],["王鴻薇","國民黨","連署"],["游顥","國民黨","連署"],["廖先翔","國民黨","連署"],["陳永康","國民黨","連署"],["翁曉玲","國民黨","連署"],["邱鎮軍","國民黨","連署"],["馬文君","國民黨","連署"],["林沛祥","國民黨","連署"]],"party":[["國民黨",17]],"reason":"本院委員賴士葆、蘇清泉、顏寬恒等17人，針對現行中華民國刑法就致人於死及致重傷均定有加重結果犯之規定，以保護未滿十八歲之人免於因凌虐而致死、致重傷，定有加重結果之處罰規定，仍未能有效遏止，對於未滿十八歲之人施以凌虐致死之犯行，故對於罪無可赦、手段兇殘、毫無反省且無教化可能、復歸社會更生可能性之犯人，似仍有將其判處死刑之必要。有鑑於此，爰擬具「中華民國刑法第二百八十六條條文修正草案予以增列死刑，以儆效尤，期收遏止之效，並促進兒童及少年身心健全發展並保護其權益。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110037540000","who":"委員陳菁徽等20人","date":"2024-04-26","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110037540000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00576.pdf","proposers":["陳菁徽","鄭天財Sra Kacaw"],"ncosign":18,"people":[["陳菁徽","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","提案"],["蘇清泉","國民黨","連署"],["顏寬恒","國民黨","連署"],["廖偉翔","國民黨","連署"],["呂玉玲","國民黨","連署"],["傅崐萁","國民黨","連署"],["馬文君","國民黨","連署"],["黃仁","國民黨","連署"],["盧縣一","國民黨","連署"],["賴士葆","國民黨","連署"],["張智倫","國民黨","連署"],["陳玉珍","國民黨","連署"],["陳昭姿","民眾黨","連署"],["許宇甄","國民黨","連署"],["徐巧芯","國民黨","連署"],["陳超明","無黨籍","連署"],["洪孟楷","國民黨","連署"],["羅智強","國民黨","連署"],["葛如鈞","國民黨","連署"]],"party":[["國民黨",18],["民眾黨",1],["無黨籍",1]],"reason":"本院委員陳菁徽、鄭天財Sra Kacaw等20人，鑒於近年來我國兒童受虐事件頻傳，根據統計數據顯示，臺灣平均每天就有36名兒童受虐，兒虐案件不僅令兒童的身心受到極大傷害或死亡，進一步引發社會恐慌，現行法律雖已有罰則，然兒虐案件仍急劇猖狂，顯見現行法刑度不足以生嚇阻效果，為有效抑止兒童受虐事件再次發生，爰擬具「中華民國刑法第二百八十六條條文修正草案」，加重虐待兒童之刑責，以期杜絕不當對待，讓孩子都能有平安長大的權利。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110037490000","who":"委員盧縣一等17人","date":"2024-04-26","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110037490000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00577.pdf","proposers":["盧縣一","蘇清泉","陳菁徽","鄭正鈐"],"ncosign":13,"people":[["盧縣一","國民黨","提案"],["蘇清泉","國民黨","提案"],["陳菁徽","國民黨","提案"],["鄭正鈐","國民黨","提案"],["楊瓊瓔","國民黨","連署"],["黃建賓","國民黨","連署"],["張智倫","國民黨","連署"],["邱鎮軍","國民黨","連署"],["謝龍介","國民黨","連署"],["陳玉珍","國民黨","連署"],["許宇甄","國民黨","連署"],["丁學忠","國民黨","連署"],["廖先翔","國民黨","連署"],["黃仁","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["涂權吉","國民黨","連署"],["林倩綺","國民黨","連署"]],"party":[["國民黨",17]],"reason":"本院委員盧縣一、蘇清泉、陳菁徽、鄭正鈐等17人，鑑於社會上時有發生凌虐嬰幼兒之事件，其惡性重大及手段殘忍，實不能忽視，為嚇阻此等事件不再發生，因此，爰擬具「中華民國刑法第二百八十六條條文修正草案」，對於未滿三歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處五年以上十二年以下有期徒刑，且對於直系血親卑親屬犯前兩項之罪者，應加重其刑二分之一。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110043760000","who":"委員魯明哲等18人","date":"2024-05-10","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110043760000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/22/LCEWA01_110122_00579.pdf","proposers":["魯明哲","邱若華","洪孟楷"],"ncosign":15,"people":[["魯明哲","國民黨","提案"],["邱若華","國民黨","提案"],["洪孟楷","國民黨","提案"],["陳菁徽","國民黨","連署"],["林思銘","國民黨","連署"],["陳雪生","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["黃健豪","國民黨","連署"],["羅智強","國民黨","連署"],["林國成","民眾黨","連署"],["傅崐萁","國民黨","連署"],["牛煦庭","國民黨","連署"],["林沛祥","國民黨","連署"],["翁曉玲","國民黨","連署"],["游顥","國民黨","連署"],["廖先翔","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["謝龍介","國民黨","連署"]],"party":[["國民黨",17],["民眾黨",1]],"reason":"本院委員魯明哲、邱若華、洪孟楷等18人，鑒於近年來我國兒少受虐案件頻傳，然近年多有研究表明，於兒少時期若遭長期虐待或不當管教，在日後之人際關係、親密關係及社會關係等各層面皆有深遠影響，且終其一生恐難撫平，惟目前我國刑法針對虐童所定之刑責，最輕僅六個月，考量其惡害程度之嚴重性，現行法規之嚇阻力顯有不足。為保障兒少身心健康，並促進社會和諧發展，爰擬具「中華民國刑法第二百八十六條條文修正草案」，將刑度加重至三年以上十年以下。是否有當？敬請公決。","arts":["第二百八十六條"]}],"arts":[{"no":"第七十七條","current":"受徒刑之執行而有悛悔實據者，無期徒刑逾二十五年，有期徒刑逾二分之一、累犯逾三分之二，由監獄報請法務部，得許假釋出獄。\n前項關於有期徒刑假釋之規定，於下列情形，不適用之：\n一、有期徒刑執行未滿六個月者。\n二、犯最輕本刑五年以上有期徒刑之罪之累犯，於假釋期間，受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯最輕本刑為五年以上有期徒刑之罪者。\n三、犯第九十一條之一所列之罪，於徒刑執行期間接受輔導或治療後，經鑑定、評估其再犯危險未顯著降低者。\n無期徒刑裁判確定前逾一年部分之羈押日數算入第一項已執行之期間內。","versions":[{"bill":"202110018910000","text":"受徒刑之執行而有悛悔實據者，無期徒刑逾二十五年，有期徒刑逾二分之一、累犯逾三分之二，由監獄報請法務部，得許假釋出獄。\n前項關於有期徒刑假釋之規定，於下列情形，不適用之：\n一、有期徒刑執行未滿六個月者。\n二、犯最輕本刑五年以上有期徒刑之罪之累犯，於假釋期間，受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯最輕本刑為五年以上有期徒刑之罪者。\n三、犯本法第二百八十六條所列之罪，並受二年以上徒刑之宣告者。\n四、犯第九十一條之一所列之罪，於徒刑執行期間接受輔導或治療後，經鑑定、評估其再犯危險未顯著降低者。\n無期徒刑裁判確定前逾一年部分之羈押日數算入第一項已執行之期間內。","note":"犯本法第二百八十六條妨害幼童發育罪，並受二年以上徒刑之宣告者，新增列為不適用本條有期徒刑假釋之規定中。"}],"changed":false,"final":"受徒刑之執行而有悛悔實據者，無期徒刑逾二十五年，有期徒刑逾二分之一、累犯逾三分之二，由監獄報請法務部，得許假釋出獄。\n前項關於有期徒刑假釋之規定，於下列情形，不適用之：\n一、有期徒刑執行未滿六個月者。\n二、犯最輕本刑五年以上有期徒刑之罪之累犯，於假釋期間，受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯最輕本刑為五年以上有期徒刑之罪者。\n三、犯第九十一條之一所列之罪，於徒刑執行期間接受輔導或治療後，經鑑定、評估其再犯危險未顯著降低者。\n無期徒刑裁判確定前逾一年部分之羈押日數算入第一項已執行之期間內。","finalWhy":null,"review":{"note":"保留，送院會處理","text":""}},{"no":"第二百七十二條之一","current":null,"versions":[{"bill":"202110018910000","text":"殺害未滿十二歲之人，處死刑或無期徒刑。\n前項之未遂犯罰之。\n預備犯第一項之罪者，處二年以下有期徒刑。","note":"一、本條新增。\n二、依兒童及少年福利與權益保障法第二條規定，兒童係指未滿十二歲之人。\n三、現行刑法第二百七十一條殺人罪對於無反抗能力之兒童的保護規範顯有過輕或疏漏的現象，已不足以嚇阻類似犯罪行為之發生。\n四、為確保兒童的生命安全，爰於第一項明定殺害未滿十二歲之人，處死刑或無期徒刑之規定，俾資適用。另未遂犯及預備犯則定於第二項及第三項。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"保留，送院會處理","text":""}},{"no":"第二百八十六條","current":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。","versions":[{"bill":"202110012980000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處一年以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處十年以上有期徒刑，得併科一千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十五年以上有期徒刑；致重傷者，處十年以上二十年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或二十年以上有期徒刑；致重傷者，處十五年以上有期徒刑。","note":"一、日前法院判決書記載，成年人對兒童傷害，刑期加重後，反而高於妨害兒童發育罪。然而後者之情節更為惡劣與重大，此為不合理現象。\n二、由於犯罪行為樣態不同，亦適用不同法條，為能更加全面保障兒童身心健全發育，嚇阻成年人對兒少之凌虐行為，針對此惡性重大行徑，提高其法定刑度。\n三、爰提案修訂《刑法》第二百八十六條，修訂妨礙兒童發育之相關刑度。是否有當，敬請公決。"},{"bill":"202110018660000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處五年以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處七年以上有期徒刑，得併科五百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十五年以上有期徒刑；致重傷者，處無期徒刑或十二年以上有期徒刑。","note":"雖此條文甫於一百零八年五月二十九日修正，第一項加最低刑度，增設第三及第四項針對重傷、致人於死者之刑責，惟不符社會期待，爰提案加重本條文全數刑期。"},{"bill":"202110018410000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對未滿六歲之人犯第一項及第二項之罪者，加重其刑二分之一，致人於死者處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"一、凌虐行為係指在肉體上或精神上，對被害人施以持續性難以忍受之非人道待遇，例如：時予毆打、食不使飽、病不使醫、傷不使療；另尚可包含鞭打、以火燙傷等行為。可見凌虐行為之手段，確實較傷害罪之手段更為殘忍與嚴重，亦可能產生加重結果之情形。\n二、有鑑於未滿六歲之幼童因自我保護能力有限，且受虐後往往不善求救或表達所遭受之不當對待，實有透過加重虐待幼童之刑期，以發揮嚇阻犯罪之效。\n三、爰新增本條第五項之規定，加重凌虐幼童之刑期二分之一，致死者最重可處死刑，至重傷者處無期徒刑或十年以上有期徒刑，以擴大保障兒少之生命與身心健康，伸張兒少司法正義。"},{"bill":"202110020890000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處五年以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處十年以上有期徒刑，得併科一千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十五年以上有期徒刑；致重傷者，處十年以上二十年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或二十年以上有期徒刑；致重傷者，處十五年以上有期徒刑。","note":"一、根據衛福部統計有關兒童少年受虐人數，108年有11,113名受虐兒，109年有12,610名，110年有11,523名，111年有11,950名，到了112年上半年也有6,907名受虐兒，顯見這類凌虐事件層出不窮。\n二、參照《兒童及少年福利與權益保障法》加重其刑的規定，只有規範傷害，而涉及凌虐的妨害幼童發育罪，最重只判刑五年，造成凌虐犯罪行為嚴重於傷害，刑度卻較輕，恐讓凌虐兒童的犯罪者存有僥倖的心態。\n三、再依現行《刑法》第二百七十一條規定：「殺人者，處死刑、無期徒刑或十年以上有期徒刑」。以刑罰來看，虐殺未成年竟比《刑法》第兩百七十一條的普通殺人罪還輕，顯然無法有效嚇阻施虐者對兒少之凌虐行為。有鑑於此，為全面保障兒童身心健全發育，應修法加重懲處施虐者，以避免憾事再次發生。"},{"bill":"202110020900000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處三年以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處十年以上有期徒刑，得併科五百萬元以上一千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。","note":"一、根據衛福部保護服務司統計，未成年之兒少受虐人數於108年計11,113人、109年12,610人、110年11,523人、111年11,950人，人數居高不下。\n二、近年眾多研究指出：兒少時期若遭長期虐待或不當管教，日後於自身各層面皆有長遠影響，且終其一生難以撫平，然現行刑法依照虐童所定之刑責，最輕僅處六個月，顯有不足，爰提案修法提高刑責。"},{"bill":"202110021120000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對未滿六歲之人犯第一項及第二項之罪者，處七年以上有期徒刑，因而致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"一、新增第五項。\n二、有鑑於中華民國刑法第二百八十六條曾於108年5月10日修法，針對虐童加重刑責，虐童致死者最重可處無期徒刑，致重傷者處5年以上、12年以下有期徒刑，經查109年至112年6月止，全國仍有25名幼童遭受嚴重虐待而亡，足見前次修法依舊無法遏止虐童案之發生，有加重其刑責之必要。\n三、另外，幼兒本身並無自我保護及反抗之能力，對幼兒凌虐甚至致死者，其行為罪大惡極並泯滅人性，為防止類似案件再次發生，將幼兒虐殺之犯罪者，有其永久隔絕於社會之必要性，故將刑度提高至死刑及無期徒刑。"},{"bill":"202110022280000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處一年以上八年以下有期徒刑。\n意圖營利，而犯前項之罪者，處十年以上有期徒刑，得併科五百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十五年有期徒刑；致重傷者，處十年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十五年有期徒刑；致重傷者，處十二年以上有期徒刑。\n對於未滿七歲之人，犯第一項至第四項之罪者，依各該項之規定加重其刑至二分之一。","note":"一、凌虐對兒童造成身心創傷，處六月以上刑度太輕，改為一年以上。另成年人對兒童犯傷害罪，刑期加重後可達七年六月，但「對兒少長期凌虐」法定刑只處五年，致使情節重大的「對兒少長期凌虐」可責性高於傷害，但法定刑反而比「對兒少一時傷害」為低，實不合理，將五年調高為八年。\n二、犯第二項至第四項之罪者增加刑責與罰金。凌虐致死者處死刑、無期徒刑或十五年有期徒刑，致重傷者，處十年以上十二年以下有期徒刑。\n三、重大虐童致死或重傷案件多數為六歲以下、甚至是三歲以下幼兒，顯示未滿七歲幼童實為受凌虐、傷害之高風險族群。未滿七歲幼童無自我保護能力，亦不知如何向外界求救，故對於未滿七歲幼童之保護，政府公權力應有更積極作為，增加第五項：對於七歲以下之人，犯第一項和第二項之罪者，加重其刑至二分之一。"},{"bill":"202110026180000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n對於未滿三歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處五年以上十二年以下有期徒刑。\n意圖營利，而犯前二項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死或致重傷者，處死刑、無期徒刑或十年以上有期徒刑。\n犯第三項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑；對於未滿三歲之人犯第三項之罪，因而致人於死或致重傷者，處死刑、無期徒刑或十年以上有期徒刑。","note":"一、增訂第二項，原第二項、第三項移列為第三項、第四項並酌修文字。增列第五項，原第五項移列為第六項。\n二、針對毫無反抗能力之未滿三歲嬰兒，現行規定仍有提升刑度之空間。本次修正規定對於未滿三歲之人，施以凌虐或以他法足以妨害身心健全發育，刑度從六月以上五年以下有期徒刑，提升為五年以下十二年以下有期徒刑。而因而致死或致重傷者，刑度提升為死刑、無期徒刑或十年以上有期徒刑。\n三、另為求明確，對於未滿三歲之人施以凌虐或其他妨害身心健全或發育之行為，若既意圖營利、又致人於死或致重傷，明定處死刑、無期徒刑或十年以上有期徒刑，以免產生修正後第四項、第五項二者競合，如何適用不明確之情形。"},{"bill":"202110027150000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處一年以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處十年以上有期徒刑，得併科一千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十五年以上有期徒刑；致重傷者，處十年以上二十年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或二十年以上有期徒刑；致重傷者，處十五年以上有期徒刑。","note":"一、鑒於兒童受虐事件時有所聞，然情節較嚴重之對兒少長期凌虐罪，法定刑較對兒少一時傷害之態樣為低，顯不合理，對於相類妨礙兒少發育此類重大惡行，應有合理之刑度。\n二、犯罪行為樣態之差異，應適用不同法令規定及刑度，始符罪刑相當原則。為期更加全面保障兒童身心健全發育，嚇阻成年人對兒少之凌虐行為，針對此惡性重大行徑，提高其法定刑度，爰檢討修正本條相關刑度。"},{"bill":"202110033740000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處五年以上二十年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處無期徒刑、或十年以上有期徒刑。\n對未滿六歲之人犯第一項及第二項之罪者，處十年以上有期徒刑，因而致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十二年以上有期徒刑。","note":"一、1989年聯合國通過之兒童權利公約（Convention on the Rights of the Child），我國亦於106年5月17日總統華總一義字第10600057601號令公布「兒童權利公約」，強調體認兒童應在幸福、關愛與理解氣氛之家庭環境中成長，使其人格充分而和諧地發展。\n二、依兒童權利公約第一條規定，兒童係指未滿十八歲之人。近年眾多研究指出：兒童時期若遭長期虐待或不當管教，日後於自身各層面皆有長遠影響，且終其一生難以撫平，然現行刑法依照虐童所定之刑責，顯有不足，爰提案修法提高刑責。\n三、有鑑於未滿六歲之幼童因自我保護能力有限，受虐後往往不善求救或無法明確表達所遭受之不當對待，實有必要透過加重虐待幼童之刑責，以發揮威嚇之效。爰提案增列第二百八十六條第五項。"},{"bill":"202110034250000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。","note":"為促進兒童及少年身心健全發展並保護其權益，本法就致人於死及致重傷均定有加重結果犯之規定，以保護未滿十八歲之人免於因凌虐而致死、致重傷。然縱經修法後定有加重結果之處罰規定，仍未能有效遏止，對於未滿十八歲之人施以凌虐致死之犯行，故對於罪無可赦、手段兇殘、毫無反省且無教化可能、復歸社會更生可能性之犯人，似仍有將其判處死刑之必要。為此，爰修訂本條第三項及第四項，分別增列死刑，以儆效尤。"},{"bill":"202110037540000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處一年以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處十年以上有期徒刑，得併科一千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十五年以上有期徒刑；致重傷者，處十年以上二十年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或二十年以上有期徒刑；致重傷者，處十五年以上有期徒刑。","note":"有鑑於兒虐案件頻傳，現行法刑責嚇阻效果不足，爰提高本條妨礙幼童發育罪基本犯與加重結果犯之法定刑度，強化打擊兒童虐待犯罪力道，以期有效抑制兒童虐待之囂張橫行。"},{"bill":"202110037490000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n對於未滿三歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處五年以上十二年以下有期徒刑。\n對於直系血親卑親屬犯前項之罪者，加重其刑二分之一。\n意圖營利，而犯前二項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死或致重傷者，處死刑、無期徒刑或十年以上有期徒刑。\n犯第三項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑；對於未滿三歲之人犯第三項之罪，因而致人於死或致重傷者，處死刑、無期徒刑或十年以上有期徒刑。","note":"一、增訂第二項、第三項，原第二項、第三項移列為第四項、第五項。並增列第六項。\n二、針對毫無反抗能力之未滿三歲嬰幼兒，社會上常見產生虐嬰之不法新聞事件，可見現行規定仍有提升刑度空間。若行為人對於未滿三歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，刑度應由六個月以上五年以下有期徒刑，提升為五年以上十二年以下，且對於直系血親卑親屬犯前項之罪者，加重其刑二分之一。若因而致死者或致重傷者，刑度提升為死刑、無期徒刑或十年以上有期徒刑。\n三、為明確起見，對於未滿三歲之人施以凌虐或以他法足以妨害其身心之健全或發育者，若有意圖營利且致人於死或重傷者，應明訂處死刑、無期徒刑或十年以上有期徒刑，以生嚇阻之效果。"},{"bill":"202110043760000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處三年以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。","note":"一、根據衛生福利部統計資料顯示，自民國95年至101年間受虐兒少皆超過萬人，民國101年甚至高達1萬9千餘人，且近年受虐兒少亦近萬人之多（民國106年9,389人、民國107年9,186人），顯見我國兒少保護之相關政策，顯有不足。\n二、據發展心理學及腦內神經科學之研究揭示，若於幼童時期曾遭受虐待、欺凌等情事，恐造成日後難以抹滅之身心負面影響，對整體社會之和諧發展亦有阻礙。\n三、綜上，為保障兒少身心健康，並促進社會和諧發展，爰擬具「中華民國刑法第二百八十六條條文修正草案」，將刑度加重至三年以上十年以下。"}],"changed":true,"final":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。","finalWhy":"一、依目前司法實務見解，行為人以強暴、脅迫或其他違反人道之方法所實施之凌辱虐待行為，祇須產生妨害被害人身心健全或發育之危險結果，或於一般客觀經驗上可認足以妨害其身心健全或發育，即成立本罪，是否因其行為致生妨害身心健全或發育之實害結果，則非所問（最高法院一百十二年度台上字第一○三九號判決意旨參照）。考量未滿七歲之人無行為能力，若對未滿七歲之人犯本條之罪，惡性非輕，對被害幼童身心戕害之情節尤重，現行刑度已不足反映行為人惡性。且經統計近三年各地方檢察署依本條起訴案件被害人年齡分布情形，超過半數被害人均屬未滿七歲之無行為能力人，更證有遏止是類案件之必要。爰增訂第五項對未滿七歲之人犯本條之罪加重其刑規定，以符罪責相當原則。\n二、至於本條所稱「凌虐或以他法」足以妨害其身心之健全或發育，其犯罪手法自不以傷害為限。在造成該被害人身體或健康傷害者，可能同時成立本條之罪及第二百七十七條第一項傷害罪，後者經依兒童及少年福利與權益保障法第一百十二條第一項加重後，兩罪應依第五十五條想像競合及封鎖作用結果論罪處罰。至於在凌虐但未成傷，或以強暴、脅迫、其他違反人道之方法實施凌辱虐待行為者，應依事證判斷是否構成本條各項刑責，並依個案情節判斷是否構成其他犯罪，適用競合理論處理，併予指明。\n三、第一至四項未修正。","review":{"note":"保留，送院會處理","text":""}},{"no":"第二百八十六條之一","current":null,"versions":[{"bill":"202110020900000","text":"父母、監護人或實際照顧之人，對於未滿十八歲之人犯前條之罪者，加重其刑至二分之一。","note":"一、本條新增。\n二、《聯合國兒童權利公約》以及我國《兒童及少年福利與權益保障法》，均針對未成年人之父母、監護人或實際照顧人定有各種保護兒童及少年作為義務之條文。此等對兒童及少年之生活掌有實際控制影響之人，倘加以凌虐之行為，將對兒童及少年之身心造成格外嚴重之傷害，自有加重處罰之必要。德國刑法第二百二十五條即就此有特別規範。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"保留，送院會處理","text":""}}],"stages":[{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110012980000","gazref":"113卷010期5192號 9-9頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110018660000","gazref":"113卷014期5196號 13-13頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110018910000","gazref":"113卷014期5196號 14-14頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110018410000","gazref":"113卷018期5200號 1-1頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110020890000","gazref":"113卷018期5200號 4-4頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110020900000","gazref":"113卷018期5200號 4-4頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110021120000","gazref":"113卷018期5200號 4-4頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110022280000","gazref":"113卷018期5200號 12-12頁"},{"date":"2024-04-09","stage":"一讀","code":"院會-11-1-8","bill":"202110026180000","gazref":"113卷020期5202號 4-4頁"},{"date":"2024-04-09","stage":"一讀","code":"院會-11-1-8","bill":"202110027150000","gazref":"113卷020期5202號 7-7頁"},{"date":"2024-04-17","code":"委員會-11-1-36-13","title":"第11屆第1會期司法及法制委員會第13次全體委員會議","gazref":"113卷029期5211號 149-149,159-225頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024041229/details?meetingDate=113/04/17","full":["https://ivod.ly.gov.tw/Play/Full/1M/15819"],"pdf":[{"u":"https://ppg.ly.gov. <script>
const D = JSON.parse(document.getElementById('data').textContent);

  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }

};

  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類

const passed = D.arts.filter(a => a.changed);

[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];

function finder(turns) {   // 在這場逐字稿裡找字

function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
