<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>產業創新條例 2025 年修正歷程（投資抵減延長、國外投資審查）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

2/15/LCEWA01_110215_00064.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"行政院函請審議「產業創新條例部分條文修正草案」案。","arts":["第十條之一","第二十二條","第二十三條之一","第二十三條之二","第六十七條之一","第六十七條之二","第六十七條之三","第七十條","第七十二條"]}],"arts":[{"no":"第十條","current":"為促進產業創新，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業投資於研究發展之支出，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更，並以不超過其當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n前項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。","versions":[{"bill":"202110077270000","text":"為促進產業創新，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業投資於研究發展之支出，或投資併購國內或營運總部在國內之新創事業，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更，並以不超過其當年度應納營利事業所得稅額百分之三十為限：\n一、於支出或投資併購金額百分之二十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出或投資併購金額百分之二十限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n前項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、修正第一項。企業投資併購新創事業，尤係投資併購創新科技型新創事業，意義遂等同併購一研發部門；又美國矽谷新創事業成功退場者，有七成為受企業併購，而我國類似案例則極為缺乏。爰為鼓勵企業投資併購新創事業，一係鼓勵企業有效利用研究開發新技術、新產品經費，二係讓新創事業退場機制更為通暢，爰於本條第一項增列投資併購新創適用研發投資抵減規定。\n二、本條研發投資抵減之抵減率，相比過往促進產業升級條例百分之三十五保守，考量產業創新需要大量研發成本，而激勵企業從事研究發展、開發創新產品，係本法立法宗旨；又面對全球高新科技快速發展，我國部份產業競爭力已呈劣勢，產業創新需求相較過去更為迫切，爰將投抵率自百分之十五上調至百分之二十五。\n三、第二項未修正。"}],"changed":false,"final":"為促進產業創新，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業投資於研究發展之支出，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更，並以不超過其當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n前項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。","finalWhy":null,"review":{"note":"不予通過，維持現行法條文","text":""}},{"no":"第十條之一","current":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百零八年一月一日起至一百十三年十二月三十一日止投資於自行使用之全新智慧機械、投資於導入第五代行動通訊系統或自一百十一年一月一日起至一百十三年十二月三十一日止投資於資通安全產品或服務之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用巨量資料、人工智慧、物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造或感測器之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前六項智慧機械、第五代行動通訊系統或資通安全產品或服務投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","versions":[{"bill":"202110010620000","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百零八年一月一日起至一百十八年十二月三十一日止投資於自行使用之全新智慧機械或人工智慧技術、投資於導入第五代及後續更先進科技之行動通訊系統或自一百十一年一月一日起至一百十八年十二月三十一日止投資於資通安全產品或服務之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用巨量資料、人工智慧、物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造或感測器之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱人工智慧技術，指涵蓋晶片、終端硬體、雲端運算系統、圖像處理器、現場可程式邏輯閘陣列、特殊應用積體電路等硬體設施；類神經網路、專家系統、大數據趨勢分析、開發平台架構、深度學習、機器學習、語音辨識、影像辨識、自然語言處理、邏輯程式設計、模糊邏輯、概率推理、本體工程等演算法技術，且應用於金融科技、智慧製造、智慧醫療、智慧健康、智慧交通、智慧家庭、智慧工業、自動駕駛車、智慧農業、智慧零售、智慧城市、智慧娛樂、智慧教育、量子電腦、腦機介面、體現智慧等領域。\n第一項所稱第五代及後續更先進科技之行動通訊系統，指運用至少符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前七項智慧機械、人工智慧技術、第五代及後續更先進科技之行動通訊系統或資通安全產品或服務投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、為因應全球工業4.0的發展趨勢及人工智慧商業化的浪潮，爰修正本條第一項，將人工智慧技術與第五代及後續更先進科技之行動通訊系統，納入本條獎勵投資之標的，以確保我國相關產業發展之動力。且考量人工智慧技術、第五代及後續更先進科技之行動通訊系統與資通安全等相關領域，需長期投資，且耗資甚鉅，爰修正第一項，取消投資支出十億元之抵減上限，並將獎勵期限由一百十三年十二月三十一日延長至一百十八年十二月三十一日。\n二、新增第四項，明定人工智慧技術涵蓋之範疇涵蓋晶片、終端硬體、雲端運算系統、圖像處理器、現場可程式邏輯閘陣列、特殊應用積體電路等硬體設施；類神經網路、專家系統、大數據趨勢分析、開發平台架構、深度學習、機器學習、語音辨識、影像辨識、自然語言處理、邏輯程式設計、模糊邏輯、概率推理、本體工程等演算法技術，且應用於金融科技、智慧製造、智慧醫療、智慧健康、智慧交通、智慧家庭、智慧工業、自動駕駛車、智慧農業、智慧零售、智慧城市、智慧娛樂、智慧教育、量子電腦（Quantum Computer）、腦機介面（Brain-Computer Interface）、體現智慧（Embodied AI）等領域。\n三、修正第五項，將第五代及後續更先進之行動通訊系統納入本條獎勵投資之標的。\n四、修正第八項，將人工智慧技術、第五代及後續更先進科技之行動通訊系統納入本條獎勵投資之標的。"},{"bill":"202110051610000","text":"為最佳化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百零八年一月一日起至一百十八年十二月三十一日止投資於自行使用之全新智慧機械、投資於導入次世代行動通訊系統或自一百十一年一月一日起至一百十八年十二月三十一日止投資於資通安全產品或服務之相關全新硬體、軟體、技術或技術服務，以及投入節能減碳、人工智慧、積體電路設計軟體電子設計自動化相關技術應用及開發、軟硬體之投資與服務採購，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、三十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用巨量資料、人工智慧、物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造或感測器之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱次世代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱節能減碳，指為應對氣候變化和減緩全球暖化，透過提升能源利用效率、推廣清潔能源、減少碳排放等方式，以降低能源消耗及溫室氣體排放之技術投資、軟硬體及服務採購。\n第一項所稱人工智慧技術，為使用機器學習、深度學習等演算法，使電腦能夠從大數據中學習、分析並做出預測，實現工作流程自動化、提高生產效率，並廣泛應用於自動駕駛、內容生成、智能推薦系統及資料挖掘分析等領域之技術。\n第一項所稱積體電路設計軟體電子設計自動化技術，為使用軟體工具及方法，用於協助設計、驗證和製造積體電路，並涵蓋佈局與布線、模擬驗證與物理設計等各設計階段，提高積體電路設計之效率和準確性、加速產品之開發及創新。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前六項智慧機械、次世代行動通訊系統或資通安全產品或服務，以及投入節能減碳、人工智慧、積體電路設計軟體電子設計自動化相關技術應用及開發、軟硬體之投資與服務採購投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、為因應原第十條之一第一項條文，鼓勵投入於智慧機械、第五代行動通訊系統及資通安全產品或服務等產業創新等將於一百十三年十二月三十一日落日，爰提案延長本條之適用期間至與同法第十條之二規範之一百十八年十二月三十一日相同，以持續促進產業結構朝智慧升級轉型方向前進，並達成多元創新應用之目的。\n二、原條文第一項次世代行動通訊系統，指繼第五代行動通訊系統（5G，運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備或垂直應用系統，以提升生產效能或提供智慧服務者）及其下一代及未來更次世代所發展出之行動通訊技術。為符合未來通訊技術發展之方向，爰修正為次世代行動通訊系統，以鼓勵發展高速傳輸、低延遲、高連接穩定並支援更多種類應用之通訊技術發展。\n三、為呼應「臺灣2050淨零排放」、「亞洲．矽谷3.0」、「晶創臺灣計畫」等國家發展重要政策，爰於第一項修正擴大投資抵減項目，增加節能減碳、循環經濟、人工智慧、積體電路設計軟體電子設計自動化相關技術應用及開發、軟硬體之投資與服務採購等項目。\n四、為因應國際淨零趨勢，企業需大筆投資於低碳設備，且投入金額常動輒高達上百億元。而積體電路設計業之抵減，若侷限於硬體購買仍有不足，亦需投入軟體之購置與投資以進行產業升級，隨製程愈發先進，積體電路設計軟體電子設計自動化相關技術投入成本亦大幅增加。爰修正第一項投資抵減僅額上限之規定，提高至三十億，以符合產業界實際需求，並鼓勵企業加速進行相關投資，提升國家整體產業競爭力。\n五、第二項及第三項未修正。\n六、修正第四項次世代行動通訊系統之定義，包含但不限於第五代行動通訊系統（5G，運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備或垂直應用系統，以提升生產效能或提供智慧服務者），亦涵蓋其下一代及未來更次世代所發展出之行動通訊技術。\n七、第五項未修正。\n八、增訂第六項節能減碳相關技術應用及開發、軟硬體之投資與服務採購之定義。\n九、增訂第七項人工智慧領域之定義，以將相關技術應用及開發、軟硬體之投資與服務採購納入支出抵減範圍。\n十、增訂第八項積體電路設計軟體電子設計自動化之定義，鼓勵將相關支出納入抵減範圍，以有效提升積體電路設計產業投入軟體電子設計自動化技術之投資，有效推進產業之產品開發進程並實現產品創新之目標。\n十一、第九項未修正。\n十二、原第六項移列為十項，內容未修正。\n十三、原第七項移列為第十一項，並納入節能減碳、人工智慧、積體電路設計軟體電子設計自動化相關技術應用及開發、軟硬體之投資與服務採購支出抵減之相關事項，亦授權由中央主管機關會同財政部以辦法定之，另酌做文字修正。"},{"bill":"202110071970000","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，投資於自行使用之全新智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用巨量資料、人工智慧、物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造或感測器之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前六項智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、租稅優惠措施，係為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，提供公司或有限合夥事業有關智慧機械、導入第五代行動通訊系統、資通安全產品或服務之投資抵減，原訂租稅優惠期間將於一百十三年十二月三十一日屆滿。惟考量智慧機械可協助產業建立快速、彈性、高效之生產與服務優勢，國內企業雖已逐步進行智慧化，惟結構性調整需較長時間，仍有促進產業投資應用之必要；數位發展部於一百十二年六月一日發布「行動寬頻專用電信網路設置使用管理辦法」，開始受理申請行動寬頻專用電信網路，同時著眼全球低軌道衛星產業發展趨勢，建立我國衛星產業供應鏈，應鼓勵業者持續投資導入第五代行動通訊系統，以及後續接軌第六代行動通訊系統；鑑於資安對產業穩健發展之重要性，有必要協助產業持續強化更為全面的防護機制，以因應愈多且具威脅之資安風險。同時，近期人工智慧應用快速蓬勃發展，逐漸改變人類生活，影響層面廣泛，為產業帶來更多商機與創新，應鼓勵產業積極投入相關產品或服務，另為配合全球減碳趨勢與達成我國一百三十九年溫室氣體淨零排放之溫室氣體長期減量目標，尤須鼓勵產業低碳轉型。爰此，本條所定投資抵減措施應作為持續提供整體產業結構優化與產業轉型升級動力之政策工具，並隨產業發展需求、科技進展與淨零排放趨勢進行適度調整，爰修正第一項，新增人工智慧產品或服務、節能減碳項目，並配合本條施行期間已定明於第七十二條第七項，比照本條例其他租稅優惠措施條文之施行期間，延長施行至一百十八年十二月三十一日止，爰刪除投資期間之規定，並酌作文字修正。\n二、修正第七項，定明人工智慧產品或服務、節能減碳投資抵減之適用範圍等相關事項，亦授權由中央主管機關會同財政部以辦法定之。"},{"bill":"202110073260000","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，投資於自行使用之全新智慧機械、投資於導入第五代行動通訊系統、投資於資通安全、人工智慧或節能減碳其產品或服務之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、十八億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用巨量資料、物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造或感測器之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱人工智慧係指以機器為基礎之系統，該系統具自主運行能力，透過輸入或感測，經由機器學習與演算法可為明確或隱含之目標實現預測、內容、建議或決策等影響實體或虛擬環境之產出者。\n第一項所稱節能減碳係指以提高能源使用效率達成能源耗用減少，進而降低溫室氣體排放者。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前八項智慧機械、第五代行動通訊系統、資通安全、人工智慧或節能減碳之產品或服務，其投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、修正第一項：\n(一)將企業投資於智慧機械、第五代行動通訊及資通安全產品或服務之租稅優惠期間規定移列至第七十二條定之。\n(二)增訂「人工智慧」與「節能減碳」之企業投資減抵項目：於2022年年底ChatGPT的出現，生成式AI正式崛起，過去AI多用於產線監控，如今能自動生成圖像、文字、程式、影片、聲音和3D模型，這項技術大幅提升企業效率和創新，並開拓新市場與商機。另地球暖化問題加劇，國際能源總署（IEA）近期表示，全球暖化幅度控制在攝氏1.5度的目標若想達標，全世界這10年內改善能源效率的投資金額就必須是現在的3倍。而節約能源就是國際能源總署公認，邁向淨零和能源轉型的首要能源；不僅有助提高能源自主，更能提高國家和企業韌性。綜上新增企業投資於人工智慧或節能減碳其產品或服務之相關全新硬體、軟體、技術或技術服務，亦適用本條投資減抵規定。\n(三)鑒於可適用本條投資減抵之範圍擴大，修正提高可減抵之金額，由原『支出金額在同一課稅年度100萬元以上~10億元以上』抵減，增加為『支出金額在同一課稅年度100萬元以上~18億元以上』作抵減。\n二、修正第三項：由於「人工智慧」技術已邁入生成式AI階段，不再侷限於生產線監控，故將「人工智慧」由現行條文抽出，另於修正條文新增第六項定義之。\n三、新增第六項，增訂「人工智慧」內涵：根據修正條文第一項，人工智慧其產品或服務之相關全新硬體、軟體、技術或技術服務均屬本條投資減抵範圍，關於人工智慧之定義則參照行政院國家科學及技術委員會當前公告之人工智慧基本法草案（科會前字第1130048999號）第二條條文文字規定之。\n四、增訂第七項，增訂「節能減碳」內涵：參酌國際能源總署（IEA）相關報告，減少溫室氣體排放對目前全球暖化問題至關重要，提升能源效率則可實現溫室氣體排放量減縮的目標，同時降低能源費用與減少空氣汙染，且目前節能是全世界推動淨零碳排的共識。綜上參考IEA意見，將節能減碳定義為以提高能源使用效率達成能源耗用減少，進而降低溫室氣體排放者。據此，未來「提高能源使用效率達成能源耗用減少，進而降低溫室氣體排放」之產品或服務之相關全新硬體、軟體、技術或技術服務均屬本條投資減抵範疇。\n五、現行條文第七項移列為修正條文第八項，並配合第一項修正及增訂第六項與第七項，作文字修正。\n六、現行條文第二項、第四項及第五項未修正。"},{"bill":"202110073780000","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，投資於自行使用之全新智慧機械、投資於導入第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、二十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用機器人、數位化管理、虛實整合或積層製造之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱人工智慧產品或服務，指運用機器學習演算法、深度學習演算法、大型語言模型或自然語言處理之技術元素，仿人類智慧進行認知、學習與推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能。\n第一項所稱節能減碳，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能資源耗用，進而降低溫室氣體排放。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前八項智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、修正第一項，說明如下：\n(一)本條所定租稅優惠措施，係為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，提供公司或有限合夥事業有關智慧機械、導入第五代行動通訊系統、資通安全產品或服務之投資抵減，原定租稅優惠期間將於一百十三年十二月三十一日屆滿。\n(二)考量智慧機械可協助產業建立快速、彈性、高效之生產與服務優勢，國內企業雖已逐步進行智慧化，惟結構性調整需較長時間及數位發展部於一百十二年六月一日發布行動寬頻專用電信網路設置使用管理辦法，開始受理申請行動寬頻專用電信網路，同時著眼全球低軌道衛星產業發展趨勢，建立我國衛星產業供應鏈，為鼓勵業者持續投資導入第五代行動通訊系統及後續接軌第六代行動通訊系統，以及衡酌資安對產業穩健發展之重要性，有必要協助產業持續強化並全面提升資安防護機制，以因應威脅加劇之資安風險，允宜持續鼓勵產業投資應用智慧機械、第五代行動通訊系統及資通安全產品或服務，爰刪除投資期間之規定，並於修正條文第七十二條第七項明定本次修正條文施行期間，自一百十四年一月一日至一百十八年十二月三十一日止，延長本項租稅優惠期間。\n(三)鑒於近期人工智慧應用快速蓬勃發展，逐漸改變人類生活，影響層面廣泛，為產業帶來更多商機與創新，應鼓勵產業積極投入相關產品或服務；另為配合全球減碳趨勢與達成我國一百三十九年溫室氣體淨零排放之溫室氣體長期減量目標，尤須鼓勵產業低碳轉型，本條所定投資抵減措施應隨產業發展需求、科技進展與淨零排放趨勢進行適度調整，爰增訂人工智慧產品或服務、節能減碳等投資抵減適用項目。\n(四)考量本次修正擴大適用項目範圍，尤其節能減碳相關系統設備之支出高昂，為減輕產業投資負擔，提高汰換設備意願，爰提高適用投資抵減之支出金額上限為新臺幣二十億元，以強化投資誘因。\n二、第二項未修正。\n三、修正第三項所定智慧機械之定義，考量現今物聯網、精實管理及感測器已深入各領域成為基礎技術，為持續促進產業智慧升級轉型，應鼓勵業者提升智慧機械至更高階的層次，爰刪除智慧機械中物聯網、精實管理及感測器之智慧技術元素；另考量本次修正增訂人工智慧產品或服務為本條租稅優惠之適用項目，巨量資料提供大量數據訓練及改進人工智慧模型，可認屬人工智慧之內涵，為避免原屬智慧機械中人工智慧及巨量資料之智慧技術元素與該項目重複規範，爰將應用在智慧機械中人工智慧及巨量資料之智慧技術元素，整併納入第六項人工智慧產品或服務之範疇，並配合調整文字。\n四、第四項及第五項未修正。\n五、增訂第六項人工智慧產品或服務之定義，因應新一代生成式AI技術快速發展，已有更多人工智慧創新與應用擴及各產業領域，爰定義人工智慧產品或服務，指運用前述技術元素，仿人類智慧進行認知、學習與推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能。而前述產品或服務，應屬透過提供高算力、高效能之硬體設備，與使用運行巨量參數之AI模型之軟體與服務，併予說明。\n六、增訂第七項節能減碳定義，參考各產業推動淨零排放政策訂定，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能資源耗用，進而降低溫室氣體排放。而前開適用項目規格應高於或符合所訂高效能標準或節能率，例如，採用經中央主管機關認定之IE4以上等級高效能馬達、一級能效空壓機，併予說明。\n七、現行第六項移列為第八項，內容未修正。\n八、現行第七項修正移列為第九項，定明人工智慧產品或服務、節能減碳投資抵減之適用範圍等相關事項，亦授權由中央主管機關會同財政部以辦法定之，並酌作文字修正。"},{"bill":"202110074290000","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百零八年一月一日起至一百二十一年十二月三十一日止投資於自行使用之全新智慧機械、投資於導入第五代行動通訊系統，或自一百十一年一月一日起至一百二十一年十二月三十一日止投資於資通安全產品或服務，或自一百十四年一月一日至一百二十一年十二月三十一日止投資人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、二十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用巨量資料、人工智慧、物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造或感測器之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n第一項所稱人工智慧產品或服務，指運用機器學習演算法、深度學習演算法、大型語言模型或自然語言處理之技術元素，仿人類智慧進行認知、學習與推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能。\n第一項所稱節能減碳，指運用公共節能或製程改善之低碳技術元素，以提升能源使用效率、減少能資源耗用，進而降低溫室氣體排放。\n前八項智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務或節能減碳投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、為策略性強化升級國內產業，增加台灣更強勁之國際競爭力，故提案修正「產業創新條例第十條之一」條文修正草案，除了將智慧機械與、五代行動通訊系統系統、及資通安全產品等投資抵減之適用，修正為繼續延長適用八年，並新增人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，同時適用至一百二十一年十二月三十一日，以持續確保並強化我國產業國際競爭力。\n二、本條新增第七項、第八項，原第七項順延為第九項。"},{"bill":"202110075970000","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百零八年一月一日起至一百十八年十二月三十一日止投資於自行使用之全新智慧機械、投資於導入次世代行動通訊系統或自一百十一年一月一日起至一百十八年十二月三十一日止投資於資通安全產品或服務、人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、三十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造或感測器之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱次世代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務，亦涵蓋其下一代及未來更次世代所發展出之行動通訊技術者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱人工智慧產品或服務，指運用機器學習演算法、深度學習演算法、大型語言模型或自然語言處理之技術元素，仿人類智慧進行認知、學習與推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能。\n第一項所稱節能減碳，指為應對氣候變化和減緩全球暖化，透過提升能源利用效率、推廣清潔能源、減少碳排放等方式，以降低能源消耗及溫室氣體排放之技術投資、軟硬體及服務採購。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前八項智慧機械、次世代行動通訊系統或資通安全產品或服務、人工智慧、節能減碳投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、原第十條之一第一項條文，鼓勵投入於智慧機械、第五代行動通訊系統及資通安全產品或服務等產業創新等將於一百十三年十二月三十一日落日，為持續促進產業結構朝淨零碳排及智慧升級轉型方向前進，並達成多元創新應用之目的，修正條文至一百十八年十二月三十一日止，延長本項租稅優惠期間。\n二、修正條文第一項次世代行動通訊系統，指繼第五代行動通訊系統及其下一代及未來更次世代所發展出之行動通訊技術。為符合未來通訊技術發展之方向，爰修正為次世代行動通訊系統，以鼓勵發展高速傳輸、低延遲、高連接穩定並支援更多種類應用之通訊技術發展；為呼應「臺灣2050淨零排放」、AI發展等國家發展重要政策，爰於第一項修正擴大投資抵減項目，增加人工智慧、節能減碳等項目。\n三、為因應國際淨零趨勢，企業需大筆投資於低碳設備，且投入金額常動輒高達上百億元。爰修正第一項投資抵減金額上限之規定，提高至三十億元，以符合產業界實際需求，並鼓勵企業加速進行相關投資，提升國家整體產業競爭力。\n四、第二項未修正。\n五、修正第三項所定智慧機械之定義，考量本次修正增訂人工智慧產品或服務為本條租稅優惠之適用項目，巨量資料提供大量數據訓練及改進人工智慧模型，可認屬人工智慧之內涵，為避免原屬智慧機械中人工智慧及巨量資料之智慧技術元素與該項目重複規範，爰將應用在智慧機械中人工智慧及巨量資料之智慧技術元素，整併納入第六項人工智慧產品或服務之範疇，並配合調整文字。\n六、修正第四項次世代行動通訊系統之定義，包含但不限於第五代行動通訊系統（5G，亦涵蓋其下一代及未來更次世代所發展出之行動通訊技術。\n七、第五項未修正。\n八、增訂第六項，明定人工智慧技術涵蓋之範疇，納入支出抵減範圍。\n九、增訂第七項節能減碳相關技術應用及開發、軟硬體之投資與服務採購之定義，納入支出抵減範圍。。\n十、原第六項移列為八項，內容未修正。\n十一、原第七項移列為第九項，修正次世代行動通訊系統或資通安全產品或服務，並納入人工智慧、節能減碳之軟硬體之投資與服務採購支出抵減之相關事項，亦授權由中央主管機關會同財政部以辦法定之，另酌做文字修正。"},{"bill":"202110077710000","text":"為最佳化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百零八年一月一日起至一百十八年十二月三十一日止投資於自行使用之全新智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、二十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用機器人、數位化管理、虛實整合或積層製造或感測器之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱人工智慧產品或服務，指運用機器學習演算法、深度學習演算法、大型語言模型或自然語言處理之技術元素，仿人類智慧進行認知、學習與推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能。\n第一項所稱節能減碳，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能資源耗用，進而降低溫室氣體排放。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前八項智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"延長公司或有限合夥事業投資於智慧機械、第五代行動通訊系統、資通安全產品或服務之租稅優惠期間至一百十八年，新增人工智慧產品或服務、節能減碳等投資抵減項目，並提高適用投資抵減之支出金額上限為二十億。"},{"bill":"202110083690000","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，投資於自行使用之智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳、再生能源自用發電設備及儲能設備之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上十八億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用機器人、數位化管理、虛實整合或積層製造之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱人工智慧產品或服務，指運用機器學習演算法、深度學習演算法、大型語言模型或自然語言處理之技術元素，仿人類智慧進行認知、學習與推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能。\n第一項所稱節能減碳，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能資源耗用，進而降低溫室氣體排放。\n第一項所稱再生能源自用發電設備及儲能設備，指依「再生能源發展條例」及「再生能源發電設備設置管理辦法」申請設置且利用再生能源之自用發電設備（即第二型及第三型再生能源發電設備）及儲能設備，其生產或儲存之電能不銷售予再生能源售電業。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前九項智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳、再生能源自用發電設備及儲能設備投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"有鑑於臺灣製造業除擁有全球最大積體電路代工製造商外，尚涵蓋多領域，包括電子產品、精密機械、光電顯示技術、綠能及生物醫療等。強大的製造業基礎優勢，佔據臺灣出口占比逾七成，為維持臺灣前述之領域優勢及對全球製造業之高競爭力，產業必高度仰賴穩定電力之供應。又隨著全球對減碳及綠電使用的重視，臺灣需加速發展綠電，儲能設備可有效應對綠能發電的不穩定性並提高綠電比例，爰修正本條，說明如下：\n一、修正第一項：\n(一)本條所定租稅優惠措施，係為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，提供公司或有限合夥事業有關智慧機械、導入第五代行動通訊系統、資通安全產品或服務之投資抵減，原定租稅優惠期間將於一百十三年十二月三十一日屆滿。\n(二)考量智慧機械可協助產業建立快速、彈性、高效之生產與服務優勢，國內企業雖已逐步進行智慧化，惟結構性調整需較長時間及數位發展部於一百十二年六月一日發布行動寬頻專用電信網路設置使用管理辦法，開始受理申請行動寬頻專用電信網路，同時著眼全球低軌道衛星產業發展趨勢，建立我國衛星產業供應鏈，為鼓勵業者持續投資導入第五代行動通訊系統及後續接軌第六代行動通訊系統，以及衡酌資安對產業穩健發展之重要性，有必要協助產業持續強化並全面提升資安防護機制，以因應威脅加劇之資安風險，允宜持續鼓勵產業投資應用智慧機械、第五代行動通訊系統及資通安全產品或服務，爰刪除投資期間之規定，延長本項租稅優惠期間。\n(三)鑒於近期人工智慧應用快速蓬勃發展，逐漸改變人類生活，影響層面廣泛，為產業帶來更多商機與創新，應鼓勵產業積極投入相關產品或服務；另為配合全球減碳趨勢與達成我國一百三十九年溫室氣體淨零排放之溫室氣體長期減量目標，尤須鼓勵產業低碳轉型，本條所定投資抵減措施應隨產業發展需求、科技進展與淨零排放趨勢進行適度調整，爰增訂人工智慧產品或服務、節能減碳等投資抵減適用項目。\n(四)鑒於再生能源為臺灣穩定發展AI、半導體產業等能源密集產業之重要資源，並能降低國際化石燃料價格波動對經濟之負面影響，應積極鼓勵事業設置再生能源自用發電設備及儲能設備，使其得使用再生能源電力降低營運及淨零轉型成本，爰新增再生能源自用發電設備及儲能設備，係為實踐本條例第一條「促進產業創新，改善產業環境，提升產業競爭力」之立法精神。另，為加速產業能源轉型，達成臺灣一百三十九年溫室氣體淨零排放之長期減量目標，爰提供公司或有限合夥事業設置再生能源自用發電設備或儲能設備投資抵減。又現行再生能源發電設備建置相關補助措施，係由地方政府辦理。惟相關支出高昂，地方政府辦理之補助措施除訂定補助上限外，金額亦隨建置規模增加而降低，恐難減輕產業投資負擔，為支持製造業及能源轉型，通過抵稅政策鼓勵企業投資再生能源發電機組和儲能設備，推動臺灣綠色轉型，爰應由中央主管機關推動相關辦法提高事業投入意願。\n(五)考量本次修正擴大適用項目範圍，尤其節能減碳相關系統設備之支出高昂，為減輕產業投資負擔，提高汰換設備意願，爰提高適用投資抵減之支出金額上限為新臺幣十八億元，以強化投資誘因。\n二、第二項未修正。\n三、修正第三項所定智慧機械之定義，考量現今物聯網、精實管理及感測器已深入各領域成為基礎技術，為持續促進產業智慧升級轉型，應鼓勵業者提升智慧機械至更高階的層次，爰刪除智慧機械中物聯網、精實管理及感測器之智慧技術元素；另考量本次修正增訂人工智慧產品或服務為本條租稅優惠之適用項目，巨量資料提供大量數據訓練及改進人工智慧模型，可認屬人工智慧之內涵，為避免原屬智慧機械中人工智慧及巨量資料之智慧技術元素與該項目重複規範，爰將應用在智慧機械中人工智慧及巨量資料之智慧技術元素，整併納入第六項人工智慧產品或服務之範疇，並配合調整文字。\n四、第四項及第五項未修正。\n五、增訂第六項人工智慧產品或服務之定義，因應新一代生成式AI技術快速發展，已有更多人工智慧創新與應用擴及各產業領域，爰定義人工智慧產品或服務，指運用前述技術元素，仿人類智慧進行認知、學習與推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能。而前述產品或服務，應屬透過提供高算力、高效能之硬體設備，與使用運行巨量參數之AI模型之軟體與服務，併予說明。\n六、增訂第七項節能減碳定義，參考各產業推動淨零排放政策訂定，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能資源耗用，進而降低溫室氣體排放。而前開適用項目規格應高於或符合所訂高效能標準或節能率，例如，採用經中央主管機關認定之IE4以上等級高效能馬達、一級能效空壓機，併予說明。\n七、增訂第八項再生能源自用發電設備及儲能設備定義。\n八、現行第六項移列為第九項，內容未修正。\n九、現行第七項修正移列為第十項，定明人工智慧產品或服務、節能減碳、再生能源自用發電設備及儲能設備投資抵減之適用範圍等相關事項，亦授權由中央主管機關會同財政部以辦法定之，並酌作文字修正。"},{"bill":"201110083730000","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百十四年一月一日起至一百十八年十二月三十一日止投資於自行使用之全新智慧機械、導入第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、十八億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用機器人、數位化管理、虛實整合或積層製造之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱人工智慧產品或服務，指運用機器學習演算法、深度學習演算法、大型語言模型或自然語言處理之技術元素，仿人類智慧進行認知、學習及推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能之硬體、軟體、技術或技術服務。\n第一項所稱節能減碳，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能源或資源耗用，進而降低溫室氣體排放。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前八項智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、修正第一項，說明如下：\n(一)現行條文所定租稅優惠措施，係為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，提供公司或有限合夥事業有關智慧機械、導入第五代行動通訊系統、資通安全產品或服務之投資抵減，原定租稅優惠適用期間將於一百十三年十二月三十一日屆滿。\n(二)考量智慧機械可協助產業建立快速、彈性、高效之生產與服務優勢，國內企業雖已逐步進行智慧化，惟結構性調整需較長時間，及數位發展部於一百十二年六月一日訂定發布行動寬頻專用電信網路設置使用管理辦法，開始受理申請行動寬頻專用電信網路，同時著眼全球低軌道衛星產業發展趨勢，建立我國衛星產業供應鏈，為鼓勵業者持續投資導入第五代行動通訊系統及後續接軌第六代行動通訊系統，及衡酌資安對產業穩健發展之重要性，有必要協助產業持續強化並全面提升資安防護機制，以因應威脅加劇之資安風險，宜持續鼓勵產業投資應用智慧機械、導入第五代行動通訊系統及資通安全產品或服務，爰延長投資於全新智慧機械、導入第五代行動通訊系統及資通安全產品或服務之租稅優惠適用期間至一百十八年十二月三十一日，惟範圍與時俱進，酌作調整。\n(三)鑒於近期人工智慧應用快速蓬勃發展，逐漸改變人類生活，影響層面廣泛，為產業帶來更多商機與創新，應鼓勵產業積極投入相關產品或服務；另為配合全球減碳趨勢及達成我國一百三十九年溫室氣體淨零排放之溫室氣體長期減量目標，尤須鼓勵產業低碳轉型，現行條文所定投資抵減措施應隨產業發展需求、科技進展與淨零排放趨勢進行適度調整，爰增訂人工智慧產品或服務、節能減碳等投資抵減適用項目，並定明投資於人工智慧產品或服務、節能減碳之租稅優惠適用期間自一百十四年一月一日起至一百十八年十二月三十一日止。\n(四)考量本次修正擴大適用項目範圍，尤其節能減碳相關系統設備之支出高昂，為減輕產業投資負擔，提高汰換設備意願，爰提高適用投資抵減之支出金額上限為新臺幣十八億元，以強化投資誘因。\n二、第二項未修正。\n三、考量現今物聯網、精實管理及感測器已深入各領域成為基礎技術，為持續促進產業智慧升級轉型，應鼓勵業者提升智慧機械至更高階層次，爰修正第三項所定智慧機械之定義，刪除智慧機械中物聯網、精實管理及感測器之智慧技術元素。另考量本次修正增訂人工智慧（Artificial Intelligence, AI）產品或服務之適用項目，巨量資料提供大量數據訓練及改進人工智慧模型，可認屬人工智慧之內涵，為避免原屬智慧機械中人工智慧及巨量資料之智慧技術元素與該項目重複規範，爰將應用在智慧機械中人工智慧及巨量資料之智慧技術元素，整併納入第六項人工智慧產品或服務之範疇，並配合調整文字。\n四、第四項及第五項未修正。\n五、增訂第六項人工智慧產品或服務之定義，因應新一代生成式AI技術快速發展，已有更多人工智慧創新與應用擴及各產業領域，爰定義人工智慧產品或服務，指運用前述技術元素，仿人類智慧進行認知、學習及推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能之硬體、軟體、技術或技術服務，又前述產品或服務，應係具備高算力、高效能之硬體設備，或使用運行巨量參數之AI模型之軟體及服務，併予敘明。\n六、參考各產業推動淨零排放政策訂定之內容，增訂第七項節能減碳定義，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能資源耗用，進而降低溫室氣體排放。又前開適用項目規格應高於或符合所訂高效能標準或節能率，例如採用經中央主管機關認定之IE4以上等級高效能馬達、一級能效空壓機，併予敘明。\n七、第六項移列為第八項，內容未修正。\n八、第七項修正移列為第九項，定明人工智慧產品或服務、節能減碳投資抵減之適用範圍等相關事項，亦授權由中央主管機關會同財政部以辦法定之，並酌作文字修正。\n九、另有關本條修正後，新、舊法所定投資項目與定義，及投資抵減支出金額上限之適用，考量提供租稅優惠旨在誘使企業投資於政府欲獎勵之投資項目，影響企業投資決策，爰應以企業投資決策時點（即訂購日）為投資行為認定之時點而決定適用修正前或修正後之規定；又企業投資項目完成交貨始能投入業務使用進而產生所得及相應之應納稅額，並確定其支出金額，爰抵減年度（即支出金額年度）應以交貨年度認定。舉例說明如下：\n(一)公司或有限合夥事業於一百十三年十二月三十一日以前訂購符合現行條文所定全新硬體、軟體、技術或技術服務，並於一定期間交貨，應於交貨年度依現行條文適用投資抵減，且其於交貨年度抵減應納營利事業所得稅時，適用之支出金額上限為新臺幣十億元；其所訂購之項目如為本次新增之適用範圍項目（如人工智慧產品或服務，及節能減碳），不得適用投資抵減。\n(二)公司或有限合夥事業於一百十四年一月一日至一百十八年十二月三十一日間訂購符合修正條文所定全新硬體、軟體、技術或技術服務，並於一定期間完成交貨，應於交貨年度依修正條文適用投資抵減，其當年度合計支出金額（含符合現行條文規定之投資項目及金額，以新臺幣十億元為限）以新臺幣十八億元為限。"}],"changed":true,"final":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百十四年一月一日起至一百十八年十二月三十一日止投資於自行使用之全新智慧機械、導入第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、二十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用機器人、數位化管理、虛實整合或積層製造之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱人工智慧產品或服務，指運用機器學習演算法、深度學習演算法、大型語言模型或自然語言處理之技術元素，仿人類智慧進行認知、學習及推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能之硬體、軟體、技術或技術服務。\n第一項所稱節能減碳，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能源或資源耗用，進而降低溫室氣體排放。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前八項智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","finalWhy":"","review":{"note":"照行政院提案修正通過","text":"為優化產業結構達成智慧升級轉型並鼓勵多元創新應用，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百十四年一月一日起至一百十八年十二月三十一日止投資於自行使用之全新智慧機械、導入第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳之相關全新硬體、軟體、技術或技術服務，其支出金額在同一課稅年度內合計達新臺幣一百萬元以上、二十億元以下之範圍，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之三限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業於同一年度合併適用前項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項所稱智慧機械，指運用機器人、數位化管理、虛實整合或積層製造之智慧技術元素，並具有生產資訊可視化、故障預測、精度補償、自動參數設定、自動控制、自動排程、應用服務軟體、彈性生產或混線生產之智慧化功能者。\n第一項所稱第五代行動通訊系統，指運用符合第三代合作夥伴計畫第十五版以上規範之中高頻通訊、大量天線陣列、網路切片、網路虛擬化、軟體定義網路、邊緣運算等第五代行動通訊相關技術元素、設備（含測試所需）或垂直應用系統，以提升生產效能或提供智慧服務者。\n第一項所稱資通安全產品或服務，指為防止資通系統或資訊遭受未經授權之存取、使用、控制、洩漏、破壞、竄改、銷毀或其他侵害，確保其機密性、完整性及可用性，運用於終端與行動裝置防護、網路安全維護或資料與雲端安全維護有關之硬體、軟體、技術或技術服務。\n第一項所稱人工智慧產品或服務，指運用機器學習演算法、深度學習演算法、大型語言模型或自然語言處理之技術元素，仿人類智慧進行認知、學習及推論，能大規模利用各類數據類型，形成產業所需之辨識、分類或生成等各式應用，優化企業營運或生產製造效能之硬體、軟體、技術或技術服務。\n第一項所稱節能減碳，指運用公用節能或製程改善之低碳技術元素，以提升能源使用效率、減少能源或資源耗用，進而降低溫室氣體排放。\n公司或有限合夥事業申請適用第一項投資抵減，應提出具一定效益之投資計畫，經各中央目的事業主管機關專案核准，且於同一課稅年度以申請一次為限。\n前八項智慧機械、第五代行動通訊系統、資通安全產品或服務、人工智慧產品或服務、節能減碳投資抵減之適用範圍、具一定效益之投資計畫、申請期限、申請程序、核定機關、抵減率、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。"}},{"no":"第十七條之一","current":null,"versions":[{"bill":"202110010620000","text":"為鼓勵產業創新人才培育，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事之公司或有限合夥事業，自中華民國一百十三年一月一日至一百十八年十二月三十一日投資於人才培育之支出，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更，並以不超過其當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n公司或有限合夥事業適用前項投資抵減，同年度併予適用本條例或其他法律投資抵減，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，其依其他法律規定計算之最後年度抵減金額，不在此限。\n第一項人才培育，係指為培育受僱員工，辦理或指派參加產業創新相關技術課程培訓。\n前項產業創新相關技術課程培訓，指巨量資料、人工智慧、物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造、感測器、生物辨識、資訊安全、第五代及後續更先進科技之行動通訊系統、無人載具、離岸風場開發及運維、先進製程、智慧電網設計、電力系統規劃與維運、循環材料、資源循環、能源整合、生物循環、區塊鏈等技術元素之訓練活動，以及其他經各中央目的事業主管機關核定之產業創新相關訓練活動。\n第一項公司或有限合夥事業應提出完整人才培育計畫，經各中央目的事業主管機關專案核准，始適用之。但股份有限公司之人才培育計畫經董事會同意者，不在此限。\n第一項投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、本條新增。\n二、為強化產業創新人才培育，於第一項明定公司或有限合夥事業，自中華民國一百十三年一月一日至一百十八年十二月三十一日，投資於人才培育之支出，得選擇以當年度支出金額百分之十五限度內，或自當年度三年內支出金額百分之十限度內，二者擇一，抵減應納營利事業所得稅額。\n三、第二項明定公司或有限合夥事業之投資得以當年度支出金額百分之十五限度內或自當年度起三年內以支出金額百分之十限度內抵減應納營利事業所得稅額。另考量適用租稅措施之業者，仍應負有納稅義務，爰明定各年度投資抵減金額以不超過其當年度應納營利事業所得稅額百分之三十為限。\n四、第三項明定培育受僱員工，辦理或指派參加產業創新相關技術課程培訓。\n五、第四項明定為培育受僱員工，辦理或指派參加產業創新之相關技術課程培訓，包含巨量資料、人工智慧、物聯網、機器人、精實管理、數位化管理、虛實整合、積層製造、感測器、生物辨識、資訊安全、第五代及後續更先進科技之行動通訊系統、無人載具、離岸風場開發及運維、先進製程、智慧電網設計、電力系統規劃與維運、循環材料、資源循環、能源整合、生物循環、區塊鏈等技術元素之訓練活動，以及其他經各中央目的事業主管機關核定之產業創新相關訓練活動。\n六、第五項明定公司或有限合夥事業應提出完整的人才培育計畫，送請董事會或各中央目的事業主管機關專案核准，始適用第一項投資抵減規定。\n七、第六項明定明定人才培育投資抵減之適用範圍、申請期限、申請程序、核定機關、施行期限、抵減率及其他相關事項之辦法，由中央主管機關會同財政部定之。"},{"bill":"202110051610000","text":"為鼓勵產業創新人才之培育，最近三年內無違反環境保護、勞工或食品安全衛生相關法律且情節重大情事者，自中華民國一百十三年一月一日起至一百十八年十二月三十一日止，得選擇以下列方式之一抵減應納營利事業所得稅額，一經擇定不得變更。其各年度投資抵減金額以不超過當年度應納營利事業所得稅額百分之三十為限：\n一、於支出金額百分之十五限度內，抵減當年度應納營利事業所得稅額。\n二、於支出金額百分之十限度內，自當年度起三年內抵減各年度應納營利事業所得稅額。\n前項人才培育，係指辦理、安排或指派受僱員工參加產業創新技術課程培訓，以促進專業知識和技能之提升。\n前項產業創新技術課程，係指與人工智慧、智慧製造、綠能科技與永續治理、循環經濟、服務創新、健康醫療、研發智財、生成式人工會、資安技術、深度學習、人工智慧系統平台、智慧顯示科技、影像處理與分析、自然語言處理、智慧物聯網科技、智慧製造技術、智慧機器人、新興能源材料、奈米元件、光電與儲能元件等研究、再生能源系統、新世代替代能源、節能科技、智慧電網、油電車輛、電動車輛系統等與產業創新相關，並能提升專業知能之技術訓練活動。\n申請核准適用第一項規定投資抵減之公司，其當年度投入於產業創新人才培育支出，不得適用其他法律為鼓勵產業創新人才培育目的提供之所得稅優惠。\n公司於同一年度申請核准適用第一項規定之投資抵減，或與本條例或其他法律規定之投資抵減合併適用時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n前五項投資抵減之適用範圍、資格條件、一定規模、申請期限、申請程序、核定機關、當年度合計得抵減總額之計算及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、本條新增。\n二、為鼓勵進行產業創新人才之培育，持續推動產業進步和競爭力，並應對產業環境之變化，成為推動國家經濟持續成長之動力，於第一項明定自中華民國一百十三年一月一日起至一百十八年十二月三十一日止，產業得就進行產業創新人才培育支出進行稅額抵減。\n三、第二項為人才培育之定義。\n四、第三項為產業創新技術課程之定義。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第二十二條","current":"公司從事國外投資者，應於實行投資前，向中央主管機關申請核准。但投資新臺幣十五億元以下金額者，得於實行投資後，報中央主管機關備查。\n前項國外投資之方式、出資種類、申請期限、申請程序及其他相關事項之辦法，由中央主管機關定之。","versions":[{"bill":"201110083730000","text":"公司或有限合夥事業從事國外投資有下列情形之一者，應於實行投資前，向中央主管機關申請核准：\n一、投資於特定國家或地區。\n二、投資涉及特定產業或技術。\n三、投資達一定金額。\n公司或有限合夥事業從事國外投資非屬前項所定情形者，應於實行投資後，報中央主管機關備查。\n公司或有限合夥事業依第一項申請投資核准，經中央主管機關會商相關主管機關，認定有下列情形之一者，中央主管機關得全部或一部不予核准，或為附附款之核准：\n一、影響國家安全。\n二、對國家經濟發展有不利影響。\n三、影響政府遵守所締結之國際條約或協定。\n四、申請投資公司或有限合夥事業違反勞動相關法規引發重大勞資糾紛尚未解決。\n第一項及第二項之情形，公司或有限合夥事業實行國外投資後，國外投資事業之經營有前項各款所定情形之一者，中央主管機關得令其採行一定改正措施；情節重大者，得令其撤回投資。\n第一項所定特定國家或地區、特定產業或技術、一定金額、國外投資之方式、出資種類、申請程序、第二項備查事項、報請備查期間、前項一定改正措施及其他相關事項之辦法，由中央主管機關會商相關主管機關定之。","note":"一、我國現行規定公司從事國外投資逾新臺幣十五億元者，應於實行投資前，向中央主管機關申請核准；對於投資前述金額以下於特定國家或地區、涉及特定產業或技術之案件，於實行投資前，中央主管機關並無事先審核權。為避免關鍵技術外流，影響產業競爭力及流入對國家構成威脅之國家或企業，影響國家安全；又為優化審查資源配置，集中行政資源在高風險投資案件，提升審查效率，讓企業掌握投資時效及商機，維持我國產業競爭力，另有限合夥法已自一百零四年十一月三十日施行，實務上亦有事業以有限合夥之組織型態從事國外投資，爰修正第一項規定，公司或有限合夥事業從事國外投資係投資於特定國家或地區、涉及特定產業或技術或達一定金額者，應於實行投資前向中央主管機關申請核准。\n二、第一項但書修正移列為第二項，明定非屬第一項規定情形之案件，公司或有限合夥事業從事國外投資應於實行投資後，報中央主管機關備查，俾利中央目的事業主管機關掌握公司國外投資相關資訊，並得予適當之協助及輔導。\n三、鑑於國際情勢日益複雜及社會經濟結構之變化，爰新增第三項明定經中央主管機關會商相關主管機關，認定有下列情形之一者，中央主管機關得全部或一部不予核准，或為附行政程序法第九十三條第二項附款之核准：\n(一)影響國家安全。\n(二)對國家經濟發展有不利影響。包括但不限於影響國內產業在國際之領先地位與關鍵角色、供應鏈韌性與安全、影響國家競爭力及經濟成長與穩定。\n(三)影響政府遵守所締結之國際條約或協定。係為確保我國遵守及履行所締結之國際條約或協定之規範及義務。\n(四)違反勞動相關法規引發重大勞資糾紛尚未解決。包括但不限於惡意關廠並轉移資本，致影響勞工權益。\n四、新增第四項規定，第一項及第二項之情形，公司或有限合夥事業實行國外投資後，國外投資事業之經營，倘經中央主管機關發現有第三項各款所定情形之一者，中央主管機關得令其採行一定改正措施；情節重大者，得令其撤回投資。至於中央主管機關得採行一定改正措施，如限制技術移轉、投資金額及比率，或業務範圍等，以達減輕或消除第三項所列各款情形之目的。\n五、第二項移列第五項，並增訂授權中央主管機關就第一項特定國家或地區、特定產業或技術、一定金額、國外投資之方式、出資種類、申請程序、第二項備查事項、報請備查期間、第四項一定改正措施及其他相關事項，在考量國際經貿情勢變化、國內產業及關鍵技術之發展適時滾動檢討，於會商相關主管機關後定於辦法中，俾兼顧企業對外投資之便利及經濟安全衡平管理之目標。"}],"changed":true,"final":"公司或有限合夥事業從事國外投資有下列情形之一者，應於實行投資前，向中央主管機關申請核准：\n一、投資於特定國家或地區。\n二、投資涉及特定產業或技術。\n三、投資達一定金額。\n公司或有限合夥事業從事國外投資非屬前項所定情形者，應於實行投資後，報中央主管機關備查。\n公司或有限合夥事業依第一項申請投資核准，經中央主管機關會商相關主管機關，認定有下列情形之一者，中央主管機關得全部或一部不予核准，或為附附款之核准：\n一、影響國家安全。\n二、對國家經濟發展有不利影響。\n三、影響政府遵守所締結之國際條約或協定。\n四、申請投資公司或有限合夥事業違反勞動相關法規引發重大勞資糾紛尚未解決。\n第一項及第二項之情形，公司或有限合夥事業實行國外投資後，國外投資事業之經營有前項各款所定情形之一者，中央主管機關得令其採行一定改正措施；情節重大者，得令其撤回投資。\n第一項所定特定國家或地區、特定產業或技術、一定金額、國外投資之方式、出資種類、申請程序、第二項備查事項、報請備查期間、前項一定改正措施及其他相關事項之辦法，由中央主管機關會商相關主管機關定之。","finalWhy":"一、我國原規定公司從事國外投資逾新臺幣十五億元者，應於實行投資前，向中央主管機關申請核准；對於投資前述金額以下於特定國家或地區、涉及特定產業或技術之案件，於實行投資前，中央主管機關並無事先審核權。為避免關鍵技術外流，影響產業競爭力及流入對國家構成威脅之國家或企業，影響國家安全；又為優化審查資源配置，集中行政資源在高風險投資案件，提升審查效率，讓企業掌握投資時效及商機，維持我國產業競爭力，另有限合夥法已自一百零四年十一月三十日施行，實務上亦有事業以有限合夥之組織型態從事國外投資，爰修正第一項規定，公司或有限合夥事業從事國外投資係投資於特定國家或地區、涉及特定產業或技術或達一定金額者，應於實行投資前向中央主管機關申請核准。\n二、第一項但書修正移列為第二項，明定非屬第一項規定情形之案件，公司或有限合夥事業從事國外投資應於實行投資後，報中央主管機關備查，俾利中央目的事業主管機關掌握公司國外投資相關資訊，並得予適當之協助及輔導。\n三、鑑於國際情勢日益複雜及社會經濟結構之變化，爰新增第三項明定經中央主管機關會商相關主管機關，認定有下列情形之一者，中央主管機關得全部或一部不予核准，或為附行政程序法第九十三條第二項附款之核准：\n(一)影響國家安全。\n(二)對國家經濟發展有不利影響。包括但不限於影響國內產業在國際之領先地位與關鍵角色、供應鏈韌性與安全、影響國家競爭力及經濟成長與穩定。\n(三)影響政府遵守所締結之國際條約或協定。係為確保我國遵守及履行所締結之國際條約或協定之規範及義務。\n(四)違反勞動相關法規引發重大勞資糾紛尚未解決。包括但不限於惡意關廠並轉移資本，致影響勞工權益。\n四、新增第四項規定，第一項及第二項之情形，公司或有限合夥事業實行國外投資後，國外投資事業之經營，倘經中央主管機關發現有第三項各款所定情形之一者，中央主管機關得令其採行一定改正措施；情節重大者，得令其撤回投資。至於中央主管機關得採行一定改正措施，如限制技術移轉、投資金額及比率，或業務範圍等，以達減輕或消除第三項所列各款情形之目的。\n五、第二項移列第五項，並增訂授權中央主管機關就第一項特定國家或地區、特定產業或技術、一定金額、國外投資之方式、出資種類、申請程序、第二項備查事項、報請備查期間、第四項一定改正措施及其他相關事項，在考量國際經貿情勢變化、國內產業及關鍵技術之發展適時滾動檢討，於會商相關主管機關後定於辦法中，俾兼顧企業對外投資之便利及經濟安全衡平管理之目標。","review":{"note":"照行政院提案通過","text":"公司或有限合夥事業從事國外投資有下列情形之一者，應於實行投資前，向中央主管機關申請核准：\n一、投資於特定國家或地區。\n二、投資涉及特定產業或技術。\n三、投資達一定金額。\n公司或有限合夥事業從事國外投資非屬前項所定情形者，應於實行投資後，報中央主管機關備查。\n公司或有限合夥事業依第一項申請投資核准，經中央主管機關會商相關主管機關，認定有下列情形之一者，中央主管機關得全部或一部不予核准，或為附附款之核准：\n一、影響國家安全。\n二、對國家經濟發展有不利影響。\n三、影響政府遵守所締結之國際條約或協定。\n四、申請投資公司或有限合夥事業違反勞動相關法規引發重大勞資糾紛尚未解決。\n第一項及第二項之情形，公司或有限合夥事業實行國外投資後，國外投資事業之經營有前項各款所定情形之一者，中央主管機關得令其採行一定改正措施；情節重大者，得令其撤回投資。\n第一項所定特定國家或地區、特定產業或技術、一定金額、國外投資之方式、出資種類、申請程序、第二項備查事項、報請備查期間、前項一定改正措施及其他相關事項之辦法，由中央主管機關會商相關主管機關定之。"}},{"no":"第二十三條之一","current":"為協助新創事業公司之發展，自中華民國一百零六年一月一日起至一百十八年十二月三十一日止，依有限合夥法規定新設立且屬第三十二條規定之下列創業投資事業，得適用第四項課稅規定：\n一、分年出資之創業投資事業，符合下列各目規定，且自該事業設立第二年度起各年度之資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額合計達當年度實收出資總額百分之五十並符合政府政策，經申請中央主管機關逐年核定者：\n(一)設立當年度及第二年度：各年度終了日有限合夥契約約定出資總額達新臺幣三億元。\n(二)設立第三年度：實收出資總額於年度終了日達新臺幣一億元。\n(三)設立第四年度：實收出資總額於年度終了日達新臺幣二億元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之三十或新臺幣三億元。\n(四)設立第五年度：實收出資總額於年度終了日達新臺幣三億元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之三十或新臺幣三億元。\n二、於設立當年度實收出資總額達新臺幣三億元之創業投資事業，符合下列各目規定，且自該事業設立第二年度起各年度之資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額合計達決定出資總額百分之五十並符合政府政策，經申請中央主管機關逐年核定者：\n(一)設立第二年度：實收出資總額於年度終了日達新臺幣三億元。\n(二)設立第三年度：決定出資總額於年度終了日達新臺幣一億元。\n(三)設立第四年度：決定出資總額於年度終了日達新臺幣二億元，且累計投資於新創事業公司之金額達該事業當年度決定出資總額百分之三十或新臺幣三億元。\n(四)設立第五年度：決定出資總額於年度終了日達新臺幣三億元，且累計投資於新創事業公司之金額達該事業當年度決定出資總額百分之三十或新臺幣三億元。\n前項第二款所稱決定出資總額，指該款創業投資事業於申請中央主管機關逐年核定時所決定之前一年度出資總額；該出資總額不得少於該事業於設立年度起至前一年度終了日止之實際累計投資金額，並應於第四項所定適用期間屆滿前達到募資完成之實收出資總額。\n適用第四項規定之事業，嗣後辦理清算者，於清算期間內得不受第一項規定限制，繼續適用第四項規定。\n符合第一項規定之事業，自設立之會計年度起十年內，得就各該年度收入總額，依所得稅法第二十四條規定計算營利事業所得額，分別依有限合夥法第二十八條第二項規定之盈餘分配比例，計算各合夥人營利所得額，由合夥人依所得稅法規定徵免所得稅，但屬源自所得稅法第四條之一所定證券交易所得部分，個人或總機構在我國境外之營利事業之合夥人免納所得稅。合夥人於實際獲配適用本項規定事業之盈餘時，不計入所得額課稅。\n適用前項規定之事業，如有特殊情形，得於該項所定適用期間屆滿三個月前，專案報經中央主管機關核准延長適用期間，但延長之期間不得超過五年，並以延長一次為限。\n適用第四項規定之事業，於該項所定適用期間內，應依所得稅法第七十一條第一項、第七十五條第一項及第二項規定期限內按財政部規定格式辦理結算、決算及清算申報，無須計算及繳納其應繳納之稅額，不適用同法第三十九條第一項但書虧損扣除、第四十二條第一項轉投資收益不計入所得額課稅、本條例及其他法律有關租稅優惠之規定，並免依同法第六十六條之九未分配盈餘加徵營利事業所得稅及第一百零二條之二第一項報繳未分配盈餘加徵稅額。\n適用第四項規定之事業，其當年度所得之扣繳稅款，得依有限合夥法第二十八條第二項規定之盈餘分配比例計算各合夥人之已扣繳稅款。該已扣繳稅款得抵繳合夥人之應納所得稅額。適用第四項規定之事業應於各適用年度所得稅結算申報或決算、清算申報法定截止日前，將依第四項規定計算之合夥人之所得額與前開已扣繳稅款，按財政部規定格式填發予各合夥人，並以該事業年度決算日、應辦理當期決算申報事由之日或清算完結日作為合夥人所得歸屬年度。\n有第四項所得之合夥人為非我國境內居住之個人或總機構在我國境外之營利事業者，應以適用該項規定之事業負責人為所得稅扣繳義務人，於該事業當年度所得稅結算申報或決算、清算申報法定截止日前，依規定之扣繳率扣取稅款，並於該截止日之次日起十日內向國庫繳清，及開具扣繳憑單，向該管稅捐稽徵機關申報核驗後，填發予合夥人。該合夥人有前項已扣繳稅款者，得自其應扣繳稅款中減除。\n擬適用第四項課稅規定之事業，應於設立之次年二月底前擇定，並擇定適用第一項第一款或第二款規定，一經擇定，不得變更；適用期間經中央主管機關核定不符合第一項規定者，自不符合規定之年度起，不得再適用第四項規定，並應依所得稅法及所得基本稅額條例規定辦理。\n第一項所稱新創事業公司，指依公司法設立之公司，或實際營運活動在我國境內之外國公司，且於適用第四項規定之事業取得該公司新發行股份時，設立未滿五年者。\n第一項及前項所稱實際營運活動在我國境內之外國公司，指依外國法律設立之公司，在我國境內設立子公司或分公司，且經中央主管機關認定符合下列各款規定者：\n一、作成重大經營管理、財務管理及人事管理決策者為我國境內居住之個人或總機構在我國境內之營利事業，或作成該等決策之處所在我國境內。\n二、財務報表、會計帳簿紀錄、董事會議事錄或股東會議事錄之製作或儲存處所在我國境內。\n三、在我國境內有實際執行主要經營活動。\n第一項實收出資總額與決定出資總額之計算、資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額及比率之計算、符合政府政策之範圍、投資於新創事業公司累計金額占有限合夥事業實收出資總額、決定出資總額比率之計算與申請及核定程序、第五項之特殊情形及延長適用期間之申請程序、前項實際營運活動在我國境內之外國公司之認定與相關證明文件及其他相關事項之辦法，由中央主管機關會同財政部定之。\n適用第四項規定事業之所得計算與申報程序、第八項扣繳程序及其他相關事項之辦法，由財政部定之；第八項之扣繳率，由財政部擬訂，報請行政院核定。","versions":[{"bill":"202110077270000","text":"為協助新創事業公司之發展，自中華民國一百十四年一月一日起，依有限合夥法規定新設立且屬第三十二條規定之創業投資事業，符合下列各款規定，且自該事業設立第二年度起各年度之資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額合計達當年度累計投資金額百分之五十並符合政府政策，經申請中央主管機關逐年核定者，得適用第三項課稅規定：\n一、設立當年度及第二年度：各年度終了日有限合夥契約約定出資總額達新臺幣五千萬元。\n二、設立第三年度：實收出資總額於年度終了日達新臺幣一千五百萬元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或至少達新臺幣二億元。\n三、設立第四年度：實收出資總額於年度終了日達新臺幣三千萬元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或至少達新臺幣三億元。\n四、設立第五年度：實收出資總額於年度終了日達新臺幣五千萬元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或至少達新臺幣三億元。\n適用第三項規定之事業，嗣後辦理清算者，於清算期間內得不受第一項規定限制，繼續適用第三項規定。\n符合第一項規定之事業，自設立之會計年度起十年內，得就各該年度收入總額，依所得稅法第二十四條規定計算營利事業所得額，分別依有限合夥法第二十八條第二項規定之盈餘分配比例，計算各合夥人營利所得額，由合夥人依所得稅法規定徵免所得稅，但屬源自所得稅法第四條之一所定證券交易所得部分，個人或總機構在我國境外之營利事業之合夥人免納所得稅。合夥人於實際獲配適用本項規定事業之盈餘時，不計入所得額課稅。\n適用前項規定之事業，如有特殊情形，得於該項所定適用期間屆滿三個月前，專案報經中央主管機關核准延長適用期間，但延長之期間不得超過五年，並以延長一次為限。\n適用第三項規定之事業，於該項所定適用期間內，應依所得稅法第七十一條第一項、第七十五條第一項及第二項規定期限內按財政部規定格式辦理結算、決算及清算申報，無須計算及繳納其應繳納之稅額，不適用同法第三十九條第一項但書虧損扣除、第四十二條第一項轉投資收益不計入所得額課稅、本條例及其他法律有關租稅優惠之規定，並免依同法第六十六條之九未分配盈餘加徵營利事業所得稅及第一百零二條之二第一項報繳未分配盈餘加徵稅額。\n適用第三項規定之事業，其當年度所得之扣繳稅款，得依有限合夥法第二十八條第二項規定之盈餘分配比例計算各合夥人之已扣繳稅款。該已扣繳稅款得抵繳合夥人之應納所得稅額。適用第四項規定之事業應於各適用年度所得稅結算申報或決算、清算申報法定截止日前，將依第四項規定計算之合夥人之所得額與前開已扣繳稅款，按財政部規定格式填發予各合夥人，並以該事業年度決算日、應辦理當期決算申報事由之日或清算完結日作為合夥人所得歸屬年度。\n有第三項所得之合夥人為非我國境內居住之個人或總機構在我國境外之營利事業者，應以適用該項規定之事業負責人為所得稅扣繳義務人，於該事業當年度所得稅結算申報或決算、清算申報法定截止日前，依規定之扣繳率扣取稅款，並於該截止日之次日起十日內向國庫繳清，及開具扣繳憑單，向該管稅捐稽徵機關申報核驗後，填發予合夥人。該合夥人有前項已扣繳稅款者，得自其應扣繳稅款中減除。\n擬適用第三項課稅規定之事業，應於設立之次年二月底前擇定，並擇定適用第一項第一款或第二款規定，一經擇定，不得變更；適用期間經中央主管機關核定不符合第一項規定者，自不符合規定之年度起，不得再適用第四項規定，並應依所得稅法及所得基本稅額條例規定辦理。\n第一項所稱新創事業公司，指依公司法設立之公司，或實際營運活動在我國境內之外國公司，且於適用第三項規定之事業取得該公司新發行股份時，設立未滿八年或公開發行前者。\n第一項及前項所稱實際營運活動在我國境內之外國公司，指依外國法律設立之公司，在我國境內設立直接或間接控制之子公司或分公司，且經中央主管機關認定符合下列各款規定者：\n一、作成重大經營管理、財務管理及人事管理決策者為我國境內居住之個人或總機構在我國境內之營利事業，或作成該等決策之處所在我國境內。\n二、財務報表、會計帳簿紀錄、董事會議事錄或股東會議事錄之製作或儲存處所在我國境內。\n三、在我國境內有實際執行主要經營活動。\n第一項實收出資總額與累計投資金額之計算、資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額及比率之計算、符合政府政策之範圍、投資於新創事業公司累計金額占有限合夥事業實收出資總額、累計投資金額比率之計算與申請及核定程序、第四項之特殊情形及延長適用期間之申請程序、前項實際營運活動在我國境內之外國公司之認定與相關證明文件及其他相關事項之辦法，由中央主管機關會同財政部定之。\n適用第三項規定事業之所得計算與申報程序、第八項扣繳程序及其他相關事項之辦法，由財政部定之；第八項之扣繳率，由財政部擬訂，報請行政院核定。","note":"一、配合本次修正條文施行期間已定明於修正條文第七十二條第七項，自一百十四年一月一日起至一百十八年十二月三十一日止，爰修正第一項序文，定明一百十四年一月一日起依有限合夥法設立之創業投資事業，始有修正後本條租稅優惠規定之適用。\n二、為鼓勵更多有限合夥創業投資事業資金加速挹注新創事業，打造國內創新創業雨林生態系，另考量本條租稅優惠適用門檻之一致性，爰修正第一項序文，並整併現行第一項第一款及第二款所定本條租稅優惠之出資額門檻，修正為第一項第一款至第四款，不再區分分年出資及設立當年度實收出資總額達一定金額門檻之有限合夥創業投資事業，統一以當年度該事業累計投資金額百分之五十作為該事業設立第二年度起各年度之資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額門檻，並定明該事業適用本條租稅優惠之出資額門檻與該事業設立第三年度至第五年度須達成累計投資新創事業公司之出資額比例及金額，說明如下：\n(一)第一款明定有限合夥創業投資事業適用本條租稅優惠，其設立當年度及第二年度之有限合夥契約約定出資總額門檻為新臺幣五千萬元。\n(二)第二款明定有限合夥創業投資事業適用本條租稅優惠，其設立第三年度之實收出資總額須達新臺幣一千五百萬元，且累計投資於新創事業公司之金額須達該事業當年度實收出資總額百分之五十，或至少達新臺幣二億元。\n(三)第三款明定有限合夥創業投資事業適用本項租稅優惠，於設立第四年度之實收出資總額須達新臺幣三千萬元，且累計投資於新創事業公司之金額須達該事業當年度實收出資總額百分之五十，或至少達新臺幣三億元。\n(四)第四款明定有限合夥創業投資事業適用本項租稅優惠，於設立第五年度之實收出資總額須達新臺幣五千萬元，且累計投資於新創事業公司之金額須達該事業當年度實收出資總額百分之五十，或至少達新臺幣三億元。\n三、考量第一項修正後，已無現行第二款決定出資總額之情形，爰刪除現行第二項規定，現行第三項至第十三項項次遞移為第二項至第十二項，第二項、第五項至第九項、第十一項及第十二項酌作文字修正；第三項、第四項內容未修正。\n四、修正第九項。參考《具創新能力之新創事業認定原則》對新創事業公司之定義，將租稅穿透適用要件，自投資成立未滿五年經中央目的事業主管機關核定之國內高風險新創事業公司，擴大至未滿八年者，並將八年內便取得公開發行資格此類發展順利者予以排除。\n五、修正第十項。開放投資外國公司在我國境內設立直接或間接控制之子公司或分公司亦得適用租稅穿透，放寬實質營運在我國境內之外國公司可採多層次架構，增加外國公司於我國境內之營運規劃彈性。"},{"bill":"201110083730000","text":"為協助新創事業公司之發展，自中華民國一百十四年一月一日起至一百十八年十二月三十一日止，依有限合夥法規定新設立且屬第三十二條規定之創業投資事業，符合下列各款規定，且自該事業設立第二年度起各年度之資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額合計達當年度累計投資金額百分之五十，並符合政府政策，經申請中央主管機關逐年核定者，得適用第三項課稅規定：\n一、設立當年度及第二年度：各年度終了日有限合夥契約約定出資總額達新臺幣一億五千萬元。\n二、設立第三年度：實收出資總額於年度終了日達新臺幣五千萬元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或達新臺幣二億元且不得低於該事業當年度實收出資總額百分之二十。\n三、設立第四年度：實收出資總額於年度終了日達新臺幣一億元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或達新臺幣三億元且不得低於該事業當年度實收出資總額百分之三十。\n四、設立第五年度：實收出資總額於年度終了日達新臺幣一億五千萬元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或達新臺幣四億元且不得低於該事業當年度實收出資總額百分之四十。\n適用第三項規定之事業，嗣後辦理清算者，於清算期間內得不受前項規定限制，繼續適用第三項規定。\n符合第一項規定之事業，自設立之會計年度起十年內，得就各該年度收入總額，依所得稅法第二十四條規定計算營利事業所得額，分別依有限合夥法第二十八條第二項規定之盈餘分配比例，計算各合夥人營利所得額，由合夥人依所得稅法規定徵免所得稅，合夥人為個人者，不適用同法第十五條第四項及第五項規定；屬源自所得稅法第四條之一所定證券交易所得部分，個人或總機構在我國境外之營利事業之合夥人免納所得稅。合夥人於實際獲配適用本項規定事業之盈餘時，不計入所得額課稅。\n適用前項規定之事業，如有特殊情形，得於該項所定適用期間屆滿三個月前，專案報經中央主管機關核准延長適用期間；延長之期間不得超過五年，並以延長一次為限。\n適用第三項規定之事業，於該項所定適用期間內，應依所得稅法第七十一條第一項、第七十五條第一項及第二項規定期限內按財政部規定格式辦理結算、決算及清算申報，無須計算及繳納其應繳納之稅額，不適用同法第三十九條第一項但書虧損扣除、第四十二條第一項轉投資收益不計入所得額課稅、本條例及其他法律有關租稅優惠之規定，並免依同法第六十六條之九未分配盈餘加徵營利事業所得稅及第一百零二條之二第一項報繳未分配盈餘加徵稅額，且不適用所得基本稅額條例規定。\n適用第三項規定之事業，其當年度所得之扣繳稅款，得依有限合夥法第二十八條第二項規定之盈餘分配比例計算各合夥人之已扣繳稅款。該已扣繳稅款得抵繳合夥人之應納所得稅額。適用第三項規定之事業應於各適用年度所得稅結算申報或決算、清算申報法定截止日前，將依第三項規定計算之合夥人之所得額與前開已扣繳稅款，按財政部規定文件格式填發予各合夥人，並以該事業年度決算日、應辦理當期決算申報事由之日或清算完結日作為合夥人所得歸屬年度。\n有第三項所得之合夥人為非我國境內居住之個人或總機構在我國境外之營利事業者，應以適用該項規定之事業為所得稅扣繳義務人，於該事業當年度所得稅結算申報或決算、清算申報法定截止日前，依規定之扣繳率扣取稅款，並於該截止日之次日起算十日內向國庫繳清，及開具扣繳憑單，向該管稅捐稽徵機關申報核驗後，填發予合夥人。該截止日之次日起算十日內遇連續三日以上國定假日者，所扣稅款繳納、扣繳憑單申報核驗及發給期間延長五日。該合夥人有前項已扣繳稅款者，得自其應扣繳稅款中減除。\n擬適用第三項課稅規定之事業，應於設立之次年二月底前擇定，一經擇定，不得變更；適用期間經中央主管機關核定不符合第一項規定者，自不符合規定之年度起，不得再適用第三項規定，並應依所得稅法及所得基本稅額條例規定辦理。\n第一項所稱新創事業公司，指依公司法設立之公司，或實際營運活動在我國境內之外國公司，且於適用第三項規定之事業取得該公司新發行股份時，設立未滿五年者。\n第一項及前項所稱實際營運活動在我國境內之外國公司，指依外國法律設立之公司，在我國境內設立子公司或分公司，且經中央主管機關認定符合下列各款規定者：\n一、作成重大經營管理、財務管理及人事管理決策者為我國境內居住之個人或總機構在我國境內之營利事業，或作成該等決策之處所在我國境內。\n二、財務報表、會計帳簿紀錄、董事會議事錄或股東會議事錄之製作或儲存處所在我國境內。\n三、在我國境內有實際執行主要經營活動。\n第一項實收出資總額與累計投資金額之計算、資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額及比率之計算、符合政府政策之範圍、投資於新創事業公司累計金額占有限合夥事業實收出資總額比率之計算與申請及核定程序、第四項之特殊情形及延長適用期間之申請程序、前項實際營運活動在我國境內之外國公司之認定與相關證明文件及其他相關事項之辦法，由中央主管機關會同財政部定之。\n適用第三項規定事業之所得計算與申報程序、第七項扣繳程序及其他相關事項之辦法，由財政部定之；第七項之扣繳率，由財政部擬訂，報請行政院核定。","note":"一、修正第一項序文，定明自一百十四年一月一日起至一百十八年十二月三十一日止，依有限合夥法設立之創業投資事業，始有修正後租稅優惠規定之適用。\n二、現行所定租稅優惠，係為協助新創事業公司之發展，使出資額達新臺幣三億元並以部分資金投資新創事業公司之有限合夥創業投資事業，自該事業設立第二年起各年度之資金運用於我國境內，及投資於實際營運活動在我國境內之外國公司，其金額合計達當年度實收出資總額或決定出資總額百分之五十，並符合政府政策者，得採透視個體概念課稅。\n三、為鼓勵更多有限合夥創業投資事業資金加速挹注新創事業，打造國內創新創業雨林生態系，另考量本條租稅優惠適用門檻之一致性，爰修正第一項序文，並整併現行第一項第一款及第二款所定租稅優惠之出資額門檻，修正為第一項第一款至第四款，不再區分分年出資及設立當年度實收出資總額達一定金額門檻之有限合夥創業投資事業，均以當年度該事業累計投資金額百分之五十作為該事業設立第二年度起各年度之資金運用於我國境內，及投資於實際營運活動在我國境內之外國公司金額門檻，並定明該事業適用第三項課稅規定之出資額門檻，與該事業設立第三年度至第五年度須達成累計投資新創事業公司之出資額比率及金額，說明如下：\n(一)第一款明定有限合夥創業投資事業適用第三項課稅規定，其設立當年度及第二年度之有限合夥契約約定出資總額門檻為新臺幣一億五千萬元。\n(二)第二款明定有限合夥創業投資事業適用第三項課稅規定，其設立第三年度之實收出資總額須達新臺幣五千萬元，且累計投資於新創事業公司之金額須達該事業當年度實收出資總額百分之五十，或達新臺幣二億元且不得低於該事業當年度實收出資總額百分之二十。\n(三)第三款明定有限合夥創業投資事業適用第三項課稅規定，於設立第四年度之實收出資總額須達新臺幣一億元，且累計投資於新創事業公司之金額須達該事業當年度實收出資總額百分之五十，或達新臺幣三億元且不得低於該事業當年度實收出資總額百分之三十。\n(四)第四款明定有限合夥創業投資事業適用第三項課稅規定，於設立第五年度之實收出資總額須達新臺幣一億五千萬元，且累計投資於新創事業公司之金額須達該事業當年度實收出資總額百分之五十，或達新臺幣四億元且不得低於該事業當年度實收出資總額百分之四十。\n四、考量第一項修正後，已無現行第二款決定出資總額之情形，爰刪除第二項規定。第三項配合修正引用項次，移列第二項。\n五、考量一百零七年二月七日修正所得稅法優化所得稅制，實施股利所得二擇一課稅制度，旨在減輕股利所得總稅負，使內、外資稅負趨於衡平，其適用範圍限於課徵營利事業所得稅之營利事業稅後盈餘分配予股東、社員或出資者之股利或盈餘；獨資資本主或合夥組織之合夥人應獲配之盈餘因於營利事業階段未課徵營利事業所得稅，爰不得適用股利二擇一課稅制度。而適用第三項課稅規定之有限合夥創投事業規定不課徵營利事業所得稅，係比照一般合夥組織課稅方式，爰有限合夥創投事業之個人合夥人計算分配之營利所得額，應依所得稅法第十四條第一項第一類列為營利所得，依規定課徵綜合所得稅，不適用同法第十五條第四項及第五項所定股利所得二擇一課稅制度，現行（一百十二年度）綜合所得稅結算申報書說明七(二)已明文釋明，為資明確，爰酌修第四項文字，移列第三項。\n六、依上開說明適用第三項課稅規定之有限合夥創投事業不課徵營利事業所得稅，係比照一般合夥組織課稅方式，爰可比照該等組織不適用所得基本稅額條例規定，且現行第九項規定，創投事業經核定不符合規定者，應依所得稅法及所得基本稅額條例規定辦理，爰修正第六項，定明有限合夥創投事業不適用所得基本稅額條例規定，俾利遵循，移列第五項，並配合修正引用項次。\n七、配合一百十三年八月七日修正公布所得稅法之優化扣繳制度規定，修正第八項扣繳義務人範圍及增訂遇連續假期延長非我國境內居住之個人或總機構在我國境外之營利事業者扣繳稅款報繳期限之規定，移列第七項，並配合修正引用項次。\n八、第五項、第七項、第九項、第十項、第十二項、第十三項酌作文字或引用項次修正，分別移列第四項、第六項、第八項、第九項、第十一項、第十二項；第十一項內容未修正，移列第十項。"}],"changed":true,"final":"為協助新創事業公司之發展，自中華民國一百十四年一月一日起至一百十八年十二月三十一日止，依有限合夥法規定新設立且屬第三十二條規定之創業投資事業，符合下列各款規定，且自該事業設立第二年度起各年度之資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額合計達當年度累計投資金額百分之五十，並符合政府政策，經申請中央主管機關逐年核定者，得適用第三項課稅規定：\n一、設立當年度及第二年度：各年度終了日有限合夥契約約定出資總額達新臺幣一億五千萬元。\n二、設立第三年度：實收出資總額於年度終了日達新臺幣五千萬元，且累計投資於新創事業公司之金額達該事業當年度實收出 ，且自該事業設立第二年度起各年度之資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額合計達當年度累計投資金額百分之五十，並符合政府政策，經申請中央主管機關逐年核定者，得適用第三項課稅規定：\n一、設立當年度及第二年度：各年度終了日有限合夥契約約定出資總額達新臺幣一億五千萬元。\n二、設立第三年度：實收出資總額於年度終了日達新臺幣五千萬元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或達新臺幣二億元且不得低於該事業當年度實收出資總額百分之二十。\n三、設立第四年度：實收出資總額於年度終了日達新臺幣一億元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或達新臺幣三億元且不得低於該事業當年度實收出資總額百分之三十。\n四、設立第五年度：實收出資總額於年度終了日達新臺幣一億五千萬元，且累計投資於新創事業公司之金額達該事業當年度實收出資總額百分之五十，或達新臺幣四億元且不得低於該事業當年度實收出資總額百分之四十。\n適用第三項規定之事業，嗣後辦理清算者，於清算期間內得不受前項規定限制，繼續適用第三項規定。\n符合第一項規定之事業，自設立之會計年度起十年內，得就各該年度收入總額，依所得稅法第二十四條規定計算營利事業所得額，分別依有限合夥法第二十八條第二項規定之盈餘分配比例，計算各合夥人營利所得額，由合夥人依所得稅法規定徵免所得稅，合夥人為個人者，不適用同法第十五條第四項及第五項規定；屬源自所得稅法第四條之一所定證券交易所得部分，個人或總機構在我國境外之營利事業之合夥人免納所得稅。合夥人於實際獲配適用本項規定事業之盈餘時，不計入所得額課稅。\n適用前項規定之事業，如有特殊情形，得於該項所定適用期間屆滿三個月前，專案報經中央主管機關核准延長適用期間；延長之期間不得超過五年，並以延長一次為限。\n適用第三項規定之事業，於該項所定適用期間內，應依所得稅法第七十一條第一項、第七十五條第一項及第二項規定期限內按財政部規定格式辦理結算、決算及清算申報，無須計算及繳納其應繳納之稅額，不適用同法第三十九條第一項但書虧損扣除、第四十二條第一項轉投資收益不計入所得額課稅、本條例及其他法律有關租稅優惠之規定，並免依同法第六十六條之九未分配盈餘加徵營利事業所得稅及第一百零二條之二第一項報繳未分配盈餘加徵稅額，且不適用所得基本稅額條例規定。\n適用第三項規定之事業，其當年度所得之扣繳稅款，得依有限合夥法第二十八條第二項規定之盈餘分配比例計算各合夥人之已扣繳稅款。該已扣繳稅款得抵繳合夥人之應納所得稅額。適用第三項規定之事業應於各適用年度所得稅結算申報或決算、清算申報法定截止日前，將依第三項規定計算之合夥人之所得額與前開已扣繳稅款，按財政部規定文件格式填發予各合夥人，並以該事業年度決算日、應辦理當期決算申報事由之日或清算完結日作為合夥人所得歸屬年度。\n有第三項所得之合夥人為非我國境內居住之個人或總機構在我國境外之營利事業者，應以適用該項規定之事業為所得稅扣繳義務人，於該事業當年度所得稅結算申報或決算、清算申報法定截止日前，依規定之扣繳率扣取稅款，並於該截止日之次日起算十日內向國庫繳清，及開具扣繳憑單，向該管稅捐稽徵機關申報核驗後，填發予合夥人。該截止日之次日起算十日內遇連續三日以上國定假日者，所扣稅款繳納、扣繳憑單申報核驗及發給期間延長五日。該合夥人有前項已扣繳稅款者，得自其應扣繳稅款中減除。\n擬適用第三項課稅規定之事業，應於設立之次年二月底前擇定，一經擇定，不得變更；適用期間經中央主管機關核定不符合第一項規定者，自不符合規定之年度起，不得再適用第三項規定，並應依所得稅法及所得基本稅額條例規定辦理。\n第一項所稱新創事業公司，指依公司法設立之公司，或實際營運活動在我國境內之外國公司，且於適用第三項規定之事業取得該公司新發行股份時，設立未滿五年者。\n第一項及前項所稱實際營運活動在我國境內之外國公司，指依外國法律設立之公司，在我國境內設立子公司或分公司，且經中央主管機關認定符合下列各款規定者：\n一、作成重大經營管理、財務管理及人事管理決策者為我國境內居住之個人或總機構在我國境內之營利事業，或作成該等決策之處所在我國境內。\n二、財務報表、會計帳簿紀錄、董事會議事錄或股東會議事錄之製作或儲存處所在我國境內。\n三、在我國境內有實際執行主要經營活動。\n第一項實收出資總額與累計投資金額之計算、資金運用於我國境內及投資於實際營運活動在我國境內之外國公司金額及比率之計算、符合政府政策之範圍、投資於新創事業公司累計金額占有限合夥事業實收出資總額比率之計算與申請及核定程序、第四項之特殊情形及延長適用期間之申請程序、前項實際營運活動在我國境內之外國公司之認定與相關證明文件及其他相關事項之辦法，由中央主管機關會同財政部定之。\n適用第三項規定事業之所得計算與申報程序、第七項扣繳程序及其他相關事項之辦法，由財政部定之；第七項之扣繳率，由財政部擬訂，報請行政院核定。"}},{"no":"第二十三條之二","current":"個人以現金投資於成立未滿二年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣一百萬元，並取得該公司之新發行股份，持有期間達二年者，得就投資金額百分之五十限度內，自持有期間屆滿二年之當年度個人綜合所得總額中減除。該個人適用本項規定每年得減除之金額，合計以新臺幣三百萬元為限。\n前項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","versions":[{"bill":"202110077270000","text":"個人以現金投資於成立未滿八年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得額中減除。該個人適用本項規定每年得減除之金額，合計以新臺幣一千萬元為限。\n公司或有限合夥事業以現金投資於前項所定高風險新創事業公司，且對同一公司當年度投資金額達新臺幣三百萬元，投資於成立未滿八年之高風險新創事業公司，於成為該公司股東達三年之當年度，得以其取得該公司股票之價款百分之二十限度內，抵減當年度應納營利事業所得稅額。其每年得抵減總額，以不超過該公司或有限合夥事業當年度應納營利事業所得稅額百分之五十為限。\n前項公司或有限合夥事業如為創業投資事業，應由其股東或合夥人按該創業投資事業投資於成立未滿八年之高風險新創事業公司之金額，依其持有該創業投資事業股份或出資額比例，計算投資金額，於創業投資事業成為該高風險新創事業公司股東達三年之當年度，按投資金額之百分之二十限度內抵減應納營利事業所得稅額；或按投資金額百分五十限度內自當年度個人綜合所得總額中減除。其每年得抵減總額，以不超過該股東或合夥人當年度應納營利事業所得稅額百分之五十為限；個人股東或合夥人每年得減除之金額，合計以新臺幣一千萬元為限。\n第二項公司或有限合夥事業、前項創業投資事業之股東或合夥人於同一年度合併適用前二項投資抵減及其他投資抵減時，其當年度合計得抵減總額以不超過當年度應納營利事業所得稅額或綜合所得稅額百分之五十為限。但依其他法律規定當年度為最後抵減年度且抵減金額不受限制者，不在此限。\n第一項個人、第二項公司或有限合夥事業、第三項創業投資事業之股東或合夥人適用投資抵減之要件、高風險新創事業公司之適用範圍與資格條件、申請期限、申請程序、持有股份或成為股東之期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、修正第一項。為鼓勵新創事業公司創立或擴充，協助天使投資分散投資以趨避風險，爰參考《具創新能力之新創事業認定原則》對新創事業公司之定義，將天使投資投資抵減適用範圍，自投資成立未滿二年經中央目的事業主管機關核定之國內高風險新創事業公司，擴大至未滿八年者，同時調降個案投資下限、提高新發行股份持有期間及個人所得額減除上限，鼓勵全民參與新創投資。\n二、新增第二項。參照《生技醫藥產業發展條例》及《文化創意產業發展法》立法例，將營利事業納入天使投資抵減適用對象。\n三、新增第三項。理由同說明二，將創業投資事業股東納入天使投資抵減適用對象。\n四、修正第五項。配合前四項修正及新增，酌作文字修正。"},{"bill":"201110083730000","text":"個人以現金投資於成立未滿五年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得總額中減除。\n個人適用前項投資金額減除優惠，當年度合計得減除總額以新臺幣五百萬元為限；其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n前二項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、國家重點發展產業之範圍及認定程序、減除總額限額之計算、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、現行第一項所定租稅優惠措施，係為引導資金挹注高風險新創事業公司並扶植其發展，自一百零六年十一月二十四日施行迄今，提供個人以現金投資於成立未滿二年之高風險新創事業公司，投資金額達新臺幣一百萬元，並取得該公司之新發行股份，持有期間達二年者，得就其投資金額自每年個人綜合所得總額減除之租稅優惠。惟考量不同產業新創樣態有所差異，需要較長之天使期，並參酌「行政院國家發展基金創業天使投資方案」，係以風險性較高且設立年限未滿五年之新創事業為適用對象，為協助該等新創事業公司取得營運發展所需資金、穩健成長，爰修正第一項，將高風險新創事業公司設立年限修正為未滿五年、投資金額門檻修正為新臺幣五十萬元，幫助公司募集資金、累積資本，同時為利公司規劃中長期資金之運用，明定持股期間需達三年，始得適用本項租稅優惠。\n二、第一項後段減除金額上限之規定移列為第二項，定明個人投資之高風險新創事業公司，當年度合計得減除總額以新臺幣五百萬元為限，其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n三、第二項移列為第三項，並增訂第二項國家重點發展產業之範圍及認定程序、減除總額限額之計算，授權由中央主管機關會同財政部定之。中央主管機關會同財政部擬定國家重點發展產業範圍及認定程序時，並得會商相關中央目的事業主管機關提供意見，併予敘明。\n四、另有關修正後，新、舊法所定高風險新創事業公司設立年限及投資金額門檻之適用，應以個人現金繳納股款日為基準，個人自一百十四年一月一日起至一百十八年十二月三十一日止繳納股款者，應適用修正條文規定；於一百十三年十二月三十一日以前繳納股款者，應適用現行條文規定，併予敘明。"}],"changed":true,"final":"個人以現金投資於成立未滿五年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得總額中減除。\n個人適用前項投資金額減除優惠，當年度合計得減除總額以新臺幣五百萬元為限；其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n前二項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、國家重點發展產業之範圍及認定程序、減除總額限額之計算、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","finalWhy":"","review":{"note":"照行政院提案通過","text":"個人以現金投資於成立未滿五年經中央目的事業主管機關核定之國內高風險新創事業公司，且對同一公司當年度投資金額達新臺幣五十萬元，並取得該公司之新發行股份，持有期間達三年者，得就投資金額百分之五十限度內，自持有期間屆滿三年之當年度個人綜合所得總額中減除。\n個人適用前項投資金額減除優惠，當年度合計得減除總額以新臺幣五百萬元為限；其中投資之高風險新創事業公司非屬經中央目的事業主管機關認定之國家重點發展產業者，該部分當年度合計得減除之金額，以新臺幣三百萬元為限。\n前二項個人之資格條件、高風險新創事業公司之適用範圍與資格條件、國家重點發展產業之範圍及認定程序、減除總額限額之計算、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。"}},{"no":"第二十三條之四","current":null,"versions":[{"bill":"202110077270000","text":"為鼓勵創業投資事業投資新創事業公司，個人或營利事業原始認股或應募屬於第三十二條規定之創業投資事業因創立或擴充而發行之記名股票，或出資參與屬於第三十二條規定之有限合夥創業投資事業，持有時間達四年以上，且該創業投資事業於設立五年內投資於新創事業公司並取得該公司之新發行股份之金額達實收資本額或有限合夥契約約定出資額之百分之三十者，於該創業投資事業達成投資新創事業公司比例之當年度，得以其在該創業投資事業之投資金額百分之二十限度內，自當年度起五年內抵減各年度應納所得稅額。其每一年度得抵減總額，以不超過當年度應納所得稅額百分之五十為限。\n前項所稱投資於新創事業公司之金額，係指投資於成立未滿八年之國內或營運總部在國內之新創事業公司之合計。\n創業投資事業應於設立或擴充時，於本條與第二十三條之二條之間擇一適用，一經擇定，不得變更。\n本條各項之資格條件、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法，由中央主管機關會同財政部定之。","note":"一、本條新增。\n二、為鼓勵創業投資事業投資新創事業公司，參考過往促進產業升級條例有關創業投資事業股東投資抵減設計，規定創業投資事業股東適用投資抵減者，應於設立五年內將至少百分之三十資金投資於新創事業公司。\n三、參酌《具創新能力之新創事業認定原則》，定義本條文所稱新創事業公司為成立未滿八年之國內或營運總部在國內之新創事業公司。\n四、授權中央主管機關會同財政部訂定本條文相關資格條件、申請期限、申請程序、持有期間計算、核定機關及其他相關事項之辦法。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第六十七條之一","current":"適用第十二條之一、第十二條之二及第十九條之一者，公司應於股東轉讓或辦理帳簿劃撥之年度、或緩課期間屆滿年度之次年度一月三十一日前，依規定格式向該管稅捐稽徵機關列單申報該已轉讓、辦理帳簿劃撥或屆期尚未轉讓之股份資料；其未依限或未據實申報者，稅捐稽徵機關除限期責令補報或填發外，按其應申報或短計之所得金額，處公司負責人百分之十之罰鍰，但最高不得超過新臺幣五十萬元，最低不得少於新臺幣五萬元；逾期自動申報或填發者，減半處罰。\n經稅捐稽徵機關限期責令補報或填發，公司未依限補報或填發者，按其應申報或短計之所得金額，處公司負責人百分之十五之罰鍰，但最高不得超過新臺幣一百萬元，最低不得少於新臺幣十萬元。","versions":[{"bill":"201110083730000","text":"適用第十二條之一、第十二條之二及第十九條之一者，公司應於股東轉讓或辦理帳簿劃撥之年度、或緩課期間屆滿年度之次年度一月三十一日前，依規定格式向該管稅捐稽徵機關列單申報該已轉讓、辦理帳簿劃撥或屆期尚未轉讓之股份資料；該次年度一月遇連續三日以上國定假日者，列單申報期間延長至二月五日止；其未依限或未據實申報者，稅捐稽徵機關除限期責令補報或填發外，處新臺幣五萬元以上五十萬元以下罰鍰。\n經稅捐稽徵機關限期責令補報或填發，公司未依限補報或填發者，處新臺幣十萬元以上一百萬元以下罰鍰。","note":"一、參考所得稅法第八十九條第三項規定及配合實務作業需要，第一項增訂列單申報期間遇連續三日以上國定假日者延長五日之規定。\n二、配合一百十三年八月七日修正公布所得稅法之優化扣繳制度規定，修正第一項及第二項，說明如下：\n(一)將應處罰鍰之對象由公司負責人，修正為公司。\n(二)將按所得金額之固定比率計算罰鍰及自動補報或填發者固定減半處罰規定，修正為按原罰鍰上限、下限金額處罰。至具體處罰之裁量基準，將另予規範。"}],"changed":true,"final":"適用第十二條之一、第十二條之二及第十九條之一者，公司應於股東轉讓或辦理帳簿劃撥之年度、或緩課期間屆滿年度之次年度一月三十一日前，依規定格式向該管稅捐稽徵機關列單申報該已轉讓、辦理帳簿劃撥或屆期尚未轉讓之股份資料；該次年度一月遇連續三日以上國定假日者，列單申報期間延長至二月五日止；其未依限或未據實申報者，稅捐稽徵機關除限期責令補報或填發外，處新臺幣五萬元以上五十萬元以下罰鍰。\n經稅捐稽徵機關限期責令補報或填發，公司未依限補報或填發者，處新臺幣十萬元以上一百萬元以下罰鍰。","finalWhy":"","review":{"note":"照行政院提案通過","text":"適用第十二條之一、第十二條之二及第十九條之一者，公司應於股東轉讓或辦理帳簿劃撥之年度、或緩課期間屆滿年度之次年度一月三十一日前，依規定格式向該管稅捐稽徵機關列單申報該已轉讓、辦理帳簿劃撥或屆期尚未轉讓之股份資料；該次年度一月遇連續三日以上國定假日者，列單申報期間延長至二月五日止；其未依限或未據實申報者，稅捐稽徵機關除限期責令補報或填發外，處新臺幣五萬元以上五十萬元以下罰鍰。\n經稅捐稽徵機關限期責令補報或填發，公司未依限補報或填發者，處新臺幣十萬元以上一百萬元以下罰鍰。"}},{"no":"第六十七條之二","current":"適用第二十三條之一規定之事業有下列各款情形之一，由稅捐稽徵機關分別依各該款規定處罰：\n一、違反所得稅法第七十一條規定，未依限辦理結算申報，而已依同法第七十九條第一項規定補辦結算申報者，應依稅捐稽徵機關調查核定之所得額，按當年度適用之營利事業所得稅稅率計算之金額另徵百分之十滯報金。但最高不得超過新臺幣三萬元，最低不得少於新臺幣一千五百元。\n二、逾所得稅法第七十九條第一項規定之補報期限，仍未辦理結算申報者，應依稅捐稽徵機關調查核定之所得額，按當年度適用之營利事業所得稅稅率計算之金額另徵百分之二十怠報金。但最高不得超過新臺幣九萬元，最低不得少於新臺幣四千五百元。\n三、已依所得稅法規定辦理結算、決算或清算申報，有短漏報依所得稅法規定之課稅所得額者，應就稅捐稽徵機關核定短漏之課稅所得額，按當年度適用之營利事業所得稅稅率計算之金額，處以二倍以下之罰鍰。\n四、未依所得稅法規定自行 110073260000","text":"本條例自公布日施行。但第十條施行期間自中華民國九十九年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零四年十二月三十日修正公布之第十條、第十二條之一、第十九條之一施行期間，自一百零五年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零六年十一月二十二日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零六年十一月二十四日起至一百零八年十二月三十一日止；第十條及第二十三條之二施行期間，自一百零六年十一月二十四日起至一百十八年十二月三十一日止。\n本條例中華民國一百零七年六月二十日修正公布之第十九條之一施行期間，自一百零七年六月二十二日起至一百零八年十二月三十一日止。\n本條例中華民國一百零八年七月二十四日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零九年一月一日起至一百十八年十二月三十一日止；第二十三條之三施行期間，自公布生效日起至一百十八年十二月三十一日止。\n本條例中華民國一百十二年一月七日修正之條文施行期間，自一百十二年一月一日起至一百十八年十二月三十一日止。\n本條例中華民國○年○月○日修正之第十條之一條文施行期間，自一百十四年一月一日起至一百十八年十二月三十一日止。","note":"一、第一項至第六項未修正。\n二、新增第七項，將第十條之一第一項之適用期間移列至本條第七項規定，並考量本法現行其他租稅條文均施行至118年12月31日止，故延長該施行期限與其他條文拉齊，有助於產業運用：\n(一)根據經濟部產業發展署針對本法第十條之一就智慧機械、5G系統及資通安全產品或服務之歷年實施檢討報告顯示，智慧機械或5G系統租稅優惠自民國108年1月1日起施行後，統計兩申請年度（108年及109年）合計帶動約新臺幣1,953億元投資。之後於111年修正延長投資抵減實施年限，並加入資通安全產品或服務納入投資減抵範疇，實施一年後，合計帶動投資金額已高達4,736億元，促進產業投資效果顯著。鑒於臺灣產業面臨勞動力短缺趨勢，各產業普遍對智慧升級存在需求，投資智慧機械可幫助產業升級轉型；數位部於112年6月1日始公告5G專頻專網管理辦法，受理申請建置專網，將有更多的業者導入垂直應用，也為測試設備產業帶來商機，有利於接軌6G時代的到來，以及資安事件頻傳，未來更須加強資安投資力道。綜上，數位化和智慧化已為產業推進關鍵，延長本法第十條之一關於投資智慧機械、第五代行動通訊系統與資通安全產品或服務等之投資減抵期間，由現行規定「至113年12月31日止」，延長「至118年12月31日止」。\n(二)新增「人工智慧」與「節能減碳」納入可投資抵減項目，其投資抵減稅額適用期限則於修法自114年1月1日至118年12月31日止。"},{"bill":"202110073780000","text":"本條例自公布日施行。但第十條施行期間自中華民國九十九年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零四年十二月三十日修正公布之第十條、第十二條之一、第十九條之一施行期間，自一百零五年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零六年十一月二十二日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零六年十一月二十四日起至一百零八年十二月三十一日止；第十條及第二十三條之二施行期間，自一百零六年十一月二十四日起至一百十八年十二月三十一日止。\n本條例中華民國一百零七年六月二十日修正公布之第十九條之一施行期間，自一百零七年六月二十二日起至一百零八年十二月三十一日止。\n本條例中華民國一百零八年七月二十四日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零九年一月一日起至一百十八年十二月三十一日止；第二十三條之三施行期間，自公布生效日起至一百十八年十二月三十一日止。\n本條例中華民國一百十二年一月七日修正之條文施行期間，自一百十二年一月一日起至一百十八年十二月三十一日止。\n本條例中華民國○年○月○日修正之第十條施行期間，自一百十四年一月一日起至一百十八年十二月三十一日止。","note":"增訂第七項，定明第十條之一施行期間，自一百十四年一月一日起至一百十八年十二月三十一日止。"},{"bill":"202110077270000","text":"本條例自公布日施行。但第十條施行期間自中華民國九十九年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零四年十二月三十日修正公布之第十條、第十二條之一、第十九條之一施行期間，自一百零五年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零六年十一月二十二日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零六 n二、鑑於法律案經總統公布後，其公布日期為一般民眾所周知，較立法院三讀日期易於查閱，爰修正第六項，將立法院三讀日期調整為總統公布日期。\n三、考量各主管機關針對第二十二條第一項擬納管之產業或技術尚在盤點中，後續仍需邀請產官學界提供意見，並配合國內產業發展狀況，明定於子法或另行公告並適時滾動檢討，爰增訂第七項後段，定明本次修正之第二十二條及第六十七條之三之施行日期，由行政院定之。\n四、第一項、第二項、第四項及第五項未修正。"}],"changed":true,"final":"本條例自公布日施行。但第十條施行期間自中華民國九十九年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零四年十二月三十日修正公布之第十條、第十二條之一、第十九條之一施行期間，自一百零五年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零六年十一月二十二日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零六年十一月二十四日起至一百零八年十二月三十一日止；第十條施行期間，自一百零六年十一月二十四日起至一百十八年十二月三十一日止；第二十三條之二施行期間，自一百零六年十一月二十四日起至一百十三年十二月三十一日止。\n本條例中華民國一百零七年六月二十日修正公布之第十九條之一施行期間，自一百零七年六月二十二日起至一百零八年十二月三十一日止。\n本條例中華民國一百零八年七月二十四日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零九年一月一日起至一百十八年十二月三十一日止；第二十三條之三施行期間，自公布生效日起至一百十八年十二月三十一日止。\n本條例中華民國一百十二年一月十九日修正公布條文施行期間，自一百十二年一月一日起至一百十八年十二月三十一日止。\n本條例中華民國一百十四年四月十八日修正之第二十三條之二施行期間，自一百十四年一月一日起至一百十八年十二月三十一日止；第二十二條及第六十七條之三施行日期，由行政院定之。","finalWhy":"一、本次修正第二十三條之二施行期間自一百十四年一月一日起至一百十八年十二月三十一日止，爰於第七項前段增訂，並配合修正第三項所定一百零六年十一月二十二日修正公布之第二十三條之二施行期間至一百十三年十二月三十一日止。\n二、鑑於法律案經總統公布後，其公布日期為一般民眾所周知，較立法院三讀日期易於查閱，爰修正第六項，將立法院三讀日期調整為總統公布日期。\n三、考量各主管機關針對第二十二條第一項擬納管之產業或技術尚在盤點中，後續仍需邀請產官學界提供意見，並配合國內產業發展狀況，明定於子法或另行公告並適時滾動檢討，爰增訂第七項後段，定明本次修正之第二十二條及第六十七條之三之施行日期，由行政院定之。\n四、第一項、第二項、第四項及第五項未修正。","review":{"note":"照行政院提案通過","text":"本條例自公布日施行。但第十條施行期間自中華民國九十九年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零四年十二月三十日修正公布之第十條、第十二條之一、第十九條之一施行期間，自一百零五年一月一日起至一百零八年十二月三十一日止。\n本條例中華民國一百零六年十一月二十二日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零六年十一月二十四日起至一百零八年十二月三十一日止；第十條施行期間，自一百零六年十一月二十四日起至一百十八年十二月三十一日止；第二十三條之二施行期間，自一百零六年十一月二十四日起至一百十三年十二月三十一日止。\n本條例中華民國一百零七年六月二十日修正公布之第十九條之一施行期間，自一百零七年六月二十二日起至一百零八年十二月三十一日止。\n本條例中華民國一百零八年七月二十四日修正公布之第十二條之一、第十二條之二、第十九條之一施行期間，自一百零九年一月一日起至一百十八年十二月三十一日止；第二十三條之三施行期間，自公布生效日起至一百十八年十二月三十一日止。\n本條例中華民國一百十二年一月十九日修正公布條文施行期間，自一百十二年一月一日起至一百十八年十二月三十一日止。\n本條例中華民國○年○月○日修正之第二十三條之二施行期間，自一百十四年一月一日起至一百十八年十二月三十一日止；第二十二條及第六十七條之三施行日期，由行政院定之。"}}],"stages":[{"date":"2024-03-08","stage":"一讀","code":"院會-11-1-4","bill":"202110010620000","gazref":"113卷006期5188號 4-4頁"},{"date":"2024-05-31","stage":"一讀","code":"院會-11-1-16","bill":"202110051610000","gaz <script>
const D = JSON.parse(document.getElementById('data').textContent);

const el = (tag, attrs, ...kids) => {

  for (const c of kids) if (c != null) e.append(c);

};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],

const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類

[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],

  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);

}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }
  const bench = el('div', {class: 'bench'});
  panel.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  fillBench(bench, a);
}
D.arts.forEach(a => {
  const btn = el('button', {type: 'button', 'data-no': a.no, class: 'chip' + (a.changed ? ' passed' : ''), text: a.no});
  btn.addEventListener('click', () => { current = a.no; showArticle(); });
  $('artnav').append(btn);
});
showArticle();

/* ---------- 提案版本 ---------- */
const partyLine = p => p.party.map(([n]) => n).join('、');
function people(p, role, label) {   // 一列名單：姓名後面標黨籍
  const list = (p.people || []).filter(x => x[2] === role);
  if (!list.length) return null;
  const box = el('div', {class: 'people'});
  list.forEach(([n, pt]) => box.append(el('span', {class: 'person'}, n, el('small', {text: pt}))));
  const peek = role === '提案' ? list.map(x => x[0]).join('、') : null;   // 只有提案人收合時預覽姓名
  return fold(label + ' ' + list.length + ' 位', box, peek);
}
function fold(label, content, peek) {   // 點開才看全文；有 peek 時收合狀態露一行預覽
  const s = el('summary', null, el('b', {text: label}));
  if (peek) s.append(el('span', {class: 'peek', text: peek}));
  return el('details', {class: 'fold'}, s, content);
}
const dlg = el('dialog', {class: 'artdlg', 'aria-labelledby': 'dlgt'});
document.body.append(dlg);
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openArticleDialog(p, no) {   // 獨立視窗看某一條的各版本，可在該提案動到的條文間切換
  dlg.textContent = '';
  const close = el('button', {type: 'button', class: 'chip', text: '關閉 ✕'});
  close.addEventListener('click', () => dlg.close());
  const nav = el('div', {class: 'chips'});
  p.arts.forEach(n => {
    const art = D.arts.find(x => x.no === n);
    const b = el('button', {type: 'button', class: 'chip' + (art && art.changed ? ' passed' : ''), 'aria-pressed': String(n === no), text: n});
    b.addEventListener('click', () => openArticleDialog(p, n));
    nav.append(b);
  });
  const body = el('div', {class: 'dlgbody'});
  const a = D.arts.find(x => x.no === no);
  if (a) {
    const bench = el('div', {class: 'bench'});
    fillBench(bench, a);
    body.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  } else body.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'}));
  dlg.append(el('div', {class: 'dlghead'}, el('div', {class: 'dlgtitle'}, el('h3', {id: 'dlgt', text: shortWho(p) + ' 提案　逐條對照'}), close), nav), body);
  if (!dlg.open) dlg.showModal();
}
function propDetail(p, inProps) {   // 提案的完整提煉內容，歷程列和提案版本區塊共用；提案版本區塊的條文用彈窗對照
