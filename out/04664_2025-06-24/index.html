<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公務人員保障法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>

g.ly.gov.tw/ppg/bills/202110082800000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/02/15/LCEWA01_110215_00059.pdf","proposers":["蔡其昌"],"ncosign":17,"people":[["蔡其昌","民進黨","提案"],["林楚茵","民進黨","連署"],["王義川","民進黨","連署"],["李昆澤","民進黨","連署"],["何欣純","民進黨","連署"],["徐富癸","民進黨","連署"],["王美惠","民進黨","連署"],["王正旭","民進黨","連署"],["黃捷","民進黨","連署"],["張宏陸","民進黨","連署"],["許智傑","民進黨","連署"],["沈伯洋","民進黨","連署"],["劉建國","民進黨","連署"],["羅美玲","民進黨","連署"],["陳冠廷","民進黨","連署"],["林淑芬","民進黨","連署"],["邱志偉","民進黨","連署"],["李柏毅","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員蔡其昌等18人，鑒於近日發生公務員因飽受職場霸凌而輕生悲劇，因此揭露公務員受職場霸凌但卻無制度化保障的問題，蓋職場霸凌未有專法，公務員亦有別於職業安全衛生法之勞工，當公務機關發生職場霸凌，僅有員工職場霸凌防治與處理建議作為及員工職場霸凌處理標準作業流程等內部指引，缺乏法律位階的保護和強制力，爰擬具「公務人員保障法部分條文修正草案」，明定國家機關應提供公務人員合理工作環境，賦予防制職場霸凌義務：要求各機關應提供職場霸凌行為防制機制、處理程序及其他應遵行事項。若機關疑似有職場霸凌卻未提供防制職場霸凌機制、違反處理程序或其他應遵行事項，致公務人員生命、身體或健康受損時，得依國家賠償法請求賠償。是否有當？敬請公決。","arts":["第一條","第十九條","第二十一條","第二十二條"]},{"id":"202110107960000","who":"委員林月琴等31人","date":"2025-04-18","name":"「公務人員保障法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110107960000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/08/LCEWA01_110308_00025.pdf","proposers":["林月琴","陳亭妃","賴瑞隆","莊瑞雄"],"ncosign":27,"people":[["林月琴","民進黨","提案"],["陳亭妃","民進黨","提案"],["賴瑞隆","民進黨","提案"],["莊瑞雄","民進黨","提案"],["林宜瑾","民進黨","連署"],["邱志偉","民進黨","連署"],["黃捷","民進黨","連署"],["黃秀芳","民進黨","連署"],["王定宇","民進黨","連署"],["林俊憲","民進黨","連署"],["王美惠","民進黨","連署"],["范雲","民進黨","連署"],["徐富癸","民進黨","連署"],["李坤城","民進黨","連署"],["王世堅","民進黨","連署"],["林楚茵","民進黨","連署"],["沈伯洋","民進黨","連署"],["陳素月","民進黨","連署"],["蔡其昌","民進黨","連署"],["陳瑩","民進黨","連署"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳秀寳","民進黨","連署"],["羅美玲","民進黨","連署"],["許智傑","民進黨","連署"],["吳琪銘","民進黨","連署"],["王正旭","民進黨","連署"],["李柏毅","民進黨","連署"],["邱議瑩","民進黨","連署"],["吳沛憶","民進黨","連署"],["李昆澤","民進黨","連署"]],"party":[["民進黨",31]],"reason":"本院委員林月琴、陳亭妃、賴瑞隆、莊瑞雄等31人，現行法制對於公務人員遭受職場霸凌之申訴保護規定不足，尤欠缺自申訴起至後續處理程序進行中之保護制度與外部申訴、訴訟扶助，爰擬具「公務人員保障法部分條文修正草案」。是否有當？敬請公決。","arts":["第十九條","第十九條之一","第十九條之二","第 "url":"https://ppg.ly.gov.tw/ppg/bills/201110124670000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/12/LCEWA01_110312_00073.pdf","proposers":[],"ncosign":0,"people":[],"party":[],"reason":"考試院函請審議「公務人員保障法部分條文修正草案」案。","arts":["第十九條","第十九條之一","第十九條之二","第二十一條"]}],"arts":[{"no":"第一條","current":"為保障公務人員之權益，特制定本法。本法未規定者，適用其他有關法律之規定。","versions":[{"bill":"202110082800000","text":"為保障公務人員權益及提供合理工作環境，特制定本法。本法未規定者，適用其他有關法律之規定。","note":"增訂「及合理工作環境」等字：鑒於職場霸凌常使員工身心承受極大壓力，嚴重損害工作者權益，防治職場霸凌亦應屬公務人員權益保障之一環，保障公務人員權益意味著保障每位工作者擁有實現人生價值與意義的權利，居於雇主地位之國家機關應提供合理工作環境。"}],"changed":false,"final":"為保障公務人員之權益，特制定本法。本法未規定者，適用其他有關法律之規定。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第十八條","current":"各機關應提供公務人員執行職務必要之機具設備及良好工作環境。","versions":[{"bill":"202110082730000","text":"各機關應提供公務人員執行職務必要之機具設備、裝備及良好工作環境。","note":"為保障軍公教人員值勤安全，各機關應提供執行職務必要之裝備。"}],"changed":false,"final":"各機關應提供公務人員執行職務必要之機具設備及良好工作環境。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第十九條","current":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施；其有關辦法，由考試院會同行政院定之。","versions":[{"bill":"202110082730000","text":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施；其有關辦法，由考試院會同行政院定之。\n總統府、各院、各中央一級及二級機關、直轄市政府及縣（市）政府等應於○年○月○日前，完成各該機關前項之安全及衛生防護辦法。","note":"新增第二項，明訂總統府、各院、各中央一級及二級機關、直轄市政府及縣（市）政府等應於規定日期前完成該機關安全及衛生防護辦法。"},{"bill":"202110082800000","text":"公務人員執行職務之安全應予保障，並使公務人員不受任何職場霸凌行為，造成身心之侵害。\n前項各機關對於公務人員執行職務應提供安全及衛生之防護措施，以及職場霸凌行為防制機制、處理程序及其他應遵行事項之準則，其有關辦法，由考試院會同行政院定之。\n職場霸凌事件申訴、調查、偵查或審理程序中，為申訴、告訴、告發、提起訴訟、作證、提供協助或其他參與行為之人，機關不得為不當之差別待遇。違反者，準用第二十一條第一項之規定。","note":"一、修正第一項：由於公務人員在職場上權益受損，目前僅能依靠本法規定自保，而所謂\"執行職務之安全\"應包含避免職場霸凌的發生。爰此，為提供公務人員職場上安全且合理的工作環境，增訂「並使公務人員不受任何職場霸凌行為，造成身心之侵害。」等字。\n二、新增第二項：\n(一)第二項前段由現行條文第一項文字移列，文字未修正。\n(二)增訂要求各機關應提供職場霸凌行為防制機制、處理程序及其他應遵行事項：公務人員若在職場上權益受損，僅依賴本法規範，而目前僅有《公務人員安全及衛生防護辦法》提及\"不法侵害\"，但定義不明，即便公務人員受到職場霸凌亦難以引用。為保障每位公務人員執行職務時亦能擁有實現人生價值與意義的權利，參酌教育基本法第五條關於防制校園霸凌的立法例，增訂「職場霸凌行為防制機制、處理程序及其他應遵行事項」等字，要求考試院會同行政院儘速制定與落實防制公務人員職場霸凌辦法、處理程序及其他應遵行事項。\n三、新增第三項，明定職場霸凌事件申訴、調查、偵查或審理程序中，為申訴、告訴、告發、提起訴訟、作證、提供協助或其他參與行為之人，機關不得無正當理由評較低考績、調動職務或挾怨報復等差別待遇；違反者，則可以準用第二十一條第一項提起國家賠償，以落實對職場霸凌之零容忍。"},{"bill":"202110107960000","text":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施。\n前項安全及衛生之防護措施，包括工作不當管理、職場霸凌與其他公務人員執行職務因他人言語或行為所致身體或精神不法侵害之防護。\n第一項安全及衛生之防護措施有關預防、申訴、通報、調查、處理、治療、輔導與其他必要處置事項之辦法，由考試院會同行政院定之。","note":"一、本條規定公務人員執行職務之安全保障及各機關應提供安全及衛生之防護措施。\n二、行政院於108年4月29日依據本條規定擬具「員工職場霸凌防治與處理建議作為」及「員工職場霸凌處理標準作業流程（範例）」，範圍包括「事前防治」、「事中處理」、「事後作為」，供行政院所屬中央及地方各主管機關作為防治與處理之參考。並授權各機關應依上開規範及機關自訂申訴處理相關規定辦理，並由各主管機關督導所屬機關落實，繫屬各機關自主管理範疇。\n基於上級機關與其所屬機關具上下隸屬關係，行政院於112年9月14日通函，機關首長如涉職場霸凌事件應由上級機關受理申訴事宜，請各機關併同通盤檢視修正內部相關處理作業及流程，並督導所屬機關落實辦理。截至113年9月5日止，行政院暨所屬各部會行總處、直屬三級機關、各直轄市及縣市政府（含其所屬機關、構）均已依權責完成檢討作業。\n前述安全及衛生之防護措為各機關行政組織人員遭受職場霸凌事件不法之侵害，機關內部之防治制度，另以上級機關為遭受首長霸凌防治之配套。制度銜接本法第二十五條復審、第七十七條、第七十八條再申訴程序，以及司法院釋字第785號解釋：「公務人員認其權利受違法侵害或有主張其權利之必要時，原即得按相關措施之性質，依法提起相應之行政訴訟，請求救濟。」之意旨，為現行申訴救濟之程式。\n三、但原法律規定安全及衛生之防護措施定義廣泛，缺乏法律之明確性。以非物理性、人際相互透過言語、敵意環境、與基於權勢於工作指派、管理，以造成侵害效果之行為，難以界定惟本條安全及衛生之防護措施之項目，直至發布上開行政指導後，該類不法侵害事件申訴、通報等措施始有可循機制。但因各機關上下隸屬關係，被害人恐畏於權力不敢申訴、或申訴後不獲適當處理之情形，現行依據本條及行政指導制定公布之辦法因而不足以有效達到遏止不法行為發生，無助於不法行為之事後補救。民國113年12月4日勞動部勞動力發展署北基宜花分署吳姓公務人員輕生案，勞動部12月11日公布「勞動部針對勞動力發展署北基宜花金馬分署113年職場霸凌事件重啟行政調查報告」所指，該員輕生係為管理不當併職場霸凌所致，有因果關係，可見一般。\n四、增訂第二項工作不當管理、職場霸凌與其他公務人員執行職務因他人言語或行為所致身體或精神不法侵害屬於安全及衛生防護之範疇。理由如下：\n(一)所謂職場霸凌，係指：指在工作場所中發生的，藉由權力濫用與不公平的處罰所造成的持續性的冒犯、威脅、冷落、孤立或侮辱行為，使被霸凌者感到受挫、被威脅、羞辱、被孤立及受傷，進而折損其自信並帶來沈重的身心壓力。（臺灣新竹地方法院100年度竹勞小字第4號民事判決）職場霸凌也可能發生在部屬對上司，或同儕間，重點在於受霸凌者本身是否受有身心壓力或有人格遭到否定之羞辱感受。（臺灣臺北地方法院104年度重勞訴字第10號民事判決）該事件多為精神、心理傷害，非可目視之肢體受傷，認定相對困難。常見透過職務上下隸屬關係，為權勢性侵害行為、或透過同儕關係為集體性侵害、亦或透過規章制度、環境氛圍為敵意性環境侵害行為，非具物理性手段傷害之明確性。為不法行為與犯罪之中間樣態。\n(二)職場霸凌事件依據行為人之行為方法與造成傷害後果，甚者係屬刑法第二七七條第一項、第三○四條、第三○五條、第三○九條罪嫌；另為民法第一八四條、第一八八條、第四八三條之一規定所屬惟行為不易為不法侵害犯意，易與管理不當混淆。該事件若發生於私人，則雇主應負責民法第一八八條、第四八三條之一責任，並為民法一八四條之請求權基礎。\n(三)基於憲法第一五三條第一項國家法律應為勞工保護之意旨公務人員執行職務安全保障，應有明確防治不法之規定。\n五、第一項後段文字移列至第三項，並參考前述行政院108年公告之行政指導、以及112年通函所屬各機關之上級處理制度。以明定授權考試院會同行政院制定之辦法應包括：預防、申訴、通報、調查、處理、治療、輔導與其他必要處置事項以為制度完備。"},{"bill":"202110109170000","text":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施；其有關辦法，由考試院會同行政院定之。\n機關首長負有確保業務執行場域友善及避免敵意環境之責任。","note":"明定機關首長應負有確保業務執行場域友善，避免敵意環境之責任。"},{"bill":"202110119980000","text":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施；其有關辦法，由考試院會同行政院定之。\n機關首長應確保機關業務執行場域友善之責任。","note":"增訂機關首長應負有確保業務執行場域友善之責任。"},{"bill":"201110124670000","text":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施，並使公務人員免於遭受職場霸凌等行為。有關辦法，由考試院會同行政院定之。\n前項所稱職場霸凌，指本機關人員於職務上假借權勢或機會，逾越職務上正當合理範圍，持續以歧視、侮辱言行或其他方式，造成敵意性、脅迫性或冒犯性之不友善工作環境，致公務人員身心遭受不法侵害。但情節重大者，不以持續發生為必要。\n公務人員遭受職場霸凌，得依第一項所定辦法提起申訴，其提起申訴之期限，應依下列規定辦理：\n一、被申訴人屬非具權勢地位者，自職場霸凌行為終了時起，逾三年者，不予受理。\n二、被申訴人屬具權勢地位者，自職場霸凌行為終了時起，逾五年者，不予受理。","note":"一、本條修正，增訂第二項及第三項。\n二、第一項為落實公務人員執行職務之安全保障，除明定各機關應提供安全及衛生之防護措施外，並應使公務人員免於遭受職場霸凌等不法行為之侵害。\n三、按執行職務遭受不法侵害，除指傳統物理或化學等危險源所致生命、身體及健康之侵害外，尚包含本機關人員所為之人身或精神侵害，如職場霸凌等行為。\n四、為明確機關執行職場霸凌申訴調查、處理相關程序，及認定成立與否之標準，並使公務人員瞭解成立職場霸凌行為之構成要件，俾有效減少職場霸凌事件之發生，爰參酌勞動部訂定之「執行職務遭受不法侵害預防指引」，及法院實務判決，如：臺灣高等法院高雄分院一一三年度勞上字第十九號民事判決，增訂第二項職場霸凌定義。\n五、第二項所稱於職務上假借權勢或機會，係指本機關人員利用其與職務相關而具優越性之權力、機會或方法；所稱職務上正當合理範圍，係指依一般社會通念下，對行為舉措的合理期待，故須以行為內容是否與職務間具有正當合理關聯判斷。所稱其他方式，包含威脅、冷落、孤立等具敵對性之負面言行。\n六、職場霸凌之認定，原則以行為之「持續性」為要件，考量部分不當言行，雖未持續或反覆發生，然情節重大，亦有造成公務人員身心傷害之可能，為周延公務人員權益之保障，爰於第二項但書規定，其情節重大者，雖未具持續性，仍屬本法所稱職場霸凌之行為態樣。「情節重大」之認定，得考量職場霸凌行為人之惡性或行為結果等標準判斷之。\n七、鑑於職場霸凌事件當事人舉證不易，機關調查處理亦難蒐集相關事證，為避免時日久遠，導致處理困難，故有訂定適當申訴期限之必要；又公務人員遭遇職場霸凌事件後，其審酌行為人如係機關中具領導統御或職務監督關係，或為具權勢優越地位之長官，申訴人受限其關係，不易循程序求助而易逾申訴期限，有關職場霸凌事件申訴期限宜予考量並區別規範，爰於第三項第一款明定就非具權勢地位之職場霸凌事件，自職場霸凌行為終了之日起逾三年者，不得提出申訴；第二款則就屬具領導統御或職務監督等權勢地位之職場霸凌事件，自職場霸凌行為終了之日起，逾五年者，不得提出申訴。"}],"changed":true,"final":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施，並使公務人員免於遭受職場霸凌等行為。有關辦法，由考試院會同行政院定之。\n前項所稱職場霸凌，指本機關人員於職務上假借權勢或機會，逾越職務上必要合理範圍，持續以威脅、冒犯、歧視、侮辱、孤立言行或其他方式，造成敵意性、脅迫性或冒犯性之不友善工作環境，致公務人員身心健康遭受危害。但情節重大者，不以持續發生為必要。\n公務人員遭受職場霸凌，得依第一項所定辦法提起申訴，其提起申訴之期限，應依下列規定辦理：\n一、被申訴人屬非具權勢地位者，自職場霸凌行為終了時起，逾三年者，不予受理。\n二、被申訴人屬具權勢地位者，自職場霸凌行為終了時起，逾五年者，不予受理。","finalWhy":"一、本條修正，增訂第二項及第三項。\n二、第一項為落實公務人員執行職務之安全保障，除明定各機關應提供安全及衛生之防護措施外，並應使公務人員免於遭受職場霸凌等不法行為之侵害。\n三、按執行職務遭受不法侵害，除指傳統物理或化學等危險源所致生命、身體及健康之侵害外，尚包含本機關人員所為之人身或精神侵害，如職場霸凌等行為。\n四、為明確機關執行職場霸凌申訴調查、處理相關程序，及認定成立與否之標準，並使公務人員瞭解成立職場霸凌行為之構成要件，俾有效減少職場霸凌事件之發生，爰參酌勞動部訂定之「執行職務遭受不法侵害預防指引」、一百十四年三月二十八日預告職業安全衛生法部分條文修正草案第二十二條之一第一項修正條文，及法院實務判決，如：臺灣高等法院高雄分院一一三年度勞上字第十九號民事判決，增訂第二項職場霸凌定義。\n五、第二項所稱於職務上假借權勢或機會，係指本機關人員利用其與職務相關而具優越性之權力、機會或方法；所稱職務上必要合理範圍，係指依一般社會通念下，對行為舉措的合理期待，故須以行為內容是否與職務間具有必要合理關聯判斷。\n六、職場霸凌之認定，原則以行為之「持續性」為要件，考量部分不當言行，雖未持續或反覆發生，然情節重大，亦有造成公務人員身心傷害之可能，為周延公務人員權益之保障，爰於第二項但書規定，其情節重大者，雖未具持續性，仍屬本法所稱職場霸凌之行為態樣。「情節重大」之認定，得考量職場霸凌行為人之惡性或行為結果等標準判斷之。\n七、鑑於職場霸凌事件當事人舉證不易，機關調查處理亦難蒐集相關事證，為避免時日久遠，導致處理困難，故有訂定適當申訴期限之必要；又公務人員遭遇職場霸凌事件後，其審酌行為人如係機關中具領導統御或職務監督關係，或為具權勢優越地位之長官，申訴人受限其關係，不易循程序求助而易逾申訴期限，有關職場霸凌事件申訴期限宜予考量並區別規範，爰於第三項第一款明定就非具權勢地位之職場霸凌事件，自職場霸凌行為終了之日起逾三年者，不得提出申訴；第二款則就屬具領導統御或職務監督等權勢地位之職場霸凌事件，自職場霸凌行為終了之日起，逾五年者，不得提出申訴。","review":{"note":"照委員黃國昌等3人所提修正動議通過","text":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施，並使公務人員免於遭受職場霸凌等行為。有關辦法，由考試院會同行政院定之。\n前項所稱職場霸凌，指本機關人員於職務上假借權勢或機會，逾越職務上必要合理範圍，持續以威脅、冒犯、歧視、侮辱、孤立言行或其他方式，造成敵意性、脅迫性或冒犯性之不友善工作環境，致公務人員身心健康遭受危害。但情節重大者，不以持續發生為必要。\n公務人員遭受職場霸凌，得依第一項所定辦法提起申訴，其提起申訴之期限，應依下列規定辦理：\n一、被申訴人屬非具權勢地位者，自職場霸凌行為終了時起，逾三年者，不予受理。\n二、被申訴人屬具權勢地位者，自職場霸凌行為終了時起，逾五年者，不予受理。"}},{"no":"第十九條之一","current":null,"versions":[{"bill":"202110069890000","text":"有下列情形之一者，處新臺幣三萬元以上三十萬元以下罰鍰：\n一、公務人員違反前條所定辦法，對提出安全及衛生防護措施事項之建議者，予不利益對待或不合理處置。\n二、公務人員違反前條所定辦法，未提供符合規定之必要安全及衛生防護措施。\n前項第二款情形，致發生死亡災害者，處三年以下有期徒刑、拘役或科或併科新臺幣三十萬元以下罰金；致發生重傷災害者，處一年以下有期徒刑、拘役或科或併科新臺幣十八萬元以下罰金。","note":"一、本條新增。\n二、依據公務人員保障法第十九條，各機關對於公務人員之執行職務，應提供安全及衛生之防護措施，並授權考試院會同行政院訂定有關辦法，即公務人員安全及衛生防護辦法（下稱安衛辦法）。然而，安衛辦法所要求履行之義務，僅屬訓示性規範，未設有處罰之規定，缺少強制力，恐難以有效落實公務人員安全及衛生防護相關保障。\n三、參酌職業安全衛生法第六條第一項、第三十九條、第四十三條第二款及第四十五條第一項第二款之規定，於第一項明定，若公務人員違反安衛辦法，對提出安全及衛生防護措施事項之建議者，予不利益對待或不合理處置，或未提供符合規定之必要安全及衛生防護措施，處新臺幣三萬元以上三十萬元以下罰鍰。\n四、針對公務人員違反安衛辦法，未提供符合規定之必要安全及衛生防護措施，致發生死亡災害或重傷災害者，參酌職業安全衛生法第六條第一項、第四十條第一項及第四十一條第一項第一款，分處三年以下有期徒刑、拘役或科或併科新臺幣三十萬元以下罰金，或一年以下有期徒刑、拘役或科或併科新臺幣十八萬元以下罰金，爰為第二項之規定。"},{"bill":"202110107960000","text":"各機關應設立下列單位或人員受理第十九條第一項安全及衛生事件之申訴或通報：\n一、人事處室、單位主管或機關長官。\n二、以法律為宗旨之財團法人或公益社團法人。\n公務人員執行職務遭受安全及衛生事件侵害或有遭受侵害之虞，得依據前項第一款提出申訴或通報。人事處室、單位主管、機關首長為行為人，得向具有管轄權之上級機關或前項第二款為之。\n第一項第二款財團法人或公益社團法人受理申訴通報，應以被害人利益為考量，指派律師陪同被害人依據第二項規定為申訴與通報，並為第十九條第三項辦法規定之申訴、通報、調查、處理與其他程序。必要時得接受被害人委任提起復審、再申訴或行政訴訟。\n第一項第二款財團法人或公益社團法人之遴選與委任辦法由考試院會同行政院定之。","note":"一、本條新增，規定各機關設立機關內部及外部安全及衛生事件申訴與通報制度。\n二、第一項各款規定各機關應設置受理安全及衛生事件申訴及通報之單位或人員，理由如下：\n(一)第一款規定各機關之人事處室、單位主管或機關長官，為受理單位。理由係自行政院民國108年公告之行政指導、以及112年通函所屬各機關職場霸凌行為人之上級處理制度訂定之，理由如第十九條說明第二點。\n(二)第二款增設各機關外部申訴與通報機制，應委託以法律為宗旨之財團法人或公益社團法人受理申訴與通報。理由如第十九條說明第三點。\n三、第二項公務人員執行職務遭受安全及衛生事件侵害或有遭受侵害之虞，得各自向第一項第一款款規定制度對象提出申訴與通報。但侵害行為人為人事處室、單位主管或機關長官時，為避免關係人迫於隨附於職務屬性、職級之權勢導致申訴不能情勢，得向上級機關或第一項第二款規定制度對象提出。\n四、第三項公務人員另得向第一項第二款規定之財團法人或公益社團法人提出申訴與通報。\n法人受理申訴與通報後，應以被害人利益為考量，指派律師陪同被害人項各機關內部制度提出申訴與通報，連同參與後續之調查、處理、與其他程序，於程序中確保被害人之權益。\n必要時得接受被害人委任以依據本法第二十五條提出復審、第七十七條、第七十八條提出再申訴、或行政訴訟。另，被害人委託該律師提出刑事與民事訴訟為既有之訴訟權利。\n五、第四項授權考試院會同行政院制定第一項第二款財團法人或公益社團法人之遴選與委任辦法。"},{"bill":"201110124670000","text":"各機關違反前條所定辦法之規定，有下列情形之一者，其應負責人員，應按情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處：\n一、對提出安全及衛生防護措施事項之建議者，或對提出職場霸凌申訴者，予以不利對待或不合理處置。\n二、知悉職場霸凌之情形，未採取具體有效措施。\n三、未提供符合規定之必要安全及衛生防護措施。\n前項第一款情形，處應負責人員新臺幣二萬元以上二十萬元以下罰鍰，並得按次處罰。\n第一項第二款及第三款情形，經上級機關通知限期改善，或無上級機關經保訓會通知限期改善，屆期未改善者，處應負責人員新臺幣三萬元以上三十萬元以下罰鍰。\n第一項第三款情形，致生重大災害者，處應負責人員新臺幣三萬元以上五十萬元以下罰鍰；致生死亡事故者，處新臺幣五十萬元以上一百五十萬元以下罰鍰。但如有不可歸責之事由，或應負責人員對災害之發生，已善盡防止義務者，不在此限。\n前項情形，涉及刑事責任者，機關應移送檢察機關。\n機關首長經認定職場霸凌成立者，處新臺幣一萬元以上一百萬元以下罰鍰。\n第四項所稱重大災害，指發生災害之罹災人數在三人以上，或發生災害之罹災人數在一人以上，且須住院治療者。","note":"一、本條新增。\n二、為完善公務機關之安全及衛生防護措施，保障對該防護措施事項提出建議者，並為督促機關確實提供必要防護措施，爰於第一項明定對提出建議者或提出職場霸凌申訴者，因其提出建議或提起職場霸凌申訴，而予以不利對待或不合理處置；或知悉職場霸凌之情形，未採取具體有效措施；或未提供符合規定必要防護措施之機關；經通知改善，屆期未改善者，其應負責人員之罰則，包括懲處、懲戒及行政罰鍰。\n三、所稱應負責人員，係指機關首長或於該工作場所中，代表機關首長實際執行管理、指揮或監督公務人員執行職務之人。\n四、為確保公務人員不因對機關提出安全及衛生防護措施建言，或職場霸凌申訴，而遭機關予不利對待或不合理之處置，於第二項明定機關違反不利對待禁止規定，處應負責人員二萬元以上二十萬元以下行政罰鍰，並得按次處罰，俾周延申訴者或建言者之保障。\n五、上級機關對下級機關執行安全及衛生防護規定，負監督檢查責任。為責成機關就知悉職場霸凌之情形，未採取具體有效措施，及未提供符合規定之必要安全及衛生防護措施之情形，確實限期改善，爰於第三項明定，經上級機關通知限期改善，屆期未改善者，或無上級機關者，經保訓會通知限期改善，屆期未改善者，處應負責人員三萬元以上三十萬元以下罰鍰。\n六、為督促機關落實安全及衛生防護措施，並審酌機關首長或工作現場實際負責指揮監督人員，應負有提供安全衛生工作環境、防止重大災害或死亡事故發生的法定義務，爰於第四項明定，機關如未提供符合規定之必要安全及衛生防護措施，致生重大災害或死亡事故，應對應負責人員依違反法定義務之情節輕重課以罰鍰。罰鍰金額則參酌勞動部一百十四年三月二十八日預告職業安全衛生法草案第四十四條規定之金額範圍，並以侵害肇致嚴重程度，於致生重大災害時，處以三萬元以上五十萬元以下罰鍰，於致生死亡事故時，處以五十萬元以上一百五十萬元以下罰鍰。\n七、考量政府機關基於公共利益及為民服務責任，須即時回應社會民眾需求，並因應特殊環境或緊急狀況採取積極措施，與民間企業之業務性質不同，是如公務人員執行職務遭受之重大災害或死亡事故，其發生非可歸責應負責人員，或應負責人員已對災害發生善盡防止義務，自不宜再課予罰鍰之處罰，爰於第四項但書明定免責條款。\n八、參酌職業安全衛生法第三十七條之規定，於第七項明定本條第四項重大災害之定義。\n九、為落實政府機關友善職場，機關首長本應致力防免職場霸凌行為之發生，是如機關首長明知負有防免義務，自身竟又涉及對同仁之職場霸凌行為，其不法行為之違失程度更甚一般職場霸凌，自應加重處罰，爰於第六項明定得按個案情節輕重課予行政罰鍰。罰鍰金額則參酌勞動部一百十四年三月二十八日預告職業安全衛生法草案第四十八條規定對最高負責人之罰鍰額度。\n相關條文\n職業安全衛生法\n第三十七條第二項\n事業單位勞動場所發生下列職業災害之一者，雇主應於八小時內通報勞動檢查機構：\n一、發生死亡災害。\n二、發生災害之罹災人數在三人以上。\n三、發生災害之罹災人數在一人以上，且需住院治療。\n四、其他經中央主管機關指定公告之災害。"}],"changed":true,"final":"各機關違反前條第一項所定辦法之規定，有下列情形之一者，其應負責人員，應按情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處：\n一、對提出安全及衛生防護措施事項之建議者，或對提出職場霸凌申訴者，予以不利對待或不合理處置。\n二、知悉職場霸凌之情形，未採取具體有效措施。\n三、未提供符合規定之必要安全及衛生防護措施。\n前項第一款情形，處應負責人員新臺幣三萬元以上七十五萬元以下罰鍰，並得按次處罰。\n第一項第二款及第三款情形，經上級機關通知限期改善，或無上級機關經保訓會通知限期改善，屆期未改善者，處應負責人員新臺幣三萬元以上一百五十萬元以下罰鍰。\n第一項第三款情形，致生重大災害者，處應負責人員三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金；致生死亡事故者，處七年以下有期徒刑、拘役或科或併科新臺幣二百萬元以下罰金。但如有不可歸責之事由，或應負責人員對災害之發生，已善盡防止義務者，不在此限。\n前項情形，涉及刑事責任者，機關應移送檢察機關。\n機關首長或一級單位主管人員經認定職場霸凌成立者，處新臺幣五萬元以上一百萬元以下罰鍰。\n第一項至第四項所稱應負責人員，係指機關首長或於該工作場所中，代表機關首長實際執行管理、指揮或監督公務人員執行職務之人。\n第四項所稱重大災害，指發生災害之罹災人數在三人以上者。","finalWhy":"","review":{"note":"照委員黃國昌等7人所提修正動議通過","text":"各機關違反前條第一項所定辦法之規定，有下列情形之一者，其應負責人員，應按情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處：\n一、對提出安全及衛生防護措施事項之建議者，或對提出職場霸凌申訴者，予以不利對待或不合理處置。\n二、知悉職場霸凌之情形，未採取具體有效措施。\n三、未提供符合規定之必要安全及衛生防護措施。\n前項第一款情形，處應負責人員新臺幣三萬元以上七十五萬元以下罰鍰，並得按次處罰。\n第一項第二款及第三款情形，經上級機關通知限期改善，或無上級機關經保訓會通知限期改善，屆期未改善者，處應負責人員新臺幣三萬元以上一百五十萬元以下罰鍰。\n第一項第三款情形，致生重大災害者，處應負責人員三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金；致生死亡事故者，處七年以下有期徒刑、拘役或科或併科新臺幣二百萬元以下罰金。但如有不可歸責之事由，或應負責人員對災害之發生，已善盡防止義務者，不在此限。\n前項情形，涉及刑事責任者，機關應移送檢察機關。\n機關首長或一級單位主管人員經認定職場霸凌成立者，處新臺幣五萬元以上一百萬元以下罰鍰。\n第一項至第四項所稱應負責人員，係指機關首長或於該工作場所中，代表機關首長實際執行管理、指揮或監督公務人員執行職務之人。\n第四項所稱重大災害，指發生災害之罹災人數在三人以上者。"}},{"no":"第十九條之二","current":null,"versions":[{"bill":"202110107960000","text":"各機關為處理公務人員執行職務遭受第十九條第一項安全及衛生事件侵害或有遭受侵害之虞，應組成公務人員執行職務遭受安全及衛生事件侵害防治審議會（以下簡稱審議會），辦理調查、審議、調解及移送司法機關事項。\n前項審議會置召集人一人，由機關（構）首長或副首長兼任，並應遴聘（派）有關機關高級職員、社會公正人士、民間團體代表、學者專家為委員；其中社會公正人士、民間團體代表、學者專家不得少於總數二分之一；委員應有一人為被害人所屬公務人員協會之代表，女性代表不得少於總數二分之一，單一性別不得少於三分之一。","note":"一、本條新增。\n二、第一項係第十九條之一各款制度受理公務人員執行職務受第十九條第一項安全及衛生事件侵害，或有受侵害之虞，應組成公務人員執行職務遭受安全及衛生事件侵害防治審議會辦理第十九條第三項辦法規定之調查、處理、及其他程序，並有調查、審議、調解、及將案件移送司法機關之權責。\n三、第二項規定前述審議會之組成。"},{"bill":"201110124670000","text":"前條第二項至第四項及第六項之罰鍰，由保訓會裁處之。裁處權時效因三年期間經過而消滅。\n前條第四項就重大災害或死亡事故因果關係之認定及裁處，由保訓會延聘學者專家五人至七人，組成安全衛生事故審議小組審認之。任一性別比例不得少於三分之一。\n職場霸凌申訴受理機關應將前條第六項職場霸凌成立與否之決定及調查事證函送保訓會。該決定之調查程序與人員組成，有未符第十九條所定辦法之規定者，保訓會得依職權要求機關重行調查。\n前條第二項之裁處權時效，自公務人員就機關因其提出職場霸凌申訴或安全及衛生建議，所為不利對待或不合理處置，提起救濟之日起算。前條第三項之裁處權時效，自上級機關就機關屆期未改善情形，通報保訓會之日起算。前條第四項裁處權時效，自機關向保訓會通報重大災害或死亡事故之日起算。前條第六項裁處權時效，自職場霸凌申訴受理機關將職場霸凌成立與否之決定及調查事證，函報保訓會之日起算；如經保訓會要求重行調查，應自職場霸凌申訴受理機關重行調查後，再函報保訓會之日起算。\n不服保訓會所為第一項裁處處分，有關其權益之救濟，依訴願法之規定行之。","note":"一、本條新增。\n二、保訓會為辦理本法新增之重大災害或死亡事故調查、因果關係認定、事故裁罰等業務，應延聘心理、法律、職業安全或公共行政等各領域學者專家五人至七人，組成安全衛生事故審議小組，負責調查認定前條第四項災害死亡事故之因果關係，並裁處前條第四項所定罰鍰，以確保因果關係認定之專業性及裁處額度之公正性。\n三、職場霸凌申訴受理機關有將前條第六項機關首長涉及職場霸凌成立與否之決定及調查事證函送保訓會之義務，使保訓會得據以審查該決定之調查程序及人員組成合法與否，如合法，視該決定成立與否，分別處以罰鍰或備查；如不合法，得依職權要求機關重行調查。\n四、保訓會除因職場霸凌申訴受理機關之調查程序及人員組成違法，得要求機關重行調查外，應尊重職場霸凌申訴受理機關就機關首長成立職場霸凌與否之認定，僅就職場霸凌申訴受理機關所認定之事實，裁處罰鍰額度。\n五、按行政罰法第二十七條規定，行政罰之裁處權，因三年期間之經過而消滅。考量實務上通報及調查決定情形，於第四項訂定裁處權時效起算之特別規定。\n六、考量裁處處分機關及不服該處分之救濟受理機關，由同一機關辦理，恐影響救濟之公正性，爰於第五項明定不服保訓會之罰鍰處分，應循訴願程序救濟。\n相關條文\n行政罰法\n第二十七條第一項\n行政罰之裁處權，因三年期間之經過而消滅。"}],"changed":true,"final":"前條第二項、第三項及第六項之罰鍰，由保訓會裁處之。裁處權時效因三年期間經過而消滅。\n前條第四項就重大災害或死亡事故因果關係之認定及裁處，由保訓會延聘學者專家五人至七人，組成安全衛生事故審議小組審認之。任一性別比例不得少於三分之一。有關因果關係之審認與裁處原則、審議程序及組成等事項，由保訓會定之。\n保訓會知悉各機關安全及衛生防護措施或防免職場霸凌行為有不當或違法時，得主動實施檢查，或通知其上級機關實施檢查。其有不合規定者，應告知違反法令條款，並通知屆期改善；屆期未改善，按違失情節輕重，依相關規定處理。\n職場霸凌申訴受理機關應將前條第六項職場霸凌成立與否之決定及調查事證函送保訓會。該決定之調查程序與人員組成，有未符第十九條第一項所定辦法之規定者，保訓會得依職權要求機關重行調查。\n前條第二項之裁處權時效，自公務人員就機關因其提出職場霸凌申訴或安全及衛生建議，所為不利對待或不合理處置，提起救濟之日起算。前條第三項之裁處權時效，自上級機關就機關屆期未改善情形，通報保訓會之日起算。前條第四項裁處權時效，自機關向保訓會通報重大災害或死亡事故之日起算。前條第六項裁處權時效，自職場霸凌申訴受理機關將職場霸凌成立與否之決定及調查事證，函報保訓會之日起算；如經保訓會要求重行調查，應自職場霸凌申訴受理機關重行調查後，再函報保訓會之日起算。\n不服保訓會所為第一項裁處處分，有關其權益之救濟，依訴願法之規定行之。","finalWhy":"","review":{"note":"照委員黃國昌等7人所提修正動議通過","text":"前條第二項至第四項及第六項之罰鍰，由保訓會裁處之。裁處權時效因三年期間經過而消滅。\n前條第四項就重大災害或死亡事故因果關係之認定及裁處，由保訓會延聘學者專家五人至七人，組成安全衛生事故審議小組審認之。任一性別比例不得少於三分之一。有關因果關係之審認與裁處原則、審議程序及組成等事項，由保訓會定之。\n保訓會知悉各機關安全及衛生防護措施或防免職場霸凌行為有不當或違法時，得主動實施檢查，或通知其上級機關實施檢查。其有不合規定者，應告知違反法令條款，並通知屆期改善；屆期未改善，按違失情節輕重，依相關規定處理。\n職場霸凌申訴受理機關應將前條第六項職場霸凌成立與否之決定及調查事證函送保訓會。該決定之調查程序與人員組成，有未符第十九條第一項所定辦法之規定者，保訓會得依職權要求機關重行調查。\n前條第二項之裁處權時效，自公務人員就機關因其提出職場霸凌申訴或安全及衛生建議，所為不利對待或不合理處置，提起救濟之日起算。前條第三項之裁處權時效，自上級機關就機關屆期未改善情形，通報保訓會之日起算。前條第四項裁處權時效，自機關向保訓會通報重大災害或死亡事故之日起算。前條第六項裁處權時效，自職場霸凌申訴受理機關將職場霸凌成立與否之決定及調查事證，函報保訓會之日起算；如經保訓會要求重行調查，應自職場霸凌申訴受理機關重行調查後，再函報保訓會之日起算。\n不服保訓會所為第一項裁處處分，有關其權益之救濟，依訴願法之規定行之。"}},{"no":"第十九條之三","current":null,"versions":[{"bill":"202110107960000","text":"公務人員於知悉第十九條第二項事件發生日起二年內提出申訴。但自發生之日起逾五年者，不得提出。","note":"一、本條新增。\n二、第十九條第二項公務人員執行職務遭受管理不當、職場霸凌、與其他公務人員執行職務因他人言語或行為所致身體或精神不法侵害之申訴期間。\n三、因應本類事件證據保全不易，影響被害人執行職務之安全，並因公務人員所執行之職務攸關行政效率與人民權益，故自知悉事件發生日起兩年內應為申訴，並逾五年不得提出。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第二十條","current":"公務人員執行職務時，現場長官認已發生危害或明顯有發生危害之虞者，得視情況暫時停止執行。","versions":[{"bill":"202110082730000","text":"公務人員執行職務時，現場長官認已發生危害或明顯有發生危害之虞者，除為維護重大公共利益所必要者外，應暫時停止執行。","note":"公務人員執行職務時，現場長官判斷已發生危害或明顯有發生危害的疑慮時，除為維護重大公共利益所必要者外，應立即暫時停止執行以保障公務人員安全。"}],"changed":false,"final":"公務人員執行職務時，現場長官認已發生危害或明顯有發生危害之虞者，得視情況暫時停止執行。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十一條","current":"公務人員因機關提供之安全及衛生防護措施有瑕疵，致其生命、身體或健康受損時，得依國家賠償法請求賠償。\n公務人員執行職務時，發生意外致受傷、失能或死亡者，應發給慰問金。但該公務人員有故意或重大過失情事者，得不發或減發慰問金。\n前項慰問金發給辦法，由考試院會同行政院定之。","versions":[{"bill":"202110082730000","text":"公務人員因機關未提供安全及衛生防護措施或提供之安全及衛生防護措施有瑕疵，致其生命、身體或健康受損時，得依國家賠償法請求賠償。\n公務人員執行職務時，發生意外致受傷、失能或死亡者，應發給慰問金。但該公務人員有故意或重大過失情事者，得不發或減發慰問金。\n前項慰問金發給辦法，由考試院會同行政院定之。","note":"除供之安全及衛生防護措施有瑕疵外，機關應提供而未提供安全及衛生防護措施致公務人員值勤時生命、身體或健康受損，亦得依國家賠償法請求賠償。"},{"bill":"202110082800000","text":"機關提供之安全及衛生防護措施有瑕疵、違反職場霸凌行為防制機制、處理程序及其他應遵行事項，致公務人員生命、身體或健康受損時，依國家賠償法請求賠償。\n公務人員執行職務時，發生意外致受傷、失能或死亡者，應發給慰問金。但該公務人員有故意或重大過失情事者，得不發或減發慰問金。\n前項慰問金發給辦法，由考試院會同行政院定之。","note":"一、修正第一項，增訂若機關疑似有職場霸凌，未提供防制職場霸凌機制、違反處理程序或其他應遵行事項，致公務人員生命、身體或健康受損時，得依國家賠償法請求賠償。\n二、第二項及第三項未修正。"},{"bill":"201110124670000","text":"公務人員因機關未提供安全及衛生防護措施或提供之安全及衛生防護措施有瑕疵，致其生命、身心健康受損時，得依國家賠償法請求賠償。\n公務人員執行職務時，發生意外致受傷、失能或死亡者，應發給慰問金。但該公務人員有故意或重大過失情事者，得不發或減發慰問金。\n前項慰問金發給辦法，由考試院會同行政院定之。","note":"一、本條修正。\n二、第一項修正，除原明定機關提供安全及衛生防護措施有瑕疵者外，增訂對於未提供安全及衛生防護措施之情形，致其損及公務人員身心健康，公務人員均得依國家賠償法請求賠償。又以公務人員健康防護，包括生命、身體及心理健康等權益，爰酌作文字修正。"}],"changed":true,"final":"公務人員因機關未提供安全及衛生防護措施或提供之安全及衛生防護措施有瑕疵，致其生命、身心健康受損時，得依國家賠償法請求賠償。\n公務人員執行職務時，發生意外致受傷、失能或死亡者，應發給慰問金。但該公務人員有故意或重大過失情事者，得不發或減發慰問金。\n前項慰問金發給辦法，由考試院會同行政院定之。","finalWhy":"一、本條修正。\n二、第一項修正，除原明定機關提供安全及衛生防護措施有瑕疵者外，增訂對於未提供安全及衛生防護措施之情形，致其損及公務人員身心健康，公務人員均得依國家賠償法請求賠償。又以公務人員健康防護，包括生命、身體及心理健康等權益，爰酌作文字修正。","review":{"note":"照考試院提案通過","text":"公務人員因機關未提供安全及衛生防護措施或提供之安全及衛生防護措施有瑕疵，致其生命、身心健康受損時，得依國家賠償法請求賠償。\n公務人員執行職務時，發生意外致受傷、失能或死亡者，應發給慰問金。但該公務人員有故意或重大過失情事者，得不發或減發慰問金。\n前項慰問金發給辦法，由考試院會同行政院定之。"}},{"no":"第二十二條","current":"公務人員依法執行職務涉訟時，服務機關應輔助其延聘律師為其辯護及提供法律上之協助。\n前項情形，其涉訟係因公務人員之故意或重大過失所致者，應不予輔助；如服務機關已支付涉訟輔助費用者，應予追還。\n第一項之涉訟輔助辦法，由考試院會同行政院定之。","versions":[{"bill":"202110082800000","text":"公務人員依法執行職務涉訟時，服務機關應輔助其延聘律師為其辯護及提供法律上之協助。\n前項情形，其涉訟係因公務人員之故意、重大過失或職場霸凌所致者，應不予輔助；如服務機關已支付涉訟輔助費用者，應予追還。\n第一項之涉訟輔助辦法，由考試院會同行政院定之。","note":"一、修正第二項，增訂公務人員因職場霸凌涉訟者，機關不應輔助其延聘律師或提供法律上的協助。\n二、第一項及第三項未修正。"}],"changed":false,"final":"公務人員依法執行職務涉訟時，服務機關應輔助其延聘律師為其辯護及提供法律上之協助。\n前項情形，其涉訟係因公務人員之故意或重大過失所致者，應不予輔助；如服務機關已支付涉訟輔助費用者，應予追還。\n第一項之涉訟輔助辦法，由考試院會同行政院定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十四條","current":"公務人員執行職務墊支之必要費用，得請求服務機關償還之。","versions":[{"bill":"202110082730000","text":"公務人員執行職務墊支之費用，服務機關應償還之。","note":"公務人員因執行職務所發生之墊支費用，應請服務機關償還之。"}],"changed":false,"final":"公務人員執行職務墊支之必要費用，得請求服務機關償還之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二十四條之一","current":"下列公務人員之公法上財產請求權，其消滅時效期間依本法行之：\n一、因十年間不行使而消滅者：\n(一)執行職務時，發生意外致受傷、失能或死亡應發給之慰問金。\n(二)依法執行職務涉訟輔助之費用。\n二、因二年間不行使而消滅者：\n(一)經服務機關核准實施公務人員一般健康檢查之費用。\n(二)經服務機關核准之加班費。\n(三)執行職務墊支之必要費用。","versions":[{"bill":"202110082730000","text":"下列公務人員之公法上財產請求權，其消滅時效期間依本法行之：\n一、因十年間不行使而消滅者：\n(一)執行職務時，發生意外致受傷、失能或死亡應發給之慰問金。\n(二)依法執行職務涉訟輔助之費用。\n二、因二年間不行使而消滅者：\n(一)經服務機關核准實施公務人員一般健康檢查之費用。\n(二)經服務機關核准之加班費。","note":"公務人員因執行職務所發生之墊支費用，服務機關償還應不受時效影響。"}],"changed":false,"final":"下列公務人員之公法上財產請求權，其消滅時效期間依本法行之：\n一、因十年間不行使而消滅者：\n(一)執行職務時，發生意外致受傷、失能或死亡應發給之慰問金。\n(二)依法執行職務涉訟輔助之費用。\n二、因二年間不行使而消滅者：\n(一)經服務機關核准實施公務人員一般健康檢查之費用。\n(二)經服務機關核准之加班費。\n(三)執行職務墊支之必要費用。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第八十四條之一","current":null,"versions":[{"bill":"202110082730000","text":"保訓會知有服務機關管理措施或有關工作條件處置不當時，得依本法主動進行調查。\n其調查程序，準用本章規定。","note":"一、本條新增。\n二、保訓會知有服務機關管理措施或有關工作條件處置不當時，得依本法主動進行調查。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第八十九條","current":"原行政處分、管理措施或有關工作條件之處置，不因依本法所進行之各項程序而停止執行。\n原行政處分、管理措施或有關工作條件之處置合法性顯有疑義者，或其執行將發生難以回復之損害，且有急迫情事，並非為維護重大公共利益所必要者，保訓會、原處分機關或服務機關得依職權或依申請，就原行政處分、管理措施或有關工作條件之處置全部或一部，停止執行。","versions":[{"bill":"202110082730000","text":"原行政處分、管理措施或有關工作條件之處置，不因依本法所進行之各項程序而停止執行。\n原行政處分、管理措施或有關工作條件之處置合法性顯有疑義者，或其執行將發生難以回復之損害，且有急迫情事，並非為維護重大公共利益所必要者，保訓會、原處分機關或服務機關得依職權或依當事人之申請，就原行政處分、管理措施或有關工作條件之處置全部或一部，停止執行。","note":"保訓會、原處分機關或服務機關得依當事人之申請，就原行政處分、管理措施或有關工作條件之處置全部或一部，停止執行。"}],"changed":false,"final":"原行政處分、管理措施或有關工作條件之處置，不因依本法所進行之各項程序而停止執行。\n原行政處分、管理措施或有關工作條件之處置合法性顯有疑義者，或其執行將發生難以回復之損害，且有急迫情事，並非為維護重大公共利益所必要者，保訓會、原處分機關或服務機關得依職權或依申請，就原行政處分、管理措施或有關工作條件之處置全部或一部，停止執行。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第一百零二條","current":null,"versions":[],"changed":true,"final":"下列人員準用本法之規定：\n一、教育人員任用條例公布施行前已進用未經銓敘合格之公立學校職員。\n二、私立學校改制為公立學校未具任用資格之留用人員。\n三、公營事業依法任用之人員。\n四、各機關依法派用、聘用、聘任、僱用或留用人員。\n五、應各種公務人員考試錄取參加訓練之人員，或訓練期滿成績及格未獲分發任用之人員。\n前項第五款應各種公務人員考試錄取參加訓練之人員，不服保訓會所為之行政處分者，有關其權益之救濟，依訴願法之規定行之。\n法定機關（構）非屬第三條及第一項所定人員，而有依法令從事於公務者，其提起職場霸凌之申訴，準用第十九條至第十九條之二及依第十九條第一項所定辦法等相關規定。但不含醫療機構及公立學校。","finalWhy":"一、本條修正，增訂第三項。\n二、鑑於目前服務於第三條所稱法定機關（構）之人員，除第三條及第一項所定之適用或準用對象外，其餘人員均為職業安全衛生法之適用對象，包含政務人員、民選公職人員、約僱人員、駐衛警察、工友技工、約用人員等各類依法令從事於公務之人員。各法定機關（構）如能運用一致之職場霸凌申訴、調查及處理程序，除能避免雙軌制度併行之複雜化，亦有助於提升職場霸凌防治之成效，建構安全友善之公部門職場環境，爰增訂第三項，將適用職業安全衛生法之是類人員納入準用第十九條至第十九條之二及依第十九條第一項規定所定辦法有關職場霸凌申訴、調查及處理程序與對機關首長及一級單位主管為職場霸凌行為人予以裁罰之規定；至於其餘事前防治義務、外部申訴制度及勞動檢查裁罰等事項，既非屬上開準用範圍，仍應依職業安全衛生法相關規定辦理。\n三、第三項所稱法定機關（構）係依中央行政機關組織基準法第三條及第十六條規定作為認定標準，不包含公營事業等性質不相符之組織，為免爭議，爰併為敘明。復考量公立醫院及公立學校之所屬人員係適用職業安全衛生法之全部規定，本項但書特予規定適當排除之。","review":{"note":"照委員吳思瑤等5人所提修正動議通過","text":"第一百零二條  下列人員準用本法之規定：\n一、教育人員任用條例公布施行前已進用未經銓敘合格之公立學校職員。\n二、私立學校改制為公立學校未具任用資格之留用人員。\n三、公營事業依法任用之人員。\n四、各機關依法派用、聘用、聘任、僱用或留用人員。\n五、應各種公務人員考試錄取參加訓練之人員，或訓練期滿成績及格未獲分發任用之人員。\n前項第五款應各種公務人員考試錄取參加訓練之人員，不服保訓會所為之行政處分者，有關其權益之救濟，依訴願法之規定行之。\n法定機關(構)非屬第三條及第一項所定人員，而有依法令從事於公務者，其提起職場霸凌之申訴，準用第十九條至第十九條之二及依第十九條第一項所定辦法等相關規定。但不含醫療機構及公立學校。"}},{"no":"第一百零四條","current":null,"versions":[],"changed":true,"final":"本法自公布日施行。\n本法中華民國一百十一年五月三十日修正之第二十三條施行日期，由考試院定之。\n本法中華民國一百十四年六月二十四日修正之第十九條至第十九條之二、第二十一條及第一百零二條條文，自公布後六個月施行。","finalWhy":"一、本條修正，增訂第三項。\n二、為確保各機關依本法之修法，完善相關安全衛生規定，明定第十九條、第十九條之一、第十九條之二、第二十一條及第一百零二條，自公布後六個月施行。","review":{"note":"照委員黃國昌等3人所提修正動議通過","text":"第一百零四條　本法自公布日施行。\n本法中華民國一百十一年五月三十日修正之第二十三條施行日期，由考試院定之。\n本法中華民國一百十○年○月○日修正之第十九條至第十九條之二、第二十一條及第一百零二條條文，自公布後六個月施行。"}}],"stages":[{"date":"2024-10-11","stage":"一讀","code":"院會-11-2-4","bill":"202110069890000","gazref":"113卷078期5260號 6-6頁"},{"date":"2025-01-03","stage":"一讀","code":"院會-11-2-16","bill":"202110082730000","gazref":"114卷010期5303號一冊 7-7頁"},{"date":"2025-01-03","stage":"一讀","code":"院會-11-2-16","bill":"202110082800000","gazref":"114卷010期5303號一冊 12-12頁"},{"date":"2025-04-18","stage":"一讀","code":"院會-11-3-8","bill":"202110107960000","gazref":"114卷037期5330號一冊 39-39頁"},{"date":"2025-04-25","stage":"一讀","code":"院會-11-3-9","bill":"202110109170000","gazref":"114卷039期5332號 12-12頁"},{"date":"2025-05-09","stage":"一讀","code":"院會-11-3-11","bill":"202110119980000","gazref":"114卷044期5337號一冊 1 function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度

}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除

}

  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      btn.addEventListener('click', async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      });
      acts.append(btn);
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
</body>
