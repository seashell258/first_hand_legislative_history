<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公路法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"公路法","version":"02016:2026-07-24-修正","date":"2026-07-24","action":"修正","title":"公路法　2026 年修正","lede":"","summary":"","key":"02016_2026-07-24","props":[{"id":"202110196210000","who":"台灣民眾黨黨團","date":"2026-03-13","name":"「公路法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110196210000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/05/18/LCEWA01_110518_00105.pdf","proposers":["陳清龍","王安祥","邱慧洳"],"ncosign":0,"people":[["陳清龍","民眾黨","提案"],["王安祥","民眾黨","提案"],["邱慧洳","民眾黨","提案"]],"party":[["民眾黨",3]],"reason":"本院台灣民眾黨黨團，有鑑於部分拖救車業者巧立名目、惡意喊價之消費爭議事件頻傳，甚至疑有不法集團以此不當牟利。惟因現行車輛拖救業管理制度不足，政府難以落實監管，導致車輛拖救業品質參差不齊，收費制度紊亂，嚴重侵害消費者權益並危及道路安全。為強化主管機關監管責任，兼顧降低消費糾紛發生風險、提升道路救援資訊透明度與專業安全性，爰擬具「公路法部分條文修正草案」，納管車輛拖救業，提高監理密度。是否有當？敬請公決。","arts":["第二條","第五十七條之二","第七十七條","第七十八條之一","第八十一條"]},{"id":"202110206540000","who":"委員黃健豪等19人","date":"2026-04-17","name":"「公路法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110206540000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/05/18/LCEWA01_110518_00106.pdf","proposers":["黃健豪","王鴻薇","廖偉翔","蘇清泉"],"ncosign":11,"people":[["黃健豪","國民黨","提案"],["王鴻薇","國民黨","提案"],["廖偉翔","國民黨","提案"],["蘇清泉","國民黨","提案"],["萬美玲","國民黨","連署"],["賴士葆","國民黨","連署"],["黃仁","國民黨","連署"],["陳菁徽","國民黨","連署"],["葉元之","國民黨","連署"],["羅智強","國民黨","連署"],["高金素梅","無黨籍","連署"],["丁學忠","國民黨","連署"],["牛煦庭","國民黨","連署"],["陳雪生","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"]],"party":[["國民黨",14],["無黨籍",1]],"reason":"本院委員黃健豪、王鴻薇、廖偉翔、蘇清泉等19人，鑒於國內車輛拖救服務（下稱拖救業）消費糾紛頻傳，部分不肖業者利用消費者車輛故障或發生事故之急迫情境，濫用留置權並坐地起價，嚴重侵害消費者權益並影響社會秩序。現行《公路法》針對拖救業之准許可制度、營運監督及定型化契約管理仍欠缺明確法源，致使平面道路拖救服務長期處於監管真空地帶。為導正產業秩序，落實收費透明化，爰擬具「公路法部分條文修正草案」，增訂拖救業應向主管機關申請核准始得營業之規定，並強制要求訂定書面契約與定型化契約範本，明定未載明費用無請求權之原則；同時大幅提高非法經營或違反管理規定之罰鍰，並引入民眾檢舉獎金制度，以建立全民監督機制。是否有當？敬請公決。","arts":["第二條","第五十七條之二","第七十七條","第七十八條之一","第八十一條"]},{"id":"202110215730000","who":"委員林倩綺等21人","date":"2026-05-22","name":"「公路法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110215730000/details","pdf":"https:// ","民進黨","連署"],["沈發惠","民進黨","連署"],["邱議瑩","民進黨","連署"],["柯建銘","民進黨","連署"],["林楚茵","民進黨","連署"],["賴惠員","民進黨","連署"],["王義川","民進黨","連署"],["陳俊宇","民進黨","連署"],["林淑芬","民進黨","連署"],["李柏毅","民進黨","連署"],["李坤城","民進黨","連署"],["張雅琳","民進黨","連署"],["林月琴","民進黨","連署"],["王正旭","民進黨","連署"],["陳素月","民進黨","連署"],["徐富癸","民進黨","連署"],["陳秀寳","民進黨","連署"],["李昆澤","民進黨","連署"],["郭國文","民進黨","連署"],["羅美玲","民進黨","連署"],["賴瑞隆","民進黨","連署"],["吳沛憶","民進黨","連署"]],"party":[["民進黨",27]],"reason":"本院委員林俊憲、林宜瑾、蘇巧慧、楊曜、伍麗華Saidhai Tahovecahe等27人，鑒於近期國內車輛拖救服務消費糾紛頻傳，部分不肖拖吊業者利用消費者車輛故障或發生事故之急迫情境，刻意隱瞞收費資訊，事後再向受害車主收取高額費用，嚴重侵害消費者權益。為健全車輛拖救業管理制度，建立透明合理之收費規範，爰擬具「公路法部分條文修正草案」，增訂車輛拖救業應向主管機關申請核准始得營業之規定，並明定違反相關管理規定之罰鍰。是否有當？敬請公決。","arts":["第二條","第五十七條之二","第七十七條","第七十八條之一","第七十九條","第八十一條"]}],"arts":[{"no":"第二條","current":"本法用詞，定義如下：\n一、公路：指國道、省道、市道、縣道、區道、鄉道、專用公路及其用地範圍內之各項公路有關設施。\n二、國道：指聯絡二直轄市（省）以上、重要港口、機場及重要政治、經濟、文化中心之高速公路或快速公路。\n三、省道：指聯絡二縣（市）以上、直轄市（省）間交通及重要政治、經濟、文化中心之主要道路。\n四、市道：指聯絡直轄市（縣）間交通及直轄市內重要行政區間之道路。\n五、縣道：指聯絡縣（市）間交通及縣與重要鄉（鎮、市）間之道路。\n六、區道：指聯絡直轄市內各行政區及行政區與各里、原住民部落間之道路。\n七、鄉道：指聯絡鄉（鎮、市）間交通及鄉（鎮、市）與村、里、原住民部落間之道路。\n八、專用公路：指各公私機構申請公路主管機關核准興建，專供其本身運輸之道路。\n九、車輛：指汽車、電車、慢車及其他行駛於道路之動力車輛。\n十、汽車：指非依軌道或電力架設，而以原動機行駛之車輛。\n十一、電車：指以架線供應電力之無軌電車，或依軌道行駛之地面電車。\n十二、慢車：指腳踏自行車、電動輔助自行車、電動自行車，三輪以上人力或獸力行駛之車輛。\n十三、公路經營業：指以修建、維護及管理公路及其附屬之停車場等，供汽車通行、停放收取費用之事業。\n十四、汽車或電車運輸業：指以汽車或電車經營客、貨運輸而受報酬之事業。\n十五、計程車客運服務業：指以計程車經營客運服務而受報酬之事業。","versions":[{"bill":"202110196210000","text":"本法用詞，定義如下：\n一、公路：指國道、省道、市道、縣道、區道、鄉道、專用公路及其用地範圍內之各項公路有關設施。\n二、國道：指聯絡二直轄市（省）以上、重要港口、機場及重要政治、經濟、文化中心之高速公路或快速公路。\n三、省道：指聯絡二縣（市）以上、直轄市（省）間交通及重要政治、經濟、文化中心之主要道路。\n四、市道：指聯絡直轄市（縣）間交通及直轄市內重要行政區間之道路。\n五、縣道：指聯絡縣（市）間交通及縣與重要鄉（鎮、市）間之道路。\n六、區道：指聯絡直轄市內各行政區及行政區與各里、原住民部落間之道路。\n七、鄉道：指聯絡鄉（鎮、市）間交通及鄉（鎮、市）與村、里、原住民部落間之道路。\n八、專用公路：指各公私機構申請公路主管機關核准興建，專供其本身運輸之道路。\n九、車輛：指汽車、電車、慢車及其他行駛於道路之動力車輛。\n十、汽車：指非依軌道或電力架設，而以原動機行駛之車輛。\n十一、電車：指以架線供應電力之無軌電車，或依軌道行駛之地面電車。\n十二、慢車：指腳踏自行車、電動輔助自行車、電動自行車，三輪以上人力或獸力行駛之車輛。\n十三、公路經營業：指以修建、維護及管理公路及其附屬之停車場等，供汽車通行、停放收取費用之事業。\n十四、汽車或電車運輸業：指以汽車或電車經營客、貨運輸而受報酬之事業。\n十五、計程車客運服務業：指以計程車經營客運服務而受報酬之事業。\n十六、車輛拖救業：指以拖救車經營車輛拖救服務或車輛移置服務而受報酬之事業。","note":"一、配合新增第五十七條之二及第七十七條第四項及第五項之規定，新增本條第十六款之規定。\n二、參酌現行《交通部公路局快速公路車輛拖救服務作業要點》及交通部快速公路車輛拖救服務協議書及國道小（大）型車輛拖救服務契約之使用文字，就車輛拖救業之定義予以明文。"},{"bill":"202110206540000","text":"本法用詞，定義如下：\n一、公路：指國道、省道、市道、縣道、區道、鄉道、專用公路及其用地範圍內之各項公路有關設施。\n二、國道：指聯絡二直轄市（省）以上、重要港口、機場及重要政治、經濟、文化中心之高速公路或快速公路。\n三、省道：指聯絡二縣（市）以上、直轄市（省）間交通及重要政治、經濟、文化中心之主要道路。\n四、市道：指聯絡直轄市（縣）間交通及直轄市內重要行政區間之道路。\n五、縣道：指聯絡縣（市）間交通及縣與重要鄉（鎮、市）間之道路。\n六、區道：指聯絡直轄市內各行政區及行政區與各里、原住民部落間之道路。\n七、鄉道：指聯絡鄉（鎮、市）間交通及鄉（鎮、市）與村、里、原住民部落間之道路。\n八、專用公路：指各公私機構申請公路主管機關核准興建，專供其本身運輸之道路。\n九、車輛：指汽車、電車、慢車及其他行駛於道路之動力車輛。\n十、汽車：指非依軌道或電力架設，而以原動機行駛之車輛。\n十一、電車：指以架線供應電力之無軌電車，或依軌道行駛之地面電車。\n十二、慢車：指腳踏自行車、電動輔助自行車、電動自行車，三輪以上人力或獸力行駛之車輛。\n十三、公路經營業：指以修建、維護及管理公路及其附屬之停車場等，供汽車通行、停放收取費用之事業。\n十四、汽車或電車運輸業：指以汽車或電車經營客、貨運輸而受報酬之事業。\n十五、計程車客運服務業：指以計程車經營客運服務而受報酬之事業。\n十六、車輛拖救業：指以拖救車經營車輛拖救服務或車輛移置服務而受報酬之事業。","note":"一、配合新增第五十七條之二及第七十七條第四項及第五項之規定，新增本條第十六款之規定。\n二、鑑於車輛拖救業之營運特性與收費爭議頻傳，為明確其法律定位並落實行政監管，參酌現行交通部高速公路局國道車輛拖救服務協議書以及《交通部公路局快速公路車輛拖救服務作業要點》之使用文字，就車輛拖救業之定義予以明文。"},{"bill":"202110215730000","text":"本法用詞，定義如下：\n一、公路：指國道、省道、市道、縣道、區道、鄉道、專用公路及其用地範圍內之各項公路有關設施。\n二、國道：指聯絡二直轄市（省）以上、重要港口、機場及重要政治、經濟、文化中心之高速公路或快速公路。\n三、省道：指聯絡二縣（市）以上、直轄市（省）間交通及重要政治、經濟、文化中心之主要道路。\n四、市道：指聯絡直轄市（縣）間交通及直轄市內重要行政區間之道路。\n五、縣道：指聯絡縣（市）間交通及縣與重要鄉（鎮、市）間之道路。\n六、區道：指聯絡直轄市內各行政區及行政區與各里、原住民部落間之道路。\n七、鄉道：指聯絡鄉（鎮、市）間交通及鄉（鎮、市）與村、里、原住民部落間之道路。\n八、專用公路：指各公私機構申請公路主管機關核准興建，專供其本身運輸之道路。\n九、車輛：指汽車、電車、慢車及其他行駛於道路之動力車輛。\n十、汽車：指非依軌道或電力架設，而以原動機行駛之車輛。\n十一、電車：指以架線供應電力之無軌電車，或依軌道行駛之地面電車。\n十二、慢車：指腳踏自行車、電動輔助自行車、電動自行車，三輪以上人力或獸力行駛之車輛。\n十三、公路經營業：指以修建、維護及管理公路及其附屬之停車場等，供汽車通行、停放收取費用之事業。\n十四、汽車或電車運輸業：指以汽車或電車經營客、貨運輸而受報酬之事業。\n十五、計程車客運服務業：指以計程車經營客運服務而受報酬之事業。\n十六、車輛拖救業：指以拖救車經營車輛拖救或車輛移置服務而受報酬之事業。","note":"一、新增第十六款。\n二、為健全產業秩序，落實透明之收費制度，將車輛拖救業納入本法規範並予以定義。"},{"bill":"202110215700000","text":"本法用詞，定義如下：\n一、公路：指國道、省道、市道、縣道、區道、鄉道、專用公路及其用地範圍內之各項公路有關設施。\n二、國道：指聯絡二直轄市（省）以上、重要港口、機場及重要政治、經濟、文化中心之高速公路或快速公路。\n三、省道：指聯絡二縣（市）以上、直轄市（省）間交通及重要政治、經濟、文化中心之主要道路。\n四、市道：指聯絡直轄市（縣）間交通及直轄市內重要行政區間之道路。\n五、縣道：指聯絡縣（市）間交通及縣與重要鄉（鎮、市）間之道路。\n六、區道：指聯絡直轄市內各行政區及行政區與各里、原 、營運監督、費用收取、車輛辨識、營運應遵守事項與對車輛拖救業之限制、禁止事項及其違反之糾正、限期改善、限期停止或廢止其營業執照之條件等事項之辦法，由中央公路主管機關定之。\n車輛拖救業就其提供之服務，應與消費者訂定書面契約，並得以電子簽章法規定之電子文件為之。書面契約未載明之費用，無請求權；並不得於契約簽訂後，巧立名目，強索增加費用。\n前項書面契約之格式、內容，中央公路主管機關應訂定定型化契約範本及其應記載及不得記載事項。\n車輛拖救業應將中央公路主管機關訂定之定型化契約書範本公開並印製於收據憑證或交付消費者，除另有約定外，視為已依第二項規定與消費者訂約。","note":"一、本條新增。\n二、實務上，現行車輛拖救業如其執業範圍屬於高速公路或快速道路範圍，多係透過行政機關之車輛拖救服務作業要點或服務協議進行，市區或其他道路則欠缺中央規範，實難以有效確保車輛拖救之監管落實。復審酌車輛拖救業務，旨在排除汽、機車於道路中故障造成之公路運行障礙，如未訂定明確營業遵守事項及營業資格，恐因業者缺乏專業度，導致二次事故發生風險提升，基於提升車輛拖救業專業性與保障大眾交通安全之目的，實有將車輛拖救業明文納管必要。參酌第五十六條有關經營計程車客運服務業之立法例，爰為第一項之規定。\n三、為避免車輛拖救業者透過巧立名目、惡意喊價侵害消費者權益，甚而因上開糾紛影響交通安全，參酌《殯葬管理條例》第四十九條之規定、《發展觀光條例》第二十九條第一項及第二項之規定，爰為第二項至第四項之規定。"},{"bill":"202110206540000","text":"經營車輛拖救業，應向所在地之公路主管機關申請核准，其應具備資格、申請程序、核准籌備與廢止核准籌備之要件、業務範圍、營運監督、費用收取、車輛辨識、營運應遵守事項與對車輛拖救業之限制、禁止事項及其違反之糾正、限期改善、限期停止或廢止其營業執照之條件等事項之辦法，由中央公路主管機關定之。\n車輛拖救業就其提供之服務，應與消費者訂定書面契約，並得以電子簽章法規定之電子文件為之。書面契約未載明之費用，無請求權；並不得於契約簽訂後，巧立名目，強索增加費用。\n前項書面契約之格式、內容，中央公路主管機關應訂定定型化契約範本及其應記載及不得記載事項。\n車輛拖救業應將中央公路主管機關訂定之定型化契約書範本公開並印製於收據憑證或交付消費者，除另有約定外，視為已依第二項規定與消費者訂約。","note":"一、本條新增。\n二、實務上，車輛拖救服務係維持公路暢通、確保憲法保障人民「遷徙自由」之必要配套行為，具備高度之公共利益性質。按其營運涉及公權力對道路障礙之排除，並非單純之一般民事商業行為，性質上更趨近於公共事業之延伸。為確保國家對此類具公共輔助性服務之行政介入正當性，爰參酌第五十六條計程車客運服務業之立法體例，爰為第一項。\n三、按車輛拖救服務多發生於駕駛人身處事故或故障之急迫狀態，消費者與業者間存在極度之「資訊不對稱」與「議價地位不平等」。為防止業者利用消費者急難情境獲取不當利益，參酌《消費者保護法》第十一條之一、第十二條及第十七條第一項之規定，爰為第二項及第三項之規定。\n四、為確保給付對等，本條第二項參酌《民法》第二百四十七條之一關於定型化契約顯失公平之衡平精神，嚴禁巧立名目強索費用。另考量道路救援實務之時效性，爰於第二項併同採認《電子簽章法》之電子文件效力。\n五、鑒於拖救契約具專業性，一般民眾難以判斷條款合理性，爰於第四項參酌《消費者保護法》第十七條第四項與第五項關於定型化契約效力之規範體例，藉由行政手段預先介入契約內容，以保障弱勢消費者並有效降低後續民事糾紛。"},{"bill":"202110215730000","text":"經營車輛拖救業，應向所在地之公路主管機關申請核准，其應具備資格、申請程序、核准籌備與廢止核准籌備之要件、業務範圍、營運監督、費用收取、車輛標識、營運應遵守事項與對車輛拖救業之限制、禁止事項及其違反之糾正、限期改善、限期停止或廢止其營業執照之條件等事項之辦法，由交通部定之。\n車輛拖救業就其提供之服務，應與消費者訂定書面契約，並得以電子簽章法規定之電子文件為之；並不得超額或擅立收費項目收費。\n前項契約之定型化契約範本及其應記載及不得記載事項，由交通部定之。\n車輛拖救業應將前項定型化契約範本公開並印製於收據憑證或交付消費者，除另有約定外，視為已依第二項之規定與消費者訂約。","note":"一、本條新增。\n二、為增進車輛拖救業專業性與保障公路交通安全，參酌本法有關計程車客運服務業之立法例，增訂第一項。\n三、車輛拖救業屢傳價格不透明、擅立名目收費等侵害消費者權益之情事，爰參酌《發展觀光條例》第二十九條及醫療法第二十二條之立法例，增訂第二項至第四項，確立定型化契約樣態並遏止超額或擅立名目收費之亂象。"},{"bill":"202110215700000","text":"經營車輛拖救業，應向所在地之公路主管機關申請核准，其應具備資格、申請程序、核准籌備與廢止核准籌備之要件、業務範圍、營運監督、費用收取、車輛辨識、營運應遵守事項與對車輛拖救業之限制、禁止事項及其違反之糾正、限期改善、限期停止或廢止其營業執照之條件等事項之辦法，由中央公路主管機關定之。\n車輛拖救業就其提供之服務，應與消費者訂定書面契約，並得以電子簽章法規定之電子文件為之。書面契約未載明之費用，無請求權；並不得於契約簽訂後，巧立名目，強索增加費用。\n前項書面契約之格式、內容，中央公路主管機關應訂定定型化契約範本及其應記載及不得記載事項。\n車輛拖救業應將中央公路主管機關訂定之定型化契約書範本公開並印製於收據憑證或交付消費者，除另有約定外，視為已依第二項規定與消費者訂約。","note":"一、本條新增。\n二、基於提升車輛拖救業專業性與保障大眾交通安全之目的，實有將車輛拖救業明文納管必要。參酌第五十六條有關經營計程車客運服務業之立法例，爰為第一項之規定。\n三、為避免車輛拖救業者透過巧立名目、惡意喊價侵害消費者權益，甚而因上開糾紛影響交通安全，參酌《發展觀光條例》第二十九條第一項及第二項之規定，爰為第二項至第四項之規定。"},{"bill":"202110227460000","text":"經營車輛拖救業，應向所在地之直轄市、縣（市）政府公路主管機關申請核准，並依其所定之申請服務登記須知、服務作業規定或其他應遵守事項之規定辦理。","note":"一、本條新增。\n二、為健全車輛拖救業之管理制度，參考現行國道車輛拖吊服務作法，明定經營車輛拖救業應向所在地直轄市、縣（市）政府公路主管機關申請核准，並依其所定相關事項規定辦理，爰增訂本條規定。"}],"changed":true,"final":"經營車輛拖救業，應向所在地之公路主管機關申請核准，其應具備資格、申請程序、核准籌備與廢止核准籌備之要件、業務範圍、營運監督、費用收取、車輛辨識、營運應遵守事項與對車輛拖救業之限制、禁止事項及其違反之糾正、限期改善、限期停止或廢止其營業執照之條件等事項之辦法，由中央公路主管機關定之。\n車輛拖救業就其提供之服務，應與消費者訂定書面契約，並得以電子簽章法規定之電子文件為之。書面契約未載明之費用，無請求權；並不得於契約簽訂後，巧立名目，強索增加費用。\n前項書面契約之格式、內容，中央公路主管機關應訂定定型化契約範本及其應記載及不得記載事項。\n車輛拖救業應將中央公路主管機關訂定之定型化契約書範本公開並印製於收據憑證或交付消費者，除另有約定外，視為已依第二項規定與消費者訂約。","finalWhy":"","review":null},{"no":"第七十七條","current":"汽車或電車運輸業，違反依第七十九條第五項所定規則者，由公路主管機關處新臺幣九千元以上九萬元以下罰鍰，並得按其情節，吊扣其違規營業車輛牌照一個月至三個月，或定期停止其營業之一部或全部，並吊銷其非法營業車輛之牌照，或廢止其汽車運輸業營業執照及吊銷全部營業車輛牌照。\n未依本法申請核准，而經營汽車或電車運輸業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n計程車客運服務業違反依第五十六條所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止其繼續接受委託六個月至一年或廢止其營業執照。未依本法申請核准，經營計程車客運服務業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業。\n民營汽車駕駛人訓練機構違反依第六十二條之一所定管理辦法者，公路主管機關應予糾正並限期改善、核減招生人數、定期停止派督考、定期停止招生、或廢止其立案證書。汽車駕駛人訓練機構經廢止核准籌設或廢止立案證書者，原班址及原負責人一年內不得申請設立汽車駕駛人訓練機構。未依本法申請核准，而經營汽車駕駛人訓練機構者，處新臺幣五萬元以上十五萬元以下罰鍰，並勒令其歇業。其非法營業之車輛牌照並得吊扣二個月至六個月，或吊銷之，非滿一年不得再請領。\n依第一項、第二項及前項規定吊銷之車輛牌照，其汽車所有人不依限期繳回牌照者，由公路主管機關逕行註銷之。依第二項規定經吊銷駕駛執照，其汽車駕駛人不依限期繳回駕駛執照者，亦同。","versions":[{"bill":"202110196210000","text":"汽車或電車運輸業，違反依第七十九條第五項所定規則者，由公路主管機關處新臺幣九千元以上九萬元以下罰鍰，並得按其情節，吊扣其違規營業車輛牌照一個月至三個月，或定期停止其營業之一部或全部，並吊銷其非法營業車輛之牌照，或廢止其汽車運輸業營業執照及吊銷全部營業車輛牌照。\n未依本法申請核准，而經營汽車或電車運輸業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n計程車客運服務業違反依第五十六條所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止其繼續接受委託六個月至一年或廢止其營業執照。未依本法申請核准，經營計程車客運服務業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業。\n車輛拖救業違反依第五十七條之二第一項所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止或廢止其營業執照。未依本法申請核准，經營車輛拖救業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n車輛拖救業違反第五十七條之二第二項規定者，經公路主管機關令其限期改正而屆期不改正者，處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n民營汽車駕駛人訓練機構違反依第六十二條之一所定管理辦法者，公路主管機關應予糾正並限期改善、核減招生人數、定期停止派督考、定期停止招生、或廢止其立案證書。汽車駕駛人訓練機構經廢止核准籌設或廢止立案證書者，原班址及原負責人一年內不得申請設立汽車駕駛人訓練機構。未依本法申請核准，而經營汽車駕駛人訓練機構者，處新臺幣五萬元以上十五萬元以下罰鍰，並勒令其歇業。其非法營業之車輛牌照並得吊扣二個月至六個月，或吊銷之，非滿一年不得再請領。\n依第一項、第二項及前項規定吊銷之車輛牌照，其汽車所有人不依限期繳回牌照者，由公路主管機關逕行註銷之。依第二項規定經吊銷駕駛執照，其汽車駕駛人不依限期繳回駕駛執照者，亦同。","note":"配合新增第五十七條之二之規定，為有效遏止不法行為，維護交通安全與消費者權益，有必要增訂相關罰則，爰新增第四項及第五項之規定。"},{"bill":"202110206540000","text":"汽車或電車運輸業，違反依第七十九條第五項所定規則者，由公路主管機關處新臺幣九千元以上九萬元以下罰鍰，並得按其情節，吊扣其違規營業車輛牌照一個月至三個月，或定期停止其營業之一部或全部，並吊銷其非法營業車輛之牌照，或廢止其汽車運輸業營業執照及吊銷全部營業車輛牌照。\n未依本法申請核准，而經營汽車或電車運輸業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n計程車客運服務業違反依第五十六條所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止其繼續接受委託六個月至一年或廢止其營業執照。未依本法申請核准，經營計程車客運服務業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業。\n車輛拖救業違反依第五十七條之二第一項所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，並得吊扣違規營業車輛牌照一個月至三個月，公路主管機關得按其情節，予以糾正並限期改善、限期停止或廢止其營業執照。未依本法申請核准，經營車輛拖救業者，得依其違反情節輕重，處新臺幣十萬元以上五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n車輛拖救業違反第五十七條之二第二項規定者，經公路主管機關令其限期改正而屆期不改正者，處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n民營汽車駕駛人訓練機構違反依第六十二條之一所定管理辦法者，公路主管機關應予糾正並限期改善、核減招生人數、定期停止派督考、定期停止招生、或廢止其立案證書。汽車駕駛人訓練機構經廢止核准籌設或廢止立案證書者，原班址及原負責人一年內不得申請設立汽車駕駛人訓練機構。未依本法申請核准，而經營汽車駕駛人訓練機構者，處新臺幣五萬元以上十五萬元以下罰鍰，並勒令其歇業。其非法營業之車輛牌照並得吊扣二個月至六個月，或吊銷之，非滿一年不得再請領。\n依第一項、第二項及前項規定吊銷之車輛牌照，其汽車所有人不依限期繳回牌照者，由公路主管機關逕行註銷之。依第二項規定經吊銷駕駛執照，其汽車駕駛人不依限期繳回駕駛執照者，亦同。","note":"一、為遏阻非法拖救之社會亂象，參酌本條第二項及第三項關於非法經營運輸業之罰則，於第四項增訂相關罰則。\n二、另針對合法業者違規及違反定型化契約義務，分別參酌本條第三項及《消費者保護法》第五十六條之一按次處罰之精神，於第四項及第五項明定裁罰基準，以維護市場秩序。"},{"bill":"202110215730000","text":"汽車或電車運輸業，違反依第七十九條第五項所定規則者，由公路主管機關處新臺幣九千元以上九萬元以下罰鍰，並得按其情節，吊扣其違規營業車輛牌照一個月至三個月，或定期停止其營業之一部或全部，並吊銷其非法營業車輛之牌照，或廢止其汽車運輸業營業執照及吊銷全部營業車輛牌照。\n未依本法申請核准，而經營汽車或電車運輸業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n計程車客運服務業違反依第五十六條所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止其繼續接受委託六個月至一年或廢止其營業執照。未依本法申請核准，經營計程車客運服務業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業。\n車輛拖救業違反依第五十七條之二第一項所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止或廢止其營業執照。未依本法申請核准，經營車輛拖救業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業；其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n車輛拖救業違反第五十七條之二第二項規定者，經公路主管機關令其限期改善而屆期不改善者，處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n民營汽車駕駛人訓練機構違反依第六十二條之一所定管理辦法者，公路主管機關應予糾正並限期改善、核減招生人數、定期停止派督考、定期停止招生、或廢止其立案證書。汽車駕駛人訓練機構經廢止核准籌設或廢止立案證書者，原班址及原負責人一年內不得申請設立汽車駕駛人訓練機構。未依本法申請核准，而經營汽車駕駛人訓練機構者，處新臺幣五萬元以上十五萬元以下罰鍰，並勒令其歇業。其非法營業之車輛牌照並得吊扣二個月至六個月，或吊銷之，非滿一年不得再請領。\n依第一項、第二項及前項規定吊銷之車輛牌照，其汽車所有人不依限期繳回牌照者，由公路主管機關逕行註銷之。依第二項規定經吊銷駕駛執照，其汽車駕駛人不依限期繳回駕駛執照者，亦同。","note":"一、新增第四項及第五項。\n二、配合新增第五十七條之二規定，為達遏止不法行為與保障消費者權益之目的，增訂相關罰則。"},{"bill":"202110215700000","text":"汽車或電車運輸業，違反依第七十九條第五項所定規則者，由公路主管機關處新臺幣九千元以上九萬元以下罰鍰，並得按其情節，吊扣其違規營業車輛牌照一個月至三個月，或定期停止其營業之一部或全部，並吊銷其非法營業車輛之牌照，或廢止其汽車運輸業營業執照及吊銷全部營業車輛牌照。\n未依本法申請核准，而經營汽車或電車運輸業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n計程車客運服務業違反依第五十六條所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止其繼續接受委託六個月至一年或廢止其營業執照。未依本法申請核准，經營計程車客運服務業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業。\n車輛拖救業違反依第五十七條之二第一項所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止或廢止其營業執照。未依本法申請核准，經營車輛拖救業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n車輛拖救業違反第五十七條之二第二項規定者，經公路主管機關令其限期改正而屆期不改正者，處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n民營汽車駕駛人訓練機構違反依第六十二條之一所定管理辦法者，公路主管機關應予糾正並限期改善、核減招生人數、定期停止派督考、定期停止招生、或廢止其立案證書。汽車駕駛人訓練機構經廢止核准籌設或廢止立案證書者，原班址及原負責人一年內不得申請設立汽車駕駛人訓練機構。未依本法申請核准，而經營汽車駕駛人訓練機構者，處新臺幣五萬元以上十五萬元以下罰鍰，並勒令其歇業。其非法營業之車輛牌照並得吊扣二個月至六個月，或吊銷之，非滿一年不得再請領。\n依第一項、第二項及前項規定吊銷之車輛牌照，其汽車所有人不依限期繳回牌照者，由公路主管機關逕行註銷之。依第二項規定經吊銷駕駛執照，其汽車駕駛人不依限期繳回駕駛執照者，亦同。","note":"配合新增第五十七條之二之規定，為有效遏止不法行為，維護交通安全與消費者權益，有必要增訂相關罰則，爰新增第四項及第五項之規定。"},{"bill":"202110227460000","text":"汽車或電車運輸業，違反依第七十九條第五項所定規則者，由公路主管機關處新臺幣九千元以上九萬元以下罰鍰，並得按其情節，吊扣其違規營業車輛牌照一個月至三個月，或定期停止其營業之一部或全部，並吊銷其非法營業車輛之牌照，或廢止其汽車運輸業營業執照及吊銷全部營業車輛牌照。\n未依本法申請核准，而經營汽車或電車運輸業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n計程車客運服務業違反依第五十六條所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止其繼續接受委託六個月至一年或廢止其營業執照。未依本法申請核准，經營計程車客運服務業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業。\n車輛拖救業違反依第五十七條之二所定規定者，由直轄市、縣（市）政府處新臺幣三萬元以上九萬元以下罰鍰，得吊扣違規營業車輛牌照一個月至三個月，並得命限期改善，屆期不改善者，按次處罰；情節重大者，定期停止其營業或廢止其營業執照。\n未依本法申請核准，經營車輛拖救業者，由直轄市、縣（市）政府依其違反情節輕重，處新臺幣十萬元以上五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n民營汽車駕駛人訓練機構違反依第六十二條之一所定管理辦法者，公路主管機關應予糾正並限期改善、核減招生人數、定期停止派督考、定期停止招生、或廢止其立案證書。汽車駕駛人訓練機構經廢止核准籌設或廢止立案證書者，原班址及原負責人一年內不得申請設立汽車駕駛人訓練機構。未依本法申請核准，而經營汽車駕駛人訓練機構者，處新臺幣五萬元以上十五萬元以下罰鍰，並勒令其歇業。其非法營業之車輛牌照並得吊扣二個月至六個月，或吊銷之，非滿一年不得再請領。\n依第一項、第二項及前項規定吊銷之車輛牌照，其汽車所有人不依限期繳回牌照者，由公路主管機關逕行註銷之。依第二項規定經吊銷駕駛執照，其汽車駕駛人不依限期繳回駕駛執照者，亦同。","note":"一、為維護交通安全與消費者權益，明定車輛拖救業違反所在地直轄市、縣（市）政府公路主管機關所定相關事項，及未依規定申請核准而經營車輛拖救業務之處罰規定，爰增訂第四項、第五項規定。\n二、原第四項、第五項依序遞移。"}],"changed":true,"final":"汽車或電車運輸業，違反依第七十九條第五項所定規則者，由公路主管機關處新臺幣九千元以上九萬元以下罰鍰，並得按其情節，吊扣其違規營業車輛牌照一個月至三個月，或定期停止其營業之一部或全部，並吊銷其非法營業車輛之牌照，或廢止其汽車運輸業營業執照及吊銷全部營業車輛牌照。\n未依本法申請核准，而經營汽車或電車運輸業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n計程車客運服務業違反依第五十六條所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止其繼續接受委託六個月至一年或廢止其營業執照。未依本法申請核准，經營計程車客運服務業者，得依其違反情節輕重，處新臺幣十萬元以上二千五百萬元以下罰鍰，並勒令其歇業。\n車輛拖救業違反依第五十七條之二第一項所定辦法者，處新臺幣三萬元以上九萬元以下罰鍰，公路主管機關得按其情節，予以糾正並限期改善、限期停止或廢止其營業執照，並得吊扣違規營業車輛牌照一個月至三個月。未依本法申請核准，經營車輛拖救業者，得依其違反情節輕重，處新臺幣十萬元以上三百萬元以下罰鍰，並勒令其歇業，其非法營業之車輛牌照及汽車駕駛人駕駛執照，並得吊扣四個月至一年，或吊銷之，非滿二年不得再請領或考領。\n車輛拖救業違反第五十七條之二第二項規定者，經公路主管機關令其限期改正而屆期不改正者，處新臺幣十萬元以上一百萬元以下罰鍰，並得按次處罰。\n民營汽車駕駛人訓練機構違反依第六十二條之一所定管理辦法者，公路主管機關應予糾正並限期改善、核減招生人數、定期停止派督考、定期停止招生、或廢止其立案證書。汽車駕駛人訓練機構經廢止核准籌設或廢止立案證書者，原班址及原負責人一年內不得申請設立汽車駕駛人訓練機構。未依本法申請核准，而經營汽車駕駛人訓練機構者，處新臺幣五萬元以上十五萬元以下罰鍰，並勒令其歇業。其非法營業之車輛牌照並得吊扣二個月至六個月，或吊銷之，非滿一年不得再請領。\n依第一項、第二項、第四項及前項規定吊銷之車輛牌照，其汽車所有人不依限期繳回牌照者，由公路主管機關逕行註銷之。依第二項規定經吊銷駕駛執照，其汽車駕駛人不依限期繳回駕駛執照者，亦同。","finalWhy":"照台灣民眾黨黨團、國民黨黨團共同所提再修正動議條文通過。","review":null},{"no":"第七十八條之一","current":"對於未依本法申請核准而經營汽車運輸業、計程車客運服務業之行為，民眾得敘明事實檢具證據資料，向公路主管機關檢舉。公路主管機關除應對檢舉人之身分資料保密外，經查證屬實並處以罰鍰者，得以實收罰鍰收入之一定比例，提充檢舉獎金獎勵檢舉人。\n前項檢舉及獎勵辦法，由中央公路主管機關定之。","versions":[{"bill":"202110196210000","text":"對於未依本法申請核准而經營汽車運輸業、計程車客運服務業、車輛拖救業之行為，民眾得敘明事實檢具證據資料，向公路主管機關檢舉。公路主管機關除應對檢舉人之身分資料保密外，經查證屬實並處以罰鍰者，得以實收罰鍰收入之一定比例，提充檢舉獎金獎勵檢舉人。\n前項檢舉及獎勵辦法，由中央公路主管機關定之。","note":"配合新增第五十七條之二及第七十七條第四項及第五項之規定，爰修正第一項之規定。"},{"bill":"202110206540000","text":"對於未依本法申請核准而經營汽車運輸業、計程車客運服務業、車輛拖救業之行為，民眾得敘明事實檢具證據資料，向公路主管機關檢舉。公路主管機關除應對檢舉人之身分資料保密外，經查證屬實並處以罰鍰者，得以實收罰鍰收入之一定比例，提充檢舉獎金獎勵檢舉人。\n前項檢舉及獎勵辦法，由中央公路主管機關定之。","note":"鑑於非法業者具流動性，行政機關稽查人力有限，參酌現行汽車運輸業之治理經驗，增列拖救業為民眾檢舉範疇。並透過提充罰鍰作為獎金，鼓勵全民監督以補強執法量能，爰修正第一項。"},{"bill":"202110215730000","text":"對於未依本法申請核准而經營汽車運輸業、計程車客運服務業、車輛拖救業之行為，民眾得敘明事實檢具證據資料，向公路主管機關檢舉。公路主管機關除應對檢舉人之身分資料保密外，經查證屬實並處以罰鍰者，得以實收罰鍰收入之一定比例，提充檢舉獎金獎勵檢舉人。\n前項檢舉及獎勵辦法，由中央公路主管機關定之。","note":"一、修正第一項。\n二、配合新增第五十七條之二及第七十七條第四項、第五項規定，將車輛拖救業納入規範。"},{"bill":"202110215700000","text":"對於未依本法申請核准而經營汽車運輸業、計程車客運服務業、車輛拖救業之行為，民眾得敘明事實檢具證據資料，向公路主管機關檢舉。公路主管機關除應對檢舉人之身分資料保密外，經查證屬實並處以罰鍰者，得以實收罰鍰收入之一定比例，提充檢舉獎金獎勵檢舉人。\n前項檢舉及獎勵辦法，由中央公路主管機關定之。","note":"配合新增第五十七條之二及第七十七條第四項及第五項之規定，爰修正第一項之規定。"},{"bill":"202110227460000","text":"對於未依本法申請核准而經營汽車運輸業、計程車客運服務業、車輛拖救業之行為，民眾得敘明事實檢具證據資料，向公路主管機關檢舉。公路主管機關除應對檢舉人之身分資料保密外，經查證屬實並處以罰鍰者，得以實收罰鍰收入之一定比例，提充檢舉獎金獎勵檢舉人。\n前項檢舉及獎勵辦法，由中央公路主管機關定之。","note":"鑑於非法業者具流動性，行政機關稽查人力有限，參酌現行汽車運輸業管理制度，增列車輛拖救業為民眾檢舉範疇，鼓勵全民監督以補強執法量能，爰修正第一項規定。"}],"changed":true,"final":"對於未依本法申請核准而經營汽車運輸業、計程車客運服務業、車輛拖救業之行為，民眾得敘明事實檢具證據資料，向公路主管機關檢舉。公路主管機關除應對檢舉人之身分資料保密外，經查證屬實並處以罰鍰者，得以實收罰鍰收入之一定比例，提充檢舉獎金獎勵檢舉人。\n前項檢舉及獎勵辦法，由中央公路主管機關定之。","finalWhy":"","review":null},{"no":"第七十九條","current":"公路用地使用之申請程序、使用限制、設置位置及監督管理等事項之規則，由交通部定之。\n公路規劃基準、修建程序、養護制度、經費分擔原則及管理等事項之規則，由交通部定之。\n專用公路申請之程序、修建養護之監督管理、禁止、限制及廢止等事項之規則，由交通部定之。\n公路經營業投資申請程序、修建、營運、移轉應遵行事項與對公路經營業之限制、禁止事項及其違反之罰鍰、限期改善或勒令停業之要件等監督管理事項之規則，由交通部定之。\n汽車及電車運輸業申請資格條件、立案程序、營運監督、業務範圍、營運路線許可年限及營運應遵行事項與對汽車及電車運輸業之限制、禁止事項及其違反之罰鍰、吊扣、吊銷車輛牌照或廢止汽車運輸業營業執照之要件等事項之規則，由交通部定之。","versions":[{"bill":"202110227460000","text":"公路用地使用之申請程序、使用限制、設置位置及監督管理等事項之規則，由交通部定之。\n公路規劃基準、修建程序、養護制度、經費分擔原則及管理等事項之規則，由交通部定之。\n專用公路申請之程序、修建養護之監督管理、禁止、限制及廢止等事項之規則，由交通部定之。\n公路經營業投資申請程序、修建、營運、移轉應遵行事項與對公路經營業之限制、禁止事項及其違反之罰鍰、限期改善或勒令停業之要件等監督管理事項之規則，由交通部定之。\n汽車及電車運輸業申請資格條件、立案程序、營運監督、業務範圍、營運路線許可年限及營運應遵行事項與對汽車及電車運輸業之限制、禁止事項及其違反之罰鍰、吊扣、吊銷車輛牌照或廢止汽車運輸業營業執照之要件等事項之規則，由交通部定之。\n經營車輛拖救業，申請服務登記須知、服務作業規定或其他應遵守事項之規定，由所在地之直轄市、縣（市）政府公路主管機關定之。","note":"為健全車輛拖救業之管理制度，參考現行國道車輛拖吊服務作法，明定車輛拖救業應遵守相關事項規定，授權由所在地直轄市、縣（市）政府公路主管機關依其區域特性分別定之。"}],"changed":false,"final":"公路用地使用之申請程序、使用限制、設置位置及監督管理等事項之規則，由交通部定之。\n公路規劃基準、修建程序、養護制度、經費分擔原則及管理等事項之規則，由交通部定之。\n專用公路申請之程序、修建養護之監督管理、禁止、限制及廢止等事項之規則，由交通部定之。\n公路經營業投資申請程序、修建、營運、移轉應遵行事項與對公路經營業之限制、禁止事項及其違反之罰鍰、限期改善或勒令停業之要件等監督管理事項之規則，由交通部定之。\n汽車及電車運輸業申請資格條件、立案程序、營運監督、業務範圍、營運路線許可年限及營運應遵行事項與對汽車及電車運輸業之限制、禁止事項及其違反之罰鍰、吊扣、吊銷車輛牌照或廢止汽車運輸業營業執照之要件等事項之規則，由交通部定之。","finalWhy":null,"review":null},{"no":"第八十一條","current":"本法除八十六年五月七日修正公布之第三十五條，其施行日期由行政院定之外，自公布日施行。\n中華民國一百十一年五月二十四日修正之第六十五條第三項，自公布後一年施行。\n中華民國一百十二年十一月二十一日修正之第五十八條，其施行日期由行政院定之。","versions":[{"bill":"202110196210000","text":"本法除八十六年五月七日修正公布之第三十五條，其施行日期由行政院定之外，自公布日施行。\n中華民國一百十一年五月二十四日修正之第六十五條第三項，自公布後一年施行。\n中華民國一百十二年十一月二十一日修正之第五十八條，其施行日期由行政院定之。\n中華民國○年○月○日修正之條文，自公布後三個月施行。","note":"為確保相關準備工作，爰新增第四項之規定，明定修正之條文，自公布後三個月施行。"},{"bill":"202110206540000","text":"本法除八十六年五月七日修正公布之第三十五條，其施行日期由行政院定之外，自公布日施行。\n中華民國一百十一年五月二十四日修正之第六十五條第三項，自公布後一年施行。\n中華民國一百十二年十一月二十一日修正之第五十八條，其施行日期由行政院定之。\n中華民國○年○月○日修正之條文，自公布後三個月施行。","note":"為確保相關準備工作，爰新增第四項之規定，明定修正之條文，自公布後三個月施行。"},{"bill":"202110215730000","text":"本法除八十六年五月七日修正公布之第三十五條，其施行日期由行政院定之外，自公布日施行。\n中華民國一百十一年五月二十四日修正之第六十五條第三項，自公布後一年施行。\n中華民國一百十二年十一月二十一日修正之第五十八條，其施行日期由行政院定之。\n中華民國○年○月○日修正之條文，自公布後六個月施行。","note":"一、新增第四項。\n二、為確保新制作業準 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {

function finder(turns) {   // 在這場逐字稿裡找字

  clearTimeout(tipTimer);

  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
