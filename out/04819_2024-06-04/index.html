<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地方民意代表費用支給及村里長事務補助費補助條例 2024 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

主管職務加給。\n三、直轄市議會議員：參照直轄市政府所屬一級機關首長本俸、專業加給及主管職務加給。\n四、縣（市）議會議長：參照縣（市）長本俸、專業加給及主管職務加給。\n五、縣（市）議會副議長：參照副縣（市）長本俸、專業加給及主管職務加給。\n六、縣（市）議會議員：參照縣（市）政府一級單位主管簡任第十一職等本俸一級、專業加給及主管職務加給。\n七、鄉（鎮、市）民代表會主席：參照鄉（鎮、市）長本俸、專業加給及主管職務加給。\n八、鄉（鎮、市）民代表會副主席：參照縣轄市副市長本俸、專業加給及主管職務加給。\n九、鄉（鎮、市）民代表會代表：參照鄉（鎮、市）公所單位主管薦任第八職等本俸一級、專業加給及主管職務加給。\n前項所稱專業加給，係指一般公務人員專業加給。","finalWhy":"修正本條第一項第六款及第九款，將縣（市）議員及鄉（鎮、市）民代表之研究費標準，均增加納入主管職務加給。","review":{"note":"照委員徐欣瑩等19人提案及委員王美惠、劉建國等所提修正動議通過","text":"地方民意代表每月得支給之研究費，不得超過下列標準：\n一、直轄市議會議長：參照直轄市長月俸及公費。\n二、直轄市議會副議長：參照直轄市副市長本俸、專業加給及主管職務加給。\n三、直轄市議會議員：參照直轄市政府所屬一級機關首長本俸、專業加給及主管職務加給。\n四、縣（市）議會議長：參照縣（市）長本俸、專業加給及主管職務加給。\n五、縣（市）議會副議長：參照副縣（市）長本俸、專業加給及主管職務加給。\n六、縣（市）議會議員：參照縣（市）政府一級單位主管簡任第十一職等本俸一級、專業加給及主管職務加給。\n七、鄉（鎮、市）民代表會主席：參照鄉（鎮、市）長本俸、專業加給及主管職務加給。\n八、鄉（鎮、市）民代表會副主席：參照縣轄市副市長本俸、專業加給及主管職務加給。\n九、鄉（鎮、市）民代表會代表：參照鄉（鎮、市）公所單位主管薦任第八職等本俸一級、專業加給及主管職務加給。\n前項所稱專業加給，係指一般公務人員專業加給。"}},{"no":"第五條","current":"地方民意代表因職務關係，得由各該地方民意機關編列預算，支應其健康檢查費、保險費、為民服務費、春節慰勞金及出國考察費。\n直轄市議會議長、副議長、縣（市）議會議長、副議長及鄉（鎮、市）民代表會主席、副主席，得由各該地方民意機關編列預算，支應因公支出之特別費。\n前二項費用編列最高標準如附表。","versions":[{"bill":"202110029290000","text":"地方民意代表因職務關係，得由各該地方民意機關編列預算，支應其健康檢查費、保險費、為民服務費、春節慰勞金及出國考察費。\n直轄市議會議長、副議長、縣（市）議會議長、副議長及鄉（鎮、市）民代表會主席、副主席，得由各該地方民意機關編列預算，支應因公支出之特別費。\n前二項費用編列最高標準如附表，原住民地方民意代表之為民服務費最高為一點五倍。","note":"一、修正第三項。\n二、原住民地方民意代表需服務範圍遼闊，原住民地方民意代表「為民服務費」最高為一點五倍。"}],"changed":false,"final":"地方民意代表因職務關係，得由各該地方民意機關編列預算，支應其健康檢查費、保險費、為民服務費、春節慰勞金及出國考察費。\n直轄市議會議長、副議長、縣（市）議會議長、副議長及鄉（鎮、市）民代表會主席、副主席，得由各該地方民意機關編列預算，支應因公支出之特別費。\n前二項費用編列最高標準如附表。\n[附表：]","finalWhy":null,"review":{"note":"第五條維持現行條文；附表照委員吳琪銘等所提修正動議修正通過，如附件","text":"地方民意代表因職務關係，得由各該地方民意機關編列預算，支應其健康檢查費、保險費、為民服務費、春節慰勞金及出國考察費。\n直轄市議會議長、副議長、縣（市）議會議長、副議長及鄉（鎮、市）民代表會主席、副主席，得由各該地方民意機關編列預算，支應因公支出之特別費。\n前二項費用編列最高標準如附表。"}},{"no":"第六條","current":"直轄市議會議員每人得聘用公費助理六人至八人，縣（市）議會議員每人得聘用公費助理二人至四人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣二十四萬元。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元，縣（市）議會議員每人每月不得超過新臺幣八萬元。公費助理適用勞動基準法之規定，其相關費用，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","versions":[{"bill":"202110006500000","text":"直轄市議會議員每人得聘用公費助理六人至八人，縣（市）議會議員每人得聘用公費助理二人至四人，公費助理均與議員同進退。\n直轄市議會、縣（市）議會應每年編列每一議員一定數額之助理補助費。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元，縣（市）議會議員每人每月不得超過新臺幣八萬元。公費助理適用勞動基準法之規定，其加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n前項薪資補助費用總額及前項依勞動基準法所規定之相關費用總額，議會得比照軍公教人員待遇調整比例調整之。","note":"一、為保障直轄市及縣（市）議會議員公費助理之勞工權益，明定其加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，應由議會編列經費支應。\n二、參考現行立法院助理費相關規定，新增第三項，規定薪資補助費用及依勞動基準法所規定之相關費用總額，得比照軍公教人員待遇調整比例調整之。"},{"bill":"202110006900000","text":"直轄市議會議員及縣（市）議會議員得聘用公費助理，人數由各議會自訂，與議員同進退，其工作內容由議員與公費助理商訂之。\n前項公費助理補助費用總額，直轄市議會議員每人每月新臺幣二十四萬元，但公費助理人數未超過二人者，每人每月支領金額，最多不得超過新臺幣八萬元。縣（市）議會議員每人每月新臺幣八萬元。補助費用總額議會得綜合考量消費者物價指數漲幅、軍公教員工待遇調幅及地方財政狀況調整。\n公費助理其依法由雇主負擔之加班費、勞工保險費、全民健康保險費及勞工退休金等費用，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","note":"一、民意代表助理工作包羅萬象涉及層面既廣且深，需活化工作環境，才能吸納專業人才投身政治。惟查《地方民意代表費用支給及村里長事務補助費補助條例》自89年立法以來，聘用助理補助費用總額從未調整，相比之下20年間消費物價指數上漲23.59%，軍公教調薪5次累計16%，基本工資亦由15,840調升至27,470。近年立法院公費助理費用亦隨軍公教調薪幅度同時調，二十年來公費助理補助費用未有任何調整，公費助理之人數限制、支領上限亦不符實際需求，實有調整必要。\n二、刪除直轄市公費助理補助費用總額不得超過24萬之規定，並授權直轄市議會及縣市議會得綜合考量消費者物價指數漲幅、軍公教薪資調幅及地方財政狀況進行調整。\n三、修正人數限制及公費助理每人每月支領金額限制。參酌立法院公費助理之相關規定，公費助理費用總額每月44萬，聘用助理8人至14人，若未聘滿8人，則無法領滿44萬之規定。公費助理人數未超過二人者，每人每月支領金額，最多不得超過新臺幣八萬元。\n四、參酌立法院之規定，明訂加班費、勞工保險費、全民健康保險費及勞工退休金之雇主負擔由議會編列經費支應之。"},{"bill":"202110007680000","text":"直轄市議會議員每人聘用公費助理至少六人，縣（市）議會議員每人聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理薪資補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣十六萬元；其中聘用部分時間工作公費助理之費用數額，不得超過助理費用總額二分之一。\n公費助理適用勞動基準法之規定，其勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，均由議會編列經費支應之；加班費、資遣費及職業災害補償等補助費用總額，直轄市議會議員每人每月不得超過新臺幣六萬元，縣（市）議會議員每人每月不得超過新臺幣二萬元，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項薪資補助費用總額及前項加班費、資遣費及職業災害補償等補助費用總額，直轄市、縣（市）議會得比照軍公教人員待遇調整比例調整之。","note":"一、為因應當代民意代表服務更多元之趨勢，提供議員聘用助理之彈性，爰刪除原文第一項聘用公費助理人數上限之限制，僅規定人數下限。\n二、鑑於地方民意代表公費助理補助費總額自本條例制定迄今超過二十四年未調整，顯未能符合當前國內經濟環境與法規條件，爰酌予調整。\n三、刪除原條文第二項前段但書，取消直轄市公費助理每人每月支領不得超過新臺幣八萬元之限制；同時，賦予地方民意代表得聘用部分工時公費助理並建立相關規範，增加議員因應問政需求所需彈性。\n四、增加第三項，將地方民代公費助理適用勞動基準法之規定，例如：加班費、資遣費及職業災害補償等項目，明文規定由地方議會編列經費支應。\n五、地方議會得併隨全國軍公教人員待遇調整比例，調整相關補助費總額，以保障公費助理勞動權益。"},{"bill":"202110009590000","text":"直轄市議會議員每人聘用公費助理至少六人，縣（市）議會議員每人聘用公費助理至少四人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣二十萬元。其中聘用部分時間工作公費助理之費用數額，不得超過補助費用總額四分之一。\n第二項公費助理補助費總額，議會應比照軍公教人員待遇調整比例調整之。\n公費助理適用勞動基準法之規定，其勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","note":"一、修正第一項、第二項；增訂第三項。\n二、因時代進步，議員服務型態及其助理之工作內容日趨多元，為使議員用人更具彈性，並兼顧基本人力需求，爰修正第一項，取消現行聘用公費助理人數之規定，明定直轄市議會議員每人得聘用公費助理至少四人；縣（市）議員每人得聘用公費助理至少二人，以符議員問政之需。\n三、第二項增定議員聘用部分工時公費助理之費用數額，不得超過補助費用總額四分之一；另為利吸收人才，刪除第二項公費助理每人每月支領金額之上限。\n四、為保障公費助理權益參考立法院助理待遇，應比照軍公教人員待遇調整比例調整之。\n五、第二項後段移至第四項，明定公費助理適用勞動基準法及酌給春節慰勞金，並明確規範相關保險與退休金由議會編列預算支應，以保障其勞工權益。"},{"bill":"202110013160000","text":"直轄市議會議員每人聘用公費助理至少六人，縣（市）議會議員每人聘用公費助理至少四人，公費助理均與議員同進退。\n前項公費助理薪資費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣二十萬元；其中聘用部分時間工作公費助理之費用數額，不得超過補助費用總額二分之一。\n公費助理適用勞動基準法之規定，其勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，均由議會編列經費支應之；加班費、資遣費及職業災害補償之補助費用總額，直轄市議會議員每人每月不得超過新臺幣六萬元，縣（市）議會議員每人每月不得超過新臺幣四萬元，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項薪資費用總額及前項加班費、資遣費及職業災害補償之補助費用總額，直轄市、縣（市）議會得比照軍公教人員待遇調整比例調整之。","note":"一、刪除第一項聘用公費助理人數上限之限制，僅規定人數下限，以因應民意代表問政事務多元化趨勢，提供議員聘用助理之彈性。\n二、鑑於公費助理薪資費用總額自本條例制定迄今已逾二十年未調整，爰酌予調整。\n三、刪除原條文第二項前段但書，取消直轄市議員公費助理每人每月支領金額不得超過新臺幣八萬元之限制，並賦予議員得聘用部分時間工作之公費助理，增加用人彈性，以應實際問政需求。\n四、鑑於現行法並未將適公費助理用勞動基準法之規定，由議會編列經費支應之相關費用項目明列，雖於立法理由明示比照本院公費助理模式辦理，惟就各議會得編列支應之相關費用項目，中央主管機關採取限縮解釋，限制加班費、資遣費及職業災害補償等項目編列，與立法院實際運作情形未臻一致，衍生各議會預算編列與執行疑義，為落實現行法義，保障地方議會公費助理勞動權益及杜絕爭議，爰予明定項目，以資明確。\n五、為健全代議制度及保障公費助理勞動權益，相關補助費總額得併隨全國軍公教人員待遇調整比例調整之。"},{"bill":"202110012810000","text":"直轄市議會議員每人聘用公費助理至少四人；縣（市）議會議員每人聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元。但公費助理每人每月支領金額，最多不得超過新臺幣十萬元，縣（市）議會議員每人每月不得超過新臺幣十六萬元。公費助理適用勞動基準法之規定，其相關費用及加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n前項議員公費助理薪資補助費用總額及加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分，直轄市、縣（市）議會得比照軍公教人員待遇調整比例調整之。","note":"一、鑑於現今議員服務型態與助理工作內容更加多元，為使議員人力資源配置更加彈性並兼顧助理基本人數，爰修正第一項，取消議員聘用公費助理人數上限，並將直轄市議會議員每人聘用公費助理人數下限降為四人；縣（市）議會議員每人聘用公費助理人數下限維持二人。\n二、鑒於近年國際經濟環境變動劇烈致使通膨嚴重，且根據行政院主計總處統計資料顯示，2000年台灣基本薪資為每月新台幣15,840元，迄今2024年台灣基本薪資已大幅成長百分之七十三至每月新台幣27,470元。惟本條例自2000年1月26日實施二十四年以來未曾修訂調整地方民代公費助理補助金額，明顯不符公平原則。為利議員吸納人才以維護議員問政品質，爰修正本條例第二項，上調議員公費助理補助上限及公費助理每人每月支領金額上限規定。\n三、根據「內政部98年9月3日內授中民字第0980722124號函研商議員公費助理相關費用編列及聘用助理申請作業表件事宜會議紀錄」討論第二案：「研商議員助理之勞健保及勞工退休金提繳等費用之處理方式」，結論第二點：「原則由議員加保先行繳納費用後，檢據向議會申領，但各議會與議員溝通後，亦得視實際作業情形彈性處理。」雖結論表示議員得向議會申領公費助理之勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分經費，但為避免實務上仍無法落實造成公費助理權益受損，爰修正本條第二項明定由議會編列經費支應上述費用。\n四、因公費助理需彈性協助議員處理公務與參加活動，經常有加班情事，故應將助理加班費納入議會編列經費以保障公費助理權益。\n五、為保障公費助理勞動權益，並維護議員問政品質，酌新增第三項，規定薪資補助費用及依勞動基準法所規定之相關費用總額，得比照全國軍公教人員待遇調整比例調整。"},{"bill":"202110014200000","text":"直轄市議會議員每人聘用公費助理至少六人，縣（市）議會議員每人聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理薪資補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣十六萬元：其中聘用部分時間工作公費助理之費用數額，不得超過補助費用總額二分之一。\n公費助理適用勞動基準法之規定，其勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，均由議會編列經費支應之；加班費、資遣費及職業災害補償等補助費用總額，直轄市議會議員每人每月不得超過新臺幣六萬元，縣（市）議會議員每人每月不得超過新臺幣二萬元，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項薪資補助費用總額及前項加班費、資遣費及職業災害補償等補助費用總額，直轄市、縣（市）議會得比照軍公教人員待遇調整比例調整之。","note":"一、刪除第一項聘用公費助理人數上限之限制，僅規定人數下限，以因應民意代表問政事務多元化趨勢，提供議員聘用助理之彈性，議會議員公費助理任用資格選聘，應盡可能比照公務機關鼓勵晉用身心障礙人士。\n二、鑑於公費助理薪資補助費用總額自本條例制定迄今已逾二十四年未調整，爰酌予調整。\n三、刪除原條文第二項前段但書，取消直轄市議員、縣（市）議員公費助理每人每月支領金額不得超過新台幣八萬元之限制，並賦予議員得聘用部分時間工作之公費助理，因議員服務地方面向多元，又無法聘用部分工時助理，實務上不免有由一位助理掛名，再由兩個以上部分工時助理提供服務之情形，故增加用人彈性，方能因應實際問政及服務民眾之需求。\n四、鑑於現行法並未將適用勞動基準法之規定，由議會編列經費支應之相關費用項目明列，雖於立法理由明示比照立法院公費助理模式辦理，惟就各議會得編列支應之相關費用項目，中央主管機關採取限縮解釋，限制加班費、資遣費及職業災害補償等項目編列，與立法院實際運作情形未臻一致，衍生各議會預算編列與執行疑義，為落實現行法義，保障地方議會公費助理勞動權益及杜絕爭議，爰予明定項目及金額，以資明確，至事病假之保障，亦應同上法義。\n五、為健全代議制度及保障公費助理勞動權益，相關補助費總額得併隨全國軍公教人員待遇調整比例調整。"},{"bill":"202110014190000","text":"各直轄市議會、縣（市）議會得編列議員助理補助費，補助各議員聘用助理；助理補助費總額，直轄市議會議員每人每月不得超過新臺幣三十萬元，縣（市）議會議員每人每月不得超過新臺幣二十萬元。但全國公務人員各種加給年度通案調整時，應比照其通案調幅調整，調整後助理補助費總額及施行日期由內政部公告之。\n以前項助理補助費聘用之助理，直轄市議會議員每人應至少聘用六人，縣（市）議會議員每人應至少聘用四人，均與議員同進退。\n前項助理適用勞動基準法之規定，其相關費用，由議會編列經費支應之，助理加班費、不休假加班費、資遣費及職災補償費等費用，不得超過第一項規定總額百分之二十。助理並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n議會應就第一項助理補助費總額及前項助理適用勞動基準法相關費用之支出情形，建立內部控制制度。","note":"一、地方制度法第三十五條及第三十六條明定直轄市、縣（市）議會之職權，為補助議員得聘僱助理協助履行職權，爰明定各議會得編列議員助理補助費；又為彰顯本條相關費用屬「補助」性質，刪除本條有關「公費」之規定；另參考第七條第一項規定之體例，增列第一項前段規定，並將現行條文第二項有關直轄市議會議員、縣（市）議會議員助理補助費用總額上限之規定移列至第一項後段，並適度提高各地方議會議員助理補助費總額。另為使助理補助費總額應比照全國公務人員各種加給年度通案調幅調整，爰參酌法官法第七十一條第六項立法體例予以明定；又為明確調整後總額及施行日期俾憑議會遵循，爰參酌國民年金法第五十四條之一規定立法體例，增訂第一項但書，授權內政部於每次調整時公告之。\n二、為增加議員用人彈性，兼顧議員助理基本人數以維持問政品質，刪除現行條文第一項聘用助理人數上限規定，並將上開人數規定移列為第二項。另為利議員吸納人才，刪除現行條文第二項有關助理每人每月支領金額新臺幣八萬元之上限規定。\n三、現行條文有關議員助理適用勞動基準法及酌給春節慰勞金等規定移列為第三項。全民健康保險費、勞工保險費、勞工退休準備金有關雇主應負擔部分，自本條例九十八年五月二十七日公布施行後，已由議會編列預算支應。另參照立法院組織法第三十二條規定及其立法理由，增列助理加班費、不休假加班費、資遣費及職災補償費等費用之編列額度，惟支出金額倘超過該額度，不足部分仍應由議員自行支應。\n四、參照立法院運作模式，增訂議會應就助理補助費總額及助理適用勞動基準法相關費用之支出情形，建立內部控制制度，確認聘僱事實及撥款程序，以減少詐領情事。"},{"bill":"202110016690000","text":"直轄市議會議員每人得聘用公費助理六人至十人，縣（市）議會議員每人得聘用公費助理二人至六人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣二十四萬元。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元，縣（市）議會議員每人每月不得超過新臺幣八萬元。\n第一項公費助理得聘用部分工時人員，其人數、薪資不得超過公費助理總人數、補助費用之半數。\n公費助理適用勞動基準法之規定，其包含加班費、勞工保險費、全民健康保險費雇主負擔部分及勞工退休金雇主提撥等相關費用，由議會另編列經費支應之，不列入第二項補助費用之計算，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n前項加班費支給，直轄市議會議員每人每月不得超過新臺幣五萬元；縣（市）議會議員每人每月不得超過新臺幣二萬元。","note":"一、本法之公費助理聘用規範係於民國98年修訂，在近15年後使得民代缺乏聘用公費助理的彈性，也間接使地方民代問政品質下降。依據《立法院組織法》第三十二條規定，立法委員每人得聘請8至14位公費助理。為因應議會事務、落實民意、服務民眾，地方民意代表聘用助理之彈性應予以放寬，爰參照《立法院組織法》第三十二條規定修正第一項增加可聘用人數上限。\n二、本條例規定縣（市）議員之公費助理補助費用總額上限為8萬元，鑒於目前基本工資已達27,470元，縣（市）議員難以聘任2人以上之公費助理，第一項之公費助理聘用人數上限形同虛設。考量縣（市）議員之問政與服務型態，應允聘用部分工時人員，並為避免浮報薪資或濫用勞健保轉做酬庸，爰增訂第三項，允許聘用部分工時人員，限制部分工時人員聘用人數及薪資上限，直轄市議員部分比照適用。\n三、為確保地方議會公費助理得以合理領取加班費，修正第四項，明文規定加班費、勞健保雇主負擔及勞退雇主提撥部分由議會支應；並規定相關費用不列入公費助理補助費用，使補助費用專用於公費助理之薪資。\n四、現行立法院公費助理加班費每位委員辦公室上限為8.8萬元。為防止浮報公費助理加班費挪作他用，參考立法院目前公費助理加班費申請上限，並考量與地方議會公費助理人數差距，增訂第五項加班費上限。"},{"bill":"202110018620000","text":"直轄市議會議員每人聘用公費助理至少六人，縣（市）議會議員每人聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理薪資補助費用總額，依勞動基準法所規定之相關費用，均由直轄市及縣（市）議會編列預算支應之；其中聘用部分時間工作公費助理之費用數額，不得超過補助費用總額二分之一。\n公費助理適用勞動基準法之規定，其勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，均由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項薪資補助費用總額及前項加班費、資遣費及職業災害補償等補助費用總額，直轄市、縣（市）議會得比照軍公教人員待遇調整比例調整之。\n直轄市議會及縣（市）議會應每年編列預算補助公費助理實施健康檢查及文康活動費用；其對象、項目、方法、標準及其他應遵行之事項，由議會另定之，自中華民國○年○月○日施行。","note":"一、刪除第一項聘用公費助理人數上限之限制，僅規定人數下限，以因應民意代表問政事務多元化趨勢，提供議員聘用助理之彈性。\n二、鑑於公費助理薪資補助費用總額自本條例制定迄今已逾二十四年未調整，爰酌予調整，並比照立法院組織法第三十二條，公費助理相關法源依據。\n三、刪除原條文第二項前段但書，取消直轄市議員公費助理每人每月支領金額不得超過新臺幣八萬元之限制，並賦予議員得聘用部分時間工作之公費助理，增加用人彈性，以應實際問政需求。"},{"bill":"202110018540000","text":"直轄市議會議員每人得聘用公費助理至少六人，縣（市）議會議員每人得聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元。縣（市）議會議員每人每月不得超過新臺幣十六萬元；其中聘用部分時間工作公費助理之費用數額，不得超過助理費用總額二分之一。\n公費助理適用勞動基準法之規定，其由雇主負擔之勞工保險費、全民健康保險費、勞工職業災害保險費及勞工退休金，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項公費助理補助費用總額及前項費用，直轄市、縣（市）議會得比照軍公教人員待遇調幅及地方財政狀況調整之。","note":"一、刪除現行條文第一項聘用公費助理人數上限之限制，僅規定人數之下限，以符當前地方民意代表問政及服務型態多元化趨勢之實際需要。\n二、鑑於公費助理薪資補助費用總額自立法以來皆未調整，然同為民意代表之公費助理，近年立法院公費助理費用亦隨軍公教調薪幅度同時調整，爰酌予調整第二項直轄市及縣（市）議會議員公費助理補助費用之總額。\n三、除全部時間工作勞工公費助理外，為兼顧議員聘用部分時間工作公費助理需求及議會行政成本，於第二項賦予議員得聘用部分時間工作之公費助理，增加用人彈性，其費用數額，不得超過補助費用總額二分之一。\n四、鑑於現行法未將適用勞動基準法之規定，由議會編列經費支應之相關費用項目明列，爰將現行條文第二項後段移至第三項，並明定公費助理由雇主負擔之勞工保險費、全民健康保險費、勞工職業災害保險費及勞工退休金，由議會編列預算支應，使公費助理之勞動權益保障以臻完善。\n五、為保障公費助理勞動權益，又顧全各直轄市、縣（市）政府財政狀況，爰新增第四項明定公費助理補助費用及前項相關補助費用，得併隨全國軍公教人員待遇調幅比例及地方政府財政狀況調整之。"},{"bill":"202110021580000","text":"直轄市議會議員每人聘用公費助理至少四人；縣（市）議會議員每人聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣二十四萬元，縣（市）議會議員每人每月不得超過新臺幣十二萬元；其中聘用部分時間工作公費助理之費用數額，不得超過補助費用數額三分之一。\n直轄市議會議員及縣（市）議會議員應按月將公費助理補助費用之領用助理姓名及分別支領之數額報議會備查。\n公費助理適用勞動基準法之規定，其加班費、勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","note":"一、修正第一項，取消聘用公費助理人數上限規定，並將直轄市議會議員每人聘用公費助理人數下限降低為四人；縣（市）議會議員下限為二人，增加議員用人彈性以符合實際需求。\n二、修正第二項，縣（市）議會議員公費助理費用每人每月增加至新臺幣十二萬元，以促進問政品質；另增列開放議員聘用部分時間工作公費助理，費用數額不得超過補助費用總額三分之一之規定；又為有利於議員吸收人才，刪除第二項有關公費助理每人每月支領金額上限規定。\n三、增列第三項，為防止公費助理補助費用遭不當挪用，明訂直轄市議會議員及縣（市）議會議員應按月將公費助理補助費用之支用助理姓名與分別支領之金額報議會備查。\n四、原第二項後段之規定移至第四項，並增訂公費助理依勞動基準法衍生之相關費用，係包含加班費、勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，應由議會編列經費支應，以資明確。"},{"bill":"202110021560000","text":"直轄市議會、縣（市）議會得編列議員助理補助費，補助各議員聘用助理；助理補助費總額，直轄市議會議員每人每月不得超過新臺幣三十萬元，縣（市）議會議員每人每月不得超過新臺幣十二萬元。但全國公務人員各種加給年度通案調整時，應比照其通案調幅調整，調整後助理補助費總額及施行日期由內政部公告之。\n以前項助理補助費補助聘用之助理，直轄市議會議員每人應至少聘用四人，縣（市）議會議員每人應至少聘用二人，均與議員同進退。\n前項助理適用勞動基準法之規定，其勞工保險費、全民健康保險費、勞工退休準備金、加班費、不休假加班費、資遣費及職災補償費等關於法定應由雇主負擔費用，由議會於不超過第一項規定總額百分之二十內編列預算支應之，並得以所領補助費之額度比照軍公教人員年終工作獎金酌給春節慰勞金。\n議會應就各議員關於第一項及第二項助理補助費總額與分配情形、助理聘用關係及第三項所列各項費用之支應情形，建立內部控制制度。","note":"一、《地方民意代表費用支給及村里長事務補助費補助條例》自89年立法以來，聘用助理補助費用總額從未調整，於此規定實難吸引專業人才投身政治，助理聘用人數限制亦無法滿足民意代表服務民眾之需求，實有調整必要。\n二、現行縣（市）議會議員助理補助費用八萬元，卻須支應最多四人之薪資，每人只可領得二萬元，不但低於現行基本工資門檻，也與直轄市議會議員補助金額相差甚遠；基於培育人才及發展需求，不應以縣市層級補助有過大差距，爰修正本條第二項規定，參酌自立法以來二十四年間，基本工資已調漲七次，共調漲百分之七十三、軍公教調整六次，調整幅度超過百分之十八，爰將直轄市議會議員每人每月提高為新台幣三十萬元、縣（市）議會議員公費助理補助費提高為每人每月十二萬元。\n三、另為使助理補助費總額應比照全國公務人員各種加給年度通案調幅調整，爰參酌法官法第七十一條第六項立法體例予以明定；又為明確調整後總額及施行日期俾憑議會遵循，爰參酌國民年金法第五十四條之一規定立法體例，增訂第一項但書，授權內政部於每次調整時公告之。\n四、考量議員與助理係民事僱傭關係，議會並非雇主，爰議會編列預算補助相關費用仍宜有界限。又為使現行條文有關助理適用勞動基準法規定之相關費用更加明確，爰將現行條文移列至第三項，並擴大範圍包括助理之勞工保險費、全民健康保險費、勞工退休準備金、加班費、不休假加班費、資遣費及職災補償費等關於法定應由雇主負擔費用，得由議會於第一項助理費總額之百分之二十額度內編列預算補助支應，倘議員支出金額超過補助額度，不足部分仍應由議員自行負擔。至春節慰勞金部分，則以現行規定及依各議會發放春節慰勞金實務，明確化酌給助理春節慰勞金之計算方式。\n五、參照立法院運作模式，增訂議會應就各議員關於第一項及第二項助理補助費總額與分配情形、助理聘用關係及第三項所列各項費用之支應情形，建立內部控制制度。具體應包括由議會代為直接撥付助理補助費予助理、每月製作印領清冊載明助理費總額分配情形、助理加班時數及領取金額，並經議員及助理簽章，以確認助理聘僱、加班事實及撥款程序，俾從制度面減少詐領機會。"},{"bill":"202110021890000","text":"直轄市議會議員每人得聘用公費助理至少四人，縣（市）議會議員每人得聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十二萬元，縣（市）議會議員每人每月不得超過新臺幣十六萬元；其中聘用部分時間工作公費助理之費用總額，不得超過補助費用總額之二分之一。\n公費助理適用勞動基準法之規定，其加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分等相關費用，由議會編列經費支應之；加班費、資遣費及職業災害補償等補助費用總額，直轄市議會議員每人每月不得超過新臺幣六萬元，縣（市）議會議員每人每月不得超過新臺幣二萬元，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n前二項公費助理補助費用總額、加班費、資遣費及職業災害補償等補助費用總額，直轄市、縣（市）議會應比照軍行政院對公教員工待遇調整比例調整之。","note":"一、肇因時代進步，議員服務型態及其助理之工作內容日趨多元，為使議員用人更具彈性，並兼顧實際服務選民之人力需求，爰修正第一項，直轄市及縣市議會議員之聘用公費助理人數要求，僅明定直轄市議會議員每人得聘用公費助理至少四人；縣（市）議員每人得聘用公費助理至少二人，以利議員問政之人力需要。\n二、本法於民國八十九年公布施行，明訂補助直轄市、縣（市）議會議員聘用公費助理及其公費助理補助費用總額，迄今已逾24年，期間經濟成長、物價波動、基本工資及軍公教員工待遇多次提升與調整，惟公費助理聘用員額及助理補助費用總額卻仍未進行檢討討。如，過往縣（市）議員，若以每月基本工資之待遇遴聘公費助理，得於新台幣八萬元之額度聘用至多3名公費助理。但自113年1月1日起實施，每月基本工資調整為27,470元，導致許多縣（市）議員必須自行貼補所短絀之公費助理之費用，爰基於此，特修正直轄市、縣（市）議員其公費助理補助費用總額，分別調高至每人每月不得超過新臺幣三十二萬元與十六萬元。另，第二項增定議員聘用部分工時公費助理之費用數額，不得超過補助費用總額二分之一；另為利吸收人才，刪除第二項公費助理每人每月支領金額之上限。\n三、第二項後段，移列新增為第三項。明定公費助理適用勞動基準法及酌給春節慰勞金，並明確規範加班費、勞工保險費、全民健康保險費、勞工退休金之雇主提繳部分等相關費用應由議會編列預算支應。\n四、參考立法院組織法第三十二條規定，明定前二項公費助理補助費用總額、加班費、資遣費及職業災害補償等補助費用總額，直轄市、縣（市）議會應比照軍行政院對公教員工待遇調整比例調整之。"},{"bill":"202110022180000","text":"直轄市議會議員每人得聘用公費助理六人至八人，縣（市）議會議員每人得聘用公費助理一定人數，公費助理均與議員同進退。\n直轄市議會、縣（市）議會應每年編列每一議員一定數額之公費助理費及其辦公事務預算。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元，縣（市）議會議員每人每月不得超過新臺幣八萬元。公費助理適用勞動基準法之規定，其相關費用，其加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n前項公費助理費總額，議會得綜合考量社會薪資成長比例與軍公教員工待遇調幅及地方財政狀況調整。","note":"一、目前議員公費助理之加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費皆由議員自行支應，導致公費助理難以實質得到應有之勞動權益。雖現行條文明定「公費助理適用勞動基準法之規定，其相關費用，由議會編列經費支應」，但內政部則以行政函釋的方式，要求相關費用由議員自行負擔。爰此，實有必要修正本條第二項，明確將公費助理之加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，列入由議會編列經費支應之項目，以保障公費助理之勞動權益。\n二、新增第三項。我國基本工資已逐年調整，議員公費助理補助費用總額應綜合考量社會薪資成長比例及地方財政狀況調整酌增，為保持調薪之彈性，毋須規定總額上限，可授權主管機關參照各社會經濟與地方財政因素再行調整。"},{"bill":"202110027170000","text":"直轄市議會議員每人得聘用公費助理至少四人，縣（市）議會議員每人得聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月新臺幣不得超過三十萬元。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元，縣（市）議會議員每人每月不得超過新臺幣十二萬元。其中聘用部分工時公費助理之費用總額，不得超過補助費用之三分之一。\n公費助理適用勞動基準法之規定，其相關費用包含加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n補助費用總額，得由議會綜合考量消費者物價指數漲幅、軍公教員工待遇調幅及地方財政狀況調整。","note":"一、地方民意代表助理協助民意代表執行政策研究、地方法規修訂、民眾溝通等多項重要工作，唯有專業優質人才協助，民意代表方能確實監督市政並為民喉舌，足見完善民意代表助理工作之勞動與薪資條件，以達徵才留才作用之必要性。\n二、然而，本條例自制定迄今，就公費助理補助費用總額，已超過二十四年未調整，對應基本工資已由15,840元調升至27,470元，本條例所規範之支領金額上限顯有未符實際經濟情勢與勞動環境之情形，有修正之必要，爰上修第二項直轄市與縣（市）議會公費助理補助費用總額；且為符合實際人力需求與提高薪資條件，修正第一項之公費助理人數限制，並增加第二項後段之部分工時公費助理費用總額限制，以期鼓勵地方民意代表聘任全時、完整之人力，並同時兼顧用人彈性。\n三、次查，為符合勞動基準法之規定、保障民意代表助理基礎勞動條件，避免民意代表以自身財務為由影響助理權益，並考量助理難以避免加班之工作型態，爰將原條文第二項後段移至第三項，明定加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，由議會編列經費支應。\n四、另新增第四項，考量助理補助費用應符合當下實際經濟情勢與勞動環境，爰授權各地方議會綜合考量社會薪資成長比例及地方財政狀況調整酌增。"},{"bill":"202110027340000","text":"直轄市議會議員每人得聘用公費助理至少六人，縣（市）議會議員每人得聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元。但公費助理每人每月支領金額，最多不得超過新臺幣十萬元，縣（市）議會議員每人每月不得超過新臺幣十六萬元。公費助理適用勞動基準法之規定，其加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分及相關費用，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n前項直轄市、縣（市）議員公費助理補助費用總額及加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分等相關費用，得比照軍公教人員待遇調整之。","note":"一、為提供議員彈性分配人力空間，修正第一項有關直轄市議員及縣市議員聘用助理之人數限制。\n二、查現行議員公費助理費用總額已逾二十四年未調整，參考二十多年來消費者物價指數漲幅已逾23%，勞工及軍公教人員亦多次調漲薪資，議員公費助理補助費用實有調整之必要，爰修正第二項，將直轄市議員助理費用總額調整為三十六萬元，並規定勞動產生之相關費用應由議會編列經費支應。\n三、為保障公費助理勞動權益，增列第三項規定包含薪資補助費用及雇主應負擔之相關費用，得比照軍公教人員待遇隨之調整。"},{"bill":"202110027870000","text":"直轄市議會議員及縣（市）議會議員每人得聘用公費助理至少四人，公費助理均與議員同進退。\n前項公費助理補助費用總額，每人每月不得超過新臺幣二十四萬元；其中聘用部分時間工作公費助理之費用數額，不得超過補助費用總額二分之一。\n公費助理適用勞動基準法之規定，其相關費用，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","note":"一、隨社會資訊化，地方議會議員為民服務型態大幅改變，民眾對問政品質標準不斷提高，且2024年起基本工資將調整為2萬7,470元，惟依現行條例規定計算，縣（市）議員公費助理若聘至上限人數，平均將僅有2萬元，顯不符合最低基本工資要求。爰比照直轄市議員，調升縣（市）議員公費上限至24萬元。\n二、為使議員用人更符合實際需要及公費助理薪資達到最低基本工資，符合勞動法令規定，爰修正第一項，取消議員聘用公費助理人數上限，並調降直轄市議員公費助理人數下限。\n三、除全部時間工作勞工公費助理外，為兼顧議員聘用部分時間工作公費助理需求及議會行政成本，參照勞動部「僱用部分時間工作勞工應行注意事項」有關「部分時間工作勞工」之定義，於第二項增列有關議員聘用部分時間工作公費助理之費用數額，不得超過補助費用總額二分之一之規定；另為利議員吸收人才，刪除第二項有關公費助理每人每月支領金額之上限規定；並將適用勞動基準法及酌給春節慰勞金等規定移列為修正條文第三項，以資明確。"},{"bill":"202110029290000","text":"直轄市議會議員與縣（市）議會議員得聘用公費助理，公費助理均與議員同進退，聘用人數由議會定之。\n前項公費助理補助費用總額及依照勞動基準法相關費用，均由議會編列預算支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","note":"一、修正第一及第二項。\n二、全國各直轄市及縣（市）行政區域內，地理環境皆存在差異，且為求落實地方自治，議員助理聘用人數、薪資補助費用總額及依照勞動基準法相關費用總額，皆由議會定之。\n三、依照「勞動基準法」相關費用，包含加班費、勞工保險費、全民健康保險費、勞工退休金、健康檢查費……等"},{"bill":"202110030640000","text":"直轄市議會議員每人得聘用公費助理六人至八人，縣（市）議會議員每人得聘用公費助理二人至四人，公費助理均與議員同進退。\n直轄市議會、縣（市）議會應每年編列每一議員一定數額之公費助理費，直轄市議會議員每人每月不得超過新臺幣三十二萬元，縣（市）議員每人每月不得超過新臺幣十六萬元，並得於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，依該成長率調整之；但公費助理每人每月支領金額不得超過新臺幣八萬元。公費助理適用勞動基準法之規定，其加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","note":"一、修正第二項。\n二、「地方民意代表費用支給及村里長事務補助費補助條例」民國89年制定時，直轄市、縣（市）議員分別最多得遴聘助理六人與二人，其助理費用每人每月支給不得超過四萬元，於95年修法明訂助理補助總額上限，但於98年修訂直轄市、縣（市）議員分別最多得遴聘公費助理六人至八人與二人至四人，相關公費助理補助總額上限卻未隨之調整。\n三、爰此，修正第二項，直轄市議會、縣（市）議會應每年編列每一議員一定數額之公費助理費，直轄市議會議員每人每月不得超過三十二萬元，縣（市）議員每人每月不得超過十六萬元，且應考量國內物價及經濟成長等因素進行調整，議會得於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，依該成長率調整公費助理費上限；另，加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，亦由議會編列經費支應之。"},{"bill":"202110030470000","text":"直轄市議會議員每人得聘用公費助理至少四人，縣（市）議會議員每人得聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元。縣（市）議會議員每人每月不得超過新臺幣十六萬元。其中聘用部分時間工作公費助理之費用總額，不得超過補助費用之三分之一。\n公費助理適用勞動基準法之規定，其加班費、勞工保險費、全民健康保險費及勞工退休金之雇主負擔之相關費用，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項公費助理費總額，議會應考量社會薪資成長比例、消費者物價指數及軍公教員工待遇調幅一併調整之。其後每兩年調整一次，由議會參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率，或消費者物價指數累計成長率達百分之五即公告調整之，但成長率為零或負數時，不予調整。","note":"一、因應時代進步，議員服務型態及其助理之工作內容多元繁雜，為符合實際需要，且協助縣市議員提升問政品質及服務量能，爰修正本條第一項公費助理人數上限，適度放寬本法相關限制。\n二、第二項增訂議員聘用部分工時公費助理之費用數額，不得超過補助費用總額三分之一；另刪除第二項公費助理每人每月支領金額之上限。\n此外參照立法院組織法第三十二條修正，將編列公費助理費及其辦公事務預算，予以地方議會編列總額，保留因地制宜的權衡。\n三、第二項後段，移列新增為第三項。明定公費助理適用勞動基準法及酌給春節慰勞金，並明確規範加班費、勞工保險費、全民健康保險費、勞工退休金之雇主提繳部分等相關費用應由議會編列預算支應。\n四、新增本法第四項，本條公費助理費總額之調整，應審酌整體社會薪資成長比例、消費者物價指數及軍公教員工待遇調幅一併調整，並於後段新增每兩年一次調整數額之機制，加以明文規範。"},{"bill":"202110033290000","text":"直轄市議會議員每人得聘用公費助理六人至八人，縣（市）議會議員每人得聘用公費助理二人至四人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣二十四萬元。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元，縣（市）議會議員每人每月不得超過新臺幣十五萬元。公費助理適用勞動基準法之規定，其相關費用，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","note":"修正本條第二項。現行規定每一位縣（市）議員每月助理補助費用總額為新臺幣八萬元，惟公費助理之職責繁重程度不一，現行規定彈性不足，而不利於縣（市）議員之問政，對助理之勞動權益亦有不利，本次修正特予以提升為十五萬。"},{"bill":"202110031750000","text":"直轄市議會議員每人得聘用公費助理六人至八人，縣（市）議會議員每人得聘用公費助理二人至四人，公費助理均與議員同進退。\n直轄市議會、縣（市）議會應每年編列每一議員一定數額之公費助理費及其辦公事務預算。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元，縣（市）議會議員每人每月不得超過新臺幣八萬元。公費助理適用勞動基準法之規定，其相關費用，其加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n前項公費助理費總額，議會得綜合考量社會薪資成長比例與軍公教員工待遇調幅及地方財政狀況調整。","note":"一、目前議員公費助理之加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費皆由議員自行支應，導致公費助理難以實質得到應有之勞動權益。雖現行條文明定「公費助理適用勞動基準法之規定，其相關費用，由議會編列經費支應」，但內政部則以行政函釋的方式，要求相關費用由議員自行負擔。爰此，實有必要修正本條第二項，明確將公費助理之加班費、勞工保險費、全民健康保險費、勞工退休金之雇主負擔部分、勞工職業災害保險費，列入由議會編列經費支應之項目，以保障公費助理之勞動權益。\n二、新增第三項。我國基本工資已逐年調整，議員公費助理補助費用總額應綜合考量社會薪資成長比例及地方財政狀況調整酌增，為保持調薪之彈性，毋須規定總額上限，可授權主管機關參照各社會經濟與地方財政因素再行調整。"},{"bill":"202110032270000","text":"直轄市議會議員每人得聘用公費助理至少六人，縣（市）議會議員每人得聘用公費助理至少二人，公費助理均與議員同進退，並應優先進用身心障礙者及中高齡者。\n前項公費助理薪資補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，加班費、資遣費及職業災害補償等補助費用總額，每人每月不得超過新臺幣六萬元；縣（市）議會議員薪資補助費用總額每人每月不得超過新臺幣十六萬元，加班費、資遣費及職業災害補償等補助費用總額，每人每月不得超過新臺幣二萬元。\n聘用部分時間工作之公費助理，該費用數額不得超過薪資補助費用總額二分之一。\n公費助理適用勞動基準法之規定，其勞工保險費、全民健康保險費及雇主為勞工負擔提繳之退休金部分，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項薪資補助費用總額、加班費、資遣費及職業災害補償等補助費用總額，議會得考量基本薪資成長比例、軍公教人員待遇調整比例及地方財政狀況綜合考量後調整。","note":"一、為因應民意代表服務型態變化，以及問政之實際需求，配合助理工作態樣之多元化，不應限制聘用公費助理之人數上限，於相同補助費用總額內，給予民意代表更多用人之彈性，方符合實際運作之現況。另地方民意代表之公費助理，其資格之選聘，應盡可能聘僱需要特別促進就業照護的弱勢群體，爰參酌身心障礙者權益保障法、中高齡者及高齡者就業促進法及就業服務法之相關規定，應優先進用身心障礙者及中高齡人員。\n二、有鑑於本條自民國九十五年新增公費助理補助費用總額後，該總額迄今均未曾調整，期間軍公教待遇已歷經六次調整、勞工基本薪資亦調整達十七次，為因應物價上漲之變化，費用總額自應進行調整。\n三、有關於公費助理之加班費、資遣費及職業災補償等費用，應與薪資補助費用同等看待，由議會編列及支應。\n四、公費助理實質上為勞動基準法所規定之勞工，依照相關法令雇主本即應負擔勞工保險費、全民健康保險費及提繳勞工退休金之部分費用，此部分應屬雇主之責任，則亦應由議會編列經費支應。\n五、我國基本工資得每年進行審議後決定是否調整，為保障公費助理之勞動權益，相關補助費用總額自應賦予相應之調整機制，故授權由各地方議會綜合考量基本薪資成長比例、軍公教人員待遇調整幅度及各地方財政狀況調整酌增，有效保持調薪之彈性，方能符合實際薪資現況及公費助理之權益，以便維持地方民意代表良好之問政及服務品質。"},{"bill":"202110034170000","text":"直轄市議會議員每人聘用公費助理至少六人，縣（市）議會議員每人聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理薪資補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣二十萬元：其中聘用部分時間工作公費助理之費用數額，不得超過補助費用總額二分之一。\n公費助理適用勞動基準法之規定，其勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，由議會編列經費支應之；加班費、資遣費及職業災害補償等補助費用總額，直轄市議會議員每人每月不得超過新臺幣六萬元，縣（市）議會議員每人每月不得超過新臺幣二萬元，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項薪資補助費用總額及第三項加班費、資遣費及職業災害補償等補助費用總額，直轄市、縣（市）議會得比照軍公教人員待遇調整比例調整之。","note":"一、刪除第一項聘用公費助理人數上限之限制，僅規定人數下限，增加議員聘用助理之彈性。\n二、鑑於公費助理薪資補助費用總額自本條例制定迄今已逾二十四年未調整，爰酌予調整，並取消直轄市議員、縣（市）議員公費助理每人每月支領金額不得超過新臺幣八萬元之限制，並賦予議員得聘用部分時間工作之公費助理，因議員服務地方面向多元，又無法聘用部分工時助理，實務上不免有由一位助理掛名，再由兩名以上助理採部分工作時間提供服務之情形，故增加用人彈性，方能因應實際問政及服務民眾之需求。\n三、鑑於現行法並未將適用勞動基準法之規定，由議會編列經費支應之相關費用項目明列，雖於立法理由明示比照立法院公費助理模式辦理，惟就各議會得編列支應之相關費用項目，中央主管機關採取限縮解釋，限制加班費、資遣費及職業災害補償等項目編列，與立法院實際運作情形未臻一致，衍生各議會預算編列與執行疑義，為落實現行法義，保障地方議會公費助理勞動權益及杜絕爭議，爰予明定項目及金額，以玆明確，至事病假之保障，亦應同上法義。\n四、為健全代議制度及保障公費助理勞動權益，相關補助費總額得併隨全國軍公教人員待遇調整比例調整。"},{"bill":"202110034100000","text":"各直轄市議會、縣（市）議會得編列議員助理補助費，補助各議員聘用助理；助理補助費總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣二十六萬元。但全國公務人員各種加給年度通案調整時，應比照其通案調幅調整，調整後助理補助費總額及施行日期由內政部公告之。\n以前項助理補助費聘用之助理，直轄市議會議員每人得聘用六人至八人，縣（市）議會議員每人得聘用五人至七人，均與議員同進退。\n前項助理適用勞動基準法之規定，其相關費用，由議會編列經費支應之，助理加班費、不休假加班費、資遣費及職災補償費等費用，不得超過第一項規定總額百分之二十。助理並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n議會應就第一項助理補助費總額及前項助理適用勞動基準法相關費用之支出情形，建立內部控制制度。","note":"一、隨社會資訊化,地方議會議員為民服務型態大幅改變，民眾對問政品質標準不斷提高，且2024年起基木工資將調整為2萬7.470元，惟依現行條例規定計算,縣（市）議員公費助理若聘至上限人數，平均將僅有2萬元，顯不符合最低基本工資要求。爰比照直轄市議員，調升縣（市）議員公費上限至26萬元，另為使助理補助費總額應比照全國公務人員各種加給年度通案調幅調整，爰參酌法官法第七十一條第六項立法體例予以明定；又為明確調整後總額及施行日期俾憑議會遵循，爰參酌國民年金法第五十四條之一規定立法體例，增訂第一項但書，授權內政部於每次調整時公告之。\n二、為增加議員用人彈性，兼顧議員助理基本人數以維持問政品質，調整現行條文第一項聘用助理人數上限規定，並將上開人數規定移列為第二項。另為利議員吸納人才，刪除現行條文第二項有關助理每人每月支領金額之上限規定。除全部時間工作勞工公費助理外，為兼顧議員聘用部分時間工作公費助理需求及議會行政成本，參照勞動部「適用部分時間工作勞工應行注意事項」有關「部分時間工作勞工」之定義，於第二項增列有關議員時用部分時間工作公費助理之費用數額，不得超過補助費用總額二分之一之規定；另為利議員吸收人才，刪除第二項有關公費助理每人每月支領金額之上限規定：並將適用勞動基準法及酌給春節慰勞金等規定移列為修正條文第三項，以茲明確。\n三、現行條文有關議員助理適用勞動基準法及酌給春節慰勞金等規定移列為第三項。全民健康保險費、勞工保險費、勞工退休準備金有關雇主應負擔部分，自本條例九十八年五月二十七日公布施行後，已由議會編列預算支應。另參照立法院組織法第三十二條規定及其立法理由，增列助理加班費、不休假加班費、資遣費及職災補償費等費用之編列額度，惟支出金額倘超過該額度，不足部分仍應由議員自行支應。\n四、參照立法院運作模式，增訂議會應就助理補助費總額及助理適用勞動基準法相關費用之支出情形，建立內部控制制度，確認聘僱事實及撥款程序，以減少詐領情事。"},{"bill":"202110036390000","text":"直轄市議會議員每人聘用公費助理至少四人；縣（市）議會議員每人聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣十二萬元；其中聘用部分時間工作公費助理之費用數額，不得超過補助費用數額三分之一。\n直轄市議會議員及縣（市）議會議員應按月將公費助理補助費用之領用助理姓名及分別支領之數額報議會備查。\n公費助理適用勞動基準法之規定，其加班費、勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。","note":"一、修正第一項，取消聘用公費助理人數上限規定，並將直轄市議會議員每人聘用公費助理人數下限降低為四人；縣（市）議會議員下限為二人，增加議員用人彈性以符合實際需求。\n二、修正第二項，直轄市議會議員公費助理費用每人每月增加至新臺幣三十六萬元，縣（市）議會議員公費助理費用每人每月增加至新臺幣十二萬元，以促進問政品質；另增列開放議員聘用部分時間工作公費助理，費用數額不得超過補助費用總額三分之一之規定；又為有利於議員吸收人才，刪除第二項有關公費助理每人每月支領金額上限規定。\n三、增列第三項，為防止公費助理補助費用遭不當挪用，明訂直轄市議會議員及縣（市）議會議員應按月將公費助理補助費用之支用助理姓名與分別支領之金額報議會備查。\n四、原第二項後段之規定移至第四項，並增訂公費助理依勞動基準法衍生之相關費用，係包含加班費、勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，應由議會編列經費支應，以資明確。"},{"bill":"202110037470000","text":"直轄市議會議員每人得聘用公費助理至少六人，縣（市）議會議員每人得聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣十六萬元。但公費助理每人每月支領金額，最多不得超過新臺幣八萬元。\n公費助理適用勞動基準法之規定，其相關費用，由議會編列經費支應之，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n第二項公費助理補助費用總額及前項費用，直轄市、縣（市）議會得綜合考量軍公教人員待遇調幅及地方財政狀況調整之。","note":"一、因應個別議員其服務工作之多元需求，刪除現行條文第一項聘用公費助理人數上限之限制，以增加用人彈性。\n二、鑑於涉及公費助理勞動條件之補助費用總額已逾二十餘年未有調整，同時考量物價變動及縣市議員公費助理費用總額較直轄市議員相對偏低，爰酌予調整第二項直轄市及縣（市）議會議員公費助理補助費用之總額。\n三、原第二項後段規定改列第三項，依勞動基準法規定雇主負擔之勞工保險費、全民健康保險費、勞工職業災害保險費及勞工退休金等相關費用，由議會編列經費支應之。\n四、為保障公費助理勞動權益，並兼顧各直轄市與縣（市）政府財政狀況，新增第四項規定，明定第二項公費助理補助費用及第三項相關費用，得綜合考量軍公教人員待遇調幅及地方財政狀況進行調整。"},{"bill":"202110041270000","text":"直轄市議會議員每人得聘用公費助理至少六人，縣（市）議會議員每人得聘用公費助理至少二人，公費助理均與議員同進退。\n前項公費助理補助費用總額，直轄市議會議員每人每月不得超過新臺幣三十六萬元，縣（市）議會議員每人每月不得超過新臺幣十二萬元；其中聘用部分時間工作公費助理之費用數額，不得超過補助費用總額二分之一。公費助理適用勞動基準法之規定，其勞工保險費、全民健康保險費及勞工退休金之雇主負擔部分，均由議會編列經費支應之；加班費、資遣費及職業災害補償之補助費用總額，直轄市議會議員每人每月不得超過新臺幣六萬元，縣（市）議會議員每人每月不得超過新臺幣二萬元，並得比照軍公教人員年終工作獎金酌給春節慰勞金。\n前項薪資補助費用總額及加班費、資遣費及職業災害補償之補助費用總額，直轄市、縣（市）議會得比照軍公教人員待遇調整比例調整之。","note":"一、刪除第一項聘用公費助理人數上限之限制，僅規定人數下限，以因應民意代表問政事務多元化趨勢，提供議員聘用助理之彈性。\n二、刪除原條文第二項前段但書，取消直轄市議員公費助理每人每月支領金額不得超過新臺幣八萬元之限制，並賦予議員得聘用部分時間工作之公費助理，增加用人彈性，以應實際問政需求。\n三、鑑於現行法並未將適公費助理用勞動基準法之規定，由議會編列經費支應之相關費用項目明列，雖於立法理由明示比照本院公費助理模式辦理，惟就各議會得編列支應之相關費用項目，中央主管機關採取限縮解釋，限制加班費、資遣費及職業災害補償等項目編列，與立法院實際運作情形未臻一致，衍生各議會預算編列與執行疑義，為落實現行法義，保障地方議會公費助理勞動權益及杜絕爭議，爰予明定項目，以資明確。\n四、為健全代議制度及保障公費助理勞動權益，增列第三項，相關補助費總額得併隨全國軍公教人員待遇調整比例調整之。"}],"changed":true,"final":"直轄市議會、縣（市）議會得編列議員助理補助費，補助各議員聘用助理；助理補助費總額，直轄市議會議員每人每月不得超過新臺幣三十二萬元，縣（市）議會議員每人每月不得超過新臺幣十六萬元；並應於全國公務人員各種加給年度通案調整時，比照其通案調整幅度調整，調整後之助理補助費總額及實施日期由內政部公告之。\n以前項助理補助費補助聘用之助理，直轄市議會議員每人應至少聘用六人，縣（市）議會議員每人應至少聘用二人，均與議員同進退。議員得聘以日薪計之助理，其日薪累計之月總支出，不得超過前項助理補助費用總額四分之一。\n前項助理適用勞動基準法之規定，其勞工保險費、全民健康保險費、勞工退休準備金、加班費、不休假加班費、資遣費及職業災害補償等依法令應由雇主負擔費用部分，由議會於不超過第一項規定總額百分之二十內編列預算支應之，並得以所領補助費之額度比照軍公教人員年終工作獎金酌給春節慰勞金。\n議會應就各議員有關第一項、第二項助理補助費總額與分配情形、助理聘用關係及第三項所列各項費用之支應情形，建立內部控制制度。","finalWhy":"一、第二項有關議員助理補助費用總額規定部分移列第一項，修正如下：\n(一)地方制度法第三十五條及第三十六條業定明直轄市議會、縣（市）議會之職權，為補助議員聘僱專職助理協助履行議員職權，爰定明各議會得編列議員助理補助費，補助各議員聘用助理。又為彰顯相關費用屬「補助」性質，刪除「公費」二字並參考修正條文第七條第一項規定體例，增列前段規定。\n(二)考量民眾對於議員問政專業及服務之要求日益增加、地方政府及議會處理公共事務日益龐雜，議員助理所需專業及工作內容亦隨之增加，並考量本條例自八十九年公布施行迄今，基本工資自新臺幣一萬五千八百四十元至一百十三年已調升至新臺幣二萬七千四百七十元，且物價也有一定漲幅，故為利議員攬才，並適度縮小直轄市、縣（市）議會議員助理補助費總額之差距，在考量地方財政負擔下，爰將助理補助費總額每月上限，於直轄市議會部分調升至新臺幣三十二萬元、縣（市）議會部分調升至新臺幣十六萬元，並為利議員吸納人才，刪除但書規定助理每人每月支領金額新臺幣八萬元之上限規定。\n(三)另考量國內財經指標、民間企業平均薪資及政府財政狀況等因素，使助理補助費總額得比照全國公務人員各種加給年度通案調幅調整，並為明確調整後助理補助費總額及施行日期俾利議會遵循，爰參考法官法第七十一條第六項及國民年金法第五十四條之一規定之立法體例，增訂後段之通案調整機制並授權內政部於每次調整時公告調整後之助理補助費總額及實施日期。\n二、第一項修正移列為第二項。為增加議員用人彈性，兼顧議員助理基本人數以維持問政品質，刪除聘用助理人數上限規定及修正直轄市議會議員聘用助理人數下限為六人、縣（市）議會議員聘用助理人數下限為二人，且各議員應聘至本項規定之人數下限，始得全額支用前項之助理補助費總額，以符合第一項及本項之修正目的。另在確保整體議員問政品質前提下，為因應議員為民服務之實務需要，增訂議員得聘以日薪制之助理，其分配支領第一項助理補助費，以所有日薪制之助理日薪累計之月總支出，不得超過前項助理補助費用總額四分之一。\n三、考量議員與助理係民事僱傭關係，議會並非雇主，爰議會編列預算補助相關費用仍宜有界限。又為使第二項後段有關助理適用勞動基準法規定之相關費用更加明確，爰移列至第三項，並擴大範圍，包括助理之勞工保險費、全民健康保險費、勞工退休準備金、加班費、不休假加班費、資遣費及職業災害補償等依法令應由雇主負擔費用部分，由議會於第一項助理補助費總額百分之二十額度內編列預算補助支應之，倘議員支出金額超過補助額度，不足部分仍應由議員自行負擔。至春節慰勞金部分，則以現行規定及依各議會發放春節慰勞金實務，於第三項後段定明酌給助理春節慰勞金之計算方式，並應優先發給月薪制之助理；如有賸餘者，始由議員就賸餘部分分配予日薪制之助理，具體金額則依議員與日薪制之助理約定發給。\n四、參照立法院運作模式，增訂第四項，定明議會應就各議員有關第一項與第二項助理補助費總額及分配情形、助理聘用關係及第三項所列各項費用之支應情形，建立內部控制制度。具體應包括由議會代為直接撥付助理補助費予助理、每月製作印領清冊載明助理補助費總額、分配情形、助理加班時數及領取金額，並經議員及助理簽章，以確認助理聘僱、加班事實及撥款程序，俾從制度面減少詐領機會。","review":{"note":"修正通過","text":"直轄市議會、縣（市）議會得編列議員助理補助費，補助各議員聘用助理；助理補助費總額，直轄市議會議員每人每月不得超過新臺幣三十二萬元，縣（市）議會議員每人每月不得超過新臺幣十六萬元；並應於全國公務人員各種加給年度通案調整時，比照其通案調整幅度調整，調整後之助理補助費總額及實施日期由內政部公告之。\n以前項助理補助費補助聘用之助理，直轄市議會議員每人應至少聘用六人，縣（市）議會議員每人應至少聘用二人，均與議員同進退。議員得聘以日薪計之助理，其日薪累計之月總支出，不得超過前項助理補助費用總額四分之一。\n前項助理適用勞動基準法之規定，其勞工保險費、全民健康保險費、勞工退休準備金、加班費、不休假加班費、資遣費及職業災害補償等依法令應由雇主負擔費用部分，由議會於不超過第一項規定總額百分之二十內編列預算支應之，並得以所領補助費之額度比照軍公教人員年終工作獎金酌給春節慰勞金。\n議會應就各議員有關第一項、第二項助理補助費總額與分配情形、助理聘用關係及第三項所列各項費用之支應情形，建立內部控制制度。"}},{"no":"第七條","current":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所編列預算，支應其保險費，並得編列預算，支應其健康檢查費，其標準均比照地方民意代表。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。","versions":[{"bill":"202110009590000","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元。\n村（里）長因職務關係，得由鄉（鎮、市、區）公所編列預算，支應其健康檢查費、保險費、春節慰問金及為民服務費，其標準比照鄉（鎮、市）民代表會代表。\n中央主管機關應辦理村（里）長團體保險，且每一被保險人之保險金額為新臺幣一千二百萬元；其範圍、繳費方式、期程、給付基準、權利與義務、辦理方式及其他相關事項之辦法，由中央主管機關定之。","note":"一、修正第二項及第三項、刪除第四項。\n二、村（里）長辦理公務及協助推行政府政令，為體恤其辛勞，爰參照本條例第五條關於民意代表之相關規定修正第二項，增列春節慰問金及為民服務費之給付。\n三、為提供村（里）長執行公務時更高之保障，明定由中央主管機關辦理全國村（里）長團體保險，其保險金額為新臺幣一千二百萬元，俾利村（里）長因公致傷亡時，其本人或家屬仍可獲得相當之生活經濟保障。其相關辦法則授權由中央主管機關定之。"},{"bill":"202110020850000","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所分別編列下列之預算：\n一、保險費。\n二、健康檢查費。\n三、春節慰勞金。\n前項健康檢查費，其標準均比照地方民意代表；前項春節慰勞金，其標準均比照軍公教人員年終工作獎金酌給。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。\n第一項之村（里）長事務補助費額度，自中華民國一百十四年起，每四年調整一次，由中央主管機關參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率公告調整之，但成長率為零或負數時，不予調整。","note":"一、村（里）長因職務關係，勤於村（里）事務治理，因應時空環境之不同，民眾對於村（里）長的服務品質要求日遽提升，同時又須協助地方政府推動政策及宣傳，扮演政府與人民間重要聯絡窗口，故對於專職與專業性更加要求，導致村（里）長繁忙與辛勤情況不下於地方或中央民意代表。\n二、又近年通膨嚴重，政府難以解決。2023年物價水準（CPI）為2.49%，剔除物價因素後，實質可支配的金額更少。而目前村（里）長事務補助費，無法隨同物價指數調整，更讓服務基層的村（里）長更顯艱辛。\n三、據此，爰增訂第二項春節慰勞金費用，並參酌本法第六條第二項規範比照軍公教人員年終工作獎金酌給之。\n四、又因村（里）長事務補助費乃職務關係而產生的因公支出費用，惟近年通膨嚴重，其相關經費應隨消費者物價指數定期調整，俾能定期檢討標準，以符合實際，爰增訂第五項。"},{"bill":"202110021890000","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元。但原住民族地區之村（里）每月新臺幣五萬五千元。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所編列預算，支應其春節慰問金、出國考察費及保險費，並得編列預算，支應其健康檢查費，其標準均比照地方民意代表。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣一千萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣一千萬元以上傷害保險之保險費。","note":"一、有鑑於村里長工作繁瑣，時常協助政府政令宣導、推行各項政策，於疫情期間又站在第一線協助政府推動防疫工作，每個月雖有4萬5千元的村（里）長事務補助費，但皆是拿來補助弱勢、紅白帖、村（里）辦公室的支出等，而相關待遇卻已近21年未調整，對於村里長的辛勞，實有必要透過待遇的調整，齊一保障其權益。又考量行政院研議調整111年軍公教待遇，村里長待遇亦應同步納入調整。爰修正第一項，將村里長事務補助提高至新臺幣五萬元。而經行政院核定之「原住民地區」包括30個山地鄉及25個平地原住民鄉（鎮、市），共55個鄉（鎮、市），肇因其行政區幅員遼闊、受限其地勢及交通建設相較落後，以致鄰里服務較為艱辛，亦酌增其事務補助費。\n二、村（里）長辦理公務及協助推行政府政令，為體恤其辛勞，爰參照本條例第五條關於民意代表之相關規定，於本條文第三項修正增列春節慰問金及出國考察費。\n三、村（里）長長年服務鄉梓，遭遇意外事故之情事所在多有，爰應提高其保險保障金額至最高新臺幣壹千萬元，俾利村（里）長因公致傷亡時，其本人及家屬仍可獲得一定程度之理賠保障，以維繫其等往後之經濟需要。\n四、為健全全國村（里）長之權益並提升其服務量能，其事務補助費應隨同全國軍公教人員待遇調整比例調整之。"},{"bill":"202110027210000","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所得分別編列預算，支應其保險費、健康檢查費、春節慰問金及為民服務費，其標準均比照地方民意代表。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。","note":"一、傳統村（里）辦公處服務的被動需求已不符民眾及社會所需，村里雖是我國選區劃分的最小單位，但村里長的工作卻是非常瑣碎且複雜的，不僅要主動服務民眾、政令宣導之外，還需要整合社區資源，並積極爭取公部門補助，維護村里的生活環境品質，其辛勞程度不亞於中央或地方民意代表。\n二、近年來通膨問題居高不下，2023全年CPI平均上漲2.5%，創15年來的次高水準，因此目前村（里）長事務補助費，幾乎無法反應村（里）長現實生活所需，讓全年無休、服務基層的村（里）長更顯艱辛。\n三、據此，爰編列春節慰勞金及為民服務費，其標準均比照地方民意代表。"},{"bill":"202110029290000","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所編列預算，支應其保險費，並得編列預算，支應其健康檢查費、春節慰勞金及為民服務費。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。\n第二項村（里）長春節慰勞金，每人每年不得超過一點五個月事務補助費；為民服務費每人每月不得超過新臺幣三千元，原住民族地區之村（里）長每人每月不得超過新臺幣四千五百元。","note":"一、修正第二項、增列第五項。\n二、為健全村（里）長保障制度及服務資源，第二項增加村（里）長「春節慰問金」及「為民服務費」。"},{"bill":"202110033410000","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元、年終七萬五千元為春節慰勞金。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所編列預算，支應其保險費，並得編列預算，支應其健康檢查費其標準均比照地方民意代表。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。","note":"依本條例第五條規定，地方民意代表係有編列春節慰問金，然村（里）長辦理公務及協助政府推行政令，與民眾溝通，村（里）長工作性質與地方民意代表相同。惟為體恤其辛勞，爰參照本條例第五條關於民意代表之相關規定，增列春節慰勞金給付。"},{"bill":"202110034170000","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所分別編列下列預算：\n一、保險費。\n二、健康檢查費。\n三、春節慰勞金。\n前項健康檢查費，其標準應比照地方民意代表；前項春節慰勞金，其標準應比照軍公教人員年終工作獎金酌給。\n鄉（鎮、市、區）公所編列第二項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。\n第一項之村（里）長事務補助費額度，自中華民國一百十四年起，每四年調整一次，由中央主管機關參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率公告調整之，但成長率為零或負數時，不予調整。","note":"一、因時空環境改變與政策多元化，民眾對於村（里）長的服務品質要求日益提升外，又須肩負地方政府推動政策及宣傳，扮演政府與人民間重要聯絡窗口，讓村（里）長專職與專業性更高，再加上又是站在第一線處理民眾事務，也讓村（里）長服務事項情況不亞於地方或中央民意代表。\n二、加之近年通膨嚴重，2023年物價水準（CPI）更達2.49%，剔除物價因素後，民眾實質可支配的金額更少。而目前村（里）長事務補助費，無法隨同物價指數調整，更讓服務基層的村（里）長倍感艱辛。\n三、為強化村（里）長服務能量，爰增訂第二項春節慰勞金費用，並參酌本法第六條第二項規範比照軍公教人員年終工作獎金酌給之。\n四、又因村（里）長事務補助費乃職務關係而產生的因公支出費用，惟近年通膨嚴重，參酌《老年農民津貼暫行條例》第四條第一項規定，其相關經費應隨消費者物價指數定期調整，以符合實際，爰增訂第五項。"},{"bill":"202110038900000","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元、春節慰勞金新臺幣七萬五千元。\n前項事務補助費與春節慰勞金應每四年調整一次，由中央主管機關參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率公告調整之，但成長率為零或負數時，不予調整。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所編列預算，支應其保險費，並得編列預算，支應其健康檢查費，其標準均比照地方民意代表。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。","note":"一、現行直轄市、縣市首長、地方民意代表等均比照公務人員領有年終工作獎金或春節慰勞金。而村里長事務繁重，全年無休，目前依法無薪資，僅有事務補助費，且每逢民俗節日又需服務弱勢，卻無俗稱年終獎金之相關。為體恤村里長之付出，爰提案發給村里長春節慰勞金。\n二、村里長事務補助費自民國89年本條例立法以來，即維持4萬5,000元之數額，並維持22年未曾調整，直至111年5月方才透過修法調整。主要原因在於數額明確訂於法條中，更動數額僅能透過修法。然物價變動迅速，若每次調整數額均需透過修法，曠日廢時。爰參考老農津貼與公務員退休金調整數額之方法，明訂每4年調整一次，且調整時須參照消費者物價指數之變動調整之。"}],"changed":true,"final":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元，於原住民族地區之村（里）每月再增加百分之二十；並應於全國公務人員各種加給年度通案調整時，比照其通案調整幅度調整，調整後之事務補助費總額及實施日期由內政部公告之。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所編列預算，支應其保險費，並得編列預算，支應其健康檢查費，其標準均比照地方民意代表。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。\n村（里）長由鄉（鎮、市、區）公所參照軍公教人員年終工作獎金發給規定編列預算於春節期間另發給事務補助費，其金額以第一項事務補助費數額為基準計算之；該支出由內政部編列預算支應之。","finalWhy":"一、考量行政院依法核定屬原住民族地區之鄉（鎮、市）及直轄市山地原住民區共五十五個，多有幅員較大，並需更著重執行照顧與保障原住民族之法令及政策，且該村（里）長受限於地理環境因素，服務居民需要耗費更多包括交通在內之相關成本，爰修正第一項，於原住民族地區之鄉（鎮、市）及直轄市山地原住民區，其村（里）長事務補助費每月再增加百分之二十，即每月之事務補助費為新臺幣六萬元。另為建立通案性調整機制，並修正第一項後段增訂跟隨全國公務人員各種加給年度通案調整之機制。\n二、村（里）長依地方制度法第五十九條第一項及第六十一條第三項規定，係無給職，經選舉產生之第一線民選公職人員，不受公務員服務法（如經商兼業等）限制，亦非彈劾權及懲戒權之行使對象，係支領事務補助費，補助用於推動各項村（里）公務、服務居民所需費用，故無支領薪資、無支給退職金之規定。考量村（里）長辦理村（里）公務及服務民眾全年無休，中央各部會主管法規賦予村（里）長任務者，遍及社政、兵役、警政、營建、消防、衛生、環保、農漁業、選舉等領域，亦須負擔來自於各級地方政府賦予之工作，職務繁重，更於春節期間要配合各級政府強化執行春節期間各種政策措施，並加強服務居民、關懷弱勢，爰增訂第五項，在春節期間加發第一項之事務補助費，其計算基準係參照軍公教人員年終工作獎金之發給月數作為基準。另事務補助費依現行規定本屬村（里）公務之支出之補助，內政部已解釋村（里）長事務補助費應作為處理村里事務及推行政令之用，屬核實支用性質，非屬村（里）長個人所得，尚無須課徵所得稅。至如有村（里）長換屆、補選、停職、解職等情形，則由內政部參照民選地方公職人員支給規定處理。\n三、因鄉（鎮、市、區）公所對轄內村（里）長情形掌握甚詳，為利能於春節前及時發給村（里）長有關第五項之事務補助費，簡化作業程序，仍由鄉（鎮、市、區）公所編列預算先支應有關第五項之事務補助費，再由各直轄市、縣（市）政府彙整轄內各鄉（鎮、市、區）公所之支出後並製據向內政部申請全額補助。\n四、第二項至第四項未修正。","review":{"note":"修正通過","text":"村（里）長由鄉（鎮、市、區）公所編列村（里）長事務補助費，每村（里）每月新臺幣五萬元，於原住民族地區之村（里）每月再增加百分之二十；並應於全國公務人員各種加給年度通案調整時，比照其通案調整幅度調整，調整後之事務補助費總額及實施日期由內政部公告之。\n村（里）長因職務關係，應由鄉（鎮、市、區）公所編列預算，支應其保險費，並得編列預算，支應其健康檢查費，其標準均比照地方民意代表。\n鄉（鎮、市、區）公所編列前項保險費預算，應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費金額。\n村（里）長除有正當理由未能投保或未足額投保傷害保險外，於當年度檢據支領保險費時，其單據應包含投保保險金額新臺幣五百萬元以上傷害保險之保險費。\n村（里）長由鄉（鎮、市、區）公所參照軍公教人員年終工作獎金發給規定編列預算於春節期間另發給事務補助費，其金額以第一項事務補助費數額為基準計算之；該支出由內政部編列預算支應之。"}},{"no":"第七條之一","current":null,"versions":[{"bill":"202110014040000","text":"地方民意代表及村里長任職滿二十年且年滿六十五歲，退職應發給退職金，其認定標準、計算方式與申領辦法由中央主管機關訂定。","note":"一、本條新增。\n二、我國實施地方公職人員選舉多年，期間各縣市、鄉鎮均曾有不少資深民代，對在地事務熟稔，協助改善地方建設、表達民瘼有極大貢獻。尤其近年來對於民代強調建立資深制度，希望透過專業的累積，讓議事能更有效運作。\n三、又許多國家地方民代為專職，對於推動專業問政及提升議事品質是一大幫助。相對於我國地方民代不被視為專職，漠視許多資深民代付出多年時間與心血代表基層民意，無疑是對於推動專業問政方向是相違背的，也對專職資深地方民代並不公平。\n四、爰此，增訂第七條之一草案，地方民意代表及村里長任職滿二十年且年滿六十五歲，退職應發給退職金，其認定標準、計算方式與申領辦法，則授權由中央主管機關訂定，以保障資深民代權益。"},{"bill":"202110018380000","text":"村里長任職滿二十年且年滿六十五歲，退職應發給退職金，其認定標準、計算方式與申領辦法由中央主管機關訂定。","note":"一、本條新增。\n二、村（里）長是最基層民選公職人員，對在地事務熟稔，協助改善地方、表達民瘼有極大貢獻。然而現行制度對待村（里）長，既不視為公務員，也並非民意代表，卻要處理各項大小事務，負擔沉重，純屬志業付出。\n三、我國逐漸轉型為完善福利制度的先進國家，許多職業都有完善的法令制度保障其就業與退休生活，村（里）長卻成為疏漏的一塊。\n四、爰此，增訂第七條之一，村（里）長任職滿二十年且年滿65歲，退職應發給退職金，其認定標準、計算方式與申領辦法由中央主管機關訂定。是否有當，敬請公決。"}],"changed":true,"final":"村（里）長任職滿六屆且年滿六十五歲者，應給予慰勞金及表揚，其額度及支給辦法由內政部訂定之。","finalWhy":"一、本條新增。\n二、為表彰久任之村（里）長在第一線執行各種公務及為民服務之辛勞，爰增訂村（里）長任職滿六屆且年滿六十五歲者，應給予慰勞金及表揚，其額度及具體表揚方式，授權由內政部訂定辦法據以辦理。","review":{"note":"修正通過","text":"村（里）長任職滿六屆且年滿六十五歲者，應給予慰勞金及表揚，其額度及支給辦法由內政部訂定之。"}},{"no":"第八條","current":"地方民意代表費用之支給及村（里）長事務補助費之補助項目及標準，依本條例之規定；本條例未規定者，不得編列預算支付。","versions":[{"bill":"202110036180000","text":"地方民意代表費用之支給及村（里）長事務補助費之補助項目及標準，依本條例之規定；本條例未規定者，不得編列預算支付。\n除第一項之規定外，應編列預算補助因區域幅員遼闊、地理環境、交通狀況、氣候條件等因素而衍生之費用，其實施辦法、標準及其他應遵行之事項，由中央主管機關另定之。\n前項補助之額度，自中華民國一百十四年起，每二年調整一次，由中央主管機關參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率公告調整之，但成長率為零或負數時，不予調整。\n第二項之補助費用，其經費由中央主管機關年度編列預算補助地方政府支應之。","note":"鑑於民眾對於村（里）長的服務品質要求日遽提升，同時亦須協助地方政府推動政策及宣傳，扮演政府與人民間重要聯絡窗口，故對於專職與專業性更加要求，導致村（里）長繁忙與辛勤情況不下於地方或中央民意代表。又因近年物價通膨嚴重，目前村（里）長事務補助費似不敷使用，若無法隨同物價指數調整，將使服務基層的村（里）長更顯不一。再加上原鄉與偏鄉的村（里）長因地理環境因素，更顯艱辛，以花蓮縣秀林鄉為例，該鄉面積為1,642平方公里，將近彰化縣面積的1.5倍、雲林縣的1.2倍，光一個秀林鄉的面積，服務範圍就大於彰化縣或雲林縣。目前地方民意代表費用支給及村里長事務補助費補助條例未考量原鄉與偏鄉幅員遼闊的特殊性，僅以形式上規範事務補助費之補助項目及標準，反造成實質之不公平，恐間接影響國人的參政權益。為解決此一長期不公平之現象，就因選區幅員遼闊、地理環境、交通狀況、氣候條件等因素而衍生之等不便費用，應採類似地域加給的方式予以補助跟補貼，爰增訂第二項至第四項。"}],"changed":false,"final":"地方民意代表費用之支給及村（里）長事務補助費之補助項目及標準，依本條例之規定；本條例未規定者，不得編列預算支付。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第九條","current":"本條例規定之費用，應依地方制度法第七十條第二項、財政收支劃分法第三十七條第一項、第二項規定，由地方自治團體編列預算辦理之。","versions":[{"bill":"202110009590000","text":"本條例規定之費用，應依地方制度法第七十條第二項、財政收支劃分法第三十七條第一項、第二項規定，由地方自治團體編列預算辦理之；第七條第三項之經費，由中央主管機關按年度編列預算支應之。","note":"一、修正第一項後段。\n二、考量地方財政短絀，明定本法第七條第三項有關村（里）長團體保險之經費，應由中央主管機關編列預算支應。"},{"bill":"202110021890000","text":"本條例規定之費用，應依地方制度法第七十條第二項、財政收支劃分法第三十七條第一項、第二項規定，由地方自治團體編列預算辦理之。\n本條例第七條第二項春節慰問金及出國考察費之年度經費，由中央主管機關編列預算補助之。","note":"一、增訂第二項。\n二、考量地方政府財政短絀，明定本條例第二項春節慰問金及出國考察費之年度經費，由中央主管機關編列預算支應之。"}],"changed":false,"final":"本條例規定之費用，應依地方制度法第七十條第二項、財政收支劃分法第三十七條第一項、第二項規定，由地方自治團體編列預算辦理之。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第十條","current":"本條例除中華民國九十八年七月八日公布之第七條第一項及第三項自九十九年一月一日施行，一百零七年四月二十五日公布之第七條第三項至第五項自一百零七年十二月二十五日施行，一百十一年四月十五日修正之第七條自一百十一年十二月二十五日施行外，自公布日施行。","versions":[{"bill":"202110009590000","text":"本條例除中華民國九十八年七月八日公布之第七條第一項及第三項自九十九年一月一日施行，一百零七年四月二十五日公布之第七條第三項至第五項自一百零七年十二月二十五日施行，一百十一年四月十五日修正之第七條自一百十一年十二月二十五日施行外，自公布日施行。\n本條例第六條、第七條第三項及第四項之規定，自中華民國○年○月○日起施行。","note":"增訂第二項，明定修正條文施行日期為○年○月○日。"}],"changed":true,"final":"本條例除中華民國九十八年七月八日修正公布之第七條第一項及第三項，自九十九年一月一日施行；一百零七年四月二十五日修正公布之第七條第三項至第五項，自一百零七年十二月二十五日施行；一百十一年五月四日修正公布條文，自一百十一年十二月二十五日施行；一百十三年六月四日修正之條文，自一百十四年一月一日施行外，自公布日施行。","finalWhy":"考量本次修正之條文第三條、第五條附表、第六條、第七條及第七條之一規定，涉及地方政府編列年度預算，爰定明該等修正條文之施行日期，另依法制體例，酌作文字及標點符號修正。又修正條文第七條有關村（里）長於春節期間另發給事務補助費部分，係指一百十四年之春節即予發給，併予說明。","review":{"note":"照委員吳琪銘等所提修正動議通過","text":"本條例除中華民國九十八年七月八日修正公布之第七條第一項及第三項，自九十九年一月一日施行；一百零七年四月二十五日修正公布之第七條第三項至第五項，自一百零七年十二月二十五日施行；一百十一年五月四日修正公布條文，自一百十一年十二月二十五日施行；一百十三年○月○日修正之條文，自一百十四年一月一日施行外，自公布日施行。"}}],"stages":[{"date":"2024-03-01","stage":"一讀","code":"院會-11-1-3","bill":"202110006500000","gazref":"113卷005期5187號 6-6頁"},{"date":"2024-03-01","stage":"一讀","code":"院會-11-1-3","bill":"202110006900000","gazref":"113卷005期5187號 8-8頁"},{"date":"2024-03-01","stage":"一讀","code":"院會-11-1-3","bill":"202110007680000","gazref":"113卷005期5187號 9-9頁"},{"date":"2024-03-08","stage":"一讀","code":"院會-11-1-4","bill":"202110009590000","gazref":"113卷006期5188號 3-3頁"},{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110013160000","gazref":"113卷010期5192號 7-7頁"},{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110012810000","gazref":"113卷010期5192號 8-8頁"},{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110014200000","gazref":"113卷010期5192號 13-13頁"},{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110014190000","gazref":"113卷010期5192號 14-14頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110014040000","gazref":"113卷014期5196號 1-1頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110016690000","gazref":"113卷014期5196號 6-6頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110018380000","gazref":"113卷014期5196號 12-12頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110018620000","gazref":"113卷014期5196號 13-13頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110018540000","gazref":"113卷014期5196號 14-14頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110020850000","gazref":"113卷018期5200號 3-3頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110021580000","gazref":"113卷018期5200號 8-8頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110021560000","gazref":"113卷018期5200號 8-8頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110021890000","gazref":"113卷018期5200號 9-9頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110022180000","gazref":"113卷018期5200號 11-11頁"},{"da <script>
const D = JSON.parse(document.getElementById('data').textContent);

const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';
if (ENACT) {
  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],
 ['黨團協商', meetings.filter(s => s.stage === '黨團協商').length + ' 次'], [ENACT ? '條文' : '修正條文', passed.length + ' 條']]
  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;

function finder(turns) {   // 在這場逐字稿裡找字

  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */

  if (D.votes.length) {

      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;

        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
