<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藥事法 2026 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

共衛生安全。為使中央衛生主管機關得即時掌握必要藥品之製造、輸入及供應狀況，及早採取因應措施，並於藥品供應不足或緊急、重大影響公共衛生事件時，得專案核准藥品或替代藥品之製造或輸入，並採取必要之供應管理措施，以穩定國內藥品供應，爰擬具「藥事法部分條文修正草案」。是否有當？敬請公決。","arts":["第二十七條之二","第二十七條之三","第四十八條之二","第九十六條之一"]},{"id":"202110182540000","who":"委員王鴻薇等18人","date":"2026-01-02","name":"「藥事法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110182540000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/16/LCEWA01_110416_00130.pdf","proposers":["王鴻薇","林沛祥"],"ncosign":16,"people":[["王鴻薇","國民黨","提案"],["林沛祥","國民黨","提案"],["黃仁","國民黨","連署"],["萬美玲","國民黨","連署"],["翁曉玲","國民黨","連署"],["鄭正鈐","國民黨","連署"],["王育敏","國民黨","連署"],["廖先翔","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["盧縣一","國民黨","連署"],["謝龍介","國民黨","連署"],["羅明才","國民黨","連署"],["游顥","國民黨","連署"],["羅智強","國民黨","連署"],["陳超明","無黨籍","連署"],["魯明哲","國民黨","連署"],["邱鎮軍","國民黨","連署"],["林德福","國民黨","連署"]],"party":[["國民黨",17],["無黨籍",1]],"reason":"本院委員王鴻薇、林沛祥等18人，自新冠肺炎疫情爆發以來，全球發生原料藥供給不穩、需求提升，致國內外藥品時有緊張供應狀況，為即時掌握必要藥品之供應，以及早提出相關因應措施，穩定藥品之供應，要求必要藥品之許可證持有藥商應定期申報該類藥品之製造、輸入及供應情形；衛生福利部於知悉具有藥品許可證之藥品有供應不足之虞時，得專案核准該藥品或其替代藥品之製造或輸入。又為提高藥商於緊急或重大影響公共衛生事件時，申請專案製造或輸入藥品之意願，以確保藥品供應之穩定，使主管機關得採限制一定藥品供應之措施，爰擬具「藥事法部分條文修正草案」。是否有當？敬請公決。","arts":["第二十七條之二","第二十七條之三","第四十八條之二","第九十六條之一"]},{"id":"202110182870000","who":"委員邱鎮軍等20人","date":"2026-01-02","name":"「藥事法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110182870000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/16/LCEWA01_110416_00147.pdf","proposers":["邱鎮軍","羅廷瑋","羅智強"],"ncosign":17,"people":[["邱鎮軍","國民黨","提案"],["羅廷瑋","國民黨","提案"],["羅智強","國民黨","提案"],["盧縣一","國民黨","連署"],["王育敏","國民黨","連署"],["翁曉玲","國民黨","連署"],["呂玉玲","國民黨","連署"],["陳超明","無黨籍","連署"],["葛如鈞","國民黨","連署"],["魯明哲","國民黨","連署"],["鄭正鈐","國民黨","連署"],["葉元之","國民黨","連署"],["陳雪生","國民黨","連署"],["黃仁","國民黨","連署"],["洪孟楷","國民黨","連署"],["林思銘","國民黨","連署"],["謝龍介","國民黨","連署"],["邱若華","國民黨","連署"],["牛煦庭","國民黨","連署"],["林倩綺","國民黨","連署"]],"party":[["國民黨",19],["無黨籍",1]],"reason":"本院委員邱鎮軍等18人，有鑑於近年來國內外藥品供應時有短缺情形，為使中央主管機關能即時掌握、因應，要求藥商定期申報藥品之製造、輸入及供應情形，並即時因應取得替代藥品，以確保民眾用藥之可近性，另考量重大影響公共衛生事件對特定藥品之需求及參酌實務作業情形，爰擬具「藥事法部分條文修正草案」。是否有當？敬請公決。","arts":["第二十七條之二","第二十七條之三","第四十八條之二","第九十六條之一"]},{"id":"202110184250000","who":"委員林倩綺等18人","date":"2026-01-09","name":"「藥事法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110184250000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/17/LCEWA01_110417_00155.pdf","proposers":["林倩綺"],"ncosign":17,"people":[["林倩綺","國民黨","提案"],["陳玉珍","國民黨","連署"],["謝龍介","國民黨","連署"],["翁曉玲","國民黨","連署"],["馬文君","國民黨","連署"],["許宇甄","國民黨","連署"],["王育敏","國民黨","連署"],["黃建賓","國民黨","連署"],["陳超明","無黨籍","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["陳雪生","國民黨","連署"],["蘇清泉","國民黨","連署"],["廖先翔","國民黨","連署"],["顏寬恒","國民黨","連署"],["邱若華","國民黨","連署"],["盧縣一","國民黨","連署"],["葉元之","國民黨","連署"],["涂權吉","國民黨","連署"]],"party":[["國民黨",17],["無黨籍",1]],"reason":"本院委員林倩綺等18人，鑒於近年必要藥品供應中斷、短缺及國際供應鏈不穩等情形屢見不鮮，已對國內醫療體系與公共衛生安全構成實質風險。現行「藥事法」對必要藥品供應資訊之掌握、通報及因應機制，尚未形成完整且具前瞻性的監測與調控架構，致主管機關難以及時預警與介入。為確保必要藥品供應穩定、提升公共衛生韌性，並賦予中央衛生主管機關於供應異常或重大公共衛生情勢下之即時管理機制，爰擬具「藥事法部分條文修正草案」，健全申報、通報、登錄、專案核准及裁罰制度之法制基礎，以確保民眾用藥權益與醫療體系正常運作。是否有當？敬請公決。","arts":["第二十七條之二","第二十七條之三","第四十八條之二","第九十六條之一"]},{"id":"202110186710000","who":"委員陳菁徽等16人","date":"2026-01-16","name":"「藥事法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110186710000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/18/LCEWA01_110418_00232.pdf","proposers":["陳菁徽"],"ncosign":15,"people":[["陳菁徽","國民黨","提案"],["黃仁","國民黨","連署"],["牛煦庭","國民黨","連署"],["謝龍介","國民黨","連署"],["葛如鈞","國民黨","連署"],["陳玉珍","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["張智倫","國民黨","連署"],["盧縣一","國民黨","連署"],["林思銘","國民黨","連署"],["許宇甄","國民黨","連署"],["鄭正鈐","國民黨","連署"],["陳超明","無黨籍","連署"],["洪孟楷","國民黨","連署"],["黃建賓","國民黨","連署"],["羅明才","國民黨","連署"]],"party":[["國民黨",15],["無黨籍",1]],"reason":"本院委員陳菁徽等16人，鑑於近年來嚴重特殊傳染性肺炎（COVID-19）疫情、烏俄戰爭以及美國關稅政策等國際情勢變化，導致全球藥品供應鏈持續面臨高度不穩定風險；復以藥品供應鏈高度全球化，原料藥取得、製造生產、國際運輸及流通任一環節發生異常，即可能引發連鎖效應，影響藥品穩定供應，避免藥品短缺已成為各國共同關切之重要課題。自2020年起，因原料藥短缺、製造廠產能下降及國際物流受阻等因素，國內外藥品短缺案件持續增加，近期更發生生理食鹽水、胰臟相關用藥等臨床必要藥品嚴重短缺情形，對醫療體系運作及病人治療造成實質衝擊。為因應藥品供應風險、強化國內藥品短缺預警與應變處理機制，確保臨床醫療不中斷，並維護病人治療品質及用藥權益，實有檢討現行法制之必要，爰擬具「藥事法部分條文修正草案」，以完善藥品供應管理制度，提升我國藥品供應鏈之韌性與安全。是否有當？敬請公決。","arts":["第二十七條之二","第二十七條之三","第四十八條之二","第九十六條之一"]}],"arts":[{"no":"第二十七條之二","current":"藥商持有經中央衛生主管機關公告為必要藥品之許可證，如有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前向中央衛生主管機關通報；如因天災或其他不應歸責於藥商之事由，而未及於前述期間內通報者，應於事件發生後三十日內向中央衛生主管機關通報。\n中央衛生主管機關於接獲前項通報或得知必要藥品有不足供應之虞時，得登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條之限制。\n第一項通報與前項登錄之作業及專案核准之申請條件、審查程序、核准基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","versions":[{"bill":"202110102300000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應每月就該許可證藥品之製造、輸入、供應情形及現有庫存量，向中央衛生主管機關定期申報，如有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前向中央衛生主管機關通報；如因天災或其他不應歸責於藥商之事由，而未及於前述期間內通報者，應於事件發生後三十日內向中央衛生主管機關通報。\n中央衛生主管機關於接獲前項通報或得知必要藥品有不足供應之虞時，得登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條之限制。\n第一項申報之範圍與期間及通報之方式與內容，與前項登錄之作業及專案核准之申請條件、審查程序、核准基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，為加強監控必要藥品之供應情形，新增必要藥品之許可證持有藥商應定期申報該類藥品之製造、輸入及供應情形，包含現有庫存、過去每月出貨量及未來製造、輸入及供應之規劃。\n二、第三項增列有關第一項申報之範圍與期間及通報之方式與內容，授權由中央衛生主管機關公告之。"},{"bill":"202110175940000","text":"藥商持有經中央衛生主管機關公告為必要藥品許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報與前項通報之方式與內容，及第一項申報之範圍與期間及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，為加強監控必要藥品之供應情形，新增必要藥品之許可證持有藥商應定期申報該類藥品之製造、輸入及供應情形，包含現有庫存、過去每月出貨量及未來製造、輸入及供應之規劃。\n二、現行條文第一項後段移列至修正條文第二項，並酌修文字。\n三、現行條文第二項移列至第二十七條之三第一項。\n四、現行條文第三項有關登錄及專案核准之規定，移列至第二十七條之三第三項；另修正有關第一項申報與第二項通報之方式與內容，及第一項申報之範圍與期間，授權由中央衛生主管機關以辦法定之。"},{"bill":"202110178030000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，為加強監控必要藥品之供應情形，增訂持有必要藥品許可證之藥商應定期向中央衛生主管機關申報該類藥品之製造、輸入及供應情形，包含現有庫存、過去每月出貨量及未來製造、輸入及供應之規劃。\n二、第一項有關應事前及事後通報規定移列至第二項，並酌修文字。\n三、第二項移列至修正條文第二十七條之三第一項規範，爰予刪除。\n四、第三項有關藥品登錄及專案核准之相關事項授權規定，移列至修正條文第二十七條之三第三項規範；另增訂有關第一項申報之方式、內容、範圍、期間與第二項通報之方式及內容等相關事項，授權由中央衛生主管機關以辦法定之。"},{"bill":"201110177950000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，為加強監控必要藥品之供應情形，增訂持有必要藥品許可證之藥商應定期向中央衛生主管機關申報該類藥品之製造、輸入及供應情形，包含現有庫存、過去每月出貨量及未來製造、輸入及供應之規劃。\n二、第一項有關應事前及事後通報規定移列至第二項，並酌修文字。\n三、第二項移列至修正條文第二十七條之三第一項規範，爰予刪除。\n四、第三項有關藥品登錄及專案核准之相關事項授權規定，移列至修正條文第二十七條之三第三項規範；另增訂有關第一項申報之方式、內容、範圍、期間與第二項通報之方式及內容等相關事項，授權由中央衛生主管機關以辦法定之。"},{"bill":"202110179710000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，向中央衛生主管機關定期申報。\n前項藥商如有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前向中央衛生主管機關通報；如因天災或其他不應歸責於藥商之事由，而未及於前述期間內通報者，應於事件發生之次日起三十日內向中央衛生主管機關通報。\n第一項申報與第二項通報之方式與內容，及第一項申報之範圍與期間及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，為加強監控必要藥品之供應情形，新增必要藥品之許可證持有藥商應定期申報該類藥品之製造、輸入及供應情形，包含現有庫存、過去每月出貨量及未來製造、輸入及供應之規劃。\n二、現行條文第一項後段移列至修正條文第二項，並酌修文字。\n三、現行條文第二項移列至第二十七條之三第一項，爰予刪除。\n四、第三項有關登錄及專案核准之規定，移列至第二十七條之三第三項，爰予刪除；另修正有關第一項申報與第二項通報之方式與內容，及第一項申報之範圍與期間，授權由中央衛生主管機關公告之。"},{"bill":"202110180940000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，為強化必要藥品供應監控，增訂必要藥品許可證持有藥商應定期向中央衛生主管機關申報其製造、輸入及供應情形，包含庫存、近期出貨量及未來供應規劃。\n二、原第一項有關事前及事後通報規定，移列為第二項並酌修文字。\n三、原第二項配合移列至修正條文第二十七條之三第一項規範，爰予刪除。\n四、原第三項有關藥品登錄及專案核准之授權規定，移列至修正條文第二十七條之三第三項；並增訂第一項申報及第二項通報之方式、內容、範圍及期間，授權中央衛生主管機關以辦法定之。"},{"bill":"202110182540000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，為加強監控必要藥品之供應情形，增訂持有必要藥品許可證之藥商應定期向中央衛生主管機關申報該類藥品之製造、輸入及供應情形，包含現有庫存、過去每月出貨量及未來製造、輸入及供應之規劃。\n二、第一項有關應事前及事後通報規定移列至第二項，並酌修文字。\n三、第二項移列至修正條文第二十七條之三第一項規範，爰予刪除。\n四、第三項有關藥品登錄及專案核准之相關事項授權規定，移列至修正條文第二十七條之三第三項規範；另增訂有關第一項申報之方式、內容、範圍、期間與第二項通報之方式及內容等相關事項，授權由中央衛生主管機關以辦法定之。"},{"bill":"202110182870000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，增訂持有必要藥品許可證之藥商應定期向中央衛生主管機關申報該類藥品之製造、輸入及供應情形，包含現有庫存、過去每月出貨量及未來製造、輸入及供應之規劃。以加強監控必要藥品之供應情形。\n二、第一項後段有關藥商應事前及事後通報規定移列為第二項，並酌修文字。\n三、現行條文第二項移列至修正條文第二十七條之三第一項規範，爰予刪除。\n四、修正第三項，有關藥品登錄及專案核准之相關事項授權規定，移列至修正條文第二十七條之三第三項規範；另增訂有關第一項申報之方式、內容、範圍、期間與第二項通報之方式及內容等相關事項，授權由中央主管機關以子法定之。"},{"bill":"202110184250000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項、第三項，刪除第二項。\n二、為強化必要藥品之供應監測，修正第一項，明定持有必要藥品許可證之藥商，應定期向中央衛生主管機關申報藥品庫存、歷史出貨量及未來製造與輸入規劃等供應資訊，以利主管機關掌握供應趨勢並及早預警。\n三、現行條文關於應於事件發生前後進行通報之程序規定，改置於第二項，並配合制度調整進行文字修正，使規範內容更具一致性與可執行性。\n四、原第二項規定由增訂條文第二十七條之三第一項所涵蓋，爰予刪除。\n五、藥品登錄及專案核准相關事項之授權依據，已納入增訂條文第二十七條之三第三項，爰配合刪除舊條文授權文字。另就本次修正第一項之申報方式與第二項通報內容等程序細節，增訂授權規定，明定由中央衛生主管機關另以辦法定之。\n六、為確保申報與通報制度之彈性及因應未來實務需求，爰明定申報及通報之方式、內容、範圍與期間等執行事項，授權由中央衛生主管機關定之，以建立明確且具調整彈性的程序架構。"},{"bill":"202110186710000","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，為加強監控必要藥品之供應情形，增訂持有必要藥品許可證之藥商應定期向中央衛生主管機關申報該類藥品之製造、輸入及供應情形，包含現有庫存、過去每月出貨量及未來製造、輸入及供應之規劃。\n二、第一項有關應事前及事後通報規定移列至第二項，並酌修文字。\n三、第二項移列至修正條文第二十七條之三第一項規範，爰予刪除。\n四、第三項有關藥品登錄及專案核准之相關事項授權規定，移列至修正條文第二十七條之三第三項規範；另增訂有關第一項申報之方式、內容、範圍、期間與第二項通報之方式及內容等相關事項，授權由中央衛生主管機關以辦法定之。"}],"changed":true,"final":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。","finalWhy":"","review":{"note":"照行政院提案通過","text":"藥商持有經中央衛生主管機關公告為必要藥品之許可證者，應就該許可證藥品之製造、輸入及供應情形，定期向中央衛生主管機關申報。\n前項藥商有無法繼續製造、輸入或不足供應該藥品之虞時，應至少於六個月前，向中央衛生主管機關通報；因天災或其他不可歸責之事由，而未及通報者，應自事實發生之次日起三十日內，向中央衛生主管機關通報。\n第一項申報之方式、內容、範圍、期間與前項通報之方式、內容及其他相關事項之辦法，由中央衛生主管機關定之。"}},{"no":"第二十七條之三","current":"第二項　中央衛生主管機關於接獲前項通報或得知必要藥品有不足供應之虞時，得登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條之限制。\n第二十七條之二第三項　第一項通報與前項登錄之作業及專案核准之申請條件、審查程序、核准基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","versions":[{"bill":"202110175940000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項原具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象與方式，或為其他規制措施。\n第一項登錄作業、專案核准之申請條件、審查基準與程序及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、第一項由現行條文第二十七條之二第二項規定移列並酌修文字，以確保具有藥品許可證之藥品，有供應不足之虞時，中央衛生主管機關得專案核准該藥品或替代藥品之製造或輸入，不受第三十九條規定之限制。\n二、當藥品及其他具有許可證之替代藥品總供應量不足以供應當前或預期之需求量，屬第一項「供應不足」之情形。\n三、為預防、因應緊急或重大影響公共衛生事件，於藥品有供應不足之虞時，降低藥商之顧慮，鼓勵其基於公益挺身為專案製造或輸入，及主管機關為兼顧各地區民眾用藥之可近性，保障民眾健康權益，爰增訂第二項，定明中央衛生主管機關得就供應不足之藥品或專案核准之藥品，其供應之範圍、期間、數量、對象及方式，予以限制或為其他規制措施。\n四、現行條文第二十七條之二第三項有關登錄及專案核准辦法之授權規定，移列至本條第三項。"},{"bill":"202110178030000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象、方式或為其他限制措施。\n第一項登錄作業、專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、本條新增。\n二、第一項由現行第二十七條之二第二項規定移列並酌修文字，以確保具有藥品許可證之藥品有供應不足之虞時，中央衛生主管機關得予登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。當藥品及其他具有許可證之替代藥品總供應量不足以供應當前或預期之需求量，屬所定「供應不足」之情形，併予說明。\n三、為預防、因應緊急或重大影響公共衛生事件，降低藥商之顧慮，鼓勵其於藥品有供應不足之虞時基於公益挺身為藥品之專案製造或輸入，並為利主管機關兼顧各地區藥品供應之均衡，以確保民眾用藥之可近性，俾保障民眾健康權益，爰增訂第二項，定明中央衛生主管機關得就第一項具有許可證之藥品或專案核准製造或輸入之藥品，限制其供應之範圍、期間、數量、對象或方式等限制措施。\n四、現行第二十七條之二第三項有關訂定藥品登錄及專案核准相關事項辦法之授權規定，移列至第三項，並酌為文字修正。"},{"bill":"201110177950000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象、方式或為其他限制措施。\n第一項登錄作業、專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、第一項由現行第二十七條之二第二項規定移列並酌修文字，以確保具有藥品許可證之藥品有供應不足之虞時，中央衛生主管機關得予登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。當藥品及其他具有許可證之替代藥品總供應量不足以供應當前或預期之需求量，屬所定「供應不足」之情形，併予說明。\n二、為預防、因應緊急或重大影響公共衛生事件，降低藥商之顧慮，鼓勵其於藥品有供應不足之虞時基於公益挺身為藥品之專案製造或輸入，並為利主管機關兼顧各地區藥品供應之均衡，以確保民眾用藥之可近性，俾保障民眾健康權益，爰增訂第二項，定明中央衛生主管機關得就第一項具有許可證之藥品或專案核准製造或輸入之藥品，限制其供應之範圍、期間、數量、對象或方式等限制措施。\n三、現行第二十七條之二第三項有關訂定藥品登錄及專案核准相關事項辦法之授權規定，移列至第三項，並酌為文字修正。"},{"bill":"202110179710000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項原具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象與方式，或為其他規制措施。\n第一項登錄之作業及專案核准之申請條件、審查程序、核准基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、本條新增。\n二、第一項由現行條文第二十七條之二第二項規定移列並酌修文字，以確保具有藥品許可證之藥品，有不足供應之虞時，中央衛生主管機關得專案核准該藥品或替代藥品之製造或輸入，不受第三十九條之限制。\n三、當藥品及其他具有許可證之替代藥品總供應量不足以供應當前或預期之需求量，屬第一項「不足供應」之情形。\n四、為避免或因應緊急或重大公共衛生事件，中央衛生主管機關得就不足供應之藥品、或專案核准之藥品供應之範圍、期間、數量、對象及方式（如專案核准製造或輸入藥品供應之範圍、期間、數量、對象及方式，或已取得許可證藥品供應之範圍、期間、數量、對象及方式），予以限制或規範，以保障民眾之用藥權益，爰增訂第二項。\n五、現行條文第二十七條之二第三項有關登錄及專案核准辦法之授權規定，移列至本條第三項。"},{"bill":"202110180940000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象、方式或為其他限制措施。\n第一項登錄作業、專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、本條新增。\n二、第一項由現行第二十七條之二第二項移列並酌修文字，明定於具有藥品許可證之藥品有供應不足之虞時，中央衛生主管機關得登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條限制；並說明當藥品及其替代藥品之總供應量不足以因應實際或預期需求時，屬供應不足之情形。\n三、為因應緊急或重大影響公共衛生事件，降低藥商專案製造或輸入之顧慮，並兼顧各地藥品供應均衡與民眾用藥可近性，爰增訂第二項，明定中央衛生主管機關得就前項藥品，限制其供應之範圍、期間、數量、對象或方式等措施。\n四、現行第二十七條之二第三項有關藥品登錄及專案核准事項之授權規定，移列為第三項，並酌修文字。"},{"bill":"202110182540000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象、方式或為其他限制措施。\n第一項登錄作業、專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、本條新增。\n二、第一項由現行第二十七條之二第二項規定移列並酌修文字，以確保具有藥品許可證之藥品有供應不足之虞時，中央衛生主管機關得予登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。當藥品及其他具有許可證之替代藥品總供應量不足以供應當前或預期之需求量，屬所定「供應不足」之情形，併予說明。\n三、為預防、因應緊急或重大影響公共衛生事件，降低藥商之顧慮，鼓勵其於藥品有供應不足之虞時基於公益挺身為藥品之專案製造或輸入，並為利主管機關兼顧各地區藥品供應之均衡，以確保民眾用藥之可近性，俾保障民眾健康權益，爰增訂第二項，定明中央衛生主管機關得就第一項具有許可證之藥品或專案核准製造或輸入之藥品，限制其供應之範圍、期間、數量、對象或方式等限制措施。\n四、現行第二十七條之二第三項有關訂定藥品登錄及專案核准相關事項辦法之授權規定，移列至第三項，並酌為文字修正。"},{"bill":"202110182870000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象、方式或為其他限制措施。\n第一項登錄作業、專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、本條新增。\n二、修正第一項，由現行第二十七條之二第二項規定移列並酌修文字，以確保具有藥品許可證之藥品有供應不足之虞時，中央主管機關得予登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n三、增訂第二項，為預防、因應緊急或重大影響公共衛生事件，定明中央衛生主管機關得就第一項具有許可證之藥品或專案核准製造或輸入之藥品，限制其供應之範圍、期間、數量、對象或方式等限制措施。俾降低藥商之顧慮，鼓勵其於藥品有供應不足之虞時基於公益挺身為藥品之專案製造或輸入，並為利主管機關兼顧各地區藥品供應之均衡，確保民眾用藥之可近性，\n四、修正第三項，現行第二十七條之二第三項有關訂定藥品登錄及專案核准相關事項辦法之授權規定，移列至第三項，並酌為文字修正。"},{"bill":"202110184250000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象、方式或為其他限制措施。\n第一項登錄作業、專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、新增本條。\n二、現行第二十七條之二第二項內容改置於本條第一項，並進行文字調整，明定當具有藥品許可證之藥品及其替代藥品之供應有不足之虞時，中央衛生主管機關得將資訊公告於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條之限制，以確保供應管理之即時性與制度銜接之明確性。\n三、為因應緊急或重大公共衛生情勢，降低藥品供應端之制度疑慮，並兼顧各地區藥品供應之衡平與可近性，爰增訂第二項，明定中央衛生主管機關得針對前項具有許可證之藥品，或專案核准製造與輸入之藥品，視公共衛生需求採行供應範圍、期間、數量、對象及方式等管理措施，以建立具政策彈性與執行明確的供應限制框架。\n四、原第二十七條之二第三項所定之授權依據，已整合納入本條規範架構，爰配合調整條文位置並進行文字修正，使主管機關未來就藥品登錄與專案核准程序相關之辦法訂定權源更加明確且一致。"},{"bill":"202110186710000","text":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為預防、因應緊急或重大影響公共衛生事件，得就前項具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象、方式或為其他限制措施。\n第一項登錄作業、專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、本條新增。\n二、第一項由現行第二十七條之二第二項規定移列並酌修文字，以確保具有藥品許可證之藥品有供應不足之虞時，中央衛生主管機關得予登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。當藥品及其他具有許可證之替代藥品總供應量不足以供應當前或預期之需求量，屬所定「供應不足」之情形，併予說明。\n三、為預防、因應緊急或重大影響公共衛生事件，降低藥商之顧慮，鼓勵其於藥品有供應不足之虞時基於公益挺身為藥品之專案製造或輸入，並為利主管機關兼顧各地區藥品供應之均衡，以確保民眾用藥之可近性，俾保障民眾健康權益，爰增訂第二項，定明中央衛生主管機關得就第一項具有許可證之藥品或專案核准製造或輸入之藥品，限制其供應之範圍、期間、數量、對象或方式等限制措施。\n四、現行第二十七條之二第三項有關訂定藥品登錄及專案核准相關事項辦法之授權規定，移列至第三項，並酌為文字修正。"}],"changed":true,"final":"中央衛生主管機關於知悉具有藥品許可證之藥品有供應不足之虞時，得將該情形登錄於公開網站，並得專案核准該藥品或其替代藥品之製造或輸入，不受第三十九條規定之限制。\n中央衛生主管機關為因應緊急或重大影響公共衛生事件，得就前項具有藥品許可證之藥品或專案核准製造、輸入之藥品，限制其供應之範圍、期間、數量、對象、方式或為其他限制措施。\n第一項登錄作業、專案核准之申請條件、審查程序、審查基準、核准之廢止及其他應遵行事項之辦法，由中央衛生主管機關定之。","finalWhy":"","review":null},{"no":"第四十八條之二","current":"有下列情形之一者，中央衛生主管機關得專案核准特定藥物之製造或輸入，不受第三十九條及第四十條之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥物或合適替代療法。\n二、因應緊急公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准，並令申請者限期處理未使用之藥物，並得公告回收：\n一、已有完成查驗登記之藥物或合適替代療法可提供前項第一款情事之需要。\n二、緊急公共衛生情事已終結。\n三、藥物經中央衛生主管機關評估確有安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、核准基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","versions":[{"bill":"202110102300000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥物或合適替代療法。\n二、因應緊急或重大公共衛生情事之需要。\n三、國家遇有戰爭、天然災害或人民之生命、身體、健康遭遇緊急危難，有無法繼續製造、輸入或不足供應之情形。\n有下列情形之一者中央衛生主管機關得廢止前項核准，並令申請者限期處理未使用之藥品，並得公告回收：\n一、已有完成查驗登記之藥物或合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大公共衛生情事已終結。\n三、藥物經中央衛生主管機關評估確有安全或醫療效能疑慮。\n四、國內無法繼續製造、輸入或不足供應情事已終結。\n第一項登錄之作業及專案核准之申請條件、審查程序、核准基準及限制或規範其藥品之供應範圍、期間、數量、對象及方式等應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、配合醫療器材已另制定「醫療器材管理法」規範，刪除有關醫療器材之規定，並將「藥物」改為「藥品」。\n二、現行條文第一項第二款規定為因應緊急公共衛生情事之需要（例如嚴重特殊傳染性肺炎），中央衛生主管機關得專案核准特定藥品之製造或輸入，考量實務上應關注之公共衛生情事，不僅著重於事件之急迫性，然亦未排除事件本質屬重大者，更有於其實害結果發生前，防範未然之必要，爰參政府採購法第一百零五條，酌修第一項及第二項第二款文字。\n三、參考政府採購法第一百零五條，增列現行條文第一項第三款規定，國家遇有戰爭、天然災害或人民之生命、身體、健康遭遇緊急危難，有無法繼續製造、輸入或不足供應之情形，有別於一般情況，勢必因時效急迫，又須滿足短期立即可供應、施作之特性，如未能於短期間取得適量藥品，恐難止損或可能造成更大傷害，基此，授權中央衛生主管機關應衡酌個案特性及市場供需條件等，得專案核准特定藥品之製造或輸入，不受第三十九條之限制，以因應醫療藥品市場需求。\n四、配合第一項之修正，於原第三項新增第一項登錄之作業……限制或規範其藥品之供應範圍、期間、數量、對象及方式等。"},{"bill":"202110175940000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、配合醫療器材已另制定「醫療器材管理法」規範，刪除第一項序言所定「第四十條」有關醫療器材之規定，並將本條「藥物」均修正為「藥品」。\n二、現行條文第一項第二款規定為因應緊急公共衛生情事之需要（例如嚴重特殊傳染性肺炎），中央衛生主管機關得專案核准特定藥品之製造或輸入，考量實務上應關注之公共衛生情事，不僅著重於事件之急迫性，亦未排除事件本質屬重大者，更有於其實害結果發生前，防範未然之必要（例如阿米巴性痢疾或隱孢子蟲感染、國人赴黃熱病高風險地區之預防接種需要），爰酌修第一項第二款及第二項第二款之文字。\n三、參考「藥品查驗登記審查準則」之法規名稱，酌修第三項文字。"},{"bill":"202110178030000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、配合醫療器材已另制定醫療器材管理法規範，刪除第一項序文所定「第四十條」有關醫療器材之規定，並將本條「藥物」均修正為「藥品」。\n二、第一項第二款規定為因應緊急公共衛生情事之需要（例如嚴重特殊傳染性肺炎），中央衛生主管機關得專案核准特定藥品之製造或輸入，考量實務上應關注之公共衛生情事，不僅著重於事件之急迫性，就事件本質屬重大者，更有於其實害結果發生前，防範未然之必要（例如阿米巴性痢疾或隱孢子蟲感染、國人赴黃熱病高風險地區之預防接種需要等），爰修正第一項第二款規定，增訂因應重大影響公共衛生情事之需要，中央衛生主管機關亦得專案核准特定藥品之製造或輸入。\n三、第二項配合第一項第二款之修正，修正第二款規定，餘酌作文字修正。\n四、參考藥品查驗登記審查準則之法規名稱，酌修第三項文字。"},{"bill":"201110177950000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、配合醫療器材已另制定醫療器材管理法規範，刪除第一項序文所定「第四十條」有關醫療器材之規定，並將本條「藥物」均修正為「藥品」。\n二、第一項第二款規定為因應緊急公共衛生情事之需要（例如嚴重特殊傳染性肺炎），中央衛生主管機關得專案核准特定藥品之製造或輸入，考量實務上應關注之公共衛生情事，不僅著重於事件之急迫性，就事件本質屬重大者，更有於其實害結果發生前，防範未然之必要（例如阿米巴性痢疾或隱孢子蟲感染、國人赴黃熱病高風險地區之預防接種需要等），爰修正第一項第二款規定，增訂因應重大影響公共衛生情事之需要，中央衛生主管機關亦得專案核准特定藥品之製造或輸入。\n三、第二項配合第一項第二款之修正，修正第二款規定，餘酌作文字修正。\n四、參考藥品查驗登記審查準則之法規名稱，酌修第三項文字。"},{"bill":"202110179710000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條之規範：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准，得令申請者就未使用之藥品限期處理或回收：\n一、已有完成查驗登記之藥品或合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、配合醫療器材已另制定「醫療器材管理法」規範，刪除有關醫療器材之規定，並將「藥物」改為「藥品」。\n二、現行條文第一項第二款規定為因應緊急公共衛生情事之需要（例如嚴重特殊傳染性肺炎），中央衛生主管機關得專案核准特定藥品之製造或輸入，考量實務上應關注之公共衛生情事，不僅著重於事件之急迫性，然亦未排除事件本質屬重大者，更有於其實害結果發生前，防範未然之必要（例如阿米巴性痢疾或隱孢子蟲感染、國人赴黃熱病高風險地區等預防接種需要），爰酌修第一項及第二項第二款文字。"},{"bill":"202110180940000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、配合醫療器材已另以《醫療器材管理法》規範，刪除第一項序文所引「第四十條」中有關醫療器材之規定，並將本條所稱「藥物」一律修正為「藥品」。\n二、第一項第二款原規定係因應緊急公共衛生情事，中央衛生主管機關得專案核准特定藥品之製造或輸入；考量重大影響公共衛生情事亦有事前預防之必要，爰修正增訂該等情形，明定主管機關亦得專案核准特定藥品之製造或輸入。\n三、第二項配合第一項第二款修正，酌修第二款文字，其餘未修正。\n四、參酌「藥品查驗登記審查準則」之法規名稱，酌修第三項文字。"},{"bill":"202110182540000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、配合醫療器材已另制定醫療器材管理法規範，刪除第一項序文所定「第四十條」有關醫療器材之規定，並將本條「藥物」均修正為「藥品」。\n二、第一項第二款規定為因應緊急公共衛生情事之需要（例如嚴重特殊傳染性肺炎），中央衛生主管機關得專案核准特定藥品之製造或輸入，考量實務上應關注之公共衛生情事，不僅著重於事件之急迫性，就事件本質屬重大者，更有於其實害結果發生前，防範未然之必要（例如阿米巴性痢疾或隱孢子蟲感染、國人赴黃熱病高風險地區之預防接種需要等），爰修正第一項第二款規定，增訂因應重大影響公共衛生情事之需要，中央衛生主管機關亦得專案核准特定藥品之製造或輸入。\n三、第二項配合第一項第二款之修正，修正第二款規定，餘酌作文字修正。\n四、參考藥品查驗登記審查準則之法規名稱，酌修第三項文字。"},{"bill":"202110182870000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項，配合醫療器材已另制定醫療器材管理法規範，刪除第一項序文所定「第四十條」有關醫療器材之規定，並將本條「藥物」均修正為「藥品」。\n二、修正第一項第二款，考量實務上應關注之公共衛生情事，不僅著重於事件之急迫性，就事件本質屬重大者，更有於其實害結果發生前，防範未然之必要（例如阿米巴性痢疾或隱孢子蟲感染、國人赴黃熱病高風險地區之預防接種需要等），爰增訂因應重大影響公共衛生情事之需要，中央衛生主管機關亦得專案核准特定藥品之製造或輸入。\n三、修正第二項，配合第一項第二款之修正，修正第二款規定，餘酌作文字修正。\n四、修正第三項，參考藥品查驗登記審查準則之法規名稱，酌做文字修正。"},{"bill":"202110184250000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、修正第一項、第二項。\n二、醫療器材已由醫療器材管理法規範，第一項援引第四十條之醫療器材相關文字，已無保留必要，爰予刪除；並將本條所稱「藥物」統一修正為「藥品」，以符現行法制體系與規範對象之一致性。\n三、第一項第二款原係針對緊急公共衛生事件之專案藥品製造與輸入需求，惟實務上公共衛生管理不僅涉及事件急迫性，對於事件本質屬重大且具高度危害風險者，更有在實害發生前預作防護與制度介入之必要。基於前揭公共衛生事件之特性與預防治理需求，爰修正第一項第二款規範意旨，增訂中央衛生主管機關於重大公共衛生情勢下，亦得以專案方式核准特定藥品之製造或輸入，以強化事件前端之風險因應能力。\n四、參考藥品查驗登記審查準則之法規名稱與用語體系，修正第三項文字。"},{"bill":"202110186710000","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n三、國家遇有戰爭、天然災害或人民之生命、身體、健康遭遇緊急危難，有無法繼續製造、輸入或不足供應之情形。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n四、國內無法繼續製造、輸入或不足供應情勢已終結。\n第一項專案核准之申請條件、審查程序、審查基準或規範其藥品之供應範圍、期間、數量、對象、方式及其他應遵行事項之辦法，由中央衛生主管機關定之。","note":"一、配合醫療器材已另制定醫療器材管理法規範，刪除第一項序文所定「第四十條」有關醫療器材之規定，並將本條「藥物」均修正為「藥品」。\n二、第一項第二款規定為因應緊急公共衛生情事之需要（例如嚴重特殊傳染性肺炎），中央衛生主管機關得專案核准特定藥品之製造或輸入，考量實務上應關注之公共衛生情事，不僅著重於事件之急迫性，就事件本質屬重大者，更有於其實害結果發生前，防範未然之必要（例如阿米巴性痢疾或隱孢子蟲感染、國人赴黃熱病高風險地區之預防接種需要等），爰修正第一項第二款規定，增訂因應重大影響公共衛生情事之需要，中央衛生主管機關亦得專案核准特定藥品之製造或輸入。\n三、增訂第一項第三款，鑑於藥物韌性為我國防衛體系之重要一環，面對未來天災疫變以及可能發生之複合性災難，爰參酌政府採購法第一百零五條之規定，國家遇有戰爭、天然災害或人民之生命、身體、健康遭遇緊急危難，有無法繼續製造、輸入或供應不足之情形，授權中央衛生主管機關得專案核准特定藥品之製造或輸入。\n四、第二項配合第一項之修正，修正第二款及第四款規定，餘酌作文字修正。\n五、參考「藥品查驗登記審查準則」之法規名稱，酌修第三項文字，並授權中央主管機關針對專案核准後，藥品之供應範圍、期間、數量、對象及方式以辦法定之。"}],"changed":true,"final":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。","finalWhy":"","review":{"note":"照行政院提案通過","text":"有下列情形之一者，中央衛生主管機關得專案核准特定藥品之製造或輸入，不受第三十九條規定之限制：\n一、為預防、診治危及生命或嚴重失能之疾病，且國內尚無適當藥品或合適替代療法。\n二、因應緊急或重大影響公共衛生情事之需要。\n有下列情形之一者，中央衛生主管機關得廢止前項核准；必要時，得令申請者就未使用之藥品限期處理或回收：\n一、已有取得許可證之藥品或有合適替代療法可提供前項第一款情事之需要。\n二、緊急或重大影響公共衛生情事已終結。\n三、藥品經中央衛生主管機關評估確有影響用藥安全或醫療效能疑慮。\n第一項專案核准之申請條件、審查程序、審查基準及其他應遵行事項之辦法，由中央衛生主管機關定之。"}},{"no":"第五十五條","current":"經核准製造或輸入之藥物樣品或贈品，不得出售。\n前項樣品贈品管理辦法，由中央衛生主管機關定之。","versions":[{"bill":"202110077300000","text":"經核准製造或輸入之藥物樣品或贈品，其出售行為之費用，以不超出藥品相關製造及供應成本費用為原則。\n前項樣品贈品管理辦法，由中央衛生主管機關定之。","note":"一、依據衛生福利部113年9月11日衛授食字第1130023750號辦理。\n二、承上，函文內容所示：「藥物樣品贈品管理辦法第十七條核准專案製造或輸入之藥物樣品，不得出售。有關是否涉及出售行為，原則視其費用是否超出藥品相關製造及供應成本費用而定。」"}],"changed":false,"final":"經核准製造或輸入之藥物樣品或贈品，不得出售。\n前項樣品贈品管理辦法，由中央衛生主管機關定之。","finalWhy":null,"review":{"note":"維持現行條文","text":""}},{"no":"第八十條","current":"藥物有下列情形之一，其製造或輸入之業者，應即通知醫療機構、藥局及藥商，並依規定期限收回市售品，連同庫存品一併依本法有關規定處理：\n一、原領有許可證，經公告禁止製造或輸入。\n二、經依法認定為偽藥、劣藥或禁藥。\n三、經依法認定為不良醫療器材或未經核准而製造、輸入之醫療器材。\n四、藥物製造工廠，經檢查發現其藥物確有損害使用者生命、身體或健康之事實，或有損害之虞。\n五、製造、輸入藥物許可證未申請展延或不准展延。\n六、包裝、標籤、仿單經核准變更登記。\n七、其他經中央衛生主管機關公告應回收。\n製造、輸入業者回收前項各款藥物時，醫療機構、藥局及藥商應予配合。\n第一項應回收之藥物，其分級、處置方法、回收作業實施方式及其他應遵循事項之辦法，由中央衛生福利主管機關定之。","versions":[{"bill":"202110148480000","text":"藥物有下列情形之一，其製造或輸入之業者，應即通知醫療機構、藥局及藥商，並依規定期限收回市售品，連同庫存品一併依本法有關規定處理：\n一、原領有許可證，經公告禁止製造或輸入。\n二、經依法認定為偽藥、劣藥或禁藥。\n三、經依法認定為不良醫療器材或未經核准而製造、輸入之醫療器材。\n四、藥物製造工廠，經檢查發現其藥物確有損害使用者生命、身體或健康之事實，或有損害之虞。\n五、製造、輸入藥物許可證未申請展延或不准展延。\n六、其他經中央衛生主管機關公告應回收。\n製造、輸入業者回收前項各款藥物時，醫療機構、藥局及藥商應予配合。\n第一項應回收之藥物，其分級、處置方法、回收作業實施方式及其他應遵循事項之辦法，由中央衛生福利主管機關定之。","note":"一、刪除原第一項第六款。\n二、藥物包裝、標籤、仿單變更不涉及藥物品質問題，且變更前之產品業已經衛生主管機關核准，應不構成需要進行市售品回收必要性。\n三、一般藥商針對回收後之藥物因內部品質要求，皆須銷毀；對於有些供應不穩定之藥物反而增加藥物短缺之風險，有違政府之政策。\n四、國際間並無針對單純藥物包裝、標籤、仿單變更而要求進行回收或驗章的慣例。\n五、經與食藥署討論，倘藥品資訊有所異動，藥商會主動通知醫療院所及藥局，食藥署亦會於官網公告最新仿單與標示內容供民眾查詢，足以確保用藥安全，亦認同應檢討現行規定。"}],"changed":true,"final":"藥物有下列情形之一，其製造或輸入之業者，應即通知醫療機構、藥局及藥商，並依規定期限收回市售品，連同庫存品一併依本法有關規定處理：\n一、原領有許可證，經公告禁止製造或輸入。\n二、經依法認定為偽藥、劣藥或禁藥。\n三、經依法認定為不良醫療器材或未經核准而製造、輸入之醫療器材。\n四、藥物製造工廠，經檢查發現其藥物確有損害使用者生命、身體或健康之事實，或有損害之虞。\n五、製造、輸入藥物許可證未申請展延或不准展延。\n六、其他經中央衛生主管機關公告應回收。\n製造、輸入業者回收前項各款藥物時，醫療機構、藥局及藥商應予配合。\n第一項應回收之藥物，其分級、處置方法、回收作業實施方式及其他應遵循事項之辦法，由中央衛生福利主管機關定之。","finalWhy":"一、刪除原條文第一項第六款。\n二、藥物包裝、標籤、仿單變更不涉及藥物品質問題，且變更前之產品業已經衛生主管機關核准。\n三、倘藥品資訊有所異動，中央衛生主管機關會於官網公告最新包裝、標籤、仿單內容供民眾查詢，以確保用藥安全。","review":{"note":"照案通過","text":"藥物有下列情形之一，其製造或輸入之業者，應即通知醫療機構、藥局及藥商，並依規定期限收回市售品，連同庫存品一併依本法有關規定處理：\n一、原領有許可證，經公告禁止製造或輸入。\n二、經依法認定為偽藥、劣藥或禁藥。\n三、經依法認定為不良醫療器材或未經核准而製造、輸入之醫療器材。\n四、藥物製造工廠，經檢查發現其藥物確有損害使用者生命、身體或健康之事實，或有損害之虞。\n五、製造、輸入藥物許可證未申請展延或不准展延。\n六、其他經中央衛生主管機關公告應回收。\n製造、輸入業者回收前項各款藥物時，醫療機構、藥局及藥商應予配合。\n第一項應回收之藥物，其分級、處置方法、回收作業實施方式及其他應遵循事項之辦法，由中央衛生福利主管機關定之。"}},{"no":"第九十四條","current":"違反第三十四條第一項、第七十三條第二項、第八十條第一項第五款至第七款或第二項規定之一者，處新臺幣二萬元以上十萬元以下罰鍰。","versions":[{"bill":"202110148480000","text":"違反第三十四條第一項、第七十三條第二項、第八十條第一項第五款及第六款或第二項規定之一者，處新臺幣二萬元以上十萬元以下罰鍰。","note":"因應第八十條第一項第六款之移除，同步修正內文。"}],"changed":true,"final":"違反第三十四條第一項、第七十三條第二項、第八十條第一項第五款及第六款或第二項規定之一者，處新臺幣二萬元以上十萬元以下罰鍰。","finalWhy":"本條配合原條文第八十條第一項第六款之𨚿除，爰酌修款次。","review":{"note":"照案通過","text":"違反第三十四條第一項、第七十三條第二項、第八十條第一項第五款及第六款或第二項規定之一者，處新臺幣二萬元以上十萬元以下罰鍰。"}},{"no":"第九十六條之一","current":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關通知限期改善而仍未改善者，加倍處罰，並得按次連續處罰，至其改善為止。\n藥商違反第二十七條之二第一項通報規定者，中央衛生主管機關得公開該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。","versions":[{"bill":"202110102300000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關通知限期改善而仍未改善者，加倍處罰，並得按次連續處罰，至其改善為止。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依規定之期限通報者，中央衛生主管機關得公開該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。","note":"配合第二十七條之二第一項之修正，於第二項新增必要藥品之許可證持有藥商，未依第二十七條之二第一項之規定申報或申報之內容不實，或未依規定之期限通報者，予以處罰，以強化必要藥品供應之監控。"},{"bill":"202110175940000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關通知限期改善而仍未改善者，加倍處罰，並得按次連續處罰，至其改善為止。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依第二項規定之期限通報者，中央衛生主管機關得公開該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項所為之限制或規制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並通知其限期改善；屆期未改善者，得按次處罰至其改善為止。","note":"一、配合第二十七條之二第一項之修正，於第二項新增必要藥品之許可證持有藥商，未依第二十七條之二第一項之規定申報或申報之內容不實，或未依第二項規定之期限通報者，予以處罰，以強化必要藥品供應之監控。\n二、增訂第三項，定明藥商違反第二十七條之三第二項所為之限制或規制措施，予以處罰之規定。"},{"bill":"202110178030000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。","note":"一、配合修正條文第二十七條之二第一項規定，於第二項增訂必要藥品許可證之持有藥商，未依該條第一項之規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，予以處罰，以強化必要藥品供應情形之監控，並酌修文字。\n二、增訂第三項，定明藥商違反中央衛生主管機關依修正條文第二十七條之三第二項規定所為之限制措施之處罰規定。\n三、第一項依法制體例酌作文字修正。"},{"bill":"201110177950000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。","note":"一、配合修正條文第二十七條之二第一項規定，於第二項增訂必要藥品許可證之持有藥商，未依該條第一項之規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，予以處罰，以強化必要藥品供應情形之監控，並酌修文字。\n二、增訂第三項，定明藥商違反中央衛生主管機關依修正條文第二十七條之三第二項規定所為之限制措施之處罰規定。\n三、第一項依法制體例酌作文字修正。"},{"bill":"202110179710000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關通知限期改善而仍未改善者，加倍處罰，並得按次連續處罰，至其改善為止。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依第二項規定之期限通報者，中央衛生主管機關得公開該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商規避、妨礙或拒絕中央衛生主管機關依第二十七條之三第二項所為之限制或規範，處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。","note":"一、配合第二十七條之二第一項之修正，於第二項新增必要藥品之許可證持有藥商，未依第二十七條之二第一項之規定申報或申報之內容不實，或未依第二項規定之期限通報者，予以處罰，以強化必要藥品供應之監控。\n二、增訂第三項，定明藥商規避、妨礙或拒絕第二十七條之三第二項所為之限制或規範，予以處罰。"},{"bill":"202110180940000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。","note":"一、配合修正條文第二十七條之二第一項規定，於第二項增訂必要藥品許可證持有藥商，未依規定申報、申報不實，或未於期限內通報者之處罰規定，以強化必要藥品供應監控，並酌修文字。\n二、增訂第三項，明定藥商違反中央衛生主管機關依修正條文第二十七條之三第二項所為供應限制措施之處罰規定。\n三、第一項配合法制體例，酌作文字修正。"},{"bill":"202110182540000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。","note":"1、 配合修正條文第二十七條之二第一項規定，於第二項增訂必要藥品許可證之持有藥商，未依該條第一項之規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，予以處罰，以強化必要藥品供應情形之監控，並酌修文字。\n2、 增訂第三項，定明藥商違反中央衛生主管機關依修正條文第二十七條之三第二項規定所為之限制措施之處罰規定。\n3、 第一項依法制體例酌作文字修正。"},{"bill":"202110182870000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。","note":"一、修正第一項，依法制體例酌作文字修正。\n二、修正第二項，配合修正條文第二十七條之二第一項規定，增訂必要藥品許可證之持有藥商，未依該條第一項之規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，予以處罰，以強化必要藥品供應情形之監控，並酌修文字。\n三、增訂第三項，定明藥商違反中央衛生主管機關依修正條文第二十七條之三第二項規定所為之限制措施之處罰規定。"},{"bill":"202110184250000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。","note":"一、修正第一項、第二項，增訂第三項。\n二、第一項文字依法律條文結構體例及法制作業一致性需求調整。\n三、為強化必要藥品供應資訊之監測管理，第二十七條之二第一項建立申報義務，爰於本條第二項增訂裁罰機制，明定未依規定申報、申報內容失實，或未於第二十七條第二項所定期限完成通報者，應予處罰，以提升供應資訊管理之準確性與監控效度。\n四、為確保制度執行之一致性與管理措施之可執行性，爰增訂第三項，明定藥商如未遵行中央衛生主管機關依第二十七條之三第二項所採行之供應限制措施者，亦應適用相對應之裁罰規範，以建立更明確的處罰依據與制度銜接框架。"},{"bill":"202110186710000","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，得按次連續處罰至改善為止。","note":"一、配合修正條文第二十七條之二第一項規定，於第二項增訂必要藥品許可證之持有藥商，未依該條第一項之規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，予以處罰，以強化必要藥品供應情形之監控，並酌修文字。\n二、增訂第三項，定明藥商違反中央衛生主管機關依修正條文第二十七條之三第二項規定所為之限制措施，得按次處罰至改善為止之規定。"}],"changed":true,"final":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。","finalWhy":"","review":{"note":"照行政院提案通過","text":"藥商違反第四十八條之一規定者，處新臺幣十萬元以上二百萬元以下罰鍰；其經衛生主管機關令其限期改善，屆期未改善者，加倍處罰，並按次處罰。\n藥商未依第二十七條之二第一項規定申報或申報之內容不實，或未依同條第二項規定之期限通報者，中央衛生主管機關得公布該藥商名稱、地址、負責人姓名、藥品名稱及違反情節；情節重大或再次違反者，並得處新臺幣六萬元以上三十萬元以下罰鍰。\n藥商違反中央衛生主管機關依第二十七條之三第二項規定所為之限制措施者，由中央衛生主管機關處新臺幣六萬元以上三十萬元以下罰鍰，並令其限期改善；屆期未改善者，按次處罰。"}},{"no":"第一百零六條","current":"本法自公布日施行。\n本法中華民國八十六年五月七日修正公布之第五十三條施行日期，由行政院定之；九十五年五月五日修正之條文，自九十五年七月一日施行。\n本法中華民國一百零六年十二月二十九日修正之第四章之一、第九十二條之一、第一百條及第一百條之一，其施行日期由行政院定之。","versions":[],"changed":true,"final":"本法自公布日施行。\n本法中華民國九十五年五月三十日修正公布之條文，自九十五年七月一日施行。\n本法中華民國八十六年五月七日修正公布之第五十三條；一百零七年一月三十一日修正公布之第四章之一、第九十二條之一、第一百條及第一百條之一；一百十五年一月三十日修正之第二十七條之二、第二十七條之三及第九十六條之一，其施行日期由行政院定之。","finalWhy":"一、修正條文第二十七條之二、第二十七條之三及第九十六條之一所定強化藥品供應穩定相關事項，為利相關配套法規訂修及實務作業調整，爰於第三項定明本次修正之上開修正條文施行日期由行政院定之，以為緩衝。\n二、第一項未修正；第二項前段規定該次修正之第五十三條施行日期由行政院定之，爰移列於第三項一併規範。\n三、鑑於法律案之修正公布日期較利於一般民眾查閱，爰將原定三讀日期修正為總統公布日期。","review":{"note":"照行政院提案通過","text":"第一百零六條　本法自公布日施行。\n本法中華民國九十五年五月三十日修正公布之條文，自九十五年七月一日施行。\n本法中華民國八十六年五月七日修正公布之第五十三條；一百零七年一月三十一日修正公布之第四章之一、第九十二條之一、第一百條及第一百條之一；○年○月○日修正之第二十七條之二、第二十七條之三及第九十六條之一，其施行日期由行政院定之。"}}],"stages":[{"date":"2024-11-15","stage":"一讀","code":"院會-11-2-9","bill":"202110077300000","gazref":"113卷95期5277號 13-13頁"},{"date":"2025-04-25","stage":"一讀","code":"院會-11-3-9","bill":"202110102300000","gazref":"114卷039期5332號 4-4頁"},{"date":"2025-08-01","stage":"一讀","code":"院會-11-3-23","bill":"202110148480000","gazref":"114卷068期5361號一冊 69-69頁"},{"date":"2025-11-28","stage":"一讀","code":"院會-11-4-11","bill":"202110175940000","gazref":"114卷100期5393號一冊 8-8頁"},{"date":"2025-12-12","stage":"一讀","code":"院會-11-4-13","bill":"202110 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {

  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;
$('lede').textContent = D.lede;
const ENACT = D.action === '制定';   // 制定新法：沒有現行條文可比，各提案的條號編排也不同
const VERB = ENACT ? '訂定' : '修正';

  $('benchintro').textContent = '選一個條號，並排看各提案版本和三讀通過的條文。這是新制定的法，每個提案自己編條號，同一個條號在不同提案裡可能是不同的內容，要對照請看條文本身。';
  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],

  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);
  fillBench($('bench'), a);
}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}
function inlineBench(panel, no) {   // 在提案底下就地展開逐條對照
  const a = D.arts.find(x => x.no === no);
  if (!a) { panel.append(el('p', {class: 'ref', text: '逐條對照沒有收錄這一條'})); return; }
  const bench = el('div', {class: 'bench'});
  panel.append(el('div', {class: 'benchbar'}, el('span', {text: articleStatus(a)})), bench);
  fillBench(bench, a);
}
D.arts.forEach(a => {
  const btn = el('button', {type: 'button', 'data-no': a.no, class: 'chip' + (a.changed ? ' passed' : ''), text: a.no});
  btn.addEventListener('click', () => { current = a.no; showArticle(); });
  $('artnav').append(btn);

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });

    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
