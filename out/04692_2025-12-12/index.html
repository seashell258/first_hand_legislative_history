<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公立學校教職員退休資遣撫卹條例 2025 年修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"公立學校教職員退休資遣撫卹條例","version":"04692:2025-12-12-修正","date":"2025-12-12","action":"修正","title":"公立學校教職員退休資遣撫卹條例　2025 年 12 月修正","lede":"這次修正第三十七、三十八、六十七條。第三十七、三十八條各新增一項：不論在這次修正公布前或後退休，退休所得替代率上限一律以附表三所列 2023 年（民國 112 年）的上限認定，附表三自 2024 年 1 月 1 日起逐年下降的部分不適用。第六十七條改為消費者物價指數累計成長率達正 5% 時，月退休金、月撫卹金或遺屬年金依該成長率調整，成長率為零或負數時不調整；依原條文，成長率達正、負 5% 時應予調整，調整比率由行政院會同考試院定之，調整後超過原領金額 5% 或低於原領金額要經立法院同意，這一項這次刪除。2024 年 3 月起國民黨黨團和委員賴士葆等共提出 19 個草案，其中 12 案經司法及法制、教育及文化委員會聯席審查，各條都保留、交黨團協商，另外 7 案逕付二讀併案協商。協商超過一個月沒有共識，12 月 12 日院會記名表決，三條都照國民黨黨團再修正動議以 52 比 50 通過，全案表決 60 比 50 通過。","summary":"退休教職員的所得替代率上限一律以 2023 年的上限認定、不再逐年下降；月退休金在消費者物價指數累計上漲 5% 時依漲幅調整。","key":"04692_2025-12-12","props":[{"id":"202110010240000","who":"委員賴士葆等20人","date":"2024-03-15","name":"「公立學校教職員退休資遣撫卹條例第六十七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110010240000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/05/LCEWA01_110105_00015.pdf","proposers":["賴士葆","顏寬恒","王鴻薇"],"ncosign":17,"people":[["賴士葆","國民黨","提案"],["顏寬恒","國民黨","提案"],["王鴻薇","國民黨","提案"],["馬文君","國民黨","連署"],["李彥秀","國民黨","連署"],["蘇清泉","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["陳玉珍","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["陳永康","國民黨","連署"],["呂玉玲","國民黨","連署"],["邱鎮軍","國民黨","連署"],["廖偉翔","國民黨","連署"],["黃仁","國民黨","連署"],["徐巧芯","國民黨","連署"],["張嘉郡","國民黨","連署"],["王育敏","國民黨","連署"],["鄭正鈐","國民黨","連署"],["盧縣一","國民黨","連署"],["涂權吉","國民黨","連署"]],"party":[["國民黨",20]],"reason":"本院委員賴士葆、顏寬恒、王鴻薇等20人，鑒於民國113年行政院主計總處將公布今年1至12月之平均消費者物價指數年度年增率，倘與111年度累計計算達到百分之五時，銓敘部始啟動調整程序，然此等調整方式似未及使教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，反映物價變動，而不足達成照料退休教職員或遺族之目的。另由於近年物價指數上升速度較以往快速，每四年定期檢討似緩不濟急，而未能及時反映退休教職員退休金及遺族撫卹、遺屬年金之需求。有鑑於此，爰擬具「公立學校教職員退休資遣撫卹條例第六十七條條文修正草案」以調降門檻，修訂為於中央主計機關發布之消費者物價指數累計成長率達正百分之三，即應予以調整；另將原定四年之定期檢討之年限縮短為二年，以保障領受人權益。是否有當？敬請公決。","arts":["第六十七條"]},{"id":"202110018370000","who":"國民黨黨團","date":"2024-03-22","name":"「公立學校教職員退休資遣撫卹條例第三十七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110018370000/details","pdf":"https://ppg.ly.gov.tw/ppg/downloa 黨","連署"],["張智倫","國民黨","連署"],["陳超明","無黨籍","連署"],["牛煦庭","國民黨","連署"],["羅明才","國民黨","連署"],["顏寬恒","國民黨","連署"],["陳永康","國民黨","連署"],["許宇甄","國民黨","連署"],["廖先翔","國民黨","連署"],["盧縣一","國民黨","連署"],["魯明哲","國民黨","連署"],["游顥","國民黨","連署"]],"party":[["國民黨",17],["無黨籍",1]],"reason":"本院委員翁曉玲等18人，鑑於現行公立學校教職員退休資遣撫卹條例之規定，自107年7月1日施行，其中第三十七條規定已退休人員年金之所得替代率，最高77.5%、最低45%，且自109年1月1日起每年再減少1.5%，逐年連續減少十年，直到所得替代率變為最高62.5%、最低30%。惟近年來物價飛漲飆升，通膨問題嚴峻，根據行政院主計總處數據顯示物價成長對高齡者影響更為嚴重，本法規定逐年降低所得替代率，造成退休教職員不堪負荷，難以因應生活支出，國家也因此未善盡照顧晚年生活之義務，應均有待修法改善。因此為保障公立學校教職員生計，原逐年連續減少十年之規定，應於113年1月1日起停止，維持所得替代率最高70.0%、最低37.5%，爰擬具「公立學校教職員退休資遣撫卹條例第三十七條條文修正草案」。是否有當？敬請公決。","arts":["第三十七條"]},{"id":"202110132480000","who":"委員翁曉玲等16人","date":"2025-06-13","name":"「公立學校教職員退休資遣撫卹條例第六十七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110132480000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/16/LCEWA01_110316_00040.pdf","proposers":["翁曉玲","鄭天財Sra Kacaw"],"ncosign":14,"people":[["翁曉玲","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","提案"],["林倩綺","國民黨","連署"],["邱鎮軍","國民黨","連署"],["徐欣瑩","國民黨","連署"],["黃仁","國民黨","連署"],["陳玉珍","國民黨","連署"],["陳雪生","國民黨","連署"],["王育敏","國民黨","連署"],["羅明才","國民黨","連署"],["賴士葆","國民黨","連署"],["魯明哲","國民黨","連署"],["張智倫","國民黨","連署"],["陳永康","國民黨","連署"],["羅智強","國民黨","連署"],["羅廷瑋","國民黨","連署"]],"party":[["國民黨",16]],"reason":"本院委員翁曉玲、鄭天財Sra Kacaw等16人，為維護教師退休權益之保障，應避免因通貨膨脹而不及調整或下修其月退休金及月撫卹金與遺囑年金之給付金額，致教師退休給付實質減少而受損，故應於消費者物價指數達正百分之三時予以調整，且調整比率不得低於物價成長率之二分之一，又成長率為零或負數時，不予調整，爰擬具「公立學校教職員退休資遣撫卹條例第六十七條條文修正草案」。是否有當？敬請公決。","arts":["第六十七條"]},{"id":"202110167660000","who":"委員黃建賓等16人","date":"2025-10-28","name":"「公立學校教職員退休資遣撫卹條例第三十七條、第三十八條及第六十七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110167660000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/06/LCEWA01_110406_00092.pdf","proposers":["黃建賓","游顥"],"ncosign":14,"people":[["黃建賓","國民黨","提案"],["游顥","國民黨","提案"],["蘇清泉","國民黨","連署"],["吳宗憲","國民黨","連署"],["洪孟楷","國民黨","連署"],["盧縣一","國民黨","連署"],["邱鎮軍","國民黨","連署"],["陳永康","國民黨","連署"],["林沛祥","國民黨","連署"],["鄭天財Sra Kacaw" "],["羅廷瑋","國民黨","連署"],["廖偉翔","國民黨","連署"]],"party":[["國民黨",18]],"reason":"本院委員徐巧芯、林沛祥、游顥等18人，為維護退休教職員基本生活，減輕物價上漲衝擊，並落實釋字第783號「應適時調整退休給付以維持實質價值」之意旨，爰擬具「公立學校教職員退休資遣撫卹條例第三十七條、第三十八條及第六十七條條文修正草案」，透過停止逐年降低所得替代率，以確保退休人員生活安定。是否有當？敬請公決。","arts":["第三十七條","第三十八條","第六十七條"]},{"id":"202110173890000","who":"委員鄭天財Sra Kacaw等16人","date":"2025-11-21","name":"「公立學校教職員退休資遣撫卹條例第三十七條、第三十八條及第六十七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110173890000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/13/LCEWA01_110413_00175.pdf","proposers":["鄭天財Sra Kacaw"],"ncosign":15,"people":[["鄭天財Sra Kacaw","國民黨","提案"],["徐欣瑩","國民黨","連署"],["廖偉翔","國民黨","連署"],["邱鎮軍","國民黨","連署"],["王育敏","國民黨","連署"],["陳雪生","國民黨","連署"],["賴士葆","國民黨","連署"],["牛煦庭","國民黨","連署"],["黃建賓","國民黨","連署"],["李彥秀","國民黨","連署"],["馬文君","國民黨","連署"],["王鴻薇","國民黨","連署"],["謝龍介","國民黨","連署"],["林倩綺","國民黨","連署"],["葉元之","國民黨","連署"],["林沛祥","國民黨","連署"]],"party":[["國民黨",16]],"reason":"本院委員鄭天財Sra Kacaw等16人，有鑑於現行《公立學校教職員退休資遣撫卹條例》，並非以國家年金改革委員會召開20次會議之共識條文。且近年來物價飛漲飆升，通膨問題嚴峻，根據行政院主計總處數據顯示物價成長對高齡者影響更為嚴重，已退休之公立學校教職員同樣也受到極大的影響，為強化退休之公立學校教職員權益，爰擬具「公立學校教職員退休資遣撫卹條例第三十七條、第三十八條及第六十七條條文修正草案」，自中華民國一百十四年後，各年度所得替代率不再逐年降低。是否有當？敬請公決。","arts":["第三十七條","第三十八條","第六十七條"]}],"arts":[{"no":"第三條","current":"本條例所稱公立學校（以下簡稱學校），指由主管機關依法設立之各級學校。\n本條例所稱學校教職員，指下列人員（以下簡稱教職員）：\n一、學校依法定資格聘（派）任、遴用之校長、教師、研究人員、專業技術人員、專業及技術教師、稀少性科技人員、專任運動教練及中華民國八十六年三月二十一日以後進用之助教（以下簡稱新制助教）。\n二、教育人員任用條例施行前進用不需辦理公務人員或技術人員改任換敘，其職稱列入服務學校或其附屬機構之編制，經主管機關核准有案之職員。\n前項教職員退休、資遣或撫卹之辦理，除本條例另有規定外，以現職編制內合格有給專任者為限。","versions":[{"bill":"202110036220000","text":"本條例所稱公立學校（以下簡稱學校），指由主管機關依法設立之各級學校。\n本條例所稱學校教職員，指下列人員（以下簡稱教職員）：\n一、學校依法定資格聘（派）任、遴用之校長、教師、研究人員、專業技術人員、專業及技術教師、稀少性科技人員、專任運動教練及中華民國八十六年三月二十一日以後進用之助教（以下簡稱新制助教）。\n二、教育人員任用條例施行前進用不需辦理公務人員或技術人員改任換敘，其職稱列入服務學校或其附屬機構之編制，經主管機關核准有案之職員。\n前項教職員退休、資遣或撫卹之辦理，除本條例另有規定外，以現職編制內合格有給專任者為限。\n前項人員不包含八十四年前已退休人員，其退休、資遣或撫卹之辦理，從其原法令。","note":"一、增列第四項。\n二、84年前已退休人員之退休金屬於恩給制，其退休俸之給與，概與退撫基金無關，自始既未繳入，亦未從其中支出，退撫基金之不足，自不應苛扣其退休金補足。\n三、84年前已退休人員當前年齡已達八十以上，該項人員數量極少，且以國人平均壽命計算，苛扣其退休金對國家挹注不大，然對該項人員面臨龐大醫療費用有顯著影響，是故應排除適用本條例。"}],"changed":false,"final":"本條例所稱公立學校（以下簡稱學校），指由主管機關依法設立之各級學校。\n本條例所稱學校教職員，指下列人員（以下簡稱教職員）：\n一、學校依法定資格聘（派）任、遴用之校長、教師、研究人員、專業技術人員、專業及技術教師、稀少性科技人員、專任運動教練及中華民國八十六年三月二十一日以後進用之助教（以下簡稱新制助教）。\n二、教育人員任用條例施行前進用不需辦理公務人員或技術人員改任換敘，其職稱列入服務學校或其附屬機構之編制，經主管機關核准有案之職員。\n前項教職員退休、資遣或撫卹之辦理，除本條例另有規定外，以現職編制內合格有給專任者為限。","finalWhy":null,"review":null},{"no":"第九條","current":"前條第二項所定退撫基金費用之實際提撥費率，由行政院會同考試院，依據退撫基金定期財務精算結果，共同釐訂並公告之。\n前項財務精算結果之不攤提過去未提存負債最適提撥費率超過現行實際提撥費率達一點五倍以上時，行政院應於三個月內會同考試院提高提撥費率至少百分之一，但不得超過前條第二項所定之提撥費率上限。\n第一項所定退撫基金定期財務精算，由退撫基金管理機關就退撫基金之收支、管理與運用情形，每三年精算一次；每次至少精算五十年。","versions":[{"bill":"202110036220000","text":"前條第二項所定退撫基金費用之實際提撥費率，由行政院會同考試院，依據退撫基金定期財務精算結果，共同釐訂並公告之。\n前項財務精算結果之不攤提過去未提存負債最適提撥費率超過現行實際提撥費率達一點五倍以上時，行政院應於三個月內會同考試院提高提撥費率至少百分之一，但不得超過前條第二項所定之提撥費率上限。\n第一項所定退撫基金定期財務精算，由退撫基金管理機關就退撫基金之收支、管理與運用情形，每三年精算一次；每次至少精算五十年。其不足部分，除依本條例第四十條規定，各級政府每年所節省之退撫經費支出，應全數挹注退撫基金外，中央政府應逐年編列預算挹注，其預算金額不得低於各級政府每年所節省之退撫經費支出之二倍。","note":"退撫基金其來源有三：\n其一為軍公教自提35%；其二為政府負擔雇主責任65%；其三為投資績效所得。退撫新制立法時,明定政府可以調整提撥率，歷年因投資績效不彰,弊案重生，政府未能適時「調整提撥率」，是以退撫基金不足時，按照軍公教自提35%及政府負擔雇主責任65%比例，中央政府應以負擔超過受雇人員2倍以上的責任，將法定責任相對應經費編入法定預算。"}],"changed":false,"final":"前條第二項所定退撫基金費用之實際提撥費率，由行政院會同考試院，依據退撫基金定期財務精算結果，共同釐訂並公告之。\n前項財務精算結果之不攤提過去未提存負債最適提撥費率超過現行實際提撥費率達一點五倍以上時，行政院應於三個月內會同考試院提高提撥費率至少百分之一，但不得超過前條第二項所定之提撥費率上限。\n第一項所定退撫基金定期財務精算，由退撫基金管理機關就退撫基金之收支、管理與運用情形，每三年精算一次；每次至少精算五十年。","finalWhy":null,"review":null},{"no":"第二十八條","current":null,"versions":[],"changed":true,"final":"教職員於本條例施行前退休者，其退休金以最後在職經敘定之本（年功）薪額為計算基準，並依下列規定計算基數內涵：\n一、退撫新制實施前年資之給與：一次退休金以最後在職同薪級人員之本（年功）薪額加新臺幣九百三十元為基數內涵；月退休金以最後在職同薪級人員之本（年功）薪額為基數內涵，另十足發給新臺幣九百三十元。\n二、退撫新制實施後年資之給與：以最後在職同薪級人員之本（年功）薪額加一倍為基數內涵。\n教職員於本條例施行後退休者，其退撫新制實施前、後年資應給之退休金，依下列規定計算基數內涵：\n一、退撫新制實施前年資之給與：\n(一)一次退休金：依附表一所列退休年度適用之平均薪額，加新臺幣九百三十元為基數內涵。\n(二)月退休金：依附表一所列退休年度適用之平均薪額為基數內涵；另十足發給新臺幣九百三十元。\n二、退撫新制實施後年資之給與：依附表一所列各年度平均薪額加一倍為基數內涵。\n教職員於本條例施行前，已符合法定支領月退休金條件而於本條例施行後退休生效者，其退撫新制實施前、後年資應給之退休金，仍按第一項所定退休金計算基準與基數內涵計給之。\n[附表一：本條例施行後退休教職員退休金給與之計算基準彙整表]","finalWhy":"","review":null},{"no":"第三十二條","current":null,"versions":[],"changed":true,"final":"教職員任職滿十五年依第十八條第一項規定辦理退休者，符合下列月退休金起支年齡規定，得擇領全額月退休金：\n一、年滿五十八歲。但應隨平均餘命之延長與職場人口結構變化適時調整。\n二、前款請領年齡，除高級中等以下學校校長及教師外，其餘教職員自中華民國一百十五年一月一日起，每年提高一歲，以提高至六十五歲為限。\n教職員任職滿十五年，依第十八條第二項規定辦理退休者，年滿五十五歲，得擇領全額月退休金。\n教職員任職滿二十五年，依第十八條第四項規定辦理退休者，年滿六十歲，得擇領全額月退休金。\n前三項所定月退休金起支年齡前，得就下列方式，擇一請領退休金：\n一、支領一次退休金。\n二、至年滿月退休金起支年齡之日起，領取全額月退休金（以下簡稱展期月退休金）。\n三、提前於年滿月退休金起支年齡前，開始領取月退休金；每提前一年，減發百分之四（以下簡稱減額月退休金），最多得提前五年，減發百分之二十。\n四、支領二分之一之一次退休金，並至年滿月退休金起支年齡之日起領取二分之一之月退休金。\n五、支領二分之一之一次退休金，並提前於年滿月退休金起支年齡前開始領取二分之一之月退休金，每提前一年減發百分之四，最多得提前五年減發百分之二十。\n教職員依第十八條第一項及第四項規定辦理退休而有下列情事之一者，得擇領或兼領全額月退休金，不受第一項及第三項月退休金起支年齡之限制：\n一、曾依公教人員保險法規定領有失能給付，且於退休前五年內有申請延長病假致留支原薪、考績列丙等、無考績或成績考核留支原薪之事實。\n二、退休生效時符合下列年齡規定，且可採計退休年資與實際年齡合計數大於或等於附表二所定年度指標數：\n(一)中華民國一百十五年十二月三十一日以前退休者，應年滿五十歲。\n(二)中華民國一百十六年一月一日以後退休者，應年滿五十五歲。\n前項第二款所定退休年資與實際年齡合計數，應以整數年資及整數歲數合併計算之；未滿一年之畸零年資或歲數均不計。\n本條例施行前已符合法定支領月退休金條件之教職員，依第十八條規定辦理退休時，得就第二十七條第一項所定之退休金給與種類擇一支領，不受第一項月退休金起支年齡之限制。\n[附表二：自願退休人員年資與年齡合計法定指標數]","finalWhy":"","review":null},{"no":"第三十七條","current":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，不再隨在職同等級人員本（年功）薪之調整重新計算。","versions":[{"bill":"202110018370000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，隨在職同等級人員本（年功）俸之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，不適用之。","note":"一、修正第五項，增訂第六項。\n二、國家建立公立學校教職員退休撫卹制度，旨在維持退休公立學校教職員晚年基本生活，善盡國家照顧其老年生活之義務。然近年物價持續高漲，對退休高齡者影響甚鉅，為符公平，爰修正第五項，刪除原條文「不再」二字，將年金重新隨同在職薪俸調整。\n三、另綜合本條各項規定，使退休公立學校教職員年金逐年減少共十年，直到所得替代率變為最高62.5%、最低30%，為維繫退休公立學校教職員基本生活。爰增訂第六項，規定附表三有關於所得替代率之部分，一百十三年一月一日之後部分均不適用，停止所得替代率之逐年降低。"},{"bill":"202110020940000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，不適用之。","note":"一、修正本條第五項，增訂本條第六項。\n二、國家建立公立學校教職員退休撫卹制度，旨在維持退休教職員晚年基本生活，善盡國家照顧教職員老年生活之義務。本條原明定「不再」隨在職人員調整，影響退休教職員之生活，且近年物價飛漲，對高齡者影響甚鉅，爰修正第五項。\n三、綜合本條各項規定，使退休教職員年金逐年減少共十年，直到所得替代率變為最高60%、最低30%，基於上述維持老年生活之同一原因，亦有修正之必要。爰增訂第六項，規定附表三有關於所得替代率之部分，一百十三年一月一日之後部分均不適用，停止所得替代率之逐年降低。"},{"bill":"202110027240000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本法公布施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，隨在職同等級人員本（年功）俸之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，不適用之。","note":"一、鑑於近年消費者物價指數屢屢超過主計總處等相關單位認定的2%通膨警戒線，市場上物價飛漲，對高齡者生活影響甚鉅，恐使支領定期退撫給付金額之退休教職員或遺族，生活困難。\n二、第三十七條附表三所定替代率逐年遞減方式，並與現職教職員之調整機制脫鉤，實讓退休教職員難以因應生活支出，國家也未善盡照顧之義務。爰修正第三十七條第五項，退休所得隨在職同等級人員本（年功）俸之調整重新計算；並增訂第六項，附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，不適用之。"},{"bill":"202110029440000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。","note":"行政院主計總處首度於民國一百十三年發布「高齡家庭消費者物價指數」顯示，民國一百十二年高齡家庭CPI年漲2.80%，較全體家庭CPI年增率2.50%高0.3個百分點。而自2018年起試編結果顯示，高齡家庭CPI漲幅連五年均高於全體家庭，意味退休高齡家庭承受比一般家庭更高的通膨壓力，爰擬具「公務人員退休資遣撫卹法第三十七條附表三修正草案」，刪減自民國一百十三年一月一日之後，逐年下降所得替代率之部分。"},{"bill":"202110036220000","text":"本條例公布施行前退休生效者之每月退休所得，於本條例公布施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休人員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休人員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例公布施行前退休生效者，應按本條例公布施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，即依該成長率調整之。\n本條文附表三有關於所得替代率逐年下降之規定，自一百十三年一月一日起終止適用。","note":"一、修正本條文第五項，並增訂第六項。\n二、國家建立公務人員退休撫卹制度，旨在維持公務人員退休後能安享晚年，善盡國家照顧公務人員老年生活之義務，本條文明定「不再」隨在職人員調整，影響退休共務人員之生活，為求落實照顧老年責任及基於職業平等原則，應比照勞保第六十五條之四於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，即依該成長率調整之。\n三、本條例施行自107年起，致使退休公務人員退休金遭刪減已達平均新臺幣200萬元以上，衝擊生活甚劇，且若續行本條各項規定，前後逐年減少共十年，其達最低替代率竟僅堪保障最低生活，然年齡越高，其醫療及安養支出更鉅，若續行本條逐年減少，有違憲法保障人民生存權利，爰增訂本條第六項，規定本條文附表三 有關於所得替代率逐年下降之規定，自一百十三年一月一日起終止適用。"},{"bill":"202110037330000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，應隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，停止適用之。","note":"一、本條原明定「不再」隨在職人員調整，影響退休公立學校教職員之生活，且近年受國際通貨膨脹及國內物價影響，將對退休公立學校教職員之老年生活影響甚鉅，爰修正第五項。\n二、增訂第六項，規定附表三有關於所得替代率逐年降低之部分，為因應近年國內經濟狀況，一百十三年一月一日之後部分均停止適用，使所得替代率不再降低，維持退休公立學校教職員之老年生活條件，以符公平正義及信賴保護原則。"},{"bill":"202110039290000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。中華民國一百十四年後，各年度所得替代率不再逐年降低，依中華民國○年○月○日修正後之附表三認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。","note":"一、修正本條第三項及第五項。\n二、國家建立退休撫卹制度，旨在維持退休人員晚年基本生活，善盡國家照顧退休人員老年生活之義務，惟近年來物價飛漲飆升，對高齡族群影響擴大。本條第三項原本規定，本法施行前之退休公立學校教職員，其所得替代率自民國一百零九年開始，每年下降1.5%，逐年連續減少十年，至民國一百十八年。為減緩物價攀升對高齡族群的衝擊，本次修正本條第三項及附表三，明定所得替代率之逐年下降，到民國一百十四年即停止。\n三、本條第五項原規定本法公布施行前退休之公務人員，其退休所得不再隨同在職同等級人員本（年功）俸重新調整計算，本項規定致使退休教職員難以承擔物價攀升之風險，爰修正該項，刪除「不再」二字。"},{"bill":"202110087460000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，不再隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日以後逐年下降所得替代率之部分，不適用之。","note":"一、增訂本條第六項。\n二、國家建立公立學校教職員退休撫卹制度，旨在維持退休教職員晚年基本生活，善盡國家照顧教職員老年生活之義務，惟近年來物價飛漲飆升，對高齡族群影響擴大。本條第二項所列附表三，公立學校退休教職員，其所得替代率自民國一百零七年開始，每年下降1.5%，逐年連續減少十年，至民國一百十八年。為減緩物價攀升對高齡族群的衝擊，本次修正增訂本條第六項，明定附表三逐年下降所得替代率之部分，自一百十三年一月一日以後，不適用之。"},{"bill":"202110167730000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，不再隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，不適用之。","note":"鑒於我國本法規定，教職員之退休所得替代率將逐年下調至118年，然我國近年來物價通膨嚴重，近3年來CPI（消費者物價指數）均超過2%以上，若持續下調退休所得替代率，將影響教職員之退休後生活，且照顧退休教職員為政府責任，政府不應以財政穩健為藉口，而犧牲教職員退休生活，且近年來政府連年超徵，110年超徵4034億元、111年超徵4,950億元、112年超徵3,617億元，甚至113年預計超徵5,283億元，政府應負起撥補責任。爰增訂第六項，規定本條文附表三，逐年下降所得替代率之部分，自113年1月1日後，不再適用。"},{"bill":"202110170980000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，停止適用。","note":"一、現行第五項規定退休給與「不再」隨在職人員薪俸調整，已使退休公立學校教職員實質所得未能反映物價變動，生活水準逐年下降。近年國際通貨膨脹與國內物價上漲幅度明顯，民生支出持續攀升，對高齡退休教職員之生活造成重大影響，顯已不符本法保障退休後基本生活之立法目的。爰修正第五項，恢復與在職人員薪俸調整之連動性，使退休給付能隨物價與薪資變化適度調整，以維持退休人員合理之生活品質，並體現國家照顧公教人員晚年生活之責任。\n二、另現行附表三規定，自民國一百零七年起，每年調降所得替代率百分之一點五，連續十年，至一百十八年止。然隨經濟情勢變化與物價波動，若持續依附表規定逐年調降，將導致退休教職員所得實質價值不斷縮水，削弱其生活保障，亦違背信賴保護及公平正義原則。爰增訂第六項，明定附表三關於所得替代率逐年降低之規定，自民國一百十三年一月一日起停止適用，使所得替代率得以穩定，確保退休公立學校教職員不因制度性調降而陷入經濟困境，並兼顧制度之安定性與社會之整體公平。"},{"bill":"202110171870000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，停止適用之。","note":"一、修正本條第五項，增訂本條第六項。\n二、基於維護公教人員退休生活，同時完善公務體系薪資與保障，並考量近年來消費者物價指數年年上漲，對於以退休者生活產生實質影響，原將本條明「不再」隨在職人員予以修正，維護以退休之高齡者生活。\n三、另綜合本條各項規定，使退休公教人員年金逐年減少共十年，直到所得替代率變為最高60%、最低30%，基於上述維持老年生活之同一原因，亦有修正之必要。爰增訂第六項，規定附表三有關於所得替代率之部分，於一百十三年一月一日之後部分均不適用，停止所得替代之逐年降低。"},{"bill":"202110172140000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。自第三十六年起，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行前退休生效者，應按本條例施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，不再隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日以後，逐年下降所得替代率之部分，不適用之。","note":"一、增訂第六項。\n二、國家設立公立學校教職員退休撫卹制度，旨在保障退休教職員之基本生活，落實國家照顧老年生活之責。然而近年物價持續上漲，對高齡族群生活造成重大影響。現行規定自民國一百零七年起，退休教職員年金所得替代率每年下降1.5%，連續十年，至一百十八年止，導致退休所得逐年減少，最高僅達60%、最低30%。為維持退休教職員生活穩定，減輕物價上漲衝擊，爰增訂第六項，明定附表三關於所得替代率逐年降低之規定，自一百十三年一月一日起停止適用，暫緩年金再度調降，以確保高齡退休教職員之基本生活保障。"},{"bill":"202110173890000","text":"本條例施行前退休生效者之每月退休所得，於本條例施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年， 家建立公立學校教職員退休撫卹制度，旨在維持退休教職員晚年基本生活，善盡國家照顧教職員老年生活之義務。本條原明定「不再」隨在職人員調整，影響退休教職員之生活，且近年物價飛漲，對高齡者影響甚鉅，爰修正第五項。\n三、綜合本條各項規定，使退休教職員年金逐年減少共十年，直到所得替代率變為最高60%、最低30%，基於上述維持老年生活之同一原因，亦有修正之必要。爰增訂第六項，規定附表三有關於所得替代率之部分，一百十三年一月一日之後部分均不適用，停止所得替代率之逐年降低。"},{"bill":"202110036220000","text":"本條例施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第四十年者，照前條第二項規定辦理。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後經審定後，於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，即依該成長率調整之。\n本條文附表三 有關於所得替代率逐年下降之規定，自一百十三年一月一日起終止適用。","note":"一、修正本條文第五項，並增訂第六項。\n二、國家建立公務人員退休撫卹制度，旨在維持公務人員退休後能安享晚年，善盡國家照顧公務人員老年生活之義務，本條文明定「不再」隨在職人員調整，影響退休共務人員之生活，為求落實照顧老年責任及基於職業平等原則，應比照勞保第六十五條之四於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，即依該成長率調整之。\n三、本條例施行自107年起，致使退休公務人員退休金遭刪減已達平均新臺幣200萬元以上，衝擊生活甚劇，且若續行本條各項規定，前後逐年減少共十年，其達最低替代率竟僅堪保障最低生活，然年齡越高，其醫療及安養支出更鉅，若續行本條逐年減少，有違憲法保障人民生存權利，爰增訂本條第六項，規定本條文附表三有關於所得替代率逐年下降之規定，自一百十三年一月一日起終止適用。"},{"bill":"202110037330000","text":"本條例施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第四十年者，照前條第二項規定辦理。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後，應隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，停止適用之。","note":"一、本條原明定「不再」隨在職人員調整，影響退休公立學校教職員之生活，且近年受國際通貨膨脹及國內物價影響，將對退休公立學校教職員之老年生活影響甚鉅，爰修正第五項。\n二、增訂第六項，規定附表三有關於所得替代率逐年降低之部分，為因應近年國內經濟狀況，一百十三年一月一日之後部分均停止適用，使所得替代率不再降低，維持退休公立學校教職員之老年生活條件，以符公平正義及信賴保護原則。\n三、考量尚未退休但可能適用附表三之未來退休公立學校教職員亦將受此所得替代率減少之衝擊，爰比照第三十七條修正本條。"},{"bill":"202110039290000","text":"本條例施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第四十年者，照前條第二項規定辦理。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。中華民國一百十四年後，各年度所得替代率不再逐年降低，依中華民國○年○月○日修正之後附表三認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。","note":"一、修正本條第三項及第五項。\n二、本條原本規定本法施行後退休公立學校教職員之所得替代率事宜，本次修正明定逐年緩降至民國一百十四年停止、退休給付仍應隨同現職同等級人員本（年功）俸調整。修正此二點，理由與本次修正第三十七條說明欄相同。"},{"bill":"202110170980000","text":"本條例施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第四十年者，照前條第二項規定辦理。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，停止適用。","note":"一、現行第五項規定退休給與「不再」隨在職人員薪俸調整，未能反映通膨與物價變動，致退休公立學校教職員生活水準下降。為維護退休後基本生活，並落實國家照顧責任，爰修正第五項，使退休給與得隨經濟情勢及薪俸調整。\n二、比照本法第三十七條增訂第六項，明定附表三關於所得替代率逐年調降之規定，自一百十三年一月一日起停止適用，以因應物價波動，維持退休人員生活條件，符合公平正義及信賴保護原則。"},{"bill":"202110171870000","text":"本條例施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第四十年者，照前條第二項規定辦理。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，停止適用之。","note":"一、修正本條第五項，增訂本條第六項。\n二、本條原本規定本法施行後退休公教人員之所得替代率事宜，本次修正明定規定附表三有關於所得替代率之部分，一百十三年一月一日之後部分均不適用，停止所得替代率之逐年降低。修正此二點，理由與本次修正第三十七條說明欄相同。"},{"bill":"202110172140000","text":"本條例施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第四十年者，照前條第二項規定辦理。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後，不再隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十三年一月一日之後，逐年下降所得替代率之部分，不適用之。","note":"一、增訂第六項。\n二、國家設立公立學校教職員退休撫卹制度，旨在保障退休教職員之基本生活，落實國家照顧老年生活之責。然而近年物價持續上漲，對高齡族群生活造成重大影響。現行規定自民國一百零七年起，退休教職員年金所得替代率每年下降1.5%，連續十年，至一百十八年止，導致退休所得逐年減少，最高僅達62.5%、最低30%。為維持退休教職員生活穩定，減輕物價上漲衝擊，爰增訂第六項，明定附表三關於所得替代率逐年降低之規定，自一百十三年一月一日起停止適用，暫緩年金再度調降，以確保高齡退休教職員之基本生活保障。"},{"bill":"202110173890000","text":"本條例施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第四十年者，照前條第二項規定辦理。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後，隨在職同等級人員本（年功）薪之調整重新計算。\n本條附表三有關自中華民國一百十四年一月一日之後，逐年下降所得替代率之部分，不適用之。","note":"同第三十七條說明二。"}],"changed":true,"final":"本條例施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休教職員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第四十年者，照前條第二項規定辦理。\n前項替代率之上限，依退休教職員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本條例施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後，不再隨在職同等級人員本（年功）薪之調整重新計算。\n本條例於中華民國一百十四年十二月十二日修正公布前或後退休生效者，一律以附表三所定中華民國一百十二年一月一日至一百十二年十二月三十一日之退休所得替代率上限認定之；附表三有關自中華民國一百十三年一月一日以後，逐年下降所得替代率之部分，不適用之。","finalWhy":"一、第一項至第五項未修正。\n二、教師擔負培育國家人才的神聖工作，其健全的薪資與退休生活保障，有助於吸引優秀人才進入教育體系，作育英才，爰增訂第六項，退休教職員經審定之退休年資，依本條附表三所定各年度之退休所得替代率上限，不論退休教職員係於本條例中華民國一百十四年十二月十二日修正公布前或後退休生效者，一律以附表三所定中華民國一百十二年一月一日至一百十二年十二月三十一日之退休所得替代率上限認定之，以保障退休教職人員生活。同附表三所定中華民國一百十三年一月一日以後，各年度之退休所得替代率上限，均不再適用。","review":null},{"no":"第五十四條","current":null,"versions":[],"changed":true,"final":"教職員在職病故或意外死亡者，其撫卹金給與之種類如下：\n一、一次撫卹金。\n二、一次撫卹金及月撫卹金。\n前項撫卹金之給與，依下列標準計算：\n一、任職未滿十五年者，依下列規定，發給一次撫卹金：\n(一)任職滿十年而未滿十五年者，每任職一年，給與一又二分之一個基數；未滿一年者，每一個月給與八分之一個基數；其未滿一個月者，以一個月計。\n(二)任職未滿十年者，除依前目規定給卹外，每少一個月，加給十二分之一個基數，加至滿九又十二分之十一個基數後，不再加給（如附表四）。但曾依法令領取由政府編列預算或退撫基金支付之退離給與或發還退撫基金費用本息者，其年資應合併計算；逾十年者，不再加給。\n二、任職滿十五年者，依下列規定發給一次撫卹金及月撫卹金：\n(一)每月給與二分之一個基數之月撫卹金。\n(二)前十五年給與十五個基數一次撫卹金。超過十五年部分，每增一年，加給二分之一個基數，最高給與二十七又二分之一個基數；未滿一年之月數，每一個月給與二十四分之一個基數；未滿一個月者，以一個月計。\n前項基數內涵之計算，以附表一所列平均薪額加一倍為準。\n[附表四：教職員任職未滿十年者加給一次撫卹金計算標準表]","finalWhy":"","review":null},{"no":"第六十七條","current":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之五時，應予調整，其調整比率由行政院會同考試院，考量國家經濟環境、政府財政與退撫基金準備率定之；或至少每四年應予檢討；其相關執行規定，於本條例施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之五或低於原領給付金額時，應經立法院同意。","versions":[{"bill":"202110010240000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之三時，應予調整，其調整比率由行政院會同考試院，考量國家經濟環境、政府財政與退撫基金準備率定之；或至少每二年應予檢討；其相關執行規定，於本條例施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之五或低於原領給付金額時，應經立法院同意。","note":"一、由於現職軍公教人員將於民國113年調薪百分之四，然此一調整並不包括教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，依本條規定係於消費者物價指數累計成長率達正、負百分之五時，始應予調整。惟上開退休教職員退休金及遺族撫卹、遺屬年金之調整需待消費者物價指數累計成長率達正百分之五時，始得予以調整，似不足使退休教職員退休金及遺族撫卹、遺屬年金可反映物價變動，而不足達成照料退休教職員或其遺屬、遺族之目的。為此爰以調降門檻，修訂為於中央主計機關發布之消費者物價指數累計成長率達正百分之三，即應予以調整。\n二、鑒於近年物價指數上升速度較以往快速，每四年定期檢討似緩不濟急，而未能及時反映退休教職員退休金及遺族撫卹、遺屬年金給付需求，爰將原定四年之定期檢討之年限縮短為二年，以保障領受人權益。"},{"bill":"202110022300000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之五時，應即依該成長率調整之。但成長率為零或負數時，不予調整。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依規定調整後之給付金額低於原領給付金額時，不予調整。","note":"一、本條自一百十一年七月一日施行以來，退金給付調整比率，遠不及勞工保險條例第六十五條之四、國民年金法第五十四條之一所規定之內容，為加強保障公立學校退休教職人員，不致因行政院等機關被動處理調整事宜，致影響退休人員生活所需，茲比照勞工保險條例及國民年金法之規定修正之，也方能符合大法官釋字第783號解釋中所述意旨：「國家自有維持依系爭條例重新審定之退撫給與之財產上價值，不隨時間經過而產生實質減少之義務。」\n二、勞工保險條例第六十五條之四：「本保險之年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，即依該成長率調整之。」另國民年金法第五十四條之一亦規定老年年金給付「其後每四年調整一次，由中央主管機關參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率公告調整之，但成長率為零或負數時，不予調整。」\n三、老年農民福利津貼暫行條例第四條第一項：「符合前條資格條件之老年農民，得申請發給福利津貼，自中華民國一百零一年一月一日起調整為每月新臺幣七千元，發放至本人死亡當月止；其後每四年調整一次，由中央主管機關參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率公告調整之，但成長率為零或負數時，不予調整。」\n四、為保障公立學校教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金之權益，比照國民年金法第五十四條之一體例，修正第一項文字，並刪除第二項依前項規定調整後之給付金額「超過原領給付金額之百分之五文字或」、「應經立法院同意」之文字。"},{"bill":"202110027240000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正百分之二、負百分之五時，應予調整，其調整比率由行政院會同考試院，考量國家經濟環境、政府財政與退撫基金準備率定之；或至少每二年應予檢討；其相關執行規定，於本法施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之五或低於原領給付金額時，應經立法院同意。","note":"一、鑑於近年消費者物價指數屢屢超過主計總處等相關單位認定的2%通膨警戒線，市場上物價飛漲，對高齡者生活影響甚鉅，恐使支領定期退撫給付金額之退休教職員或遺族，生活困難。\n二、為照顧退休教職員或遺族，第六十七條原定教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之五時，應予調整。依據主計總處等單位對通膨警戒線之認定，爰修正中央主計機關發布之消費者物價指數累計成長率達正百分之二、負百分之五時，應予調整。並修正至少每二年應予檢討。"},{"bill":"202110027440000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之五時，應於發布日起三個月內予以調整，其調整比率由行政院會同考試院制定公式定之；或隨軍公教加薪比例調整，考量國家經濟環境、政府財政與退撫基金準備率定之；或至少每四年應予檢討；其相關執行規定，於本條例施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之五或低於原領給付金額時，應經立法院同意。","note":"一、近年來物價膨脹嚴重，基本工資調漲4.05%，現職軍公教調薪4%、國民年金調整7.34%，整體物價波動對國人之影響極大。\n二、行政院於總統大選前九天宣布，退休軍公教人員退休俸在2024年度總預算已匡列44億元，選後卻遲遲沒有消息。經洽詢後，仍舊在公務會議過程中延宕，顯對退休軍公教不公。\n三、爰此，提請修訂《公立學校教職員退休資遣撫卹條例》第六十七條修正草案，修訂中央主計機關發布之消費者物價指數累計成長率達正、負百分之五時，應於發布日起三個月內予以調整，其調整比率由行政院會同考試院制定公式定之；或隨軍公教加薪比例調整。"},{"bill":"202110036220000","text":"（刪除）","note":"調整機制已於本條例第三十七條及第三十八條明定比照勞保第六十五條之四「於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，即依該成長率調整之」。"},{"bill":"202110039290000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之高齡家庭消費者物價指數累計成長率達正、負百分之二時，應予調整，其調整比率由行政院會同考試院，考量國家經濟環境、政府財政與退撫基金準備率定之；或至少每四年應予檢討；其相關執行規定，於本條例施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之五或低於原領給付金額時，應經立法院同意。","note":"一、修正第一項。\n二、有鑑於近年來物價攀升，行政院主計總處又將於民國113年開始編算、公布高齡家庭消費者物價指數，爰本次明定啟動調整機制之參考指標，修正為高齡家庭消費者物價指數。\n三、另外，一般而言均將2%視作通貨膨脹警戒線，又羅昌發大法官於司法院大法官釋字第783號解釋之協同意見書，指出從物價指數實際變化情形來看，現行規定5%始啟動調整機制，過於嚴苛，應以2%為宜，爰予修正。"},{"bill":"202110042020000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之五時，應於發布日起三個月內依成長率予以調整，或隨軍公教加薪比例調整。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額低於原領給付金額時，應經立法院同意。","note":"一、近年物價膨脹嚴重，基本工資調漲4.05%，現職軍公教調薪4%、國民年金調整7.34%，整體物價波動對國人之影響極大。\n二、行政院於總統大選前九天宣布，退休軍公教人員退休俸在2024年度總預算已匡列44億元，選後卻遲遲沒有消息。經洽詢後，仍舊在公務會議過程中延宕，顯對退休軍公教不公。\n三、爰此，提請修訂《公立學校教職員退休資遣撫卹條例》第六十七條修正草案，修訂中央主計機關發布之消費者物價指數累計成長率達正、負百分之五時，應於發布日起x六個月內予以調整，其調整比率由行政院會同考試院制定之；或隨軍公教加薪比例調整。"},{"bill":"202110132480000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正百分之三時應予調整，或至少每四年應予檢討，其調整比率由考試院會同行政院，考量國家經濟環境、政府財政與退撫基金準備率定之；調整比率不得低於消費者物價指數累計成長率之二分之一，但成長率為零或負數時，不予調整。\n前項相關執行規定，於本法施行細則定之。","note":"一、按司法院大法官釋字第783號指出：「第六十七條第一項前段規定與系爭條例改革初衷不盡一致，相關機關應依本解釋意旨儘速修正，於消費者物價指數變動累積達一定百分比時，適時調整月退休金、月撫卹金或遺屬年金，俾符憲法上體系正義之要求」、「國家自有維持依系爭條例重新審定之退撫給與之財產上價值，不隨時間經過而產生實質減少之義務」，而現行法下，公立學校退休教職人員僅得被動由行政院等機關調整其月退休金，致其生活所需受到影響，難謂符合憲法之要求。\n二、按現行退休金等給付金額須待消費者物價指數累計成長率達正、負百分之五始得調整，依近年物價波動情況，至少須二至三年始符該要件，加上檢討調整之程序，正式推行恐耗時三至四年，緩不濟急，爰將檢討時機改為消費者物價指數累計成長率達正百分之三時應予調整。且為避免調整比率與通貨膨脹落差過大，爰規定其調整比率不得低於消費者物價指數累計成長率之二分之一，俾符制度目的。\n三、又參考國民年金法第五十四條之一亦規定老年年金給付「其後每四年調整一次，由中央主管機關參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率公告調整之，但成長率為零或負數時，不予調整。」老年農民福利津貼暫行條例第四條第一項亦規定其福利津貼「由中央主管機關參照中央主計機關發布之最近一年消費者物價指數較前次調整之前一年消費者物價指數成長率公告調整之，但成長率為零或負數時，不予調整。」為避免退休金權益受損，成長率若為零或負數時，應不予調整。\n四、按依末段規定，退休金調整將不會低於原給付，爰刪除原第二項之規定。原第一項末段之授權規定移列至第二項。"},{"bill":"202110167730000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正百分之二時，應予調整，其調整比率由行政院會同考試院，考量國家經濟環境、政府財政與退撫基金準備率定之；或至少每三年應予檢討；其相關執行規定，於本條例施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之五或低於原領給付金額時，應經立法院同意。","note":"鑒於近年來，物價通膨嚴重，我國113年CPI（消費者物價指數）年增率達2.2%，連續三年均達2%以上，然消費者物價指數年增率（CPI）百分之2為全球普遍採用之通膨警戒線，當前本法規定之成長率卻須達正負5，顯無法隨當前社會經濟環境即時進行調整，爰修正為成長率達正百分之二時或每三年，應予調整，以貼近當前社會經濟環境。"},{"bill":"202110170980000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之三時，應於發布日起三個月內予以調整；或至少每三年應予檢討。其調整比率由行政院會同考試院，考量國家經濟環境、政府財政與退撫基金準備率定之；其相關執行規定，於本條例施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之五或低於原領給付金額時，應經立法院同意。","note":"現行條文規定，教職員退休後所領月退休金、遺族所領之月撫卹金或遺屬年金給付金額，須待中央主計機關發布之消費者物價指數累計成長率達正、負百分之五時方得調整。惟近年物價上漲速度加快，該門檻過高，難以及時反映物價變動，致退休教職員及其遺族之生活水準受到影響，與本條例照顧退休人員之立法目的不符。為使制度更能即時反映物價變動，爰將調整門檻由「正、負百分之五」修正為「正、負百分之三」，並增訂自中央主計機關發布日起三個月內應予調整之時限，以確保執行具明確時效，維護退休人員生活安定。同時，為使調整機制得以適時檢討，將原定每四年定期檢討一次之週期縮短為每三年，以因應物價波動與經濟變化，確保制度之彈性與持續性，爰修正本條第一項，保障退休教職員及其遺族之生活品質。"},{"bill":"202110171870000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之三時，應予調整，其調整比率由行政院會同考試院，考量國家經濟環境、政府財政與退撫基金準備率定之；調整比率不得低於消費者物價指數累計成長率之二分之一，或至少每四年應予檢討；其相關執行規定，於本條例施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之三或低於原領給付金額時，應經立法院同意。","note":"一、修正第一項。\n二、有鑑於退休給付機制依現行消費者物價指數變動5%之啟動調整機制過高，爰本次明定啟動調整機制之參考指標，修正為消費者物價指數。\n三、根據OECD（經濟合作暨發展組織）與IMF（國際貨幣基金）的長期建議，理想通膨率（Inflation Rate）約為2%±1%，包含美國聯準會（FED）、歐洲央行（ECB）及日本央行（BOJ）都設定目標通膨率2%，主要為避免通縮風險、實質利率保持正值，讓政府債務在通膨中實質縮水。\n四、根據中華民國主計總處統計之消費者物價基本分類指數年增率顯示103年至110年均低於2%標準，僅104年、109年呈現通貨緊縮狀況，然111年至113年分別為2.95%、2.49%、2.18%，尤其食物類物價指數年增率呈現5.66%、4.03%、3.69%，顯高於國際通膨標準，造成人民生活成本大幅提升。\n五、爰本次明定啟動調整機制之參考指標，修正為消費者物價指數，從變化情形來看，一般定義超過3%為通貨膨脹，超過5%就是嚴重通貨膨脹。CPI往往是市場經濟活動與政府貨幣政策的一個重要參考指標，現行規定5%始啟動調整機制，過於嚴苛，應以3%為宜，爰予修正。\n六、另按現行退休金等給付金額須待消費者物價指數累計成長率達正、負百分之五始得調整，依近年物價波動情況，至少須二至三年始符該要件，加上檢討調整之程序，正式推行恐耗時三至四年，已緩不濟急，爰將檢討時機改為消費者物價指數累計成長率達正百分之三時應予調整。且為避免調整比率與通貨膨脹落差過大，爰規定其調整比率不得低於消費者物價指數累計成長率之二分之一，俾符制度目的。"},{"bill":"202110172140000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正百分之三時應予調整，或至少每四年應予檢討，其調整比率由考試院會同行政院，考量國家經濟環境、政府財政與退撫基金準備率定之；調整比率不得低於消費者物價指數累計成長率之二分之一，但成長率為零或負數時，不予調整。\n前項相關執行規定，於本條例施行細則定之。","note":"依據釋字第783號解釋，國家應確保退休金等給付之實質價值不因時間而減少，並應於物價上漲時適時調整，以符體系正義。現行規定須待物價指數累計成長率達正負5%方可調整，程序冗長，無法即時反映物價變動，影響退休教職員生活。為改善此情況，修正為當物價指數累計成長率達正3%即應調整，且調整比率不得低於其成長率之二分之一，以縮小通膨落差。另參酌國民年金與老農津貼規定，成長率為零或負數時不調整；並刪除不必要條文，使制度更具即時性與保障性。"},{"bill":"202110173890000","text":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正、負百分之二時，應予調整，其調整比率由行政院會同考試院，考量國家經濟環境、政府財政與退撫基金準備率定之；或至少每四年應予檢討；其相關執行規定，於本條例施行細則定之。\n教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金，依前項規定調整後之給付金額超過原領給付金額之百分之五或低於原領給付金額時，應經立法院同意。","note":"一、依據財政部統計物價指數年增率，自111年年增率均高於2。\n二、又行政院主計總處，針對113年高齡家庭（戶內人口皆為65歲以上）全年消費者物價指數（CPI）年增率為2.37%，高於整體平均值，而且是自110年以來連續四年破二，顯示高齡家庭較一般人承受更重物價之苦，為保障退休人員基本生活，爰調整機制之參考指標，強化對退休人員之照顧。"}],"changed":true,"final":"教職員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正百分之五時，應依該成長率調整之；或至少每四年應予檢討，適當調整，但成長率為零或負數時，不予調整；其相關執行規定，於本條例施行細則定之。","finalWhy":"一、為維護退休教職員、遺族或遺屬之生活水平，不致因通貨膨漲而削弱，爰參酌國民年金和老農福利津貼制度，當消費者物價指數累計成長率達正百分之五時，月退休金、月撫卹金或遺屬年金給付金額，應依該成長率覈實調整；或政府至少每四年應視消費者物價指數成長幅度情形進行檢討，適當調整，但成長率為零或負數時，不予調整。\n二、另依本條例第一百條第三項規定，本法修正條文，自公布日施行，附此敘明。","review":null}],"stages":[{"date":"2024-03-15","stage":"一讀","code":"院會-11-1-5","bill":"202110010240000","gazref":"113卷010期5192號 2-2頁"},{"date":"2024-03-22","stage":"一讀","code":"院會-11-1-6","bill":"202110018370000","gazref":"113卷014期5196號 11-11頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110020940000","gazref":"113卷018期5200號 4-4頁"},{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110022300000","gazref":"113卷018期5200號 12-12頁"},{"date":"2024-04-09","stage":"一讀","code":"院會-11-1-8","bill":"202110027240000","gazref":"113卷020期5202號 8-8頁"},{"date":"2024-04-09","stage":"一讀","code":"院會-11-1-8","bill":"202110027440000","gazref":"113卷020期5202號 10-10頁"},{"date":"2024-04-12","stage":"一讀","code":"院會-11-1-9","bill":"202110029440000","gazref":"113卷025期5207號 4-4頁"},{"date":"2024-04-26","stage":"一讀","code":"院會-11-1-11", <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('lede').textContent = D.lede;

  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],

function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }

function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;

  };

    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);

  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
