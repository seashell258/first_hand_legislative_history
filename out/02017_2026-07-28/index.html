全講習、毒品危害防制教育、成癮評估、戒治諮商或治療教育；未完成者，不得考領、領回或發還駕駛執照。\n九、配合本條新增血液、尿液、唾液或其他必要檢體之採樣及測試檢定，並增列毒品品項、公告檢出基準、檢出濃度值、保存、銷毀及安全維護等事項，爰修正授權主管機關會商相關機關訂定辦法之範圍，並明定檢體採樣及測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，且僅得作為執法利用，以兼顧執法需要及個人資料保護。"},{"bill":"202110221350000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上二十四萬元以下罰鍰，並均當場移置保管該汽機車：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反前項第一款規定者，吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年。違反前項第二款規定者，吊銷其駕駛執照，五年以內且須完成勒戒或戒治程序始得重新考領；違反前項第一款規定致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第五項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。汽機車駕駛人有第一項第二款吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之情形，年滿十八歲之同車乘客處新臺幣三萬以上六萬以下罰鍰並吊扣其汽機車駕駛執照十二個月。但心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第四項至第六項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；汽機車駕駛人違反第一項規定經裁決確定者，沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第四項至第六項規定之一者，依其駕駛車輛分別依第一項、第四項至第六項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第四項至第六項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第七項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、提高駕駛人罰鍰，機車提高為三萬元至十二萬元，汽車提高為六萬元至二十四萬元。\n二、為落實毒駕零容忍，修正原條文結構，明定凡經測試檢定有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，毋須以致人重傷或死亡為要件，即應吊銷其駕駛執照，並依其嚴重程度處五年以內不得考領。\n三、增訂同車乘客之連坐之責任，同車之年滿十八歲乘客知情者，全面加重處新臺幣三萬元以上六萬元以下罰鍰，並連帶吊扣其汽機車駕駛執照十二個月。且配合刪除原條文中「年滿七十歲」之豁免規定，僅保留心智障礙或汽車運輸業之乘客免罰，以強化共同監督義務。\n四、凡違反第一項規定經裁決確定者，一律沒入該車輛。"},{"bill":"202110220910000","text":"汽機車駕駛人，駕駛汽機車經測試檢定酒精濃度超過規定標準，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人，駕駛汽機車經測試檢定吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品，機車駕駛人處新臺幣九萬元以上十八萬元以下罰鍰，汽車駕駛人處新臺幣十二萬元以上二十一萬元以下罰鍰，並均當場移置保管該汽機車及吊銷駕駛執照。\n前項被吊銷駕駛執照者，自刑事有期徒刑執行完畢、易科罰金執行完畢、緩刑期滿，或依毒品危害防制條例所受觀察、勒戒、強制戒治、緩起訴處分附帶戒癮治療執行完畢之日起十年內，不得考領駕駛執照；但駕駛營業大客車者、附載未滿十二歲兒童者或因而肇事致人死傷者，吊銷其駕駛執照，並不得再考領。\n汽車駕駛人有第一項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項、第二項規定者，依其駕駛車輛分別依第一項、第二項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第六項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項、第二項情形，而不予禁止駕駛者，依第一項、第二項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，或經檢定吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第二項、第五項至第七項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第二項、第五項至第七項規定之一者，依其駕駛車輛分別依第一項、第二項、第五項至第七項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第二項、第五項至第七項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第八項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、修正第一項：配合毒駕與酒駕分別規範，將原條文「有下列情形之一」及第一款、第二款體例，修正為僅就酒精濃度超過規定標準者於本項規範，並刪除原列各款（句末「：」改為「。」）。\n二、增訂第二項，明定汽機車駕駛人毒駕之罰鍰（機車駕駛人九萬元以上十八萬元以下、汽車駕駛人十二萬元以上二十一萬元以下），並當場移置保管汽機車及吊銷駕駛執照。\n三、增訂第三項，明定毒駕經吊銷駕駛執照者，自刑事處罰或毒品相關處分執行完畢之日起十年內不得考領駕駛執照；駕駛營業大客車、附載未滿十二歲兒童或因而肇事致人死傷者，吊銷駕駛執照並不得再考領。\n四、原第二項至第十三項依序遞移為第四項至第十五項，並配合新增第二項、第三項，調整相關項次及交叉引用文字（第十一項至第十三項「第三項至第五項」更正為「第五項至第七項」、第十五項「第六項」更正為「第八項」）。"},{"bill":"202110221380000","text":"汽機車駕駛人，駕駛汽機車經尿液及唾液快篩方式進行檢驗測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照五年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照七年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領及應加以註記：\n一、酒精濃度超過規定標準。\n二、吸食毒品、依托咪酯類毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊銷情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，吊銷其駕駛執照。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領及應加以註記。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領及應加以註記：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、依托咪酯類毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、依托咪酯類毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領及應加以註記。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人及同車乘客，明知汽機車駕駛人犯有本條各項款之情形，而不予禁止駕駛者，應連同依照該項款規定罰鍰處罰之。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照五年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，應吊銷其駕駛執照，並不得再考領及應加以註記、沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、有鑑於毒駕事件頻傳，據交通部道路安全統計2026年1、2月僅短短2個月時間，吸毒後駕駛已經害死55名無辜民眾，造成民眾安全及社會治安構成重大傷亡威脅。於此同時，根據警政署統計自2024年8月依托咪酯列管以來，截至2026年4月底止，全國已查獲該相關毒品犯嫌竟達2萬1,000人，查扣依托咪酯類毒品高達849.5公斤，顯已挑戰法律底線，爰修正本條文。\n二、另因少數不肖業者非法添加依托咪酯的電子煙濫用問題日益嚴重，且吸食後會出現無法思考、控制身體、異常顫抖、抖動等行為，故俗稱為「喪屍煙彈」，吸毒後駕駛已經害死多名無辜民眾。\n三、增修同車乘客，明知汽機車駕駛人犯有本條各項款之情形，而不予禁止駕駛者，應連同依照該項款規定罰鍰處罰之。"},{"bill":"202110221040000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上十八萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人明知其因違反第一項第一款、第二款及中華民國刑法第一百八十五之三掉一項第三款或第四款規定者，經依法吊銷駕駛執照或不得再考領駕駛執照，仍借用、租賃或駕駛非屬本人所有之汽機車違反第一項第一款及第二款規定者，依第一項所處罰鍰加重二分之一。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，或有第一項第二款吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之情形，年滿十八歲之同車乘客明知其情事而仍搭乘者，處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n汽機車駕駛人違反第一項或第四項者，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。汽機車駕駛人有第三項或第五項之情形者，不以因而肇事致人重傷或死亡為限，直接沒入該汽機車。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、依警政署統計資料，113年毒駕移送案件為2,131件，發生90件毒駕事故，造成11人死亡、85人受傷；至114年，毒駕移送案件暴增至8,659件，較前一年增加超過四倍。此數據顯示現行罰鍰額度使多數犯罪者抱持僥倖心理，認為「違法成本低」而一再以身試法。因此提高汽機車駕駛人毒駕之罰鍰以達嚇阻之效。\n二、第八項新增，毒駕行為人若曾因毒駕受吊銷駕照、不得再考領者，明知已喪失駕駛資格卻借用、租賃駕駛非本人所有之汽機車並再犯毒駕，顯示其對道路交通安全之漠視、以及對其他用路人權益之威脅甚大，爰明訂加重罰鍰二分之一。\n三、第八項後項次依序順延。\n四、酒駕同車乘客須負法律責任建立在透過罰鍰將乘客變為監督者，在酒駕發生前勸阻駕駛者實施犯罪，毒駕應採取相同防禦機制，擴大交通安全共識。\n五、針對酒駕、毒駕累犯者，即便未肇事造成他人傷害，其漠視公共安全、枉顧他人行車權益之行為影響重大，修法增加沒入車輛之懲罰。"},{"bill":"202110221970000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上十八萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣二十四萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣四十八萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款至第四款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款或第二款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液或尿液檢體採樣，及酒精濃度、毒品、麻醉藥品或其他相類之物或其代謝物之測試檢定（以下簡稱檢體採樣及測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施檢體採樣及測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受檢體採樣及測試檢定者得於受檢體採樣及測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。經測試檢定有第一項第二款情形，年滿十八歲且明知或可得而知之同車乘客，亦同。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項檢體採樣及測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液或尿液檢體採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、酒後或施用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品後駕駛汽機車，將顯著降低駕駛人注意、判斷及反應能力，對道路交通安全及其他用路人生命、身體法益造成高度危險。汽車因車體重量、行駛動能及事故波及範圍較大，一旦酒駕或毒駕，所生危害尤為重大，爰提高汽車駕駛人違反第一項規定之罰鍰級距，由新臺幣三萬元以上十二萬元以下，修正為新臺幣六萬元以上十八萬元以下。\n二、不依指示停車接受稽查、拒絕接受測試檢定，或於接受測試檢定前、發生交通事故後再行吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，均具有規避檢測、妨礙執法或混淆檢測結果之性質。為避免行為人以拒測或其他方式逃避責任，使拒測反成規避酒毒駕查緝之誘因，爰將第四項所定罰鍰由新臺幣十八萬元提高為新臺幣二十四萬元；並將十年內第二次違反第四項規定者之罰鍰，由新臺幣三十六萬元提高為新臺幣四十八萬元，以強化嚇阻效果。\n三、現行條文已就酒駕情形課予年滿十八歲同車乘客一定防制責任。惟施用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品後駕車，對道路交通安全之危害不亞於酒駕。為促使同車乘客於知悉或可得而知駕駛人有毒駕情形時，及時勸阻或避免搭乘，以共同防止高風險駕駛行為，並兼顧責任原則，爰增訂汽機車駕駛人經測試檢定有第一項第二款情形，年滿十八歲且明知或可得而知之同車乘客，亦處新臺幣六千元以上一萬五千元以下罰鍰；至年滿七十歲、心智障礙或汽車運輸業之乘客，仍維持現行除外規定。\n四、現行第六項就汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，且拒絕接受或因事故無法實施酒精濃度測試檢定者，定有報請檢察官核發鑑定許可書並實施血液檢體採樣及酒精濃度測試檢定之規定。惟刑法第一百八十五條之三第一項已就毒品、麻醉藥品或其他相類之物所致不能安全駕駛定有處罰規範，毒駕對道路交通安全之危害不亞於酒駕。為避免毒駕行為人以拒絕檢測或事故後無法檢測等方式規避責任，並強化毒駕案件證據取得及執法效能，爰將第六項適用範圍擴及涉犯同條第一項第三款、第四款嫌疑之情形，並明定得實施血液或尿液檢體採樣及相關測試檢定。"},{"bill":"202110222590000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣三萬元以上九萬元以下罰鍰，汽車駕駛人處新臺幣五萬元以上三十萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至三年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至五年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"鑒於近年酒駕再犯率居高不下，加上毒駕問題日益嚴重，為有效防範飲酒及吸食毒品、迷幻藥等相關管制藥品之汽機車駕駛人心存僥倖上路，爰建議修正第一項條文，提高罰鍰及吊扣駕照年限。"},{"bill":"202110222600000","text":"汽機車駕駛人，駕駛汽機車經測試檢定酒精濃度超過規定標準者，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車所有人，明知汽機車駕駛人有第一項情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。","note":"一、修正第一項，將第一款規定併入內文，並將第二款毒駕相關規定移列增訂至第三十五條之一第一項。\n二、第二項、第三項及第五項未修正。\n三、修正第四項，將第三款、第四款毒駕相關規定移列增訂至第三十五條之一第三項。\n四、現行條文第六項及第十三項有關強制採驗的規定，移列增訂為第三十五條之二。\n五、配合第一項之項次修正，修正第七項內文，並移列為第六項。\n六、第八項至第十二項條文未修正，僅項次變更。"},{"bill":"202110223020000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。但有第二款情形者，不分汽機車，吊銷其駕駛執照，三年內不得重新考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，或有第一項第二款施用毒品情形者，年滿十八歲之同車乘客，其同車駕駛人為酒精超標或施用毒品者，處新臺幣一萬五千元以上十五萬元以下罰鍰。但年滿七十歲、心智障礙、汽車運輸業之乘客，或乘客已盡相當注意義務、因客觀事由而不知情者，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、修正第一項：原條文規定吸食毒品初犯與酒駕相同，僅吊扣駕照一至二年。應明定只要是違反第二款（毒駕）者，無論汽車或機車，直接吊銷駕駛執照，且三年內不得重考，落實毒駕即重罰之嚇阻政策。\n二、第二至第七項未修正。\n三、修正第八項：原條文僅針對「酒駕超標」之同車乘客處罰（六千至一萬五千元）。應將「毒駕同車乘客」納入處罰範圍，考量毒品危害更甚，故將毒駕同車乘客之罰鍰提高至一萬五千元至十五萬元，以行嚇阻。但為防制無辜株連，將「已盡注意義務或客觀上不知情者」，與原有之年長、心智障礙等免責條件進行整併。\n四、第九至第十三項未修正。"},{"bill":"202110223250000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上十八萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽車、機車駕駛人明知其曾因違反第一項第二款、刑法第一百八十五條之三第一項第三款或第四款規定，受吊銷駕駛執照或不得再考領駕駛執照之處分，仍以借用、租賃或其他方式使用非屬本人所有之汽車、機車，再違反第一項第二款規定者，依第一項所處罰鍰加罰二分之一。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。汽機車駕駛人有第一項第二款情形時，年滿十八歲之同車乘客明知或依當時情狀足以知悉其情事而未予勸阻者，亦同。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n汽機車駕駛人違反第一項第二款規定者，應即移置保管該汽機車；經裁決確定後，沒入之。違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、考量汽車車體重量、行駛速度及碰撞動能通常高於機車，駕駛人飲酒後，或施用毒品、迷幻藥、麻醉藥品或其他相類似管制藥品後駕駛汽車，對行人、機車騎士及其他用路人所生危害甚鉅。現行汽車駕駛人罰鍰為新臺幣三萬元以上十二萬元以下，尚不足充分反映其危險程度及嚇阻需求，爰修正第一項，將汽車駕駛人罰鍰提高為新臺幣六萬元以上十八萬元以下。\n二、毒駕行為人曾因毒駕受吊銷駕駛執照或不得再考領駕駛執照之處分，卻仍於喪失駕駛資格後，再以借用、租賃或駕駛非本人所有汽車、機車等方式違規駕駛，顯示其對道路交通秩序及公共安全之漠視，且具有較高再犯風險。為避免行為人利用他人車輛規避行政管制，爰修正第七項，明定其依第一項所處罰鍰加罰二分之一。\n三、現行條文已就酒駕同車之成年乘客設有罰鍰規定，考量毒駕與酒駕同具高度公共危險性，且成年同車乘客於知悉或依當時客觀情狀足以知悉駕駛人有毒駕情形時，仍應負有勸阻及避免助長危險駕駛之注意義務，爰修正第八項，增訂汽車、機車駕駛人有第一項第二款情形時，年滿十八歲之同車乘客亦處新臺幣六千元以上一萬五千元以下罰鍰。惟年滿七十歲、心智障礙或汽車運輸業之乘客，因其判斷能力、實際阻止能力或搭乘性質與一般乘客有別，仍依現行但書規定排除處罰。\n四、毒駕行為具高度公共危險性，為強化源頭遏阻並防止行為人再次利用車輛危害道路安全，爰修正第九項，明定違反第一項第二款規定者，應即移置保管其汽車、機車，並於裁決確定後沒入之。\n五、第十項至第十三項未修正。"},{"bill":"202110223520000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車，第一款之情形並吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；第二款之情形並吊銷駕駛執照；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，屬第二次違反第一項第二款規定者，按第一項所定罰鍰最高額加罰新臺幣九萬元。第三次以上者均按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣二十七萬元罰鍰，並均應當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項規定者，處新臺幣三十六萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣四十五萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項或陸海空軍刑法第五十四條第一項嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，沒入該車輛。其屬違反第一項第二款，或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、因吸食毒品等行為涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰將第一項對毒駕行為之處罰由現行吊扣駕駛執照一年至二年修正為吊銷駕駛執照。\n二、考量毒駕比酒駕之違規惡性更為嚴重，應有再加重處罰之需要，爰修正第三項，加重第二次以上違反毒駕行為之罰鍰。\n三、修正第四項及第五項，提高拒絕接受其稽查或測試檢定及其累犯之罰鍰額度。\n四、考量陸海空軍刑法第五十四條第一項第一款及第二款亦屬酒駕之規定，爰於第六項增列該罪之規定。\n五、為強化同車乘客勸阻毒駕之社會責任，爰修正第八項，將現行酒駕事由列為第一款，並增訂第二款毒駕之情形。\n六、為達有效嚇阻毒駕，並加強汽機車所有人善盡車輛管理責任，爰於第九項後段增訂違反第一項第二款或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。且汽機車所有人與駕駛人非屬同一人時，亦適用沒入車輛之規定；又現行所定因而肇事致人重傷或死亡部分，考量處罰之衡平性，亦應沒入該車輛，而無裁量空間，爰將所定「得沒入」修正為「沒入」。\n七、增訂第十一項：\n(一)為防患未然，並從源頭管理加強防制，遏止毒駕行為，以保障廣大用路人之安全，爰增訂吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n(二)經警察機關取得行為人尿液檢驗報告為陽性或陰性有數值，確認有吸食毒品時，警察機關即得依違反本項規定舉發，並移由處罰機關執行吊銷駕駛執照處分，不問其是否有駕駛汽機車之行為。\n(三)有關相關執法機關（如法務部調查局或國防部憲兵指揮部等）通報警察機關確認行為人有吸食毒品情事之相關程序，另由第九十二條第一項及第四項規定授權之相關子法訂定，併予敘明。"},{"bill":"202110222920000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車，第一款之情形並吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；第二款之情形並吊銷其駕駛執照；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，屬第二次違反第一項第二款規定者，按第一項所定罰鍰最高額加罰新臺幣九萬元。第三次以上者均按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣二十七萬元罰鍰，並均應當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項規定者，處新臺幣三十六萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣四十五萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項或陸海空軍刑法第五十四條第一項嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限：\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，沒入該車輛。其屬違反第一項第二款，或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、依行政罰法第二十六條第一項及第二項規定，一行為同時觸犯刑事法律及違反行政法上義務規定者，依刑事法律處罰之。但其行為應處以其他種類行政罰或得沒入之物而未經法院宣告沒收者，亦得裁處之。如經不起訴處分、緩起訴處分確定或為無罪、免訴、不受理、不付審理、不付保護處分、免刑、緩刑之裁判確定者，得依違反行政法上義務規定裁處之。是以，吸食毒品後駕車此嚴重危害道路交通安全之行為，如同時涉犯本條之行政罰，與刑法第一百八十五條之三及陸海空軍刑法第五十四條之刑事罰者，原則優先依刑事法論處，先予敘明。\n二、因應近期吸食毒品後駕車肇事致人死傷案件頻傳，嚴重危害道路交通安全，引發社會高度關注，且查近三年警察機關取締毒駕件數，自一百十二年之八百二十七件，遽增至一百十四年之八千六百四十五件，增幅達約百分之九百四十五，而一百十五年二月底止已達二千六百餘件，為遏止日趨嚴重之毒駕情形，爰檢討毒駕相關處罰或駕駛執照管理規定。\n三、因吸食毒品等行為涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰將第一項對毒駕行為之處罰由現行吊扣駕駛執照一年至二年修正為吊銷駕駛執照。\n四、現行毒駕初犯按違反道路交通管理事件統一裁罰基準表已依第一項所定罰鍰最高額處罰，考量毒駕比酒駕之違規惡性更為嚴重，應有再加重處罰之需要，爰修正第三項，加重第二次以上違反毒駕行為之罰鍰。以機車毒駕為例，第一次處新臺幣九萬元（最高額處罰），第二次處新臺幣十八萬元，後續皆按前次金額累加新臺幣九萬元，累計無上限。\n五、考量吸食毒品等行為涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰修正第四項及第五項，提高拒絕接受其稽查或測試檢定及其累犯之罰鍰額度，不分車種第一次處新臺幣二十七萬元、第二次處新臺幣四十五萬元，後續皆按前次金額累加新臺幣十八萬元，累計無上限。\n六、考量陸海空軍刑法第五十四條第一項第一款及第二款亦屬酒駕之規定，爰於第六項增列該罪之規定。\n七、為強化同車乘客勸阻毒駕之社會責任，爰修正第八項，將現行酒駕事由列為第一款，並增訂第二款毒駕之情形。\n八、修正第九項：\n(一)為達有效嚇阻毒駕，並加強汽機車所有人善盡車輛管理責任，爰於後段增訂違反第一項第二款或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。且汽機車所有人與駕駛人非屬同一人時，亦適用沒入車輛之規定；現行所定因而肇事致人重傷或死亡部分，考量處罰之衡平性，亦應沒入該車輛，而無裁量空間，爰將所定「得沒入」修正為「沒入」。\n(二)另本條屬行政罰，依行政罰法第二十二條第一項規定，不屬於受處罰者所有之物，因所有人之故意或重大過失，致使該物成為違反行政法上義務行為之工具者，仍得裁處沒入。則如非出於故意或重大過失者，不予處罰，爰汽機車所有人例如租賃車輛業者將汽機車出租交予承租人使用，事前已善盡告知本條處罰規定之義務，承租人仍毒駕違規，得予舉證免罰，併予敘明。\n九、增訂第十一項：\n(一)為防患未然，並從源頭管理加強防制，遏止毒駕行為，以保障廣大用路人之安全，爰增訂吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n(二)經警察機關取得行為人尿液檢驗報告為陽性或陰性有數值，確認有吸食毒品時，警察機關即得依違反本項規定舉發，並移由處罰機關執行吊銷駕駛執照處分，不問其是否有駕駛汽機車之行為。\n(三)有關相關執法機關（如法務部調查局或國防部憲兵指揮部等）通報警察機關確認行為人有吸食毒品情事之相關程序，另由第九十二條第一項及第四項規定授權之相關子法訂定，併予敘明。\n十、第二項、第七項及第十項未修正。現行第十一項至第十三項項次依序調整為第十二項至第十四項，內容未修正。"},{"bill":"202110223310000","text":"汽機車駕駛人，駕駛汽機車經測試檢定酒精濃度超過規定標準者，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"修正第一項，將施用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，及其相關罰則調移並增訂至第三十五條之三。"},{"bill":"202110223500000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車，第一款之情形並吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；第二款之情形並吊銷其駕駛執照；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，屬第二次違反第一項第二款規定者，按前次違反第一項所處罰鍰金額加罰新臺幣九萬元。第三次以上者均按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣三十萬元罰鍰，並均應當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，其屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣五十萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限：\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。其屬違反第一項第二款或拒絕接受其稽查、測試檢定者，並得沒入該車輛。\n前項沒入之汽機車所有人已盡告知本條處罰規定之義務，或縱加以相當注意，汽機車駕駛人仍駕駛汽機車違反第一項第二款或拒絕接受其稽查、測試檢定者，汽機車所有人不受沒入之處罰。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n經警察機關確認有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品，吊銷其駕駛執照。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、因應近期施用毒品後駕車肇事致人死傷案件頻傳，嚴重危害道路交通安全，引發社會高度關注，為遏止日趨嚴重之毒駕情形，爰檢討毒駕相關處罰或駕駛執照管理規定。\n二、修正第一項：因吸毒本身涉犯刑事法令，毒駕之危害性比酒駕更甚嚴重，爰增訂對毒駕者吊銷其駕駛執照之處罰規定。\n三、修正第三項：現行毒駕初犯依違反道路交通管理事件統一裁罰基準表已係第一項所定罰鍰最高額處罰，考量毒駕比酒駕屬更惡性違規，應有再加重處罰之需要，爰加重第二次以上違反毒駕行為之罰鍰。\n四、修正第四項、第五項：考量吸毒本身涉犯刑事法令，毒駕之危害性比酒駕更甚嚴重，爰配套提高拒絕接受其稽查或測試檢定及其累犯之罰鍰額度。\n五、修正第八項：為強化同車乘客勸阻毒駕之社會責任，爰修正現行第八項規定，將現行酒駕事由列為第一款，並新增第二款納入毒駕情形。\n六、修正第九項：為達有效嚇阻毒駕，並加強汽車所有人善盡車輛管理責任，爰增訂違反第一項第二款或拒絕接受其稽查、測試檢定者，沒入該車輛。且汽機車所有人與駕駛人為非屬同一人時，亦適用沒入車輛規定。\n七、增訂第十項：汽車所有人擁有支配管領車輛之權限，對於其使用方式、用途、供何人使用等，得加以篩選控制，爰有擔保汽車使用者具備法定資格及駕駛行為合於交通管理規範之義務。為督促汽車所有人善盡車輛管理責任，增訂第十項。\n八、增訂第十二項：為防患未然，並從源頭管理加強防制，以避免毒駕情形，爰增訂吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品，吊銷其駕駛執照。\n九、現行條文第二項、第六項至第七項、第十項未修正，第十一項至第十三項配合調整項次"},{"bill":"202110222770000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車，第一款之情形並吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；第二款之情形並吊銷其駕駛執照；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，屬第二次違反第一項第二款規定者，按第一項所定罰鍰最高額加罰一倍。第三次以上者均按前次違反本項所處罰鍰金額再加罰第一項所定罰鍰最高額，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣二十七萬元罰鍰，並均應當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項規定者，處新臺幣三十六萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣四十五萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項或陸海空軍刑法第五十四條第一項嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限：\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。其屬違反第一項第二款，或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關取得行為人尿液檢驗報告數值確認後，吊銷其駕駛執照。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、第一項第二款毒駕初犯處罰由現行的「吊扣駕照一至二年」加重為「吊銷駕照」。第三項則調高二次以上毒駕累犯之罰鍰，以機車毒駕為例，依照違反道路交通管理事件統一裁罰基準表，第一次處最高九萬元。本次修正後，第二次即處八萬元，後續每次均依前次金額累加九萬元，累計無上限。若是汽車，第一次處最高額十二萬元，第二次處二十四萬元。此外，第四項與第五項亦同步調高拒絕毒駕稽查或測試檢定及其累犯之罰鍰，不分車種首次規避處二十七萬元，第二次處四十五萬元，後續每次按前次金額累加十八萬元，累計無上限。\n二、考量陸海空軍刑法第五十四條第一項第一款及第二款亦屬針對軍職人員酒駕、毒駕之懲處規定，爰於第六項明確將該罪名納入規範範疇。同時，為強化同車乘客共同勸阻毒駕之社會責任，第八項亦進行修正，將現行之酒駕事由獨立列為第一款，並特別增訂第二款有關毒駕之同乘乘客處罰規定。\n三、第九項後段增訂拒絕接受毒駕稽查測試，或毒駕而肇事致人重傷或死亡之情形，將原定得沒入修正為強制沒入汽機車，且縱使車主與駕駛人非屬同一人亦同。然而，本條屬行政罰，依行政罰法第二十二條第一項精神，若非受處罰者所有之物，須所有人具故意或重大過失始得沒入；因此，若車主於出租時已盡告知義務，而因承租人個人毒駕違規受牽連，得依法舉證免受沒入處分。\n四、增訂第十一項規定，凡經警察機關取得行為人尿液檢驗報告數值確認後確認有吸食毒品、迷幻藥、麻醉藥品或其相類似管制藥品者，即直接吊銷其駕駛執照，不以其是否有實際駕駛汽機車為必要條件。\n五、第二項、第七項及第十項未修正。現行第十一項至第十三項項次依序調整為第十二項至第十四項，內容未修正。"},{"bill":"202110223000000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車，第一款之情形並吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；第二款之情形並吊銷其駕駛執照；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，屬第二次違反第一項第二款規定者，按第一項所定罰鍰最高額加罰新臺幣九萬元。第三次以上者均按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣二十七萬元罰鍰，並均應當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項規定者，處新臺幣三十六萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣四十五萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項或陸海空軍刑法第五十四條第一項嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限：\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，沒入該車輛。其屬違反第一項第二款，或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、依行政罰法第二十六條第一項及第二項規定，一行為同時觸犯刑事法律及違反行政法上義務規定者，依刑事法律處罰之。但其行為應處以其他種類行政罰或得沒入之物而未經法院宣告沒收者，亦得裁處之。如經不起訴處分、緩起訴處分確定或為無罪、免訴、不受理、不付審理、不付保護處分、免刑、緩刑之裁判確定者，得依違反行政法上義務規定裁處之。是以，吸食毒品後駕車此嚴重危害道路交通安全之行為，如同時涉犯本條之行政罰，與刑法第一百八十五條之三及陸海空軍刑法第五十四條之刑事罰者，原則優先依刑事法論處，先予敘明。\n二、因應近期吸食毒品後駕車肇事致人死傷案件頻傳，嚴重危害道路交通安全，引發社會高度關注，且查近三年警察機關取締毒駕件數，自一百十二年之八百二十七件，遽增至一百十四年之八千六百四十五件，增幅達約百分之九百四十五，而一百十五年二月底止已達二千六百餘件，為遏止日趨嚴重之毒駕情形，爰檢討毒駕相關處罰或駕駛執照管理規定。\n三、因吸食毒品等行為涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰將第一項對毒駕行為之處罰由現行吊扣駕駛執照一年至二年修正為吊銷駕駛執照。\n四、現行毒駕初犯按違反道路交通管理事件統一裁罰基準表已依第一項所定罰鍰最高額處罰，考量毒駕比酒駕之違規惡性更為嚴重，應有再加重處罰之需要，爰修正第三項，加重第二次以上違反毒駕行為之罰鍰。以機車毒駕為例，第一次處新臺幣九萬元（最高額處罰），第二次處新臺幣十八萬元，後續皆按前次金額累加新臺幣九萬元，累計無上限。\n五、考量吸食毒品等行為涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰修正第四項及第五項，提高拒絕接受其稽查或測試檢定及其累犯之罰鍰額度，不分車種第一次處新臺幣二十七萬元、第二次處新臺幣四十五萬元，後續皆按前次金額累加新臺幣十八萬元，累計無上限。\n六、考量陸海空軍刑法第五十四條第一項第一款及第二款亦屬酒駕之規定，爰於第六項增列該罪之規定。\n七、為強化同車乘客勸阻毒駕之社會責任，爰修正第八項，將現行酒駕事由列為第一款，並增訂第二款毒駕之情形。\n八、修正第九項：\n(一)為達有效嚇阻毒駕，並加強汽機車所有人善盡車輛管理責任，爰於後段增訂違反第一項第二款或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。且汽機車所有人與駕駛人非屬同一人時，亦適用沒入車輛之規定；現行所定因而肇事致人重傷或死亡部分，考量處罰之衡平性，亦應沒入該車輛，而無裁量空間，爰將所定「得沒入」修正為「沒入」。\n(二)另本條屬行政罰，依行政罰法第二十二條第一項規定，不屬於受處罰者所有之物，因所有人之故意或重大過失，致使該物成為違反行政法上義務行為之工具者，仍得裁處沒入。則如非出於故意或重大過失者，不予處罰，爰汽機車所有人例如租賃車輛業者將汽機車出租交予承租人使用，事前已善盡告知本條處罰規定之義務，承租人仍毒駕違規，得予舉證免罰，併予敘明。\n九、增訂第十一項：\n(一)為防患未然，並從源頭管理加強防制，遏止毒駕行為，以保障廣大用路人之安全，爰增訂吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n(二)經警察機關取得行為人尿液檢驗報告為陽性或陰性有數值，確認有吸食毒品時，警察機關即得依違反本項規定舉發，並移由處罰機關執行吊銷駕駛執照處分，不問其是否有駕駛汽機車之行為。\n(三)有關相關執法機關（如法務部調查局或國防部憲兵指揮部等）通報警察機關確認行為人有吸食毒品情事之相關程序，另由第九十二條第一項及第四項規定授權之相關子法訂定，併予敘明。\n十、第二項、第七項及第十項未修正。現行第十一項至第十三項項次依序調整為第十二項至第十四項，內容未修正。"},{"bill":"202110223480000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車，第一款之情形並吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；第二款之情形並吊銷其駕駛執照；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，屬第二次違反第一項第二款規定者，按第一項所定罰鍰最高額加罰新臺幣九萬元。第三次以上者均按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣二十七萬元罰鍰，並均應當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項規定者，處新臺幣三十六萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣四十五萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項或陸海空軍刑法第五十四條第一項嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限：\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，沒入該車輛。其屬違反第一項第二款，或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、依行政罰法第二十六條第一項及第二項規定，一行為同時觸犯刑事法律及違反行政法上義務規定者，依刑事法律處罰之。但其行為應處以其他種類行政罰或得沒入之物而未經法院宣告沒收者，亦得裁處之。如經不起訴處分、緩起訴處分確定或為無罪、免訴、不受理、不付審理、不付保護處分、免刑、緩刑之裁判確定者，得依違反行政法上義務規定裁處之。是以，吸食毒品後駕車此嚴重危害道路交通安全之行為，如同時涉犯本條之行政罰，與刑法第一百八十五條之三及陸海空軍刑法第五十四條之刑事罰者，原則優先依刑事法論處，先予敘明。\n二、因應近期吸食毒品後駕車肇事致人死傷案件頻傳，嚴重危害道路交通安全，引發社會高度關注，且查近三年警察機關取締毒駕件數，自一百十二年之八百二十七件，遽增至一百十四年之八千六百四十五件，增幅達約百分之九百四十五，而一百十五年二月底止已達二千六百餘件，為遏止日趨嚴重之毒駕情形，爰檢討毒駕相關處罰或駕駛執照管理規定。\n三、因吸食毒品等行為涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰將第一項對毒駕行為之處罰由現行吊扣駕駛執照一年至二年修正為吊銷駕駛執照。\n四、現行毒駕初犯按違反道路交通管理事件統一裁罰基準表已依第一項所定罰鍰最高額處罰，考量毒駕比酒駕之違規惡性更為嚴重，應有再加重處罰之需要，爰修正第三項，加重第二次以上違反毒駕行為之罰鍰。以機車毒駕為例，第一次處新臺幣九萬元（最高額處罰），第二次處新臺幣十八萬元，後續皆按前次金額累加新臺幣九萬元，累計無上限。\n五、考量吸食毒品等行為涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰修正第四項及第五項，提高拒絕接受其稽查或測試檢定及其累犯之罰鍰額度，不分車種第一次處新臺幣二十七萬元、第二次處新臺幣四十五萬元，後續皆按前次金額累加新臺幣十八萬元，累計無上限。\n六、考量陸海空軍刑法第五十四條第一項第一款及第二款亦屬酒駕之規定，爰於第六項增列該罪之規定。\n七、為強化同車乘客勸阻毒駕之社會責任，爰修正第八項，將現行酒駕事由列為第一款，並增訂第二款毒駕之情形。\n八、修正第九項：\n(一)為達有效嚇阻毒駕，並加強汽機車所有人善盡車輛管理責任，爰於後段增訂違反第一項第二款或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。且汽機車所有人與駕駛人非屬同一人時，亦適用沒入車輛之規定；現行所定因而肇事致人重傷或死亡部分，考量處罰之衡平性，亦應沒入該車輛，而無裁量空間，爰將所定「得沒入」修正為「沒入」。\n(二)另本條屬行政罰，依行政罰法第二十二條第一項規定，不屬於受處罰者所有之物，因所有人之故意或重大過失，致使該物成為違反行政法上義務行為之工具者，仍得裁處沒入。則如非出於故意或重大過失者，不予處罰，爰汽機車所有人例如租賃車輛業者將汽機車出租交予承租人使用，事前已善盡告知本條處罰規定之義務，承租人仍毒駕違規，得予舉證免罰，併予敘明。\n九、增訂第十一項：\n(一)為防患未然，並從源頭管理加強防制，遏止毒駕行為，以保障廣大用路人之安全，爰增訂吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n(二)經警察機關取得行為人尿液檢驗報告為陽性或陰性有數值，確認有吸食毒品時，警察機關即得依違反本項規定舉發，並移由處罰機關執行吊銷駕駛執照處分，不問其是否有駕駛汽機車之行為。\n(三)有關相關執法機關（如法務部調查局或國防部憲兵指揮部等）通報警察機關確認行為人有吸食毒品情事之相關程序，另由第九十二條第一項及第四項規定授權之相關子法訂定，併予敘明。\n十、第二項、第七項及第十項未修正。現行第十一項至第十三項項次依序調整為第十二項至第十四項，內容未修正。"}],"changed":true,"final":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬八千元以上十二萬元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上十五萬元以下罰鍰，並均當場移置保管該汽機車，第一款之情形並吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；第二款之情形依罰鍰最高額處罰並吊銷其駕駛執照；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，屬第二次違反第一項第二款規定者，按第一項所定罰鍰最高額加罰新臺幣九萬元。第三次以上者均按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣二十七萬元罰鍰，並均應當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項規定者，處新臺幣三十六萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣四十五萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項或陸海空軍刑法第五十四條第一項嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限：\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，沒入該車輛。其屬違反第一項第二款，或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n汽機車駕駛人於依違反第一項第二款規定，吊銷駕駛執照期間，仍駕駛非屬本人之汽機車違反第一項第二款規定者，依其駕駛車輛分別依第一項或第三項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","finalWhy":"一、依行政罰法第二十六條第一項及第二項規定，一行為同時觸犯刑事法律及違反行政法上義務規定者，依刑事法律處罰之。但其行為應處以其他種類行政罰或得沒入之物而未經法院宣告沒收者，亦得裁處之。如經不起訴處分、緩起訴處分確定或為無罪、免訴、不受理、不付審理、不付保護處分、免刑、緩刑之裁判確定者，得依違反行政法上義務規定裁處之。是以，吸食毒品後駕車此嚴重危害道路交通安全之行為，如同時涉犯本條之行政罰，與刑法第一百八十五條之三及陸海空軍刑法第五十四條之刑事罰者，原則優先依刑事法論處，先予敘明。\n二、因應近期吸食毒品後駕車肇事致人死傷案件頻傳，嚴重危害道路交通安全，引發社會高度關注，且查近三年警察機關取締毒駕件數，自一百十二年之八百二十七件，遽增至一百十四年之八千六百四十五件，增幅達約百分之九百四十五，而一百十五年二月底止已達二千六百餘件，為遏止日趨嚴重之毒駕情形，爰檢討毒駕相關處罰或駕駛執照管理規定。\n三、修正第一項：\n（一）考量酒毒駕係屬重大惡性違規，較無照駕駛嚴重，而現行無照駕駛汽機車罰鍰下限皆較酒毒駕為高，爰提高酒毒駕罰鍰上下限，以符衡平。\n（二）另因吸食毒品等行為已涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰將第一項對毒駕行為之處罰明定依罰鍰最高額處罰，並將現行吊扣駕駛執照一年至二年修正為吊銷駕駛執照。\n四、原毒駕初犯按違反道路交通管理事件統一裁罰基準表已依第一項所定罰鍰最高額處罰，考量毒駕比酒駕之違規惡性更為嚴重，應有再加重處罰之需要，爰修正第三項，加重第二次以上違反毒駕行為之罰鍰。以機車毒駕為例，第一次處新臺幣九萬元（最高額處罰），第二次處新臺幣十八萬元，後續皆按前次金額累加新臺幣九萬元，累計無上限。\n五、考量吸食毒品等行為涉犯刑事法律，毒駕之危害性比酒駕更為嚴重，爰修正第四項及第五項，提高拒絕接受其稽查或測試檢定及其累犯之罰鍰額度，不分車種第一次處新臺幣二十七萬元、第二次處新臺幣四十五萬元，後續皆按前次金額累加新臺幣十八萬元，累計無上限。\n六、考量陸海空軍刑法第五十四條第一項第一款及第二款亦屬酒駕之規定，爰於第六項增列該罪之規定。\n七、為強化同車乘客勸阻毒駕之社會責任，爰修正第八項，將現行酒駕事由列為第一款，並增訂第二款毒駕之情形。\n八、修正第九項：\n（一）為達有效嚇阻毒駕，並加強汽機車所有人善盡車輛管理責任，爰於後段增訂違反第一項第二款或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。且汽機車所有人與駕駛人非屬同一人時，亦適用沒入車輛之規定；原所定因而肇事致人重傷或死亡部分，考量處罰之衡平性，亦應沒入該車輛，而無裁量空間，爰將所定「得沒入」修正為「沒入」。\n（二）另本條屬行政罰，依行政罰法第二十二條第一項規定，不屬於受處罰者所有之物，因所有人之故意或重大過失，致使該物成為違反行政法上義務行為之工具者，仍得裁處沒入。則如非出於故意或重大過失者，不予處罰，爰汽機車所有人例如租賃車輛業者將汽機車出租交予承租人使用，事前已善盡告知本條處罰規定之義務，承租人仍毒駕違規，得予舉證免罰，併予敘明。\n九、增訂第十一項：\n（一）為防患未然，並從源頭管理加強防制，遏止毒駕行為，以保障廣大用路人之安全，爰增訂吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n（二）經警察機關取得行為人尿液檢驗報告為陽性或陰性有數值，確認有吸食毒品時，警察機關即得依違反本項規定舉發，並移由處罰機關執行吊銷駕駛執照處分，不問其是否有駕駛汽機車之行為。\n（三）有關相關執法機關（如法務部調查局或國防部憲兵指揮部等）有義務配合應通報警察機關確認行為人有吸食毒品情事之相關程序，另由第九十二條第一項及第四項規定授權之相關子法訂定，併予敘明。\n十、增訂第十二項，毒駕行為人曾因毒駕受吊銷駕駛執照或不得再考領駕駛執照之處分，卻仍明知其已喪失駕駛資格，並駕駛非屬本人所有汽機車之方式再犯毒駕行為，顯示其對道路交通秩序及公共安全之漠視，且具有較高再犯危險性。為避免毒駕行為人利用他人車輛規避行政管制，爰明定其依第一項或第三項所處罰鍰加罰二分之一。\n十一、第二項、第七項及第十項未修正。原第十一項至第十三項項次依序調整為第十二項至第十四項，內容未修正。","review":{"note":"修正通過","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬八千元以上十二萬元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上十五萬元以下罰鍰，並均當場移置保管該汽機車，第一款之情形並吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；第二款之情形依罰鍰最高額處罰並吊銷其駕駛執照；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，屬第二次違反第一項第二款規定者，按第一項所定罰鍰最高額加罰新臺幣九萬元。第三次以上者均按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣二十七萬元罰鍰，並均應當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項規定者，處新臺幣三十六萬元罰鍰，屬拒絕接受第一項第二款稽查或測試檢定者，處新臺幣四十五萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項或陸海空軍刑法第五十四條第一項嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限：\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，沒入該車輛。其屬違反第一項第二款，或拒絕接受該款稽查或測試檢定者，亦沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，經警察機關確認後，吊銷其駕駛執照。\n汽機車駕駛人於依違反第一項第二款規定，吊銷駕駛執照期間，仍駕駛非屬本人之汽機車違反第一項第二款規定者，依其駕駛車輛分別依第一項或第三項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。"}},{"no":"第三十五條之一","current":"汽車駕駛人經依第六十七條第五項規定考領駕駛執照，應申請登記配備有車輛點火自動鎖定裝置之汽車後，始發給駕駛執照；不依規定駕駛配備車輛點火自動鎖定裝置汽車者，處新臺幣六萬元以上十二萬元以下罰鍰，並當場移置保管該汽車。\n汽車駕駛人依前項規定申請登記而不依規定使用車輛點火自動鎖定裝置者，處新臺幣一萬元以上三萬元以下罰鍰，並當場移置保管該汽車。\n第一項車輛點火自動鎖定裝置由他人代為使用解鎖者，處罰行為人新臺幣六千元以上一萬二千元以下罰鍰。\n第一項車輛點火自動鎖定裝置之規格功能、應配置車種、配置期間、管理及其他應遵行事項之辦法，由交通部會同內政部定之。","versions":[{"bill":"202110217450000","text":"汽車駕駛人經依第六十七條第五項或第六項規定考領駕駛執照，應申請登記配備有車輛點火自動鎖定裝置之汽車後，始發給駕駛執照；不依規定駕駛配備車輛點火自動鎖定裝置汽車者，處新臺幣六萬元以上十二萬元以下罰鍰，並當場移置保管該汽車。\n汽車駕駛人依前項規定申請登記而不依規定使用車輛點火自動鎖定裝置或其他經主管機關公告之防制再犯設備者，處新臺幣一萬元以上三萬元以下罰鍰，並當場移置保管該汽車。\n第一項車輛點火自動鎖定裝置或其他經主管機關公告之防制再犯設備，由他人代為使用解鎖者，處罰行為人新臺幣六千元以上一萬二千元以下罰鍰。\n第一項車輛點火自動鎖定裝置或其他經主管機關公告之防制再犯設備之規格功能、應配置車種、配置期間、管理及其他應遵行事項之辦法，由交通部會同內政部定之。","note":"一、為強化酒駕、毒駕再犯防制機制，降低再犯風險，爰配合第六十七條修正，增列依同條第六項規定重新考領駕駛執照者，亦應配備車輛點火自動鎖定裝置或其他防制再犯設備。\n二、考量科技發展及實務執行需要，將現行「車輛點火自動鎖定裝置」規定，修正擴及「其他經主管機關公告之防制再犯設備」，以保留制度彈性及提升防制效果。\n三、配合前開修正，增訂未依規定使用其他防制再犯設備之處罰規定，以確保設備實際使用及制度落實。\n四、增列由他人代為使用解鎖其他防制再犯設備之處罰規定，以防杜規避管理及逃避監控情形。\n五、配合修正授權規定，明定其他防制再犯設備之規格功能、配置期間、管理及其他應遵行事項，由交通部會同內政部定之，以利執行。"},{"bill":"202110219460000","text":"汽機車駕駛人有下列各款情形之一者，處新臺幣二十七萬元以上五十四萬元以下罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行前條第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受前條第一項測試檢定。\n三、接受前條第一項測試檢定前，施用或服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受前條第一項測試檢定前，施用或服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n前項第三款、第四款所施用毒品為第一級、第二級毒品或其相類似之管制藥品者，依其所處罰鍰加倍處罰；所施用毒品為第三級、第四級毒品、迷幻藥、麻醉藥品或其相類似之管制藥品或其相類似之管制藥品者，依其所處罰鍰加罰二分之一。\n本條例中華民國○年○月○日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二十七萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三各款嫌疑，拒絕接受第三十五條第一項測試檢定或無法實施測試檢定者，依下列規定處理：\n一、涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）。\n二、涉犯刑法第一百八十五條之三第二項第一款或第二款嫌疑者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施非侵入式濫用藥物尿液檢驗（以下簡稱尿液採驗）。\n三、前二款之情形，司法警察官或司法警察有相當理由認為情況急迫時，得將汽機車駕駛人先行移由醫療或檢驗機構，依第一款或第二款規定，實施血液測試檢定或尿液採驗，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定或尿液採驗者得於受驗後十日內，聲請該管法院撤銷之。\n第三十五條第一項毒品唾液快篩檢定及前項血液測試檢定與尿液採驗結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關唾液、血液、尿液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、修正本條文；現行條文三十五條第四項至第六項配合修正，移至修正後第一項、第三項、第四項；新增第二項。\n二、緣施用新興毒品後為危險駕駛案例日漸嚴重，不僅已造成諸多家庭破碎與悲劇，業已形成嚴重民怨，且審酌施用毒品結合危險駕駛行為之惡性更為重大，現行刑法第一百八十五條之三修法方向亦朝向將酒駕與毒駕分別處理，故配合刑法第一百八五條之三條之修正草案，規範毒駕之強制採驗處分，先予敘明。\n三、又，鑒於毒品唾液快篩試劑仍有其技術上之侷限性，如事故發生後駕駛人拒絕檢定或無法檢定（如唾液過少或行為人受傷等情形），亦無法源依據授權執法單位，得比照同條第六項酒駕強制檢定規定，將毒駕行為人移送醫療或檢驗機構施行進一步採驗措施，嚇阻性與預防性顯有不足；爰此，參考111年憲判字第16號意旨及《刑事訴訟法》第二百零五條之二規定，針對事故後拒絕受測或無法檢定者，得依照檢察官保留原則，進行非侵入式之尿液採驗，以期達到毒駕防制效果。\n四、次按唾液、尿液與血液之測試結果，除得作為判斷是否違反本條、刑法第一百八十五條之三各款利用，其中檢體包含之基因遺傳及疾病資訊，亦涉及個人隱私資料保護；復審酌上開體液亦具有疾病傳染性，遂基於保障訴訟程序正義、個人隱私保護及公共衛生疾病防治等目的，自應有專業、合法之處理程序，併予敘明。"},{"bill":"202110222600000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，機車駕駛人處新臺幣十萬元以上六十萬元以下罰鍰，汽車駕駛人處新臺幣十五萬元以上九十萬元以下罰鍰，並沒入該汽機車及吊銷其駕駛執照；附載未滿十二歲兒童或因而肇事致人受傷、重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n本條例中華民國○年○月○日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額加罰新臺幣三十萬元，並均應當場沒入該汽機車、吊銷其駕駛執照，公路主管機關應公布其姓名、照片及違法事實。\n汽機車駕駛人有下列各款情形之一者，處新臺幣三十萬元罰鍰，並當場沒入該汽機車、吊銷其駕駛執照；如肇事致人受傷、重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國○年○月○日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第三項規定者，處新臺幣六十萬元罰鍰，並應當場沒入該汽機車、吊銷其駕駛執照，並不得再考領。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，年滿十八歲之同車乘客處新臺幣一萬五千元以上六萬以下罰鍰。但年滿七十歲、心智障礙、能證明不知情或汽車運輸業之乘客，不在此限。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項至第四項規定之一者，依其駕駛車輛分別依第一項至第四項所處罰鍰加罰二分之一。","note":"一、現行條文第三十五條有關吸食毒品後駕駛汽機車的行為規範，移列本條文。現行條文第三十五條之一移列為第三十五條之三。\n二、修正第一項，針對毒駕行為加重處罰，提高罰鍰金額上下限，一律沒入其所駕駛的汽機車，並吊銷其駕駛執照。\n三、因第一項規定對毒駕者一律沒入汽機車並吊銷駕駛執照，現行條文第三十五條第二項針對吊扣期間之規定已無從適用，刪除之。\n四、修正現行條文第三十五條第三項，加重毒駕者於十年內再犯之罰鍰，並均應公告姓名、照片及違法事實，並移列為第二項。\n五、修正現行條文第三十五條第四項，加重拒絕毒駕臨檢、故意在檢測前吸食毒品、迷幻藥、麻醉藥品或其他相類之物以影響檢測結果正確性之行為之處罰，並移列為第三項。\n六、修正現行條文第三十五條第五項，提高十年內再犯違反前項拒檢或妨礙結果正確性行為之處罰，一律沒入車輛並永久吊銷駕駛執照，刪除有關吊扣車輛規定，並移列為第四項。\n七、現行條文第三十五條第六項及第十三項有關強制採驗的規定，移列增訂為第三十五條之二。\n八、現行條文第三十五條第七項未修正，移列為第五項。\n九、修正現行條文第三十五條第八項要件規定為「經測試檢定有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品」，並就與毒駕者同車之滿十八歲乘客加重處罰，並增訂不知情者免罰之例外規定，並移列為第六項。\n十、因修正條文第一項至第四項已對毒價者一概沒入車輛並吊銷駕駛執照，現行條文第九項有關吊扣駕照、移置車輛規定已無從適用，刪除之。\n十一、因修正條文項次調整，修正第十項內文，並移列為第七項。\n十二、因修正條文第一項至第四項已對毒駕者一概沒入車輛，現行條文第三十五條第十一項、第十二項有關移置車輛相關規定已無從適用，刪除之。"}],"changed":false,"final":"汽車駕駛人經依第六十七條第五項規定考領駕駛執照，應申請登記配備有車輛點火自動鎖定裝置之汽車後，始發給駕駛執照；不依規定駕駛配備車輛點火自動鎖定裝置汽車者，處新臺幣六萬元以上十二萬元以下罰鍰，並當場移置保管該汽車。\n汽車駕駛人依前項規定申請登記而不依規定使用車輛點火自動鎖定裝置者，處新臺幣一萬元以上三萬元以下罰鍰，並當場移置保管該汽車。\n第一項車輛點火自動鎖定裝置由他人代為使用解鎖者，處罰行為人新臺幣六千元以上一萬二千元以下罰鍰。\n第一項車輛點火自動鎖定裝置之規格功能、應配置車種、配置期間、管理及其他應遵行事項之辦法，由交通部會同內政部定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第三十五條之二","current":"汽車運輸業所屬之職業駕駛人因執行職務，駕駛汽車有違反第三十五條第一項、第三項、第四項或第五項之情形，致他人受有損害而應負賠償責任者，法院得因被害人之請求，依侵害情節，酌定損害額三倍以下之懲罰性損害賠償金令該汽車運輸業者賠償。但選任受僱人及監督其職務之執行，已盡相當之注意而仍不免發生損害者，汽車運輸業者不負賠償責任。\n前項懲罰性損害賠償金請求權，自請求權人知有損害及賠償義務人時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","versions":[{"bill":"202110218770000","text":"汽車運輸業所屬之職業駕駛人因執行職務，駕駛汽車有違反第三十五條第一項、第二項、第四項、第五項或第六項之情形，致他人受有損害而應負賠償責任者，法院得因被害人之請求，依侵害情節，酌定損害額三倍以下之懲罰性損害賠償金令該汽車運輸業者賠償。但選任受僱人及監督其職務之執行，已盡相當之注意而仍不免發生損害者，汽車運輸業者不負賠償責任。\n前項懲罰性損害賠償金請求權，自請求權人知有損害及賠償義務人時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"配合第三十五條修正，爰修正本條所涉引用項次，由現行第一項、第三項、第四項或第五項，修正為第一項、第二項、第四項、第五項或第六項，以維持法條一致性。"},{"bill":"202110219460000","text":"汽車所有人，明知汽機車駕駛人有第三十五條第一項各款情形，而不予禁止駕駛者，分別依第三十五條第一項規定罰鍰處罰之。\n汽機車駕駛人有違反第三十五條第一項各款情形，同車之年滿十八歲乘客，處新臺幣三萬元以上十八萬以下罰鍰；但年滿七十歲、心智障礙或汽車運輸業之同車乘客，不在此限。\n租賃車業者已盡告知第三十五條、第三十五條之一處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第三十五條、第三十五條之一者，依其駕駛車輛分別依第三十五條、第三十五條之一所處罰鍰加罰二分之一。\n汽機車駕駛人有第三十五條、第三十五條之一情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n違反第三十五條第一項、第三項、第四項、第三十五條之一第一項、第三項之情形之一，吊扣該汽機車牌照四年，並於移置保管該汽機車時，扣繳其牌照；因而致人重傷或死亡者，該車輛不問屬於受處罰人與否，沒入之。","note":"一、修正本條文。現行條文第三十五條第七項、第八項、第十項至第十二項，配合修正移至本條，並酌為文字調整。\n二、按現行條文第三十五條第七項，僅於汽機車所有人知悉有駕駛人有毒駕、酒駕情事者，設有連帶處罰規定；乘客部分則僅有酒駕同車者有連帶處罰條文，而漏未規定毒駕乘客之連帶責任。鑒於毒駕之危害性不亞於酒駕，毒品使用後效應亦會影響駕駛人之注意力及判斷力，無論乘客是否有同樣施用毒品行為，對於可能引起危險駕駛之行為亦應有所警覺，並應主動制止，爰比照同法酒駕連坐罰之規定，針對未拒絕毒駕者之同車搭乘乘客，明文訂定連帶處罰規定，以達「防制毒駕、人人有責」之目的。"},{"bill":"202110220910000","text":"汽車運輸業所屬之職業駕駛人因執行職務，駕駛汽車有違反第三十五條第一項、第二項、第五項至第七項之情形，致他人受有損害而應負賠償責任者，法院得因被害人之請求，依侵害情節，酌定損害額三倍以下之懲罰性損害賠償金令該汽車運輸業者賠償。但選任受僱人及監督其職務之執行，已盡相當之注意而仍不免發生損害者，汽車運輸業者不負賠償責任。\n前項懲罰性損害賠償金請求權，自請求權人知有損害及賠償義務人時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、配合第三十五條修正及項次調整，將第一項所引第三十五條之項次，修正為第一項、第二項、第五項至第七項。\n二、第二項未修正。"},{"bill":"202110222600000","text":"汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項或陸海空軍刑法第五十四條第一項嫌疑，拒絕接受或發生交通事故無法實施前二條第一項測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施唾液、毛髮及血液檢體採樣及酒精濃度測試檢定（以下簡稱檢體測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施檢體測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受檢體測試檢定者得於受檢體測試檢定後十日內，聲請該管法院撤銷之。\n前項檢體測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關唾液、毛髮及血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、現行條文第三十五條之二移列為第三十五條之四。\n二、配合毒駕單獨立法，增訂第三十五條之一規定，並參考中華民國刑法第三百零三條、商標法第九十七條，將現行條文第三十五條第六項及第十三項，分別移列增訂為第三十五條之二第一項及第二項，以作為前二條第一項共同規定。"},{"bill":"202110223020000","text":"汽車運輸業所屬之職業駕駛人因執行職務，駕駛汽車有違反第三十五條第一項、第三項、第四項或第五項之情形，或依第三十五條之三規定受駕駛資格限制者，致他人受有損害而應負賠償責任者，法院得因被害人之請求，依侵害情節，酌定損害額三倍以下之懲罰性損害賠償金令該汽車運輸業者賠償。但選任受僱人及監督其職務之執行，已盡相當之注意而仍不免發生損害者，汽車運輸業者不負賠償責任。\n前項懲罰性損害賠償金請求權，自請求權人知有損害及賠償義務人時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、修正第一項：因引進「未開車之吸毒者亦暫行限制駕駛資格」新制度。故為防止汽車運輸業者明知旗下駕駛人已被查獲吸毒、進入戒癮階段，卻仍縱容其駕駛營業車輛上路，於第一項增列「或依第三十五條之三規定受駕駛資格限制者」。將此類「源頭受限卻仍出車」，一併納入三倍懲罰性賠償之適用範圍，確保民事連坐機制無漏洞。\n二、第二項未修正。"}],"changed":false,"final":"汽車運輸業所屬之職業駕駛人因執行職務，駕駛汽車有違反第三十五條第一項、第三項、第四項或第五項之情形，致他人受有損害而應負賠償責任者，法院得因被害人之請求，依侵害情節，酌定損害額三倍以下之懲罰性損害賠償金令該汽車運輸業者賠償。但選任受僱人及監督其職務之執行，已盡相當之注意而仍不免發生損害者，汽車運輸業者不負賠償責任。\n前項懲罰性損害賠償金請求權，自請求權人知有損害及賠償義務人時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第三十五條之三","current":"汽車駕駛人經依第六十七條第五項規定考領駕駛執照，應申請登記配備有車輛點火自動鎖定裝置之汽車後，始發給駕駛執照；不依規定駕駛配備車輛點火自動鎖定裝置汽車者，處新臺幣六萬元以上十二萬元以下罰鍰，並當場移置保管該汽車。\n汽車駕駛人依前項規定申請登記而不依規定使用車輛點火自動鎖定裝置者，處新臺幣一萬元以上三萬元以下罰鍰，並當場移置保管該汽車。\n第一項車輛點火自動鎖定裝置由他人代為使用解鎖者，處罰行為人新臺幣六千元以上一萬二千元以下罰鍰。\n第一項車輛點火自動鎖定裝置之規格功能、應配置車種、配置期間、管理及其他應遵行事項之辦法，由交通部會同內政部定之。","versions":[{"bill":"202110219570000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之情形，機車駕駛人處新臺幣五萬元以上十萬元以下罰鍰，汽車駕駛人處新臺幣十萬元以上三十萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照二年至五年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照三年至六年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十五年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十五萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣三十萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十五年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車所有人，明知汽機車駕駛人有第一項情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之情形，年滿十八歲之同車乘客處新臺幣一萬元以上三萬元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照四年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n汽機車駕駛人曾違反本條規定或刑法第一百八十五條之五規定，經依法吊扣、吊銷駕駛執照或不得再考領駕駛執照，仍駕駛汽機車再違反本條規定者，依第一項所處罰鍰加罰二分之一。","note":"一、本條新增。\n二、鑑於新興毒品蔓延，毒駕者於施用毒品後將影響其生理認知與車輛操控能力，等同將車輛轉化為對用路人之不確定威脅，亦對公共安全有極大之潛在危害性。故為建立實質嚇阻效果，爰將毒駕處罰獨立設條，其基本罰鍰提高，駕駛執照吊扣期限亦延長，藉以嚴懲毒駕行為。\n三、配合毒駕之高社會危害性，第三項及第五項之管制年限亦一併訂為「十五年內」，以強力阻絕毒駕累犯之僥倖空間。\n四、為建構全面防堵之周邊共犯責任，第七項提高同車乘客之連帶處罰金額為「一萬元以上三萬元以下」罰鍰，促使同車者盡切實監督與勸阻之義務。\n五、第八項至第十二項移列現行條文相應規範。其中第八項考量毒駕行為之高度危險惡性，爰將毒駕車輛牌照扣繳年限延長為四年，並保留因而肇事致人重傷或死亡得沒入車輛之規定；其餘項次亦配合本條獨立設條進行條項對照移列，以資周延。"},{"bill":"202110219460000","text":"汽車駕駛人經依第六十七條第五項規定考領駕駛執照，應申請登記配備有車輛點火自動鎖定裝置之汽車後，始發給駕駛執照；不依規定駕駛配備車輛點火自動鎖定裝置汽車者，處新臺幣六萬元以上十二萬元以下罰鍰，並當場移置保管該汽車。\n汽車駕駛人依前項規定申請登記而不依規定使用車輛點火自動鎖定裝置者，處新臺幣一萬元以上三萬元以下罰鍰，並當場移置保管該汽車。\n第一項車輛點火自動鎖定裝置由他人代為使用解鎖者，處罰行為人新臺幣六千元以上一萬二千元以下罰鍰。\n第一項車輛點火自動鎖定裝置之規格功能、應配置車種、配置期間、管理及其他應遵行事項之辦法，由交通部會同內政部定之。","note":"一、本條新增。\n二、現行條文第三十五條之一，配合修正移列。"},{"bill":"202110222600000","text":"汽車駕駛人經依第六十七條第五項規定考領駕駛執照，應申請登記配備有車輛點火自動鎖定裝置之汽車後，始發給駕駛執照；不依規定駕駛配備車輛點火自動鎖定裝置汽車者，處新臺幣六萬元以上十二萬元以下罰鍰，並當場移置保管該汽車。\n汽車駕駛人依前項規定申請登記而不依規定使用車輛點火自動鎖定裝置者，處新臺幣一萬元以上三萬元以下罰鍰，並當場移置保管該汽車。\n第一項車輛點火自動鎖定裝置由他人代為使用解鎖者，處罰行為人新臺幣六千元以上一萬二千元以下罰鍰。\n第一項車輛點火自動鎖定裝置之規格功能、應配置車種、配置期間、管理及其他應遵行事項之辦法，由交通部會同內政部定之。","note":"本條新增，由現行條文第三十五條之一移列，內容未修正。"},{"bill":"202110223020000","text":"汽車駕駛人經司法機關、檢察機關或警察機關查獲施用第一級或第二級毒品，無論其有無駕駛車輛之行為，主管機關應對其為暫時性駕駛失能宣告，並扣留其駕駛執照。\n前項處分之駕駛人，自查獲之日起算滿一年，且符合下列各款條件者，得申請發還駕駛執照：\n一、完成醫療機構之戒癮治療，並取得完成證明。\n二、於扣留期間，定期接受監理機關指派之毒品複驗，其結果皆為陰性反應。\n施用第三級或第四級毒品者，準用第一項之規定，扣留其駕駛執照六個月，並應接受毒品危害講習及定期複驗。","note":"一、本條新增。\n二、第一項：（創設「暫時性駕駛失能宣告」制度）：針對「施用第一、二級毒品者，即使無駕車行為亦應管制駕駛資格」，但若「直接吊銷」恐將面臨不當聯結與過度侵害人民權利之違憲爭議，故改採「暫時性駕駛失能宣告」並「扣留駕照」，法理上較為妥適。\n三、第二項（誘因促進戒癮）：明定扣留駕駛執照一年期間，駕駛人必須完成「醫療戒癮治療」且「定期複驗尿液皆為陰性」，方能取回駕照，以回歸職場之權利為誘因，促使施用者積極戒毒，非一味處罰。\n四、第三項：針對吸食三、四級毒品（如愷他命、依托咪酯「喪屍菸彈」）者，因其對社會危害巨大，扣留駕照六個月並強制接受危害講習與複驗，全面防堵毒駕。"},{"bill":"202110223310000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場沒入該汽機車及吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；致人重傷或死亡者，當場沒入該汽機車及吊銷其駕駛執照，並不得再考領。\n本條例中華民國○年○月○日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，吊銷其駕駛執照不得再考領，公路主管機關得公布其姓名、照片及違法事實，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，當場沒入該汽機車及吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場沒入該汽機車及吊銷其駕駛執照；如肇事致人重傷或死亡者，當場沒入該汽機車及吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國○年○月○日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第三項規定者，處新臺幣三十六萬元罰鍰，吊銷其駕駛執照不得再考領，公路主管機關得公布其姓名、照片及違法事實，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，當場沒入該汽機車及吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項及第一百八十五條之五嫌疑，拒絕接受或發生交通事故無法實施第一項測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及血液測試檢定；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，年滿十八歲之同車乘客處新臺幣六千以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項至第四項規定之一者，依其駕駛車輛分別依第一項至第四項所處罰鍰加罰二分之一。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第五項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、本條新增。\n二、鑒於施用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者後駕車（下稱毒駕），與酒後駕車之危害性不同，爰將毒駕部分另增訂於本條，以資區隔，並調高罰鍰及其他種類行政罰，以落實毒品零容忍政策。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第三十五條之四","current":"汽車運輸業所屬之職業駕駛人因執行職務，駕駛汽車有違反第三十五條第一項、第三項、第四項或第五項之情形，致他人受有損害而應負賠償責任者，法院得因被害人之請求，依侵害情節，酌定損害額三倍以下之懲罰性損害賠償金令該汽車運輸業者賠償。但選任受僱人及監督其職務之執行，已盡相當之注意而仍不免發生損害者，汽車運輸業者不負賠償責任。\n前項懲罰性損害賠償金請求權，自請求權人知有損害及賠償義務人時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","versions":[{"bill":"202110219460000","text":"汽車運輸業所屬之職業駕駛人因執行職務，駕駛汽車有違反第三十五條、第三十五條之一之情形，致他人受有損害而應負賠償責任者，法院得因被害人之請求，依侵害情節，酌定損害額三倍以下之懲罰性損害賠償金令該汽車運輸業者賠償。但選任受僱人及監督其職務之執行，已盡相當之注意而仍不免發生損害者，汽車運輸業者不負賠償責任。\n前項懲罰性損害賠償金請求權，自請求權人知有損害及賠償義務人時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、本條新增。\n二、現行條文第三十五條之二，配合修正移列，並酌為文字調整。"},{"bill":"202110222600000","text":"汽車運輸業所屬之職業駕駛人因執行職務，駕駛汽車有違反第三十五條第一項、第三項、第四項或第五項，或違反第三十五條之一第一項至第四項之情形，致他人受有損害而應負賠償責任者，法院得因被害人之請求，依侵害情節，酌定損害額三倍以下之懲罰性損害賠償金令該汽車運輸業者賠償。但選任受僱人及監督其職務之執行，已盡相當之注意而仍不免發生損害者，汽車運輸業者不負賠償責任。\n前項懲罰性損害賠償金請求權，自請求權人知有損害及賠償義務人時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。","note":"一、本條新增，由現行條文第三十五條之二移列。\n二、配合增訂第三十五條之一規定，修正第一項條文。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第三十七條","current":"曾犯下列各罪之一，經有罪判決確定，或曾依檢肅流氓條例裁定應為交付感訓確定者，不得辦理計程車駕駛人執業登記：\n一、故意殺人、故意重傷、搶劫、搶奪、強盜、恐嚇取財或擄人勒贖。\n二、刑法第一百八十四條、第一百八十五條或第一百八十五條之三。\n三、刑法第二百二十一條至第二百二十九條、兒童及少年性交易防制條例第二十四條至第二十七條或兒童及少年性剝削防制條例第三十三條至第三十七條。\n四、槍砲彈藥刀械管制條例第七條或第八條。\n五、懲治走私條例第四條至第六條。\n六、組織犯罪防制條例第三條、第四條或第六條。\n七、毒品危害防制條例。\n犯前項第三款以外各款之罪，而有下列情形之一，於申請執業登記前十二年以內未再受刑之宣告或執行，不受前項規定之限制：\n一、緩刑期滿，而緩刑之宣告未經撤銷。\n二、受有期徒刑之宣告，經執行完畢或赦免，或曾依檢肅流氓條例裁定應為交付感訓期滿。\n計程車駕駛人，犯第一項所列各罪之一，經第一審法院判決有罪後，吊扣其執業登記證。其經法院判處有罪判決確定者，廢止其執業登記。除符合前項規定之情形外，不得再辦理計程車駕駛人執業登記與執業。\n計程車駕駛人犯故意傷害、刑法第二百三十一條之一至第二百三十五條及第三百十五條之一各罪之一，或利用職務上機會，犯竊盜、詐欺、妨害自由，經第一審法院判決有期徒刑以上之刑者，吊扣其執業登記證。其經法院判決有期徒刑逾六個月確定而未受緩刑之宣告者，廢止其執業登記，且三年內不得辦理。利用職務上機會犯侵占罪，經第一審法院判決有罪者，吊扣其執業登記證；其經法院判處有罪判決確定者，廢止其執業登記，且三年內不得辦理。\n計程車駕駛人，受前二項吊扣執業登記證之處分，未將執業登記證送交發證警察機關者，廢止其執業登記。\n計程車駕駛人違反前條及本條規定，應廢止其執業登記或吊扣其執業登記證者，由警察機關處罰，不適用第八條第一項第一款規定。\n經廢止執業登記者，其執業登記證由警察機關收繳之。\n計程車駕駛人執業資格、執業登記、測驗、執業前、在職講習與講習費用收取、登記證核發及管理等事項之辦法，由內政部會同交通部定之。","versions":[{"bill":"202110220910000","text":"曾犯下列各罪之一，經有罪判決確定，或曾依檢肅流氓條例裁定應為交付感訓確定者，不得辦理計程車駕駛人執業登記：\n一、故意殺人、故意重傷、搶劫、搶奪、強盜、恐嚇取財或擄人勒贖。\n二、刑法第一百八十四條、第一百八十五條或第一百八十五條之三。\n三、刑法第二百二十一條至第二百二十九條、兒童及少年性交易防制條例第二十四條至第二十七條或兒童及少年性剝削防制條例第三十三條至第三十七條。\n四、槍砲彈藥刀械管制條例第七條或第八條。\n五、懲治走私條例第四條至第六條。\n六、組織犯罪防制條例第三條、第四條或第六條。\n七、毒品危害防制條例。\n犯前項第二款刑法第一百八十五條之三之罪者，於申請執業登記前十五年以內未再受刑之宣告或執行者，不受前項規定之限制。\n犯第一項第三款以外各款之罪，而有下列情形之一，於申請執業登記前十二年以內未再受刑之宣告或執行，不受第一項規定之限制：\n一、緩刑期滿，而緩刑之宣告未經撤銷。\n二、受有期徒刑之宣告，經執行完畢或赦免，或曾依檢肅流氓條例裁定應為交付感訓期滿。\n計程車駕駛人，犯第一項所列各罪之一，經第一審法院判決有罪後，吊扣其執業登記證。其經法院判處有罪判決確定者，廢止其執業登記。除符合第二項、第三項規定之情形外，不得再辦理計程車駕駛人執業登記與執業。\n計程車駕駛人犯故意傷害、刑法第二百三十一條之一至第二百三十五條及第三百十五條之一各罪之一，或利用職務上機會，犯竊盜、詐欺、妨害自由，經第一審法院判決有期徒刑以上之刑者，吊扣其執業登記證。其經法院判決有期徒刑逾六個月確定而未受緩刑之宣告者，廢止其執業登記，且三年內不得辦理。利用職務上機會犯侵占罪，經第一審法院判決有罪者，吊扣其執業登記證；其經法院判處有罪判決確定者，廢止其執業登記，且三年內不得辦理。\n計程車駕駛人，受前二項吊扣執業登記證之處分，未將執業登記證送交發證警察機關者，廢止其執業登記。\n計程車駕駛人違反前條及本條規定，應廢止其執業登記或吊扣其執業登記證者，由警察機關處罰，不適用第八條第一項第一款規定。\n經廢止執業登記者，其執業登記證由警察機關收繳之。\n計程車駕駛人執業資格、執業登記、測驗、執業前、在職講習與講習費用收取、登記證核發及管理等事項之辦法，由內政部會同交通部定之。","note":"一、增訂第二項：鑑於毒駕對公共安全危害甚鉅，曾犯刑法第一百八十五條之三之罪者，須於申請執業登記前十五年以內未再受刑之宣告或執行，始得辦理計程車駕駛人執業登記。\n二、原第二項至第八項依序遞移為第三項至第九項。\n三、配合新增第二項，原第二項（移列第三項）「犯前項第三款」修正為「犯第一項第三款」；原第三項（移列第四項）「除符合第二項及前項規定」修正為「除符合第二項、第三項規定」。"}],"changed":false,"final":"曾犯下列各罪之一，經有罪判決確定，或曾依檢肅流氓條例裁定應為交付感訓確定者，不得辦理計程車駕駛人執業登記：\n一、故意殺人、故意重傷、搶劫、搶奪、強盜、恐嚇取財或擄人勒贖。\n二、刑法第一百八十四條、第一百八十五條或第一百八十五條之三。\n三、刑法第二百二十一條至第二百二十九條、兒童及少年性交易防制條例第二十四條至第二十七條或兒童及少年性剝削防制條例第三十三條至第三十七條。\n四、槍砲彈藥刀械管制條例第七條或第八條。\n五、懲治走私條例第四條至第六條。\n六、組織犯罪防制條例第三條、第四條或第六條。\n七、毒品危害防制條例。\n犯前項第三款以外各款之罪，而有下列情形之一，於申請執業登記前十二年以內未再受刑之宣告或執行，不受前項規定之限制：\n一、緩刑期滿，而緩刑之宣告未經撤銷。\n二、受有期徒刑之宣告，經執行完畢或赦免，或曾依檢肅流氓條例裁定應為交付感訓期滿。\n計程車駕駛人，犯第一項所列各罪之一，經第一審法院判決有罪後，吊扣其執業登記證。其經法院判處有罪判決確定者，廢止其執業登記。除符合前項規定之情形外，不得再辦理計程車駕駛人執業登記與執業。\n計程車駕駛人犯故意傷害、刑法第二百三十一條之一至第二百三十五條及第三百十五條之一各罪之一，或利用職務上機會，犯竊盜、詐欺、妨害自由，經第一審法院判決有期徒刑以上之刑者，吊扣其執業登記證。其經法院判決有期徒刑逾六個月確定而未受緩刑之宣告者，廢止其執業登記，且三年內不得辦理。利用職務上機會犯侵占罪，經第一審法院判決有罪者，吊扣其執業登記證；其經法院判處有罪判決確定者，廢止其執業登記，且三年內不得辦理。\n計程車駕駛人，受前二項吊扣執業登記證之處分，未將執業登記證送交發證警察機關者，廢止其執業登記。\n計程車駕駛人違反前條及本條規定，應廢止其執業登記或吊扣其執業登記證者，由警察機關處罰，不適用第八條第一項第一款規定。\n經廢止執業登記者，其執業登記證由警察機關收繳之。\n計程車駕駛人執業資格、執業登記、測驗、執業前、在職講習與講習費用收取、登記證核發及管理等事項之辦法，由內政部會同交通部定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第六十七條","current":"汽車駕駛人曾依第二十七條第三項、第二十九條之二第五項、第三十五條第一項、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，不在此限。\n汽車駕駛人曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育或酒癮治療，不得考領駕駛執照。\n前項酒駕防制教育及酒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人未領有駕駛執照、駕駛執照經吊銷、註銷或吊扣期間駕車，肇事致人重傷或死亡者，除有第一項或第四項規定終身不得考領駕駛執照情形外，四年內不得考領駕駛執照。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","versions":[{"bill":"202110169040000","text":"汽車駕駛人曾依第二十七條第三項、第二十九條之二第五項、第三十五條第一項、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，不在此限。\n汽車駕駛人曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育或酒癮治療，不得考領駕駛執照。\n前項酒駕防制教育及酒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人未領有駕駛執照、駕駛執照經吊銷、註銷或吊扣期間駕車，肇事致人重傷或死亡者，除有第一項或第四項規定終身不得考領駕駛執照情形外，四年內不得考領駕駛執照。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。\n汽車駕駛人違反本條例規定，駕駛執照於吊銷、註銷或吊扣及禁止考領駕駛執照期間內，不得持外國政府、地區所發之駕駛執照（證）或國際駕駛執照駕車及換領駕駛執照。","note":"一、增訂第十項，其餘未修正。\n二、吊扣、吊銷、註銷駕照及禁止考領之規定與期限，乃剝奪駕駛人駕車權利之處分。目前遭吊扣、吊銷、註銷駕照及禁止考領駕照之駕駛人同時持外國駕照、國際駕照，能否於期間內駕駛車輛或換領本國駕照，交通部僅以函釋說明，並未明定於本條例及道路交通安全規則。\n三、倘若該駕駛人同時領有其他國家之駕照或國際駕照，仍應禁止其駕車與換領我國駕照。爰增訂第十項，明文規定駕駛人駕駛執照於吊銷、吊扣、註銷及禁止考領駕駛執照期間內，皆不得持外國政府、地區所發之駕駛執照或國際駕駛執照駕車及換領我國駕駛執照。"},{"bill":"202110217450000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項、第五項後段、第六項後段、第七項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項、第五項後段、第六項後段、第七項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第五項前段、第六項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第四項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第七項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第五項前段、第六項前段、第七項前段者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育或酒癮治療，不得考領駕駛執照。\n前項酒駕防制教育及酒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。\n汽機車駕駛人違反第三十五條第一項第二款規定，經吊銷駕駛執照者，於吊銷期間屆滿後重新考領駕駛執照時，應完成毒品危害防制教育、治療或輔導課程，並檢附無施用毒品相關證明文件；其辦法，由交通部會同內政部、法務部及衛生福利部定之。\n汽機車駕駛人十年內二次以上違反第三十五條第一項第二款規定，經重新考領駕駛執照者，應申請登記配備車輛點火自動鎖定裝置或其他經主管機關公告之防制再犯設備之汽車後，始得發給駕駛執照。","note":"一、近年毒駕案件層出不窮，毒品施用後易致駕駛人精神恍惚、判斷能力下降，對道路交通安全危害重大，爰增訂毒駕再犯防制規範。\n二、增訂汽機車駕駛人因違反第三十五條第一項第二款規定遭吊銷駕駛執照者，重新考領駕駛執照前，應完成毒品危害防制教育、治療或輔導課程，並檢附無施用毒品相關證明文件，以降低再犯風險。\n三、考量毒品成癮具有高度再犯性，增訂十年內二次以上毒駕違規者，重新考領駕駛執照時，應申請登記配備車輛點火自動鎖定裝置或其他防制再犯設備之汽車後，始得發給駕駛執照，以強化再犯預防機制。\n四、授權交通部會同內政部、法務部及衛生福利部訂定毒品危害防制教育、治療或輔導課程相關辦法，以利制度執行及跨機關合作。"},{"bill":"202110218770000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項、第二項、第四項後段、第五項後段、第六項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項、第二項、第四項後段、第五項後段、第六項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第四項前段、第五項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第三項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第六項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第四項前段、第五項前段、第六項前段者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育或酒癮治療，不得考領駕駛執照。\n前項酒駕防制教育及酒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"配合第三十五條修正，爰修正本條所涉引用項次，以維持法條一致性。"},{"bill":"202110219460000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第三項、第四項後段、第五項、第三十五條之一第一項後段、第三項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第三項、第四項後段、第五項、第三十五條之一第一項、第三項者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第四項前段、第三十五條之一第一項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人曾依第三十五條第四項前段吊銷駕駛執照；駕駛營業大客車，曾依第三十五條第二項第一款規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；曾依第三十五條之一第三項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第三項前段、第四項前段、第五項前段者外，不在此限。\n汽車駕駛人曾依第三十五條、第三十五條之一規定吊銷駕駛執照，有下列情形之一者，不得考領駕駛執照：\n一、未依規定完成酒駕防制教育或酒癮治療。\n二、未依規定完成毒駕防制教育或毒品戒癮治療。\n前項酒駕防制教育、酒癮治療、毒駕防制教育及毒品戒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育、毒駕防制教育、酒癮治療或毒品戒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、修正第一項、第二項；並修正第五項，增加有關毒駕行為人重新考領駕駛執照，應完成毒品戒治、毒駕防制教育之限制。\n二、鑒於毒駕頻傳，相關危險駕駛行為對於我國交通秩序與社會安全危害重大，現行規定雖已將毒駕、酒駕致人於死者，排除於第六十七條之一得重新考領駕駛執照制度之外，審酌我國毒品犯罪之再犯率長期處於35%至45%之高點；且據警政署統計，拒絕酒駕檢測案件數，114年之數量較前年增加1031件（+13.57%），而毒駕拒測案件數，過往雖未有統計，然115年1月至4月止，亦已累積達到318件，本法現行規定第三十五條前段、第四項前段危險駕駛行為未致人死傷之累犯及拒絕毒駕、酒駕檢定者之重新考領駕駛執照規定恐過於寬鬆。爰於權衡釋字第531號解釋令意旨，併審酌危險駕駛行為及拒檢行為對於整體社會秩序之危害性，予以明文加嚴危險駕駛累犯及拒檢者之重新考領駕駛執照期間限制。\n三、次按酒精成癮與毒品成癮均為物質使用障礙、屬於慢性大腦疾病之一種，僅以行政或刑事處罰難達根本遏制效果，仍需輔助以戒癮治療、心理支持介入干預，達到去除或取代行為人不良行為之目的。然現行法規僅針對酒駕者，訂有應完成酒癮治療與酒駕防制教育，否則不得重新考領駕照之強制規定，對於毒駕行為卻未有類似規範，形成法制破口，恐使得毒品依賴者得於重新考領駕照之法定期限屆滿後，於未戒治毒癮之情形下，仍得繼續考領駕駛執照，增加交通用路之風險。\n四、爰此，本於填補立法漏洞，降低毒駕者再犯、維護交通社會秩序與保障人民生命財產安全之目的，修正現行條文第五項、第六項，參考酒駕防制之制度，強制未完成毒品成癮戒治與毒駕防制教育之危險駕駛行為人，不得重新考領駕駛執照。"},{"bill":"202110220910000","text":"曾犯刑法第一百八十五條之三及毒品危害防制條例之罪，自刑事有期徒刑執行完畢、易科罰金執行完畢、緩刑期滿，或依毒品危害防制條例所受觀察、勒戒、強制戒治、緩起訴處分附帶戒癮治療執行完畢之日起五年內，不得考領駕駛執照。\n汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項、第三項後段、第五項後段、第六項後段、第七項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項、第三項後段、第五項後段、第六項後段、第七項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第五項前段、第六項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第四項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第七項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第三項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第五項前段、第六項前段、第七項前段者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育或酒癮治療，不得考領駕駛執照。\n前項酒駕防制教育及酒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第五項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、增訂第一項：曾犯刑法第一百八十五條之三及毒品危害防制條例之罪者，自刑事處罰或毒品相關處分執行完畢之日起五年內，不得考領駕駛執照。\n二、原第一項至第八項依序遞移為第二項至第九項。\n三、配合第三十五條項次調整，更正各項所引第三十五條之項次（如「第四項後段」更正為「第六項後段」、「第三項前段、第四項前段、第五項前段」更正為「第五項前段、第六項前段、第七項前段」），並將原「第一項至第四項」修正為「第一項至第五項」。"},{"bill":"202110222600000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項、第三項後段、第四項後段、第五項後段、第三十五條之一第一項後段、第三項後段、第四項、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第三項前段、第四項前段、第三十五條之一第一項前段、第二項前段、第三項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第三項前段、第四項前段、第五項前段者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育或酒癮治療，不得考領駕駛執照。\n前項酒駕防制教育及酒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n汽車駕駛人曾依第三十五條之一規定吊銷駕駛執照，應依規定完成觀察、勒戒、強制戒治或戒癮治療，並於六個月後經再次接受檢驗，評估認無繼續施用毒品傾向，方得考領駕駛執照。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、配合修正草案增訂第三十五條之一規定，修正第一項，將因違反第三十五條之一第一項後段、第三項後段及第四項規定吊銷駕駛執照者，納入終身不得考領駕駛執照的對象。\n二、配合修正草案增訂第三十五條之一規定，修正第二項，將違反第三十五條之一第一項前段、第二項前段、第三項前段吊銷駕駛執照之再次考領照期間規定為五年，惟仍先應依修正條文第七項規定，完成觀察、勒戒或強制戒治，認無繼續施用毒品傾向者，方得報考。\n三、第三項至第六項未修正。\n四、增訂第七項，曾因毒假依第三十五條之一吊銷駕駛執照，未受本條第一項終身不得考領限制者，於禁制期間屆滿，仍應先規定完成觀察、勒戒或強制戒治，有鑑於毒品成癮者短期再吸食機率高，爰增訂一定期間後應再次評估，認無繼續施用毒品傾向，方得再次考領駕駛執照之規定，以降低毒駕再犯可能性。\n五、第七項及第八項未修正，僅調整項次。"},{"bill":"202110223020000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段關於施用毒品者、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第三項前段、第四項前段、第五項前段者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕與毒駕防制教育、酒癮或毒癮治療，並經申請前六個月內強制複驗毒品反應皆為陰性者，不得考領駕駛執照。重新考領後，公路主管機關應發給有效期間一年之限制性駕駛執照，並令其定期接受毒品複驗；至連續三年複驗無施用毒品反應後，始得換發常態駕駛執照。\n前項酒駕與毒駕防制教育、酒癮與毒癮治療、強制複驗、限制性駕駛執照之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕與毒駕防制教育、酒癮與毒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部、內政部、法務部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、修正第一項、第二項：因原條文第一項將「第三十五條第一項」全部列為終身不得考照，將導致先前設計之「毒駕初犯吊銷三年」成為終身禁考。因此將其切分為「第三十五條第一項後段（肇事致死傷）」維持終身禁考；而將「第三十五條第一項前段關於施用毒品者（初犯）」歸類於第二項之「三年內不得考領」級距中，以維持法律恆平性。\n二、第三項、第四項未修正。\n三、修正第五項：現行僅規範「酒駕教育與酒癮治療」。為配合毒駕防制，全面擴大為「酒駕與毒駕防制教育、酒癮與毒癮治療」。並將「考照前六個月強制複驗陰性」及重考後「發給一年期限制性駕駛執照、連續三年配合複驗」機制納入，使毒品防制強度超越現行之酒駕管理。\n四、修正第六項：因涉及毒品戒癮治療與強制複驗等司法、治安業務，故於第六項子法授權之共同會商機關中，除原有之交通部與衛福部外，應一併增列內政部（警政）與法務部（司法戒癮），以健全國家級防護網絡。\n五、第七項、第八項未修正。"},{"bill":"202110223520000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段、第三十五條第十一項規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項前段、第三項前段、第四項前段、第五項前段、第十一項者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育、酒癮治療、毒駕防制教育、觀察勒戒、強制戒治、毒品戒癮治療或毒品危害講習，不得考領駕駛執照。有第三十五條第一項第二款或第十一項情形之一者，經依規定重新申請考驗合格後，應於六個月內無再次違反時，始發給駕駛執照。\n前項酒駕防制教育、毒駕防制教育或及酒癮治療、毒品戒癮治療、毒品危害講習之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、配合第三十五條第一項修正吸食毒品後駕車行為由現行吊扣駕駛執照一年至二年加重為吊銷駕駛執照，爰修正第一項、第二項及第四項援引條文，區分違反第三十五條第一項前段（毒駕吊銷駕駛執照三年不得考領），及後段（酒毒駕致人重傷或死亡吊銷駕駛執照終身不得考領）之不同不得考領駕駛執照期間之限制。以及配合第三十五條增訂第十一項吊銷駕駛執照之規定，爰定明其二年內不得考領駕駛執照之限制。\n二、修正第五項，要求駕駛人重新取得駕駛執照前，應依規定完成觀察勒戒、強制戒治、毒品戒癮治療、毒品危害講習等相關分流處置，且重新依道路交通安全規則及受終身不得考領駕駛執照限制重新申請考驗辦法等相關規定申請考驗合格後，應於六個月內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，始發給駕駛執照，以維用路人安全。\n三、配合第五項規定，爰於第六項授權規定事項增訂毒駕防制教育、毒品戒癮治療、毒品危害講習等相關事項。"},{"bill":"202110222920000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段、第三十五條第十一項規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項前段、第三項前段、第四項前段、第五項前段、第十一項者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育、酒癮治療、毒駕防制教育、觀察勒戒、強制戒治、毒品戒癮治療或毒品危害講習，不得考領駕駛執照。有第三十五條第一項第二款或第十一項情形之一者，經依規定重新申請考驗合格後，應於六個月內無再次違反時，始發給駕駛執照。\n前項酒駕防制教育、毒駕防制教育或酒癮治療、毒品戒癮治療、毒品危害講習之實施對象、教育或治療實施機構、方式、費用收取、完成之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、修正第一項、第二項及第四項：\n(一)配合第三十五條第一項修正吸食毒品後駕車行為由現行吊扣駕駛執照一年至二年加重為吊銷駕駛執照，爰修正第一項、第二項及第四項援引條文，區分違反第三十五條第一項前段（毒駕吊銷駕駛執照三年不得考領），及後段（酒毒駕致人重傷或死亡吊銷駕駛執照終身不得考領）之不同不得考領駕駛執照期間之限制。\n(二)配合第三十五條增訂第十一項吊銷駕駛執照之規定，爰定明其二年內不得考領駕駛執照之限制。\n二、修正第五項：\n(一)毒品成癮係造成毒駕反覆發生之核心原因，因成癮者會對藥物產生強烈之生理及心理依賴，甚至在「邊開邊吸」之情況下造成重大傷亡。目前吸食毒品駕車者依毒品危害防制條例第十條及第十一條之一規定，施用第一級或第二級毒品係涉犯刑罰；施用第三級或第四級毒品係涉行政罰，毒駕涉犯刑罰部分已有觀察勒戒及強制戒治、緩起訴附命戒癮治療、起訴後入監服刑由矯正機關給予相關治療及處遇等規定；行政罰部分則規定須接受毒品危害講習，輔導吸毒者戒除毒癮，避免再犯。又參考目前酒駕受吊銷駕駛執照處分，於重新考領前須完成酒駕防制教育或酒癮治療，對於酒駕防制已有成效，違反毒駕規定受吊銷駕駛執照處分者，亦應有必要要求駕駛人重新取得駕駛執照前，應依前開規定完成觀察勒戒、強制戒治、毒品戒癮治療、毒品危害講習等相關分流處置，且重新依道路交通安全規則及受終身不得考領駕駛執照限制重新申請考驗辦法等相關規定申請考驗合格後，應於六個月內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，始發給駕駛執照，以維用路人安全。\n(二)配合修正條文第三十五條增訂第十一項規定，對於吸食毒品等而無駕駛行為之人處以吊銷駕駛執照處分，並非對行為人交通違規行為之處罰，而係基於該行為人既有吸食毒品等行為，考量毒品之成癮性及吸食毒品後，行為人陷於無法安全駕駛或對行為能力、認知能力減損之狀態，行為人於治療前隨時可能發生吸食毒品後陷於無法安全駕駛情形，為維護道路交通安全之公共利益，保障用路人之生命、身體及財產權益，應剝奪其駕駛資格，俟完成毒品危害防制相關處遇作為後，並觀察六個月內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，方予核發駕駛執照。\n三、配合第五項規定，爰於第六項授權規定事項增訂毒駕防制教育、毒品戒癮治療、毒品危害講習等相關事項。\n四、第三項、第七項及第八項未修正。"},{"bill":"202110223310000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項、第三項後段、第四項後段、第五項後段、第三十五條之三第一項後段、第二項、第三項後段、第四項、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項、第三項後段、第四項後段、第五項後段、第三十五條之三第一項後段、第二項、第三項後段、第四項者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第三項前段、第四項前段、第三十五之三條第一項前段、第三項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第三項前段、第四項前段、第五項前段者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育或酒癮治療，不得考領駕駛執照。\n前項酒駕防制教育及酒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n汽車駕駛人曾依第三十五條之三規定吊銷駕駛執照，未依規定完成毒駕防制教育或毒癮治療，不得考領駕駛執照。\n前項毒駕防制教育及毒癮治療之實施對象、教育或治療實施機構、方式、費用收取、完成毒駕防制教育及毒癮治療之認定基準及其他相關事項之辦法，由交通部會商相關機關定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、配合第三十五條及第三十五條之三條文修正增訂，爰修正本條。\n二、新增第八項毒駕防制教育或毒癮治療等配套措施，以落實毒品零容忍政策。"},{"bill":"202110223500000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段、第三十五條第十二項規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項前段、第三項前段、第四項前段、第五項前段、第十二項者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育、毒駕防制教育或酒癮治療、毒品戒癮治療、毒品危害講習，不得考領駕駛執照。有第三十五條第一項第二款或第十二項情形之一者，經依規定重新申請考驗合格後，應於六個月內無再次違反時，始發給駕駛執照。\n前項酒駕防制教育、毒駕防制教育或酒癮治療、毒品戒癮治療、毒品危害講習之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育、毒駕防制教育或酒癮治療、毒品戒癮治療、毒品危害講習之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、修正第一項、第二項、第四項：\n(一)配合第三十五條第一項修正吸毒後駕車行為由現行吊扣駕駛執照一年至二年加重為吊銷駕駛執照，爰修正第一項、第二項、第四項援引條文，區分違反第三十五條第一項前段（毒駕吊銷駕駛執照三年不得考領），及後段（酒毒駕致人重傷或死亡吊銷駕駛執照終身不得考領）之不同不得考領駕駛執照期間之限制。\n(二)配合第三十五條第十二項增訂吊銷駕駛執照之規定，爰定明其二年內不得考領駕駛執照之限制。\n二、修正第五項：\n(一)參考目前酒駕受吊銷駕駛執照處分，於重新考領前須完成酒駕防制教育或酒癮治療，對於酒駕防制已有成效，違反毒駕規定受吊銷駕駛執照處分規定，亦應有必要要求駕駛人重新取得駕駛執照前，應檢附前開分流處置之相關完成證明，且重新依道路交通安全規則及受終身不得考領駕駛執照限制重新申請考驗辦法等相關規定申請考驗合格後，應於六個月內無再次違反第三十五條第一項第二款毒駕情形或第十一項施用毒品情形時，始發給駕駛執照，以維用路人安全。\n(二)配合第三十五條第十二項修正，對於使用毒品而無駕駛行為之人施以吊銷駕駛執照處分，此情形並非對行為人交通違規行為之處罰，而係基於該行為人既有使用毒品行為，考量毒品之成癮性及施用毒品後行為人陷於無法安全駕駛或對行為能力、認知能力減損之狀態，行為人於治療前隨時可能發生施用毒品後陷於無法安全駕駛情形，為維護道路交通安全之公共利益，應剝奪其駕駛資格，俟完成戒除毒癮後，並觀察六個月無再次違反第三十五條第一項第二款毒駕情形或第十二項施用毒品情形時，方予核發駕駛執照。"},{"bill":"202110222770000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段、第三十五條第十一項規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項前段、第三項前段、第四項前段、第五項前段、第十一項者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育、酒癮治療、毒駕防制教育、觀察勒戒、強制戒治、毒品戒癮治療或毒品危害講習，不得考領駕駛執照。有第三十五條第一項第二款或第十一項情形之一者，經依規定重新申請考驗合格後，應於兩年內無再次違反時，始發給駕駛執照。\n前項酒駕防制教育、毒駕防制教育或酒癮治療、
