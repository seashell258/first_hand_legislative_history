<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>道交條例酒駕毒駕加重處罰修正歷程（2026 年 7 月）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"道路交通管理處罰條例","version":"02017:2026-07-28-修正","date":"2026-07-28","action":"修正","title":"道路交通管理處罰條例　2026 年 7 月修正（酒駕毒駕加重處罰）","lede":"這次修正七條，重點是酒駕和毒駕。第三十五條：依原條文，酒駕、毒駕罰機車駕駛人 1 萬 5 千元以上 9 萬元以下、汽車駕駛人 3 萬元以上 12 萬元以下，並吊扣駕照一年到二年；這次提高為機車 1 萬 8 千元以上 12 萬元以下、汽車 3 萬 6 千元以上 15 萬元以下，毒駕和酒駕分開，毒駕依最高額處罰並吊銷駕照，十年內第二次毒駕再加罰 9 萬元；拒絕毒駕稽查或檢測從 18 萬元提高為 27 萬元；毒駕或拒絕毒駕檢測的車輛沒入；年滿十八歲的同車乘客，原本只在駕駛酒駕時處罰，這次毒駕也罰；經警察機關確認吸食毒品的人，吊銷駕照。第六十七條規定，毒駕吊銷駕照的人要完成觀察勒戒、戒癮治療或毒品危害講習等處置才能考照，考驗合格後一年內沒有再犯才發給駕照。第七十三條把慢車酒駕、毒駕的罰鍰從 1,200 元以上 2,400 元以下提高為 2,400 元以上 1 萬 2 千元以下，拒絕檢測從 4,800 元提高為 2 萬 4 千元。第二十一條、第二十一條之一提高毒駕吊銷駕照期間無照駕駛的加罰並沒入車輛；第八十五條之二、之三調整移置保管車輛的領回規定，無人認領車輛的公告期間從三個月縮短為一個月。這次有行政院提案，以及 33 件委員和台灣民眾黨黨團的提案；交通委員會在 2026 年 6 月 25 日詢答、7 月 13 日逐條審查，決定不須交由黨團協商。7 月 28 日院會照審查會條文通過並完成三讀，沒有表決。","summary":"酒駕、毒駕罰鍰提高為機車 1 萬 8 千到 12 萬元、汽車 3 萬 6 千到 15 萬元；毒駕改為依最高額處罰、吊銷駕照並沒入車輛，拒絕毒駕檢測罰 27 萬元，同車成年乘客也要處罰；毒駕吊銷駕照的人要完成戒癮等處置，重新考驗合格後一年內沒有再犯才發給駕照。","key":"02017_2026-07-28","props":[{"id":"202110164200000","who":"委員羅美玲等18人","date":"2025-10-17","name":"「道路交通管理處罰條例第二十一條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110164200000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/05/LCEWA01_110405_00023.pdf","proposers":["羅美玲"],"ncosign":17,"people":[["羅美玲","民進黨","提案"],["伍麗華Saidhai‧Tahovecahe","民進黨","連署"],["范雲","民進黨","連署"],["李柏毅","民進黨","連署"],["張宏陸","民進黨","連署"],["郭昱晴","民進黨","連署"],["沈發惠","民進黨","連署"],["林楚茵","民進黨","連署"],["王正旭","民進黨","連署"],["王義川","民進黨","連署"],["蔡其昌","民進黨","連署"],["許智傑","民進黨","連署"],["李昆澤","民進黨","連署"],["陳俊宇","民進黨","連署"],["林宜瑾","民進黨","連署"],["蔡易餘","民進黨","連署"],["何欣純","民進黨","連署"],["吳思瑤","民進黨","連署"]],"party":[["民進黨",18]],"reason":"本院委員羅美玲等18人，鑑於近年無照駕駛肇事案件數量持續攀升，其造成交通事故死傷人數甚至已超越酒駕所致。以113年為例，無照駕駛事故高達51,939件，遠高於酒駕之7,199件；無照駕駛造成死傷人數更達74,587人，亦大幅超過酒駕之9,243人。顯見無照駕駛對公共交通安全之危害已日益嚴重。近年來因酒駕多次修法加重罰則，肇事數量已有顯著下降，然無照駕駛罰則相對偏低，處遇不足，導致問題持續惡化，相關罰則顯有提高之必要，爰擬具「道路交通管理處罰條例第二十一條條文修正草案」。是否有當？敬請公決。","arts":["第二十一條"]},{"id":"202110169040000","who":"委員洪孟楷等16人","date":"2025-10-31","name":"「道路交通管理處罰條例第六十 ",21],["無黨籍",1]],"reason":"本院委員林倩綺等22人，鑒於近年酒駕及毒駕案件仍持續危害道路交通安全，其中毒駕案件呈現增加趨勢，嚴重危害人民生命財產權益。依警政機關統計，民國一百十四年全國查獲毒駕案件達八千六百餘件，一百十五年一月至四月已查獲四千七百餘件，顯示毒駕問題日趨嚴重。現行處罰規定對於毒駕及酒駕之嚇阻效果仍有強化空間，對於同車乘客協助勸阻危險駕駛之社會責任亦有進一步明確之必要。為強化酒駕及毒駕防制措施，提高違規成本，督促同車乘客共同負起防制危險駕駛責任，維護道路交通安全及保障人民生命財產安全，爰擬具「道路交通管理處罰條例第三十五條條文修正草案」。是否有當？敬請公決。","arts":["第三十五條"]},{"id":"202110219910000","who":"委員邱鎮軍等25人","date":"2026-06-12","name":"「道路交通管理處罰條例第三十五條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110219910000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/05/14/LCEWA01_110514_00172.pdf","proposers":["邱鎮軍","羅廷瑋","蘇清泉","廖偉翔","林沛祥"],"ncosign":20,"people":[["邱鎮軍","國民黨","提案"],["羅廷瑋","國民黨","提案"],["蘇清泉","國民黨","提案"],["廖偉翔","國民黨","提案"],["林沛祥","國民黨","提案"],["陳超明","無黨籍","連署"],["葛如鈞","國民黨","連署"],["陳菁徽","國民黨","連署"],["黃仁","國民黨","連署"],["王育敏","國民黨","連署"],["許宇甄","國民黨","連署"],["黃建賓","國民黨","連署"],["涂權吉","國民黨","連署"],["謝龍介","國民黨","連署"],["羅智強","國民黨","連署"],["林倩綺","國民黨","連署"],["高金素梅","無黨籍","連署"],["陳雪生","國民黨","連署"],["邱若華","國民黨","連署"],["洪孟楷","國民黨","連署"],["翁曉玲","國民黨","連署"],["林思銘","國民黨","連署"],["牛煦庭","國民黨","連署"],["顏寬恒","國民黨","連署"],["傅崐萁","國民黨","連署"]],"party":[["國民黨",23],["無黨籍",2]],"reason":"本院委員邱鎮軍、羅廷瑋、蘇清泉、廖偉翔、林沛祥等20人，有鑑於近年來毒駕案件呈現大幅攀升趨勢，不法分子吸食俗稱「喪屍煙彈」之依托咪酯等新興管制藥品後駕車上路，頻頻引發重大傷亡交通事故，嚴重侵害無辜用路人之生命財產安全，已成為社會公共安全之重大隱憂，亟待加重處罰及從嚴限制其考領駕駛執照之期限；並且現行法僅偏重事後之經濟處罰與資格剝奪，漏未導入醫療強制戒治手段，致使行為人常因毒癮發作而反覆無照冒險上路，無法從源頭根除病因，爰擬具「道路交通管理處罰條例第三十五條條文修正草案」。是否有當？敬請公決。","arts":["第三十五條"]},{"id":"202110219460000","who":"台灣民眾黨黨團","date":"2026-06-12","name":"「道路交通管理處罰條例部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110219460000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/05/14/LCEWA01_110514_00197.pdf","proposers":["陳清龍","王安祥","邱慧洳"],"ncosign":0,"people":[["陳清龍","民眾黨","提案"],["王安祥","民眾黨","提案"],["邱慧洳","民眾黨","提案"]],"party":[["民眾黨",3]],"reason":"本院台灣民眾黨黨團，有鑑於近年毒駕案件數快速增長，自113年至115年4月，已至少造成42人死亡，審酌施用毒品及危險駕駛之犯罪結合，對於整體社會秩序與交通安全危害更為嚴重，且毒駕猖獗更已形成嚴重民怨，故為提升法之嚇阻力，增加行為人犯罪成本，予以修正加強毒駕之相關罰則，並參考同法立法例，新增對於同車成年乘客擬定連坐處罰。又，審酌近年慢車危險駕駛案件及拒測比例亦有持續上升趨勢， 委員陳培瑜、徐富癸、林宜瑾、陳秀寳、吳思瑤等18人，鑒於近期吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品後駕駛汽機車（以下稱毒駕）頻繁發生有上升趨勢，且吸食毒品等行為本身涉犯刑事法律，其對交通安全之危害性比酒駕更為嚴重，有必要加重處罰。另毒品成癮係造成毒駕反覆發生之核心原因，對於汽機車駕駛人之生理及心理皆有嚴重影響，為防患未然，有必要從源頭加強駕駛執照之管理，以杜絕毒駕情事，爰擬具「道路交通管理處罰條例部分條文修正草案」。是否有當？敬請公決。","arts":["第二十一條","第二十一條之一","第三十五條","第六十七條"]}],"arts":[{"no":"第二十一條","current":"汽車駕駛人有下列情形之一者，處新臺幣六千元以上二萬四千元以下罰鍰，並當場禁止其駕駛：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n汽車駕駛人於五年內違反前項規定二次以上者，處新臺幣二萬四千元罰鍰，並當場禁止其駕駛；如肇事致人重傷或死亡，得沒入該汽車。\n汽車駕駛人於依本條例第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反本條第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n汽車所有人允許第一項第一款至第五款之違規駕駛人駕駛其汽車者，除依第一項規定處罰鍰外，並吊扣其汽車牌照一個月；五年內違反二次者，吊扣其汽車牌照三個月；五年內違反三次以上者，吊扣其汽車牌照六個月。但其已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，不在此限。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。","versions":[{"bill":"202110164200000","text":"汽車駕駛人有下列情形之一者，處新臺幣一萬二千元以上三萬六千元以下罰鍰，並當場禁止其駕駛：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n汽車駕駛人於五年內違反前項規定二次以上者，處新臺幣三萬六千元罰鍰，並當場禁止其駕駛；如肇事致人重傷或死亡，應沒入該汽車。\n汽車駕駛人於依本條例第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反本條第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n汽車所有人允許第一項第一款至第五款之違規駕駛人駕駛其汽車者，除依第一項規定處罰鍰外，並吊扣其汽車牌照一個月；五年內違反二次者，吊扣其汽車牌照三個月；五年內違反三次以上者，吊扣其汽車牌照六個月。但其已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，不在此限。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。","note":"一、依警政署113年公布之警政統計年報，全國未領有駕照駕車之取締案件逐年攀升，自103年11萬4,067件至111年已達21萬3,881件。對照酒醉駕車，103年尚有10萬829件，惟因社會長期關注並多次修法加重罰則，至111年已降至4萬8,905件，違規與肇事案件均有顯著下降。\n二、反觀無照駕駛，違規件數不僅持續增加，肇事案件及造成死傷人數亦逐年攀升，顯示社會對此不法行為之容忍度過高，現行處罰水準難以發揮嚇阻效果。爰此，建議修正第一項前段，將罰鍰由現行新臺幣6,000元至24,000元提高至新臺幣12,000元至36,000元，以強化處罰效能，提升法律威攝力，遏止無照駕駛歪風，確保公共交通安全。\n三、修正第二項，將五年內違反二次以上之罰鍰自24,000元提高至36,000元，藉以提高累犯成本；並將「得沒入該汽車」修正為「應沒入該汽車」，確立強制沒入之規範，藉此避免裁量過寬導致規範落空，彰顯對於無照駕駛累犯及造成重大傷亡事件之零容忍立場，以維護社會大眾交通安全。"},{"bill":"202110219460000","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，得沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項、第三十五條之一規定吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣六萬元。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","note":"一、配合本次草案修正，修正第三項。\n二、緣因毒品具有高度成癮性，吸食後將嚴重侵害人體中樞神經系統，導致認知、判斷力、反應速度及定向感顯著降低。汽車駕駛人服用毒品、迷幻藥、麻醉藥品或其相類似之管制物品而駕車，形同移動之「不定期炸彈」，已對不特定用路人之生命、身體及財產安全構成極大之威脅，社會大眾對此類行為向來抱持「零容忍」之堅定立場。\n三、經查，於嚇阻毒駕之修正方向上，雖已針對毒駕行為，逐步落實更嚴格之吊銷、吊扣駕駛執照之處分，以剝奪其駕駛資格，達隔離風險之目的。惟根據現行實務，確實仍存在部分毒駕行為人於駕駛執照遭吊銷後，仍無視法令禁制，心存僥倖，再度「無照駕駛」上路之情事，且相關情形，未來亦可能隨著對於毒駕修法加嚴後有所增加。此種「毒駕經吊銷駕照後又無照駕駛」之行為，不僅顯現行為人對國家司法及行政處分毫無悔意與畏懼，更屬明知故犯之惡性違規，其危險程度與主觀惡性，相較於一般無照駕駛更為重大。\n四、綜上所述，現行針對無照駕駛之處罰，恐不足以遏阻此類毒駕行為，故為有效杜絕此類嚴重危害公共安全之漏洞，貫徹政府維護交通安全之決心，爰修正本條第三項，調整毒駕後經吊銷、吊扣駕照又無照駕駛之加罰金額，以貫徹違規與處罰相當之比例原則，並收強力嚇阻之效。"},{"bill":"202110222600000","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，得沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項規定吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰。\n汽機車駕駛人於依第三十五條之一第一項至第四項規定吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所定罰鍰最高額加罰新臺幣五萬元罰鍰，並沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","note":"一、第一項至第三項未修正。\n二、增訂第四項，對因毒駕吊銷駕駛執照，又無照駕駛汽機車者，加重處罰。\n三、配合前項增訂，第四項至第九項移列項次。"},{"bill":"202110223520000","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰；其屬違反第三十五條第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣三萬六千元罰鍰，並沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","note":"一、考量毒品成癮係造成毒駕反覆發生之核心原因，對於汽機車駕駛人之生理及心理皆有嚴重影響，為防患未然，有必要從源頭加強駕駛執照之管理，爰於第三項增訂，汽機車駕駛人，駕駛汽機車經測試檢定有第三十五條第二款吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之情形、或拒絕接受該款稽查或測試檢定者，除有相對應罰鍰，並沒入該汽機車。\n二、另配合修正條文第三十五條增訂相關吸食毒品吊銷駕駛執照規定，其吊銷駕駛執照後再次無照駕駛亦有比照毒駕加重處罰之必要，爰規定依第三十五條第十一項規定吊銷駕駛執照期間無照駕駛之情形，亦適用本條沒入之規定，並有相對應罰鍰。\n三、為配合第三項增訂後段規定，再次無照駕駛縱無肇事致人重傷或死亡即應沒入該汽機車，第二項無照駕駛累犯肇事致人重傷或死亡部分，考量處罰之衡平性，亦應有必要沒入該汽機車，而無裁量空間，爰將後段所定「得沒入」修正為「沒入」。\n四、另現行第九項定有汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰，爰第二項後段及第三項後段有關沒入汽機車亦有第九項規定之適用，併予敘明。"},{"bill":"202110222920000","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣三萬六千元罰鍰，並沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","note":"一、修正第三項：\n(一)現行第三項規定違反第三十五條酒駕或吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品後駕駛汽機車（以下稱毒駕）規定吊扣或吊銷駕駛執照期間再次無照駕駛加處罰鍰新臺幣一萬二千元。考量吸食毒品等行為涉犯刑事法律，毒駕後再無照駕駛應有與酒駕後無照駕駛區隔加重處罰之必要。\n(二)另配合修正條文第三十五條增訂相關吸食毒品（如毒駕、拒絕接受依第三十五條第四項規定所為之毒駕稽查或測試檢定，或經確認有吸食毒品等）吊銷駕駛執照規定，其吊銷駕駛執照後再次無照駕駛亦有比照毒駕加重處罰之必要，爰增訂依第三十五條第十一項規定吊銷駕駛執照期間無照駕駛之情形，亦有本項加重處罰規定之適用。\n(三)綜上，增訂後段規定，就前開吊銷駕駛執照期間無照駕駛之罰鍰，由現行加罰新臺幣一萬二千元加重為加罰新臺幣三萬六千元。又為限制該等駕駛人繼續使用汽機車無照駕駛，並加強汽車所有人善盡車輛管理責任，爰增訂應沒入汽機車之處罰規定，且汽機車所有人與駕駛人非屬同一人時，亦沒入該汽機車。\n二、為配合第三項增訂後段規定，再次無照駕駛縱無肇事致人重傷或死亡即應沒入該汽機車，第二項無照駕駛累犯肇事致人重傷或死亡部分，考量處罰之衡平性，亦應有必要沒入該汽機車，而無裁量空間，爰將後段所定「得沒入」修正為「沒入」。\n三、另現行第九項定有汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰，爰第二項後段及第三項後段有關沒入汽機車亦有第九項規定之適用，併予敘明。\n四、第一項、第四項至第九項未修正。"},{"bill":"202110223500000","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，得沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰；屬依第三十五條第一項第二款或拒絕接受其稽查、測試檢定、第十一項吊銷駕駛執照，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣四萬八千元罰鍰，並得沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實\n以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","note":"一、修正第三項：\n(一)考量吸毒本身涉犯刑事法令，毒駕後再無照駕駛應有與酒駕後無照駕駛區隔加重處罰之必要。\n(二)另配合第三十五條修正條文相關吸食毒品吊銷駕駛執照規定，其吊銷駕駛執照後再次無照駕駛亦有比照毒駕加重處罰之必要，爰新增依第三十五條第十一項規定吊銷駕駛執照期間無照駕駛之情形，亦有本項加罰規定之適用。\n(三)綜上，增訂後段規定，就前開吊銷駕駛執照期間無照駕駛之罰鍰，由現行加罰一萬二千元加重為加罰四萬八千元。又為限制該等駕駛人繼續使用車輛無照駕駛，並加強汽車所有人善盡車輛管理責任，爰增訂沒入車輛之處罰規定，且汽機車所有人與駕駛人為非屬同一人時，亦得沒入車輛。"},{"bill":"202110222770000","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，得沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或於同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣三萬六千元罰鍰，並沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","note":"一、現行第三項針對酒駕或毒駕於吊扣、吊銷駕照期間再度無照駕駛者，僅加罰一萬二千元。審酌毒駕涉犯刑事法律，有與酒駕區隔並加重處罰之必要，爰將加罰金額提升至三萬六千元；另配合第三十五條增訂之各項毒駕相關吊銷駕照事由，爰增列依第三十五條第十一項吊銷駕照期間無照駕駛者亦適用加重規定。據此，增訂第三項後段規定將上述吊銷駕照期間無照駕駛之罰鍰，由現行加罰一萬二千元提高至三萬六千元，並為防止其持續違規，促使車主善盡管理責任，增訂應沒入汽機車之處罰，且汽機車所有人與駕駛人非屬同一人時亦同。\n二、第一項、第四項至第九項未修正。"},{"bill":"202110223000000","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣三萬六千元罰鍰，並沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","note":"一、修正第三項：\n(一)現行第三項規定違反第三十五條酒駕或吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品後駕駛汽機車（以下稱毒駕）規定吊扣或吊銷駕駛執照期間再次無照駕駛加處罰鍰新臺幣一萬二千元。考量吸食毒品等行為涉犯刑事法律，毒駕後再無照駕駛應有與酒駕後無照駕駛區隔加重處罰之必要。\n(二)另配合修正條文第三十五條增訂相關吸食毒品（如毒駕、拒絕接受依第三十五條第四項規定所為之毒駕稽查或測試檢定，或經確認有吸食毒品等）吊銷駕駛執照規定，其吊銷駕駛執照後再次無照駕駛亦有比照毒駕加重處罰之必要，爰增訂依第三十五條第十一項規定吊銷駕駛執照期間無照駕駛之情形，亦有本項加重處罰規定之適用。\n(三)綜上，增訂後段規定，就前開吊銷駕駛執照期間無照駕駛之罰鍰，由現行加罰新臺幣一萬二千元加重為加罰新臺幣三萬六千元。又為限制該等駕駛人繼續使用汽機車無照駕駛，並加強汽車所有人善盡車輛管理責任，爰增訂應沒入汽機車之處罰規定，且汽機車所有人與駕駛人非屬同一人時，亦沒入該汽機車。\n二、為配合第三項增訂後段規定，再次無照駕駛縱無肇事致人重傷或死亡即應沒入該汽機車，第二項無照駕駛累犯肇事致人重傷或死亡部分，考量處罰之衡平性，亦應有必要沒入該汽機車，而無裁量空間，爰將後段所定「得沒入」修正為「沒入」。\n三、另現行第九項定有汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰，爰第二項後段及第三項後段有關沒入汽機車亦有第九項規定之適用，併予敘明。\n四、第一項、第四項至第九項未修正。"},{"bill":"202110223480000","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣三萬六千元罰鍰，並沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","note":"一、修正第三項：\n(一)現行第三項規定違反第三十五條酒駕或吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品後駕駛汽機車（以下稱毒駕）規定吊扣或吊銷駕駛執照期間再次無照駕駛加處罰鍰新臺幣一萬二千元。考量吸食毒品等行為涉犯刑事法律，毒駕後再無照駕駛應有與酒駕後無照駕駛區隔加重處罰之必要。\n(二)另配合修正條文第三十五條增訂相關吸食毒品（如毒駕、拒絕接受依第三十五條第四項規定所為之毒駕稽查或測試檢定，或經確認有吸食毒品等）吊銷駕駛執照規定，其吊銷駕駛執照後再次無照駕駛亦有比照毒駕加重處罰之必要，爰增訂依第三十五條第十一項規定吊銷駕駛執照期間無照駕駛之情形，亦有本項加重處罰規定之適用。\n(三)綜上，增訂後段規定，就前開吊銷駕駛執照期間無照駕駛之罰鍰，由現行加罰新臺幣一萬二千元加重為加罰新臺幣三萬六千元。又為限制該等駕駛人繼續使用汽機車無照駕駛，並加強汽車所有人善盡車輛管理責任，爰增訂應沒入汽機車之處罰規定，且汽機車所有人與駕駛人非屬同一人時，亦沒入該汽機車。\n二、為配合第三項增訂後段規定，再次無照駕駛縱無肇事致人重傷或死亡即應沒入該汽機車，第二項無照駕駛累犯肇事致人重傷或死亡部分，考量處罰之衡平性，亦應有必要沒入該汽機車，而無裁量空間，爰將後段所定「得沒入」修正為「沒入」。\n三、另現行第九項定有汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰，爰第二項後段及第三項後段有關沒入汽機車亦有第九項規定之適用，併予敘明。\n四、第一項、第四項至第九項未修正。"}],"changed":true,"final":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣三萬六千元罰鍰，並沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。","finalWhy":"一、修正第三項：\n（一）原第三項規定違反第三十五條酒駕或吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品後駕駛汽機車（以下稱毒駕）規定吊扣或吊銷駕駛執照期間再次無照駕駛加處罰鍰新臺幣一萬二千元。考量吸食毒品等行為涉犯刑事法律，毒駕後再無照駕駛應有與酒駕後無照駕駛區隔加重處罰之必要。\n（二）另配合修正條文第三十五條增訂相關吸食毒品（如毒駕、拒絕接受依第三十五條第四項規定所為之毒駕稽查或測試檢定，或經確認有吸食毒品等）吊銷駕駛執照規定，其吊銷駕駛執照後再次無照駕駛亦有比照毒駕加重處罰之必要，爰增訂依第三十五條第十一項規定吊銷駕駛執照期間無照駕駛之情形，亦有本項加重處罰規定之適用 。\n（三）綜上，增訂後段規定，就前開吊銷駕駛執照期間無照駕駛之罰鍰，由原加罰新臺幣一萬二千元加重為加罰新臺幣三萬六千元。又為限制該等駕駛人繼續使用汽機車無照駕駛，並加強汽車所有人善盡車輛管理責任，爰增訂應沒入汽機車之處罰規定，且汽機車所有人與駕駛人非屬同一人時，亦沒入該汽機車。\n二、為配合第三項增訂後段規定，再次無照駕駛縱無肇事致人重傷或死亡即應沒入該汽機車，第二項無照駕駛累犯肇事致人重傷或死亡部分，考量處罰之衡平性，亦應有必要沒入該汽機車，而無裁量空間，爰將後段所定「得沒入」修正為「沒入」。\n三、另原第九項定有汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰，爰第二項後段及第三項後段有關沒入汽機車亦有第九項規定之適用，併予敘明。\n四、第一項、第四項至第九項未修正。","review":{"note":"修正通過","text":"汽機車駕駛人有下列第一款至第五款情形之一者，機車駕駛人處新臺幣一萬八千元以上三萬六千元以下罰鍰，汽車駕駛人處新臺幣三萬六千元以上六萬元以下罰鍰，第六款至第九款情形之一者，處新臺幣六千元以上一萬二千元以下罰鍰，並均當場移置保管該汽機車：\n一、未領有駕駛執照駕駛小型車或機車。\n二、領有機車駕駛執照，駕駛小型車。\n三、使用偽造、變造或矇領之駕駛執照駕駛小型車或機車。\n四、駕駛執照業經吊銷、註銷仍駕駛小型車或機車。\n五、駕駛執照吊扣期間駕駛小型車或機車。\n六、領有學習駕駛證，而無領有駕駛執照之駕駛人在旁指導，在駕駛學習場外學習駕車。\n七、領有學習駕駛證，在駕駛學習場外未經許可之學習駕駛道路或規定時間駕車。\n八、未領有駕駛執照，以教導他人學習駕車為業。\n九、其他未依駕駛執照之持照條件規定駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反前項第一款至第五款規定者依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元；十年內第二次違反前項第六款至第九款規定者，處新臺幣二萬四千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣六千元，並均當場移置保管該汽機車；如肇事致人重傷或死亡，沒入該汽機車。\n汽機車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣一萬二千元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣三萬六千元罰鍰，並沒入該汽機車。\n第一項第九款駕駛執照之持照條件規定，由交通部定之。\n汽機車駕駛人違反第一項第一款至第五款規定者，除依第一項及第二項規定處罰外，應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第三款及第四款之駕駛執照，均應扣繳之；第五款並吊銷其駕駛執照。\n違反第一項第一款至第五款之情形之一，使用之汽機車於移置保管該汽機車時，扣繳其牌照，並吊扣該汽機車牌照三個月；十年內違反二次者，吊扣該汽機車牌照六個月；十年內違反三次以上者，吊扣該汽機車牌照一年。\n違反第一項第一款至第五款之情形之一，非汽機車駕駛人之所有人依第一項及第二項規定處罰鍰。\n十四歲以上未成年之人，違反第一項第一款或第三款規定者，交通勤務警察或依法令執行交通稽查任務人員應將違規事實以書面或其他方式通知其法定代理人或監護人。\n汽機車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽機車所有人不受本條之處罰。"}},{"no":"第二十一條之一","current":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，得沒入該汽車。\n汽車駕駛人於依第三十五條第一項規定吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣四萬元罰鍰。\n第一項及第二項駕駛人應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第五款或第六款之駕駛執照，均應扣繳之；第七款並吊銷其駕駛執照。\n違反第一項情形使用之汽車，於移置保管該汽車時，扣繳其牌照，並吊扣該汽車牌照三個月；十年內違反二次者，吊扣該汽車牌照六個月；十年內違反三次以上者，吊扣該汽車牌照一年。\n汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當之注意而仍不免發生違規者，汽車所有人不受本條之處罰。","versions":[{"bill":"202110219460000","text":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，得沒入該汽車。\n汽車駕駛人於依第三十五條、第三十五條之一規定吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣二十萬元罰鍰。\n第一項及第二項駕駛人應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第五款或第六款之駕駛執照，均應扣繳之；第七款並吊銷其駕駛執照。\n違反第一項情形使用之汽車，於移置保管該汽車時，扣繳其牌照，並吊扣該汽車牌照三個月；十年內違反二次者，吊扣該汽車牌照六個月；十年內違反三次以上者，吊扣該汽車牌照一年。\n汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當之注意而仍不免發生違規者，汽車所有人不受本條之處罰。","note":"配合本次修正草案，進行文字修正，並調整加罰之金額上限。"},{"bill":"202110222600000","text":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，得沒入該汽車。\n汽車駕駛人於依第三十五條第一項規定吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣四萬元罰鍰。\n汽車駕駛人於依第三十五條之一第一項規定吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣十萬元罰鍰，並沒入該車輛。\n第一項及第二項駕駛人應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第五款或第六款之駕駛執照，均應扣繳之；第七款並吊銷其駕駛執照。\n違反第一項情形使用之汽車，於移置保管該汽車時，扣繳其牌照，並吊扣該汽車牌照三個月；十年內違反二次者，吊扣該汽車牌照六個月；十年內違反三次以上者，吊扣該汽車牌照一年。\n汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當之注意而仍不免發生違規者，汽車所有人不受本條之處罰。","note":"一、第一項至第三項未修正。\n二、增訂第四項，對因毒駕吊銷駕駛執照，又無照駕駛汽機車者，加重處罰。\n三、配合前項增訂，第四項至第九項移列項次。"},{"bill":"202110223520000","text":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，沒入該汽車。\n汽車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣四萬元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣八萬元罰鍰，並沒入該汽車。\n第一項及第二項駕駛人應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第五款或第六款之駕駛執照，均應扣繳之；第七款並吊銷其駕駛執照。\n違反第一項情形使用之汽車，於移置保管該汽車時，扣繳其牌照，並吊扣該汽車牌照三個月；十年內違反二次者，吊扣該汽車牌照六個月；十年內違反三次以上者，吊扣該汽車牌照一年。\n汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當之注意而仍不免發生違規者，汽車所有人不受本條之處罰。","note":"一、修正第二項，理由同修正條文第二十一條說明三。\n二、修正第三項，理由同修正條文第二十一條說明一和二。\n三、另現行第六項定有汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽車所有人不受本條之處罰，爰第二項後段及第三項後段沒入汽車亦有第六項規定之適用，併予敘明。"},{"bill":"202110222920000","text":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，沒入該汽車。\n汽車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣四萬元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣八萬元罰鍰，並沒入該汽車。\n第一項及第二項駕駛人應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第五款或第六款之駕駛執照，均應扣繳之；第七款並吊銷其駕駛執照。\n違反第一項情形使用之汽車，於移置保管該汽車時，扣繳其牌照，並吊扣該汽車牌照三個月；十年內違反二次者，吊扣該汽車牌照六個月；十年內違反三次以上者，吊扣該汽車牌照一年。\n汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當之注意而仍不免發生違規者，汽車所有人不受本條之處罰。","note":"一、修正第三項，理由同修正條文第二十一條說明一。\n二、修正第二項，理由同修正條文第二十一條說明二。\n三、另現行第六項定有汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽車所有人不受本條之處罰，爰第二項後段及第三項後段沒入汽車亦有第六項規定之適用，併予敘明。\n四、第一項、第四項至第六項未修正。"},{"bill":"202110223500000","text":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，得沒入該汽車。\n汽車駕駛人於依第三十五條第一項至第五項規定吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣四萬元罰鍰；其屬依第三十五條第一項第二款或拒絕接受其稽查、測試檢定、第十一項吊銷駕駛執照，違反第一項第一款至第五款者，按第一項或第二項所處罰鍰加罰新臺幣十萬元罰鍰，並得沒入該汽車。\n第一項及第二項駕駛人應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第五款或第六款之駕駛執照，均應扣繳之；第七款並吊銷其駕駛執照。\n違反第一項情形使用之汽車，於移置保管該汽車時，扣繳其牌照，並吊扣該汽車牌照三個月；十年內違反二次者，吊扣該汽車牌照六個月；十年內違反三次以上者，吊扣該汽車牌照一年。\n汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當之注意而仍不免發生違規者，汽車所有人不受本條之處罰。","note":"一、修正第三項：\n(一)汽車駕駛人如違反第三十五條第二項至第五項規定吊扣或吊銷駕駛執照期間再無照駕駛，現行並無加重處罰規定，為與第二十一條相同規範，爰一併納為加罰對象。\n(二)現行第三項已有因違反第三十五條酒駕或毒駕規定吊扣或吊銷駕駛執照期間再次無照駕駛大型車，加處罰鍰四萬元之規定，考量吸毒本身涉犯刑事法令，毒駕後再無照駕駛應有與酒駕後無照駕駛區隔加重處罰之必要。\n(三)另配合第三十五條增訂相關施用毒品吊銷駕駛執照規定，其吊銷駕駛執照後再次無照駕駛亦有比照毒駕加重處罰之必要。\n(四)綜上，增訂後段規定，罰鍰由現行加罰二萬四千元加重為加罰十萬元。又為限制該等駕駛人繼續使用車輛無照駕駛，並加強汽車所有人善盡車輛管理責任，爰增加沒入車輛之處罰規定，且汽機車所有人與駕駛人為非屬同一人時，亦得沒入車輛。"},{"bill":"202110222770000","text":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，得沒入該汽車。\n汽車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣四萬元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣八萬元罰鍰，並沒入該汽車。\n第一項及第二項駕駛人應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第五款或第六款之駕駛執照，均應扣繳之；第七款並吊銷其駕駛執照。\n違反第一項情形使用之汽車，於移置保管該汽車時，扣繳其牌照，並吊扣該汽車牌照三個月；十年內違反二次者，吊扣該汽車牌照六個月；十年內違反三次以上者，吊扣該汽車牌照一年。\n汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當之注意而仍不免發生違規者，汽車所有人不受本條之處罰。","note":"一、修正理由同二十一條說明一。\n二、第一項、第四項至第六項未修正。"},{"bill":"202110223000000","text":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，沒入該汽車。\n汽車駕駛人於依第三十五條第一項至第五項吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣四萬元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣八萬元罰鍰，並沒入該汽車。\n第一項及第二項駕駛人應吊扣其駕駛執照一年至二年；因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領；第一項第五款或第六款之駕駛執照，均應扣繳之；第七款並吊銷其駕駛執照。\n違反第一項情形使用之汽車，於移置保管該汽車時，扣繳其牌照，並吊扣該汽車牌照三個月；十年內違反二次者，吊扣該汽車牌照六個月；十年內違反三次以上者，吊扣該汽車牌照一年。\n汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當之注意而仍不免發生違規者，汽車所有人不受本條之處罰。","note":"一、修正第三項，理由同修正條文第二十一條說明一。\n二、修正第二項，理由同修正條文第二十一條說明二。\n三、另現行第六項定有汽車所有人已善盡查證駕駛人駕駛執照資格之注意，或縱加以相當注意而仍不免發生違規者，汽車所有人不受本條之處罰，爰第二項後段及第三項後段沒入汽車亦有第六項規定之適用，併予敘明。\n四、第一項、第四項至第六項未修正。"},{"bill":"202110223480000","text":"汽車駕駛人駕駛聯結車、大客車或大貨車有下列情形之一者，汽車所有人及駕駛人各處新臺幣四萬元以上八萬元以下罰鍰，並當場移置保管該汽車：\n一、未領有駕駛執照駕車。\n二、領有機車駕駛執照駕車。\n三、領有小型車駕駛執照駕車。\n四、領有大貨車駕駛執照，駕駛大客車、聯結車或持大客車駕駛執照，駕駛聯結車。\n五、駕駛執照業經吊銷、註銷仍駕車。\n六、使用偽造、變造或矇領之駕駛執照駕車。\n七、駕駛執照吊扣期間駕車。\n本條例中華民國一百十四年十月二十八日修正公布條文施行之日起，汽車駕駛人於十年內第二次違反前項規定者，依前項所定罰鍰最高額處罰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均當場移置保管該汽車；如肇事致人重傷或死亡，沒入該汽車。\n汽車駕駛人於依第三十五條第一項至第五項規定吊扣或吊銷駕駛執照期間，違反第一項第一款至第五款規定者，按第一項或第二項所處罰鍰加罰新臺幣四萬元罰鍰；其屬違反第三十五條第一項第二款、拒絕接受該款稽查或測試檢定，或違反同條第十一項吊銷駕駛執照期間，違反第一項第一款至第 之注意而仍不免發生違規者，汽車所有人不受本條之處罰。"}},{"no":"第三十五條","current":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","versions":[{"bill":"202110209380000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。汽機車駕駛人有第一項第二款吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品之情形，年滿十八歲之同車乘客明知其情事者，亦同。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、於本條文第八項新增毒駕之同車乘客連坐處罰規定。\n二、考量毒駕之徵兆與酒味不同，針對毒駕同車乘客之處罰限縮於「明知」之要件，以符比例原則。\n三、處罰對象與免罰例外情形均比照酒駕規定辦理。"},{"bill":"202110209250000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第三款或第四款嫌疑，拒絕接受毒品唾液快篩試劑檢測（以下簡稱唾液快篩檢測）或無法實施唾液快篩檢測者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施非侵入式濫用藥物尿液檢驗（以下簡稱尿液採驗）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施尿液採驗，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受尿液採驗者得於受尿液採驗後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車有下列各款情形之一者，同車之年滿十八歲乘客，處新臺幣六千元以上一萬五千元以下罰鍰；但年滿七十歲、心智障礙或汽車運輸業之同車乘客，不在此限：\n一、經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、唾液快篩檢測或尿液採驗結果呈毒品陽性反應。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定及第七項毒品唾液快篩檢測、尿液採驗結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液、唾液及尿液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、新增第七項，其他項次依序調整；修正現行條文第八項及第十三項。\n二、有鑑於交通部與內政部警政署，為有效遏止毒駕，自114年11月20日起正式啟用「毒品唾液快篩試劑」，惟卻僅有《違反道路交通管理事件統一裁罰基準及處理細則》作為執法及裁罰依據；又，現行條文亦未就毒駕發生事故後，拒絕檢測或無法檢測之毒駕行為人，進行合法採驗之相關規定，實務上業已造成執法困境，更有違反法律保留與明確性原則，形成執法漏洞，自有填補必要，先予敘明。\n三、審酌毒品唾液快篩試劑仍有其技術上之侷限性，如事故發生後駕駛人拒絕檢測或無法檢測（如唾液過少或行為人受傷等情形），亦無法源依據授權執法單位，得比照同條第六項酒駕強制檢測規定，將毒駕行為人移送醫療或檢驗機構施行進一步採驗措施，嚇阻性與預防性顯有不足；爰此，參考111年憲判字第16號意旨及《刑事訴訟法》第二百零五條之二規定，針對事故後拒絕受測或無法檢測者，得依照檢察官保留原則，進行非侵入式之尿液採驗，以期達到毒駕防制效果。\n四、又，因「酒駕、毒駕零容忍」乃是社會共識，惟現行條文僅於汽機車所有人知悉有駕駛人有毒駕、酒駕情事者，設有連帶處罰規定；乘客部分則僅有酒駕同車者有連帶處罰條文，而漏未規定毒駕乘客之連帶責任。鑒於毒駕之危害性不亞於酒駕，毒品使用後效應亦會影響駕駛人之注意力及判斷力，無論乘客是否有同樣施用毒品行為，於知悉駕駛人有毒品施用情形，亦應比照酒駕者拒絕同車搭乘或有所制止，以達「防制毒駕、人人有責」之目的。\n五、末按唾液、尿液與血液之測試結果，除得作為判斷是否違反本條、刑法第一百八十五條之三各款利用，其中檢體包含之基因遺傳及疾病資訊，亦涉及個人隱私資料保護；復審酌上開體液亦具有疾病傳染性，遂基於保障訴訟程序正義、個人隱私保護及公共衛生疾病防治等目的，自應有專業、合法之處理程序，併予敘明。"},{"bill":"202110215850000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，將其強制移由受委託醫療機構進行酒癮評估及治療，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n汽機車駕駛人，經前項測試檢定吐氣所含酒精濃度或血液中酒精濃度相關規定，並違反第三項、第五項之酒駕累犯者，其國民身分證應換領，並強制註記屬該類別之人口及不得販賣、交付其含酒精之物。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、鑑於近年來酒駕再犯率居高不下，且其中有酒癮之情事，使酒駕者常存有僥倖心態，繼續行駛汽機車於道路，故修正第五項，納入將酒駕累犯者強制移由受委託醫療機構進行酒精成癮評估及治療，以強化本法確保交通安全之意旨。\n二、為有效遏止及防範不幸交通事故之發生，應從源頭管理，對於汽機車酒駕累犯者，其國民身分證應換領，並強制註記屬該類別之人口及禁止販賣、交付其含酒精之物，俾保後續酒販賣業者、餐飲商家及相關吸食酒精物提供者，進行查證與禁止給付等行為。爰增訂第九項規定，為維護人與車之友善安全及端正酒駕累犯歪風。"},{"bill":"202110217340000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣三萬元以上九萬元以下罰鍰，汽車駕駛人處新臺幣五萬元以上二十萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十五年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二十萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣三萬元以上十八萬元以下罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十五年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，或吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品，其年滿十八歲之同車乘客處新臺幣三萬元以上九萬元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、毒駕案件是倍數升高，近三年的毒駕案件，每年都超過數千件，除嚴重危害道路交通安全，亦造成許多民眾家庭生命與財產的重大損失，甚至造成執勤之警務人員，喪失生命。因此嚇阻吸毒者駕車，除需再提高相關罰則，也需將同車乘客之社會連坐責任，列入罰則之中。\n二、爰提案修正本條第一項、第三項、第四項、第五項與第八項部分文字。除提高相關罰則外，亦將與毒駕者同車之同車乘客，納入懲處範圍。\n三、第二項、第六項、第七項、第九項、第十項、第十一項、第十二項與第十三項，文字未修正。"},{"bill":"202110217450000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽機車駕駛人有事實足認有施用毒品、迷幻藥、麻醉藥品或其他相類似管制藥品後駕車之情形者，警察機關得實施唾液、口腔黏膜或其他必要之初步檢測；必要時，並得移送醫療或檢驗機構採集尿液、血液或其他檢體。\n前項駕駛人經檢測或採驗結果呈陽性，或有其他事證足認其有施用毒品、迷幻藥、麻醉藥品或其他相類似管制藥品後駕車之情形者，依第一項第二款規定處罰。\n汽車駕駛人有第一項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定、第二項檢測或採驗者。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者、第二項檢測或採驗者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第五項至第七項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第五項至第七項規定之一者，依其駕駛車輛分別依第一項、第五項至第七項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第五項至第七項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第八項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、近年毒駕案件頻傳，施用毒品後駕車易致精神恍惚、幻覺及判斷能力下降，對道路交通安全及國人生命身體法益危害重大，爰強化毒駕防制規範。\n二、增訂警察機關對疑似毒駕者，得實施唾液、口腔黏膜或其他必要之初步檢測，必要時並得移送醫療或檢驗機構採集尿液、血液或其他檢體，以利即時執法及蒐證。\n三、明定駕駛人經檢測或採驗結果呈陽性，或有其他事證足認施用毒品後駕車者，依毒駕規定處罰，以完善毒駕認定標準。\n四、增列拒絕檢測、規避採驗及事故後再行施用毒品等規範，並加重處罰，以防杜規避查緝行為。\n五、配合增訂司法警察機關於特定情形下，得報請檢察官核發鑑定許可書或於急迫情況先行實施血液採驗之程序，以兼顧執法需要及程序正義。\n六、明定血液測試檢定結果之蒐集、處理及利用，應依個人資料保護法辦理，並授權訂定相關檢測、保存及銷毀辦法，以兼顧人民隱私權保障。\n七、透過強化毒駕檢測、採驗及處罰機制，提升執法效能及嚇阻效果，以維護道路交通安全及保障國人生命身體安全。"},{"bill":"202110218440000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上十八萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車駕駛人明知其曾因違反第一項第二款、刑法第一百八十五條之三第一項第三款或第四款規定，經依法吊銷駕駛執照或不得再考領駕駛執照，仍借用、租賃或駕駛非屬本人所有之汽機車違反第一項第二款規定者，依第一項所處罰鍰加罰二分之一。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。汽機車駕駛人有第一項第二款吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之情形，年滿十八歲之同車乘客，不以明知其情事為限，亦同。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n汽機車駕駛人違反第一項第二款規定者，應即移置保管該汽機車；經裁決確定後，沒入之。違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、第一項修正。考量汽車車體重量、行駛速度及碰撞動能通常高於機車，酒後、宿醉或吸食毒品、迷幻藥、麻醉藥品或其相類似管制藥品後駕駛汽車，對行人、機車騎士及其他用路人所生危害甚鉅。現行汽車駕駛人罰鍰下限為新臺幣三萬元、上限為新臺幣十二萬元，尚不足充分反映實際致害風險及嚇阻需求，爰將汽車駕駛人罰鍰下限提高為新臺幣六萬元、上限提高為新臺幣十八萬元。\n二、第七項修正。毒駕行為人曾因毒駕受吊銷駕駛執照或不得再考領駕駛執照之處分，卻仍明知其已喪失駕駛資格，並以借用、租賃或駕駛非本人所有汽機車之方式再犯毒駕，顯示其對道路交通秩序及公共安全之漠視，且具有較高再犯危險性。為避免行為人利用他人車輛規避行政管制，爰明定其依第一項所處罰鍰加罰二分之一。\n三、第八項修正。現行條文已就酒駕同車成年乘客設有罰鍰規定，本次增訂毒駕同車乘客行政責任。毒駕危害與酒駕同具高度公共危險性，成年同車乘客對於搭乘車輛是否具有明顯危險狀態，應負一定注意及避免助長危險駕駛之義務，爰明定汽機車駕駛人有第一項第二款情形時，年滿十八歲之同車乘客不以明知其情事為限，亦處新臺幣六千元以上一萬五千元以下罰鍰。惟年滿七十歲、心智障礙或汽車運輸業之乘客，因其判斷能力、實際阻止能力或搭乘性質不同，仍依現行但書排除處罰。\n四、第九項修正。毒駕行為具高度公共危險性，為強化源頭遏阻，明定違反第一項第二款者，應即移置保管汽機車，並於裁決確定後沒入之。\n五、第十項至第十三項未修正。"},{"bill":"202110218770000","text":"汽機車駕駛人，駕駛汽機車經測試檢定，酒精濃度超過規定標準者，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人，駕駛汽機車經測試檢定，有吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品情形者，機車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上十八萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照二年至四年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照四年至六年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽車駕駛人有第一項或第二項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項或第二項規定者，依其駕駛車輛分別依第一項或第二項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項或第二項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項或第二項測試檢定。\n三、接受第一項或第二項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項或第二項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第五項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第二項、第四項至第六項之情形之一，吊扣該汽機車牌照五年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第二項、第四項至第六項規定之一者，依其駕駛車輛分別依第一項、第二項、第四項至第六項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第二項、第四項至第六項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第七項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、現行第一項將酒後駕車與施用毒品後駕車併列規範，惟二者於危害態樣、成因及對交通安全之風險程度有所差異，爰將現行第一項拆分為第一項及第二項，分別規範酒後駕車與施用毒品後駕車行為。考量施用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品後駕車，對駕駛人之認知、判斷及反應能力影響程度及持續期間具高度不確定性，對交通安全危害較鉅，爰提高第二項罰鍰額度及駕駛執照吊扣期間，並同步提高附載未滿十二歲兒童或因而肇事致人受傷之加重處分，以強化防制毒駕之嚇阻效果。又配合前開拆分，現行第一項第一款及第二款規定刪除。\n二、配合第一項拆分為二項規範，爰調整項次，現行第二項、第三項、第四項、第五項、第六項調整項次依序遞延，並修正引用項次文字，以資明確。\n三、現行第七項條文規定汽機車所有人明知駕駛人有違反第一項各款情形而不予禁止駕駛者，另處以罰鍰。惟汽機車所有人將車輛交由他人使用，本已負有相當之選任及管理責任；又本次修正已透過提高牌照吊扣期間（現行條文第九項），強化車輛使用之管制效果，使車主對借用對象之選擇更為審慎，並以車輛處分作為主要管制手段，已足以達成防制酒後駕車及施用毒品後駕車之立法目的，爰刪除第七項規定。\n四、配合第一項及第二項之拆分，爰修正第九項違規態樣之引用項次。另考量酒後駕車及施用毒品後駕車行為對道路交通安全危害重大，為強化汽機車所有人對車輛使用之管理責任，促使車主於借用車輛時更加審慎評估借用對象之適格性，並提升防制酒駕、毒駕之嚇阻效果，爰將牌照吊扣期間由二年提高為五年，以維護交通安全及落實公共危險預防目的。\n五、配合項次修正，爰併同修正第十項、第十一項及第十三項所涉引用項次。"},{"bill":"202110218930000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上十八萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事或附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"隨著近期「喪屍菸彈」（依托咪酯）等新興毒品引發的毒駕案件暴增，民眾對道路安全的憂慮顯著提升。民眾對毒駕的普遍認為強烈憤慨與零容忍，因此修法重罰。"},{"bill":"202110219570000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有酒精濃度超過規定標準之情形，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十五年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十五年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、考量毒駕與酒駕之危害本質、社會惡性與防制手段有所不同，不宜混置於同一條文內合併處罰。為彰顯政府強力打擊毒駕之鐵腕決心，爰將現行第一項第二款「吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品」之條文移出，另行增訂第三十五條之三專條規範。\n二、配合毒駕移出本條，相應刪除現行第一項各款之分列、第四項第三款與第四款關於毒品藥物之文字，使本條聚焦規範酒後駕車之行政處罰。\n三、鑑於酒駕重複違規者對公共安全危害極巨，現行「十年」之累犯管制期限已不足以產生長期制約與預防功能。為提高處罰並防杜僥倖，爰將第三項之酒駕累犯及第五項之酒駕拒測累犯之重罰管制期限，由「十年內」全面延長修正為「十五年內」。"},{"bill":"202110219610000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣三萬元以上九萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十二萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十二年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，或吸食服用毒品、迷幻藥、麻醉藥品或其相類似之管制藥品，年滿十八歲之同車乘客處新臺幣二萬四千元以上六萬元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、修正第一項、第三項、第五項及第八項。\n二、近年毒駕案件持續增加，114年全國共查獲毒駕案件8,659件；115年1月至4月已查獲4,725件，115年5月24日至5月29日間查獲毒駕案件581件，嚴重危害道路交通安全及人民生命財產安全，現行罰鍰標準及累犯處罰規定之嚇阻效果尚有強化空間，爰修正第一項、第三項及第五項，提高相關罰鍰額度及累犯加重處罰標準，以提升違規成本及防制效果。\n三、考量毒駕與酒駕對道路交通安全造成之危害程度相當，且同車乘客對駕駛人飲酒或施用毒品後駕車之情形，通常具有一定程度之認知及勸阻可能性，爰修正第八項，將同車乘客處罰規定擴及毒駕行為，並提高罰鍰額度，以督促同車乘客善盡勸阻義務，共同維護道路交通安全。"},{"bill":"202110219910000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照一年至二年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照二年至四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n有前項第二款情形者，加重其罰鍰二分之一，並當場移置保管該汽機車，吊銷其駕駛執照，三年內不得再考領；並應強制移由受委託醫療機構進行藥癮（物質使用障礙症）評估及治療。\n汽車駕駛人有第一項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第五項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，或有第一項第二款吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之情形者，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第四項至第六項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第四項至第六項規定之一者，依其駕駛車輛分別依第一項、第四項至第六項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第四項至第六項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第七項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、第一項未修正。\n二、增訂第二項，鑑於施用毒品或管制藥品後駕車（毒駕），其精神耗弱與幻覺程度遠甚於酒駕，對公共安全具備極高之實質侵害與主觀惡意，且成癮者常伴隨高度之物質依賴。現行法將毒駕與酒駕初犯併列相同處分，顯難起嚇阻與矯治成效。爰增訂第二項，明定駕駛人若有第一項第二款毒駕情形者，初犯即加重罰鍰二分之一，並當場移置保管該汽機車，吊銷其駕駛執照，三年內不得再考領；並首度導入行政強制戒治手段，明定應強制移由受委託醫療機構進行藥癮（物質使用障礙症）之評估及治療，期能由醫療端源頭拔除再犯病灶。\n三、第三項由現行條文第二項移列，並酌作文字修正。\n四、第四項、第五項由現行條文第三項、第四項移列，內容未做修正。\n五、第六項由現行條文第五項移列，並酌作文字修正，修正序號。\n六、第七項、第八項由現行條文第六項、第七項移列，內容未修正。\n七、修正第九項，由現行條文第八項移列。現行乘客連坐處分僅局限於駕駛人酒精濃度超標之樣態，然毒駕常具備同儕集體施用、群聚犯罪之特性，同車乘客通常具備勸阻與預見可能性，放任其駕車上路對公共安全危害甚鉅。爰修正第九項，將「駕駛人有第一項第二款毒駕情形」納入同車乘客之連坐裁罰範疇，處新臺幣六千元以上一萬五千元以下罰鍰，以強化同儕共同監督之責任。\n八、修正第十項，由現行條文第九項移列，配合項次調整，將條文內「違反第一項、第三項至第五項」之文字，配合項次移動修正為「違反第一項、第四項至第六項」，其餘規定未修正。\n九、修正第十一項，由現行條文第十項移列，配合項次調整，將條文內引述之項次「違反第一項、第三項至第五項」，配合修正為「違反第一項、第四項至第六項」，其餘規定未修正。\n十、修正第十二項，本項由現行條文第十一項移列，配合項次調整，將條文內引述之項次「有第一項、第三項至第五項之情形」，修正為「有第一項、第四項至第六項之情形」，其餘規定未修正。\n十一、修正第十三項，本項由現行條文第十二項移列，配合項次調整，將條文首字修正為「前項汽機車駕駛人」，其餘內容未修正。\n十二、第十四項由現行條文第十三項移列，配合項次調整酌做文字修正。"},{"bill":"202110219460000","text":"汽機車駕駛人，經測試檢定有下列情形之一者，依規定處罰之，並均當場移置保管該車輛：\n一、駕駛汽機車，酒精濃度超過規定標準，機車駕駛人處新臺幣一萬五千元以上九萬元以下罰鍰，汽車駕駛人處新臺幣三萬元以上十二萬元以下罰鍰，並均吊扣其駕駛執照一年至二年。\n二、施用第一級、第二級毒品或其相類似之管制藥品，檢定結果呈現陽性反應，機車駕駛人處新臺幣九萬元以上三十萬元以下罰鍰，汽車駕駛人處新臺幣十二萬元以上六十萬元以下罰鍰，吊銷其駕駛執照，四年內不得再考領。\n三、施用第三級、第四級毒品、迷幻藥、麻醉藥品或其相類似之管制藥品，檢定結果呈現陽性反應，機車駕駛人處新臺幣九萬元以上二十四萬元以下罰鍰，汽車駕駛人處新臺幣十二萬元以上四十五萬元以下罰鍰，吊扣其駕駛執照四年。\n有前項各款情形，附載有未滿十二歲兒童之人或因而肇事致人受傷，依下列規定加重處罰：\n一、違反前項第一款，吊扣其駕駛執照二年至四年；駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣駕駛執照期間加倍處罰。\n二、違反前項第二款、第三款，依其駕駛車輛所處罰鍰及吊扣、吊銷駕駛執照期間，加罰二分之一；駕駛營業用大客車者，吊銷其駕駛執照，五年內不得再考領；因而肇事且附載有未滿十二歲兒童之人者，按其吊扣、吊銷駕駛執照期間加倍處罰。\n汽機車駕駛人有第一項各款情形，因肇事致人重傷或死亡者，按其罰鍰加倍處罰，並吊銷其駕駛執照，不得再考領。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項第一款規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，公路主管機關得公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n本條例中華民國○年○月○日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項第二款或第三款規定者，依其駕駛車輛分別依第二款、第三款所定罰鍰最高額處罰之；第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二十四萬元，該車輛不問屬於受處罰人與否，均沒入之，並吊銷其駕駛執照。公路主管機關應公布其姓名、照片及違法事實；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。","note":"一、修正本條文。\n二、有鑑於「酒駕、毒駕零容忍」乃是社會共識，然隨著新興毒品取得容易，近年毒駕之取締件數亦呈現倍數增長，自113年至115年4月，已造成至少42人死亡，對於整體社會秩序與交通安全危害堪稱重大。再者，審酌毒駕乃為施用毒品與危險駕駛之結合犯罪，惡性程度上亦較一般酒後駕車更為嚴重，故予以進行分別處理，加重毒駕之現行罰則；並參考毒品犯罪防治法之立法體例，另就毒駕施用毒品之級別予以區分，藉此提升毒駕者之違法成本。\n三、另，由於實務上，酒駕、毒駕之結果樣態多元，故參酌現行條文第三十五條原列加重處罰類別，進行文字調整，並強化毒駕處罰，以達嚇阻施用毒品後危險駕駛之目的。"},{"bill":"202110221630000","text":"汽機車駕駛人，駕駛汽機車經測試檢定有下列情形之一，機車駕駛人處新臺幣三萬元以上九萬元以下罰鍰，汽車駕駛人處新臺幣六萬元以上十八萬元以下罰鍰，並均當場移置保管該汽機車及吊扣其駕駛執照三年；附載未滿十二歲兒童或因而肇事致人受傷者，並吊扣其駕駛執照四年；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、酒精濃度超過規定標準。\n二、吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽車駕駛人有前項應受吊扣情形時，駕駛營業大客車者，吊銷其駕駛執照；因而肇事且附載有未滿十二歲兒童者，按其吊扣駕駛執照期間加倍處分。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣九萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，並不得再考領；公路主管機關得公布其姓名、照片及違法事實。\n汽機車駕駛人有下列各款情形之一者，處新臺幣十八萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行第一項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受第一項測試檢定。\n三、接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受第一項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n本條例中華民國一百零八年四月十七日修正公布條文施行之日起，汽機車駕駛人於十年內第二次違反第四項規定者，處新臺幣三十六萬元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣十八萬元，並均應當場移置保管該汽機車、吊銷其駕駛執照，並不得再考領；公路主管機關得公布其姓名、照片及違法事實。\n汽機車駕駛人駕車發生交通事故，涉犯刑法第一百八十五條之三第一項第一款或第二款嫌疑，拒絕接受或發生交通事故無法實施第一項第一款測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構對其實施血液檢體採樣及酒精濃度測試檢定（以下簡稱血液測試檢定）；有相當理由認為情況急迫時，司法警察官或司法警察得將其先行移由醫療或檢驗機構實施血液測試檢定，並應於實施後二十四小時內陳報該管檢察官許可，檢察官認為不應許可者，應於三日內撤銷之，受血液測試檢定者得於受血液測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰；汽機車駕駛人有第一項第二款情形者，年滿十八歲之同車乘客，亦同。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n汽機車駕駛人違反第一項、第三項至第五項之情形之一，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；吸食毒品、迷幻藥、麻醉藥品或其相類似之管制藥品或因而肇事致人重傷或死亡，沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依第一項、第三項至第五項所處罰鍰加罰二分之一。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項血液測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液採集、測試檢定、保存、銷毀、安全維護措施等程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、依內政部警政署之統計，2025年全台毒駕移送案件暴增至8,659件，較2024年的2,619件增約3.3倍，創下歷年新高，而2026年一至四月份則已有4,725件毒駕案。毒駕案的增加與近年新興菸品、類菸品及電子菸因其體積小或特殊香味而快速流竄於市面有高度相關，其中電子菸使用之菸彈更因可加入「依托咪酯」成分而被稱為喪屍煙彈，依托咪酯因起效快、容易造成意識混亂與肌肉抽搐，已成為近期多起重大毒駕事故的風險來源，對其他用路人之安全產生重大違害。雖目前已有酒駕、毒駕之懲處，惟目前罰則恐不足以達到嚇阻之作用，考量機車、汽車車體重量、速度及碰撞動能所致之損傷或損毀有所差異，故修正第一項，將機車駕駛人酒駕或毒駕之最低罰鍰提高至三萬，汽車駕駛人之罰鍰提高至六萬元以上十八萬元以下，並同步提高吊扣駕照之年限。\n二、酒駕及毒駕行為人，係因自身選擇而僥倖駕駛汽機車，將風險外部化致用路人須因此承擔極大風險及危害，而若再犯，亦可顯示前次罰鍰對其並未達到矯正及嚇阻成效，故修正第三項及第五項，應於其再犯時除罰鍰加重外，其吊銷駕照後亦不得再次考領，以利剝奪其實質駕駛資格，又因年限依民國一百零八年四月十七日修正公布之日起算，故為銜接已再犯而草案修正後第三次再犯者均應使其不得再次考領駕照，不以是否致人重傷或死亡為限。\n三、現行法規對於酒駕行為人之同車乘客定有罰鍰之規定，係為增加實質嚇阻力。毒駕與酒駕皆具高度公共危險性，同車之乘客亦應有相同積極監督之義務，以避免助長危險駕駛，惟目前僅針對酒駕有連坐罰之規定，故修正第八項，並考量十八歲以下之乘客實質勸阻力及判斷力較不足，增加滿十八歲同車乘客之罰鍰，以強化監督之力度與義務。\n四、依刑事局2026年五月公布之統計，2026年一月至四月全國已查獲移送毒駕案件4,725件，較去年同期暴增近3倍，為增加實質嚇阻力，故修正第九項，毒駕之車輛不問其所有人為何，亦不論是否肇事致人於重傷或死亡，一律沒入該車輛。"},{"bill":"202110221420000","text":"汽機車駕駛人，駕駛汽機車有下列情形之一者，機車駕駛人處新臺幣六萬元以上十八萬元以下罰鍰，汽車駕駛人處新臺幣十二萬元以上二十四萬元以下罰鍰，並均當場移置保管該汽機車、吊銷其駕駛執照，三年內不得考領；附載未滿十二歲兒童或因而肇事致人受傷者，五年內不得考領；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、經測試檢定其酒精濃度超過規定標準。\n二、經測試檢定其尿液、血液、唾液或其他檢體含有毒品、迷幻藥、麻醉藥品或其相類似之管制藥品或其代謝物，達公告檢出基準，或有其他情事足認因施用前開物品致不能安全駕駛。\n汽車駕駛人有前項情形，駕駛營業大客車者，吊銷其駕駛執照，五年內不得考領；因而肇事且附載有未滿十二歲兒童者，其不得考領期間加倍處分；致人重傷或死亡者，吊銷其駕駛執照，並不得再考領。\n汽機車駕駛人於十年內再犯第一項規定者，依其駕駛車輛分別按第一項所定罰鍰最高額處罰，並當場移置保管該汽機車、吊銷其駕駛執照，不得再考領；公路主管機關得公布其姓名、照片及違法事實。\n汽機車駕駛人對於交通勤務警察或依法令執行交通稽查任務人員，依本條所為之稽查、測試檢定、檢體採樣或必要之身分、車輛查證，不得規避、拒絕、妨害或以其他方式使其不能或難以實施；有下列情形之一者，處新臺幣二十七萬元罰鍰，並當場移置保管該汽機車、吊銷其駕駛執照，五年內不得考領；如肇事致人重傷或死亡者，吊銷其駕駛執照，並不得再考領：\n一、駕駛汽機車行經警察機關設有告示執行本條測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受酒精濃度測試檢定。\n三、拒絕接受毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之檢體採樣或測試檢定。\n四、接受本條測試檢定前，吸食、施用或服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n五、發生交通事故後，在接受本條測試檢定前，吸食、施用或服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n汽機車駕駛人於十年內再犯前項規定者，處新臺幣三十六萬元罰鍰，吊銷其駕駛執照，並不得再考領；公路主管機關得公布其姓名、照片及違法事實。\n汽機車駕駛人有相當理由足認涉犯刑法第一百八十五條之三第一項、第二項各款嫌疑，拒絕接受或因交通事故、身心狀態或其他客觀情事無法實施本條測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，將其強制移由受委託醫療或檢驗機構，對其實施血液、尿液、唾液或其他必要檢體之採樣及測試檢定；有相當理由認情況急迫，或非即時採樣有證據滅失或難以保全之虞者，得先行移由醫療或檢驗機構實施採樣及測試檢定，並應於實施後二十四小時內陳報該管檢察官許可。檢察官認為不應許可者，應於三日內撤銷之；受採樣或測試檢定者，得於採樣或測試檢定後十日內，聲請該管法院撤銷之。\n汽機車所有人，明知汽機車駕駛人有第一項各款情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰，並吊扣該汽機車牌照二年。\n汽機車駕駛人，駕駛汽機車經測試檢定吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上，年滿十八歲之同車乘客處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n年滿十八歲之同車乘客，明知汽機車駕駛人有第一項第二款情形而仍同車乘坐者，處新臺幣六千元以上一萬五千元以下罰鍰。但年滿七十歲、心智障礙或汽車運輸業之乘客，不在此限。\n違反第一項、第三項至第五項情形之一者，吊扣該汽機車牌照二年，並於移置保管該汽機車時，扣繳其牌照；因而肇事致人重傷或死亡，或有第三項、第五項情形之一者，得沒入該車輛。\n租賃車業者已盡告知本條處罰規定之義務，汽機車駕駛人仍駕駛汽機車違反第一項、第三項至第五項規定之一者，依其駕駛車輛分別依各該項所處罰鍰加罰二分之一。\n汽機車駕駛人違反第一項第二款，或違反第四項、第五項規定而涉及毒品、迷幻藥、麻醉藥品或其相類似之管制藥品者，於依法得重新考領或領回駕駛執照前，應完成道路交通安全講習、毒品危害防制教育、成癮評估、戒治諮商或治療教育；未完成者，不得考領、領回或發還駕駛執照。\n汽機車駕駛人有第一項、第三項至第五項之情形之一，同時違反刑事法律者，經移置保管汽機車之領回，不受第八十五條之二第二項，應同時檢附繳納罰鍰收據之限制。\n前項汽機車駕駛人，經裁判確定處以罰金低於第九十二條第四項所定最低罰鍰基準規定者，應依本條例裁決繳納不足最低罰鍰之部分。\n第六項檢體採樣及測試檢定結果之蒐集、處理或利用，應依個人資料保護法相關規定辦理，並僅得作為執法利用；有關血液、尿液、唾液或其他必要檢體之採樣、測試檢定、保存、銷毀、安全維護措施、毒品品項、檢出基準、檢出濃度值、程序、方法、數量、期限及其他相關事項之辦法，由內政部會商衛生福利部、法務部及交通部定之。","note":"一、現行本條對於酒駕、毒駕、拒檢及再犯行為雖已有處罰規定，惟整體制度仍偏重個別違規之事後裁罰，未能充分建立高風險駕駛即時排除、證據保全、車輛阻斷及復駕管制之完整機制。酒駕、毒駕雖認定基礎不同，惟均屬不能安全駕駛之重大道路公共危險，皆係行為人將自身失控風險外部化於道路交通環境，使不特定用路人承擔生命、身體危險。爰修正第一項，明定酒駕、毒駕分款認定、同採重罰，並提高罰鍰、吊銷駕駛執照及限制重新考領，作為後續再犯退場、拒檢處理、車輛處置及復駕管制之制度基礎。\n二、再犯行為已足以顯示前次處罰、講習及駕駛資格限制未能有效阻卻危險。對此類高風險駕駛，制度重點不應停留於罰鍰逐次加重，而應轉向駕駛資格之實質排除。爰修正再犯規定，明定十年內再犯第一項規定者，即依最高額處罰，並吊銷駕駛執照、不得再考領，以強化再犯退場機制。\n三、拒絕檢測並非單純不配合行政稽查，而係阻斷國家即時確認駕駛人危險狀態及保存證據之行為。酒精、毒品或其代謝物均具有時間經過後濃度變化、證據消散之特性，若容許行為人以拒測、逃避、拖延、妨害或事後補飲、補吸方式規避檢測，將使酒駕、毒駕執法失其實效。爰明定汽機車駕駛人對於交通勤務警察或依法令執行交通稽查任務人員，依本條所為之稽查、測試檢定、檢體採樣或必要之身分、車輛查證，不得規避、拒絕、妨害或以其他方式使其不能或難以實施，並就不停車接受稽查、拒絕酒測、拒絕毒品檢體採樣或測試檢定、檢測前補飲補吸、事故後檢測前補飲補吸等情形，一併明定處罰。\n四、拒檢行為之危險在於使酒駕、毒駕狀態無法即時確認，並可能使行為人藉拖延取得較有利之法律效果。爰修正拒檢處罰規定，明定違反拒檢義務者，處以高額罰鍰、移置保管車輛、吊銷駕駛執照並限制重新考領；十年內再犯拒檢者，已足認其反覆規避執法、逃避危險確認之高度風險，爰明定再犯即吊銷駕駛執照並不得再考領，以強化拒檢防制及再犯退場機制。\n五、本條所定不得規避、拒絕或妨害檢測，係明定駕駛人對合法稽查、測試檢定及檢體採樣之配合義務，並非授權執法人員不受程序限制任意拘束人民身體自由或侵入身體採樣。酒駕、毒駕案件之檢體證據具有高度即時性及易消散性，為避免行為人拒絕接受檢測，致刑事犯罪及行政違規事實無從確認，爰明定有相當理由足認涉犯刑法第一百八十五條之三第一項及第二項各款嫌疑，拒絕接受或因交通事故、身心狀態或其他客觀情事無法實施本條測試檢定者，司法警察官或司法警察得報請檢察官核發鑑定許可書，強制移由受委託醫療或檢驗機構實施血液、尿液、唾液或其他必要檢體之採樣及測試檢定；急迫情形始得先行採樣，並應於實施後二十四小時內陳報檢察官許可。此項規定目的在於保全證據，非授權強制拘留或變相羈押，並設有檢察官許可及法院救濟程序，以兼顧道路公共安全、犯罪偵查需要及人民身體權、人身自由與資訊隱私權保障。\n六、汽機車並非單純財產工具，而係酒駕、毒駕行為實現道路危險之直接媒介。對於違反本條規定者，若僅處罰駕駛人而未處理車輛使用與供給關係，難以有效阻斷危險來源。爰維持並強化移置保管、吊扣牌照及扣繳牌照等規定；對於肇事致人重傷或死亡，或十年內再犯酒駕、毒駕、拒檢等重大情形，明定得沒入該車輛，以阻斷高風險駕駛繼續利用車輛危害道路安全。\n七、酒駕、毒駕之發生，常非僅止於駕駛人個人行為，亦可能涉及車輛所有人放任使用、同車乘客明知仍共同乘坐、租賃車輛使用情境下風險外部化等因素。為避免道路危險被切割為駕駛人單一責任，爰明定汽機車所有人明知駕駛人有酒駕或毒駕情形而不予禁止者，應依規定處罰並吊扣牌照；年滿十八歲同車乘客明知駕駛人有毒駕情形而仍同車乘坐者，亦應受罰；租賃車業者已盡告知義務而駕駛人仍違反本條規定者，並依規定加重駕駛人罰鍰。此係針對明知而放任、共同承擔道路風險之情形建立責任，不屬無差別連坐。\n八、毒駕防制不能僅止於罰鍰及吊銷駕駛執照。毒駕背後常伴隨毒品施用、依賴、成癮或反覆接觸毒品之問題，若未經毒品危害防制教育、成癮評估、戒治諮商或治療教育，即容許其重新取得駕駛資格，恐使道路安全風險再度循環。爰明定涉及毒品、迷幻藥、麻醉藥品或其相類似之管制藥品之駕駛人，於依法得重新考領或領回駕駛執照前，應完成道路交通安
