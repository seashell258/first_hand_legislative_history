毒品戒癮治療、毒品危害講習之實施對象、教育或治療實施機構、方式、費用收取、完成之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、配合第三十五條第一項之修正，同步修正本條第一項、第二項及第四項條文。即違反第三十五條第一項前段之毒駕行為，吊銷駕照後三年內不得考領；若違反同項後段因而致人重傷或死亡者，則為終身不得考領。此外，配合增訂第三十五條第十一項，亦對此增設二年內不得重新考領駕駛執照之限制。\n二、第五項之修正，鑑於毒品成癮性極高且常導致反覆毒駕，增訂毒駕受吊銷駕照處分者，於重新申請考驗前，必須依規定完成觀察勒戒、強制戒治、毒品戒癮治療或毒品危害講習等對應之處置。又根據法務部統計，施用第一級、第二級毒品戒癮治療之後，二年內再犯的比例，第一級毒品為28%，第二級毒品為20%。故駕駛人依規定重新申請考驗合格後，尚應通過兩年之觀察期，確認其間並未再度發生第三十五條第一項第二款之毒駕情事或第十一項之吸毒行為，始得正式核發駕駛執照，以維護路人安全。"},{"bill":"202110223000000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段、第三十五條第十一項規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項前段、第三項前段、第四項前段、第五項前段、第十一項者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育、酒癮治療、毒駕防制教育、觀察勒戒、強制戒治、毒品戒癮治療或毒品危害講習，不得考領駕駛執照。有第三十五條第一項第二款或第十一項情形之一者，經依規定重新申請考驗合格後，應於六個月內無再次違反時，始發給駕駛執照。\n前項酒駕防制教育、毒駕防制教育或酒癮治療、毒品戒癮治療、毒品危害講習之實施對象、教育或治療實施機構、方式、費用收取、完成之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、修正第一項、第二項及第四項：\n(一)配合第三十五條第一項修正吸食毒品後駕車行為由現行吊扣駕駛執照一年至二年加重為吊銷駕駛執照，爰修正第一項、第二項及第四項援引條文，區分違反第三十五條第一項前段（毒駕吊銷駕駛執照三年不得考領），及後段（酒毒駕致人重傷或死亡吊銷駕駛執照終身不得考領）之不同不得考領駕駛執照期間之限制。\n(二)配合第三十五條增訂第十一項吊銷駕駛執照之規定，爰定明其二年內不得考領駕駛執照之限制。\n二、修正第五項：\n(一)毒品成癮係造成毒駕反覆發生之核心原因，因成癮者會對藥物產生強烈之生理及心理依賴，甚至在「邊開邊吸」之情況下造成重大傷亡。目前吸食毒品駕車者依毒品危害防制條例第十條及第十一條之一規定，施用第一級或第二級毒品係涉犯刑罰；施用第三級或第四級毒品係涉行政罰，毒駕涉犯刑罰部分已有觀察勒戒及強制戒治、緩起訴附命戒癮治療、起訴後入監服刑由矯正機關給予相關治療及處遇等規定；行政罰部分則規定須接受毒品危害講習，輔導吸毒者戒除毒癮，避免再犯。又參考目前酒駕受吊銷駕駛執照處分，於重新考領前須完成酒駕防制教育或酒癮治療，對於酒駕防制已有成效，違反毒駕規定受吊銷駕駛執照處分者，亦應有必要要求駕駛人重新取得駕駛執照前，應依前開規定完成觀察勒戒、強制戒治、毒品戒癮治療、毒品危害講習等相關分流處置，且重新依道路交通安全規則及受終身不得考領駕駛執照限制重新申請考驗辦法等相關規定申請考驗合格後，應於六個月內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，始發給駕駛執照，以維用路人安全。\n(二)配合修正條文第三十五條增訂第十一項規定，對於吸食毒品等而無駕駛行為之人處以吊銷駕駛執照處分，並非對行為人交通違規行為之處罰，而係基於該行為人既有吸食毒品等行為，考量毒品之成癮性及吸食毒品後，行為人陷於無法安全駕駛或對行為能力、認知能力減損之狀態，行為人於治療前隨時可能發生吸食毒品後陷於無法安全駕駛情形，為維護道路交通安全之公共利益，保障用路人之生命、身體及財產權益，應剝奪其駕駛資格，俟完成毒品危害防制相關處遇作為後，並觀察六個月內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，方予核發駕駛執照。\n三、配合第五項規定，爰於第六項授權規定事項增訂毒駕防制教育、毒品戒癮治療、毒品危害講習等相關事項。\n四、第三項、第七項及第八項未修正。"},{"bill":"202110223480000","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段、第三十五條第十一項規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項前段、第三項前段、第四項前段、第五項前段、第十一項者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育、酒癮治療、毒駕防制教育、觀察勒戒、強制戒治、毒品戒癮治療或毒品危害講習，不得考領駕駛執照。有第三十五條第一項第二款或第十一項情形之一者，經依規定重新申請考驗合格後，應於六個月內無再次違反時，始發給駕駛執照。\n前項酒駕防制教育、毒駕防制教育或酒癮治療、毒品戒癮治療、毒品危害講習之實施對象、教育或治療實施機構、方式、費用收取、完成酒駕防制教育及酒癮治療之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","note":"一、修正第一項、第二項及第四項：\n(一)配合第三十五條第一項修正吸食毒品後駕車行為由現行吊扣駕駛執照一年至二年加重為吊銷駕駛執照，爰修正第一項、第二項及第四項援引條文，區分違反第三十五條第一項前段（毒駕吊銷駕駛執照三年不得考領），及後段（酒毒駕致人重傷或死亡吊銷駕駛執照終身不得考領）之不同不得考領駕駛執照期間之限制。\n(二)配合第三十五條增訂第十一項吊銷駕駛執照之規定，爰定明其二年內不得考領駕駛執照之限制。\n二、修正第五項：\n(一)毒品成癮係造成毒駕反覆發生之核心原因，因成癮者會對藥物產生強烈之生理及心理依賴，甚至在「邊開邊吸」之情況下造成重大傷亡。目前吸食毒品駕車者依毒品危害防制條例第十條及第十一條之一規定，施用第一級或第二級毒品係涉犯刑罰；施用第三級或第四級毒品係涉行政罰，毒駕涉犯刑罰部分已有觀察勒戒及強制戒治、緩起訴附命戒癮治療、起訴後入監服刑由矯正機關給予相關治療及處遇等規定；行政罰部分則規定須接受毒品危害講習，輔導吸毒者戒除毒癮，避免再犯。又參考目前酒駕受吊銷駕駛執照處分，於重新考領前須完成酒駕防制教育或酒癮治療，對於酒駕防制已有成效，違反毒駕規定受吊銷駕駛執照處分者，亦應有必要要求駕駛人重新取得駕駛執照前，應依前開規定完成觀察勒戒、強制戒治、毒品戒癮治療、毒品危害講習等相關分流處置，且重新依道路交通安全規則及受終身不得考領駕駛執照限制重新申請考驗辦法等相關規定申請考驗合格後，應於六個月內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，始發給駕駛執照，以維用路人安全。\n(二)配合修正條文第三十五條增訂第十一項規定，對於吸食毒品等而無駕駛行為之人處以吊銷駕駛執照處分，並非對行為人交通違規行為之處罰，而係基於該行為人既有吸食毒品等行為，考量毒品之成癮性及吸食毒品後，行為人陷於無法安全駕駛或對行為能力、認知能力減損之狀態，行為人於治療前隨時可能發生吸食毒品後陷於無法安全駕駛情形，為維護道路交通安全之公共利益，保障用路人之生命、身體及財產權益，應剝奪其駕駛資格，俟完成毒品危害防制相關處遇作為後，並觀察六個月內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，方予核發駕駛執照。\n三、配合第五項規定，爰於第六項授權規定事項增訂毒駕防制教育、毒品戒癮治療、毒品危害講習等相關事項。\n四、第三項、第七項及第八項未修正。"}],"changed":true,"final":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段、第三十五條第十一項規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項前段、第三項前段、第四項前段、第五項前段、第十一項者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育、酒癮治療、毒駕防制教育、觀察勒戒、強制戒治、毒品戒癮治療或毒品危害講習，不得考領駕駛執照。有第三十五條第一項第二款或第十一項情形之一者，經依規定重新申請考驗合格後，應於一年內無再次違反時，始發給駕駛執照。\n前項酒駕防制教育、毒駕防制教育或酒癮治療、毒品戒癮治療、毒品危害講習之實施對象、教育或治療實施機構、方式、費用收取、完成之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。","finalWhy":"一、修正第一項、第二項及第四項：\n(一)配合第三十五條第一項修正吸食毒品後駕車行為由原吊扣駕駛執照一年至二年加重為吊銷駕駛執照，爰修正第一項、第二項及第四項援引條文，區分違反第三十五條第一項前段（毒駕吊銷駕駛執照三年不得考領），及後段（酒毒駕致人重傷或死亡吊銷駕駛執照終身不得考領）之不同不得考領駕駛執照期間之限制。\n(二)配合第三十五條增訂第十一項吊銷駕駛執照之規定，爰定明其二年內不得考領駕駛執照之限制。\n二、修正第五項：\n(一)毒品成癮係造成毒駕反覆發生之核心原因，因成癮者會對藥物產生強烈之生理及心理依賴，甚至在「邊開邊吸」之情況下造成重大傷亡。目前吸食毒品駕車者依毒品危害防制條例第十條及第十一條之一規定，施用第一級或第二級毒品係涉犯刑罰；施用第三級或第四級毒品係涉行政罰，毒駕涉犯刑罰部分已有觀察勒戒及強制戒治、緩起訴附命戒癮治療、起訴後入監服刑由矯正機關給予相關治療及處遇等規定；行政罰部分則規定須接受毒品危害講習，輔導吸毒者戒除毒癮，避免再犯。又參考目前酒駕受吊銷駕駛執照處分，於重新考領前須完成酒駕防制教育或酒癮治療，對於酒駕防制已有成效，違反毒駕規定受吊銷駕駛執照處分者，亦應有必要要求駕駛人重新取得駕駛執照前，應依前開規定完成觀察勒戒、強制戒治、毒品戒癮治療、毒品危害講習等相關分流處置，且重新依道路交通安全規則及受終身不得考領駕駛執照限制重新申請考驗辦法等相關規定申請考驗合格後，應於一年內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，始發給駕駛執照，以維用路人安全。\n(二)配合修正條文第三十五條增訂第十一項規定，對於吸食毒品等而無駕駛行為之人處以吊銷駕駛執照處分，並非對行為人交通違規行為之處罰，而係基於該行為人既有吸食毒品等行為，考量毒品之成癮性及吸食毒品後，行為人陷於無法安全駕駛或對行為能力、認知能力減損之狀態，行為人於治療前隨時可能發生吸食毒品後陷於無法安全駕駛情形，為維護道路交通安全之公共利益，保障用路人之生命、身體及財產權益，應剝奪其駕駛資格，俟完成毒品危害防制相關處遇作為後，並觀察一年內無再次違反第三十五條第一項第二款毒駕情形或第十一項吸食毒品等情形時，方予核發駕駛執照。\n三、配合第五項規定，爰於第六項授權規定事項增訂毒駕防制教育、毒品戒癮治療、毒品危害講習等相關事項。\n四、第三項、第七項及第八項未修正。","review":{"note":"照行政院提案修正通過","text":"汽車駕駛人曾依第二十一條第五項前段、第二十一條之一第四項前段、第二十七條第三項、第二十九條之二第五項、第三十五條第一項後段、第三項後段、第四項後段、第五項後段、第五十四條、第六十一條第一項第一款、第二款、第六十二條第四項後段規定吊銷駕駛執照者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項後段、第三項後段、第四項後段、第五項後段者外，不在此限。\n汽車駕駛人曾依第二十一條第五項後段、第二十一條之一第四項後段、第三十五條第十一項規定吊銷駕駛執照者，二年內不得考領駕駛執照；曾依第二十九條第四項、第三十條第三項、第三十條之一第二項、第三十五條第一項前段、第三項前段、第四項前段、第四十三條第二項、第三項、第四十四條第四項、第四十五條第三項、第六十一條第一項第三款、第四款、第四項、第六十二條第四項前段規定吊銷駕駛執照者，三年內不得考領駕駛執照；汽車駕駛人駕駛營業大客車，曾依第三十五條第二項規定或汽車駕駛人曾因肇事致人重傷依第四十四條第四項規定吊銷駕駛執照者，四年內不得考領駕駛執照；依第三十五條第五項前段規定或曾因肇事致人死亡依第四十四條第四項規定吊銷駕駛執照者，五年內不得考領駕駛執照。\n汽車駕駛人曾依本條例其他各條規定吊銷駕駛執照者，一年內不得考領駕駛執照。\n汽車駕駛人曾依第二項及前項規定吊銷駕駛執照，不得考領駕駛執照期間計達六年以上者，終身不得考領駕駛執照。但有第六十七條之一所定情形者，除違反第三十五條第一項前段、第三項前段、第四項前段、第五項前段、第十一項者外，不在此限。\n汽車駕駛人曾依第三十五條規定吊銷駕駛執照，未依規定完成酒駕防制教育、酒癮治療、毒駕防制教育、觀察勒戒、強制戒治、毒品戒癮治療或毒品危害講習，不得考領駕駛執照。有第三十五條第一項第二款或第十一項情形之一者，經依規定重新申請考驗合格後，應於一年內無再次違反時，始發給駕駛執照。\n前項酒駕防制教育、毒駕防制教育或酒癮治療、毒品戒癮治療、毒品危害講習之實施對象、教育或治療實施機構、方式、費用收取、完成之認定基準及其他相關事項之辦法，由交通部會商衛生福利部定之。\n第一項至第四項不得考領駕駛執照規定，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，適用之。\n汽車駕駛人違反本條例規定，應受吊扣駕駛執照處分，於汽車駕駛人未領有駕駛執照、駕駛執照經吊銷或註銷者，在所規定最長吊扣期間內，不得考領駕駛執照。"}},{"no":"第六十七條之一","current":"前條第一項及第四項規定情形，符合特定條件，得於下列各款所定期間後，向公路主管機關申請考領駕駛執照：\n一、肇事致人死亡案件，受處分人經吊銷駕駛執照處分執行已逾十二年。\n二、肇事致人重傷案件，受處分人經吊銷駕駛執照處分執行已逾十年。\n三、肇事致人受傷案件，受處分人經吊銷駕駛執照處分執行已逾八年。\n四、其他案件，受處分人經吊銷駕駛執照處分執行已逾六年。\n依前項規定申請者，公路主管機關得於其測驗合格後發給有效期間較短之駕駛執照，其期滿換領駕駛執照，應依主管機關所定條件辦理。\n前二項所定有關特定條件、換領駕駛執照之種類、駕駛執照有效期間、換領條件等事項之辦法，由交通部會商內政部及有關機關定之。","versions":[{"bill":"202110220910000","text":"前條第二項及第五項規定情形，符合特定條件，得於下列各款所定期間後，向公路主管機關申請考領駕駛執照：\n一、肇事致人死亡案件，受處分人經吊銷駕駛執照處分執行已逾十二年。\n二、肇事致人重傷案件，受處分人經吊銷駕駛執照處分執行已逾十年。\n三、肇事致人受傷案件，受處分人經吊銷駕駛執照處分執行已逾八年。\n四、其他案件，受處分人經吊銷駕駛執照處分執行已逾六年。\n依前項規定申請者，公路主管機關得於其測驗合格後發給有效期間較短之駕駛執照，其期滿換領駕駛執照，應依主管機關所定條件辦理。\n前二項所定有關特定條件、換領駕駛執照之種類、駕駛執照有效期間、換領條件等事項之辦法，由交通部會商內政部及有關機關定之。","note":"一、配合第六十七條增訂第一項致各項遞移，將第一項所引「前條第一項及第四項」修正為「前條第二項及第五項」。\n二、其餘各項未修正。"}],"changed":false,"final":"前條第一項及第四項規定情形，符合特定條件，得於下列各款所定期間後，向公路主管機關申請考領駕駛執照：\n一、肇事致人死亡案件，受處分人經吊銷駕駛執照處分執行已逾十二年。\n二、肇事致人重傷案件，受處分人經吊銷駕駛執照處分執行已逾十年。\n三、肇事致人受傷案件，受處分人經吊銷駕駛執照處分執行已逾八年。\n四、其他案件，受處分人經吊銷駕駛執照處分執行已逾六年。\n依前項規定申請者，公路主管機關得於其測驗合格後發給有效期間較短之駕駛執照，其期滿換領駕駛執照，應依主管機關所定條件辦理。\n前二項所定有關特定條件、換領駕駛執照之種類、駕駛執照有效期間、換領條件等事項之辦法，由交通部會商內政部及有關機關定之。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第七十三條","current":"慢車駕駛人，有下列情形之一者，處新臺幣三百元以上一千二百元以下罰鍰：\n一、不在劃設之慢車道通行，或無正當理由在未劃設慢車道之道路不靠右側路邊行駛。\n二、不在規定之地區路線或時間內行駛。\n三、不依規定轉彎、超車、停車或通過交岔路口。\n四、在道路上爭先、爭道或其他危險方式駕車。\n五、在夜間行車未開啟燈光。\n六、行進間以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為。\n慢車駕駛人，駕駛慢車經測試檢定酒精濃度超過規定標準，或吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者，處新臺幣一千二百元以上二千四百元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n慢車駕駛人拒絕接受前項測試之檢定者，處新臺幣四千八百元罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n微型電動二輪車駕駛人未依規定戴安全帽者，處駕駛人新臺幣三百元罰鍰。","versions":[{"bill":"202110219460000","text":"慢車駕駛人，有下列情形之一者，處新臺幣三百元以上一千二百元以下罰鍰：\n一、不在劃設之慢車道通行，或無正當理由在未劃設慢車道之道路不靠右側路邊行駛。\n二、不在規定之地區路線或時間內行駛。\n三、不依規定轉彎、超車、停車或通過交岔路口。\n四、在道路上爭先、爭道或其他危險方式駕車。\n五、在夜間行車未開啟燈光。\n六、行進間以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為。\n慢車駕駛人，駕駛慢車經測試檢定酒精濃度超過規定標準，或吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者，處新臺幣二千四百元以上六千元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n慢車駕駛人拒絕接受前項測試之檢定者，處新臺幣一萬二千元罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n微型電動二輪車駕駛人未依規定戴安全帽者，處駕駛人新臺幣三百元罰鍰。","note":"一、修正第二項、第三項。\n二、據警政署統計，110年至114年酒駕慢車（自行車、微型電動二輪車）比例逐年上升，自4391件、增加至12095件，成長175.4%，年增長率為43.8%；酒駕慢車拒檢案件數，亦從110年1275件、成長至114年4046件，成長217.3%，年增長率54.3%。究其原因，無非係因汽機車酒駕罰則，隨著歷年加強宣導與修法行政罰則持續加重，均有呈現下降趨勢，然相較於汽機車之毒駕、酒駕與拒測之處罰，慢車部分卻因現行罰鍰過低之情形外，使得違規行為人極易基於僥倖心態，飲酒後駕駛慢車，甚至故意拒測。\n三、綜上所述，相較於汽機車駕駛人，慢車駕駛人危險駕駛之危害性雖然較低，惟依舊會對交通秩序與用路風險之提升造成相當影響，故為有效降低慢車駕駛人危險駕駛、拒絕接受酒精或毒品測試之行為，爰予調整現行條文第二項之罰鍰金上下限，以保障社會秩序、交通安全與其他用路民眾之人身財產安全。"},{"bill":"202110220910000","text":"慢車駕駛人，有下列情形之一者，處新臺幣三百元以上一千二百元以下罰鍰：\n一、不在劃設之慢車道通行，或無正當理由在未劃設慢車道之道路不靠右側路邊行駛。\n二、不在規定之地區路線或時間內行駛。\n三、不依規定轉彎、超車、停車或通過交岔路口。\n四、在道路上爭先、爭道或其他危險方式駕車。\n五、在夜間行車未開啟燈光。\n六、行進間以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為。\n慢車駕駛人，駕駛慢車經測試檢定酒精濃度超過規定標準，處新臺幣一千二百元以上二千四百元以下罰鍰；吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者，處新臺幣二千四百元以上三千六百元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n慢車駕駛人拒絕接受前項測試之檢定者，處新臺幣四千八百元罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n微型電動二輪車駕駛人未依規定戴安全帽者，處駕駛人新臺幣三百元罰鍰。","note":"一、修正第二項，將慢車駕駛人毒駕與酒駕分別規範：酒駕維持一千二百元以上二千四百元以下罰鍰；毒駕提高為二千四百元以上三千六百元以下罰鍰，並當場禁止其駕駛。\n二、第一項、第三項及第四項未修正。"},{"bill":"202110222600000","text":"慢車駕駛人，有下列情形之一者，處新臺幣三百元以上一千二百元以下罰鍰：\n一、不在劃設之慢車道通行，或無正當理由在未劃設慢車道之道路不靠右側路邊行駛。\n二、不在規定之地區路線或時間內行駛。\n三、不依規定轉彎、超車、停車或通過交岔路口。\n四、在道路上爭先、爭道或其他危險方式駕車。\n五、在夜間行車未開啟燈光。\n六、行進間以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為。\n慢車駕駛人，駕駛慢車經測試檢定酒精濃度超過規定標準，處新臺幣六千元以上一萬二千元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n慢車駕駛人，駕駛慢車經測試檢定認有吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者，處新臺幣一萬二千元以上六萬元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，沒入之。\n慢車駕駛人拒絕接受前二項測試之檢定者，處新臺幣六萬元罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，沒入之。\n微型電動二輪車駕駛人未依規定戴安全帽者，處駕駛人新臺幣三百元罰鍰。","note":"一、第一項未修正。\n二、修正第二項，將毒駕相關內容移列增訂為第三項，並提高慢車酒駕罰鍰。\n三、增訂第三項，對吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品之慢車駕駛人另訂罰鍰上下限，駕駛微型電動二輪車者，增訂沒入之規定。\n四、配合前項增訂項次修正第二項，提高慢車駕駛人拒絕酒駕或毒駕檢測之罰鍰，增訂沒入之規定，並移列為第四項。\n五、第五項內文未修正，僅項次調整。"},{"bill":"202110223320000","text":"慢車駕駛人，有下列情形之一者，處新臺幣三百元以上一千二百元以下罰鍰：\n一、不在劃設之慢車道通行，或無正當理由在未劃設慢車道之道路不靠右側路邊行駛。\n二、不在規定之地區路線或時間內行駛。\n三、不依規定轉彎、超車、停車或通過交岔路口。\n四、在道路上爭先、爭道或其他危險方式駕車。\n五、在夜間行車未開啟燈光。\n六、行進間以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為。\n慢車駕駛人，駕駛慢車經測試檢定酒精濃度超過規定標準，處新臺幣三千六百元以上七千二百元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n慢車駕駛人拒絕接受前項測試之檢定者，處新臺幣一萬四千元罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n本條例中華民國○年○月○日修正公布條文施行之日起，慢車駕駛人於十年內第二次違反第二項規定者，依其駕駛車輛分別依第二項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣七千二百元，並均應當場移置保管該慢車。\n本條例中華民國○年○月○日修正公布條文施行之日起，慢車駕駛人於十年內第二次違反第三項規定者，處新臺幣二萬八千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬四千元，並均應當場移置保管該慢車。\n慢車所有人，明知慢車駕駛人有第一項情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n慢車駕駛人，駕駛慢車經測試檢定酒精濃度超過規定標準，年滿十八歲之同車乘客處新臺幣三千六百元以上七千二百元以下罰鍰。但年滿七十歲、心智障礙，不在此限。\n租賃車業者已盡告知本條處罰規定之義務，慢車駕駛人仍駕駛慢車違反第二項、第三項至第五項規定之一者，依其駕駛車輛分別依第二項、第三項至第五項所處罰鍰加罰二分之一。\n微型電動二輪車駕駛人未依規定戴安全帽者，處駕駛人新臺幣三百元罰鍰。","note":"一、為因應近期毒駕案件頻傳，較去年同期暴增三倍，鑑於毒駕及酒駕之行為態樣、不法性及法益侵害之危險程度不同，為釐清處罰級距，爰將第二項及第三項行為人因吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者並駕駛慢車之規定增訂至第七十三條之一。\n二、據統計，114年度慢車酒駕已高達12,095件，占整體酒駕違規21.48%，而酒駕拒測8,631件中，慢車拒絕測試檢定占4,046件，比率為46.88%，慢車酒駕年增率64.85%，可見部分民眾將慢車當成迴避酒駕取締工具。\n三、然而，在整體道安環境改善同時，慢車酒駕呈現暴增之現象，成為我國酒駕防制之重大新破口，隨著微型電動二輪車、電動滑板車等動力慢車普及，其行駛速度及機動性將會使傷亡風險倍增，且慢車多行駛於混和車道或緊鄰慢車道，慢車酒駕極易引發連帶二次車禍，釀成無辜之人重大死傷，而近期民眾酒後選擇慢車代步，除了須加強宣導法治教育外，核心癥結在於處罰成本與汽機車酒駕存在巨大落差，故將慢車酒駕以及拒絕接受測試檢定之罰鍰調高。\n四、新增第四項酒後駕駛慢車累犯罰則、第五項拒絕接受測試檢定之累犯罰則、第六項慢車所有人之責任、第七項慢車同車乘客之責任、第八項租賃業者之責任，以補充慢車章節之酒後駕車罰鍰及其他種類行政罰，落實酒駕零容忍政策。"}],"changed":true,"final":"慢車駕駛人，有下列情形之一者，處新臺幣三百元以上一千二百元以下罰鍰：\n一、不在劃設之慢車道通行，或無正當理由在未劃設慢車道之道路不靠右側路邊行駛。\n二、不在規定之地區路線或時間內行駛。\n三、不依規定轉彎、超車、停車或通過交岔路口。\n四、在道路上爭先、爭道或其他危險方式駕車。\n五、在夜間行車未開啟燈光。\n六、行進間以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為。\n慢車駕駛人，駕駛慢車經測試檢定酒精濃度超過規定標準，或吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者，處新臺幣二千四百元以上一萬二千元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n慢車駕駛人有下列各款情形之一者，處新臺幣二萬四千元罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車：\n一、駕駛慢車行經警察機關設有告示執行前項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受前項測試檢定。\n三、接受前項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受前項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n微型電動二輪車駕駛人未依規定戴安全帽者，處駕駛人新臺幣三百元罰鍰。","finalWhy":"一、修正第二項，提高慢車酒毒駕罰鍰。\n二、修正第三項，提高慢車酒毒駕拒絕測試檢定罰鍰，並參考原第三十五條第四項規定，定明拒絕測試檢定態樣。","review":{"note":"照台灣民眾黨黨團提案修正通過","text":"慢車駕駛人，有下列情形之一者，處新臺幣三百元以上一千二百元以下罰鍰：\n一、不在劃設之慢車道通行，或無正當理由在未劃設慢車道之道路不靠右側路邊行駛。\n二、不在規定之地區路線或時間內行駛。\n三、不依規定轉彎、超車、停車或通過交岔路口。\n四、在道路上爭先、爭道或其他危險方式駕車。\n五、在夜間行車未開啟燈光。\n六、行進間以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕駛安全之行為。\n慢車駕駛人，駕駛慢車經測試檢定酒精濃度超過規定標準，或吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者，處新臺幣二千四百元以上一萬二千元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車。\n慢車駕駛人有下列各款情形之一者，處新臺幣二萬四千元罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場移置保管該微型電動二輪車：\n一、駕駛慢車行經警察機關設有告示執行前項測試檢定之處所，不依指示停車接受稽查。\n二、拒絕接受前項測試檢定。\n三、接受前項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n四、發生交通事故後，在接受前項測試檢定前，吸食服用含酒精之物、毒品、迷幻藥、麻醉藥品或其相類似之管制藥品。\n微型電動二輪車駕駛人未依規定戴安全帽者，處駕駛人新臺幣三百元罰鍰。"}},{"no":"第七十三條之一","current":null,"versions":[{"bill":"202110223320000","text":"慢車駕駛人，駕駛慢車經測試檢定吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者，處新臺幣六千元以上一萬二千元以下罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場沒入該微型電動二輪車。\n慢車駕駛人拒絕接受前項測試之檢定者，處新臺幣二萬四千元罰鍰，並當場禁止其駕駛；駕駛微型電動二輪車者，並當場沒入該微型電動二輪車。\n本條例中華民國○年○月○日修正公布條文施行之日起，慢車駕駛人於十年內第二次違反第一項規定者，依其駕駛車輛分別依第一項所定罰鍰最高額處罰之，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣一萬二千元，並均應當場沒入該慢車。\n本條例中華民國○年○月○日修正公布條文施行之日起，慢車駕駛人於十年內第二次違反第二項規定者，處新臺幣四萬八千元罰鍰，第三次以上者按前次違反本項所處罰鍰金額加罰新臺幣二萬四千元，並均應當場沒入該慢車。\n慢車所有人，明知慢車駕駛人有第一項情形，而不予禁止駕駛者，依第一項規定之罰鍰處罰。\n慢車駕駛人，駕駛慢車經測試檢定吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者，年滿十八歲之同車乘客處新臺幣六千元以上一萬二千元以下罰鍰。但年滿七十歲、心智障礙，不在此限。\n租賃車業者已盡告知本條處罰規定之義務，慢車駕駛人仍駕駛慢車違反第一項至第四項規定之一者，依其駕駛車輛分別依第一項至第四項所處罰鍰加罰二分之一。","note":"一、本條新增。\n二、鑑於毒駕及酒駕之行為態樣、不法性及法益侵害之危險程度不同，為釐清處罰級距，行為人因吸食毒品、迷幻藥、麻醉藥品及其相類似之管制藥品者並駕駛慢車之規定於原條文調移並增訂於本條，並調高行政罰鍰及增訂其他種類行政罰。\n三、為避免行為人以慢車逃避罰則，將慢車章節比照本條例第二章汽車章節加入以下罰則：\n第三項施用毒品後駕駛慢車累犯罰則、第四項拒絕接受測試檢定之累犯罰則、第五項慢車所有人之責任、第六項慢車同車乘客之責任、第七項租賃業者之責任。以補充慢車章節之施用毒品後駕車罰鍰及其他種類行政罰，落實施用毒品後駕車零容忍政策。"}],"changed":false,"final":null,"finalWhy":null,"review":{"note":"不予增訂","text":""}},{"no":"第八十五條之二","current":"車輛所有人或駕駛人依本條例規定應予禁止通行、禁止其行駛、禁止其駕駛者，交通勤務警察或依法令執行交通稽查任務人員應當場執行之，必要時，得逕行移置保管其車輛。\n前項車輛所有人或其委託之第三人得於保管原因消失後，持保管收據及行車執照領回車輛。其違反本條例第三十五條規定者，應同時檢附繳納罰鍰收據。但初次違反規定且未發生交通事故者，得檢附分期繳納罰鍰收據領回車輛。\n依第三十五條規定被逕行移置保管之車輛屬租賃車業者之車輛，得由車輛所有人檢具租賃契約書、違規駕駛人姓名、住址並具結後，據以取回被移置保管車輛。","versions":[{"bill":"202110219460000","text":"車輛所有人或駕駛人依本條例規定應予禁止通行、禁止其行駛、禁止其駕駛者，交通勤務警察或依法令執行交通稽查任務人員應當場執行之，必要時，得逕行移置保管其車輛。\n前項車輛所有人或其委託之第三人得於保管原因消失後，持保管收據及行車執照領回車輛。其違反本條例第三十五條、第三十五條之一、第三十五條之二規定者，應同時檢附繳納罰鍰收據。但初次違反規定且未發生交通事故者，得檢附分期繳納罰鍰收據領回車輛。\n依第三十五條、第三十五條之一規定被逕行移置保管之車輛屬租賃車業者之車輛，得由車輛所有人檢具租賃契約書、違規駕駛人姓名、住址並具結後，據以取回被移置保管車輛。","note":"配合本次修正，修正第二項；第三項。"},{"bill":"202110222600000","text":"車輛所有人或駕駛人依本條例規定應予禁止通行、禁止其行駛、禁止其駕駛者 <script>
const D = JSON.parse(document.getElementById('data').textContent);

  for (const c of kids) if (c != null) e.append(c);
  return e;
};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類
const propById = Object.fromEntries(D.props.map(p => [p.id, p]));
const shortWho = p => p.who.replace(/^委員/, '');
const artList = p => p.arts.join('、');

$('title').textContent = D.title;

  $('benchlegend').hidden = true;
}
const passed = D.arts.filter(a => a.changed);
const meetings = D.stages.filter(s => s.stage !== '一讀');
[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],

  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}
let current = (passed[0] || D.arts[0] || {}).no;
function card(title, sub, text, base, o) {
  o = o || {};
  const c = el('article', {class: 'ver' + (o.final ? ' final' : '')});
  c.append(el('div', {class: 'vh'}, el('h3', {text: title}), el('small', {text: sub || ''})));
  const body = el('div', {class: 'text'});
  if (text) renderText(body, base, text, o);
  else { body.className = 'text empty'; body.textContent = o.emptyText || '沒有條文'; }
  c.append(body);
  if (o.note) c.append(el('details', null, el('summary', {text: o.noteLabel || '提案說明'}), el('div', {text: o.note})));
  return c;
}
function showArticle() {
  const a = D.arts.find(x => x.no === current); if (!a) return;
  [...$('artnav').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.no === current));
  $('artstatus').textContent = articleStatus(a);
  fillBench($('bench'), a);
}
function articleStatus(a) {
  return a.no + '　' + a.versions.length + ' 個提案版本' + (a.review ? '　委員會：' + (a.review.note || '有審查會版本') : '') + (a.changed ? (ENACT ? '　三讀：通過' : '　三讀：修正通過') : (ENACT ? '　三讀通過的版本沒有這個條號' : '　三讀：未修正'));
}
function fillBench(b, a) {   // 現行條文、各提案版本、審查會、三讀並排
  b.textContent = '';
  const isNew = !a.current && a.versions.length > 0;   // 提案的對照表裡現行欄是空的：新增條文
  if (!ENACT) b.append(card('現行條文', '修正前', a.current, null, {nodiff: true, emptyText: '修正前沒有這一條'}));
  a.versions.forEach(v => { const p = propById[v.bill]; b.append(card(shortWho(p), p.date + ' 提案', v.text, a.current, {note: v.note, emptyText: '提案刪除本條', isNew})); });
  if (a.review && a.review.text) b.append(card('審查會通過', '委員會', a.review.text, a.current, {isNew}));
  if (a.changed) b.append(card('三讀通過', D.date, a.final, a.current, {final: true, note: a.finalWhy, noteLabel: '立法理由', isNew}));
}

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');

const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));

}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {

function copyHere(id) {

function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}
function renderTranscript(box, data, s) {
  box.textContent = '';
  const clip = {}; s.clips.forEach(c => { clip[normName(c.n) + '|' + c.t] = c.u; (clip[normName(c.n)] = clip[normName(c.n)] || c.u); });
  const turns = el('div', {class: 'turns'});
  const first = new Map();
  data.turns.forEach((t, i) => {
    const chair = t.s === '主席';
    const d = el('div', {class: 'turn' + (chair ? ' chair' : '') + (t.s ? '' : ' pre'), id: s.tr.replace(/\W/g, '-') + '-' + i});
    if (t.s) {
      const who = el('div', {class: 'who'}, t.s);
      const pa = PARTY[normName(t.s)];
      if (pa) who.append(el('span', {class: 'party', style: '--pc:' + PCOLOR[pa]}, el('i'), pa));
      if (t.t) who.append(el('small', {text: t.t}));
      const hhmm = t.t ? t.t.replace(/(\d+)時(\d+)分/, (m, h, mi) => h.padStart(2, '0') + ':' + mi.padStart(2, '0')) : null;
      const u = hhmm && (clip[normName(t.s) + '|' + hhmm] || clip[normName(t.s)]);
      if (u && t.t) who.append(link(u, '看這段影片'));
      const here = el('button', {type: 'button', class: 'here', text: '分享上下文', title: '複製連結。打開的人會看到這場會議的完整逐字稿，並停在這段發言'});
      d.dataset.fp = fp(t.s + '|' + (t.b.find(x => typeof x === 'string') || '').slice(0, 30));
      here.addEventListener('click', () => copyHere(d.id + '-' + d.dataset.fp));
      who.append(here);
      d.append(who);
      if (!chair && !first.has(t.s)) first.set(t.s, d);
    }
    const put = (into, b) => {
      if (typeof b === 'string') into.append(para(b));
      else if (b.fold) {   // 照登的文件（提案條文全文、審查報告、機關書面報告）：收成一行
        const inner = el('div', {class: 'readout'});

      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }
    };
    t.b.forEach(b => put(d, b));
    turns.append(d);
  });
  const idx = el('div', {class: 'idx'}, el('span', {text: '跳到發言者（' + first.size + ' 位）'}));
  const chips = el('div', {class: 'chips'});

  idx.append(chips);

}

const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});

let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}

      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
