<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公職人員選舉罷免法 2025 年修正歷程（原住民立委補選、秘密投票）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">{"law":"公職人員選舉罷免法","version":"01177:2025-12-26-修正","date":"2025-12-26","action":"修正","title":"公職人員選舉罷免法　2025 年 12 月修正（原住民立委補選、秘密投票）","lede":"這次修的是原住民立法委員缺額的處理和原住民的投票所。依原條文，原住民立委選舉結果當選不足額、當選人在名單公告前或就職前死亡、就職前經判決當選無效時都視同缺額，就職後出缺也一樣，要同一選舉區缺額達二分之一才補選；修正後原住民立委和區域立委一樣，三個月內重行選舉或補選（第七十條、第七十條之一、第七十一條、第七十三條）。第五十七條把選舉委員會對原住民公職人員選舉「得斟酌實際情形」單獨設置投票所，改為為保障原住民秘密投票「應」單獨設置投票所或於區域選舉投票所內辦理各種公職人員選舉投票，不受第十七條第一項應在戶籍地投票的限制。六個委員提案都由院會決定逕付二讀或自內政委員會抽出逕付二讀，委員會沒有逐條審查；2025 年 3 月 6 日的協商沒有共識，移請院長協商。協商超過一個月後，12 月 26 日院會處理：第五十七條、第七十條、第七十一條、第七十三條都記名表決照國民黨黨團再修正動議通過，第七十條之一兩黨團版本相同、無異議通過，第十七條、第四十三條、第一百三十四條維持現行條文；三讀時全案表決 106 比 0 通過。","summary":"原住民立法委員選舉不足額或當選人出缺時，改為和區域立委一樣三個月內重行選舉或補選，不再要等同一選舉區缺額達二分之一；選舉委員會應為保障原住民秘密投票單獨設置投票所或在區域選舉投票所內辦理投票，不受應在戶籍地投票的限制。","key":"01177_2025-12-26","props":[{"id":"202110018610000","who":"委員鄭天財Sra Kacaw等19人","date":"2024-03-29","name":"「公職人員選舉罷免法第十七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110018610000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/11/LCEWA01_110311_00671.pdf","proposers":["鄭天財Sra Kacaw","盧縣一","高金素梅"],"ncosign":16,"people":[["鄭天財Sra Kacaw","國民黨","提案"],["盧縣一","國民黨","提案"],["高金素梅","無黨籍","提案"],["陳玉珍","國民黨","連署"],["萬美玲","國民黨","連署"],["翁曉玲","國民黨","連署"],["邱鎮軍","國民黨","連署"],["牛煦庭","國民黨","連署"],["林沛祥","國民黨","連署"],["呂玉玲","國民黨","連署"],["吳宗憲","國民黨","連署"],["丁學忠","國民黨","連署"],["黃建賓","國民黨","連署"],["林思銘","國民黨","連署"],["柯志恩","國民黨","連署"],["邱若華","國民黨","連署"],["羅智強","國民黨","連署"],["林德福","國民黨","連署"],["鄭正鈐","國民黨","連署"]],"party":[["國民黨",18],["無黨籍",1]],"reason":"本院委員鄭天財Sra Kacaw、盧縣一、高金素梅等19人，有鑑於歷次選舉以來原住民族投票率皆較非原住民低，為增進原住民政治參與途徑，保障原住民選舉投票權利，並作為國內實施不在籍投票之試金石，建立國內實施不在籍投票之良性經驗，爰擬具「公職人員選舉罷免法第十七條條文修正草案」，中央公職人員選舉具原住民身分之選舉人，得於規定期限內，以書面向戶籍所在地之戶政機關申請移轉至不同直轄市、縣（市）投票。是否有當？敬請公決。","arts":[]},{"id":"202110033950000","who":"委員高金素梅等23人","date":"2024-04-19","name":"「公職人員選舉罷免法第七十條、第七十一條及第七十三條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110033950000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/11/LCEWA01_110311_00670.pdf","proposers":["高金素梅","鄭天財Sra Kacaw","陳超明","伍麗華Saidhai‧Tahovecahe"],"ncosign":19,"people":[["高金素梅","無黨籍","提案"],["鄭天財Sra Kacaw","國民黨","提案"],["陳超明","無黨籍","提案"],["伍麗華Saidhai‧Tahovecahe","民進黨","提案"],["徐欣瑩","國民黨","連署"],["賴士葆","國民黨","連署"],["邱鎮軍","國民黨","連署"],["洪孟楷","國民黨","連署"],["林思銘","國民黨","連署"],["牛煦庭","國民黨","連署"],["麥玉珍","民眾黨","連署"],["翁曉玲","國民黨","連署"],["林倩綺","國民黨","連署"],["廖先翔","國民黨","連署"],["馬文君","國民黨","連署"],["蘇清泉","國民黨","連署"],["顏寬恒","國民黨","連署"],["林沛祥","國民黨","連署"],["羅廷瑋","國民黨","連署"],["羅智強","國民黨","連署"],["陳永康","國民黨","連署"],["林德福","國民黨","連署"],["游顥","國民黨","連署"]],"party":[["國民黨",19],["無黨籍",2],["民進黨",1],["民眾黨",1]],"reason":"本院委員高金素梅、鄭天財Sra Kacaw、陳超明、伍麗華Saidhai Tahovecahe等22人，鑒於原住民立法委員選舉乃是憲法增修條文第四條賦予原住民族額外保障，應於目前選舉制度增加妥適的保障。目前公職人員選舉罷免法限制原住民選舉權的陳年陋習，乃忽略我國立法委員選舉制度已自第七屆選舉產生政策變化，將區域立委變更為單一選區制，達到更反映民情的宗旨，亦規範遺任任期達一年以上可進行補選。惟立委補選的條款，僅適用一般選區，原住民選區並無此等保障參政權的條款，反而要求需達到應選名額一定比例，才可進行補選，顯不合理。基於「相同事情相同處理，不同事情不同處理」原則，理應統一相關補選規範，爰擬具「公職人員選舉罷免法第七十條、第七十一條及第七十三條條文修正草案」。是否有當？敬請公決。","arts":["第七十條","第七十一條","第七十三條"]},{"id":"202110043510000","who":"委員伍麗華Saidhai Tahovecahe等17人","date":"2024-05-10","name":"「公職人員選舉罷免法第七十條、第七十一條及第七十三條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110043510000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00176.pdf","proposers":["伍麗華Saidhai‧Tahovecahe"],"ncosign":16,"people":[["伍麗華Saidhai‧Tahovecahe","民進黨","提案"],["陳俊宇","民進黨","連署"],["邱議瑩","民進黨","連署"],["吳沛憶","民進黨","連署"],["吳秉叡","民進黨","連署"],["蔡其昌","民進黨","連署"],["陳素月","民進黨","連署"],["沈發惠","民進黨","連署"],["蘇巧慧","民進黨","連署"],["林淑芬","民進黨","連署"],["范雲","民進黨","連署"],["黃捷","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳冠廷","民進黨","連署"],["王正旭","民進黨","連署"],["賴瑞隆","民進黨","連署"],["林月琴","民進黨","連署"]],"party":[["民進黨",17]],"reason":"本院委員伍麗華Saidhai Tahovecahe等17人，有鑑於中華民國憲法明定原住民族得有山地原住民、平地原住民各三席立法委員，以保障原住民族參政權，惟現行規定須同一選區之原住民立法委員缺額達二分之一，始得辦理補選，惟原住民立法委員缺額之情形，攸關原住民族參政權之保障，故衡平原住民族參政保障、選舉資源及社會成本考量，修正重新選舉、補選及遞補等相關規定，避免原住民立法委員缺額造成民意缺口。基此，爰擬具「公職人員選舉罷免法第七十條、第七十一條及第七十三條條文修正草案」。是否有當？敬請公決。","arts":["第七十條","第七十一條","第七十三條"]},{"id":"202110044290000","who":"委員盧縣一等17人","date":"2024-05-10","name":"「公職人員選舉罷免法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110044290000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/12/LCEWA01_110312_00630.pdf","proposers":["盧縣一"],"ncosign":16,"people":[["盧縣一","國民黨","提案"],["王育敏","國民黨","連署"],["陳菁徽","國民黨","連署"],["翁曉玲","國民黨","連署"],["傅崐萁","國民黨","連署"],["葉元之","國民黨","連署"],["蘇清泉","國民黨","連署"],["黃仁","國民黨","連署"],["許宇甄","國民黨","連署"],["魯明哲","國民黨","連署"],["謝龍介","國民黨","連署"],["林沛祥","國民黨","連署"],["廖先翔","國民黨","連署"],["顏寬恒","國民黨","連署"],["林倩綺","國民黨","連署"],["邱鎮軍","國民黨","連署"],["吳宗憲","國民黨","連署"]],"party":[["國民黨",17]],"reason":"本院委員盧縣一等17人，鑒於我國憲法第十七條：「人民有選舉、罷免、創制及複決之權。」為符合憲法保障人民參政權之意旨，且鑑於原住民立委選舉區域遍及全台各地，並考量歷屆中央民意代表選舉，原住民立委其選舉權人之投票率與區域立委選舉權人相較投票率普遍偏低，實肇因於台灣原住民族地區幅員遼闊、地處偏遠及交通運輸不便；且原住民選舉權人多數雖設籍於原鄉，但是因就學、就業、就醫或其因素而致使戶籍地與居住地不在同一直轄市、縣（市）或鄉（鎮、市、區）之情況，因此原住民選舉權人無法順利行使憲法所賦予之基本人權，有鑑於此，爰特增定此但書，依法授權中央選舉委員會會同內政部訂定移轉投票之相關規定，以維護並實踐憲法上對原住民族之選舉權利。另，肇因我國原住民立法委員之選舉制度，具有山地或平地原住民身分之選舉權人，僅能分別針對山地或平地原住民立法委員候選人行使投票之權利。又因未加以劃分其選舉區，以致其選舉區涵蓋臺、澎、金、馬等地。惟原住民立法委員之選舉及當選後之服務區域幅員遼闊，精神與勞力、交通所需成本遠大於其他區域立委。又以山地原住民立法委員選區中的花蓮縣秀林鄉為例，該鄉面積為1,642平方公里，將近彰化縣面積的1.5倍；另，南投縣信義鄉面積為1,422平方公里，為雲林縣的面積1.1倍，此兩鄉分別為全臺第一及第二大面積鄉鎮。顯見，本條文之選票補助金制定之初即未考量原住民立法委員之選舉資格及選區制度特殊性、選舉及服務範圍等客觀問題外，離島的立法委員亦有類似情況亟需解決與回應，現行條文，僅以形式上制定每位立法委員當選人僅每票補貼新臺幣三十元之選舉補助金，反凸顯實質上之不平等，爰針對原住民及離島地區之立法委員當選人其選票補貼金額實有檢討提高之必要。且考量原住民立委就職後因死亡、辭職、經判決當選無效確定或其他事由出缺之日起，且同一選舉區內原住民立委缺額達二分之一時，始准於三個月內完成補選投票。查原住民立委席次分別為山地原住民三席；平地原住民三席，合計六席僅占全體立委席次中的少數。且中華民國憲法增修條文第十條第十二項規定：「國家應依民族意願，保障原住民族之地位及政治參與，並對其教育文化、交通水利、衛生醫療、經濟土地及社會福利事業予以保障扶助並促其發展……。」故原住民族之政治參與，選舉及被選舉權利屬憲法上之制度性保障範疇。故選罷法針對原住民立委於同一選舉區內缺額達二分之一時始得進行補選之限制應予以刪除，以適時彌補民意缺口。爰擬具「公職人員選舉罷免法部分條文修正草案」。是否有當？敬請公決。","arts":["第十七條","第四十三條","第七十一條","第七十三條","第一百三十四條"]},{"id":"202110061550000","who":"委員鄭天財Sra Kacaw等16人","date":"2024-07-12","name":"「公職人員選舉罷免法第五十七條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110061550000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/11/LCEWA01_110311_00669.pdf","proposers":["鄭天財Sra Kacaw","林倩綺","盧縣一","黃仁"],"ncosign":12,"people":[["鄭天財Sra Kacaw","國民黨","提案"],["林倩綺","國民黨","提案"],["盧縣一","國民黨","提案"],["黃仁","國民黨","提案"],["廖先翔","國民黨","連署"],["林沛祥","國民黨","連署"],["徐欣瑩","國民黨","連署"],["魯明哲","國民黨","連署"],["涂權吉","國民黨","連署"],["陳玉珍","國民黨","連署"],["葉元之","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["馬文君","國民黨","連署"],["徐巧芯","國民黨","連署"],["王育敏","國民黨","連署"],["張智倫","國民黨","連署"]],"party":[["國民黨",16]],"reason":"本院委員鄭天財Sra Kacaw、林倩綺、盧縣一、黃仁等16人，針對現行選舉投票實務，如遇地方公職人員選舉，原住民選民於非原住民地區投開票所行使選舉權，一旦最小選舉區為村（里）時，選舉人僅得在同一村（里）內調整，難以於該選舉區之村（里）外另設投票所投票，無法保障原住民之秘密投票權益，爰擬具「公職人員選舉罷免法第五十七條條文修正草案」。是否有當？敬請公決。","arts":["第五十七條"]},{"id":"202110176790000","who":"委員高金素梅等18人","date":"2025-12-05","name":"「公職人員選舉罷免法第七十條之一條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110176790000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/04/14/LCEWA01_110414_00177.pdf","proposers":["高金素梅"],"ncosign":17,"people":[["高金素梅","無黨籍","提案"],["鄭天財Sra Kacaw","國民黨","連署"],["張啓楷","民眾黨","連署"],["傅崐萁","國民黨","連署"],["羅智強","國民黨","連署"],["林沛祥","國民黨","連署"],["麥玉珍","民眾黨","連署"],["徐欣瑩","國民黨","連署"],["葛如鈞","國民黨","連署"],["謝衣鳯","國民黨","連署"],["顏寬恒","國民黨","連署"],["陳玉珍","國民黨","連署"],["陳昭姿","民眾黨","連署"],["王育敏","國民黨","連署"],["林國成","民眾黨","連署"],["洪孟楷","國民黨","連署"],["陳雪生","國民黨","連署"],["羅廷瑋","國民黨","連署"]],"party":[["國民黨",13],["民眾黨",4],["無黨籍",1]],"reason":"本院委員高金素梅等18人，有鑑於原住民立法委員係依《中華民國憲法增修條文》第四條所設之額外保障席次，立法目的在於強化原住民族之政治代表權，故現行選舉制度自應對原住民選舉增設妥適保障。然而，《公職人員選舉罷免法》關於原住民選舉之補選規定，仍沿用過往限制原住民參政權之陳舊設計，未能反映我國自第七屆立法委員選舉起，區域立委已改採單一選區兩票制、並明定遺任任期在一年以上者得辦理補選，以更貼近民意代表真實性之制度變遷。現行補選條款僅適用於一般選區，原住民選區反而須待缺額達應選名額一定比例，始得辦理補選，致發生一般選區一席出缺即補選、原住民選區一席出缺卻不補選之不合理差別待遇。此種規範顯與「同事同理、異事異理」之平等原則不符，亦實質削弱憲法原本欲保障之原住民族代表席次。基此，爰擬具「公職人員選舉罷免法第七十條之一條文修正草案」，統一原住民與一般選區之補選門檻，使原住民族之參政權益獲得實質、而非打折扣之保障。是否有當？敬請公決。","arts":["第七十條之一"]}],"arts":[{"no":"第十七條","current":"選舉人，除另有規定外，應於戶籍地投票所投票。\n投票所工作人員，得在戶籍地或工作地之投票所投票。但在工作地之投票所投票者，以戶籍地及工作地在同一選舉，並在同一直轄市、縣（市）為限。","versions":[{"bill":"202110044290000","text":"選舉人，除另有規定外，應於戶籍地投票所投票。但原住民立法委員選舉之原住民籍選舉人，得申請移轉至戶籍地以外之直轄市、縣（市）移轉投票地之投票所投票；其辦法由中央選舉委員會會同內政部定之。\n投票所工作人員，得在戶籍地或工作地之投票所投票。但在工作地之投票所投票者，以戶籍地及工作地在同一選舉，並在同一直轄市、縣（市）為限。","note":"一、增定第一項但書規定。\n二、我國憲法第十七條：「人民有選舉、罷免、創制及複決之權。」為符合憲法保障人民參政權之意旨，且鑑於原住民立委選舉區域遍及全台各地，並考量歷屆中央民意代表選舉，原住民立委其選舉權人之投票率與區域立委選舉權人相較投票率普遍偏低，實肇因於台灣原住民族地區幅員遼闊、地處偏遠及交通運輸不便；且原住民選舉權人多數雖設籍於原鄉，但是因就學、就業、就醫或其因素而致使戶籍地與居住地不在同一直轄市、縣（市）或鄉（鎮、市、區）之情況，因此原住民選舉權人無法順利行使憲法所賦予之基本人權，有鑑於此，爰特增定此但書，依法授權中央選舉委員會會同內政部訂定移轉投票之相關規定，以維護並實踐憲法上對原住民族之選舉權利。"}],"changed":false,"final":"選舉人，除另有規定外，應於戶籍地投票所投票。\n投票所工作人員，得在戶籍地或工作地之投票所投票。但在工作地之投票所投票者，以戶籍地及工作地在同一選舉區，並在同一直轄市、縣（市）為限。","finalWhy":null,"review":null},{"no":"第四十三條","current":"候選人除全國不分區及僑居國外國民立法委員選舉外，當選人在一人，得票數達各該選舉區當選票數三分之一以上者，當選人在二人以上，得票數達各該選舉區當選票數二分之一以上者，應補貼其競選費用，每票補貼新臺幣三十元。但其最高額，不得超過各該選舉區候選人競選經費最高金額。\n前項當選票數，當選人在二人以上者，以最低當選票數為準；其最低當選票數之當選人，以婦女保障名額當選，應以前一名當選人之得票數為最低當選票數。\n第一項對候選人競選費用之補貼，應於當選人名單公告日後三十日內，由選舉委員會核算補貼金額，並通知候選人於三個月內掣據，向選舉委員會領取。\n前項競選費用之補貼，依第一百三十條第二項規定應逕予扣除者，應先予以扣除，有餘額時，發給其餘額。\n領取競選費用補貼之候選人犯第九十七條、第九十九條第一項、第一百零一條第一項、第一百零二條第一項第一款之罪經有罪判決確定者或因第一百二十條第一項第三款之情事經法院判決當選無效確定者，選舉委員會應於收到法院確定判決書後，以書面通知其於三十日內繳回已領取及依前項先予扣除之補貼金額，屆期不繳回者，依法移送強制執行。\n候選人未於規定期限內領取競選費用補貼者，選舉委員會應催告其於三個月內具領；屆期未領者，視為放棄領取。\n第一項所需補貼費用，依第十三條規定編列預算。","versions":[{"bill":"202110044290000","text":"候選人除全國不分區及僑居國外國民立法委員選舉外，當選人在一人，得票數達各該選舉區當選票數三分之一以上者，當選人在二人以上，得票數達各該選舉區當選票數二分之一以上者，應補貼其競選費用，每票補貼新臺幣三十元；原住民及離島立法委員當選人，補貼新臺幣五十元。但其最高額，不得超過各該選舉區候選人競選經費最高金額。\n前項當選票數，當選人在二人以上者，以最低當選票數為準；其最低當選票數之當選人，以婦女保障名額當選，應以前一名當選人之得票數為最低當選票數。\n第一項對候選人競選費用之補貼，應於當選人名單公告日後三十日內，由選舉委員會核算補貼金額，並通知候選人於三個月內掣據，向選舉委員會領取。\n前項競選費用之補貼，依第一百三十條第二項規定應逕予扣除者，應先予以扣除，有餘額時，發給其餘額。\n領取競選費用補貼之候選人犯第九十七條、第九十九條第一項、第一百零一條第一項、第一百零二條第一項第一款之罪經有罪判決確定者或因第一百二十條第一項第三款之情事經法院判決當選無效確定者，選舉委員會應於收到法院確定判決書後，以書面通知其於三十日內繳回已領取及依前項先予扣除之補貼金額，屆期不繳回者，依法移送強制執行。\n候選人未於規定期限內領取競選費用補貼者，選舉委員會應催告其於三個月內具領；屆期未領者，視為放棄領取。\n第一項所需補貼費用，依第十三條規定編列預算。","note":"一、增訂本條第一項後段。\n二、肇因我國原住民立法委員之選舉制度，具有山地或平地原住民身分之選舉權人，僅能分別針對山地或平地原住民立法委員候選人行使投票之權利。又因未加以劃分其選舉區，以致其選舉區涵蓋臺、澎、金、馬等地。\n惟原住民立法委員之選舉及當選後之服務區域幅員遼闊，精神與勞力、交通所需成本遠大於其他區域立委。又以山地原住民立法委員選區中的花蓮縣秀林鄉為例，該鄉面積為1,642平方公里，將近彰化縣面積的1.5倍；另，南投縣信義鄉面積為1,422平方公里，為雲林縣的面積1.1倍，此兩鄉分別為全臺第一及第二大面積鄉鎮。顯見，本條文之選票補助金制定之初即未考量原住民立法委員之選舉資格及選區制度特殊性、選舉及服務範圍等客觀問題外，離島的立法委員亦有類似情況亟需解決與回應，現行條文，僅以形式上制定每位立法委員當選人僅每票補貼新臺幣三十元之選舉補助金，反凸顯實質上之不平等，爰針對原住民及離島地區之立法委員當選人其選票補貼金額實有檢討提高之必要。"}],"changed":false,"final":"候選人除全國不分區及僑居國外國民立法委員選舉外，當選人在一人，得票數達各該選舉區當選票數三分之一以上者，當選人在二人以上，得票數達各該選舉區當選票數二分之一以上者，應補貼其競選費用，每票補貼新臺幣三十元。但其最高額，不得超過各該選舉區候選人競選經費最高金額。\n前項當選票數，當選人在二人以上者，以最低當選票數為準；其最低當選票數之當選人，以婦女保障名額當選，應以前一名當選人之得票數為最低當選票數。\n第一項對候選人競選費用之補貼，應於當選人名單公告日後三十日內，由選舉委員會核算補貼金額，並通知候選人於三個月內掣據，向選舉委員會領取。\n前項競選費用之補貼，依第一百三十條第二項規定應逕予扣除者，應先予以扣除，有餘額時，發給其餘額。\n領取競選費用補貼之候選人犯第九十七條、第九十九條第一項、第一百零一條第一項、第一百零二條第一項第一款之罪經有罪判決確定者或因第一百二十條第一項第三款之情事經法院判決當選無效確定者，選舉委員會應於收到法院確定判決書後，以書面通知其於三十日內繳回已領取及依前項先予扣除之補貼金額，屆期不繳回者，依法移送強制執行。\n候選人未於規定期限內領取競選費用補貼者，選舉委員會應催告其於三個月內具領；屆期未領者，視為放棄領取。\n第一項所需補貼費用，依第十三條規定編列預算。","finalWhy":null,"review":null},{"no":"第五十七條","current":"公職人員選舉，應視選舉區廣狹及選舉人分布情形，就機關（構）、學校、公共場所或其他適當處所，分設投票所。\n前項之投票所應選擇具備無障礙設施之場地，若無符合規定之無障礙場地，應使用相關輔具或器材協助行動不便者完成投票。選舉委員會應視場所之無障礙程度，適度增加投票所之工作人力，主動協助行動不便者。\n原住民公職人員選舉，選舉委員會得斟酌實際情形，單獨設置投票所或於區域選舉投票所內辦理投票。\n投票所除選舉人及其照顧之六歲以下兒童，第十八條第三項規定之家屬或陪同之人外，未佩帶各級選舉委員會製發證件之人員不得進入。但檢察官依法執行職務者，不在此限。\n投票所於投票完畢後，即改為開票所，當眾唱名開票。開票完畢，開票所主任管理員與主任監察員即依投開票報告表宣布開票結果，除於開票所門口張貼外，並應將同一內容之投開票報告表副本，當場簽名交付推薦候選人之政黨，及非經政黨推薦之候選人所指派之人員；其領取，以一份為限。\n投開票完畢後，投開票所主任管理員應會同主任監察員，將選舉票按用餘票、有效票、無效票及選舉人名冊分別包封，並於封口處簽名或蓋章，一併送交鄉（鎮、市、區）公所轉送直轄市、縣（市）選舉委員會保管。\n前項選舉票除檢察官或法院依法行使職權外，不得開拆。\n第六項選舉票及選舉人名冊，自開票完畢後，其保管期間如下：\n一、用餘票為一個月。\n二、有效票及無效票為六個月。\n三、選舉人名冊為六個月。\n前項保管期間，發生訴訟時，其與訴訟有關部分，應延長保管至裁判確定後三個月。","versions":[{"bill":"202110061550000","text":"公職人員選舉，應視選舉區廣狹及選舉人分布情形，就機關（構）、學校、公共場所或其他適當處所，分設投票所。\n前項之投票所應選擇具備無障礙設施之場地，若無符合規定之無障礙場地，應使用相關輔具或器材協助行動不便者完成投票。選舉委員會應視場所之無障礙程度，適度增加投票所之工作人力，主動協助行動不便者。\n為保障原住民秘密投票權益，選舉委員會應單獨設置投票所或於區域選舉投票所內辦理各種公職人員選舉投票，不受第十七條第一項應在戶籍地投票之限制。\n投票所除選舉人及其照顧之六歲以下兒童，第十八條第三項規定之家屬或陪同之人外，未佩帶各級選舉委員會製發證件之人員不得進入。但檢察官依法執行職務者，不在此限。\n投票所於投票完畢後，即改為開票所，當眾唱名開票。開票完畢，開票所主任管理員與主任監察員即依投開票報告表宣布開票結果，除於開票所門口張貼外，並應將同一內容之投開票報告表副本，當場簽名交付推薦候選人之政黨，及非經政黨推薦之候選人所指派之人員；其領取，以一份為限。\n投開票完畢後，投開票所主任管理員應會同主任監察員，將選舉票按用餘票、有效票、無效票及選舉人名冊分別包封，並於封口處簽名或蓋章，一併送交鄉（鎮、市、區）公所轉送直轄市、縣（市）選舉委員會保管。\n前項選舉票除檢察官或法院依法行使職權外，不得開拆。\n第六項選舉票及選舉人名冊，自開票完畢後，其保管期間如下：\n一、用餘票為一個月。\n二、有效票及無效票為六個月。\n三、選舉人名冊為六個月。\n前項保管期間，發生訴訟時，其與訴訟有關部分，應延長保管至裁判確定後三個月。","note":"一、修正第三項。\n二、查現行原住民公職人員選舉投票實務，如遇一投票所僅一位原住民選舉人投票時，將在徵詢該選舉人之意願後，調整至其他投票所投票，為此種方式僅適用立法委員選舉，如遇地方公職人員選舉，最小選舉區為村（里），選舉人僅得在同一村（里）內調整，難以於該選舉區之村（里）外另設投票所，致現行條文難以落實，無法保障原住民之秘密投票權益。"}],"changed":true,"final":"公職人員選舉，應視選舉區廣狹及選舉人分布情形，就機關（構）、學校、公共場所或其他適當處所，分設投票所。\n前項之投票所應選擇具備無障礙設施之場地，若無符合規定之無障礙場地，應使用相關輔具或器材協助行動不便者完成投票。選舉委員會應視場所之無障礙程度，適度增加投票所之工作人力，主動協助行動不便者。\n為保障原住民秘密投票權益，選舉委員會應單獨設置投票所或於區域選舉投票所內辦理各種公職人員選舉投票，不受第十七條第一項應在戶籍地投票之限制。\n投票所除選舉人及其照顧之六歲以下兒童，第十八條第三項規定之家屬或陪同之人外，未佩帶各級選舉委員會製發證件之人員不得進入。但檢察官依法執行職務者，不在此限。\n投票所於投票完畢後，即改為開票所，當眾唱名開票。開票完畢，開票所主任管理員與主任監察員即依投開票報告表宣布開票結果，除於開票所門口張貼外，並應將同一內容之投開票報告表副本，當場簽名交付推薦候選人之政黨，及非經政黨推薦之候選人所指派之人員；其領取，以一份為限。\n投開票完畢後，投開票所主任管理員應會同主任監察員，將選舉票按用餘票、有效票、無效票及選舉人名冊分別包封，並於封口處簽名或蓋章，一併送交鄉（鎮、市、區）公所轉送直轄市、縣（市）選舉委員會保管。\n前項選舉票除檢察官或法院依法行使職權外，不得開拆。\n第六項選舉票及選舉人名冊，自開票完畢後，其保管期間如下：\n一、用餘票為一個月。\n二、有效票及無效票為六個月。\n三、選舉人名冊為六個月。\n前項保管期間，發生訴訟時，其與訴訟有關部分，應延長保管至裁判確定後三個月。","finalWhy":"一、修正第三項。\n二、查現行原住民公職人員選舉投票實務，如遇一投票所僅一位原住民選舉人投票時，將在徵詢該選舉人之意願後，調整至其他投票所投票，為此種方式僅適用立法委員選舉，如遇地方公職人員選舉，最小選舉區為村（里），選舉人僅得在同一村（里）內調整，難以於該選舉區之村（里）外另設投票所，致原條文難以落實，無法保障原住民之秘密投票權益。","review":null},{"no":"第七十條","current":"候選人數未超過或不足各該選舉區應選出之名額時，以所得票數達下列規定以上者，始為當選。但村（里）長選舉不在此限：\n一、區域立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長選舉，為各該選舉區選舉人總數百分之二十。\n二、原住民立法委員、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表選舉，為各該選舉區應選出之名額除該選舉區選舉人總數所得商數百分之十。\n前項選舉結果未能當選或當選不足應選出之名額時，區域立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長，應自投票之日起三個月內完成重行選舉投票；原住民立法委員、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表視同缺額。同一選舉區內缺額達二分之一時，應自事實發生之日起三個月內完成補選投票。","versions":[{"bill":"202110033950000","text":"候選人數未超過或不足各該選舉區應選出之名額時，以所得票數達下列規定以上者，始為當選。但村（里）長選舉不在此限：\n一、區域立法委員、直轄市長、縣（市）長、鄉（鎮、市）長選舉，為各該選舉區選舉人總數百分之二十。\n二、原住民立法委員、直轄市議員、縣（市）議員、鄉（鎮、市）民代表選舉，為各該選舉區應選出之名額除該選舉區選舉人總數所得商數百分之十。\n前項選舉結果未能當選或當選不足應選出之名額時，區域立法委員、原住民立法委員、直轄市長、縣（市）長、鄉（鎮、市）長，應自投票之日起三個月內完成重行選舉投票；直轄市議員、縣（市）議員、鄉（鎮、市）民代表視同缺額。同一選舉區內缺額達二分之一時，應自事實發生之日起三個月內完成補選投票。","note":"一、原住民立法委員選舉乃是憲法增修條文第四條賦予原住民族額外保障，應於公職人員選舉罷免中做妥適的保障，合先敘明。\n二、我國選舉方式係採取相對多數當選制，未達最低得票率之缺額必須重新開放國民參與，始能符合選舉之選賢與能用意，如相同的選制卻無正當理由剝奪原住民族人透過補選再次選舉或參政機會，似與憲法第一百三十條規定國民有依法選舉或被選舉之權有違。\n三、目前公職人員選舉制度，將原住民立法委員因未能當選或當選不足應選出之名額，必須視同缺額，等於剝奪民意的再次選擇，對原住民族實屬不公。\n四、原住民選舉區已分成山地原住民選舉區及平地原住民選舉區，每一選舉區僅有三席當選名額，如果必須等到同一選舉區內缺額達二分之一時，等於該選舉區缺額要達三分之二之絕對多數，方能補選，事實上發生機率不大，本條缺額限制補選等同剝奪原住民參政權，爰修正本條第二項增列原住民立法委員得與一般選區有相同補選之機會。"},{"bill":"202110043510000","text":"候選人數未超過或不足各該選舉區應選出之名額時，以所得票數達下列規定以上者，始為當選。但村（里）長選舉不在此限：\n一、區域立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長選舉，為各該選舉區選舉人總數百分之二十。\n二、原住民立法委員、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表選舉，為各該選舉區應選出之名額除該選舉區選舉人總數所得商數百分之十。\n前項選舉結果未能當選或當選不足應選出之名額時，區域立法委員、原住民立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長，應自投票之日起三個月內完成重行選舉投票；直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表視同缺額。同一選舉區內缺額達二分之一時，應自事實發生之日起三個月內完成補選投票。","note":"一、第一項未修正。\n二、修正第二項規定，原住民立法委員若未能依第一項規定當選或當選不足應選出名額，比照區域立法委員之規定，自投票日起三個月內完成重新選舉投票。"}],"changed":true,"final":"候選人數未超過或不足各該選舉區應選出之名額時，以所得票數達下列規定以上者，始為當選。但村（里）長選舉不在此限：\n一、區域立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長選舉，為各該選舉區選舉人總數百分之二十。\n二、原住民立法委員、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表選舉，為各該選舉區應選出之名額除該選舉區選舉人總數所得商數百分之十。\n前項選舉結果未能當選或當選不足應選出之名額時，區域立法委員、原住民立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長，應自投票之日起三個月內完成重行選舉投票；直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表視同缺額。同一選舉區內缺額達二分之一時，應自事實發生之日起三個月內完成補選投票。","finalWhy":"一、原住民立法委員選舉乃是憲法增修條文第四條賦予原住民族額外保障，應於公職人員選舉罷免中做妥適的保障，合先敘明。\n二、我國選舉方式係採取相對多數當選制，未達最低得票率之缺額必須重新開放國民參與，始能符合選舉之選賢與能用意，如相同的選制卻無正當理由剝奪原住民族人透過補選再次選舉或參政機會，似與憲法第一百三十條規定國民有依法選舉或被選舉之權有違。\n三、目前公職人員選舉制度，將原住民立法委員因未能當選或當選不足應選出之名額，必須視同缺額，等於剝奪民意的再次選擇，對原住民族實屬不公。\n四、原住民選舉區已分成山地原住民選舉區及平地原住民選舉區，每一選舉區僅有三席當選名額，如果必須等到同一選舉區內缺額達二分之一時，等於該選舉區缺額要達三分之二之絕對多數，方能補選，事實上發生機率不大，本條缺額限制補選等同剝奪原住民參政權，爰修正本條第二項增列原住民立法委員得與一般選區有相同補選之機會。","review":null},{"no":"第七十條之一","current":"依第六十七條第一項、第六十八條或第七十條第一項規定當選之候選人，於當選人名單公告前死亡，選舉委員會應公告為當選人；其所遺缺額，依下列規定辦理：\n一、區域立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長、村（里）長，應自公告之日起三個月內完成重行選舉投票。\n二、原住民立法委員、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表，視同缺額；同一選舉區內缺額達二分之一時，應自公告之日起三個月內完成補選投票。","versions":[{"bill":"202110176790000","text":"依第六十七條第一項、第六十八條或第七十條第一項規定當選之候選人，於當選人名單公告前死亡，選舉委員會應公告為當選人；其所遺缺額，依下列規定辦理：\n一、區域立法委員、原住民立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長、村（里）長，應自公告之日起三個月內完成重行選舉投票。\n二、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表，視同缺額；同一選舉區內缺額達二分之一時，應自公告之日起三個月內完成補選投票。","note":"一、依《中華民國憲法增修條文》第四條規定，國家應保障原住民族之政治參與，並以原住民立法委員額外席次作為具體落實，是以原住民立法委員選舉自屬憲法明文賦予原住民族之特別保障，於《公職人員選舉罷免法》中自應為相應之妥適設計，合先敘明。\n二、我國立法委員選舉採相對多數決並輔以一定得票門檻之制度設計，未達最低得票率之缺額，應重新開放國民參與投票，始能符合選舉「選賢與能」及民意真實反映之意旨。倘若在相同選制之下，對一般選區得以透過補選重新行使選舉權，卻無正當理由排除原住民族選區補選的可能，使其喪失再次投票與被選舉的機會，則有違憲法第十七條所揭示「人民有選舉、罷免、創制及複決之權」之保障意旨。\n三、有鑑於原住民立法委員係依前述憲法增修條文第四條所設之額外保障席次，其立法目的在於強化原住民族之政治代表權，現行選舉制度自第七屆立法委員選舉起，區域立委已改採單一選區兩票制，並明定遺任任期逾一年者得辦理補選，以更貼近民意代表真實性之制度變遷。然而，《公職人員選舉罷免法》中關於原住民選區之補選規定，仍沿用舊有立法技術，僅對一般選區設有出缺即辦理補選之條款，原住民選區則須待缺額達應選名額一定比例，始得補選，致發生一般選區一席出缺即補選、原住民選區一席出缺卻不補選之不合理差別待遇。此種規範顯與「同事同理、異事異理」之平等原則不符，並實質削弱憲法原欲保障之原住民族代表席次。基此，爰提案修正相關規定，統一原住民與一般選區之補選門檻，使原住民族之參政權益獲致實質而非打折扣之保障，爰修正本條。"}],"changed":true,"final":"依第六十七條第一項、第六十八條或第七十條第一項規定當選之候選人，於當選人名單公告前死亡，選舉委員會應公告為當選人；其所遺缺額，依下列規定辦理：\n一、區域立法委員、原住民立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長、村（里）長，應自公告之日起三個月內完成重行選舉投票。\n二、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表，視同缺額；同一選舉區內缺額達二分之一時，應自公告之日起三個月內完成補選投票。","finalWhy":"","review":null},{"no":"第七十一條","current":"當選人於就職前死亡或於就職前經判決當選無效確定者，依下列規定辦理：\n一、區域立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長、村（里）長，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成重行選舉投票。\n二、原住民立法委員、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表，視同缺額；同一選舉區內缺額達二分之一時，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成補選投票。\n三、全國不分區及僑居國外國民立法委員，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉當選人，在就職前喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其當選資格；其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，在就職前死亡、就職前經判決當選無效確定或喪失其所屬政黨黨籍而出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第三款、第二項及第三項所定立法委員之遞補，應自死亡之日、選舉委員會收到法院確定判決證明書或黨籍喪失證明書送達選舉委員會之日起十五日內，由中央選舉委員會公告遞補當選人名單。","versions":[{"bill":"202110033950000","text":"當選人於就職前死亡或於就職前經判決當選無效確定者，依下列規定辦理：\n一、區域立法委員、原住民立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、村（里）長，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成重行選舉投票。\n二、直轄市議員、縣（市）議員、鄉（鎮、市）民代表，視同缺額；同一選舉區內缺額達二分之一時，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成補選投票。\n三、全國不分區及僑居國外國民立法委員，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉當選人，在就職前喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其當選資格；其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，在就職前死亡、就職前經判決當選無效確定或喪失其所屬政黨黨籍而出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第三款、第二項及第三項所定立法委員之遞補，應自死亡之日、選舉委員會收到法院確定判決證明書或黨籍喪失證明書送達選舉委員會之日起十五日內，由中央選舉委員會公告遞補當選人名單。","note":"一、我國立法委員選舉制度已自第七屆產生變化，區域立法委員已由複數選區轉變成單一選區，單一選區每一選舉區應選名額一名，並規範遺任任期達一年以上即可進行補選，合先敘明。\n二、我國立法委員選舉制度，對區域立法委員採取單一選區選舉；而對原住民立法委員採取複數選區選舉。單一選區一有缺額必須進行補選，以免選舉區缺乏民意代表反應選區利益。然原住民立法委員選舉雖採取複數選區，但由於其選舉區屬於全國範圍，共有十六族原住民參與選舉，並依其歸類為山地或平地原住民選舉區，每一選舉區當選名額各三名。故原住民立法委員複數選區相當具有獨特性，絕對多數的缺額補選限制等於要求原住民立法委員缺額不用補選，且可能讓族群的代表性受損，故應賦予與區域立法委員同一補選規定，以補足其族群之代表性，爰修正本條第一項第一款，以保障原住民參政權。"},{"bill":"202110043510000","text":"當選人於就職前死亡或於就職前經判決當選無效確定者，依下列規定辦理：\n一、區域立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長、村（里）長，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成重行選舉投票。\n二、原住民立法委員自死亡之日起三個月內應完成重行選舉投票；原住民立法委員因第一百二十條第一項第三款之情事，經法院判決當選無效確定或於法院審理當選無效訴訟中辭職者或當選人有褫奪公權尚未復權之情形時，其缺額由落選人依得票數之高低順序遞補，不適用重行選舉或缺額補選之規定。但遞補人員之得票數不得低於選舉委員會原公告該選舉區得票數最低之當選人得票數二分之一。\n三、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表，視同缺額；同一選舉區內缺額達二分之一時，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成補選投票。\n四、全國不分區及僑居國外國民立法委員，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉當選人，在就職前喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其當選資格；其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，在就職前死亡、就職前經判決當選無效確定或喪失其所屬政黨黨籍而出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第二款及第三款、第二項及第三項所定立法委員之遞補，應自死亡之日、選舉委員會收到法院確定判決證明書或黨籍喪失證明書送達選舉委員會之日起十五日內，由中央選舉委員會公告遞補當選人名單。","note":"一、修正第一項第二款前段，原住民立法委員當選人若於就職前死亡，應於三個月內完成重新投票。由於當選人死亡之事由與選舉過程中合法性無關，為維持原住民立法委員之政治代表性，確保民意授權之完整性，爰此修正。\n二、修正第一項第二款後段，原住民立法委員當選人若於選舉過程中涉及本法一百二十條第一項各款規定之當選無效情事，因其事由涉及選舉公平性，衡量社會成本及原住民參政權益，爰以遞補方式補足其缺額，惟仍應確保遞補者之民意代表性，故票數不得低於最低當選人得票數之二分之一。"},{"bill":"202110044290000","text":"當選人於就職前死亡或於就職前經判決當選無效確定者，依下列規定辦理：\n一、區域立法委員、原住民立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長、村（里）長，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成重行選舉投票。\n二、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表，視同缺額；同一選舉區內缺額達二分之一時，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成補選投票。\n三、全國不分區及僑居國外國民立法委員，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉當選人，在就職前喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其當選資格；其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，在就職前死亡、就職前經判決當選無效確定或喪失其所屬政黨黨籍而出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第三款、第二項及第三項所定立法委員之遞補，應自死亡之日、選舉委員會收到法院確定判決證明書或黨籍喪失證明書送達選舉委員會之日起十五日內，由中央選舉委員會公告遞補當選人名單。","note":"一、第一項第一款增列原住民立法委員。\n二、第一項第二款，刪除原住民立法委員。\n三、本條文係針對當選人就職前即死亡或經判決當選無效確定。\n民國94年6月4日國民大會修憲後，立法委員自第七屆起席次從原225席減半為113席次。區域立委部分已改採「單一選區制」。惟原住民立委選舉仍採「複數選區制」。\n現行本法規定，原住民立委就職後因死亡、辭職、經判決當選無效確定或其他事由出缺之日起，且同一選舉區內原住民立委缺額達二分之一時，始准於三個月內完成補選投票。查原住民立委席次分別為山地原住民三席；平地原住民三席，合計六席僅占全體立委席次中的少數。且中華民國憲法增修條文第十條第十二項規定：「國家應依民族意願，保障原住民族之地位及政治參與，並對其教育文化、交通水利、衛生醫療、經濟土地及社會福利事業予以保障扶助並促其發展……。」故原住民族之政治參與，選舉及被選舉權利屬憲法上之制度性保障範疇。故選罷法針對原住民立委於同一選舉區內缺額達二分之一時始得進行補選之限制應予以刪除，以適時彌補民意缺口。\n另外，原住民立委之選舉區域遍及全國，若遇缺額即進行補選時所耗之國家公帑雖較區域立委之補選為甚。惟中央民意代表本與地方民意代表其代表性懸殊，且考量全國原住民族之區域分部及顧及現有法定16個原住民族均得以公平參與、維護原住民立委選舉公正性，真正落實選賢與能，應採行補選方式。同時，也避免選舉實務上，競選期間有心人士惡意檢舉攻訐、無端羅織罪名，計畫性地透過司法公權來打擊其他候選人之方式來遂行其勝選目的，甚至最後抱以僥倖心態認為若採遞補作式，其無須戮力爭取選民認同而僅需要消極地爭取該次選舉\"第四名\"票數席位即可。爰鑑於此，原住民立委出缺時，應採行限期補選方式，始能真正體現民主可貴、落實選舉公平並彌補民意缺口。"}],"changed":true,"final":"當選人於就職前死亡或於就職前經判決當選無效確定者，依下列規定辦理：\n一、區域立法委員、原住民立法委員、直轄市長、縣（市）長、鄉（鎮、市）長、原住民區長、村（里）長，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成重行選舉投票。\n二、直轄市議員、縣（市）議員、鄉（鎮、市）民代表、原住民區民代表，視同缺額；同一選舉區內缺額達二分之一時，應自死亡之日或選舉委員會收到法院確定判決證明書之日起三個月內完成補選投票。\n三、全國不分區及僑居國外國民立法委員，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉當選人，在就職前喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其當選資格；其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，在就職前死亡、就職前經判決當選無效確定或喪失其所屬政黨黨籍而出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第三款、第二項及第三項所定立法委員之遞補，應自死亡之日、選舉委員會收到法院確定判決證明書或黨籍喪失證明書送達選舉委員會之日起十五日內，由中央選舉委員會公告遞補當選人名單。","finalWhy":"一、我國立法委員選舉制度已自第七屆產生變化，區域立法委員已由複數選區轉變成單一選區，單一選區每一選舉區應選名額一名，並規範遺任任期達一年以上即可進行補選，合先敘明。\n二、我國立法委員選舉制度，對區域立法委員採取單一選區選舉；而對原住民立法委員採取複數選區選舉。單一選區一有缺額必須進行補選，以免選舉區缺乏民意代表反應選區利益。然原住民立法委員選舉雖採取複數選區，但由於其選舉區屬於全國範圍，共有十六族原住民參與選舉，並依其歸類為山地或平地原住民選舉區，每一選舉區當選名額各三名。故原住民立法委員複數選區相當具有獨特性，絕對多數的缺額補選限制等於要求原住民立法委員缺額不用補選，且可能讓族群的代表性受損，故應賦予與區域立法委員同一補選規定，以補足其族群之代表性，爰修正本條第一項第一款，以保障原住民參政權。","review":null},{"no":"第七十三條","current":"立法委員於就職後因死亡、辭職、經判決當選無效確定或其他事由出缺時，依下列規定辦理：\n一、區域選出者，應自死亡之日、辭職之日或選舉委員會收到法院確定判決證明書之日或其他出缺事由發生之日起三個月內完成補選投票。但其所遺任期不足一年時，不予補選。\n二、原住民選出者，同一選舉區內缺額達二分之一時，應自死亡之日、辭職之日或選舉委員會收到法院確定判決證明書之日或其他出缺事由發生之日起三個月內完成補選投票。但其所遺任期不足一年時，不予補選。\n三、全國不分區及僑居國外國民選出者，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員，在就職後喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其資格，由中央選舉委員會函請立法院予以註銷，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，於就職後因死亡、辭職、經判決當選無效確定、喪失其所屬政黨黨籍或其他事由出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；如該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第三款、第二項及第三項所定立法委員之遞補，應自立法院註銷名籍公函送達之日起十五日內，由中央選舉委員會公告遞補名單。","versions":[{"bill":"202110033950000","text":"立法委員於就職後因死亡、辭職、經判決當選無效確定或其他事由出缺時，依下列規定辦理：\n一、區域及原住民選出者，應自死亡之日、辭職之日或選舉委員會收到法院確定判決證明書之日或其他出缺事由發生之日起三個月內完成補選投票。但其所遺任期不足一年時，不予補選。\n二、全國不分區及僑居國外國民選出者，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員，在就職後喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其資格，由中央選舉委員會函請立法院予以註銷，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，於就職後因死亡、辭職、經判決當選無效確定、喪失其所屬政黨黨籍或其他事由出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；如該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第二款、第二項及第三項所定立法委員之遞補，應自立法院註銷名籍公函送達之日起十五日內，由中央選舉委員會公告遞補名單。","note":"一、原住民立法委員的制度乃憲法增修條文第四條賦予原住民族額外保障，合先敘明。\n二、此外，目前公職人員選舉罷免法限制原住民選舉區之議席缺額補選門檻規定，忽略了我國立法委員選舉制度已自第7屆產生變化，區域立法委員已由複數選區轉變成單一選區，單一選區每一選舉區應選名額1名，並規範遺任任期達一年以上即可進行補選。惟原住民族選區，仍要求達到應選名額一定比例，才可進行補選，顯不合理。基於「相同事情相同處理，不同事情不同處理」的平等原則，將一般選區與原住民選區補選制度做統一之規範，爰修正本條。\n三、區域及原住民立法委員均屬於選民直接於選舉區內投票產生，及與依政黨名單產生之全國不分區及僑居國外國民選出者不同，基於同屬民意直接選舉產生之區域及原住民立法委員，如有缺額則須採取一致之補選規定，不宜限制採取複數選舉區之原住民立法委員之補選必須其選舉區缺額達到半數，才能補選。爰將第一項第一款增列原住民選出者，以取得與區域選出者獲到相同補選規定，並將同項第二款予以刪除，第三款改為第二款。\n四、第五項配合第一項之修正，爰將第一項第三款改為第一項第二款。"},{"bill":"202110043510000","text":"立法委員於就職後因死亡、辭職、經判決當選無效確定或其他事由出缺時，依下列規定辦理：\n一、區域選出者，應自死亡之日、辭職之日或選舉委員會收到法院確定判決證明書之日或其他出缺事由發生之日起三個月內完成補選投票。但其所遺任期不足一年時，不予補選。\n二、原住民選出者：\n(一)因第一百二十條第一項第三款之情事，經法院判決當選無效確定或於法院審理當選無效訴訟中辭職者或當選人有褫奪公權尚未復權之情形時，其缺額由落選人依得票數之高低順序遞補，不適用重行選舉或缺額補選之規定。但遞補人員之得票數不得低於選舉委員會原公告該選舉區得票數最低之當選人得票數二分之一。\n(二)因死亡、辭職或其他事由出缺時，應自死亡之日、辭職之日或其他出缺事由發生之日起三個月內完成補選投票。但其所遺任期不足一年時，不予補選。\n三、全國不分區及僑居國外國民選出者，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員，在就職後喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其資格，由中央選舉委員會函請立法院予以註銷，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，於就職後因死亡、辭職、經判決當選無效確定、喪失其所屬政黨黨籍或其他事由出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；如該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第二款及第三款、第二項及第三項所定立法委員之遞補，應自立法院註銷名籍公函送達之日起十五日內，由中央選舉委員會公告遞補名單。","note":"一、公職人員選舉罷免法於2005年6月4日憲法增修條文修正通過前，原針對中央公職人員出缺補選之規定，係於原條文第六十八條之一第一項第一款：「區域、山胞選出者，同一選舉區內缺額達二分之一時，應由中央選舉委員會定期補選。但其所遺任期不足一年時，不予補選」，地方民意代表之出缺遞補規定則為第六十八條之二第二項：「地方民意代表當選人因第一百零三條第一項第三款或第四款之情事，經法院判決當選無效確定者或當選人有褫奪公權尚未復權之情形時，其缺額由落選人依得票數之高低順序遞補，不適用重行選舉或缺額補選之規定。但遞補人員之得票數不得低於選舉委員會原公告該選舉區得票數最低之當選人得票數二分之一。」。\n二、為配合上開修正通過之憲法增修條文規定，公職人員選舉罷免法於2007年11月6日全文修正，原條文第六十八條之一移列至第七十三條，原條文第六十八條之二則移列至第七十四條，其中區域立法委員選舉因改採單一選區制，因此另行增列區域立法委員就職後出缺之處理規定，而原住民立法委員及地方民意代表之出缺處理規定，皆維持原條文之設計，其中原住民立法委員與地方民意代表即以相同規定辦理，即係以選舉制度規劃缺額處理之方式。\n三、惟查，而原住民立法委員就職後因故出缺，需達到同選區二分之一以上缺額始得補選，實務上要滿足其條件機率甚微，將造成少數立法委員因故出缺，而嚴重影響原住民族參政權之保障，並增加同選區立法委員之負擔，爰修正第一項第二款，將原住民立法委員缺額事由分別處理。\n四、本條第一項第二款第一目，原住民族立法委員若因涉及本法一百二十條第一項各款規定之當選無效情事，以遞補方式補足其缺額，惟仍應確保遞補者之民意代表性，故票數不得低於最低當選人得票數之二分之一。\n五、本條第一項第二款第二目，原住民立法委員若因死亡、辭職或其他事由出缺時，應於三個月內完成補選投票，以維持原住民立委之政治代表性，確保民意授權之完整性。"},{"bill":"202110044290000","text":"立法委員於就職後因死亡、辭職、經判決當選無效確定或其他事由出缺時，依下列規定辦理：\n一、區域及原住民選出者，應自死亡之日、辭職之日或選舉委員會收到法院確定判決證明書之日或其他出缺事由發生之日起三個月內完成補選投票。但其所遺任期不足一年時，不予補選。\n二、全國不分區及僑居國外國民選出者，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員，在就職後喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其資格，由中央選舉委員會函請立法院予以註銷，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，於就職後因死亡、辭職、經判決當選無效確定、喪失其所屬政黨黨籍或其他事由出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；如該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第二款、第二項及第三項所定立法委員之遞補，應自立法院註銷名籍公函送達之日起十五日內，由中央選舉委員會公告遞補名單。","note":"一、第一項第二款刪除。\n二、原第一項第三款改移至第二款。\n三、第一項第一款增列原住民選出者。\n四、本條係針對立法委員於就職後，因死亡、辭職、經判決當選無效確定或其他事由出缺時。\n民國94年6月4日國民大會修憲後，立法委員自第七屆起席次從原225席減半為113席次。區域立委部分已改採「單一選區制」。惟原住民立委選舉仍採「複數選區制」。\n現行本法規定，原住民立委就職後因死亡、辭職、經判決當選無效確定或其他事由出缺之日起，且同一選舉區內原住民立委缺額達二分之一時，始准於三個月內完成補選投票。查原住民立委席次分別為山地原住民三席；平地原住民三席，合計六席僅占全體立委席次中的少數。且中華民國憲法增修條文第十條第十二項規定：「國家應依民族意願，保障原住民族之地位及政治參與，並對其教育文化、交通水利、衛生醫療、經濟土地及社會福利事業予以保障扶助並促其發展……。」故原住民族之政治參與，選舉及被選舉權利屬憲法上之制度性保障範疇。故選罷法針對原住民立委於同一選舉區內缺額達二分之一時始得進行補選之限制應予以刪除，以適時彌補民意缺口。\n另外，原住民立委之選舉區域遍及全國，若遇缺額即進行補選時所耗之國家公帑雖較區域立委之補選為甚。惟中央民意代表本與地方民意代表其代表性懸殊，且考量全國原住民族之區域分部及顧及現有法定16個原住民族均得以公平參與、維護原住民立委選舉公正性，真正落實選賢與能，應採行補選方式。同時，也避免選舉實務上，競選期間有心人士惡意檢舉攻訐、無端羅織罪名，計畫性地透過司法公權來打擊其他候選人之方式來遂行其勝選目的，甚至最後抱以僥倖心態認為若採遞補作式，其無須戮力爭取選民認同而僅需要消極地爭取該次選舉\"第四名\"票數席位即可。爰鑑於此，原住民立委出缺時，應採行限期補選方式，始能真正體現民主可貴、落實選舉公平並彌補民意缺口。\n五、第四項所列之款次，因為配合原條文第一項第三款的規定刪除，而予以修正。"}],"changed":true,"final":"立法委員於就職後因死亡、辭職、經判決當選無效確定或其他事由出缺時，依下列規定辦理：\n一、區域及原住民選出者，應自死亡之日、辭職之日或選舉委員會收到法院確定判決證明書之日或其他出缺事由發生之日起三個月內完成補選投票。但其所遺任期不足一年時，不予補選。\n二、全國不分區及僑居國外國民選出者，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員，在就職後喪失其所屬政黨黨籍者，自喪失黨籍之日起，喪失其資格，由中央選舉委員會函請立法院予以註銷，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單按順位依序遞補；如該政黨登記之候選人名單無人遞補時，視同缺額。\n全國不分區及僑居國外國民立法委員選舉婦女當選人，於就職後因死亡、辭職、經判決當選無效確定、喪失其所屬政黨黨籍或其他事由出缺，致該政黨婦女當選人不足婦女應當選名額時，其所遺缺額，除以書面聲明放棄遞補者外，由該政黨登記之候選人名單中之婦女候選人順位依序遞補；如該政黨登記之候選人名單無婦女候選人遞補時，視同缺額。\n前二項政黨黨籍之喪失，應由所屬政黨檢附黨籍喪失證明書，向中央選舉委員會備案。\n第一項第二款、第二項及第三項所定立法委員之遞補，應自立法院註銷名籍公函送達之日起十五日內，由中央選舉委員會公告遞補名單。","finalWhy":"一、原住民立法委員的制度乃憲法增修條文第四條賦予原住民族額外保障，合先敘明。\n二、此外，目前公職人員選舉罷免法限制原住民選舉區之議席缺額補選門檻規定，忽略了我國立法委員選舉制度已自第七屆產生變化，區域立法委員已由複數選區轉變成單一選區，單一選區每一選舉區應選名額一名，並規範遺任任期達一年以上即可進行補選。惟原住民族選區，仍要求達到應選名額一定比例，才可進行補選，顯不合理。基於「相同事情相同處理，不同事情不同處理」的平等原則，將一般選區與原住民選區補選制度做統一之規範，爰修正本條。\n三、區域及原住民立法委員均屬於選民直接於選舉區內投票產生，及與依政黨名單產生之全國不分區及僑居國外國民選出者不同，基於同屬民意直接選舉產生之區域及原住民立法委員，如有缺額則須採取一致之補選規定，不宜限制採取複數選舉區之原住民立法委員之補選必須其選舉區缺額達到半數，才能補選。爰將第一項第一款增列原住民選出者，以取得與區域選出者獲到相同補選規定，並將同項第二款予以刪除，第三款改為第二款。\n四、第五項配合第一項之修正，爰將第一項第三款改為第一項第二款。","review":null},{"no":"第一百三十四條","current":"本法自公布日施行。\n本法中華民國九十八年五月十二日修正之條文，自九十八年十一月二十三日施行。","versions":[{"bill":"202110044290000","text":"本法自公布日施行。\n本法中華民國九十八年五月十二日修正之條文，自九十八年十一月二十三日施行。\n本法中華民國○年○月○日修正之條文，自○年○月○日施行。","note":"增訂第三項規定。明定條例修正及施行日期。"}],"changed":false,"final":"本法自公布日施行。\n本法中華民國九十八年五月十二日修正之條文，自九十八年十一月二十三日施行。","finalWhy":null,"review":null}],"stages":[{"date":"2024-03-29","stage":"一讀","code":"院會-11-1-7","bill":"202110018610000","gazref":"113卷018期5200號 2-2頁"},{"date":"2024-04-19","stage":"一讀","code":"院會-11-1-10","bill":"202110033950000","gazref":"113卷028期5210號 15-15頁"},{"date":"2024-05-10","stage":"一讀","code":"院會-11-1-13","bill":"202110043510000","gazref":"113卷040期5222號一冊 8-8頁"},{"date":"2024-05-10","stage":"一讀","code":"院會-11-1-13","bill":"202110044290000","gazref":"113卷040期5222號一冊 10-10頁"},{"date":"2024-07-03","code":"","title":"","gazref":"113卷065期5247號 317-382頁","stage":"委員會","ppg":null,"full":[],"pdf":[],"clips":[],"props":[],"tr":null,"note":null},{"date":"2024-07-04","code":"委員會-11-1-15-26","title":"第11屆第1會期內政委員會第26次全體委員會議","gazref":"113卷072期5254號 1-3頁","stage":"委員會審查","ppg":"https://ppg.ly.gov.tw/ppg/sittings/2024070119/details?meetingDate=113/07/04","full":["https://ivod.ly.gov.tw/Play/Full/1M/16066"],"pdf":[{"u":"https://ppg.ly.gov.tw/ppg/SittingCommitteesInfo/download/communique1/final/pdf/113/72/LCIDC01_1137201_00001.pdf","p1 /* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;
  if (cost > 8e6) return null;
  const W = [];   // 配對得分：相同字數，不夠像就是 0
  for (let i = 0; i < n; i++) { W.push([]); for (let j = 0; j < m; j++) {
    const l = lcsLen(A[i], B[j]); W[i].push(2 * l / (A[i].length + B[j].length) >= 0.5 ? l + 1 : 0); } }
  const S = Array.from({length: n + 1}, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    S[i][j] = Math.max(S[i + 1][j], S[i][j + 1], W[i][j] ? S[i + 1][j + 1] + W[i][j] : 0);
  const lines = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && W[i][j] && S[i][j] === S[i + 1][j + 1] + W[i][j]) { lines.push(A[i] === B[j] ? [[0, B[j]]] : charSegs(A[i], B[j])); i++; j++; }
    else if (j >= m || (i < n && S[i][j] === S[i + 1][j])) { lines.push([[-1, A[i]]]); i++; }
    else { lines.push([[1, B[j]]]); j++; }
  }
  return lines;
}
function renderText(node, base, text, o) {   // o.nodiff 不比對；o.isNew 整條新增
  node.textContent = '';
  const gone = /^（刪除）$/;
  if (o.nodiff) { node.textContent = text; return; }
  if (o.isNew || (base && gone.test(base)) || (base && gone.test(text))) { node.append(el('ins', {text})); return; }
  const lines = base ? diffLines(base, text) : null;
  if (!lines) { node.textContent = text; return; }
  lines.forEach((segs, i) => {
    if (i) node.append(String.fromCharCode(10));
    segs.forEach(([k, s]) => node.append(k === 1 ? el('ins', {text: s}) : k === -1 ? el('del', {text: s}) : document.createTextNode(s)));
  });
}

const normName = s => (s || '').replace(/委員|召集/g, '').replace(/[A-Za-z‧· ]/g, '');
const PARTY = D.parties || {};
const PCOLOR = {'國民黨': '#2a6fc9', '民進黨': '#2f9e44', '民眾黨': '#22b8b0', '無黨籍': '#8a94a0'};
const TERM = /逕付二讀|重付表決|修正動議|記名表決|復議/;
function para(text) {   // 一段裡第一次出現的議事名詞加上虛線底線，點了有解釋
  const p = el('p'), m = TERM.exec(text);
  if (!m) { p.textContent = text; return p; }
  const b = el('button', {type: 'button', class: 'term', text: m[0]});
  b.addEventListener('click', e => { e.stopPropagation(); if (tipTag === b) hideTip(); else showTip(b, [m[0]], true); });
  p.append(text.slice(0, m.index), b, text.slice(m.index + m[0].length));

}
function fp(str) {   // 發言者加開頭幾個字的短指紋：逐字稿日後重新切分、段落編號變了，還能靠它找回同一段
  let h = 0; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return (h % 65536).toString(16).padStart(4, '0');
}
function toast(msg) {

function copyHere(id) {

function showTurn(turns, node) {   // 捲到某段發言；它如果收在折疊區塊裡，先打開
  for (let p = node.parentElement; p && p !== turns; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  turns.scrollTop = node.offsetTop - turns.offsetTop - 8;
}
function finder(turns) {   // 在這場逐字稿裡找字
  const input = el('input', {type: 'search', placeholder: '在這場逐字稿裡找字', 'aria-label': '在這場逐字稿裡找字'});
  const count = el('span'), prev = el('button', {type: 'button', class: 'chip', text: '上一段'}), next = el('button', {type: 'button', class: 'chip', text: '下一段'});
  let hits = [], cur = -1;
  const go = i => {
    if (!hits.length) return;
    if (hits[cur]) hits[cur].classList.remove('cur');
    cur = (i + hits.length) % hits.length;
    hits[cur].classList.add('cur'); showTurn(turns, hits[cur]);
    count.textContent = '第 ' + (cur + 1) + ' / ' + hits.length + ' 段';
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    [...turns.children].forEach(t => t.classList.remove('hit', 'cur'));
    hits = q ? [...turns.children].filter(t => t.textContent.includes(q)) : []; cur = -1;
    hits.forEach(t => t.classList.add('hit'));
    prev.hidden = next.hidden = !hits.length;
    count.textContent = !q ? '' : hits.length ? '' : '這場沒有出現這個詞';
    if (hits.length) go(0);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } });
  prev.addEventListener('click', () => go(cur - 1)); next.addEventListener('click', () => go(cur + 1));
  prev.hidden = next.hidden = true;
  return el('div', {class: 'find'}, input, count, prev, next);
}

          btn.addEventListener('click', () => openArticleDialog(p, p.arts[0]));

      }
      else { const tb = el('table'); b.rows.forEach(r => tb.append(el('tr', null, ...r.map(c => el('td', {text: c}))))); into.append(el('div', {class: 'tw'}, tb)); }

}
/* 一讀、二讀、三讀標籤的說明小框：滑鼠停留 1 秒或點一下就浮出 */
const READING = {
  '一讀': {t: '一讀會', sub: '朗讀標題、交付審查', what: '議案送進立法院後，在院會中由主席宣付朗讀議案名稱。', pts: [
    '朗讀標題後，通常會將法案交付給相關的委員會進行詳細的實質審查（例如：教育及文化委員會、司法及法制委員會等）。',
    '如果有立委提案並經 20 人以上連署、表決通過，也可以選擇「逕付二讀」（跳過委員會審查）。',
    '如果有異議，可以退回程序委員會或不予審議。']},
  '逕付二讀': {t: '逕付二讀', sub: '跳過委員會審查，直接排進院會二讀', what: '院會決定這個提案不交委員會審查（或從委員會抽出），直接進入二讀。', pts: [
    '通常在一讀報告事項時由黨團提議，院會無異議或表決通過。',
    '逕付二讀的提案多半會交黨團協商，或與已經審查完的相關提案併案處理。',
    '這一天只有主席宣告的幾句話，沒有實質討論。']},
  '二讀': {t: '二讀會', sub: '實質討論、逐條審議，最關鍵的階段', what: '委員會審查完畢，或是經逕付二讀後，將法案送到院會進行全體討論與表決。', pts: [
    '這是法案通過與否最關鍵、辯論最激烈的階段。',
    '進行廣泛討論以及逐條討論、修正。',
    '委員可以在此階段提出修正動議，最後進行表決。二讀通過後，原則上要在下次會議才進行三讀（但經 15 人以上連署、表決通過，也可以直接繼續三讀）。']},
  '三讀': {t: '三讀會', sub: '文字修正、全案表決', what: '二讀通過後進入三讀，原則上在下次會議進行。', pts: [
    '不能再大幅修改內容，除了解決文字上的牴觸、錯字或語句修飾外，僅得作文字修正。',
    '最後將全案進行最終表決。',
    '三讀通過後，立法院會將法案送交總統及行政院，由總統在 10 日內公布生效。']}
};
Object.assign(READING, {
  '復議': {t: '復議', sub: '要求把已經表決的案子重新討論', what: '議案表決之後，當初投贊成的一方可以提出復議，要求重新討論、重新表決。', pts: [
    '復議被否決之後，同一個案子不能再提復議，決議就此確定。',
    '實務上常見多數方自己提出復議、再自己否決，目的是讓剛通過的條文確定下來。']},
  '重付表決': {t: '重付表決', sub: '對表決結果有異議，再表決一次', what: '出席委員對表決結果有異議時，經 15 人以上連署或附議，可以要求重新表決。', pts: ['以一次為限。']},
  '修正動議': {t: '修正動議', sub: '在院會對條文提出的修改案', what: '委員或黨團在二讀（或三讀）時，對討論中的條文提出另一個版本的文字，交院會表決。', pts: ['需要 10 人以上連署或附議。']},
  '記名表決': {t: '記名表決', sub: '留下每位委員投什麼的表決', what: '表決時逐一記錄每位委員投贊成、反對或棄權，名單會登在公報上。', pts: []}
});
const tipbox = el('div', {class: 'tipbox', id: 'tipbox', role: 'tooltip', hidden: ''});
document.body.append(tipbox);
let tipTimer = null, tipTag = null, tipPinned = false;
function hideTip() {
  clearTimeout(tipTimer);
  if (tipTag) tipTag.removeAttribute('aria-describedby');
  tipbox.hidden = true; tipTag = null; tipPinned = false;
}
function showTip(tag, keys, pin) {
  hideTip();
  tipbox.textContent = '';
  keys.forEach(k => { const r = READING[k];
    tipbox.append(el('div', null, el('h4', null, r.t, el('small', {text: r.sub})), el('p', {text: r.what}), el('ul', null, ...r.pts.map(x => el('li', {text: x}))))); });
  tipbox.hidden = false; tipTag = tag; tipPinned = pin;
  tag.setAttribute('aria-describedby', 'tipbox');
  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */
(function () {
  const box = $('votes');
  if (D.votes.length) {
    $('votetext').textContent = '以下是有個人名單的記名表決。' + (D.votes.some(v => v.src) ? '名單取自公報逐字稿裡的表決結果。' : '');
    const tb = el('tbody');
    D.votes.forEach(v => {
      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;
      tb.append(el('tr', null, el('td', {text: v.no}), el('td', {class: 'num', text: v.present}), el('td', {class: 'num', text: v.yes}),
        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
$('foot').textContent = '資料來源：立法院議事暨公報資訊網、立法院公報、IVOD 影音系統，經民間國會資料 API（v2.ly.govapi.tw）取得，抓取日期 ' + D.fetched + '。逐字稿由公報文字版自動切分發言者，條文差異由程式自動比對，僅供閱讀參考，正式內容以公報為準。';
</script>
