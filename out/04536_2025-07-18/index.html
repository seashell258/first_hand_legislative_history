<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中華民國刑法修正歷程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one reading column. Summary, a dated ledger of meetings (transcripts open in place), proposal cards, then the article comparison bench. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5b6773; --line:#d5dbe1;
  --accent:#17557a; --accent-soft:#e2eef5;
  --ins:#d6f0dc; --ins-ink:#0f4a22; --del:#fbe4e5; --del-ink:#8f2530;
  --warn:#8a4b06; --warn-soft:#fbefd9;
  --c-prop:#5b6773; --c-comm:#17557a; --c-hear:#6a4c93; --c-nego:#8a4b06; --c-floor:#a3262f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --ink:#e6ebf0; --muted:#9aa6b2; --line:#303a45;
  --accent:#7fbde0; --accent-soft:#1d3342;
  --ins:#1d4a2b; --ins-ink:#c6f0d2; --del:#47212a; --del-ink:#f0b4ba;
  --warn:#f0b866; --warn-soft:#3a2c14;
  --c-prop:#9aa6b2; --c-comm:#7fbde0; --c-hear:#b9a1e0; --c-nego:#f0b866; --c-floor:#f08a91;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,38px);font-weight:900}
h2{font-size:22px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
button{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lede{max-width:40em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.facts div{padding:12px 16px 12px 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead p{color:var(--muted);max-width:44em}
.ref{font-size:12px;color:var(--muted)}
.ref a{color:var(--muted)}
.chip{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:1px 9px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ledger */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.row .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--k);border:1px solid var(--k);border-radius:3px;padding:0 6px;line-height:1.6;margin-right:8px;white-space:nowrap}
button.tag{background:transparent;cursor:help;font-family:inherit}
button.tag:hover,button.tag[aria-describedby]{background:color-mix(in srgb,var(--k) 12%,transparent)}
.tipbox{position:fixed;z-index:50;box-sizing:border-box;width:max-content;max-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:13px;line-height:1.65;display:flex;flex-direction:column;gap:12px}
.tipbox h4{margin:0;font-size:14px;font-weight:700}
.tipbox h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.tipbox ul{margin:4px 0 0;padding-left:1.2em;color:var(--muted)}
.row .what{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .acts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:3px}
.open{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 10px;cursor:pointer;font-size:13px;font-weight:500}
@media (max-width:560px){ .row{grid-template-columns:minmax(0,1fr)} }

/* transcript */
.tr{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tr .idx{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.tr .turns{display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto;padding-right:6px}
.turn{display:flex;flex-direction:column;gap:4px;max-width:46em}
.turn .who{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.turn .who small{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.turn.chair .who,.turn.chair p{color:var(--muted)}
.turn p{overflow-wrap:anywhere}
.turn.pre p{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
.turn .party{font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.turn .party i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}
.turn .here{font-weight:400;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.turn .here:hover{color:var(--accent)}
.turn.landed{box-shadow:-3px 0 0 var(--accent);padding-left:10px;background:var(--accent-soft)}
.turn.hit{box-shadow:-3px 0 0 var(--warn);padding-left:10px}
.turn.hit.cur{background:var(--warn-soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:1px dotted var(--muted)}
.tr .find{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.tr .find input{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);width:min(16em,100%)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:4px;max-width:calc(100vw - 32px)}
.readout{display:flex;flex-direction:column;gap:4px;padding:6px 0 6px 1.4em;min-width:0}
.readnote{padding-left:1.4em}
.turn .fold>summary b{font-weight:500}
.tw table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tw td{border:1px solid var(--line);padding:3px 8px;vertical-align:top}

/* proposals */
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.prop{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.prop .line{font-size:13px;color:var(--muted)}
.prop .reason{font-size:14px}
.pdetail{display:flex;flex-direction:column;gap:6px;min-width:0}
.pdetail .line{font-size:13px;color:var(--muted)}
.pdetail .reason{font-size:14px;max-width:46em}
.pdetail .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;align-items:baseline}
.people .plabel{font-size:13px;color:var(--muted);min-width:6.5em}
.person{white-space:nowrap}
.person small{color:var(--muted);font-size:11px;margin-left:3px}
.ppanel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chip[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 收合區塊 */
.fold>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);min-width:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"\25B8";color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .peek{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold[open]>summary .peek{display:none}
.fold>summary b{color:var(--ink);font-weight:500;flex:none}
.fold>.people,.fold>.reason,.fold>.ref{padding:4px 0 6px 1.4em}
.inbench{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.inbench .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);overflow-x:auto;padding-bottom:8px}
.inbench .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ .inbench .bench{grid-auto-columns:82%} .inbench .bench>.ver:first-child{position:static;box-shadow:none} }

/* bench */
.chip.passed{border-color:var(--c-floor);color:var(--c-floor);font-weight:700}
.chip[aria-expanded="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 條文對照彈窗 */
dialog.artdlg{width:min(1400px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 32px);max-height:none;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.artdlg[open]{display:flex;flex-direction:column}
dialog.artdlg::backdrop{background:rgba(10,15,20,.55)}
.dlghead{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgtitle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlgbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--bg);overflow-y:auto}
.dlgbody .bench{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);overflow-x:auto;padding-bottom:8px}
.dlgbody .ver .text{max-height:calc(100dvh - 300px)}
.dlgbody .bench>.ver:first-child{position:sticky;left:0;z-index:1;box-shadow:6px 0 10px -6px rgba(0,0,0,.35)}
@media (max-width:640px){ dialog.artdlg{width:100vw;height:100dvh;border-radius:0} .dlgbody .bench{grid-auto-columns:85%} .dlgbody .bench>.ver:first-child{position:static;box-shadow:none} }
.artnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.benchbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.benchbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.ver{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;display:flex;flex-direction:column}
.ver.final{border-color:var(--c-floor);border-width:2px}
.ver .vh{padding:10px 14px;border-bottom:1px solid var(--line)}
.ver .vh small{color:var(--muted);font-size:12px;display:block}
.ver .text{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:420px;overflow-y:auto}
.ver .text ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px}
.ver .text del{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend ins,.legend del{padding:0 4px;border-radius:2px}
.legend ins{background:var(--ins);color:var(--ins-ink);text-decoration:none}
.legend del{background:var(--del);color:var(--del-ink)}
.ver .empty{color:var(--muted);font-style:italic}
.ver details{border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--muted)}
.ver details summary{cursor:pointer;color:var(--accent)}
.ver details div{white-space:pre-wrap;padding-top:6px}

/* votes */
.tablewrap{overflow-x:auto}
.vt{border-collapse:collapse;width:100%;min-width:460px;font-variant-numeric:tabular-nums}
.vt th,.vt td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.vt th{font-size:12px;color:var(--muted);font-weight:500}
.vt .num{text-align:right}
.bar{display:block;height:8px;background:var(--line);border-radius:2px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-floor)}
.names{font-size:13px;color:var(--muted)}
.gaps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:46em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><a href="../index.html">← 所有法案</a>　法案歷程　由政府公開資料整理　皆附資料出處</div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <dl class="facts" id="facts"></dl>
  </div>

  <section>
    <div class="sechead">
      <h2>歷程</h2>
    </div>
    <ol class="ledger" id="ledger"></ol>
  </section>

  <section id="sec-props">
    <div class="sechead">
      <h2>提案版本</h2>
      <p>所有提案放在一起看：誰提的、誰連署、想改什麼、動到哪幾條。內容和歷程裡各列展開的相同。</p>
    </div>
    <div class="props" id="props"></div>
  </section>

  <section id="sec-bench">
    <div class="sechead">
      <h2>逐條對照</h2>
      <p id="benchintro">選一個條文，並排看現行條文、各提案版本、三讀通過的條文。紅框的條號是這次真的被修正的。</p>
    </div>
    <div class="chips artnav" id="artnav"></div>
    <div class="benchbar">
      <span id="artstatus"></span>
      <span class="legend" id="benchlegend">和現行條文比：<ins>新增的文字</ins><del>刪掉的文字</del></span>
    </div>
    <div class="bench" id="bench"></div>
  </section>

  <section>
    <div class="sechead"><h2>表決</h2><p id="votetext"></p></div>
    <div id="votes"></div>
  </section>

  <section id="sec-gaps" hidden>
    <div class="sechead"><h2>備註</h2></div>
    <ul class="gaps" id="gaps"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

l":"https://ppg.ly.gov.tw/ppg/bills/202110103300000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/09/LCEWA01_110309_00078.pdf","proposers":["張智倫","洪孟楷","游顥"],"ncosign":14,"people":[["張智倫","國民黨","提案"],["洪孟楷","國民黨","提案"],["游顥","國民黨","提案"],["蘇清泉","國民黨","連署"],["高金素梅","無黨籍","連署"],["徐欣瑩","國民黨","連署"],["林沛祥","國民黨","連署"],["黃建賓","國民黨","連署"],["魯明哲","國民黨","連署"],["陳菁徽","國民黨","連署"],["邱鎮軍","國民黨","連署"],["牛煦庭","國民黨","連署"],["陳玉珍","國民黨","連署"],["丁學忠","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["廖先翔","國民黨","連署"],["翁曉玲","國民黨","連署"]],"party":[["國民黨",16],["無黨籍",1]],"reason":"本院委員張智倫、洪孟楷、游顥等17人，鑒於近年來我國對於未滿七歲之人，凌虐犯罪案件頻傳，尤其是幼兒或是兒童尚未具任何自主能力，於遭到不當凌虐時，若無法及時發覺，恐導致重傷或死亡，惟目前我國刑法針對凌虐未滿七歲之人犯罪所定之刑責，雖已修法加重其刑，但仍持續發生令人無法挽回之憾事；因此，現行法規針對手段兇殘且毫無反省之凌虐犯罪者，其嚇阻力顯有不足之處。為確實保障兒少生命安全，實有加重其刑至死刑之必要，爰擬具「中華民國刑法第二百七十一條及第二百八十六條條文修正草案」。是否有當？敬請公決。","arts":["第二百七十一條","第二百八十六條"]},{"id":"202110103360000","who":"國民黨黨團","date":"2025-04-25","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110103360000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/09/LCEWA01_110309_00086.pdf","proposers":["傅崐萁","王鴻薇","羅智強"],"ncosign":0,"people":[["傅崐萁","國民黨","提案"],["王鴻薇","國民黨","提案"],["羅智強","國民黨","提案"]],"party":[["國民黨",3]],"reason":"本院國民黨黨團，有鑑於未滿七歲之人，並無自我保護及反抗之能力，其地位幾乎等同於強盜罪中之「至使不能抗拒」，因此對幼童凌虐致死者，其行為罪大惡極並泯滅人性，其最高刑度應參考刑法第三百二十八條，對於犯強盜罪因而致人於死者，最高可處死刑，始符合罪刑相當原則。爰擬具「中華民國刑法第二百八十六條條文修正草案」，對於凌虐幼童致死者，最高刑度提高至死刑或無期徒刑。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110120320000","who":"委員邱鎮軍等19人","date":"2025-05-09","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110120320000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/11/LCEWA01_110311_00043.pdf","proposers":["邱鎮軍","蘇清泉","林沛祥","羅廷瑋"],"ncosign":15,"people":[["邱鎮軍","國民黨","提案"],["蘇清泉","國民黨","提案"],["林沛祥","國民黨","提案"],["羅廷瑋","國民黨","提案"],["鄭天財Sra Kacaw","國民黨","連署"],["廖偉翔","國民黨","連署"],["陳菁徽","國民黨","連署"],["涂權吉","國民黨","連署"],["王育敏","國民黨","連署"],["張啓楷","民眾黨","連署"],["謝龍介","國民黨","連署"],["游顥","國民黨","連署"],["高金素梅","無黨籍","連署"],["翁曉玲","國民黨","連署"],["馬文君","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["陳雪生","國民黨","連署"],["羅智強","國民黨","連署"],["顏寬恒","國民黨","連署"]],"party":[["國民黨",17],["民眾黨",1],["無黨籍",1]],"reason":"本院委員邱鎮軍、蘇清泉、林沛祥、羅廷瑋等19人，有鑑於凌虐兒少案件量居高不下，且中華民國刑法第二百八十六條雖定有加重結果之處罰規定，仍未能有效遏止對於未滿十八歲兒少者施以凌虐致死之犯行，因此對於手段兇殘、罪不可赦且無教化可能、無復歸社會可能性之罪犯，仍有將其判處死刑之必要。爰擬具「中華民國刑法第二百八十六條條文修正草案」，對於未滿十八歲之人施以凌虐致死之犯行，增列「死刑」，並提升致重傷之刑責，以儆效尤。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110126840000","who":"委員王育敏等23人","date":"2025-05-16","name":"「中華民國刑法第二百七十一條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110126840000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/12/LCEWA01_110312_00053.pdf","proposers":["王育敏","林沛祥","廖偉翔"],"ncosign":20,"people":[["王育敏","國民黨","提案"],["林沛祥","國民黨","提案"],["廖偉翔","國民黨","提案"],["陳菁徽","國民黨","連署"],["邱鎮軍","國民黨","連署"],["羅智強","國民黨","連署"],["黃仁","國民黨","連署"],["盧縣一","國民黨","連署"],["鄭正鈐","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["張智倫","國民黨","連署"],["葉元之","國民黨","連署"],["牛煦庭","國民黨","連署"],["廖先翔","國民黨","連署"],["馬文君","國民黨","連署"],["黃建賓","國民黨","連署"],["林倩綺","國民黨","連署"],["洪孟楷","國民黨","連署"],["高金素梅","無黨籍","連署"],["傅崐萁","國民黨","連署"],["游顥","國民黨","連署"],["謝龍介","國民黨","連署"],["陳昭姿","民眾黨","連署"]],"party":[["國民黨",21],["無黨籍",1],["民眾黨",1]],"reason":"本院委員王育敏、林沛祥、廖偉翔等23人，有鑑於近年我國兒虐問題惡化，未滿6歲之兒童受虐人數逐年增加，施虐人數不減反增，亟待強化兒少保護。尤其未滿六歲之幼童較無自我保護及求救能力，易遭凌虐甚或因而致死，實有加重刑期，以增嚇阻犯罪之效。爰擬具「中華民國刑法第二百七十一條條文修正草案」，以凌虐方式殺害未滿六歲之人者，處死刑或無期徒刑，以保障兒少之生命，伸張兒少司法正義。是否有當？敬請公決。","arts":["第二百七十一條"]},{"id":"202110127900000","who":"委員葉元之等18人","date":"2025-05-23","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110127900000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/13/LCEWA01_110313_00024.pdf","proposers":["葉元之","林沛祥"],"ncosign":16,"people":[["葉元之","國民黨","提案"],["林沛祥","國民黨","提案"],["馬文君","國民黨","連署"],["邱鎮軍","國民黨","連署"],["黃仁","國民黨","連署"],["涂權吉","國民黨","連署"],["高金素梅","無黨籍","連署"],["張智倫","國民黨","連署"],["黃建賓","國民黨","連署"],["羅智強","國民黨","連署"],["盧縣一","國民黨","連署"],["廖先翔","國民黨","連署"],["陳玉珍","國民黨","連署"],["呂玉玲","國民黨","連署"],["林德福","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["黃健豪","國民黨","連署"],["謝龍介","國民黨","連署"]],"party":[["國民黨",17],["無黨籍",1]],"reason":"本院委員葉元之、林沛祥等18人，鑑於近年我國兒虐問題日益嚴重，未滿七歲幼童受虐案件頻繁發生，受害人數逐年增加，施虐人數亦未見減少且屢見致死案例。幼童普遍欠缺自我保護與求助能力，面對暴力極易遭受嚴重傷害甚不幸致死，爰擬具「中華民國刑法第二百八十六條條文修正草案」，針對未滿七歲幼童受害之案件，增訂致人於死者處死刑或無期徒刑，致重傷者處無期徒刑或十年以上有期徒刑之規定，增強嚇阻效果，保障幼童基本人權與生命安全。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110128470000","who":"委員王鴻薇等21人","date":"2025-05-23","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110128470000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/13/LCEWA01_110313_00068.pdf","proposers":["王鴻薇","廖偉翔","游顥","謝龍介"],"ncosign":17,"people":[["王鴻薇","國民黨","提案"],["廖偉翔","國民黨","提案"],["游顥","國民黨","提案"],["謝龍介","國民黨","提案"],["賴士葆","國民黨","連署"],["顏寬恒","國民黨","連署"],["陳超明","無黨籍","連署"],["徐欣瑩","國民黨","連署"],["呂玉玲","國民黨","連署"],["鄭天財Sra Kacaw","國民黨","連署"],["鄭正鈐","國民黨","連署"],["李彥秀","國民黨","連署"],["羅明才","國民黨","連署"],["邱鎮軍","國民黨","連署"],["陳菁徽","國民黨","連署"],["牛煦庭","國民黨","連署"],["陳雪生","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["邱若華","國民黨","連署"],["高金素梅","無黨籍","連署"],["林思銘","國民黨","連署"]],"party":[["國民黨",19],["無黨籍",2]],"reason":"本院委員王鴻薇、廖偉翔、游顥、謝龍介等21人，有鑑於近年我國兒虐問題惡化，兒童受虐人數逐年增加，施虐人數不減反增，亟待強化兒少保護，尤其幼童較無自我保護及求救能力，易遭凌虐甚或因而致死，實有加重刑期，以增嚇阻犯罪之效。爰擬具「中華民國刑法第二百八十六條條文修正草案」，對未滿七歲之人，致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑，以保障兒少之生命，伸張兒少司法正義。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110128720000","who":"委員柯志恩等16人","date":"2025-05-23","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110128720000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/13/LCEWA01_110313_00080.pdf","proposers":["柯志恩","陳菁徽","李彥秀","羅廷瑋"],"ncosign":12,"people":[["柯志恩","國民黨","提案"],["陳菁徽","國民黨","提案"],["李彥秀","國民黨","提案"],["羅廷瑋","國民黨","提案"],["林思銘","國民黨","連署"],["羅明才","國民黨","連署"],["邱鎮軍","國民黨","連署"],["林倩綺","國民黨","連署"],["許宇甄","國民黨","連署"],["謝龍介","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["游顥","國民黨","連署"],["陳雪生","國民黨","連署"],["高金素梅","無黨籍","連署"],["羅智強","國民黨","連署"],["王育敏","國民黨","連署"]],"party":[["國民黨",15],["無黨籍",1]],"reason":"本院委員柯志恩、陳菁徽、李彥秀、羅廷瑋等16人，鑒於近年我國兒少受虐案件頻傳，兒少身心尚未臻成熟，為使其人格充分發展，應保障其不受任何形式之身心傷害、虐待與疏忽。相關研究指出，遭受長期虐待或不當管教之兒少，不僅對生理、心理及人格上造成傷害，亦對人際關係、親密關係及社會關係等發展造成深遠之影響。惟考量我國現行法規有關兒虐所定之刑責，及兒虐行為所生惡害程度之嚴重性，現行刑法之罪刑顯不相當、嚇阻效果確有不足，爰擬具「中華民國刑法第二百八十六條條文修正草案」，將刑度加重至三年以上十年以下有期徒刑，以保障兒少身心健康、人格發展與生命安全。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110129540000","who":"委員廖偉翔等16人","date":"2025-06-03","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110129540000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/21/LCEWA01_110321_00193.pdf","proposers":["廖偉翔","黃健豪","林沛祥","涂權吉","羅廷瑋"],"ncosign":7,"people":[["廖偉翔","國民黨","提案"],["黃健豪","國民黨","提案"],["林沛祥","國民黨","提案"],["涂權吉","國民黨","提案"],["羅廷瑋","國民黨","提案"],["蘇清泉","國民黨","連署"],["王鴻薇","國民黨","連署"],["陳玉珍","國民黨","連署"],["邱若華","國民黨","連署"],["黃建賓","國民黨","連署"],["林倩綺","國民黨","連署"],["魯明哲","國民黨","連署"]],"party":[["國民黨",12]],"reason":"本院委員廖偉翔、黃健豪、林沛祥、涂權吉、羅廷瑋等16人，鑑於我國近年兒童重大虐待事件頻傳，受虐兒童人數逐年攀升，施虐者卻未見減少，顯示現行制度對於兒童保護仍有明顯不足。又查，上開案件尤以年幼兒童為甚，乃因缺乏自我防衛與求援能力，極易成為虐待對象，甚至導致傷重不治，情況令人痛心。為有效強化對兒童之法律保護，並提升對潛在施虐者之嚇阻效果，實有必要針對特定重罪行為，從嚴訂定刑責。爰擬具「中華民國刑法第二百八十六條條文修正草案」，增訂對於未滿七歲兒童施以虐待而致死者，處以死刑或無期徒刑；致重傷者，則處無期徒刑或十年以上有期徒刑。期能透過法律加重處罰，提高嚇阻力，以保障兒少之生命安全，彰顯司法對弱勢兒童的保護與正義。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110129060000","who":"委員羅智強等16人","date":"2025-06-03","name":"「中華民國刑法第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110129060000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/21/LCEWA01_110321_00192.pdf","proposers":["羅智強","游顥","羅廷瑋"],"ncosign":13,"people":[["羅智強","國民黨","提案"],["游顥","國民黨","提案"],["羅廷瑋","國民黨","提案"],["林倩綺","國民黨","連署"],["邱若華","國民黨","連署"],["丁學忠","國民黨","連署"],["黃建賓","國民黨","連署"],["馬文君","國民黨","連署"],["林沛祥","國民黨","連署"],["高金素梅","無黨籍","連署"],["柯志恩","國民黨","連署"],["謝龍介","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["邱鎮軍","國民黨","連署"],["傅崐萁","國民黨","連署"],["張嘉郡","國民黨","連署"]],"party":[["國民黨",15],["無黨籍",1]],"reason":"本院委員羅智強、游顥、羅廷瑋等16人，鑑於近年兒虐事件頻傳，為強化司法效能與減少不幸兒虐事件，爰擬具「中華民國刑法第二百八十六條條文修正草案」。是否有當？敬請公決。","arts":["第二百八十六條"]},{"id":"202110133730000","who":"委員洪孟楷等18人","date":"2025-06-13","name":"「中華民國刑法部分條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110133730000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/21/LCEWA01_110321_00191.pdf","proposers":["洪孟楷","廖偉翔","羅廷瑋","黃健豪"],"ncosign":14,"people":[["洪孟楷","國民黨","提案"],["廖偉翔","國民黨","提案"],["羅廷瑋","國民黨","提案"],["黃健豪","國民黨","提案"],["馬文君","國民黨","連署"],["邱若華","國民黨","連署"],["魯明哲","國民黨","連署"],["呂玉玲","國民黨","連署"],["萬美玲","國民黨","連署"],["王育敏","國民黨","連署"],["陳菁徽","國民黨","連署"],["徐欣瑩","國民黨","連署"],["廖先翔","國民黨","連署"],["張智倫","國民黨","連署"],["邱鎮軍","國民黨","連署"],["楊瓊瓔","國民黨","連署"],["顏寬恒","國民黨","連署"],["羅智強","國民黨","連署"]],"party":[["國民黨",18]],"reason":"本院委員洪孟楷、廖偉翔、羅廷瑋、黃健豪等18人，有鑑於近年來幼童受虐致死社會案件屢屢激起民意強烈憤慨，惟現行法律對凌虐致死者僅能論以刑法第二百七十七條普通傷害罪處無期徒刑或七年以上有期徒刑，造成難以容忍之處罰漏洞。爰擬具「中華民國刑法部分條文修正草案」，增訂凌虐未滿十二歲之人致死或重傷之相關刑責及不得假釋之規定。是否有當？敬請公決。","arts":["第七十七條","第二百七十一條之一","第二百七十七條之一","第二百七十八條之一"]},{"id":"202110133710000","who":"台灣民眾黨黨團","date":"2025-06-13","name":"「中華民國刑法第二百七十二條之一及第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110133710000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/21/LCEWA01_110321_00190.pdf","proposers":["黃國昌","張啓楷","陳昭姿"],"ncosign":0,"people":[["黃國昌","民眾黨","提案"],["張啓楷","民眾黨","提案"],["陳昭姿","民眾黨","提案"]],"party":[["民眾黨",3]],"reason":"本院台灣民眾黨黨團，有鑑於依據民法第十三條第一項，未滿七歲之人並無行為能力，殺害未滿七歲之人、以凌虐方式殺害未滿七歲之人、以凌虐方式致未滿七歲之人於死或重傷，惡性極為重大，有必要加重處罰，並增訂死刑之刑罰手段，爰擬具「中華民國刑法第二百七十二條之一及第二百八十六條條文修正草案」。是否有當？敬請公決。","arts":["第二百七十二條之一","第二百八十六條"]},{"id":"202110133570000","who":"委員郭昱晴等16人","date":"2025-06-20","name":"「中華民國刑法第二百七十一條及第二百八十六條條文修正草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110133570000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/21/LCEWA01_110321_00189.pdf","proposers":["郭昱晴"],"ncosign":15,"people":[["郭昱晴","民進黨","提案"],["林宜瑾","民進黨","連署"],["沈伯洋","民進黨","連署"],["王美惠","民進黨","連署"],["陳亭妃","民進黨","連署"],["鍾佳濱","民進黨","連署"],["陳秀寳","民進黨","連署"],["李坤城","民進黨","連署"],["王義川","民進黨","連署"],["徐富癸","民進黨","連署"],["陳素月","民進黨","連署"],["王定宇","民進黨","連署"],["王世堅","民進黨","連署"],["陳俊宇","民進黨","連署"],["陳瑩","民進黨","連署"],["陳冠廷","民進黨","連署"]],"party":[["民進黨",16]],"reason":"本院委員郭昱晴等16人，鑒於近年兒童遭長期虐待致死案件層出不窮，引發社會極大震撼與公憤，現行刑法對於此類情節仍無明確設有與其惡性相符之加重處罰規範，未能充分體現國家對兒童生命權之保護。爰參酌司法院113年憲判字第8號解釋意旨，確認死刑作為憲法保障下之極刑制度仍具正當性，並考量社會對兒童虐待致死零容忍之普遍共識，爰修正《刑法》第二百七十一條條文，增列對未成年人施以嚴重凌虐或重大疏忽致死者之特別加重型構成要件，並增訂「死刑」為可選法定刑，以彰顯國家保護弱勢、落實兒童人權保障之立法決心，爰擬具「中華民國刑法第二百七十一條及第二百八十六條條文修正草案」。是否有當？敬請公決。","arts":["第二百七十一條","第二百八十六條"]},{"id":"202110143470000","who":"委員吳宗憲等17人","date":"2025-07-18","name":"「中華民國刑法增訂第二百七十二條之一條文草案」","url":"https://ppg.ly.gov.tw/ppg/bills/202110143470000/details","pdf":"https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/03/21/LCEWA01_110321_00010.pdf","proposers":["吳宗憲","廖偉翔","牛煦庭","鄭正鈐","林沛祥","游顥"],"ncosign":11,"people":[["吳宗憲","國民黨","提案"],["廖偉翔","國民黨","提案"],["牛煦庭","國民黨","提案"],["鄭正鈐","國民黨","提案"],["林沛祥","國民黨","提案"],["游顥","國民黨","提案"],["丁學忠","國民黨","連署"],["葉元之","國民黨","連署"],["張智倫","國民黨","連署"],["魯明哲","國民黨","連署"],["陳玉珍","國民黨","連署"],["羅智強","國民黨","連署"],["謝龍介","國民黨","連署"],["林德福","國民黨","連署"],["馬文君","國民黨","連署"],["涂權吉","國民黨","連署"],["呂玉玲","國民黨","連署"]],"party":[["國民黨",17]],"reason":"本院委員吳宗憲、廖偉翔、牛煦庭、鄭正鈐、林沛祥、游顥等17人，有鑑於未滿七歲之幼兒童，為民法第十三條第一項之無行為能力人，欠缺自我保護能力及自救能力，為彰顯殺害未滿七歲之幼兒童，惡性極為重大，有加重處罰之必要；又以施加凌虐之方式殺害，除使無自救力之幼兒童生命權永久喪失外，更對其家屬之身心造成難以回復之傷痛，且影響社會治安甚鉅，有與社會永久隔絕之必要，爰處死刑或無期徒刑，以昭炯戒，爰擬具「中華民國刑法增訂第二百七十二條之一條文草案」。是否有當？敬請公決。","arts":["第二百七十二條之一"]}],"arts":[{"no":"第七十七條","current":"受徒刑之執行而有悛悔實據者，無期徒刑逾二十五年，有期徒刑逾二分之一、累犯逾三分之二，由監獄報請法務部，得許假釋出獄。\n前項關於有期徒刑假釋之規定，於下列情形，不適用之：\n一、有期徒刑執行未滿六個月者。\n二、犯最輕本刑五年以上有期徒刑之罪之累犯，於假釋期間，受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯最輕本刑為五年以上有期徒刑之罪者。\n三、犯第九十一條之一所列之罪，於徒刑執行期間接受輔導或治療後，經鑑定、評估其再犯危險未顯著降低者。\n無期徒刑裁判確定前逾一年部分之羈押日數算入第一項已執行之期間內。","versions":[{"bill":"202110107240000","text":"受徒刑之執行而有悛悔實據者，無期徒刑逾二十五年，有期徒刑逾二分之一、累犯逾三分之二，由監獄報請法務部，得許假釋出獄。\n前項關於有期徒刑假釋之規定，於下列情形，不適用之：\n一、有期徒刑執行未滿六個月者。\n二、犯最輕本刑五年以上有期徒刑之罪之累犯，於假釋期間，受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯最輕本刑為五年以上有期徒刑之罪者。\n三、犯第九十一條之一所列之罪，於徒刑執行期間接受輔導或治療後，經鑑定、評估其再犯危險未顯著降低者。\n四、犯第二百八十六條或兒童及少年性剝削防制條例第三十一條至第四十條、第四十四條、第四十五條第二項及第三項之罪者。\n無期徒刑裁判確定前逾一年部分之羈押日數算入第一項已執行之期間內。","note":"一、第二項新增第四款，鑒於對未滿18歲之人（包含兒童及少年）施以凌虐致妨害其身心之健全或發育，以及使其遭受不同形式之性剝削之犯罪行為惡性重大，恐致生兒童及少年難以抹滅之傷害。另後續社會及相關單位、民間機構救援保護、安置服務成本極高，若缺乏懲治矯正之效果，恐使部分犯罪人士因營利等因素反覆實施犯罪、破壞社會穩定、增加再犯機率，有違民眾法感情。爰修正新增犯本法第二百八十六條妨害幼童發育罪及《兒童及少年性剝削防制條例》第三十一條至第四十條、第四十四條、第四十五條第二項及第三項之罪者，應例外不得申請假釋。\n二、另為通盤檢討現行刑法及其特別法各條所列之罪是否應允許申請假釋，以符合比例原則及衡平各項罪名侵害相異法益對於當事人及國家社會危害之程度有別，法務部及相關機關應盡速通盤檢討各項罪名是否應訂定例外排除條款不得假釋之規定，併此敘明。"},{"bill":"202110133730000","text":"受徒刑之執行而有悛悔實據者，無期徒刑逾二十五年，有期徒刑逾二分之一、累犯逾三分之二，由監獄報請法務部，得許假釋出獄。\n前項關於有期徒刑假釋之規定，於下列情形，不適用之：\n一、有期徒刑執行未滿六個月者。\n二、犯最輕本刑五年以上有期徒刑之罪之累犯，於假釋期間，受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯最輕本刑為五年以上有期徒刑之罪者。\n三、犯第二百七十一條之一、第二百七十七條之一及第二百七十八條之一之罪並受二年以上刑期宣告者。\n四、犯第九十一條之一所列之罪，於徒刑執行期間接受輔導或治療後，經鑑定、評估其再犯危險未顯著降低者。\n無期徒刑裁判確定前逾一年部分之羈押日數算入第一項已執行之期間內。","note":"一、增訂第二項第三款，原第二項第三款移列至第四款；其餘未修正。\n二、增訂犯第二百七十一條之一、第二百七十七條之一及第二百七十八條之一之罪並受兩年以上刑期宣告者，列為不適用本條無期徒刑假釋之規定。"}],"changed":false,"final":"受徒刑之執行而有悛悔實據者，無期徒刑逾二十五年，有期徒刑逾二分之一、累犯逾三分之二，由監獄報請法務部，得許假釋出獄。\n前項關於有期徒刑假釋之規定，於下列情形，不適用之：\n一、有期徒刑執行未滿六個月者。\n二、犯最輕本刑五年以上有期徒刑之罪之累犯，於假釋期間，受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯最輕本刑為五年以上有期徒刑之罪者。\n三、犯第九十一條之一所列之罪，於徒刑執行期間接受輔導或治療後，經鑑定、評估其再犯危險未顯著降低者。\n無期徒刑裁判確定前逾一年部分之羈押日數算入第一項已執行之期間內。","finalWhy":null,"review":{"note":"不予修正，維持現行條文","text":""}},{"no":"第二百七十一條","current":"殺人者，處死刑、無期徒刑或十年以上有期徒刑。\n前項之未遂犯罰之。\n預備犯第一項之罪者，處二年以下有期徒刑。","versions":[{"bill":"202110103300000","text":"殺人者，處死刑、無期徒刑或十年以上有期徒刑。\n前項之未遂犯罰之。\n預備犯第一項之罪者，處二年以下有期徒刑。\n對於未滿七歲之人，以凌虐方式犯第一項之罪者，處死刑或無期徒刑；處無期徒刑者，不得假釋。","note":"一、參酌第二百八十六條第五項規定，對於未滿七歲之人，以凌虐方式犯第一項之罪者，其惡性重大，對法益侵害程度極端嚴重，爰增列第四項加重其刑責規定，處以死刑或無期徒刑；且處以無期徒刑者，不得申請假釋，以儆效尤，俾符一般國民之法感情。\n二、「凌虐」係指凌辱虐待等非人道待遇，不論積極性之行為，如時予毆打，食不使飽，或消極性之行為，如病不使醫、傷不使療等行為均包括在內，是倘行為人對被害人施以強暴、脅迫，或以強暴、脅迫以外，其他違反人道之積極作為或消極不作為，不論採肢體或語言等方式、次數、頻率，不計時間之長短或持續，對他人施加身體或精神上之凌辱虐待行為，造成被害人身體上或精神上苦痛之程度，即屬凌虐行為。\n三、第一項至第三項均未修正。"},{"bill":"202110126840000","text":"殺人者，處死刑、無期徒刑或十年以上有期徒刑。\n前項之未遂犯罰之。\n預備犯第一項之罪者，處二年以下有期徒刑。\n對於未滿六歲之人，以凌虐方式犯第一項之罪者，處死刑或無期徒刑。","note":"一、凌虐行為係指在肉體上或精神上，對被害人施以持續性難以忍受之非人道待遇，例如：時予毆打、食不使飽、病不使醫、傷不使療；另尚可包含鞭打、以火燙傷等行為。可見凌虐行為之手段，確實較傷害罪之手段更為殘忍與嚴重，亦可能產生加重結果之情形。\n二、有鑑於未滿六歲之幼童因自我保護能力有限，實有透過加重以凌虐方式殺害幼童之刑期，期發揮嚇阻犯罪之效。\n三、爰新增本條第四項之規定，以凌虐方式犯第一項之罪者，處死刑或無期徒刑，以擴大保障兒少之生命與身心健康，伸張兒少司法正義。"},{"bill":"202110133570000","text":"殺人者，處死刑、無期徒刑或十年以上有期徒刑。\n前項之未遂犯罰之。\n預備犯第一項之罪者，處二年以下有期徒刑。\n殺害未滿十二歲之人，以凌虐、長期疏忽、暴力控制、飢餓、限制自由或其他足以嚴重妨害其身心發展之方式，致其死亡者，處死刑、無期徒刑或十二年以上有期徒刑。","note":"一、為因應兒虐致死案件層出不窮，強化對未成年人生命權之保護，本次修法將長期凌虐、疏忽照護等方式致未成年人死亡之行為，明定為《刑法》第二百七十一條加重構成要件，處以死刑、無期徒刑或十二年以上有期徒刑。考量兒虐樣態多元、危害深重，其犯罪惡性不下於既遂殺人，增訂最重刑度以符社會期待，並強化司法回應與制度嚇阻力。\n二、參照《兒童及少年福利與權益保障法》對「兒童」之定義，為未滿十二歲，以補強對高風險年齡層之保護缺口，健全兒童人權保障體系。"}],"changed":false,"final":"殺人者，處死刑、無期徒刑或十年以上有期徒刑。\n前項之未遂犯罰之。\n預備犯第一項之罪者，處二年以下有期徒刑。","finalWhy":null,"review":{"note":"保留，送院會處理","text":""}},{"no":"第二百七十一條之一","current":null,"versions":[{"bill":"202110133730000","text":"凌虐未滿十二歲之人，因而致死者，處死刑或無期徒刑。\n前項之未遂犯罰之。\n預備犯第一項之罪者，處五年以下有期徒刑。","note":"一、本條新增。\n二、本法第十條第七項規定：「稱凌虐者，謂以強暴、脅迫或其他違反人道之方法，對他人施以凌辱虐待行為。」凌虐行為之手段，較傷害罪之手段更為殘忍與嚴重，亦可能產生多重傷害之結果及情形。\n三、有鑑於兒童因自我保護能力有限，且受虐後往往不善求救或表達所遭受之不當對待，而易遭成人以故意虐待方式剝奪其生命。實有透過增訂虐殺兒童罪之刑期，以發揮嚇阻犯罪之效果。\n四、參考本法第二百七十一條殺人罪，爰增訂本條，虐待殺害未滿十二歲兒童處死刑或無期徒刑之規定，以符合113年憲判字第8號判決「殘忍殺害無自我保護能力幼兒為適用死刑之『最嚴重罪行』」之要旨、兒童及少年福利與權益保障法第一百一十二條第一項針對成人故意對兒童犯罪應加重刑罰之規定，並落實「兒童權利公約」對於兒童生命權、生存及發展權之保障。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二百七十二條之一","current":null,"versions":[{"bill":"202110133710000","text":"對於未滿七歲之人，犯第二百七十一條之罪者，加重其刑二分之一。\n對於未滿七歲之人，以凌虐方式犯第二百七十一條第一項之罪者，處死刑或無期徒刑。","note":"一、本條新增。\n二、依據民法第十三條第一項，未滿七歲之未成年人，無行為能力。有鑑於對於未滿七歲之人，犯第二百七十一條之罪者，惡性極為重大，爰新增第一項，加重其刑二分之一。\n三、第二項明定對於未滿七歲之人，以凌虐方式犯第二百七十一條第一項之罪者，處死刑或無期徒刑，以有效嚇阻兒虐事件之發生。"},{"bill":"202110143470000","text":"殺未滿七歲之人者，處死刑、無期徒刑或十五年以上有期徒刑。\n對於未滿七歲之人，以凌虐方式犯前項之罪者，處死刑或無期徒刑。\n前二項之未遂犯罰之。\n預備犯第一項及第二項之罪者，處三年以下有期徒刑。","note":"一、本條新增。\n二、有鑑於未滿七歲之人，為民法第十三條第一項之無行為能力人，欠缺自我保護能力及自救能力。為彰顯殺害未滿七歲之人，惡性極為重大，有必要加重處罰，爰新增第一項，以有效嚴懲並嚇阻兒虐事件發生。\n三、對於未滿七歲之幼兒童，施以凌虐方式殺害所生之危害，明顯造成被害人或其家屬身心創傷，形成難以回復之傷痛，且影響社會治安甚鉅，實有永久隔絕於社會之必要，爰新增第二項，處死刑或無期徒刑，以昭炯戒。\n四、另就未遂犯及預備犯定於第三項及第四項。"}],"changed":true,"final":"對於未滿七歲之人犯第二百七十一條之罪者，加重其刑二分之一。\n對於未滿七歲之人，以凌虐方式犯第二百七十一條第一項之罪者，處死刑或無期徒刑。\n前項之未遂犯罰之。\n預備犯第二項之罪者，處五年以下有期徒刑。","finalWhy":"","review":null},{"no":"第二百七十七條之一","current":null,"versions":[{"bill":"202110133730000","text":"凌虐未滿十二歲之人之身體或健康者，處二年以上八年以下有期徒刑、拘役或一百萬元以下罰金。","note":"一、本條新增。\n二、依據兒童及少年福利與權益保障法第一百十二條第一項，成人故意對兒童犯罪應加重刑罰之規定。\n三、參考本法第二百七十七條普通傷害罪，爰增訂本條，加重故意凌虐未滿十二歲兒童之身體或健康之刑期。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二百七十八條之一","current":null,"versions":[{"bill":"202110133730000","text":"凌虐未滿十二歲之人，使其重傷者，處八年以上十五年以下有期徒刑。\n前項之未遂犯罰之。","note":"一、本條新增。\n二、依據兒童及少年福利與權益保障法第一百十二條第一項，成人故意對兒童犯罪應加重刑罰之規定。\n三、參考本法第二百七十八條重傷害罪，爰增訂本條，加重故意凌虐未滿十二歲兒童致其重傷之刑期。"}],"changed":false,"final":null,"finalWhy":null,"review":null},{"no":"第二百八十六條","current":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。","versions":[{"bill":"202110104810000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。","note":"為促進兒童及少年身心健全發展並保護其權益，本條就致人於死及致重傷均定有加重結果犯之規定，以保護未滿十八歲之人免於因凌虐而致死、致重傷。然縱經修法後定有加重結果之處罰規定，仍未能有效遏止對於未滿十八歲之人施以凌虐致死之犯行，故對於罪無可赦、手段兇殘、毫無反省且無教化可能、復歸社會更生可能性之犯人，似仍有將其判處死刑之必要。為此，爰參酌刑法第一百八十五條之一第二項、第三百二十八條第三項及第三四十七條第二項等規定，修訂本條第三項及第四項，分別增列「死刑」，以儆效尤。"},{"bill":"202110105310000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿六歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一，致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"幼童因年齡尚幼，尚不具備基本之自我保護與反抗能力，對其施以凌虐、致其身心嚴重受創甚至致死者，其行為尤屬惡性重大，泯滅人性，社會難以容忍。為杜絕類此重大侵害幼童生命法益之案件重演，並出於對社會安全與預防再犯之考量，對犯此等行為者，應予以永久隔離，爰修正本條對於未滿六歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一，致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。"},{"bill":"202110105320000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿六歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一，致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"一、凌虐行為係指在肉體上或精神上，對被害人施以持續性難以忍受之非人道待遇，例如：時予毆打、食不使飽、病不使醫、傷不使療；另尚可包含鞭打、以火燙傷等行為。可見凌虐行為之手段，確實較傷害罪之手段更為殘忍與嚴重，亦可能產生加重結果之情形。\n二、有鑑於未滿六歲之幼童因自我保護能力有限，且受虐後往往不善求救或表達所遭受之不當對待，實有透過加重虐待幼童之刑期，以發揮嚇阻犯罪之效。\n三、爰修正本條第五項之規定，對於未滿六歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一，致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑，以擴大保障兒少之生命與身心健康，伸張兒少司法正義。"},{"bill":"202110107240000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處七年以下有期徒刑。\n意圖營利，而犯前項之罪者，處七年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。","note":"一、鑒於對未滿十八歲之兒童及少年，施以凌虐或以他法足以妨害其身心之健全或發育之犯罪行為惡性重大，影響其身心發展甚鉅，恐致生其難以抹滅之傷害。另後續社會及相關單位、民間機構救援保護、安置服務成本極高，妨害社會穩定性及和諧發展，爰修正第一項之罰則，加重犯本項之罪者，自處六月以上五年以下有期徒刑提高至處七年以下有期徒刑。\n二、修正第二項，理由同上，蓋意圖營利違犯第一項之罪者惡性更重、影響社會和諧穩定更深，若未予以嚴懲恐助長非法產業鏈擴大發展，爰修正第二項之罰則，加重犯本項之罪者，自處五年以上有期徒刑提高至處七年以上有期徒刑。"},{"bill":"202110103300000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處十年以上有期徒刑。\n意圖營利，而犯前項之罪者，處二十年以上有期徒刑，得併科一千萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。","note":"一、因應修正條文第二百七十一條增訂第四項加重其刑責之規定，對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，亦有相應加重其刑責規範之必要，爰配套修正第一項至第四項有關加重其刑責之規定。\n二、第五項未修正。"},{"bill":"202110103360000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。因而致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"一、修正第五項。\n二、中華民國刑法第二百八十六條曾於108年5月10日修法，針對虐童加重刑責，虐童致死者最重可處無期徒刑，致重傷者處五年以上十二年以下有期徒刑。因109年至112年，仍有幼童遭受嚴重虐待而亡，顯見刑度輕重仍有所欠缺，113年7月再修正增列第五項，對於未滿七歲之人犯凌虐罪者，加重其刑。\n三、現行刑法第三百二十八條，對於犯強盜罪因而致人於死者，最高可處死刑。未滿七歲之人，並無自我保護及反抗之能力，其地位幾乎等同於強盜罪中之「至使不能抗拒」，因此對幼童凌虐致死者，其行為罪大惡極並泯滅人性，其最高刑度應參考刑法第三百二十八條，提高至死刑或無期徒刑。"},{"bill":"202110120320000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科五百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十五年以上有期徒刑；致重傷者，處十二年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。","note":"一、為促進兒童及少年身心健全發展並保護其權益，本條就致人於死及致重傷均定有加重結果犯之規定，以保護未滿十八歲之人免於因凌虐而致死、致重傷。然縱經修法後定有加重結果之處罰規定，仍未能有效遏止對於未滿十八歲之人施以凌虐致死之犯行，故對於罪無可赦、手段兇殘、毫無反省且無教化可能、復歸社會更生可能性之犯人，似仍有將其判處死刑之必要。\n二、第一項未修正。\n三、第二項修訂併科罰金上限為五百萬。\n四、第三項前段增訂「死刑」及提升有期徒刑為十二年以上。\n五、第四項前段增訂「死刑」及提升有期徒刑為十五年以上。後段修訂刑責為十二年以上。"},{"bill":"202110127900000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一，致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"一、按臺灣高等法院刑事判決111年度上訴字第4345號判決，凌虐作構成要件之規範，依社會通念，凌虐係指凌辱虐待等非人道待遇，不論積極性之行為，如時予毆打，食不使飽；或消極性之行為，如病不使醫、傷不使療等行為均包括在內。可預見產生加重結果之情形。\n二、幼童因年齡尚幼，普遍不具備基本之自我保護與反抗能力，對其施以凌虐、致其身心嚴重受創甚至死亡者，其行為惡性重大，泯滅人性，難為社會所容。\n三、為有效遏止侵害幼童生命法益之重大犯行，並因應社會對此類案件之高度關注與嚴厲譴責，有必要對加害人施以更嚴厲之法律制裁，尤其對於手段兇殘、毫無悔意，且無教化或更生可能者，應予以永久隔離，並得依法判處死刑，以昭公義。"},{"bill":"202110128470000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。因而致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"一、修正第五項。\n二、中華民國刑法第二百八十六條曾於108年5月10日修法，針對虐童加重刑責，虐童致死者最重可處無期徒刑，致重傷者處五年以上十二年以下有期徒刑。因109年至112年，仍有幼童遭受嚴重虐待而亡，顯見刑度輕重仍有所欠缺，113年7月再修正增列第五項，對於未滿七歲之人犯凌虐罪者，加重其刑。\n三、有鑑於未滿七歲之幼童因自我保護能力有限，且受虐後往往不善求救或表達所遭受之不當對待，實有透過加重虐待幼童之刑期，以發揮嚇阻犯罪之效。\n四、爰修正中華民國刑法第二百八十六條第五項，對未滿七歲之人，致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑，以保障兒少之生命，伸張兒少司法正義。"},{"bill":"202110128720000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處三年以上十年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。因而致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"一、我國兒少受虐案件頻傳，依據衛生福利部兒少通報調查處理案件統計，自民國111年至民國113年，通報件數自46,859件增至62,314件，增幅達32.9%；通報個案數，自49，014人增至59,559人，增加21.5%。又衛生福利部兒童及少年保護統計，遭父母、照顧者等家庭成員施虐死亡之人數亦逐年升高，自民國111年計14人增至民國113年計30人，劇增114%。顯見我國兒虐問題之嚴重，對兒少權益與生命戕害之深，而現行法規對於相關犯罪嚇阻效果不彰，亟需修正相關罰責，以保障兒少身心健康、人格發展與生命安全。\n二、修正第一項。依據上開說明，兒少受虐問題顯為嚴重，且現行刑法對於兒少凌虐犯罪嚇阻效果不彰。為保障兒少身心健康發展，防治兒少凌虐犯罪，爰加重刑責至三年以上十年以下有期徒刑。\n三、修正第五項。未滿七歲之人，自我保護及反抗之能力薄弱，其不利地位似於刑法第三百二十八條明文「以強暴、脅迫、藥劑、催眠術或他法，至使不能抗拒」之地位。因此對幼童凌虐致死者，其行為實惡性重大，為使罪刑相當，其最高刑度應參考刑法第三百二十八條，加重至死刑或無期徒刑。"},{"bill":"202110129540000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。因而致人於死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。","note":"一、修正第五項。\n二、所謂「凌虐」行為，係指對被害人於身體或精神層面施以長期、難以忍受之非人道待遇，其程度遠較一般傷害行為為重，手段亦更為殘酷。若針對年幼兒童施行凌虐，進而導致死亡，尤屬對兒童基本生存權之重大侵害，社會自難容忍。\n三、根據衛生福利部保護服務司統計，自2017年至2023年，我國因遭受嚴重虐待而致死之兒童與少年計達56人。另觀察2019年至2023年整體兒少受虐案件，通報人數由11,113人升至12,646人，增幅達13.8%；其中未滿六歲受虐人數從2,244人升至2,868人，增幅高達27.8%。同期間施虐者人數也由10,192人增加至12,129人，成長幅度達19%。上述數據顯示，兒虐事件不僅持續發生，且呈現加劇趨勢，亟需透過強化法律責任，以提升防制效能。\n四、為強化對低齡幼童之保護，爰修正《中華民國刑法》第二百八十六條第五項，明定對未滿七歲之兒童施虐致死者，處死刑或無期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。藉此加重刑責、發揮嚇阻作用，保障兒童生命權益，實現兒少司法正義。"},{"bill":"202110129060000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處一年以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿六歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。\n對於七歲以上未滿十二歲之人，犯前四項之罪者，得依各該項之規定加重其刑至二分之一。","note":"一、修正第一項，將最低刑期從六月提高至一年。\n二、修正第三項與第四項，虐待致兒少於死者，可處死刑。\n三、修正第五項，下修年齡至六歲。\n四、增列第六項，對七歲以上至十二歲之人施虐者，得加重其刑。"},{"bill":"202110133710000","text":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n對於未滿七歲之人，犯前二項之罪者，依各該項之規定加重其刑二分之一。\n對於七歲以上未滿十八歲之人，犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n對於七歲以上未滿十八歲之人，犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處無期徒刑或十二年以上有期徒刑。","note":"一、現行條文第五項移列第三項，並酌修文字。另考量加重其刑至二分之一，係指「至多」二分之一，為有效嚇阻虐兒之行為，明定對於未滿七歲之人，犯前二項之罪者，依各該項之規定加重其刑二分之一。\n二、配合新增第六項及第七項，修正第四項及第五項，將適用範圍限於七歲以上未滿十八歲之人。\n三、考量對於未滿七歲之人，犯第一項及第二項之罪，因而致人於死或致重傷，惡性極為重大，有必要加重處罰，爰新增第六項及第七項之規定。"},{"bill":"202110133570000","text":"對於未滿十八歲之人，施以凌虐、長期疏忽、暴力控制、飢餓、限制自由或其他以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿十二歲之人，犯前四項之罪者，依各該項之規定加重其刑至二分之一。","note":"一、明確增列「長期疏忽、暴力控制、飢餓、限制自由」等常見虐待形式，使法律用語更具體清晰，反映實務上虐童行為的多樣與隱蔽特性，提升法官適用及偵辦指引之明確性。\n二、為統一我國兒童保護年齡標準，參照《兒童及少年福利與權益保障法》對「兒童」之定義，將原僅針對未滿七歲者加重其刑之規定，上修為未滿十二歲，以補強對高風險年齡層之保護缺口，健全兒童人權保障體系。"}],"changed":true,"final":"對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n對於未滿七歲之人，犯前二項之罪者，依各該項之規定加重其刑二分之一。\n對於七歲以上未滿十八歲之人，犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n對於七歲以上未滿十八歲之人，犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n對於未滿七歲之人，犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處無期徒刑或十二年以上有期徒刑。","finalWhy":"一、有鑑於未滿七歲之嬰幼童，為民法第十三條第一項之無行為能力人，欠缺自我保護能力及自救能力，更不會替自己爭取權利，可謂是弱勢中的弱勢，正因嬰幼童沒有足夠的能力為自己主張權利，國家若不主動維護嬰幼童的基本權，憲法中的基本權保障對嬰幼童而言，將不具意義。又虐童行為具有上對下、強對弱的性質，尤其未滿七歲之嬰幼童毫無反抗能力，甚至屈就於施虐者的優勢權位下，難以自保而淪為受虐客體，當遭受虐待，不僅身體健康權遭受侵害，以施虐方式致其身心遭遇痛苦，無疑是侵害憲法上之人性尊嚴及自由權，因此導致死亡結果，更是對人性尊嚴基本權的極端侵害。本條雖曾於一百零八年五月十日修法，針對虐童加重刑責，虐童致死者最重可處無期徒刑，致重傷者處五年以上十二年以下有期徒刑。惟自一百十年一月一日起至一百十四年六月十五日止，法務部所屬各地方檢察署辦理虐童案件之被害人年齡分布情形，超過百分之八十五被害人為七歲以下之嬰幼童，且因一百零八年修法至今，仍有多起嬰幼童遭受嚴重虐待而亡，顯見刑度輕重仍有所欠缺。\n二、原條文第五項移列第三項，並酌修文字。另考量加重其刑至二分之一，係指「至多」二分之一，為有效嚇阻虐兒之行為，明定對於未滿七歲之人，犯前二項之罪者，依各該項之規定加重其刑二分之一。\n三、配合新增第六項及第七項，修正第四項及第五項，將適用範圍限於七歲以上未滿十八歲之人。\n四、參諸現行刑法第三百二十八條及第三百四十七條，對於犯強盜罪、擄人勒贖罪因而致人於死者，最高亦可處死刑。較之未滿七歲之嬰幼童，並無自我保護及反抗之能力，其地位幾乎等同於強盜罪中之「至使不能抗拒」，因此對嬰幼童凌虐致死者，其行為罪大惡極並泯滅人性，其最高刑度應參考刑法第三百二十八條，提高至死刑，爰新增第六項及第七項之規定。","review":{"note":"保留，送院會處理","text":""}}],"stages":[{"date":"2025-04-18","stage":"一讀", <script>

const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const c of kids) if (c != null) e.append(c);

};
const link = (href, text, cls) => el('a', {href, target: '_blank', rel: 'noopener', text, class: cls || ''});
const KIND = [['一讀', '提案一讀', '--c-prop'], ['委員會', '委員會審查', '--c-comm'], ['公聽會', '公聽會', '--c-hear'],
  ['黨團協商', '黨團協商', '--c-nego'], ['二讀', '院會二、三讀', '--c-floor'], ['三讀', '院會二、三讀', '--c-floor']];
const kindOf = s => (KIND.find(k => s.startsWith(k[0])) || KIND[4]);   // 逕付二讀、復議、補充紀錄等都是院會的事，算在院會那一類

const VERB = ENACT ? '訂定' : '修正';

  $('benchlegend').hidden = true;
}

[['首個提案', D.props.length ? D.props[0].date : '—'], ['三讀通過', D.date], ['提案版本', D.props.length + ' 個'],
 ['委員會審查', meetings.filter(s => s.stage.startsWith('委員會')).length + ' 次'],

  .forEach(([k, v]) => $('facts').append(el('div', null, el('dt', {text: k}), el('dd', {text: v}))));

/* ---------- 逐條對照 ---------- */
function lcsLen(a, b) {   // 兩段文字的最長共同子序列長度
  if (a === b) return a.length;
  const m = b.length; let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = a[i] === b[j] ? prev[j + 1] + 1 : Math.max(prev[j], cur[j + 1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function charSegs(a, b) {   // 同一段內逐字比對，回傳 [類型, 文字]：0 相同、1 新增、-1 刪除
  const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i * w + j] = a[i] === b[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
  const raw = []; const push = (k, c) => { const l = raw[raw.length - 1]; if (l && l[0] === k) l[1] += c; else raw.push([k, c]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (j >= m || (i < n && t[(i + 1) * w + j] >= t[i * w + j + 1])) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  // 夾在兩處修改之間的零碎相同字（不到 3 個字）併進修改，免得整句改寫被切成碎片
  const out = []; let del = '', ins = '';
  const flush = () => { if (del) out.push([-1, del]); if (ins) out.push([1, ins]); del = ins = ''; };
  raw.forEach((s, k) => {
    if (s[0] === -1) del += s[1];
    else if (s[0] === 1) ins += s[1];
    else if (s[1].length < 3 && k > 0 && k < raw.length - 1) { del += s[1]; ins += s[1]; }
    else { flush(); out.push(s); }
  });
  flush();
  return out;
}
function diffLines(base, text) {   // 先以段落配對，夠像的段落才逐字比對；回傳每段的片段陣列
  const A = base.split('\n'), B = text.split('\n'), n = A.length, m = B.length;
  const cost = base.length * text.length;

function finder(turns) {   // 在這場逐字稿裡找字

  const r = tag.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;   // 預設貼在標籤下方，放不下就翻到上方
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12) top = r.top - 6 - h >= 12 ? r.top - 6 - h : Math.max(12, innerHeight - h - 12);
  tipbox.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + 'px';
  tipbox.style.top = top + 'px';
}
function stageTag(stage, color) {   // 階段名稱裡有一讀、二讀、三讀的做成可點的標籤
  const keys = Object.keys(READING).filter(k => (k === '二讀' ? stage.replace(/逕付二讀/g, '') : stage).includes(k));
  const style = '--k:var(' + color + ')';
  if (!keys.length) return el('span', {class: 'tag', style, text: stage});
  const tag = el('button', {type: 'button', class: 'tag', style, text: stage});
  tag.addEventListener('mouseenter', () => { if (tipTag !== tag) { clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(tag, keys, false), 1000); } });
  tag.addEventListener('mouseleave', () => { clearTimeout(tipTimer); if (tipTag === tag && !tipPinned) hideTip(); });
  tag.addEventListener('click', e => { e.stopPropagation(); if (tipTag === tag && tipPinned) hideTip(); else showTip(tag, keys, true); });
  return tag;
}
document.addEventListener('click', e => { if (!tipbox.contains(e.target)) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', e => { if (e.target !== tipbox) hideTip(); }, true);
addEventListener('resize', hideTip);

const OPEN = {};
D.stages.forEach(s => {
  const k = kindOf(s.stage);
  const body = el('div', {class: 'body'});
  const what = el('div', {class: 'what'}, stageTag(s.stage, k[2]));
  if (s.stage === '一讀') {
    const p = propById[s.bill];
    what.append(p ? shortWho(p) + ' 提案，' + VERB + artList(p) : '提案');
    body.append(what);
    if (p) body.append(propDetail(p));
  } else {
    what.append(s.title || '');
    body.append(what);
    if (s.note) body.append(el('div', {class: 'note', text: s.note}));
    if (s.mixed && s.mixed.length) body.append(el('div', {class: 'ref', text: '這場會議同時審查' + s.mixed.join('、') + '，逐字稿包含那些法案的討論，沒有切開。'}));
    if (s.mixedOther && s.mixedOther.length) body.append(el('div', {class: 'ref', text: '這場會議同時處理「' + s.mixedOther.join('」「') + '」，詢答是合併進行的，逐字稿裡有那部分的問答。'}));
    if (s.props.length) {
      const sub = el('div', {class: 'sub'}, '這場會議討論的提案：');
      const panel = el('div', {class: 'ppanel', hidden: ''});
      let shown = null;
      s.props.forEach(id => {
        const p = propById[id];
        const btn = el('button', {type: 'button', class: 'chip', 'aria-expanded': 'false', text: shortWho(p) + '版'});
        btn.addEventListener('click', () => {
          const closing = shown === id;
          [...sub.querySelectorAll('button')].forEach(x => x.setAttribute('aria-expanded', 'false'));
          panel.textContent = ''; panel.hidden = closing; shown = closing ? null : id;
          if (!closing) { btn.setAttribute('aria-expanded', 'true'); panel.append(el('h3', {text: shortWho(p) + ' 提案，' + VERB + artList(p)}), propDetail(p)); }
        });
        sub.append(btn);
      });
      body.append(sub, panel);
    }
    const acts = el('div', {class: 'acts'});
    let box = null, opener = null;
    if (s.tr) {
      const btn = el('button', {type: 'button', class: 'open', 'aria-expanded': 'false', text: '會議逐字稿（' + (s.nmem ? s.nmem + ' 位委員討論' : s.nspeak + ' 位發言') + '）'});
      box = el('div', {class: 'tr', hidden: ''});
      const toggle = async () => {
        const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open);
        if (!open || box.dataset.loaded) return;
        box.textContent = '載入逐字稿中';
        try { const r = await fetch(s.tr); if (!r.ok) throw new Error(r.status); renderTranscript(box, await r.json(), s); box.dataset.loaded = '1'; }
        catch (e) { box.textContent = '逐字稿載入失敗，請重新整理頁面再試一次。'; }
      };
      btn.addEventListener('click', toggle);
      acts.append(btn);
      OPEN[s.tr.replace(/\W/g, '-')] = async () => { if (box.hidden) await toggle(); return box; };
    } else {   // 沒有文字版時，影片和議事網會議頁是唯一的資料，直接放在外面
      acts.append(el('span', {class: 'ref', text: '文字版逐字稿尚未取得'}));
      s.full.forEach((u, i) => acts.append(link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) acts.append(link(s.ppg, '議事網會議頁'));
    }
    body.append(acts);
    if (box) body.append(box);
    const ref = el('div', {class: 'ref'}, '公報 ' + s.gazref);
    s.pdf.forEach(p => ref.append('　', link(p.u, '逐字稿 PDF（第 ' + p.p1 + '–' + p.p2 + ' 頁，檔案大）')));
    if (s.tr) {
      s.full.forEach((u, i) => ref.append('　', link(u, '完整影片' + (s.full.length > 1 ? ' ' + (i + 1) : ''))));
      if (s.ppg) ref.append('　', link(s.ppg, '議事網會議頁'));
    }
    body.append(fold('資料出處', ref));
  }
  $('ledger').append(el('li', {class: 'row'}, el('div', {class: 'when', text: s.date}), body));
});

async function landFromHash() {
  const m = /^#(.+?)-([0-9]+)(?:-([0-9a-f]{4}))?$/.exec(location.hash);
  if (!m || !OPEN[m[1]]) return;
  const box = await OPEN[m[1]]();
  let node = document.getElementById(m[1] + '-' + m[2]), moved = false;
  if (m[3] && !(node && node.dataset.fp === m[3])) {   // 編號對不上指紋：找指紋相同、離原編號最近的那段
    const same = [...box.querySelectorAll('.turn')].filter(t => t.dataset.fp === m[3]);
    const n = t => +t.id.slice(m[1].length + 1);
    if (same.length) node = same.sort((a, b) => Math.abs(n(a) - m[2]) - Math.abs(n(b) - m[2]))[0]; else moved = true;
  }
  if (!node) return;
  box.scrollIntoView({block: 'start'});
  showTurn(node.parentElement, node);
  document.querySelectorAll('.turn.landed').forEach(x => x.classList.remove('landed'));
  document.querySelectorAll('.landtip').forEach(x => x.remove());
  node.classList.add('landed');
  const tip = el('div', {class: 'ref landtip', text: (moved ? '這場逐字稿在連結建立之後重新整理過，標色的位置可能和原本差幾段。' : '你是從連結進來的，下面標色的是連結指到的那段發言。') + '這裡是整場會議的逐字稿，可以往上讀前面發生了什麼，或往下讀後續。'});
  box.prepend(tip);
}
if (document.readyState === 'complete') landFromHash(); else addEventListener('load', () => setTimeout(landFromHash, 50));
addEventListener('hashchange', landFromHash);

/* ---------- 表決 ---------- */

  if (D.votes.length) {

      const names = el('details', {class: 'names'}, el('summary', {text: '名單'}),
        el('p', {text: '贊成：' + v.yesNames.join('、')}), el('p', {text: '反對：' + v.noNames.join('、')}), v.abstainNames.length ? el('p', {text: '棄權：' + v.abstainNames.join('、')}) : null);
      tb.append(el('tr', null, el('td', null, v.topic, names), el('td', {class: 'num', text: v.yes}), el('td', {class: 'num', text: v.no}), el('td', {class: 'num', text: v.abstain})));
    });
    box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '表決議題'}), el('th', {class: 'num', text: '贊成'}), el('th', {class: 'num', text: '反對'}), el('th', {class: 'num', text: '棄權'}))), tb)));
  }
  const M = D.manualVotes;
  if (M) {
    $('votetext').textContent = M.text || '';
    const tb = el('tbody');
    (M.rows || []).forEach(v => {
      const pct = Math.round(v.yes / v.present * 1000) / 10;

        el('td', null, el('span', {class: 'bar'}, el('i', {style: 'width:' + pct + '%'})), el('small', {text: pct + '%'}))));
    });
    if ((M.rows || []).length) box.append(el('div', {class: 'tablewrap'}, el('table', {class: 'vt'}, el('thead', null, el('tr', null, el('th', {text: '條文'}), el('th', {class: 'num', text: '在場'}), el('th', {class: 'num', text: '贊成'}), el('th', {text: '贊成比例'}))), tb)));
    if (M.caveat) box.append(el('p', {class: 'note', text: M.caveat}));
  }
  if (!D.votes.length && !M) $('votetext').textContent = '這次' + (D.action || '修正') + '查不到記名表決紀錄。可能是無異議通過，或以舉手等不留名單的方式表決，需要讀院會逐字稿確認。';
})();

const GAPS = (D.reviewed === false ? ['這一頁還沒有人工整理過：沒有摘要，也沒有各場會議的重點結論，其餘內容由程式自動產生。'] : []).concat(D.gaps, D.autoGaps || []);
if (GAPS.length) { $('sec-gaps').hidden = false; GAPS.forEach(g => $('gaps').append(el('li', {text: g}))); }
